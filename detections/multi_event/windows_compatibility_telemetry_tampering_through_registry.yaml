name: Windows Compatibility Telemetry Tampering Through Registry
id: windows-compattelrunner-registry-tampering-001
version: 2
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modifications to the TelemetryController registry key under 
  AppCompatFlags, specifically the Command value. CompatTelRunner.exe runs as 
  SYSTEM and executes whatever is specified in the Command value, making this 
  a powerful persistence and privilege escalation mechanism. Covers both 
  process creation (EventID 1) and registry modification (EventID 13).

data_source:
  - Sysmon EventID 1
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "1"
                    - wildcard:
                        data_win_eventdata_commandLine: "*TelemetryController*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*Command*"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "13"
                    - wildcard:
                        data_win_eventdata_targetObject: "*TelemetryController*"
                    - wildcard:
                        data_win_eventdata_targetObject: "*Command*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection uses two data sources. EventID 1 captures reg.exe commands 
  targeting the TelemetryController path (currently working). EventID 13 
  captures the actual registry value modification (requires adding 
  TelemetryController to Sysmon RegistryEvent include rules). Add to Sysmon 
  config: <TargetObject condition="contains">AppCompatFlags\TelemetryController</TargetObject>

known_false_positives: >
  None identified. Legitimate TelemetryController modifications are performed by 
  Windows Update and should not target custom Command values pointing to 
  user-writable paths.

references:
  - https://attack.mitre.org/techniques/T1546/
  - https://scythe.io/threat-thursday/windows-telemetry-persistence
  - https://www.trustedsec.com/blog/abusing-windows-telemetry-for-persistence

response:
  message: >
    TelemetryController registry tampering on $agent_name$. 
    EventID: $data_win_system_eventID$. 
    Command: $data_win_eventdata_commandLine$. 
    Registry: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    User: $data_win_eventdata_user$. 
    Possible SYSTEM-level persistence. MITRE ATT&CK: T1546
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Windows Persistence Techniques
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1546
    - T1053.005
  custom_tags:
    - compattelrunner
    - telemetry_abuse
    - persistence
    - privilege_escalation
    - registry_modification
    - dual_eventid
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*TelemetryController.*/ AND data_win_eventdata_commandLine:/.*Command.*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*TelemetryController.*/ AND data_win_eventdata_targetObject:/.*Command.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f548a603-c9f2-4c89-b511-b089f7e94549
    name: Potential Persistence Via Microsoft Compatibility Appraiser
    reason: 'Direct follow-on: after planting the TelemetryController Command value, the attacker forces the ''Microsoft Compatibility Appraiser'' task via schtasks /run so CompatTelRunner executes the payload as SYSTEM immediately'
  - id: windows-compattelrunner-suspicious-child-001
    name: Windows Compatibility Telemetry Suspicious Child Process
    reason: 'Confirms the planted Command actually fired: CompatTelRunner.exe spawning an unexpected child (cmd/powershell/user-writable binary) is the SYSTEM execution of the tampered value'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Same reg.exe tradecraft: operators who write the TelemetryController value via reg add typically layer a second, more common autostart via Run keys on the same host'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: 'Co-occurring persistence: redundant autorun registry writes alongside the telemetry hijack indicate deliberate multi-mechanism persistence'
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: 'Common companion persistence: attacker adds a scheduled task pointing at the same user-writable payload path referenced in the telemetry Command value'
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Same goal as the telemetry hijack (SYSTEM-level execution); a SYSTEM scheduled task on the host shows the actor is stacking privileged persistence
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reg.exe or PowerShell writing the TelemetryController Command value
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss].*/ AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg]\.?[Ee]?[Xx]?[Ee]? .*[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Forced run of the Compatibility Appraiser task (trigger of the planted command)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: CompatTelRunner.exe spawning shells or unexpected children
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Oo][Mm][Pp][Aa][Tt][Tt][Ee][Ll][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*\\([Cc][Oo][Mm][Pp][Aa][Tt][Tt][Ee][Ll][Rr][Uu][Nn][Nn][Ee][Rr]|[Cc][Oo][Nn][Hh][Oo][Ss][Tt]|[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]|[Aa][Pp][Pp][Rr][Aa][Ii][Ss][Ee][Rr]|[Mm][Ss][Pp][Ee][Nn][Gg][Ss][Rr][Vv]|[Ww][Aa][Cc][Kk]|[Dd][Ii][Ss][Mm])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Payload staged in user-writable paths shortly before the registry change
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Tt][Ee][Mm][Pp])|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|\\[Pp][Uu][Bb][Ll][Ii][Cc]).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Cc][Mm][Dd]|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Other autostart registry writes on the host (Run keys, services, IFEO, Winlogon)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\([Ss][Hh][Ee][Ll][Ll]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]).*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
