name: Windows WaveBrowser PUP Detection
id: Windows_WaveBrowser_PUP_Detection
version: 1
schema_version: "1.0"
date: "2026-03-17"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution or network activity associated with WaveBrowser, a potentially
  unwanted program (PUP) known for aggressive browser hijacking, data collection,
  and adware behavior. Detection covers both process creation (EventID 1) and
  network connections (EventID 3) by matching process image name, OriginalFileName,
  or Product metadata.
  FIELD-VALIDATED — EventID 1 and EventID 3 field mappings confirmed across
  multiple sessions. wavebrowser.exe added to Sysmon network include rules.
  MITRE ATT&CK: T1176 (Browser Extensions), T1518 (Software Discovery).

data_source:
  - Sysmon EventID 1 (ProcessCreate)
  - Sysmon EventID 3 (NetworkConnect)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "1"
              - term:
                  data_win_system_eventID: "3"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\wavebrowser.exe"
              - term:
                  data_win_eventdata_originalFileName: "wavebrowser.exe"
              - term:
                  data_win_eventdata_product: "WaveBrowser"
              - wildcard:
                  data_win_eventdata_initiatingProcessImageFileName: "*\\wavebrowser.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_product
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-17 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-17 23:59:59.999"

how_to_implement: >
  Requires Wazuh agents with Sysmon installed and configured to log EventID 1
  (ProcessCreate) and EventID 3 (NetworkConnect). EventID 3 requires wavebrowser.exe
  to be included in the Sysmon network monitoring include rules. Both EventID 1
  and EventID 3 field mappings confirmed working in this environment across
  multiple detection engineering sessions.

known_false_positives: >
  No known false positives. WaveBrowser is consistently classified as a PUP
  and its presence on enterprise endpoints should always be investigated.

references:
  - https://attack.mitre.org/techniques/T1176/
  - https://www.malwarebytes.com/blog/detections/pup-optional-wavebrowser

response:
  message: >
    WaveBrowser PUP detected on $agent_name$ by $data_win_eventdata_user$.
    Process: $data_win_eventdata_image$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1176
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_destinationIp
      type: ip_address

tags:
  analytic_story:
    - Potentially Unwanted Programs
    - Browser Hijacking
  asset_type: Endpoint
  mitre_attack_id:
    - T1176
    - T1518
  custom_tags:
    - wavebrowser
    - pup
    - adware
    - browser_hijacking
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"1" OR data_win_system_eventID:"3") AND (data_win_eventdata_image:/.*\\wavebrowser\.exe/ OR data_win_eventdata_originalFileName:"wavebrowser.exe" OR data_win_eventdata_product:"WaveBrowser")

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
      name: "Headless Browser Usage"
      reason: "same analytic story: Browser Hijacking"
    - id: windows-chrome-auto-update-disabled-registry-001
      name: "Windows Chrome Auto-Update Disabled via Registry"
      reason: "same analytic story: Browser Hijacking"
    - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
      name: "7Zip Compressing Dump Files"
      reason: "next kill-chain tactic: Collection"
    - id: 0a1255c5-d732-4b62-ac02-b5152d34fb83
      name: "ADExplorer Writing Complete AD Snapshot Into .dat File"
      reason: "next kill-chain tactic: Discovery"
    - id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
      name: "ADFS Database Named Pipe Connection By Uncommon Tool"
      reason: "next kill-chain tactic: Collection"
    - id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
      name: "ADSI-Cache File Creation By Uncommon Tool"
      reason: "next kill-chain tactic: Command and Control"
    - id: 33a2d1dd-f3b0-40bd-8baf-7974468927cc
      name: "APT PRIVATELOG Image Load Pattern"
      reason: "next kill-chain tactic: Privilege Escalation"
    - id: 03e2746e-2b31-42f1-ab7a-eb39365b2422
      name: "APT31 Judgement Panda Activity"
      reason: "next kill-chain tactic: Credential Access"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Autostart persistence written on this host (Run keys, services, IFEO)"
      query: '(data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ll][Oo][Aa][Dd].*/)'
      pivot_on: [host]
      window: 2h
    - name: "Scheduled-task / service / account creation on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|\\[Ss][Cc]\.[Ee][Xx][Ee]|\\[Aa][Tt]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/)) OR (data_win_system_eventID:"4698" OR data_win_system_eventID:"7045")'
      pivot_on: [host]
      window: 4h
    - name: "Host / domain reconnaissance commands on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|\\[Aa][Rr][Pp]\.[Ee][Xx][Ee]|\\[Rr][Oo][Uu][Tt][Ee]\.[Ee][Xx][Ee]|\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|\\[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee]|\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|\\[Nn][Bb][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|\\[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
