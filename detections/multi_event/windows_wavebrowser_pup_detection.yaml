name: Windows WaveBrowser PUP Detection
id: Windows_WaveBrowser_PUP_Detection
version: 1
schema_version: "1.0"
date: "2026-03-17"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution or network activity associated with WaveBrowser, a potentially
  unwanted program (PUP) known for aggressive browser hijacking, data collection,
  and adware behavior. Detection covers both process creation (EventID 1) and
  network connections (EventID 3) by matching process image name, OriginalFileName,
  or Product metadata.
  FIELD-VALIDATED — EventID 1 and EventID 3 field mappings confirmed across
  multiple sessions. wavebrowser.exe added to Sysmon network include rules.
  MITRE ATT&CK: T1176 (Browser Extensions), T1518 (Software Discovery).

data_source:
  - Sysmon EventID 1 (ProcessCreate)
  - Sysmon EventID 3 (NetworkConnect)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "1"
              - term:
                  data_win_system_eventID: "3"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\wavebrowser.exe"
              - term:
                  data_win_eventdata_originalFileName: "wavebrowser.exe"
              - term:
                  data_win_eventdata_product: "WaveBrowser"
              - wildcard:
                  data_win_eventdata_initiatingProcessImageFileName: "*\\wavebrowser.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_product
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-17 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-17 23:59:59.999"

how_to_implement: >
  Requires Wazuh agents with Sysmon installed and configured to log EventID 1
  (ProcessCreate) and EventID 3 (NetworkConnect). EventID 3 requires wavebrowser.exe
  to be included in the Sysmon network monitoring include rules. Both EventID 1
  and EventID 3 field mappings confirmed working in this environment across
  multiple detection engineering sessions.

known_false_positives: >
  No known false positives. WaveBrowser is consistently classified as a PUP
  and its presence on enterprise endpoints should always be investigated.

references:
  - https://attack.mitre.org/techniques/T1176/
  - https://www.malwarebytes.com/blog/detections/pup-optional-wavebrowser

response:
  message: >
    WaveBrowser PUP detected on $agent_name$ by $data_win_eventdata_user$.
    Process: $data_win_eventdata_image$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1176
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_destinationIp
      type: ip_address

tags:
  analytic_story:
    - Potentially Unwanted Programs
    - Browser Hijacking
  asset_type: Endpoint
  mitre_attack_id:
    - T1176
    - T1518
  custom_tags:
    - wavebrowser
    - pup
    - adware
    - browser_hijacking
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"1" OR data_win_system_eventID:"3") AND (data_win_eventdata_image:/.*\\wavebrowser\.exe/ OR data_win_eventdata_originalFileName:"wavebrowser.exe" OR data_win_eventdata_product:"WaveBrowser")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0a74c5a9-1b71-4475-9af2-7829d320d5c2
    name: ChromeLoader Malware Execution
    reason: ChromeLoader is the browser-hijacker family sharing WaveBrowser's PUP/hijack behaviour; a hit upgrades the PUP to real malware
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: WaveBrowser is Chromium-based; forced or sideloaded extensions are the hijack mechanism behind the PUP
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: PUPs are typically delivered as web-fetched bundled installers that precede WaveBrowser's first execution
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: WaveBrowser and its updaters persist via Run keys written by a freshly downloaded installer
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Bundled installers add Run-key autostart entries to relaunch the PUP browser or its updater
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: WaveBrowser installs scheduled tasks from user-profile folders for updater persistence
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: The PUP's data-collection behaviour may be followed by access to other browsers' credential and cookie stores
  - id: windows-chrome-auto-update-disabled-registry-001
    name: Windows Chrome Auto-Update Disabled via Registry
    reason: Hijackers pin the victim browser by disabling Chrome updates alongside installing the replacement browser
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task or Run-key persistence referencing WaveBrowser or Wavesor
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*([Ww][Aa][Vv][Ee][Bb][Rr][Oo][Ww][Ss][Ee][Rr]|[Ww][Aa][Vv][Ee][Ss][Oo][Rr]).*/) OR (data_win_system_eventID:("12" OR "13") AND data_win_eventdata_targetObject:/.*([Rr][Uu][Nn]|[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee]).*([Ww][Aa][Vv][Ee][Bb][Rr][Oo][Ww][Ss][Ee][Rr]|[Ww][Aa][Vv][Ee][Ss][Oo][Rr]).*/)
    pivot_on:
    - host
    window: 6h
  - name: WaveBrowser or Wavesor files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ww][Aa][Vv][Ee][Bb][Rr][Oo][Ww][Ss][Ee][Rr]|[Ww][Aa][Vv][Ee][Ss][Oo][Rr]).*/
    pivot_on:
    - host
    window: 24h
  - name: DNS lookups for Wavesor and WaveBrowser domains
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Ww][Aa][Vv][Ee][Bb][Rr][Oo][Ww][Ss][Ee][Rr]|[Ww][Aa][Vv][Ee][Ss][Oo][Rr]).*/
    pivot_on:
    - host
    window: 6h
  - name: Installer or downloader processes launching or preceding WaveBrowser
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww][Aa][Vv][Ee][Bb][Rr][Oo][Ww][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ww][Aa][Vv][Ee][Bb][Rr][Oo][Ww][Ss][Ee][Rr].*([Ss][Ee][Tt][Uu][Pp]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|[Ss][Ii][Ll][Ee][Nn][Tt]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Browser launched with forced extension, homepage or search-hijack arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*load-extension* OR data_win_eventdata_commandLine:*disable-extensions-except* OR data_win_eventdata_commandLine:*--homepage*)
    pivot_on:
    - host
    window: 2h
