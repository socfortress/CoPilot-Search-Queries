name: PUA - Process Hacker Driver Load
id: 67add051-9ee7-4ad3-93ba-42935615ae8d
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 67add051-9ee7-4ad3-93ba-42935615ae8d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects driver load of the Process Hacker tool. MITRE ATT&CK: T1543.

data_source:
  - Sysmon EventID 6 - Driver Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "6"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\kprocesshacker.sys"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=821D74031D3F625BCBD0DF08B70F1E77*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=F86759BB4DE4320918615DC06E998A39*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=0A64EEB85419257D0CE32BD5D55C3A18*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=6E7B34DFC017700B1517B230DF6FF0D0*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_hashes
    - data_win_eventdata_signature

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 6 (driver loaded) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\kprocesshacker.sys'; data_win_eventdata_hashes matches
  '*IMPHASH=821D74031D3F625BCBD0DF08B70F1E77*'; data_win_eventdata_hashes
  matches '*IMPHASH=F86759BB4DE4320918615DC06E998A39*', among other conditions.

known_false_positives: >
  Legitimate use of process hacker or system informer by developers or system
  administrators. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://processhacker.sourceforge.io/
  - https://attack.mitre.org/techniques/T1543/

response:
  message: >
    PUA - Process Hacker Driver Load detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK: T1543
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543
  custom_tags:
    - hacker
    - driver
    - driver_load
    - sysmon
    - persistence
    - privilege_escalation
    - cve_2021_21551
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*\\[Kk][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Hh][Aa][Cc][Kk][Ee][Rr]\.[Ss][Yy][Ss]/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=821[Dd]74031[Dd]3[Ff]625[Bb][Cc][Bb][Dd]0[Dd][Ff]08[Bb]70[Ff]1[Ee]77.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ff]86759[Bb][Bb]4[Dd][Ee]4320918615[Dd][Cc]06[Ee]998[Aa]39.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=0[Aa]64[Ee][Ee][Bb]85419257[Dd]0[Cc][Ee]32[Bb][Dd]5[Dd]55[Cc]3[Aa]18.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=6[Ee]7[Bb]34[Dd][Ff][Cc]017700[Bb]1517[Bb]230[Dd][Ff]6[Ff][Ff]0[Dd]0.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 811e0002-b13b-4a15-9d00-a613fce66e42
    name: PUA - Process Hacker Execution
    reason: The user-mode ProcessHacker.exe is what drops and registers kprocesshacker.sys, so its execution on this host is the direct cause of this driver load and is what distinguishes a benign admin running the full tool from an attacker sideloading only the driver.
  - id: c4ff1eac-84ad-44dd-a6fb-d56a92fc43a9
    name: ProcessHacker Privilege Elevation
    reason: Fires on the 7045 install of the ProcessHacker service running as LocalSystem - the kernel-mode service that loads this very driver, i.e. the service-creation half of the same action seen here as an EID 6 load.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: A kernel driver cannot load (EID 6) without a kernel-type service first being registered; an sc.exe create type=kernel on this host shortly before is the generic mechanism by which kprocesshacker.sys was staged to load.
  - id: 10cb6535-b31d-4512-9962-513dcbc42cc1
    name: PUA - System Informer Driver Load
    reason: System Informer is the renamed successor of Process Hacker and its driver is the direct lineage sibling of kprocesshacker.sys, abused interchangeably, so both driver loads frequently appear in a single BYOVD defense-evasion incident.
  - id: 5722dff1-4bdd-4949-86ab-fbaf707e767a
    name: PUA - System Informer Execution
    reason: Execution of the successor tool whose kernel driver shares this one's lineage; seeing it on the same host confirms the Process Hacker / System Informer family is active and the driver load is not an isolated artifact.
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: KDU weaponizes vulnerable provider drivers - the Process Hacker driver among its built-in set - to bypass driver-signature enforcement and load unsigned drivers, so its presence reframes this load as deliberate BYOVD kernel abuse rather than tool use.
  - id: d526c60a-e236-4011-b165-831ffa52ab70
    name: Windows Vulnerable Driver Blocklist Disabled
    reason: Turning off Microsoft's vulnerable-driver blocklist is the enabling precursor that lets a BYOVD-class driver load succeed on a hardened host, and the detection notes it is done specifically to blind EDR before loading such a driver.
  - id: f63508a0-c809-4435-b3be-ed819394d612
    name: Potential Privileged System Service Operation - SeLoadDriverPrivilege
    reason: SeLoadDriverPrivilege is the exact Windows right a process must exercise to load a kernel driver, so its use by an unusual (non-admin) process around this time is the Security-log correlate confirming who drove this EID 6 load.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel driver service creation or .sys driver file dropped on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/)
    pivot_on:
    - host
    window: 4h
  - name: Security tooling disabled, stopped, or killed on this host (BYOVD objective)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|[Dd][Ee][Ll][Ee][Tt][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd]).*/ AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Dd][Nn][Ii][Ss][Ss][Vv][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Hh][Ee][Aa][Ll][Tt][Hh].*/)) OR (data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Mm][Ss][Mm][Pp][Ee][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Ss][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Ff][Aa][Ll][Cc][Oo][Nn].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Kernel-assisted process access to LSASS or security-engine processes on this host
    query: data_win_system_eventID:"10" AND (data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Mm][Ss][Mm][Pp][Ee][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Mm][Ss][Ss][Ee][Nn][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Cc][Ss][Ff][Aa][Ll][Cc][Oo][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ee][Ll][Aa][Ss][Tt][Ii][Cc]-[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Additional vulnerable/unsigned driver loads from temp or user-writable paths on this host
    query: data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*\.[Ss][Yy][Ss]/)
    pivot_on:
    - host
    window: 2h
