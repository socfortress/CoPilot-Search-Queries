correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: 'Direct precursor: ''sc.exe create type= kernel binPath=...sys'' is the service registration that loads a kernel driver, the most common way the malicious .sys named here entered the kernel, typically seconds before this EID 6 load on the same host.'
  - id: d526c60a-e236-4011-b165-831ffa52ab70
    name: Windows Vulnerable Driver Blocklist Disabled
    reason: 'Enabling precursor: Microsoft''s vulnerable-driver blocklist is precisely what blocks these loldrivers, so operators set VulnerableDriverBlocklistEnable=0 first to let a known-bad driver load; seeing it on the host confirms deliberate BYOVD staging.'
  - id: 22154f0e-5132-4a54-aa78-cc62f6def531
    name: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
    reason: Same blocklist-disable seen from the actor's command line (reg.exe/PowerShell), naming the process and parent that prepared the host for this driver load; complements the registry-value detection with execution context.
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: 'Alternative loader: KDU bypasses Driver Signature Enforcement to map unsigned or malicious drivers into the kernel, producing exactly this EID 6 load; its execution on the host explains how an unsigned/blocked .sys was accepted.'
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: 'Co-occurring sibling on the same EID 6 stream: a dropped malicious driver is frequently loaded from a temp path, so both detections fire on the single load and together pin the driver''s on-disk origin.'
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: 'Dominant follow-on motive: once the driver grants kernel execution the operator stops the EDR/AV service (sc/net/Stop-Service). BYOVD loads such as POORTRY/BURNTCIGAR exist chiefly to neutralize endpoint defenses.'
  - id: 56abae0c-6212-4b97-adc0-0b559bb950c3
    name: Important Windows Service Terminated Unexpectedly
    reason: 'Confirming follow-on: an EDR-killer driver forcibly terminates the protected security process, which the Service Control Manager logs as a service dying unexpectedly (7034) - the kernel kill succeeding, as opposed to a user-mode stop attempt.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Endgame follow-on: in ransomware intrusions the EDR-killer driver immediately precedes anti-recovery, so shadow-copy deletion on the same host signals the operator has moved from disabling defenses to pre-encryption.'
