how_to_implement: >
  Requires Sysmon EventID 6 (driver loaded) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\wfshbr64.sys'; data_win_eventdata_imageLoaded matches '*\ktmutil7odm.sys';
  data_win_eventdata_imageLoaded matches '*\ktes.sys', among other conditions.

known_false_positives: >
  False positives may occur if one of the vulnerable driver names mentioned
  above didn't change its name between versions. So always make sure that the
  driver being loaded is the legitimate one and the non vulnerable version.. If
  you experience a lot of FP you could comment the driver name or its exact
  known legitimate location (when possible). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://loldrivers.io/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1068/

response:
  message: >
    Malicious Driver Load By Name detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_signature: $data_win_eventdata_signature$. MITRE ATT&CK:
    T1543.003, T1068
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_signature
      type: other

