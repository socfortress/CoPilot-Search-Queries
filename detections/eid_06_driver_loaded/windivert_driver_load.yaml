parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 6 (driver loaded) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\WinDivert.sys*'; data_win_eventdata_imageLoaded matches
  '*\WinDivert64.sys*'; data_win_eventdata_imageLoaded matches
  '*\NordDivert.sys*', among other conditions.

known_false_positives: >
  Legitimate WinDivert driver usage. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://reqrypt.org/windivert-doc.html
  - https://rastamouse.me/ntlm-relaying-via-cobalt-strike/
  - https://attack.mitre.org/techniques/T1599/001/
  - https://attack.mitre.org/techniques/T1557/001/

response:
  message: >
    WinDivert Driver Load detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK:
    T1599.001, T1557.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

