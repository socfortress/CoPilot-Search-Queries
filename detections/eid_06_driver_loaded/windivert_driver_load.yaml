description: >
  Detects the load of the Windiver driver, a powerful user-mode
  capture/sniffing/modification/blocking/re-injection package for Windows. MITRE
  ATT&CK: T1599.001, T1557.001.

data_source:
  - Sysmon EventID 6 - Driver Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "6"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\WinDivert.sys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\WinDivert64.sys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\NordDivert.sys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\lingtiwfp.sys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\eswfp.sys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=0604bb7cb4bb851e2168d5c7d9399087*"
                    case_insensitive: true
              - wildcard:
