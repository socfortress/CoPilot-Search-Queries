hes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Dd]8[Aa]719865[Cc]448[Bb]1[Bb][Dd]2[Ee][Cc]241[Ee]46[Aa][Cc]1[Cc]88.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=0[Ee][Aa]54[Ff]8[Cc]9[Aa][Ff]4[Aa]2[Ff][Ee]8367[Ff][Aa]457[Ff]48[Ee][Dd]38.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=9[Dd]519[Aa][Ee]0[Aa]0864[Dd]6[Dd]6[Aa][Ee]3[Ff]8[Bb]6[Cc]9[Cc]70[Aa][Ff]6.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Aa]74929[Ee][Dd][Ff][Cc]3289895[Ee]3[Ff]2885278947[Aa][Ee].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Aa]66[Bb]476[Cc]2[Dd]06[Cc]370[Ff]0[Aa]53[Bb]5537[Ff]2[Ff]11[Ee].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Bb][Dd][Cc][Dd]836[Aa]46[Bb][Cc]2415773[Ff]6[Bb]5[Ee][Aa]77[Aa]46[Ee]4.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Cc]28[Cc][Dd]6[Cc][Cc][Dd]83179[Ee]79[Dd][Aa][Cc]132[Aa]553693[Dd]9.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: WinDivert is the kernel driver PortBender/Cobalt-Strike use to reflect inbound TCP/445 so SMB auth can be relayed; this rule catches the relay/coercion tools (ntlmrelayx, smbrelayx, Responder, PetitPotam) that drive the diverted traffic. Same operation, likely same host/window.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: WinDivert loads as a kernel-mode service; 'sc.exe create ... type= kernel binPath=...WinDivert*.sys' is the exact install step that registers and loads the driver immediately before this EID6 fires. Direct load mechanism / precursor.
  - id: f63508a0-c809-4435-b3be-ed819394d612
    name: Potential Privileged System Service Operation - SeLoadDriverPrivilege
    reason: Loading a non-PnP kernel driver like WinDivert requires SeLoadDriverPrivilege; the 4673 event is raised by the very act that produces this driver load. Precursor privilege use on the same host.
  - id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
    name: HackTool - Inveigh Execution
    reason: Inveigh is the on-host LLMNR/NBNS spoofer and NTLM capture/relay tool - the same adversary-in-the-middle objective WinDivert's packet diversion enables, and a frequent companion or alternative to a WinDivert-based relay. Co-occurring AitM payload.
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: certutil -syncwithWU to a UNC path coerces the machine account to authenticate to an attacker host - the coercion half that feeds the NTLM relay WinDivert stands up. Precursor in the relay chain.
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: PrinterBug/WebDAV coercion (rundll32 davclnt.dll,DavSetCookie -> spoolss) forces NTLM auth the attacker then relays; it is the coercion half of the same relay operation WinDivert diverts. Precursor/co-occurring.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Relay tooling commonly drops WinDivert.sys into %TEMP% and loads it from there, so the same EID6 driver-load this WinDivert alert raised would also trip this path-based rule. Co-occurring same-telemetry confirmation.
  - id: 1f1d8209-636e-4c6c-a137-781cca8b82f9
    name: WFP Filter Added via Registry
    reason: WinDivert is a WFP callout driver; registering WFP filters is how it (and the attacker) divert or outright block traffic, including blinding EDR. Co-occurring WFP-layer operation the loaded driver performs.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WinDivert/relay driver .sys file written to disk on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/ AND (data_win_eventdata_targetFilename:/.*[Dd][Ii][Vv][Ee][Rr][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Ww][Ff][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Kernel-mode driver service created/installed on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/) AND data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (data_win_system_eventID:"7045")
    pivot_on:
    - host
    window: 4h
  - name: NTLM/SMB relay, AitM spoofing and auth-coercion tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy][Xx].*|[Ss][Mm][Bb][Rr][Ee][Ll][Aa][Yy][Xx].*|[Rr][Ee][Ss][Pp][Oo][Nn][Dd][Ee][Rr]\.[Ee][Xx][Ee]|[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Ee][Xx][Ee]|[Pp][Oo][Rr][Tt][Bb][Ee][Nn][Dd][Ee][Rr].*|[Ss][Pp][Oo][Oo][Ll][Ss][Aa][Mm][Pp][Ll][Ee]\.[Ee][Xx][Ee]|[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm].*)/ OR data_win_eventdata_commandLine:/.*([Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy]|[Ss][Mm][Bb][Rr][Ee][Ll][Aa][Yy]|-[Ss][Pp][Oo][Oo][Ff][Ee][Rr][Ii][Pp]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Tt][Aa][Tt][Ee][Rr]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm]|[Dd][Aa][Vv][Ss][Ee][Tt][Cc][Oo][Oo][Kk][Ii][Ee]|-[Ss][Yy][Nn][Cc][Ww][Ii][Tt][Hh][Ww][Uu])/)
    pivot_on:
    - host
    window: 2h
  - name: 'Credential-theft follow-on: LSASS access and dumping on this host'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*)/ OR data_win_eventdata_commandLine:/.*([Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss]|[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp])/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Additional suspicious driver loads from user-writable paths on this host
    query: data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
