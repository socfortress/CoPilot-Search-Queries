name: Driver Load From A Temporary Directory
id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a driver load from a temporary directory. MITRE ATT&CK: T1543.003.

data_source:
  - Sysmon EventID 6 - Driver Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "6"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\Temp\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signature
    - data_win_eventdata_hashes

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 6 (driver loaded) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\Temp\*'.

known_false_positives: >
  There is a relevant set of false positives depending on applications in the
  environment. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Driver Load From A Temporary Directory detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_signature: $data_win_eventdata_signature$. MITRE
    ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_signature
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - driver
    - temporary
    - directory
    - driver_load
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3da70954-0f2c-4103-adff-b7440368f50e
    name: Suspicious PROCEXP152.sys File Created In TMP
    reason: 'Precursor drop: procexp152.sys (abused by KDU / Ghost-In-The-Logs for BYOVD) being written into %Temp% is the very .sys this rule then catches loading from Temp — identifies the file-create that staged this driver.'
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: 'Loading mechanism: ''sc create ... type= kernel binpath=<temp>.sys'' registers the kernel service that makes Windows load the driver; the EID 6 load this rule sees is the direct result of starting that service.'
  - id: d526c60a-e236-4011-b165-831ffa52ab70
    name: Windows Vulnerable Driver Blocklist Disabled
    reason: 'Enabler: zeroing VulnerableDriverBlocklistEnable lets Windows permit a known-vulnerable driver to load; a disable shortly before a Temp-dir driver load is the classic BYOVD setup step.'
  - id: 22154f0e-5132-4a54-aa78-cc62f6def531
    name: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
    reason: 'Enabler (command-line form): reg.exe/PowerShell tampering with the same blocklist key catches the disable via process telemetry when the registry event is missed — same BYOVD preparation on the host.'
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: 'Same-event corroboration: fires on the identical EID 6 if the Temp-loaded driver''s filename matches a known-malicious driver (mimikatz.sys, prokiller64.sys, blacklotus_driver.sys...), turning a location heuristic into a confirmed malicious load.'
  - id: 67add051-9ee7-4ad3-93ba-42935615ae8d
    name: PUA - Process Hacker Driver Load
    reason: 'Co-occurring driver identity: the Process Hacker kernel driver is routinely dropped to Temp and loaded to terminate protected AV/EDR processes; if that is the driver here, this names it and the intent.'
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: 'Follow-on payoff: once a kernel-driver foothold exists, EDR-Freeze suspends EDR/AV processes — the defense-neutralization objective that loading a driver from Temp is typically acquired to perform.'
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: 'Follow-on blinding: unloading the Sysmon minifilter via fltmc after gaining driver/kernel capability removes the exact telemetry (Sysmon EID 6) that raised this alert.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel driver (.sys) written into Temp or a user-writable directory
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*\.[Ss][Yy][Ss]/)
    pivot_on:
    - host
    window: 4h
  - name: Kernel-driver service registered or installed on this host
    query: (data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*\.[Ss][Yy][Ss].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ AND data_win_eventdata_details:/.*\.[Ss][Yy][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Additional drivers loaded from non-standard, user-writable locations
    query: data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: EDR / AV / Sysmon neutralization on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Mm][Ss][Mm][Pp][Ee][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Ff][Aa][Ll][Cc][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Rr][Bb][Oo][Nn][Bb][Ll][Aa][Cc][Kk].*/ OR data_win_eventdata_commandLine:/.*[Cc][Yy][Ll][Aa][Nn][Cc][Ee].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Aa][Zz][Uu][Hh].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS access or credential dumping on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/))
    pivot_on:
    - host
    window: 1h
