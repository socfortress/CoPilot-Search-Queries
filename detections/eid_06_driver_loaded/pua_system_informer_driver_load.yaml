name: PUA - System Informer Driver Load
id: 10cb6535-b31d-4512-9962-513dcbc42cc1
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 10cb6535-b31d-4512-9962-513dcbc42cc1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects driver load of the System Informer tool. MITRE ATT&CK: T1543.

data_source:
  - Sysmon EventID 6 - Driver Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "6"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\SystemInformer.sys"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=8B9AD98944AC9886EA4CB07700E71B78BE4A2740934BB7E46CA3B56A7C59AD24*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=A41348BEC147CA4D9EA2869817527EB5CEA2E20202AF599D2B30625433BCF454*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=38EE0A88AF8535A11EFE8D8DA9C6812AA07067B75A64D99705A742589BDD846D*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=A773891ACF203A7EB0C0D30942FB1347648F1CD918AE2BFD9A4857B4DCF5081B*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=4C3B81AC88A987BBDF7D41FA0AECC2CEDF5B9BD2F45E7A21F376D05345FC211D*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=3241BC14BEC51CE6A691B9A3562E5C1D52E9D057D27A3D67FD0B245C350B6D34*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=047C42E9BBA28366868847C7DAFC1E043FB038C796422D37220493517D68EE89*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=18931DC81E95D0020466FA091E16869DBE824E543A4C2C8FE644FA71A0F44FEB*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=B4C2EF76C204273132FDE38F0DED641C2C5EE767652E64E4C4071A4A973B6C1B*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=640954AFC268565F7DAA6E6F81A8EE05311E33E34332B501A3C3FE5B22ADEA97*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=251BE949F662C838718F8AA0A5F8211FB90346D02BD63FF91E6B224E0E01B656*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=E2606F272F7BA054DF16BE464FDA57211EF0D14A0D959F9C8DCB0575DF1186E4*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=3A9E1D17BEEB514F1B9B3BACAEE7420285DE5CBDCE89C5319A992C6CBD1DE138*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_hashes
    - data_win_eventdata_signature

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 6 (driver loaded) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\SystemInformer.sys'; data_win_eventdata_hashes matches
  '*SHA256=8B9AD98944AC9886EA4CB07700E71B78BE4A2740934BB7E46CA3B56A7C59AD24*';
  data_win_eventdata_hashes matches
  '*SHA256=A41348BEC147CA4D9EA2869817527EB5CEA2E20202AF599D2B30625433BCF454*',
  among other conditions.

known_false_positives: >
  System Informer is regularly used legitimately by system administrators or
  developers. Apply additional filters accordingly. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://systeminformer.sourceforge.io/
  - https://github.com/winsiderss/systeminformer
  - https://attack.mitre.org/techniques/T1543/

response:
  message: >
    PUA - System Informer Driver Load detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK: T1543
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543
  custom_tags:
    - system
    - informer
    - driver
    - driver_load
    - sysmon
    - persistence
    - privilege_escalation
  product:
