22[Aa][Dd][Ee][Aa]97.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=251[Bb][Ee]949[Ff]662[Cc]838718[Ff]8[Aa][Aa]0[Aa]5[Ff]8211[Ff][Bb]90346[Dd]02[Bb][Dd]63[Ff][Ff]91[Ee]6[Bb]224[Ee]0[Ee]01[Bb]656.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=[Ee]2606[Ff]272[Ff]7[Bb][Aa]054[Dd][Ff]16[Bb][Ee]464[Ff][Dd][Aa]57211[Ee][Ff]0[Dd]14[Aa]0[Dd]959[Ff]9[Cc]8[Dd][Cc][Bb]0575[Dd][Ff]1186[Ee]4.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=3[Aa]9[Ee]1[Dd]17[Bb][Ee][Ee][Bb]514[Ff]1[Bb]9[Bb]3[Bb][Aa][Cc][Aa][Ee][Ee]7420285[Dd][Ee]5[Cc][Bb][Dd][Cc][Ee]89[Cc]5319[Aa]992[Cc]6[Cc][Bb][Dd]1[Dd][Ee]138.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5722dff1-4bdd-4949-86ab-fbaf707e767a
    name: PUA - System Informer Execution
    reason: 'Direct precursor on this host: SystemInformer.exe run (with elevation) is what registers and loads SystemInformer.sys, so this EID-1 launch is the process behind the EID-6 driver load and shows who started it, from where, and under which account.'
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: 'Precursor install step: ''sc create ... type= kernel'' registers the service the kernel then loads; if it fires on the host just before, it is the service-install half of this same driver load and flags a renamed or relocated copy of the driver.'
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: 'Primary payoff and the reason the driver is loaded: System Informer''s kernel driver lets an operator kill protected AV/EDR, so a co-firing sc/net stop or Stop-Service of WinDefend/SentinelOne/CrowdStrike on the host confirms this is defense evasion, not admin use.'
  - id: windows-disable-modify-tools-taskkill-001
    name: Windows Disable or Modify Tools Via Taskkill
    reason: 'Follow-on defense evasion: taskkill /f against AV/EDR image names on the same host is the command-line twin of the forced process termination System Informer performs through its driver, both aiming to blind endpoint protection before the payload runs.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Follow-on credential access: the driver grants handle and read access to protected processes, so a suspicious LSASS handle with a dump-capable access mask from the same host moments later is the tool''s memory-read capability turned on LSASS.'
  - id: 67add051-9ee7-4ad3-93ba-42935615ae8d
    name: PUA - Process Hacker Driver Load
    reason: 'Same-family co-indicator: Process Hacker is System Informer''s predecessor and kprocesshacker.sys is the earlier name of this driver family; both grant identical kernel process-manipulation primitives, so either on the host points to one operator''s toolkit.'
  - id: d526c60a-e236-4011-b165-831ffa52ab70
    name: Windows Vulnerable Driver Blocklist Disabled
    reason: 'Precursor/enabler: disabling the Microsoft vulnerable-driver blocklist is how operators clear the way to load unsigned or known-vulnerable kernel drivers for EDR bypass, so a blocklist-disable on the host around this load marks a deliberate kernel-tampering campaign.'
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: 'Co-occurring kernel abuse on the same EID-6 stream: a second driver loading from %Temp% beside System Informer is the classic BYOVD staging pattern, an attacker dropping and loading a vulnerable driver from a user-writable path to escalate or kill EDR next to the process tool.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Security-tool / AV-EDR termination or service-stop on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/) OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Mm][Pp][Ee][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Oo][Ww][Dd][Ss][Tt][Rr][Ii][Kk][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Rr][Bb][Oo][Nn][Bb][Ll][Aa][Cc][Kk].*/ OR data_win_eventdata_commandLine:/.*[Cc][Yy][Ll][Aa][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Nn][Ii][Uu][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Cc][Aa][Ff][Ee][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Aa][Zz][Uu][Hh].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS handle access or memory-dump artifact on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1010.*/ OR data_win_eventdata_grantedAccess:/0[Xx]1410.*/ OR data_win_eventdata_grantedAccess:/0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa].*/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][0-3][Ff][Ff][Ff].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/)
    pivot_on:
    - host
    window: 1h
  - name: Additional kernel driver loads or kernel-service creation on this host
    query: (data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Defender / security-control tampering on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/)) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Vv][Uu][Ll][Nn][Ee][Rr][Aa][Bb][Ll][Ee][Dd][Rr][Ii][Vv][Ee][Rr][Bb][Ll][Oo][Cc][Kk][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_targetObject:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_targetObject:/.*[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/))
    pivot_on:
    - host
    window: 4h
  - name: System Informer / Process Hacker binary execution on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo][Rr][Mm][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Hh][Aa][Cc][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo][Rr][Mm][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Hh][Aa][Cc][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_product:/.*[Ss][Yy][Ss][Tt][Ee][Mm] [Ii][Nn][Ff][Oo][Rr][Mm][Ee][Rr].*/ OR data_win_eventdata_product:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Hh][Aa][Cc][Kk][Ee][Rr].*/)
    pivot_on:
