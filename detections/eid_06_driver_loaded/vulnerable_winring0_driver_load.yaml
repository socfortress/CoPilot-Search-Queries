name: Vulnerable WinRing0 Driver Load
id: 1a42dfa6-6cb2-4df9-9b48-295be477e835
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1a42dfa6-6cb2-4df9-9b48-295be477e835
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the load of a signed WinRing0 driver often used by threat actors,
  crypto miners (XMRIG) or malware for privilege escalation. MITRE ATT&CK:
  T1543.003.

data_source:
  - Sysmon EventID 6 - Driver Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "6"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=D41FA95D4642DC981F10DE36F4DC8CD7*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\WinRing0x64.sys"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\WinRing0.sys"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\WinRing0.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\WinRing0x64.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\winring00x64.sys"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_hashes
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signature

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 6 (driver loaded) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_hashes matches
  '*IMPHASH=D41FA95D4642DC981F10DE36F4DC8CD7*'; data_win_eventdata_imageLoaded
  matches '*\WinRing0x64.sys'; data_win_eventdata_imageLoaded matches
  '*\WinRing0.sys', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/xmrig/xmrig/tree/master/bin/WinRing0
  - https://www.rapid7.com/blog/post/2021/12/13/driver-based-attacks-past-and-present/
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Vulnerable WinRing0 Driver Load detected on host $agent_name$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_hashes
      type: file_hash
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - vulnerable
    - winring0
    - driver
    - driver_load
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"6" AND (data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Dd]41[Ff][Aa]95[Dd]4642[Dd][Cc]981[Ff]10[Dd][Ee]36[Ff]4[Dd][Cc]8[Cc][Dd]7.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Rr][Ii][Nn][Gg]0[Xx]64\.[Ss][Yy][Ss]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Rr][Ii][Nn][Gg]0\.[Ss][Yy][Ss]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Rr][Ii][Nn][Gg]0\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Rr][Ii][Nn][Gg]0[Xx]64\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Rr][Ii][Nn][Gg]00[Xx]64\.[Ss][Yy][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: 'Direct precursor to the load: a kernel-mode driver can only load (EID 6) after being registered as a kernel-type service. This catches the `sc create ... type= kernel binpath=*.sys` that installs the WinRing0 service moments before it loads.'
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: 'The same EID 6 driver-load event seen from the path angle: WinRing0x64.sys is routinely dropped to Temp/AppData by miners and loaders, so a near-simultaneous temp-dir driver load on this host is the same installation flagged on its unusual path.'
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: 'Co-occurring BYOVD: driver toolkits often load more than one driver. A known-malicious driver loading on the same host alongside WinRing0 confirms deliberate kernel-driver intrusion rather than a benign hardware-monitoring tool.'
  - id: 295c9289-acee-4503-a571-8eacaef36b28
    name: Vulnerable HackSys Extreme Vulnerable Driver Load
    reason: 'Sibling vulnerable-driver load: HEVD and WinRing0 are both LOLDrivers/BYOVD kernel-exploitation primitives. The same host loading both points at kernel privilege-escalation/exploitation activity, not utility use.'
  - id: d526c60a-e236-4011-b165-831ffa52ab70
    name: Windows Vulnerable Driver Blocklist Disabled
    reason: 'Enabler precursor: WinRing0 is on Microsoft''s vulnerable-driver blocklist, so a blocklist-disable registry change (EID 13) shortly before the load is exactly how the actor made this blocklisted driver loadable on this host.'
  - id: 22154f0e-5132-4a54-aa78-cc62f6def531
    name: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
    reason: 'Same enabler via command line (reg.exe/PowerShell): catches the blocklist tamper that must precede loading a blocklisted driver like WinRing0 when the EID 13 registry telemetry is missing or delayed.'
  - id: 91c49341-e2ef-40c0-ac45-49ec5c3fe26c
    name: RTCore Suspicious Service Installation
    reason: 'BYOVD sibling with an identical TTP: RTCore64.sys (MSI Afterburner) is installed and loaded via a kernel service exactly as WinRing0 is, and the same actors/toolkits cycle between these interchangeable ring-0 drivers; an RTCore service install near a WinRing0 load signals the same operation.'
  - id: 66c3b204-9f88-4d0a-a7f7-8a57d521ca55
    name: Potential Crypto Mining Activity
    reason: 'Primary follow-on: XMRig bundles WinRing0x64.sys specifically to apply ring-0 MSR mining tweaks, so miner command-line flags/strings on the same host turn this driver load into a confirmed cryptojacking incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel-driver service creation / registration on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee].*[Kk][Ee][Rr][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*\.[Ss][Yy][Ss].*/)) OR (data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*\.[Ss][Yy][Ss]/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_details:/.*\.[Ss][Yy][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Driver (.sys) dropped to disk and drivers loaded from non-standard paths on this host
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)) OR (data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/))
    pivot_on:
    - host
    window: 4h
  - name: Crypto-miner execution and mining-pool traffic on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*--[Cc][Pp][Uu]-[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Tt][Cc][Pp].*/ OR data_win_eventdata_commandLine:/.*--[Aa][Ll][Gg][Oo].*[Rr][Xx].*/ OR data_win_eventdata_commandLine:/.*--[Nn][Ii][Cc][Ee][Hh][Aa][Ss][Hh].*/ OR data_win_eventdata_image:/.*\\([Xx][Mm][Rr][Ii][Gg]|[Nn][Bb][Mm][Ii][Nn][Ee][Rr]|[Pp][Hh][Oo][Ee][Nn][Ii][Xx][Mm][Ii][Nn][Ee][Rr]|[Ll][Oo][Ll][Mm][Ii][Nn][Ee][Rr]|[Nn][Aa][Nn][Oo][Mm][Ii][Nn][Ee][Rr]|[Xx][Mm][Rr]-[Ss][Tt][Aa][Kk])\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"3333" OR data_win_eventdata_destinationPort:"4444" OR data_win_eventdata_destinationPort:"5555" OR data_win_eventdata_destinationPort:"7777" OR data_win_eventdata_destinationPort:"14444" OR data_win_eventdata_destinationPort:"45700")) OR (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Xx][Mm][Rr].*/ OR data_win_eventdata_queryName:/.*[Mm][Oo][Nn][Ee][Rr][Oo].*/ OR data_win_eventdata_queryName:/.*[Nn][Aa][Nn][Oo][Pp][Oo][Oo][Ll].*/ OR data_win_eventdata_queryName:/.*[Mm][Ii][Nn][Ee][Xx][Mm][Rr].*/ OR data_win_eventdata_queryName:/.*[Ss][Uu][Pp][Pp][Oo][Rr][Tt][Xx][Mm][Rr].*/ OR data_win_eventdata_queryName:/.*[Nn][Ii][Cc][Ee][Hh][Aa][Ss][Hh].*/))
    pivot_on:
    - host
    window: 6h
  - name: Vulnerable-driver blocklist / code-integrity / test-signing tampering on this host
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Ii]\\[Cc][Oo][Nn][Ff][Ii][Gg]\\.*[Bb][Ll][Oo][Cc][Kk][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Dd][Ee][Ii][Nn][Tt][Ee][Gg][Rr][Ii][Tt][Yy].*/)) OR (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Tt][Ee][Ss][Tt][Ss][Ii][Gg][Nn][Ii][Nn][Gg].*/) OR data_win_eventdata_commandLine:/.*[Vv][Uu][Ll][Nn][Ee][Rr][Aa][Bb][Ll][Ee][Dd][Rr][Ii][Vv][Ee][Rr][Bb][Ll][Oo][Cc][Kk][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Oo][Ii][Nn][Tt][Ee][Gg][Rr][Ii][Tt][Yy][Cc][Hh][Ee][Cc][Kk][Ss].*/))
    pivot_on:
    - host
    window: 4h
  - name: Security minifilter unload and AV/Defender tamper on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/) OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/ AND data_win_eventdata_commandLine:/.*([Ss][Ee][Nn][Ss][Ee]|[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Xx][Aa][Gg][Tt]|[Cc][Ss][Ff][Aa][Ll][Cc][Oo][Nn]|[Cc][Aa][Rr][Bb][Oo][Nn][Bb][Ll][Aa][Cc][Kk]|[Ss][Oo][Pp][Hh][Oo][Ss]|[Cc][Yy][Ll][Aa][Nn][Cc][Ee]|[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]|[Mm][Cc][Aa][Ff][Ee][Ee]).*/))
    pivot_on:
    - host
    window: 2h
