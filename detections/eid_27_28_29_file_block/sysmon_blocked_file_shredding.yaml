name: Sysmon Blocked File Shredding
id: c3e5c1b1-45e9-4632-b242-27939c170239
version: 1
schema_version: "1.0"
date: "2023-07-20"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c3e5c1b1-45e9-4632-b242-27939c170239
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Triggers on any Sysmon "FileBlockShredding" event, which indicates a violation
  of the configured shredding policy.

data_source:
  - Sysmon Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "28"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon installed with a configuration that enables the relevant event
  type and the Microsoft-Windows-Sysmon/Operational channel collected by the
  Wazuh agent (eventchannel localfile entry in ossec.conf). The detection looks
  for events where data_win_system_eventID equals '28'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon

response:
  message: >
    Sysmon Blocked File Shredding detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - sysmon
    - blocked
    - shredding
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"28"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a4824fca-976f-4964-b334-0621379e84c4
    name: Potential File Overwrite Via Sysinternals SDelete
    reason: SDelete erasing a file (not free space) overwrites the file's raw contents in exactly the secure-delete pattern Sysmon's FileBlockShredding policy intercepts; when this process-creation rule fires alongside the block it names the exact image, parent and command line behind the shred that was stopped.
  - id: c1d867fe-8d95-4487-aab4-e53f2d339f90
    name: Renamed Sysinternals Sdelete Execution
    reason: FileBlockShredding keys on the overwrite behaviour, not the binary name, so it still blocks a shred when the operator renames sdelete.exe to evade name-based detection; this rule identifies that disguised binary (via PE OriginalFileName) as the tool whose wipe was blocked.
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: '''cipher /w'' overwrites free space so deleted data cannot be carved back - the same make-it-unrecoverable objective via a built-in LOLBin, and a common fallback when a direct file shred is blocked. FileBlockShredding does not gate free-space wiping, so this is where the blocked operator''s destruction often succeeds.'
  - id: 4e5e024e-fabb-11eb-8b8f-acde48001122
    name: Fsutil Zeroing File
    reason: '''fsutil setzerodata'' zeroes a file''s contents - the identical destroy-the-file-data intent as the blocked shred, by a built-in utility (notably LockBit zeroing its own binary post-encryption). If it fires on the host the operator is wiping artifacts through whatever mechanism the shred policy fails to cover.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: FileBlockShredding does not block VSS destruction. Ransomware deletes volume shadow copies (vssadmin/wmic/wbadmin) in the same pre/post-encryption burst that attempts the file shred, so this is the recovery-denial half of one impact sequence and where damage lands despite the block.
  - id: 06125661-3814-4e03-bfa2-1e4411c60ac3
    name: Backup Files Deleted
    reason: 'The file-level counterpart to the shred: deletion of .bak/.bkf/.vhd backups runs beside the shredding attempt to close the restore path. It is a FileDelete (EID 23/26) event not gated by the shred-block, confirming the destruction proceeded even though the overwrite was stopped.'
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: '''bcdedit /set recoveryenabled no'' / bootstatuspolicy ignoreallfailures is the boot-recovery inhibition ransomware runs alongside data destruction; its presence on the same host in the window elevates a lone blocked shred into a confirmed ransomware impact chain (T1490).'
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Clearing the Windows event logs is the anti-forensic twin of file shredding - both are indicator removal (T1070). An operator who tried to shred a file typically also wipes the logs that recorded the intrusion, so the two fire in the same cleanup pass.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Secure-delete / file-wiping tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ss][Dd][Ee][Ll][Ee][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Dd][Ee][Ll][Ee][Tt][Ee][0-9]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Ii][Pp][Hh][Ee][Rr].*\/[Ww].*/ OR (data_win_eventdata_image:/.*\\[Ff][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Zz][Ee][Rr][Oo][Dd][Aa][Tt][Aa].*/))
    pivot_on:
    - host
    window: 2h
  - name: Recovery inhibition on this host (shadow copies, backups, boot recovery) - not gated by the shred block
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Further Sysmon file-block events on this host (shred retry / executable drop blocks)
    query: (data_win_system_eventID:"27" OR data_win_system_eventID:"28" OR data_win_system_eventID:"29")
    pivot_on:
    - host
    window: 2h
  - name: Anti-forensic log and USN-journal clearing on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/)) OR data_win_system_eventID:"1102" OR data_win_system_eventID:"104"
    pivot_on:
    - host
    window: 2h
  - name: Same account running secure-deletion / destruction tooling across hosts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ss][Dd][Ee][Ll][Ee][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Ii][Pp][Hh][Ee][Rr].*\/[Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Zz][Ee][Rr][Oo][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - user
    window: 6h
