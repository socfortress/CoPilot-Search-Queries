name: Operation Wocao Activity - Security
id: 74ad4314-482e-4c3e-b237-3f7ed3b9ca8d
version: 1
schema_version: "1.0"
date: "2022-11-27"
author: Florian Roth (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 74ad4314-482e-4c3e-b237-3f7ed3b9ca8d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects activity mentioned in Operation Wocao report. MITRE ATT&CK: T1012,
  T1036.004, T1027, T1053.005, T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4799"
        - wildcard:
            data_win_eventdata_targetUserName:
              value: "Administr*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callerProcessName:
              value: "*\\\\checkadmin.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetUserName
    - data_win_eventdata_callerProcessName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4799'; data_win_eventdata_targetUserName
  matches 'Administr*'; data_win_eventdata_callerProcessName matches
  '*\checkadmin.exe'.

known_false_positives: >
  Administrators that use checkadmin.exe tool to enumerate local administrators.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://web.archive.org/web/20200226212615/https://www.fox-it.com/en/news/whitepapers/operation-wocao-shining-a-light-on-one-of-chinas-hidden-hacking-groups/
  - https://web.archive.org/web/20200226212615/https://resources.fox-it.com/rs/170-CAK-271/images/201912_Report_Operation_Wocao.pdf
  - https://twitter.com/SBousseaden/status/1207671369963646976
  - https://attack.mitre.org/techniques/T1012/
  - https://attack.mitre.org/techniques/T1036/004/
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Operation Wocao Activity - Security detected on host $agent_name$. Matched
    data_win_eventdata_targetUserName: $data_win_eventdata_targetUserName$.
    Matched data_win_eventdata_callerProcessName:
    $data_win_eventdata_callerProcessName$. MITRE ATT&CK: T1012, T1036.004,
    T1027, T1053.005, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: user
    - field: data_win_eventdata_callerProcessName
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1012
    - T1036.004
    - T1027
    - T1053.005
    - T1059.001
  custom_tags:
    - operation
    - wocao
    - security
    - windows_security
    - privilege_escalation
    - persistence
    - discovery
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4799" AND data_win_eventdata_targetUserName:/[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr].*/ AND data_win_eventdata_callerProcessName:/.*\\[Cc][Hh][Ee][Cc][Kk][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1cfac73c-be78-4f9a-9b08-5bde0c3953ab
    name: Operation Wocao Activity
    reason: 'Process-creation twin: the same Wocao tradecraft (checkadmin.exe, masqueraded tools, encoded PowerShell) seen from Sysmon EID 1; confirms the 4799 enumeration came from a launched binary.'
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: 'Follow-on: after enumerating local Administrators, the actor often adds their own account to the group.'
  - id: 3f6bbf22-093e-4cb4-9641-83f47b8444b6
    name: Elevated Group Discovery With Wmic
    reason: 'Co-occurring discovery: same privileged-group reconnaissance goal done through wmic, typical of Wocao''s multiple enumeration methods.'
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: 'Co-occurring discovery: whoami /groups and checkadmin both establish current privilege level before lateral steps.'
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: 'Follow-on: Wocao used scheduled tasks for persistence and for executing payloads on remote hosts once admin rights were confirmed.'
  - id: f6de6525-4509-495a-8a82-1f8b0ed73a00
    name: Remote Task Creation via ATSVC Named Pipe
    reason: 'Lateral follow-on: Wocao ran tasks remotely on other systems after confirming local admin access.'
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: 'Lateral follow-on: stolen admin credentials used for explicit-credential logons to other hosts after enumerating admins.'
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: 'Lateral follow-on: files dropped to ADMIN$/C$ shares to stage tools on other hosts with the admin rights discovered.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: checkadmin.exe or admin-group enumeration process launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc][Hh][Ee][Cc][Kk][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?(\.[Ee][Xx][Ee])? +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] +[Aa][Dd][Mm][Ii][Nn].*/))
    pivot_on:
    - host
    window: 1h
  - name: Local administrator group membership changes or enumeration
    query: (data_win_system_eventID:"4732" OR data_win_system_eventID:"4799" OR data_win_system_eventID:"4798") AND data_win_eventdata_targetUserName:/[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr].*/
    pivot_on:
    - host
    - user
    window: 4h
  - name: Scheduled task creation or schtasks/at execution
    query: data_win_system_eventID:"4698" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|\\[Aa][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Network logons and admin share access from this user
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "9")) OR (data_win_system_eventID:"5140" AND data_win_eventdata_shareName:/.*(ADMIN|C|IPC)\$/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Encoded PowerShell execution around enumeration
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*( -[Ee][Nn][Cc]| -[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd]| -[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] +[Hh]).*/
    pivot_on:
    - host
    window: 1h
