name: Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation
id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
version: 1
schema_version: "1.0"
date: "2025-06-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modifications to DNS records in Active Directory where the
  Distinguished Name (DN) contains a base64-encoded blob matching the pattern
  "1UWhRCAAAAA...BAAAA". This pattern corresponds to a marshaled
  CREDENTIAL_TARGET_INFORMATION structure, commonly used in Kerberos coercion
  attacks. Adversaries may exploit this to coerce victim systems into
  authenticating to attacker-controlled hosts by spoofing SPNs via DNS. It is
  one of the strong indicators of a Kerberos coercion attack,. where adversaries
  manipulate DNS records to spoof Service Principal Names (SPNs) and redirect
  authentication requests like CVE-2025-33073. Please investigate the user
  account that made the changes, as it is likely a low-privileged account that
  has been compromised. MITRE ATT&CK: T1557.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_system_eventID: "5136"
                          - term:
                              data_win_system_eventID: "5137"
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_objectClass:
                          value: "dnsNode"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_objectDN:
                          value: "*UWhRCA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_objectDN:
                          value: "*BAAAA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_objectDN:
                          value: "*CN=MicrosoftDNS*"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4662"
                    - wildcard:
                        data_win_eventdata_additionalInfo:
                          value: "*UWhRCA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_additionalInfo:
                          value: "*BAAAA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_additionalInfo:
                          value: "*CN=MicrosoftDNS*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectClass
    - data_win_eventdata_objectDN
    - data_win_eventdata_additionalInfo
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136'; data_win_system_eventID equals '5137';
  data_win_eventdata_objectClass equals 'dnsNode', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html
  - https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025
  - https://attack.mitre.org/techniques/T1557/003/

response:
  message: >
    Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation detected
    on host $agent_name$. Matched data_win_eventdata_objectClass:
    $data_win_eventdata_objectClass$. Matched data_win_eventdata_objectDN:
    $data_win_eventdata_objectDN$. MITRE ATT&CK: T1557.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectClass
      type: other
    - field: data_win_eventdata_objectDN
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.003
  custom_tags:
    - kerberos
    - coercion
    - spoofing
    - windows_security
    - collection
    - credential_access
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_win_system_eventID:"5136" OR data_win_system_eventID:"5137") AND data_win_eventdata_objectClass:/[Dd][Nn][Ss][Nn][Oo][Dd][Ee]/ AND data_win_eventdata_objectDN:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_objectDN:/.*[Bb][Aa][Aa][Aa][Aa].*/ AND data_win_eventdata_objectDN:/.*[Cc][Nn]=[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Dd][Nn][Ss].*/) OR (data_win_system_eventID:"4662" AND data_win_eventdata_additionalInfo:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_additionalInfo:/.*[Bb][Aa][Aa][Aa][Aa].*/ AND data_win_eventdata_additionalInfo:/.*[Cc][Nn]=[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Dd][Nn][Ss].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: 'Same 1UWhRCAAAAA...BAAAA marshaled CREDENTIAL_TARGET_INFORMATION blob in a process command line: the tooling (dnstool/nslookup/PowerShell) that created the malicious DNS record or the hostname used to trigger the victim.'
  - id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
    name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
    reason: After the spoofed dnsNode is planted, the coerced victim resolves the blob-laden hostname; the Sysmon DNS query confirms the record was actually consumed.
  - id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
    name: Possible PetitPotam Coerce Authentication Attempt
    reason: The coercion trigger (EFSRPC over lsarpc pipe) is how the attacker forces the victim to authenticate to the spoofed SPN hostname.
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: Kerberos relay tooling receives the coerced authentication from the spoofed SPN and relays it (CVE-2025-33073 style reflection).
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: Kerberos relay-to-privilege-escalation tooling used as the follow-on once the victim authenticates to the attacker-controlled name.
  - id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
    name: Potential Privilege Escalation via Local Kerberos Relay over LDAP
    reason: Reflection of the coerced machine-account Kerberos auth back to the victim shows as a loopback network logon of the local administrator.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: A relayed machine-account or high-privilege authentication is commonly turned into DCSync to dump domain credentials.
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: Relay to LDAP is often used to grant replication rights on the domain object, preceding DCSync.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DNS queries for the marshaled-SPN blob hostname (victim consuming the record)
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_queryName:/.*[Bb][Aa][Aa][Aa][Aa].*/
    pivot_on:
    - host
    window: 2h
  - name: Auth-coercion RPC triggers over IPC$ named pipes (PetitPotam/PrinterBug/DFSCoerce)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND (data_win_eventdata_relativeTargetName:/[Ll][Ss][Aa][Rr][Pp][Cc]/ OR data_win_eventdata_relativeTargetName:/[Ee][Ff][Ss][Rr][Pp][Cc]/ OR data_win_eventdata_relativeTargetName:/[Ss][Pp][Oo][Oo][Ll][Ss][Ss]/ OR data_win_eventdata_relativeTargetName:/[Nn][Tt][Ss][Vv][Cc][Ss]/ OR data_win_eventdata_relativeTargetName:/[Nn][Ee][Tt][Dd][Ff][Ss]/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Kerberos relay tooling and DNS record manipulation commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]|[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy][Uu][Pp]|[Dd][Nn][Ss][Tt][Oo][Oo][Ll]|[Rr][Ee][Ss][Pp][Oo][Nn][Dd][Ee][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Dd][Nn][Ss][Ss][Ee][Rr][Vv][Ee][Rr][Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Rr][Ee][Cc][Oo][Rr][Dd]|[Aa][Dd][Dd]-[Dd][Nn][Ss][Rr][Ee][Cc][Oo][Rr][Dd]|[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]|[Dd][Nn][Ss][Tt][Oo][Oo][Ll]).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Loopback / machine-account Kerberos network logons after the DNS change (reflection/relay)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]/ AND (data_win_eventdata_ipAddress:"127.0.0.1" OR data_win_eventdata_ipAddress:"::1" OR data_win_eventdata_targetUserName:/.*\$/)
    pivot_on:
    - host
    window: 1h
  - name: Directory replication (DCSync) and security-descriptor changes following relayed authentication
    query: (data_win_system_eventID:"4662" AND (data_win_eventdata_properties:/.*1131[Ff]6[Aa][Aa].*/ OR data_win_eventdata_properties:/.*1131[Ff]6[Aa][Dd].*/)) OR (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Nn][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr]/)
    pivot_on:
    - user
    window: 6h
