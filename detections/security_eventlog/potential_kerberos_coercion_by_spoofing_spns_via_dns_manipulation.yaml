name: Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation
id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
version: 1
schema_version: "1.0"
date: "2025-06-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modifications to DNS records in Active Directory where the
  Distinguished Name (DN) contains a base64-encoded blob matching the pattern
  "1UWhRCAAAAA...BAAAA". This pattern corresponds to a marshaled
  CREDENTIAL_TARGET_INFORMATION structure, commonly used in Kerberos coercion
  attacks. Adversaries may exploit this to coerce victim systems into
  authenticating to attacker-controlled hosts by spoofing SPNs via DNS. It is
  one of the strong indicators of a Kerberos coercion attack,. where adversaries
  manipulate DNS records to spoof Service Principal Names (SPNs) and redirect
  authentication requests like CVE-2025-33073. Please investigate the user
  account that made the changes, as it is likely a low-privileged account that
  has been compromised. MITRE ATT&CK: T1557.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_system_eventID: "5136"
                          - term:
                              data_win_system_eventID: "5137"
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_objectClass:
                          value: "dnsNode"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_objectDN:
                          value: "*UWhRCA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_objectDN:
                          value: "*BAAAA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_objectDN:
                          value: "*CN=MicrosoftDNS*"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4662"
                    - wildcard:
                        data_win_eventdata_additionalInfo:
                          value: "*UWhRCA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_additionalInfo:
                          value: "*BAAAA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_additionalInfo:
                          value: "*CN=MicrosoftDNS*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectClass
    - data_win_eventdata_objectDN
    - data_win_eventdata_additionalInfo
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136'; data_win_system_eventID equals '5137';
  data_win_eventdata_objectClass equals 'dnsNode', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html
  - https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025
  - https://attack.mitre.org/techniques/T1557/003/

response:
  message: >
    Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation detected
    on host $agent_name$. Matched data_win_eventdata_objectClass:
    $data_win_eventdata_objectClass$. Matched data_win_eventdata_objectDN:
    $data_win_eventdata_objectDN$. MITRE ATT&CK: T1557.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectClass
      type: other
    - field: data_win_eventdata_objectDN
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.003
  custom_tags:
    - kerberos
    - coercion
    - spoofing
    - windows_security
    - collection
    - credential_access
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_win_system_eventID:"5136" OR data_win_system_eventID:"5137") AND data_win_eventdata_objectClass:/[Dd][Nn][Ss][Nn][Oo][Dd][Ee]/ AND data_win_eventdata_objectDN:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_objectDN:/.*[Bb][Aa][Aa][Aa][Aa].*/ AND data_win_eventdata_objectDN:/.*[Cc][Nn]=[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Dd][Nn][Ss].*/) OR (data_win_system_eventID:"4662" AND data_win_eventdata_additionalInfo:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_additionalInfo:/.*[Bb][Aa][Aa][Aa][Aa].*/ AND data_win_eventdata_additionalInfo:/.*[Cc][Nn]=[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Dd][Nn][Ss].*/))

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672")'
      pivot_on: [user]
      window: 6h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))'
      pivot_on: [host]
      window: 1h
    - name: "UAC-bypass / privilege-escalation binaries on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_parentImage:/.*(\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee])/)'
      pivot_on: [host]
      window: 2h
