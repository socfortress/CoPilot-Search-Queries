name: Password Change on Directory Service Restore Mode (DSRM) Account
id: 53ad8e36-f573-46bf-97e4-15ba5bf4bb51
version: 1
schema_version: "1.0"
date: "2020-08-23"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 53ad8e36-f573-46bf-97e4-15ba5bf4bb51
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects potential attempts made to set the Directory Services Restore Mode
  administrator password. The Directory Service Restore Mode (DSRM) account is a
  local administrator account on Domain Controllers. Attackers may change the
  password in order to obtain persistence. MITRE ATT&CK: T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4794"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4794'.

known_false_positives: >
  Initial installation of a domain controller. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://adsecurity.org/?p=1714
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4794
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    Password Change on Directory Service Restore Mode (DSRM) Account detected on
    host $agent_name$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. Matched
    data_win_eventdata_subjectLogonId: $data_win_eventdata_subjectLogonId$.
    MITRE ATT&CK: T1098
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_subjectUserName
      type: user
    - field: data_win_eventdata_subjectLogonId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1098
  custom_tags:
    - password
    - change
    - directory
    - windows_security
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4794"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b61e87c0-50db-4b2e-8986-6a2be94b33b0
    name: Directory Service Restore Mode(DSRM) Registry Value Tampering
    reason: 'Companion DSRM persistence step: after resetting the DSRM password, attackers set DsrmAdminLogonBehavior so the DSRM account can log on over the network while the DC is online.'
  - id: e6e88853-5f20-4c4a-8d26-cd469fd8d31f
    name: Ntdsutil Abuse
    reason: DSRM password is commonly reset with ntdsutil 'set dsrm password'; ntdsutil abuse is the process-level cause of event 4794.
  - id: a58353df-af43-4753-bad0-cd83ef35eef5
    name: Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Suspicious ntdsutil arguments on the same DC directly produce the DSRM password reset or precede NTDS.dit extraction.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: 'Follow-on: an actor with DC admin rights who resets DSRM for persistence often also exports NTDS.dit via ntdsutil IFM to harvest all domain hashes.'
  - id: 94dc4390-6b7c-4784-8ffc-335334404650
    name: Dump Ntds.dit To Suspicious Location
    reason: 'Follow-on credential theft: NTDS.dit copied to a staging location after DC-level persistence is established.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: DCSync is the other common domain-wide credential theft step by an actor holding DC admin privileges.
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: LSASS dumping on the DC is how the privileged credentials needed to reset DSRM are typically obtained.
  - id: 32e19d25-4aed-4860-a55a-be99cb0bf7ed
    name: Possible DC Shadow Attack
    reason: Both are stealthy domain-controller-level persistence/tampering techniques used by an attacker with domain admin.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ntdsutil DSRM password reset and NTDS extraction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Rr][Mm].*/)
    pivot_on:
    - host
    window: 2h
  - name: DsrmAdminLogonBehavior registry change
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:*DsrmAdminLogonBehavior*
    pivot_on:
    - host
    window: 2h
  - name: NTDS.dit, SYSTEM hive and shadow copy staging
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*[Nn][Tt][Dd][Ss].[Dd][Ii][Tt]* OR data_win_eventdata_targetFilename:*[Ss][Yy][Ss][Tt][Ee][Mm].[Hh][Ii][Vv]*)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]* OR data_win_eventdata_commandLine:*[Nn][Tt][Dd][Ss].[Dd][Ii][Tt]*))
    pivot_on:
    - host
    window: 4h
  - name: Directory replication (DCSync) rights use
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*89e95b76-444d-4c62-991a-0facbeda640c*)
    pivot_on:
    - host
    window: 4h
  - name: Logons by the account that changed the DSRM password
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 6h
