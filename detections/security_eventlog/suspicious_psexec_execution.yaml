name: Suspicious PsExec Execution
id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82
version: 1
schema_version: "1.0"
date: "2022-08-11"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  detects execution of psexec or paexec with renamed service name, this rule
  helps to filter out the noise if psexec is used for legit purposes or if
  attacker uses a different psexec client other than sysinternal one. MITRE
  ATT&CK: T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_shareName:
              value: "\\\\*\\IPC$"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*-stdin"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*-stdout"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*-stderr"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_relativeTargetName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "PSEXESVC*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName equals
  '\\*\IPC$'; data_win_eventdata_relativeTargetName matches '*-stdin', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20230329171218/https://blog.menasec.net/2019/02/threat-hunting-3-detecting-psexec.html
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Suspicious PsExec Execution detected on host $agent_name$. Matched
    data_win_eventdata_shareName: $data_win_eventdata_shareName$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - psexec
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Ii][Pp][Cc]\$/ AND (data_win_eventdata_relativeTargetName:/.*-[Ss][Tt][Dd][Ii][Nn]/ OR data_win_eventdata_relativeTargetName:/.*-[Ss][Tt][Dd][Oo][Uu][Tt]/ OR data_win_eventdata_relativeTargetName:/.*-[Ss][Tt][Dd][Ee][Rr][Rr]/) AND _exists_:data_win_eventdata_relativeTargetName AND NOT (data_win_eventdata_relativeTargetName:/[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: PsExec-style IPC$ stdin/stdout/stderr pipes follow a remote service install (7045/4697) with a renamed service; this is the same remote-exec chain from the service-creation side.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: The renamed PsExec/paexec service is created over SMB by a remote client; a service installed from an unusual client confirms the target host side of the same execution.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: PsExec drives the Service Control Manager over the svcctl pipe on IPC$ immediately before the stdin/stdout pipes appear.
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: PsExec/paexec first copies its service binary to ADMIN$/C$ over SMB, a precursor to the IPC$ pipe activity.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: PsExec with -u/-p creates a network logon with explicit credentials (4648) from the source host just before execution.
  - id: 51ae86a2-e2e1-4097-ad85-c46cb6851de4
    name: Renamed PsExec Service Execution
    reason: The rule matches only non-PSEXESVC pipe names, i.e. a renamed service; this is the process-creation view of that same renamed service binary running on the target.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: The remote command the operator actually runs surfaces as a SYSTEM child of the PsExec service; shows what the attacker executed through the pipes.
  - id: f0d1feba-4344-4ca9-8121-a6c97bd6df52
    name: Credential Dumping Tools Service Execution - Security
    reason: Remote service execution is commonly used to launch credential dumping tools as a service on the target, a typical next step after PsExec lands.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote service installation (renamed PsExec/paexec service)
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_imagePath:*ADMIN$* OR data_win_eventdata_imagePath:*\\\\* OR data_win_eventdata_serviceFileName:*ADMIN$* OR data_win_eventdata_serviceFileName:*\\\\* OR data_win_eventdata_imagePath:*.exe*)
    pivot_on:
    - host
    window: 1h
  - name: Admin share and SCM/pipe access preceding PsExec
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:/.*[Aa][Dd][Mm][Ii][Nn]\$/ OR data_win_eventdata_shareName:/.*[Cc]\$/ OR data_win_eventdata_relativeTargetName:*svcctl* OR data_win_eventdata_relativeTargetName:*atsvc*)
    pivot_on:
    - host
    window: 1h
  - name: Network and explicit-credential logons from the same account
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 2h
  - name: Child processes and LSASS access run through the remote service
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:*ADMIN$* OR data_win_eventdata_parentImage:*svc*.exe OR data_win_eventdata_parentImage:*[Pp]s[Ee]xe*) AND (data_win_eventdata_image:*cmd.exe OR data_win_eventdata_image:*powershell.exe OR data_win_eventdata_image:*rundll32.exe OR data_win_eventdata_image:*whoami.exe)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:*lsass.exe)
    pivot_on:
    - host
    window: 2h
  - name: 'Lateral spread: same account authenticating to other hosts over SMB'
    query: data_win_system_eventID:"5140" OR (data_win_system_eventID:"5145" AND data_win_eventdata_shareName:*IPC$*)
    pivot_on:
    - user
    window: 4h
