status: experimental
type: TTP

description: >
  Detects the usage of the 'SeLoadDriverPrivilege' privilege. This privilege is
  required to load or unload a device driver. With this privilege, the user can
  dynamically load and unload device drivers or other code in to kernel mode.
  This user right does not apply to Plug and Play device drivers. If you exclude
  privileged users/admins and processes, which are allowed to do so, you are
  maybe left with bad programs trying to load malicious kernel drivers. This
  will detect Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs)
  and the usage of Sysinternals and various other tools. So you have to work
  with a whitelist to find the bad stuff. MITRE ATT&CK: T1685.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4673"
        - term:
            data_win_eventdata_privilegeList:
              value: "SeLoadDriverPrivilege"
              case_insensitive: true
        - term:
            data_win_eventdata_service: "-"
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\explorer.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\HelpPane.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\Dism.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\fltMC.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\mmc.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\rundll32.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\RuntimeBroker.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\ShellHost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\svchost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\SystemSettingsBroker.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\wimserv.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "C:\\\\Program Files\\\\WindowsApps\\\\Microsoft*"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\Teams\\\\current\\\\Teams.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\Google\\\\Chrome\\\\Application\\\\chrome.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\procexp.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\procexp64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\procexp64a.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\procmon.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\procmon64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\procmon64a.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "C:\\\\Program Files (x86)\\\\Dropbox\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "C:\\\\Program Files\\\\Dropbox\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\Dropbox.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_privilegeList
    - data_win_eventdata_service
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4673'; data_win_eventdata_privilegeList equals
  'SeLoadDriverPrivilege'; data_win_eventdata_service equals '-', among other
  conditions.

known_false_positives: >
  Other legimate tools loading drivers. Including but not limited to,
  Sysinternals, CPU-Z, AVs etc. A baseline needs to be created according to the
  used products and allowed tools. A good thing to do is to try and exclude
  users who are allowed to load drivers. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4673
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Potential Privileged System Service Operation - SeLoadDriverPrivilege
    detected on host $agent_name$. Matched data_win_eventdata_privilegeList:
    $data_win_eventdata_privilegeList$. Matched data_win_eventdata_service:
    $data_win_eventdata_service$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_privilegeList
      type: other
    - field: data_win_eventdata_service
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - privileged
    - system
    - service
    - windows_security
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4673" AND data_win_eventdata_privilegeList:/[Ss][Ee][Ll][Oo][Aa][Dd][Dd][Rr][Ii][Vv][Ee][Rr][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]/ AND data_win_eventdata_service:"-" AND _exists_:data_win_eventdata_processName AND NOT (data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Hh][Ee][Ll][Pp][Pp][Aa][Nn][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Mm][Mm][Ee][Rr][Ss][Ii][Vv][Ee][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Pp][Aa][Nn][Ee][Ll]\\[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Rr][Uu][Nn][Tt][Ii][Mm][Ee][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Hh][Ee][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Mm][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].*/) AND _exists_:data_win_eventdata_processName AND NOT (data_win_eventdata_processName:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64[Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]64[Aa]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_processName:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\\.*/ OR data_win_eventdata_processName:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\\.*/) AND data_win_eventdata_processName:/.*\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: sc.exe create type=kernel is the usual way a driver service is registered immediately before the driver is loaded and SeLoadDriverPrivilege is exercised
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: KDU loads vulnerable signed drivers (BYOVD) and must use SeLoadDriverPrivilege from a non-allowlisted process, producing this exact 4673
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Sysmon EID 6 confirms the privilege use resulted in a driver loaded from a user-writable temp path, a staged BYOVD payload
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: Confirms the loaded driver is a known malicious or abused driver, converting the privilege event into kernel-level compromise
  - id: 1a42dfa6-6cb2-4df9-9b48-295be477e835
    name: Vulnerable WinRing0 Driver Load
    reason: WinRing0 is a commonly abused vulnerable driver loaded via SeLoadDriverPrivilege for kernel memory read/write
  - id: 26481afe-db26-4228-b264-25a29fe6efc7
    name: Uncommon Service Installation Image Path
    reason: System EID 7045 for a driver service with an unusual image path is the service-registration step preceding the privileged load
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: A suspicious new service created just before the privilege use is the driver install this event reflects
  - id: 22154f0e-5132-4a54-aa78-cc62f6def531
    name: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
    reason: Attackers disable the vulnerable driver blocklist beforehand so a BYOVD driver can load, the setup for this privilege use
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Driver loads (Sysmon EID 6) from writable or unsigned locations
    query: data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*\([Tt][Ee][Mm][Pp]|[Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss])\.*/ OR data_win_eventdata_signed:"false")
    pivot_on:
    - host
    window: 1h
  - name: Kernel driver service registration (sc create / 7045 / 4697)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*([Kk][Ee][Rr][Nn][Ee][Ll]|\.[Ss][Yy][Ss]).*/) OR (data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*\.[Ss][Yy][Ss].*/) OR (data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*\.[Ss][Yy][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Driver file (.sys) dropped to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/
    pivot_on:
    - host
    window: 2h
  - name: Security tooling tamper and log evasion after driver load
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc].*([Ss][Tt][Oo][Pp]|[Dd][Ee][Ll][Ee][Tt][Ee]|[Cc][Oo][Nn][Ff][Ii][Gg]).*([Ss][Ee][Nn][Ss][Ee]|[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Ss][Yy][Ss][Mm][Oo][Nn]|[Cc][Rr][Oo][Ww][Dd][Ss][Tt][Rr][Ii][Kk][Ee]|[Cc][Ss][Ff][Aa][Ll][Cc][Oo][Nn]|[Ww][Aa][Zz][Uu][Hh]).*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)) OR data_win_system_eventID:"1102" OR data_win_system_eventID:"4719"
    pivot_on:
    - host
    window: 2h
  - name: Credential access after kernel driver load (LSASS access and dumps)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 2h
