status: experimental
type: TTP

description: >
  Detects scenario where weak encryption is enabled for a user profile which
  could be used for hash/password cracking. MITRE ATT&CK: T1685.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4738"
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_newUacValue: "*8???"
                          - wildcard:
                              data_win_eventdata_newUacValue: "*9???"
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*A???"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*B???"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*C???"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*D???"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*E???"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*F???"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_oldUacValue"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*8???"
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*9???"
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*A???"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*B???"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*C???"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*D???"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*E???"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*F???"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_newUacValue: "*1????"
                          - wildcard:
                              data_win_eventdata_newUacValue: "*3????"
                          - wildcard:
                              data_win_eventdata_newUacValue: "*5????"
                          - wildcard:
                              data_win_eventdata_newUacValue: "*7????"
                          - wildcard:
                              data_win_eventdata_newUacValue: "*9????"
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*B????"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*D????"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*F????"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_oldUacValue"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*1????"
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*3????"
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*5????"
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*7????"
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*9????"
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*B????"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*D????"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*F????"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_newUacValue: "*8??"
                          - wildcard:
                              data_win_eventdata_newUacValue: "*9??"
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*A??"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*B??"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*C??"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*D??"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*E??"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_newUacValue:
                                value: "*F??"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_oldUacValue"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*8??"
                                - wildcard:
                                    data_win_eventdata_oldUacValue: "*9??"
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*A??"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*B??"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*C??"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*D??"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*E??"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_oldUacValue:
                                      value: "*F??"
                                      case_insensitive: true
                              minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_newUacValue
    - data_win_eventdata_oldUacValue
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4738'; data_win_eventdata_newUacValue matches
  '*8???'; data_win_eventdata_newUacValue matches '*9???', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://adsecurity.org/?p=2053
  - https://blog.harmj0y.net/redteaming/another-word-on-delegation/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Weak Encryption Enabled and Kerberoast detected on host $agent_name$.
    Matched data_win_eventdata_newUacValue: $data_win_eventdata_newUacValue$.
    Matched data_win_eventdata_oldUacValue: $data_win_eventdata_oldUacValue$.
    MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_newUacValue
      type: other
    - field: data_win_eventdata_oldUacValue
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - encryption
    - kerberoast
    - windows_security
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4738" AND (((data_win_eventdata_newUacValue:/.*8.../ OR data_win_eventdata_newUacValue:/.*9.../ OR data_win_eventdata_newUacValue:/.*[Aa].../ OR data_win_eventdata_newUacValue:/.*[Bb].../ OR data_win_eventdata_newUacValue:/.*[Cc].../ OR data_win_eventdata_newUacValue:/.*[Dd].../ OR data_win_eventdata_newUacValue:/.*[Ee].../ OR data_win_eventdata_newUacValue:/.*[Ff].../) AND _exists_:data_win_eventdata_oldUacValue AND NOT (data_win_eventdata_oldUacValue:/.*8.../ OR data_win_eventdata_oldUacValue:/.*9.../ OR data_win_eventdata_oldUacValue:/.*[Aa].../ OR data_win_eventdata_oldUacValue:/.*[Bb].../ OR data_win_eventdata_oldUacValue:/.*[Cc].../ OR data_win_eventdata_oldUacValue:/.*[Dd].../ OR data_win_eventdata_oldUacValue:/.*[Ee].../ OR data_win_eventdata_oldUacValue:/.*[Ff].../)) OR ((data_win_eventdata_newUacValue:/.*1..../ OR data_win_eventdata_newUacValue:/.*3..../ OR data_win_eventdata_newUacValue:/.*5..../ OR data_win_eventdata_newUacValue:/.*7..../ OR data_win_eventdata_newUacValue:/.*9..../ OR data_win_eventdata_newUacValue:/.*[Bb]..../ OR data_win_eventdata_newUacValue:/.*[Dd]..../ OR data_win_eventdata_newUacValue:/.*[Ff]..../) AND _exists_:data_win_eventdata_oldUacValue AND NOT (data_win_eventdata_oldUacValue:/.*1..../ OR data_win_eventdata_oldUacValue:/.*3..../ OR data_win_eventdata_oldUacValue:/.*5..../ OR data_win_eventdata_oldUacValue:/.*7..../ OR data_win_eventdata_oldUacValue:/.*9..../ OR data_win_eventdata_oldUacValue:/.*[Bb]..../ OR data_win_eventdata_oldUacValue:/.*[Dd]..../ OR data_win_eventdata_oldUacValue:/.*[Ff]..../)) OR ((data_win_eventdata_newUacValue:/.*8../ OR data_win_eventdata_newUacValue:/.*9../ OR data_win_eventdata_newUacValue:/.*[Aa]../ OR data_win_eventdata_newUacValue:/.*[Bb]../ OR data_win_eventdata_newUacValue:/.*[Cc]../ OR data_win_eventdata_newUacValue:/.*[Dd]../ OR data_win_eventdata_newUacValue:/.*[Ee]../ OR data_win_eventdata_newUacValue:/.*[Ff]../) AND _exists_:data_win_eventdata_oldUacValue AND NOT (data_win_eventdata_oldUacValue:/.*8../ OR data_win_eventdata_oldUacValue:/.*9../ OR data_win_eventdata_oldUacValue:/.*[Aa]../ OR data_win_eventdata_oldUacValue:/.*[Bb]../ OR data_win_eventdata_oldUacValue:/.*[Cc]../ OR data_win_eventdata_oldUacValue:/.*[Dd]../ OR data_win_eventdata_oldUacValue:/.*[Ee]../ OR data_win_eventdata_oldUacValue:/.*[Ff]../)))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672")'
      pivot_on: [user]
      window: 6h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/ OR data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/) OR data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/)'
      pivot_on: [host]
      window: 1h
