name: Weak Encryption Enabled and Kerberoast
id: f6de9536-0441-4b3f-a646-f4e00f300ffd
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: "@neu5ron"
source:
  format: sigma
  repository: SigmaHQ/sigma
