name: Password Protected ZIP File Opened (Suspicious Filenames)
id: 54f0434b-726f-48a1-b2aa-067df14516e4
version: 1
schema_version: "1.0"
date: "2022-05-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 54f0434b-726f-48a1-b2aa-067df14516e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the extraction of password protected ZIP archives with suspicious file
  names. See the filename variable for more details on which file has been
  opened. MITRE ATT&CK: T1027, T1105, T1036.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5379"
        - wildcard:
            data_win_eventdata_targetName:
              value: "*Microsoft_Windows_Shell_ZipFolder:filename*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*invoice*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*new order*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*rechnung*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*factura*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*delivery*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*purchase*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*order*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*payment*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5379'; data_win_eventdata_targetName matches
  '*Microsoft_Windows_Shell_ZipFolder:filename*'; data_win_eventdata_targetName
  matches '*invoice*', among other conditions.

known_false_positives: >
  Legitimate used of encrypted ZIP files. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/sbousseaden/status/1523383197513379841
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Password Protected ZIP File Opened (Suspicious Filenames) detected on host
    $agent_name$. Matched data_win_eventdata_targetName:
    $data_win_eventdata_targetName$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1027, T1105, T1036
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1105
    - T1036
  custom_tags:
    - password
    - protected
    - opened
    - windows_security
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5379" AND data_win_eventdata_targetName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]_[Ss][Hh][Ee][Ll][Ll]_[Zz][Ii][Pp][Ff][Oo][Ll][Dd][Ee][Rr]:[Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee].*/ AND (data_win_eventdata_targetName:/.*[Ii][Nn][Vv][Oo][Ii][Cc][Ee].*/ OR data_win_eventdata_targetName:/.*[Nn][Ee][Ww] [Oo][Rr][Dd][Ee][Rr].*/ OR data_win_eventdata_targetName:/.*[Rr][Ee][Cc][Hh][Nn][Uu][Nn][Gg].*/ OR data_win_eventdata_targetName:/.*[Ff][Aa][Cc][Tt][Uu][Rr][Aa].*/ OR data_win_eventdata_targetName:/.*[Dd][Ee][Ll][Ii][Vv][Ee][Rr][Yy].*/ OR data_win_eventdata_targetName:/.*[Pp][Uu][Rr][Cc][Hh][Aa][Ss][Ee].*/ OR data_win_eventdata_targetName:/.*[Oo][Rr][Dd][Ee][Rr].*/ OR data_win_eventdata_targetName:/.*[Pp][Aa][Yy][Mm][Ee][Nn][Tt].*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
    - id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
      name: "Audit CVE Event"
      reason: "next kill-chain tactic: Impact"
    - id: eee8311f-a752-44f0-bf2f-6b007db16300
      name: "BlueSky Ransomware Artefacts"
      reason: "next kill-chain tactic: Impact"
    - id: 3f2c93c7-7b2a-4d58-bb8d-6f39422d8148
      name: "CVE-2024-49113 Exploitation Attempt - LDAP Nightmare"
      reason: "next kill-chain tactic: Impact"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4673")'
      pivot_on: [user]
      window: 6h
    - name: "Kerberos ticket requests for this account"
      query: '(data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4771")'
      pivot_on: [user]
      window: 6h
    - name: "Downloader / C2 tooling executed on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt] .*/)'
      pivot_on: [host]
      window: 1h
