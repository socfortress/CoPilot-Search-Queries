name: Password Protected ZIP File Opened (Suspicious Filenames)
id: 54f0434b-726f-48a1-b2aa-067df14516e4
version: 1
schema_version: "1.0"
date: "2022-05-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 54f0434b-726f-48a1-b2aa-067df14516e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the extraction of password protected ZIP archives with suspicious file
  names. See the filename variable for more details on which file has been
  opened. MITRE ATT&CK: T1027, T1105, T1036.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5379"
        - wildcard:
            data_win_eventdata_targetName:
              value: "*Microsoft_Windows_Shell_ZipFolder:filename*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*invoice*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*new order*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*rechnung*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*factura*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*delivery*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*purchase*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*order*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*payment*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5379'; data_win_eventdata_targetName matches
  '*Microsoft_Windows_Shell_ZipFolder:filename*'; data_win_eventdata_targetName
  matches '*invoice*', among other conditions.

known_false_positives: >
  Legitimate used of encrypted ZIP files. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/sbousseaden/status/1523383197513379841
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Password Protected ZIP File Opened (Suspicious Filenames) detected on host
    $agent_name$. Matched data_win_eventdata_targetName:
    $data_win_eventdata_targetName$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1027, T1105, T1036
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1105
    - T1036
  custom_tags:
    - password
    - protected
    - opened
    - windows_security
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5379" AND data_win_eventdata_targetName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]_[Ss][Hh][Ee][Ll][Ll]_[Zz][Ii][Pp][Ff][Oo][Ll][Dd][Ee][Rr]:[Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee].*/ AND (data_win_eventdata_targetName:/.*[Ii][Nn][Vv][Oo][Ii][Cc][Ee].*/ OR data_win_eventdata_targetName:/.*[Nn][Ee][Ww] [Oo][Rr][Dd][Ee][Rr].*/ OR data_win_eventdata_targetName:/.*[Rr][Ee][Cc][Hh][Nn][Uu][Nn][Gg].*/ OR data_win_eventdata_targetName:/.*[Ff][Aa][Cc][Tt][Uu][Rr][Aa].*/ OR data_win_eventdata_targetName:/.*[Dd][Ee][Ll][Ii][Vv][Ee][Rr][Yy].*/ OR data_win_eventdata_targetName:/.*[Pp][Uu][Rr][Cc][Hh][Aa][Ss][Ee].*/ OR data_win_eventdata_targetName:/.*[Oo][Rr][Dd][Ee][Rr].*/ OR data_win_eventdata_targetName:/.*[Pp][Aa][Yy][Mm][Ee][Nn][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: 'Same phishing-delivery family: password-protected invoice/order archives commonly carry an ISO/IMG container that bypasses Mark-of-the-Web once extracted.'
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: The archive usually arrives as a mail attachment; payload executed straight from the Outlook temp cache is the precursor/co-occurring step of this delivery.
  - id: 1cdd9a09-06c9-4769-99ff-626e2b3991b8
    name: Suspicious Double Extension File Execution
    reason: Invoice-themed lures inside the zip are typically disguised executables like invoice.pdf.exe; this is the likely execution after extraction.
  - id: 5e6a80c8-2d45-4633-9ef4-fa2671a39c5c
    name: Suspicious Parent Double Extension File Execution
    reason: A double-extension lure extracted from the zip spawning child processes is the next stage of the same chain.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Zip-borne lures frequently contain JS/VBS/HTA droppers run via wscript/cscript/mshta right after the archive is opened.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The extracted script dropper then launches PowerShell/cmd/rundll32 to fetch or run the real payload.
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: Password-protected zip lures with invoice/payment names are classic Emotet-style delivery; an LNK in the archive spawns the loader.
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Qakbot-style campaigns deliver via password-protected archives and then run the payload DLL through rundll32.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Lure payload files written to user-writable paths (extracted from archive)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Dd][Ee][Ss][Kk][Tt][Oo][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc])\\.*\.([Ee][Xx][Ee]|[Jj][Ss]|[Jj][Ss][Ee]|[Vv][Bb][Ss]|[Ww][Ss][Ff]|[Hh][Tt][Aa]|[Ll][Nn][Kk]|[Ii][Ss][Oo]|[Ii][Mm][Gg]|[Ss][Cc][Rr]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1)/
    pivot_on:
    - host
    window: 1h
  - name: Script host / LOLBin execution of the extracted lure
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\\([Tt][Ee][Mm][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Ee][Ss][Kk][Tt][Oo][Pp]).*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/))
    pivot_on:
    - host
    window: 1h
  - name: Shell or downloader child of script host / Explorer / archiver
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|7[Zz][Ff][Mm]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Network or DNS contact from processes in user-writable paths
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\([Tt][Ee][Mm][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Persistence after lure execution (Run key or scheduled task)
    query: ((data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/))
    pivot_on:
    - host
    window: 4h
