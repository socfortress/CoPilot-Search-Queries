name: ETW Logging Disabled In .NET Processes - Registry
id: a4c90ea1-2634-4ca0-adbb-35eae169b6fc
version: 1
schema_version: "1.0"
date: "2022-12-20"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a4c90ea1-2634-4ca0-adbb-35eae169b6fc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Potential adversaries stopping ETW providers recording loaded .NET assemblies.
  MITRE ATT&CK: T1112, T1685.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4657"
                    - wildcard:
                        data_win_eventdata_objectName:
                          value: "*\\\\SOFTWARE\\\\Microsoft\\\\.NETFramework"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_objectValueName:
                          value: "ETWEnabled"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_newValue: "0"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4657"
                    - wildcard:
                        data_win_eventdata_objectName:
                          value: "*\\\\Environment*"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_objectValueName:
                                value: "COMPlus_ETWEnabled"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_objectValueName:
                                value: "COMPlus_ETWFlags"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_newValue: "0"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_objectValueName
    - data_win_eventdata_newValue
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4657'; data_win_eventdata_objectName matches
  '*\SOFTWARE\Microsoft\.NETFramework'; data_win_eventdata_objectValueName
  equals 'ETWEnabled', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

