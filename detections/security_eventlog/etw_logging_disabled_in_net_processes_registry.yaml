name: ETW Logging Disabled In .NET Processes - Registry
id: a4c90ea1-2634-4ca0-adbb-35eae169b6fc
version: 1
schema_version: "1.0"
date: "2022-12-20"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a4c90ea1-2634-4ca0-adbb-35eae169b6fc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Potential adversaries stopping ETW providers recording loaded .NET assemblies.
  MITRE ATT&CK: T1112, T1685.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4657"
                    - wildcard:
                        data_win_eventdata_objectName:
                          value: "*\\\\SOFTWARE\\\\Microsoft\\\\.NETFramework"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_objectValueName:
                          value: "ETWEnabled"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_newValue: "0"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4657"
                    - wildcard:
                        data_win_eventdata_objectName:
                          value: "*\\\\Environment*"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_objectValueName:
                                value: "COMPlus_ETWEnabled"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_objectValueName:
                                value: "COMPlus_ETWFlags"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_newValue: "0"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_objectValueName
    - data_win_eventdata_newValue
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4657'; data_win_eventdata_objectName matches
  '*\SOFTWARE\Microsoft\.NETFramework'; data_win_eventdata_objectValueName
  equals 'ETWEnabled', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/_xpn_/status/1268712093928378368
  - https://social.msdn.microsoft.com/Forums/vstudio/en-US/0878832e-39d7-4eaf-8e16-a729c4c40975/what-can-i-use-e13c0d23ccbc4e12931bd9cc2eee27e4-for?forum=clr
  - https://github.com/dotnet/runtime/blob/ee2355c801d892f2894b0f7b14a20e6cc50e0e54/docs/design/coreclr/jit/viewing-jit-dumps.md#setting-configuration-variables
  - https://github.com/dotnet/runtime/blob/f62e93416a1799aecc6b0947adad55a0d9870732/src/coreclr/src/inc/clrconfigvalues.h#L35-L38
  - https://github.com/dotnet/runtime/blob/7abe42dc1123722ed385218268bb9fe04556e3d3/src/coreclr/src/inc/clrconfig.h#L33-L39
  - https://github.com/dotnet/runtime/search?p=1&q=COMPlus_&unscoped_q=COMPlus_
  - https://bunnyinside.com/?term=f71e8cb9c76a
  - http://managed670.rssing.com/chan-5590147/all_p1.html
  - https://github.com/dotnet/runtime/blob/4f9ae42d861fcb4be2fcd5d3d55d5f227d30e723/docs/coding-guidelines/clr-jit-coding-conventions.md#1412-disabling-code
  - https://i.blackhat.com/EU-21/Wednesday/EU-21-Teodorescu-Veni-No-Vidi-No-Vici-Attacks-On-ETW-Blind-EDRs.pdf
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    ETW Logging Disabled In .NET Processes - Registry detected on host
    $agent_name$. Matched data_win_eventdata_objectName:
    $data_win_eventdata_objectName$. Matched data_win_eventdata_objectValueName:
    $data_win_eventdata_objectValueName$. MITRE ATT&CK: T1112, T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_objectValueName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1685
  custom_tags:
    - logging
    - registry
    - windows_security
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"4657" AND data_win_eventdata_objectName:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\\.[Nn][Ee][Tt][Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]/ AND data_win_eventdata_objectValueName:/[Ee][Tt][Ww][Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ AND data_win_eventdata_newValue:"0") OR (data_win_system_eventID:"4657" AND data_win_eventdata_objectName:/.*\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt].*/ AND (data_win_eventdata_objectValueName:/[Cc][Oo][Mm][Pp][Ll][Uu][Ss]_[Ee][Tt][Ww][Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ OR data_win_eventdata_objectValueName:/[Cc][Oo][Mm][Pp][Ll][Uu][Ss]_[Ee][Tt][Ww][Ff][Ll][Aa][Gg][Ss]/) AND data_win_eventdata_newValue:"0"))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bf4fc428-dcc3-4bbd-99fe-2422aeee2544
    name: ETW Logging Disabled In .NET Processes - Sysmon Registry
    reason: Same ETWEnabled/COMPlus_ETW* zeroing seen through Sysmon EID 13; confirms the registry write independently and may name the writing process the Security 4657 event lacks
  - id: 41421f44-58f9-455d-838a-c398859841d4
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    reason: The same .NET ETW disable done via set/setx/reg.exe commands; shows the command-line that produced the registry change
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: Co-occurring ETW evasion (logman/wevtutil/trace-session tampering) used alongside .NET ETW disabling to blind EDR telemetry
  - id: ad89044a-8f49-4673-9a55-cbd88a1b374f
    name: Enabling COR Profiler Environment Variables
    reason: COR_PROFILER/COR_ENABLE_PROFILING are set in the same Environment registry key and are used to hijack the CLR for persistence or hooking, often alongside COMPlus_ETW changes
  - id: 966315ef-c5e1-4767-ba25-fce9c8de3660
    name: Suspicious Environment Variable Has Been Registered
    reason: Attackers who set COMPlus_ETWEnabled persistently via Environment registry often register other malicious environment variables in the same step
  - id: aa37cbb0-da36-42cb-a90f-fdf216fc7467
    name: AMSI Disabled via Registry Modification
    reason: 'Companion defense-impairment step: tooling that blinds .NET ETW typically also disables AMSI before running in-memory .NET payloads'
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Broader log-suppression registry tampering by the same actor on the same host after ETW is blinded
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: 'The usual payoff: ETW assembly-load telemetry is disabled so that reflectively loaded .NET assemblies run unseen'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon registry writes zeroing .NET ETW settings
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Cc][Oo][Mm][Pp][Ll][Uu][Ss]_[Ee][Tt][Ww]|[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\\.[Nn][Ee][Tt][Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\[Ee][Tt][Ww][Ee][Nn][Aa][Bb][Ll][Ee][Dd]).*/
    pivot_on:
    - host
    window: 2h
  - name: Commands setting COMPlus_ETW or COR profiler variables
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Ll][Uu][Ss]_[Ee][Tt][Ww]|[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr]|[Cc][Oo][Rr]_[Ee][Nn][Aa][Bb][Ll][Ee]_[Pp][Rr][Oo][Ff][Ii][Ll][Ii][Nn][Gg]|[Ee][Tt][Ww][Ee][Nn][Aa][Bb][Ll][Ee][Dd]).*/
    pivot_on:
    - host
    window: 2h
  - name: In-memory .NET assembly loading in PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*\[[Aa]ssembly\]::[Ll]oad.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xecute-[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]m, *[Ss]i[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/)
    pivot_on:
    - host
    window: 2h
  - name: CLR loaded into non-.NET processes from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\([Cc][Ll][Rr]|[Mm][Ss][Cc][Oo][Rr][Ee][Ee]|[Cc][Ll][Rr][Jj][Ii][Tt])\.[Dd][Ll][Ll]/ AND data_win_eventdata_image:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc])\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Other logging and audit tampering commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* ([Cc][Ll]|[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg]|[Ss][Ll]).*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*([Cc][Ll][Ee][Aa][Rr]|[Rr][Ee][Mm][Oo][Vv][Ee]|[Nn][Oo] [Ll][Oo][Gg][Gg][Ii][Nn][Gg]).*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Mm][Aa][Nn] +(stop|delete|update).*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)
    pivot_on:
    - host
    window: 4h
