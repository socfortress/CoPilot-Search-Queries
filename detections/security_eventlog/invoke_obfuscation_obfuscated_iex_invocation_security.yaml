name: Invoke-Obfuscation Obfuscated IEX Invocation - Security
id: fd0f5778-d3cb-4c9a-9695-66759d04702a
version: 1
schema_version: "1.0"
date: "2022-11-27"
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fd0f5778-d3cb-4c9a-9695-66759d04702a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the code block linked in the references.
  MITRE ATT&CK: T1027.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - regexp:
                  data_win_eventdata_serviceFileName: ".*(\\$PSHome\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$PSHome\\[).*"
              - regexp:
                  data_win_eventdata_serviceFileName: ".*(\\$ShellId\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$ShellId\\[).*"
              - regexp:
                  data_win_eventdata_serviceFileName: ".*(\\$env:Public\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$env:Public\\[).*"
              - regexp:
                  data_win_eventdata_serviceFileName: ".*(\\$env:ComSpec\\[([ ]*[0-9]{1,3}[ ]*,){2}).*"
              - regexp:
                  data_win_eventdata_serviceFileName: ".*(\\\\*mdr\\*[^A-Za-z0-9_][ ]*\\)\\.Name).*"
              - regexp:
                  data_win_eventdata_serviceFileName: ".*(\\$VerbosePreference\\.ToString\\().*"
              - regexp:
                  data_win_eventdata_serviceFileName: ".*([^ ]tring\\][ ]*\\$VerbosePreference).*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches the regex /.*(\$PSHome\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$PSHome\[).*/;
  data_win_eventdata_serviceFileName matches the regex /.*(\$ShellId\[[
  ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$ShellId\[).*/, among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Invoke-Obfuscation Obfuscated IEX Invocation - Security detected on host
    $agent_name$. Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - invoke
    - obfuscation
    - obfuscated
    - windows_security
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND (data_win_eventdata_serviceFileName:/.*(\$PSHome\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$PSHome\[).*/ OR data_win_eventdata_serviceFileName:/.*(\$ShellId\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$ShellId\[).*/ OR data_win_eventdata_serviceFileName:/.*(\$env:Public\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$env:Public\[).*/ OR data_win_eventdata_serviceFileName:/.*(\$env:ComSpec\[([ ]*[0-9]{1,3}[ ]*,){2}).*/ OR data_win_eventdata_serviceFileName:/.*(\\*mdr\*[^A-Za-z0-9_][ ]*\)\.Name).*/ OR data_win_eventdata_serviceFileName:/.*(\$VerbosePreference\.ToString\().*/ OR data_win_eventdata_serviceFileName:/.*([^ ]tring\][ ]*\$VerbosePreference).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f211361-7dce-442d-b78a-c04039677378
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module
    reason: Same Invoke-Obfuscation IEX pattern seen in PowerShell module logging; confirms the obfuscated string was actually executed by PowerShell, not just registered as a service.
  - id: e9f55347-2928-4c06-88e5-1a7f8169942e
    name: Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION
    reason: Sibling Invoke-Obfuscation launcher style; the same operator/tooling typically produces several launcher variants on one host.
  - id: b222df08-0e07-11eb-adc1-0242ac120002
    name: Invoke-Obfuscation CLIP+ Launcher
    reason: Another Invoke-Obfuscation launcher in process creation; shows the obfuscated command line that wrapped the service payload.
  - id: 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7
    name: Invoke-Obfuscation COMPRESS OBFUSCATION
    reason: Compressed-payload Invoke-Obfuscation variant; co-occurs when the framework's compress/encode options are used on the same host.
  - id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
    name: Obfuscated PowerShell OneLiner Execution
    reason: Process-creation view of the obfuscated powershell one-liner that the installed service (4697) launches.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Command-line obfuscation by the service's child powershell.exe is the direct execution of this payload.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The obfuscated payload was delivered as a new service (4697); sc/New-Service creation is the process-level counterpart of the same persistence or remote-exec step.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Service-based remote execution (PsExec/Impacket-style) commonly installs a service whose binary path is an obfuscated powershell command, indicating lateral movement.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installs (4697) with powershell/cmd launcher on this host
    query: data_win_system_eventID:"4697" AND (data_win_eventdata_serviceFileName:*[Pp]owershell* OR data_win_eventdata_serviceFileName:*[Cc]md.exe* OR data_win_eventdata_serviceFileName:*%COMSPEC%* OR data_win_eventdata_serviceFileName:*[Mm]shta*)
    pivot_on:
    - host
    window: 6h
  - name: Obfuscated PowerShell process launched (service child or encoded)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:*-[Ee]nc* OR data_win_eventdata_commandLine:*[Ii][Ee][Xx]* OR data_win_eventdata_commandLine:*FromBase64String* OR data_win_eventdata_commandLine:*$env:ComSpec* OR data_win_eventdata_commandLine:*$PSHome* OR data_win_eventdata_commandLine:*services.exe*)
    pivot_on:
    - host
    window: 1h
  - name: Script block content with IEX, download cradles or AMSI tampering
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*$PSHome* OR data_win_eventdata_scriptBlockText:*$ShellId* OR data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*AmsiUtils*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections by powershell or services-spawned processes
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Cc]md\.exe/ OR data_win_eventdata_image:/.*[Mm]shta\.exe/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
  - name: Network (type 3) logons by this account preceding the service install
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:(3 OR 9 OR 10)
    pivot_on:
    - user
    window: 4h
