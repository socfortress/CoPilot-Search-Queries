name: AD Privileged Users or Groups Reconnaissance
id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
version: 1
schema_version: "1.0"
date: "2022-07-13"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect priv users or groups recon based on 4661 eventid and known privileged
  users or groups SIDs. MITRE ATT&CK: T1087.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4661"
        - bool:
            should:
              - term:
                  data_win_eventdata_objectType:
                    value: "SAM_USER"
                    case_insensitive: true
              - term:
                  data_win_eventdata_objectType:
                    value: "SAM_GROUP"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectName: "*-512"
              - wildcard:
                  data_win_eventdata_objectName: "*-502"
              - wildcard:
                  data_win_eventdata_objectName: "*-500"
              - wildcard:
                  data_win_eventdata_objectName: "*-505"
              - wildcard:
                  data_win_eventdata_objectName: "*-519"
              - wildcard:
                  data_win_eventdata_objectName: "*-520"
              - wildcard:
                  data_win_eventdata_objectName: "*-544"
              - wildcard:
                  data_win_eventdata_objectName: "*-551"
              - wildcard:
                  data_win_eventdata_objectName: "*-555"
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*admin*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_subjectUserName: "*$"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4661'; data_win_eventdata_objectType equals
  'SAM_USER'; data_win_eventdata_objectType equals 'SAM_GROUP', among other
  conditions.

known_false_positives: >
  If source account name is not an admin then its super suspicious. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20230329163438/https://blog.menasec.net/2019/02/threat-hunting-5-detecting-enumeration.html
  - https://attack.mitre.org/techniques/T1087/002/

response:
  message: >
    AD Privileged Users or Groups Reconnaissance detected on host $agent_name$.
    Matched data_win_eventdata_objectType: $data_win_eventdata_objectType$.
    Matched data_win_eventdata_objectName: $data_win_eventdata_objectName$.
    MITRE ATT&CK: T1087.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - privileged
    - users
    - groups
    - windows_security
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4661" AND (data_win_eventdata_objectType:/[Ss][Aa][Mm]_[Uu][Ss][Ee][Rr]/ OR data_win_eventdata_objectType:/[Ss][Aa][Mm]_[Gg][Rr][Oo][Uu][Pp]/) AND (data_win_eventdata_objectName:/.*-512/ OR data_win_eventdata_objectName:/.*-502/ OR data_win_eventdata_objectName:/.*-500/ OR data_win_eventdata_objectName:/.*-505/ OR data_win_eventdata_objectName:/.*-519/ OR data_win_eventdata_objectName:/.*-520/ OR data_win_eventdata_objectName:/.*-544/ OR data_win_eventdata_objectName:/.*-551/ OR data_win_eventdata_objectName:/.*-555/ OR data_win_eventdata_objectName:/.*[Aa][Dd][Mm][Ii][Nn].*/) AND _exists_:data_win_eventdata_subjectUserName AND NOT (data_win_eventdata_subjectUserName:/.*\$/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: SharpHound/BloodHound collectors enumerate privileged SAM users and groups (RIDs 512/519/544) and are the most common tool producing this 4661 SAM_USER/SAM_GROUP handle burst on the same host.
  - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
    name: Detect SharpHound Command-Line Arguments
    reason: SharpHound collection-method arguments (-c All/Group/LocalAdmin) on the same host explain the privileged-group object handles and confirm automated AD mapping.
  - id: ab6bffca-beff-4baa-af11-6733f296d57a
    name: Potential AD User Enumeration From Non-Machine Account
    reason: 'Same enumeration family: a non-machine account querying many SAM user objects (4662) right alongside the privileged-RID lookups, widening from admins to all users.'
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Attacker checking own group membership (whoami /groups) typically precedes or accompanies lookups of Domain/Enterprise Admin groups.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: After identifying privileged accounts, attackers enumerate SPNs to pick Kerberoasting targets from the same account set.
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: 'Likely follow-on: service-ticket requests for SPN accounts (often privileged ones just discovered) to crack offline.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Privilege recon of Domain/Enterprise Admins commonly precedes DCSync by a non-machine account to harvest their credentials.
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: 'Post-recon privilege persistence/escalation: once admin groups are mapped, the actor adds an account to an admin group.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Directory-recon and BloodHound tooling process starts on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp]|[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Gg][Rr][Oo][Uu][Pp]|[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss]|[Ee][Nn][Tt][Ee][Rr][Pp][Rr][Ii][Ss][Ee] [Aa][Dd][Mm][Ii][Nn][Ss]|[Ww][Hh][Oo][Aa][Mm][Ii] +/[Gg][Rr][Oo][Uu][Pp][Ss]|[Nn][Ee][Tt]1? +(group|user|localgroup).*).*/)
    pivot_on:
    - host
    window: 1h
  - name: LDAP and SMB/RPC connections to domain controllers from this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135")
    pivot_on:
    - host
    window: 1h
  - name: Other directory object enumeration (4662/4798/4799/4661) by this account
    query: (data_win_system_eventID:"4662" OR data_win_system_eventID:"4661" OR data_win_system_eventID:"4798" OR data_win_system_eventID:"4799")
    pivot_on:
    - user
    window: 2h
  - name: Kerberos service ticket and explicit-credential logons by this account
    query: (data_win_system_eventID:"4769" OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 6h
  - name: Privileged group membership changes and special-privilege logons after recon
    query: (data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4720" OR data_win_system_eventID:"4672")
    pivot_on:
    - user
    window: 6h
