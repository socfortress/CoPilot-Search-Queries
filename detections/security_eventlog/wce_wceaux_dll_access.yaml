name: WCE wceaux.dll Access
id: 1de68c67-af5c-4097-9c85-fe5578e09e67
version: 1
schema_version: "1.0"
date: "2025-01-30"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1de68c67-af5c-4097-9c85-fe5578e09e67
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects wceaux.dll access while WCE pass-the-hash remote command execution on
  source host. MITRE ATT&CK: T1003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4656"
              - term:
                  data_win_system_eventID: "4663"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\wceaux.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_system_eventID equals '4663';
  data_win_eventdata_objectName matches '*\wceaux.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.jpcert.or.jp/english/pub/sr/ir_research.html
  - https://jpcertcc.github.io/ToolAnalysisResultSheet
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    WCE wceaux.dll Access detected on host $agent_name$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - wceaux
    - windows_security
    - credential_access
    - s0005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4656" OR data_win_system_eventID:"4663") AND data_win_eventdata_objectName:/.*\\[Ww][Cc][Ee][Aa][Uu][Xx]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7aa7009a-28b9-4344-8c1f-159489a390df
    name: HackTool - Windows Credential Editor (WCE) Execution
    reason: 'Same tool: wceaux.dll is the helper WCE drops/loads when its pass-the-hash remote-command mode runs, so the wce.exe process creation is the direct co-occurring event.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Attackers who run WCE for PtH commonly also run Mimikatz for the hash/credential extraction that precedes or substitutes for it on the same host.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: WCE needs NTLM hashes harvested from LSASS; LSASS dumping via comsvcs is a precursor credential-theft step on the same host.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump of LSASS is the offline precursor that supplies the hashes later replayed through WCE pass-the-hash.
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: Credential-dumper injection into LSASS (WCE/pwdump family) is the hash-acquisition stage immediately before pass-the-hash use.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: The WCE PtH remote command execution is typically used to launch PsExec-style execution on a target with the injected hash; this is the follow-on lateral movement.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PSEXESVC service start on the destination host confirms the pass-the-hash session was used to execute remotely.
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Alternative PtH-driven remote execution tooling (smbexec/wmiexec) seen when an actor holds NTLM hashes.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WCE binary execution or wceaux.dll file drop on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Cc][Ee]([_-]?[Xx]?(64|86|32))?\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww][Cc][Ee][Aa][Uu][Xx].*/ OR data_win_eventdata_commandLine:/.* -[Ss] [A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Fa-f0-9]{32}:[A-Fa-f0-9]{32}.*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ww][Cc][Ee]([Aa][Uu][Xx])?[^\\]*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS access or credential dumping preceding hash use
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*[Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 6h
  - name: 'Pass-the-hash style logons: NewCredentials (type 9) or explicit-credential use'
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/.*[Ss][Ee][Cc][Ll][Oo][Gg][Oo].*/) OR data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM" AND data_win_eventdata_logonProcessName:/.*[Nn][Tt][Ll][Mm][Ss][Ss][Pp].*/)
    pivot_on:
    - user
    window: 6h
  - name: Remote service install or PsExec-style execution after hash injection
    query: (data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/.*([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Rr][Ee][Mm][Cc][Oo][Mm]).*/ OR data_win_eventdata_imagePath:/.*\\\\.*[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_imagePath:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: SMB/RPC/WinRM outbound connections from this host (lateral movement targets)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986") AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
