name: Reconnaissance Activity
id: 968eef52-9cff-4454-8992-1e74b9cbad6c
version: 1
schema_version: "1.0"
date: "2022-08-22"
author: Florian Roth (Nextron Systems), Jack Croock (method), Jonhnathan Ribeiro (improvements), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 968eef52-9cff-4454-8992-1e74b9cbad6c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects activity as "net user administrator /domain" and "net group domain
  admins /domain". MITRE ATT&CK: T1087.002, T1069.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4661"
        - term:
            data_win_eventdata_accessMask:
              value: "0x2d"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_objectType:
                    value: "SAM_USER"
                    case_insensitive: true
              - term:
                  data_win_eventdata_objectType:
                    value: "SAM_GROUP"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_objectName:
              value: "S-1-5-21-*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectName: "*-500"
              - wildcard:
                  data_win_eventdata_objectName: "*-512"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_accessMask
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4661'; data_win_eventdata_accessMask equals
  '0x2d'; data_win_eventdata_objectType equals 'SAM_USER', among other
  conditions.

known_false_positives: >
  Administrator activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://findingbad.blogspot.de/2017/01/hunting-what-does-it-look-like.html
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/

response:
  message: >
    Reconnaissance Activity detected on host $agent_name$. Matched
    data_win_eventdata_accessMask: $data_win_eventdata_accessMask$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. MITRE
    ATT&CK: T1087.002, T1069.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_accessMask
      type: other
    - field: data_win_eventdata_objectType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
    - T1069.002
  custom_tags:
    - reconnaissance
    - windows_security
    - discovery
    - s0039
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4661" AND data_win_eventdata_accessMask:/0[Xx]2[Dd]/ AND (data_win_eventdata_objectType:/[Ss][Aa][Mm]_[Uu][Ss][Ee][Rr]/ OR data_win_eventdata_objectType:/[Ss][Aa][Mm]_[Gg][Rr][Oo][Uu][Pp]/) AND data_win_eventdata_objectName:/[Ss]-1-5-21-.*/ AND (data_win_eventdata_objectName:/.*-500/ OR data_win_eventdata_objectName:/.*-512/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: Same Security-log SAM object-access telemetry for privileged accounts and groups; co-occurs as the same enumeration sweep seen from the DC.
  - id: ab6bffca-beff-4baa-af11-6733f296d57a
    name: Potential AD User Enumeration From Non-Machine Account
    reason: Account-driven SAM_USER enumeration against the DC is the same discovery behaviour from a non-machine account, confirming a human or tool is walking AD.
  - id: 12ba6a38-adb3-4d6b-91ba-a7fb248e3199
    name: Password Policy Enumerated
    reason: Attackers running net user/group /domain typically also pull the domain password policy before spraying or cracking.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Escalation of manual net-style admin enumeration into automated full AD graph collection on the same host.
  - id: f0c9d62f-a232-4edd-b17e-bc409fb133d4
    name: Domain Group Discovery With Dsquery
    reason: Alternate process-side way to enumerate Domain Admins; endpoint-side counterpart to the DC-side SAM_GROUP read.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Usually runs just before or alongside net group /domain to locate DCs and trusts during initial domain mapping.
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: After identifying privileged accounts, attackers commonly request service tickets for roastable accounts as the next credential-access step.
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: Follow-on credential attack against accounts discovered during domain enumeration.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Net/dsquery/nltest domain enumeration commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]1? +(user|group|localgroup|accounts|view|share).*|[Nn][Ll][Tt][Ee][Ss][Tt].*(dclist|domain_trusts|dsgetdc).*|[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*|[Aa][Dd][Ff][Ii][Nn][Dd].*)/
    pivot_on:
    - host
    window: 1h
  - name: AD enumeration tooling and PowerShell AD cmdlets
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Ss][Ee][Aa][Tt][Bb][Ee][Ll][Tt]).*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(Get-ADUser|Get-ADGroupMember|Get-ADComputer|Get-DomainUser|Get-DomainGroupMember|Invoke-BloodHound|DirectorySearcher).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos service ticket and TGT requests by this account
    query: (data_win_system_eventID:"4769" OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4776")
    pivot_on:
    - user
    window: 2h
  - name: Lateral movement logons and explicit credentials after enumeration
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 6h
  - name: Remote execution tooling following recon on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss]|[Mm][Ss][Tt][Ss][Cc]|[Aa][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
