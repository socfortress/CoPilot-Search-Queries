name: Reconnaissance Activity
id: 968eef52-9cff-4454-8992-1e74b9cbad6c
version: 1
schema_version: "1.0"
date: "2022-08-22"
author: Florian Roth (Nextron Systems), Jack Croock (method), Jonhnathan Ribeiro (improvements), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 968eef52-9cff-4454-8992-1e74b9cbad6c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects activity as "net user administrator /domain" and "net group domain
  admins /domain". MITRE ATT&CK: T1087.002, T1069.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4661"
        - term:
            data_win_eventdata_accessMask:
              value: "0x2d"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_objectType:
                    value: "SAM_USER"
                    case_insensitive: true
              - term:
                  data_win_eventdata_objectType:
                    value: "SAM_GROUP"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_objectName:
              value: "S-1-5-21-*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectName: "*-500"
              - wildcard:
                  data_win_eventdata_objectName: "*-512"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_accessMask
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4661'; data_win_eventdata_accessMask equals
  '0x2d'; data_win_eventdata_objectType equals 'SAM_USER', among other
  conditions.

known_false_positives: >
  Administrator activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://findingbad.blogspot.de/2017/01/hunting-what-does-it-look-like.html
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/

response:
  message: >
    Reconnaissance Activity detected on host $agent_name$. Matched
    data_win_eventdata_accessMask: $data_win_eventdata_accessMask$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. MITRE
    ATT&CK: T1087.002, T1069.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_accessMask
      type: other
    - field: data_win_eventdata_objectType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
    - T1069.002
  custom_tags:
    - reconnaissance
    - windows_security
    - discovery
    - s0039
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4661" AND data_win_eventdata_accessMask:/0[Xx]2[Dd]/ AND (data_win_eventdata_objectType:/[Ss][Aa][Mm]_[Uu][Ss][Ee][Rr]/ OR data_win_eventdata_objectType:/[Ss][Aa][Mm]_[Gg][Rr][Oo][Uu][Pp]/) AND data_win_eventdata_objectName:/[Ss]-1-5-21-.*/ AND (data_win_eventdata_objectName:/.*-500/ OR data_win_eventdata_objectName:/.*-512/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
