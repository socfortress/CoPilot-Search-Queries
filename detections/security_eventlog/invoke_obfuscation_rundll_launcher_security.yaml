name: Invoke-Obfuscation RUNDLL LAUNCHER - Security
id: f241cf1b-3a6b-4e1a-b4f9-133c00dd95ca
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f241cf1b-3a6b-4e1a-b4f9-133c00dd95ca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via RUNDLL LAUNCHER. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*rundll32.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*shell32.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*shellexec_rundll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*powershell*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*rundll32.exe*'; data_win_eventdata_serviceFileName matches
  '*shell32.dll*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation RUNDLL LAUNCHER - Security detected on host $agent_name$.
    Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - rundll
    - windows_security
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_serviceFileName:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_serviceFileName:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND data_win_eventdata_serviceFileName:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd0f7229-d16f-42de-8fe3-fba365fbcb3a
    name: Invoke-Obfuscation Via Use Rundll32 - Security
    reason: Sibling Invoke-Obfuscation launcher in the same 4697 service-install telemetry; the same operator often tries several launcher styles, so a second variant confirms tooling rather than a one-off.
  - id: 2a926e6a-4b81-4011-8a96-e36cc8c04302
    name: PowerShell Scripts Installed as Services - Security
    reason: Same 4697 event with a PowerShell service binary; a broader match for the same service-based PowerShell execution/persistence technique.
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: Obfuscated rundll32/powershell service installs are a common C2 privilege-escalation-to-SYSTEM step; this confirms getsystem-style named-pipe services from the same framework.
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Cobalt Strike psexec/jump services embed obfuscated PowerShell launchers in the service binary path, matching this alert's service-install vector.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: If the service was installed remotely over SMB, this identifies the lateral-movement mechanism delivering the obfuscated launcher.
  - id: e6cb92b4-b470-4eb8-8a9d-d63e8583aae0
    name: Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell
    reason: Script-block view of the same launcher when the service starts powershell; confirms the decoded payload actually executed after the 4697 install.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The sc.exe/New-Service process that created the service is the parent action of the 4697 event and reveals the creating process and its parent.
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Registry-level view (Services key ImagePath) of the same malicious service, useful when the 4697 event lacks detail or the service is later modified.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes of the rundll32/shell32 ShellExec_RunDLL launcher
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell launched from services.exe or with encoded/hidden arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(-[Ee][Nn][Cc]|-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] +[Hh]|-[Ww] +[Hh][Ii][Dd]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections from powershell/rundll32 (payload staging or C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Service installs (4697/7045) on this host
    query: (data_win_system_eventID:"4697" OR data_win_system_eventID:"7045")
    pivot_on:
    - host
    window: 6h
  - name: Logons by the installing account (remote/network service-install context)
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4672") AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10" OR data_win_system_eventID:"4672")
    pivot_on:
    - user
    window: 6h
