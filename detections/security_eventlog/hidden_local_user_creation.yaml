name: Hidden Local User Creation
id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
version: 1
schema_version: "1.0"
date: "2024-01-16"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a local hidden user account which should not happen
  for event ID 4720. MITRE ATT&CK: T1136.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4720"
        - wildcard:
            data_win_eventdata_targetUserName: "*$"
        - exists:
            field: "data_win_eventdata_targetUserName"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_targetUserName:
                    value: "HomeGroupUser$"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4720'; data_win_eventdata_targetUserName
  matches '*$'; data_win_eventdata_targetUserName equals 'HomeGroupUser$'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1387743867663958021
  - https://attack.mitre.org/techniques/T1136/001/

response:
  message: >
    Hidden Local User Creation detected on host $agent_name$. Matched
    data_win_eventdata_targetUserName: $data_win_eventdata_targetUserName$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1136.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: user
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - hidden
    - local
    - windows_security
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4720" AND data_win_eventdata_targetUserName:/.*\$/ AND _exists_:data_win_eventdata_targetUserName AND NOT (data_win_eventdata_targetUserName:/[Hh][Oo][Mm][Ee][Gg][Rr][Oo][Uu][Pp][Uu][Ss][Ee][Rr]\$/)

