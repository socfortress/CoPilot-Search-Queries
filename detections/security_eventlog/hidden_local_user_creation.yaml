name: Hidden Local User Creation
id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
version: 1
schema_version: "1.0"
date: "2024-01-16"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a local hidden user account which should not happen
  for event ID 4720. MITRE ATT&CK: T1136.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4720"
        - wildcard:
            data_win_eventdata_targetUserName: "*$"
        - exists:
            field: "data_win_eventdata_targetUserName"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_targetUserName:
                    value: "HomeGroupUser$"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4720'; data_win_eventdata_targetUserName
  matches '*$'; data_win_eventdata_targetUserName equals 'HomeGroupUser$'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1387743867663958021
  - https://attack.mitre.org/techniques/T1136/001/

response:
  message: >
    Hidden Local User Creation detected on host $agent_name$. Matched
    data_win_eventdata_targetUserName: $data_win_eventdata_targetUserName$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1136.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: user
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - hidden
    - local
    - windows_security
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4720" AND data_win_eventdata_targetUserName:/.*\$/ AND _exists_:data_win_eventdata_targetUserName AND NOT (data_win_eventdata_targetUserName:/[Hh][Oo][Mm][Ee][Gg][Rr][Oo][Uu][Pp][Uu][Ss][Ee][Rr]\$/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cfeed607-6aa4-4bbd-9627-b637deb723c8
    name: New or Renamed User Account with '$' Character
    reason: Same trailing-$ trick to mimic a machine account, seen as a rename or alternate creation event; confirms deliberate account hiding on the same host.
  - id: 460479f3-80b7-42da-9c43-2cc1d54dbccd
    name: Creation of a Local Hidden User Account by Registry
    reason: Registry-level creation of a hidden SAM user, the sibling technique to a $-named account; attackers often combine both to stay out of sight.
  - id: f8aebc67-a56d-4ec9-9fbe-7b0e8b7b4efd
    name: Hiding User Account Via SpecialAccounts Registry Key
    reason: 'Follow-on hardening step: the SpecialAccounts UserList value hides the new account from the logon screen.'
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Process-level view of the net user /add command that typically produces the 4720 event; reveals parent process and command line.
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: Creation plus admin grant in one command chain; a hidden account is created to be a privileged backdoor.
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: 'Immediate next step: the new hidden account is placed in Administrators (event 4732) to give it privileges.'
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: Hidden accounts are commonly given RDP access so the attacker can return interactively.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: 'Backdoor chain: after account creation attackers enable RDP and relax its settings to use the account remotely.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Net user/localgroup commands creating or elevating accounts
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*([Uu][Ss][Ee][Rr]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Aa][Cc][Tt][Ii][Vv][Ee]:[Yy][Ee][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry hiding of user accounts (SpecialAccounts / SAM Users)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:*SpecialAccounts* OR data_win_eventdata_targetObject:*SAM*Domains*Account*Users*)
    pivot_on:
    - host
    window: 2h
  - name: New account added to privileged local groups
    query: (data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4756") AND (data_win_eventdata_targetUserName:/.*([Aa]dministrators|[Rr]emote [Dd]esktop [Uu]sers).*/)
    pivot_on:
    - host
    window: 2h
  - name: RDP enablement and firewall opening on the host
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*fDenyTSConnections*) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*portopening* OR data_win_eventdata_commandLine:*fDenyTSConnections* OR data_win_eventdata_commandLine:*Remote*Desktop*))
    pivot_on:
    - host
    window: 4h
  - name: 'First use of the hidden account: logons and password resets'
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4722")
    pivot_on:
    - user
    window: 24h
