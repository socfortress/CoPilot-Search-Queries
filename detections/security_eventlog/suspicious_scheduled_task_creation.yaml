name: Suspicious Scheduled Task Creation
id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
version: 1
schema_version: "1.0"
date: "2022-12-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious scheduled task creation events. Based on attributes such as
  paths, commands line flags, etc. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4698"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\WINDOWS\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*C:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\Temporary Internet*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*C:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*C:\\\\Perflogs\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*regsvr32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*rundll32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*cmd.exe</Command>*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*cmd</Command>*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*<Arguments>/c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*<Arguments>/k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*<Arguments>/r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*pwsh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*mshta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*wscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*cscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*certutil*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*bitsadmin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*bash.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*bash *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*scrcons*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*wmic *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*wmic.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*forfiles*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*scriptrunner*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*hh.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskContent
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4698'; data_win_eventdata_taskContent matches
  '*\AppData\Local\Temp\*'; data_win_eventdata_taskContent matches
  '*\AppData\Roaming\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4698
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Suspicious Scheduled Task Creation detected on host $agent_name$. Matched
    data_win_eventdata_taskContent: $data_win_eventdata_taskContent$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskContent
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - scheduled
    - windows_security
    - execution
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4698" AND (data_win_eventdata_taskContent:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_taskContent:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_taskContent:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_taskContent:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_taskContent:/.*[Cc]:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_taskContent:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_taskContent:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_taskContent:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt].*/ OR data_win_eventdata_taskContent:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_taskContent:/.*[Cc]:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/) AND (data_win_eventdata_taskContent:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR data_win_eventdata_taskContent:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_taskContent:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]\<\/[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\>.*/ OR data_win_eventdata_taskContent:/.*[Cc][Mm][Dd]\<\/[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\>.*/ OR data_win_eventdata_taskContent:/.*\<[Aa][Rr][Gg][Uu][Mm][Ee][Nn][Tt][Ss]\>\/[Cc] .*/ OR data_win_eventdata_taskContent:/.*\<[Aa][Rr][Gg][Uu][Mm][Ee][Nn][Tt][Ss]\>\/[Kk] .*/ OR data_win_eventdata_taskContent:/.*\<[Aa][Rr][Gg][Uu][Mm][Ee][Nn][Tt][Ss]\>\/[Rr] .*/ OR data_win_eventdata_taskContent:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_taskContent:/.*[Pp][Ww][Ss][Hh].*/ OR data_win_eventdata_taskContent:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_taskContent:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_taskContent:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_taskContent:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_taskContent:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_taskContent:/.*[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_taskContent:/.*[Bb][Aa][Ss][Hh] .*/ OR data_win_eventdata_taskContent:/.*[Ss][Cc][Rr][Cc][Oo][Nn][Ss].*/ OR data_win_eventdata_taskContent:/.*[Ww][Mm][Ii][Cc] .*/ OR data_win_eventdata_taskContent:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_taskContent:/.*[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_taskContent:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_taskContent:/.*[Hh][Hh]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Process-creation view of the same schtasks /create with a staging-path or env-variable payload; confirms which process and parent registered the 4698 task.
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Same task registration seen on the command line carrying shell/LOLBin chains; corroborates the LOLBin-in-taskContent half of the 4698 match.
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Co-occurring schtasks creation whose action points into Temp, the same staging path as the 4698 content.
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: Co-occurring creation of a task pointing at user-writable AppData, matching the Roaming/Local Temp branch of the 4698 rule.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: 'Schtasks launched from a user-writable folder is the precursor: a dropped binary registering its own persistence.'
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: 'Follow-on privilege angle: the malicious task runs as SYSTEM, turning persistence into privilege escalation.'
  - id: windows-scheduled-task-created-spawn-shell-001
    name: Windows Scheduled Task Created to Spawn Shell
    reason: Alternate telemetry for a task whose action spawns cmd/PowerShell, the shell-spawning branch of this rule.
  - id: windows-scheduled-task-created-public-path-001
    name: Windows Scheduled Task Created Within Public Path
    reason: Same task registration with payload under Users Public, a staging path this rule also matches.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: schtasks.exe task registration process
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*/[Xx][Mm][Ll].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Task scheduler host spawning shells/LOLBins or staged payloads
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Tt][Aa][Ss][Kk][Ee][Nn][Gg]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 24h
  - name: Executable/script payload dropped in staging path
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1.*/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Network/DNS from LOLBins or staged binaries (C2 beacon)
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/))
    pivot_on:
    - host
    window: 6h
  - name: 'Redundant persistence: Run keys, services, task deletion'
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/)) OR data_win_system_eventID:"4697" OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4699"
    pivot_on:
    - host
    window: 4h
