name: Processes Accessing the Microphone and Webcam
id: 8cd538a4-62d5-4e83-810b-12d41e428d6e
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8cd538a4-62d5-4e83-810b-12d41e428d6e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Potential adversaries accessing the microphone and webcam in an endpoint.
  MITRE ATT&CK: T1123.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4657"
              - term:
                  data_win_system_eventID: "4656"
              - term:
                  data_win_system_eventID: "4663"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\CapabilityAccessManager\\\\ConsentStore\\\\microphone\\\\NonPackaged*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\CapabilityAccessManager\\\\ConsentStore\\\\webcam\\\\NonPackaged*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4657'; data_win_system_eventID equals '4656';
  data_win_system_eventID equals '4663', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/duzvik/status/1269671601852813320
  - https://medium.com/@7a616368/can-you-track-processes-accessing-the-camera-and-microphone-7e6885b37072
  - https://attack.mitre.org/techniques/T1123/

response:
  message: >
    Processes Accessing the Microphone and Webcam detected on host $agent_name$.
    Matched data_win_eventdata_objectName: $data_win_eventdata_objectName$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1123
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1123
  custom_tags:
    - accessing
    - microphone
    - webcam
    - windows_security
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4657" OR data_win_system_eventID:"4656" OR data_win_system_eventID:"4663") AND (data_win_eventdata_objectName:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Cc][Aa][Pp][Aa][Bb][Ii][Ll][Ii][Tt][Yy][Aa][Cc][Cc][Ee][Ss][Ss][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt][Ss][Tt][Oo][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Pp][Hh][Oo][Nn][Ee]\\[Nn][Oo][Nn][Pp][Aa][Cc][Kk][Aa][Gg][Ee][Dd].*/ OR data_win_eventdata_objectName:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Cc][Aa][Pp][Aa][Bb][Ii][Ll][Ii][Tt][Yy][Aa][Cc][Cc][Ee][Ss][Ss][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt][Ss][Tt][Oo][Rr][Ee]\\[Ww][Ee][Bb][Cc][Aa][Mm]\\[Nn][Oo][Nn][Pp][Aa][Cc][Kk][Aa][Gg][Ee][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62120148-6b7a-42be-8b91-271c04e281a3
    name: Suspicious Camera and Microphone Access
    reason: Sysmon registry-side view of the same CapabilityAccessManager ConsentStore NonPackaged writes; confirms which process image touched the mic/webcam consent keys.
  - id: 932fb0d8-692b-4b0f-a26e-5643a50fe7d6
    name: Audio Capture via PowerShell
    reason: Scripted microphone recording is the usual way the mic access this rule sees is actually exercised.
  - id: 83865853-59aa-449e-9600-74b9d89a6d6e
    name: Audio Capture via SoundRecorder
    reason: Built-in SoundRecorder launched by an attacker/RAT produces the same device-consent access and is a co-occurring audio collection method.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: 'Surveillance tooling is typically combined: screen recording alongside mic/webcam capture on the same host under the same user.'
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Clipboard harvesting is a co-occurring input-collection behaviour in spyware/RAT sessions that also record mic/webcam.
  - id: 2f3039c8-e8fe-43a9-b5cf-dcd424a2522d
    name: File Creation Related To RAT Clients
    reason: RAT client artifacts dropped earlier are the most likely process behind non-packaged mic/webcam access.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Remote access tooling installed beforehand gives an operator interactive control and device access, explaining the mic/webcam use.
  - id: 0bcfabcb-7929-47f4-93d6-b33fb67d34d1
    name: Adwind RAT / JRAT File Artifact
    reason: Adwind/JRAT includes webcam and microphone capture modules; its file artifacts on the host would be the precursor.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mic/webcam consent-store registry writes by process
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]apability[Aa]ccess[Mm]anager.*[Cc]onsent[Ss]tore.*([Mm]icrophone|[Ww]eb[Cc]am).*/
    pivot_on:
    - host
    window: 1h
  - name: Audio/video recording tooling or capture APIs launched
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ff][Ff][Mm][Pp][Ee][Gg]|\\[Ss][Oo][Uu][Nn][Dd][Rr][Ee][Cc][Oo][Rr][Dd][Ee][Rr]|\\[Pp][Ss][Rr]|\\[Dd][Xx][Cc][Aa][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ww][Ii][Nn][Mm][Mm]|[Mm][Cc][Ii][Ss][Ee][Nn][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Ss][Hh][Oo][Ww]|[Vv][Ii][Dd][Ee][Oo][Cc][Aa][Pp]|[Aa][Uu][Dd][Ii][Oo][Cc][Aa][Pp]|[Rr][Ee][Cc][Oo][Rr][Dd]).*/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ww][Ii][Nn][Mm][Mm]|[Mm][Cc][Ii][Ss][Ee][Nn][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Aa][Vv][Ii][Cc][Aa][Pp]|[Cc][Aa][Pp][Cc][Rr][Ee][Aa][Tt][Ee]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Recorded media files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ww][Aa][Vv]|[Mm][Pp][3]|[Mm][Pp][4]|[Mm][Kk][Vv]|[Aa][Vv][Ii]|[Ww][Mm][Aa]|[Mm][4][Aa]|[Jj][Pp][Ee]?[Gg])/ AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Aa]pp[Dd]ata|[Pp]ublic|[Pp]rogram[Dd]ata).*/
    pivot_on:
    - host
    window: 2h
  - name: Remote access / RAT tool execution on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|\\[Cc][Ll][Ii][Ee][Nn][Tt]32|\\[Uu][Ll][Tt][Rr][Aa][Vv][Nn][Cc]|\\[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|\\[Rr][Uu][Tt][Cc][Ss][Rr][Vv]|\\[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|\\[Aa][Ll][Ll][Aa][Ss]).*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
  - name: Archive or outbound-transfer tooling after capture
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\7[Zz]|\\[Rr][Aa][Rr]|\\[Ww][Ii][Nn][Rr][Aa][Rr]|\\[Rr][Cc][Ll][Oo][Nn][Ee]|\\[Cc][Uu][Rr][Ll]|\\[Ww][Ii][Nn][Ss][Cc][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Uu][Pp][Ll][Oo][Aa][Dd]).*/)
    pivot_on:
    - host
    window: 2h
