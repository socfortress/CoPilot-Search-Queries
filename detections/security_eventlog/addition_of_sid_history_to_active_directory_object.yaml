name: Addition of SID History to Active Directory Object
id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
version: 1
schema_version: "1.0"
date: "2017-02-19"
author: Thomas Patzke, @atc_project (improvements)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  An attacker can use the SID history attribute to gain additional privileges.
  MITRE ATT&CK: T1134.005.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4765"
              - term:
                  data_win_system_eventID: "4766"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4738"
                    - exists:
                        field: "data_win_eventdata_sidHistory"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_sidHistory: "-"
                                - term:
                                    data_win_eventdata_sidHistory: "%%1793"
                              minimum_should_match: 1
                    - bool:
                        must_not:
                          - bool:
                              must_not:
                                - exists:
                                    field: "data_win_eventdata_sidHistory"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sidHistory
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4765'; data_win_system_eventID equals '4766';
  data_win_system_eventID equals '4738', among other conditions.

known_false_positives: >
  Migration of an account into a new domain. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://adsecurity.org/?p=1772
  - https://attack.mitre.org/techniques/T1134/005/

response:
  message: >
    Addition of SID History to Active Directory Object detected on host
    $agent_name$. Matched data_win_eventdata_sidHistory:
    $data_win_eventdata_sidHistory$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1134.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_sidHistory
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.005
  custom_tags:
    - addition
    - history
    - active
    - windows_security
    - persistence
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4765" OR data_win_system_eventID:"4766" OR (data_win_system_eventID:"4738" AND _exists_:data_win_eventdata_sidHistory AND NOT (data_win_eventdata_sidHistory:"-" OR data_win_eventdata_sidHistory:"%%1793") AND NOT (NOT _exists_:data_win_eventdata_sidHistory)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: SID history injection (mimikatz sid::patch / lsadump::dcshadow) is usually staged by an actor already holding replication rights; DCSync is the preceding step that yielded the krbtgt/admin hashes.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Directory replication by a user account precedes SID-history abuse (credential harvest) or follows it using the newly privileged identity.
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: Granting DS-Replication rights is an alternate AD persistence path used alongside SID history to keep domain-admin-equivalent access.
  - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
    name: Active Directory User Backdoors
    reason: SID history is one of several AD user-object backdoors (altered sidHistory/msDS-AllowedToDelegateTo/SPN); these co-occur when an attacker plants persistence on accounts.
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: Enumeration of Domain/Enterprise Admins SIDs precedes choosing which privileged SID to inject into sidHistory.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: sid::add / sid::patch and misc::skeleton are Mimikatz modules performing the 4738 sidHistory write on a DC.
  - id: 10fb649c-3600-4d37-b1e6-56ea90bb7e09
    name: User Added To Highly Privileged Group
    reason: Direct group-membership escalation commonly accompanies or substitutes for the sidHistory grant on the same account.
  - id: 0255a820-e564-4e40-af2b-6ac61160335c
    name: A New Trust Was Created To A Domain
    reason: Cross-domain/forest SID history abuse often rides on a newly created trust with SID filtering disabled.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mimikatz SID/DCShadow/DCSync module use on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*sid\:\:patch* OR data_win_eventdata_commandLine:*sid\:\:add* OR data_win_eventdata_commandLine:*lsadump\:\:dcsync* OR data_win_eventdata_commandLine:*lsadump\:\:dcshadow* OR data_win_eventdata_commandLine:*misc\:\:skeleton* OR data_win_eventdata_commandLine:*privilege\:\:debug* OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell AD cmdlets writing SIDHistory
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*SIDHistory* OR data_win_eventdata_scriptBlockText:*Add-ADDBSidHistory* OR data_win_eventdata_scriptBlockText:*DsAddSidHistory* OR data_win_eventdata_scriptBlockText:*Set-ADUser* OR data_win_eventdata_scriptBlockText:*Set-ADObject*)
    pivot_on:
    - host
    window: 2h
  - name: Account, group and privileged-group changes by this actor
    query: (data_win_system_eventID:"4720" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4735" OR data_win_system_eventID:"4738" OR data_win_system_eventID:"4742" OR data_win_system_eventID:"4724")
    pivot_on:
    - user
    window: 6h
  - name: Special-privilege and explicit-credential logons by this actor
    query: (data_win_system_eventID:"4672" OR data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")))
    pivot_on:
    - user
    window: 6h
  - name: Directory replication and Kerberos ticket requests following SID history change
    query: (data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa* OR data_win_eventdata_properties:*1131f6ad* OR data_win_eventdata_properties:*89e95b76*)) OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4768"
    pivot_on:
    - host
    window: 6h
