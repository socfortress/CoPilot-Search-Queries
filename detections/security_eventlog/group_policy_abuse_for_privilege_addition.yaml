name: Group Policy Abuse for Privilege Addition
id: 1c480e10-7ee1-46d4-8ed2-85f9789e3ce4
version: 1
schema_version: "1.0"
date: "2024-09-04"
author: Elastic, Josh Nickels, Marius Rothenbücher
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1c480e10-7ee1-46d4-8ed2-85f9789e3ce4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the first occurrence of a modification to Group Policy Object
  Attributes to add privileges to user accounts or use them to add users as
  local admins. MITRE ATT&CK: T1484.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5136"
        - term:
            data_win_eventdata_attributeLDAPDisplayName:
              value: "gPCMachineExtensionNames"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_attributeValue:
                    value: "*827D319E-6EAC-11D2-A4EA-00C04F79F83A*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_attributeValue:
                    value: "*803E14A0-B4FB-11D0-A0D0-00A0C90F574B*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_attributeValue
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136';
  data_win_eventdata_attributeLDAPDisplayName equals 'gPCMachineExtensionNames';
  data_win_eventdata_attributeValue matches
  '*827D319E-6EAC-11D2-A4EA-00C04F79F83A*', among other conditions.

known_false_positives: >
  Users allowed to perform these modifications (user found in field
  SubjectUserName). Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/group-policy-abuse-for-privilege-addition.html#_setup_275
  - https://attack.mitre.org/techniques/T1484/001/

response:
  message: >
    Group Policy Abuse for Privilege Addition detected on host $agent_name$.
    Matched data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. Matched
    data_win_eventdata_attributeValue: $data_win_eventdata_attributeValue$.
    MITRE ATT&CK: T1484.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other
    - field: data_win_eventdata_attributeValue
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1484.001
  custom_tags:
    - group
    - policy
    - abuse
    - windows_security
    - privilege_escalation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Gg][Pp][Cc][Mm][Aa][Cc][Hh][Ii][Nn][Ee][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Nn][Aa][Mm][Ee][Ss]/ AND (data_win_eventdata_attributeValue:/.*827[Dd]319[Ee]-6[Ee][Aa][Cc]-11[Dd]2-[Aa]4[Ee][Aa]-00[Cc]04[Ff]79[Ff]83[Aa].*/ OR data_win_eventdata_attributeValue:/.*803[Ee]14[Aa]0-[Bb]4[Ff][Bb]-11[Dd]0-[Aa]0[Dd]0-00[Aa]0[Cc]90[Ff]574[Bb].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 311b6ce2-7890-4383-a8c2-663a9f6b43cd
    name: Enabled User Right in AD to Control User Objects
    reason: Both abuse AD/GPO-delegated rights to grant an attacker control; a right granted on the domain often accompanies the GPO privilege edit and shows the same actor widening access.
  - id: e5ac86dd-2da1-454b-be74-05d26c769d7d
    name: Windows Default Domain GPO Modification
    reason: Same actor editing the Default Domain (Controllers) Policy is the usual vehicle for the Security Settings extension change this rule fires on.
  - id: dcff7e85-d01f-4eb5-badd-84e2e6be8294
    name: Windows Default Domain GPO Modification via GPME
    reason: Interactive GPO editing via gpme.msc on a default GPO is the process-level precursor to the 5136 attribute write for privilege rights.
  - id: ada4b0c4-758b-46ac-9033-9004613a150d
    name: Modify Group Policy Settings
    reason: Command-line/registry GPO modification on the host is the tooling-side counterpart of the directory-side GPO change.
  - id: a8f29a7b-b137-4446-80a0-b804272f3da2
    name: Persistence and Execution at Scale via GPO Scheduled Task
    reason: After granting privileges via GPO, attackers push a GPO scheduled task to execute payloads across every host the GPO applies to.
  - id: 123e4e6d-b123-48f8-b261-7214938acaf0
    name: Startup/Logon Script Added to Group Policy Object
    reason: 'Co-occurring GPO weaponization: privileges granted plus a startup/logon script gives mass code execution under elevated rights.'
  - id: 5f87308a-0a5b-4623-ae15-d8fa1809bc60
    name: Suspicious Files in Default GPO Folder
    reason: Payloads or modified GptTmpl.inf dropped in the default GPO SYSVOL folder are the file-level evidence of the same GPO tampering.
  - id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
    name: Suspicious SYSVOL Domain Group Policy Access
    reason: Reading or editing GPO files in SYSVOL by a non-standard process precedes or accompanies the policy attribute change.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GPO-related directory object changes by this account
    query: (data_win_system_eventID:"5136" OR data_win_system_eventID:"5137" OR data_win_system_eventID:"5141") AND (data_win_eventdata_objectClass:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr].*/ OR data_win_eventdata_attributeLDAPDisplayName:/.*[Gg][Pp][Cc].*/)
    pivot_on:
    - user
    window: 6h
  - name: Privileged group membership and user-right assignment changes
    query: data_win_system_eventID:("4728" OR "4732" OR "4756" OR "4704" OR "4670" OR "4739")
    pivot_on:
    - user
    window: 6h
  - name: Special-privilege logons and new logons by this account
    query: data_win_system_eventID:("4672" OR "4624") AND NOT data_win_eventdata_logonType:"5"
    pivot_on:
    - user
    window: 24h
  - name: SYSVOL / policy file share access
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_relativeTargetName:/.*([Gg][Pp][Tt][Tt][Mm][Pp][Ll]\.[Ii][Nn][Ff]|[Ss][Cc][Rr][Ii][Pp][Tt][Ss]|[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]).*/ OR data_win_eventdata_shareName:/.*[Ss][Yy][Ss][Vv][Oo][Ll].*/)
    pivot_on:
    - user
    window: 6h
  - name: Policy refresh and privileged tool execution on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]|\\[Ss][Ee][Cc][Ee][Dd][Ii][Tt]).*/ OR data_win_eventdata_commandLine:/.*([Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]|[Ss][Ee][Cc][Ed][Ii][Tt]|[Nn][Ee][Tt] +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]|[Nn][Ee][Tt] +[Gg][Rr][Oo][Uu][Pp]).*/)
    pivot_on:
    - host
    window: 4h
