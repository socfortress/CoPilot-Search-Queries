name: SCM Database Handle Failure
id: 13addce7-47b2-4ca0-a98f-1de964d1d669
version: 1
schema_version: "1.0"
date: "2022-07-11"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 13addce7-47b2-4ca0-a98f-1de964d1d669
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects non-system users failing to get a handle of the SCM database. MITRE
  ATT&CK: T1010.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4656"
        - term:
            data_win_eventdata_objectType:
              value: "SC_MANAGER OBJECT"
              case_insensitive: true
        - term:
            data_win_eventdata_objectName:
              value: "ServicesActive"
              case_insensitive: true
        - term:
            data_win_eventdata_accessMask:
              value: "0xf003f"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_subjectLogonId"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_subjectLogonId:
                    value: "0x3e4"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_accessMask
    - data_win_eventdata_subjectLogonId
    - data_win_eventdata_subjectUserName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_eventdata_objectType equals
  'SC_MANAGER OBJECT'; data_win_eventdata_objectName equals 'ServicesActive',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190826-RemoteSCMHandle/notebook.html
  - https://attack.mitre.org/techniques/T1010/

response:
  message: >
    SCM Database Handle Failure detected on host $agent_name$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. MITRE
    ATT&CK: T1010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1010
  custom_tags:
    - database
    - handle
    - failure
    - windows_security
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4656" AND data_win_eventdata_objectType:/[Ss][Cc]_[Mm][Aa][Nn][Aa][Gg][Ee][Rr] [Oo][Bb][Jj][Ee][Cc][Tt]/ AND data_win_eventdata_objectName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss][Aa][Cc][Tt][Ii][Vv][Ee]/ AND data_win_eventdata_accessMask:/0[Xx][Ff]003[Ff]/ AND _exists_:data_win_eventdata_subjectLogonId AND NOT (data_win_eventdata_subjectLogonId:/0[Xx]3[Ee]4/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
