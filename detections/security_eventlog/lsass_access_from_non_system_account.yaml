name: LSASS Access From Non System Account
id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential mimikatz-like tools accessing LSASS from non system account.
  MITRE ATT&CK: T1003.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4663"
              - term:
                  data_win_system_eventID: "4656"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x100000"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1010"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1400"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1410"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1418"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1438"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x143a"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1f0fff"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1f1fff"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1f2fff"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x1f3fff"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "0x40"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "143a"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "1f0fff"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "1f1fff"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "1f2fff"
                    case_insensitive: true
              - term:
                  data_win_eventdata_accessMask:
                    value: "1f3fff"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_objectType:
              value: "Process"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - exists:
            field: "data_win_eventdata_processName"
        - exists:
            field: "data_win_eventdata_accessMask"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_subjectUserName: "*$"
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_processName:
                                value: "C:\\Windows\\System32\\wbem\\WmiPrvSE.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_accessMask:
                                value: "0x1410"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\SteamLibrary\\\\steamapps\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_accessMask
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_processName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4663'; data_win_system_eventID equals '4656';
  data_win_eventdata_accessMask equals '0x100000', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/170105-LSASSMemoryReadAccess/notebook.html
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Access From Non System Account detected on host $agent_name$. Matched
    data_win_eventdata_accessMask: $data_win_eventdata_accessMask$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. MITRE
    ATT&CK: T1003.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_accessMask
      type: other
    - field: data_win_eventdata_objectType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - system
    - account
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4663" OR data_win_system_eventID:"4656") AND (data_win_eventdata_accessMask:/0[Xx]100000/ OR data_win_eventdata_accessMask:/0[Xx]1010/ OR data_win_eventdata_accessMask:/0[Xx]1400/ OR data_win_eventdata_accessMask:/0[Xx]1410/ OR data_win_eventdata_accessMask:/0[Xx]1418/ OR data_win_eventdata_accessMask:/0[Xx]1438/ OR data_win_eventdata_accessMask:/0[Xx]143[Aa]/ OR data_win_eventdata_accessMask:/0[Xx]1[Ff]0[Ff][Ff][Ff]/ OR data_win_eventdata_accessMask:/0[Xx]1[Ff]1[Ff][Ff][Ff]/ OR data_win_eventdata_accessMask:/0[Xx]1[Ff]2[Ff][Ff][Ff]/ OR data_win_eventdata_accessMask:/0[Xx]1[Ff]3[Ff][Ff][Ff]/ OR data_win_eventdata_accessMask:/0[Xx]40/ OR data_win_eventdata_accessMask:/143[Aa]/ OR data_win_eventdata_accessMask:/1[Ff]0[Ff][Ff][Ff]/ OR data_win_eventdata_accessMask:/1[Ff]1[Ff][Ff][Ff]/ OR data_win_eventdata_accessMask:/1[Ff]2[Ff][Ff][Ff]/ OR data_win_eventdata_accessMask:/1[Ff]3[Ff][Ff][Ff]/) AND data_win_eventdata_objectType:/[Pp][Rr][Oo][Cc][Ee][Ss][Ss]/ AND data_win_eventdata_objectName:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_subjectUserName AND _exists_:data_win_eventdata_processName AND _exists_:data_win_eventdata_accessMask AND NOT (data_win_eventdata_subjectUserName:/.*\$/ OR data_win_eventdata_processName:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_processName:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/ OR (data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_accessMask:/0[Xx]1410/)) AND _exists_:data_win_eventdata_processName AND NOT (data_win_eventdata_processName:/.*\\[Ss][Tt][Ee][Aa][Mm][Ll][Ii][Bb][Rr][Aa][Rr][Yy]\\[Ss][Tt][Ee][Aa][Mm][Aa][Pp][Pp][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Sysmon EID 10 view of the same LSASS handle open; confirms the Security 4656/4663 hit and names the SourceImage and GrantedAccess
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Same dump-capable access masks (0x1010/0x1410/0x1fffff) seen from the process-access side, ruling out benign handle opens
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The rule describes mimikatz-like access; the tool itself launching just before the handle open is the direct cause
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: rundll32 comsvcs.dll MiniDump is a living-off-the-land way to produce the same non-system LSASS read access
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: procdump -ma lsass is a common cause of the 0x1fffff/0x1410 access mask and precedes a dump file on disk
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Follow-on artefact: a successful LSASS read is typically written to a lsass .dmp file that is then staged for exfiltration'
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: Alternative credential theft inside LSASS (SSP or injected DLL) by the same actor when direct dumping is blocked
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: If a privileged credential was harvested from LSASS on a server, DCSync is the usual escalation to the domain's secrets
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential dumping tools and LSASS-targeting commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp](64)?|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss]|[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Sysmon process access to lsass.exe with dump-capable rights
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1[0-9A-Fa-f]{3}/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][0-3][Ff][Ff][Ff]/ OR data_win_eventdata_grantedAccess:/0[Xx]40/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS dump and credential-store files created on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*lsass*.dmp OR data_win_eventdata_targetFilename:*lsass*.zip OR data_win_eventdata_targetFilename:*.kirbi OR data_win_eventdata_targetFilename:*ntds.dit* OR data_win_eventdata_targetFilename:*\\config\\SAM*)
    pivot_on:
    - host
    window: 2h
  - name: Network and explicit-credential logons by the account behind the LSASS access
    query: (data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")))
    pivot_on:
    - user
    window: 6h
  - name: Lateral movement tooling launched from this host after credential access
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Ii][Nn][Rr][Ss]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*\\\\*) OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 2h
