name: Hacktool Ruler
id: 24549159-ac1b-479c-8175-d42aea947cae
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 24549159-ac1b-479c-8175-d42aea947cae
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This events that are generated when using the hacktool Ruler by Sensepost.
  MITRE ATT&CK: T1087, T1114, T1059, T1550.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4776"
                    - term:
                        data_win_eventdata_workstation:
                          value: "RULER"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_system_eventID: "4624"
                          - term:
                              data_win_system_eventID: "4625"
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_workstationName:
                          value: "RULER"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_workstation
    - data_win_eventdata_workstationName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4776'; data_win_eventdata_workstation equals
  'RULER'; data_win_system_eventID equals '4624', among other conditions.

known_false_positives: >
  Go utilities that use staaldraad awesome NTLM library. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/sensepost/ruler
  - https://github.com/sensepost/ruler/issues/47
  - https://github.com/staaldraad/go-ntlm/blob/cd032d41aa8ce5751c07cb7945400c0f5c81e2eb/ntlm/ntlmv1.go#L427
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4776
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4624
  - https://attack.mitre.org/techniques/T1087/
  - https://attack.mitre.org/techniques/T1114/
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1550/002/

response:
  message: >
    Hacktool Ruler detected on host $agent_name$. Matched
    data_win_eventdata_workstation: $data_win_eventdata_workstation$. Matched
    data_win_eventdata_workstationName: $data_win_eventdata_workstationName$.
    MITRE ATT&CK: T1087, T1114, T1059, T1550.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_workstation
      type: other
    - field: data_win_eventdata_workstationName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087
    - T1114
    - T1059
    - T1550.002
  custom_tags:
    - hacktool
    - ruler
    - windows_security
    - discovery
    - execution
    - collection
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"4776" AND data_win_eventdata_workstation:/[Rr][Uu][Ll][Ee][Rr]/) OR ((data_win_system_eventID:"4624" OR data_win_system_eventID:"4625") AND data_win_eventdata_workstationName:/[Rr][Uu][Ll][Ee][Rr]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08
    name: Outlook EnableUnsafeClientMailRules Setting Enabled - Registry
    reason: Ruler's rule-based shell needs client mail rules that run applications; enabling this setting is the prerequisite/follow-on of Ruler's rules mode
  - id: c3edc6a5-d9d4-48d8-930e-aab518390917
    name: Potential Persistence Via Outlook Form
    reason: Ruler's form mode plants a malicious Outlook form (VBScript) for persistence/execution once the mailbox is compromised
  - id: fedb49c4-4bd7-4d42-8fd9-f8c8538c73c4
    name: Windows InProcServer32 New Outlook Form
    reason: Registry side of a newly registered Outlook form, the artifact left behind by Ruler form deployment on a workstation
  - id: ddd171b5-2cc6-4975-9e78-f0eccd08cc76
    name: Potential Persistence Via Outlook Home Page
    reason: Ruler's homepage mode abuses the Outlook folder home page for code execution after mailbox access via stolen NTLM creds
  - id: 487bb375-12ef-41f6-baae-c6a1572b4dd1
    name: Potential Persistence Via Outlook Today Page
    reason: Outlook Today page hijack is a sibling Outlook persistence technique used after credential-based mailbox compromise
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Triggered payloads from Ruler rules/forms/homepages execute as children of OUTLOOK.EXE
  - id: e212d415-0e93-435f-9e1a-f29005bb4723
    name: Suspicious Remote Child Process From Outlook
    reason: Ruler rules can launch a payload from a WebDAV/UNC path, giving an Outlook child process loaded from a remote share
  - id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
    name: New Outlook Macro Created
    reason: VbaProject.OTM creation is another Outlook code-execution persistence path an attacker with mailbox access can use after Ruler
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Logons and NTLM validations from the RULER workstation or by this account
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4776" OR data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 6h
  - name: Failed logons / NTLM validation failures indicating password spraying
    query: (data_win_system_eventID:"4625" OR (data_win_system_eventID:"4776" AND data_win_eventdata_status:/0xc000006[ad]/))
    pivot_on:
    - ip
    window: 4h
  - name: Outlook spawning child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Mm][Ss][Hh][Tt][Aa]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Outlook rule/form/homepage/macro persistence registry and file changes
    query: ((data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(EnableUnsafeClientMailRules|\\Outlook\\WebView\\|\\Outlook\\Today|LoadMacroProviderOnBoot).*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Vv][Bb][Aa][Pp][Rr][Oo][Jj][Ee][Cc][Tt]\.[Oo][Tt][Mm]|\.[Oo][Fo][Tt]|\\[Oo]utlook\\.*\.[Ff][Oo][Rr][Mm]).*/))
    pivot_on:
    - host
    window: 6h
  - name: Outbound network connections by Outlook to non-Exchange or WebDAV endpoints
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"8080")
    pivot_on:
    - host
    window: 6h
