name: OilRig APT Schedule Task Persistence - Security
id: c0580559-a6bd-4ef6-b9b7-83703d98b561
version: 1
schema_version: "1.0"
date: "2023-03-08"
author: Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c0580559-a6bd-4ef6-b9b7-83703d98b561
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects OilRig schedule task persistence as reported by Nyotron in their March
  2018 report. MITRE ATT&CK: T1053.005, T1543.003, T1112, T1071.004.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4698"
        - bool:
            should:
              - term:
                  data_win_eventdata_taskName:
                    value: "SC Scheduled Scan"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "UpdatMachine"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4698'; data_win_eventdata_taskName equals 'SC
  Scheduled Scan'; data_win_eventdata_taskName equals 'UpdatMachine'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20180402134442/https://nyotron.com/wp-content/uploads/2018/03/Nyotron-OilRig-Malware-Report-March-2018C.pdf
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1071/004/

response:
  message: >
    OilRig APT Schedule Task Persistence - Security detected on host
    $agent_name$. Matched data_win_eventdata_taskName:
    $data_win_eventdata_taskName$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1053.005, T1543.003,
    T1112, T1071.004
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_taskName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1543.003
    - T1112
    - T1071.004
  custom_tags:
    - oilrig
    - schedule
    - persistence
    - windows_security
    - privilege_escalation
    - execution
    - defense_impairment
    - g0049
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4698" AND (data_win_eventdata_taskName:/[Ss][Cc] [Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd] [Ss][Cc][Aa][Nn]/ OR data_win_eventdata_taskName:/[Uu][Pp][Dd][Aa][Tt][Mm][Aa][Cc][Hh][Ii][Nn][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ce6e34ca-966d-41c9-8d93-5b06c8b97a06
    name: OilRig APT Activity
    reason: 'Same OilRig toolset: the Nyotron report covers both the task creation (4698) and the schtasks/cmd process-creation side, so the process-level creation of the same task confirms the 4698 event.'
  - id: 7bdf2a7c-3acc-4091-9581-0a77dad1c5b5
    name: OilRig APT Registry Persistence
    reason: Same OilRig campaign pairs the scheduled task with registry persistence/config changes (T1112); both on one host means layered persistence rather than a one-off task.
  - id: f6de6525-4509-495a-8a82-1f8b0ed73a00
    name: Remote Task Creation via ATSVC Named Pipe
    reason: If the task was created remotely over the atsvc pipe, the 4698 is lateral movement/remote persistence, so this identifies the source host and actor.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: OilRig tasks run as SYSTEM; schtasks /ru SYSTEM is the command-line counterpart of the task registered in the 4698 event.
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Creating the task writes its XML definition under System32\Tasks, so a file-creation hit corroborates the task from the file side, including tasks added by tools that bypass schtasks.exe.
  - id: 3b8e5084-4de9-449a-a40d-0e11014f2e2d
    name: Diamond Sleet APT Scheduled Task Creation
    reason: Sibling 4698-based detection for a different APT; both firing on one host points to multiple actors or a shared tooling path.
  - id: 8fa65166-f463-4fd2-ad4f-1436133c52e1
    name: Scheduled Tasks Names Used By SVR For GraphicalProton Backdoor
    reason: Also a 4698 task-name match for known malicious task names, so multiple known-bad task names on the host indicate a broader implant set.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: schtasks/at creating or running OilRig-named tasks
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Aa][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:*Scheduled\ Scan* OR data_win_eventdata_commandLine:*UpdatMachine* OR data_win_eventdata_commandLine:*\/create* OR data_win_eventdata_commandLine:*\/ru\ SYSTEM*)
    pivot_on:
    - host
    window: 2h
  - name: Script interpreters launched by Task Scheduler (payload execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:*Schedule* AND (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Cc][Mm][Dd]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Payload files dropped to ProgramData/Temp/Public (script or exe)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|\\[Tt][Ee][Mm][Pp]|\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]).*\.([Vv][Bb][Ss]|[Pp][Ss]1|[Bb][Aa][Tt]|[Jj][Ss]|[Ee][Xx][Ee]|[Dd][Ll][Ll])/
    pivot_on:
    - host
    window: 2h
  - name: DNS tunnelling / C2 over DNS (nslookup or high-entropy TXT queries)
    query: (data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]|\\[Cc][Mm][Dd])\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp].*-([Tt][Yy][Pp][Ee]|[Qq][Uu][Ee][Rr][Yy][Tt][Yy][Pp][Ee])=?[Tt][Xx][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry persistence and config changes (Run keys, services)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*(\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\|\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee]\\[Tt][Aa][Ss][Kk][Cc][Aa][Cc][Hh][Ee]).*/
    pivot_on:
    - host
    window: 2h
