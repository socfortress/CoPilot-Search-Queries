name: Potential AS-REP Roasting via Kerberos TGT Requests
id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
version: 1
schema_version: "1.0"
date: "2025-07-04"
author: ANosir
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious Kerberos TGT requests with pre-authentication disabled
  (Pre-Authentication Type = 0) and Ticket Encryption Type (0x17) i.e, RC4-HMAC.
  This may indicate an AS-REP Roasting attack, where attackers request AS-REP
  messages for accounts without pre-authentication and attempt to crack the
  encrypted ticket offline to recover user passwords.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4768"
        - term:
            data_win_eventdata_ticketEncryptionType:
              value: "0x17"
              case_insensitive: true
        - term:
            data_win_eventdata_serviceName:
              value: "krbtgt"
              case_insensitive: true
        - term:
            data_win_eventdata_preAuthType: "0"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_ticketEncryptionType
    - data_win_eventdata_serviceName
    - data_win_eventdata_preAuthType
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4768'; data_win_eventdata_ticketEncryptionType
  equals '0x17'; data_win_eventdata_serviceName equals 'krbtgt', among other
  conditions.

known_false_positives: >
  Legacy systems or applications that legitimately use RC4 encryption.
  Misconfigured accounts with pre-authentication disabled. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://medium.com/system-weakness/detecting-as-rep-roasting-attacks-b5b3965f9714
  - https://www.picussecurity.com/resource/blog/as-rep-roasting-attack-explained-mitre-attack-t1558.004

response:
  message: >
    Potential AS-REP Roasting via Kerberos TGT Requests detected on host
    $agent_name$. Matched data_win_eventdata_ticketEncryptionType:
    $data_win_eventdata_ticketEncryptionType$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_ticketEncryptionType
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  custom_tags:
    - roasting
    - kerberos
    - requests
    - windows_security
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4768" AND data_win_eventdata_ticketEncryptionType:/0[Xx]17/ AND data_win_eventdata_serviceName:/[Kk][Rr][Bb][Tt][Gg][Tt]/ AND data_win_eventdata_preAuthType:"0"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 59b51620-94c9-11ec-b3d5-acde48001122
    name: Kerberos Pre-Authentication Flag Disabled with PowerShell
    reason: 'Precursor/enabler: an attacker (or insider) setting DONT_REQ_PREAUTH on an account is what makes it AS-REP roastable in the first place.'
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: 'Precursor: LDAP enumeration of accounts with DoesNotRequirePreAuth builds the target list whose AS-REPs are then requested (4768 preAuth 0).'
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: 'Precursor: PowerView -PreauthNotRequired discovery of roastable accounts immediately before the RC4 AS-REP requests.'
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: 'Co-occurring AD reconnaissance: the same operator usually maps the domain with SharpHound before or alongside roasting.'
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Process-side view of Kerberos ticket abuse tooling (Rubeus asreproast) that generates the 4768 events on the DC.
  - id: 12e6d621-194f-4f59-90cc-1959e21e69f7
    name: Register new Logon Process by Rubeus
    reason: Rubeus on the source host registers a logon process; confirms the roasting tool origin of the TGT requests.
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: Sibling offline-cracking technique (4769 RC4 service tickets); attackers commonly run both AS-REP roasting and Kerberoasting in one pass.
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Same RC4 downgrade signal on service tickets (4769 0x17); co-occurs when the attacker pivots from AS-REP to TGS roasting.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Kerberos TGT/service ticket requests from this source: RC4 and pre-auth failures'
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4771") AND (data_win_eventdata_ticketEncryptionType:/0[Xx]17/ OR data_win_eventdata_preAuthType:"0" OR data_win_eventdata_status:/0[Xx]18/)
    pivot_on:
    - ip
    window: 6h
  - name: Same source requesting AS-REPs for many different accounts (roasting sweep)
    query: data_win_system_eventID:"4768" AND data_win_eventdata_preAuthType:"0" AND data_win_eventdata_serviceName:/[Kk][Rr][Bb][Tt][Gg][Tt]/
    pivot_on:
    - ip
    window: 2h
  - name: Roasting tooling and AD recon commands on the source host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Nn][Pp][Uu][Ss][Ee][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ee][Ss][Nn][Oo][Tt][Rr][Ee][Qq][Uu][Ii][Rr][Ee][Pp][Rr][Ee][Aa][Uu][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ee][Aa][Uu][Tt][Hh][Nn][Oo][Tt][Rr][Ee][Qq][Uu][Ii][Rr][Ee][Dd].*/)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell script blocks enumerating or modifying pre-auth settings
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ee][Ss][Nn][Oo][Tt][Rr][Ee][Qq][Uu][Ii][Rr][Ee][Pp][Rr][Ee][Aa][Uu][Tt][Hh].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Rr][Ee][Aa][Uu][Tt][Hh][Nn][Oo][Tt][Rr][Ee][Qq][Uu][Ii][Rr][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Nn][Tt]_[Rr][Ee][Qq]_[Pp][Rr][Ee][Aa][Uu][Tt][Hh].*/)
    pivot_on:
    - host
    window: 6h
  - name: Logons and account changes for the roasted account (cracked password reuse)
    query: data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4738" OR data_win_system_eventID:"4724"
    pivot_on:
    - user
    window: 24h
