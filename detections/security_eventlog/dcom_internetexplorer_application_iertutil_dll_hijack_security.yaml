name: DCOM InternetExplorer.Application Iertutil DLL Hijack - Security
id: c39f0c81-7348-4965-ab27-2fde35a1b641
version: 1
schema_version: "1.0"
date: "2022-11-26"
author: Roberto Rodriguez @Cyb3rWard0g, Open Threat Research (OTR)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c39f0c81-7348-4965-ab27-2fde35a1b641
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a threat actor creating a file named `iertutil.dll` in the `C:\Program
  Files\Internet Explorer\` directory over the network for a DCOM
  InternetExplorer DLL Hijack scenario. MITRE ATT&CK: T1021.002, T1021.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - wildcard:
            data_win_eventdata_relativeTargetName:
              value: "*\\\\Internet Explorer\\\\iertutil.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_subjectUserName: "*$"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_relativeTargetName
  matches '*\Internet Explorer\iertutil.dll'; data_win_eventdata_subjectUserName
  matches '*$'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/201009-RemoteDCOMIErtUtilDLLHijack/notebook.html
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1021/003/

response:
  message: >
    DCOM InternetExplorer.Application Iertutil DLL Hijack - Security detected on
    host $agent_name$. Matched data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1021.002, T1021.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_relativeTargetName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1021.003
  custom_tags:
    - internetexplorer
    - application
    - iertutil
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_relativeTargetName:/.*\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_subjectUserName AND NOT (data_win_eventdata_subjectUserName:/.*\$/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f7979ae-f82b-45af-ac1d-2b10e93b0baa
    name: Potential DCOM InternetExplorer.Application DLL Hijack
    reason: 'Same hijack seen from the Sysmon file-create side: the iertutil.dll written over SMB (5145) lands on disk as an EID 11 in the Internet Explorer directory by the SMB server process.'
  - id: f354eba5-623b-450f-b073-0b5b2773b6aa
    name: Potential DCOM InternetExplorer.Application DLL Hijack - Image Load
    reason: 'Direct follow-on: after the planted iertutil.dll is written, the attacker instantiates InternetExplorer.Application via DCOM and the rogue DLL is loaded by iexplore.exe, confirming execution.'
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Co-occurring remote lateral movement over SMB admin shares: the same authenticated network session may also use the SVCCTL pipe for PsExec-style remote service execution as an alternative or fallback to DCOM.'
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: The attacker-side DCOM activation (New-Object -ComObject / GetTypeFromProgID with a remote computer name) that triggers the hijacked DLL load; seen on the source host of the movement.
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Sibling DCOM lateral-movement technique (MMC20.Application ExecuteShellCommand); an operator who plants a DLL for DCOM often tries other DCOM objects on the same target.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Alternative remote execution channel from the same authenticated account on the same target when DCOM hijack is blocked or after foothold is gained.
  - id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
    name: Possible Impacket SecretDump Remote Activity
    reason: 'Likely follow-on once remote code runs as the hijacked process: credential extraction over SMB/admin shares from the compromised host with the same account.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other remote file writes via SMB shares by this account
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:*ADMIN$* OR data_win_eventdata_shareName:*C$* OR data_win_eventdata_shareName:*IPC$*) AND (data_win_eventdata_accessList:*WriteData* OR data_win_eventdata_accessList:*AppendData*)
    pivot_on:
    - user
    window: 2h
  - name: Internet Explorer / iexplore spawned or loading unsigned DLL on this host
    query: (data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Ii][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: DCOM-launched iexplore and child shells on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|rundll32|regsvr32|mshta|wscript|cscript)\.exe/ ) AND (data_win_eventdata_parentImage:/.*[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentCommandLine:*-Embedding*)
    pivot_on:
    - host
    window: 1h
  - name: Network logons (type 3) by this account across hosts
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_ipAddress:"-"
    pivot_on:
    - user
    window: 6h
  - name: Inbound SMB/RPC connections to this host from non-server sources
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135") AND data_win_eventdata_initiated:"false"
    pivot_on:
    - host
    window: 2h
