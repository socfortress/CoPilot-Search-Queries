name: Invoke-Obfuscation Via Use Rundll32 - Security
id: cd0f7229-d16f-42de-8fe3-fba365fbcb3a
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd0f7229-d16f-42de-8fe3-fba365fbcb3a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via use Rundll32 in Scripts. MITRE ATT&CK:
  T1027, T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - wildcard:
            data_win_eventdata_serviceFileName: "*&&*"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*rundll32*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*shell32.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*shellexec_rundll*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*value*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*invoke*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*comspec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*iex*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*&&*'; data_win_eventdata_serviceFileName matches '*rundll32*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Use Rundll32 - Security detected on host
    $agent_name$. Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - rundll32
    - windows_security
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*\&\&.*/ AND data_win_eventdata_serviceFileName:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_serviceFileName:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_serviceFileName:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND (data_win_eventdata_serviceFileName:/.*[Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_serviceFileName:/.*[Ii][Nn][Vv][Oo][Kk][Ee].*/ OR data_win_eventdata_serviceFileName:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*/ OR data_win_eventdata_serviceFileName:/.*[Ii][Ee][Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f241cf1b-3a6b-4e1a-b4f9-133c00dd95ca
    name: Invoke-Obfuscation RUNDLL LAUNCHER - Security
    reason: Sibling Invoke-Obfuscation rundll32 launcher variant in the same 4697 service-install channel; both firing means the obfuscated service-launch technique was tried in multiple forms
  - id: fd0f5778-d3cb-4c9a-9695-66759d04702a
    name: Invoke-Obfuscation Obfuscated IEX Invocation - Security
    reason: The matched service command line contains iex/invoke; this rule catches the obfuscated IEX variant of the same Invoke-Obfuscation service payload
  - id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell
    reason: When the obfuscated rundll32 service starts, the same launcher pattern appears in PowerShell script block logging (4104) - confirms the payload actually executed
  - id: 88a22f69-62f9-4b8a-aa00-6b0212f2f05a
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell Module
    reason: Module-logging (4103) view of the same rundll32 shell32 ShellExec_RunDLL launcher, evidence of execution after the service install
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Both are malicious service installs (4697) with command-interpreter payloads; Cobalt Strike psexec/jump-style services often use this obfuscated launcher shape
  - id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
    name: Potential CobaltStrike Service Installations - Registry
    reason: Registry-level view of the same service creation (Services key ImagePath set to a cmd/powershell launcher), corroborating the 4697 event
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: The obfuscated command is installed as a service for persistence/remote exec; this fires on the resulting suspicious service registry entry
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Process-creation view (sc.exe create / New-Service) of the same service creation that produced the 4697 event, identifying the parent process that installed it
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service-spawned cmd/powershell/rundll32 launching the obfuscated command
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*[Ss][Hh][Ee][Ll][Ll]32.*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell script blocks with obfuscation/execution primitives
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other service installations on this host (4697 and 7045)
    query: (data_win_system_eventID:"4697" OR data_win_system_eventID:"7045")
    pivot_on:
    - host
    window: 6h
  - name: Network logons preceding the service install (remote service creation)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from rundll32/cmd/powershell on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
