name: Startup/Logon Script Added to Group Policy Object
id: 123e4e6d-b123-48f8-b261-7214938acaf0
version: 1
schema_version: "1.0"
date: "2024-09-06"
author: Elastic, Josh Nickels, Marius Rothenbücher
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 123e4e6d-b123-48f8-b261-7214938acaf0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the modification of Group Policy Objects (GPO) to add a startup/logon
  script to users or computer objects. MITRE ATT&CK: T1484.001, T1547.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "5136"
              - term:
                  data_win_system_eventID: "5145"
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_attributeLDAPDisplayName:
                                value: "gPCMachineExtensionNames"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_attributeLDAPDisplayName:
                                value: "gPCUserExtensionNames"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_attributeValue:
                          value: "*42B5FAAE-6536-11D2-AE5A-0000F87571E3*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_attributeValue:
                                value: "*40B6664F-4972-11D1-A7CA-0000F87571E3*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_attributeValue:
                                value: "*40B66650-4972-11D1-A7CA-0000F87571E3*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_shareName:
                          value: "*\\\\SYSVOL"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_relativeTargetName:
                                value: "*\\\\scripts.ini"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_relativeTargetName:
                                value: "*\\\\psscripts.ini"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_accessList: "*%%4417*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_attributeValue
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_accessList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136'; data_win_system_eventID equals '5145';
  data_win_eventdata_attributeLDAPDisplayName equals 'gPCMachineExtensionNames',
  among other conditions.

known_false_positives: >
  Legitimate execution by system administrators. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.elastic.co/guide/en/security/current/startup-logon-script-added-to-group-policy-object.html
  - https://attack.mitre.org/techniques/T1484/001/
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    Startup/Logon Script Added to Group Policy Object detected on host
    $agent_name$. Matched data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. Matched
    data_win_eventdata_attributeValue: $data_win_eventdata_attributeValue$.
    MITRE ATT&CK: T1484.001, T1547
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other
    - field: data_win_eventdata_attributeValue
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1484.001
    - T1547
  custom_tags:
    - startup
    - logon
    - added
    - windows_security
    - persistence
    - privilege_escalation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"5136" OR data_win_system_eventID:"5145") AND (((data_win_eventdata_attributeLDAPDisplayName:/[Gg][Pp][Cc][Mm][Aa][Cc][Hh][Ii][Nn][Ee][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Nn][Aa][Mm][Ee][Ss]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Gg][Pp][Cc][Uu][Ss][Ee][Rr][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Nn][Aa][Mm][Ee][Ss]/) AND data_win_eventdata_attributeValue:/.*42[Bb]5[Ff][Aa][Aa][Ee]-6536-11[Dd]2-[Aa][Ee]5[Aa]-0000[Ff]87571[Ee]3.*/ AND (data_win_eventdata_attributeValue:/.*40[Bb]6664[Ff]-4972-11[Dd]1-[Aa]7[Cc][Aa]-0000[Ff]87571[Ee]3.*/ OR data_win_eventdata_attributeValue:/.*40[Bb]66650-4972-11[Dd]1-[Aa]7[Cc][Aa]-0000[Ff]87571[Ee]3.*/)) OR (data_win_eventdata_shareName:/.*\\[Ss][Yy][Ss][Vv][Oo][Ll]/ AND (data_win_eventdata_relativeTargetName:/.*\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\.[Ii][Nn][Ii]/ OR data_win_eventdata_relativeTargetName:/.*\\[Pp][Ss][Ss][Cc][Rr][Ii][Pp][Tt][Ss]\.[Ii][Nn][Ii]/) AND data_win_eventdata_accessList:/.*%%4417.*/))

