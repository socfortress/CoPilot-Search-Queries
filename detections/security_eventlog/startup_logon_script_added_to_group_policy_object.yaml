name: Startup/Logon Script Added to Group Policy Object
id: 123e4e6d-b123-48f8-b261-7214938acaf0
version: 1
schema_version: "1.0"
date: "2024-09-06"
author: Elastic, Josh Nickels, Marius Rothenbücher
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 123e4e6d-b123-48f8-b261-7214938acaf0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the modification of Group Policy Objects (GPO) to add a startup/logon
  script to users or computer objects. MITRE ATT&CK: T1484.001, T1547.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "5136"
              - term:
                  data_win_system_eventID: "5145"
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_attributeLDAPDisplayName:
                                value: "gPCMachineExtensionNames"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_attributeLDAPDisplayName:
                                value: "gPCUserExtensionNames"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_attributeValue:
                          value: "*42B5FAAE-6536-11D2-AE5A-0000F87571E3*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_attributeValue:
                                value: "*40B6664F-4972-11D1-A7CA-0000F87571E3*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_attributeValue:
                                value: "*40B66650-4972-11D1-A7CA-0000F87571E3*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_shareName:
                          value: "*\\\\SYSVOL"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_relativeTargetName:
                                value: "*\\\\scripts.ini"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_relativeTargetName:
                                value: "*\\\\psscripts.ini"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_accessList: "*%%4417*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_attributeValue
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_accessList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136'; data_win_system_eventID equals '5145';
  data_win_eventdata_attributeLDAPDisplayName equals 'gPCMachineExtensionNames',
  among other conditions.

known_false_positives: >
  Legitimate execution by system administrators. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.elastic.co/guide/en/security/current/startup-logon-script-added-to-group-policy-object.html
  - https://attack.mitre.org/techniques/T1484/001/
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    Startup/Logon Script Added to Group Policy Object detected on host
    $agent_name$. Matched data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. Matched
    data_win_eventdata_attributeValue: $data_win_eventdata_attributeValue$.
    MITRE ATT&CK: T1484.001, T1547
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other
    - field: data_win_eventdata_attributeValue
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1484.001
    - T1547
  custom_tags:
    - startup
    - logon
    - added
    - windows_security
    - persistence
    - privilege_escalation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"5136" OR data_win_system_eventID:"5145") AND (((data_win_eventdata_attributeLDAPDisplayName:/[Gg][Pp][Cc][Mm][Aa][Cc][Hh][Ii][Nn][Ee][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Nn][Aa][Mm][Ee][Ss]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Gg][Pp][Cc][Uu][Ss][Ee][Rr][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Nn][Aa][Mm][Ee][Ss]/) AND data_win_eventdata_attributeValue:/.*42[Bb]5[Ff][Aa][Aa][Ee]-6536-11[Dd]2-[Aa][Ee]5[Aa]-0000[Ff]87571[Ee]3.*/ AND (data_win_eventdata_attributeValue:/.*40[Bb]6664[Ff]-4972-11[Dd]1-[Aa]7[Cc][Aa]-0000[Ff]87571[Ee]3.*/ OR data_win_eventdata_attributeValue:/.*40[Bb]66650-4972-11[Dd]1-[Aa]7[Cc][Aa]-0000[Ff]87571[Ee]3.*/)) OR (data_win_eventdata_shareName:/.*\\[Ss][Yy][Ss][Vv][Oo][Ll]/ AND (data_win_eventdata_relativeTargetName:/.*\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\.[Ii][Nn][Ii]/ OR data_win_eventdata_relativeTargetName:/.*\\[Pp][Ss][Ss][Cc][Rr][Ii][Pp][Tt][Ss]\.[Ii][Nn][Ii]/) AND data_win_eventdata_accessList:/.*%%4417.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e5ac86dd-2da1-454b-be74-05d26c769d7d
    name: Windows Default Domain GPO Modification
    reason: Same GPO-tampering primitive (5136 on groupPolicyContainer); attacker often edits the Default Domain Policy directly to push the script domain-wide.
  - id: a8f29a7b-b137-4446-80a0-b804272f3da2
    name: Persistence and Execution at Scale via GPO Scheduled Task
    reason: Alternative GPO-based mass-execution vector; attackers who add a startup script often also deploy an immediate scheduled task via the same GPO.
  - id: 1c480e10-7ee1-46d4-8ed2-85f9789e3ce4
    name: Group Policy Abuse for Privilege Addition
    reason: Follow-on GPO edit (user rights / restricted groups) to grant privileges once the GPO is under attacker control.
  - id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
    name: Suspicious SYSVOL Domain Group Policy Access
    reason: 'Precursor/co-occurring: process-level browsing or copying of SYSVOL GPO folders, the host-side view of locating and editing scripts.ini.'
  - id: 5f87308a-0a5b-4623-ae15-d8fa1809bc60
    name: Suspicious Files in Default GPO Folder
    reason: The script payload referenced by scripts.ini must be dropped into the GPO folder in SYSVOL; this catches that file write.
  - id: ada4b0c4-758b-46ac-9033-9004613a150d
    name: Modify Group Policy Settings
    reason: Command-line registry changes to policy settings, a related GPO manipulation stage by the same actor.
  - id: dcff7e85-d01f-4eb5-badd-84e2e6be8294
    name: Windows Default Domain GPO Modification via GPME
    reason: GUI-based (GPME) edit of default domain GPO, the interactive-operator variant of the same GPO abuse.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script or binary written into SYSVOL / GPO folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Vv][Oo][Ll].*\\([Ss]cripts|[Pp]olicies).*\.([Pp][Ss]1|[Bb][Aa][Tt]|[Cc][Mm][Dd]|[Vv][Bb][Ss]|[Jj][Ss]|[Ee][Xx][Ee]|[Dd][Ll][Ll]|[Hh][Tt][Aa])/
    pivot_on:
    - host
    window: 2h
  - name: SYSVOL share writes of other GPO files (ScheduledTasks.xml, GptTmpl.inf, Groups.xml)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ss][Yy][Ss][Vv][Oo][Ll]/ AND data_win_eventdata_accessList:*%%4417* AND (data_win_eventdata_relativeTargetName:*[Ss]cheduled[Tt]asks.xml OR data_win_eventdata_relativeTargetName:*[Gg]ptTmpl.inf OR data_win_eventdata_relativeTargetName:*[Gg]roups.xml OR data_win_eventdata_relativeTargetName:*[Ss]ervices.xml)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Other GPO attribute changes by same actor (gPLink, gPCFileSysPath, extension names)
    query: data_win_system_eventID:"5136" AND (data_win_eventdata_attributeLDAPDisplayName:"gPLink" OR data_win_eventdata_attributeLDAPDisplayName:"gPCFileSysPath" OR data_win_eventdata_attributeLDAPDisplayName:"gPCMachineExtensionNames" OR data_win_eventdata_attributeLDAPDisplayName:"gPCUserExtensionNames" OR data_win_eventdata_attributeLDAPDisplayName:"versionNumber")
    pivot_on:
    - user
    window: 6h
  - name: Script host / shell execution referencing SYSVOL or GPO scripts
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Yy][Ss][Vv][Oo][Ll]|[Pp]olicies\\\{).*/ AND (data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh|cmd|[Ww]script|[Cc]script|[Mm]shta|[Rr]egsvr32|[Rr]undll32)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Network logons by the GPO-editing account (lateral use of the privileged account)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 6h
