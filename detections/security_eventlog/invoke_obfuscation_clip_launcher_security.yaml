name: Invoke-Obfuscation CLIP+ Launcher - Security
id: 4edf51e1-cb83-4e1a-bc39-800e396068e3
version: 1
schema_version: "1.0"
date: "2022-11-27"
author: Jonathan Cheong, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4edf51e1-cb83-4e1a-bc39-800e396068e3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated use of Clip.exe to execute PowerShell. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*cmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName: "*&&*"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*clipboard]::*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*cmd*'; data_win_eventdata_serviceFileName matches '*&&*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation CLIP+ Launcher - Security detected on host $agent_name$.
    Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - launcher
    - windows_security
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*[Cc][Mm][Dd].*/ AND data_win_eventdata_serviceFileName:/.*\&\&.*/ AND data_win_eventdata_serviceFileName:/.*[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd]\]::.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f7385ee2-0e0c-11eb-adc1-0242ac120002
    name: Invoke-Obfuscation CLIP+ Launcher - System
    reason: Same CLIP+ launcher string seen via System log event 7045 (service install); corroborates the 4697 service creation from a second log source
  - id: b222df08-0e07-11eb-adc1-0242ac120002
    name: Invoke-Obfuscation CLIP+ Launcher
    reason: 'Process-creation twin: the service binary path runs cmd /c ... clipboard]:: so powershell/cmd spawned by services.exe with the same CLIP+ command line confirms execution'
  - id: 1a0a2ff1-611b-4dac-8216-8a7b47c618a6
    name: Invoke-Obfuscation Via Use Clip - Security
    reason: Sibling clip.exe obfuscation variant delivered through the same 4697 service-install channel; attackers often cycle launcher variants
  - id: fd0f5778-d3cb-4c9a-9695-66759d04702a
    name: Invoke-Obfuscation Obfuscated IEX Invocation - Security
    reason: Decoded CLIP+ payload ends in an obfuscated IEX; same Security 4697 service-install delivery with a different Invoke-Obfuscation token
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: 'Follow-on: once the service-launched powershell pulls the clipboard payload, the deobfuscated IEX call lands in script block logging (4104)'
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The launcher is delivered as a newly created service (sc create / 4697); this catches the sc.exe/PowerShell creation command that preceded the event
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Registry-level view of the same malicious service ImagePath written under CurrentControlSet\Services, confirming the persistence artefact
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Obfuscated cmd-based services are commonly installed remotely via PsExec/SCM lateral movement; check whether the 4697 came from a remote admin tool
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service-spawned shells with clipboard/obfuscated command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*&&.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell script blocks reading clipboard or invoking IEX
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 1h
  - name: Other service installs and service-binary registry writes
    query: (data_win_system_eventID:"4697" OR data_win_system_eventID:"7045" OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/))
    pivot_on:
    - host
    window: 4h
  - name: Network connections from service-launched shells (stager / C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Network logons by this account (remote service-install origin)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
