name: Important Windows Event Auditing Disabled
id: ab4561b1-6c7e-48a7-ad08-087cfb9ce8f1
version: 1
schema_version: "1.0"
date: "2023-11-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ab4561b1-6c7e-48a7-ad08-087cfb9ce8f1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects scenarios where system auditing for important events such as "Process
  Creation" or "Logon" events is disabled. MITRE ATT&CK: T1685.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4719"
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9210-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9211-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9212-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9215-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE921B-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE922B-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE922F-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9230-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9235-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9236-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9237-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE923F-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9240-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_subcategoryGuid:
                                value: "{0CCE9242-69AE-11D9-BED3-505054503030}"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_auditPolicyChanges: "*%%8448*"
                          - wildcard:
                              data_win_eventdata_auditPolicyChanges: "*%%8450*"
                        minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4719"
                    - term:
                        data_win_eventdata_subcategoryGuid:
                          value: "{0CCE9217-69AE-11D9-BED3-505054503030}"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_auditPolicyChanges: "*%%8448*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_subcategoryGuid
    - data_win_eventdata_auditPolicyChanges
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4719'; data_win_eventdata_subcategoryGuid
  equals '{0CCE9210-69AE-11D9-BED3-505054503030}';
  data_win_eventdata_subcategoryGuid equals
  '{0CCE9211-69AE-11D9-BED3-505054503030}', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://docs.google.com/presentation/d/1dkrldTTlN3La-OjWtkWJBb4hVk6vfsSMBFBERs6R8zA/edit
  - https://github.com/SigmaHQ/sigma/blob/ad1bfd3d28aa0ccc9656240f845022518ef65a2e/documentation/logsource-guides/windows/service/security.md
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Important Windows Event Auditing Disabled detected on host $agent_name$.
    Matched data_win_eventdata_subcategoryGuid:
    $data_win_eventdata_subcategoryGuid$. Matched
    data_win_eventdata_auditPolicyChanges:
    $data_win_eventdata_auditPolicyChanges$. MITRE ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_subcategoryGuid
      type: other
    - field: data_win_eventdata_auditPolicyChanges
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - important
    - auditing
    - windows_security
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"4719" AND (data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9210-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9211-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9212-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9215-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]921[Bb]-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]922[Bb]-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]922[Ff]-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9230-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9235-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9236-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9237-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]923[Ff]-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9240-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ OR data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9242-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/) AND (data_win_eventdata_auditPolicyChanges:/.*%%8448.*/ OR data_win_eventdata_auditPolicyChanges:/.*%%8450.*/)) OR (data_win_system_eventID:"4719" AND data_win_eventdata_subcategoryGuid:/\{0[Cc][Cc][Ee]9217-69[Aa][Ee]-11[Dd]9-[Bb][Ee][Dd]3-505054503030\}/ AND data_win_eventdata_auditPolicyChanges:/.*%%8448.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Auditpol is the usual command-line way to switch off the subcategories that produce this 4719 event; seeing the process creation confirms who/what ran it.
  - id: windows-audit-policy-subcategory-disabled-via-auditpol-001
    name: Windows Audit Policy Subcategory Disabled via Auditpol
    reason: 'Same behaviour seen from process creation: auditpol /set /subcategory ... /success:disable on Logon/Process Creation subcategories, the exact change 4719 records.'
  - id: Windows_Audit_Policy_Auditing_Option_Modified_-_Registry
    name: Windows Audit Policy Auditing Option Modified - Registry
    reason: Registry-level route to the same blind spot (Lsa audit options); co-occurs when the attacker bypasses auditpol.
  - id: 1a4bd6af-99ac-4466-b5b2-7b72b4a05462
    name: Security Event Logging Disabled via MiniNt Registry Key - Process
    reason: MiniNt registry key trick suppresses Security event logging entirely; alternate audit-blinding method used alongside policy changes.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: wevtutil sl /e:false disables event channels; companion log-blinding step before noisy post-exploitation.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Eventlog clearing/config change typically follows disabling auditing to erase events already recorded before the policy change.
  - id: 0f017df3-8f5a-414f-ad6b-24aff1128278
    name: Suspicious Eventlog Clear
    reason: PowerShell-based Clear-EventLog / log clearing, a common follow-on cleanup once auditing is reduced.
  - id: cd1f961e-0b96-436b-b7c6-38da4583ec00
    name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
    reason: Logman ETW session tampering is a parallel telemetry-impairment technique chained with audit policy disabling.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Auditpol / audit policy commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Event log clearing or channel disabling (wevtutil, Clear-EventLog, 1102/104)
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Ss][Ll].*[Ee]:[Ff][Aa][Ll][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Registry changes to LSA audit options / MiniNt / EventLog service
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:*Control\Lsa\SCENoApplyLegacyAuditPolicy* OR data_win_eventdata_targetObject:*Control\MiniNt* OR data_win_eventdata_targetObject:*Control\Lsa\AuditBaseObjects* OR data_win_eventdata_targetObject:*Services\EventLog*)
    pivot_on:
    - host
    window: 2h
  - name: Admin-level logon and privilege use by the account that changed audit policy
    query: data_win_system_eventID:"4672" OR data_win_system_eventID:"4624" OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 4h
  - name: 'Defense-evasion follow-ons: Defender/firewall disabling, shadow copy deletion, Sysmon unload'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Oo][Ff][Ff].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 4h
