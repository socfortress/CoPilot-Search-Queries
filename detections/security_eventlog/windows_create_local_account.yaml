name: Windows Create Local Account
id: 3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects the creation of a new local user account on a Windows system.
  It leverages Windows Security Audit logs, specifically event ID 4720, to identify this activity.
  Monitoring the creation of local accounts is crucial for a SOC as it can indicate unauthorized
  access or lateral movement within the network. If confirmed malicious, this activity could allow
  an attacker to establish persistence, escalate privileges, or gain unauthorized access to sensitive
  systems and data.

data_source:
  - Windows Security Event Log EventID 4720

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4720"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - agent_name
    - data_win_system_eventID

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  This search requires you to have enabled Windows Security Audit Logs with Group Management
  Audit enabled in your Local Windows Security Policy and be ingesting those logs. Event ID 4720
  is logged when a user account is created on the system. Ensure your Wazuh agents have the Security
  channel configured to collect these events and that logs are being ingested into Elasticsearch
  with proper field mapping.

known_false_positives: >
  It is possible that an administrator created the account. Verifying activity with an administrator
  is advised. Accounts created on Domain Controllers will trigger this too. Exclude if it becomes
  too noisy. This analytic is set to anomaly to allow for risk to be added. Filter and tune as needed.
  Restrict to critical infrastructure to reduce any volume.

references:
  - https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4720

response:
  message: >
    Local user account $data_win_eventdata_targetUserName$ was created on $agent_name$
    by user $data_win_eventdata_subjectUserName$. This may indicate unauthorized account creation
    or lateral movement activity.
  risk_score: 20
  severity: medium
  risk_objects:
    - field: data_win_eventdata_subjectUserName
      type: user
      score: 20
    - field: agent_name
      type: system
      score: 20
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: account

tags:
  analytic_story:
    - Active Directory Password Spraying
    - Lateral Movement
    - Account Manipulation
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - account_creation
    - persistence
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4720"

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: a5d85486-b89c-11eb-8267-acde48001122
      name: "Allow Inbound Traffic In Firewall Rule"
      reason: "same analytic story: Lateral Movement"
    - id: f64da023-b988-4775-8d57-38e512beb56e
      name: "Get-DomainComputer with PowerShell Script Block"
      reason: "same analytic story: Lateral Movement"
    - id: 89275e7e-0548-11ec-bf75-acde48001122
      name: "Get-DomainTrust with PowerShell Script Block"
      reason: "same analytic story: Lateral Movement"
    - id: 70fac80e-0bf1-11ec-9ba0-acde48001122
      name: "Get-ForestTrust with PowerShell Script Block"
      reason: "same analytic story: Lateral Movement"
    - id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
      name: "Interactive Session on Remote Endpoint with PowerShell"
      reason: "same analytic story: Lateral Movement"
    - id: windows-powershell-invoke-wmiexec-usage-001
      name: "PowerShell Invoke WmiExec Usage"
      reason: "same analytic story: Lateral Movement"
    - id: windows-powershell-remote-services-add-trustedhost-001
      name: "Powershell Remote Services Add TrustedHost"
      reason: "same analytic story: Lateral Movement"
    - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
      name: "Windows Create Local Administrator Account Via Net"
      reason: "same analytic story: Lateral Movement"
    - id: 78e678d2-bf64-4fe6-aa52-2f7b11dddee7
      name: "Windows Detect Network Scanner Behavior"
      reason: "same analytic story: Lateral Movement"
    - id: 5df35d50-e1a3-4a52-a337-92e69d9b1b8a
      name: "Windows PowerShell Process With Malicious String"
      reason: "same analytic story: Lateral Movement"
    - id: windows-winrm-spawning-process-001
      name: "Windows WinRM Spawning a Process"
      reason: "same analytic story: Lateral Movement"
    - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
      name: "7Zip Compressing Dump Files"
      reason: "next kill-chain tactic: Collection"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Local account / group creation on this host"
      query: '(((data_win_system_eventID:"4720" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756")) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp] .*/)))'
      pivot_on: [host]
      window: 6h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))'
      pivot_on: [host]
      window: 1h
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672")'
      pivot_on: [user]
      window: 6h
