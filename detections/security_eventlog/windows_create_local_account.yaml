name: Windows Create Local Account
id: 3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects the creation of a new local user account on a Windows system.
  It leverages Windows Security Audit logs, specifically event ID 4720, to identify this activity.
  Monitoring the creation of local accounts is crucial for a SOC as it can indicate unauthorized
  access or lateral movement within the network. If confirmed malicious, this activity could allow
  an attacker to establish persistence, escalate privileges, or gain unauthorized access to sensitive
  systems and data.

data_source:
  - Windows Security Event Log EventID 4720

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4720"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - agent_name
    - data_win_system_eventID

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  This search requires you to have enabled Windows Security Audit Logs with Group Management
  Audit enabled in your Local Windows Security Policy and be ingesting those logs. Event ID 4720
  is logged when a user account is created on the system. Ensure your Wazuh agents have the Security
  channel configured to collect these events and that logs are being ingested into Elasticsearch
  with proper field mapping.

known_false_positives: >
  It is possible that an administrator created the account. Verifying activity with an administrator
  is advised. Accounts created on Domain Controllers will trigger this too. Exclude if it becomes
  too noisy. This analytic is set to anomaly to allow for risk to be added. Filter and tune as needed.
  Restrict to critical infrastructure to reduce any volume.

references:
  - https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4720

response:
  message: >
    Local user account $data_win_eventdata_targetUserName$ was created on $agent_name$
    by user $data_win_eventdata_subjectUserName$. This may indicate unauthorized account creation
    or lateral movement activity.
  risk_score: 20
  severity: medium
  risk_objects:
    - field: data_win_eventdata_subjectUserName
      type: user
      score: 20
    - field: agent_name
      type: system
      score: 20
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: account

tags:
  analytic_story:
    - Active Directory Password Spraying
    - Lateral Movement
    - Account Manipulation
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - account_creation
    - persistence
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4720"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: 'Process-level view of the same account creation: net user /add is the usual command that generates the 4720 event, naming the parent process and operator.'
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: 'Escalated variant of the same action: an account created and put in Administrators in one go confirms persistence rather than a helpdesk task.'
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: 'Immediate follow-on: the new account is normally added to Administrators (4732) seconds after 4720, giving it privilege.'
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: Attackers grant the backdoor account RDP rights so they can log in interactively with it.
  - id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
    name: Hidden Local User Creation
    reason: Concealment of the newly created account (trailing $ or hidden names) distinguishes malicious persistence from admin work.
  - id: cfeed607-6aa4-4bbd-9627-b637deb723c8
    name: New or Renamed User Account with '$' Character
    reason: A created or renamed account mimicking a machine account is a stealth technique for the same backdoor account.
  - id: 9ec9fb1b-e059-4489-9642-f270c207923d
    name: Hiding User Account Via SpecialAccounts Registry Key - CommandLine
    reason: Hiding the new account from the logon screen via the SpecialAccounts registry key typically follows account creation.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Enabling RDP access is the next step after creating a local account to log in with it remotely.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Account creation commands (net user /add, New-LocalUser, wmic useraccount)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[\\][Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/) OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: New account added to Administrators / RDP groups
    query: (data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4756") OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*(\/[Aa][Dd][Dd]| -[Aa][Dd][Dd]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Account hiding and RDP enablement registry changes
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:*SpecialAccounts* OR data_win_eventdata_targetObject:*fDenyTSConnections* OR data_win_eventdata_targetObject:*UserList*)
    pivot_on:
    - host
    window: 4h
  - name: First logons by the new account
    query: data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 24h
  - name: Firewall or RDP enablement via netsh/PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee].*/)
    pivot_on:
    - host
    window: 4h
