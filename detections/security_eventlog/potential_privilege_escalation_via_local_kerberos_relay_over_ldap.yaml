name: Potential Privilege Escalation via Local Kerberos Relay over LDAP
id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
version: 1
schema_version: "1.0"
date: "2024-08-13"
author: Elastic, @SBousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious local successful logon event where the Logon Package is
  Kerberos, the remote address is set to localhost, and the target user SID is
  the built-in local Administrator account. This may indicate an attempt to
  leverage a Kerberos relay attack variant that can be used to elevate privilege
  locally from a domain joined limited user to local System privileges. MITRE
  ATT&CK: T1548.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4624"
        - term:
            data_win_eventdata_logonType: "3"
        - term:
            data_win_eventdata_authenticationPackageName:
              value: "Kerberos"
              case_insensitive: true
        - term:
            data_win_eventdata_ipAddress: "127.0.0.1"
        - wildcard:
            data_win_eventdata_targetUserSid:
              value: "S-1-5-21-*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetUserSid: "*-500"
        - exists:
            field: "data_win_eventdata_ipPort"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_ipPort: "0"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_authenticationPackageName
    - data_win_eventdata_ipAddress
    - data_win_eventdata_targetUserSid
    - data_win_eventdata_ipPort
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_logonType equals
  '3'; data_win_eventdata_authenticationPackageName equals 'Kerberos', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/sbousseaden/status/1518976397364056071?s=12&t=qKO5eKHvWhAP19a50FTZ7g
  - https://github.com/elastic/detection-rules/blob/5fe7833312031a4787e07893e27e4ea7a7665745/rules/_deprecated/privilege_escalation_krbrelayup_suspicious_logon.toml#L38
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    Potential Privilege Escalation via Local Kerberos Relay over LDAP detected
    on host $agent_name$. Matched data_win_eventdata_logonType:
    $data_win_eventdata_logonType$. Matched
    data_win_eventdata_authenticationPackageName:
    $data_win_eventdata_authenticationPackageName$. MITRE ATT&CK: T1548
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_authenticationPackageName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548
  custom_tags:
    - privilege
    - escalation
    - local
    - windows_security
    - privilege_escalation
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]/ AND data_win_eventdata_ipAddress:"127.0.0.1" AND data_win_eventdata_targetUserSid:/[Ss]-1-5-21-.*/ AND data_win_eventdata_targetUserSid:/.*-500/ AND _exists_:data_win_eventdata_ipPort AND NOT (data_win_eventdata_ipPort:"0")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: KrbRelayUp is the tool that produces this exact loopback Kerberos logon as local Administrator; its process execution is the direct cause of the 4624.
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: KrbRelay is the relay primitive KrbRelayUp wraps; a standalone run on the same host explains the localhost Kerberos logon.
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: Marshalled-SPN DNS records coerce the local machine into Kerberos-authenticating to the attacker's listener, immediately before the relayed loopback logon.
  - id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
    name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
    reason: Sysmon DNS lookup of a marshalled-SPN hostname is the precursor coercion step that triggers the relayed authentication seen in this 4624.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: KrbRelayUp's final stage uses the relayed S4U ticket to create a SYSTEM service; a new service shortly after this logon is the escalation payoff.
  - id: 45eb2ae2-9aa2-4c3a-99a5-6e5077655466
    name: Suspicious Computer Account Name Change CVE-2021-42287
    reason: Relay-to-LDAP chains depend on attacker-controlled computer accounts (RBCD/noPac style); co-occurrence indicates the same domain privilege-escalation toolkit.
  - id: e3818659-5016-4811-a73c-dde4679169d2
    name: Suspicious Computer Machine Password by PowerShell
    reason: Machine-account credential manipulation is a common setup step for the RBCD/shadow-credential account used in the relay chain.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: KrbRelayUp / KrbRelay / RBCD tooling execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy].*/ OR data_win_eventdata_originalFileName:/[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy].*/ OR data_win_eventdata_commandLine:/.*[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Bb][Cc][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Rr][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Kk][Rr][Bb][Ss][Cc][Mm].*/)
    pivot_on:
    - host
    window: 2h
  - name: Service creation as SYSTEM after relay
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/) OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4697"
    pivot_on:
    - host
    window: 1h
  - name: Kerberos marshalled-SPN DNS coercion lookups
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*UWhRCAAAAAAAA* OR data_win_eventdata_queryName:*wbEAYBAAAA*)
    pivot_on:
    - host
    window: 1h
  - name: Kerberos ticket, explicit-credential and privileged logon events for this account
    query: data_win_system_eventID:"4769" OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 4h
  - name: SYSTEM-level shells and LSASS access after escalation
    query: (data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/ AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]|-[Ee][Nn][Cc]|[Nn][Ee][Tt] +[Uu][Ss][Ee][Rr]|[Nn][Ee][Tt] +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
