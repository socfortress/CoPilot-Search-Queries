name: Potential Privilege Escalation via Local Kerberos Relay over LDAP
id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
version: 1
schema_version: "1.0"
date: "2024-08-13"
author: Elastic, @SBousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious local successful logon event where the Logon Package is
  Kerberos, the remote address is set to localhost, and the target user SID is
  the built-in local Administrator account. This may indicate an attempt to
  leverage a Kerberos relay attack variant that can be used to elevate privilege
  locally from a domain joined limited user to local System privileges. MITRE
  ATT&CK: T1548.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4624"
        - term:
            data_win_eventdata_logonType: "3"
        - term:
            data_win_eventdata_authenticationPackageName:
              value: "Kerberos"
              case_insensitive: true
        - term:
            data_win_eventdata_ipAddress: "127.0.0.1"
        - wildcard:
            data_win_eventdata_targetUserSid:
              value: "S-1-5-21-*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetUserSid: "*-500"
        - exists:
            field: "data_win_eventdata_ipPort"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_ipPort: "0"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_authenticationPackageName
    - data_win_eventdata_ipAddress
    - data_win_eventdata_targetUserSid
    - data_win_eventdata_ipPort
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_logonType equals
  '3'; data_win_eventdata_authenticationPackageName equals 'Kerberos', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/sbousseaden/status/1518976397364056071?s=12&t=qKO5eKHvWhAP19a50FTZ7g
  - https://github.com/elastic/detection-rules/blob/5fe7833312031a4787e07893e27e4ea7a7665745/rules/_deprecated/privilege_escalation_krbrelayup_suspicious_logon.toml#L38
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    Potential Privilege Escalation via Local Kerberos Relay over LDAP detected
    on host $agent_name$. Matched data_win_eventdata_logonType:
    $data_win_eventdata_logonType$. Matched
    data_win_eventdata_authenticationPackageName:
    $data_win_eventdata_authenticationPackageName$. MITRE ATT&CK: T1548
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_authenticationPackageName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548
  custom_tags:
    - privilege
    - escalation
    - local
    - windows_security
    - privilege_escalation
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]/ AND data_win_eventdata_ipAddress:"127.0.0.1" AND data_win_eventdata_targetUserSid:/[Ss]-1-5-21-.*/ AND data_win_eventdata_targetUserSid:/.*-500/ AND _exists_:data_win_eventdata_ipPort AND NOT (data_win_eventdata_ipPort:"0")

