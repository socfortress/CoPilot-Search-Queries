name: Suspicious Access to Sensitive File Extensions
id: 91c945bc-2ad1-4799-a591-4d00198a1215
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 91c945bc-2ad1-4799-a591-4d00198a1215
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects known sensitive file extensions accessed on a network share. MITRE
  ATT&CK: T1039.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.bak"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.dmp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.edb"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.kirbi"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.msg"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.nsf"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.nst"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.oab"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.ost"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.pst"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*.rdp"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_relativeTargetName
  matches '*.bak'; data_win_eventdata_relativeTargetName matches '*.dmp', among
  other conditions.

known_false_positives: >
  Help Desk operator doing backup or re-imaging end user machine or backup
  software. Users working with these data types or exchanging message files.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1039/

response:
  message: >
    Suspicious Access to Sensitive File Extensions detected on host
    $agent_name$. Matched data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1039
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_relativeTargetName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1039
  custom_tags:
    - sensitive
    - extensions
    - windows_security
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND (data_win_eventdata_relativeTargetName:/.*\.[Bb][Aa][Kk]/ OR data_win_eventdata_relativeTargetName:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_relativeTargetName:/.*\.[Ee][Dd][Bb]/ OR data_win_eventdata_relativeTargetName:/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR data_win_eventdata_relativeTargetName:/.*\.[Mm][Ss][Gg]/ OR data_win_eventdata_relativeTargetName:/.*\.[Nn][Ss][Ff]/ OR data_win_eventdata_relativeTargetName:/.*\.[Nn][Ss][Tt]/ OR data_win_eventdata_relativeTargetName:/.*\.[Oo][Aa][Bb]/ OR data_win_eventdata_relativeTargetName:/.*\.[Oo][Ss][Tt]/ OR data_win_eventdata_relativeTargetName:/.*\.[Pp][Ss][Tt]/ OR data_win_eventdata_relativeTargetName:/.*\.[Rr][Dd][Pp]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 910ab938-668b-401b-b08c-b596e80fdca5
    name: Transferring Files with Credential Data via Network Shares
    reason: Same 5145 share-access telemetry, targeting SAM/NTDS/SYSTEM hive files; sensitive-extension pulls (.dmp/.edb/.kirbi) from a share often accompany credential file theft.
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: Writes to ADMIN$/C$ by the same account indicate lateral tooling staged alongside the reading of sensitive files over SMB.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: The remote share access needs a network logon; explicit-credential logons reveal the stolen/alternate identity used to reach the share.
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: 'Process-level view of the same .dmp collection from a share: the command that actually moved the memory dump.'
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Command-line copy to/from admin shares is the usual mechanism behind the 5145 reads of .pst/.bak/.edb files.
  - id: 889719ef-dd62-43df-86c3-768fb08dc7c0
    name: Suspicious PowerShell Mailbox Export to Share
    reason: Mailbox export to a share produces .pst files, the exact extension this rule flags; shows the staging step of email collection.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Collected .pst/.bak/.dmp files are typically archived with a password before exfiltration; follow-on staging.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Rclone is the common exfiltration tool used after bulk collection of mail stores and backups from shares.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All SMB share file access by this account (5145)
    query: data_win_system_eventID:"5145" AND NOT data_win_eventdata_shareName:/.*IPC.*/
    pivot_on:
    - user
    window: 6h
  - name: Network logons to this host (type 3) and failures
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648"
    pivot_on:
    - host
    window: 2h
  - name: Archive and compression tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7z|7za|rar|winrar|makecab)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|\.7z|\.rar|\.zip).*/)
    pivot_on:
    - host
    window: 2h
  - name: Exfil tools and uploads from this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr]clone|[Ww]inscp|[Mm]ega[Cc]md|[Cc]url)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Rr]clone|[Ii]nvoke-[Rr]est[Mm]ethod|[Ss]tart-[Bb]its[Tt]ransfer|[Mm]ega\.nz|[Aa]nonfiles).*/)
    pivot_on:
    - host
    window: 4h
  - name: Sensitive-extension files created or copied on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Pp][Ss][Tt]|[Oo][Ss][Tt]|[Dd][Mm][Pp]|[Ee][Dd][Bb]|[Kk][Ii][Rr][Bb][Ii]|[Bb][Aa][Kk])/
    pivot_on:
    - host
    window: 2h
