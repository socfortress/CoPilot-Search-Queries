name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
id: 2c99737c-585d-4431-b61a-c911d86ff32f
version: 1
schema_version: "1.0"
date: "2022-08-16"
author: Samir Bousseaden, Roberto Rodriguez @Cyb3rWard0g, oscd.community, Tim Shelton, Maxence Fossat
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2c99737c-585d-4431-b61a-c911d86ff32f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Backdooring domain object to grant the rights associated with DCSync to a
  regular user or machine account using Powerview\Add-DomainObjectAcl DCSync
  Extended Right cmdlet, will allow to re-obtain the pwd hashes of any
  user/computer. MITRE ATT&CK: T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5136"
        - term:
            data_win_eventdata_attributeLDAPDisplayName:
              value: "ntSecurityDescriptor"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_attributeValue:
                    value: "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_attributeValue:
                    value: "*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_attributeValue:
                    value: "*89e95b76-444d-4c62-991a-0facbeda640c*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_objectClass"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_objectClass:
                          value: "dnsNode"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_objectClass:
                          value: "dnsZoneScope"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_objectClass:
                          value: "dnsZone"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_attributeValue
    - data_win_eventdata_objectClass
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136';
  data_win_eventdata_attributeLDAPDisplayName equals 'ntSecurityDescriptor';
  data_win_eventdata_attributeValue matches
  '*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*', among other conditions.

known_false_positives: >
  New Domain Controller computer account, check user SIDs within the value
  attribute of event 5136 and verify if it's a regular user or DC computer
  account. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/menasec1/status/1111556090137903104
  - https://www.specterops.io/assets/resources/an_ace_up_the_sleeve.pdf
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    Powerview Add-DomainObjectAcl DCSync AD Extend Right detected on host
    $agent_name$. Matched data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. Matched
    data_win_eventdata_attributeValue: $data_win_eventdata_attributeValue$.
    MITRE ATT&CK: T1098
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other
    - field: data_win_eventdata_attributeValue
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1098
  custom_tags:
    - powerview
    - domainobjectacl
    - dcsync
    - windows_security
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Nn][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr]/ AND (data_win_eventdata_attributeValue:/.*1131[Ff]6[Aa][Dd]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/ OR data_win_eventdata_attributeValue:/.*1131[Ff]6[Aa][Aa]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/ OR data_win_eventdata_attributeValue:/.*89[Ee]95[Bb]76-444[Dd]-4[Cc]62-991[Aa]-0[Ff][Aa][Cc][Bb][Ee][Dd][Aa]640[Cc].*/) AND _exists_:data_win_eventdata_objectClass AND NOT (data_win_eventdata_objectClass:/[Dd][Nn][Ss][Nn][Oo][Dd][Ee]/ OR data_win_eventdata_objectClass:/[Dd][Nn][Ss][Zz][Oo][Nn][Ee][Ss][Cc][Oo][Pp][Ee]/ OR data_win_eventdata_objectClass:/[Dd][Nn][Ss][Zz][Oo][Nn][Ee]/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0255a820-e564-4e40-af2b-6ac61160335c
      name: "A New Trust Was Created To A Domain"
      reason: "next kill-chain tactic: Persistence"
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
      name: "Account Tampering - Suspicious Failed Logon Reasons"
      reason: "next kill-chain tactic: Persistence"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
      name: "Active Directory User Backdoors"
      reason: "next kill-chain tactic: Persistence"
    - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
      name: "Addition of SID History to Active Directory Object"
      reason: "next kill-chain tactic: Privilege Escalation"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Account / group / privilege changes on this host"
      query: '(((data_win_system_eventID:"4720" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756")) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp] .*/)))'
      pivot_on: [host]
      window: 6h
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672")'
      pivot_on: [user]
      window: 6h
    - name: "UAC-bypass / privilege-escalation binaries on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_parentImage:/.*(\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee])/)'
      pivot_on: [host]
      window: 2h
