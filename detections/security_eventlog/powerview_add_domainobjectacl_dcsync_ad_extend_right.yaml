name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
id: 2c99737c-585d-4431-b61a-c911d86ff32f
version: 1
schema_version: "1.0"
date: "2022-08-16"
author: Samir Bousseaden, Roberto Rodriguez @Cyb3rWard0g, oscd.community, Tim Shelton, Maxence Fossat
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2c99737c-585d-4431-b61a-c911d86ff32f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Backdooring domain object to grant the rights associated with DCSync to a
  regular user or machine account using Powerview\Add-DomainObjectAcl DCSync
  Extended Right cmdlet, will allow to re-obtain the pwd hashes of any
  user/computer. MITRE ATT&CK: T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5136"
        - term:
            data_win_eventdata_attributeLDAPDisplayName:
              value: "ntSecurityDescriptor"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_attributeValue:
                    value: "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_attributeValue:
                    value: "*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_attributeValue:
                    value: "*89e95b76-444d-4c62-991a-0facbeda640c*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_objectClass"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_objectClass:
                          value: "dnsNode"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_objectClass:
                          value: "dnsZoneScope"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_objectClass:
                          value: "dnsZone"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_attributeValue
    - data_win_eventdata_objectClass
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136';
  data_win_eventdata_attributeLDAPDisplayName equals 'ntSecurityDescriptor';
  data_win_eventdata_attributeValue matches
  '*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*', among other conditions.

known_false_positives: >
  New Domain Controller computer account, check user SIDs within the value
  attribute of event 5136 and verify if it's a regular user or DC computer
  account. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/menasec1/status/1111556090137903104
  - https://www.specterops.io/assets/resources/an_ace_up_the_sleeve.pdf
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    Powerview Add-DomainObjectAcl DCSync AD Extend Right detected on host
    $agent_name$. Matched data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. Matched
    data_win_eventdata_attributeValue: $data_win_eventdata_attributeValue$.
    MITRE ATT&CK: T1098
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other
    - field: data_win_eventdata_attributeValue
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1098
  custom_tags:
    - powerview
    - domainobjectacl
    - dcsync
    - windows_security
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Nn][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr]/ AND (data_win_eventdata_attributeValue:/.*1131[Ff]6[Aa][Dd]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/ OR data_win_eventdata_attributeValue:/.*1131[Ff]6[Aa][Aa]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/ OR data_win_eventdata_attributeValue:/.*89[Ee]95[Bb]76-444[Dd]-4[Cc]62-991[Aa]-0[Ff][Aa][Cc][Bb][Ee][Dd][Aa]640[Cc].*/) AND _exists_:data_win_eventdata_objectClass AND NOT (data_win_eventdata_objectClass:/[Dd][Nn][Ss][Nn][Oo][Dd][Ee]/ OR data_win_eventdata_objectClass:/[Dd][Nn][Ss][Zz][Oo][Nn][Ee][Ss][Cc][Oo][Pp][Ee]/ OR data_win_eventdata_objectClass:/[Dd][Nn][Ss][Zz][Oo][Nn][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e4a96dfd-667a-4487-b942-ccef5a1e81e8
    name: Windows Find Interesting ACL with FindInterestingDomainAcl
    reason: 'PowerView ACL hunting (Find-InterestingDomainAcl) is the usual precursor: the attacker finds an object they can WriteDACL on, then grants DCSync rights via Add-DomainObjectAcl.'
  - id: 028c7842-4243-41cd-be6f-12f3cf1a26c7
    name: AD Object WriteDAC Access
    reason: WriteDACL access (4662) on the domain object is the permission that allows the ACL edit; the same actor and session should appear just before the 5136 change.
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: Enumeration of privileged AD groups and users commonly precedes choosing which account to backdoor with replication rights.
  - id: 311b6ce2-7890-4383-a8c2-663a9f6b43cd
    name: Enabled User Right in AD to Control User Objects
    reason: Sibling AD privilege-delegation tampering (4704) by the same actor; both are ways of quietly granting control over directory objects.
  - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
    name: Active Directory User Backdoors
    reason: 'Co-occurring AD persistence: attackers who grant DCSync rights often also alter user attributes (SPN, AS-REP flag, SID history) to keep access.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Direct follow-on: once the granted account holds Replicating Directory Changes (All), it performs the DCSync and this 4662 detection fires.'
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: 'Follow-on execution: lsadump::dcsync using the newly delegated rights to pull krbtgt and admin hashes.'
  - id: 32e19d25-4aed-4860-a55a-be99cb0bf7ed
    name: Possible DC Shadow Attack
    reason: Another post-privilege AD manipulation technique that uses replication-related rights and directory changes to persist.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Directory replication access (DCSync) using replication GUIDs
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*89e95b76-444d-4c62-991a-0facbeda640c*)
    pivot_on:
    - user
    window: 24h
  - name: PowerView / ACL-editing tooling and DCSync commands
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Add-DomainObjectAcl* OR data_win_eventdata_commandLine:*Add-ObjectAcl* OR data_win_eventdata_commandLine:*PowerView* OR data_win_eventdata_commandLine:*Find-InterestingDomainAcl* OR data_win_eventdata_commandLine:*lsadump\:\:dcsync* OR data_win_eventdata_commandLine:*DCSync* OR data_win_eventdata_commandLine:/.*[Dd][Ss][Aa][Cc][Ll][Ss].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Add-DomainObjectAcl* OR data_win_eventdata_scriptBlockText:*Add-ObjectAcl* OR data_win_eventdata_scriptBlockText:*Get-DomainObjectAcl* OR data_win_eventdata_scriptBlockText:*DCSync*))
    pivot_on:
    - host
    window: 4h
  - name: Other directory object modifications by same account (5136/5137/5141)
    query: (data_win_system_eventID:"5136" OR data_win_system_eventID:"5137" OR data_win_system_eventID:"5141") AND NOT data_win_eventdata_objectClass:/[Dd][Nn][Ss].*/
    pivot_on:
    - user
    window: 4h
  - name: Credential dumping tools and NTDS/LSASS access following ACL change
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*ntdsutil* OR data_win_eventdata_commandLine:*secretsdump* OR data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*mimikatz* OR data_win_eventdata_commandLine:*ntds.dit*)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:*lsass.exe)
    pivot_on:
    - host
    window: 4h
  - name: Logons by the account that made the ACL change
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4769")
    pivot_on:
    - user
    window: 6h
