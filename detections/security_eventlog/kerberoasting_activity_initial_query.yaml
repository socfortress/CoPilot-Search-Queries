name: Kerberoasting Activity - Initial Query
id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
version: 1
schema_version: "1.0"
date: "2025-10-19"
author: "@kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This rule will collect the data needed to start looking into possible
  kerberoasting activity. Further analysis or computation within the query is
  needed focusing on requests from one specific host/IP towards multiple service
  names within a time period of 5 seconds. You can then set a threshold for the
  number of requests and time between the requests to turn this into an alert.
  MITRE ATT&CK: T1558.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4769"
        - term:
            data_win_eventdata_status:
              value: "0x0"
              case_insensitive: true
        - term:
            data_win_eventdata_ticketEncryptionType:
              value: "0x17"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_serviceName"
        - exists:
            field: "data_win_eventdata_targetUserName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_serviceName:
                          value: "*krbtgt"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceName: "*$"
                    - wildcard:
                        data_win_eventdata_targetUserName: "*$@*"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_status
    - data_win_eventdata_ticketEncryptionType
    - data_win_eventdata_serviceName
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4769'; data_win_eventdata_status equals '0x0';
  data_win_eventdata_ticketEncryptionType equals '0x17', among other conditions.

known_false_positives: >
  Legacy applications. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://www.trustedsec.com/blog/art_of_kerberoast/
  - https://adsecurity.org/?p=3513
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    Kerberoasting Activity - Initial Query detected on host $agent_name$.
    Matched data_win_eventdata_status: $data_win_eventdata_status$. Matched
    data_win_eventdata_ticketEncryptionType:
    $data_win_eventdata_ticketEncryptionType$. MITRE ATT&CK: T1558.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_status
      type: other
    - field: data_win_eventdata_ticketEncryptionType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - kerberoasting
    - initial
    - query
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4769" AND data_win_eventdata_status:/0[Xx]0/ AND data_win_eventdata_ticketEncryptionType:/0[Xx]17/ AND _exists_:data_win_eventdata_serviceName AND _exists_:data_win_eventdata_targetUserName AND NOT (data_win_eventdata_serviceName:/.*[Kk][Rr][Bb][Tt][Gg][Tt]/ OR data_win_eventdata_serviceName:/.*\$/ OR data_win_eventdata_targetUserName:/.*\$\@.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: 'Precursor: attackers enumerate SPN-bearing accounts with setspn before requesting RC4 service tickets for them.'
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: 'Precursor: PowerView SPN discovery selects the kerberoastable service accounts whose tickets are then requested (4769 / 0x17).'
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: 'Same behaviour from the process side: a CLI tool requesting service tickets is the likely source of the 4769 RC4 burst.'
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: Script-block evidence of the ticket requests (KerberosRequestorSecurityToken) that produce the 4769 events.
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: PowerView Invoke-Kerberoast style ticket request, the PowerShell implementation of this exact technique.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Rubeus kerberoast is the most common tool generating RC4 service ticket requests; also used for later ticket abuse.
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: Sibling offline-cracking Kerberos attack often run in the same session by the same actor.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD graph collection commonly precedes kerberoasting to pick high-value SPN accounts.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SPN enumeration and Kerberos roasting tooling (setspn, Rubeus, Invoke-Kerberoast)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ss][Pp][Nn].*-[QqTt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks requesting Kerberos service tickets
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*KerberosRequestorSecurityToken* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*Get-DomainSPNTicket* OR data_win_eventdata_scriptBlockText:*Get-NetUser* OR data_win_eventdata_scriptBlockText:*servicePrincipalName*)
    pivot_on:
    - host
    window: 2h
  - name: LDAP/AD enumeration for service accounts and BloodHound collection
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Vv][Dd][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Kerberos ticket and credential artefacts written to disk (kirbi, ccache, hash files)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.kirbi OR data_win_eventdata_targetFilename:*.ccache OR data_win_eventdata_targetFilename:*kerberoast* OR data_win_eventdata_targetFilename:*tgs* OR data_win_eventdata_targetFilename:*hashes.txt)
    pivot_on:
    - host
    window: 4h
  - name: Tool staging and download on the requesting host (ingress of roasting tooling)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Ii][Ee][Xx]).*/)
    pivot_on:
    - host
    window: 2h
