name: Remote Access Tool Services Have Been Installed - Security
id: c8b00925-926c-47e3-beea-298fd563728e
version: 1
schema_version: "1.0"
date: "2024-12-07"
author: Connor Martin, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c8b00925-926c-47e3-beea-298fd563728e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service installation of different remote access tools software. These
  software are often abused by threat actors to perform. MITRE ATT&CK:
  T1543.003, T1569.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*AmmyyAdmin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*AnyDesk*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Atera*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*BASupportExpressSrvcUpdater*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*BASupportExpressStandaloneService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*chromoting*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*GoToAssist*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*GoToMyPC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*jumpcloud*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*LMIGuardianSvc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*LogMeIn*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*monblanking*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Parsec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RManService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RPCPerformanceService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RPCService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*SplashtopRemoteService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*SSUService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*TeamViewer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*TightVNC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*vncserver*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Zoho*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceName matches
  '*AmmyyAdmin*'; data_win_eventdata_serviceName matches '*AnyDesk*', among
  other conditions.

known_false_positives: >
  The rule doesn't look for anything suspicious so false positives are expected.
  If you use one of the tools mentioned, comment it out. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://redcanary.com/blog/misbehaving-rats/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Remote Access Tool Services Have Been Installed - Security detected on host
    $agent_name$. Matched data_win_eventdata_serviceName:
    $data_win_eventdata_serviceName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1543.003, T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_serviceName
      type: service
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
    - T1569.002
  custom_tags:
    - services
    - installed
    - security
    - windows_security
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

