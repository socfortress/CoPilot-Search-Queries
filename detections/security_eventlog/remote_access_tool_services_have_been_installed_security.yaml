name: Remote Access Tool Services Have Been Installed - Security
id: c8b00925-926c-47e3-beea-298fd563728e
version: 1
schema_version: "1.0"
date: "2024-12-07"
author: Connor Martin, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c8b00925-926c-47e3-beea-298fd563728e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service installation of different remote access tools software. These
  software are often abused by threat actors to perform. MITRE ATT&CK:
  T1543.003, T1569.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*AmmyyAdmin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*AnyDesk*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Atera*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*BASupportExpressSrvcUpdater*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*BASupportExpressStandaloneService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*chromoting*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*GoToAssist*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*GoToMyPC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*jumpcloud*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*LMIGuardianSvc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*LogMeIn*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*monblanking*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Parsec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RManService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RPCPerformanceService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RPCService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*SplashtopRemoteService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*SSUService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*TeamViewer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*TightVNC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*vncserver*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Zoho*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceName matches
  '*AmmyyAdmin*'; data_win_eventdata_serviceName matches '*AnyDesk*', among
  other conditions.

known_false_positives: >
  The rule doesn't look for anything suspicious so false positives are expected.
  If you use one of the tools mentioned, comment it out. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://redcanary.com/blog/misbehaving-rats/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Remote Access Tool Services Have Been Installed - Security detected on host
    $agent_name$. Matched data_win_eventdata_serviceName:
    $data_win_eventdata_serviceName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1543.003, T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_serviceName
      type: service
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
    - T1569.002
  custom_tags:
    - services
    - installed
    - security
    - windows_security
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND (data_win_eventdata_serviceName:/.*[Aa][Mm][Mm][Yy][Yy][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_serviceName:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/ OR data_win_eventdata_serviceName:/.*[Aa][Tt][Ee][Rr][Aa].*/ OR data_win_eventdata_serviceName:/.*[Bb][Aa][Ss][Uu][Pp][Pp][Oo][Rr][Tt][Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ss][Rr][Vv][Cc][Uu][Pp][Dd][Aa][Tt][Ee][Rr].*/ OR data_win_eventdata_serviceName:/.*[Bb][Aa][Ss][Uu][Pp][Pp][Oo][Rr][Tt][Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ss][Tt][Aa][Nn][Dd][Aa][Ll][Oo][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Cc][Hh][Rr][Oo][Mm][Oo][Tt][Ii][Nn][Gg].*/ OR data_win_eventdata_serviceName:/.*[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt].*/ OR data_win_eventdata_serviceName:/.*[Gg][Oo][Tt][Oo][Mm][Yy][Pp][Cc].*/ OR data_win_eventdata_serviceName:/.*[Jj][Uu][Mm][Pp][Cc][Ll][Oo][Uu][Dd].*/ OR data_win_eventdata_serviceName:/.*[Ll][Mm][Ii][Gg][Uu][Aa][Rr][Dd][Ii][Aa][Nn][Ss][Vv][Cc].*/ OR data_win_eventdata_serviceName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn].*/ OR data_win_eventdata_serviceName:/.*[Mm][Oo][Nn][Bb][Ll][Aa][Nn][Kk][Ii][Nn][Gg].*/ OR data_win_eventdata_serviceName:/.*[Pp][Aa][Rr][Ss][Ee][Cc].*/ OR data_win_eventdata_serviceName:/.*[Rr][Mm][Aa][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Rr][Pp][Cc][Pp][Ee][Rr][Ff][Oo][Rr][Mm][Aa][Nn][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Rr][Pp][Cc][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp][Rr][Ee][Mm][Oo][Tt][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Ss][Ss][Uu][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr].*/ OR data_win_eventdata_serviceName:/.*[Tt][Ii][Gg][Hh][Tt][Vv][Nn][Cc].*/ OR data_win_eventdata_serviceName:/.*[Vv][Nn][Cc][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_serviceName:/.*[Zz][Oo][Hh][Oo].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: Silent AnyDesk install (--install --silent) is the command that registers the AnyDesk service this 4697 event reports; same tool, process-level view with parent and command line.
  - id: 75bfe6e6-cd8e-429e-91d3-03921e1d7962
    name: Remote Access Tool - ScreenConnect Installation Execution
    reason: ScreenConnect client installer execution is the precursor that creates the ScreenConnect service seen in 4697; reveals the installer path and relay.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Attackers push RMM installers remotely via PsExec; PSEXESVC service on the host shortly before the RAT service install indicates remote-deployed tooling.
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: 'Co-occurring service-registry persistence: attacker-installed RAT service often accompanied by other services with suspicious binary paths.'
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: 'Follow-on: after RMM persistence, actors add tunneling for backup remote access when the RAT is detected.'
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defense evasion commonly paired with RAT deployment so the newly installed remote tool is not quarantined.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: 'Follow-on: firewall disabling to let the installed remote access service communicate or accept inbound sessions.'
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: 'Co-occurring remote access enablement: attacker enabling RDP alongside the installed RAT service for redundant access.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RMM/RAT tool process execution and silent install command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Aa][Tt][Ee][Rr][Aa]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Rr][Uu][Tt][Oo][Ss][Ee][Rr][Vv]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|[Zz][Oo][Hh][Oo]|[Tt][Ii][Gg][Hh][Tt][Vv][Nn][Cc]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]).*/ OR data_win_eventdata_commandLine:/.*([Ss][Ii][Ll][Ee][Nn][Tt]|--install|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 2h
  - name: RMM/RAT installer or config files dropped to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Aa][Tt][Ee][Rr][Aa]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Rr][Uu][Tt][Oo][Ss][Ee][Rr][Vv]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|[Zz][Oo][Hh][Oo]|[Tt][Ii][Gg][Hh][Tt][Vv][Nn][Cc]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]).*\.([Ee][Xx][Ee]|[Mm][Ss][Ii]|[Cc][Oo][Nn][Ff]|[Dd][Ll][Ll])/
    pivot_on:
    - host
    window: 2h
  - name: RMM/RAT tool DNS lookups and outbound connections (relay/C2 check-in)
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Aa][Tt][Ee][Rr][Aa]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Nn][Gg][Rr][Oo][Kk]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|[Zz][Oo][Hh][Oo]|[Mm][Ee][Ss][Hh][Cc][Ee][Nn][Tt][Rr][Aa][Ll]).*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Aa][Tt][Ee][Rr][Aa]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Rr][Uu][Tt][Oo][Ss][Ee][Rr][Vv]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|[Zz][Oo][Hh][Oo]|[Tt][Ii][Gg][Hh][Tt][Vv][Nn][Cc]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Defense evasion and account tampering around RAT install
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]|[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]).*/) OR data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn]|[Nn][Ee][Tt] +[Uu][Ss][Ee][Rr]|[Nn][Ee][Tt] +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]|[Ff][Dd][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Remote and privileged logons by the installing account
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 6h
