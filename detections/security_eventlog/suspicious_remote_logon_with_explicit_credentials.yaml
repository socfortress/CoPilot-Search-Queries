name: Suspicious Remote Logon with Explicit Credentials
id: 941e5c45-cda7-4864-8cea-bbb7458d194a
version: 1
schema_version: "1.0"
date: "2022-08-03"
author: oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford @svch0st, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 941e5c45-cda7-4864-8cea-bbb7458d194a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious processes logging on with explicit credentials. MITRE
  ATT&CK: T1078.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4648"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\winrs.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\net.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\net1.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetServerName"
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - exists:
            field: "data_win_eventdata_targetUserName"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_targetServerName:
                          value: "localhost"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_subjectUserName: "*$"
                          - wildcard:
                              data_win_eventdata_targetUserName: "*$"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_processName
    - data_win_eventdata_targetServerName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4648'; data_win_eventdata_processName matches
  '*\cmd.exe'; data_win_eventdata_processName matches '*\powershell.exe', among
  other conditions.

known_false_positives: >
  Administrators that use the RunAS command or scheduled tasks. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
  - https://attack.mitre.org/techniques/T1078/

response:
  message: >
    Suspicious Remote Logon with Explicit Credentials detected on host
    $agent_name$. Matched data_win_eventdata_processName:
    $data_win_eventdata_processName$. Matched
    data_win_eventdata_targetServerName: $data_win_eventdata_targetServerName$.
    MITRE ATT&CK: T1078
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_processName
      type: process
    - field: data_win_eventdata_targetServerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078
  custom_tags:
    - logon
    - explicit
    - credentials
    - windows_security
    - privilege_escalation
    - persistence
    - initial_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4648" AND (data_win_eventdata_processName:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_targetServerName AND _exists_:data_win_eventdata_subjectUserName AND _exists_:data_win_eventdata_targetUserName AND NOT (data_win_eventdata_targetServerName:/[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]/ OR (data_win_eventdata_subjectUserName:/.*\$/ AND data_win_eventdata_targetUserName:/.*\$/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 472159c5-31b9-4f56-b794-b766faa8b0a7
    name: Suspicious LSASS Access Via MalSecLogon
    reason: Secondary-logon (runas-style) abuse is the same explicit-credential 4648 mechanism; MalSecLogon pairs it with LSASS access to steal or reuse the credentials just supplied.
  - id: 50d66fb0-03f8-4da0-8add-84e77d12a020
    name: Suspicious RunAs-Like Flag Combination
    reason: 'Command-line precursor: a runas-style /user + /netonly or /savecred invocation is what generates the 4648 event from cmd/powershell.'
  - id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
    name: Potential Lateral Movement via Windows Remote Shell
    reason: 'winrs.exe is in this rule''s process list; explicit creds to a remote server followed by winrs /r: is a direct lateral-movement follow-on.'
  - id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
    name: WMIC Remote Command Execution
    reason: 'wmic.exe /node: with /user:/password: uses the explicit credentials that trigger 4648 to execute commands on the target server.'
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Explicit-credential logon to a remote server is commonly followed by PsExec-based remote service execution with -u/-p.
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Impacket wmiexec/smbexec/atexec use supplied credentials against the same targetServerName; confirms the logon was lateral movement tooling.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: Remote execution landing on the target (WmiPrvSE/wsmprovhost/DCOM spawning PowerShell) is the receiving-side proof of the credentialed hop.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: Attackers who obtained and reuse credentials often enable WDigest to harvest further plaintext credentials on hosts they pivot to.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote-execution child processes (WinRM/WMI/PsExec/DCOM) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\(wsmprovhost|WmiPrvSE|PSEXESVC|mmc|winrshost)\.exe/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Rr][Ss][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Network logons (type 3/9 NewCredentials) by this account
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
  - name: Admin share / remote file access (ADMIN$, C$, IPC$) by this account
    query: (data_win_system_eventID:"5140" OR data_win_system_eventID:"5145") AND (data_win_eventdata_shareName:/.*(ADMIN|IPC|[A-Za-z])\$/ OR data_win_eventdata_shareName:*ADMIN*)
    pivot_on:
    - user
    window: 2h
  - name: Remote service installation (7045/4697) on this host
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_serviceFileName:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_serviceFileName:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_serviceFileName:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/ OR data_win_eventdata_serviceFileName:/.*\\\\.*/ OR data_win_eventdata_serviceFileName:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential-supplying commands (runas /netonly, net use /user, cmdkey, wmic /node, winrs /r) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Aa][Ss].*\/([Nn][Ee][Tt][Oo][Nn][Ll][Yy]|[Ss][Aa][Vv][Ee][Cc][Rr][Ee][Dd]).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?(\.[Ee][Xx][Ee])? +[Uu][Ss][Ee] .*\/[Uu][Ss][Ee][Rr]:.*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd][Kk][Ee][Yy].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee]:.*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Ss].*-?\/?[Rr]:.*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/)
    pivot_on:
    - host
    window: 1h
