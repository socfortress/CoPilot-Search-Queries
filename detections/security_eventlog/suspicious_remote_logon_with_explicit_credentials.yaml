name: Suspicious Remote Logon with Explicit Credentials
id: 941e5c45-cda7-4864-8cea-bbb7458d194a
version: 1
schema_version: "1.0"
date: "2022-08-03"
author: oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford @svch0st, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 941e5c45-cda7-4864-8cea-bbb7458d194a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious processes logging on with explicit credentials. MITRE
  ATT&CK: T1078.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4648"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\winrs.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\net.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\net1.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetServerName"
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - exists:
            field: "data_win_eventdata_targetUserName"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_targetServerName:
                          value: "localhost"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_subjectUserName: "*$"
                          - wildcard:
                              data_win_eventdata_targetUserName: "*$"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_processName
    - data_win_eventdata_targetServerName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4648'; data_win_eventdata_processName matches
  '*\cmd.exe'; data_win_eventdata_processName matches '*\powershell.exe', among
  other conditions.

known_false_positives: >
  Administrators that use the RunAS command or scheduled tasks. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
  - https://attack.mitre.org/techniques/T1078/

response:
  message: >
    Suspicious Remote Logon with Explicit Credentials detected on host
    $agent_name$. Matched data_win_eventdata_processName:
    $data_win_eventdata_processName$. Matched
    data_win_eventdata_targetServerName: $data_win_eventdata_targetServerName$.
    MITRE ATT&CK: T1078
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_processName
      type: process
    - field: data_win_eventdata_targetServerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078
  custom_tags:
    - logon
    - explicit
    - credentials
    - windows_security
    - privilege_escalation
    - persistence
    - initial_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4648" AND (data_win_eventdata_processName:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_targetServerName AND _exists_:data_win_eventdata_subjectUserName AND _exists_:data_win_eventdata_targetUserName AND NOT (data_win_eventdata_targetServerName:/[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]/ OR (data_win_eventdata_subjectUserName:/.*\$/ AND data_win_eventdata_targetUserName:/.*\$/))

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0255a820-e564-4e40-af2b-6ac61160335c
      name: "A New Trust Was Created To A Domain"
      reason: "next kill-chain tactic: Persistence"
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
      name: "Account Tampering - Suspicious Failed Logon Reasons"
      reason: "next kill-chain tactic: Initial Access"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
      name: "Active Directory User Backdoors"
      reason: "next kill-chain tactic: Persistence"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
