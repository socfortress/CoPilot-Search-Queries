name: Password Protected ZIP File Opened
id: 00ba9da1-b510-4f6b-b258-8d338836180f
version: 1
schema_version: "1.0"
date: "2022-05-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 00ba9da1-b510-4f6b-b258-8d338836180f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the extraction of password protected ZIP archives. See the filename
  variable for more details on which file has been opened. MITRE ATT&CK: T1027.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5379"
        - wildcard:
            data_win_eventdata_targetName:
              value: "*Microsoft_Windows_Shell_ZipFolder:filename*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_targetName:
                    value: "*\\\\Temporary Internet Files\\\\Content.Outlook*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5379'; data_win_eventdata_targetName matches
  '*Microsoft_Windows_Shell_ZipFolder:filename*'; data_win_eventdata_targetName
  matches '*\Temporary Internet Files\Content.Outlook*'.

known_false_positives: >
  Legitimate used of encrypted ZIP files. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/sbousseaden/status/1523383197513379841
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Password Protected ZIP File Opened detected on host $agent_name$. Matched
    data_win_eventdata_targetName: $data_win_eventdata_targetName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - password
    - protected
    - opened
    - windows_security
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5379" AND data_win_eventdata_targetName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]_[Ss][Hh][Ee][Ll][Ll]_[Zz][Ii][Pp][Ff][Oo][Ll][Dd][Ee][Rr]:[Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee].*/ AND _exists_:data_win_eventdata_targetName AND NOT (data_win_eventdata_targetName:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: Password-protected archives are used to smuggle ISO/IMG containers past mail scanners; the opened ZIP is the delivery step and this shows the nested container being launched.
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: Attachment opened from Outlook temp is the typical origin of an encrypted ZIP lure; payload executed from that folder confirms the phishing chain.
  - id: 146aace8-9bd6-42ba-be7a-0070d8027b76
    name: Potentially Suspicious Child Process Of WinRAR.EXE
    reason: After the archive is opened and extracted, an archiver spawning cmd/powershell/script hosts is the direct follow-on payload launch.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Extracted password-protected lures are often Office docs with macros; Office spawning shells/LOLBins is the next execution stage.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Outlook launching the archive handler or a script from a mailed attachment links the ZIP open back to the phishing email.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Encrypted ZIPs commonly carry JS/VBS/HTA droppers which are run by wscript/cscript/mshta right after extraction.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Dropper script from the extracted archive launching PowerShell/cmd/rundll32 is the stager step following the unzip.
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: Emotet/QakBot-style campaigns ship password-protected ZIPs containing LNK loaders; this is the specific execution that follows.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive/extracted content launching scripts or LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:(/.*[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR /.*[7][Zz].*/ OR /.*[Ww][Ii][Nn][Rr][Aa][Rr].*/ OR /.*[Ww][Ii][Nn][Zz][Ii][Pp].*/) AND data_win_eventdata_image:(/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR /.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR /.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR /.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR /.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR /.*[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Executable/script/container files written to temp or download paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(/.*\\[Tt][Ee][Mm][Pp]?\\.*/ OR /.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR /.*[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk].*/) AND data_win_eventdata_targetFilename:(*.exe OR *.dll OR *.js OR *.jse OR *.vbs OR *.vbe OR *.hta OR *.lnk OR *.iso OR *.img OR *.scr OR *.bat OR *.ps1 OR *.docm OR *.xlsm)
    pivot_on:
    - host
    window: 1h
  - name: Mounted ISO/IMG or LNK launched from extracted content
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:(/.*\.[Ll][Nn][Kk].*/ OR /.*\.[Ii][Ss][Oo].*/ OR /.*\.[Ii][Mm][Gg].*/) AND (data_win_eventdata_parentImage:/.*[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 1h
  - name: 'Outbound C2/download after unzip: network connections from script hosts and LOLBins'
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:(/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR /.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR /.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR /.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR /.*[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR /.*[\\][Tt][Ee][Mm][Pp]\\.*/ OR /.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence set by user-writable binaries after archive open
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
