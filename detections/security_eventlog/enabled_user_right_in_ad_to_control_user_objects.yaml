name: Enabled User Right in AD to Control User Objects
id: 311b6ce2-7890-4383-a8c2-663a9f6b43cd
version: 1
schema_version: "1.0"
date: "2021-12-02"
author: "@neu5ron"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 311b6ce2-7890-4383-a8c2-663a9f6b43cd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects scenario where if a user is assigned the SeEnableDelegationPrivilege
  right in Active Directory it would allow control of other AD user objects.
  MITRE ATT&CK: T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4704"
        - wildcard:
            data_win_eventdata_privilegeList:
              value: "*SeEnableDelegationPrivilege*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_privilegeList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4704'; data_win_eventdata_privilegeList
  matches '*SeEnableDelegationPrivilege*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.harmj0y.net/activedirectory/the-most-dangerous-user-right-you-probably-have-never-heard-of/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    Enabled User Right in AD to Control User Objects detected on host
    $agent_name$. Matched data_win_eventdata_privilegeList:
    $data_win_eventdata_privilegeList$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1098
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_privilegeList
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1098
  custom_tags:
    - right
    - control
    - objects
    - windows_security
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4704" AND data_win_eventdata_privilegeList:/.*[Ss][Ee][Ee][Nn][Aa][Bb][Ll][Ee][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ii][Oo][Nn][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1c480e10-7ee1-46d4-8ed2-85f9789e3ce4
    name: Group Policy Abuse for Privilege Addition
    reason: SeEnableDelegationPrivilege is normally granted via a GPO User Rights Assignment; GPO-based privilege grants are the usual mechanism behind a 4704 on a DC.
  - id: e5ac86dd-2da1-454b-be74-05d26c769d7d
    name: Windows Default Domain GPO Modification
    reason: Editing the Default Domain/DC policy is the direct way to assign the right to a controlled account, preceding the 4704 event.
  - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
    name: Active Directory User Backdoors
    reason: The right exists to set msDS-AllowedToDelegateTo on accounts; changes of that attribute or SPNs on users are the follow-on backdoor.
  - id: fbf9e47f-e531-4fea-942d-5c95af7ed4d6
    name: Windows PowerView Unconstrained Delegation Discovery
    reason: Attackers enumerate delegation configuration before or after being granted the right to pick accounts to abuse.
  - id: 86dc8176-6e6c-42d6-9684-5444c6557ab3
    name: Windows PowerView Constrained Delegation Discovery
    reason: Enumeration of constrained-delegation targets is the recon step that precedes configuring delegation with this right.
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: 'Co-occurring AD privilege-backdoor technique: the same actor commonly grants DCSync rights alongside delegation rights for persistence.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Follow-on: once delegation/privileges are controlled, DCSync-style replication by a user account dumps domain credentials.'
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: Precursor recon of privileged AD users/groups to pick which account to empower.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Delegation attribute changes on AD objects (AllowedToDelegateTo / S4U)
    query: (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/.*([Mm][Ss][Dd][Ss]-[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Tt][Oo]|[Mm][Ss][Dd][Ss]-[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Aa][Cc][Tt][Oo][Nn][Bb][Ee][Hh][Aa][Ll][Ff]).*/) OR (data_win_system_eventID:"4742" AND data_win_eventdata_allowedToDelegateTo:*) OR (data_win_system_eventID:"4738" AND data_win_eventdata_allowedToDelegateTo:*)
    pivot_on:
    - host
    window: 6h
  - name: User account control flag / SPN changes on user objects (TrustedToAuthForDelegation)
    query: (data_win_system_eventID:"4738" AND (data_win_eventdata_userAccountControl:*  OR data_win_eventdata_servicePrincipalNames:*)) OR (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/.*([Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Delegation tooling and AD attribute edits via command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Rr][Uu][Bb][Ee][Uu][Ss]|[Ss]4[Uu]|[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Tt][Oo]|[Ss][Ee][Tt]-[Aa][Dd][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll]|[Ss][Ee][Tt]-[Aa][Dd][Oo][Bb][Jj][Ee][Cc][Tt]|[Ss][Ee][Cc][Ee][Dd][Ii][Tt]|[Ll][Dd][Ii][Ff][Dd][Ee]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Privilege assignment and special-privilege logons by this account
    query: data_win_system_eventID:"4672" OR data_win_system_eventID:"4703" OR data_win_system_eventID:"4704" OR data_win_system_eventID:"4705"
    pivot_on:
    - user
    window: 6h
  - name: Group Policy object modifications in AD
    query: data_win_system_eventID:"5136" AND data_win_eventdata_objectClass:/.*([Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr]).*/
    pivot_on:
    - host
    window: 6h
