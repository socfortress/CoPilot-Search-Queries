name: Metasploit Or Impacket Service Installation Via SMB PsExec
id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Bartlomiej Czyz, Relativity
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of Metasploit SMB PsExec (exploit/windows/smb/psexec) and
  Impacket psexec.py by triggering on specific service installation. MITRE
  ATT&CK: T1021.002, T1570, T1569.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - regexp:
            data_win_eventdata_serviceFileName: "(%systemroot%\\\\[a-zA-Z]{8}\\.exe)"
        - regexp:
            data_win_eventdata_serviceName: "([a-zA-Z]{4})|([a-zA-Z]{8})|([a-zA-Z]{16})"
        - term:
            data_win_eventdata_serviceStartType: "3"
        - term:
            data_win_eventdata_serviceType:
              value: "0x10"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_serviceName"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_serviceName:
                    value: "PSEXESVC"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_serviceName
    - data_win_eventdata_serviceStartType
    - data_win_eventdata_serviceType
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches the regex /(%systemroot%\\[a-zA-Z]{8}\.exe)/;
  data_win_eventdata_serviceName matches the regex
  /([a-zA-Z]{4})|([a-zA-Z]{8})|([a-zA-Z]{16})/, among other conditions.

known_false_positives: >
  Possible, different agents with a 8 character binary and a 4, 8 or 16
  character service name. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://bczyz1.github.io/2021/01/30/psexec.html
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1570/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Metasploit Or Impacket Service Installation Via SMB PsExec detected on host
    $agent_name$. Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1021.002, T1570, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1570
    - T1569.002
  custom_tags:
    - metasploit
    - impacket
    - service
    - windows_security
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/(%systemroot%\\[a-zA-Z]{8}\.exe)/ AND data_win_eventdata_serviceName:/([a-zA-Z]{4})|([a-zA-Z]{8})|([a-zA-Z]{16})/ AND data_win_eventdata_serviceStartType:"3" AND data_win_eventdata_serviceType:/0[Xx]10/ AND _exists_:data_win_eventdata_serviceName AND NOT (data_win_eventdata_serviceName:/[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: Same Impacket psexec.py tool seen through its IPC$ named-pipe signature (RemCom/-stdin/-stdout/-stderr pipes); co-occurs with the service install on the same target within seconds.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: The remote service creation that produces the 4697 is driven over the svcctl pipe from the attacker host; confirms the install was remote, not local.
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: PsExec-style tools first copy the 8-char random .exe into ADMIN$ over SMB; this is the file-drop step immediately preceding the service install.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Another view of the same 4697 service creation, flagging the creating client/account as unusual, confirming the remote origin.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Impacket/Metasploit psexec is commonly run with a stolen NTLM hash; the preceding network logon is often a pass-the-hash authentication.
  - id: 72124974-a68b-4366-b990-d30e0b2a190d
    name: Metasploit SMB Authentication
    reason: Metasploit smb/psexec authenticates over SMB just before it installs the service; links the install to the Metasploit framework.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Process-level view of a PsExec-type service binary executing under services.exe, the execution that follows the service install.
  - id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
    name: Possible Impacket SecretDump Remote Activity
    reason: 'Likely follow-on: the same operator with admin SMB access commonly runs secretsdump to harvest hashes for further lateral movement.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Random-named service binary executed by services.exe, or spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss]ervices\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Ww]indows\\[a-zA-Z]{8}\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\(cmd|powershell|rundll32|mshta|wscript|cscript)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Random 8-char executable dropped into Windows directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww]indows\\[a-zA-Z]{8}\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: ADMIN$/IPC$ share and svcctl/RemCom pipe access
    query: (data_win_system_eventID:"5140" OR data_win_system_eventID:"5145") AND (data_win_eventdata_shareName:*ADMIN\$* OR data_win_eventdata_shareName:*IPC\$*) AND (data_win_eventdata_relativeTargetName:*svcctl* OR data_win_eventdata_relativeTargetName:*RemCom* OR data_win_eventdata_relativeTargetName:*.exe OR data_win_eventdata_shareName:*ADMIN\$*)
    pivot_on:
    - host
    window: 1h
  - name: Network NTLM logons with privileges by the installing account
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:NTLM) OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 6h
  - name: Post-exploitation credential access and new services on host
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*reg*save*HKLM\\SAM* OR *reg*save*HKLM\\SYSTEM* OR *ntdsutil* OR *vssadmin*shadow*))
    pivot_on:
    - host
    window: 2h
