name: Metasploit Or Impacket Service Installation Via SMB PsExec
id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Bartlomiej Czyz, Relativity
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of Metasploit SMB PsExec (exploit/windows/smb/psexec) and
  Impacket psexec.py by triggering on specific service installation. MITRE
  ATT&CK: T1021.002, T1570, T1569.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - regexp:
            data_win_eventdata_serviceFileName: "(%systemroot%\\\\[a-zA-Z]{8}\\.exe)"
        - regexp:
            data_win_eventdata_serviceName: "([a-zA-Z]{4})|([a-zA-Z]{8})|([a-zA-Z]{16})"
        - term:
            data_win_eventdata_serviceStartType: "3"
        - term:
            data_win_eventdata_serviceType:
              value: "0x10"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_serviceName"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_serviceName:
                    value: "PSEXESVC"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_serviceName
    - data_win_eventdata_serviceStartType
    - data_win_eventdata_serviceType
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches the regex /(%systemroot%\\[a-zA-Z]{8}\.exe)/;
  data_win_eventdata_serviceName matches the regex
  /([a-zA-Z]{4})|([a-zA-Z]{8})|([a-zA-Z]{16})/, among other conditions.

known_false_positives: >
  Possible, different agents with a 8 character binary and a 4, 8 or 16
  character service name. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://bczyz1.github.io/2021/01/30/psexec.html
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1570/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Metasploit Or Impacket Service Installation Via SMB PsExec detected on host
    $agent_name$. Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1021.002, T1570, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1570
    - T1569.002
  custom_tags:
    - metasploit
    - impacket
    - service
    - windows_security
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/(%systemroot%\\[a-zA-Z]{8}\.exe)/ AND data_win_eventdata_serviceName:/([a-zA-Z]{4})|([a-zA-Z]{8})|([a-zA-Z]{16})/ AND data_win_eventdata_serviceStartType:"3" AND data_win_eventdata_serviceType:/0[Xx]10/ AND _exists_:data_win_eventdata_serviceName AND NOT (data_win_eventdata_serviceName:/[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]/)

