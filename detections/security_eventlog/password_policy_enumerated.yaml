name: Password Policy Enumerated
id: 12ba6a38-adb3-4d6b-91ba-a7fb248e3199
version: 1
schema_version: "1.0"
date: "2023-05-19"
author: Zach Mathis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 12ba6a38-adb3-4d6b-91ba-a7fb248e3199
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the password policy is enumerated. MITRE ATT&CK: T1201.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4661"
        - wildcard:
            data_win_eventdata_accessList: "*%%5392*"
        - term:
            data_win_eventdata_objectServer:
              value: "Security Account Manager"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_accessList
    - data_win_eventdata_objectServer
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4661'; data_win_eventdata_accessList matches
  '*%%5392*'; data_win_eventdata_objectServer equals 'Security Account Manager'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4661
  - https://github.com/jpalanco/alienvault-ossim/blob/f74359c0c027e42560924b5cff25cdf121e5505a/os-sim/agent/src/ParserUtil.py#L951
  - https://attack.mitre.org/techniques/T1201/

response:
  message: >
    Password Policy Enumerated detected on host $agent_name$. Matched
    data_win_eventdata_accessList: $data_win_eventdata_accessList$. Matched
    data_win_eventdata_objectServer: $data_win_eventdata_objectServer$. MITRE
    ATT&CK: T1201
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_accessList
      type: other
    - field: data_win_eventdata_objectServer
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1201
  custom_tags:
    - password
    - policy
    - enumerated
    - windows_security
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4661" AND data_win_eventdata_accessList:/.*%%5392.*/ AND data_win_eventdata_objectServer:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Aa][Cc][Cc][Oo][Uu][Nn][Tt] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
