name: Password Policy Enumerated
id: 12ba6a38-adb3-4d6b-91ba-a7fb248e3199
version: 1
schema_version: "1.0"
date: "2023-05-19"
author: Zach Mathis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 12ba6a38-adb3-4d6b-91ba-a7fb248e3199
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the password policy is enumerated. MITRE ATT&CK: T1201.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4661"
        - wildcard:
            data_win_eventdata_accessList: "*%%5392*"
        - term:
            data_win_eventdata_objectServer:
              value: "Security Account Manager"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_accessList
    - data_win_eventdata_objectServer
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4661'; data_win_eventdata_accessList matches
  '*%%5392*'; data_win_eventdata_objectServer equals 'Security Account Manager'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4661
  - https://github.com/jpalanco/alienvault-ossim/blob/f74359c0c027e42560924b5cff25cdf121e5505a/os-sim/agent/src/ParserUtil.py#L951
  - https://attack.mitre.org/techniques/T1201/

response:
  message: >
    Password Policy Enumerated detected on host $agent_name$. Matched
    data_win_eventdata_accessList: $data_win_eventdata_accessList$. Matched
    data_win_eventdata_objectServer: $data_win_eventdata_objectServer$. MITRE
    ATT&CK: T1201
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_accessList
      type: other
    - field: data_win_eventdata_objectServer
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1201
  custom_tags:
    - password
    - policy
    - enumerated
    - windows_security
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4661" AND data_win_eventdata_accessList:/.*%%5392.*/ AND data_win_eventdata_objectServer:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Aa][Cc][Cc][Oo][Uu][Nn][Tt] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: net accounts / net user / net group are the usual commands that trigger the SAM 4661 policy query; the process-creation view names the actor and parent process
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: 'Same SAMR-based discovery phase: operators who read the password policy typically also enumerate privileged groups and members right afterwards'
  - id: ab6bffca-beff-4baa-af11-6733f296d57a
    name: Potential AD User Enumeration From Non-Machine Account
    reason: Co-occurring account enumeration by the same non-machine user via directory/SAM object access, used to build the target user list for spraying
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: AdFind is a common tool that dumps domain password policy and accounts in one pass; a co-occurring recon tool on the same host
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: SharpHound collectors query SAM/domain policy over SAMR as part of full AD collection, so the 4661 hit may be a byproduct of it
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain controller and trust discovery commonly sits next to policy enumeration in the first minutes of domain recon
  - id: f8748f2c-89dc-4d95-afb0-5a2dfdbad332
    name: SAM Registry Hive Handle Request
    reason: Escalation from reading SAM policy metadata to requesting handles on the SAM hive itself for credential extraction
  - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
    name: Account Tampering - Suspicious Failed Logon Reasons
    reason: Knowing lockout threshold and complexity lets attackers tune password spraying; failed logons with bad-password/disabled reasons are the likely follow-on
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Net/AD recon command lines querying accounts and policy
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?(\.[Ee][Xx][Ee])? +(accounts|user|group|localgroup).*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Aa][Dd][Dd]efault[Dd]omain[Pp]assword[Pp]olicy.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Dd]omain[Pp]olicy.*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on:
    - host
    window: 1h
  - name: Other SAM / directory object access events on this account
    query: (data_win_system_eventID:"4661" OR data_win_system_eventID:"4662" OR data_win_system_eventID:"4798" OR data_win_system_eventID:"4799")
    pivot_on:
    - user
    window: 2h
  - name: Failed logons and password spraying pattern from this host
    query: (data_win_system_eventID:"4625" OR data_win_system_eventID:"4771" OR data_win_system_eventID:"4776")
    pivot_on:
    - host
    window: 4h
  - name: Successful network logons by this account after the recon
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
  - name: Credential access from SAM/registry hives or LSASS on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]eg(\.[Ee][Xx][Ee])? +(save|export).*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss]ecretsdump.*/ OR data_win_eventdata_commandLine:/.*[Mm]imikatz.*/ OR data_win_eventdata_commandLine:/.*[Ll]sadump.*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
