name: Device Installation Blocked
id: c9eb55c3-b468-40ab-9089-db2862e42137
version: 1
schema_version: "1.0"
date: "2022-10-14"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c9eb55c3-b468-40ab-9089-db2862e42137
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an installation of a device that is forbidden by the system policy.
  MITRE ATT&CK: T1200.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "6423"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '6423'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Yamato-Security/EnableWindowsLogSettings/blob/7f6d755d45ac7cc9fc35b0cbf498e6aa4ef19def/ConfiguringSecurityLogAuditPolicies.md
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6423
  - https://attack.mitre.org/techniques/T1200/

response:
  message: >
    Device Installation Blocked detected on host $agent_name$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    Matched data_win_eventdata_subjectLogonId:
    $data_win_eventdata_subjectLogonId$. MITRE ATT&CK: T1200
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_subjectUserName
      type: user
    - field: data_win_eventdata_subjectLogonId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1200
  custom_tags:
    - device
    - installation
    - blocked
    - windows_security
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"6423"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-wpdbusenum-registry-usb-device-001
    name: Windows WPDBusEnum Registry Key Modification - USB Device Detection
    reason: 'Same physical-device plug-in event seen from the registry side: confirms which USB/portable device was enumerated around the blocked install, including ones policy did not block'
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: 'Follow-on: when policy blocks a device, an attacker with a shell may try to side-load or force-install a driver through pnputil to bypass the restriction'
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: 'Follow-on: a custom driver for a rogue device or a BYOVD component staged and loaded from a temp path after the install was refused'
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: 'Follow-on: a payload delivered from a removable device or a HID-injected keystroke script typically establishes Run-key persistence within minutes'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell or script interpreter launched from explorer or Run dialog (HID keystroke injection)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Encoded or download-cradle PowerShell on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_commandLine:*\-[Ee][Nn][Cc]* OR data_win_eventdata_commandLine:*[Ii][Ee][Xx]* OR data_win_eventdata_commandLine:*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]* OR data_win_eventdata_commandLine:*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]* OR data_win_eventdata_commandLine:*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee]* OR data_win_eventdata_commandLine:*[Hh][Ii][Dd][Dd][Ee][Nn]*)
    pivot_on:
    - host
    window: 1h
  - name: Executables or scripts dropped to user-writable or startup paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Ll][Nn][Kk]|[Ss][Yy][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections by script or LOLBin processes after device insertion
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
