name: T1047 Wmiprvse Wbemcomn DLL Hijack
id: f6c68d5f-e101-4b86-8c84-7d96851fd65c
version: 1
schema_version: "1.0"
date: "2022-02-24"
author: Roberto Rodriguez @Cyb3rWard0g, Open Threat Research (OTR)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f6c68d5f-e101-4b86-8c84-7d96851fd65c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a threat actor creating a file named `wbemcomn.dll` in the
  `C:\Windows\System32\wbem\` directory over the network for a WMI DLL Hijack
  scenario. MITRE ATT&CK: T1047, T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - wildcard:
            data_win_eventdata_relativeTargetName:
              value: "*\\\\wbem\\\\wbemcomn.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_subjectUserName: "*$"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_relativeTargetName
  matches '*\wbem\wbemcomn.dll'; data_win_eventdata_subjectUserName matches
  '*$'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/201009-RemoteWMIWbemcomnDLLHijack/notebook.html
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    T1047 Wmiprvse Wbemcomn DLL Hijack detected on host $agent_name$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1047, T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_relativeTargetName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1021.002
  custom_tags:
    - t1047
    - wmiprvse
    - wbemcomn
    - windows_security
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_relativeTargetName:/.*\\[Ww][Bb][Ee][Mm]\\[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_subjectUserName AND NOT (data_win_eventdata_subjectUserName:/.*\$/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7707a579-e0d8-4886-a853-ce47e4575aaa
    name: Wmiprvse Wbemcomn DLL Hijack
    reason: 'Host-side confirmation of the same attack: the planted wbemcomn.dll gets loaded by WmiPrvSE.exe when the attacker triggers a remote WMI call (Sysmon EID 7), proving the share write became code execution.'
  - id: d21374ff-f574-44a7-9998-4a8c8bf33d7d
    name: WmiPrvSE Spawned A Process
    reason: 'Direct consequence: once the hijacked DLL or a WMI Win32_Process.Create call runs, children are spawned by WmiPrvSE.exe, typically under SYSTEM.'
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: 'Follow-on: the hijacked WmiPrvSE hosts attacker payloads, so cmd/powershell/rundll32 children of WmiPrvSE are the typical payload stage.'
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: 'Common post-exploitation payload: PowerShell launched by WmiPrvSE after remote WMI execution (wmiexec-style lateral movement).'
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Impacket wmiexec produces SMB share activity followed by cmd.exe /Q /c with output redirected to an ADMIN$ file, a co-occurring toolkit signature for remote WMI lateral movement.
  - id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
    name: HackTool - Wmiexec Default Powershell Command
    reason: Wmiexec-style tooling run through WmiPrvSE uses a characteristic default PowerShell command; confirms the remote WMI execution after the DLL drop.
  - id: 24869767-8579-485d-9a4f-d9ddfd8f0cac
    name: Process Execution via WMI
    reason: Alternative remote execution path (Win32_Process.Create) the attacker uses to launch the process that triggers or follows the DLL hijack.
  - id: 2f7979ae-f82b-45af-ac1d-2b10e93b0baa
    name: Potential DCOM InternetExplorer.Application DLL Hijack
    reason: 'Sibling technique: attacker plants a DLL over SMB and triggers it through remote DCOM/WMI; if both fire the actor is cycling through remote DLL hijack lateral movement methods.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wbemcomn.dll written or loaded outside System32 on this host
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn]\.[Dd][Ll][Ll]/) OR (data_win_system_eventID:"7" AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: Processes spawned by WmiPrvSE after the DLL drop
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other remote file writes to admin shares (SMB 5145)
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:*ADMIN* OR data_win_eventdata_shareName:*C$* OR data_win_eventdata_shareName:*IPC$*) AND (data_win_eventdata_relativeTargetName:*.dll OR data_win_eventdata_relativeTargetName:*.exe OR data_win_eventdata_relativeTargetName:*.bat OR data_win_eventdata_relativeTargetName:*.ps1 OR data_win_eventdata_relativeTargetName:*svcctl OR data_win_eventdata_relativeTargetName:*atsvc)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Network logons (type 3) by this account
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR (data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 6h
  - name: Persistence and service creation following remote WMI execution
    query: (data_win_system_eventID:"7045") OR (data_win_system_eventID:"4697") OR (data_win_system_eventID:"4698") OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on:
    - host
    window: 4h
