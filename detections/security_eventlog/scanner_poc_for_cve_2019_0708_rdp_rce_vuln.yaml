name: Scanner PoC for CVE-2019-0708 RDP RCE Vuln
id: 8400629e-79a9-4737-b387-5db940ab2367
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Florian Roth (Nextron Systems), Adam Bradbury (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8400629e-79a9-4737-b387-5db940ab2367
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of a scanner by zerosum0x0 that discovers targets vulnerable
  to CVE-2019-0708 RDP RCE aka BlueKeep. MITRE ATT&CK: T1210.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4625"
        - term:
            data_win_eventdata_targetUserName:
              value: "AAAAAAA"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4625'; data_win_eventdata_targetUserName
  equals 'AAAAAAA'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/AdamTheAnalyst/status/1134394070045003776
  - https://web.archive.org/web/20190710034152/https://github.com/zerosum0x0/CVE-2019-0708
  - https://attack.mitre.org/techniques/T1210/

response:
  message: >
    Scanner PoC for CVE-2019-0708 RDP RCE Vuln detected on host $agent_name$.
    Matched data_win_eventdata_targetUserName:
    $data_win_eventdata_targetUserName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1210
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: user
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1210
  custom_tags:
    - scanner
    - windows_security
    - lateral_movement
    - car_2013_07_002
    - emerging_threats
    - cve_2019_0708
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4625" AND data_win_eventdata_targetUserName:/[Aa][Aa][Aa][Aa][Aa][Aa][Aa]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: aaa5b30d-f418-420b-83a0-299cb6024885
    name: Potential RDP Exploit CVE-2019-0708
    reason: 'Same CVE: the BlueKeep scanner probe (failed logon as AAAAAAA) is the reconnaissance step; this detects the actual exploit attempt or termdd crash on the same RDP service that follows.'
  - id: 8e5c03fa-b7f0-11ea-b242-07e0576828d9
    name: Denied Access To Remote Desktop
    reason: Co-occurring RDP access refusals from the same source show the scanner/attacker repeatedly hitting the host's RDP listener.
  - id: 51e33403-2a37-4d66-a574-1fda1782cc31
    name: RDP Login from Localhost
    reason: After a successful BlueKeep or credential compromise, attackers pivot through a local RDP tunnel; a loopback RDP logon on the scanned host indicates post-compromise tunneling.
  - id: 5bed80b6-b3e8-428e-a3ae-d3c757589e41
    name: RDP over Reverse SSH Tunnel WFP
    reason: 'Likely follow-on once an exposed RDP host is footholded: attacker tunnels RDP over reverse SSH to keep access.'
  - id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
    name: Outbound RDP Connections Over Non-Standard Tools
    reason: A compromised host used as a pivot makes outbound RDP to other hosts, the lateral movement the scanner (T1210) is meant to enable.
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: 'Persistence step after gaining execution via RDP exploitation: attacker grants RDP rights to an account.'
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Attacker with code execution opens the firewall for RDP so they can return interactively.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Failed network logons (type 3/10) from same source probing RDP/NLA
    query: data_win_system_eventID:"4625" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - ip
    window: 2h
  - name: Successful RDP/network logons following the scan
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"7" OR data_win_eventdata_logonType:"3")
    pivot_on:
    - host
    window: 2h
  - name: Shell spawned by svchost (RDP service exploit execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]3[2]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound RDP connections from this host (scanner propagation or pivot)
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389"
    pivot_on:
    - host
    window: 4h
  - name: RDP enablement, firewall opening or RDP group changes via commandline
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*3389.*/)
    pivot_on:
    - host
    window: 4h
