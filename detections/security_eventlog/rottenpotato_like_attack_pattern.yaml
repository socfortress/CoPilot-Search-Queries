name: RottenPotato Like Attack Pattern
id: 16f5d8ca-44bd-47c8-acbe-6fc95a16c12f
version: 1
schema_version: "1.0"
date: "2022-12-22"
author: "@SBousseaden, Florian Roth"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 16f5d8ca-44bd-47c8-acbe-6fc95a16c12f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects logon events that have characteristics of events generated during an
  attack with RottenPotato and the like. MITRE ATT&CK: T1557.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4624"
        - term:
            data_win_eventdata_logonType: "3"
        - term:
            data_win_eventdata_targetUserName:
              value: "ANONYMOUS LOGON"
              case_insensitive: true
        - term:
            data_win_eventdata_workstationName: "-"
        - bool:
            should:
              - term:
                  data_win_eventdata_ipAddress: "127.0.0.1"
              - term:
                  data_win_eventdata_ipAddress: "::1"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_targetUserName
    - data_win_eventdata_workstationName
    - data_win_eventdata_ipAddress
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_logonType equals
  '3'; data_win_eventdata_targetUserName equals 'ANONYMOUS LOGON', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1195284233729777665
  - https://attack.mitre.org/techniques/T1557/001/

response:
  message: >
    RottenPotato Like Attack Pattern detected on host $agent_name$. Matched
    data_win_eventdata_logonType: $data_win_eventdata_logonType$. Matched
    data_win_eventdata_targetUserName: $data_win_eventdata_targetUserName$.
    MITRE ATT&CK: T1557.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_targetUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.001
  custom_tags:
    - rottenpotato
    - attack
    - pattern
    - windows_security
    - collection
    - privilege_escalation
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_targetUserName:/[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ll][Oo][Gg][Oo][Nn]/ AND data_win_eventdata_workstationName:"-" AND (data_win_eventdata_ipAddress:"127.0.0.1" OR data_win_eventdata_ipAddress:"::1")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: 'The potato binary itself: a SeImpersonate abuser coerces a SYSTEM NTLM auth to a local listener, producing exactly this loopback ANONYMOUS LOGON 4624.'
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: LocalPotato is another local NTLM reflection/relay potato whose loopback authentication leaves the same type-3 localhost logon artifact.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Sibling SYSTEM token-theft technique (cmd echo to a named pipe, PrintSpoofer/getsystem style) used when a service-account foothold escalates to SYSTEM.
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: Potato variants relay a coerced local SMB/NTLM authentication; relay tooling process execution is the direct precursor of the loopback logon.
  - id: f89b08d0-77ad-4728-817b-9b16c5a69c7a
    name: HackTool - SharpImpersonation Execution
    reason: Token impersonation tooling run once the stolen SYSTEM or admin token is obtained from the potato exploit.
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: 'Direct payoff of a successful potato: a service-account process spawns a child running as NT AUTHORITY\SYSTEM.'
  - id: 79ce34ca-af29-4d0e-b832-fc1b377020db
    name: Whoami.EXE Execution From Privileged Process
    reason: Attackers run whoami in the new SYSTEM shell to confirm escalation immediately after the exploit succeeds.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: 'Common follow-on once SYSTEM is held: SYSTEM-context execution and lateral movement via PsExec-style service children.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Potato / token-impersonation tool execution on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Oo][Tt][Aa][Tt][Oo]|\\[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff]|\\[Ss][Pp][Oo][Oo][Ll][Ss][Aa][Mm][Pp][Ll][Ee]|\\[Ee][FF][Ss][Pp][Oo][Tt][Aa][Tt][Oo]|\\[Ss][Ww][Ee][Ee][Tt][Pp][Oo][Tt][Aa][Tt][Oo]|\\[Rr][Oo][Gg][Uu][Ee][Pp][Oo][Tt][Aa][Tt][Oo]|\\[Ss][Hh][Aa][Rr][Pp][Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ii][Oo][Nn])[^\\]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Pp][Oo][Tt][Aa][Tt][Oo]|[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff]|[Ss][Ee][Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ee]).*/)
    pivot_on:
    - host
    window: 1h
  - name: SYSTEM-integrity child process spawned from a service-account parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*(NT AUTHORITY.SYSTEM|NT-AUTORITÄT.SYSTEM).*/ AND (data_win_eventdata_parentImage:/.*(\\[Ww]3[Ww][Pp]|\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]|\\[Ss][Qq][Ll][Ww][Ss][Ee][Rr][Vv][Ee][Rr]|\\[Tt][Oo][Mm][Cc][Aa][Tt][0-9]*|\\[Jj][Aa][Vv][Aa]|\\[Ww][Ww][Ww][Pp][Uu][Bb]).*/ OR data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Post-escalation account creation, admin-group add and service/task persistence
    query: (data_win_system_eventID:"4720" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4697" OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4698" OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]1? +([Uu][Ss][Ee][Rr]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*\/[Aa][Dd][Dd]|[Ss][Cc](\.[Ee][Xx][Ee])? +[Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping and Defender tampering after SYSTEM access
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Rr][Ee][Gg](\.[Ee][Xx][Ee])? +[Ss][Aa][Vv][Ee] +[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Lateral movement from this host using the escalated machine/SYSTEM identity
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND NOT data_win_eventdata_ipAddress:"127.0.0.1" AND NOT data_win_eventdata_ipAddress:"::1" AND NOT data_win_eventdata_targetUserName:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss].*/) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"135"))
    pivot_on:
    - host
    window: 2h
