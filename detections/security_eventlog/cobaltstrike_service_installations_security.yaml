name: CobaltStrike Service Installations - Security
id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
version: 1
schema_version: "1.0"
date: "2022-11-27"
author: Florian Roth (Nextron Systems), Wojciech Lesicki
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects known malicious service installs that appear in cases in which a
  Cobalt Strike beacon elevates privileges or lateral movement. MITRE ATT&CK:
  T1021.002, T1543.003, T1569.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*ADMIN$*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*.exe*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*%COMSPEC%*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*start*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*powershell*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*powershell -nop -w hidden -encodedcommand*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*SUVYIChOZXctT2JqZWN0IE5ldC5XZWJjbGllbnQpLkRvd25sb2FkU3RyaW5nKCdodHRwOi8vMTI3LjAuMC4xO*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*lFWCAoTmV3LU9iamVjdCBOZXQuV2ViY2xpZW50KS5Eb3dubG9hZFN0cmluZygnaHR0cDovLzEyNy4wLjAuMT*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*JRVggKE5ldy1PYmplY3QgTmV0LldlYmNsaWVudCkuRG93bmxvYWRTdHJpbmcoJ2h0dHA6Ly8xMjcuMC4wLjE6*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*ADMIN$*'; data_win_eventdata_serviceFileName matches '*.exe*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sans.org/webcasts/119395
  - https://www.crowdstrike.com/blog/getting-the-bacon-from-cobalt-strike-beacon/
  - https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    CobaltStrike Service Installations - Security detected on host $agent_name$.
    Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1021.002, T1543.003, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1543.003
    - T1569.002
  custom_tags:
    - cobaltstrike
    - service
    - installations
    - windows_security
    - persistence
    - execution
    - privilege_escalation
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND ((data_win_eventdata_serviceFileName:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/ AND data_win_eventdata_serviceFileName:/.*\.[Ee][Xx][Ee].*/) OR (data_win_eventdata_serviceFileName:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/ AND data_win_eventdata_serviceFileName:/.*[Ss][Tt][Aa][Rr][Tt].*/ AND data_win_eventdata_serviceFileName:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/) OR data_win_eventdata_serviceFileName:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll] -[Nn][Oo][Pp] -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] -[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_serviceFileName:/.*[Ss][Uu][Vv][Yy][Ii][Cc][Hh][Oo][Zz][Xx][Cc][Tt][Tt]2[Jj][Qq][Zz][Ww][Nn]0[Ii][Ee]5[Ll][Dd][Cc]5[Xx][Zz][Ww][Jj][Jj][Bb][Gg][Ll][Ll][Bb][Nn][Qq][Pp][Ll][Kk][Rr][Vv][Dd]25[Ss][Bb]2[Ff][Kk][Uu]3[Rr][Yy][Aa][Ww]5[Nn][Kk][Cc][Dd][Oo][Dd][Hh][Rr][Ww][Oo][Ii]8[Vv][Mm][Tt][Ii]3[Ll][Jj][Aa][Uu][Mm][Cc]4[Xx][Oo].*/ OR data_win_eventdata_serviceFileName:/.*[Ll][Ff][Ww][Cc][Aa][Oo][Tt][Mm][Vv]3[Ll][Uu]9[Ii][Aa][Mm][Vv][Jj][Dd][Cc][Bb][Oo][Zz][Xx][Qq][Uu][Vv]2[Vv][Ii][Yy]2[Xx][Pp][Zz][Ww]50[Kk][Ss]5[Ee][Bb]3[Dd][Uu][Bb][Gg]9[Hh][Zz][Ff][Nn]0[Cc][Mm][Ll][Uu][Zz][Yy][Gg][Nn][Aa][Hh][Rr]0[Cc][Dd][Oo][Vv][Ll][Zz][Ee][Yy][Nn][Yy]4[Ww][Ll][Jj][Aa][Uu][Mm][Tt].*/ OR data_win_eventdata_serviceFileName:/.*[Jj][Rr][Vv][Gg][Gg][Kk][Ee]5[Ll][Dd][Yy]1[Pp][Yy][Mm][Pp][Ll][Yy]3[Qq][Gg][Tt][Mm][Vv]0[Ll][Ll][Dd][Ll][Yy][Mm][Nn][Ss][Aa][Ww][Vv][Uu][Dd][Cc][Kk][Uu][Rr][Gg]93[Bb][Mm][Xx][Vv][Yy][Ww][Rr][Tt][Dd][Hh][Jj][Pp][Bb][Mm][Cc][Oo][Jj]2[Hh]0[Dd][Hh][Aa]6[Ll][Yy]8[Xx][Mm][Jj][Cc][Uu][Mm][Cc]4[Ww][Ll][Jj][Ee]6.*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0255a820-e564-4e40-af2b-6ac61160335c
      name: "A New Trust Was Created To A Domain"
      reason: "next kill-chain tactic: Persistence"
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
      name: "Account Tampering - Suspicious Failed Logon Reasons"
      reason: "next kill-chain tactic: Persistence"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
      name: "Active Directory User Backdoors"
      reason: "next kill-chain tactic: Persistence"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Service execution on this host"
      query: '((data_win_system_eventID:"7045") OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)))'
      pivot_on: [host]
      window: 4h
    - name: "Service installation / creation on this host"
      query: '((data_win_system_eventID:"7045") OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)))'
      pivot_on: [host]
      window: 4h
    - name: "Remote-execution / lateral-movement tooling on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))'
      pivot_on: [host]
      window: 2h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))'
      pivot_on: [host]
      window: 1h
