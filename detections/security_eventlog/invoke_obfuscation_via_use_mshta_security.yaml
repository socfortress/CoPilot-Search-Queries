name: Invoke-Obfuscation Via Use MSHTA - Security
id: 9b8d9203-4e0f-4cd9-bb06-4cc4ea6d0e9a
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9b8d9203-4e0f-4cd9-bb06-4cc4ea6d0e9a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via use MSHTA in Scripts. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*mshta*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*vbscript:createobject*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*.run*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*window.close*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*mshta*'; data_win_eventdata_serviceFileName matches
  '*vbscript:createobject*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Use MSHTA - Security detected on host $agent_name$.
    Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - mshta
    - windows_security
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*[Mm][Ss][Hh][Tt][Aa].*/ AND data_win_eventdata_serviceFileName:/.*[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]:[Cc][Rr][Ee][Aa][Tt][Ee][Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_serviceFileName:/.*\.[Rr][Uu][Nn].*/ AND data_win_eventdata_serviceFileName:/.*[Ww][Ii][Nn][Dd][Oo][Ww]\.[Cc][Ll][Oo][Ss][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7e9c7999-0f9b-4d4a-a6ed-af6d553d4af4
    name: Invoke-Obfuscation Via Use MSHTA - System
    reason: Same vbscript:createobject/mshta service ImagePath logged as System 7045 by the SCM; confirms the service really installed, not just that 4697 was audited.
  - id: ac20ae82-8758-4f38-958e-b44a3140ca88
    name: Invoke-Obfuscation Via Use MSHTA
    reason: Sysmon process-creation view of the same mshta vbscript:createobject .Run window.close launcher when the service starts or it is launched directly.
  - id: e55a5195-4724-480e-a77e-3ebe64bd3759
    name: Invoke-Obfuscation Via Use MSHTA - PowerShell
    reason: Same Invoke-Obfuscation MSHTA launcher delivered through PowerShell script blocks; shows the obfuscated PowerShell that was wrapped into the service command.
  - id: a0873b32-5b68-11eb-ae93-0242ac130002
    name: Detect mshta inline hta execution
    reason: mshta executing inline script (vbscript:/javascript:) is the runtime behaviour the installed service performs once started.
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: 'Follow-on: the mshta/VBScript stub typically proxies the real payload through rundll32 or regsvr32.'
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Command-bearing services via 4697 are the PsExec/lateral-movement pattern; same event ID, so shows whether this service came over SMB.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: 'Co-occurring 4697: the installing account/logon session of this service is unusual, indicating remote or hijacked-account installation.'
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: sc.exe/New-Service process that created the service whose binary path holds the mshta payload; the precursor of this 4697.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mshta.exe launched with inline script or from a service parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]:.*/ OR data_win_eventdata_commandLine:/.*[Jj][Aa][Vv][Aa][Ss][Cc][Rr][Ii][Pp][Tt]:.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by mshta.exe (payload proxying)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: mshta.exe network connections or DNS lookups
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Service creation and registry ImagePath written with mshta or script-host payload
    query: (data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*([Mm][Ss][Hh][Tt][Aa]|[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]).*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ AND data_win_eventdata_details:/.*([Mm][Ss][Hh][Tt][Aa]|[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Network and service logons by the installing account (lateral movement)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 4h
