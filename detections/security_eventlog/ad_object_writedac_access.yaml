name: AD Object WriteDAC Access
id: 028c7842-4243-41cd-be6f-12f3cf1a26c7
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 028c7842-4243-41cd-be6f-12f3cf1a26c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects WRITE_DAC access to a domain object. MITRE ATT&CK: T1222.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4662"
        - term:
            data_win_eventdata_objectServer:
              value: "DS"
              case_insensitive: true
        - term:
            data_win_eventdata_accessMask:
              value: "0x40000"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_objectType:
                    value: "19195a5b-6da0-11d0-afd3-00c04fd930c9"
                    case_insensitive: true
              - term:
                  data_win_eventdata_objectType:
                    value: "domainDNS"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectServer
    - data_win_eventdata_accessMask
    - data_win_eventdata_objectType
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4662'; data_win_eventdata_objectServer equals
  'DS'; data_win_eventdata_accessMask equals '0x40000', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/180815-ADObjectAccessReplication/notebook.html
  - https://threathunterplaybook.com/library/windows/active_directory_replication.html
  - https://threathunterplaybook.com/hunts/windows/190101-ADModDirectoryReplication/notebook.html
  - https://attack.mitre.org/techniques/T1222/001/

response:
  message: >
    AD Object WriteDAC Access detected on host $agent_name$. Matched
    data_win_eventdata_objectServer: $data_win_eventdata_objectServer$. Matched
    data_win_eventdata_accessMask: $data_win_eventdata_accessMask$. MITRE
    ATT&CK: T1222.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_objectServer
      type: other
    - field: data_win_eventdata_accessMask
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1222.001
  custom_tags:
    - object
    - writedac
    - windows_security
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4662" AND data_win_eventdata_objectServer:/[Dd][Ss]/ AND data_win_eventdata_accessMask:/0[Xx]40000/ AND (data_win_eventdata_objectType:/19195[Aa]5[Bb]-6[Dd][Aa]0-11[Dd]0-[Aa][Ff][Dd]3-00[Cc]04[Ff][Dd]930[Cc]9/ OR data_win_eventdata_objectType:/[Dd][Oo][Mm][Aa][Ii][Nn][Dd][Nn][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e4a96dfd-667a-4487-b942-ccef5a1e81e8
    name: Windows Find Interesting ACL with FindInterestingDomainAcl
    reason: 'Precursor: attackers enumerate domain ACLs with PowerView to find an object they can WriteDAC on before modifying the domain root DACL.'
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: 'Same act seen from the directory side: WriteDAC on domainDNS is how replication extended rights are granted to a controlled account.'
  - id: 01c42d3c-242d-4655-85b2-34f1739632f7
    name: Potentially Over Permissive Permissions Granted Using Dsacls.EXE
    reason: Command-line alternative to PowerView for granting rights on the domain object, which would produce this 4662 WriteDAC event.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Follow-on: once the DACL grants replication rights, the account performs DCSync, logged as 4662 replication GUIDs from a non-DC account.'
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Alternate credential theft path after DACL tampering when the attacker lands on a DC and exports NTDS.dit.
  - id: 94dc4390-6b7c-4784-8ffc-335334404650
    name: Dump Ntds.dit To Suspicious Location
    reason: Follow-on domain credential harvesting by NTDS.dit dumping once domain-level privilege is obtained.
  - id: 10fb649c-3600-4d37-b1e6-56ea90bb7e09
    name: User Added To Highly Privileged Group
    reason: 'Parallel persistence: an actor able to rewrite domain DACLs often also adds accounts to Domain Admins or similar groups.'
  - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
    name: Addition of SID History to Active Directory Object
    reason: Co-occurring AD privilege-persistence technique used by actors who hold rights to modify domain objects.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DCSync replication rights exercised (non-machine account)
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*89e95b76-444d-4c62-991a-0facbeda640c*)
    pivot_on:
    - user
    window: 6h
  - name: Domain object security descriptor changes (5136/4670)
    query: (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Nn][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr]/) OR data_win_system_eventID:"4670"
    pivot_on:
    - user
    window: 6h
  - name: ACL tooling and DCSync/NTDS tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ss][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*Add-DomainObjectAcl* OR data_win_eventdata_commandLine:*Add-ObjectAcl* OR data_win_eventdata_commandLine:*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]* OR data_win_eventdata_commandLine:*[Dd][Cc][Ss][Yy][Nn][Cc]* OR data_win_eventdata_commandLine:*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks manipulating AD ACLs
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Add-DomainObjectAcl* OR data_win_eventdata_scriptBlockText:*Set-Acl* OR data_win_eventdata_scriptBlockText:*ActiveDirectoryAccessRule* OR data_win_eventdata_scriptBlockText:*Find-InterestingDomainAcl* OR data_win_eventdata_scriptBlockText:*Get-DomainObjectAcl*)
    pivot_on:
    - host
    window: 4h
  - name: Privileged group membership changes by this account
    query: data_win_system_eventID:("4728" OR "4732" OR "4756" OR "4670" OR "5136")
    pivot_on:
    - user
    window: 24h
