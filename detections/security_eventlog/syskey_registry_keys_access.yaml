name: SysKey Registry Keys Access
id: 9a4ff3b8-6187-4fd2-8e8b-e0eae1129495
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9a4ff3b8-6187-4fd2-8e8b-e0eae1129495
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects handle requests and access operations to specific registry keys to
  calculate the SysKey. MITRE ATT&CK: T1012.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4656"
              - term:
                  data_win_system_eventID: "4663"
            minimum_should_match: 1
        - term:
            data_win_eventdata_objectType:
              value: "key"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*lsa\\\\JD"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*lsa\\\\GBG"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*lsa\\\\Skew1"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*lsa\\\\Data"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_system_eventID equals '4663';
  data_win_eventdata_objectType equals 'key', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190625-RegKeyAccessSyskey/notebook.html
  - https://attack.mitre.org/techniques/T1012/

response:
  message: >
    SysKey Registry Keys Access detected on host $agent_name$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. MITRE
    ATT&CK: T1012
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1012
  custom_tags:
    - syskey
    - registry
    - windows_security
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4656" OR data_win_system_eventID:"4663") AND data_win_eventdata_objectType:/[Kk][Ee][Yy]/ AND (data_win_eventdata_objectName:/.*[Ll][Ss][Aa]\\[Jj][Dd]/ OR data_win_eventdata_objectName:/.*[Ll][Ss][Aa]\\[Gg][Bb][Gg]/ OR data_win_eventdata_objectName:/.*[Ll][Ss][Aa]\\[Ss][Kk][Ee][Ww]1/ OR data_win_eventdata_objectName:/.*[Ll][Ss][Aa]\\[Dd][Aa][Tt][Aa]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Reading the LSA JD/GBG/Skew1/Data keys is how the boot key is derived to decrypt SAM/SECURITY hives; reg save of those hives is the matching local acquisition step
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: SysKey access is needed to decrypt an exported SAM; a SAM/SYSTEM hive file written to disk confirms the offline credential-extraction workflow
  - id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
    name: Possible Impacket SecretDump Remote Activity
    reason: secretsdump remotely reads the same LSA boot-key registry values via the remote registry service; this is the remote variant of the same behaviour
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: Follow-on file artifacts of remote SAM/LSA secret dumping that begins with boot key (SysKey) reads
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: Alternative SAM/SYSTEM acquisition path whose output needs the SysKey for decryption
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Living-off-the-land copy of locked SAM hive, a sibling credential-hive acquisition step to the boot key read
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: lsadump::sam/secrets in Mimikatz reads these LSA keys to compute the SysKey, the likely tool behind the registry access
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: On a domain controller, local SysKey/secrets access is commonly followed by DCSync to obtain domain-wide hashes
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive export (SAM/SYSTEM/SECURITY) via reg/esentutl/ntdsutil
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]).*([Hh][Kk][Ll][Mm]\\|[Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/) OR (data_win_eventdata_image:/.*\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Aa][Mm]|[Vv][Ss][Ss]).*/) OR (data_win_eventdata_image:/.*\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ii][Ff][Mm].*/))
    pivot_on:
    - host
    window: 1h
  - name: Credential hive or dump files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Yy][Ss][Tt][Ee][Mm])(\.[Ss][Aa][Vv][Ee]|\.[Bb][Aa][Kk]|\.[Hh][Ii][Vv][Ee])?/ OR data_win_eventdata_targetFilename:*ntds.dit* OR data_win_eventdata_targetFilename:*.dmp)
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping tools and LSASS access
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*lsadump* OR data_win_eventdata_commandLine:*secretsdump* OR data_win_eventdata_commandLine:*procdump*))
    pivot_on:
    - host
    window: 2h
  - name: Remote registry / admin share access from another host (remote secretsdump)
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_relativeTargetName:*winreg* OR data_win_eventdata_relativeTargetName:*svcctl* OR data_win_eventdata_shareName:*ADMIN$* OR data_win_eventdata_shareName:*C$*)
    pivot_on:
    - host
    window: 1h
  - name: Network logons by this account (credential reuse after dumping)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
