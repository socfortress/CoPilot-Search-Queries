name: Metasploit SMB Authentication
id: 72124974-a68b-4366-b990-d30e0b2a190d
version: 1
schema_version: "1.0"
date: "2024-01-25"
author: Chakib Gzenayi (@Chak092), Hosni Mribah
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 72124974-a68b-4366-b990-d30e0b2a190d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Alerts on Metasploit host's authentications on the domain. MITRE ATT&CK:
  T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_system_eventID: "4625"
                          - term:
                              data_win_system_eventID: "4624"
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_logonType: "3"
                    - term:
                        data_win_eventdata_authenticationPackageName:
                          value: "NTLM"
                          case_insensitive: true
                    - regexp:
                        data_win_eventdata_workstationName: "([A-Za-z0-9]{16})"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4776"
                    - regexp:
                        data_win_eventdata_workstation: "([A-Za-z0-9]{16})"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_authenticationPackageName
    - data_win_eventdata_workstationName
    - data_win_eventdata_workstation
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4625'; data_win_system_eventID equals '4624';
  data_win_eventdata_logonType equals '3', among other conditions.

known_false_positives: >
  Linux hostnames composed of 16 characters. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/rapid7/metasploit-framework/blob/1416b5776d963f21b7b5b45d19f3e961201e0aed/lib/rex/proto/smb/client.rb
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Metasploit SMB Authentication detected on host $agent_name$. Matched
    data_win_eventdata_logonType: $data_win_eventdata_logonType$. Matched
    data_win_eventdata_authenticationPackageName:
    $data_win_eventdata_authenticationPackageName$. MITRE ATT&CK: T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_authenticationPackageName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - metasploit
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_win_system_eventID:"4625" OR data_win_system_eventID:"4624") AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm]/ AND data_win_eventdata_workstationName:/([A-Za-z0-9]{16})/) OR (data_win_system_eventID:"4776" AND data_win_eventdata_workstation:/([A-Za-z0-9]{16})/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: 'Direct follow-on: after Metasploit''s random 16-char workstation NTLM auth succeeds, psexec modules install a service over SMB (event 7045/4697) on the same host.'
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: Same SMB-authenticated remote execution step; Impacket and Metasploit psexec share the ADMIN$/svcctl pattern that follows the authentication.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: After network logon, remote service creation goes through the svcctl pipe over IPC$; confirms the authentication was used for execution.
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: Metasploit psexec uploads its service binary to ADMIN$/C$ right after authenticating; this is the file-drop step.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Service installed (4697) by a network-logon session from an unusual client is the execution outcome of this authentication.
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: Post-exploitation Meterpreter getsystem service install typically follows once a Metasploit session lands on the host.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Metasploit SMB auth is often performed with a stolen NTLM hash; type 3 NTLM logons with PtH characteristics corroborate credential reuse.
  - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
    name: Account Tampering - Suspicious Failed Logon Reasons
    reason: Metasploit smb_login brute-forcing produces bursts of 4625 failures with specific failure reasons preceding the successful 4624.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote service installation and PsExec-style execution on this host
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_serviceName:/.*[Pp][Ss][Ee][Xx][Ee].*/ OR data_win_eventdata_serviceName:/[A-Za-z]{4,20}/ OR data_win_eventdata_serviceFileName:/.*([Aa][Dd][Mm][Ii][Nn]\$|%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp]ower[Ss]hell|\\\\.*\\.*\.[Ee][Xx][Ee]).*/)
    pivot_on:
    - host
    window: 1h
  - name: ADMIN$/C$ share access and file drops over SMB
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:/.*([Aa][Dd][Mm][Ii][Nn]|[Cc]|[Ii][Pp][Cc])\$/) AND (data_win_eventdata_relativeTargetName:/.*(\.[Ee][Xx][Ee]|\.[Dd][Ll][Ll]|svcctl|[Ss][Vv][Cc][Cc][Tt][Ll]|atsvc|[Ss][Rr][Vv][Ss][Vv][Cc]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by services.exe or cmd/PowerShell from remote execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp]ower[Ss]hell|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[A-Za-z0-9]{6,16}\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Failed-then-successful network NTLM logons from the same source IP (spray/brute force)
    query: (data_win_system_eventID:"4625" OR data_win_system_eventID:"4624" OR data_win_system_eventID:"4776") AND data_win_eventdata_ipAddress:* AND NOT data_win_eventdata_ipAddress:"-" AND NOT data_win_eventdata_ipAddress:"127.0.0.1"
    pivot_on:
    - ip
    window: 4h
  - name: Outbound SMB lateral movement and credential theft from this host
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135") AND data_win_eventdata_initiated:"true" AND NOT data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
