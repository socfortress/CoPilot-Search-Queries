name: Metasploit SMB Authentication
id: 72124974-a68b-4366-b990-d30e0b2a190d
version: 1
schema_version: "1.0"
date: "2024-01-25"
author: Chakib Gzenayi (@Chak092), Hosni Mribah
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 72124974-a68b-4366-b990-d30e0b2a190d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Alerts on Metasploit host's authentications on the domain. MITRE ATT&CK:
  T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_system_eventID: "4625"
                          - term:
                              data_win_system_eventID: "4624"
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_logonType: "3"
                    - term:
                        data_win_eventdata_authenticationPackageName:
                          value: "NTLM"
                          case_insensitive: true
                    - regexp:
                        data_win_eventdata_workstationName: "([A-Za-z0-9]{16})"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4776"
                    - regexp:
                        data_win_eventdata_workstation: "([A-Za-z0-9]{16})"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_authenticationPackageName
    - data_win_eventdata_workstationName
    - data_win_eventdata_workstation
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4625'; data_win_system_eventID equals '4624';
  data_win_eventdata_logonType equals '3', among other conditions.

known_false_positives: >
  Linux hostnames composed of 16 characters. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/rapid7/metasploit-framework/blob/1416b5776d963f21b7b5b45d19f3e961201e0aed/lib/rex/proto/smb/client.rb
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Metasploit SMB Authentication detected on host $agent_name$. Matched
    data_win_eventdata_logonType: $data_win_eventdata_logonType$. Matched
    data_win_eventdata_authenticationPackageName:
    $data_win_eventdata_authenticationPackageName$. MITRE ATT&CK: T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_authenticationPackageName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - metasploit
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_win_system_eventID:"4625" OR data_win_system_eventID:"4624") AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm]/ AND data_win_eventdata_workstationName:/([A-Za-z0-9]{16})/) OR (data_win_system_eventID:"4776" AND data_win_eventdata_workstation:/([A-Za-z0-9]{16})/))

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
    - id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
      name: "Audit CVE Event"
      reason: "next kill-chain tactic: Lateral Movement"
  window: 1h
