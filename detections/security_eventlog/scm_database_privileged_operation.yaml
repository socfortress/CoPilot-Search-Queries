name: SCM Database Privileged Operation
id: dae8171c-5ec6-4396-b210-8466585b53e9
version: 1
schema_version: "1.0"
date: "2022-09-18"
author: Roberto Rodriguez @Cyb3rWard0g, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dae8171c-5ec6-4396-b210-8466585b53e9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects non-system users performing privileged operation os the SCM database.
  MITRE ATT&CK: T1548.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4674"
        - term:
            data_win_eventdata_objectType:
              value: "SC_MANAGER OBJECT"
              case_insensitive: true
        - term:
            data_win_eventdata_objectName:
              value: "servicesactive"
              case_insensitive: true
        - term:
            data_win_eventdata_privilegeList:
              value: "SeTakeOwnershipPrivilege"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_subjectLogonId"
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_subjectLogonId:
                          value: "0x3e4"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*:\\\\Windows\\\\System32\\\\services.exe"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_privilegeList
    - data_win_eventdata_subjectLogonId
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4674'; data_win_eventdata_objectType equals
  'SC_MANAGER OBJECT'; data_win_eventdata_objectName equals 'servicesactive',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190826-RemoteSCMHandle/notebook.html
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    SCM Database Privileged Operation detected on host $agent_name$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. MITRE
    ATT&CK: T1548
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548
  custom_tags:
    - database
    - privileged
    - operation
    - windows_security
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4674" AND data_win_eventdata_objectType:/[Ss][Cc]_[Mm][Aa][Nn][Aa][Gg][Ee][Rr] [Oo][Bb][Jj][Ee][Cc][Tt]/ AND data_win_eventdata_objectName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss][Aa][Cc][Tt][Ii][Vv][Ee]/ AND data_win_eventdata_privilegeList:/[Ss][Ee][Tt][Aa][Kk][Ee][Oo][Ww][Nn][Ee][Rr][Ss][Hh][Ii][Pp][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]/ AND _exists_:data_win_eventdata_subjectLogonId AND _exists_:data_win_eventdata_processName AND NOT (data_win_eventdata_subjectLogonId:/0[Xx]3[Ee]4/ AND data_win_eventdata_processName:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6c8fbee5-dee8-49bc-851d-c3142d02aa47
    name: Allow Service Access Using Security Descriptor Tampering Via Sc.EXE
    reason: SeTakeOwnership on the SCM ServicesActive object is the precondition for rewriting service security descriptors; sc sdset is the follow-on that grants the attacker service control
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: 'Same SCM-permission abuse path: after taking SCM ownership, attackers reconfigure service binpath or permissions to run code as SYSTEM'
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: Non-services.exe process opening the SCM with privileged rights is the remote service-creation handle pattern that PsExec-style lateral movement produces
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: Impacket psexec/smbexec opens the SCM over RPC from a non-services.exe process and then installs a service, producing 4674 followed by service creation
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Cobalt Strike psexec and getsystem create a service right after obtaining an SCM handle; confirms the SCM operation was a service-based execution step
  - id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
    reason: Getsystem installs a short-lived service via the SCM to escalate to SYSTEM, the escalation this privileged SCM access enables
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Offensive tool service registered through the SCM after the privileged operation confirms malicious service installation
  - id: f0d1feba-4344-4ca9-8121-a6c97bd6df52
    name: Credential Dumping Tools Service Execution - Security
    reason: Typical payload of an SCM-installed SYSTEM service is credential dumping (wce/fgdump/mimikatz service), the likely next objective
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installation (7045/4697) on this host
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697")
    pivot_on:
    - host
    window: 1h
  - name: sc.exe service create/config/sdset or PsExec-style execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Pp][Ss][Ee][Xx][Ee][Cc].*\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*(create|config|sdset|binpath).*/ OR data_win_eventdata_commandLine:/.*[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/)
    pivot_on:
    - host
    window: 1h
  - name: Services spawning shells, LOLBins or Temp binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Tt][Ee][Mm][Pp]\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Network logons and special privileges for this account
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")) OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 2h
  - name: Admin share and service-control pipe access on this host
    query: (data_win_system_eventID:"5140" AND data_win_eventdata_shareName:/.*(ADMIN|IPC)\$/) OR (data_win_system_eventID:"5145" AND data_win_eventdata_relativeTargetName:/.*([Ss][Vv][Cc][Cc][Tt][Ll]|[Ss][Rr][Vv][Ss][Vv][Cc]).*/)
    pivot_on:
    - host
    window: 1h
