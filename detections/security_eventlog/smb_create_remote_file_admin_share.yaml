name: SMB Create Remote File Admin Share
id: b210394c-ba12-4f89-9117-44a2464b9511
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Jose Rodriguez (@Cyb3rPandaH), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b210394c-ba12-4f89-9117-44a2464b9511
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Look for non-system accounts SMB accessing a file with write (0x2) access mask
  via administrative share (i.e C$). MITRE ATT&CK: T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - wildcard:
            data_win_eventdata_shareName:
              value: "*C$"
              case_insensitive: true
        - term:
            data_win_eventdata_accessMask:
              value: "0x2"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_subjectUserName: "*$"
        - exists:
            field: "data_win_eventdata_ipAddress"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_ipAddress: "::1"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_accessMask
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_ipAddress
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName matches
  '*C$'; data_win_eventdata_accessMask equals '0x2', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/OTRF/ThreatHunter-Playbook/blob/f7a58156dbfc9b019f17f638b8c62d22e557d350/playbooks/WIN-201012004336.yaml
  - https://securitydatasets.com/notebooks/atomic/windows/lateral_movement/SDWIN-200806015757.html?highlight=create%20file
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    SMB Create Remote File Admin Share detected on host $agent_name$. Matched
    data_win_eventdata_shareName: $data_win_eventdata_shareName$. Matched
    data_win_eventdata_accessMask: $data_win_eventdata_accessMask$. MITRE
    ATT&CK: T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_accessMask
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - create
    - admin
    - share
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Cc]\$/ AND data_win_eventdata_accessMask:/0[Xx]2/ AND _exists_:data_win_eventdata_subjectUserName AND NOT (data_win_eventdata_subjectUserName:/.*\$/) AND _exists_:data_win_eventdata_ipAddress AND NOT (data_win_eventdata_ipAddress:"::1")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Classic PsExec/smbexec sequence: payload dropped to C$/ADMIN$ via SMB is followed by SVCCTL pipe calls over IPC$ to create and start a service running that file.'
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: 'Follow-on: the file written over the admin share is registered as a remote service (7045/4697) by Metasploit psexec or Impacket.'
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Remote service install from the same source host/account that just wrote a binary to the admin share confirms remote execution of the dropped file.
  - id: f6de6525-4509-495a-8a82-1f8b0ed73a00
    name: Remote Task Creation via ATSVC Named Pipe
    reason: 'Alternative execution path: the dropped payload is launched through a remotely created scheduled task over the ATSVC pipe instead of a service.'
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: Impacket psexec writes a randomly named exe to ADMIN$/C$ over SMB then runs it via a service; same tool-driven chain.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: 'Precursor: the attacker authenticated to the target with explicit (stolen or guessed) credentials before writing to the admin share.'
  - id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
    name: Possible Impacket SecretDump Remote Activity
    reason: 'Co-occurring tooling: secretsdump uses admin share access and remote registry/service pipes to dump hashes from the same remote host.'
  - id: 910ab938-668b-401b-b08c-b596e80fdca5
    name: Transferring Files with Credential Data via Network Shares
    reason: Share-based staging of SAM/NTDS/LSASS dump files via 5145 follows the same admin-share access, signalling credential theft after lateral entry.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote service installation on this host (PsExec/smbexec)
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_serviceFileName:/.*([Cc][Oo][Mm][Ss][Pp][Ee][Cc]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Tt][Ee][Mm][Pp]|[Aa][Dd][Mm][Ii][Nn]\$|[Cc][Mm][Dd]\.[Ee][Xx][Ee]).*/ OR data_win_eventdata_imagePath:/.*([Cc][Oo][Mm][Ss][Pp][Ee][Cc]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Tt][Ee][Mm][Pp]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote service/task control pipes over IPC$ (svcctl, atsvc, winreg)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND (data_win_eventdata_relativeTargetName:svcctl OR data_win_eventdata_relativeTargetName:atsvc OR data_win_eventdata_relativeTargetName:winreg OR data_win_eventdata_relativeTargetName:srvsvc OR data_win_eventdata_relativeTargetName:samr)
    pivot_on:
    - host
    - ip
    window: 1h
  - name: Executables/scripts dropped by SMB (System process) on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:"System" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss])/
    pivot_on:
    - host
    window: 1h
  - name: Command interpreters spawned by services.exe/WMI/task engine after remote drop
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|[Tt][Aa][Ss][Kk][Ee][Nn][Gg]|[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Network and explicit-credential logons by this account
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")) OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4625"
    pivot_on:
    - user
    - ip
    window: 6h
