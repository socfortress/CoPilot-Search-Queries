name: RDP over Reverse SSH Tunnel WFP
id: 5bed80b6-b3e8-428e-a3ae-d3c757589e41
version: 1
schema_version: "1.0"
date: "2022-09-02"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5bed80b6-b3e8-428e-a3ae-d3c757589e41
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects svchost hosting RDP termsvcs communicating with the loopback address.
  MITRE ATT&CK: T1090.001, T1090.002, T1021.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5156"
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_sourcePort: "3389"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_destAddress: "127.*"
                          - term:
                              data_win_eventdata_destAddress: "::1"
                        minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_eventdata_destPort: "3389"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_sourceAddress: "127.*"
                          - term:
                              data_win_eventdata_sourceAddress: "::1"
                        minimum_should_match: 1
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_filterOrigin"
        - exists:
            field: "data_win_eventdata_application"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_filterOrigin:
                          value: "AppContainer Loopback"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_application:
                          value: "*\\\\thor.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_application:
                          value: "*\\\\thor64.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourcePort
    - data_win_eventdata_destAddress
    - data_win_eventdata_destPort
    - data_win_eventdata_sourceAddress
    - data_win_eventdata_filterOrigin
    - data_win_eventdata_application
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5156'; data_win_eventdata_sourcePort equals
  '3389'; data_win_eventdata_destAddress matches '127.*', among other
  conditions.

known_false_positives: >
  Programs that connect locally to the RDP port. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/SBousseaden/status/1096148422984384514
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES/blob/44fbe85f72ee91582876b49678f9a26292a155fb/Command%20and%20Control/DE_RDP_Tunnel_5156.evtx
  - https://attack.mitre.org/techniques/T1090/001/
  - https://attack.mitre.org/techniques/T1090/002/
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    RDP over Reverse SSH Tunnel WFP detected on host $agent_name$. Matched
    data_win_eventdata_sourcePort: $data_win_eventdata_sourcePort$. Matched
    data_win_eventdata_destAddress: $data_win_eventdata_destAddress$. MITRE
    ATT&CK: T1090.001, T1090.002, T1021.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_sourcePort
      type: other
    - field: data_win_eventdata_destAddress
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090.001
    - T1090.002
    - T1021.001
  custom_tags:
    - reverse
    - tunnel
    - windows_security
    - command_and_control
    - lateral_movement
    - car_2013_07_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5156" AND ((data_win_eventdata_sourcePort:"3389" AND (data_win_eventdata_destAddress:/127\..*/ OR data_win_eventdata_destAddress:"::1")) OR (data_win_eventdata_destPort:"3389" AND (data_win_eventdata_sourceAddress:/127\..*/ OR data_win_eventdata_sourceAddress:"::1"))) AND _exists_:data_win_eventdata_filterOrigin AND _exists_:data_win_eventdata_application AND NOT (data_win_eventdata_filterOrigin:/[Aa][Pp][Pp][Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr] [Ll][Oo][Oo][Pp][Bb][Aa][Cc][Kk]/ OR data_win_eventdata_application:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_application:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
    - id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
      name: "Audit CVE Event"
      reason: "next kill-chain tactic: Lateral Movement"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Proxy / tunnelling tooling on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee])/) OR ((data_win_eventdata_commandLine:/.*-[Rr] 127\.0\.0\.1.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ss][Hh] -[Rr].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Ff][Ww][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ss].*/)))'
      pivot_on: [host]
      window: 1h
    - name: "Remote-execution / lateral-movement tooling on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))'
      pivot_on: [host]
      window: 2h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))'
      pivot_on: [host]
      window: 1h
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
