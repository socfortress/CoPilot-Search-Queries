name: Remote PowerShell Sessions Network Connections (WinRM)
id: 13acf386-b8c6-4fe0-9a6e-c4756b974698
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 13acf386-b8c6-4fe0-9a6e-c4756b974698
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects basic PowerShell Remoting (WinRM) by monitoring for network inbound
  connections to ports 5985 OR 5986. MITRE ATT&CK: T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5156"
        - bool:
            should:
              - term:
                  data_win_eventdata_destPort: "5985"
              - term:
                  data_win_eventdata_destPort: "5986"
            minimum_should_match: 1
        - term:
            data_win_eventdata_layerRTID: "44"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destPort
    - data_win_eventdata_layerRTID
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5156'; data_win_eventdata_destPort equals
  '5985'; data_win_eventdata_destPort equals '5986', among other conditions.

known_false_positives: >
  Legitimate use of remote PowerShell execution. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://threathunterplaybook.com/hunts/windows/190511-RemotePwshExecution/notebook.html
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Remote PowerShell Sessions Network Connections (WinRM) detected on host
    $agent_name$. Matched data_win_eventdata_destPort:
    $data_win_eventdata_destPort$. Matched data_win_eventdata_layerRTID:
    $data_win_eventdata_layerRTID$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_destPort
      type: other
    - field: data_win_eventdata_layerRTID
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - sessions
    - network
    - windows_security
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5156" AND (data_win_eventdata_destPort:"5985" OR data_win_eventdata_destPort:"5986") AND data_win_eventdata_layerRTID:"44"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: Inbound 5985/5986 connection is followed by WinRM spawning wsmprovhost.exe, the server-side host of the remote session; confirms the connection became a real session.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Direct follow-on: commands the remote operator runs inside the session appear as children of wsmprovhost/winrshost.'
  - id: windows-winrm-spawning-process-001
    name: Windows WinRM Spawning a Process
    reason: Co-occurring process-creation evidence of what was executed through the WinRM channel opened by the inbound connection.
  - id: 7d4c618e-4716-11ec-951c-3e22fbd008af
    name: Remote Process Instantiation via WinRM and PowerShell Script Block
    reason: Script block logging showing remote process creation via WinRM (Invoke-WmiMethod/CIM) on the same host, the attacker's payload execution step.
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: If the source of the inbound 5985/5986 connection is an Evil-WinRM operator, this identifies the attacker tooling driving the session.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: 'Precursor: remote WinRM access requires authentication, often with explicitly supplied stolen credentials (4648) just before the connection.'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: WinRM sessions authenticated via NTLM network logon with a stolen hash show as pass-the-hash logons on the target at the same time.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Follow-on lateral movement: after landing via WinRM the operator commonly pivots to further hosts via remote service creation.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by the WinRM host process (wsmprovhost)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Network logons and explicit-credential use on this host
    query: ((data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4648")
    pivot_on:
    - host
    window: 2h
  - name: Remote-execution and download cmdlets in PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke\-Command* OR data_win_eventdata_scriptBlockText:*Enter\-PSSession* OR data_win_eventdata_scriptBlockText:*New\-PSSession* OR data_win_eventdata_scriptBlockText:*Invoke\-WmiMethod* OR data_win_eventdata_scriptBlockText:*Invoke\-CimMethod* OR data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*FromBase64String*)
    pivot_on:
    - host
    window: 2h
  - name: Credential access or lateral tooling on this host after WinRM access
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*comsvcs* OR data_win_eventdata_commandLine:*MiniDump* OR data_win_eventdata_commandLine:*psexec* OR data_win_eventdata_commandLine:*schtasks*))
    pivot_on:
    - host
    window: 4h
  - name: Executables and scripts dropped to staging paths on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*\\Temp\\* OR data_win_eventdata_targetFilename:*\\ProgramData\\* OR data_win_eventdata_targetFilename:*\\Users\\Public\\*) AND (data_win_eventdata_targetFilename:*.exe OR data_win_eventdata_targetFilename:*.dll OR data_win_eventdata_targetFilename:*.ps1 OR data_win_eventdata_targetFilename:*.bat)
    pivot_on:
    - host
    window: 2h
