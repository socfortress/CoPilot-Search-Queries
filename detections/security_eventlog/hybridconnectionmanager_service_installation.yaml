name: HybridConnectionManager Service Installation
id: 0ee4d8a5-4e67-4faf-acfa-62a78457d1f2
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0ee4d8a5-4e67-4faf-acfa-62a78457d1f2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Rule to detect the Hybrid Connection Manager service installation. MITRE
  ATT&CK: T1554.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - term:
            data_win_eventdata_serviceName:
              value: "HybridConnectionManager"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*HybridConnectionManager*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceName
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceName equals
  'HybridConnectionManager'; data_win_eventdata_serviceFileName matches
  '*HybridConnectionManager*'.

known_false_positives: >
  Legitimate use of Hybrid Connection Manager via Azure function apps. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://twitter.com/Cyb3rWard0g/status/1381642789369286662
  - https://attack.mitre.org/techniques/T1554/

response:
  message: >
    HybridConnectionManager Service Installation detected on host $agent_name$.
    Matched data_win_eventdata_serviceName: $data_win_eventdata_serviceName$.
    Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. MITRE ATT&CK: T1554
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceName
      type: service
    - field: data_win_eventdata_serviceFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1554
  custom_tags:
    - hybridconnectionmanager
    - service
    - installation
    - windows_security
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceName:/[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_eventdata_serviceFileName:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ac8866c7-ce44-46fd-8c17-b24acff96ca8
    name: HybridConnectionManager Service Installation - Registry
    reason: Same install seen via Sysmon registry events (Services\HybridConnectionManager key); two independent sources confirming the service was really created.
  - id: 7bd3902d-8b8b-4dd4-838a-c6862d40150d
    name: DNS HybridConnectionManager Service Bus
    reason: Once installed, the HCM listener resolves *.servicebus.windows.net to open its Azure Relay channel; this DNS lookup shows the tunnel is live and phoning out.
  - id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
    name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
    reason: HCM is used with Azure web/function apps; a non-browser process talking to azurewebsites.net is the other end of the relay channel (attacker-controlled app).
  - id: e043f529-8514-4205-8ab0-7f7d2927b400
    name: DNS Query To AzureWebsites.NET By Non-Browser Process
    reason: DNS-side companion to the azurewebsites.net relay endpoint contacted by the newly installed HCM service.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: 'Same 4697 event stream: reveals whether the HCM service was installed from an unusual client/logon session, pointing at remote or hands-on-keyboard installation rather than admin tooling.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: HybridConnectionManager process and service-bus network activity
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/) OR ((data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_destinationHostname:*servicebus.windows.net* OR data_win_eventdata_queryName:*servicebus.windows.net*))
    pivot_on:
    - host
    window: 4h
  - name: Commands spawned by the HCM listener (relay-to-shell)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/
    pivot_on:
    - host
    window: 4h
  - name: HCM service/registry configuration and binary written to disk
    query: ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:*HybridConnectionManager*) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:*HybridConnectionManager*)
    pivot_on:
    - host
    window: 6h
  - name: Service installs and SCM-level changes by the installing account
    query: (data_win_system_eventID:"4697" OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4672")
    pivot_on:
    - host
    - user
    window: 4h
  - name: Logons preceding the install (remote admin access to this host)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4648"
    pivot_on:
    - host
    - user
    window: 2h
