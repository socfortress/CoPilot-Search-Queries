name: Important Scheduled Task Deleted/Disabled
id: 7595ba94-cf3b-4471-aa03-4f6baa9e5fad
version: 1
schema_version: "1.0"
date: "2023-03-13"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7595ba94-cf3b-4471-aa03-4f6baa9e5fad
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when adversaries stop services or processes by deleting or disabling
  their respective scheduled tasks in order to conduct data destructive
  activities. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4699"
              - term:
                  data_win_system_eventID: "4701"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\SystemRestore\\\\SR*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\Windows Defender\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\BitLocker*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\WindowsBackup\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\WindowsUpdate\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\UpdateOrchestrator\\\\Schedule*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\ExploitGuard*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_system_eventID"
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - exists:
            field: "data_win_eventdata_taskName"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4699"
                    - wildcard:
                        data_win_eventdata_subjectUserName: "*$"
                    - wildcard:
                        data_win_eventdata_taskName:
                          value: "*\\\\Windows\\\\Windows Defender\\\\*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4699'; data_win_system_eventID equals '4701';
  data_win_eventdata_taskName matches '*\Windows\SystemRestore\SR*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4699
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4701
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Important Scheduled Task Deleted/Disabled detected on host $agent_name$.
    Matched data_win_eventdata_taskName: $data_win_eventdata_taskName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - important
    - scheduled
    - deleted
    - windows_security
    - execution
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4699" OR data_win_system_eventID:"4701") AND (data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Tt][Oo][Rr][Ee]\\[Ss][Rr].*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr].*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Bb][Aa][Cc][Kk][Uu][Pp]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Uu][Pp][Dd][Aa][Tt][Ee][Oo][Rr][Cc][Hh][Ee][Ss][Tt][Rr][Aa][Tt][Oo][Rr]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee].*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Ii][Tt][Gg][Uu][Aa][Rr][Dd].*/) AND _exists_:data_win_system_eventID AND _exists_:data_win_eventdata_subjectUserName AND _exists_:data_win_eventdata_taskName AND NOT (data_win_system_eventID:"4699" AND data_win_eventdata_subjectUserName:/.*\$/ AND data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/)

