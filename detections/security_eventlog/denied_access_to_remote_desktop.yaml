name: Denied Access To Remote Desktop
id: 8e5c03fa-b7f0-11ea-b242-07e0576828d9
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Pushkarev Dmitry
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8e5c03fa-b7f0-11ea-b242-07e0576828d9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This event is generated when an authenticated user who is not allowed to log
  on remotely attempts to connect to this computer through Remote Desktop.
  Often, this event can be generated by attackers when searching for available
  windows servers in the network. MITRE ATT&CK: T1021.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4825"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4825'.

known_false_positives: >
  Valid user was not added to RDP group. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4825
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    Denied Access To Remote Desktop detected on host $agent_name$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    Matched data_win_eventdata_subjectLogonId:
    $data_win_eventdata_subjectLogonId$. MITRE ATT&CK: T1021.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_subjectUserName
      type: user
    - field: data_win_eventdata_subjectLogonId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.001
  custom_tags:
    - denied
    - desktop
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4825"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
    name: Account Tampering - Suspicious Failed Logon Reasons
    reason: 4825 means valid credentials but no RDP right; adjacent 4625/4776 failures with disabled/expired/restricted-account statuses show the same account being probed or misused
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: Attacker holding stolen credentials often reaches the host via explicit-credential (4648) logons right before or after the denied RDP attempt
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: 'Natural escalation after a denial: the attacker grants the account RDP rights so the next attempt succeeds'
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: Attacker blocked by RDP policy may alter Terminal Server registry settings to loosen access on the same host
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: The denied connection originates from another host's mstsc; this shows the source side of the same lateral-movement hunt across servers
  - id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
    name: Potential RDP Session Hijacking Activity
    reason: If RDP access is obtained or an existing session exists, SYSTEM tscon hijacking is the follow-on way to take over a session without credentials
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Successful RDP (logon type 10/7) logons on this host
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"7")
    pivot_on:
    - host
    window: 2h
  - name: Failed RDP/network logons and credential validation for this account
    query: (data_win_system_eventID:"4625" AND (data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"3")) OR data_win_system_eventID:"4776" OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 6h
  - name: Remote Desktop Users group membership changes
    query: ((data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4756") AND data_win_eventdata_targetUserName:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: RDP enablement, firewall or registry tampering on this host
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Rr][Dd][Pp]-[Tt][Cc][Pp].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Rr][Dd][Pp]|3389|[Rr]emote [Dd]esktop).*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound RDP connections from this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389"
    pivot_on:
    - host
    window: 6h
