name: Sysmon Channel Reference Deletion
id: 18beca67-ab3e-4ee3-ba7a-a46ca8d7d0cc
version: 1
schema_version: "1.0"
date: "2025-10-22"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 18beca67-ab3e-4ee3-ba7a-a46ca8d7d0cc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Potential threat actor tampering with Sysmon manifest and eventually disabling
  it. MITRE ATT&CK: T1112.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4657"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_objectName:
                                value: "*WINEVT\\\\Publishers\\\\{5770385f-c22a-43e0-bf4c-06f5698ffbd9}*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_objectName:
                                value: "*WINEVT\\\\Channels\\\\Microsoft-Windows-Sysmon/Operational*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_objectValueName:
                          value: "Enabled"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_newValue: "0"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4663"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_objectName:
                                value: "*WINEVT\\\\Publishers\\\\{5770385f-c22a-43e0-bf4c-06f5698ffbd9}*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_objectName:
                                value: "*WINEVT\\\\Channels\\\\Microsoft-Windows-Sysmon/Operational*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_accessMask:
                          value: "0x10000"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_objectValueName
    - data_win_eventdata_newValue
    - data_win_eventdata_accessMask
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4657'; data_win_eventdata_objectName matches
  '*WINEVT\Publishers\{5770385f-c22a-43e0-bf4c-06f5698ffbd9}*';
  data_win_eventdata_objectName matches
  '*WINEVT\Channels\Microsoft-Windows-Sysmon/Operational*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/Flangvik/status/1283054508084473861
  - https://twitter.com/SecurityJosh/status/1283027365770276866
  - https://securityjosh.github.io/2020/04/23/Mute-Sysmon.html
  - https://gist.github.com/Cyb3rWard0g/cf08c38c61f7e46e8404b38201ca01c8
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Sysmon Channel Reference Deletion detected on host $agent_name$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. Matched
    data_win_eventdata_objectValueName: $data_win_eventdata_objectValueName$.
    MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_objectValueName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - sysmon
    - channel
    - reference
    - windows_security
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"4657" AND (data_win_eventdata_objectName:/.*[Ww][Ii][Nn][Ee][Vv][Tt]\\[Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ee][Rr][Ss]\\\{5770385[Ff]-[Cc]22[Aa]-43[Ee]0-[Bb][Ff]4[Cc]-06[Ff]5698[Ff][Ff][Bb][Dd]9\}.*/ OR data_win_eventdata_objectName:/.*[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ss][Yy][Ss][Mm][Oo][Nn]\/[Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn][Aa][Ll].*/) AND data_win_eventdata_objectValueName:/[Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ AND data_win_eventdata_newValue:"0") OR (data_win_system_eventID:"4663" AND (data_win_eventdata_objectName:/.*[Ww][Ii][Nn][Ee][Vv][Tt]\\[Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ee][Rr][Ss]\\\{5770385[Ff]-[Cc]22[Aa]-43[Ee]0-[Bb][Ff]4[Cc]-06[Ff]5698[Ff][Ff][Bb][Dd]9\}.*/ OR data_win_eventdata_objectName:/.*[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ss][Yy][Ss][Mm][Oo][Nn]\/[Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn][Aa][Ll].*/) AND data_win_eventdata_accessMask:/0[Xx]10000/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8ac03a65-6c84-4116-acad-dc1558ff7a77
    name: Sysmon Configuration Change
    reason: Sysmon EID 16 config-change event; attackers who mute Sysmon often alter or reload its config around the same time, so a hit on the same host confirms Sysmon tampering.
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: Alternate way of blinding Sysmon by changing the SysmonDrv altitude in the registry; same defence-evasion goal, often chained with channel disabling.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Unloading the Sysmon minifilter driver is the next step of disabling Sysmon after muting its channel.
  - id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
    name: Uninstall Sysinternals Sysmon
    reason: Outright removal of Sysmon is the end state of the tampering this rule flags as an early step.
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Sysmon.exe -c config reload used to push a permissive or empty config, a companion technique to disabling the channel.
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Same registry-based logging suppression tradecraft applied to other event channels on the same host.
  - id: ba226dcf-d390-4642-b9af-b534872f1156
    name: Windows Event Log Access Tampering Via Registry
    reason: Registry changes to event log channel access, a sibling method to blind or hide logging after the Sysmon channel is touched.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: After suppressing Sysmon, operators typically clear remaining event logs to erase traces of the intrusion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other event-log and channel registry tampering (WINEVT keys) on this host
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"4657" OR data_win_system_eventID:"4663") AND data_win_eventdata_targetObject:*WINEVT*
    pivot_on:
    - host
    window: 2h
  - name: Sysmon driver/service stop, unload or uninstall commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*-[Uu].*/ OR data_win_eventdata_commandLine:/.*([Ss][Cc]|[Nn][Ee][Tt]) +([Ss][Tt][Oo][Pp]|[Dd][Ee][Ll][Ee][Tt][Ee]) +[Ss][Yy][Ss][Mm][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn][Dd][Rr][Vv].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*-[Cc] .*/)
    pivot_on:
    - host
    window: 2h
  - name: Reg.exe / PowerShell editing Sysmon or WINEVT registry keys
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Ee][Vv][Tt].*/ AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/)
    pivot_on:
    - host
    window: 1h
  - name: Event log clearing or audit policy changes (EID 1102/104, wevtutil, auditpol)
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR data_win_system_eventID:"4719" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering or security-service stops after Sysmon muting
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc].*[Ss][Tt][Oo][Pp].*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/)
    pivot_on:
    - host
    window: 4h
