name: Suspicious Teams Application Related ObjectAcess Event
id: 25cde13e-8e20-4c29-b949-4e795b76f16f
version: 1
schema_version: "1.0"
date: "2022-09-16"
author: "@SerkinValery"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 25cde13e-8e20-4c29-b949-4e795b76f16f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an access to authentication tokens and accounts of Microsoft Teams
  desktop application. MITRE ATT&CK: T1528.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4663"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*\\\\Microsoft\\\\Teams\\\\Cookies*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*\\\\Microsoft\\\\Teams\\\\Local Storage\\\\leveldb*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\Microsoft\\\\Teams\\\\current\\\\Teams.exe*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4663'; data_win_eventdata_objectName matches
  '*\Microsoft\Teams\Cookies*'; data_win_eventdata_objectName matches
  '*\Microsoft\Teams\Local Storage\leveldb*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.bleepingcomputer.com/news/security/microsoft-teams-stores-auth-tokens-as-cleartext-in-windows-linux-macs/
  - https://www.vectra.ai/blogpost/undermining-microsoft-teams-security-by-mining-tokens
  - https://attack.mitre.org/techniques/T1528/

response:
  message: >
    Suspicious Teams Application Related ObjectAcess Event detected on host
    $agent_name$. Matched data_win_eventdata_objectName:
    $data_win_eventdata_objectName$. Matched data_win_eventdata_processName:
    $data_win_eventdata_processName$. MITRE ATT&CK: T1528
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_processName
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1528
  custom_tags:
    - teams
    - application
    - related
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4663" AND (data_win_eventdata_objectName:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_objectName:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Oo][Rr][Aa][Gg][Ee]\\[Ll][Ee][Vv][Ee][Ll][Dd][Bb].*/) AND _exists_:data_win_eventdata_processName AND NOT (data_win_eventdata_processName:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d2eb17db-1d39-41dc-b57f-301f6512fa75
    name: Potentially Suspicious Command Targeting Teams Sensitive Files
    reason: 'Process-creation view of the same behaviour: a command line (copy/type/PowerShell) reading the Teams Cookies/leveldb stores; the 4663 object access is the file-level footprint of that command.'
  - id: 88f46b67-14d4-4f45-ac2c-d66984f22191
    name: Renamed Microsoft Teams Execution
    reason: Attackers rename or copy Teams binaries to blend in while reading its token stores, which is exactly the non-Teams.exe process this 4663 alert catches.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Same Electron/Chromium cookie and LevelDB store theft technique; the same stealer typically harvests browser data alongside Teams tokens.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Teams tokens in Cookies are stolen for session hijacking; this is the same cookie-database access via command line on the same host.
  - id: 6d3a3952-6530-44a3-8554-cf17c116c615
    name: Potentially Suspicious JWT Token Search Via CLI
    reason: After reading leveldb, attackers grep the dump for JWT/bearer tokens (eyJ...) to extract the usable Teams/Graph access token.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Esentutl is a LOLBin used to copy locked browser/app data stores; it can read the locked Teams Cookies SQLite file the same way.
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Alternative token/cookie theft path against Chromium-based apps (Teams is Electron); remote-debugging use on the same host indicates the same session-theft objective.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Command lines touching Teams cookie/leveldb token stores
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt]eams.*([Cc]ookies|[Ll]evel[Dd][Bb]|[Ll]ocal [Ss]torage).*/ OR data_win_eventdata_commandLine:/.*[Ll]evel[Dd][Bb].*(eyJ|[Ss]elect-[Ss]tring|[Ff]indstr|[Ss]trings|[Gg]rep).*/)
    pivot_on:
    - host
    window: 1h
  - name: Copy/staging of Teams token stores to other locations
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll]evel[Dd][Bb].*/ OR data_win_eventdata_targetFilename:/.*[Tt]eams.*[Cc]ookies.*/ OR data_win_eventdata_targetFilename:/.*(teams|ldb|leveldb).*[.](zip|7z|rar|ldb|log)/)
    pivot_on:
    - host
    window: 2h
  - name: Script blocks reading Teams tokens or calling Graph with stolen token
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ll]evel[Dd][Bb].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]kype[Tt]oken.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]uthtoken.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]icrosoft[\/][Tt]eams.*[Cc]ookies.*/ OR data_win_eventdata_scriptBlockText:/.*graph[.]microsoft[.]com.*[Bb]earer.*/)
    pivot_on:
    - host
    window: 2h
  - name: Non-Teams, non-browser process resolving Teams/Graph/Entra endpoints
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*(graph[.]microsoft[.]com|teams[.]microsoft[.]com|api[.]spaces[.]skype[.]com|login[.]microsoftonline[.]com|smtp[.]office365[.]com).*/ AND NOT data_win_eventdata_image:/.*([Tt]eams|msedge|chrome|firefox|[Oo]utlook|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|OneDrive|svchost|[Ss]earch[Hh]ost).*/
    pivot_on:
    - host
    window: 4h
  - name: Same user authenticating from other hosts or IPs (token replay)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
