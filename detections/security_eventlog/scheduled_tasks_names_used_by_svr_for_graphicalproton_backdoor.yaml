name: Scheduled Tasks Names Used By SVR For GraphicalProton Backdoor
id: 8fa65166-f463-4fd2-ad4f-1436133c52e1
version: 1
schema_version: "1.0"
date: "2023-12-18"
author: CISA
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8fa65166-f463-4fd2-ad4f-1436133c52e1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Hunts for known SVR-specific scheduled task names.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4698"
              - term:
                  data_win_system_eventID: "4699"
              - term:
                  data_win_system_eventID: "4702"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_taskName:
                    value: "\\defender"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\DefenderService"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Application Experience\\StartupAppTaskCheck"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Application Experience\\StartupAppTaskCkeck"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\ATPUpd"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Data Integrity Scan\\Data Integrity Update"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\DefenderUPDService"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\IISUpdateService"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Speech\\SpeechModelInstallTask"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WiMSDFS"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Defender\\Defender Update Service"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Defender\\Service Update"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Error Reporting\\CheckReporting"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Error Reporting\\SubmitReporting"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Filtering Platform\\BfeOnServiceStart"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WindowsDefenderService"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WindowsDefenderService2"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WindowsUpdate\\Scheduled AutoCheck"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WindowsUpdate\\Scheduled Check"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\WindowUpdate"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4698'; data_win_system_eventID equals '4699';
  data_win_system_eventID equals '4702', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    Scheduled Tasks Names Used By SVR For GraphicalProton Backdoor detected on
    host $agent_name$. Matched data_win_eventdata_taskName:
    $data_win_eventdata_taskName$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  custom_tags:
    - scheduled
    - tasks
    - names
    - windows_security
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

