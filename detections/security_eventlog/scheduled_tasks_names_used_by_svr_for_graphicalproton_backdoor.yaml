name: Scheduled Tasks Names Used By SVR For GraphicalProton Backdoor
id: 8fa65166-f463-4fd2-ad4f-1436133c52e1
version: 1
schema_version: "1.0"
date: "2023-12-18"
author: CISA
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8fa65166-f463-4fd2-ad4f-1436133c52e1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Hunts for known SVR-specific scheduled task names.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4698"
              - term:
                  data_win_system_eventID: "4699"
              - term:
                  data_win_system_eventID: "4702"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_taskName:
                    value: "\\defender"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\DefenderService"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Application Experience\\StartupAppTaskCheck"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Application Experience\\StartupAppTaskCkeck"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\ATPUpd"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Data Integrity Scan\\Data Integrity Update"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\DefenderUPDService"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\IISUpdateService"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Speech\\SpeechModelInstallTask"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WiMSDFS"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Defender\\Defender Update Service"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Defender\\Service Update"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Error Reporting\\CheckReporting"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Error Reporting\\SubmitReporting"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\Windows Filtering Platform\\BfeOnServiceStart"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WindowsDefenderService"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WindowsDefenderService2"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WindowsUpdate\\Scheduled AutoCheck"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\Microsoft\\Windows\\WindowsUpdate\\Scheduled Check"
                    case_insensitive: true
              - term:
                  data_win_eventdata_taskName:
                    value: "\\WindowUpdate"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4698'; data_win_system_eventID equals '4699';
  data_win_system_eventID equals '4702', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    Scheduled Tasks Names Used By SVR For GraphicalProton Backdoor detected on
    host $agent_name$. Matched data_win_eventdata_taskName:
    $data_win_eventdata_taskName$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  custom_tags:
    - scheduled
    - tasks
    - names
    - windows_security
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4699" OR data_win_system_eventID:"4702") AND (data_win_eventdata_taskName:/\\[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp][Aa][Pp][Pp][Tt][Aa][Ss][Kk][Cc][Hh][Ee][Cc][Kk]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp][Aa][Pp][Pp][Tt][Aa][Ss][Kk][Cc][Kk][Ee][Cc][Kk]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Tt][Pp][Uu][Pp][Dd]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Aa][Tt][Aa] [Ii][Nn][Tt][Ee][Gg][Rr][Ii][Tt][Yy] [Ss][Cc][Aa][Nn]\\[Dd][Aa][Tt][Aa] [Ii][Nn][Tt][Ee][Gg][Rr][Ii][Tt][Yy] [Uu][Pp][Dd][Aa][Tt][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr][Uu][Pp][Dd][Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Ii][Ss][Uu][Pp][Dd][Aa][Tt][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Pp][Ee][Ee][Cc][Hh]\\[Ss][Pp][Ee][Ee][Cc][Hh][Mm][Oo][Dd][Ee][Ll][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Tt][Aa][Ss][Kk]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Mm][Ss][Dd][Ff][Ss]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr] [Uu][Pp][Dd][Aa][Tt][Ee] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Uu][Pp][Dd][Aa][Tt][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Cc][Hh][Ee][Cc][Kk][Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Ss][Uu][Bb][Mm][Ii][Tt][Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ff][Ii][Ll][Tt][Ee][Rr][Ii][Nn][Gg] [Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\[Bb][Ff][Ee][Oo][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss][Tt][Aa][Rr][Tt]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]2/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Uu][Pp][Dd][Aa][Tt][Ee]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd] [Aa][Uu][Tt][Oo][Cc][Hh][Ee][Cc][Kk]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Uu][Pp][Dd][Aa][Tt][Ee]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd] [Cc][Hh][Ee][Cc][Kk]/ OR data_win_eventdata_taskName:/\\[Ww][Ii][Nn][Dd][Oo][Ww][Uu][Pp][Dd][Aa][Tt][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e64c8ef3-9f98-40c8-b71e-96110991cb4c
    name: DLL Names Used By SVR For GraphicalProton Backdoor
    reason: 'Same CISA AA23-347a campaign: GraphicalProton is a side-loaded DLL, so a decoy-named task plus a known loader DLL name on the same host confirms the implant is installed.'
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: Same 4698 telemetry; a task creation with unusual executable path or arguments shows what the Defender-lookalike task actually launches.
  - id: 614cf376-6651-47c4-9dcc-6b9527f749f4
    name: Suspicious Scheduled Task Update
    reason: Operators often modify (4702) a planted task to retarget its payload; the update corroborates tampering with the persistence entry.
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: The SVR task names imitate Defender and Windows Update tasks; this rule catches the same masquerading from the schtasks command line, showing who created it and with what binary.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: GraphicalProton persistence tasks are created by schtasks run from staging folders such as ProgramData or Public, the process-side view of the same task.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: The task's action is typically a dropped binary or DLL launcher in a user-writable path, which this rule flags at task-creation time.
  - id: 3b8e5084-4de9-449a-a40d-0e11014f2e2d
    name: Diamond Sleet APT Scheduled Task Creation
    reason: Another nation-state implant-persistence task-name detector on the same Security 4698 source; co-firing suggests broader state-actor tooling on the host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: schtasks task creation pointing at a user-writable path or DLL launcher
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND (data_win_eventdata_commandLine:*ProgramData* OR data_win_eventdata_commandLine:*\\Users\\Public* OR data_win_eventdata_commandLine:*AppData* OR data_win_eventdata_commandLine:*rundll32* OR data_win_eventdata_commandLine:*regsvr32* OR data_win_eventdata_commandLine:*.dll*)
    pivot_on:
    - host
    window: 4h
  - name: Binary or DLL dropped into staging directories (ProgramData, Public, Windows\Tasks)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 4h
  - name: Task-launched rundll32/regsvr32 loading a DLL from a non-system path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:/.*[Tt][Aa][Ss][Kk][Ss][Cc][Hh][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:*ProgramData* OR data_win_eventdata_commandLine:*Public* OR data_win_eventdata_commandLine:*AppData* OR data_win_eventdata_commandLine:*Temp*)
    pivot_on:
    - host
    window: 4h
  - name: Discovery and credential-access commands run after persistence
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*whoami* OR data_win_eventdata_commandLine:*"net group"* OR data_win_eventdata_commandLine:*nltest* OR data_win_eventdata_commandLine:*"net user"* OR data_win_eventdata_commandLine:*ntdsutil* OR data_win_eventdata_commandLine:*comsvcs* OR data_win_eventdata_commandLine:*"reg save"* OR data_win_eventdata_commandLine:*klist*)
    pivot_on:
    - host
    window: 6h
  - name: Outbound connections from non-browser processes to cloud-storage or Graph C2 endpoints
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*graph.microsoft.com* OR data_win_eventdata_queryName:*onedrive* OR data_win_eventdata_queryName:*dropbox* OR data_win_eventdata_queryName:*mega.nz* OR data_win_eventdata_queryName:*pastebin* OR data_win_eventdata_queryName:*webhook.site*)
    pivot_on:
    - host
    window: 6h
