name: Invoke-Obfuscation VAR+ Launcher - Security
id: dcf2db1f-f091-425b-a821-c05875b8925a
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Jonathan Cheong, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dcf2db1f-f091-425b-a821-c05875b8925a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated use of Environment Variables to execute PowerShell. MITRE
  ATT&CK: T1027, T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*cmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*\"set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*-f*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*/c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*/r*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*cmd*'; data_win_eventdata_serviceFileName matches '*"set*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation VAR+ Launcher - Security detected on host $agent_name$.
    Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - launcher
    - windows_security
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*[Cc][Mm][Dd].*/ AND data_win_eventdata_serviceFileName:/.*\"[Ss][Ee][Tt].*/ AND data_win_eventdata_serviceFileName:/.*-[Ff].*/ AND (data_win_eventdata_serviceFileName:/.*\/[Cc].*/ OR data_win_eventdata_serviceFileName:/.*\/[Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2a926e6a-4b81-4011-8a96-e36cc8c04302
    name: PowerShell Scripts Installed as Services - Security
    reason: 'Same 4697 service-install channel: an obfuscated cmd launcher registered as a service often wraps a PowerShell payload, so a hit here confirms the service runs PowerShell.'
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: A cmd /c set ... -f launcher in a service binary path is the smbexec/psexec remote-execution pattern; this shows the service was installed over SMB by an offensive tool.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Tells whether the 4697 service install came from a remote or unusual client, separating lateral movement from local persistence.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Remote service creation goes through the svcctl pipe over SMB; it directly precedes this service-install event when the launcher was delivered remotely.
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: Admin-share file writes (ADMIN$/C$) are the staging step before remote service execution; shows how the payload reached the host.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: Operators moving laterally with stolen credentials produce explicit-credential logons just before installing a service on the target.
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Cobalt Strike psexec/getsystem installs services with %COMSPEC%/cmd launcher strings; a co-occurring hit identifies the framework behind the obfuscated launcher.
  - id: 4c54ba8f-73d2-4d40-8890-d9cf1dca3d30
    name: Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION - Security
    reason: Sibling Invoke-Obfuscation launcher variant in the same 4697 data; the operator often iterates between variants on the same host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Obfuscated cmd/PowerShell spawned by the service control manager
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|-[Ff]).*/
    pivot_on:
    - host
    window: 1h
  - name: Other service installs with shell or COMSPEC launchers (7045/4697)
    query: (data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Oo][Mm][Ss][Pp][Ee][Cc]|[Mm][Ss][Hh][Tt][Aa]).*/) OR (data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Oo][Mm][Ss][Pp][Ee][Cc]|[Mm][Ss][Hh][Tt][Aa]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Service ImagePath registry values pointing at a shell interpreter
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ AND data_win_eventdata_details:/.*([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Oo][Mm][Ss][Pp][Ee][Cc]).*/
    pivot_on:
    - host
    window: 2h
  - name: Admin share and svcctl SMB access used to deliver the service
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_shareName:/.*[Cc]\$.*/ OR data_win_eventdata_relativeTargetName:/.*([Ss][Vv][Cc][Cc][Tt][Ll]|[Ss][Rr][Vv][Ss][Vv][Cc]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Network logons onto this host from remote addresses around the service install
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_ipAddress:("-" OR "::1" OR "127.0.0.1")) OR data_win_system_eventID:"4648"
    pivot_on:
    - host
    window: 1h
