name: Win Susp Computer Name Containing Samtheadmin
id: 39698b3f-da92-4bc6-bfb5-645a98386e45
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: elhoim
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39698b3f-da92-4bc6-bfb5-645a98386e45
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious computer name samtheadmin-{1..100}$ generated by hacktool.
  MITRE ATT&CK: T1078.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_samAccountName:
                          value: "SAMTHEADMIN-*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_samAccountName: "*$"
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetUserName:
                          value: "SAMTHEADMIN-*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetUserName: "*$"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_samAccountName
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_eventdata_samAccountName matches 'SAMTHEADMIN-*';
  data_win_eventdata_samAccountName matches '*$';
  data_win_eventdata_targetUserName matches 'SAMTHEADMIN-*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/malmoeb/status/1511760068743766026
  - https://github.com/helloexp/0day/blob/614227a7b9beb0e91e7e2c6a5e532e6f7a8e883c/00-CVE_EXP/CVE-2021-42287/sam-the-admin/sam_the_admin.py
  - https://attack.mitre.org/techniques/T1078/

response:
  message: >
    Win Susp Computer Name Containing Samtheadmin detected on host $agent_name$.
    Matched data_win_eventdata_samAccountName:
    $data_win_eventdata_samAccountName$. Matched
    data_win_eventdata_targetUserName: $data_win_eventdata_targetUserName$.
    MITRE ATT&CK: T1078
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_samAccountName
      type: other
    - field: data_win_eventdata_targetUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078
  custom_tags:
    - computer
    - containing
    - samtheadmin
    - windows_security
    - initial_access
    - persistence
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_eventdata_samAccountName:/[Ss][Aa][Mm][Tt][Hh][Ee][Aa][Dd][Mm][Ii][Nn]-.*/ AND data_win_eventdata_samAccountName:/.*\$/) OR (data_win_eventdata_targetUserName:/[Ss][Aa][Mm][Tt][Hh][Ee][Aa][Dd][Mm][Ii][Nn]-.*/ AND data_win_eventdata_targetUserName:/.*\$/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ab6bffca-beff-4baa-af11-6733f296d57a
    name: Potential AD User Enumeration From Non-Machine Account
    reason: 'Precursor: sAMTheAdmin needs a domain user plus knowledge of DC/admin names, typically gathered by LDAP/AD user enumeration just before the machine account is created.'
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: The samtheadmin-N$ machine account is created by sam_the_admin.py, an Impacket-based script; Impacket tooling on the same host is the likely origin.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: CVE-2021-42278/42287 abuse hinges on requesting TGT/S4U2self tickets, which Rubeus is commonly used for from Windows attacker hosts.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: 'Core step of the noPac chain: forging a TGT as the renamed machine account then S4U2self ticket request as Administrator.'
  - id: 12e6d621-194f-4f59-90cc-1959e21e69f7
    name: Register new Logon Process by Rubeus
    reason: Rubeus registers a logon process (4611) when requesting or injecting the impersonated ticket after the account spoofing.
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Tickets obtained through the machine-account name confusion are often RC4 (0x17) service tickets for the DC, flagged by anomalous 4769 encryption type.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Typical follow-on: with a ticket impersonating Administrator on the DC, the attacker DCSyncs krbtgt and domain hashes.'
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: After obtaining a DC admin ticket, sam_the_admin offers a psexec/smbexec shell; Impacket lateral movement from the same source confirms domain takeover.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Computer account created or renamed / SAM account name changed (noPac staging)
    query: (data_win_system_eventID:"4741" OR data_win_system_eventID:"4742" OR data_win_system_eventID:"4781" OR data_win_system_eventID:"4738" OR data_win_system_eventID:"4743")
    pivot_on:
    - user
    window: 2h
  - name: Kerberos TGT/service ticket requests (4768/4769) for machine accounts or the DC
    query: ((data_win_system_eventID:"4768" OR data_win_system_eventID:"4769") AND (data_win_eventdata_targetUserName:/.*\$/ OR data_win_eventdata_serviceName:/.*[Kk][Rr][Bb][Tt][Gg][Tt].*/ OR data_win_eventdata_serviceName:/[Cc][Ii][Ff][Ss]\/.*/ OR data_win_eventdata_serviceName:/[Ll][Dd][Aa][Pp]\/.*/))
    pivot_on:
    - host
    - user
    window: 2h
  - name: Directory replication / DCSync (4662 with replication GUIDs)
    query: (data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*89e95b76-444d-4c62-991a-0facbeda640c*))
    pivot_on:
    - user
    window: 4h
  - name: Network logons and explicit-credential use by this account
    query: ((data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672")
    pivot_on:
    - user
    window: 4h
  - name: Impacket/Rubeus-style tooling and remote service execution on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Mm]_[Tt][Hh][Ee]_[Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Oo][Pp][Aa][Cc].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Mm][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Tt].*/))
    pivot_on:
    - host
    window: 2h
