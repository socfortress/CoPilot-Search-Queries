name: Win Susp Computer Name Containing Samtheadmin
id: 39698b3f-da92-4bc6-bfb5-645a98386e45
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: elhoim
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39698b3f-da92-4bc6-bfb5-645a98386e45
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious computer name samtheadmin-{1..100}$ generated by hacktool.
  MITRE ATT&CK: T1078.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_samAccountName:
                          value: "SAMTHEADMIN-*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_samAccountName: "*$"
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetUserName:
                          value: "SAMTHEADMIN-*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetUserName: "*$"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_samAccountName
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_eventdata_samAccountName matches 'SAMTHEADMIN-*';
  data_win_eventdata_samAccountName matches '*$';
  data_win_eventdata_targetUserName matches 'SAMTHEADMIN-*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/malmoeb/status/1511760068743766026
  - https://github.com/helloexp/0day/blob/614227a7b9beb0e91e7e2c6a5e532e6f7a8e883c/00-CVE_EXP/CVE-2021-42287/sam-the-admin/sam_the_admin.py
  - https://attack.mitre.org/techniques/T1078/

response:
  message: >
    Win Susp Computer Name Containing Samtheadmin detected on host $agent_name$.
    Matched data_win_eventdata_samAccountName:
    $data_win_eventdata_samAccountName$. Matched
    data_win_eventdata_targetUserName: $data_win_eventdata_targetUserName$.
    MITRE ATT&CK: T1078
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_samAccountName
      type: other
    - field: data_win_eventdata_targetUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078
  custom_tags:
    - computer
    - containing
    - samtheadmin
    - windows_security
    - initial_access
    - persistence
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_eventdata_samAccountName:/[Ss][Aa][Mm][Tt][Hh][Ee][Aa][Dd][Mm][Ii][Nn]-.*/ AND data_win_eventdata_samAccountName:/.*\$/) OR (data_win_eventdata_targetUserName:/[Ss][Aa][Mm][Tt][Hh][Ee][Aa][Dd][Mm][Ii][Nn]-.*/ AND data_win_eventdata_targetUserName:/.*\$/))

correlation:
