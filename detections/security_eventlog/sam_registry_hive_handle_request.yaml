name: SAM Registry Hive Handle Request
id: f8748f2c-89dc-4d95-afb0-5a2dfdbad332
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f8748f2c-89dc-4d95-afb0-5a2dfdbad332
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects handles requested to SAM registry hive. MITRE ATT&CK: T1012,
  T1552.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4656"
        - term:
            data_win_eventdata_objectType:
              value: "Key"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\SAM"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_eventdata_objectType equals
  'Key'; data_win_eventdata_objectName matches '*\SAM'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190725-SAMRegistryHiveHandleRequest/notebook.html
  - https://attack.mitre.org/techniques/T1012/
  - https://attack.mitre.org/techniques/T1552/002/

response:
  message: >
    SAM Registry Hive Handle Request detected on host $agent_name$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. MITRE
    ATT&CK: T1012, T1552.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1012
    - T1552.002
  custom_tags:
    - registry
    - handle
    - request
    - windows_security
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4656" AND data_win_eventdata_objectType:/[Kk][Ee][Yy]/ AND data_win_eventdata_objectName:/.*\\[Ss][Aa][Mm]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: 'Most common cause of a 4656 handle on the SAM key: reg.exe save/export of HKLM SAM, SYSTEM and SECURITY to disk for offline hash extraction'
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Alternative way to copy a locked SAM/NTDS file after the hive was probed; same offline credential theft objective
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: PowerShell copy of SAM from a volume shadow copy, a HiveNightmare-style path to the same hive that sidesteps the file lock
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Reading SAM/SYSTEM/SECURITY from a shadow copy is the stealthier follow-on when direct hive access is blocked or noisy
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: File-creation evidence that a SAM/SYSTEM hive copy landed on disk after the handle request, confirming the dump succeeded
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: Tooling output artefact of SAM hive export, confirms exploitation rather than benign registry access
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: lsadump::sam and token::elevate in Mimikatz open the SAM key directly and produce this 4656 handle
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive export or save of SAM/SYSTEM/SECURITY
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]).*/ AND (data_win_eventdata_commandLine:/.*\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/)
    pivot_on:
    - host
    window: 1h
  - name: Hive copy via shadow copy, esentutl or ntdsutil
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: SAM/SYSTEM hive dump files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\[Ss][Aa][Mm]([._-].*)?/ OR data_win_eventdata_targetFilename:/.*\[Ss][Yy][Ss][Tt][Ee][Mm]\.([Ss][Aa][Vv][Ee]|[Bb][Aa][Kk]|[Hh][Ii][Vv]).*/ OR data_win_eventdata_targetFilename:/.*[Ss][Aa][Mm]\.([Ss][Aa][Vv][Ee]|[Bb][Aa][Kk]|[Hh][Ii][Vv]).*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Ii][Vv][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Mimikatz or secretsdump-style credential extraction commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Kk][Ee][Nn]::[Ee][Ll][Ee][Vv][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz].*/)
    pivot_on:
    - host
    window: 2h
  - name: Network NTLM logons by this account, pass-the-hash follow-on
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm]/
    pivot_on:
    - user
    window: 6h
