name: Service Installed By Unusual Client - Security
id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: Tim Rauch (Nextron Systems), Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a service installed by a client which has PID 0 or whose parent has
  PID 0. MITRE ATT&CK: T1543.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - term:
                  data_win_eventdata_clientProcessId: "0"
              - term:
                  data_win_eventdata_parentProcessId: "0"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_clientProcessId
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_clientProcessId
  equals '0'; data_win_eventdata_parentProcessId equals '0'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/windows-service-installed-via-an-unusual-client.html
  - https://www.x86matthew.com/view_post?id=create_svc_rpc
  - https://twitter.com/SBousseaden/status/1490608838701166596
  - https://attack.mitre.org/techniques/T1543/

response:
  message: >
    Service Installed By Unusual Client - Security detected on host
    $agent_name$. Matched data_win_eventdata_clientProcessId:
    $data_win_eventdata_clientProcessId$. Matched
    data_win_eventdata_parentProcessId: $data_win_eventdata_parentProcessId$.
    MITRE ATT&CK: T1543
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_clientProcessId
      type: other
    - field: data_win_eventdata_parentProcessId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543
  custom_tags:
    - service
    - installed
    - unusual
    - windows_security
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND (data_win_eventdata_clientProcessId:"0" OR data_win_eventdata_parentProcessId:"0")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PsExec drops and installs PSEXESVC remotely over RPC/SMB; an RPC-created service with a zero-PID client is the same remote service-install primitive, and the service binary starting is the follow-on.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Same remote-execution-via-service technique; confirms whether the 4697 service was a PsExec-style tool run from another host.
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: smbexec creates a temporary service via SVCCTL with a cmd.exe binPath; the service-install event is its host-side artifact and the cmd/%COMSPEC% child follows.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Local sc.exe/PowerShell service creation is the alternative route to the same persistence/execution; seeing both on a host suggests staged service abuse.
  - id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
    name: Writing Local Admin Share
    reason: Remote service installs need the binary dropped to ADMIN$/C$ first; this is the immediate precursor file write.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Service-launched cmd/echo-to-pipe impersonation is a common way a freshly installed SYSTEM service is used to elevate or relay execution.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Attackers who gain SYSTEM through a remote service typically go on to dump credentials from LSASS for further lateral movement.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: After running via a throwaway service, operators often clear logs to hide the service install and the activity it ran.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service binary or command line of newly installed service started
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ss]ervices\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/) AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Rr]und[Ll][Ll]32.*/ OR data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc].*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote service-install named pipes (svcctl, PSEXESVC, smbexec)
    query: data_win_system_eventID:"17" AND (data_win_eventdata_pipeName:*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]* OR data_win_eventdata_pipeName:*svcctl* OR data_win_eventdata_pipeName:*[Rr]emcom* OR data_win_eventdata_pipeName:*[Pp]aexec* OR data_win_eventdata_pipeName:*[Cc]sexec*)
    pivot_on:
    - host
    window: 1h
  - name: Executables dropped to admin shares or system dirs before service install
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ww]indows\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*[Ww]indows\\[Tt]emp\\.*\.(exe|dll|bat|ps1)/) AND NOT data_win_eventdata_image:/.*[Tt]rusted[Ii]nstaller.*/
    pivot_on:
    - host
    window: 1h
  - name: Inbound SMB/RPC connections to this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"false" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135")
    pivot_on:
    - host
    window: 2h
  - name: Network logons (type 3) by this account around service install
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:*$
    pivot_on:
    - user
    window: 2h
