name: Service Installed By Unusual Client - Security
id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: Tim Rauch (Nextron Systems), Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a service installed by a client which has PID 0 or whose parent has
  PID 0. MITRE ATT&CK: T1543.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - term:
                  data_win_eventdata_clientProcessId: "0"
              - term:
                  data_win_eventdata_parentProcessId: "0"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_clientProcessId
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_clientProcessId
  equals '0'; data_win_eventdata_parentProcessId equals '0'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/windows-service-installed-via-an-unusual-client.html
  - https://www.x86matthew.com/view_post?id=create_svc_rpc
  - https://twitter.com/SBousseaden/status/1490608838701166596
  - https://attack.mitre.org/techniques/T1543/

response:
  message: >
    Service Installed By Unusual Client - Security detected on host
    $agent_name$. Matched data_win_eventdata_clientProcessId:
    $data_win_eventdata_clientProcessId$. Matched
    data_win_eventdata_parentProcessId: $data_win_eventdata_parentProcessId$.
    MITRE ATT&CK: T1543
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_clientProcessId
      type: other
    - field: data_win_eventdata_parentProcessId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543
  custom_tags:
    - service
    - installed
    - unusual
    - windows_security
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND (data_win_eventdata_clientProcessId:"0" OR data_win_eventdata_parentProcessId:"0")

