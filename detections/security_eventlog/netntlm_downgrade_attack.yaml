name: NetNTLM Downgrade Attack
id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems), wagga
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects NetNTLM downgrade attack. MITRE ATT&CK: T1685, T1112.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4657"
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\REGISTRY\\\\MACHINE\\\\SYSTEM*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*ControlSet*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\Control\\\\Lsa*"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_objectValueName:
                    value: "LmCompatibilityLevel"
                    case_insensitive: true
              - term:
                  data_win_eventdata_objectValueName:
                    value: "NtlmMinClientSec"
                    case_insensitive: true
              - term:
                  data_win_eventdata_objectValueName:
                    value: "RestrictSendingNTLMTraffic"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_objectValueName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4657'; data_win_eventdata_objectName matches
  '*\REGISTRY\MACHINE\SYSTEM*'; data_win_eventdata_objectName matches
  '*ControlSet*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.optiv.com/blog/post-exploitation-using-netntlm-downgrade-attacks
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    NetNTLM Downgrade Attack detected on host $agent_name$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. Matched
    data_win_eventdata_objectValueName: $data_win_eventdata_objectValueName$.
    MITRE ATT&CK: T1685, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_objectValueName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
    - T1112
  custom_tags:
    - netntlm
    - downgrade
    - attack
    - windows_security
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4657" AND data_win_eventdata_objectName:/.*\\[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]\\[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND data_win_eventdata_objectName:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt].*/ AND data_win_eventdata_objectName:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/ AND (data_win_eventdata_objectValueName:/[Ll][Mm][Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy][Ll][Ee][Vv][Ee][Ll]/ OR data_win_eventdata_objectValueName:/[Nn][Tt][Ll][Mm][Mm][Ii][Nn][Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Cc]/ OR data_win_eventdata_objectValueName:/[Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ss][Ee][Nn][Dd][Ii][Nn][Gg][Nn][Tt][Ll][Mm][Tt][Rr][Aa][Ff][Ff][Ii][Cc]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
    name: NetNTLM Downgrade Attack - Registry
    reason: Sysmon registry-event twin of the same LmCompatibilityLevel/NtlmMinClientSec change; co-firing confirms the downgrade from a second telemetry source and may expose the writing process
  - id: e9d4ab66-a532-4ef7-a502-66a9e4a34f5d
    name: NTLMv1 Logon Between Client and Server
    reason: 'direct consequence: once LmCompatibilityLevel is lowered, hosts start negotiating NTLMv1, which is crackable/relayable'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: weakened NTLM settings are commonly set so captured NTLM hashes can be replayed; NTLM network logons with hash-style characteristics follow
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: NTLM downgrade is a prerequisite step for relay/capture tooling such as Responder or ntlmrelayx on the same host
  - id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
    name: Possible PetitPotam Coerce Authentication Attempt
    reason: coercion forces machine accounts to authenticate over NTLM; a downgraded policy makes the captured authentication far more useful
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: LOLBin-driven NTLM coercion to an attacker host; pairs with a downgrade to harvest weak NetNTLM responses
  - id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
    name: Password Dumper Activity on LSASS
    reason: 'same Lsa-focused credential theft phase: after loosening NTLM policy attackers dump LSASS for hashes on the host'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other writes to the LSA / MSV1_0 NTLM security policy keys
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/ OR data_win_eventdata_targetObject:/.*[Mm][Ss][Vv]1_0.*/) AND (data_win_eventdata_targetObject:/.*([Ll][Mm][Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy][Ll][Ee][Vv][Ee][Ll]|[Nn][Tt][Ll][Mm][Mm][Ii][Nn][Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Cc]|[Nn][Tt][Ll][Mm][Mm][Ii][Nn][Ss][Ee][Rr][Vv][Ee][Rr][Ss][Ee][Cc]|[Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ss][Ee][Nn][Dd][Ii][Nn][Gg][Nn][Tt][Ll][Mm][Tt][Rr][Aa][Ff][Ff][Ii][Cc]|[Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Rr][Ee][Cc][Ee][Ii][Vv][Ii][Nn][Gg][Nn][Tt][Ll][Mm][Tt][Rr][Aa][Ff][Ff][Ii][Cc]|[Nn][Oo][Ll][Mm][Hh][Aa][Ss][Hh]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Process that changed NTLM settings (reg.exe, PowerShell, secedit, GPO tooling)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ll][Mm][Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy][Ll][Ee][Vv][Ee][Ll]|[Nn][Tt][Ll][Mm][Mm][Ii][Nn][Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Cc]|[Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ss][Ee][Nn][Dd][Ii][Nn][Gg][Nn][Tt][Ll][Mm][Tt][Rr][Aa][Ff][Ff][Ii][Cc]).*/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/ AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg] +[Aa][Dd][Dd]|[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy]|[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy]).*/))
    pivot_on:
    - host
    window: 2h
  - name: NTLMv1 / LM network logons accepted on this host
    query: data_win_system_eventID:"4624" AND data_win_eventdata_authenticationPackageName:"NTLM" AND (data_win_eventdata_lmPackageName:/[Nn][Tt][Ll][Mm] [Vv]1/ OR data_win_eventdata_lmPackageName:"LM") AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on:
    - host
    window: 6h
  - name: NTLM credential validations and SMB share access by this account
    query: (data_win_system_eventID:"4776" OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM") OR data_win_system_eventID:"5140" OR data_win_system_eventID:"5145")
    pivot_on:
    - user
    window: 6h
  - name: LSASS process access following the NTLM policy change
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_sourceImage:/.*(\\[Ww][Ii][Nn][Ii][Nn][Ii][Tt]|\\[Cc][Ss][Rr][Ss][Ss]|\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Mm][Ss][Ee][Nn][Gg]).*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
