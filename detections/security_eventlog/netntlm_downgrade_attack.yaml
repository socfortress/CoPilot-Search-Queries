name: NetNTLM Downgrade Attack
id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems), wagga
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects NetNTLM downgrade attack. MITRE ATT&CK: T1685, T1112.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4657"
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\REGISTRY\\\\MACHINE\\\\SYSTEM*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*ControlSet*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\Control\\\\Lsa*"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_objectValueName:
                    value: "LmCompatibilityLevel"
                    case_insensitive: true
              - term:
                  data_win_eventdata_objectValueName:
                    value: "NtlmMinClientSec"
                    case_insensitive: true
              - term:
                  data_win_eventdata_objectValueName:
                    value: "RestrictSendingNTLMTraffic"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_objectValueName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4657'; data_win_eventdata_objectName matches
  '*\REGISTRY\MACHINE\SYSTEM*'; data_win_eventdata_objectName matches
  '*ControlSet*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.optiv.com/blog/post-exploitation-using-netntlm-downgrade-attacks
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    NetNTLM Downgrade Attack detected on host $agent_name$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. Matched
    data_win_eventdata_objectValueName: $data_win_eventdata_objectValueName$.
    MITRE ATT&CK: T1685, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_objectValueName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
    - T1112
  custom_tags:
    - netntlm
    - downgrade
    - attack
    - windows_security
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4657" AND data_win_eventdata_objectName:/.*\\[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]\\[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND data_win_eventdata_objectName:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt].*/ AND data_win_eventdata_objectName:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/ AND (data_win_eventdata_objectValueName:/[Ll][Mm][Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy][Ll][Ee][Vv][Ee][Ll]/ OR data_win_eventdata_objectValueName:/[Nn][Tt][Ll][Mm][Mm][Ii][Nn][Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Cc]/ OR data_win_eventdata_objectValueName:/[Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ss][Ee][Nn][Dd][Ii][Nn][Gg][Nn][Tt][Ll][Mm][Tt][Rr][Aa][Ff][Ff][Ii][Cc]/)

