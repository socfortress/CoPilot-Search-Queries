name: Windows Pcap Drivers
id: 7b687634-ab20-11ea-bb37-0242ac130002
version: 1
schema_version: "1.0"
date: "2023-04-14"
author: Cian Heasley
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7b687634-ab20-11ea-bb37-0242ac130002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Windows Pcap driver installation based on a list of associated .sys
  files. MITRE ATT&CK: T1040.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*pcap*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*npcap*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*npf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*nm3*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*ndiscap*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*nmnt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*windivert*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*USBPcap*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*pktmon*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*pcap*'; data_win_eventdata_serviceFileName matches '*npcap*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://ragged-lab.blogspot.com/2020/06/capturing-pcap-driver-installations.html#more
  - https://attack.mitre.org/techniques/T1040/

response:
  message: >
    Windows Pcap Drivers detected on host $agent_name$. Matched
    data_win_eventdata_serviceFileName: $data_win_eventdata_serviceFileName$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1040
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1040
  custom_tags:
    - drivers
    - windows_security
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND (data_win_eventdata_serviceFileName:/.*[Pp][Cc][Aa][Pp].*/ OR data_win_eventdata_serviceFileName:/.*[Nn][Pp][Cc][Aa][Pp].*/ OR data_win_eventdata_serviceFileName:/.*[Nn][Pp][Ff].*/ OR data_win_eventdata_serviceFileName:/.*[Nn][Mm]3.*/ OR data_win_eventdata_serviceFileName:/.*[Nn][Dd][Ii][Ss][Cc][Aa][Pp].*/ OR data_win_eventdata_serviceFileName:/.*[Nn][Mm][Nn][Tt].*/ OR data_win_eventdata_serviceFileName:/.*[Ww][Ii][Nn][Dd][Ii][Vv][Ee][Rr][Tt].*/ OR data_win_eventdata_serviceFileName:/.*[Uu][Ss][Bb][Pp][Cc][Aa][Pp].*/ OR data_win_eventdata_serviceFileName:/.*[Pp][Kk][Tt][Mm][Oo][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ba1f7802-adc7-48b4-9ecb-81e227fddfd5
    name: Potential Network Sniffing Activity Using Network Tools
    reason: Capture driver is only useful once a sniffer (tshark/WinDump) runs; this is the user-mode follow-on that confirms the driver is being used.
  - id: d3c3861d-c504-4c77-ba55-224ba82d0118
    name: New Network Trace Capture Started Via Netsh.EXE
    reason: Driverless alternative/companion capture path (netsh trace start) on the same host; confirms active packet collection.
  - id: da34e323-1e65-42db-83be-a6725ac2caa3
    name: Potential Packet Capture Activity Via Start-NetEventSession - ScriptBlock
    reason: PowerShell native capture via NetEventSession often runs alongside or instead of installing Npcap.
  - id: 679085d5-f427-4484-9f58-1dc30a7c426d
    name: WinDivert Driver Load
    reason: WinDivert is in this rule's driver list; its Sysmon driver-load event is the load-time confirmation of the same packet interception service.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Capture drivers are often registered by sc create type=kernel; same service-install event seen from process creation, revealing the installing parent.
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: Alternate driver staging route preceding or substituting for the 4697 service install.
  - id: f63508a0-c809-4435-b3be-ed819394d612
    name: Potential Privileged System Service Operation - SeLoadDriverPrivilege
    reason: Loading a kernel capture driver requires SeLoadDriverPrivilege; the privilege-use event ties the install to the account that exercised it.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Flags the same 4697 install made from an atypical client/logon, separating a remote or attacker-driven install from admin tooling setup.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Packet sniffer / capture tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Ss][Hh][Aa][Rr][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Cc][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Rr][Ee][Ss][Hh][Aa][Rr][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Kk][Tt][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Cc][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: Capture driver or tool dropped to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Nn][Pp][Cc][Aa][Pp]|[Ww][Ii][Nn][Pp][Cc][Aa][Pp]|[Ww][Ii][Nn][Dd][Ii][Vv][Ee][Rr][Tt]|[Uu][Ss][Bb][Pp][Cc][Aa][Pp]|[Nn][Pp][Ff]).*\.([Ss][Yy][Ss]|[Dd][Ll][Ll]|[Ee][Xx][Ee]|[Pp][Cc][Aa][Pp]|[Pp][Cc][Aa][Pp][Nn][Gg]|[Ee][Tt][Ll])/ OR data_win_eventdata_targetFilename:/.*\.([Pp][Cc][Aa][Pp]|[Pp][Cc][Aa][Pp][Nn][Gg]|[Ee][Tt][Ll])/)
    pivot_on:
    - host
    window: 2h
  - name: Kernel driver loads and driver-install commands
    query: (data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*([Nn][Pp][Cc][Aa][Pp]|[Nn][Pp][Ff]|[Ww][Ii][Nn][Dd][Ii][Vv][Ee][Rr][Tt]|[Uu][Ss][Bb][Pp][Cc][Aa][Pp]|[Nn][Dd][Ii][Ss][Cc][Aa][Pp]).*/)) OR (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (data_win_eventdata_image:/.*\\[Pp][Nn][Pp][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Aa].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Network discovery and credential-exposure follow-up
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa][Rr][Pp]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Nn][Mm][Aa][Pp]|[Rr][Oo][Uu][Tt][Ee]|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Rr][Ee][Ss][Pp][Oo][Nn][Dd][Ee][Rr]|[Ii][Nn][Vv][Ee][Oo][Hh]|[Ii][Mm][Pp][Aa][Cc][Kk][Ee][Tt]|[Pp][Oo][Ww][Ee][Rr][Ss][Pp][Ll][Oo][Ii][Tt]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]).*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Capture staging, archiving and exfil on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|7[Zz]|[Tt][Aa][Rr]|[Cc][Uu][Rr][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Pp][Cc][Aa][Pp]|[Ee][Tt][Ll]).*/) OR (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/))
    pivot_on:
    - host
    window: 6h
