name: Azure AD Health Service Agents Registry Keys Access
id: 1d2ab8ac-1a01-423b-9c39-001510eae8e8
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1d2ab8ac-1a01-423b-9c39-001510eae8e8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This detection uses Windows security events to detect suspicious access
  attempts to the registry key values and sub-keys of Azure AD Health service
  agents (e.g AD FS). Information from AD Health service agents can be used to
  potentially abuse some of the features provided by those services in the cloud
  (e.g. Federation). This detection requires an access control entry (ACE) on
  the system access control list (SACL) of the following securable object:
  HKLM:\SOFTWARE\Microsoft\ADHealthAgent. Make sure you set the SACL to
  propagate to its sub-keys. MITRE ATT&CK: T1012.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4656"
              - term:
                  data_win_system_eventID: "4663"
            minimum_should_match: 1
        - term:
            data_win_eventdata_objectType:
              value: "Key"
              case_insensitive: true
        - term:
            data_win_eventdata_objectName:
              value: "\\REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\ADHealthAgent"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Adfs.InsightsService.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Adfs.PshSurrogate.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_system_eventID equals '4663';
  data_win_eventdata_objectType equals 'Key', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://o365blog.com/post/hybridhealthagent/
  - https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_service_agent.yml
  - https://attack.mitre.org/techniques/T1012/

response:
  message: >
    Azure AD Health Service Agents Registry Keys Access detected on host
    $agent_name$. Matched data_win_eventdata_objectType:
    $data_win_eventdata_objectType$. Matched data_win_eventdata_objectName:
    $data_win_eventdata_objectName$. MITRE ATT&CK: T1012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1012
  custom_tags:
    - azure
    - health
    - service
    - windows_security
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4656" OR data_win_system_eventID:"4663") AND data_win_eventdata_objectType:/[Kk][Ee][Yy]/ AND data_win_eventdata_objectName:/\\[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]\\[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Aa][Dd][Hh][Ee][Aa][Ll][Tt][Hh][Aa][Gg][Ee][Nn][Tt]/ AND _exists_:data_win_eventdata_processName AND NOT (data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Ii][Nn][Ss][Ii][Gg][Hh][Tt][Ss][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg][Aa][Gg][Ee][Nn][Tt]\.[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Pp][Ss][Hh][Ss][Uu][Rr][Rr][Oo][Gg][Aa][Tt][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Cc][Oo][Mm][Mm][Oo][Nn]\.[Cc][Ll][Ii][Ee][Nn][Tt][Ss]\.[Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ff151c33-45fa-475d-af4f-c2f93571f4fe
    name: Azure AD Health Monitoring Agent Registry Keys Access
    reason: Sibling SACL-based detection on the sister ADHealth monitoring-agent key; the same actor commonly touches both keys when harvesting Connect Health agent secrets.
  - id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
    name: ADFS Database Named Pipe Connection By Uncommon Tool
    reason: 'Same AD FS server: after reading health-agent config an attacker proceeds to the AD FS configuration DB (WID pipe) to steal token-signing material for federation abuse.'
  - id: c86500e9-a645-4680-98d7-f882c70c1ea3
    name: AADInternals PowerShell Cmdlets Execution - ProccessCreation
    reason: AADInternals is the public tooling (o365blog reference) that reads Health Agent registry/credentials to abuse Azure AD federation; its execution confirms the registry read.
  - id: 91e69562-2426-42ce-a647-711b8152ced6
    name: AADInternals PowerShell Cmdlets Execution - PsScript
    reason: Script-block evidence of AADInternals cmdlets on the host that just read the ADHealthAgent key, confirming cloud-abuse tooling.
  - id: 970007b7-ce32-49d0-a4a4-fbef016950bd
    name: Potential Configuration And Service Reconnaissance Via Reg.EXE
    reason: reg.exe querying service/config keys is the command-line way to read the ADHealthAgent key, producing the same discovery on process telemetry.
  - id: a0e417e2-2fa1-40da-b6d2-e094cd5e1191
    name: Registry Enumeration via WMI Stdregprov
    reason: Alternative registry read method (StdRegProv) used to enumerate agent keys without reg.exe.
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: 'Typical adjacent discovery: attacker on a hybrid identity server enumerates privileged AD users/groups to choose the account to impersonate.'
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: 'Follow-on credential access: dumping SAM/SECURITY/SYSTEM hives on the AD FS/Connect server to recover service account secrets.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reg/PowerShell/WMI reading ADHealthAgent or Azure AD Connect config
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*ADHealthAgent* OR data_win_eventdata_commandLine:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Hh][Ee][Aa][Ll][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Aa][Aa][Dd][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Aa][Aa][Dd][Ii][Nn][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: AD FS / Azure AD Connect process access to LSASS or credential stores
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Credential and certificate file or hive dumps on this host
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.pfx OR data_win_eventdata_targetFilename:*.pvk OR data_win_eventdata_targetFilename:*.dmp OR data_win_eventdata_targetFilename:*.kirbi)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*(SAM|SYSTEM|SECURITY).*/)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell script blocks touching federation, tenant or token material
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*ADHealthAgent* OR data_win_eventdata_scriptBlockText:/.*[Ss]igning[Cc]ertificate.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ederation.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]ccess[Tt]oken.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Aa][Dd][Ii][Nn][Tt].*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections to Microsoft login/Graph endpoints from non-browser processes
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*login.microsoftonline.com OR data_win_eventdata_queryName:*graph.microsoft.com OR data_win_eventdata_queryName:*adhybridhealth.azure.com) AND NOT data_win_eventdata_image:/.*([Cc]hrome|[Ee]dge|[Ff]irefox|[Ii]explore)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
