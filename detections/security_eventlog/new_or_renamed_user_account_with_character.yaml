name: New or Renamed User Account with '$' Character
id: cfeed607-6aa4-4bbd-9627-b637deb723c8
version: 1
schema_version: "1.0"
date: "2024-01-16"
author: Ilyas Ochkov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cfeed607-6aa4-4bbd-9627-b637deb723c8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a user with the "$" character. This can be used by
  attackers to hide a user or trick detection systems that lack the parsing
  mechanisms. MITRE ATT&CK: T1036.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4720"
                    - wildcard:
                        data_win_eventdata_samAccountName: "*$*"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4781"
                    - wildcard:
                        data_win_eventdata_newTargetUserName: "*$*"
            minimum_should_match: 1
        - exists:
            field: "data_win_system_eventID"
        - exists:
            field: "data_win_eventdata_targetUserName"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4720"
                    - term:
                        data_win_eventdata_targetUserName:
                          value: "HomeGroupUser$"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_samAccountName
    - data_win_eventdata_newTargetUserName
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4720'; data_win_eventdata_samAccountName
  matches '*$*'; data_win_system_eventID equals '4781', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1387743867663958021
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    New or Renamed User Account with '$' Character detected on host
    $agent_name$. Matched data_win_eventdata_samAccountName:
    $data_win_eventdata_samAccountName$. Matched
    data_win_eventdata_newTargetUserName:
    $data_win_eventdata_newTargetUserName$. MITRE ATT&CK: T1036
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_samAccountName
      type: other
    - field: data_win_eventdata_newTargetUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - renamed
    - account
    - character
    - windows_security
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"4720" AND data_win_eventdata_samAccountName:/.*\$.*/) OR (data_win_system_eventID:"4781" AND data_win_eventdata_newTargetUserName:/.*\$.*/)) AND _exists_:data_win_system_eventID AND _exists_:data_win_eventdata_targetUserName AND NOT (data_win_system_eventID:"4720" AND data_win_eventdata_targetUserName:/[Hh][Oo][Mm][Ee][Gg][Rr][Oo][Uu][Pp][Uu][Ss][Ee][Rr]\$/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: The usual command-line mechanism that produces the 4720 event with a trailing $; confirms a net user /add created the fake machine-style account.
  - id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
    name: Hidden Local User Creation
    reason: 'Same hide-the-account intent: a local user ending in $ is hidden from net user and logon UI, often paired with this rule.'
  - id: 9ec9fb1b-e059-4489-9642-f270c207923d
    name: Hiding User Account Via SpecialAccounts Registry Key - CommandLine
    reason: 'Follow-on hiding step: after creating the account the attacker hides it from the logon screen via SpecialAccounts\UserList.'
  - id: f8aebc67-a56d-4ec9-9fbe-7b0e8b7b4efd
    name: Hiding User Account Via SpecialAccounts Registry Key
    reason: Registry-level evidence of the same hiding persistence on the host that created the $ account.
  - id: 460479f3-80b7-42da-9c43-2cc1d54dbccd
    name: Creation of a Local Hidden User Account by Registry
    reason: Hidden accounts created by direct SAM registry writes bypass 4720; co-occurs with the $ naming trick.
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: 'Typical next step: the stealth account is added to local Administrators to give the backdoor privileges.'
  - id: 45eb2ae2-9aa2-4c3a-99a5-6e5077655466
    name: Suspicious Computer Account Name Change CVE-2021-42287
    reason: Same 4781 rename-to-machine-style-name behaviour on the domain side (sAMAccountName spoofing with $).
  - id: 1bbf25b9-8038-4154-a50b-118f2a32be27
    name: Suspicious Windows ANONYMOUS LOGON Local Account Created
    reason: Sibling account-name masquerade technique used to make a persistence account look like a system principal.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Account creation, rename and enablement events on this host
    query: (data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4738" OR data_win_system_eventID:"4781")
    pivot_on:
    - host
    window: 2h
  - name: Privileged group membership additions on this host
    query: (data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4756") AND (data_win_eventdata_targetUserName:*dmin* OR data_win_eventdata_targetUserName:*Remote* OR data_win_eventdata_targetUserName:*Domain*)
    pivot_on:
    - host
    window: 2h
  - name: net/wmic/PowerShell account-creation commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*user*/add* OR data_win_eventdata_commandLine:*New-LocalUser* OR data_win_eventdata_commandLine:*localgroup*administrators* OR data_win_eventdata_commandLine:*net1*user*)
    pivot_on:
    - host
    window: 2h
  - name: SAM / SpecialAccounts registry writes hiding a user
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:*SpecialAccounts* OR data_win_eventdata_targetObject:*\\SAM\\SAM\\Domains\\Account\\Users*)
    pivot_on:
    - host
    window: 2h
  - name: Logons by the new $ account
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4672") AND data_win_eventdata_targetUserName:*$
    pivot_on:
    - host
    - user
    window: 24h
