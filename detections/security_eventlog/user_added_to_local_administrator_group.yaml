name: User Added to Local Administrator Group
id: c265cf08-3f99-46c1-8d59-328247057d57
version: 1
schema_version: "1.0"
date: "2021-01-17"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c265cf08-3f99-46c1-8d59-328247057d57
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects the addition of a new member to the local administrator group, which
  could be legitimate activity or a sign of privilege escalation activity. MITRE
  ATT&CK: T1078, T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4732"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetUserName:
                    value: "Administr*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetSid:
                    value: "S-1-5-32-544"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_subjectUserName: "*$"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetUserName
    - data_win_eventdata_targetSid
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4732'; data_win_eventdata_targetUserName
  matches 'Administr*'; data_win_eventdata_targetSid equals 'S-1-5-32-544',
  among other conditions.

known_false_positives: >
  Legitimate administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732
  - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers
  - https://attack.mitre.org/techniques/T1078/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    User Added to Local Administrator Group detected on host $agent_name$.
    Matched data_win_eventdata_targetUserName:
    $data_win_eventdata_targetUserName$. Matched data_win_eventdata_targetSid:
    $data_win_eventdata_targetSid$. MITRE ATT&CK: T1078, T1098
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: user
    - field: data_win_eventdata_targetSid
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078
    - T1098
  custom_tags:
    - added
    - local
    - administrator
    - windows_security
    - initial_access
    - privilege_escalation
    - stealth
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4732" AND (data_win_eventdata_targetUserName:/[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr].*/ OR data_win_eventdata_targetSid:/[Ss]-1-5-32-544/) AND _exists_:data_win_eventdata_subjectUserName AND NOT (data_win_eventdata_subjectUserName:/.*\$/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: 'Precursor: attackers enumerate local groups/accounts with net.exe before choosing whom to add to Administrators.'
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: 'Same outcome via a new account: net user /add followed by net localgroup administrators produces this 4732 event.'
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: Process-creation view of the same action; the net.exe/net1.exe command line identifies the parent process that triggered the 4732.
  - id: 5b768e71-86f2-4879-b448-81061cbae951
    name: Suspicious Manipulation Of Default Accounts Via Net.EXE
    reason: 'Co-occurring: enabling Guest/DefaultAccount then adding it to Administrators is a common backdoor-account pattern.'
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: Account creation or password set with inline credentials immediately before the group add.
  - id: 9ec9fb1b-e059-4489-9642-f270c207923d
    name: Hiding User Account Via SpecialAccounts Registry Key - CommandLine
    reason: 'Follow-on: attackers hide the newly privileged backdoor account from the logon screen to keep persistence.'
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: 'Co-occurring: the same account is often also granted RDP rights to use the admin access remotely.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Follow-on: with new local admin rights the actor commonly dumps LSASS for credentials to move laterally.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: net.exe user/localgroup commands that created or elevated the account
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] .*\/[Aa][Dd][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: New local account creation, enablement or password reset around the group add
    query: (data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4738")
    pivot_on:
    - host
    window: 2h
  - name: PowerShell local user/group cmdlets and WMI account tampering
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Add-LocalGroupMember* OR data_win_eventdata_scriptBlockText:*New-LocalUser* OR data_win_eventdata_scriptBlockText:*WinNT\:\/\/* OR data_win_eventdata_scriptBlockText:*NetLocalGroupAddMembers*)
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping and LSASS access after privilege grant
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/))
    pivot_on:
    - host
    window: 4h
  - name: Logons and special-privilege sessions by the added account
    query: data_win_system_eventID:"4624" OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 24h
