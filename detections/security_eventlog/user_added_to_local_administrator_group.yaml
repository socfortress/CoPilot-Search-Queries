name: User Added to Local Administrator Group
id: c265cf08-3f99-46c1-8d59-328247057d57
version: 1
schema_version: "1.0"
date: "2021-01-17"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c265cf08-3f99-46c1-8d59-328247057d57
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects the addition of a new member to the local administrator group, which
  could be legitimate activity or a sign of privilege escalation activity. MITRE
  ATT&CK: T1078, T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4732"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetUserName:
                    value: "Administr*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetSid:
                    value: "S-1-5-32-544"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_subjectUserName: "*$"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetUserName
    - data_win_eventdata_targetSid
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4732'; data_win_eventdata_targetUserName
  matches 'Administr*'; data_win_eventdata_targetSid equals 'S-1-5-32-544',
  among other conditions.

known_false_positives: >
  Legitimate administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732
  - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers
  - https://attack.mitre.org/techniques/T1078/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    User Added to Local Administrator Group detected on host $agent_name$.
    Matched data_win_eventdata_targetUserName:
    $data_win_eventdata_targetUserName$. Matched data_win_eventdata_targetSid:
    $data_win_eventdata_targetSid$. MITRE ATT&CK: T1078, T1098
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: user
    - field: data_win_eventdata_targetSid
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078
    - T1098
  custom_tags:
    - added
    - local
    - administrator
    - windows_security
    - initial_access
    - privilege_escalation
    - stealth
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4732" AND (data_win_eventdata_targetUserName:/[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr].*/ OR data_win_eventdata_targetSid:/[Ss]-1-5-32-544/) AND _exists_:data_win_eventdata_subjectUserName AND NOT (data_win_eventdata_subjectUserName:/.*\$/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0255a820-e564-4e40-af2b-6ac61160335c
      name: "A New Trust Was Created To A Domain"
      reason: "next kill-chain tactic: Persistence"
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
      name: "Account Tampering - Suspicious Failed Logon Reasons"
      reason: "next kill-chain tactic: Initial Access"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
      name: "Active Directory User Backdoors"
      reason: "next kill-chain tactic: Persistence"
  window: 1h
