name: Kapeka Backdoor Scheduled Task Creation
id: 6c130acd-0adb-4545-bcc4-2e85d0883c9a
version: 1
schema_version: "1.0"
date: "2024-07-03"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6c130acd-0adb-4545-bcc4-2e85d0883c9a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Kapeka backdoor scheduled task creation based on attributes such as
  paths, commands line flags, etc. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4698"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\AppData\\\\Local\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_taskContent:
              value: "*rundll32*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_taskContent:
              value: "*.wll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_taskContent: "*#1*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*OneDrive*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*Sens Api*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskContent
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4698'; data_win_eventdata_taskContent matches
  '*:\ProgramData\*'; data_win_eventdata_taskContent matches
  '*\AppData\Local\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4698
  - https://labs.withsecure.com/publications/kapeka
  - https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
  - https://www.virustotal.com/gui/file/bd07fb1e9b4768e7202de6cc454c78c6891270af02085c51fce5539db1386c3f/behavior
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Kapeka Backdoor Scheduled Task Creation detected on host $agent_name$.
    Matched data_win_eventdata_taskContent: $data_win_eventdata_taskContent$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskContent
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - kapeka
    - backdoor
    - scheduled
    - windows_security
    - execution
    - privilege_escalation
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4698" AND (data_win_eventdata_taskContent:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_taskContent:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/) AND data_win_eventdata_taskContent:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_taskContent:/.*\.[Ww][Ll][Ll].*/ AND data_win_eventdata_taskContent:/.*\#1.*/ AND (data_win_eventdata_taskContent:/.*[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee].*/ OR data_win_eventdata_taskContent:/.*[Ss][Ee][Nn][Ss] [Aa][Pp][Ii].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
    name: Kapeka Backdoor Persistence Activity
    reason: Same Kapeka persistence stage seen from process creation (schtasks /create ONSTART or reg.exe autorun); confirms the 4698 task was made via schtasks.exe
  - id: e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
    name: Kapeka Backdoor Execution Via RunDLL32.EXE
    reason: The scheduled task runs rundll32 on a .wll in ProgramData/AppData Local; this is the process execution when the task fires
  - id: a7e6b1f9-8d2c-4f1e-9a7d-63e4c8a2bf4c
    name: Kapeka Backdoor Loaded Via Rundll32.EXE
    reason: Image-load evidence that rundll32 loaded the Kapeka .wll payload the task points at
  - id: 20228d05-dd68-435d-8b4e-e7e64938880c
    name: Potential Kapeka Decrypted Backdoor Indicator
    reason: 'Dropper-stage precursor: the decrypted backdoor file written to disk before the task was registered'
  - id: c0c67b21-eb8a-4c84-a395-40473ec3b482
    name: Kapeka Backdoor Autorun Persistence
    reason: Kapeka uses a Run-key autorun when not elevated; redundant persistence co-occurring on the same host
  - id: cbaa3ef3-07a9-4c8e-82d1-9e40578da7fd
    name: Kapeka Backdoor Configuration Persistence
    reason: Kapeka stores its C2 configuration in the registry after installing persistence; follow-on to the task creation
  - id: f40017b3-cb2e-4335-ab5d-3babf679c1de
    name: Remote DLL Load Via Rundll32.EXE
    reason: Generic rundll32 loading a DLL from an unusual or remote location, overlapping the task's rundll32 payload execution
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 launching a .wll payload on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\.[Ww][Ll][Ll].*/
    pivot_on:
    - host
    window: 4h
  - name: Backdoor .wll or OneDrive/Sens Api lookalike dropped in ProgramData/AppData Local
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ww][Ll][Ll]/ OR (data_win_eventdata_targetFilename:/.*([Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]).*/ AND (data_win_eventdata_targetFilename:/.*[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*[Ss][Ee][Nn][Ss] [Aa][Pp][Ii].*/)))
    pivot_on:
    - host
    window: 4h
  - name: Registry autorun/config writes for Kapeka persistence
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Nn][Ss] [Aa][Pp][Ii].*/) AND (data_win_eventdata_details:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_details:/.*\.[Ww][Ll][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Rundll32 network connections and DNS (backdoor C2)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Office app spawning rundll32/schtasks/script host (dropper delivery)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
