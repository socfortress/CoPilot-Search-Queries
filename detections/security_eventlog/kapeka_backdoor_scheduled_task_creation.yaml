name: Kapeka Backdoor Scheduled Task Creation
id: 6c130acd-0adb-4545-bcc4-2e85d0883c9a
version: 1
schema_version: "1.0"
date: "2024-07-03"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6c130acd-0adb-4545-bcc4-2e85d0883c9a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Kapeka backdoor scheduled task creation based on attributes such as
  paths, commands line flags, etc. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4698"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*\\\\AppData\\\\Local\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_taskContent:
              value: "*rundll32*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_taskContent:
              value: "*.wll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_taskContent: "*#1*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*OneDrive*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContent:
                    value: "*Sens Api*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskContent
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4698'; data_win_eventdata_taskContent matches
  '*:\ProgramData\*'; data_win_eventdata_taskContent matches
  '*\AppData\Local\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4698
  - https://labs.withsecure.com/publications/kapeka
  - https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
  - https://www.virustotal.com/gui/file/bd07fb1e9b4768e7202de6cc454c78c6891270af02085c51fce5539db1386c3f/behavior
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Kapeka Backdoor Scheduled Task Creation detected on host $agent_name$.
    Matched data_win_eventdata_taskContent: $data_win_eventdata_taskContent$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskContent
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - kapeka
    - backdoor
    - scheduled
    - windows_security
    - execution
    - privilege_escalation
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4698" AND (data_win_eventdata_taskContent:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_taskContent:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/) AND data_win_eventdata_taskContent:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_taskContent:/.*\.[Ww][Ll][Ll].*/ AND data_win_eventdata_taskContent:/.*\#1.*/ AND (data_win_eventdata_taskContent:/.*[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee].*/ OR data_win_eventdata_taskContent:/.*[Ss][Ee][Nn][Ss] [Aa][Pp][Ii].*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0255a820-e564-4e40-af2b-6ac61160335c
      name: "A New Trust Was Created To A Domain"
      reason: "next kill-chain tactic: Persistence"
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
      name: "Account Tampering - Suspicious Failed Logon Reasons"
      reason: "next kill-chain tactic: Persistence"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
      name: "Active Directory User Backdoors"
      reason: "next kill-chain tactic: Persistence"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4673")'
      pivot_on: [user]
      window: 6h
    - name: "Kerberos ticket requests for this account"
      query: '(data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4771")'
      pivot_on: [user]
      window: 6h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
