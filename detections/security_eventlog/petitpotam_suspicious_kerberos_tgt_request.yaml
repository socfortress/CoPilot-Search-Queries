name: PetitPotam Suspicious Kerberos TGT Request
id: 6a53d871-682d-40b6-83e0-b7c1a6c4e3a5
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Mauricio Velazco, Michael Haag
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6a53d871-682d-40b6-83e0-b7c1a6c4e3a5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect suspicious Kerberos TGT requests. Once an attacer obtains a computer
  certificate by abusing Active Directory Certificate Services in combination
  with PetitPotam, the next step would be to leverage the certificate for
  malicious purposes. One way of doing this is to request a Kerberos Ticket
  Granting Ticket using a tool like Rubeus. This request will generate a 4768
  event with some unusual fields depending on the environment. This analytic
  will require tuning, we recommend filtering Account_Name to the Domain
  Controller computer accounts. MITRE ATT&CK: T1187.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4768"
        - wildcard:
            data_win_eventdata_targetUserName: "*$"
        - wildcard:
            data_win_eventdata_certThumbprint: "*"
        - exists:
            field: "data_win_eventdata_ipAddress"
        - exists:
            field: "data_win_eventdata_certThumbprint"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_ipAddress: "::1"
                    - term:
                        data_win_eventdata_certThumbprint: ""
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetUserName
    - data_win_eventdata_certThumbprint
    - data_win_eventdata_ipAddress
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4768'; data_win_eventdata_targetUserName
  matches '*$'; data_win_eventdata_certThumbprint matches '*', among other
  conditions.

known_false_positives: >
  False positives are possible if the environment is using certificates for
  authentication. We recommend filtering Account_Name to the Domain Controller
  computer accounts. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://github.com/topotam/PetitPotam
  - https://isc.sans.edu/forums/diary/Active+Directory+Certificate+Services+ADCS+PKI+domain+admin+vulnerability/27668/
  - https://github.com/splunk/security_content/blob/88d689fe8a055d8284337b9fad5d9152b42043db/detections/endpoint/petitpotam_suspicious_kerberos_tgt_request.yml
  - https://attack.mitre.org/techniques/T1187/

response:
  message: >
    PetitPotam Suspicious Kerberos TGT Request detected on host $agent_name$.
    Matched data_win_eventdata_targetUserName:
    $data_win_eventdata_targetUserName$. Matched
    data_win_eventdata_certThumbprint: $data_win_eventdata_certThumbprint$.
    MITRE ATT&CK: T1187
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: user
    - field: data_win_eventdata_certThumbprint
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1187
  custom_tags:
    - petitpotam
    - kerberos
    - request
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4768" AND data_win_eventdata_targetUserName:/.*\$/ AND data_win_eventdata_certThumbprint:/.*/ AND _exists_:data_win_eventdata_ipAddress AND _exists_:data_win_eventdata_certThumbprint AND NOT (data_win_eventdata_ipAddress:"::1" OR data_win_eventdata_certThumbprint:"")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
    name: Possible PetitPotam Coerce Authentication Attempt
    reason: 'Direct precursor: the EFSRPC/MS-EFSR coercion that forces a DC to authenticate to the attacker relay, which is relayed to AD CS to obtain the machine certificate later used in this PKINIT TGT request.'
  - id: cd8c163e-a19b-402e-bdd5-419ff5859f12
    name: HackTool - ADCSPwn Execution
    reason: 'Precursor: ADCSPwn relays machine authentication to AD CS web enrollment to mint the certificate whose thumbprint appears in this 4768.'
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: 'Same-step tooling view: Rubeus asktgt /certificate on the command line is the usual way the certificate TGT request is made.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Likely next step: a DC machine-account TGT/certificate is used to perform DCSync to dump krbtgt and domain hashes.'
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: 'Co-occurring ticket abuse: after obtaining a TGT with a stolen credential/certificate, attackers chain alternate-credential Kerberos logons from the same host.'
  - id: f598ea0c-c25a-4f72-a219-50c44411c791
    name: Possible Shadow Credentials Added
    reason: 'Alternative certificate-based auth path: msDS-KeyCredentialLink abuse also yields PKINIT 4768 events with a cert thumbprint, confirming certificate-authentication abuse.'
  - id: 993c2665-e6ef-40e3-a62a-e1a97686af79
    name: Certificate Use With No Strong Mapping
    reason: 'Same certificate-authentication abuse seen from the KDC side: certificate-mapped logons without strong mapping are what allow forged/relayed machine certificates to authenticate.'
  - id: bfbd3291-de87-4b7c-88a2-d6a5deb28668
    name: ADCS Certificate Template Configuration Vulnerability with Risky EKU
    reason: 'Certificate-abuse context: risky AD CS templates are the other route to obtaining certificates usable for PKINIT TGT requests.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rubeus / PKINIT certificate TGT request tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Tt].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee]:.*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Kk][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Ii][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Nn][Tt][Hh][Aa][Ss][Hh].*/)
    pivot_on:
    - host
    window: 2h
  - name: EFSRPC / PetitPotam coercion share access
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_relativeTargetName:/.*([Ee][Ff][Ss][Rr][Pp][Cc]|[Ll][Ss][Aa][Rr][Pp][Cc]|[Ll][Ss][Aa][Ss][Ss]|[Ss][Aa][Mm][Rr]|[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]).*/ OR data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$.*/)
    pivot_on:
    - host
    window: 1h
  - name: Certificate issuance on the CA (4886/4887) and cert-related files
    query: (data_win_system_eventID:"4886" OR data_win_system_eventID:"4887" OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Cc][Aa][Cc][Hh][Ee]/)))
    pivot_on:
    - host
    window: 4h
  - name: Machine-account network logons and DC replication rights (DCSync follow-on)
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_targetUserName:/.*\$/) OR (data_win_system_eventID:"4662" AND (data_win_eventdata_properties:/.*1131[Ff]6[Aa][Aa]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/ OR data_win_eventdata_properties:/.*1131[Ff]6[Aa][Dd]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/))
    pivot_on:
    - user
    window: 6h
  - name: Kerberos service ticket requests and logons using the account
    query: (data_win_system_eventID:"4769" OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4624")
    pivot_on:
    - user
    window: 2h
