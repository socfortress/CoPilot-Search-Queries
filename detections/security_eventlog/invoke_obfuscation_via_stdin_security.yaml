name: Invoke-Obfuscation Via Stdin - Security
id: 80b708f3-d034-40e4-a6c8-d23b7a7db3d1
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 80b708f3-d034-40e4-a6c8-d23b7a7db3d1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via Stdin in Scripts. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName: "*&&*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*environment*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*invoke*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*${input)*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*set*'; data_win_eventdata_serviceFileName matches '*&&*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Stdin - Security detected on host $agent_name$.
    Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - stdin
    - windows_security
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*[Ss][Ee][Tt].*/ AND data_win_eventdata_serviceFileName:/.*\&\&.*/ AND (data_win_eventdata_serviceFileName:/.*[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt].*/ OR data_win_eventdata_serviceFileName:/.*[Ii][Nn][Vv][Oo][Kk][Ee].*/ OR data_win_eventdata_serviceFileName:/.*\$\{[Ii][Nn][Pp][Uu][Tt]\).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0c718a5e-4284-4fb9-b4d9-b9a50b3a1974
    name: Invoke-Obfuscation STDIN+ Launcher - Security
    reason: Sibling 4697 detection for the Invoke-Obfuscation STDIN launcher variant; the same installed service command line often trips both, confirming obfuscated PowerShell delivered through a service.
  - id: dcf2db1f-f091-425b-a821-c05875b8925a
    name: Invoke-Obfuscation VAR+ Launcher - Security
    reason: Another Invoke-Obfuscation launcher style via 4697; operators rotate launcher variants, so a second variant on the same host shows a tooling-driven service payload.
  - id: 4edf51e1-cb83-4e1a-bc39-800e396068e3
    name: Invoke-Obfuscation CLIP+ Launcher - Security
    reason: Clipboard-based Invoke-Obfuscation launcher installed as a service; same obfuscation toolkit and same service-installation delivery path.
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Obfuscated cmd/PowerShell in a service binary path is the classic Cobalt Strike psexec/getsystem pattern; a hit here points to the C2 framework behind the obfuscation.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Remote service creation via SMB psexec is a common way the obfuscated command lands; indicates lateral movement to this host.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Service creation over the SVCCTL pipe from another machine is the network side of the same 4697 event, identifying remote origin.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Flags the service being installed from an unusual logon or client, separating admin tooling from attacker lateral movement behind this 4697.
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: Getsystem privilege escalation also installs a cmd-based service to reach SYSTEM; a follow-on or alternate explanation for the same service event.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service started by services.exe spawning cmd/PowerShell with stdin or set&& pattern
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell script blocks with IEX, input stream or encoded payload
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*[Ii][Ee][Xx]* OR data_win_eventdata_scriptBlockText:*[Ii]nvoke-[Ee]xpression* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*$input* OR data_win_eventdata_scriptBlockText:*DownloadString*)
    pivot_on:
    - host
    window: 1h
  - name: Other service installs on this host (System 7045 and Security 4697)
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_imagePath:*cmd* OR data_win_eventdata_imagePath:*powershell* OR data_win_eventdata_serviceFileName:*cmd* OR data_win_eventdata_serviceFileName:*powershell* OR data_win_eventdata_serviceFileName:*ADMIN$* OR data_win_eventdata_imagePath:*\\*)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network connections from PowerShell or cmd on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Network logons (type 3) by the installing account
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - user
    window: 6h
