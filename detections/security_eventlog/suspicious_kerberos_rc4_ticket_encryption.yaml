name: Suspicious Kerberos RC4 Ticket Encryption
id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
version: 1
schema_version: "1.0"
date: "2022-06-19"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service ticket requests using RC4 encryption type. MITRE ATT&CK:
  T1558.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4769"
        - term:
            data_win_eventdata_ticketOptions:
              value: "0x40810000"
              case_insensitive: true
        - term:
            data_win_eventdata_ticketEncryptionType:
              value: "0x17"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_serviceName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_serviceName: "*$"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_ticketOptions
    - data_win_eventdata_ticketEncryptionType
    - data_win_eventdata_serviceName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4769'; data_win_eventdata_ticketOptions equals
  '0x40810000'; data_win_eventdata_ticketEncryptionType equals '0x17', among
  other conditions.

known_false_positives: >
  Service accounts used on legacy systems (e.g. NetApp). Windows Domains with
  DFL 2003 and legacy systems. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://adsecurity.org/?p=3458
  - https://www.trimarcsecurity.com/single-post/TrimarcResearch/Detecting-Kerberoasting-Activity
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    Suspicious Kerberos RC4 Ticket Encryption detected on host $agent_name$.
    Matched data_win_eventdata_ticketOptions:
    $data_win_eventdata_ticketOptions$. Matched
    data_win_eventdata_ticketEncryptionType:
    $data_win_eventdata_ticketEncryptionType$. MITRE ATT&CK: T1558.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_ticketOptions
      type: other
    - field: data_win_eventdata_ticketEncryptionType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - kerberos
    - ticket
    - encryption
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4769" AND data_win_eventdata_ticketOptions:/0[Xx]40810000/ AND data_win_eventdata_ticketEncryptionType:/0[Xx]17/ AND _exists_:data_win_eventdata_serviceName AND NOT (data_win_eventdata_serviceName:/.*\$/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
