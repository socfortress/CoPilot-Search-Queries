name: Suspicious Kerberos RC4 Ticket Encryption
id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
version: 1
schema_version: "1.0"
date: "2022-06-19"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service ticket requests using RC4 encryption type. MITRE ATT&CK:
  T1558.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4769"
        - term:
            data_win_eventdata_ticketOptions:
              value: "0x40810000"
              case_insensitive: true
        - term:
            data_win_eventdata_ticketEncryptionType:
              value: "0x17"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_serviceName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_serviceName: "*$"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_ticketOptions
    - data_win_eventdata_ticketEncryptionType
    - data_win_eventdata_serviceName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4769'; data_win_eventdata_ticketOptions equals
  '0x40810000'; data_win_eventdata_ticketEncryptionType equals '0x17', among
  other conditions.

known_false_positives: >
  Service accounts used on legacy systems (e.g. NetApp). Windows Domains with
  DFL 2003 and legacy systems. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://adsecurity.org/?p=3458
  - https://www.trimarcsecurity.com/single-post/TrimarcResearch/Detecting-Kerberoasting-Activity
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    Suspicious Kerberos RC4 Ticket Encryption detected on host $agent_name$.
    Matched data_win_eventdata_ticketOptions:
    $data_win_eventdata_ticketOptions$. Matched
    data_win_eventdata_ticketEncryptionType:
    $data_win_eventdata_ticketEncryptionType$. MITRE ATT&CK: T1558.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_ticketOptions
      type: other
    - field: data_win_eventdata_ticketEncryptionType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - kerberos
    - ticket
    - encryption
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4769" AND data_win_eventdata_ticketOptions:/0[Xx]40810000/ AND data_win_eventdata_ticketEncryptionType:/0[Xx]17/ AND _exists_:data_win_eventdata_serviceName AND NOT (data_win_eventdata_serviceName:/.*\$/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: Same 4769 RC4 (0x17) TGS pattern with a success-status filter; both firing for one account means a burst of SPN tickets was harvested for offline cracking.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: 'Precursor: attackers list SPNs with setspn -Q before requesting the RC4 service tickets to pick Kerberoast targets.'
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: 'Precursor: PowerView Get-DomainUser -SPN discovers service accounts whose tickets are then requested with RC4.'
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: 'Tooling that produces the RC4 4769 events: Get-DomainSPNTicket / Invoke-Kerberoast run in PowerShell on the requesting host.'
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Rubeus-style kerberoast command line on the host that generated the RC4 service ticket request.
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: Script block evidence of in-memory Kerberoasting that explains the 4769 RC4 requests.
  - id: f6de9536-0441-4b3f-a646-f4e00f300ffd
    name: Weak Encryption Enabled and Kerberoast
    reason: 'Precursor: an account''s UAC changed to allow DES/RC4-only encryption, forcing weak tickets that are cheaper to crack.'
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD mapping commonly precedes Kerberoasting to find high-value SPN accounts, and runs from the same foothold host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberoasting tool execution on requesting host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ss][Pp][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Script block Kerberoast / SPN ticket request
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*KerberosRequestorSecurityToken* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*Get-DomainSPNTicket* OR data_win_eventdata_scriptBlockText:*servicePrincipalName*)
    pivot_on:
    - host
    window: 2h
  - name: LDAP/SPN reconnaissance and credential dumping on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)
    pivot_on:
    - host
    window: 4h
  - name: Kerberos DC outbound connections from non-system process
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88" AND NOT (data_win_eventdata_image:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Cracked-credential reuse: logons and explicit-credential use by account'
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")) OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 24h
