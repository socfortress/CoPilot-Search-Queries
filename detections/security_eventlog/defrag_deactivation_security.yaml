name: Defrag Deactivation - Security
id: c5a178bf-9cfb-4340-b584-e4df39b6a3e7
version: 1
schema_version: "1.0"
date: "2022-11-27"
author: Florian Roth (Nextron Systems), Bartlomiej Czyz (@bczyz1)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c5a178bf-9cfb-4340-b584-e4df39b6a3e7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the deactivation and disabling of the Scheduled defragmentation task
  as seen by Slingshot APT group. MITRE ATT&CK: T1053.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4701"
        - term:
            data_win_eventdata_taskName:
              value: "\\Microsoft\\Windows\\Defrag\\ScheduledDefrag"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4701'; data_win_eventdata_taskName equals
  '\Microsoft\Windows\Defrag\ScheduledDefrag'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/apt-slingshot/84312/
  - https://attack.mitre.org/techniques/T1053/

response:
  message: >
    Defrag Deactivation - Security detected on host $agent_name$. Matched
    data_win_eventdata_taskName: $data_win_eventdata_taskName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1053
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_taskName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053
  custom_tags:
    - defrag
    - deactivation
    - security
    - windows_security
    - privilege_escalation
    - execution
    - persistence
    - s0111
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4701" AND data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Ee][Ff][Rr][Aa][Gg]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Dd][Ee][Ff][Rr][Aa][Gg]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 958d81aa-8566-4cea-a565-59ccd4df27b0
    name: Defrag Deactivation
    reason: Same ScheduledDefrag disable seen from the command line (schtasks /change /disable); confirms which process and command line issued the 4701 event.
  - id: 7595ba94-cf3b-4471-aa03-4f6baa9e5fad
    name: Important Scheduled Task Deleted/Disabled
    reason: Generic Security 4699/4701 on important tasks (Defender, Windows Update, backup); Slingshot-style tampering usually disables several maintenance tasks together.
  - id: 9ac94dc8-9042-493c-ba45-3b5e7c86b980
    name: Disable Important Scheduled Task
    reason: Process-level view of the same task-disabling behavior, catching other disabled system tasks via schtasks.exe.
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: Slingshot-style actors disable legit tasks and then register their own malicious task for persistence/execution.
  - id: 614cf376-6651-47c4-9dcc-6b9527f749f4
    name: Suspicious Scheduled Task Update
    reason: Modification of existing tasks (hijacking a legit task) is the persistence follow-on to tampering with scheduled tasks.
  - id: f6de6525-4509-495a-8a82-1f8b0ed73a00
    name: Remote Task Creation via ATSVC Named Pipe
    reason: If the task change was made remotely, the ATSVC pipe shows lateral movement via task scheduler from another host.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: 'Defense-evasion follow-on: after tampering with system tasks an operator commonly clears the Security log to hide the 4701 trail.'
  - id: ab4561b1-6c7e-48a7-ad08-087cfb9ce8f1
    name: Important Windows Event Auditing Disabled
    reason: 'Co-occurring defense evasion: disabling audit policy alongside task disabling indicates deliberate blinding of the host.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: schtasks/at.exe disabling or deleting tasks on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\/[Cc][Hh][Aa][Nn][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)) OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/)
    pivot_on:
    - host
    window: 1h
  - name: Scheduled task created, deleted or updated in Security log
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4699" OR data_win_system_eventID:"4700" OR data_win_system_eventID:"4702")
    pivot_on:
    - host
    window: 4h
  - name: Process lineage of task-tampering parent (shell/script hosts, LOLBins)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\(([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])|([Cc][Mm][Dd])|([Ww][Ss][Cc][Rr][Ii][Pp][Tt])|([Cc][Ss][Cc][Rr][Ii][Pp][Tt])|([Mm][Ss][Hh][Tt][Aa])|([Rr][Uu][Nn][Dd][Ll][Ll]32)|([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]))\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Event log clearing or audit policy tampering
    query: ((data_win_system_eventID:"1102") OR (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\ |\/)[Cc][Ll].*/) OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)))
    pivot_on:
    - host
    window: 2h
  - name: New service or executable dropped for persistence after task tampering
    query: (data_win_system_eventID:"4697" OR data_win_system_eventID:"7045" OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Ss][Yy][Ss])/)))
    pivot_on:
    - host
    window: 4h
