name: Password Protected ZIP File Opened (Email Attachment)
id: 571498c8-908e-40b4-910b-d2369159a3da
version: 1
schema_version: "1.0"
date: "2022-05-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 571498c8-908e-40b4-910b-d2369159a3da
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the extraction of password protected ZIP archives. See the filename
  variable for more details on which file has been opened. MITRE ATT&CK: T1027,
  T1566.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5379"
        - wildcard:
            data_win_eventdata_targetName:
              value: "*Microsoft_Windows_Shell_ZipFolder:filename*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetName:
              value: "*\\\\Temporary Internet Files\\\\Content.Outlook*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5379'; data_win_eventdata_targetName matches
  '*Microsoft_Windows_Shell_ZipFolder:filename*'; data_win_eventdata_targetName
  matches '*\Temporary Internet Files\Content.Outlook*'.

known_false_positives: >
  Legitimate used of encrypted ZIP files. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/sbousseaden/status/1523383197513379841
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1566/001/

response:
  message: >
    Password Protected ZIP File Opened (Email Attachment) detected on host
    $agent_name$. Matched data_win_eventdata_targetName:
    $data_win_eventdata_targetName$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1027, T1566.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1566.001
  custom_tags:
    - password
    - protected
    - opened
    - windows_security
    - initial_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5379" AND data_win_eventdata_targetName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]_[Ss][Hh][Ee][Ll][Ll]_[Zz][Ii][Pp][Ff][Oo][Ll][Dd][Ee][Rr]:[Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee].*/ AND data_win_eventdata_targetName:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: 'Same phishing delivery family: the password-protected archive from email commonly wraps an ISO/IMG whose contents then execute, bypassing mark-of-the-web.'
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: 'Follow-on: the extracted lure document opened from the zip often uses Office to pull a second-stage payload.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Password-protected zips typically deliver JS/VBS/HTA droppers that run via wscript/cscript/mshta once extracted.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The extracted script dropper spawning cmd/powershell/rundll32 is the next execution step after the archive is opened.
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: Attachment payloads are often script files with disguised extensions (.txt/.dat/.jse) run by wscript/cscript from the extraction path.
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: Emotet-style campaigns deliver password-protected zips containing LNK loaders that launch the malware; a direct follow-on.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: A shortcut extracted from the zip may fetch its payload over WebDAV, a common post-extraction step.
  - id: 146aace8-9bd6-42ba-be7a-0070d8027b76
    name: Potentially Suspicious Child Process Of WinRAR.EXE
    reason: 'Alternate extraction path: if the archive is opened in WinRAR instead of Explorer, its child processes show the payload launching.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executable/script/shortcut/disk-image extracted from a zip in the temp path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp][0-9]*_.*\.[Zz][Ii][Pp]\\.*\.([Ee][Xx][Ee]|[Jj][Ss][Ee]?|[Vv][Bb][Ss]|[Vv][Bb][Ee]|[Ww][Ss][Ff]|[Hh][Tt][Aa]|[Ll][Nn][Kk]|[Ii][Ss][Oo]|[Ii][Mm][Gg]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Dd][Oo][Cc][Mm]|[Xx][Ll][Ss][Mm])/
    pivot_on:
    - host
    window: 1h
  - name: Process launched from the extracted zip folder or Outlook attachment cache
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Tt][Ee][Mm][Pp][0-9]*_.*\.[Zz][Ii][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp][0-9]*_.*\.[Zz][Ii][Pp]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Script host or LOLBin spawned by Explorer/Outlook running attachment content
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|\\[Ww][Ii][Nn][Rr][Aa][Rr]|\\7[Zz])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Mm][Ss][Hh][Tt][Aa]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Rr][Ee][Gg][Ss][Vv][Rr]32|\\[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network or DNS from script hosts and LOLBins after attachment opened
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*(\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Mm][Ss][Hh][Tt][Aa]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Rr][Ee][Gg][Ss][Vv][Rr]32|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Tt][Ee][Mm][Pp][0-9]*_.*\.[Zz][Ii][Pp]\\.*)\.?[Ee]?[Xx]?[Ee]?.*/
    pivot_on:
    - host
    window: 2h
