name: Active Directory Replication from Non Machine Account
id: 17d619c1-e020-4347-957e-1d1207455c93
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 17d619c1-e020-4347-957e-1d1207455c93
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential abuse of Active Directory Replication Service (ADRS) from a
  non machine account to request credentials. MITRE ATT&CK: T1003.006.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4662"
        - term:
            data_win_eventdata_accessMask:
              value: "0x100"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_properties:
                    value: "*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_properties:
                    value: "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_properties:
                    value: "*89e95b76-444d-4c62-991a-0facbeda640c*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_subjectUserName: "*$"
                    - wildcard:
                        data_win_eventdata_subjectUserName:
                          value: "MSOL_*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_accessMask
    - data_win_eventdata_properties
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4662'; data_win_eventdata_accessMask equals
  '0x100'; data_win_eventdata_properties matches
  '*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/180815-ADObjectAccessReplication/notebook.html
  - https://threathunterplaybook.com/library/windows/active_directory_replication.html
  - https://threathunterplaybook.com/hunts/windows/190101-ADModDirectoryReplication/notebook.html
  - https://attack.mitre.org/techniques/T1003/006/

response:
  message: >
    Active Directory Replication from Non Machine Account detected on host
    $agent_name$. Matched data_win_eventdata_accessMask:
    $data_win_eventdata_accessMask$. Matched data_win_eventdata_properties:
    $data_win_eventdata_properties$. MITRE ATT&CK: T1003.006
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_accessMask
      type: other
    - field: data_win_eventdata_properties
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.006
  custom_tags:
    - active
    - directory
    - replication
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4662" AND data_win_eventdata_accessMask:/0[Xx]100/ AND (data_win_eventdata_properties:/.*1131[Ff]6[Aa][Aa]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/ OR data_win_eventdata_properties:/.*1131[Ff]6[Aa][Dd]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/ OR data_win_eventdata_properties:/.*89[Ee]95[Bb]76-444[Dd]-4[Cc]62-991[Aa]-0[Ff][Aa][Cc][Bb][Ee][Dd][Aa]640[Cc].*/) AND _exists_:data_win_eventdata_subjectUserName AND NOT (data_win_eventdata_subjectUserName:/.*\$/ OR data_win_eventdata_subjectUserName:/[Mm][Ss][Oo][Ll]_.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: Same DCSync technique seen through the DS-Replication-Get-Changes-All access; co-occurring corroboration that the 4662 replication came from a DCSync tool
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: 'Precursor: attacker grants a non-machine account the replication extended rights, which makes the later 4662 replication request possible'
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: 'Precursor: enumeration of Domain Admins/privileged groups to pick the account to impersonate or abuse before replicating credentials'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Process-level evidence of the tool (lsadump::dcsync) that issues the DRSUAPI replication request seen in 4662
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: 'Alternate path to the same goal: after or instead of DCSync the attacker exports ntds.dit on the DC to obtain all domain hashes'
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: 'Follow-on or fallback credential theft on the DC: NTDS.dit copied out by a non-standard process'
  - id: 10fb649c-3600-4d37-b1e6-56ea90bb7e09
    name: User Added To Highly Privileged Group
    reason: 'Related persistence: the account that can replicate is often a freshly privileged user added to Domain Admins or similar groups'
  - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
    name: Addition of SID History to Active Directory Object
    reason: Likely follow-on persistence/escalation once domain hashes are obtained, forging privileged identity in AD
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Replication-right grants on AD objects (DCSync permission added)
    query: data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:"nTSecurityDescriptor"
    pivot_on:
    - host
    window: 24h
  - name: DCSync / credential-dump tooling and NTDS extraction commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons by the replicating account (remote DCSync source and lateral use)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - user
    window: 6h
  - name: krbtgt reset or privileged group / account changes after replication
    query: (data_win_system_eventID:"4724" AND data_win_eventdata_targetUserName:/[Kk][Rr][Bb][Tt][Gg][Tt]/) OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4738"
    pivot_on:
    - host
    window: 24h
  - name: Kerberos ticket requests by the account (golden/silver ticket use of stolen hashes)
    query: data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 6h
