name: Successful Overpass the Hash Attempt
id: 192a0330-c20b-4356-90b6-7b7049ae0b87
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Roberto Rodriguez (source), Dominik Schaudel (rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 192a0330-c20b-4356-90b6-7b7049ae0b87
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects successful logon with logon type 9 (NewCredentials) which matches the
  Overpass the Hash behavior of e.g Mimikatz's sekurlsa::pth module. MITRE
  ATT&CK: T1550.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4624"
        - term:
            data_win_eventdata_logonType: "9"
        - term:
            data_win_eventdata_logonProcessName:
              value: "seclogo"
              case_insensitive: true
        - term:
            data_win_eventdata_authenticationPackageName:
              value: "Negotiate"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_logonProcessName
    - data_win_eventdata_authenticationPackageName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_logonType equals
  '9'; data_win_eventdata_logonProcessName equals 'seclogo', among other
  conditions.

known_false_positives: >
  Runas command-line tool using /netonly parameter. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://web.archive.org/web/20220419045003/https://cyberwardog.blogspot.com/2017/04/chronicles-of-threat-hunter-hunting-for.html
  - https://attack.mitre.org/techniques/T1550/002/

response:
  message: >
    Successful Overpass the Hash Attempt detected on host $agent_name$. Matched
    data_win_eventdata_logonType: $data_win_eventdata_logonType$. Matched
    data_win_eventdata_logonProcessName: $data_win_eventdata_logonProcessName$.
    MITRE ATT&CK: T1550.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_logonProcessName
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1550.002
  custom_tags:
    - successful
    - overpass
    - windows_security
    - lateral_movement
    - s0002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/[Ss][Ee][Cc][Ll][Oo][Gg][Oo]/ AND data_win_eventdata_authenticationPackageName:/[Nn][Ee][Gg][Oo][Tt][Ii][Aa][Tt][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Logon type 9 via seclogo is the signature of sekurlsa::pth; the Mimikatz process creation is the direct cause of this logon.
  - id: windows-mimikatz-binary-execution-001
    name: Windows Mimikatz Binary Execution
    reason: Binary-level evidence of the tool that injected the spoofed NTLM credentials, confirming the pth was malicious rather than runas /netonly.
  - id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
    name: LSASS Access From Non System Account
    reason: The NTLM hash used for pth must first be stolen from LSASS memory, a precursor on the same host.
  - id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
    name: Password Dumper Activity on LSASS
    reason: Credential dumping that yields the NT hash supplied to the overpass-the-hash logon.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Sibling NTLM hash-reuse technique; a NewCredentials logon often precedes or accompanies network pass-the-hash logons using the same stolen hash.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: Event 4648 explicit-credential use is the same-session companion that shows the forged credentials being used toward remote systems.
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Overpass-the-hash with an NT hash requests Kerberos TGTs using RC4, so downgraded encryption follows the logon.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Typical next step: the impersonated identity creates remote services (PsExec-style) on other hosts for lateral movement.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mimikatz sekurlsa::pth / runas netonly process launch
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Tt][Hh].*[Nn][Tt][Ll][Mm].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Aa][Ss].*[Nn][Ee][Tt][Oo][Nn][Ll][Yy].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS process access preceding credential reuse
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Explicit-credential logons and sensitive-privilege assignment
    query: data_win_system_eventID:"4648" OR (data_win_system_eventID:"4672" AND data_win_eventdata_privilegeList:*SeDebugPrivilege*)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Kerberos TGT/TGS requests with RC4 encryption
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769") AND data_win_eventdata_ticketEncryptionType:"0x17"
    pivot_on:
    - user
    window: 2h
  - name: 'Lateral movement: NTLM network logons, service installs and admin share access'
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm]/) OR data_win_system_eventID:"7045" OR (data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Aa][Dd][Mm][Ii][Nn]\$|.*[Cc]\$|.*[Ii][Pp][Cc]\$/)
    pivot_on:
    - user
    - ip
    window: 4h
