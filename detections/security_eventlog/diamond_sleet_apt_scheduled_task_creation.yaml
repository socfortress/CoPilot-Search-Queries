name: Diamond Sleet APT Scheduled Task Creation
id: 3b8e5084-4de9-449a-a40d-0e11014f2e2d
version: 1
schema_version: "1.0"
date: "2023-10-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3b8e5084-4de9-449a-a40d-0e11014f2e2d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry event related to the creation of a scheduled task used by
  Diamond Sleet APT during exploitation of Team City CVE-2023-42793
  vulnerability. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4698"
        - term:
            data_win_eventdata_taskName:
              value: "\\Windows TeamCity Settings User Interface"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_taskContent:
              value: "*uTYNkfKxHiZrx3KJ*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskName
    - data_win_eventdata_taskContent
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4698'; data_win_eventdata_taskName equals
  '\Windows TeamCity Settings User Interface'; data_win_eventdata_taskContent
  matches '*uTYNkfKxHiZrx3KJ*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/10/18/multiple-north-korean-threat-actors-exploiting-the-teamcity-cve-2023-42793-vulnerability/
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Diamond Sleet APT Scheduled Task Creation detected on host $agent_name$.
    Matched data_win_eventdata_taskName: $data_win_eventdata_taskName$. Matched
    data_win_eventdata_taskContent: $data_win_eventdata_taskContent$. MITRE
    ATT&CK: T1053.005
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_taskName
      type: other
    - field: data_win_eventdata_taskContent
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - diamond
    - sleet
    - scheduled
    - windows_security
    - execution
    - privilege_escalation
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4698" AND data_win_eventdata_taskName:/\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Tt][Ee][Aa][Mm][Cc][Ii][Tt][Yy] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss] [Uu][Ss][Ee][Rr] [Ii][Nn][Tt][Ee][Rr][Ff][Aa][Cc][Ee]/ AND data_win_eventdata_taskContent:/.*[Uu][Tt][Yy][Nn][Kk][Ff][Kk][Xx][Hh][Ii][Zz][Rr][Xx]3[Kk][Jj].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f9f92ba-5300-43a4-b435-87d1ee571688
    name: Diamond Sleet APT Scheduled Task Creation - Registry
    reason: Same TeamCity-exploitation task seen as TaskCache registry writes; confirms the 4698 event with independent telemetry.
  - id: b5495d8d-24ad-4a44-8caf-ceae9a07a5c2
    name: Diamond Sleet APT Process Activity Indicators
    reason: 'Same Diamond Sleet campaign: the task runs a payload carrying the same marker string, producing process-creation indicators.'
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: Generic 4698 task-creation detection that co-fires when the malicious task points at suspicious binaries or paths.
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Task XML dropped under System32\Tasks is the file-level footprint of the same task registration.
  - id: 424273ea-7cf8-43a6-b712-375f925e481f
    name: Scheduled Task Executed From A Suspicious Location
    reason: 'Follow-on: the persisted task actually executes its payload from an unusual path.'
  - id: 24c4d154-05a4-4b99-b57d-9b977472443a
    name: Lazarus Group Activity
    reason: Diamond Sleet is a Lazarus-cluster actor; its post-exploitation commands follow the task persistence.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Diamond Sleet's next step after TeamCity foothold is credential theft via LSASS dumping.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Task payload marker in process command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Uu][Tt][Yy][Nn][Kk][Ff][Kk][Xx][Hh][Ii][Zz][Rr][Xx]3[Kk][Jj].*/
    pivot_on:
    - host
    window: 4h
  - name: TeamCity-spawned shells and child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Tt][Ee][Aa][Mm][Cc][Ii][Tt][Yy]|[Jj][Aa][Vv][Aa]).*/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|\\[Cc][Uu][Rr][Ll]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Task creation and modification events on this host
    query: data_win_system_eventID:"4698" OR data_win_system_eventID:"4702" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: LSASS access or dump tooling on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network connections from script/LOLBin processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Cc][Mm][Dd]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Mm][Ss][Hh][Tt][Aa]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
