name: Potential AD User Enumeration From Non-Machine Account
id: ab6bffca-beff-4baa-af11-6733f296d57a
version: 1
schema_version: "1.0"
date: "2022-11-08"
author: Maxime Thiebaut (@0xThiebaut)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ab6bffca-beff-4baa-af11-6733f296d57a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects read access to a domain user from a non-machine account. MITRE ATT&CK:
  T1087.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4662"
        - wildcard:
            data_win_eventdata_objectType:
              value: "*bf967aba-0de6-11d0-a285-00aa003049e2*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_accessMask: "*1?"
              - wildcard:
                  data_win_eventdata_accessMask: "*3?"
              - wildcard:
                  data_win_eventdata_accessMask: "*4?"
              - wildcard:
                  data_win_eventdata_accessMask: "*7?"
              - wildcard:
                  data_win_eventdata_accessMask: "*9?"
              - wildcard:
                  data_win_eventdata_accessMask:
                    value: "*B?"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessMask:
                    value: "*D?"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessMask:
                    value: "*F?"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_subjectUserName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_subjectUserName: "*$"
                    - wildcard:
                        data_win_eventdata_subjectUserName:
                          value: "MSOL_*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_accessMask
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4662'; data_win_eventdata_objectType matches
  '*bf967aba-0de6-11d0-a285-00aa003049e2*'; data_win_eventdata_accessMask
  matches '*1?', among other conditions.

known_false_positives: >
  Administrators configuring new users. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.specterops.io/assets/resources/an_ace_up_the_sleeve.pdf
  - http://www.stuffithoughtiknew.com/2019/02/detecting-bloodhound.html
  - https://learn.microsoft.com/en-us/windows/win32/adschema/attributes-all
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4662
  - https://attack.mitre.org/techniques/T1087/002/

response:
  message: >
    Potential AD User Enumeration From Non-Machine Account detected on host
    $agent_name$. Matched data_win_eventdata_objectType:
    $data_win_eventdata_objectType$. Matched data_win_eventdata_accessMask:
    $data_win_eventdata_accessMask$. MITRE ATT&CK: T1087.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_accessMask
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - enumeration
    - machine
    - account
    - windows_security
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4662" AND data_win_eventdata_objectType:/.*[Bb][Ff]967[Aa][Bb][Aa]-0[Dd][Ee]6-11[Dd]0-[Aa]285-00[Aa][Aa]003049[Ee]2.*/ AND (data_win_eventdata_accessMask:/.*1./ OR data_win_eventdata_accessMask:/.*3./ OR data_win_eventdata_accessMask:/.*4./ OR data_win_eventdata_accessMask:/.*7./ OR data_win_eventdata_accessMask:/.*9./ OR data_win_eventdata_accessMask:/.*[Bb]./ OR data_win_eventdata_accessMask:/.*[Dd]./ OR data_win_eventdata_accessMask:/.*[Ff]./) AND _exists_:data_win_eventdata_subjectUserName AND NOT (data_win_eventdata_subjectUserName:/.*\$/ OR data_win_eventdata_subjectUserName:/[Mm][Ss][Oo][Ll]_.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: The 4662 burst of user-object reads (bf967aba) is the directory-side footprint of SharpHound's LDAP collection; this is the process-side proof of the same tool on the host.
  - id: 02773bed-83bf-469f-b7ff-e676e7d78bab
    name: BloodHound Collection Files
    reason: After the LDAP sweep SharpHound writes its zip/JSON collection files to disk; confirms the enumeration completed and data is staged for exfiltration.
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: ADRecon enumerates every user object over LDAP and would generate the same mass 4662 reads; a script-block hit names the tool behind the access.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: AdFind is a common non-BloodHound LDAP enumerator that reads user objects with the same access masks; command line shows which attributes were targeted.
  - id: 39405650-c364-4e1e-a740-32a63ef042a6
    name: Windows PowerView AD Access Control List Enumeration
    reason: Attackers who enumerate users typically follow up with PowerView ACL queries to find abusable rights over those users (GenericAll/WriteDacl paths).
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: 'Next recon step: after listing all users, the actor narrows to privileged groups/accounts (Domain Admins) to choose targets.'
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: User-object enumeration is commonly used to find accounts with servicePrincipalName set, the direct setup for Kerberoasting.
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: 'Likely follow-on: SPN accounts identified through user enumeration are then targeted with TGS requests (4769) to crack offline.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AD enumeration tooling process launches (SharpHound, AdFind, ADRecon, dsquery)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Ll][Dd][Ii][Ff][Dd][Ee]|[Cc][Ss][Vv][Dd][Ee]).*/ OR data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Ee][Tt][Hh][Oo][Dd]|[Ss][Ee][Aa][Rr][Cc][Hh][Ff][Ii][Ll][Tt][Ee][Rr]|objectcategory=person|samAccountType=805306368).*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell AD/LDAP enumeration script blocks (PowerView, AD module, DirectorySearcher)
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Gg]et-[Nn]et[Uu]ser|[Gg]et-[Dd]omain[Uu]ser|[Gg]et-[Aa][Dd][Uu]ser|[Dd]irectory[Ss]earcher|[Ss]ystem\.[Dd]irectory[Ss]ervices|[Ll][Dd][Aa][Pp]:\/\/|[Ii]nvoke-[Bb]lood[Hh]ound|[Aa][Dd][Rr]econ|[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess).*/
    pivot_on:
    - host
    window: 1h
  - name: Staged BloodHound/AD collection output files
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([0-9]{14}_BloodHound\.zip|_(users|computers|groups|domains|gpos|ous|containers)\.json|[Aa][Dd][Rr]econ|[Bb]lood[Hh]ound).*/
    pivot_on:
    - host
    window: 2h
  - name: Account's logons after the enumeration (network/RDP/explicit credentials)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4625"
    pivot_on:
    - user
    window: 6h
  - name: Kerberos service-ticket and SPN follow-up (Kerberoasting) by this account
    query: (data_win_system_eventID:"4769" AND data_win_eventdata_ticketEncryptionType:"0x17") OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4776"
    pivot_on:
    - user
    window: 6h
