name: Protected Storage Service Access
id: 45545954-4016-43c6-855e-eae8f1c369dc
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 45545954-4016-43c6-855e-eae8f1c369dc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects access to a protected_storage service over the network. Potential
  abuse of DPAPI to extract domain backup keys from Domain Controllers. MITRE
  ATT&CK: T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - wildcard:
            data_win_eventdata_shareName:
              value: "*IPC*"
              case_insensitive: true
        - term:
            data_win_eventdata_relativeTargetName:
              value: "protected_storage"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName matches
  '*IPC*'; data_win_eventdata_relativeTargetName equals 'protected_storage'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190620-DomainDPAPIBackupKeyExtraction/notebook.html
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Protected Storage Service Access detected on host $agent_name$. Matched
    data_win_eventdata_shareName: $data_win_eventdata_shareName$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - protected
    - storage
    - service
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc].*/ AND data_win_eventdata_relativeTargetName:/[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd]_[Ss][Tt][Oo][Rr][Aa][Gg][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4ac1f50b-3bd0-4968-902d-868b4647937e
    name: DPAPI Domain Backup Key Extraction
    reason: 'Same DPAPI domain backup key theft: the protected_storage IPC pipe access is the SMB-side signal, the MS-BKRP/LSA retrieval call is the actual key extraction on the DC.'
  - id: 39a94fd1-8c9a-4ff6-bf22-c058762f8014
    name: DPAPI Domain Master Key Backup Attempt
    reason: Backup-key request (event 4692) on the DC co-occurs with the protected_storage pipe access when mimikatz lsadump::backupkeys or SharpDPAPI runs.
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: SharpDPAPI is the common tool that retrieves the domain backup key over this pipe from the attacker's host.
  - id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
    name: DPAPI Backup Keys And Certificate Export Activity IOC
    reason: 'Follow-on: the extracted backup key is written to disk as .pvk/.pfx files on the attacker host.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Sibling DC-credential theft (DCSync); attackers with DA rights often run it alongside backup key extraction.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz lsadump::backupkeys is the classic implementation of this behaviour on the source host.
  - id: b61e87c0-50db-4b2e-8986-6a2be94b33b0
    name: Directory Service Restore Mode(DSRM) Registry Value Tampering
    reason: Domain-controller persistence step commonly following DC credential compromise.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Other IPC$ named-pipe remote activity from the same source, indicating remote execution on the DC with the same privileged session.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DPAPI backup key tooling and key export files
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.pvk OR data_win_eventdata_targetFilename:*.pfx OR data_win_eventdata_targetFilename:*ntds_capi*))
    pivot_on:
    - host
    window: 2h
  - name: Domain DPAPI backup key retrieval events on DC
    query: data_win_system_eventID:"4692" OR data_win_system_eventID:"4693" OR (data_win_system_eventID:"4662" AND data_win_eventdata_objectType:*secret*)
    pivot_on:
    - host
    window: 2h
  - name: Other IPC share named pipe access (remote exec pipes)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc].*/ AND (data_win_eventdata_relativeTargetName:/[Ss][Vv][Cc][Cc][Tt][Ll]/ OR data_win_eventdata_relativeTargetName:/[Ss][Rr][Vv][Ss][Vv][Cc]/ OR data_win_eventdata_relativeTargetName:/[Ll][Ss][Aa][Rr][Pp][Cc]/ OR data_win_eventdata_relativeTargetName:/[Dd][Rr][Ss][Uu][Aa][Pp][Ii]/ OR data_win_eventdata_relativeTargetName:/[Ww][Kk][Ss][Ss][Vv][Cc]/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons by this account (source of the SMB session)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - user
    window: 4h
  - name: Directory replication / DCSync rights use
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*89e95b76-444d-4c62-991a-0facbeda640c*)
    pivot_on:
    - host
    window: 4h
