name: ISO Image Mounted
id: 0248a7bc-8a9a-4cd8-a57e-3ae8e073a073
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Syed Hasan (@syedhasan009)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0248a7bc-8a9a-4cd8-a57e-3ae8e073a073
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the mount of an ISO image on an endpoint. MITRE ATT&CK: T1566.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4663"
        - term:
            data_win_eventdata_objectServer:
              value: "Security"
              case_insensitive: true
        - term:
            data_win_eventdata_objectType:
              value: "File"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "\\\\Device\\\\CdRom*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_objectName"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_objectName:
                          value: "\\Device\\CdRom0\\autorun.ico"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_objectName:
                          value: "\\Device\\CdRom0\\setup.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_objectName:
                          value: "\\Device\\CdRom0\\setup64.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectServer
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4663'; data_win_eventdata_objectServer equals
  'Security'; data_win_eventdata_objectType equals 'File', among other
  conditions.

known_false_positives: >
  Software installation ISO files. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.trendmicro.com/vinfo/hk-en/security/news/cybercrime-and-digital-threats/malicious-spam-campaign-uses-iso-image-files-to-deliver-lokibot-and-nanocore
  - https://www.proofpoint.com/us/blog/threat-insight/threat-actor-profile-ta2719-uses-colorful-lures-deliver-rats-local-languages
  - https://twitter.com/MsftSecIntel/status/1257324139515269121
  - https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1553.005/T1553.005.md#atomic-test-1---mount-iso-image
  - https://attack.mitre.org/techniques/T1566/001/

response:
  message: >
    ISO Image Mounted detected on host $agent_name$. Matched
    data_win_eventdata_objectServer: $data_win_eventdata_objectServer$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. MITRE
    ATT&CK: T1566.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectServer
      type: other
    - field: data_win_eventdata_objectType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.001
  custom_tags:
    - image
    - mounted
    - windows_security
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4663" AND data_win_eventdata_objectServer:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]/ AND data_win_eventdata_objectType:/[Ff][Ii][Ll][Ee]/ AND data_win_eventdata_objectName:/\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Cc][Dd][Rr][Oo][Mm].*/ AND _exists_:data_win_eventdata_objectName AND NOT (data_win_eventdata_objectName:/\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Cc][Dd][Rr][Oo][Mm]0\\[Aa][Uu][Tt][Oo][Rr][Uu][Nn]\.[Ii][Cc][Oo]/ OR data_win_eventdata_objectName:/\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Cc][Dd][Rr][Oo][Mm]0\\[Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_objectName:/\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Cc][Dd][Rr][Oo][Mm]0\\[Ss][Ee][Tt][Uu][Pp]64\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
    name: ISO File Created Within Temp Folders
    reason: 'Precursor: the ISO is typically dropped/downloaded to a temp or download folder by the browser or mail client just before the user double-clicks and mounts it.'
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: 'Precursor: a ZIP/archive containing an ISO is a common phishing delivery wrapper; the mount is the user opening the extracted image.'
  - id: 4358e5a5-7542-4dcb-b9f3-87667371839b
    name: ISO or Image Mount Indicator in Recent Files
    reason: 'Co-occurring: Windows writes a Recent-items LNK for the mounted image/drive, a second host-side confirmation of the same mount.'
  - id: 3215aa19-f060-4332-86d5-5602511f3ca8
    name: Suspicious LNK Double Extension File Created
    reason: 'Follow-on: ISO lures usually contain a document-named .lnk (e.g. invoice.pdf.lnk) which the victim clicks inside the mounted volume.'
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: 'Follow-on: a shortcut on the mounted image launches cmd/powershell/wscript loader, the classic ISO-to-LNK-to-loader chain.'
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Follow-on: ISO payloads often include JS/VBS launched by wscript/cscript that spawns a secondary payload.'
  - id: 1723e720-616d-4ddc-ab02-f7e3685a4713
    name: Rundll32 Spawned Via Explorer.EXE
    reason: 'Follow-on: a user-clicked LNK/DLL on the mounted drive executes via explorer-launched rundll32 (IcedID, Qakbot, Bumblebee style).'
  - id: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde
    name: Windows Shell/Scripting Processes Spawning Suspicious Programs
    reason: 'Follow-on: shell or script interpreter launched from the mounted image spawns suspicious programs, confirming payload execution.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution from the mounted ISO volume (non-system drive)
    query: data_win_system_eventID:"1" AND data_win_eventdata_currentDirectory:/[D-Zd-z]:\\.*/ AND (data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND NOT data_win_eventdata_currentDirectory:/[Cc]:\\.*/
    pivot_on:
    - host
    window: 1h
  - name: LNK launching script interpreters or LOLBins (ISO lure chain)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\.[Ll][Nn][Kk].*/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: ISO/IMG/VHD files created or downloaded on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ii][Ss][Oo]/ OR data_win_eventdata_targetFilename:/.*\.[Ii][Mm][Gg]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Hh][Dd][Xx]?/ OR data_win_eventdata_targetFilename:/.*\.[Ii][Ss][Oo]:[Zz]one.*/)
    pivot_on:
    - host
    window: 4h
  - name: Network and DNS activity from processes started after the mount
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
