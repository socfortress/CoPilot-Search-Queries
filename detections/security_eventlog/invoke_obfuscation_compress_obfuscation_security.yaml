name: Invoke-Obfuscation COMPRESS OBFUSCATION - Security
id: 7a922f1b-2635-4d6c-91ef-af228b198ad3
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7a922f1b-2635-4d6c-91ef-af228b198ad3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via COMPRESS OBFUSCATION. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*new-object*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*text.encoding]::ascii*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*readtoend*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*system.io.compression.deflatestream*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*system.io.streamreader*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*new-object*'; data_win_eventdata_serviceFileName matches
  '*text.encoding]::ascii*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation COMPRESS OBFUSCATION - Security detected on host
    $agent_name$. Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - compress
    - windows_security
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_serviceFileName:/.*[Tt][Ee][Xx][Tt]\.[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]\]::[Aa][Ss][Cc][Ii][Ii].*/ AND data_win_eventdata_serviceFileName:/.*[Rr][Ee][Aa][Dd][Tt][Oo][Ee][Nn][Dd].*/ AND (data_win_eventdata_serviceFileName:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]\.[Dd][Ee][Ff][Ll][Aa][Tt][Ee][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_serviceFileName:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Ss][Tt][Rr][Ee][Aa][Mm][Rr][Ee][Aa][Dd][Ee][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2a926e6a-4b81-4011-8a96-e36cc8c04302
    name: PowerShell Scripts Installed as Services - Security
    reason: 'Same 4697 service-install channel: a PowerShell payload being registered as a service is the exact delivery mechanism this obfuscated ServiceFileName rides on.'
  - id: fd0f5778-d3cb-4c9a-9695-66759d04702a
    name: Invoke-Obfuscation Obfuscated IEX Invocation - Security
    reason: Sibling Invoke-Obfuscation variant via 4697; operators often try several launcher styles or chain layers (IEX wrapper around the deflate stream) in one service install.
  - id: 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7
    name: Invoke-Obfuscation COMPRESS OBFUSCATION
    reason: 'Same DeflateStream/StreamReader payload seen at process creation: the service start executes the command line and confirms the compressed script actually ran.'
  - id: windows-malicious-powershell-executed-as-a-service-001
    name: Powershell Executed As A Service
    reason: Registry-level evidence of the PowerShell-based service created by 4697, confirming persistence/execution through the service control manager.
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Cobalt Strike PsExec/jump-psexec service installs use encoded/compressed PowerShell in the service binary path, the same artifact this rule matches.
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: Getsystem named-pipe service installs are a privilege escalation step commonly performed alongside or right after an obfuscated payload service.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Remote service creation over SMB is the lateral movement vector that delivers compressed PowerShell payloads as a service on the target host.
  - id: 98767d61-b2e8-4d71-b661-e36783ee24c1
    name: Gzip Archive Decode Via PowerShell
    reason: Decompression of a gzip/deflate payload in PowerShell is the runtime behaviour of the compressed script embedded in the service path.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell spawned by service control manager
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Deflate/gzip decompression in script block logs
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Ee][Ff][Ll][Aa][Tt][Ee][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Zz][Ii][Pp][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections from PowerShell after service install
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Other service installations on this host
    query: data_win_system_eventID:"4697"
    pivot_on:
    - host
    window: 6h
  - name: Network logons by the installing account (remote service creation)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 4h
