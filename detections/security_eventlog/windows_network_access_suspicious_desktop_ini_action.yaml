name: Windows Network Access Suspicious desktop.ini Action
id: 35bc7e28-ee6b-492f-ab04-da58fcf6402e
version: 1
schema_version: "1.0"
date: "2022-01-16"
author: Tim Shelton (HAWK.IO)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 35bc7e28-ee6b-492f-ab04-da58fcf6402e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects unusual processes accessing desktop.ini remotely over network share,
  which can be leveraged to alter how Explorer displays a folder's content (i.e.
  renaming files) without changing them on disk. MITRE ATT&CK: T1547.009.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_objectType:
              value: "File"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_relativeTargetName:
              value: "*\\\\desktop.ini"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*WriteData*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*DELETE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*WriteDAC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*AppendData*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*AddSubdirectory*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_accessList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_objectType equals
  'File'; data_win_eventdata_relativeTargetName matches '*\desktop.ini', among
  other conditions.

known_false_positives: >
  Read only access list authority. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://isc.sans.edu/forums/diary/Desktopini+as+a+postexploitation+tool/25912/
  - https://attack.mitre.org/techniques/T1547/009/

response:
  message: >
    Windows Network Access Suspicious desktop.ini Action detected on host
    $agent_name$. Matched data_win_eventdata_objectType:
    $data_win_eventdata_objectType$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1547.009
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.009
  custom_tags:
    - network
    - desktop
    - action
    - windows_security
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_objectType:/[Ff][Ii][Ll][Ee]/ AND data_win_eventdata_relativeTargetName:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\.[Ii][Nn][Ii]/ AND (data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_accessList:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Cc].*/ OR data_win_eventdata_accessList:/.*[Aa][Pp][Pp][Ee][Nn][Dd][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_accessList:/.*[Aa][Dd][Dd][Ss][Uu][Bb][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*/)

