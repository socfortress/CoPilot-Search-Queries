name: Windows Network Access Suspicious desktop.ini Action
id: 35bc7e28-ee6b-492f-ab04-da58fcf6402e
version: 1
schema_version: "1.0"
date: "2022-01-16"
author: Tim Shelton (HAWK.IO)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 35bc7e28-ee6b-492f-ab04-da58fcf6402e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects unusual processes accessing desktop.ini remotely over network share,
  which can be leveraged to alter how Explorer displays a folder's content (i.e.
  renaming files) without changing them on disk. MITRE ATT&CK: T1547.009.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_objectType:
              value: "File"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_relativeTargetName:
              value: "*\\\\desktop.ini"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*WriteData*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*DELETE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*WriteDAC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*AppendData*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_accessList:
                    value: "*AddSubdirectory*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_accessList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_objectType equals
  'File'; data_win_eventdata_relativeTargetName matches '*\desktop.ini', among
  other conditions.

known_false_positives: >
  Read only access list authority. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://isc.sans.edu/forums/diary/Desktopini+as+a+postexploitation+tool/25912/
  - https://attack.mitre.org/techniques/T1547/009/

response:
  message: >
    Windows Network Access Suspicious desktop.ini Action detected on host
    $agent_name$. Matched data_win_eventdata_objectType:
    $data_win_eventdata_objectType$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1547.009
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.009
  custom_tags:
    - network
    - desktop
    - action
    - windows_security
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_objectType:/[Ff][Ii][Ll][Ee]/ AND data_win_eventdata_relativeTargetName:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\.[Ii][Nn][Ii]/ AND (data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_accessList:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Cc].*/ OR data_win_eventdata_accessList:/.*[Aa][Pp][Pp][Ee][Nn][Dd][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_accessList:/.*[Aa][Dd][Dd][Ss][Uu][Bb][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 81315b50-6b60-4d8f-9928-3466e1022515
    name: Desktop.INI Created by Uncommon Process
    reason: 'Host-side view of the same desktop.ini tampering: the process that locally drops desktop.ini is the writer behind the remote SMB write seen on the share server.'
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: Same 5145 share-access telemetry; the actor writing desktop.ini over SMB often also plants files on admin shares for staging or lateral movement.
  - id: 910ab938-668b-401b-b08c-b596e80fdca5
    name: Transferring Files with Credential Data via Network Shares
    reason: Remote desktop.ini writes are used to reach a user's NTLM hash via UNC icon paths; credential-bearing file transfers over shares show the harvest/exfil leg.
  - id: 72124974-a68b-4366-b990-d30e0b2a190d
    name: Metasploit SMB Authentication
    reason: 'Precursor: the writer must authenticate to the share first; tool-driven SMB auth from the same source IP indicates an offensive framework behind the write.'
  - id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
    name: Writing Local Admin Share
    reason: 'Co-occurring: an attacker with share write access also drops payloads into admin shares on the same host.'
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: 'Same operator behaviour: copying files to/from admin shares or SYSVOL to stage tooling or poison logon-time content.'
  - id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
    name: Possible PetitPotam Coerce Authentication Attempt
    reason: 'Follow-on/related goal: desktop.ini with a UNC IconResource forces victims to authenticate to the attacker, the same NTLM-capture objective as coercion attacks.'
  - id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
    name: NetNTLM Downgrade Attack
    reason: 'Follow-on: once victims authenticate to an attacker-controlled path, NTLM downgrade is used to make captured hashes crackable.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other lure files written to shares (desktop.ini, .scf, .lnk, .url, .library-ms)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_relativeTargetName:/.*\.([Ss][Cc][Ff]|[Ll][Nn][Kk]|[Uu][Rr][Ll]|[Ll][Ii][Bb][Rr][Aa][Rr][Yy]-[Mm][Ss]|[Ii][Nn][Ii])/ AND (data_win_eventdata_accessList:*WriteData* OR data_win_eventdata_accessList:*AppendData*)
    pivot_on:
    - host
    window: 4h
  - name: Admin share (C$/ADMIN$/IPC$) access from the same source
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:*C$ OR data_win_eventdata_shareName:*ADMIN$ OR data_win_eventdata_shareName:*IPC$)
    pivot_on:
    - host
    - ip
    window: 2h
  - name: NTLM network logons by this account/source
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:NTLM
    pivot_on:
    - user
    - ip
    window: 6h
  - name: Outbound SMB connections from user-space processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445" AND NOT data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]/
    pivot_on:
    - host
    window: 2h
  - name: Remote execution after share write (services/wmiprvse spawning shells)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
