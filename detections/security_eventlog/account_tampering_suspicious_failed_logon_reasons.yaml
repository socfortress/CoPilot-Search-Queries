name: Account Tampering - Suspicious Failed Logon Reasons
id: 9eb99343-d336-4020-a3cd-67f3819e68ee
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9eb99343-d336-4020-a3cd-67f3819e68ee
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This method uses uncommon error codes on failed logons to determine suspicious
  activity and tampering with accounts that have been disabled or somehow
  restricted. MITRE ATT&CK: T1078.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4625"
              - term:
                  data_win_system_eventID: "4776"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_status:
                    value: "0xC0000072"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xC000006F"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xC0000070"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xC0000413"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xC000018C"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xC000015B"
                    case_insensitive: true
              - term:
                  data_win_eventdata_subStatus:
                    value: "0xC0000072"
                    case_insensitive: true
              - term:
                  data_win_eventdata_subStatus:
                    value: "0xC000006F"
                    case_insensitive: true
              - term:
                  data_win_eventdata_subStatus:
                    value: "0xC0000070"
                    case_insensitive: true
              - term:
                  data_win_eventdata_subStatus:
                    value: "0xC0000413"
                    case_insensitive: true
              - term:
                  data_win_eventdata_subStatus:
                    value: "0xC000018C"
                    case_insensitive: true
              - term:
                  data_win_eventdata_subStatus:
                    value: "0xC000015B"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_subjectUserSid"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_subjectUserSid:
                    value: "S-1-0-0"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_status
    - data_win_eventdata_subStatus
    - data_win_eventdata_subjectUserSid
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4625'; data_win_system_eventID equals '4776';
  data_win_eventdata_status equals '0xC0000072', among other conditions.

known_false_positives: >
  User using a disabled account. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
  - https://twitter.com/SBousseaden/status/1101431884540710913
  - https://attack.mitre.org/techniques/T1078/

response:
  message: >
    Account Tampering - Suspicious Failed Logon Reasons detected on host
    $agent_name$. Matched data_win_eventdata_status:
    $data_win_eventdata_status$. Matched data_win_eventdata_subStatus:
    $data_win_eventdata_subStatus$. MITRE ATT&CK: T1078
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_status
      type: other
    - field: data_win_eventdata_subStatus
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078
  custom_tags:
    - account
    - tampering
    - failed
    - windows_security
    - persistence
    - privilege_escalation
    - initial_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4625" OR data_win_system_eventID:"4776") AND (data_win_eventdata_status:/0[Xx][Cc]0000072/ OR data_win_eventdata_status:/0[Xx][Cc]000006[Ff]/ OR data_win_eventdata_status:/0[Xx][Cc]0000070/ OR data_win_eventdata_status:/0[Xx][Cc]0000413/ OR data_win_eventdata_status:/0[Xx][Cc]000018[Cc]/ OR data_win_eventdata_status:/0[Xx][Cc]000015[Bb]/ OR data_win_eventdata_subStatus:/0[Xx][Cc]0000072/ OR data_win_eventdata_subStatus:/0[Xx][Cc]000006[Ff]/ OR data_win_eventdata_subStatus:/0[Xx][Cc]0000070/ OR data_win_eventdata_subStatus:/0[Xx][Cc]0000413/ OR data_win_eventdata_subStatus:/0[Xx][Cc]000018[Cc]/ OR data_win_eventdata_subStatus:/0[Xx][Cc]000015[Bb]/) AND _exists_:data_win_eventdata_subjectUserSid AND NOT (data_win_eventdata_subjectUserSid:/[Ss]-1-0-0/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: Attacker probing a disabled/restricted account with stolen credentials typically moves on to explicit-credential (4648) logons to other hosts once a working credential is found
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Failures from a stolen hash against restricted accounts are often followed by successful NTLM network logons using the same hash on other accounts or hosts
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: Stolen-credential reuse that fails against a restricted account may succeed as a Kerberos overpass-the-hash logon with another account
  - id: 3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb
    name: Windows Create Local Account
    reason: Locked-out/disabled account attempts by an intruder are commonly followed by creating a fresh local account to regain a foothold
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: After account tampering attempts, privilege grants to a local admin group confirm the access is being entrenched
  - id: ab6bffca-beff-4baa-af11-6733f296d57a
    name: Potential AD User Enumeration From Non-Machine Account
    reason: Knowing which accounts are disabled or restricted implies prior user enumeration or later enumeration to find usable accounts
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: Failed password-based logons on restricted accounts often pivot to Kerberos ticket-based credential theft against other accounts
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Once logon probing succeeds, intruders may clear the Security log to hide the failed-logon trail this detection relies on
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Successful logons by this account after the failures
    query: data_win_system_eventID:"4624" AND NOT data_win_eventdata_logonType:"5"
    pivot_on:
    - user
    window: 6h
  - name: Explicit-credential logons and special privileges assigned
    query: (data_win_system_eventID:"4648" OR data_win_system_eventID:"4672")
    pivot_on:
    - user
    window: 6h
  - name: Account re-enable, unlock, password reset or group membership change
    query: (data_win_system_eventID:"4722" OR data_win_system_eventID:"4767" OR data_win_system_eventID:"4723" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4738" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4720")
    pivot_on:
    - user
    window: 6h
  - name: Other failed logons and NTLM validation failures on this host
    query: (data_win_system_eventID:"4625" OR data_win_system_eventID:"4776" OR data_win_system_eventID:"4771")
    pivot_on:
    - host
    window: 2h
  - name: Remote interactive and network logons or RDP denials on this host
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"3")) OR data_win_system_eventID:"4825"
    pivot_on:
    - host
    window: 2h
