name: DCERPC SMB Spoolss Named Pipe
id: 214e8f95-100a-4e04-bb31-ef6cba8ce07e
version: 1
schema_version: "1.0"
date: "2022-08-11"
author: OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 214e8f95-100a-4e04-bb31-ef6cba8ce07e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the spoolss named pipe over SMB. This can be used to
  trigger the authentication via NTLM of any machine that has the spoolservice
  enabled. MITRE ATT&CK: T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_shareName:
              value: "\\\\*\\IPC$"
              case_insensitive: true
        - term:
            data_win_eventdata_relativeTargetName:
              value: "spoolss"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName equals
  '\\*\IPC$'; data_win_eventdata_relativeTargetName equals 'spoolss'.

known_false_positives: >
  Domain Controllers acting as printer servers too? :). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://posts.specterops.io/hunting-in-active-directory-unconstrained-delegation-forests-trusts-71f2b33688e1
  - https://dirkjanm.io/a-different-way-of-abusing-zerologon/
  - https://twitter.com/_dirkjan/status/1309214379003588608
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    DCERPC SMB Spoolss Named Pipe detected on host $agent_name$. Matched
    data_win_eventdata_shareName: $data_win_eventdata_shareName$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1021.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - dcerpc
    - spoolss
    - named
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/[Ss][Pp][Oo][Oo][Ll][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
    name: Possible PetitPotam Coerce Authentication Attempt
    reason: Sibling authentication-coercion primitive (EFSRPC vs spoolss pipe); same attacker goal of forcing the host to NTLM-authenticate to attacker infrastructure, often tried back to back
  - id: 8fe1c584-ee61-444b-be21-e9054b229694
    name: CVE-2021-1675 Print Spooler Exploitation IPC Access
    reason: Same IPC$ spoolss access can be PrintNightmare RCE rather than coercion; distinguishes remote driver-install exploitation from authentication relay
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: 'Direct co-occurrence: the coerced spooler authentication produces NTLM auth events on the spooler service shortly after the pipe access'
  - id: 6a53d871-682d-40b6-83e0-b7c1a6c4e3a5
    name: PetitPotam Suspicious Kerberos TGT Request
    reason: 'Follow-on: a coerced DC machine account authenticating to a relay target is then used to request a TGT for the machine account'
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: Coerced NTLM authentication is captured and relayed by tools like Responder/ntlmrelayx on the attacker host
  - id: 52d8b0c6-53d6-439a-9e41-52ad442ad9ad
    name: First Time Seen Remote Named Pipe
    reason: Remote spoolss pipe access from a source that never used it before is the baseline-deviation signal confirming the coercion is new in the environment
  - id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
    name: NetNTLM Downgrade Attack
    reason: Attackers weaken NTLM settings to make coerced authentication crackable or relayable, a precursor/companion of NTLM coercion chains
  - id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
    name: Suspicious Spool Service Child Process
    reason: If the spoolss access was exploitation (PrintNightmare style) rather than coercion, spoolsv.exe spawns the attacker payload as SYSTEM
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other RPC coercion/recon named pipes over IPC$ on this host
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/(efsrpc|lsarpc|lsass|netdfs|samr|netlogon|srvsvc|svcctl|atsvc|FssagentRpc|eventlog)/
    pivot_on:
    - host
    window: 1h
  - name: Inbound NTLM network logons to this host
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm]/
    pivot_on:
    - host
    window: 1h
  - name: Machine-account Kerberos TGT/service ticket requests (relay or delegation abuse)
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769") AND data_win_eventdata_targetUserName:*\$
    pivot_on:
    - host
    window: 2h
  - name: Directory replication (DCSync) rights used after coercion
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa* OR data_win_eventdata_properties:*1131f6ad* OR data_win_eventdata_properties:*89e95b76*)
    pivot_on:
    - host
    window: 4h
  - name: Print spooler spawning processes or dropping driver DLLs
    query: (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
