name: Windows User Account Created
id: Windows_User_Account_Created
version: 1
schema_version: "1.0"
date: "2026-03-16"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects new local user account creation events via Windows Security EventID 4720.
  Attackers create local accounts to maintain persistence, enable lateral movement,
  or establish backdoor access. Excludes known legitimate temporary accounts created
  by Lenovo, Windows setup (defaultuser), TempAdmin patterns, and WsiAccount.
  Requires User Account Management auditing enabled:
  auditpol /set /subcategory:"User Account Management" /success:enable
  MITRE ATT&CK: T1136.001 (Create Account: Local Account).

data_source:
  - Windows Security EventID 4720 (User Account Created)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4720"
        - term:
            data_win_system_providerName: "Microsoft-Windows-Security-Auditing"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetUserName: "lenovo_tmp_????????"
              - wildcard:
                  data_win_eventdata_targetUserName: "defaultuser?"
              - wildcard:
                  data_win_eventdata_targetUserName: "TempAdmin-????????"
              - term:
                  data_win_eventdata_targetUserName: "WsiAccount"
            minimum_should_match: 1
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetUserName
    - data_win_eventdata_targetDomainName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectDomainName
    - data_win_eventdata_targetSid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-16 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-16 23:59:59.999"

how_to_implement: >
  This detection requires Windows Security Auditing enabled for User Account
  Management. Enable with:
  auditpol /set /subcategory:"User Account Management" /success:enable /failure:enable
  Confirmed working in this environment after enabling auditing. Security channel
  is configured in Wazuh agent ossec.conf and EventID 4720 is not excluded.
  VALIDATED — TestAttacker and Tettacker creation confirmed via EventID 4720.
  Exclusion pattern for lenovo_tmp_* verified working in Graylog.

known_false_positives: >
  Legitimate software installations or system tools may create local accounts.
  Known patterns (Lenovo temp accounts, Windows setup defaultuser, TempAdmin,
  WsiAccount) are excluded. Add additional patterns for environment-specific
  known benign account names.

references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4720

response:
  message: >
    New local user account created on $agent_name$ by $data_win_eventdata_subjectUserName$.
    New account: $data_win_eventdata_targetUserName$.
    Domain: $data_win_eventdata_targetDomainName$.
    MITRE ATT&CK: T1136.001
  risk_score: 60
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_subjectUserName
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_targetUserName
      type: user

tags:
  analytic_story:
    - Windows Persistence Techniques
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - account_creation
    - local_account
    - persistence
    - backdoor
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4720" AND NOT (data_win_eventdata_targetUserName:/lenovo_tmp_......../ OR data_win_eventdata_targetUserName:/defaultuser./ OR data_win_eventdata_targetUserName:/TempAdmin-......../ OR data_win_eventdata_targetUserName:"WsiAccount")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: 'Process-creation view of the same action: net user /add is the most common way the 4720 account gets created, giving the creating parent process and command line.'
  - id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
    name: New User Created Via Net.EXE With Never Expire Option
    reason: 'Backdoor-account variant: attacker creates the account and sets it to never expire so it survives for persistence.'
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: Malware-driven local account creation (DarkGate) that would produce this 4720 event as a side effect of post-exploitation.
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: net user <name> <password> /add supplies the new account's password inline; co-occurs with creation of the backdoor account.
  - id: 9ec9fb1b-e059-4489-9642-f270c207923d
    name: Hiding User Account Via SpecialAccounts Registry Key - CommandLine
    reason: 'Follow-on concealment: attackers hide the freshly created account from the logon screen via the SpecialAccounts registry key.'
  - id: 5b768e71-86f2-4879-b448-81061cbae951
    name: Suspicious Manipulation Of Default Accounts Via Net.EXE
    reason: Sibling account-manipulation activity (enabling Guest/Administrator) used alongside new accounts to gain persistent access.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: 'Typical precursor: the attacker enumerates local users and groups before adding an account and placing it in Administrators.'
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: 'Common next step: open the firewall for RDP so the new account can be used for remote logon.'
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Follow-on enabling of Remote Desktop so the backdoor account is usable remotely.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: net.exe / PowerShell account creation and group-add commands
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[\\][Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Uu][Ss][Ee][Rr]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*(\/[Aa][Dd][Dd]).*/) OR data_win_eventdata_commandLine:/.*([Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr]|[Aa][Dd][Dd]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Account added to privileged local group or enabled/reset
    query: (data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4738")
    pivot_on:
    - host
    window: 2h
  - name: Remote Desktop enablement or RDP firewall/registry changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Dd][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Dd][Pp]-[Tt][Cc][Pp].*/ OR data_win_eventdata_commandLine:/.*[Rr]emote [Dd]esktop.*/ OR data_win_eventdata_commandLine:/.*[Tt]erminal [Ss]erver.*/)
    pivot_on:
    - host
    window: 4h
  - name: Registry hiding of account or SAM/Users key tampering
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:*SpecialAccounts* OR data_win_eventdata_targetObject:*Winlogon*UserList*)
    pivot_on:
    - host
    window: 4h
  - name: Logon activity by the newly created account
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 24h
