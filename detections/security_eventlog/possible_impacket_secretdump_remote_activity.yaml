name: Possible Impacket SecretDump Remote Activity
id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
version: 1
schema_version: "1.0"
date: "2022-08-11"
author: Samir Bousseaden, wagga
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect AD credential dumping using impacket secretdump HKTL. MITRE ATT&CK:
  T1003.002, T1003.004, T1003.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_shareName:
              value: "\\\\*\\ADMIN$"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_relativeTargetName:
              value: "*SYSTEM32\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_relativeTargetName:
              value: "*.tmp*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName equals
  '\\*\ADMIN$'; data_win_eventdata_relativeTargetName matches '*SYSTEM32\*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20230329153811/https://blog.menasec.net/2019/02/threat-huting-10-impacketsecretdump.html
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Possible Impacket SecretDump Remote Activity detected on host $agent_name$.
    Matched data_win_eventdata_shareName: $data_win_eventdata_shareName$.
    Matched data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1003.002, T1003.004,
    T1003.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
    - T1003.004
    - T1003.003
  custom_tags:
    - impacket
    - secretdump
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Aa][Dd][Mm][Ii][Nn]\$/ AND data_win_eventdata_relativeTargetName:/.*[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ AND data_win_eventdata_relativeTargetName:/.*\.[Tt][Mm][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: 'Same tool, host-side artifact: secretsdump drops the exported SAM/SYSTEM/SECURITY hives as random .tmp files in System32, which this Sysmon file-create rule sees while the 5145 share access is the network side of the same write/read.'
  - id: f8748f2c-89dc-4d95-afb0-5a2dfdbad332
    name: SAM Registry Hive Handle Request
    reason: Secretsdump saves the SAM/SECURITY hives through remote registry (RegSaveKey) before copying them via ADMIN$; a SAM handle request is the registry step that immediately precedes the ADMIN$ .tmp access.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Secretsdump starts the RemoteRegistry service (and may create a temp service) over the svcctl pipe on IPC$ right before dumping, so SVCCTL activity from the same source is a direct precursor.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Same Impacket toolkit and same ADMIN$ SMB write channel; an attacker with admin on the host often follows hive dumping with psexec/smbexec service installs for execution.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: On a domain controller, secretsdump falls back to or is paired with DRSUAPI DCSync (-just-dc) to pull all domain hashes; this is the same objective by the replication route.
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: Alternate NTDS credential-extraction path used against the same DC by the same actor once hive/NTDS dumping is confirmed.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Secretsdump is typically run with an NT hash rather than a password, and harvested hashes are then replayed over NTLM network logons; this catches both the precondition and the follow-on use of the dumped credentials.
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: Impacket psexec uses the same ADMIN$/IPC$ SMB pattern and is the most common next step for remote execution with the credentials just obtained.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote registry / service-control pipes opened over IPC$ (secretsdump setup)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/.*([Ww][Ii][Nn][Rr][Ee][Gg]|[Ss][Vv][Cc][Cc][Tt][Ll]|[Dd][Rr][Ss][Uu][Aa][Pp][Ii]|[Ss][Aa][Mm][Rr]).*/
    pivot_on:
    - host
    window: 2h
  - name: Hive-dump artifacts written to disk (SAM/SYSTEM/SECURITY, random .tmp in System32)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*\.[Tt][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\\([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Yy][Ss][Tt][Ee][Mm])\.([Ss][Aa][Vv][Ee]|[Hh][Ii][Vv][Ee]|[Bb][Aa][Kk])/)
    pivot_on:
    - host
    window: 2h
  - name: Remote service installs on this host (smbexec/psexec follow-on)
    query: (data_win_system_eventID:"4697" OR data_win_system_eventID:"7045")
    pivot_on:
    - host
    window: 2h
  - name: Network NTLM logons by this account (hash reuse / lateral spread)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on:
    - user
    window: 6h
  - name: Directory replication rights exercised (DCSync alongside hive dump)
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa* OR data_win_eventdata_properties:*1131f6ad* OR data_win_eventdata_properties:*89e95b76*)
    pivot_on:
    - host
    window: 4h
