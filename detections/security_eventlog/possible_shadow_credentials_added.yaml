name: Possible Shadow Credentials Added
id: f598ea0c-c25a-4f72-a219-50c44411c791
version: 1
schema_version: "1.0"
date: "2022-10-17"
author: Nasreddine Bencherchali (Nextron Systems), Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f598ea0c-c25a-4f72-a219-50c44411c791
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects possible addition of shadow credentials to an active directory object.
  MITRE ATT&CK: T1556.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5136"
        - term:
            data_win_eventdata_attributeLDAPDisplayName:
              value: "msDS-KeyCredentialLink"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136';
  data_win_eventdata_attributeLDAPDisplayName equals 'msDS-KeyCredentialLink'.

known_false_positives: >
  Modifications in the msDS-KeyCredentialLink attribute can be done legitimately
  by the Azure AD Connect synchronization account or the ADFS service account.
  These accounts can be added as Exceptions. (From elastic FP section). Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/8.4/potential-shadow-credentials-added-to-ad-object.html
  - https://cyberstoph.org/posts/2022/03/detecting-shadow-credentials/
  - https://twitter.com/SBousseaden/status/1581300963650187264?
  - https://attack.mitre.org/techniques/T1556/

response:
  message: >
    Possible Shadow Credentials Added detected on host $agent_name$. Matched
    data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1556
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1556
  custom_tags:
    - shadow
    - credentials
    - added
    - windows_security
    - persistence
    - credential_access
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Mm][Ss][Dd][Ss]-[Kk][Ee][Yy][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ll][Ii][Nn][Kk]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 028c7842-4243-41cd-be6f-12f3cf1a26c7
    name: AD Object WriteDAC Access
    reason: Writing msDS-KeyCredentialLink needs write rights on the target object; attackers often first grant themselves WriteDACL/GenericWrite on it, so a WriteDAC event just before is the precursor.
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: ACL abuse on AD objects with PowerView is the common way the write permission needed for the shadow-credential attribute edit is obtained, and it often leads on to DCSync.
  - id: 993c2665-e6ef-40e3-a62a-e1a97686af79
    name: Certificate Use With No Strong Mapping
    reason: Shadow credentials are used by PKINIT certificate authentication as the victim account; KDC certificate-mapping events show the injected key credential being used.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: After taking over a privileged user or computer account via shadow credentials, a typical next step is DCSync using that identity.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other sensitive AD attribute changes by the same actor
    query: data_win_system_eventID:"5136" AND (data_win_eventdata_attributeLDAPDisplayName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Mm][Ss][Dd][Ss]-[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Aa][Cc][Tt][Oo][Nn][Bb][Ee][Hh][Aa][Ll][Ff][Oo][Ff][Oo][Tt][Hh][Ee][Rr][Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Nn][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Ss][Ii][Dd][Hh][Ii][Ss][Tt][Oo][Rr][Yy]/)
    pivot_on:
    - user
    window: 6h
  - name: Kerberos TGT requests using certificate pre-authentication (PKINIT)
    query: data_win_system_eventID:"4768" AND data_win_eventdata_preAuthType:"16"
    pivot_on:
    - user
    window: 2h
  - name: Shadow credential / AD certificate tooling execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ww][Hh][Ii][Ss][Kk][Ee][Rr]|[Cc][Ee][Rr][Tt][Ii][Pp][Yy]|[Pp][Yy][Ww][Hh][Ii][Ss][Kk][Ee][Rr]|[Rr][Uu][Bb][Ee][Uu][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ww][Hh][Ii][Ss][Kk][Ee][Rr]|[Cc][Ee][Rr][Tt][Ii][Pp][Yy]|[Pp][Yy][Ww][Hh][Ii][Ss][Kk][Ee][Rr]|[Aa][Ss][Kk][Tt][Gg][Tt]|[Pp][Kk][Ii][Nn][Ii][Tt]|[Kk][Ee][Yy][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Directory object ACL changes granting write access
    query: (data_win_system_eventID:"4662" OR data_win_system_eventID:"5136" OR data_win_system_eventID:"4670") AND (data_win_eventdata_properties:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Cc].*/ OR data_win_eventdata_accessMask:"0x40000" OR data_win_eventdata_attributeLDAPDisplayName:/[Nn][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr]/)
    pivot_on:
    - user
    window: 4h
  - name: Logons by this account following the key change
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 4h
