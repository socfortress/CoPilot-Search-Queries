name: Windows Default Domain GPO Modification
id: e5ac86dd-2da1-454b-be74-05d26c769d7d
version: 1
schema_version: "1.0"
date: "2025-11-22"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e5ac86dd-2da1-454b-be74-05d26c769d7d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modifications to Default Domain or Default Domain Controllers Group
  Policy Objects (GPOs). Adversaries may modify these default GPOs to deploy
  malicious configurations across the domain. MITRE ATT&CK: T1484.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5136"
        - term:
            data_win_eventdata_objectClass:
              value: "groupPolicyContainer"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectDN:
                    value: "CN={31B2F340-016D-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectDN:
                    value: "CN={6AC1786C-016F-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectClass
    - data_win_eventdata_objectDN
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136'; data_win_eventdata_objectClass equals
  'groupPolicyContainer'; data_win_eventdata_objectDN matches
  'CN={31B2F340-016D-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM*', among
  other conditions.

known_false_positives: >
  Legitimate modifications to Default Domain or Default Domain Controllers GPOs.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/25/i/unmasking-the-gentlemen-ransomware.html
  - https://adsecurity.org/?p=3377
  - https://www.pentestpartners.com/security-blog/living-off-the-land-gpo-style/
  - https://jgspiers.com/audit-group-policy-changes/
  - https://attack.mitre.org/techniques/T1484/001/

response:
  message: >
    Windows Default Domain GPO Modification detected on host $agent_name$.
    Matched data_win_eventdata_objectClass: $data_win_eventdata_objectClass$.
    Matched data_win_eventdata_objectDN: $data_win_eventdata_objectDN$. MITRE
    ATT&CK: T1484.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectClass
      type: other
    - field: data_win_eventdata_objectDN
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1484.001
  custom_tags:
    - default
    - domain
    - windows_security
    - privilege_escalation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5136" AND data_win_eventdata_objectClass:/[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr]/ AND (data_win_eventdata_objectDN:/[Cc][Nn]=\{31[Bb]2[Ff]340-016[Dd]-11[Dd]2-945[Ff]-00[Cc]04[Ff][Bb]984[Ff]9\},[Cc][Nn]=[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss],[Cc][Nn]=[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_objectDN:/[Cc][Nn]=\{6[Aa][Cc]1786[Cc]-016[Ff]-11[Dd]2-945[Ff]-00[Cc]04[Ff][Bb]984[Ff]9\},[Cc][Nn]=[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss],[Cc][Nn]=[Ss][Yy][Ss][Tt][Ee][Mm].*/)

