name: Windows Default Domain GPO Modification
id: e5ac86dd-2da1-454b-be74-05d26c769d7d
version: 1
schema_version: "1.0"
date: "2025-11-22"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e5ac86dd-2da1-454b-be74-05d26c769d7d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modifications to Default Domain or Default Domain Controllers Group
  Policy Objects (GPOs). Adversaries may modify these default GPOs to deploy
  malicious configurations across the domain. MITRE ATT&CK: T1484.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5136"
        - term:
            data_win_eventdata_objectClass:
              value: "groupPolicyContainer"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectDN:
                    value: "CN={31B2F340-016D-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectDN:
                    value: "CN={6AC1786C-016F-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectClass
    - data_win_eventdata_objectDN
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136'; data_win_eventdata_objectClass equals
  'groupPolicyContainer'; data_win_eventdata_objectDN matches
  'CN={31B2F340-016D-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM*', among
  other conditions.

known_false_positives: >
  Legitimate modifications to Default Domain or Default Domain Controllers GPOs.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/25/i/unmasking-the-gentlemen-ransomware.html
  - https://adsecurity.org/?p=3377
  - https://www.pentestpartners.com/security-blog/living-off-the-land-gpo-style/
  - https://jgspiers.com/audit-group-policy-changes/
  - https://attack.mitre.org/techniques/T1484/001/

response:
  message: >
    Windows Default Domain GPO Modification detected on host $agent_name$.
    Matched data_win_eventdata_objectClass: $data_win_eventdata_objectClass$.
    Matched data_win_eventdata_objectDN: $data_win_eventdata_objectDN$. MITRE
    ATT&CK: T1484.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectClass
      type: other
    - field: data_win_eventdata_objectDN
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1484.001
  custom_tags:
    - default
    - domain
    - windows_security
    - privilege_escalation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5136" AND data_win_eventdata_objectClass:/[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr]/ AND (data_win_eventdata_objectDN:/[Cc][Nn]=\{31[Bb]2[Ff]340-016[Dd]-11[Dd]2-945[Ff]-00[Cc]04[Ff][Bb]984[Ff]9\},[Cc][Nn]=[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss],[Cc][Nn]=[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_objectDN:/[Cc][Nn]=\{6[Aa][Cc]1786[Cc]-016[Ff]-11[Dd]2-945[Ff]-00[Cc]04[Ff][Bb]984[Ff]9\},[Cc][Nn]=[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss],[Cc][Nn]=[Ss][Yy][Ss][Tt][Ee][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 123e4e6d-b123-48f8-b261-7214938acaf0
    name: Startup/Logon Script Added to Group Policy Object
    reason: Same 5136 GPO-edit telemetry; adding a startup/logon script to the default GPO is the most common payload delivery step after gaining write access to it.
  - id: a8f29a7b-b137-4446-80a0-b804272f3da2
    name: Persistence and Execution at Scale via GPO Scheduled Task
    reason: Default Domain GPO edits are used to push an immediate scheduled task to every domain machine, the typical ransomware mass-execution mechanism.
  - id: 1c480e10-7ee1-46d4-8ed2-85f9789e3ce4
    name: Group Policy Abuse for Privilege Addition
    reason: Default GPO modification can grant user rights (SeDebug, SeBackup, local admin) via GptTmpl.inf; this is the privilege-escalation variant of the same edit.
  - id: 5f87308a-0a5b-4623-ae15-d8fa1809bc60
    name: Suspicious Files in Default GPO Folder
    reason: A GPO change in AD is mirrored by file writes in the SYSVOL folder of the default GPO GUIDs; malicious payload or script files there confirm the weaponization.
  - id: dcff7e85-d01f-4eb5-badd-84e2e6be8294
    name: Windows Default Domain GPO Modification via GPME
    reason: 'Process-side view of the same action: gpme.msc/GPMC opened against the default GPOs on the admin workstation that made the 5136 change.'
  - id: ada4b0c4-758b-46ac-9033-9004613a150d
    name: Modify Group Policy Settings
    reason: Command-line registry edits that disable GP processing or tamper with policy are the host-side effect of malicious policy applied by this GPO change.
  - id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
    name: Suspicious SYSVOL Domain Group Policy Access
    reason: Attacker enumeration or hunting of SYSVOL policy files (cpassword, scripts) typically precedes or accompanies tampering with domain GPOs.
  - id: b8f9947e-065a-11ec-aafb-acde48001122
    name: Get DomainPolicy with Powershell
    reason: PowerView-style domain policy and GPO reconnaissance is the usual precursor to selecting default GPOs to modify.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other GPO object changes by this account (modify/create/delete)
    query: data_win_system_eventID:("5136" OR "5137" OR "5141") AND data_win_eventdata_objectClass:/[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr]/
    pivot_on:
    - user
    window: 6h
  - name: Policy payload files written to SYSVOL (tasks, scripts, GptTmpl, Registry.pol)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*[Ss][Yy][Ss][Vv][Oo][Ll]*[Pp]olicies* OR data_win_eventdata_targetFilename:*[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk][Ss].[Xx][Mm][Ll] OR data_win_eventdata_targetFilename:*[Gg][Pp][Tt][Tt][Mm][Pp][Ll].[Ii][Nn][Ff] OR data_win_eventdata_targetFilename:*[Ss][Cc][Rr][Ii][Pp][Tt][Ss].[Ii][Nn][Ii])
    pivot_on:
    - host
    window: 2h
  - name: Ransomware-prep and defense-impairment commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*[Ss]et-[Mm]p[Pp]reference* OR data_win_eventdata_commandLine:*[Vv]ssadmin*[Dd]elete* OR data_win_eventdata_commandLine:*[Bb]cdedit*[Rr]ecovery* OR data_win_eventdata_commandLine:*[Ww]evtutil*[Cc]l* OR data_win_eventdata_commandLine:*[Dd]isable[Rr]ealtime[Mm]onitoring* OR data_win_eventdata_commandLine:*[Nn]etsh*[Aa]dvfirewall*[Oo]ff*)
    pivot_on:
    - host
    window: 4h
  - name: Forced policy refresh or remote scheduled task/service creation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee].[Ee][Xx][Ee] OR data_win_eventdata_commandLine:*[Gg]pupdate*/[Ff]orce* OR data_win_eventdata_commandLine:*[Ss]chtasks*/[Cc]reate* OR data_win_eventdata_commandLine:*[Ii]nvoke-[Gg][Pp][Uu]pdate* OR data_win_eventdata_commandLine:*[Pp]s[Ee]xec*)
    pivot_on:
    - host
    window: 2h
  - name: Privilege and group membership changes by this account
    query: data_win_system_eventID:("4672" OR "4728" OR "4732" OR "4756" OR "4720" OR "4738")
    pivot_on:
    - user
    window: 6h
