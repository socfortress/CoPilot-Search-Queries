name: Potentially Suspicious AccessMask Requested From LSASS
id: 4a1b6da0-d94f-4fc3-98fc-2d9cb9e5ee76
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Roberto Rodriguez, Teymur Kheirkhabarov, Dimitrios Slamaris, Mark Russinovich, Aleksey Potapov, oscd.community (update)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4a1b6da0-d94f-4fc3-98fc-2d9cb9e5ee76
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process handle on LSASS process with certain access mask. MITRE
  ATT&CK: T1003.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4656"
                    - wildcard:
                        data_win_eventdata_objectName:
                          value: "*\\\\lsass.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x40*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1400*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x100000*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1410*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1010*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1438*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x143a*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1418*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1f0fff*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1f1fff*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1f2fff*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessMask:
                                value: "*0x1f3fff*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4663"
                    - wildcard:
                        data_win_eventdata_objectName:
                          value: "*\\\\lsass.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_accessList: "*4484*"
                          - wildcard:
                              data_win_eventdata_accessList: "*4416*"
                        minimum_should_match: 1
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_processName"
        - exists:
            field: "data_win_eventdata_accessList"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\csrss.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\GamingServices.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\lsm.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\MicrosoftEdgeUpdate.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\minionhost.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\MRT.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\MsMpEng.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\perfmon.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\procexp.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\procexp64.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\procexp64a.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\svchost.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\taskmgr.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\thor.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\thor64.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\vmtoolsd.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\VsTskMgr.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\wininit.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\wmiprvse.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*RtkAudUService64"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\Program Files (x86)\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\Program Files\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\Windows\\\\SysNative\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\Windows\\\\System32\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\Windows\\\\SysWow64\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\Windows\\\\Temp\\\\asgard2-agent\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*:\\\\Program Files*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*:\\\\Windows\\\\System32\\\\taskhostw.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*:\\\\Windows\\\\System32\\\\msiexec.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*:\\\\Windows\\\\CCM\\\\CcmExec.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\Windows\\\\Sysmon64.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*:\\\\Windows\\\\Sysmon64a.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_accessList: "*%%4484*"
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*:\\\\Windows\\\\Temp\\\\asgard2-agent-sc\\\\aurora\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\aurora-agent-64.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessList: "*%%4484*"
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\x64\\\\SCENARIOENGINE.EXE"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessList: "*%%4484*"
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\is-*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\avira_system_speedup.tmp"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessList: "*%%4484*"
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*:\\\\Windows\\\\Temp\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\avira_speedup_setup_update.tmp"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessList: "*%%4484*"
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*:\\\\Windows\\\\System32\\\\snmp.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessList: "*%%4484*"
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*:\\\\Windows\\\\SystemTemp\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\GoogleUpdate.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessList: "*%%4484*"
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_processName"
        - exists:
            field: "data_win_eventdata_accessList"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\procmon64.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\procmon64a.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "*\\\\procmon.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_accessList: "*%%4484*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_accessMask
    - data_win_eventdata_accessList
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_eventdata_objectName matches
  '*\lsass.exe'; data_win_eventdata_accessMask matches '*0x40*', among other
  conditions.

known_false_positives: >
  Legitimate software accessing LSASS process for legitimate reason; update the
  whitelist with it. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potentially Suspicious AccessMask Requested From LSASS detected on host
    $agent_name$. Matched data_win_eventdata_objectName:
    $data_win_eventdata_objectName$. Matched data_win_eventdata_accessMask:
    $data_win_eventdata_accessMask$. MITRE ATT&CK: T1003.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_accessMask
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - accessmask
    - requested
    - lsass
    - windows_security
    - credential_access
    - car_2019_04_004
  product:
    - Wazuh
  security_domain: endpoint

graylog:
