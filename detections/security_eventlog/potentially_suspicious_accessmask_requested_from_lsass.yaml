correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Sysmon EID 10 view of the same LSASS handle open; confirms the Security 4656/4663 access with source image and GrantedAccess from a second sensor
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Same dump-capable access masks (0x1010/0x1410/0x1fffff) seen via Sysmon process access; co-occurring corroboration of the handle request
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Direct follow-on: a successful LSASS handle with read rights is followed by a .dmp written to disk for offline parsing'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Likely source process of the handle: rundll32 comsvcs.dll MiniDump opens LSASS with these masks as a living-off-the-land dump'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump -ma lsass is a classic cause of 0x1fffff/0x1410 handle requests and would appear as the accessing process
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: sekurlsa::logonpasswords requests VM_READ|QUERY_INFORMATION on LSASS; Mimikatz is the most common actor behind this access
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Precursor: attackers enable WDigest so cleartext passwords sit in LSASS memory just before the dump'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Escalation path: privileged credentials harvested from LSASS are commonly used for DCSync against a domain controller'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon process access to LSASS with dump-capable rights
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss].[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]14[01]0.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1010.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]40.*/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS dump tooling and dump-file creation
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].[Ee][Xx][Ee]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64.[Ee][Xx][Ee]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].[Ee][Xx][Ee]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].[Ee][Xx][Ee]|[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr].[Ee][Xx][Ee]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt].[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss].*.[Dd][Mm][Pp]).*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Rr][Aa][Ss][Hh][Dd][Uu][Mm][Pp][Ss]\\.*/))
    pivot_on:
    - host
    window: 1h
  - name: Credential-protection weakening around LSASS access
    query: data_win_system_eventID:("12" OR "13") AND (data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt].*[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Xx][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Ll][Oo][Cc][Aa][Ll][Dd][Uu][Mm][Pp][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential-dump tool service install or hive/NTDS export
    query: (data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*([Ww][Cc][Ee]|[Ff][Gg][Dd][Uu][Mm][Pp]|[Pp][Ww][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp]).*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm]\\([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Yy][Ss][Tt][Ee][Mm]).*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*[Ii][Ff][Mm].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee] +[Ss][Hh][Aa][Dd][Oo][Ww].*/))
    pivot_on:
    - host
    window: 2h
  - name: Remote execution and lateral movement using harvested credentials
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND (data_win_eventdata_authenticationPackageName:"NTLM" OR data_win_eventdata_logonProcessName:/.*[Ss][Ee][Cc][Ll][Oo][Gg][Oo].*/)) OR data_win_system_eventID:"4648" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc].[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Cc]64.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc].[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Ss].[Ee][Xx][Ee])/)
    pivot_on:
    - user
    window: 6h
