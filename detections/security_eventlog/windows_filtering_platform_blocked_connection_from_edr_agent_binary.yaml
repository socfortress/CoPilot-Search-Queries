  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 98054878-5eab-434c-85d4-72d4e5a3361b
    name: HackTool - EDRSilencer Execution - Filter Added
    reason: 'Direct precursor: EDRSilencer must first add the persistent WFP block filters (5441/5447) that later produce these 5157 drops of EDR binaries on the same host.'
  - id: eb2d07d4-49cb-4523-801a-da002df36602
    name: HackTool - EDRSilencer Execution
    reason: Process-creation evidence of the EDRSilencer/blockedr binary that installed the WFP filters causing the blocked EDR connections.
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: Sibling EDR-neutralisation tool; if the WFP block is not the only technique, EDR-Freeze suspends the same agent processes to blind the sensor.
  - id: 1f1d8209-636e-4c6c-a137-781cca8b82f9
    name: WFP Filter Added via Registry
    reason: Persistent WFP filters are stored in the registry; a registry write here is the same filter creation that leads to blocked EDR traffic.
  - id: 679085d5-f427-4484-9f58-1dc30a7c426d
    name: WinDivert Driver Load
    reason: WinDivert is another packet-filtering driver attackers load to drop or divert EDR telemetry at network level, an alternative path to the same blinding goal.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Attackers disabling the EDR typically also try to tamper with Defender; tamper-protection triggers on the same host confirm broader defense impairment.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Stopping security services is the companion defense-impairment step attempted alongside or after network-blocking the EDR agent.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Once the EDR is blinded, attackers commonly clear logs to remove remaining traces; a likely follow-on on the same host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: EDR blocking tool or WFP filter manipulation process execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ee][Dd][Rr][Ss][Ii][Ll][Ee][Nn][Cc][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Dd][Rr][Ss][Ii][Ll][Ee][Nn][Cc][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ll][Oo][Cc][Kk][Ee][Dd][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Dd][Rr][Nn][Oo][Ii][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Dd][Rr][Ff][Rr][Ee][Ee][Zz][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ff][Wp][Mm][Ff][Ii][Ll][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Ww][Ff][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistent WFP filters added (custom outbound filter)
    query: (data_win_system_eventID:"5441" OR data_win_system_eventID:"5447" OR data_win_system_eventID:"5152")
    pivot_on:
    - host
    window: 2h
  - name: Security service stop/disable and Defender tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +(stop|config|delete).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] +[Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential access and discovery after EDR blinding
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)))
    pivot_on:
    - host
    window: 4h
  - name: Ransomware prep and log clearing on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/)) OR data_win_system_eventID:"1102"
    pivot_on:
    - host
    window: 6h
