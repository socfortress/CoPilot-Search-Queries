description: >
  Detects a Windows Filtering Platform (WFP) blocked connection event involving
  common Endpoint Detection and Response (EDR) agents. Adversaries may use WFP
  filters to prevent Endpoint Detection and Response (EDR) agents from reporting
  security events. MITRE ATT&CK: T1685.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5157"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_application:
                    value: "*\\\\AmSvc.exe"
                    case_insensitive: true
