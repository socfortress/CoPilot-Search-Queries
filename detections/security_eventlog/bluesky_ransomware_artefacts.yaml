name: BlueSky Ransomware Artefacts
id: eee8311f-a752-44f0-bf2f-6b007db16300
version: 1
schema_version: "1.0"
date: "2023-05-23"
author: j4son
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eee8311f-a752-44f0-bf2f-6b007db16300
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect access to files and shares with names and extensions used by BlueSky
  ransomware which could indicate a current or previous encryption attempt.
  MITRE ATT&CK: T1486.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_system_eventID: "4663"
                          - term:
                              data_win_system_eventID: "4656"
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_objectName:
                                value: "*.bluesky"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_objectName:
                                value: "*DECRYPT FILES BLUESKY*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5145"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_relativeTargetName:
                                value: "*.bluesky"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_relativeTargetName:
                                value: "*DECRYPT FILES BLUESKY*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4663'; data_win_system_eventID equals '4656';
  data_win_eventdata_objectName matches '*.bluesky', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://unit42.paloaltonetworks.com/bluesky-ransomware/
  - https://attack.mitre.org/techniques/T1486/

response:
  message: >
    BlueSky Ransomware Artefacts detected on host $agent_name$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1486
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1486
  custom_tags:
    - bluesky
    - ransomware
    - artefacts
    - windows_security
    - impact
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_win_system_eventID:"4663" OR data_win_system_eventID:"4656") AND (data_win_eventdata_objectName:/.*\.[Bb][Ll][Uu][Ee][Ss][Kk][Yy]/ OR data_win_eventdata_objectName:/.*[Dd][Ee][Cc][Rr][Yy][Pp][Tt] [Ff][Ii][Ll][Ee][Ss] [Bb][Ll][Uu][Ee][Ss][Kk][Yy].*/)) OR (data_win_system_eventID:"5145" AND (data_win_eventdata_relativeTargetName:/.*\.[Bb][Ll][Uu][Ee][Ss][Kk][Yy]/ OR data_win_eventdata_relativeTargetName:/.*[Dd][Ee][Cc][Rr][Yy][Pp][Tt] [Ff][Ii][Ll][Ee][Ss] [Bb][Ll][Uu][Ee][Ss][Kk][Yy].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: BlueSky operators wipe backup catalogs before encrypting; shows recovery inhibition on the same host as the .bluesky artefacts.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Shadow copy deletion is the standard pre-encryption step that precedes .bluesky file renames.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Disabling recovery via bcdedit accompanies ransomware deployment immediately before encryption.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: BlueSky intrusions disable Defender protection before dropping the encryptor, a precursor on the same host.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Attackers add AV exclusions so the ransomware payload and tooling run before encryption starts.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: BlueSky is spread to more hosts via PsExec/Impacket-style remote service execution; a hit shows the spread path.
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: The rule also covers 5145 share access; files written over admin shares reveal the encryptor staging or encrypting over SMB.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Log clearing is operator cleanup around or after encryption on the same host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files created with .bluesky extension or BlueSky ransom note (Sysmon 11)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Bb][Ll][Uu][Ee][Ss][Kk][Yy]/ OR data_win_eventdata_targetFilename:/.*[Dd][Ee][Cc][Rr][Yy][Pp][Tt] [Ff][Ii][Ll][Ee][Ss] [Bb][Ll][Uu][Ee][Ss][Kk][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Recovery inhibition: shadow copy, backup catalog and boot recovery deletion'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\(vssadmin|wbadmin|bcdedit|diskshadow)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*delete* OR data_win_eventdata_commandLine:*recoveryenabled* OR data_win_eventdata_commandLine:*bootstatuspolicy*)) OR data_win_eventdata_commandLine:/.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]in32_[Ss]hadowcopy.*/)
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering and AV exclusions before encryption
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Set-MpPreference* OR data_win_eventdata_commandLine:*Add-MpPreference* OR data_win_eventdata_commandLine:*DisableRealtimeMonitoring*)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Set-MpPreference* OR data_win_eventdata_scriptBlockText:*DisableRealtimeMonitoring*))
    pivot_on:
    - host
    window: 4h
  - name: Remote service / PsExec style execution on this host
    query: data_win_system_eventID:("4697" OR "7045") OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Network logons by the account touching BlueSky files
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "10")
    pivot_on:
    - user
    window: 6h
