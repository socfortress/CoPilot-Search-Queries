name: Remote Task Creation via ATSVC Named Pipe
id: f6de6525-4509-495a-8a82-1f8b0ed73a00
version: 1
schema_version: "1.0"
date: "2024-08-01"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f6de6525-4509-495a-8a82-1f8b0ed73a00
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects remote task creation via at.exe or API interacting with ATSVC
  namedpipe. MITRE ATT&CK: T1053.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_shareName:
              value: "\\\\*\\IPC$"
              case_insensitive: true
        - term:
            data_win_eventdata_relativeTargetName:
              value: "atsvc"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_accessList:
              value: "*WriteData*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_accessList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName equals
  '\\*\IPC$'; data_win_eventdata_relativeTargetName equals 'atsvc', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20230409194125/https://blog.menasec.net/2019/03/threat-hunting-25-scheduled-tasks-for.html
  - https://attack.mitre.org/techniques/T1053/002/

response:
  message: >
    Remote Task Creation via ATSVC Named Pipe detected on host $agent_name$.
    Matched data_win_eventdata_shareName: $data_win_eventdata_shareName$.
    Matched data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1053.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.002
  custom_tags:
    - atsvc
    - named
    - windows_security
    - privilege_escalation
    - execution
    - lateral_movement
    - persistence
    - car_2013_05_004
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/[Aa][Tt][Ss][Vv][Cc]/ AND data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Tt][Aa].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: The ATSVC pipe write is the remote RPC call that creates the task; the resulting 4698 task registration on the same host shows what the task will run.
  - id: 614cf376-6651-47c4-9dcc-6b9527f749f4
    name: Suspicious Scheduled Task Update
    reason: Attackers may modify an existing task over the same ATSVC/ITaskSchedulerService RPC instead of creating one; same remote interface, same host.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Sibling remote-execution path over IPC$ (svcctl instead of atsvc); operators using Impacket/PsExec-style tooling often fall back from one to the other on the same target.
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: Payloads are typically staged to ADMIN$/C$ over SMB before the remote task is created to execute them.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: The remote scheduler call needs an authenticated admin session from the source host; explicit-credential logons reveal the account used for lateral movement.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Network logon with NTLM hash reuse is the usual way the attacker authenticates before the ATSVC RPC call.
  - id: 72124974-a68b-4366-b990-d30e0b2a190d
    name: Metasploit SMB Authentication
    reason: Metasploit scheduler/psexec modules authenticate over SMB and then drive atsvc; co-occurring authentication on the target confirms tooling.
  - id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
    name: Possible Impacket SecretDump Remote Activity
    reason: Impacket atexec and secretsdump share the same remote SMB/RPC admin footprint; secretsdump on the same host is the credential-theft follow-on.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Task registration/update events (4698/4702) on this host
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4702")
    pivot_on:
    - host
    window: 1h
  - name: Task XML files written under System32\Tasks
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]\\.*/
    pivot_on:
    - host
    window: 1h
  - name: Processes spawned by the Task Scheduler service or from SMB-staged shells
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentCommandLine:/.*[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee].*/ OR data_win_eventdata_parentImage:/.*[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]?\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|rundll32|regsvr32|mshta|wscript|cscript|certutil|bitsadmin)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on:
    - host
    window: 1h
  - name: Other remote execution channels via IPC$/ADMIN$ on this host
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_relativeTargetName:/[Ss][Vv][Cc][Cc][Tt][Ll]/ OR data_win_eventdata_relativeTargetName:/[Ww][Kk][Ss][Ss][Vv][Cc]/ OR data_win_eventdata_relativeTargetName:/[Ss][Rr][Vv][Ss][Vv][Cc]/ OR data_win_eventdata_shareName:/.*[Aa][Dd][Mm][Ii][Nn]\$/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons by the calling account across hosts
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - user
    window: 6h
