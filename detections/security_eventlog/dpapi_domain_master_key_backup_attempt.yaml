name: DPAPI Domain Master Key Backup Attempt
id: 39a94fd1-8c9a-4ff6-bf22-c058762f8014
version: 1
schema_version: "1.0"
date: "2023-03-15"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39a94fd1-8c9a-4ff6-bf22-c058762f8014
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects anyone attempting a backup for the DPAPI Master Key. This events gets
  generated at the source and not the Domain Controller. MITRE ATT&CK:
  T1003.004.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4692"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4692'.

known_false_positives: >
  If a computer is a member of a domain, DPAPI has a backup mechanism to allow
  unprotection of the data. Which will trigger this event. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190620-DomainDPAPIBackupKeyExtraction/notebook.html
  - https://attack.mitre.org/techniques/T1003/004/

response:
  message: >
    DPAPI Domain Master Key Backup Attempt detected on host $agent_name$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. Matched
    data_win_eventdata_subjectLogonId: $data_win_eventdata_subjectLogonId$.
    MITRE ATT&CK: T1003.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_subjectUserName
      type: user
    - field: data_win_eventdata_subjectLogonId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.004
  custom_tags:
    - dpapi
    - domain
    - master
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4692"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4ac1f50b-3bd0-4968-902d-868b4647937e
    name: DPAPI Domain Backup Key Extraction
    reason: 'DC-side counterpart: 4692 on the client is the master key backup request; the BCKUPKEY retrieval on the DC confirms the domain backup key was actually pulled'
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: SharpDPAPI is a tool that triggers master key backup/unprotect (4692) while harvesting credentials
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz dpapi::masterkey /rpc and dpapi::chrome generate 4692 events; confirms tool-driven DPAPI abuse
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: An actor with domain-level DPAPI access often also replicates secrets from the DC; co-occurring domain credential theft
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Directory replication by a user account is a sibling domain-wide secret extraction path, often by the same actor around DPAPI key retrieval
  - id: windows-credentials-access-vaultcli-module-001
    name: Windows Credentials Access Via Vaultcli Module
    reason: 'Follow-on: once master keys are recovered, Credential Manager/Vault blobs are decrypted via vaultcli.dll loads'
  - id: 45545954-4016-43c6-855e-eae8f1c369dc
    name: Protected Storage Service Access
    reason: Access to the protected storage RPC interface is the same DPAPI secret-retrieval surface
  - id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
    name: Password Dumper Activity on LSASS
    reason: Parallel local credential theft from LSASS in the same session indicates broad credential harvesting, not routine DPAPI use
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DPAPI abuse tooling command lines (SharpDPAPI, Mimikatz dpapi::, masterkey, pvk)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii]::.*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Ss][Tt][Ee][Rr][Kk][Ee][Yy].*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp][Kk][Ee][Yy].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Vv][Kk].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::.*/)
    pivot_on:
    - host
    window: 1h
  - name: DPAPI/vault DLL loads and Protect-folder, pvk or browser credential file writes
    query: (data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Ll][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Dd][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll]/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Pp][Rr][Oo][Tt][Ee][Cc][Tt]\\.*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Vv][Kk]/ OR data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/))
    pivot_on:
    - host
    window: 1h
  - name: LSASS access and credential-dump commands on the host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Network and remote logons by this account (stolen credential reuse)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
  - name: Lateral movement tooling and outbound SMB/RPC/WinRM from the host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]|\\[Ww][Mm][Ii][Cc]|\\[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"5985"))
    pivot_on:
    - host
    window: 2h
