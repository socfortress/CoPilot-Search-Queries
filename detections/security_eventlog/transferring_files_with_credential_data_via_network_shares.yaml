name: Transferring Files with Credential Data via Network Shares
id: 910ab938-668b-401b-b08c-b596e80fdca5
version: 1
schema_version: "1.0"
date: "2025-07-11"
author: Teymur Kheirkhabarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 910ab938-668b-401b-b08c-b596e80fdca5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Transferring files with well-known filenames (sensitive files with credential
  data) using network shares. MITRE ATT&CK: T1003.002, T1003.001, T1003.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*\\\\mimidrv*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*\\\\lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*\\\\windows\\\\minidump\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*\\\\hiberfil*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*\\\\sqldmpr*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_relativeTargetName:
                    value: "Windows\\NTDS\\ntds.dit"
                    case_insensitive: true
              - term:
                  data_win_eventdata_relativeTargetName:
                    value: "Windows\\System32\\config\\SAM"
                    case_insensitive: true
              - term:
                  data_win_eventdata_relativeTargetName:
                    value: "Windows\\System32\\config\\SECURITY"
                    case_insensitive: true
              - term:
                  data_win_eventdata_relativeTargetName:
                    value: "Windows\\System32\\config\\SYSTEM"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_relativeTargetName
  matches '*\mimidrv*'; data_win_eventdata_relativeTargetName matches
  '*\lsass*', among other conditions.

known_false_positives: >
  Transferring sensitive files for legitimate administration work by legitimate
  administrator. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Transferring Files with Credential Data via Network Shares detected on host
    $agent_name$. Matched data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1003.002, T1003.001, T1003.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_relativeTargetName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
    - T1003.001
    - T1003.003
  custom_tags:
    - transferring
    - credential
    - network
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND (data_win_eventdata_relativeTargetName:/.*\\[Mm][Ii][Mm][Ii][Dd][Rr][Vv].*/ OR data_win_eventdata_relativeTargetName:/.*\\[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_relativeTargetName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]\\.*/ OR data_win_eventdata_relativeTargetName:/.*\\[Hh][Ii][Bb][Ee][Rr][Ff][Ii][Ll].*/ OR data_win_eventdata_relativeTargetName:/.*\\[Ss][Qq][Ll][Dd][Mm][Pp][Rr].*/ OR data_win_eventdata_relativeTargetName:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Nn][Tt][Dd][Ss]\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]/ OR data_win_eventdata_relativeTargetName:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Aa][Mm]/ OR data_win_eventdata_relativeTargetName:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]/ OR data_win_eventdata_relativeTargetName:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Yy][Ss][Tt][Ee][Mm]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: 'Local-copy counterpart: attacker stages SAM/SYSTEM/ntds.dit with copy/esentutl before the same files are pulled over the share that 5145 recorded'
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Locked hives and ntds.dit are copied out of a shadow copy just before being fetched over SMB
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Shadow-copy access to credential stores is the usual precursor to exfiltrating them via a share
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: ntdsutil IFM export produces the ntds.dit/SYSTEM files subsequently transferred over the share
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Process-level evidence of the NTDS.dit theft whose network transfer this rule sees
  - id: f8748f2c-89dc-4d95-afb0-5a2dfdbad332
    name: SAM Registry Hive Handle Request
    reason: Remote SAM/SYSTEM hive access is the same credential-theft chain as fetching the hive files over the share
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: lsass/minidump files named in the share path are typically created by comsvcs MiniDump before being pulled off the host
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Attacker holding admin share access commonly follows with PsExec using the harvested credentials to move laterally
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential-store staging, shadow copy and dump tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm].*[Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Direct LSASS access or credential dump file creation on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]/))
    pivot_on:
    - host
    window: 2h
  - name: Other admin-share access by this account (5145)
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:/.*\\[Cc]$/ OR data_win_eventdata_shareName:/.*\\[Aa][Dd][Mm][Ii][Nn]$/ OR data_win_eventdata_shareName:/.*\\[Ii][Pp][Cc]$/)
    pivot_on:
    - user
    window: 6h
  - name: Network logons from the source of the share access
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "9")
    pivot_on:
    - ip
    window: 6h
  - name: Remote service install or PsExec-style execution after the transfer
    query: (data_win_system_eventID:"7045") OR (data_win_system_eventID:"4697") OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
