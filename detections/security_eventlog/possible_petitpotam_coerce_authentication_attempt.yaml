name: Possible PetitPotam Coerce Authentication Attempt
id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
version: 1
schema_version: "1.0"
date: "2022-08-11"
author: Mauricio Velazco, Michael Haag
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect PetitPotam coerced authentication activity. MITRE ATT&CK: T1187.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - wildcard:
            data_win_eventdata_shareName: "\\\\\\\\*"
        - wildcard:
            data_win_eventdata_shareName:
              value: "*\\\\IPC$"
              case_insensitive: true
        - term:
            data_win_eventdata_relativeTargetName:
              value: "lsarpc"
              case_insensitive: true
        - term:
            data_win_eventdata_subjectUserName:
              value: "ANONYMOUS LOGON"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName matches
  '\\*'; data_win_eventdata_shareName matches '*\IPC$', among other conditions.

known_false_positives: >
  Unknown. Feedback welcomed. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/topotam/PetitPotam
  - https://github.com/splunk/security_content/blob/0dd6de32de2118b2818550df9e65255f4109a56d/detections/endpoint/petitpotam_network_share_access_request.yml
  - https://attack.mitre.org/techniques/T1187/

response:
  message: >
    Possible PetitPotam Coerce Authentication Attempt detected on host
    $agent_name$. Matched data_win_eventdata_shareName:
    $data_win_eventdata_shareName$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1187
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1187
  custom_tags:
    - petitpotam
    - coerce
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\.*/ AND data_win_eventdata_shareName:/.*\\[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/[Ll][Ss][Aa][Rr][Pp][Cc]/ AND data_win_eventdata_subjectUserName:/[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ll][Oo][Gg][Oo][Nn]/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
