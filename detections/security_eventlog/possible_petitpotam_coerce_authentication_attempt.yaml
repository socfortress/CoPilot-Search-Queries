name: Possible PetitPotam Coerce Authentication Attempt
id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
version: 1
schema_version: "1.0"
date: "2022-08-11"
author: Mauricio Velazco, Michael Haag
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect PetitPotam coerced authentication activity. MITRE ATT&CK: T1187.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - wildcard:
            data_win_eventdata_shareName: "\\\\\\\\*"
        - wildcard:
            data_win_eventdata_shareName:
              value: "*\\\\IPC$"
              case_insensitive: true
        - term:
            data_win_eventdata_relativeTargetName:
              value: "lsarpc"
              case_insensitive: true
        - term:
            data_win_eventdata_subjectUserName:
              value: "ANONYMOUS LOGON"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName matches
  '\\*'; data_win_eventdata_shareName matches '*\IPC$', among other conditions.

known_false_positives: >
  Unknown. Feedback welcomed. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/topotam/PetitPotam
  - https://github.com/splunk/security_content/blob/0dd6de32de2118b2818550df9e65255f4109a56d/detections/endpoint/petitpotam_network_share_access_request.yml
  - https://attack.mitre.org/techniques/T1187/

response:
  message: >
    Possible PetitPotam Coerce Authentication Attempt detected on host
    $agent_name$. Matched data_win_eventdata_shareName:
    $data_win_eventdata_shareName$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1187
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1187
  custom_tags:
    - petitpotam
    - coerce
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\.*/ AND data_win_eventdata_shareName:/.*\\[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/[Ll][Ss][Aa][Rr][Pp][Cc]/ AND data_win_eventdata_subjectUserName:/[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ll][Oo][Gg][Oo][Nn]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 214e8f95-100a-4e04-bb31-ef6cba8ce07e
    name: DCERPC SMB Spoolss Named Pipe
    reason: Sibling coercion primitive (PrinterBug/SpoolSample via the spoolss pipe on IPC$) used against the same DC to force machine-account authentication; attackers rotate between EFSRPC and Spoolss
  - id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
    name: NetNTLM Downgrade Attack
    reason: Coerced DC NTLM auth is only relayable or crackable if NTLM is weakened; LM compatibility downgrade often accompanies relay setups
  - id: bfbd3291-de87-4b7c-88a2-d6a5deb28668
    name: ADCS Certificate Template Configuration Vulnerability with Risky EKU
    reason: The classic PetitPotam payoff is relaying the DC NTLM auth to AD CS web enrollment (ESC8) to mint a DC certificate; AD CS abuse on the CA confirms the relay path
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: With a DC certificate or relayed DC identity the attacker gets DC-equivalent rights and performs DCSync to dump domain hashes
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: A stolen DC certificate is exchanged for a TGT (PKINIT) and tickets are then abused; Kerberos anomalies follow a successful relay
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: After domain-admin level access the attacker commonly drops payloads over admin shares for lateral movement
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Remote service installation by an unexpected client is the typical follow-on lateral execution once DC-level credentials are obtained
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other coercion RPC pipes over IPC$ (EFSRPC/Spoolss/DFSNM/FSRVP)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND (data_win_eventdata_relativeTargetName:/[Ee][Ff][Ss][Rr][Pp][Cc]/ OR data_win_eventdata_relativeTargetName:/[Ss][Pp][Oo][Oo][Ll][Ss][Ss]/ OR data_win_eventdata_relativeTargetName:/[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]/ OR data_win_eventdata_relativeTargetName:/[Ff][Ss][Rr][Vv][Pp][Ss][Ss]/ OR data_win_eventdata_relativeTargetName:/[Ss][Aa][Mm][Rr]/ OR data_win_eventdata_relativeTargetName:/[Ll][Ss][Aa][Rr][Pp][Cc]/ OR data_win_eventdata_relativeTargetName:/[Dd][Ff][Ss][Nn][Mm]/)
    pivot_on:
    - host
    window: 2h
  - name: Certificate issuance on CA (ESC8 relay payoff)
    query: (data_win_system_eventID:"4886" OR data_win_system_eventID:"4887" OR data_win_system_eventID:"4898")
    pivot_on:
    - host
    window: 4h
  - name: NTLM network logons by machine accounts
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM" AND data_win_eventdata_targetUserName:/.*\$/
    pivot_on:
    - host
    - ip
    window: 2h
  - name: PKINIT certificate TGT requests and DCSync replication
    query: (data_win_system_eventID:"4768" AND data_win_eventdata_preAuthType:"16") OR (data_win_system_eventID:"4662" AND data_win_eventdata_accessMask:/0[Xx]100/ AND data_win_eventdata_properties:/.*1131[Ff]6[Aa][Aa]-9[Cc]07-11[Dd]1-[Ff]79[Ff]-00[Cc]04[Ff][Cc]2[Dd][Cc][Dd]2.*/)
    pivot_on:
    - host
    window: 4h
  - name: Coercion/relay tooling execution (PetitPotam, Coercer, ntlmrelayx, Certipy)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm]|\\[Cc][Oo][Ee][Rr][Cc][Ee][Rr]|\\[Ee][Ff][Ss][Pp][Oo][Tt][Aa][Tt][Oo]|\\[Ss][Pp][Oo][Oo][Ll][Ss][Aa][Mm][Pp][Ll][Ee]|\\[Cc][Ee][Rr][Tt][Ii][Pp][Yy]).*/ OR data_win_eventdata_commandLine:/.*([Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm]|[Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy][Xx]|[Cc][Ee][Rr][Tt][Ss][Rr][Vv]).*/)
    pivot_on:
    - host
    window: 2h
