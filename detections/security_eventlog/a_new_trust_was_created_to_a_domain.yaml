name: A New Trust Was Created To A Domain
id: 0255a820-e564-4e40-af2b-6ac61160335c
version: 1
schema_version: "1.0"
date: "2024-01-16"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0255a820-e564-4e40-af2b-6ac61160335c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Addition of domains is seldom and should be verified for legitimacy. MITRE
  ATT&CK: T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4706"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4706'.

known_false_positives: >
  Legitimate extension of domain structure. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4706
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    A New Trust Was Created To A Domain detected on host $agent_name$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    Matched data_win_eventdata_subjectLogonId:
    $data_win_eventdata_subjectLogonId$. MITRE ATT&CK: T1098
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_subjectUserName
      type: user
    - field: data_win_eventdata_subjectLogonId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1098
  custom_tags:
    - trust
    - domain
    - windows_security
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4706"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Attackers enumerate existing trusts with nltest /domain_trusts before creating or abusing a trust; precursor on the same DC/admin host.
  - id: 3bad990e-4848-4a78-9530-b427d854aac0
    name: Domain Trust Discovery Via Dsquery
    reason: dsquery * -filter trustedDomain is trust reconnaissance that precedes building a rogue trust for cross-domain pivoting.
  - id: 4fa7f846-054a-11ec-a836-acde48001122
    name: Get-DomainTrust with PowerShell
    reason: PowerView-style trust enumeration is a common precursor to adding or abusing a trust in the same session.
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: Script-block evidence of Get-DomainTrust on the host that then logged 4706, confirming scripted trust recon and manipulation.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Broader nltest domain/DC recon by the same account just before trust creation.
  - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
    name: Addition of SID History to Active Directory Object
    reason: Once a trust exists with SID filtering weakened, SID history injection is the classic follow-on for cross-trust privilege escalation.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: A new trust on a DC is often followed by DCSync-style replication to harvest credentials from the domain.
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: Forged or abused inter-realm tickets (golden ticket, trust ticket) are the way a rogue trust is exploited after creation.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Trust creation / enumeration tooling (netdom, nltest, dsquery, PowerShell)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Dd][Oo][Mm].*[Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Tt][Rr][Uu][Ss][Tt][Rr][Ee][Ll][Aa][Tt][Ii][Oo][Nn][Ss][Hh][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Aa][Dd][Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-([Dd][Oo][Mm][Aa][Ii][Nn]|[Ff][Oo][Rr][Ee][Ss][Tt])[Tt][Rr][Uu][Ss][Tt].*/)
    pivot_on:
    - host
    window: 6h
  - name: Other trust modifications and SID-filtering events (4707, 4716, 4865-4867, 4675)
    query: (data_win_system_eventID:"4707" OR data_win_system_eventID:"4716" OR data_win_system_eventID:"4865" OR data_win_system_eventID:"4866" OR data_win_system_eventID:"4867" OR data_win_system_eventID:"4675")
    pivot_on:
    - host
    window: 24h
  - name: Credential theft and replication on the DC (lsass access, ntds, DCSync)
    query: (data_win_system_eventID:"4662" AND data_win_eventdata_properties:*1131f6a*) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/))
    pivot_on:
    - host
    window: 6h
  - name: Network logons and Kerberos tickets by this account (cross-domain use)
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 6h
  - name: Privileged account and group changes by this account
    query: (data_win_system_eventID:"4672" OR data_win_system_eventID:"4720" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4738")
    pivot_on:
    - user
    window: 6h
