name: WMI Persistence - Security
id: f033f3f3-fd24-4995-97d8-a3bb17550a88
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Florian Roth (Nextron Systems), Gleb Sukhodolskiy, Timur Zinniatullin oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f033f3f3-fd24-4995-97d8-a3bb17550a88
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious WMI event filter and command line event consumer based on
  WMI and Security Logs. MITRE ATT&CK: T1546.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4662"
        - term:
            data_win_eventdata_objectType:
              value: "WMI Namespace"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*subscription*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4662'; data_win_eventdata_objectType equals
  'WMI Namespace'; data_win_eventdata_objectName matches '*subscription*'.

known_false_positives: >
  Unknown (data set is too small; further testing needed). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/mattifestation/status/899646620148539397
  - https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    WMI Persistence - Security detected on host $agent_name$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. MITRE
    ATT&CK: T1546.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - persistence
    - security
    - windows_security
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4662" AND data_win_eventdata_objectType:/[Ww][Mm][Ii] [Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]/ AND data_win_eventdata_objectName:/.*[Ss][Uu][Bb][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f06a3a5-6a09-413f-8743-e6cf35561297
    name: WMI Event Subscription
    reason: Sysmon 19/20/21 records the actual filter, consumer and binding objects whose subscription-namespace access this 4662 audit saw; confirms a subscription was really created and shows its contents
  - id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
    name: Suspicious Scripting in a WMI Consumer
    reason: Reveals whether the new consumer carries script content (ActiveScriptEventConsumer VBS/JS), the payload half of the persistence
  - id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
    name: Suspicious Encoded Scripts in a WMI Consumer
    reason: Consumer with encoded/obfuscated payload turns subscription access into confirmed malicious persistence
  - id: 05936ce2-ee05-4dae-9d03-9a391cf2d2c6
    name: WMI Persistence - Command Line Event Consumer
    reason: A CommandLineEventConsumer firing loads wbemcons.dll in wmiprvse; follow-on execution of the persisted subscription
  - id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
    name: WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load
    reason: scrcons.exe loading scripting engines is the runtime trigger of a script-based subscription created in the audited namespace
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: Command-line creation of the consumer is the likely cause of the namespace access; shows who and with what parent
  - id: 9e07f6e7-83aa-45c6-998e-0af26efd0a85
    name: Powershell WMI Persistence
    reason: PowerShell Set-WmiInstance for __EventFilter/consumer/binding is the other common way the subscription is installed
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: When the subscription triggers, WmiPrvSE/scrcons spawns the payload process; follow-on execution of the persisted action
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI filter/consumer/binding objects registered on this host
    query: (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21")
    pivot_on:
    - host
    window: 4h
  - name: Subscription creation via wmic, mofcomp or WMI PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*(__[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr]|[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr]|[Aa][Cc][Tt][Ii][Vv][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr]|__[Ff][Ii][Ll][Tt][Ee][Rr][Tt][Oo][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr][Bb][Ii][Nn][Dd][Ii][Nn][Gg]|[Ss][Ee][Tt]-[Ww][Mm][Ii][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee]|[Mm][Oo][Ff][Cc][Oo][Mm][Pp]).*/ OR data_win_eventdata_image:/.*\\[Mm][Oo][Ff][Cc][Oo][Mm][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Processes spawned by WMI consumer hosts (scrcons/WmiPrvSE)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Script blocks referencing WMI subscription classes
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(__[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr]|[Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr]|__[Ff][Ii][Ll][Tt][Ee][Rr][Tt][Oo][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr]).*/
    pivot_on:
    - host
    window: 2h
  - name: Network logons by this account (remote WMI subscription origin)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - user
    window: 2h
