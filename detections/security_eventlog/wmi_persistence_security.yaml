name: WMI Persistence - Security
id: f033f3f3-fd24-4995-97d8-a3bb17550a88
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Florian Roth (Nextron Systems), Gleb Sukhodolskiy, Timur Zinniatullin oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f033f3f3-fd24-4995-97d8-a3bb17550a88
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious WMI event filter and command line event consumer based on
  WMI and Security Logs. MITRE ATT&CK: T1546.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4662"
        - term:
            data_win_eventdata_objectType:
              value: "WMI Namespace"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*subscription*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4662'; data_win_eventdata_objectType equals
  'WMI Namespace'; data_win_eventdata_objectName matches '*subscription*'.

known_false_positives: >
  Unknown (data set is too small; further testing needed). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/mattifestation/status/899646620148539397
  - https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    WMI Persistence - Security detected on host $agent_name$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. Matched
    data_win_eventdata_objectName: $data_win_eventdata_objectName$. MITRE
    ATT&CK: T1546.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - persistence
    - security
    - windows_security
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4662" AND data_win_eventdata_objectType:/[Ww][Mm][Ii] [Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]/ AND data_win_eventdata_objectName:/.*[Ss][Uu][Bb][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn].*/

correlation:
