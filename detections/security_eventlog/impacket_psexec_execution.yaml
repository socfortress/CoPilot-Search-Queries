name: Impacket PsExec Execution
id: 32d56ea1-417f-44ff-822b-882873f5f43b
version: 1
schema_version: "1.0"
date: "2022-09-22"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 32d56ea1-417f-44ff-822b-882873f5f43b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of Impacket's psexec.py. MITRE ATT&CK: T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_shareName:
              value: "\\\\*\\IPC$"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*RemCom_stdin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*RemCom_stdout*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_relativeTargetName:
                    value: "*RemCom_stderr*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName equals
  '\\*\IPC$'; data_win_eventdata_relativeTargetName matches '*RemCom_stdin*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20230329171218/https://blog.menasec.net/2019/02/threat-hunting-3-detecting-psexec.html
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Impacket PsExec Execution detected on host $agent_name$. Matched
    data_win_eventdata_shareName: $data_win_eventdata_shareName$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - impacket
    - psexec
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Ii][Pp][Cc]\$/ AND (data_win_eventdata_relativeTargetName:/.*[Rr][Ee][Mm][Cc][Oo][Mm]_[Ss][Tt][Dd][Ii][Nn].*/ OR data_win_eventdata_relativeTargetName:/.*[Rr][Ee][Mm][Cc][Oo][Mm]_[Ss][Tt][Dd][Oo][Uu][Tt].*/ OR data_win_eventdata_relativeTargetName:/.*[Rr][Ee][Mm][Cc][Oo][Mm]_[Ss][Tt][Dd][Ee][Rr][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: 'Same psexec.py session: after the RemCom pipes are opened over IPC$, the tool installs a random-named service (4697, %systemroot%\<8 chars>.exe) on the target; the service install is the execution step of this same chain.'
  - id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82
    name: Suspicious PsExec Execution
    reason: 'Co-occurring 5145 IPC$ pipe access: the -stdin/-stdout/-stderr pipes of PsExec-compatible tools (non-PSEXESVC) are the sibling signature of the RemCom_* pipes, confirming remote service-based execution.'
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Precursor: psexec.py first writes to the svcctl pipe over IPC$ to create and start its service before the RemCom pipes appear.'
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: 'Precursor: psexec.py uploads its randomly-named service binary to ADMIN$/C$ over SMB with write access before the service is created.'
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Remote service creation via SCM from a network client (no local client process) is how the psexec.py service lands; corroborates the 4697 side.
  - id: f0d1feba-4344-4ca9-8121-a6c97bd6df52
    name: Credential Dumping Tools Service Execution - Security
    reason: 'Follow-on: operators commonly use the SYSTEM shell from psexec.py to run credential dumping tools as services (mimikatz/pwdump/fgexec/gsecdump).'
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: Process-side evidence of the Impacket toolkit on the source or target host; the attacker box usually runs other Impacket tools (secretsdump, wmiexec) alongside psexec.py.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Likely next step: a SYSTEM shell obtained through psexec.py is used to dump LSASS credentials for further lateral movement.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote service installation (random-named service binary / cmd-based service)
    query: (data_win_system_eventID:"4697" OR data_win_system_eventID:"7045") AND (data_win_eventdata_serviceFileName:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[A-Za-z]{8}\.[Ee][Xx][Ee].*/ OR data_win_eventdata_serviceFileName:/.*%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%\.*/ OR data_win_eventdata_serviceFileName:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*/ OR data_win_eventdata_serviceFileName:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: Shells spawned by the remote service (services.exe or random 8-char binary as parent)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[A-Za-z]{8}\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: SMB admin share and RPC pipe access around the session
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:/.*(ADMIN|[Cc])\$/ OR data_win_eventdata_relativeTargetName:/.*([Ss][Vv][Cc][Cc][Tt][Ll]|[Aa][Tt][Ss][Vv][Cc]|[Ww][Ii][Nn][Rr][Ee][Gg]|[Ss][Aa][Mm][Rr]|[Ll][Ss][Aa][Rr][Pp][Cc]|[Dd][Rr][Ss][Uu][Aa][Pp][Ii]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Network (type 3) NTLM logons and explicit-credential use by this account
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM") OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 6h
  - name: 'Post-exploitation from the SYSTEM shell: LSASS access, hive/NTDS dumping, shadow copies'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg](\.[Ee][Xx][Ee])? +[Ss][Aa][Vv][Ee] +.*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
