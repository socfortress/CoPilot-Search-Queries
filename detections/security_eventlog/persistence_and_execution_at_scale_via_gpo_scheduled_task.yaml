name: Persistence and Execution at Scale via GPO Scheduled Task
id: a8f29a7b-b137-4446-80a0-b804272f3da2
version: 1
schema_version: "1.0"
date: "2024-09-04"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a8f29a7b-b137-4446-80a0-b804272f3da2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect lateral movement using GPO scheduled task, usually used to deploy
  ransomware at scale. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5136"
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_attributeLDAPDisplayName:
                                value: "gPCMachineExtensionNames"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_attributeLDAPDisplayName:
                                value: "gPCUserExtensionNames"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_attributeValue:
                                value: "*CAB54552-DEEA-4691-817E-ED4A4D1AFC72*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_attributeValue:
                                value: "*AADCED64-746C-4633-A97C-D61349046527*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5145"
                    - wildcard:
                        data_win_eventdata_shareName:
                          value: "*\\\\SYSVOL"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_relativeTargetName:
                          value: "*ScheduledTasks.xml"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_accessList:
                                value: "*WriteData*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_accessList: "*%%4417*"
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_attributeValue
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_accessList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136';
  data_win_eventdata_attributeLDAPDisplayName equals 'gPCMachineExtensionNames';
  data_win_eventdata_attributeLDAPDisplayName equals 'gPCUserExtensionNames',
  among other conditions.

known_false_positives: >
  If the source IP is not localhost then it's super suspicious, better to
  monitor both local and remote changes to GPO scheduled tasks. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://twitter.com/menasec1/status/1106899890377052160
  - https://www.secureworks.com/blog/ransomware-as-a-distraction
  - https://www.elastic.co/guide/en/security/7.17/prebuilt-rule-0-16-1-scheduled-task-execution-at-scale-via-gpo.html
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Persistence and Execution at Scale via GPO Scheduled Task detected on host
    $agent_name$. Matched data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. Matched
    data_win_eventdata_attributeValue: $data_win_eventdata_attributeValue$.
    MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other
    - field: data_win_eventdata_attributeValue
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - persistence
    - scale
    - scheduled
    - windows_security
    - privilege_escalation
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"5136" AND (data_win_eventdata_attributeLDAPDisplayName:/[Gg][Pp][Cc][Mm][Aa][Cc][Hh][Ii][Nn][Ee][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Nn][Aa][Mm][Ee][Ss]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Gg][Pp][Cc][Uu][Ss][Ee][Rr][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Nn][Aa][Mm][Ee][Ss]/) AND (data_win_eventdata_attributeValue:/.*[Cc][Aa][Bb]54552-[Dd][Ee][Ee][Aa]-4691-817[Ee]-[Ee][Dd]4[Aa]4[Dd]1[Aa][Ff][Cc]72.*/ OR data_win_eventdata_attributeValue:/.*[Aa][Aa][Dd][Cc][Ee][Dd]64-746[Cc]-4633-[Aa]97[Cc]-[Dd]61349046527.*/)) OR (data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*\\[Ss][Yy][Ss][Vv][Oo][Ll]/ AND data_win_eventdata_relativeTargetName:/.*[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk][Ss]\.[Xx][Mm][Ll]/ AND (data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_accessList:/.*%%4417.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1c480e10-7ee1-46d4-8ed2-85f9789e3ce4
    name: Group Policy Abuse for Privilege Addition
    reason: Same GPO-write primitive on the DC; attackers who can edit GPOs often push privilege/user-rights changes alongside the malicious scheduled task.
  - id: 123e4e6d-b123-48f8-b261-7214938acaf0
    name: Startup/Logon Script Added to Group Policy Object
    reason: Alternative GPO-based mass execution vector (logon/startup scripts) used in the same ransomware-deployment playbook; frequently co-occurs with the ScheduledTasks.xml push.
  - id: e5ac86dd-2da1-454b-be74-05d26c769d7d
    name: Windows Default Domain GPO Modification
    reason: Tampering with Default Domain (Controllers) Policy is the typical vehicle for domain-wide task deployment and defence weakening.
  - id: 5f87308a-0a5b-4623-ae15-d8fa1809bc60
    name: Suspicious Files in Default GPO Folder
    reason: Payload binaries/scripts staged in SYSVOL GPO folders are what the GPO scheduled task executes on every targeted host.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'DCSync is a common precursor: attacker obtains domain-admin-level rights/credentials before gaining the ability to write GPOs.'
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: 'Downstream effect on client hosts: the GPO-pushed task materialises as a 4698 task creation on endpoints.'
  - id: 424273ea-7cf8-43a6-b712-375f925e481f
    name: Scheduled Task Executed From A Suspicious Location
    reason: Execution stage of the pushed task on targeted machines launching the payload from a suspicious path.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Ransomware operators clear logs on the DC/hosts right after staging mass deployment to hinder investigation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other GPO object modifications on the DC (5136/5137/5141)
    query: (data_win_system_eventID:"5136" OR data_win_system_eventID:"5137" OR data_win_system_eventID:"5141") AND (data_win_eventdata_objectClass:"groupPolicyContainer" OR data_win_eventdata_attributeLDAPDisplayName:*gPC* OR data_win_eventdata_attributeLDAPDisplayName:"versionNumber")
    pivot_on:
    - host
    window: 2h
  - name: SYSVOL file writes to GPO folders (scripts, tasks, payloads)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:*SYSVOL AND (data_win_eventdata_accessList:*WriteData* OR data_win_eventdata_accessList:*%%4417* OR data_win_eventdata_accessList:*AppendData*) AND (data_win_eventdata_relativeTargetName:*Policies* )
    pivot_on:
    - host
    - user
    window: 2h
  - name: Scheduled task creation/update events (4698/4702) and schtasks use
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4702") OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Anti-recovery and ransomware precursors (shadow copies, bcdedit, log clearing)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)) OR data_win_system_eventID:"1102"
    pivot_on:
    - host
    window: 4h
  - name: Privileged logon and remote admin by the acting account (4672/4624 type 3,10)
    query: data_win_system_eventID:"4672" OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10"))
    pivot_on:
    - user
    window: 6h
