name: Active Directory User Backdoors
id: 300bac00-e041-4ee2-9c36-e262656a6ecc
version: 1
schema_version: "1.0"
date: "2024-02-26"
author: "@neu5ron"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 300bac00-e041-4ee2-9c36-e262656a6ecc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects scenarios where one can control another users or computers account
  without having to use their credentials. MITRE ATT&CK: T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4738"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_allowedToDelegateTo: ""
                                - term:
                                    data_win_eventdata_allowedToDelegateTo: "-"
                                - bool:
                                    must_not:
                                      - exists:
                                          field: "data_win_eventdata_allowedToDelegateTo"
                              minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5136"
                    - term:
                        data_win_eventdata_attributeLDAPDisplayName:
                          value: "msDS-AllowedToDelegateTo"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5136"
                    - term:
                        data_win_eventdata_objectClass:
                          value: "user"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_attributeLDAPDisplayName:
                          value: "servicePrincipalName"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5136"
                    - term:
                        data_win_eventdata_attributeLDAPDisplayName:
                          value: "msDS-AllowedToActOnBehalfOfOtherIdentity"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_allowedToDelegateTo
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_objectClass
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4738'; data_win_eventdata_allowedToDelegateTo
  equals ''; data_win_eventdata_allowedToDelegateTo equals '-', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://msdn.microsoft.com/en-us/library/cc220234.aspx
  - https://adsecurity.org/?p=3466
  - https://blog.harmj0y.net/redteaming/another-word-on-delegation/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    Active Directory User Backdoors detected on host $agent_name$. Matched
    data_win_eventdata_allowedToDelegateTo:
    $data_win_eventdata_allowedToDelegateTo$. Matched
    data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. MITRE ATT&CK: T1098
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_allowedToDelegateTo
      type: other
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1098
  custom_tags:
    - active
    - directory
    - backdoors
    - windows_security
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"4738" AND NOT (data_win_eventdata_allowedToDelegateTo:"" OR data_win_eventdata_allowedToDelegateTo:"-" OR NOT _exists_:data_win_eventdata_allowedToDelegateTo)) OR (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Mm][Ss][Dd][Ss]-[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Tt][Oo]/) OR (data_win_system_eventID:"5136" AND data_win_eventdata_objectClass:/[Uu][Ss][Ee][Rr]/ AND data_win_eventdata_attributeLDAPDisplayName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee]/) OR (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Mm][Ss][Dd][Ss]-[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Aa][Cc][Tt][Oo][Nn][Bb][Ee][Hh][Aa][Ll][Ff][Oo][Ff][Oo][Tt][Hh][Ee][Rr][Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 311b6ce2-7890-4383-a8c2-663a9f6b43cd
    name: Enabled User Right in AD to Control User Objects
    reason: 'Precursor: granting SeEnableDelegationPrivilege is what permits setting msDS-AllowedToDelegateTo on accounts; this rule is the delegation write that follows.'
  - id: 028c7842-4243-41cd-be6f-12f3cf1a26c7
    name: AD Object WriteDAC Access
    reason: 'Precursor: attackers modify an object''s DACL to gain write rights over a user/computer before altering its delegation or SPN attributes.'
  - id: d00a9a72-2c09-4459-ad03-5e0a23351e36
    name: Suspicious LDAP-Attributes Used
    reason: 'Co-occurring: LDAP attribute writes (e.g. SPN, delegation, shadow credentials) by the same actor are the same AD object-backdoor tradecraft.'
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: 'Follow-on: a backdoored servicePrincipalName makes the user Kerberoastable, shown as RC4 service ticket requests (4769).'
  - id: f6de9536-0441-4b3f-a646-f4e00f300ffd
    name: Weak Encryption Enabled and Kerberoast
    reason: 'Co-occurring: weakening supported encryption types alongside SPN or delegation changes is the Kerberoast setup for cracking the account.'
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: 'Follow-on: abusing the delegation (S4U2Proxy/RBCD) yields forged or impersonated Kerberos tickets and Kerberos failures from the same account.'
  - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
    name: Addition of SID History to Active Directory Object
    reason: 'Co-occurring persistence: SID history injection is another account-level AD backdoor used with delegation abuse for privilege inheritance.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Follow-on: once delegation or ACL rights are in place, attackers escalate to DCSync to extract all domain credentials.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberos service ticket requests (RC4/delegation) after AD attribute change
    query: data_win_system_eventID:"4769" AND (data_win_eventdata_ticketEncryptionType:"0x17" OR data_win_eventdata_ticketEncryptionType:"0x18" OR data_win_eventdata_transmittedServices:*)
    pivot_on:
    - user
    window: 6h
  - name: Other directory object modifications by this account
    query: (data_win_system_eventID:"5136" OR data_win_system_eventID:"5137" OR data_win_system_eventID:"5141" OR data_win_system_eventID:"4742" OR data_win_system_eventID:"4738")
    pivot_on:
    - user
    window: 4h
  - name: Delegation-abuse and AD attack tooling on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss]4[Uu].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ss][Pp][Nn].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)
    pivot_on:
    - host
    window: 4h
  - name: Network logons using this account after the change
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")
    pivot_on:
    - user
    window: 6h
  - name: Directory replication and DC-sync access requests
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:/.*1131f6a[ad]-9c07-11d1-f79f-00c04fc2dcd2.*/ OR data_win_eventdata_properties:/.*89e95b76-444d-4c62-991a-0facbeda640c.*/)
    pivot_on:
    - user
    window: 6h
