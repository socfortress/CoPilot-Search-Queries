name: Windows Access Token Manipulation SeDebugPrivilege
id: windows-access-token-manipulation-sedebugprivilege-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects a process enabling SeDebugPrivilege privilege token via Windows 
  Security Event 4703. SeDebugPrivilege allows inspecting and modifying 
  memory of other processes, enabling credential dumping and code injection. 
  Used by AsyncRAT, DarkGate, ValleyRAT, PlugX, Brute Ratel C4, and many 
  other threat actors.

data_source:
  - Windows Security Event 4703

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4703"
        - wildcard:
            data_win_eventdata_enabledPrivilegeList: "*SeDebugPrivilege*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_processName: "*\\Program File*"
              - wildcard:
                  data_win_eventdata_processName: "*\\System32\\lsass.exe*"
              - wildcard:
                  data_win_eventdata_processName: "*\\System32\\svchost.exe*"
              - wildcard:
                  data_win_eventdata_processName: "*\\SysWOW64\\lsass.exe*"
              - wildcard:
                  data_win_eventdata_processName: "*\\SysWOW64\\svchost.exe*"
            minimum_should_match: 1
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_processName
    - data_win_eventdata_processId
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectDomainName
    - data_win_eventdata_targetUserName
    - data_win_eventdata_enabledPrivilegeList

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    required: false
    default: "now-24h"
  END_TIME:
    type: datetime
    required: false
    default: "now"

how_to_implement: >
  Requires Windows Security Event 4703 (Token Right Adjusted Events). 
  Enable via: auditpol /set /subcategory:"Token Right Adjusted Events" /success:enable. 
  Ensure Wazuh agent forwards Security channel events. Field names may 
  vary — verify field mapping after enabling 4703 events.

known_false_positives: >
  Some native binaries and browser applications request SeDebugPrivilege. 
  Common exclusions: Program Files, lsass.exe, svchost.exe. Filter as needed.

references:
  - https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4703
  - https://blog.palantir.com/windows-privilege-abuse-auditing-detection-and-defense-3078a403d74e
  - https://attack.mitre.org/techniques/T1134/002/

response:
  message: >
    SeDebugPrivilege enabled by $data_win_eventdata_processName$ on $agent_name$. 
    User: $data_win_eventdata_subjectUserName$. 
    Possible credential dumping or code injection. MITRE ATT&CK: T1134.002
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - AsyncRAT
    - DarkGate Malware
    - ValleyRAT
    - PlugX
    - Brute Ratel C4
    - CISA AA23-347A
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.002
  custom_tags:
    - sedebugprivilege
    - token_manipulation
    - privilege_escalation
    - credential_dumping
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4703" AND data_win_eventdata_enabledPrivilegeList:/.*SeDebugPrivilege.*/ AND NOT (data_win_eventdata_processName:/.*Program File.*/ OR data_win_eventdata_processName:/.*\\\\System32\\\\lsass\.exe.*/ OR data_win_eventdata_processName:/.*\\\\System32\\\\svchost\.exe.*/ OR data_win_eventdata_processName:/.*\\\\SysWOW64\\\\lsass\.exe.*/ OR data_win_eventdata_processName:/.*\\\\SysWOW64\\\\svchost\.exe.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d522eca2-2973-4391-a3e0-ef0374321dae
    name: Abused Debug Privilege by Arbitrary Parent Processes
    reason: 'Process-creation view of the same SeDebugPrivilege abuse: a non-system parent spawning a child holding the debug privilege, co-occurring with 4703 enablement.'
  - id: 4be8b654-0c01-4c9d-a10c-6b28467fc651
    name: LSASS Access From Potentially White-Listed Processes
    reason: SeDebugPrivilege is the prerequisite for opening lsass with read access; this Sysmon 10 hit is the direct follow-on.
  - id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    reason: Credential-dumping tool opening lsass after enabling the debug privilege on the same host.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: rundll32 comsvcs MiniDump needs SeDebugPrivilege; a living-off-the-land memory dump that follows privilege enablement.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump targeting lsass is a typical consumer of SeDebugPrivilege and the expected next step toward credential theft.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz privilege::debug / sekurlsa is the classic source of a 4703 SeDebugPrivilege event; confirms credential dumping.
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: Debug privilege also enables remote thread injection into lsass by password dumpers, an alternate path from the same privilege.
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: SeDebugPrivilege enables injection into other processes (AsyncRAT, PlugX, Brute Ratel); remote-thread creation is the injection that follows.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS handle access by unusual processes
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ AND NOT data_win_eventdata_sourceImage:/.*([Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Ww][Ii][Nn][Ii][Nn][Ii][Tt]|[Cc][Ss][Rr][Ss][Ss]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]).*/
    pivot_on:
    - host
    window: 1h
  - name: Credential dumper tooling and LSASS dump command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Ll][Ss][Aa][Ss][Ss]).*/ OR data_win_eventdata_image:/.*\\([Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Remote thread injection into other processes
    query: data_win_system_eventID:"8" AND NOT data_win_eventdata_sourceImage:/.*\\([Cc][Ss][Rr][Ss][Ss]|[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Dump files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Zz][Ii][Pp]|[Dd][Aa][Tt])/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.([Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])/)
    pivot_on:
    - host
    window: 2h
  - name: Debug-privileged logons by this account
    query: data_win_system_eventID:"4672" AND data_win_eventdata_privilegeList:*SeDebugPrivilege*
    pivot_on:
    - user
    window: 6h
