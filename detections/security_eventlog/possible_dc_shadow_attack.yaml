name: Possible DC Shadow Attack
id: 32e19d25-4aed-4860-a55a-be99cb0bf7ed
version: 1
schema_version: "1.0"
date: "2022-10-17"
author: Ilyas Ochkov, oscd.community, Chakib Gzenayi (@Chak092), Hosni Mribah
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 32e19d25-4aed-4860-a55a-be99cb0bf7ed
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DCShadow via create new SPN. MITRE ATT&CK: T1207.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4742"
                    - wildcard:
                        data_win_eventdata_servicePrincipalNames:
                          value: "*GC/*"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5136"
                    - term:
                        data_win_eventdata_attributeLDAPDisplayName:
                          value: "servicePrincipalName"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_attributeValue:
                          value: "GC/*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_servicePrincipalNames
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_attributeValue
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4742';
  data_win_eventdata_servicePrincipalNames matches '*GC/*';
  data_win_system_eventID equals '5136', among other conditions.

known_false_positives: >
  Valid on domain controllers; exclude known DCs. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/gentilkiwi/status/1003236624925413376
  - https://gist.github.com/gentilkiwi/dcc132457408cf11ad2061340dcb53c2
  - https://web.archive.org/web/20180203014709/https://blog.alsid.eu/dcshadow-explained-4510f52fc19d?gi=c426ac876c48
  - https://attack.mitre.org/techniques/T1207/

response:
  message: >
    Possible DC Shadow Attack detected on host $agent_name$. Matched
    data_win_eventdata_servicePrincipalNames:
    $data_win_eventdata_servicePrincipalNames$. Matched
    data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. MITRE ATT&CK: T1207
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_servicePrincipalNames
      type: other
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1207
  custom_tags:
    - shadow
    - attack
    - windows_security
    - credential_access
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"4742" AND data_win_eventdata_servicePrincipalNames:/.*[Gg][Cc]\/.*/) OR (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee]/ AND data_win_eventdata_attributeValue:/[Gg][Cc]\/.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: DCShadow is run via mimikatz lsadump::dcshadow (/push) on the attacker host; Mimikatz execution on the same host just before the GC/ SPN registration is the direct tooling precursor.
  - id: windows-mimikatz-binary-execution-001
    name: Windows Mimikatz Binary Execution
    reason: Same tooling precursor as above, catching renamed or binary-level mimikatz that is later used to stage and push the rogue DC objects.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: In-memory Invoke-Mimikatz can also run lsadump::dcshadow; a fileless precursor to the rogue-DC SPN change.
  - id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
    name: LSASS Access From Non System Account
    reason: DCShadow needs Domain Admin or SYSTEM rights; LSASS access earlier on the host is how the attacker obtained those credentials.
  - id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
    name: Password Dumper Activity on LSASS
    reason: Credential dumping on this host precedes the DA-level use needed to register a rogue domain controller.
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: 'DCSync and DCShadow are both directory-replication abuses by the same tool and often used together: DCSync to steal krbtgt, DCShadow to persist.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Replication rights abused from a non-DC identity on the same account or host confirms directory-replication abuse beyond the SPN change.
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: A typical DCShadow payload is persistence such as krbtgt or SIDHistory tampering, followed by forged ticket use.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mimikatz lsadump dcshadow staging and push on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: SYSTEM-context launch via PsExec or token theft on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]6?4?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Ss].*/) OR data_win_eventdata_commandLine:/.*[Tt][Oo][Kk][Ee][Nn]::[Ee][Ll][Ee][Vv][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Rogue DC object creation and sensitive AD attribute changes
    query: (data_win_system_eventID:"5137" AND (data_win_eventdata_objectClass:"nTDSDSA" OR data_win_eventdata_objectClass:"server")) OR (data_win_system_eventID:"5136" AND (data_win_eventdata_attributeLDAPDisplayName:"sIDHistory" OR data_win_eventdata_attributeLDAPDisplayName:"primaryGroupID" OR data_win_eventdata_attributeLDAPDisplayName:"adminCount" OR data_win_eventdata_attributeLDAPDisplayName:"msDS-AllowedToDelegateTo" OR data_win_eventdata_attributeLDAPDisplayName:"servicePrincipalName")) OR data_win_system_eventID:"4928" OR data_win_system_eventID:"4929"
    pivot_on:
    - user
    window: 4h
  - name: Directory replication rights exercised by this account
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:/.*1131f6a[ad]-9c07-11d1-f79f-00c04fc2dcd2.*/ OR data_win_eventdata_properties:/.*89e95b76-444d-4c62-991a-0facbeda640c.*/)
    pivot_on:
    - user
    window: 4h
  - name: Computer account modification and RC4 TGT requests by this account
    query: (data_win_system_eventID:"4742") OR (data_win_system_eventID:"4768" AND data_win_eventdata_ticketEncryptionType:"0x17")
    pivot_on:
    - user
    window: 6h
