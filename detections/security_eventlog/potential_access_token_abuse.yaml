name: Potential Access Token Abuse
id: 02f7c9c1-1ae8-4c6a-8add-04693807f92f
version: 1
schema_version: "1.0"
date: "2023-04-26"
author: Michaela Adams, Zach Mathis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 02f7c9c1-1ae8-4c6a-8add-04693807f92f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential token impersonation and theft. Example, when using
  "DuplicateToken(Ex)" and "ImpersonateLoggedOnUser" with the
  "LOGON32_LOGON_NEW_CREDENTIALS flag". MITRE ATT&CK: T1134.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4624"
        - term:
            data_win_eventdata_logonType: "9"
        - term:
            data_win_eventdata_logonProcessName:
              value: "Advapi"
              case_insensitive: true
        - term:
            data_win_eventdata_authenticationPackageName:
              value: "Negotiate"
              case_insensitive: true
        - term:
            data_win_eventdata_impersonationLevel: "%%1833"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_logonProcessName
    - data_win_eventdata_authenticationPackageName
    - data_win_eventdata_impersonationLevel
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_logonType equals
  '9'; data_win_eventdata_logonProcessName equals 'Advapi', among other
  conditions.

known_false_positives: >
  Anti-Virus. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/fr/blog/how-attackers-abuse-access-token-manipulation
  - https://www.manageengine.com/log-management/cyber-security/access-token-manipulation.html
  - https://attack.mitre.org/techniques/T1134/001/

response:
  message: >
    Potential Access Token Abuse detected on host $agent_name$. Matched
    data_win_eventdata_logonType: $data_win_eventdata_logonType$. Matched
    data_win_eventdata_logonProcessName: $data_win_eventdata_logonProcessName$.
    MITRE ATT&CK: T1134.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_logonProcessName
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.001
  custom_tags:
    - token
    - abuse
    - windows_security
    - privilege_escalation
    - stealth
    - stp_4u
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/[Aa][Dd][Vv][Aa][Pp][Ii]/ AND data_win_eventdata_authenticationPackageName:/[Nn][Ee][Gg][Oo][Tt][Ii][Aa][Tt][Ee]/ AND data_win_eventdata_impersonationLevel:"%%1833"

correlation:
