name: Potential Access Token Abuse
id: 02f7c9c1-1ae8-4c6a-8add-04693807f92f
version: 1
schema_version: "1.0"
date: "2023-04-26"
author: Michaela Adams, Zach Mathis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 02f7c9c1-1ae8-4c6a-8add-04693807f92f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential token impersonation and theft. Example, when using
  "DuplicateToken(Ex)" and "ImpersonateLoggedOnUser" with the
  "LOGON32_LOGON_NEW_CREDENTIALS flag". MITRE ATT&CK: T1134.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4624"
        - term:
            data_win_eventdata_logonType: "9"
        - term:
            data_win_eventdata_logonProcessName:
              value: "Advapi"
              case_insensitive: true
        - term:
            data_win_eventdata_authenticationPackageName:
              value: "Negotiate"
              case_insensitive: true
        - term:
            data_win_eventdata_impersonationLevel: "%%1833"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_logonProcessName
    - data_win_eventdata_authenticationPackageName
    - data_win_eventdata_impersonationLevel
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_logonType equals
  '9'; data_win_eventdata_logonProcessName equals 'Advapi', among other
  conditions.

known_false_positives: >
  Anti-Virus. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/fr/blog/how-attackers-abuse-access-token-manipulation
  - https://www.manageengine.com/log-management/cyber-security/access-token-manipulation.html
  - https://attack.mitre.org/techniques/T1134/001/

response:
  message: >
    Potential Access Token Abuse detected on host $agent_name$. Matched
    data_win_eventdata_logonType: $data_win_eventdata_logonType$. Matched
    data_win_eventdata_logonProcessName: $data_win_eventdata_logonProcessName$.
    MITRE ATT&CK: T1134.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_logonProcessName
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.001
  custom_tags:
    - token
    - abuse
    - windows_security
    - privilege_escalation
    - stealth
    - stp_4u
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/[Aa][Dd][Vv][Aa][Pp][Ii]/ AND data_win_eventdata_authenticationPackageName:/[Nn][Ee][Gg][Oo][Tt][Ii][Aa][Tt][Ee]/ AND data_win_eventdata_impersonationLevel:"%%1833"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: Same 4624 logon type 9 / Advapi / Negotiate fingerprint produced by sekurlsa::pth; confirms the NewCredentials logon is credential-forging, not benign runas /netonly.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Forged-credential logon on the host is followed by NTLM network logons using the stolen hash against other machines.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: Alternate credentials supplied via 4648 are the usual companion of a type 9 NewCredentials logon when pivoting to remote systems.
  - id: 472159c5-31b9-4f56-b794-b766faa8b0a7
    name: Suspicious LSASS Access Via MalSecLogon
    reason: Type 9 logons are created through the Secondary Logon service; this detects the seclogon-based LSASS handle abuse used by the same tooling.
  - id: windows-access-token-winlogon-duplicate-handle-001
    name: Windows Access Token Manipulation Winlogon Duplicate Token Handle
    reason: 'Direct precursor: DuplicateToken of a SYSTEM winlogon token is the other half of the token theft/impersonation this alert flags.'
  - id: windows-access-token-manipulation-sedebugprivilege-001
    name: Windows Access Token Manipulation SeDebugPrivilege
    reason: Token theft from other processes requires SeDebugPrivilege; its enablement just before the logon corroborates token manipulation.
  - id: 50d66fb0-03f8-4da0-8add-84e77d12a020
    name: Suspicious RunAs-Like Flag Combination
    reason: Process-creation view of the runas /netonly-style command that causes a LOGON32_LOGON_NEW_CREDENTIALS logon.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz token::elevate and sekurlsa::pth are the common source of impersonation and type 9 logons.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Token impersonation / runas-netonly / credential tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Oo][Nn][Ll][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Kk][Ee][Nn]::.*/ OR data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt].*/ OR data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Aa][Ss]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Rr][Uu][Bb][Ee][Uu][Ss]|[Ii][Nn][Cc][Oo][Gg][Nn][Ii][Tt][Oo]|[Ss][Hh][Aa][Rr][Pp][Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ii][Oo][Nn])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS access via seclogon or token-theft access masks
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_callTrace:/.*[Ss][Ee][Cc][Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x143a")
    pivot_on:
    - host
    window: 1h
  - name: Explicit-credential logons (4648) by this account
    query: data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 6h
  - name: Outbound SMB/WinRM/RPC connections and remote service creation after impersonation
    query: ((data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"135")) OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4697")
    pivot_on:
    - host
    window: 2h
  - name: Post-impersonation privilege and domain discovery
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*\/(priv|all|groups).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?\s+(group|localgroup|user).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ll][Ii][Ss][Tt].*/)
    pivot_on:
    - host
    window: 1h
