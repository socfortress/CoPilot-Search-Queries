name: Suspicious Scheduled Task Update
id: 614cf376-6651-47c4-9dcc-6b9527f749f4
version: 1
schema_version: "1.0"
date: "2022-12-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 614cf376-6651-47c4-9dcc-6b9527f749f4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects update to a scheduled task event that contain suspicious keywords.
  MITRE ATT&CK: T1053.005.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4702"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*\\\\WINDOWS\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*C:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*\\\\Temporary Internet*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*C:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*C:\\\\Perflogs\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*regsvr32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*rundll32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*cmd.exe</Command>*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*cmd</Command>*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*<Arguments>/c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*<Arguments>/k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*<Arguments>/r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*pwsh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*mshta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*wscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*cscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*certutil*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*bitsadmin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*bash.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*bash *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*scrcons*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*wmic *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*wmic.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*forfiles*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*scriptrunner*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskContentNew:
                    value: "*hh.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskContentNew
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4702'; data_win_eventdata_taskContentNew
  matches '*\AppData\Local\Temp\*'; data_win_eventdata_taskContentNew matches
  '*\AppData\Roaming\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4698
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Suspicious Scheduled Task Update detected on host $agent_name$. Matched
    data_win_eventdata_taskContentNew: $data_win_eventdata_taskContentNew$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskContentNew
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - scheduled
    - update
    - windows_security
    - execution
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4702" AND (data_win_eventdata_taskContentNew:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_taskContentNew:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_taskContentNew:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_taskContentNew:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_taskContentNew:/.*[Cc]:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_taskContentNew:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_taskContentNew:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_taskContentNew:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt].*/ OR data_win_eventdata_taskContentNew:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_taskContentNew:/.*[Cc]:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/) AND (data_win_eventdata_taskContentNew:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR data_win_eventdata_taskContentNew:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_taskContentNew:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]\<\/[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\>.*/ OR data_win_eventdata_taskContentNew:/.*[Cc][Mm][Dd]\<\/[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\>.*/ OR data_win_eventdata_taskContentNew:/.*\<[Aa][Rr][Gg][Uu][Mm][Ee][Nn][Tt][Ss]\>\/[Cc] .*/ OR data_win_eventdata_taskContentNew:/.*\<[Aa][Rr][Gg][Uu][Mm][Ee][Nn][Tt][Ss]\>\/[Kk] .*/ OR data_win_eventdata_taskContentNew:/.*\<[Aa][Rr][Gg][Uu][Mm][Ee][Nn][Tt][Ss]\>\/[Rr] .*/ OR data_win_eventdata_taskContentNew:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_taskContentNew:/.*[Pp][Ww][Ss][Hh].*/ OR data_win_eventdata_taskContentNew:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_taskContentNew:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_taskContentNew:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_taskContentNew:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_taskContentNew:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_taskContentNew:/.*[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_taskContentNew:/.*[Bb][Aa][Ss][Hh] .*/ OR data_win_eventdata_taskContentNew:/.*[Ss][Cc][Rr][Cc][Oo][Nn][Ss].*/ OR data_win_eventdata_taskContentNew:/.*[Ww][Mm][Ii][Cc] .*/ OR data_win_eventdata_taskContentNew:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_taskContentNew:/.*[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_taskContentNew:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_taskContentNew:/.*[Hh][Hh]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: 'Sibling 4698 detection: attackers who modify a task (4702) often also create new tasks with the same LOLBin/user-writable-path payloads on the same host.'
  - id: 7595ba94-cf3b-4471-aa03-4f6baa9e5fad
    name: Important Scheduled Task Deleted/Disabled
    reason: 'Task tampering co-occurs: an attacker repurposing a legitimate task via update may disable or delete the genuine/security tasks around it.'
  - id: f6de6525-4509-495a-8a82-1f8b0ed73a00
    name: Remote Task Creation via ATSVC Named Pipe
    reason: If the task update came from a remote session, the atsvc pipe shows lateral task manipulation (remote persistence/execution) on the same host.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: 'Precursor: explicit-credential logon (runas/pass-the-hash style) is how an attacker obtains the rights to edit tasks, often as subjectUserName of the 4702.'
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: 'Process-level view of the same behaviour: schtasks.exe command line carrying suspicious payload patterns, confirming the task change from the process side.'
  - id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
    name: Suspicious Modification Of Scheduled Tasks
    reason: Process-creation counterpart for schtasks /change that hijacks an existing task's action to run a suspicious binary; directly corroborates the 4702.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: 'Escalation follow-on: the modified task being set to run as SYSTEM turns persistence into privilege escalation.'
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: 'Common post-persistence defense evasion: the actor clears the Security log, destroying the 4702/4698 evidence.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Task payload executed from user-writable path via LOLBin
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ee][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: schtasks.exe modifying or running tasks
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*\/change* OR data_win_eventdata_commandLine:*\/create* OR data_win_eventdata_commandLine:*\/run* OR data_win_eventdata_commandLine:*\/tr*)
    pivot_on:
    - host
    window: 2h
  - name: Payload staged in task-referenced directories
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/) AND (data_win_eventdata_targetFilename:*.exe OR data_win_eventdata_targetFilename:*.dll OR data_win_eventdata_targetFilename:*.ps1 OR data_win_eventdata_targetFilename:*.bat OR data_win_eventdata_targetFilename:*.vbs OR data_win_eventdata_targetFilename:*.hta)
    pivot_on:
    - host
    window: 4h
  - name: Outbound DNS/network from script and LOLBin processes
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other task changes and privileged logons by this account
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4699" OR data_win_system_eventID:"4701" OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 6h
