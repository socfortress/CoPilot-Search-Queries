name: Windows Splashtop Software Usage
id: Windows_Splashtop_Software Usage
version: 1
schema_version: "1.0"
date: "2026-03-16"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution of Splashtop remote access software binaries (SplashtopSOS.exe,
  SRAgent.exe, SRService.exe, SrApp.exe) or processes running from Splashtop
  installation paths. Splashtop is a legitimate RMM/remote access tool that is
  increasingly abused by attackers for unauthorized remote access and lateral
  movement. Detection covers both Sysmon EventID 1 (with company/originalFileName
  enrichment) and Security EventID 4688 (process creation auditing).
  Excludes legitimate Atera RMM-launched instances.

data_source:
  - Sysmon EventID 1 (ProcessCreate)
  - Windows Security EventID 4688 (Process Creation Auditing)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "1"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image: "*\\SplashtopSOS.exe"
                          - wildcard:
                              data_win_eventdata_image: "*\\SRAgent.exe"
                          - wildcard:
                              data_win_eventdata_image: "*\\SRService.exe"
                          - wildcard:
                              data_win_eventdata_image: "*\\SrApp.exe"
                          - wildcard:
                              data_win_eventdata_image: "*Splashtop*"
                          - term:
                              data_win_eventdata_company: "Splashtop Inc."
                          - wildcard:
                              data_win_eventdata_originalFileName: "*SplashtopSOS.exe*"
                          - wildcard:
                              data_win_eventdata_originalFileName: "*SRAgent.exe*"
                          - wildcard:
                              data_win_eventdata_originalFileName: "*SRService.exe*"
                        minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4688"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_newProcessName: "*\\SplashtopSOS.exe"
                          - wildcard:
                              data_win_eventdata_newProcessName: "*\\SRAgent.exe"
                          - wildcard:
                              data_win_eventdata_newProcessName: "*\\SRService.exe"
                          - wildcard:
                              data_win_eventdata_newProcessName: "*\\SrApp.exe"
                          - wildcard:
                              data_win_eventdata_newProcessName: "*Splashtop*"
                        minimum_should_match: 1
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_image: "*ATERA*"
        - wildcard:
            data_win_eventdata_parentImage: "*ATERA*"
        - wildcard:
            data_win_eventdata_newProcessName: "*ATERA*"
        - wildcard:
            data_win_eventdata_parentProcessName: "*ATERA*"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_newProcessName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentProcessName
    - data_win_eventdata_company
    - data_win_eventdata_originalFileName
    - data_win_eventdata_user
    - data_win_eventdata_subjectUserName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-16 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-16 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with:
  1. Sysmon installed and configured to log process creation events (EventID 1)
  2. Windows Security Auditing enabled for Process Creation (EventID 4688):
     auditpol /set /subcategory:"Process Creation" /success:enable
  Both event sources confirmed working in this environment.
  VALIDATED — SplashtopSOS.exe simulation confirmed hits on both EventID 1
  and EventID 4688. EventID 1 provides richer metadata (company, originalFileName)
  while EventID 4688 provides Security channel coverage.

known_false_positives: >
  Legitimate Splashtop deployments managed through Atera RMM are excluded.
  Additional filters may be required for other authorized RMM deployments
  that use Splashtop. Review parent process context to distinguish authorized
  from unauthorized usage.

references:
  - https://attack.mitre.org/techniques/T1219/

response:
  message: >
    Splashtop remote access software detected on $agent_name$.
    Process: $data_win_eventdata_image$$data_win_eventdata_newProcessName$.
    User: $data_win_eventdata_user$$data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1219
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_newProcessName
      type: process_name

tags:
  analytic_story:
    - Remote Access Software Abuse
    - Living Off The Land
  asset_type: Endpoint
  mitre_attack_id:
    - T1219
  custom_tags:
    - splashtop
    - remote_access
    - rmm_abuse
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\SplashtopSOS\.exe/ OR data_win_eventdata_image:/.*\\SRAgent\.exe/ OR data_win_eventdata_image:/.*\\SRService\.exe/ OR data_win_eventdata_image:/.*\\SrApp\.exe/ OR data_win_eventdata_image:/.*Splashtop.*/ OR data_win_eventdata_company:"Splashtop Inc." OR data_win_eventdata_originalFileName:/.*SplashtopSOS\.exe/ OR data_win_eventdata_originalFileName:/.*SRAgent\.exe/ OR data_win_eventdata_originalFileName:/.*SRService\.exe/)) OR (data_win_system_eventID:"4688" AND (data_win_eventdata_newProcessName:/.*\\SplashtopSOS\.exe/ OR data_win_eventdata_newProcessName:/.*\\SRAgent\.exe/ OR data_win_eventdata_newProcessName:/.*\\SRService\.exe/ OR data_win_eventdata_newProcessName:/.*\\SrApp\.exe/ OR data_win_eventdata_newProcessName:/.*Splashtop.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c8b00925-926c-47e3-beea-298fd563728e
    name: Remote Access Tool Services Have Been Installed - Security
    reason: Splashtop's SRService is installed as a service (4697) when the agent is deployed; install-time precursor to the process execution.
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: System-log 7045 service install of a remote access agent on the same host confirms persistent remote access was set up, not a one-off run.
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Attackers stack several RMM tools for redundancy; other remote access binaries on the same host indicate a broader unauthorized RMM footprint.
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: This rule excludes Atera-launched Splashtop; an Atera install on the same host shows whether Splashtop is MSP-managed or part of an attacker RMM chain.
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: Splashtop Streamer is commonly delivered as an MSI pulled from the web; likely delivery precursor.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Second remote access tool on the same host is typical of attackers keeping fallback RMM access.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: ScreenConnect is another heavily abused RMM; co-presence with Splashtop signals layered unauthorized remote access.
  - id: b6d98a4f-cef0-4abf-bbf6-24132854a83d
    name: Remote Access Tool - GoToAssist Execution
    reason: Another commercial remote support tool abused alongside Splashtop in help-desk-impersonation intrusions.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Splashtop/RMM installers and service persistence
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]plashtop.*/ OR data_win_eventdata_commandLine:/.*[Ss][Rr][Ss]ervice.*/ OR data_win_eventdata_commandLine:/.*[Ss][Rr][Aa]gent.*/ OR (data_win_eventdata_image:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(silent|\/[Qq][Nn]|\/[Qq][Bb]).*/))
    pivot_on:
    - host
    window: 4h
  - name: Splashtop and RMM relay DNS and network activity
    query: (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*splashtop* OR data_win_eventdata_queryName:*anydesk* OR data_win_eventdata_queryName:*screenconnect* OR data_win_eventdata_queryName:*teamviewer* OR data_win_eventdata_queryName:*atera*)) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:*Splashtop*)
    pivot_on:
    - host
    window: 4h
  - name: RMM installer files dropped to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Ss]plashtop|[Ss][Rr][Ss]ervice|[Ss][Rr][Aa]gent).*/ OR (data_win_eventdata_targetFilename:/.*\.[Mm][Ss][Ii]/ AND data_win_eventdata_image:/.*([Pp]owershell|[Cc]url|[Bb]its[Aa]dmin|[Cc]hrome|[Mm]sedge|[Ff]irefox)\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 4h
  - name: Defender/firewall tampering, account creation and LSASS access after remote tool
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|[Nn]etsh.*[Aa]dv[Ff]irewall).*/ OR data_win_eventdata_commandLine:/.*([Nn]et1? +user.*\/[Aa]dd|[Nn]et1? +localgroup +[Aa]dministrators|[Ss]chtasks.*\/[Cc]reate).*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Logons by this user around remote tool use
    query: data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 6h
