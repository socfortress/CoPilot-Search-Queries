name: First Time Seen Remote Named Pipe
id: 52d8b0c6-53d6-439a-9e41-52ad442ad9ad
version: 1
schema_version: "1.0"
date: "2023-03-14"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 52d8b0c6-53d6-439a-9e41-52ad442ad9ad
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This detection excludes known namped pipes accessible remotely and notify on
  newly observed ones, may help to detect lateral movement and remote exec using
  named pipes. MITRE ATT&CK: T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_shareName:
              value: "\\\\*\\IPC$"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_relativeTargetName"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "atsvc"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "samr"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "lsarpc"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "lsass"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "winreg"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "netlogon"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "srvsvc"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "protected_storage"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "wkssvc"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "browser"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "netdfs"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "svcctl"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "spoolss"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "ntsvcs"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "LSM_API_service"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "HydraLsPipe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "TermSrv_API_service"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "MsFteWds"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "sql\\query"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_relativeTargetName:
                          value: "eventlog"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName equals
  '\\*\IPC$'; data_win_eventdata_relativeTargetName equals 'atsvc', among other
  conditions.

known_false_positives: >
  Update the excluded named pipe to filter out any newly observed legit named
  pipe. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://twitter.com/menasec1/status/1104489274387451904
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    First Time Seen Remote Named Pipe detected on host $agent_name$. Matched
    data_win_eventdata_shareName: $data_win_eventdata_shareName$. Matched
    data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - first
    - named
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Ii][Pp][Cc]\$/ AND _exists_:data_win_eventdata_relativeTargetName AND NOT (data_win_eventdata_relativeTargetName:/[Aa][Tt][Ss][Vv][Cc]/ OR data_win_eventdata_relativeTargetName:/[Ss][Aa][Mm][Rr]/ OR data_win_eventdata_relativeTargetName:/[Ll][Ss][Aa][Rr][Pp][Cc]/ OR data_win_eventdata_relativeTargetName:/[Ll][Ss][Aa][Ss][Ss]/ OR data_win_eventdata_relativeTargetName:/[Ww][Ii][Nn][Rr][Ee][Gg]/ OR data_win_eventdata_relativeTargetName:/[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]/ OR data_win_eventdata_relativeTargetName:/[Ss][Rr][Vv][Ss][Vv][Cc]/ OR data_win_eventdata_relativeTargetName:/[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd]_[Ss][Tt][Oo][Rr][Aa][Gg][Ee]/ OR data_win_eventdata_relativeTargetName:/[Ww][Kk][Ss][Ss][Vv][Cc]/ OR data_win_eventdata_relativeTargetName:/[Bb][Rr][Oo][Ww][Ss][Ee][Rr]/ OR data_win_eventdata_relativeTargetName:/[Nn][Ee][Tt][Dd][Ff][Ss]/ OR data_win_eventdata_relativeTargetName:/[Ss][Vv][Cc][Cc][Tt][Ll]/ OR data_win_eventdata_relativeTargetName:/[Ss][Pp][Oo][Oo][Ll][Ss][Ss]/ OR data_win_eventdata_relativeTargetName:/[Nn][Tt][Ss][Vv][Cc][Ss]/ OR data_win_eventdata_relativeTargetName:/[Ll][Ss][Mm]_[Aa][Pp][Ii]_[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_relativeTargetName:/[Hh][Yy][Dd][Rr][Aa][Ll][Ss][Pp][Ii][Pp][Ee]/ OR data_win_eventdata_relativeTargetName:/[Tt][Ee][Rr][Mm][Ss][Rr][Vv]_[Aa][Pp][Ii]_[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_relativeTargetName:/[Mm][Ss][Ff][Tt][Ee][Ww][Dd][Ss]/ OR data_win_eventdata_relativeTargetName:/[Ss][Qq][Ll]\\[Qq][Uu][Ee][Rr][Yy]/ OR data_win_eventdata_relativeTargetName:/[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
    - id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
      name: "Audit CVE Event"
      reason: "next kill-chain tactic: Lateral Movement"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Remote-execution / lateral-movement tooling on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))'
      pivot_on: [host]
      window: 2h
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672")'
      pivot_on: [user]
      window: 6h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
