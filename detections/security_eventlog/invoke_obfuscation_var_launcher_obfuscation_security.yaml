name: Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION - Security
id: 4c54ba8f-73d2-4d40-8890-d9cf1dca3d30
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4c54ba8f-73d2-4d40-8890-d9cf1dca3d30
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via VAR++ LAUNCHER. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*&&set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*cmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*/c*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_serviceFileName:
              value: "*-f*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceFileName: "*{0}*"
              - wildcard:
                  data_win_eventdata_serviceFileName: "*{1}*"
              - wildcard:
                  data_win_eventdata_serviceFileName: "*{2}*"
              - wildcard:
                  data_win_eventdata_serviceFileName: "*{3}*"
              - wildcard:
                  data_win_eventdata_serviceFileName: "*{4}*"
              - wildcard:
                  data_win_eventdata_serviceFileName: "*{5}*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*&&set*'; data_win_eventdata_serviceFileName matches '*cmd*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION - Security detected on host
    $agent_name$. Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - launcher
    - windows_security
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceFileName:/.*\&\&[Ss][Ee][Tt].*/ AND data_win_eventdata_serviceFileName:/.*[Cc][Mm][Dd].*/ AND data_win_eventdata_serviceFileName:/.*\/[Cc].*/ AND data_win_eventdata_serviceFileName:/.*-[Ff].*/ AND (data_win_eventdata_serviceFileName:/.*\{0\}.*/ OR data_win_eventdata_serviceFileName:/.*\{1\}.*/ OR data_win_eventdata_serviceFileName:/.*\{2\}.*/ OR data_win_eventdata_serviceFileName:/.*\{3\}.*/ OR data_win_eventdata_serviceFileName:/.*\{4\}.*/ OR data_win_eventdata_serviceFileName:/.*\{5\}.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e9f55347-2928-4c06-88e5-1a7f8169942e
    name: Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION
    reason: Same VAR++ cmd /c set&&...{0}-f launcher seen as a process-creation command line; confirms the service binary actually executed and gives parent/user context.
  - id: dcf2db1f-f091-425b-a821-c05875b8925a
    name: Invoke-Obfuscation VAR+ Launcher - Security
    reason: Sibling Invoke-Obfuscation launcher variant installed as a service (4697); operators often try several variants from the same tooling.
  - id: fd0f5778-d3cb-4c9a-9695-66759d04702a
    name: Invoke-Obfuscation Obfuscated IEX Invocation - Security
    reason: Obfuscated IEX service installs from the same Invoke-Obfuscation toolkit are co-occurring variants of the same payload delivery.
  - id: 2a926e6a-4b81-4011-8a96-e36cc8c04302
    name: PowerShell Scripts Installed as Services - Security
    reason: Obfuscated PowerShell launched through a new service is the same 4697 service-as-execution primitive, flagged by its powershell service path.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Shows whether the obfuscated service was installed remotely or by an unusual client, separating local persistence from lateral movement.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Obfuscated cmd service payloads are the typical payload of PsExec-style remote service installs, indicating lateral movement tooling.
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: Services with cmd/PowerShell launchers are used for SYSTEM escalation after obfuscated execution; follow-on privilege escalation.
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: Attackers who install an obfuscated service often add a scheduled task as redundant persistence on the same host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Obfuscated cmd/PowerShell launcher process (set && ... -f format operator)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*\/[Cc].*&&[Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*-[Ff].*/
    pivot_on:
    - host
    window: 1h
  - name: Service control manager spawning shells or PowerShell on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: 'Deobfuscated PowerShell payload: download cradles and in-memory execution'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*Reflection.Assembly*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections from cmd/PowerShell after service install
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Other services and scheduled tasks created on this host (persistence breadth)
    query: data_win_system_eventID:("4697" OR "4698" OR "7045")
    pivot_on:
    - host
    window: 4h
