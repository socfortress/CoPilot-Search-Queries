name: Potential Secure Deletion with SDelete
id: 39a80702-d7ca-4a83-b776-525b1f86a36d
version: 1
schema_version: "1.0"
date: "2024-12-13"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39a80702-d7ca-4a83-b776-525b1f86a36d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects files that have extensions commonly seen while SDelete is used to wipe
  files. MITRE ATT&CK: T1070.004, T1027.005, T1485, T1553.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4656"
              - term:
                  data_win_system_eventID: "4663"
              - term:
                  data_win_system_eventID: "4658"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*.AAA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*.ZZZ"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_system_eventID equals '4663';
  data_win_system_eventID equals '4658', among other conditions.

known_false_positives: >
  Legitimate usage of SDelete. Files that are interacted with that have these
  extensions legitimately. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://jpcertcc.github.io/ToolAnalysisResultSheet/details/sdelete.htm
  - https://www.jpcert.or.jp/english/pub/sr/ir_research.html
  - https://learn.microsoft.com/en-gb/sysinternals/downloads/sdelete
  - https://attack.mitre.org/techniques/T1070/004/
  - https://attack.mitre.org/techniques/T1027/005/
  - https://attack.mitre.org/techniques/T1485/
  - https://attack.mitre.org/techniques/T1553/002/

response:
  message: >
    Potential Secure Deletion with SDelete detected on host $agent_name$.
    Matched data_win_eventdata_objectName: $data_win_eventdata_objectName$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1070.004, T1027.005,
    T1485, T1553.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.004
    - T1027.005
    - T1485
    - T1553.002
  custom_tags:
    - secure
    - deletion
    - sdelete
    - windows_security
    - impact
    - stealth
    - defense_impairment
    - s0195
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4656" OR data_win_system_eventID:"4663" OR data_win_system_eventID:"4658") AND (data_win_eventdata_objectName:/.*\.[Aa][Aa][Aa]/ OR data_win_eventdata_objectName:/.*\.[Zz][Zz][Zz]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a4824fca-976f-4964-b334-0621379e84c4
    name: Potential File Overwrite Via Sysinternals SDelete
    reason: 'Process-creation view of the same tool: the sdelete command line (-p/-s/-c/-z) that produces the .AAA/.ZZZ rename artifacts seen in the object-access audit; confirms the executing process and user.'
  - id: c1d867fe-8d95-4487-aab4-e53f2d339f90
    name: Renamed Sysinternals Sdelete Execution
    reason: Attackers rename sdelete.exe to evade name-based detection; artifacts on disk still show .AAA/.ZZZ, so this identifies the renamed binary behind the wipe.
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Alternative built-in free-space wiper (cipher /w) used for the same anti-forensic purpose; co-occurs when the operator switches wipe tooling.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Secure file deletion is usually paired with event log clearing to remove the remaining traces of the intrusion on the same host.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Log clearing/reconfiguration via PowerShell or other utilities executed alongside the wipe as part of the same cleanup phase.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Attackers disable object-access auditing before or after wiping so file deletions stop generating 4656/4663 evidence; causal link to the telemetry this rule relies on.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Destroying shadow copies removes recoverable copies of files that SDelete has just overwritten; common companion step in destructive or cleanup operations.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup destruction following or accompanying secure wipe indicates impact-stage intent (ransomware/wiper) rather than routine privacy cleanup.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SDelete execution or wipe-style command lines on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_originalFileName:/.*[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ii][Pp][Hh][Ee][Rr].* /[Ww].*/)
    pivot_on:
    - host
    window: 1h
  - name: Sysmon file delete events (archived/overwritten files) on this host
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND NOT data_win_eventdata_targetFilename:/.*[Tt]emp.*/
    pivot_on:
    - host
    window: 1h
  - name: Event log clearing and audit policy tampering
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR data_win_system_eventID:"4719" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/)))
    pivot_on:
    - host
    window: 2h
  - name: Shadow copy / backup destruction on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other file-access audit activity by this account
    query: (data_win_system_eventID:"4656" OR data_win_system_eventID:"4663" OR data_win_system_eventID:"4660") AND data_win_eventdata_accessMask:*
    pivot_on:
    - user
    window: 4h
