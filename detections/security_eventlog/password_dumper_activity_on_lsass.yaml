name: Password Dumper Activity on LSASS
id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: sigma
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process handle on LSASS process with certain access mask and object
  type SAM_DOMAIN. MITRE ATT&CK: T1003.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4656"
        - wildcard:
            data_win_eventdata_processName:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_accessMask:
              value: "0x705"
              case_insensitive: true
        - term:
            data_win_eventdata_objectType:
              value: "SAM_DOMAIN"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_processName
    - data_win_eventdata_accessMask
    - data_win_eventdata_objectType
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_eventdata_processName matches
  '*\lsass.exe'; data_win_eventdata_accessMask equals '0x705', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/jackcr/status/807385668833968128
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Password Dumper Activity on LSASS detected on host $agent_name$. Matched
    data_win_eventdata_processName: $data_win_eventdata_processName$. Matched
    data_win_eventdata_accessMask: $data_win_eventdata_accessMask$. MITRE
    ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_processName
      type: process
    - field: data_win_eventdata_accessMask
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - password
    - dumper
    - lsass
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4656" AND data_win_eventdata_processName:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_accessMask:/0[Xx]705/ AND data_win_eventdata_objectType:/[Ss][Aa][Mm]_[Dd][Oo][Mm][Aa][Ii][Nn]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Sysmon EID 10 view of the same lsass.exe handle acquisition; confirms the Security 4656 SAM_DOMAIN handle came from a real memory-read capable process and names the source image.
  - id: 4a1b6da0-d94f-4fc3-98fc-2d9cb9e5ee76
    name: Potentially Suspicious AccessMask Requested From LSASS
    reason: Same Security-log handle request on lsass.exe with a dump-capable access mask; co-occurring corroboration from the same audit source.
  - id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
    name: LSASS Access From Non System Account
    reason: Identifies whether the account that opened the LSASS handle was an ordinary user rather than SYSTEM, separating tooling from legitimate security software.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The 0x705 SAM_DOMAIN handle on lsass is a classic Mimikatz/pwdump-style artifact; Mimikatz process creation is the likely cause on the same host.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Alternative living-off-the-land LSASS dump method (rundll32 comsvcs MiniDump) an operator uses alongside or instead of a handle-based dumper.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump -ma lsass is the most common signed-binary dumper seen on the same host before offline credential extraction.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Follow-on: with harvested domain credentials the attacker escalates to DCSync against a domain controller to pull every hash.'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'Follow-on: stolen NTLM hashes from LSASS are replayed as NTLM network logons (type 3/9) on other hosts for lateral movement.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access by non-system tools
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_sourceImage:/.*\([Ww][Ii][Nn][Ii][Nn][Ii][Tt]|[Cc][Ss][Rr][Ss][Ss]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Ss][Ee][Nn][Ss][Ee][Cc][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Credential-dumping tool or LSASS-dump command execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp](64)?|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Pp][Ww][Dd][Uu][Mm][Pp]|[Ff][Gg][Dd][Uu][Mm][Pp]|[Ww][Cc][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg]|[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Dump, SAM or SYSTEM hive file written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp])/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\\([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])(\.[Ss][Aa][Vv][Ee]|\.[Bb][Aa][Kk]|\.[Hh][Ii][Vv][Ee])?/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons by this account after credential theft (hash replay)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on:
    - user
    window: 6h
  - name: Archive or outbound transfer of dump files from this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\.[Dd][Mm][Pp]|[Ll][Ss][Aa][Ss][Ss]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]).*/ AND (data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|7[Zz]|[Tt][Aa][Rr]|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
