name: Suspicious Windows ANONYMOUS LOGON Local Account Created
id: 1bbf25b9-8038-4154-a50b-118f2a32be27
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: James Pemberton / @4A616D6573
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1bbf25b9-8038-4154-a50b-118f2a32be27
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of suspicious accounts similar to ANONYMOUS LOGON, such
  as using additional spaces. Created as an covering detection for exclusion of
  Logon Type 3 from ANONYMOUS LOGON accounts. MITRE ATT&CK: T1136.001,
  T1136.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4720"
        - wildcard:
            data_win_eventdata_samAccountName:
              value: "*ANONYMOUS*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_samAccountName:
              value: "*LOGON*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_samAccountName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4720'; data_win_eventdata_samAccountName
  matches '*ANONYMOUS*'; data_win_eventdata_samAccountName matches '*LOGON*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1189469425482829824
  - https://attack.mitre.org/techniques/T1136/001/
  - https://attack.mitre.org/techniques/T1136/002/

response:
  message: >
    Suspicious Windows ANONYMOUS LOGON Local Account Created detected on host
    $agent_name$. Matched data_win_eventdata_samAccountName:
    $data_win_eventdata_samAccountName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1136.001, T1136.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_samAccountName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
    - T1136.002
  custom_tags:
    - anonymous
    - logon
    - local
    - windows_security
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4720" AND data_win_eventdata_samAccountName:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss].*/ AND data_win_eventdata_samAccountName:/.*[Ll][Oo][Gg][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: The lookalike ANONYMOUS LOGON account is usually created with net user /add; the process-creation event gives the parent process and command line behind the 4720.
  - id: 3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb
    name: Windows Create Local Account
    reason: Same 4720 local account creation seen generically; confirms the host had other new local accounts around the spoofed one.
  - id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
    name: Hidden Local User Creation
    reason: Both are stealth account techniques meant to hide a backdoor user from admins; the two often co-occur.
  - id: 9ec9fb1b-e059-4489-9642-f270c207923d
    name: Hiding User Account Via SpecialAccounts Registry Key - CommandLine
    reason: An attacker who spoofs a system-like account name may also hide it from the logon screen via the SpecialAccounts UserList registry key.
  - id: cfeed607-6aa4-4bbd-9627-b637deb723c8
    name: New or Renamed User Account with '$' Character
    reason: Another account-name masquerade (machine-account lookalike) used to blend a backdoor local account in.
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: 'Follow-on: the new fake account must be made admin (4732) to be useful for persistence and lateral movement.'
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: Process-level view of net localgroup administrators /add that typically follows creation of the spoofed account.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Attackers creating covert accounts often clear the Security log afterward to remove the 4720/4732 trail.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process that created the account (net user /add, PowerShell, WMI)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/) OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Nn][Tt]:\/\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Account added to Administrators / RDP groups on this host
    query: (data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4738" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4722")
    pivot_on:
    - host
    window: 6h
  - name: Hidden-account registry tampering (SpecialAccounts, RDP enable)
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12" OR data_win_system_eventID:"1") AND (data_win_eventdata_targetObject:/.*[Ss][Pp][Ee][Cc][Ii][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ff][Dd][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp][Ee][Cc][Ii][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ff][Dd][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Logons by the newly created account (network, RDP, explicit creds)
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672") AND (data_win_eventdata_targetUserName:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss].*/ OR data_win_eventdata_subjectUserName:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss].*/)
    pivot_on:
    - host
    window: 24h
  - name: Audit log tampering after account creation
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"4719" OR data_win_system_eventID:"104")
    pivot_on:
    - host
    window: 4h
