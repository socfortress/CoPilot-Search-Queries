name: Replay Attack Detected
id: 5a44727c-3b85-4713-8c44-4401d5499629
version: 1
schema_version: "1.0"
date: "2022-10-14"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5a44727c-3b85-4713-8c44-4401d5499629
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects possible Kerberos Replay Attack on the domain controllers when
  "KRB_AP_ERR_REPEAT" Kerberos response is sent to the client. MITRE ATT&CK:
  T1558.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4649"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4649'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Yamato-Security/EnableWindowsLogSettings/blob/7f6d755d45ac7cc9fc35b0cbf498e6aa4ef19def/ConfiguringSecurityLogAuditPolicies.md
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4649
  - https://attack.mitre.org/techniques/T1558/

response:
  message: >
    Replay Attack Detected detected on host $agent_name$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    Matched data_win_eventdata_subjectLogonId:
    $data_win_eventdata_subjectLogonId$. MITRE ATT&CK: T1558
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_subjectUserName
      type: user
    - field: data_win_eventdata_subjectLogonId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558
  custom_tags:
    - replay
    - attack
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4649"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 12e6d621-194f-4f59-90cc-1959e21e69f7
    name: Register new Logon Process by Rubeus
    reason: Rubeus registers a rogue LSA logon process to craft/replay Kerberos tickets; a precursor or companion to a replayed authenticator on the same host
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: Kerberos failures (clock skew, bad/duplicate tickets) accompany replay and ticket-forgery tooling; the same ticket abuse seen at the KDC
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: 'Ticket reuse after stolen NTLM/AES key: replayed authenticator often follows a successful overpass-the-hash TGT acquisition'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Replay of credential material (hash/ticket) to reach other hosts; same credential-reuse lateral movement when Kerberos replay fails or falls back to NTLM
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: Explicit-credential logons (4648) show the account being used with stolen credentials on remote hosts, the likely next step
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Downgraded RC4 tickets point to tooling harvesting or forging tickets that can later be replayed
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: Service ticket harvesting is a common earlier stage of Kerberos credential abuse against the same account
  - id: eca91c7c-9214-47b9-b4c5-cb1d7e4f2350
    name: Uncommon Outbound Kerberos Connection - Security
    reason: Non-standard process talking to a KDC suggests attacker tooling requesting or replaying tickets from this host
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberos TGT/service ticket requests and failures around the replay
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4771" OR data_win_system_eventID:"4770")
    pivot_on:
    - user
    window: 2h
  - name: Network logons (type 3) and explicit-credential logons by this account
    query: ((data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 4h
  - name: Kerberos ticket abuse tooling executed on host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr]ubeus.*/ OR data_win_eventdata_image:/.*[Mm]imikatz.*/ OR data_win_eventdata_commandLine:/.*([Aa]sktgt|[Aa]sktgs|[Pp]tt|[Kk]erberos::|[Ss]ekurlsa|[Kk]list|[Pp]ass-the-ticket|[Tt]gtdeleg).*/))
    pivot_on:
    - host
    window: 2h
  - name: LSASS access preceding ticket theft on host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Remote execution and admin-share lateral movement from host
    query: ((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]|\\[Ww][Mm][Ii][Cc]|\\[Ww][Ii][Nn][Rr][Ss]).*/) OR (data_win_system_eventID:"5140" AND data_win_eventdata_shareName:/.*(ADMIN|C)\$/) OR data_win_system_eventID:"7045")
    pivot_on:
    - host
    window: 4h
