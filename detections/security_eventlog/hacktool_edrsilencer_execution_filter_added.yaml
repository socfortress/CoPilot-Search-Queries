name: HackTool - EDRSilencer Execution - Filter Added
id: 98054878-5eab-434c-85d4-72d4e5a3361b
version: 1
schema_version: "1.0"
date: "2024-01-30"
author: Thodoris Polyzos (@SmoothDeploy)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 98054878-5eab-434c-85d4-72d4e5a3361b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of EDRSilencer, a tool that abuses the Windows Filtering
  Platform (WFP) to block the outbound traffic of running EDR agents based on
  specific hardcoded filter names. MITRE ATT&CK: T1685.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "5441"
              - term:
                  data_win_system_eventID: "5447"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_filterName:
              value: "*Custom Outbound Filter*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_filterName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5441'; data_win_system_eventID equals '5447';
  data_win_eventdata_filterName matches '*Custom Outbound Filter*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/netero1010/EDRSilencer
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    HackTool - EDRSilencer Execution - Filter Added detected on host
    $agent_name$. Matched data_win_eventdata_filterName:
    $data_win_eventdata_filterName$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_filterName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - hacktool
    - edrsilencer
    - filter
    - windows_security
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"5441" OR data_win_system_eventID:"5447") AND data_win_eventdata_filterName:/.*[Cc][Uu][Ss][Tt][Oo][Mm] [Oo][Uu][Tt][Bb][Oo][Uu][Nn][Dd] [Ff][Ii][Ll][Tt][Ee][Rr].*/

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
