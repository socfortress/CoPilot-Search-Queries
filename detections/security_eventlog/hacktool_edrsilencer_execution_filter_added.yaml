name: HackTool - EDRSilencer Execution - Filter Added
id: 98054878-5eab-434c-85d4-72d4e5a3361b
version: 1
schema_version: "1.0"
date: "2024-01-30"
author: Thodoris Polyzos (@SmoothDeploy)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 98054878-5eab-434c-85d4-72d4e5a3361b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of EDRSilencer, a tool that abuses the Windows Filtering
  Platform (WFP) to block the outbound traffic of running EDR agents based on
  specific hardcoded filter names. MITRE ATT&CK: T1685.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "5441"
              - term:
                  data_win_system_eventID: "5447"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_filterName:
              value: "*Custom Outbound Filter*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_filterName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5441'; data_win_system_eventID equals '5447';
  data_win_eventdata_filterName matches '*Custom Outbound Filter*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/netero1010/EDRSilencer
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    HackTool - EDRSilencer Execution - Filter Added detected on host
    $agent_name$. Matched data_win_eventdata_filterName:
    $data_win_eventdata_filterName$. Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_filterName
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - hacktool
    - edrsilencer
    - filter
    - windows_security
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"5441" OR data_win_system_eventID:"5447") AND data_win_eventdata_filterName:/.*[Cc][Uu][Ss][Tt][Oo][Mm] [Oo][Uu][Tt][Bb][Oo][Uu][Nn][Dd] [Ff][Ii][Ll][Tt][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: eb2d07d4-49cb-4523-801a-da002df36602
    name: HackTool - EDRSilencer Execution
    reason: Process-creation view of the same tool (EDRSilencer.exe blockedr); confirms the WFP 'Custom Outbound Filter' came from the binary and gives the parent/command line.
  - id: bacf58c6-e199-4040-a94f-95dea0f1e45a
    name: Windows Filtering Platform Blocked Connection From EDR Agent Binary
    reason: 'Direct consequence: once the filters exist, EDR agent binaries get 5157 WFP drops, proving the silencing actually took effect and the sensor is blind.'
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: Sibling EDR-neutralisation tool; attackers often try several (WFP blocking, then suspend/freeze) when the first is detected.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: 'Same defense-impairment phase: attacker also attempts to disable Defender, and tamper-protection firing shows the pivot to the built-in AV.'
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Parallel or fallback method to blind security agents by stopping their services when network blocking is insufficient.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Once telemetry to the EDR is cut, attackers commonly clear local logs to remove remaining evidence.
  - id: ab4561b1-6c7e-48a7-ad08-087cfb9ce8f1
    name: Important Windows Event Auditing Disabled
    reason: 'Same Security-log channel: disabling audit subcategories (incl. WFP auditing) hides filter creation and later activity.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Typical next step on an EDR-blinded host: credential dumping from LSASS without detection.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: EDRSilencer binary or blockedr/block command line on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ee][Dd][Rr][Ss][Ii][Ll][Ee][Nn][Cc][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Dd][Rr][Ss][Ii][Ll][Ee][Nn][Cc][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ll][Oo][Cc][Kk][Ee][Dd][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: WFP blocked connections from security agent binaries (5157)
    query: data_win_system_eventID:"5157" AND (data_win_eventdata_application:*[Ss]ense* OR data_win_eventdata_application:*[Cc]rowd[Ss]trike* OR data_win_eventdata_application:*[Cc]s[Ff]alcon* OR data_win_eventdata_application:*[Ss]entinel* OR data_win_eventdata_application:*[Cc]arbon* OR data_win_eventdata_application:*[Cc]ylance* OR data_win_eventdata_application:*[Ee]lastic* OR data_win_eventdata_application:*[Ss]ophos* OR data_win_eventdata_application:*[Mm]sMpEng* OR data_win_eventdata_application:*[Ww]azuh*)
    pivot_on:
    - host
    window: 2h
  - name: 'Other EDR/AV tampering: service stop, Defender disable, firewall changes'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +(stop|config|delete).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] +[Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential access and log clearing after sensor silencing
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)) OR data_win_system_eventID:"1102"
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from non-browser processes on host (exfil/C2 while EDR blind)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*)/ AND (data_win_eventdata_image:/.*\\(powershell|cmd|rundll32|regsvr32|mshta|wscript|cscript|rclone|curl)\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt]emp\\.*/ OR data_win_eventdata_image:/.*\\[Pp]rogram[Dd]ata\\.*/ OR data_win_eventdata_image:/.*\\[Uu]sers\\[Pp]ublic\\.*/)
    pivot_on:
    - host
    window: 4h
