name: Pass the Hash Activity 2
id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Dave Kennedy, Jeff Warren (method) / David Vassallo (rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects the attack technique pass the hash which is used to move laterally
  inside the network. MITRE ATT&CK: T1550.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4624"
                    - term:
                        data_win_eventdata_subjectUserSid:
                          value: "S-1-0-0"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_logonType: "3"
                    - term:
                        data_win_eventdata_logonProcessName:
                          value: "NtLmSsp"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_keyLength: "0"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4624"
                    - term:
                        data_win_eventdata_logonType: "9"
                    - term:
                        data_win_eventdata_logonProcessName:
                          value: "seclogo"
                          case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetUserName"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_targetUserName:
                    value: "ANONYMOUS LOGON"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_subjectUserSid
    - data_win_eventdata_logonType
    - data_win_eventdata_logonProcessName
    - data_win_eventdata_keyLength
    - data_win_eventdata_targetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_subjectUserSid
  equals 'S-1-0-0'; data_win_eventdata_logonType equals '3', among other
  conditions.

known_false_positives: >
  Administrator activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/iadgov/Event-Forwarding-Guidance/tree/master/Events
  - https://web.archive.org/web/20170909091934/https://blog.binarydefense.com/reliably-detecting-pass-the-hash-through-event-log-analysis
  - https://blog.stealthbits.com/how-to-detect-pass-the-hash-attacks/
  - https://attack.mitre.org/techniques/T1550/002/

response:
  message: >
    Pass the Hash Activity 2 detected on host $agent_name$. Matched
    data_win_eventdata_subjectUserSid: $data_win_eventdata_subjectUserSid$.
    Matched data_win_eventdata_logonType: $data_win_eventdata_logonType$. MITRE
    ATT&CK: T1550.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_subjectUserSid
      type: user
    - field: data_win_eventdata_logonType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1550.002
  custom_tags:
    - windows_security
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"4624" AND data_win_eventdata_subjectUserSid:/[Ss]-1-0-0/ AND data_win_eventdata_logonType:"3" AND data_win_eventdata_logonProcessName:/[Nn][Tt][Ll][Mm][Ss][Ss][Pp]/ AND data_win_eventdata_keyLength:"0") OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/[Ss][Ee][Cc][Ll][Oo][Gg][Oo]/)) AND _exists_:data_win_eventdata_targetUserName AND NOT (data_win_eventdata_targetUserName:/[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ll][Oo][Gg][Oo][Nn]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: sekurlsa::pth spawns a process via seclogo (logon type 9), the exact second branch of this rule; Mimikatz on the source host is the hash-injection precursor
  - id: 7aa7009a-28b9-4344-8c1f-159489a390df
    name: HackTool - Windows Credential Editor (WCE) Execution
    reason: WCE injects NTLM hashes into a logon session, producing the same type 9 / seclogo logon
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: The hash being replayed must first be harvested from LSASS on a previously compromised host
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PtH network logons (type 3, NtLmSsp) are commonly followed by PsExec service creation on the target to get execution
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Impacket psexec/wmiexec/smbexec authenticate with NTLM hashes producing keyLength 0 type 3 logons, then run remote commands
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: After hash-authenticated logon, WMI remote execution is a follow-on lateral movement path on the target
  - id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
    name: WMIC Remote Command Execution
    reason: Hash-authenticated access to a remote host is used to run commands via wmic /node, the common next step
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: Pass-the-hash grants SMB access, so attackers mount C$/ADMIN$ shares to stage tools right after the logon
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote service installation (PsExec/smbexec style) on target
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:*ADMIN$* OR data_win_eventdata_imagePath:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_imagePath:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/ OR data_win_eventdata_imagePath:/.*[Pp]ower[Ss]hell.*/)
    pivot_on:
    - host
    window: 1h
  - name: Admin share access (C$/ADMIN$/IPC$) following the logon
    query: data_win_system_eventID:"5140" AND (data_win_eventdata_shareName:*ADMIN$* OR data_win_eventdata_shareName:*C$* OR data_win_eventdata_shareName:*IPC$*)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Credential tooling / sekurlsa::pth and LSASS access
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ww][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Remote execution children (WmiPrvSE/wsmprovhost/services) on target
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/)
    pivot_on:
    - host
    window: 1h
  - name: Same account NTLM network logons / explicit-credential use across hosts
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm]/) OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 6h
