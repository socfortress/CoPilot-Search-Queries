              - term:
                  data_win_eventdata_status:
                    value: "0x32"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x3E"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x3F"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x40"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x41"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x43"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x44"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_status
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '675'; data_win_system_eventID equals '4768';
  data_win_system_eventID equals '4769', among other conditions.

known_false_positives: >
  Faulty legacy applications. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771
  - https://attack.mitre.org/techniques/T1212/

response:
  message: >
    Kerberos Manipulation detected on host $agent_name$. Matched
    data_win_eventdata_status: $data_win_eventdata_status$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1212
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_status
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1212
  custom_tags:
    - kerberos
    - manipulation
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"675" OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4771") AND (data_win_eventdata_status:/0[Xx]9/ OR data_win_eventdata_status:/0[Xx][Aa]/ OR data_win_eventdata_status:/0[Xx][Bb]/ OR data_win_eventdata_status:/0[Xx][Ff]/ OR data_win_eventdata_status:/0[Xx]10/ OR data_win_eventdata_status:/0[Xx]11/ OR data_win_eventdata_status:/0[Xx]13/ OR data_win_eventdata_status:/0[Xx]14/ OR data_win_eventdata_status:/0[Xx]1[Aa]/ OR data_win_eventdata_status:/0[Xx]1[Ff]/ OR data_win_eventdata_status:/0[Xx]21/ OR data_win_eventdata_status:/0[Xx]22/ OR data_win_eventdata_status:/0[Xx]23/ OR data_win_eventdata_status:/0[Xx]24/ OR data_win_eventdata_status:/0[Xx]26/ OR data_win_eventdata_status:/0[Xx]27/ OR data_win_eventdata_status:/0[Xx]28/ OR data_win_eventdata_status:/0[Xx]29/ OR data_win_eventdata_status:/0[Xx]2[Cc]/ OR data_win_eventdata_status:/0[Xx]2[Dd]/ OR data_win_eventdata_status:/0[Xx]2[Ee]/ OR data_win_eventdata_status:/0[Xx]2[Ff]/ OR data_win_eventdata_status:/0[Xx]31/ OR data_win_eventdata_status:/0[Xx]32/ OR data_win_eventdata_status:/0[Xx]3[Ee]/ OR data_win_eventdata_status:/0[Xx]3[Ff]/ OR data_win_eventdata_status:/0[Xx]40/ OR data_win_eventdata_status:/0[Xx]41/ OR data_win_eventdata_status:/0[Xx]43/ OR data_win_eventdata_status:/0[Xx]44/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672")'
      pivot_on: [user]
      window: 6h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))'
      pivot_on: [host]
      window: 1h
