name: Kerberos Manipulation
id: f7644214-0eb0-4ace-9455-331ec4c09253
version: 1
schema_version: "1.0"
date: "2024-01-16"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f7644214-0eb0-4ace-9455-331ec4c09253
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects failed Kerberos TGT issue operation. This can be a sign of
  manipulations of TGT messages by an attacker. MITRE ATT&CK: T1212.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "675"
              - term:
                  data_win_system_eventID: "4768"
              - term:
                  data_win_system_eventID: "4769"
              - term:
                  data_win_system_eventID: "4771"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_status:
                    value: "0x9"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xA"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xB"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xF"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x10"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x11"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x13"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x14"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x1A"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x1F"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x21"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x22"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x23"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x24"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x26"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x27"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x28"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x29"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x2C"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x2D"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x2E"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x2F"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x31"
