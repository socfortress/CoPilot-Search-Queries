name: Kerberos Manipulation
id: f7644214-0eb0-4ace-9455-331ec4c09253
version: 1
schema_version: "1.0"
date: "2024-01-16"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f7644214-0eb0-4ace-9455-331ec4c09253
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects failed Kerberos TGT issue operation. This can be a sign of
  manipulations of TGT messages by an attacker. MITRE ATT&CK: T1212.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "675"
              - term:
                  data_win_system_eventID: "4768"
              - term:
                  data_win_system_eventID: "4769"
              - term:
                  data_win_system_eventID: "4771"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_status:
                    value: "0x9"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xA"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xB"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0xF"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x10"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x11"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x13"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x14"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x1A"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x1F"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x21"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x22"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x23"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x24"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x26"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x27"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x28"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x29"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x2C"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x2D"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x2E"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x2F"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x31"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x32"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x3E"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x3F"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x40"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x41"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x43"
                    case_insensitive: true
              - term:
                  data_win_eventdata_status:
                    value: "0x44"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_status
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '675'; data_win_system_eventID equals '4768';
  data_win_system_eventID equals '4769', among other conditions.

known_false_positives: >
  Faulty legacy applications. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771
  - https://attack.mitre.org/techniques/T1212/

response:
  message: >
    Kerberos Manipulation detected on host $agent_name$. Matched
    data_win_eventdata_status: $data_win_eventdata_status$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1212
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_status
      type: other
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1212
  custom_tags:
    - kerberos
    - manipulation
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"675" OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4771") AND (data_win_eventdata_status:/0[Xx]9/ OR data_win_eventdata_status:/0[Xx][Aa]/ OR data_win_eventdata_status:/0[Xx][Bb]/ OR data_win_eventdata_status:/0[Xx][Ff]/ OR data_win_eventdata_status:/0[Xx]10/ OR data_win_eventdata_status:/0[Xx]11/ OR data_win_eventdata_status:/0[Xx]13/ OR data_win_eventdata_status:/0[Xx]14/ OR data_win_eventdata_status:/0[Xx]1[Aa]/ OR data_win_eventdata_status:/0[Xx]1[Ff]/ OR data_win_eventdata_status:/0[Xx]21/ OR data_win_eventdata_status:/0[Xx]22/ OR data_win_eventdata_status:/0[Xx]23/ OR data_win_eventdata_status:/0[Xx]24/ OR data_win_eventdata_status:/0[Xx]26/ OR data_win_eventdata_status:/0[Xx]27/ OR data_win_eventdata_status:/0[Xx]28/ OR data_win_eventdata_status:/0[Xx]29/ OR data_win_eventdata_status:/0[Xx]2[Cc]/ OR data_win_eventdata_status:/0[Xx]2[Dd]/ OR data_win_eventdata_status:/0[Xx]2[Ee]/ OR data_win_eventdata_status:/0[Xx]2[Ff]/ OR data_win_eventdata_status:/0[Xx]31/ OR data_win_eventdata_status:/0[Xx]32/ OR data_win_eventdata_status:/0[Xx]3[Ee]/ OR data_win_eventdata_status:/0[Xx]3[Ff]/ OR data_win_eventdata_status:/0[Xx]40/ OR data_win_eventdata_status:/0[Xx]41/ OR data_win_eventdata_status:/0[Xx]43/ OR data_win_eventdata_status:/0[Xx]44/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: Failed TGT/TGS requests on 4768/4769 often sit beside Kerberoasting; the same account requesting SPN tickets in bulk is the credential-theft follow-on.
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: Repeated 4768 failures/requests for accounts without pre-auth is the same TGT-request surface used for AS-REP roasting.
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Downgraded RC4 ticket requests accompany roasting and ticket-forging tooling issuing crafted TGT/TGS requests.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Rubeus generates malformed or failing TGT requests (asktgt, brute, roast); process execution on the client host explains the failures.
  - id: 12e6d621-194f-4f59-90cc-1959e21e69f7
    name: Register new Logon Process by Rubeus
    reason: Rubeus registers a rogue logon process (4611) before ticket manipulation, a host-side precursor of the failing Kerberos requests.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Command-line ticket requests (klist/Rubeus/Kekeo style) are the process-level cause of anomalous 4768/4769 events.
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: 'Once failed TGT attempts succeed with a stolen hash, the outcome is an overpass-the-hash logon: confirms the manipulation worked.'
  - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
    name: Account Tampering - Suspicious Failed Logon Reasons
    reason: Failed logon sub-statuses against the same account co-occur with failed Kerberos pre-auth during guessing or tampering.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberos ticket tooling execution on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_image:/.*[Kk][Ee][Kk][Ee][Oo].*/ OR data_win_eventdata_commandLine:/.*([Aa][Ss][Kk][Tt][Gg][Tt]|[Aa][Ss][Kk][Tt][Gg][Ss]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt]|[Pp][Tt][Tt]|[Kk][Ll][Ii][Ss][Tt].*[Pp][Uu][Rr][Gg][Ee]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos ticket requests and failures for this account
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4771" OR data_win_system_eventID:"4770")
    pivot_on:
    - user
    window: 6h
  - name: Explicit-credential and network logons by this account
    query: (data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")) OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 6h
  - name: LSASS access and credential dumping on host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Directory replication and privileged-service access follow-on
    query: (data_win_system_eventID:"4662" AND data_win_eventdata_properties:/.*1131f6a[ad]-9c07-11d1-f79f-00c04fc2dcd2.*/) OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4742"
    pivot_on:
    - user
    window: 6h
