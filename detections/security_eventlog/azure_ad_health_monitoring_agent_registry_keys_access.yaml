name: Azure AD Health Monitoring Agent Registry Keys Access
id: ff151c33-45fa-475d-af4f-c2f93571f4fe
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ff151c33-45fa-475d-af4f-c2f93571f4fe
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This detection uses Windows security events to detect suspicious access
  attempts to the registry key of Azure AD Health monitoring agent. This
  detection requires an access control entry (ACE) on the system access control
  list (SACL) of the following securable object
  HKLM\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent. MITRE
  ATT&CK: T1012.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4656"
              - term:
                  data_win_system_eventID: "4663"
            minimum_should_match: 1
        - term:
            data_win_eventdata_objectType:
              value: "Key"
              case_insensitive: true
        - term:
            data_win_eventdata_objectName:
              value: "\\REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\Microsoft Online\\Reporting\\MonitoringAgent"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Adfs.InsightsService.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Adfs.PshSurrogate.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4656'; data_win_system_eventID equals '4663';
  data_win_eventdata_objectType equals 'Key', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://o365blog.com/post/hybridhealthagent/
  - https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_monitoring_agent.yml
  - https://attack.mitre.org/techniques/T1012/

response:
  message: >
    Azure AD Health Monitoring Agent Registry Keys Access detected on host
    $agent_name$. Matched data_win_eventdata_objectType:
    $data_win_eventdata_objectType$. Matched data_win_eventdata_objectName:
    $data_win_eventdata_objectName$. MITRE ATT&CK: T1012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1012
  custom_tags:
    - azure
    - health
    - monitoring
    - windows_security
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"4656" OR data_win_system_eventID:"4663") AND data_win_eventdata_objectType:/[Kk][Ee][Yy]/ AND data_win_eventdata_objectName:/\\[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]\\[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Nn][Ll][Ii][Nn][Ee]\\[Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg][Aa][Gg][Ee][Nn][Tt]/ AND _exists_:data_win_eventdata_processName AND NOT (data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Ii][Nn][Ss][Ii][Gg][Hh][Tt][Ss][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg][Aa][Gg][Ee][Nn][Tt]\.[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Pp][Ss][Hh][Ss][Uu][Rr][Rr][Oo][Gg][Aa][Tt][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_processName:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Cc][Oo][Mm][Mm][Oo][Nn]\.[Cc][Ll][Ii][Ee][Nn][Tt][Ss]\.[Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1d2ab8ac-1a01-423b-9c39-001510eae8e8
    name: Azure AD Health Service Agents Registry Keys Access
    reason: Sibling SACL-audited Hybrid Health key; an attacker harvesting agent registration/cert material typically touches both the service-agent and monitoring-agent keys.
  - id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
    name: ADFS Database Named Pipe Connection By Uncommon Tool
    reason: Health agent registry access on an ADFS/AAD Connect server is a precursor to pulling ADFS config and token-signing material from the WID database.
  - id: c86500e9-a645-4680-98d7-f882c70c1ea3
    name: AADInternals PowerShell Cmdlets Execution - ProccessCreation
    reason: AADInternals (the o365blog reference) reads Hybrid Health agent keys to steal the agent certificate/identity and impersonate the Health service.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Following registry access on a hybrid identity server, attackers export SAM/SECURITY/SYSTEM hives to extract the machine and service account secrets.
  - id: 970007b7-ce32-49d0-a4a4-fbef016950bd
    name: Potential Configuration And Service Reconnaissance Via Reg.EXE
    reason: reg.exe querying service and software configuration keys is the likely process-level source of the key read, and part of the same host discovery.
  - id: a0e417e2-2fa1-40da-b6d2-e094cd5e1191
    name: Registry Enumeration via WMI Stdregprov
    reason: Alternative way to read the same MonitoringAgent key via WMI StdRegProv, co-occurring discovery.
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: Agent credentials and certificates are DPAPI-protected; reading the key is followed by DPAPI decryption to recover usable secrets.
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: Hybrid identity server compromise is followed by enumeration of privileged AD users and groups to pick the next account to abuse.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hybrid Health / AAD Connect tooling and AADInternals commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Aa][Dd][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*[Hh][Ee][Aa][Ll][Tt][Hh][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Nn][Ll][Ii][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry reads of Hybrid Health and Microsoft Online keys by reg.exe or PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Nn][Ll][Ii][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Hh][Ee][Aa][Ll][Tt][Hh][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Sensitive hive export, DPAPI or certificate export on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] +([Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]).*(HKLM|[Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Yy][Ss][Tt][Ee][Mm]).*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Pp][Ff][Xx][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*-[Ee][Xx][Pp][Oo][Rr][Tt].*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections to Azure AD / Microsoft Online endpoints from non-Microsoft processes
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*(login\.microsoftonline|login\.windows|aadcdn|msappproxy|adhybridhealth|servicebus\.windows)\..*/) AND NOT data_win_eventdata_image:/.*\\(Microsoft\.Identity\.Health|AzureADConnect|miiserver|Microsoft\.Online\.|msedge|chrome|iexplore|svchost)[^\\]*\.exe/
    pivot_on:
    - host
    window: 4h
  - name: ADFS / AAD Connect service account logons and privileged logon on this account
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4672" OR data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 4h
