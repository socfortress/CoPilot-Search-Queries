name: User Couldn't Call a Privileged Service 'LsaRegisterLogonProcess'
id: 6daac7fc-77d1-449a-a71a-e6b4d59a0e54
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Roberto Rodriguez (source), Ilyas Ochkov (rule), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6daac7fc-77d1-449a-a71a-e6b4d59a0e54
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The 'LsaRegisterLogonProcess' function verifies that the application making
  the function call is a logon process by checking that it has the
  SeTcbPrivilege privilege set. Possible Rubeus tries to get a handle to LSA.
  MITRE ATT&CK: T1558.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4673"
        - term:
            data_win_eventdata_service:
              value: "LsaRegisterLogonProcess()"
              case_insensitive: true
        - term:
            data_win_system_keywords:
              value: "0x8010000000000000"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_service
    - data_win_system_keywords
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4673'; data_win_eventdata_service equals
  'LsaRegisterLogonProcess()'; data_win_system_keywords equals
  '0x8010000000000000'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.specterops.io/hunting-in-active-directory-unconstrained-delegation-forests-trusts-71f2b33688e1
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    User Couldn't Call a Privileged Service 'LsaRegisterLogonProcess' detected
    on host $agent_name$. Matched data_win_eventdata_service:
    $data_win_eventdata_service$. Matched data_win_system_keywords:
    $data_win_system_keywords$. MITRE ATT&CK: T1558.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_service
      type: other
    - field: data_win_system_keywords
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - couldn
    - privileged
    - service
    - windows_security
    - credential_access
    - lateral_movement
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4673" AND data_win_eventdata_service:/[Ll][Ss][Aa][Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr][Ll][Oo][Gg][Oo][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss]\(\)/ AND data_win_system_keywords:/0[Xx]8010000000000000/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 12e6d621-194f-4f59-90cc-1959e21e69f7
    name: Register new Logon Process by Rubeus
    reason: Same Rubeus LsaRegisterLogonProcess behaviour seen via 4611 logon-process registration; co-occurring confirmation that a tool obtained an LSA handle
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Process-creation evidence of the Rubeus binary or its verbs that would produce the LSA handle request
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: Rubeus loaded reflectively in PowerShell is a common way to call LsaRegisterLogonProcess without a file on disk
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: 'Likely next step: Rubeus kerberoast requests service tickets (4769) after getting an LSA handle'
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Rubeus-requested tickets are often downgraded to RC4 for offline cracking; follow-on to the LSA handle
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: Kerberos failures and anomalies produced by ticket request/forging tooling running through the same LSA logon process
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: Ticket injection (ptt) with Rubeus or Mimikatz follows ticket extraction via the LSA handle
  - id: fbf9e47f-e531-4fea-942d-5c95af7ed4d6
    name: Windows PowerView Unconstrained Delegation Discovery
    reason: The rule's reference is unconstrained-delegation abuse; delegation discovery precedes TGT capture with Rubeus monitor/dump
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rubeus verbs or Kerberos ticket tooling launched
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*(asktgt|asktgs|kerberoast|asreproast|s4u|ptt|tgtdeleg|harvest|monitor|renew|dump).*[\/\-](ticket|service|user|rc4opsec|nowrap|outfile).*/)
    pivot_on:
    - host
    window: 2h
  - name: Reflective .NET / Rubeus loaded via PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Rubeus* OR data_win_eventdata_scriptBlockText:*KerberosRequestorSecurityToken* OR data_win_eventdata_scriptBlockText:*LsaRegisterLogonProcess* OR data_win_eventdata_scriptBlockText:*LsaCallAuthenticationPackage*)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos TGS requests with RC4 encryption
    query: data_win_system_eventID:"4769" AND data_win_eventdata_ticketEncryptionType:/0[Xx]17/
    pivot_on:
    - user
    window: 6h
  - name: Direct Kerberos traffic from non-system process
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88" AND NOT data_win_eventdata_image:/.*[\\](lsass|svchost)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Kerberos ticket files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.kirbi OR data_win_eventdata_targetFilename:*.ccache OR data_win_eventdata_targetFilename:/.*[Tt][Ii][Cc][Kk][Ee][Tt].*\.(txt|bin)/)
    pivot_on:
    - host
    window: 4h
