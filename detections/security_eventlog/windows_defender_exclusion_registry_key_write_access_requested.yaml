name: Windows Defender Exclusion Registry Key - Write Access Requested
id: e9c8808f-4cfb-4ba9-97d4-e5f3beaa244d
version: 1
schema_version: "1.0"
date: "2023-11-11"
author: "@BarryShooshooga, Nasreddine Bencherchali (Nextron Systems)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e9c8808f-4cfb-4ba9-97d4-e5f3beaa244d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects write access requests to the Windows Defender exclusions registry
  keys. This could be an indication of an attacker trying to request a handle or
  access the object to write new exclusions in order to bypass security. MITRE
  ATT&CK: T1685.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_accessList: "*%%4417*"
              - wildcard:
                  data_win_eventdata_accessList: "*%%4418*"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_system_eventID: "4656"
              - term:
                  data_win_system_eventID: "4663"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\Microsoft\\\\Windows Defender\\\\Exclusions\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_accessList
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_eventdata_accessList matches '*%%4417*';
  data_win_eventdata_accessList matches '*%%4418*'; data_win_system_eventID
  equals '4656', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.bleepingcomputer.com/news/security/gootkit-malware-bypasses-windows-defender-by-setting-path-exclusions/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Exclusion Registry Key - Write Access Requested detected on
    host $agent_name$. Matched data_win_eventdata_accessList:
    $data_win_eventdata_accessList$. Matched data_win_eventdata_objectName:
    $data_win_eventdata_objectName$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_accessList
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - exclusion
    - registry
    - windows_security
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_eventdata_accessList:/.*%%4417.*/ OR data_win_eventdata_accessList:/.*%%4418.*/) AND (data_win_system_eventID:"4656" OR data_win_system_eventID:"4663") AND data_win_eventdata_objectName:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender's own operational event confirming the exclusion write actually succeeded after this handle request on the Exclusions key.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: 'Sysmon EID 13 registry value set under Defender Exclusions: the actual write following the access request, identifying the writing process image.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Add-MpPreference -ExclusionPath/Process is the most common way the Exclusions key gets written; shows the command line behind the access.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: Script block (4104) evidence of the exclusion cmdlet, revealing which paths were excluded and by what loader script.
  - id: 48917adc-a28e-4f5d-b729-11e75da8941f
    name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
    reason: Alternative exclusion route via reg.exe add on the same Exclusions registry key this alert saw opened for write.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Attackers who add exclusions often escalate to disabling real-time protection entirely to stage payloads.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Tamper Protection firing means a Defender config change was attempted by a non-sanctioned process, confirming hostile intent.
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Generic Defender config change that co-occurs when exclusions are written or other protections are altered in the same session.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process that wrote Defender exclusions (cmdline)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Ee]xclusion(Path|Process|Extension).*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]efender\\[Ee]xclusions.*/)
    pivot_on:
    - host
    window: 1h
  - name: Registry writes to Defender exclusions and protection settings
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*/ AND (data_win_eventdata_targetObject:/.*[Ee]xclusions.*/ OR data_win_eventdata_targetObject:/.*[Dd]isable(AntiSpyware|RealtimeMonitoring|BehaviorMonitoring|IOAVProtection|AntiVirus).*/ OR data_win_eventdata_targetObject:/.*[Tt]amper.*/)
    pivot_on:
    - host
    window: 1h
  - name: Executable/script files dropped in user-writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Tt]emp\\.*[.](exe|dll|ps1|bat|scr)/ OR data_win_eventdata_targetFilename:/.*\\[Pp]rogram[Dd]ata\\.*[.](exe|dll|ps1)/ OR data_win_eventdata_targetFilename:/.*\\[Pp]ublic\\.*[.](exe|dll|ps1)/ OR data_win_eventdata_targetFilename:/.*\\[Aa]pp[Dd]ata\\.*[.](exe|dll|ps1|scr)/)
    pivot_on:
    - host
    window: 2h
  - name: Download and encoded PowerShell staging after exclusion
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload(String|File)|[Ii][Ee][Xx]|[Bb]its[Tt]ransfer|[Cc]ertutil.*urlcache).*/ OR data_win_eventdata_commandLine:/.*(-[Ee]nc|-[Ee]ncodedcommand|[Ff]rom[Bb]ase64[Ss]tring).*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence created after Defender weakened
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]chtasks.*[Cc]reate.*/ OR data_win_eventdata_commandLine:/.*sc.*create.*binpath.*/ )) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/)
    pivot_on:
    - host
    window: 4h
