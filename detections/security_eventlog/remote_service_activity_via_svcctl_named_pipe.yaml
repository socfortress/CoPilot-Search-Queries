name: Remote Service Activity via SVCCTL Named Pipe
id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
version: 1
schema_version: "1.0"
date: "2024-08-01"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects remote service activity via remote access to the svcctl named pipe.
  MITRE ATT&CK: T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_shareName:
              value: "\\\\*\\IPC$"
              case_insensitive: true
        - term:
            data_win_eventdata_relativeTargetName:
              value: "svcctl"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_accessList:
              value: "*WriteData*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_accessList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName equals
  '\\*\IPC$'; data_win_eventdata_relativeTargetName equals 'svcctl', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20230329155141/https://blog.menasec.net/2019/03/threat-hunting-26-remote-windows.html
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Remote Service Activity via SVCCTL Named Pipe detected on host $agent_name$.
    Matched data_win_eventdata_shareName: $data_win_eventdata_shareName$.
    Matched data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1021.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - service
    - svcctl
    - named
    - windows_security
    - lateral_movement
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/[Ss][Vv][Cc][Cc][Tt][Ll]/ AND data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Tt][Aa].*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
    - id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
      name: "Audit CVE Event"
      reason: "next kill-chain tactic: Lateral Movement"
  window: 1h
