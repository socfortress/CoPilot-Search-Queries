name: Remote Service Activity via SVCCTL Named Pipe
id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
version: 1
schema_version: "1.0"
date: "2024-08-01"
author: Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects remote service activity via remote access to the svcctl named pipe.
  MITRE ATT&CK: T1021.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5145"
        - term:
            data_win_eventdata_shareName:
              value: "\\\\*\\IPC$"
              case_insensitive: true
        - term:
            data_win_eventdata_relativeTargetName:
              value: "svcctl"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_accessList:
              value: "*WriteData*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_shareName
    - data_win_eventdata_relativeTargetName
    - data_win_eventdata_accessList
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5145'; data_win_eventdata_shareName equals
  '\\*\IPC$'; data_win_eventdata_relativeTargetName equals 'svcctl', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20230329155141/https://blog.menasec.net/2019/03/threat-hunting-26-remote-windows.html
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Remote Service Activity via SVCCTL Named Pipe detected on host $agent_name$.
    Matched data_win_eventdata_shareName: $data_win_eventdata_shareName$.
    Matched data_win_eventdata_relativeTargetName:
    $data_win_eventdata_relativeTargetName$. MITRE ATT&CK: T1021.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_shareName
      type: other
    - field: data_win_eventdata_relativeTargetName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - service
    - svcctl
    - named
    - windows_security
    - lateral_movement
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/[Ss][Vv][Cc][Cc][Tt][Ll]/ AND data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Tt][Aa].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: svcctl WriteData is the RPC call that creates the service; this fires on the resulting 4697 service install with the PsExec-style ADMIN$ binary path
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: 'Same service creation seen from the target side: the 4697 client/logon differs from the usual installer, confirming the remote svcctl call succeeded'
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: Impacket psexec/smbexec drives svcctl over IPC$ right after dropping a binary on ADMIN$; this rule catches that tool's share/pipe signature on the same host
  - id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82
    name: Suspicious PsExec Execution
    reason: PSEXESVC pipe/file access via 5145 on the same share session is the classic co-occurring artefact of the remote service execution
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: PsExec copies PSEXESVC.exe to ADMIN$ just before opening svcctl; the file creation on the target is the direct precursor
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: After the service is created through svcctl, the service binary starts as a child of services.exe; this is the follow-on process execution
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Cobalt Strike psexec/jump uses remote svcctl service creation with a recognizable command line; a likely implant-delivery follow-on
  - id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
    name: Possible Impacket SecretDump Remote Activity
    reason: secretsdump also uses remote svcctl/RemoteRegistry over IPC$ with the same admin credentials; a common next step after lateral access to dump hashes
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installation (7045/4697) with suspicious binary path
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_imagePath:/.*([Aa][Dd][Mm][Ii][Nn]\$|%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|\[Tt][Ee][Mm][Pp]\).*/ OR data_win_eventdata_serviceFileName:/.*([Aa][Dd][Mm][Ii][Nn]\$|%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|\[Tt][Ee][Mm][Pp]\).*/)
    pivot_on:
    - host
    window: 1h
  - name: Executable dropped to ADMIN$/System32 or SMB file writes via 5145
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Aa][Dd][Mm][Ii][Nn]\$/ AND data_win_eventdata_relativeTargetName:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1)/ AND data_win_eventdata_accessList:/.*[Ww][Rr][Ii][Tt][Ee][Dd][Aa][Tt][Aa].*/
    pivot_on:
    - host
    window: 1h
  - name: Child processes of services.exe running shells or recon tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Mm][Ii][Cc]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]1?|[Nn][Ll][Tt][Ee][Ss][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other remote service / task RPC pipes over IPC$ by this account
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND (data_win_eventdata_relativeTargetName:/(atsvc|winreg|samr|lsarpc|srvsvc|epmapper|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*)/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Network logons (type 3) by this account across hosts
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on:
    - user
    window: 6h
