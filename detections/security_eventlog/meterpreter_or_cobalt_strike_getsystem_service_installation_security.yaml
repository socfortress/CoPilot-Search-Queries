name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
version: 1
schema_version: "1.0"
date: "2023-11-15"
author: Teymur Kheirkhabarov, Ecco, Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of getsystem Meterpreter/Cobalt Strike command by detecting a
  specific service installation. MITRE ATT&CK: T1134.001, T1134.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*/c*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*echo*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*\\\\pipe\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_serviceFileName:
                                value: "*cmd*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_serviceFileName:
                                value: "*%COMSPEC%*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*rundll32*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*.dll,a*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceFileName:
                          value: "*/p:*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "\\\\\\\\127.0.0.1\\\\ADMIN$\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*/c*'; data_win_eventdata_serviceFileName matches '*echo*', among
  other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
  - https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
  - https://attack.mitre.org/techniques/T1134/001/
  - https://attack.mitre.org/techniques/T1134/002/

response:
  message: >
    Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    detected on host $agent_name$. Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1134.001, T1134.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.001
    - T1134.002
  custom_tags:
    - meterpreter
    - cobalt
    - strike
    - windows_security
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND ((data_win_eventdata_serviceFileName:/.*\/[Cc].*/ AND data_win_eventdata_serviceFileName:/.*[Ee][Cc][Hh][Oo].*/ AND data_win_eventdata_serviceFileName:/.*\\[Pp][Ii][Pp][Ee]\\.*/ AND (data_win_eventdata_serviceFileName:/.*[Cc][Mm][Dd].*/ OR data_win_eventdata_serviceFileName:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/)) OR (data_win_eventdata_serviceFileName:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_serviceFileName:/.*\.[Dd][Ll][Ll],[Aa].*/ AND data_win_eventdata_serviceFileName:/.*\/[Pp]:.*/) OR data_win_eventdata_serviceFileName:/\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Sibling 4697 detection for the same Cobalt Strike service-based SYSTEM elevation/lateral technique; co-firing confirms a Beacon rather than a benign service.
  - id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
    name: Potential CobaltStrike Service Installations - Registry
    reason: Registry-level view (Sysmon 13) of the same malicious service ImagePath written by getsystem; corroborates the 4697 event.
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: Getsystem service writes to a named pipe the SYSTEM payload connects to; Beacon pipe creation is the direct telemetry of the impersonation.
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: Pattern-based Beacon pipe names (msagent_, postex_, status_) around the getsystem event confirm Cobalt Strike post-exploitation.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Same 4697 service-install channel used by Metasploit psexec modules; distinguishes remote lateral movement from local getsystem.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Process-creation signature of the cmd/rundll32 patterns Meterpreter and Beacon spawn, the process-side view of the service launch.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Getsystem named-pipe impersonation command lines (echo to a named pipe) are the manual form of the same technique.
  - id: 2617e7ed-adb7-40ba-b0f3-8f9945fe6c09
    name: Suspicious SYSTEM User Process Creation
    reason: Once getsystem succeeds, the implant runs child processes as SYSTEM; this catches the resulting elevated process activity.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service install / service-launched cmd or rundll32 pipe echo (7045, 4697, process)
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697" OR data_win_system_eventID:"1") AND (data_win_eventdata_serviceFileName:/.*[Pp][Ii][Pp][Ee].*/ OR data_win_eventdata_imagePath:/.*[Pp][Ii][Pp][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo].*\\[Pp][Ii][Pp][Ee]\\.*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*\.[Dd][Ll][Ll],[Aa].*/)
    pivot_on:
    - host
    window: 1h
  - name: Named pipe creation/connection on this host (Beacon/Meterpreter pipes)
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*([Mm][Ss][Aa][Gg][Ee][Nn][Tt]_|[Pp][Oo][Ss][Tt][Ee][Xx]_|[Ss][Tt][Aa][Tt][Uu][Ss]_|[Mm][Ss][Ss][Ee]-|[Nn][Tt][Ss][Vv][Cc][Ss]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Processes running as SYSTEM spawned by services.exe with shell/LOLBin images
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: 'Credential access after elevation: LSASS access and dump tooling'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Ll][Ss][Aa][Ss][Ss]).*/))
    pivot_on:
    - host
    window: 2h
  - name: 'Lateral movement from this host: network logons and remote service creation by this user'
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "9")) OR data_win_system_eventID:"4697" OR data_win_system_eventID:"5145"
    pivot_on:
    - user
    window: 6h
