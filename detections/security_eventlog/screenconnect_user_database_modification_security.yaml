name: ScreenConnect User Database Modification - Security
id: 4109cb6a-a4af-438a-9f0c-056abba41c6f
version: 1
schema_version: "1.0"
date: "2024-02-20"
author: Matt Anderson, Kris Luzadre, Andrew Schwartz, Huntress
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4109cb6a-a4af-438a-9f0c-056abba41c6f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This detects file modifications to the temporary xml user database file
  indicating local user modification in the ScreenConnect server. This will
  occur during exploitation of the ScreenConnect Authentication Bypass
  vulnerability (CVE-2024-1709) in versions <23.9.8, but may also be observed
  when making legitimate modifications to local users or permissions. This
  requires an Advanced Auditing policy to log a successful Windows Event ID 4663
  events and with a SACL set on the directory.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4663"
        - term:
            data_win_eventdata_objectType:
              value: "File"
              case_insensitive: true
        - term:
            data_win_eventdata_accessMask:
              value: "0x6"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*.xml"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*Temp*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*ScreenConnect*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_processName:
              value: "*ScreenConnect.Service.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_accessMask
    - data_win_eventdata_objectName
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4663'; data_win_eventdata_objectType equals
  'File'; data_win_eventdata_accessMask equals '0x6', among other conditions.

known_false_positives: >
  This will occur legitimately as well and will result in some benign activity.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.connectwise.com/company/trust/security-bulletins/connectwise-screenconnect-23.9.8
  - https://www.cve.org/CVERecord?id=CVE-2024-1709
  - https://www.huntress.com/blog/a-catastrophe-for-control-understanding-the-screenconnect-authentication-bypass

response:
  message: >
    ScreenConnect User Database Modification - Security detected on host
    $agent_name$. Matched data_win_eventdata_objectType:
    $data_win_eventdata_objectType$. Matched data_win_eventdata_accessMask:
    $data_win_eventdata_accessMask$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_accessMask
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - screenconnect
    - database
    - security
    - windows_security
    - defense_impairment
    - cve_2024_1709
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4663" AND data_win_eventdata_objectType:/[Ff][Ii][Ll][Ee]/ AND data_win_eventdata_accessMask:/0[Xx]6/ AND data_win_eventdata_objectName:/.*\.[Xx][Mm][Ll]/ AND data_win_eventdata_objectName:/.*[Tt][Ee][Mm][Pp].*/ AND data_win_eventdata_objectName:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ AND data_win_eventdata_processName:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4c198a60-7d05-4daf-8bf7-4136fb6f5c62
    name: CVE-2024-1708 - ScreenConnect Path Traversal Exploitation - Security
    reason: CVE-2024-1708 path traversal is chained with the CVE-2024-1709 auth bypass; the traversal writes the files that precede/accompany the user.xml modification on the same ScreenConnect server.
  - id: 1a821580-588b-4323-9422-660f7e131020
    name: ScreenConnect User Database Modification
    reason: Sysmon EID 11 view of the same User.xml temp file write by ScreenConnect.Service.exe; confirms the user-database change with process/hash context.
  - id: 44d7af7e-88e6-4490-be11-55f7ff4d9fc1
    name: CVE-2024-1708 - ScreenConnect Path Traversal Exploitation
    reason: Sysmon file-create evidence of the traversal write that typically accompanies the auth-bypass admin-account creation.
  - id: 05164d17-8e11-4d7d-973e-9e4962436b87
    name: ScreenConnect - SlashAndGrab Exploitation Indicators
    reason: Same SlashAndGrab exploitation campaign (CVE-2024-1709/1708); file artefacts confirm the server was exploited rather than legitimately administered.
  - id: b19146a3-25d4-41b4-928b-1e2a92641b1b
    name: Remote Access Tool - ScreenConnect Server Web Shell Execution
    reason: 'After a rogue admin is created, attackers upload extensions/web shells and the server process spawns cmd/powershell: the next step on the server.'
  - id: 7b582f1a-b318-4c6a-bf4e-66fe49bf55a5
    name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
    reason: With the new admin account, the attacker uses ScreenConnect's command execution to run commands on the server or managed endpoints.
  - id: fec96f39-988b-4586-b746-b93d59fd1922
    name: ScreenConnect Temporary Installation Artefact
    reason: Attackers push ScreenConnect client installers to endpoints through the compromised server; temp install artefacts show the resulting deployment.
  - id: c8b00925-926c-47e3-beea-298fd563728e
    name: Remote Access Tool Services Have Been Installed - Security
    reason: Follow-on service installation (ScreenConnect client or other RMM) for persistence after server takeover.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by ScreenConnect service (web shell / command exec)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Cc][Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Files written into ScreenConnect App_Extensions or Temp (traversal / webshell drop)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ AND (data_win_eventdata_targetFilename:/.*([Aa][Pp][Pp]_[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]|\.[Aa][Ss][Hh][Xx]|\.[Aa][Ss][Pp][Xx]|\.[Ee][Xx][Ee]|\.[Dd][Ll][Ll]|\.[Pp][Ss]1|\.[Bb][Aa][Tt]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Local account creation and admin group additions on the server
    query: (data_win_system_eventID:"4720" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4724")
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from ScreenConnect server to external hosts (C2 / payload staging)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Recon, tool download and ransomware prep after server takeover
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt] +[Uu][Ss][Ee][Rr]|[Nn][Ee][Tt] +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]).*/)
    pivot_on:
    - host
    window: 4h
