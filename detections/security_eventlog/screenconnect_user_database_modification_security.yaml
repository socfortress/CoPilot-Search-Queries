name: ScreenConnect User Database Modification - Security
id: 4109cb6a-a4af-438a-9f0c-056abba41c6f
version: 1
schema_version: "1.0"
date: "2024-02-20"
author: Matt Anderson, Kris Luzadre, Andrew Schwartz, Huntress
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4109cb6a-a4af-438a-9f0c-056abba41c6f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This detects file modifications to the temporary xml user database file
  indicating local user modification in the ScreenConnect server. This will
  occur during exploitation of the ScreenConnect Authentication Bypass
  vulnerability (CVE-2024-1709) in versions <23.9.8, but may also be observed
  when making legitimate modifications to local users or permissions. This
  requires an Advanced Auditing policy to log a successful Windows Event ID 4663
  events and with a SACL set on the directory.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4663"
        - term:
            data_win_eventdata_objectType:
              value: "File"
              case_insensitive: true
        - term:
            data_win_eventdata_accessMask:
              value: "0x6"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*.xml"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*Temp*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*ScreenConnect*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_processName:
              value: "*ScreenConnect.Service.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_accessMask
    - data_win_eventdata_objectName
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4663'; data_win_eventdata_objectType equals
  'File'; data_win_eventdata_accessMask equals '0x6', among other conditions.

known_false_positives: >
  This will occur legitimately as well and will result in some benign activity.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.connectwise.com/company/trust/security-bulletins/connectwise-screenconnect-23.9.8
  - https://www.cve.org/CVERecord?id=CVE-2024-1709
  - https://www.huntress.com/blog/a-catastrophe-for-control-understanding-the-screenconnect-authentication-bypass

response:
  message: >
    ScreenConnect User Database Modification - Security detected on host
    $agent_name$. Matched data_win_eventdata_objectType:
    $data_win_eventdata_objectType$. Matched data_win_eventdata_accessMask:
    $data_win_eventdata_accessMask$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_accessMask
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - screenconnect
    - database
    - security
    - windows_security
    - defense_impairment
    - cve_2024_1709
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4663" AND data_win_eventdata_objectType:/[Ff][Ii][Ll][Ee]/ AND data_win_eventdata_accessMask:/0[Xx]6/ AND data_win_eventdata_objectName:/.*\.[Xx][Mm][Ll]/ AND data_win_eventdata_objectName:/.*[Tt][Ee][Mm][Pp].*/ AND data_win_eventdata_objectName:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ AND data_win_eventdata_processName:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "This account's logon activity across hosts"
      query: '(data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")'
      pivot_on: [user]
      window: 6h
    - name: "Account / group / privilege changes involving this account"
      query: '(data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4672")'
      pivot_on: [user]
      window: 6h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))'
      pivot_on: [host]
      window: 1h
