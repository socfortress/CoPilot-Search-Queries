name: Credential Dumping Tools Service Execution - Security
id: f0d1feba-4344-4ca9-8121-a6c97bd6df52
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Florian Roth (Nextron Systems), Teymur Kheirkhabarov, Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0d1feba-4344-4ca9-8121-a6c97bd6df52
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects well-known credential dumping tools execution via service execution
  events. MITRE ATT&CK: T1003.001, T1003.002, T1003.004, T1003.005, T1003.006,
  T1569.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*cachedump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*dumpsvc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*fgexec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*gsecdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*mimidrv*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*pwdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceFileName:
                    value: "*servpw*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceFileName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceFileName
  matches '*cachedump*'; data_win_eventdata_serviceFileName matches '*dumpsvc*',
  among other conditions.

known_false_positives: >
  Legitimate Administrator using credential dumping tool for password recovery.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/005/
  - https://attack.mitre.org/techniques/T1003/006/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Credential Dumping Tools Service Execution - Security detected on host
    $agent_name$. Matched data_win_eventdata_serviceFileName:
    $data_win_eventdata_serviceFileName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1003.001, T1003.002, T1003.004, T1003.005, T1003.006,
    T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceFileName
      type: file_name
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1003.002
    - T1003.004
    - T1003.005
    - T1003.006
    - T1569.002
  custom_tags:
    - credential
    - dumping
    - tools
    - windows_security
    - credential_access
    - execution
    - s0005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND (data_win_eventdata_serviceFileName:/.*[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_serviceFileName:/.*[Dd][Uu][Mm][Pp][Ss][Vv][Cc].*/ OR data_win_eventdata_serviceFileName:/.*[Ff][Gg][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_serviceFileName:/.*[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_serviceFileName:/.*[Mm][Ii][Mm][Ii][Dd][Rr][Vv].*/ OR data_win_eventdata_serviceFileName:/.*[Pp][Ww][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_serviceFileName:/.*[Ss][Ee][Rr][Vv][Pp][Ww].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: mimidrv is Mimikatz's kernel driver; the service install is usually paired with mimikatz.exe process creation on the same host
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Dumper services (gsecdump, pwdump, cachedump) read LSASS memory right after the service starts; confirms actual credential theft
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Alternate LSASS dumping method attackers fall back to when the tool-based service is blocked or after it runs
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Co-occurring LSASS dump technique from the same toolset; the dump file is the harvested credential material
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: fgexec/dumpsvc are typically deployed remotely as services via PsExec-style execution; indicates remote delivery of the dumper
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The 4697 event is a service install; sc.exe/service creation commands are the process-level precursor of the same install
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: On a domain controller, the follow-on to credential tooling is NTDS.dit extraction to obtain all domain hashes
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: Remote SAM/LSA dumping via service-based tooling leaves temp file artifacts; same remote credential harvest outcome
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other service installs by tool or from suspicious paths
    query: (data_win_system_eventID:"4697" OR data_win_system_eventID:"7045") AND (data_win_eventdata_serviceFileName:/.*([Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic|[Aa]dmin\$|[Cc]\$).*/ OR data_win_eventdata_imagePath:/.*([Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic|[Aa]dmin\$|[Cc]\$).*/ OR data_win_eventdata_serviceFileName:/.*([Cc]md|[Pp]ower[Ss]hell).*/)
    pivot_on:
    - host
    window: 4h
  - name: LSASS process access or dump tooling on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]).*/ OR data_win_eventdata_image:/.*(mimikatz|procdump|pwdump|gsecdump|wce|fgdump).*/))
    pivot_on:
    - host
    window: 1h
  - name: Driver load or dump file written (mimidrv, credential dumps, SAM/NTDS hives)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\.dmp|lsass|pwdump|cachedump|gsecdump|\.kirbi|ntds\.dit|[Ss][Aa][Mm]\.(save|hive)|[Ss][Yy][Ss][Tt][Ee][Mm]\.(save|hive)).*/) OR (data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*mimidrv.*/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons by this account (credential reuse / lateral movement)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10") AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on:
    - user
    window: 6h
  - name: Remote execution tooling spawned (PsExec, WMI, WinRM, remote service)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
