name: Uncommon Outbound Kerberos Connection - Security
id: eca91c7c-9214-47b9-b4c5-cb1d7e4f2350
version: 1
schema_version: "1.0"
date: "2024-03-15"
author: Ilyas Ochkov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eca91c7c-9214-47b9-b4c5-cb1d7e4f2350
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon outbound network activity via Kerberos default port
  indicating possible lateral movement or first stage PrivEsc via delegation.
  MITRE ATT&CK: T1558.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5156"
        - term:
            data_win_eventdata_destPort: "88"
        - exists:
            field: "data_win_eventdata_application"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_application:
                                value: "\\\\device\\\\harddiskvolume*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_application:
                                value: "C:*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_application:
                          value: "*\\\\Windows\\\\System32\\\\lsass.exe"
                          case_insensitive: true
        - exists:
            field: "data_win_eventdata_application"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_application:
                                      value: "\\\\device\\\\harddiskvolume*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_application:
                                      value: "C:*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_application:
                                      value: "*\\\\Program Files (x86)\\\\Google\\\\Chrome\\\\Application\\\\chrome.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_application:
                                      value: "*\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_application:
                                      value: "\\\\device\\\\harddiskvolume*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_application:
                                      value: "C:*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_application:
                                      value: "*\\\\Program Files (x86)\\\\Mozilla Firefox\\\\firefox.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_application:
                                      value: "*\\\\Program Files\\\\Mozilla Firefox\\\\firefox.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_application:
                          value: "*\\\\tomcat\\\\bin\\\\tomcat8.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destPort
    - data_win_eventdata_application
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5156'; data_win_eventdata_destPort equals
  '88'; data_win_eventdata_application matches '\device\harddiskvolume*', among
  other conditions.

known_false_positives: >
  Web Browsers and third party application might generate similar activity. An
  initial baseline is required. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/GhostPack/Rubeus
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    Uncommon Outbound Kerberos Connection - Security detected on host
    $agent_name$. Matched data_win_eventdata_destPort:
    $data_win_eventdata_destPort$. Matched data_win_eventdata_application:
    $data_win_eventdata_application$. MITRE ATT&CK: T1558.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_destPort
      type: other
    - field: data_win_eventdata_application
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - uncommon
    - outbound
    - kerberos
    - windows_security
    - lateral_movement
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5156" AND data_win_eventdata_destPort:"88" AND _exists_:data_win_eventdata_application AND NOT ((data_win_eventdata_application:/\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee].*/ OR data_win_eventdata_application:/[Cc]:.*/) AND data_win_eventdata_application:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_application AND NOT (((data_win_eventdata_application:/\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee].*/ OR data_win_eventdata_application:/[Cc]:.*/) AND (data_win_eventdata_application:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_application:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/)) OR ((data_win_eventdata_application:/\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee].*/ OR data_win_eventdata_application:/[Cc]:.*/) AND (data_win_eventdata_application:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_application:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/)) OR data_win_eventdata_application:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt]\\[Bb][Ii][Nn]\\[Tt][Oo][Mm][Cc][Aa][Tt]8\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
    name: Uncommon Outbound Kerberos Connection
    reason: Sysmon EID 3 twin of this WFP 5156 detection; same non-lsass process talking to port 88 and gives image/user/dest IP for the offending binary
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: A tool speaking Kerberos directly (Rubeus-style) commonly requests RC4 service tickets for SPNs; DC-side 4769 burst corroborates the client-side port 88 traffic
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Process creation for the binary that opened the port 88 connection, showing asktgt/asktgs/kerberoast arguments
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: If the non-lsass Kerberos client is powershell.exe, the in-memory ticket request code (KerberosRequestorSecurityToken) appears in script block logs
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: 'Follow-on: forged or stolen tickets obtained over port 88 are injected into a logon session to be used for lateral movement'
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: Kerberos failures and anomalies on the DC (bad tickets, pre-auth issues) that follow tooling forging or requesting tickets outside lsass
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: 'Precursor: AD enumeration to find SPNs and delegation targets before a ticket-abuse tool contacts the KDC'
  - id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
    name: Impacket Lateral Movement Commandline Parameters
    reason: 'Follow-on: once service tickets are obtained, they are used for remote execution against the targeted service hosts'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberoast/AS-REP/delegation tooling execution (Rubeus-style arguments)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Tt].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss]4[Uu].*/ OR data_win_eventdata_commandLine:/.*[Tt][Gg][Tt][Dd][Ee][Ll][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.*\/[Pp][Tt][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Process connecting to Kerberos port 88 (Sysmon network)
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88"
    pivot_on:
    - host
    window: 2h
  - name: Service ticket and TGT requests by this account (DC)
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4770" OR data_win_system_eventID:"4771")
    pivot_on:
    - user
    window: 6h
  - name: Network and explicit-credential logons using the account after ticket activity
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")) OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 6h
  - name: Admin share and remote service creation following ticket abuse
    query: data_win_system_eventID:"5140" OR data_win_system_eventID:"5145" OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4697"
    pivot_on:
    - host
    window: 4h
