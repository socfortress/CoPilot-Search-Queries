name: Suspicious Computer Account Name Change CVE-2021-42287
id: 45eb2ae2-9aa2-4c3a-99a5-6e5077655466
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 45eb2ae2-9aa2-4c3a-99a5-6e5077655466
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the renaming of an existing computer account to a account name that
  doesn't contain a $ symbol as seen in attacks against CVE-2021-42287. MITRE
  ATT&CK: T1036, T1098.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4781"
        - wildcard:
            data_win_eventdata_oldTargetUserName: "*$*"
        - exists:
            field: "data_win_eventdata_newTargetUserName"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_newTargetUserName: "*$*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_oldTargetUserName
    - data_win_eventdata_newTargetUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4781'; data_win_eventdata_oldTargetUserName
  matches '*$*'; data_win_eventdata_newTargetUserName matches '*$*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/@mvelazco/hunting-for-samaccountname-spoofing-cve-2021-42287-and-domain-controller-impersonation-f704513c8a45
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    Suspicious Computer Account Name Change CVE-2021-42287 detected on host
    $agent_name$. Matched data_win_eventdata_oldTargetUserName:
    $data_win_eventdata_oldTargetUserName$. Matched
    data_win_eventdata_newTargetUserName:
    $data_win_eventdata_newTargetUserName$. MITRE ATT&CK: T1036, T1098
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_oldTargetUserName
      type: user
    - field: data_win_eventdata_newTargetUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1098
  custom_tags:
    - computer
    - account
    - change
    - windows_security
    - privilege_escalation
    - persistence
    - stealth
    - cve_2021_42287
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4781" AND data_win_eventdata_oldTargetUserName:/.*\$.*/ AND _exists_:data_win_eventdata_newTargetUserName AND NOT (data_win_eventdata_newTargetUserName:/.*\$.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d00a9a72-2c09-4459-ad03-5e0a23351e36
    name: Suspicious LDAP-Attributes Used
    reason: noPac setup edits computer-object attributes (sAMAccountName/SPN) over LDAP; this is the same directory-attribute tampering seen just before the rename
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: After the machine account is renamed to a DC name, the attacker requests a TGT/S4U2self ticket; Kerberos failures and anomalies cluster around the rename
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Forged or S4U-derived service tickets obtained with the spoofed DC name are often requested with downgraded RC4 encryption
  - id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
    name: Potential Privilege Escalation via Local Kerberos Relay over LDAP
    reason: Alternative machine-account-based escalation path to SYSTEM/domain rights an attacker tries alongside or instead of noPac
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'The usual end goal of noPac: impersonated DC/admin ticket is used to DCSync krbtgt and other hashes'
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: Attacker who gains domain admin via the spoofed DC account may grant themselves DCSync rights for persistence
  - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
    name: Addition of SID History to Active Directory Object
    reason: 'Post-escalation persistence: SID history injection to keep domain-admin equivalence'
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: With the impersonated DC ticket noPac tooling (Impacket) typically executes commands on the DC via psexec-style service install
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Machine account creation/attribute changes (MAQ abuse setup)
    query: (data_win_system_eventID:"4741" OR data_win_system_eventID:"4742" OR data_win_system_eventID:"4781")
    pivot_on:
    - host
    window: 6h
  - name: Kerberos TGT/service tickets for LDAP/CIFS/host services (DC impersonation)
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769") AND (data_win_eventdata_serviceName:ldap* OR data_win_eventdata_serviceName:cifs* OR data_win_eventdata_serviceName:host* OR data_win_eventdata_serviceName:krbtgt*)
    pivot_on:
    - host
    window: 2h
  - name: DCSync replication rights used (directory replication GUIDs)
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2* OR data_win_eventdata_properties:*89e95b76-444d-4c62-991a-0facbeda640c*)
    pivot_on:
    - host
    window: 4h
  - name: Network logons by this account to other systems after rename
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - user
    window: 4h
  - name: Remote service installation / privileged group changes on the DC
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756")
    pivot_on:
    - host
    window: 4h
