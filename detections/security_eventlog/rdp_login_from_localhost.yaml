name: RDP Login from Localhost
id: 51e33403-2a37-4d66-a574-1fda1782cc31
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 51e33403-2a37-4d66-a574-1fda1782cc31
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  RDP login with localhost source address may be a tunnelled login. MITRE
  ATT&CK: T1021.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4624"
        - term:
            data_win_eventdata_logonType: "10"
        - bool:
            should:
              - term:
                  data_win_eventdata_ipAddress: "::1"
              - term:
                  data_win_eventdata_ipAddress: "127.0.0.1"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_ipAddress
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_logonType equals
  '10'; data_win_eventdata_ipAddress equals '::1', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    RDP Login from Localhost detected on host $agent_name$. Matched
    data_win_eventdata_logonType: $data_win_eventdata_logonType$. Matched
    data_win_eventdata_ipAddress: $data_win_eventdata_ipAddress$. MITRE ATT&CK:
    T1021.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_ipAddress
      type: ip_address

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.001
  custom_tags:
    - login
    - localhost
    - windows_security
    - lateral_movement
    - car_2013_07_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"10" AND (data_win_eventdata_ipAddress:"::1" OR data_win_eventdata_ipAddress:"127.0.0.1")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: Plink -L/-R forwarding to port 3389 is the classic mechanism that makes a remote RDP session arrive from 127.0.0.1; it directly precedes the localhost logon.
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: ssh.exe -L/-R to 3389 creates the tunnel whose endpoint produces the loopback-sourced type 10 logon.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: netsh portproxy to 3389 re-sources RDP traffic locally, an alternative tunnel setup that precedes the localhost logon.
  - id: a54f842a-3713-4b45-8c84-5f136fdebd3c
    name: New PortProxy Registry Entry Added
    reason: Registry-level evidence of a netsh portproxy rule, persisting a forwarder that relays RDP so it appears to come from loopback.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Process command lines tunnelling RDP (port 3389 with forwarding switches) are the setup step that causes this localhost logon.
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Chisel reverse tunnels commonly expose 3389 on loopback; its execution precedes a localhost RDP login.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: ngrok tcp 3389 relays internet RDP through a local agent so the session source is localhost.
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: Attackers grant a backdoor account RDP rights before logging in through the tunnel; confirms hands-on-keyboard access.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tunnelling tool or port-forward set up for RDP (plink/ssh/chisel/ngrok/netsh portproxy)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[\\][Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[\\][Ss][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Hh][Ii][Ss][Ee][Ll].*/ OR data_win_eventdata_image:/.*[Nn][Gg][Rr][Oo][Kk].*/) AND (data_win_eventdata_commandLine:*3389* OR data_win_eventdata_commandLine:/.* -[RrLl] .*/ OR data_win_eventdata_commandLine:*tcp*)) OR (data_win_eventdata_image:/.*[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*portproxy*))
    pivot_on:
    - host
    window: 6h
  - name: Loopback connections to RDP port 3389 on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389" AND (data_win_eventdata_sourceIp:"127.0.0.1" OR data_win_eventdata_sourceIp:"::1" OR data_win_eventdata_destinationIp:"127.0.0.1" OR data_win_eventdata_destinationIp:"::1")
    pivot_on:
    - host
    window: 2h
  - name: Local account or RDP-group changes preceding the tunnelled login
    query: (data_win_system_eventID:"4720" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4724") OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]1?\s+(user|localgroup)).*/ AND data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]|[Rr][Dd][Pp]|[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Firewall/registry changes enabling RDP and special-privilege logons for the account
    query: (data_win_system_eventID:"4672") OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Tt]erminal [Ss]erver|[Ff]Deny[Tt][Ss][Cc]onnections|[Pp]ort[Nn]umber).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*3389.*/)
    pivot_on:
    - user
    window: 2h
  - name: Credential access or discovery launched from the tunnelled session
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[\\][Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]1? [Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Qq][Uu][Ee][Rr][Yy] [Uu][Ss][Ee][Rr]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]).*/))
    pivot_on:
    - host
    window: 2h
