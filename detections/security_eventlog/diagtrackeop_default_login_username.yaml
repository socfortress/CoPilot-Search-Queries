name: DiagTrackEoP Default Login Username
id: 2111118f-7e46-4fc8-974a-59fd8ec95196
version: 1
schema_version: "1.0"
date: "2022-08-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2111118f-7e46-4fc8-974a-59fd8ec95196
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the default "UserName" used by the DiagTrackEoP POC.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4624"
        - term:
            data_win_eventdata_logonType: "9"
        - term:
            data_win_eventdata_targetOutboundUserName:
              value: "thisisnotvaliduser"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonType
    - data_win_eventdata_targetOutboundUserName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4624'; data_win_eventdata_logonType equals
  '9'; data_win_eventdata_targetOutboundUserName equals 'thisisnotvaliduser'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Wh04m1001/DiagTrackEoP/blob/3a2fc99c9700623eb7dc7d4b5f314fd9ce5ef51f/main.cpp#L46

response:
  message: >
    DiagTrackEoP Default Login Username detected on host $agent_name$. Matched
    data_win_eventdata_logonType: $data_win_eventdata_logonType$. Matched
    data_win_eventdata_targetOutboundUserName:
    $data_win_eventdata_targetOutboundUserName$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_logonType
      type: other
    - field: data_win_eventdata_targetOutboundUserName
      type: user

tags:
  asset_type: Endpoint
  custom_tags:
    - diagtrackeop
    - default
    - login
    - windows_security
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_targetOutboundUserName:/[Tt][Hh][Ii][Ss][Ii][Ss][Nn][Oo][Tt][Vv][Aa][Ll][Ii][Dd][Uu][Ss][Ee][Rr]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
    name: HackTool - SysmonEOP Execution
    reason: Sibling local-EoP POC of the same family (arbitrary file write/move abuse of a SYSTEM service); same operator toolbox, often tried alongside DiagTrackEoP on the same host.
  - id: cf0c254b-22f1-4b2b-8221-e137b3c0af94
    name: HackTool - Impersonate Execution
    reason: Token impersonation tooling is the usual follow-on once a logon-type-9 / SYSTEM context has been obtained.
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Alternative local privilege escalation to SYSTEM; an attacker whose DiagTrackEoP attempt works or fails commonly falls back to a Potato-style exploit.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Named-pipe impersonation is a parallel route to SYSTEM from a service-account foothold, confirming the EoP intent.
  - id: windows-access-token-winlogon-duplicate-handle-001
    name: Windows Access Token Manipulation Winlogon Duplicate Token Handle
    reason: Duplicating the winlogon SYSTEM token is a classic step after gaining elevation, to run arbitrary payloads as SYSTEM.
  - id: d522eca2-2973-4391-a3e0-ef0374321dae
    name: Abused Debug Privilege by Arbitrary Parent Processes
    reason: EoP exploits typically enable SeDebugPrivilege to open SYSTEM processes; same behaviour chain as the logon-type-9 credential trick.
  - id: 79ce34ca-af29-4d0e-b832-fc1b377020db
    name: Whoami.EXE Execution From Privileged Process
    reason: Attacker runs whoami from the new SYSTEM shell to verify the exploit worked, directly after successful EoP.
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: whoami /priv is the pre-exploit check for impersonation-capable privileges that precedes EoP POCs like this one.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells and tooling running as SYSTEM after the EoP attempt
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|conhost|whoami|net|net1|sc|reg|rundll32|mshta)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: DiagTrack service tampering or DiagTrack-named file drops
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Dd][Ii][Aa][Gg][Tt][Rr][Aa][Cc][Kk]|[Uu][Tt][Cc]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Dd][Ii][Aa][Gg][Tt][Rr][Aa][Cc][Kk].*/)
    pivot_on:
    - host
    window: 2h
  - name: DLL or EXE planted in System32 or Windows directories
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\([Ss][Yy][Ss][Tt][Ee][Mm]32|[Ss][Yy][Ss][Ww][Oo][Ww]64)\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Ss][Yy][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Other NewCredentials, explicit-credential and privileged logons for this account
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9") OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 6h
  - name: EoP tool execution from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Uu][Ss][Ee][Rr][Ss]\\.*\\([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Dd][Ee][Ss][Kk][Tt][Oo][Pp])|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp])\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
