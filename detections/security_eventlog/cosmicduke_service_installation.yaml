name: CosmicDuke Service Installation
id: cb062102-587e-4414-8efa-dbe3c7bf19c6
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems), Daniil Yugoslavskiy, oscd.community (update)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cb062102-587e-4414-8efa-dbe3c7bf19c6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the installation of a service named "javamtsup" on the system. The
  CosmicDuke info stealer uses Windows services typically named "javamtsup" for
  persistence. MITRE ATT&CK: T1543.003, T1569.002.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4697"
        - term:
            data_win_eventdata_serviceName:
              value: "javamtsup"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4697'; data_win_eventdata_serviceName equals
  'javamtsup'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.f-secure.com/wp-content/uploads/2019/10/CosmicDuke.pdf
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    CosmicDuke Service Installation detected on host $agent_name$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. Matched
    data_win_eventdata_subjectUserName: $data_win_eventdata_subjectUserName$.
    MITRE ATT&CK: T1543.003, T1569.002
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_serviceName
      type: service
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
    - T1569.002
  custom_tags:
    - cosmicduke
    - service
    - installation
    - windows_security
    - privilege_escalation
    - execution
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4697" AND data_win_eventdata_serviceName:/[Jj][Aa][Vv][Aa][Mm][Tt][Ss][Uu][Pp]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Same 4697 source; shows whether the javamtsup service was installed by an unusual or remote client, separating local dropper install from lateral deployment.
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: Same service creation seen from the System log (7045); corroborates the install and may expose a suspicious ImagePath for the javamtsup binary.
  - id: 26481afe-db26-4228-b264-25a29fe6efc7
    name: Uncommon Service Installation Image Path
    reason: CosmicDuke services point to a dropped binary outside normal service paths; this flags the same installation by its unusual image path.
  - id: 5e993621-67d4-488a-b9ae-b420d08b96cb
    name: Service Installation in Suspicious Folder
    reason: The javamtsup binary is typically dropped in user-writable or temp folders before the service is created.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Process-creation view of the same persistence step via sc.exe create or PowerShell New-Service, revealing the installer's parent and command line.
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Registry-level footprint of the new service key under Services; confirms the persistence and the ImagePath value.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: CosmicDuke is an info stealer; credential dumping on the same host is a likely follow-on after persistence is established.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process that created or started the javamtsup service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Jj][Aa][Vv][Aa][Mm][Tt][Ss][Uu][Pp].*/ OR data_win_eventdata_image:/.*[Jj][Aa][Vv][Aa][Mm][Tt][Ss][Uu][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Service binary file dropped (javamtsup)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Jj][Aa][Vv][Aa][Mm][Tt][Ss][Uu][Pp].*/
    pivot_on:
    - host
    window: 24h
  - name: Service creation via System log or sc.exe on this host
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Registry service key or Run key persistence on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Jj][Aa][Vv][Aa][Mm][Tt][Ss][Uu][Pp].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network and DNS from the service host (C2)
    query: data_win_system_eventID:"3" OR data_win_system_eventID:"22"
    pivot_on:
    - host
    window: 2h
