name: DPAPI Domain Backup Key Extraction
id: 4ac1f50b-3bd0-4968-902d-868b4647937e
version: 1
schema_version: "1.0"
date: "2022-02-24"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4ac1f50b-3bd0-4968-902d-868b4647937e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects tools extracting LSA secret DPAPI domain backup key from Domain
  Controllers. MITRE ATT&CK: T1003.004.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4662"
        - term:
            data_win_eventdata_objectType:
              value: "SecretObject"
              case_insensitive: true
        - term:
            data_win_eventdata_accessMask:
              value: "0x2"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*BCKUPKEY*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_accessMask
    - data_win_eventdata_objectName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4662'; data_win_eventdata_objectType equals
  'SecretObject'; data_win_eventdata_accessMask equals '0x2', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190620-DomainDPAPIBackupKeyExtraction/notebook.html
  - https://attack.mitre.org/techniques/T1003/004/

response:
  message: >
    DPAPI Domain Backup Key Extraction detected on host $agent_name$. Matched
    data_win_eventdata_objectType: $data_win_eventdata_objectType$. Matched
    data_win_eventdata_accessMask: $data_win_eventdata_accessMask$. MITRE
    ATT&CK: T1003.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_accessMask
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.004
  custom_tags:
    - dpapi
    - domain
    - backup
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4662" AND data_win_eventdata_objectType:/[Ss][Ee][Cc][Rr][Ee][Tt][Oo][Bb][Jj][Ee][Cc][Tt]/ AND data_win_eventdata_accessMask:/0[Xx]2/ AND data_win_eventdata_objectName:/.*[Bb][Cc][Kk][Uu][Pp][Kk][Ee][Yy].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 39a94fd1-8c9a-4ff6-bf22-c058762f8014
    name: DPAPI Domain Master Key Backup Attempt
    reason: Event 4692 is the DC-side master key backup/recovery call (MS-BKRP) that the same tooling issues alongside the BCKUPKEY LSA secret read; co-occurring on the DC
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Attackers holding Domain Admin-equivalent rights on the DC who pull the DPAPI backup key typically also DCSync krbtgt/user hashes; same 4662 object-access audit stream
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: SharpDPAPI (backupkey/masterkeys /pvk) is the common tool that retrieves the domain backup key; process-creation view of the same action
  - id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
    name: DPAPI Backup Keys And Certificate Export Activity IOC
    reason: 'Follow-on: the extracted backup key is written to disk as a .pvk/ntds_capi file, which this file-creation rule catches'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz lsadump::backupkeys is the classic way to read the BCKUPKEY secret from a DC; execution precedes or coincides with the 4662 event
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: Remote LSA secret/NTDS dumping tools that read secret objects over RPC leave output files on the DC alongside the BCKUPKEY access
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: Remote execution on the DC by the same Impacket toolkit is a likely precursor for the account performing the secret read
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'Likely next step: harvested credentials and decrypted DPAPI blobs are reused via pass-the-hash for lateral movement'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Backup-key / DPAPI extraction tooling executed on this DC
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::[Bb][Aa][Cc][Kk][Uu][Pp][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii]::.*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp][Kk][Ee][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)
    pivot_on:
    - host
    window: 2h
  - name: Exported domain backup key / cert files written on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.pvk OR data_win_eventdata_targetFilename:*ntds_capi* OR data_win_eventdata_targetFilename:*.pfx OR data_win_eventdata_targetFilename:*.pkcs12 OR data_win_eventdata_targetFilename:*.key)
    pivot_on:
    - host
    window: 2h
  - name: DPAPI master key recovery and DS replication-right access (4692/4693/4662) on this DC
    query: (data_win_system_eventID:"4692" OR data_win_system_eventID:"4693" OR (data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6ad* OR data_win_eventdata_properties:*1131f6aa* OR data_win_eventdata_properties:*89e95b76*)))
    pivot_on:
    - host
    window: 2h
  - name: Privileged and network logons by this account (credential reuse after extraction)
    query: (data_win_system_eventID:"4672" OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")))
    pivot_on:
    - user
    window: 6h
  - name: Remote execution and service installs on this DC (Impacket/PsExec style)
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697" OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$.*/)))
    pivot_on:
    - host
    window: 2h
