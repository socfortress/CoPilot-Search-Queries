name: Register new Logon Process by Rubeus
id: 12e6d621-194f-4f59-90cc-1959e21e69f7
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Roberto Rodriguez (source), Ilyas Ochkov (rule), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 12e6d621-194f-4f59-90cc-1959e21e69f7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential use of Rubeus via registered new trusted logon process.
  MITRE ATT&CK: T1558.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4611"
        - term:
            data_win_eventdata_logonProcessName:
              value: "User32LogonProcesss"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_logonProcessName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4611'; data_win_eventdata_logonProcessName
  equals 'User32LogonProcesss'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.specterops.io/hunting-in-active-directory-unconstrained-delegation-forests-trusts-71f2b33688e1
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    Register new Logon Process by Rubeus detected on host $agent_name$. Matched
    data_win_eventdata_logonProcessName: $data_win_eventdata_logonProcessName$.
    Matched data_win_eventdata_subjectUserName:
    $data_win_eventdata_subjectUserName$. MITRE ATT&CK: T1558.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_logonProcessName
      type: process
    - field: data_win_eventdata_subjectUserName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - register
    - logon
    - rubeus
    - windows_security
    - lateral_movement
    - privilege_escalation
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4611" AND data_win_eventdata_logonProcessName:/[Uu][Ss][Ee][Rr]32[Ll][Oo][Gg][Oo][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Process-creation view of the same tool; Rubeus registers its own logon process via LsaRegisterLogonProcess when run with elevated rights, so the binary or command line should exist on the host.
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: Rubeus is often loaded reflectively in PowerShell; script block logging confirms in-memory Rubeus behind the 4611 event.
  - id: 6daac7fc-77d1-449a-a71a-e6b4d59a0e54
    name: User Couldn't Call a Privileged Service 'LsaRegisterLogonProcess'
    reason: Same LsaRegisterLogonProcess API; failure (4673) is the unprivileged attempt, a retry as SYSTEM or elevated then yields the 4611.
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: Rubeus kerberoast is the most common follow-on, producing bursts of 4769 service ticket requests for SPN accounts.
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Rubeus requests RC4 tickets for kerberoasting or downgrades, visible as RC4 (0x17) ticket encryption.
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: Rubeus asktgt/ptt with a hash or key creates a new-credentials logon (type 9) using the Kerberos package, the overpass-the-hash step after registering the logon process.
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: Ticket injection (ptt/kerberos::ptt) is the usual use of tickets Rubeus obtains, often alongside Mimikatz on the same host.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Command-line ticket requests (asktgt, kerberoast, s4u) are the direct actions of Rubeus once its logon process is registered.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rubeus binary or Kerberos-abuse command line on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_originalFileName:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*(asktgt|asktgs|kerberoast|asreproast|s4u|renew|tgtdeleg|harvest|monitor|\/ptt|\/rc4:|\/aes256:|\/ticket:).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos ticket requests by this account (TGT/TGS bursts, RC4)
    query: data_win_system_eventID:("4768" OR "4769" OR "4770" OR "4771")
    pivot_on:
    - user
    window: 4h
  - name: New-credentials or network logons following ticket abuse
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"3") AND (data_win_eventdata_authenticationPackageName:"Kerberos" OR data_win_eventdata_logonProcessName:/.*[Ss][Ee][Cc][Ll][Oo][Gg][Oo][Nn].*/)
    pivot_on:
    - user
    window: 4h
  - name: Direct Kerberos (port 88) connections from non-system processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88" AND NOT data_win_eventdata_image:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: LSASS access or privileged-service calls on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR data_win_system_eventID:"4673" OR data_win_system_eventID:"4672"
    pivot_on:
    - host
    window: 1h
