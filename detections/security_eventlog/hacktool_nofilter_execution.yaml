name: HackTool - NoFilter Execution
id: 7b14c76a-c602-4ae6-9717-eff868153fc0
version: 1
schema_version: "1.0"
date: "2024-01-05"
author: Stamatis Chatzimangou (st0pp3r)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7b14c76a-c602-4ae6-9717-eff868153fc0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of NoFilter, a tool for abusing the Windows Filtering
  Platform for privilege escalation via hardcoded policy name indicators. MITRE
  ATT&CK: T1134, T1134.001.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5447"
                    - wildcard:
                        data_win_eventdata_filterName:
                          value: "*RonPolicy*"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "5449"
                    - wildcard:
                        data_win_eventdata_providerContextName:
                          value: "*RonPolicy*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_filterName
    - data_win_eventdata_providerContextName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5447'; data_win_eventdata_filterName matches
  '*RonPolicy*'; data_win_system_eventID equals '5449', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/deepinstinct/NoFilter/blob/121d215ab130c5e8e3ad45a7e7fcd56f4de97b4d/NoFilter/Consts.cpp
  - https://github.com/deepinstinct/NoFilter
  - https://www.deepinstinct.com/blog/nofilter-abusing-windows-filtering-platform-for-privilege-escalation
  - https://x.com/_st0pp3r_/status/1742203752361128162?s=20
  - https://attack.mitre.org/techniques/T1134/
  - https://attack.mitre.org/techniques/T1134/001/

response:
  message: >
    HackTool - NoFilter Execution detected on host $agent_name$. Matched
    data_win_eventdata_filterName: $data_win_eventdata_filterName$. Matched
    data_win_eventdata_providerContextName:
    $data_win_eventdata_providerContextName$. MITRE ATT&CK: T1134, T1134.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_filterName
      type: other
    - field: data_win_eventdata_providerContextName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134
    - T1134.001
  custom_tags:
    - hacktool
    - nofilter
    - windows_security
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_win_system_eventID:"5447" AND data_win_eventdata_filterName:/.*[Rr][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy].*/) OR (data_win_system_eventID:"5449" AND data_win_eventdata_providerContextName:/.*[Rr][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2617e7ed-adb7-40ba-b0f3-8f9945fe6c09
    name: Suspicious SYSTEM User Process Creation
    reason: NoFilter's purpose is to obtain a SYSTEM token via WFP/IPsec RPC abuse; the direct result is an unexpected process running as SYSTEM
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: NoFilter is typically used to pop an elevated SYSTEM cmd/powershell from a tool dropped in a user-writable path
  - id: d522eca2-2973-4391-a3e0-ef0374321dae
    name: Abused Debug Privilege by Arbitrary Parent Processes
    reason: Companion token-privilege escalation technique (T1134); operators chain SeDebug abuse with token duplication to reach SYSTEM
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Alternative route to a SYSTEM shell; seeing both on one host shows repeated privilege-escalation attempts from an already-admin operator
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Once SYSTEM is obtained the next step is credential theft with Mimikatz
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: SYSTEM/SeDebug access enables LSASS dumping via comsvcs MiniDump as the follow-on credential access
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Another LSASS memory dump method commonly run from the elevated SYSTEM context NoFilter provides
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: With SYSTEM obtained, attackers persist via SYSTEM-level scheduled tasks
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WFP filter/provider context changes (5447/5449/5441) on this host
    query: (data_win_system_eventID:"5447" OR data_win_system_eventID:"5449" OR data_win_system_eventID:"5441" OR data_win_system_eventID:"5448")
    pivot_on:
    - host
    window: 2h
  - name: Shells and tools spawned as SYSTEM from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/ AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:*\\Users\\* OR data_win_eventdata_parentImage:*\\Temp\\* OR data_win_eventdata_parentImage:*\\ProgramData\\* OR data_win_eventdata_parentImage:*\\Downloads\\*)
    pivot_on:
    - host
    window: 1h
  - name: Credential dumping and LSASS access following escalation
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Mm][Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Persistence via services and scheduled tasks after SYSTEM access
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee].*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR data_win_system_eventID:"4697" OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4698")
    pivot_on:
    - host
    window: 4h
  - name: Special-privilege logons and failed logons by this account
    query: (data_win_system_eventID:"4672" OR data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 6h
