name: File Access Of Signal Desktop Sensitive Data
id: 5d6c375a-18ae-4952-b4f6-8b803f6c8555
version: 1
schema_version: "1.0"
date: "2025-10-19"
author: Andreas Braathen (mnemonic.io)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5d6c375a-18ae-4952-b4f6-8b803f6c8555
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects access to Signal Desktop's sensitive data files: db.sqlite and
  config.json. The db.sqlite file in Signal Desktop stores all locally saved
  messages in an encrypted SQLite database, while the config.json contains the
  decryption key needed to access that data. Since the key is stored in plain
  text, a threat actor who gains access to both files can decrypt and read
  sensitive messages without needing the users credentials. Currently the rule
  only covers the default Signal installation path in AppData\Roaming. Signal
  Portable installations may use different paths based on user configuration.
  Additional paths can be added to the selection as needed. MITRE ATT&CK: T1003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4663"
        - term:
            data_win_eventdata_objectType:
              value: "File"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_objectName:
              value: "*\\\\AppData\\\\Roaming\\\\Signal\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*\\\\config.json"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_objectName:
                    value: "*\\\\db.sqlite"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\signal-portable.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "*\\\\signal.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_objectType
    - data_win_eventdata_objectName
    - data_win_eventdata_processName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '4663'; data_win_eventdata_objectType equals
  'File'; data_win_eventdata_objectName matches '*\AppData\Roaming\Signal\*',
  among other conditions.

known_false_positives: >
  Unlikely, but possible from AV or backup software accessing the files.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://cloud.google.com/blog/topics/threat-intelligence/russia-targeting-signal-messenger/
  - https://vmois.dev/query-signal-desktop-messages-sqlite/
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    File Access Of Signal Desktop Sensitive Data detected on host $agent_name$.
    Matched data_win_eventdata_objectType: $data_win_eventdata_objectType$.
    Matched data_win_eventdata_objectName: $data_win_eventdata_objectName$.
    MITRE ATT&CK: T1003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_objectType
      type: other
    - field: data_win_eventdata_objectName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - signal
    - desktop
    - sensitive
    - windows_security
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4663" AND data_win_eventdata_objectType:/[Ff][Ii][Ll][Ee]/ AND data_win_eventdata_objectName:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Ss][Ii][Gg][Nn][Aa][Ll]\\.*/ AND (data_win_eventdata_objectName:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_objectName:/.*\\[Dd][Bb]\.[Ss][Qq][Ll][Ii][Tt][Ee]/) AND _exists_:data_win_eventdata_processName AND NOT (data_win_eventdata_processName:/.*\\[Ss][Ii][Gg][Nn][Aa][Ll]-[Pp][Oo][Rr][Tt][Aa][Bb][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Ss][Ii][Gg][Nn][Aa][Ll]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 91c945bc-2ad1-4799-a591-4d00198a1215
    name: Suspicious Access to Sensitive File Extensions
    reason: Same 4663 object-access telemetry; an actor reading Signal's db.sqlite/config.json is often sweeping other sensitive file types on the same host.
  - id: d2eb17db-1d39-41dc-b57f-301f6512fa75
    name: Potentially Suspicious Command Targeting Teams Sensitive Files
    reason: 'Same technique against another Electron messenger: command-line theft of an app''s local token/DB store from AppData\Roaming.'
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Infostealer/operator harvesting Chromium profile data typically also takes messenger stores in the same collection pass.
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Scripted collection of application credential stores; co-occurs when a stealer script targets browser and messenger data together.
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: 'Precursor: attacker script enumerating sensitive files before reading Signal''s key and database.'
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: 'Follow-on staging: the Signal Roaming folder is zipped to move the db and plaintext key off the host.'
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Follow-on: collected db.sqlite/config.json packaged into a password-protected archive for exfiltration.'
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: 'Follow-on: the stolen Signal files are sent out with command-line transfer tools after collection.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Non-Signal process copying/reading Signal store (Sysmon FileCreate or command line)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Ii][Gg][Nn][Aa][Ll].*(config\.json|db\.sqlite).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*[Ss][Ii][Gg][Nn][Aa][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: Archiving or staging tools run on this host (zip/7z/rar/Compress-Archive/tar)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|7[Zz]|7[Zz][Gg]|[Tt][Aa][Rr])\.[Ee][Xx][Ee]/) OR (data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|[Zz][Ii][Pp][Ff][Ii][Ll][Ee]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Outbound transfer tooling or exfil channels from this host (rclone/curl/scp/megacmd/Telegram)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn]|[Cc][Uu][Rr][Ll]|[Ss][Cc][Pp]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Ww][Gg][Ee][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]|[Aa][Pp][Ii]\.[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\.[Oo][Rr][Gg]).*/)) OR (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Mm][Ee][Gg][Aa]\.[Nn][Zz]|[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\.[Oo][Rr][Gg]|[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Cc][Oo][Mm]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Other messenger and browser credential stores touched on this host (Teams, Discord, Telegram, WhatsApp, Chrome Login Data)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\\|\\[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm] [Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\|\\[Ww][Hh][Aa][Tt][Ss][Aa][Pp][Pp]\\|\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\|[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee]).*/
    pivot_on:
    - host
    window: 2h
