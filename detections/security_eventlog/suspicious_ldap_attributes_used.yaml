name: Suspicious LDAP-Attributes Used
id: d00a9a72-2c09-4459-ad03-5e0a23351e36
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: xknow @xknow_infosec
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d00a9a72-2c09-4459-ad03-5e0a23351e36
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of particular AttributeLDAPDisplayNames, which are known for
  data exchange via LDAP by the tool LDAPFragger and are additionally not
  commonly used in companies. MITRE ATT&CK: T1001.003.

data_source:
  - Windows Security Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5136"
        - wildcard:
            data_win_eventdata_attributeValue: "*"
        - bool:
            should:
              - term:
                  data_win_eventdata_attributeLDAPDisplayName:
                    value: "primaryInternationalISDNNumber"
                    case_insensitive: true
              - term:
                  data_win_eventdata_attributeLDAPDisplayName:
                    value: "otherFacsimileTelephoneNumber"
                    case_insensitive: true
              - term:
                  data_win_eventdata_attributeLDAPDisplayName:
                    value: "primaryTelexNumber"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_attributeValue
    - data_win_eventdata_attributeLDAPDisplayName
    - data_win_eventdata_subjectUserName
    - data_win_eventdata_subjectLogonId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the Windows Security event log collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf) with the relevant audit policy
  subcategories enabled via GPO. The detection looks for events where
  data_win_system_eventID equals '5136'; data_win_eventdata_attributeValue
  matches '*'; data_win_eventdata_attributeLDAPDisplayName equals
  'primaryInternationalISDNNumber', among other conditions.

known_false_positives: >
  Companies, who may use these default LDAP-Attributes for personal information.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://medium.com/@ivecodoe/detecting-ldapfragger-a-newly-released-cobalt-strike-beacon-using-ldap-for-c2-communication-c274a7f00961
  - https://blog.fox-it.com/2020/03/19/ldapfragger-command-and-control-over-ldap-attributes/
  - https://github.com/fox-it/LDAPFragger
  - https://attack.mitre.org/techniques/T1001/003/

response:
  message: >
    Suspicious LDAP-Attributes Used detected on host $agent_name$. Matched
    data_win_eventdata_attributeValue: $data_win_eventdata_attributeValue$.
    Matched data_win_eventdata_attributeLDAPDisplayName:
    $data_win_eventdata_attributeLDAPDisplayName$. MITRE ATT&CK: T1001.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_attributeValue
      type: other
    - field: data_win_eventdata_attributeLDAPDisplayName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1001.003
  custom_tags:
    - attributes
    - windows_security
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5136" AND data_win_eventdata_attributeValue:/.*/ AND (data_win_eventdata_attributeLDAPDisplayName:/[Pp][Rr][Ii][Mm][Aa][Rr][Yy][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Tt][Ii][Oo][Nn][Aa][Ll][Ii][Ss][Dd][Nn][Nn][Uu][Mm][Bb][Ee][Rr]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Oo][Tt][Hh][Ee][Rr][Ff][Aa][Cc][Ss][Ii][Mm][Ii][Ll][Ee][Tt][Ee][Ll][Ee][Pp][Hh][Oo][Nn][Ee][Nn][Uu][Mm][Bb][Ee][Rr]/ OR data_win_eventdata_attributeLDAPDisplayName:/[Pp][Rr][Ii][Mm][Aa][Rr][Yy][Tt][Ee][Ll][Ee][Xx][Nn][Uu][Mm][Bb][Ee][Rr]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: LDAPFragger is a Cobalt Strike beacon add-on; the parent beacon's service/process tradecraft is the typical precursor to its LDAP-attribute C2 channel
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: Beacon-spawned process patterns on the same host indicate the implant that is relaying C2 through LDAP attributes
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Beacons inject into other processes before staging LDAPFragger; confirms the host runs a live implant
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: LDAPFragger relays traffic between an SMB-pipe peer beacon and the LDAP channel, so beacon pipe names on the same host corroborate the relay
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: Default Cobalt Strike pipe creation on the host that is writing C2 data into LDAP attributes
  - id: ab6bffca-beff-4baa-af11-6733f296d57a
    name: Potential AD User Enumeration From Non-Machine Account
    reason: Same account hitting AD over LDAP for reconnaissance is the likely preceding or concurrent post-exploitation step
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Operator with a working C2 channel into the domain commonly escalates to DCSync next using the same account
  - id: 028c7842-4243-41cd-be6f-12f3cf1a26c7
    name: AD Object WriteDAC Access
    reason: Other 5136/4662 directory-object tampering by the same subject indicates the account is modifying AD beyond covert data staging
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All directory attribute modifications (5136) by this account
    query: data_win_system_eventID:"5136" AND data_win_eventdata_attributeValue:/.+/
    pivot_on:
    - user
    window: 2h
  - name: Cobalt Strike style named pipes created on this host
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*(msagent_|postex_|status_|mojo\.5688|MSSE-|wkssvc_|ntsvcs_|DserNamePipe|SearchTextHarvester|win_svc|postex_ssh_).*/)
    pivot_on:
    - host
    window: 2h
  - name: Non-system processes connecting to LDAP/GC ports
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"3269") AND NOT data_win_eventdata_image:/.*([Ll][Ss][Aa][Ss][Ss]|[Ss]vchost|[Mm]icrosoft[Ee]dge|[Cc]hrome|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]).*/
    pivot_on:
    - host
    window: 2h
  - name: Suspicious AD recon and PowerShell/C# tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Aa]d[Ff]ind|[Ss]harp[Hh]ound|[Dd]squery|[Ll]difde|[Nn]ltest.*dclist|[Gg]et-[Aa][Dd][Oo]bject|[Dd]irectory[Ss]earcher|[Ss]et-[Aa][Dd][Uu]ser).*/ OR data_win_eventdata_image:/.*[Cc]sc\.exe/)
    pivot_on:
    - host
    window: 2h
  - name: Remote-thread injection and process access into other processes
    query: (data_win_system_eventID:"8" OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/))
    pivot_on:
    - host
    window: 1h
