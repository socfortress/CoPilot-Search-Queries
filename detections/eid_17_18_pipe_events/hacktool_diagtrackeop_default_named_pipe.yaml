name: HackTool - DiagTrackEoP Default Named Pipe
id: 1f7025a6-e747-4130-aac4-961eb47015f1
version: 1
schema_version: "1.0"
date: "2023-08-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1f7025a6-e747-4130-aac4-961eb47015f1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of default named pipe used by the DiagTrackEoP POC, a tool
  that abuses "SeImpersonate" privilege.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_pipeName:
              value: "*thisispipe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*thisispipe*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Wh04m1001/DiagTrackEoP/blob/3a2fc99c9700623eb7dc7d4b5f314fd9ce5ef51f/main.cpp#L22

response:
  message: >
    HackTool - DiagTrackEoP Default Named Pipe detected on host $agent_name$.
    Matched data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - hacktool
    - diagtrackeop
    - default
    - pipe_created
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*[Tt][Hh][Ii][Ss][Ii][Ss][Pp][Ii][Pp][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: 'Process-creation twin of this alert: it fires when a shell runs ''echo > \\.\pipe\...'' to coerce a privileged service onto the attacker''s pipe — the exact SeImpersonate named-pipe coercion primitive DiagTrackEoP automates. Seeing it on the same host confirms a hands-on operator driving the same technique.'
  - id: 16f5d8ca-44bd-47c8-acbe-6fc95a16c12f
    name: RottenPotato Like Attack Pattern
    reason: 'Security-log fingerprint of the token theft this tool performs: 4624 Type-3 ANONYMOUS LOGON from the loopback with a ''-'' workstation. Potato-family SeImpersonate coercion (including DiagTrack abuse) produces this local authentication, so a match confirms the SYSTEM-token impersonation succeeded.'
  - id: 4d0083b3-580b-40da-9bba-626c19fe4033
    name: HackTool - CoercedPotato Named Pipe Creation
    reason: Sibling SeImpersonate privilege-escalation tool detected on the same Sysmon EID 17/18 named-pipe telemetry. Operators routinely cycle through several 'Potato' variants on one host until one wins, so its pipe appearing alongside '*thisispipe*' indicates repeated privesc attempts.
  - id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
    name: HackTool - EfsPotato Named Pipe Creation
    reason: Another sibling 'Potato' pipe-creation signature (\pipe\srvsvc coercion) pursuing the identical SeImpersonate→SYSTEM goal via the same pipe-event source. Co-occurrence on the host points to the same escalation campaign trying multiple coercion paths.
  - id: cf0c254b-22f1-4b2b-8221-e137b3c0af94
    name: HackTool - Impersonate Execution
    reason: Token-manipulation utility (T1134) an operator runs once SeImpersonate is held, to enumerate and apply the stolen SYSTEM/service tokens DiagTrackEoP yields. Directly adjacent abuse of the very privilege this pipe creation is exploiting.
  - id: windows-access-token-winlogon-duplicate-handle-001
    name: Windows Access Token Manipulation Winlogon Duplicate Token Handle
    reason: Alternate route to the same objective — stealing a SYSTEM token — by opening winlogon.exe with GrantedAccess 0x1040 to duplicate its token. A privesc operator reaching for this on the host corroborates active SYSTEM-token theft co-occurring with the Potato coercion.
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'The most likely follow-on once SYSTEM is obtained: credential-dumping tools that announce themselves via their own named pipes (cachedump/lsadump/wceservicepipe), on the same EID 17/18 source. Its appearance shortly after turns a privesc into a credential-theft incident.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'The canonical post-escalation action SeImpersonate→SYSTEM unlocks: dumping LSASS memory via rundll32 comsvcs.dll MiniDump. Pairing this with the DiagTrackEoP pipe on one host establishes the full escalate-then-harvest-credentials objective.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SeImpersonate-holding service process spawning a shell on this host (privesc foothold)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Hh][Pp]-[Cc][Gg][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Hh][Tt][Tt][Pp][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt].*\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Other Potato / RPC-coercion named pipes on this host
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_pipeName:/.*[Cc][Oo][Ee][Rr][Cc][Ee][Dd].*/ OR data_win_eventdata_pipeName:/.*[Rr][Oo][Gg][Uu][Ee].*/ OR data_win_eventdata_pipeName:/.*[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff][Ee][Rr].*/ OR data_win_eventdata_pipeName:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Ss]/ OR data_win_eventdata_pipeName:/.*\\[Ee][Pp][Mm][Aa][Pp][Pp][Ee][Rr]/ OR data_win_eventdata_pipeName:/.*\\[Ll][Ss][Aa][Rr][Pp][Cc]/ OR data_win_eventdata_pipeName:/.*\\[Ss][Rr][Vv][Ss][Vv][Cc]/)
    pivot_on:
    - host
    window: 2h
  - name: Manual named-pipe coercion primitive (echo into \\.\pipe\) on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo].*/ AND data_win_eventdata_commandLine:/.*\\\\\.\\[Pp][Ii][Pp][Ee]\\.*/
    pivot_on:
    - host
    window: 1h
  - name: Post-SYSTEM credential access (LSASS dump / SAM-SYSTEM hive) on this host
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Post-SYSTEM persistence (new service / scheduled task / Run key) on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/ OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/))
    pivot_on:
    - host
    window: 4h
