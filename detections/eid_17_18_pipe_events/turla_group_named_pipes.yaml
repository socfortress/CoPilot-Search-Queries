name: Turla Group Named Pipes
id: 739915e4-1e70-4778-8b8a-17db02f66db1
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Markus Neis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 739915e4-1e70-4778-8b8a-17db02f66db1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a named pipe used by Turla group samples. MITRE ATT&CK: T1106.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - bool:
            should:
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\atctl"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\comnap"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\iehelper"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\sdlrpc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\userpipe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName equals '\atctl'; data_win_eventdata_pipeName
  equals '\comnap'; data_win_eventdata_pipeName equals '\iehelper', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1106/

response:
  message: >
    Turla Group Named Pipes detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1106
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1106
  custom_tags:
    - turla
    - group
    - named
    - pipe_created
    - sysmon
    - g0010
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/\\[Aa][Tt][Cc][Tt][Ll]/ OR data_win_eventdata_pipeName:/\\[Cc][Oo][Mm][Nn][Aa][Pp]/ OR data_win_eventdata_pipeName:/\\[Ii][Ee][Hh][Ee][Ll][Pp][Ee][Rr]/ OR data_win_eventdata_pipeName:/\\[Ss][Dd][Ll][Rr][Pp][Cc]/ OR data_win_eventdata_pipeName:/\\[Uu][Ss][Ee][Rr][Pp][Ii][Pp][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f7536642-4a08-4dd9-b6d5-c3286d8975ed
    name: Potential SNAKE Malware Persistence Service Execution
    reason: 'Co-occurring on the same host: services.exe launching C:\Windows\winsxs\...\werfault.exe is the SNAKE/Turla implant service process itself - the very process that opens these IPC named pipes. If it fired here, the pipe server has a confirmed owner.'
  - id: d6d9d23f-69c1-41b5-8305-fa8250bd027f
    name: SNAKE Malware Kernel Driver File Indicator
    reason: 'Co-occurring implant component: comadmin.dat in system32\com is the Uroburos/SNAKE kernel rootkit driver that pairs with the user-mode pipe server. Its presence on the same host confirms the full SNAKE stack, not an isolated pipe artifact.'
  - id: d0fa35db-0e92-400e-aa16-d32ae2521618
    name: SNAKE Malware Covert Store Registry Key
    reason: 'Co-occurring implant component: the SECURITY\Policy\Secrets\N covert store is where SNAKE stashes its encrypted config/payload on the same host, read by the pipe-using implant at runtime.'
  - id: 1df8b3da-b0ac-4d8a-b7c7-6cb7c24160e4
    name: Turla Service Install
    reason: 'Precursor install on this host: a 7045 service event named srservice / ipvpn / hkmsvc is how Turla registers the implant that subsequently opens these pipes - the plant step preceding runtime.'
  - id: 1228f8e2-7e79-4dea-b0ad-c91f1d5016c1
    name: Turla PNG Dropper Service
    reason: 'Precursor install on this host: the WerFaultSvc 7045 service is the PNG-stego dropper that unpacks and launches the implant whose pipes this rule detects; it typically precedes the named-pipe runtime on the same box.'
  - id: d91ff53f-fd0c-419d-a6b8-ae038d5c3733
    name: Potential SNAKE Malware Installation Binary Indicator
    reason: 'Precursor install on this host: execution of the jpsetup.exe / jpinst.exe SNAKE installer binaries is the deployment step that drops the implant later seen opening these pipes.'
  - id: 9e2e51c5-c699-4794-ba5a-29f5da40ac0c
    name: Turla Group Commands May 2020
    reason: 'Follow-on operator activity: once the pipe-based channel is live the operator runs Turla''s hands-on-keyboard recon/exfil one-liners (tracert -h 10 yahoo.com, wsqmcons|iex, net use to docs.live.net) - same host, hands-on-keyboard phase.'
  - id: c601f20d-570a-4cde-a7d6-e17f99cb8e7f
    name: Turla Group Lateral Movement
    reason: 'Follow-on operator activity: net use \\%DOMAINCONTROLLER%\C$ and dir C:\*.doc /s document discovery are Turla''s post-foothold lateral-movement and collection steps launched from this compromised host.'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Suspicious named-pipe servers from implant-typical paths on this host
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Mm]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Rundll32/regsvr32 proxy-loading an implant DLL from a non-standard path
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*\.[Dd][Ll][Ll].*/))
    pivot_on:
    - host
    window: 4h
  - name: Credential theft on this host (LSASS access, SECURITY/SAM hive save, comsvcs MiniDump)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm].*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm].*\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
  - name: Active Directory / domain reconnaissance from this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*\/[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][ ]+[Gg][Rr][Oo][Uu][Pp].*[Dd][Oo][Mm][Aa][Ii][Nn][ ]+[Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy][ ]+.*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*\/[Aa][Ll][Ll].*/)
    pivot_on:
    - host
    window: 6h
  - name: Exfiltration / archive staging to legitimate cloud from this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Cc][Ss]\.[Ll][Ii][Vv][Ee]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][ ]+[Uu][Ss][Ee][ ]+.*[Hh][Tt][Tt][Pp][Ss]:\/\/.*/ OR (data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|7[Zz]|7[Zz][Aa]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\.([Dd][Oo][Cc]|[Xx][Ll][Ss]|[Pp][Dd][Ff]).*/))
    pivot_on:
    - host
    window: 6h
