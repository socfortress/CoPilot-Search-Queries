name: ADFS Database Named Pipe Connection By Uncommon Tool
id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
version: 1
schema_version: "1.0"
date: "2023-11-30"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious local connections via a named pipe to the AD FS
  configuration database (Windows Internal Database). Used to access information
  such as the AD FS configuration settings which contains sensitive information
  used to sign SAML tokens. MITRE ATT&CK: T1005.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - term:
            data_win_eventdata_pipeName:
              value: "\\MICROSOFT##WID\\tsql\\query"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\mmc.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\system32\\\\svchost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\wsmprovhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\SysWOW64\\\\mmc.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\SysWOW64\\\\wsmprovhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\WID\\\\Binn\\\\sqlwriter.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AzureADConnect.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Microsoft.Identity.Health.Adfs.PshSurrogate.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Microsoft.IdentityServer.ServiceHost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Microsoft.Tri.Sensor.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\sqlservr.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\tssdis.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName equals '\MICROSOFT##WID\tsql\query';
  data_win_eventdata_image matches '*:\Windows\System32\mmc.exe';
  data_win_eventdata_image matches '*:\Windows\system32\svchost.exe', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Azure/Azure-Sentinel/blob/f99542b94afe0ad2f19a82cc08262e7ac8e1428e/Detections/SecurityEvent/ADFSDBNamedPipeConnection.yaml
  - https://o365blog.com/post/adfs/
  - https://github.com/Azure/SimuLand
  - https://attack.mitre.org/techniques/T1005/

response:
  message: >
    ADFS Database Named Pipe Connection By Uncommon Tool detected on host
    $agent_name$. Matched data_win_eventdata_pipeName:
    $data_win_eventdata_pipeName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1005
  custom_tags:
    - database
    - named
    - connection
    - pipe_created
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\#\#[Ww][Ii][Dd]\\[Tt][Ss][Qq][Ll]\\[Qq][Uu][Ee][Rr][Yy]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Dd]\\[Bb][Ii][Nn][Nn]\\[Ss][Qq][Ll][Ww][Rr][Ii][Tt][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Zz][Uu][Rr][Ee][Aa][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]\.[Hh][Ee][Aa][Ll][Tt][Hh]\.[Aa][Dd][Ff][Ss]\.[Pp][Ss][Hh][Ss][Uu][Rr][Rr][Oo][Gg][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy][Ss][Ee][Rr][Vv][Ee][Rr]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Tt][Rr][Ii]\.[Ss][Ee][Nn][Ss][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ss][Ss][Dd][Ii][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c86500e9-a645-4680-98d7-f882c70c1ea3
    name: AADInternals PowerShell Cmdlets Execution - ProccessCreation
    reason: AADInternals is the primary tool that reads the AD FS configuration database over this exact \MICROSOFT##WID\tsql\query pipe; Export-AADIntADFSSigningCertificate runs as powershell.exe, so this process-creation hit is the likeliest identity of the 'uncommon tool' and fires on the same host in the same minute.
  - id: 91e69562-2426-42ce-a647-711b8152ced6
    name: AADInternals PowerShell Cmdlets Execution - PsScript
    reason: Script-block evidence of the same AADInternals run; pins the exact cmdlet (Export-AADIntADFSSigningCertificate / Export-AADIntADFSConfiguration), confirming token-signing-certificate theft rather than a legitimate admin touching the WID database.
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Precursor credential access: opening the SYSTEM-protected WID database needs the AD FS service account or local SYSTEM, usually obtained by dumping LSASS first (lsadump/cachedump/wceservicepipe named pipes).'
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Precursor local privilege escalation to SYSTEM via \\.\pipe\ impersonation (getsystem) - the privilege level required to open the AD FS configuration-database pipe on the host.
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: Precursor C2 implant / lateral-movement beacon on the AD FS server; Golden SAML operators (e.g. UNC2452/Nobelium) staged Cobalt Strike on the AD FS host before extracting the token-signing certificate.
  - id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
    name: ADSI-Cache File Creation By Uncommon Tool
    reason: 'Follow-on AD lookup: after reading the encrypted key from the database the tool queries Active Directory over LDAP/ADSI for the AD FS DKM master key that decrypts it, leaving an ADSI schema-cache (.sch) file written by the same uncommon process.'
  - id: ff151c33-45fa-475d-af4f-c2f93571f4fe
    name: Azure AD Health Monitoring Agent Registry Keys Access
    reason: 'Co-occurring hybrid-identity theft: the same AADInternals campaign harvests Azure AD Connect / Health agent credentials from HKLM\...\Microsoft Online\Reporting\MonitoringAgent on an AD FS/AADC host, widening signing-cert theft into full federation compromise.'
  - id: 1d2ab8ac-1a01-423b-9c39-001510eae8e8
    name: Azure AD Health Service Agents Registry Keys Access
    reason: The paired SACL'd Azure AD Connect Health key read alongside the Monitoring Agent key during the same credential harvest; included so the engine pivots on whichever key has auditing enabled on the host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AADInternals / ADFSDump token-signing-certificate theft tooling on this host
    query: ((data_win_system_eventID:"1" OR data_win_system_eventID:"4104") AND (data_win_eventdata_commandLine:/.*[Aa][Aa][Dd][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt][Aa][Dd][Ff][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Aa][Dd][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt][Aa][Dd][Ff][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt][Aa][Dd][Ff][Ss].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Aa][Dd][Ff][Ss][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*[Aa][Dd][Ff][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\[Aa][Dd][Ff][Ss][Pp][Oo][Oo][Ff].*/))
    pivot_on:
    - host
    window: 1h
  - name: AD lookup for the AD FS DKM master key (decrypting the stolen signing key)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\[Ss][Cc][Hh][Cc][Aa][Cc][Hh][Ee]\.*\.[Ss][Cc][Hh]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Nn]=[Aa][Dd][Ff][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Yy][Pp][Tt][Oo][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Hh][Uu][Mm][Bb][Nn][Aa][Ii][Ll][Pp][Hh][Oo][Tt][Oo].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/))
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential dumping yielding the AD FS service account on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1010/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/)) OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 4h
  - name: Export and staging of the stolen token-signing certificate / key material
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Pp]12/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ee][Mm]/ OR data_win_eventdata_targetFilename:/.*[Tt][Oo][Kk][Ee][Nn].*[Ss][Ii][Gg][Nn].*/ OR data_win_eventdata_targetFilename:/.*[Aa][Dd][Ff][Ss].*\.[Xx][Mm][Ll]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/))
    pivot_on:
    - host
    window: 4h
