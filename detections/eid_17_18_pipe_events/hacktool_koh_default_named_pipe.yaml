name: HackTool - Koh Default Named Pipe
id: 0adc67e0-a68f-4ffd-9c43-28905aad5d6a
version: 1
schema_version: "1.0"
date: "2023-08-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0adc67e0-a68f-4ffd-9c43-28905aad5d6a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of default named pipes used by the Koh tool. MITRE ATT&CK:
  T1528, T1134.001.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\imposecost*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\imposingcost*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*\imposecost*';
  data_win_eventdata_pipeName matches '*\imposingcost*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/GhostPack/Koh/blob/0283d9f3f91cf74732ad377821986cfcb088e20a/Clients/BOF/KohClient.c#L12
  - https://attack.mitre.org/techniques/T1528/
  - https://attack.mitre.org/techniques/T1134/001/

response:
  message: >
    HackTool - Koh Default Named Pipe detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1528,
    T1134.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1528
    - T1134.001
  custom_tags:
    - hacktool
    - default
    - named
    - pipe_created
    - sysmon
    - privilege_escalation
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Ii][Mm][Pp][Oo][Ss][Ee][Cc][Oo][Ss][Tt].*/ OR data_win_eventdata_pipeName:/.*\\[Ii][Mm][Pp][Oo][Ss][Ii][Nn][Gg][Cc][Oo][Ss][Tt].*/)

