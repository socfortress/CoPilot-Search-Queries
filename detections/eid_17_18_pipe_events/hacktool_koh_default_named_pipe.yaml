name: HackTool - Koh Default Named Pipe
id: 0adc67e0-a68f-4ffd-9c43-28905aad5d6a
version: 1
schema_version: "1.0"
date: "2023-08-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0adc67e0-a68f-4ffd-9c43-28905aad5d6a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of default named pipes used by the Koh tool. MITRE ATT&CK:
  T1528, T1134.001.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\imposecost*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\imposingcost*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*\imposecost*';
  data_win_eventdata_pipeName matches '*\imposingcost*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/GhostPack/Koh/blob/0283d9f3f91cf74732ad377821986cfcb088e20a/Clients/BOF/KohClient.c#L12
  - https://attack.mitre.org/techniques/T1528/
  - https://attack.mitre.org/techniques/T1134/001/

response:
  message: >
    HackTool - Koh Default Named Pipe detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1528,
    T1134.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1528
    - T1134.001
  custom_tags:
    - hacktool
    - default
    - named
    - pipe_created
    - sysmon
    - privilege_escalation
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Ii][Mm][Pp][Oo][Ss][Ee][Cc][Oo][Ss][Tt].*/ OR data_win_eventdata_pipeName:/.*\\[Ii][Mm][Pp][Oo][Ss][Ii][Nn][Gg][Cc][Oo][Ss][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d0083b3-580b-40da-9bba-626c19fe4033
    name: HackTool - CoercedPotato Named Pipe Creation
    reason: 'Precursor: Koh needs SYSTEM to open other users'' logon-session tokens, and CoercedPotato is a common way operators get there -- it drops its own EID 17/18 named pipe on the same host moments before Koh''s pipe appears.'
  - id: windows-access-token-winlogon-duplicate-handle-001
    name: Windows Access Token Manipulation Winlogon Duplicate Token Handle
    reason: 'Precursor/sibling token theft: duplicating winlogon.exe''s SYSTEM token (GrantedAccess 0x1040) is the same T1134.001 token-stealing primitive Koh industrialises, so it points at the same operator escalating on this host before standing Koh up.'
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: 'Delivery context: Koh ships as a Cobalt Strike BOF / C# client, so a CS malleable-C2 default pipe on the same host in the window is almost certainly the beacon the operator launched Koh from.'
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Co-occurring harvest: operators pair token theft with credential dumping; these cred-dump tool pipes (cachedump/lsadump/wceservicepipe) are the same EID 17/18 telemetry on the same host as Koh''s.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Co-occurring credential/token theft: Mimikatz token:: and sekurlsa:: steal tokens and LSASS secrets in the same operation in which Koh captures privileged logon sessions.'
  - id: f89b08d0-77ad-4728-817b-9b16c5a69c7a
    name: HackTool - SharpImpersonation Execution
    reason: 'Follow-on: once Koh has captured a privileged token, SharpImpersonation is used to impersonate it (remotely via PsExec/WmiExec or interactively) and act as the victim identity.'
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: 'Follow-on: the classic Koh -> Rubeus combo -- with a captured logon session held open, Rubeus requests/abuses Kerberos tickets (asktgt/s4u/ptt) as the stolen identity to move laterally.'
  - id: 02f7c9c1-1ae8-4c6a-8add-04693807f92f
    name: Potential Access Token Abuse
    reason: 'Follow-on evidence: 4624 type-9 logons with DuplicateToken(Ex)/ImpersonateLoggedOnUser (LOGON32_LOGON_NEW_CREDENTIALS) are the API fingerprint of actually wielding the tokens Koh captured.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other C2 / lateral-movement / cred-dump default named pipes on this host
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Mm][Ss][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_pipeName:/.*\\[Mm][Ss][Ss][Ee]-.*/ OR data_win_eventdata_pipeName:/.*\\[Pp][Oo][Ss][Tt][Ee][Xx].*/ OR data_win_eventdata_pipeName:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/ OR data_win_eventdata_pipeName:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_pipeName:/.*\\[Rr][Ee][Mm][Cc][Oo][Mm].*/ OR data_win_eventdata_pipeName:/.*\\[Cc][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_pipeName:/.*\\[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*\\[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*\\[Ww][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Ii][Pp][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential-access on this host (handle access & dump tooling)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
  - name: Token-impersonation & Kerberos-ticket tooling launched on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ss][Hh][Aa][Rr][Pp][Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ii][Oo][Nn]|[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ee]|[Rr][Uu][Bb][Ee][Uu][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Aa][Ss][Kk][Tt][Gg][Tt]|[Aa][Ss][Kk][Tt][Gg][Ss]|[Tt][Gg][Tt][Dd][Ee][Ll][Ee][Gg]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Cc][Rr][Ee][Aa][Tt][Ee][Nn][Ee][Tt][Oo][Nn][Ll][Yy]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Privileged interactive / RDP / NewCredentials logons farmed on this host
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"2" OR data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"9")
    pivot_on:
    - host
    window: 6h
