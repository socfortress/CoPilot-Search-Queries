name: PUA - RemCom Default Named Pipe
id: d36f87ea-c403-44d2-aa79-1a0ac7c24456
version: 1
schema_version: "1.0"
date: "2023-11-30"
author: Nikita Nazarov, oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d36f87ea-c403-44d2-aa79-1a0ac7c24456
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects default RemCom pipe creation. MITRE ATT&CK: T1021.002, T1569.002.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_pipeName:
              value: "*\\\\RemCom*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*\RemCom*'.

known_false_positives: >
  Legitimate Administrator activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
  - https://github.com/kavika13/RemCom
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PUA - RemCom Default Named Pipe detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1021.002, T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1569.002
  custom_tags:
    - remcom
    - default
    - named
    - pipe_created
    - sysmon
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*\\[Rr][Ee][Mm][Cc][Oo][Mm].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e36ed87-4986-482e-8e3b-5c23ffff11bf
    name: RemCom Service Installation
    reason: 'Same RemCom operation: EID 7045 shows the RemComSvc service being installed, and it is that service''s start-up that opens this exact \RemCom* pipe. Both firing together confirms a real RemCom remote-exec, not a pipe-name coincidence.'
  - id: 7eff1a7f-dd45-4c20-877a-f21e342a7611
    name: RemCom Service File Creation
    reason: 'Immediate precursor from the same tool: the RemComSvc.exe service binary written to disk (EID 11) moments before the service starts and creates this pipe. Pins the pipe to a genuine RemComSvc deployment.'
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'The remote-control leg: a client writing to the \svcctl pipe over IPC$ (EID 5145) is how RemCom creates and starts RemComSvc on this host from the attacker machine, directly preceding the RemCom pipe.'
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: 'The staging leg: a remote non-machine account writing a file to this host''s C$/ADMIN$ over SMB (EID 5145) is how RemComSvc.exe is pushed to the target before the service is installed.'
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: 'Corroborates a remote install: EID 4697 with client/parent PID 0 is the fingerprint of a service created over remote RPC rather than locally, which is exactly how RemCom installs RemComSvc. Pairs with the 7045 event.'
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'The usual payoff: once RemCom grants SYSTEM-level remote execution, operators dump credentials. A cachedump/lsadump/wceservicepipe pipe on this host in the window escalates this to a confirmed hands-on credential-theft incident (same EID 17/18 telemetry).'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands executed via the RemCom service on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Remote network logons to this host (RemCom delivery auth)
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625") AND data_win_eventdata_logonType:"3"
    pivot_on:
    - host
    window: 1h
  - name: SMB service-control and admin-share access to this host
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_relativeTargetName:/[Ss][Vv][Cc][Cc][Tt][Ll]/ OR data_win_eventdata_shareName:/.*[Cc]\$/ OR data_win_eventdata_shareName:/.*[Aa][Dd][Mm][Ii][Nn]\$/ OR data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS access / credential dumping follow-on on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/))
    pivot_on:
    - host
    window: 2h
  - name: This account's logon activity across other hosts (lateral spread)
    query: data_win_system_eventID:"4624" OR data_win_system_eventID:"4625"
    pivot_on:
    - user
    window: 6h
