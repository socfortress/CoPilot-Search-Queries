name: RedSun - Named Pipe Created
id: 9b4e7c2a-3f6d-4a8b-b5e9-1c7d3f2e6a4b
version: 1
schema_version: "1.0"
date: "2026-04-17"
author: Swachchhanda Shrawan Poudel (Nextron Systems), @unresolvedhost
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9b4e7c2a-3f6d-4a8b-b5e9-1c7d3f2e6a4b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a named pipe with the hardcoded name "REDSUN". The
  RedSun exploit tool uses a pipe with this name for synchronisation and command
  communication between its components during the Cloud Files API + oplock-based
  AV bypass and privilege escalation chain. RedSun creates the pipe as
  \\??\pipe\REDSUN. The pipe server listens for the token-duplicated elevated
  process to connect and respond, completing the privilege escalation from user
  to SYSTEM. Presence of this pipe name indicates active or recent RedSun
  execution. MITRE ATT&CK: T1055, T1685.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - term:
            data_win_eventdata_pipeName:
              value: "\\REDSUN"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName equals '\REDSUN'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Nightmare-Eclipse/RedSun/blob/7456cc8cf066f5e5fc6cdf7d3272a466ebd6b2f6/RedSun.cpp#L591
  - https://deadeclipse666.blogspot.com/2026/04/public-disclosure-response-for-cve-2026.html
  - https://attack.mitre.org/techniques/T1055/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    RedSun - Named Pipe Created detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1055,
    T1685
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
    - T1685
  custom_tags:
    - redsun
    - named
    - pipe_created
    - sysmon
    - privilege_escalation
    - stealth
    - defense_impairment
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

