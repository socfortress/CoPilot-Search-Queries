name: RedSun - Named Pipe Created
id: 9b4e7c2a-3f6d-4a8b-b5e9-1c7d3f2e6a4b
version: 1
schema_version: "1.0"
date: "2026-04-17"
author: Swachchhanda Shrawan Poudel (Nextron Systems), @unresolvedhost
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9b4e7c2a-3f6d-4a8b-b5e9-1c7d3f2e6a4b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a named pipe with the hardcoded name "REDSUN". The
  RedSun exploit tool uses a pipe with this name for synchronisation and command
  communication between its components during the Cloud Files API + oplock-based
  AV bypass and privilege escalation chain. RedSun creates the pipe as
  \\??\pipe\REDSUN. The pipe server listens for the token-duplicated elevated
  process to connect and respond, completing the privilege escalation from user
  to SYSTEM. Presence of this pipe name indicates active or recent RedSun
  execution. MITRE ATT&CK: T1055, T1685.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - term:
            data_win_eventdata_pipeName:
              value: "\\REDSUN"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName equals '\REDSUN'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Nightmare-Eclipse/RedSun/blob/7456cc8cf066f5e5fc6cdf7d3272a466ebd6b2f6/RedSun.cpp#L591
  - https://deadeclipse666.blogspot.com/2026/04/public-disclosure-response-for-cve-2026.html
  - https://attack.mitre.org/techniques/T1055/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    RedSun - Named Pipe Created detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1055,
    T1685
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
    - T1685
  custom_tags:
    - redsun
    - named
    - pipe_created
    - sysmon
    - privilege_escalation
    - stealth
    - defense_impairment
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/\\[Rr][Ee][Dd][Ss][Uu][Nn]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: 'RedSun''s exact primitive from the command-line angle: a process that writes to \.\pipe\ and then impersonates the SYSTEM client that connects is precisely what the REDSUN pipe does. On the same host it confirms a named-pipe-impersonation getsystem is underway, not just one hardcoded pipe name.'
  - id: 1f7025a6-e747-4130-aac4-961eb47015f1
    name: HackTool - DiagTrackEoP Default Named Pipe
    reason: Sibling SeImpersonate-abuse EoP that, like RedSun, coerces a privileged service onto an attacker named pipe to steal its token. Same EventID 17/18 telemetry and same user->SYSTEM goal; its pipe appearing alongside REDSUN shows the operator cycling through named-pipe impersonation exploits.
  - id: 4d0083b3-580b-40da-9bba-626c19fe4033
    name: HackTool - CoercedPotato Named Pipe Creation
    reason: 'Direct Potato-family sibling: CoercedPotato coerces an elevated caller onto its named pipe for impersonation, the identical primitive RedSun uses. Interchangeable in an operator''s toolkit, so its pipe on the same host in-window corroborates an active local privilege-escalation attempt.'
  - id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
    name: HackTool - EfsPotato Named Pipe Creation
    reason: Another SeImpersonate Potato EoP flagged by its hardcoded pipe name on the same EventID 17/18 channel. If REDSUN is blocked, operators fall back to EfsPotato (EFSRPC coercion) for the same SYSTEM token theft; both pipes together signal a privesc toolkit on the host.
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Sibling local privilege-escalation exploit (NTLM reflection) aiming at the same user->SYSTEM jump. Its execution on the same host in-window points to an operator chaining multiple LPE POCs - RedSun plus LocalPotato - to beat AV/EDR and reach SYSTEM.
  - id: 16f5d8ca-44bd-47c8-acbe-6fc95a16c12f
    name: RottenPotato Like Attack Pattern
    reason: 'Logon-side confirmation that a named-pipe token impersonation succeeded: RottenPotato-style attacks (which RedSun imitates) leave a distinctive Security-log logon pattern when the stolen SYSTEM token is assumed. Seen on the host, it proves RedSun''s user->SYSTEM escalation actually completed.'
  - id: windows-access-token-winlogon-duplicate-handle-001
    name: Windows Access Token Manipulation Winlogon Duplicate Token Handle
    reason: RedSun's mechanism is duplicating the token of the elevated process that connects to the REDSUN pipe; this rule catches the EventID 10 ProcessAccess (GrantedAccess 0x1040) when a process duplicates a SYSTEM process's token. The same token-duplication step from the ProcessAccess angle - strong corroboration the escalation is real.
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'The expected next objective once RedSun wins SYSTEM: credential-dumping tools (cachedump/lsadump/wceservicepipe) create their own named pipes. On the same host minutes after REDSUN, it marks the pivot from privilege escalation to credential theft and escalates the two alerts into one incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SYSTEM-process token/handle duplication on this host
    query: data_win_system_eventID:"10" AND (data_win_eventdata_targetImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_grantedAccess:/0[Xx]1040/ OR data_win_eventdata_grantedAccess:/0[Xx]1440/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]10[Cc]0/)
    pivot_on:
    - host
    window: 1h
  - name: getsystem named-pipe impersonation logon artifact on this host
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/.*[Aa][Dd][Vv][Aa][Pp][Ii].*/
    pivot_on:
    - host
    window: 2h
  - name: SYSTEM-integrity process spawned from a user-writable path on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_integrityLevel:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND (data_win_eventdata_parentImage:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Defender / AV tamper and defense impairment on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*/)) OR ((data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_targetObject:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/))
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping - LSASS access and dump tooling on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]1440/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff]0[Ff][Ff][Ff]/)) OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*\\[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*\\[Ww][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Ii][Pp][Ee].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/))
    pivot_on:
    - host
    window: 2h
