name: PsExec Tool Execution From Suspicious Locations - PipeName
id: 41504465-5e3a-4a5b-a5b4-2a0baadd4463
version: 1
schema_version: "1.0"
date: "2023-09-20"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 41504465-5e3a-4a5b-a5b4-2a0baadd4463
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PsExec default pipe creation where the image executed is located in a
  suspicious location. Which could indicate that the tool is being used in an
  attack. MITRE ATT&CK: T1569.002.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - term:
            data_win_eventdata_pipeName:
              value: "\\PSEXESVC"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName equals '\PSEXESVC'; data_win_eventdata_image
  matches '*:\Users\Public\*'; data_win_eventdata_image matches
  '*:\Windows\Temp\*', among other conditions.

known_false_positives: >
  Rare legitimate use of psexec from the locations mentioned above. This will
  require initial tuning based on your environment. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.jpcert.or.jp/english/pub/sr/ir_research.html
  - https://jpcertcc.github.io/ToolAnalysisResultSheet
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PsExec Tool Execution From Suspicious Locations - PipeName detected on host
    $agent_name$. Matched data_win_eventdata_pipeName:
    $data_win_eventdata_pipeName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - psexec
    - locations
    - pipename
    - pipe_created
    - sysmon
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]/ AND (data_win_eventdata_image:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: 'Follow-on payoff: the command PSEXESVC.exe spawns as NT AUTHORITY\SYSTEM is the payload this \PSEXESVC pipe was created to carry - pairing them confirms successful SYSTEM-level remote execution rather than mere tool staging.'
  - id: 51ae86a2-e2e1-4097-ad85-c46cb6851de4
    name: Renamed PsExec Service Execution
    reason: 'Same execution, process-creation view: a binary whose OriginalFileName is psexesvc.exe running from a non-standard path is the exact renamed/dropped PsExec service this pipe rule catches by its \PSEXESVC pipe from a suspicious location.'
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: 'Immediate precursor on this host: the SCM 7045 install of the PSEXESVC service is what creates and starts the \PSEXESVC pipe seconds later, and names the image path and account that stood it up.'
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: 'Precursor / delivery framework: a randomly-named transient service installed over SMB by Impacket psexec.py or Metasploit smb/psexec performs the same SCM remote execution; firing on this host identifies the toolkit behind the pipe.'
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Precursor lateral movement: an inbound write to the \svcctl SCM pipe over IPC$ is the remote call that installs and starts the PsExec service on this host, proving the execution originated from another machine and naming the source logon.'
  - id: d36f87ea-c403-44d2-aa79-1a0ac7c24456
    name: PUA - RemCom Default Named Pipe
    reason: 'Same-class tool co-occurrence: a \RemCom_* control pipe is a PsExec-style SCM remote-exec clone; seen on this host alongside \PSEXESVC it shows multiple remote-exec utilities in play and maps the operator''s lateral-movement toolkit.'
  - id: f6451de4-df0a-41fa-8d72-b39f54a08db5
    name: PUA - PAExec Default Named Pipe
    reason: 'Same-class tool co-occurrence: a \PAExec* control pipe is the PAExec psexec clone; in the same host/window it corroborates PsExec-family service execution and identifies which utility the operator used.'
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Follow-on credential access: lsadump/cachedump/wceservicepipe pipes are the expected next move after landing SYSTEM via PsExec - harvesting credentials on this host to reach the next, escalating the incident toward critical.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Command executed by the PsExec service binary on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_parentImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: PsExec-family service installed on this host (SCM 7045 / Security 4697)
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_serviceName:/[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]/ OR data_win_eventdata_imagePath:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_imagePath:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imagePath:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imagePath:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_serviceFileName:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_serviceFileName:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_serviceFileName:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Inbound remote Service Control Manager access on this host (SVCCTL over IPC$)
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/[Ss][Vv][Cc][Cc][Tt][Ll]/
    pivot_on:
    - host
    window: 4h
  - name: Credential theft on this host after SYSTEM-level execution
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*\\[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*\\[Ww][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Ii][Pp][Ee].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Onward lateral movement launched from this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)) OR (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)))
    pivot_on:
    - host
    window: 2h
