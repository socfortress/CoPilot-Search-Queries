name: HackTool - CoercedPotato Named Pipe Creation
id: 4d0083b3-580b-40da-9bba-626c19fe4033
version: 1
schema_version: "1.0"
date: "2023-10-11"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4d0083b3-580b-40da-9bba-626c19fe4033
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of a pipe name as used by the hack tool CoercedPotato.
  MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_pipeName:
              value: "*\\\\coerced\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*\coerced\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.hackvens.fr/articles/CoercedPotato.html
  - https://github.com/hackvens/CoercedPotato
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    HackTool - CoercedPotato Named Pipe Creation detected on host $agent_name$.
    Matched data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - hacktool
    - coercedpotato
    - named
    - pipe_created
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*\\[Cc][Oo][Ee][Rr][Cc][Ee][Dd]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: 'Same tool, process-creation side: this named pipe is created by CoercedPotato.exe, so the EID 1 execution event (image CoercedPotato.exe, ''--exploitId'' flag, known IMPHASHes) fires on the same host at essentially the same moment and confirms the tool itself, not just the pipe artifact.'
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: 'Same primitive done by hand: detects the generic named-pipe token-impersonation getsystem (cmd/powershell ''echo ... > \\.\pipe\...''). CoercedPotato automates this exact impersonation, so a co-occurring hit points to a manual or framework (Meterpreter/Cobalt Strike) variant run from the same foothold.'
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: 'The success signal: a LOCAL/NETWORK SERVICE (or IIS AppPool) parent spawning a SYSTEM-integrity child is precisely the SYSTEM process CoercedPotato launches once it impersonates the coerced token, so its presence confirms the escalation actually succeeded rather than just being attempted.'
  - id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
    name: HackTool - EfsPotato Named Pipe Creation
    reason: 'Sibling SeImpersonate tool: EfsPotato abuses the same SeImpersonatePrivilege-to-SYSTEM path via its own named pipe (EFSRPC coercion). Operators routinely try several Potato variants from one foothold, so its pipe appearing nearby is the same actor retrying the privesc.'
  - id: 1f7025a6-e747-4130-aac4-961eb47015f1
    name: HackTool - DiagTrackEoP Default Named Pipe
    reason: Same SeImpersonatePrivilege-abuse primitive via a default named pipe (DiagTrackEoP POC) - an alternative local elevation-of-privilege-to-SYSTEM tool the same operator may drop from the same service-account foothold.
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Sibling Potato-family local privilege-escalation tool (LocalPotato / NTLM reflection), carried and run interchangeably with CoercedPotato to land SYSTEM; its execution on the same host is the same operator's privesc toolkit.
  - id: 16f5d8ca-44bd-47c8-acbe-6fc95a16c12f
    name: RottenPotato Like Attack Pattern
    reason: The founding RottenPotato SeImpersonate pattern seen from the logon/security-eventlog side - the privileged token theft/relay all Potatoes (CoercedPotato included) descend from; corroborates the escalation from a second, non-Sysmon telemetry source.
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Expected next step once SYSTEM is obtained: named-pipe-based credential-dumping tools (nanodump and the like) run on the same host minutes later to harvest credentials from the freshly-elevated context.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SYSTEM-integrity child spawned by a service-account or CoercedPotato parent (escalation success)
    query: data_win_system_eventID:"1" AND data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ AND (data_win_eventdata_parentUser:/.*\\[Nn][Ee][Tt][Ww][Oo][Rr][Kk] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_parentUser:/.*\\[Ll][Oo][Cc][Aa][Ll] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_parentUser:/.*[Aa][Pp][Pp][Pp][Oo][Oo][Ll].*/ OR data_win_eventdata_parentImage:/.*\\[Cc][Oo][Ee][Rr][Cc][Ee][Dd][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: whoami privilege/identity reconnaissance (SeImpersonate check) on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\/[Pp][Rr][Ii][Vv]|\/[Aa][Ll][Ll]|\/[Gg][Rr][Oo][Uu][Pp][Ss]).*/
    pivot_on:
    - host
    window: 2h
  - name: Web/DB service host spawning a shell (service-account foothold that grants SeImpersonate)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]|\\[Hh][Tt][Tt][Pp][Dd]\.[Ee][Xx][Ee]|\\[Tt][Oo][Mm][Cc][Aa][Tt][0-9]*\.[Ee][Xx][Ee]|\\[Nn][Gg][Ii][Nn][Xx]\.[Ee][Xx][Ee]|\\[Pp][Hh][Pp]-[Cc][Gg][Ii]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
  - name: LSASS access or credential-dumping activity on this host (post-SYSTEM follow-on)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp][0-9]*\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: 'Persistence created as SYSTEM: new service, scheduled task, run-key or account on this host'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\).*/) OR (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/))
    pivot_on:
    - host
    window: 2h
