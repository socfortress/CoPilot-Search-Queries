name: PUA - CSExec Default Named Pipe
id: f318b911-ea88-43f4-9281-0de23ede628e
version: 1
schema_version: "1.0"
date: "2023-11-30"
author: Nikita Nazarov, oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f318b911-ea88-43f4-9281-0de23ede628e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects default CSExec pipe creation. MITRE ATT&CK: T1021.002, T1569.002.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_pipeName:
              value: "*\\\\csexecsvc*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*\csexecsvc*'.

known_false_positives: >
  Legitimate Administrator activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
  - https://github.com/malcomvetter/CSExec
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PUA - CSExec Default Named Pipe detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1021.002, T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1569.002
  custom_tags:
    - csexec
    - default
    - named
    - pipe_created
    - sysmon
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*\\[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a27e5fa9-c35e-4e3d-b7e0-1ce2af66ad12
    name: CSExec Service Installation
    reason: 'Same CSExec run seen in the System log: the 7045 Service Control Manager event installing the ''csexecsvc'' service that opens this pipe. Pairing the pipe with the 7045 install confirms remote service-based code execution actually landed, not just a pipe artifact.'
  - id: f0e2b768-5220-47dd-b891-d57b96fc0ec1
    name: CSExec Service File Creation
    reason: 'Same CSExec run seen via Sysmon EID 11: the csexecsvc.exe service binary written to disk moments before the service starts and creates this pipe. Pinpoints the dropped payload file and the process that wrote it (the operator''s delivery).'
  - id: d08a2711-ee8b-4323-bdec-b7d85e892b31
    name: PUA - CsExec Execution
    reason: 'Same tool via Sysmon EID 1 process creation (csexec.exe): corroborates the pipe is CSExec and surfaces the controller/service process''s command line, user and parent — the execution context the pipe event alone lacks.'
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Delivery mechanism (precursor): the remote svcctl WriteData over IPC$ (5145) is exactly how an operator creates and starts the csexecsvc service over SMB. Finding it just before the pipe reconstructs how CSExec was pushed onto this host.'
  - id: 52d8b0c6-53d6-439a-9e41-52ad442ad9ad
    name: First Time Seen Remote Named Pipe
    reason: 'Inbound SMB precursor: a newly-observed remote named pipe accessed over IPC$ — the network side of this remote-exec/lateral-movement, flagging the SMB session that carried CSExec onto the host and its source.'
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Primary follow-on: CSExec runs its payload as SYSTEM, and the first objective is usually credential theft. A cachedump/lsadump/wceservicepipe pipe on the same host within the window turns this into a credential-access incident.'
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Likely follow-on: CSExec is a common delivery vehicle for a C2 implant. A Cobalt Strike default named pipe (postex_/msagent_/MSSE-*-server) appearing on the same host right after escalates this to active C2 and hands-on post-exploitation.'
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Sibling PsExec-family mechanism in the Security log (4697 random-named service + 8-char binary in %systemroot%). A same-operator pivot using impacket/metasploit psexec alongside CSExec indicates a broader SMB lateral-movement campaign, not an isolated host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Payload executed by the CSExec service (SYSTEM-level children)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/))
    pivot_on:
    - host
    window: 1h
  - name: Service installation & remote SVCCTL activity on this host
    query: (data_win_system_eventID:"7045") OR (data_win_system_eventID:"4697") OR (data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/\\\\\*\\[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/[Ss][Vv][Cc][Cc][Tt][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: Inbound network (type 3) logons and failures on this host
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR (data_win_system_eventID:"4625" AND data_win_eventdata_logonType:"3")
    pivot_on:
    - host
    window: 1h
  - name: Credential dumping / LSASS access on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/))
    pivot_on:
    - host
    window: 1h
  - name: Onward lateral-movement tooling & admin-share use from this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Cc][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\\\\.*/))
    pivot_on:
    - host
    window: 2h
