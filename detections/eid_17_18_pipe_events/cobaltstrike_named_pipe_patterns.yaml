name: CobaltStrike Named Pipe Patterns
id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
version: 1
schema_version: "1.0"
date: "2024-01-26"
author: Florian Roth (Nextron Systems), Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a named pipe with a pattern found in CobaltStrike
  malleable C2 profiles. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\DserNamePipe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\f4c3*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\f53f*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\fullduplex_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\mojo.5688.8052.183894939787088877*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\mojo.5688.8052.35780273329370473*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\MsFteWds*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\msrpc_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\mypipe-f*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\mypipe-h*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\ntsvcs*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\PGMessagePipe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\rpc_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\scerpc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\SearchTextHarvester*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\spoolss*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\win_svc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\win\\\\msrpc_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\windows.update.manager*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\wkssvc*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\demoagent_11"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\demoagent_22"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_pipeName:
                          value: "\\\\Winsock2\\\\CatalogChangeListener-*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_pipeName: "*-0,"
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_pipeName"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_pipeName:
                          value: "\\wkssvc"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_pipeName:
                          value: "\\spoolss"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_pipeName:
                          value: "\\scerpc"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_pipeName:
                          value: "\\ntsvcs"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_pipeName:
                          value: "\\SearchTextHarvester"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_pipeName:
                          value: "\\PGMessagePipe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_pipeName:
                          value: "\\MsFteWds"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_pipeName"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Program Files\\\\Websense\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Program Files (x86)\\\\Websense\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_pipeName:
                                value: "\\\\DserNamePipeR*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_pipeName:
                                value: "\\\\DserNamePipeW*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '\DserNamePipe*';
  data_win_eventdata_pipeName matches '\f4c3*'; data_win_eventdata_pipeName
  matches '\f53f*', among other conditions.

known_false_positives: >
  Chrome instances using the exact same pipe name "mojo.xxx". Websense Endpoint
  using the pipe name "DserNamePipe(R|W)\d{1,5}". Some applications may just
  coincidentally use the pipe names which contain the same prefix as the ones
  used by CobaltStrike, e.g. "f4c3". Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575
  - https://gist.github.com/MHaggis/6c600e524045a6d49c35291a21e10752
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    CobaltStrike Named Pipe Patterns detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - cobaltstrike
    - named
    - patterns
    - pipe_created
    - sysmon
    - privilege_escalation
    - stealth
    - stp_1k
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/\\[Dd][Ss][Ee][Rr][Nn][Aa][Mm][Ee][Pp][Ii][Pp][Ee].*/ OR data_win_eventdata_pipeName:/\\[Ff]4[Cc]3.*/ OR data_win_eventdata_pipeName:/\\[Ff]53[Ff].*/ OR data_win_eventdata_pipeName:/\\[Ff][Uu][Ll][Ll][Dd][Uu][Pp][Ll][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/\\[Mm][Oo][Jj][Oo]\.5688\.8052\.183894939787088877.*/ OR data_win_eventdata_pipeName:/\\[Mm][Oo][Jj][Oo]\.5688\.8052\.35780273329370473.*/ OR data_win_eventdata_pipeName:/\\[Mm][Ss][Ff][Tt][Ee][Ww][Dd][Ss].*/ OR data_win_eventdata_pipeName:/\\[Mm][Ss][Rr][Pp][Cc]_.*/ OR data_win_eventdata_pipeName:/\\[Mm][Yy][Pp][Ii][Pp][Ee]-[Ff].*/ OR data_win_eventdata_pipeName:/\\[Mm][Yy][Pp][Ii][Pp][Ee]-[Hh].*/ OR data_win_eventdata_pipeName:/\\[Nn][Tt][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_pipeName:/\\[Pp][Gg][Mm][Ee][Ss][Ss][Aa][Gg][Ee][Pp][Ii][Pp][Ee].*/ OR data_win_eventdata_pipeName:/\\[Rr][Pp][Cc]_.*/ OR data_win_eventdata_pipeName:/\\[Ss][Cc][Ee][Rr][Pp][Cc].*/ OR data_win_eventdata_pipeName:/\\[Ss][Ee][Aa][Rr][Cc][Hh][Tt][Ee][Xx][Tt][Hh][Aa][Rr][Vv][Ee][Ss][Tt][Ee][Rr].*/ OR data_win_eventdata_pipeName:/\\[Ss][Pp][Oo][Oo][Ll][Ss][Ss].*/ OR data_win_eventdata_pipeName:/\\[Ww][Ii][Nn]_[Ss][Vv][Cc].*/ OR data_win_eventdata_pipeName:/\\[Ww][Ii][Nn]\\[Mm][Ss][Rr][Pp][Cc]_.*/ OR data_win_eventdata_pipeName:/\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Uu][Pp][Dd][Aa][Tt][Ee]\.[Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/ OR data_win_eventdata_pipeName:/\\[Ww][Kk][Ss][Ss][Vv][Cc].*/ OR data_win_eventdata_pipeName:/\\[Dd][Ee][Mm][Oo][Aa][Gg][Ee][Nn][Tt]_11/ OR data_win_eventdata_pipeName:/\\[Dd][Ee][Mm][Oo][Aa][Gg][Ee][Nn][Tt]_22/ OR (data_win_eventdata_pipeName:/\\[Ww][Ii][Nn][Ss][Oo][Cc][Kk]2\\[Cc][Aa][Tt][Aa][Ll][Oo][Gg][Cc][Hh][Aa][Nn][Gg][Ee][Ll][Ii][Ss][Tt][Ee][Nn][Ee][Rr]-.*/ AND data_win_eventdata_pipeName:/.*-0,/)) AND _exists_:data_win_eventdata_pipeName AND NOT (data_win_eventdata_pipeName:/\\[Ww][Kk][Ss][Ss][Vv][Cc]/ OR data_win_eventdata_pipeName:/\\[Ss][Pp][Oo][Oo][Ll][Ss][Ss]/ OR data_win_eventdata_pipeName:/\\[Ss][Cc][Ee][Rr][Pp][Cc]/ OR data_win_eventdata_pipeName:/\\[Nn][Tt][Ss][Vv][Cc][Ss]/ OR data_win_eventdata_pipeName:/\\[Ss][Ee][Aa][Rr][Cc][Hh][Tt][Ee][Xx][Tt][Hh][Aa][Rr][Vv][Ee][Ss][Tt][Ee][Rr]/ OR data_win_eventdata_pipeName:/\\[Pp][Gg][Mm][Ee][Ss][Ss][Aa][Gg][Ee][Pp][Ii][Pp][Ee]/ OR data_win_eventdata_pipeName:/\\[Mm][Ss][Ff][Tt][Ee][Ww][Dd][Ss]/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_pipeName AND NOT ((data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ee][Bb][Ss][Ee][Nn][Ss][Ee]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ee][Bb][Ss][Ee][Nn][Ss][Ee]\\.*/) AND (data_win_eventdata_pipeName:/\\[Dd][Ss][Ee][Rr][Nn][Aa][Mm][Ee][Pp][Ii][Pp][Ee][Rr].*/ OR data_win_eventdata_pipeName:/\\[Dd][Ss][Ee][Rr][Nn][Aa][Mm][Ee][Pp][Ii][Pp][Ee][Ww].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Likely precursor on the same host: rundll32 using the StartW export reflectively loads the Beacon DLL, a common way the beacon that then opens these malleable-C2 named pipes was first executed.'
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: 'Co-occurring same-beacon artifact: CS fork-and-run spawns a sacrificial child that writes job output with ''cmd /c echo ... > \\.\pipe\...'' and ''conhost 0xffffffff -ForceV1'' - the process behind these very pipe-creation events, naming the beacon''s host process.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Co-occurring same-beacon artifact: the EID-8 remote-thread injection into the sacrificial process whose post-ex output flows over this named pipe; seeing both together confirms a live Cobalt Strike beacon rather than a benign pipe-name collision.'
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: Sibling detector for the default beacon pipe set (postex_*, msagent_*, status_*, MSSE-*-server); the same beacon frequently trips both pipe lists, so a hit here corroborates the malleable-profile match and reveals the default post-ex/SMB-linking pipes.
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Follow-on credential access over the same IPC mechanism: CS runs mimikatz/lsadump/cachedump via fork-and-run, creating cachedump/lsadump/wceservicepipe named pipes on this host - the most common objective right after a beacon lands.'
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: 'Follow-on privilege escalation sharing this rule''s mechanism: CS getsystem steals a SYSTEM token via named-pipe impersonation backed by a transient service install, a standard immediate step once the operator has beacon execution.'
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: 'Follow-on lateral movement / persistence: CS ''jump psexec''/service execution installs a service running an encoded loader, marking the beacon moving off-host or re-establishing itself alongside the post-ex activity these pipes carry.'
  - id: f356a9c4-effd-4608-bbf8-408afd5cd006
    name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
    reason: 'Co-occurring C2 channel: the same beacon''s DNS-over-C2 egress from this host; pairing the local pipe artifact with outbound beaconing confirms a live, communicating implant and gives the C2 domain to pivot on.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CS fork-and-run output written to a named pipe on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\\\\.\\[Pp][Ii][Pp][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] 0[Xx][Ff][Ff][Ff][Ff][Ff][Ff][Ff][Ff] -[Ff][Oo][Rr][Cc][Ee][Vv]1/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential access on this host (handle open or remote thread into lsass)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Process injection / shellcode-exec activity on this host
    query: (data_win_system_eventID:"8") OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Uu][Ee][Uu][Ss][Ee][Rr][Aa][Pp][Cc].*/))
    pivot_on:
    - host
    window: 1h
  - name: 'Beacon C2 egress: spawnto/LOLBin processes connecting out on this host'
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]|\\[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]|\\[Ss][Ee][Aa][Rr][Cc][Hh][Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Remote-execution / lateral-movement tooling on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))
    pivot_on:
    - host
    window: 2h
