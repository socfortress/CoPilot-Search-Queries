name: HackTool - EfsPotato Named Pipe Creation
id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
version: 1
schema_version: "1.0"
date: "2023-12-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of a pipe name as used by the hack tool EfsPotato. MITRE
  ATT&CK: T1055.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\pipe\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\pipe\\\\srvsvc*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_pipeName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_pipeName:
                          value: "*\\\\CtxShare*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_pipeName:
                          value: "\\\\pipe\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*\pipe\*'; data_win_eventdata_pipeName
  matches '*\pipe\srvsvc*'; data_win_eventdata_pipeName matches '*\CtxShare*',
  among other conditions.

known_false_positives: >
  \pipe\LOCAL\Monitorian. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1429530155291193354?s=20
  - https://github.com/zcgonvh/EfsPotato
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    HackTool - EfsPotato Named Pipe Creation detected on host $agent_name$.
    Matched data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - hacktool
    - efspotato
    - named
    - pipe_created
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Pp][Ii][Pp][Ee]\\.*/ OR data_win_eventdata_pipeName:/.*\\[Pp][Ii][Pp][Ee]\\[Ss][Rr][Vv][Ss][Vv][Cc].*/) AND _exists_:data_win_eventdata_pipeName AND NOT (data_win_eventdata_pipeName:/.*\\[Cc][Tt][Xx][Ss][Hh][Aa][Rr][Ee].*/ OR data_win_eventdata_pipeName:/\\[Pp][Ii][Pp][Ee]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d0083b3-580b-40da-9bba-626c19fe4033
    name: HackTool - CoercedPotato Named Pipe Creation
    reason: Same Potato-family local privesc detected on the identical Sysmon 17/18 named-pipe surface; operators rotate between EfsPotato and CoercedPotato against one host, so a hit here is the sibling tool attempt.
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: The EventID 1 process footprint (CoercedPotato.exe / --exploitId) of that sibling coercion tool; it is often the very process that creates the pipe this rule flags.
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Another SeImpersonate-to-SYSTEM Potato variant (NTLM reflection); an operator who runs one Potato tool typically tries others on the same box when one fails.
  - id: 16f5d8ca-44bd-47c8-acbe-6fc95a16c12f
    name: RottenPotato Like Attack Pattern
    reason: The loopback ANONYMOUS-LOGON Type-3 authentication (127.0.0.1/::1, workstation '-') that the local EFS-RPC coercion itself generates - the 4624 confirmation that the EfsPotato privesc actually fired.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: The exact mechanism EfsPotato abuses - stealing a SYSTEM token over a named pipe - seen from the process side (cmd/powershell with pipe redirection), confirming the token-impersonation step.
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: 'Classic precursor: the MSSQL service account (sqlservr.exe) holds SeImpersonatePrivilege, the precondition for a Potato attack; a shell spawned here is the foothold EfsPotato elevates from.'
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: 'Classic precursor: an IIS (w3wp.exe) web shell gives the SeImpersonate-holding service-account foothold that EfsPotato turns into SYSTEM.'
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Immediate follow-on once SYSTEM is obtained: lsadump/cachedump/wceservicepipe credential-theft tooling leaves pipe artifacts on the same Sysmon 17/18 surface, within minutes of the privesc.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SeImpersonate-privileged web/DB service spawning a shell (privesc foothold)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]|\\[Hh][Tt][Tt][Pp][Dd]\.[Ee][Xx][Ee]|\\[Nn][Gg][Ii][Nn][Xx]\.[Ee][Xx][Ee]|\\[Pp][Hh][Pp]-[Cc][Gg][Ii]\.[Ee][Xx][Ee]|\\[Pp][Hh][Pp]\.[Ee][Xx][Ee]|\\[Tt][Oo][Mm][Cc][Aa][Tt]9\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Loopback ANONYMOUS-LOGON Type-3 from the EFS/RPC coercion on this host
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_targetUserName:/[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ll][Oo][Gg][Oo][Nn]/ AND (data_win_eventdata_ipAddress:"127.0.0.1" OR data_win_eventdata_ipAddress:"::1")
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential access / memory dump on this host (post-SYSTEM)
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/)))
    pivot_on:
    - host
    window: 1h
  - name: New service or scheduled task installed as SYSTEM (persistence)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/)
    pivot_on:
    - host
    window: 2h
  - name: Microsoft Defender / AV tampering on this host (SYSTEM defense evasion)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR (data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee][Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn][Ss].*/) OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 2h
