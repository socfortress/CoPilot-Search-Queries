name: PUA - PAExec Default Named Pipe
id: f6451de4-df0a-41fa-8d72-b39f54a08db5
version: 1
schema_version: "1.0"
date: "2022-10-26"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f6451de4-df0a-41fa-8d72-b39f54a08db5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PAExec default named pipe. MITRE ATT&CK: T1569.002.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_pipeName:
              value: "\\\\PAExec*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '\PAExec*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/microsoft/Microsoft-365-Defender-Hunting-Queries/blob/efa17a600b43c897b4b7463cc8541daa1987eeb4/Command%20and%20Control/C2-NamedPipe.md
  - https://github.com/poweradminllc/PAExec
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PUA - PAExec Default Named Pipe detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - paexec
    - default
    - named
    - pipe_created
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/\\[Pp][Aa][Ee][Xx][Ee][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de7ce410-b3fb-4e8a-b38c-3b999e2c3420
    name: PAExec Service Installation
    reason: 'Same PAExec execution, service-install half: the SCM 7045 event for the PAExec-<pid> service fires within seconds of this named pipe on the same host; its presence turns a default-pipe hit into confirmed PAExec remote execution rather than a benign name collision.'
  - id: c4e49831-1496-40cf-8ce1-b53f942b02f9
    name: Renamed PAExec Execution
    reason: 'Same tool, process view: a PAExec binary identified by original filename / PE metadata / imphash running under a renamed image on this host is the executable that opened this default pipe, and the rename signals deliberate defense evasion around the same remote-exec event.'
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Direct precursor: PAExec creates and starts its service remotely by writing to the \svcctl pipe over IPC$ (EID 5145), which fires on the target moments before this pipe and reveals the source host/account driving the lateral movement.'
  - id: 52d8b0c6-53d6-439a-9e41-52ad442ad9ad
    name: First Time Seen Remote Named Pipe
    reason: 'Co-occurring inbound SMB access: the operator''s machine connecting to PAExec''s non-standard comms pipe over IPC$ surfaces here as a never-before-seen remote pipe, supplying the remote client behind the execution that the Sysmon pipe event itself does not record.'
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: 'Sibling remote-exec tool, same create-service-over-IPC$ technique: a PSEXESVC service install on the same host within the window means the operator is also wielding PsExec, widening a single pipe hit into a lateral-movement campaign on this host.'
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: 'Sibling remote-exec tool: an Impacket/Metasploit psexec-style random-named service install over SMB on the same host is the identical remote service-execution mechanism from a different toolkit, corroborating hands-on-keyboard lateral movement alongside PAExec.'
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Follow-on in the same telemetry: PAExec with -s runs its payload as SYSTEM, and a credential-dumper pipe (lsadump/cachedump/wceservicepipe) appearing next on this host is the expected credential-theft step once the SYSTEM foothold is established.'
  - id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
    name: Credential Dumping Tools Service Execution - System
    reason: 'Follow-on: a credential-dumping tool (gsecdump/pwdump/mimidrv/cachedump/...) deployed as an SCM service on this host is precisely how an operator weaponizes the SYSTEM-level remote execution PAExec just delivered.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PAExec / PsExec service binary dropped in the Windows directory
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Aa][Ee][Xx][Ee][Cc]-.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ss][Ee][Xx][Ee][Cc]-.*\.[Kk][Ee][Yy]/)
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by the PAExec / PsExec service (the executed payload)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Aa][Ee][Xx][Ee][Cc]-.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Inbound SMB network logons (Type 3) around the remote execution
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - host
    window: 2h
  - name: LSASS access and credential dumping on this host (SYSTEM follow-on)
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*[Ww][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Ii][Pp][Ee].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*-[Mm][Aa] .*[Ll][Ss][Aa][Ss][Ss].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Alternate remote-exec / lateral-movement vectors on this host (WMI / WinRM / remote schtasks)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*[Cc][Aa][Ll][Ll].*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ss] .*/) OR (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Mm][Ii][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Ii][Mm][Mm][Ee][Tt][Hh][Oo][Dd].*/))
    pivot_on:
    - host
    window: 4h
