t][Ee][Ss][Tt][Pp][Ii][Pp][Ee]/ OR data_win_eventdata_pipeName:/\\[Ww][Ii][Nn][Ss][Ee][Ss][Ss][Ii][Oo][Nn]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Same EID 17/18 pipe telemetry: this rule''s static list already carries Cobalt Strike MD5/GUID default pipes, so a co-firing hit on CS default/postex pipes (\postex_*, \msse-*-server) confirms the C2 framework is Cobalt Strike and that a beacon is actively running post-exploitation jobs on this host.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Precursor/concurrent cause: a Cobalt Strike beacon is injected into a host process (EID 8 CreateRemoteThread with CS-typical start addresses) and the malicious named pipe is that beacon''s IPC/SMB channel - this rule reveals how the implant that opened the pipe came to run.'
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: 'Classic next step on the same host: its query is the getsystem artifact (cmd/powershell ''echo ... > \\.\pipe\...''), the named-pipe token-impersonation primitive C2 frameworks use to elevate to SYSTEM right after the beacon''s pipe appears.'
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: 'Co-occurring credential access in the same EID 17/18 stream: credential-dumping tools create their own pipes (\cachedump, \lsadump, \wceservicepipe) - mirroring the \lsassw entry in this rule - so a hit means the operator moved from foothold to harvesting secrets on this host.'
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: 'Follow-on credential theft via different telemetry (EID 10): rundll32 calling comsvcs.dll MiniDump against lsass.exe is the LSASS-dump an operator runs once a beacon is established - the actual theft that the pipe-based cred tooling only hints at.'
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Lateral-movement arm over the exact pipe family this rule lists: remote service creation across the \svcctl pipe (EID 5145, IPC$ + WriteData) is the PsExec/Impacket technique behind the \svcctl / \csexecsvc / \ahexec entries - it shows this host being reached from, or reaching, another over SMB.'
  - id: 493fb4ab-cdcc-4c4f-818c-0e363bd1e4bb
    name: WMI Event Consumer Created Named Pipe
    reason: 'Fileless lateral movement this rule''s own references cite (LiquidSnake): scrcons.exe (a WMI event consumer) creating a named pipe is the WMI+pipe pattern used to execute and persist payloads across hosts without touching disk.'
  - id: 739915e4-1e70-4778-8b8a-17db02f66db1
    name: Turla Group Named Pipes
    reason: 'APT attribution sibling in the same EID 17/18 stream: this rule already carries Turla pipes (\isapi_dg, \isapi_http), so a co-firing hit on Turla''s other pipes (\atctl, \comnap, \iehelper) points the incident at a specific nation-state implant rather than a commodity tool.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access & credential-dump tooling on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: Remote-thread process injection on this host
    query: (data_win_system_eventID:"8") OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/))
    pivot_on:
    - host
    window: 1h
  - name: Remote-execution & lateral-movement tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\([Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|[Ss][Cc][Rr][Cc][Oo][Nn][Ss])\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)))
    pivot_on:
    - host
    window: 2h
  - name: SMB named-pipe transport connections on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445"
    pivot_on:
    - host
    window: 1h
  - name: Post-exploitation host & AD reconnaissance on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Qq][Uu][Ss][Ee][Rr]|[Kk][Ll][Ii][Ss][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo])\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\([Nn][Ee][Tt]|[Nn][Ee][Tt]1)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn].*/)))
    pivot_on:
    - host
    window: 1h
