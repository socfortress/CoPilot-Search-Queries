    Malicious Named Pipe Created detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1055
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

