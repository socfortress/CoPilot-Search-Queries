status: experimental
type: TTP

description: >
  Detects the creation of a named pipe seen used by known APTs or malware. MITRE
  ATT&CK: T1055.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - bool:
            should:
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\46a676ab7f179e511e30dd2dc41bd388"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\583da945-62af-10e8-4902-a8f205c72b2e"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\6e7645c4-32c5-4fe3-aabf-e94c2f4370e7"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\9f81f59bc58452127884ce513865ed20"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\adschemerpc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\ahexec"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\AnonymousPipe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\bc31a7"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\bc367"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\bizkaz"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\csexecsvc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\dce_3d"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\e710f28d59aa529d6792ca6ff0ca1b34"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\gruntsvc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\isapi_dg"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\isapi_dg2"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\isapi_http"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\jaccdpqnvbrrxlaf"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\lsassw"
                    case_insensitive: true
              - term:
