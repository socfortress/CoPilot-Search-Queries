                    value: "\\NamePipe_MoreWindows"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\pcheap_reuse"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\Posh*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\rpchlp_3"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
