              - term:
                  data_win_eventdata_pipeName:
                    value: "\\dce_3d"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\e710f28d59aa529d6792ca6ff0ca1b34"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\gruntsvc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\isapi_dg"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\isapi_dg2"
                    case_insensitive: true
              - term:
                  data_win_eventdata_pipeName:
                    value: "\\isapi_http"
                    case_insensitive: true
              - term:
