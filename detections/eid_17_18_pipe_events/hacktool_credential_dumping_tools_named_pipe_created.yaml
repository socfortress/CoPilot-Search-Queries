name: HackTool - Credential Dumping Tools Named Pipe Created
id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
version: 1
schema_version: "1.0"
date: "2023-08-07"
author: Teymur Kheirkhabarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects well-known credential dumping tools execution via specific named pipe
  creation. MITRE ATT&CK: T1003.001, T1003.002, T1003.004, T1003.005.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\cachedump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\lsadump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "*\\\\wceservicepipe*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*\cachedump*';
  data_win_eventdata_pipeName matches '*\lsadump*'; data_win_eventdata_pipeName
  matches '*\wceservicepipe*'.

known_false_positives: >
  Legitimate Administrator using tool for password recovery. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://image.slidesharecdn.com/zeronights2017kheirkhabarov-171118103000/75/hunting-for-credentials-dumping-in-windows-environment-57-2048.jpg?cb=1666035799
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/005/

response:
  message: >
    HackTool - Credential Dumping Tools Named Pipe Created detected on host
    $agent_name$. Matched data_win_eventdata_pipeName:
    $data_win_eventdata_pipeName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1003.001, T1003.002, T1003.004,
    T1003.005
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1003.002
    - T1003.004
    - T1003.005
  custom_tags:
    - hacktool
    - credential
    - dumping
    - pipe_created
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*\\[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*\\[Ww][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Ii][Pp][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7aa7009a-28b9-4344-8c1f-159489a390df
    name: HackTool - Windows Credential Editor (WCE) Execution
    reason: The wceservicepipe this rule matches is created by Windows Credential Editor; this detects the wce.exe/wce64.exe binary (by name and imphash) running on the same host - the process behind that pipe, usually within seconds.
  - id: f0d1feba-4344-4ca9-8121-a6c97bd6df52
    name: Credential Dumping Tools Service Execution - Security
    reason: gsecdump/cachedump/pwdump (the tools behind the cachedump and lsadump pipes) register a helper service to run as SYSTEM; this detects that exact 4697 service install by serviceFileName - the very mechanism that creates the pipe.
  - id: 1de68c67-af5c-4097-9c85-fe5578e09e67
    name: WCE wceaux.dll Access
    reason: WCE drops and accesses wceaux.dll when performing pass-the-hash; its access on the same host confirms WCE is actively dumping and reusing credentials rather than merely present.
  - id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
    name: Password Dumper Activity on LSASS
    reason: 'Co-occurring credential access: a password dumper requesting SAM_DOMAIN handles into lsass.exe on the same host corroborates a live-memory harvest alongside the pipe tool''s registry/LSA-secret theft.'
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: 'Same objective, another path: reg.exe save of HKLM\SAM/SECURITY/SYSTEM extracts the same SAM hashes, LSA secrets and cached domain creds gsecdump pulls, and operators frequently do both on one host.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Complementary credential dumper (sekurlsa::/lsadump::) the same operator routinely runs alongside gsecdump/WCE; its presence on the host widens the harvest to live LSASS logon passwords and DPAPI.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'Direct follow-on: the NTLM hashes WCE/gsecdump just dumped are reused via NTLM network logon (type 3, keyLength 0) or seclogo, pivoting on this host as the PtH source or on the dumped account.'
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: 'Follow-on reuse of the harvested hash: overpass-the-hash forges a Kerberos TGT from the dumped NTLM hash (logon type 9, seclogo + Negotiate) - the attacker''s next step after credential theft.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential-dumping hacktool binaries executing on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Cc][Ee]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Qq][Uu][Aa][Rr][Kk][Ss][Pp][Ww][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_originalFileName:/.*[Ww][Cc][Ee].*\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 1h
  - name: LSASS memory access or dump on this host
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/)))
    pivot_on:
    - host
    window: 1h
  - name: SAM/SECURITY/SYSTEM registry hive extraction on this host
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ss][Aa][Vv][Ee] .*/ AND (data_win_eventdata_commandLine:/.*\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Mm].*/))
    pivot_on:
    - host
    window: 2h
  - name: Dumped-account credential reuse (pass-the-hash / explicit creds)
    query: ((data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/[Ss][Ee][Cc][Ll][Oo][Gg][Oo]/) OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_logonProcessName:/[Nn][Tt][Ll][Mm][Ss][Ss][Pp]/) OR data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 6h
  - name: Remote-execution / lateral-movement tooling launched on this host
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Nn][Oo][Dd][Ee]:.*/) OR (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))))
    pivot_on:
    - host
    window: 2h
