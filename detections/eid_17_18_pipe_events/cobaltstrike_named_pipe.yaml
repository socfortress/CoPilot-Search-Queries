name: CobaltStrike Named Pipe
id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
version: 1
schema_version: "1.0"
date: "2022-10-31"
author: Florian Roth (Nextron Systems), Wojciech Lesicki
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a named pipe as used by CobaltStrike. MITRE ATT&CK:
  T1055.

data_source:
  - Sysmon EventID 17/18 - Named Pipe

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "17"
              - term:
                  data_win_system_eventID: "18"
            minimum_should_match: 1
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_pipeName:
                          value: "*\\\\MSSE-*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_pipeName:
                          value: "*-server*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\postex_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\status_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\msagent_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\mojo_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\interprocess_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\samr_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\netlogon_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\srvsvc_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\lsarpc_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_pipeName:
                    value: "\\\\wkssvc_*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_pipeName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon named pipe logging (EventIDs 17/18) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_pipeName matches '*\MSSE-*'; data_win_eventdata_pipeName
  matches '*-server*'; data_win_eventdata_pipeName matches '\postex_*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/d4rksystem/status/1357010969264873472
  - https://labs.f-secure.com/blog/detecting-cobalt-strike-default-modules-via-named-pipe-analysis/
  - https://github.com/SigmaHQ/sigma/issues/253
  - https://blog.cobaltstrike.com/2021/02/09/learn-pipe-fitting-for-all-of-your-offense-projects/
  - https://redcanary.com/threat-detection-report/threats/cobalt-strike/
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    CobaltStrike Named Pipe detected on host $agent_name$. Matched
    data_win_eventdata_pipeName: $data_win_eventdata_pipeName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1055
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_pipeName
      type: pipe
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - cobaltstrike
    - named
    - pipe_created
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND ((data_win_eventdata_pipeName:/.*\\[Mm][Ss][Ss][Ee]-.*/ AND data_win_eventdata_pipeName:/.*-[Ss][Ee][Rr][Vv][Ee][Rr].*/) OR data_win_eventdata_pipeName:/\\[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/\\[Ss][Tt][Aa][Tt][Uu][Ss]_.*/ OR data_win_eventdata_pipeName:/\\[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/\\[Mm][Oo][Jj][Oo]_.*/ OR data_win_eventdata_pipeName:/\\[Ii][Nn][Tt][Ee][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss]_.*/ OR data_win_eventdata_pipeName:/\\[Ss][Aa][Mm][Rr]_.*/ OR data_win_eventdata_pipeName:/\\[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]_.*/ OR data_win_eventdata_pipeName:/\\[Ss][Rr][Vv][Ss][Vv][Cc]_.*/ OR data_win_eventdata_pipeName:/\\[Ll][Ss][Aa][Rr][Pp][Cc]_.*/ OR data_win_eventdata_pipeName:/\\[Ww][Kk][Ss][Ss][Vv][Cc]_.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'The injection this pipe serves: a Beacon''s postex_* pipe is the IPC channel to a sacrificial process it just injected into via CreateRemoteThread (EID8). Same beacon, same host, same minute.'
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: The spawnto/sacrificial process (rundll32, dllhost, gpupdate) a Beacon forks for fork&run jobs is exactly the process that opens these postex_* named pipes - the parent side of this event.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Precursor: how the Beacon DLL was loaded/launched before it began opening its default pipes. Finding it on the same host dates the initial execution.'
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: The most common postex job run over a postex_* pipe is LSASS/credential dumping; a dumping tool leaving its own named pipe on this host confirms the beacon moved to credential access.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: getsystem via a 'cmd /c echo > \\.\pipe\<name>' named-pipe impersonation - a beacon's likely next privesc and itself a named-pipe technique, so it pairs directly with this pipe event on the same host.
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: A Beacon doing jump psexec / SYSTEM elevation installs a service (EID4697) running an encoded payload; it co-occurs with the SMB-beacon pipes (msagent_*, status_*) this rule matches.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: psexec-style remote service creation over SMB IPC$/svcctl (EID5145) is the lateral movement a linked SMB Beacon performs; the srvsvc_*/samr_* RPC-mimic pipes here are the same lateral-movement surface.
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: Sibling detection that catches operator-customized (malleable C2 profile) pipe names this default-pattern rule would miss; a hit expands the same beacon's pipe footprint and raises confidence.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process injection & CS-typical LSASS/handle access on this host
    query: (data_win_system_eventID:"8") OR (data_win_system_eventID:"10" AND (data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff]3[Ff][Ff][Ff]/ OR data_win_eventdata_callTrace:/.*[Uu][Nn][Kk][Nn][Oo][Ww][Nn].*/))
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential dumping (postex job) on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/))
    pivot_on:
    - host
    window: 1h
  - name: C2 egress from a sacrificial/LOLBin spawnto process on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: SMB lateral movement / psexec service child on this host
    query: (data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445") OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: AD / domain discovery (samr/netlogon/lsarpc pipe recon) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Ee][Tt][Hh][Oo][Dd].*/)
    pivot_on:
    - host
    window: 4h
