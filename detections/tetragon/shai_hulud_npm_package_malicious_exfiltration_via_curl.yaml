name: Shai-Hulud NPM Package Malicious Exfiltration via Curl
id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
version: 1
schema_version: "1.0"
date: "2025-09-24"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential Shai Hulud NPM package attack attempting to exfiltrate data
  via curl to external webhook sites. MITRE ATT&CK: T1041, T1005.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/curl"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*curl*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-d*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*webhook.site/bb8ca5f6-4175-45d2-b042-fc9ebb8170b7*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/curl';
  data_process_exec_process_arguments matches '*curl*';
  data_process_exec_process_arguments matches '*-d*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.getsafety.com/blog-posts/shai-hulud-npm-attack
  - https://attack.mitre.org/techniques/T1041/
  - https://attack.mitre.org/techniques/T1005/

response:
  message: >
    Shai-Hulud NPM Package Malicious Exfiltration via Curl detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1041, T1005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1041
    - T1005
  custom_tags:
    - hulud
    - package
    - exfiltration
    - linux
    - tetragon
    - process_creation
    - collection
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ AND data_process_exec_process_arguments:/.*[Cc][Uu][Rr][Ll].*/ AND data_process_exec_process_arguments:/.*-[Dd].*/ AND data_process_exec_process_arguments:/.*[Ww][Ee][Bb][Hh][Oo][Oo][Kk]\.[Ss][Ii][Tt][Ee]\/[Bb][Bb]8[Cc][Aa]5[Ff]6-4175-45[Dd]2-[Bb]042-[Ff][Cc]9[Ee][Bb][Bb]8170[Bb]7.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
    name: Script Interpreter Spawning Credential Scanner - Linux
    reason: 'Immediate precursor and the reason this exfil exists: a node/bun interpreter spawning trufflehog/gitleaks to harvest npm, GitHub and cloud secrets - the exact data this ''curl -d'' POST ships to the webhook. Collection then exfiltration on the same host, usually minutes apart.'
  - id: d7a650c4-226c-451e-948f-cc490db506aa
    name: PUA - TruffleHog Execution - Linux
    reason: 'The credential-scanning step explicitly attributed to the Shai-Hulud campaign: trufflehog enumerating verified secrets (Git/GitHub/Jira/Slack/S3/GCS). Its firing on the same host is the harvest that produced the payload POSTed here.'
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: 'Same behaviour, broader net: generic curl data exfiltration not pinned to the single hard-coded webhook.site URL this rule matches. Catches the worm POSTing stolen secrets to any additional or rotated endpoint on the same host.'
  - id: 11bb9b26-4179-4a06-afcb-1ec31fce1627
    name: Shai-Hulud Malware Indicators - Linux
    reason: Same-worm command-line marker ('Shai-Hulud'/'SHA1HULUD' in process arguments). Its presence corroborates that this curl exfil is the campaign's work on the host, not a benign webhook.site test.
  - id: eb827bbd-670a-4d58-8446-c464d8ac2323
    name: Shai-Hulud Malicious Bun Execution - Linux
    reason: The worm's payload runtime (node -> bun running bun_environment.js, Shai-Hulud 'Second Coming') that drives the harvest-and-exfiltrate behaviour. Same worm lineage; a host exfiltrating via this curl should be checked for the bun payload behind it.
  - id: c70834fa-fb9d-4aa0-9e7d-45ceed36f3f7
    name: Linux Suspicious Child Process from Node.js - React2Shell
    reason: 'Parent-process mechanism: a Node.js process spawning curl/downloader/shell children - exactly how a malicious npm postinstall launches the curl that performs this exfil. node -> curl on the same host is the execution context behind the POST.'
  - id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
    name: Axios NPM Compromise Indicators - Linux
    reason: Sibling npm supply-chain compromise (node/bun postinstall -> curl beacon to an attacker host). A dev/CI host hit by Shai-Hulud exfil is often hit by co-wave droppers; check for the axios RAT IOCs in the same install tree.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'The ingress-side curl of the same chain: Shai-Hulud pulls its tooling with ''curl -fsSL https://bun.sh/install | bash'' and downloads the GitHub runner into /tmp or /dev/shm. Curl download-and-run on the host corroborates the curl-driven stager activity surrounding this exfil.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential / secret harvesting that produced the exfiltrated data on this host
    query: (data_process_exec_process_binary:/.*(\/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]|\/[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss])/ OR data_process_exec_process_arguments:/.*\.[Nn][Pp][Mm][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\.[Gg][Ii][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Ee][Nn][Vv][Ii][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Nn][Pp][Mm]_[Tt][Oo][Kk][Ee][Nn].*/ OR data_process_exec_process_arguments:/.*[Gg][Ii][Tt][Hh][Uu][Bb]_[Tt][Oo][Kk][Ee][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: JS runtime / package manager spawning a network or shell child (malicious postinstall) on this host
    query: (data_process_exec_parent_binary:/.*(\/[Nn][Oo][Dd][Ee]|\/[Bb][Uu][Nn]|\/[Nn][Pp][Mm]|\/[Nn][Pp][Xx]|\/[Yy][Aa][Rr][Nn]|\/[Pp][Nn][Pp][Mm])/ AND data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh])/)
    pivot_on:
    - host
    window: 2h
  - name: 'Wider exfil / C2 breadth: webhook.site infrastructure and curl/wget upload beacons on this host'
    query: (data_process_exec_process_arguments:/.*[Ww][Ee][Bb][Hh][Oo][Oo][Kk]\.[Ss][Ii][Tt][Ee].*/ OR (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*(--[Dd][Aa][Tt][Aa]|--[Ff][Oo][Rr][Mm]|--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee]|--[Dd][Aa][Tt][Aa]-[Bb][Ii][Nn][Aa][Rr][Yy]|--[Dd][Aa][Tt][Aa]-[Rr][Aa][Ww]).*/))
    pivot_on:
    - host
    window: 2h
  - name: 'Self-propagation and GitHub persistence: npm publish, git push/remote, workflows, shai-hulud on this host'
    query: ((data_process_exec_process_binary:/.*(\/[Nn][Pp][Mm]|\/[Yy][Aa][Rr][Nn]|\/[Pp][Nn][Pp][Mm])/ AND data_process_exec_process_arguments:/.*[Pp][Uu][Bb][Ll][Ii][Ss][Hh].*/) OR (data_process_exec_process_binary:/.*\/[Gg][Ii][Tt]/ AND data_process_exec_process_arguments:/.*( [Pp][Uu][Ss][Hh]|[Rr][Ee][Mm][Oo][Tt][Ee] [Aa][Dd][Dd]).*/) OR data_process_exec_process_arguments:/.*\.[Gg][Ii][Tt][Hh][Uu][Bb]\/[Ww][Oo][Rr][Kk][Ff][Ll][Oo][Ww][Ss].*/ OR data_process_exec_process_arguments:/.*[Ss][Hh][Aa][Ii]-[Hh][Uu][Ll][Uu][Dd].*/)
    pivot_on:
    - host
    window: 4h
  - name: Data staging / encoding immediately before the POST (archive, base64, openssl) on this host
    query: (data_process_exec_process_binary:/.*(\/[Tt][Aa][Rr]|\/[Gg][Zz][Ii][Pp]|\/[Zz][Ii][Pp]|\/[Bb][Zz][Ii][Pp]2|\/[Xx][Zz]|\/[Bb][Aa][Ss][Ee]64|\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]|\/[Xx][Xx][Dd])/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Ee]64.*/)
    pivot_on:
    - host
    window: 1h
