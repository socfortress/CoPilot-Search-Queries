name: Shell Execution via Rsync - Linux
id: e2326866-609f-4015-aea9-7ec634e8aa04
version: 1
schema_version: "1.0"
date: "2025-01-18"
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.), Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e2326866-609f-4015-aea9-7ec634e8aa04
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the "rsync" utility to execute a shell. Such behavior may
  be associated with privilege escalation, unauthorized command execution, or to
  break out from restricted environments. MITRE ATT&CK: T1059.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/rsync"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/rsyncd"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -e *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/ash *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bash *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/dash *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/csh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/sh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/zsh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/tcsh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/ksh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*'ash *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*'bash *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*'dash *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*'csh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*'sh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*'zsh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*'tcsh *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*'ksh *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/rsync';
  data_process_exec_process_binary matches '*/rsyncd';
  data_process_exec_process_arguments matches '* -e *', among other conditions.

known_false_positives: >
  Legitimate cases in which "rsync" is used to execute a shell. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/rsync/#shell
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Shell Execution via Rsync - Linux detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - shell
    - rsync
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Rr][Ss][Yy][Nn][Cc]/ OR data_process_exec_process_binary:/.*\/[Rr][Ss][Yy][Nn][Cc][Dd]/) AND data_process_exec_process_arguments:/.* -[Ee] .*/ AND (data_process_exec_process_arguments:/.*\/[Aa][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*\/[Bb][Aa][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*\/[Dd][Aa][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*\/[Cc][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*\/[Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*\/[Zz][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*\/[Tt][Cc][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*\/[Kk][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*'[Aa][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*'[Bb][Aa][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*'[Dd][Aa][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*'[Cc][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*'[Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*'[Zz][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*'[Tt][Cc][Ss][Hh] .*/ OR data_process_exec_process_arguments:/.*'[Kk][Ss][Hh] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 297241f3-8108-4b3a-8c15-2dda9f844594
    name: Suspicious Invocation of Shell via Rsync
    reason: 'The complementary half of ''rsync spawned a shell'': this target catches rsync run WITH ''-e <shell>'' (the GTFOBins/manual breakout), while this rule catches a shell as a child of rsync WITHOUT ''-e'' (CVE-2024-12084 rsync RCE). Same binary, same anomaly; co-firing on one host within minutes is near-certain true-positive confirmation and each catches a variant the other misses.'
  - id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
    name: Potential Discovery Activity Using Find - Linux
    reason: 'Textbook precursor: ''find / -perm -4000 / -perm -u=s'' SUID enumeration is exactly how an attacker discovers that rsync carries the SUID bit and is therefore abusable for a root GTFOBins breakout. Seeing this on the same host shortly before the rsync shell explains WHY rsync was chosen.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Precursor that locates the escalation path: reading /etc/sudoers reveals a NOPASSWD/sudo-allowed rsync, so the subsequent ''rsync -e <shell>'' runs as root. Confirms the breakout targeted a known-escalatable rsync rather than being benign admin use.'
  - id: 6adfbf8f-52be-4444-9bac-81b539624146
    name: Shell Execution via Find - Linux
    reason: Sibling GTFOBins restricted-shell breakout ('find ... -exec /bin/sh'). An actor probing a host for an abusable SUID/sudo binary routinely tries several GTFOBins in quick succession, so a find-breakout on the same host within the window is the same hands-on privesc attempt, not coincidence.
  - id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
    name: Vim GTFOBin Abuse - Linux
    reason: Sibling GTFOBins breakout via an interactive editor (':!sh', ':py'), one of the most common restricted-shell escapes tried alongside rsync. Co-occurrence strengthens the conclusion that the operator is sweeping GTFOBins binaries on this host to escape or escalate.
  - id: bed978f8-7f3a-432b-82c5-9286a9b3031a
    name: Shell Invocation via Env Command - Linux
    reason: Sibling GTFOBins breakout ('env /bin/sh') from the same restricted-environment-escape playbook. Like the rsync trick it uses an allowed utility to spawn an interpreter, so its presence on the same host in the window points to the same jailbreak/privesc objective.
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: Co-occurring privilege-escalation attempt by a different route ('sudo -u#-1' to run as root). The rsync GTFOBins trick is one way to reach root; seeing this sudo-CVE abuse on the same host around the same time shows the actor actively trying multiple escalation paths.
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Broad precursor recon (whoami/id, sudoers listing, credential-in-file searches - T1592.004/T1552.001) that typically runs before a privilege-escalation breakout. Ties together the enumeration phase that set up the choice of rsync as the escalation vector.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by rsync on this host
    query: data_process_exec_parent_binary:/.*(\/[Rr][Ss][Yy][Nn][Cc]|\/[Rr][Ss][Yy][Nn][Cc][Dd])/
    pivot_on:
    - host
    window: 1h
  - name: rsync executed via sudo on this host (privilege-escalation vector)
    query: (data_process_exec_parent_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_binary:/.*(\/[Rr][Ss][Yy][Nn][Cc]|\/[Rr][Ss][Yy][Nn][Cc][Dd])/) OR (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*[Rr][Ss][Yy][Nn][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: SUID / sudo privilege-escalation enumeration on this host
    query: (data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] .*/) OR (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.* -[Ll].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Shell spawned by other GTFOBins/LOLBin utilities on this host
    query: data_process_exec_process_binary:/.*(\/[Aa][Ss][Hh]|\/[Bb][Aa][Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Cc][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Ss][Hh]|\/[Tt][Cc][Ss][Hh]|\/[Zz][Ss][Hh])/ AND data_process_exec_parent_binary:/.*(\/[Ff][Ii][Nn][Dd]|\/[Gg][Ii][Tt]|\/[Nn][Ii][Cc][Ee]|\/[Vv][Ii][Mm]|\/[Ee][Nn][Vv]|\/[Aa][Ww][Kk]|\/[Tt][Aa][Rr]|\/[Cc][Aa][Pp][Ss][Hh]|\/[Ff][Ll][Oo][Cc][Kk]|\/[Gg][Cc][Cc])/
    pivot_on:
    - host
    window: 2h
  - name: Post-breakout credential access / persistence / log tampering on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 4h
