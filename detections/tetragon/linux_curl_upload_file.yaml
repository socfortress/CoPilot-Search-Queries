name: Linux Suspicious Curl Data Exfiltration
id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects suspicious use of curl commands that include form data, uploads,
  or requests targeting AWS credential/config files, which may indicate
  data exfiltration or credential harvesting attempts on Linux endpoints.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_process_exec_process_binary: "/usr/bin/curl"
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments: "*-F*"
              - wildcard:
                  data_process_exec_process_arguments: "*--form*"
              - wildcard:
                  data_process_exec_process_arguments: "*-T*"
              - wildcard:
                  data_process_exec_process_arguments: "*--upload-file*"
              - wildcard:
                  data_process_exec_process_arguments: "*-d*"
              - wildcard:
                  data_process_exec_process_arguments: "*--data*"
              - wildcard:
                  data_process_exec_process_arguments: "*--data-raw*"
              - wildcard:
                  data_process_exec_process_arguments: "*-I*"
              - wildcard:
                  data_process_exec_process_arguments: "*--head*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments: "*.aws/credentials*"
              - wildcard:
                  data_process_exec_process_arguments: "*.aws/config*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not: []

  _source:
    - timestamp
    - agent_name
    - rule_description
    - rule_id
    - rule_level
    - data_process_exec_process_arguments
    - data_process_exec_process_auid
    - data_process_exec_parent_binary
    - data_process_exec_process_pid
    - data_process_exec_parent_pid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-27 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution
  and command-line arguments. Monitoring curl commands with data upload
  options or targeting AWS configuration files can indicate exfiltration attempts.

known_false_positives: >
  Legitimate automated scripts or backups using curl to send data or
  interact with AWS endpoints may trigger this detection.

references:
  - https://attack.mitre.org/techniques/T1041/
  - https://tetragon.io/docs/

response:
  message: >
    Suspicious curl activity detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Data Exfiltration
    - Cloud Credential Theft
  asset_type: Linux
  mitre_attack_id:
    - T1041
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:"/usr/bin/curl" AND (data_process_exec_process_arguments:/.*-F.*/ OR data_process_exec_process_arguments:/.*--form.*/ OR data_process_exec_process_arguments:/.*-T.*/ OR data_process_exec_process_arguments:/.*--upload-file.*/ OR data_process_exec_process_arguments:/.*-d.*/ OR data_process_exec_process_arguments:/.*--data.*/ OR data_process_exec_process_arguments:/.*--data-raw.*/ OR data_process_exec_process_arguments:/.*-I.*/ OR data_process_exec_process_arguments:/.*--head.*/) AND (data_process_exec_process_arguments:/.*\.aws\/credentials.*/ OR data_process_exec_process_arguments:/.*\.aws\/config.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: 'Precursor on the same host: find/grep hunting for files that contain ''password''/''credential''/''creds'' is how the attacker locates the ~/.aws credentials file this curl then uploads - the discovery step that immediately precedes the exfil.'
  - id: d7a650c4-226c-451e-948f-cc490db506aa
    name: PUA - TruffleHog Execution - Linux
    reason: 'Precursor/harvest: TruffleHog scans the filesystem and cloud scopes (s3/gcs) for verified secrets such as AWS keys; its execution on this host is the automated credential harvest that surfaces the cloud creds this curl command exfiltrates.'
  - id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
    name: Script Interpreter Spawning Credential Scanner - Linux
    reason: 'Precursor/harvest: a node/bun script launching trufflehog/gitleaks to steal secrets (Shai-Hulud cloud-credential theft); on the same host it is the scripted secret-harvest that feeds this curl exfiltration of AWS credentials.'
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: 'Co-occurring collection: cat/less/vim of /etc/shadow and /etc/passwd on the same host is the local-account-hash side of the same credential-harvesting sweep that produced this cloud-credential exfil - both are the attacker reading secrets to steal.'
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: 'Co-occurring exfil sibling: wget --post-file posts a file out over HTTP - the identical exfiltration behaviour via the alternate downloader; an attacker who scripts curl exfil routinely falls back to wget on the same host, so catching it widens the data-out picture.'
  - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
    name: Suspicious Curl File Upload - Linux
    reason: 'Co-occurring exfil sibling (superset): the general curl upload detection (--form/--upload-file/--data) catches this same attacker''s other curl uploads - SSH keys, database dumps, staged archives - in the same session, expanding the scope of what was stolen beyond the AWS file.'
  - id: b86d356d-6093-443d-971c-9b07db583c68
    name: Suspicious Curl Change User Agents - Linux
    reason: 'Co-occurring evasion: the exfil curl spoofing its User-Agent (-A/--user-agent) to blend the upload into normal web traffic - same tool, same host, the stealth facet of this exact data-out channel.'
  - id: linux-proxy-socks-curl-001
    name: Linux Proxy Socks Curl
    reason: 'Co-occurring evasion: curl routed through a SOCKS/HTTP proxy (-x/--proxy/socks/--preproxy) to obscure the exfil destination - the same curl exfiltration channel hidden behind a proxy on this host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cloud-credential and secret-store file access on this host
    query: (data_process_exec_process_arguments:/.*\.[Aa][Ww][Ss]\/.*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*\.[Kk][Uu][Bb][Ee]\/.*/ OR data_process_exec_process_arguments:/.*\.[Dd][Oo][Cc][Kk][Ee][Rr]\/[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_process_exec_process_arguments:/.*[Gg][Cc][Ll][Oo][Uu][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other outbound exfil / transfer tooling on this host
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Rr][Cc][Ll][Oo][Nn][Ee]|\/[Tt][Ff][Tt][Pp]|\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: Cloud-CLI use of the stolen credentials on this host
    query: data_process_exec_process_binary:/.*(\/[Aa][Ww][Ss]|\/[Ss]3[Cc][Mm][Dd]|\/[Gg][Ss][Uu][Tt][Ii][Ll]|\/[Gg][Cc][Ll][Oo][Uu][Dd]|\/[Aa][Zz]|\/[Kk][Uu][Bb][Ee][Cc][Tt][Ll]|\/[Rr][Cc][Ll][Oo][Nn][Ee])/
    pivot_on:
    - host
    window: 6h
  - name: Collection staging - archive / compression / encryption on this host
    query: data_process_exec_process_binary:/.*(\/[Tt][Aa][Rr]|\/[Zz][Ii][Pp]|\/[Gg][Zz][Ii][Pp]|\/7[Zz]|\/7[Zz][Aa]|\/7[Zz][Rr]|\/[Xx][Zz]|\/[Bb][Zz][Ii][Pp]2|\/[Zz][Ss][Tt][Dd]|\/[Gg][Pp][Gg])/
    pivot_on:
    - host
    window: 2h
