graylog:
  query: ((data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ AND data_process_exec_process_arguments:/.*[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss].*/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ AND data_process_exec_process_arguments:/.*[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss].*/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/) OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]/ AND data_process_exec_process_arguments:/.*[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss].*/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/) OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]/ AND data_process_exec_process_arguments:/.*[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss].*/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Dd].*/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Dd].*/ AND data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ AND data_process_exec_process_arguments:/.*[Cc][Bb][Dd][Aa][Ee][Mm][Oo][Nn].*/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/) OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]/ AND data_process_exec_process_arguments:/.*[Cc][Bb][Dd][Aa][Ee][Mm][Oo][Nn].*/ AND data_process_exec_process_arguments:/.*[Oo][Ff][Ff].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Cc][Bb][Dd][Aa][Ee][Mm][Oo][Nn].*/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Cc][Bb][Dd][Aa][Ee][Mm][Oo][Nn].*/ AND data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]/ AND data_process_exec_process_arguments:/.*0.*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/ AND data_process_exec_process_arguments:/.*[Ff][Aa][Ll][Cc][Oo][Nn]-[Ss][Ee][Nn][Ss][Oo][Rr].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ AND data_process_exec_process_arguments:/.*[Ff][Aa][Ll][Cc][Oo][Nn]-[Ss][Ee][Nn][Ss][Oo][Rr].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: 'Direct sibling: generic ''systemctl/service/chkconfig stop|disable'' of any unit. This rule only catches a fixed list (firewalld, cbdaemon, falcon-sensor); the same hands-on-keyboard session usually stops other security/logging units too, which this catches.'
  - id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
    name: UFW Disable Attempt
    reason: Same T1562.004 firewall-takedown intent via a different front-end (ufw). An attacker clearing the host firewall often tears down whichever firewall is present, so a UFW disable on the same host corroborates the iptables/firewalld disable that fired.
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: 'Complementary firewall-evasion method: flushing iptables/ip6tables chains (-F/-X/-Z) to allow all traffic instead of (or alongside) stopping the service. Flush-then-stop on the same host is one firewall-takedown action.'
  - id: 36388120-b3f1-4ce9-b50b-280d9a7f4c04
    name: Kaspersky Endpoint Security Stopped Via CommandLine - Linux
    reason: Parallel EDR-kill detection. This rule stops CrowdStrike (falcon-sensor) and Carbon Black (cbdaemon); killing Kaspersky (kesl) on the same host within the window is the same 'blind the endpoint agent' step against another vendor.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: 'Same defense-impairment phase aimed at host logging: ''auditctl -D'' wipes all audit rules to blind auditd. Disabling EDR/firewall and deleting audit rules are the matched pair that together leave the host unmonitored.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Typical follow-on cover-up: once the firewall/EDR is down, the operator clears /var/log via rm/shred/unlink to erase the evidence the now-disabled tools stopped shipping.'
  - id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
    name: Syslog Clearing or Removal Via System Utilities
    reason: Follow-on cover-up targeting syslog specifically. Emptying/removing the syslog on the same host after killing defenses is the same track-hiding step as log clearing and raises confidence this is malicious, not admin maintenance.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Follow-on anti-forensics: deleting ~/.bash_history erases the exact disable/stop command line that triggered this alert. A history wipe on the same host shortly after is a strong ''covering tracks'' corroborator.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Privilege escalation preceding the tamper (su/sudo/pkexec/doas)
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu]|\/[Ss][Uu][Dd][Oo]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Other firewall / SELinux / AppArmor controls touched on this host
    query: data_process_exec_process_binary:/.*(\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]|\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]|\/[Nn][Ff][Tt]|\/[Uu][Ff][Ww]|\/[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]-[Cc][Mm][Dd]|\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]|\/[Ss][Ee][Mm][Aa][Nn][Aa][Gg][Ee]|\/[Ss][Ee][Mm][Oo][Dd][Uu][Ll][Ee]|\/[Aa][Aa]-[Cc][Oo][Mm][Pp][Ll][Aa][Ii][Nn]|\/[Aa][Aa]-[Tt][Ee][Aa][Rr][Dd][Oo][Ww][Nn]|\/[Aa][Aa]-[Dd][Ii][Ss][Aa][Bb][Ll][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Other security / logging agents stopped or killed by name on this host
    query: ((data_process_exec_process_arguments:/.*([Ff][Aa][Ll][Cc][Oo][Nn]|[Cc][Bb][Dd][Aa][Ee][Mm][Oo][Nn]|[Cc][Bb][Aa][Gg][Ee][Nn][Tt][Dd]|[Kk][Ee][Ss][Ll]|[Ww][Aa][Zz][Uu][Hh]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Uu][Dd][Ii][Tt][Dd]|[Mm][Dd][Aa][Tt][Pp]|[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]|[Ss][Yy][Ss][Mm][Oo][Nn]|[Rr][Ss][Yy][Ss][Ll][Oo][Gg]|[Ff][Ii][Ll][Ee][Bb][Ee][Aa][Tt]|[Aa][Uu][Dd][Ii][Tt][Bb][Ee][Aa][Tt]|[Ss][Uu][Rr][Ii][Cc][Aa][Tt][Aa]).*/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]|[Kk][Ii][Ll][Ll]).*/) OR (data_process_exec_process_binary:/.*(\/[Pp][Kk][Ii][Ll][Ll]|\/[Kk][Ii][Ll][Ll][Aa][Ll][Ll])/ AND data_process_exec_process_arguments:/.*([Ff][Aa][Ll][Cc][Oo][Nn]|[Cc][Bb][Dd][Aa][Ee][Mm][Oo][Nn]|[Kk][Ee][Ss][Ll]|[Ww][Aa][Zz][Uu][Hh]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Uu][Dd][Ii][Tt][Dd]|[Mm][Dd][Aa][Tt][Pp]|[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Anti-forensic log, history and audit-trail wiping on this host
    query: ((data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Uu][Nn][Ll][Ii][Nn][Kk]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee])/ AND data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|[Ww][Tt][Mm][Pp]|[Bb][Tt][Mm][Pp]|[Ll][Aa][Ss][Tt][Ll][Oo][Gg]|[Mm][Ee][Ss][Ss][Aa][Gg][Ee][Ss]|[Ss][Ee][Cc][Uu][Rr][Ee]|[Aa][Uu][Tt][Hh]\.[Ll][Oo][Gg]).*/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*-[Dd].*/) OR (data_process_exec_process_binary:/.*\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*([Vv][Aa][Cc][Uu][Uu][Mm]|[Rr][Oo][Tt][Aa][Tt][Ee]).*/))
    pivot_on:
    - host
    window: 4h
  - name: Ingress tool transfer and payload staging after defenses down
    query: ((data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Tt][Ff][Tt][Pp])/) OR (data_process_exec_process_binary:/.*(\/[Tt][Mm][Pp]\/.*|\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*|\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*)/))
    pivot_on:
    - host
    window: 2h
