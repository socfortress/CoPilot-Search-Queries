Pp].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Cc][Bb][Dd][Aa][Ee][Mm][Oo][Nn].*/ AND data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]/ AND data_process_exec_process_arguments:/.*0.*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/ AND data_process_exec_process_arguments:/.*[Ff][Aa][Ll][Cc][Oo][Nn]-[Ss][Ee][Nn][Ss][Oo][Rr].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ AND data_process_exec_process_arguments:/.*[Ff][Aa][Ll][Cc][Oo][Nn]-[Ss][Ee][Nn][Ss][Oo][Rr].*/))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Other executions of this tool-set on this host (any arguments)"
      query: 'data_process_exec_process_binary:/.*(\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee])/'
      pivot_on: [host]
      window: 2h
    - name: "Shell / interpreter execution on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/ OR data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/)'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
