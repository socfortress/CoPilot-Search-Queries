name: Potential Linux Amazon SSM Agent Hijacking
id: f9b3edc5-3322-4fc7-8aa3-245d646cc4b7
version: 1
schema_version: "1.0"
date: "2023-08-03"
author: Muhammad Faisal
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f9b3edc5-3322-4fc7-8aa3-245d646cc4b7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential Amazon SSM agent hijack attempts as outlined in the Mitiga
  research report. MITRE ATT&CK: T1219.002.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/amazon-ssm-agent"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-register *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-code *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-id *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-region *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/amazon-ssm-agent';
  data_process_exec_process_arguments matches '*-register *';
  data_process_exec_process_arguments matches '*-code *', among other
  conditions.

known_false_positives: >
  Legitimate activity of system administrators. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.mitiga.io/blog/mitiga-security-advisory-abusing-the-ssm-agent-as-a-remote-access-trojan
  - https://www.bleepingcomputer.com/news/security/amazons-aws-ssm-agent-can-be-used-as-post-exploitation-rat-malware/
  - https://www.helpnetsecurity.com/2023/08/02/aws-instances-attackers-access/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Potential Linux Amazon SSM Agent Hijacking detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - amazon
    - agent
    - hijacking
    - linux
    - tetragon
    - process_creation
    - command_and_control
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Aa][Mm][Aa][Zz][Oo][Nn]-[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt]/ AND data_process_exec_process_arguments:/.*-[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr] .*/ AND data_process_exec_process_arguments:/.*-[Cc][Oo][Dd][Ee] .*/ AND data_process_exec_process_arguments:/.*-[Ii][Dd] .*/ AND data_process_exec_process_arguments:/.*-[Rr][Ee][Gg][Ii][Oo][Nn] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Interactive foothold that precedes the hijack: the attacker needs a hands-on shell to type ''amazon-ssm-agent -register -code -id -region''. A reverse shell on the same host confirms a real intrusion (not admin re-registration) and shows the noisy C2 channel the stealthy SSM RAT is meant to replace.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Co-occurring stager: attackers fetch the hybrid-activation parameters or follow-on tooling via curl/wget into /tmp or /dev/shm right before or after re-registering the agent, so a download-and-execute on the same host in the window dates the intrusion and names the payload.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Privilege-escalation precursor: re-registering amazon-ssm-agent and editing its systemd unit require root. Adding a user to root/sudoers is how the attacker gains and persists that privilege, and firing just before the hijack shows the same actor escalating then establishing the RAT.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Post-foothold enumeration: SUID-binary (-perm -4000) and credential-file (.htpasswd) hunting on the same host is the discovery an attacker runs right after landing and before turning the SSM agent into a RAT, so it brackets the start of the same hands-on session.'
  - id: 31545105-3444-4584-bebf-c466353230d2
    name: Touch Suspicious Service File
    reason: 'Adjacent service tampering: the hijacked agent runs as a systemd .service, so timestomping a .service unit on the same host hides the attacker''s edit to that unit (or a new persistence service dropped beside it) so the modified registration blends with legitimate files.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Parallel persistence: attackers back the SSM channel with a second foothold, and a crontab job dropped from /tmp on the same host is a common redundant persistence mechanism established alongside the hijacked agent in case the SSM registration is revoked.'
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Follow-on defense evasion: having turned the signed AWS binary into a RAT, the attacker stops EDR/iptables services so the commands they then push through the SSM channel are not inspected, so this firing shortly after the hijack is the next expected step.'
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Follow-on track-covering: the register command, including the attacker''s activation code and id, is typed at a shell and lands in ~/.bash_history; deleting the history file is the classic cleanup immediately after the hijack to erase the activation secrets.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SSM command-execution worker processes on this host (RAT in use)
    query: (data_process_exec_process_binary:/.*\/[Ss][Ss][Mm]-[Ss][Ee][Ss][Ss][Ii][Oo][Nn]-[Ww][Oo][Rr][Kk][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt]-[Ww][Oo][Rr][Kk][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Ss][Ss][Mm]-[Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt]-[Ww][Oo][Rr][Kk][Ee][Rr]/)
    pivot_on:
    - host
    window: 2h
  - name: Processes spawned through the SSM agent channel (attacker commands via SSM)
    query: (data_process_exec_parent_binary:/.*\/[Ss][Ss][Mm]-[Ss][Ee][Ss][Ss][Ii][Oo][Nn]-[Ww][Oo][Rr][Kk][Ee][Rr]/ OR data_process_exec_parent_binary:/.*\/[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt]-[Ww][Oo][Rr][Kk][Ee][Rr]/ OR data_process_exec_parent_binary:/.*\/[Aa][Mm][Aa][Zz][Oo][Nn]-[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt]/)
    pivot_on:
    - host
    window: 2h
  - name: Cloud instance metadata / IAM credential access (IMDS 169.254.169.254)
    query: data_process_exec_process_arguments:/.*169\.254\.169\.254.*/
    pivot_on:
    - host
    window: 4h
  - name: Service-manager control of the amazon-ssm-agent unit (apply/persist hijack)
    query: (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/) AND data_process_exec_process_arguments:/.*[Aa][Mm][Aa][Zz][Oo][Nn]-[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt].*/
    pivot_on:
    - host
    window: 2h
  - name: Access or tampering of the SSM registration/vault state directory
    query: (data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Ii][Bb]\/[Aa][Mm][Aa][Zz][Oo][Nn]\/[Ss][Ss][Mm].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Aa][Mm][Aa][Zz][Oo][Nn]\/[Ss][Ss][Mm].*/)
    pivot_on:
    - host
    window: 4h
