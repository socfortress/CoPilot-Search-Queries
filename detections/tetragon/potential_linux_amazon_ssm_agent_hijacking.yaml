name: Potential Linux Amazon SSM Agent Hijacking
id: f9b3edc5-3322-4fc7-8aa3-245d646cc4b7
version: 1
schema_version: "1.0"
date: "2023-08-03"
author: Muhammad Faisal
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f9b3edc5-3322-4fc7-8aa3-245d646cc4b7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential Amazon SSM agent hijack attempts as outlined in the Mitiga
  research report. MITRE ATT&CK: T1219.002.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/amazon-ssm-agent"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-register *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-code *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-id *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-region *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/amazon-ssm-agent';
  data_process_exec_process_arguments matches '*-register *';
  data_process_exec_process_arguments matches '*-code *', among other
  conditions.

known_false_positives: >
  Legitimate activity of system administrators. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.mitiga.io/blog/mitiga-security-advisory-abusing-the-ssm-agent-as-a-remote-access-trojan
  - https://www.bleepingcomputer.com/news/security/amazons-aws-ssm-agent-can-be-used-as-post-exploitation-rat-malware/
  - https://www.helpnetsecurity.com/2023/08/02/aws-instances-attackers-access/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Potential Linux Amazon SSM Agent Hijacking detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - amazon
    - agent
    - hijacking
    - linux
    - tetragon
    - process_creation
    - command_and_control
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Aa][Mm][Aa][Zz][Oo][Nn]-[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt]/ AND data_process_exec_process_arguments:/.*-[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr] .*/ AND data_process_exec_process_arguments:/.*-[Cc][Oo][Dd][Ee] .*/ AND data_process_exec_process_arguments:/.*-[Ii][Dd] .*/ AND data_process_exec_process_arguments:/.*-[Rr][Ee][Gg][Ii][Oo][Nn] .*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
      name: "Axios NPM Compromise Indicators - Linux"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Remote-access / RMM tooling on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ss][Ss][Hh]|\/[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|\/[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|\/[Nn][Gg][Rr][Oo][Kk])/'
      pivot_on: [host]
      window: 1h
    - name: "Other executions of this tool-set on this host (any arguments)"
      query: 'data_process_exec_process_binary:/.*(\/[Aa][Mm][Aa][Zz][Oo][Nn]-[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt])/'
      pivot_on: [host]
      window: 2h
    - name: "Outbound-transfer / upload tooling on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Tt][Ff][Tt][Pp])/) OR (data_process_exec_process_binary:/.*(\/[Ss][Cc][Pp]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Rr][Cc][Ll][Oo][Nn][Ee]|\/[Cc][Uu][Rr][Ll])/))'
      pivot_on: [host]
      window: 2h
    - name: "Shell / interpreter execution on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/) OR (data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/))'
      pivot_on: [host]
      window: 1h
