name: Authencesn Crypto Module Load via Modprobe - Copy-Fail Indicator
id: 474b415a-d917-4f3b-8c62-9e1a0d5f7b48
version: 1
schema_version: "1.0"
date: "2026-05-09"
author: Gene Kazimiarovich
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 474b415a-d917-4f3b-8c62-9e1a0d5f7b48
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects kernel auto-loading of the authencesn crypto module via modprobe This
  occurs when user-space code creates an AF_ALG socket and binds the authencesn
  AEAD cipher (e.g., authencesn(hmac(sha256),cbc(aes))). The kernel invokes
  modprobe to load the crypto module. This is a key indicator of CVE-2026-31431
  (Copy Fail) exploitation, where the authencesn cipher is used to trigger a
  buffer overflow in the AF_ALG AEAD splice path, corrupting the page cache of
  SUID binaries for local privilege escalation. On Linux systems, modprobe is
  typically a symlink to kmod, so the process image will be /usr/bin/kmod (or
  /bin/kmod) with 'modprobe' appearing in the command line. MITRE ATT&CK: T1068,
  T1547.006.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/kmod"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*modprobe*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*crypto-authencesn(*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/modprobe"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*crypto-authencesn(*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/kmod';
  data_process_exec_process_arguments matches '*modprobe*';
  data_process_exec_process_arguments matches '*crypto-authencesn(*', among
  other conditions.

known_false_positives: >
  Legitimate manual loading of the authencesn module by administrators for
  kernel crypto benchmarking or IPsec configuration (near-zero in production).
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.linkedin.com/posts/stamatis-chatzimangou_copyfail-kql-activity-7455582422215114752-S4RW/
  - https://www.splunk.com/en_us/blog/security/detecting-copy-fail-cve-2026-31431-phenomenal-power-itty-bitty-script.html
  - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
  - https://man7.org/linux/man-pages/man8/modprobe.8.html
  - https://www.kernel.org/doc/html/latest/crypto/userspace-if.html
  - https://attack.mitre.org/techniques/T1068/
  - https://attack.mitre.org/techniques/T1547/006/

response:
  message: >
    Authencesn Crypto Module Load via Modprobe - Copy-Fail Indicator detected on
    host $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1068, T1547.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1068
    - T1547.006
  custom_tags:
    - authencesn
    - crypto
    - module
    - linux
    - tetragon
    - process_creation
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_process_exec_process_binary:/.*\/[Kk][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee].*/ AND data_process_exec_process_arguments:/.*[Cc][Rr][Yy][Pp][Tt][Oo]-[Aa][Uu][Tt][Hh][Ee][Nn][Cc][Ee][Ss][Nn]\(.*/) OR (data_process_exec_process_binary:/.*\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]/ AND data_process_exec_process_arguments:/.*[Cc][Rr][Yy][Pp][Tt][Oo]-[Aa][Uu][Tt][Hh][Ee][Nn][Cc][Ee][Ss][Nn]\(.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Precursor: the Copy-Fail PoC is a C program that is first fetched to a world-writable dir (/tmp, /dev/shm) and run; this rule catches that staging of the local exploit on the target just before the authencesn trigger fires.'
  - id: 33b3cfb1-574e-44b9-b527-fbf9303b9d7b
    name: Potential Exploitation of CVE-2025-5054 or CVE-2025-4598
    reason: Sibling local-privesc that also abuses SUID binaries (dumping SUID-process memory via suid_dumpable) - a host where authencesn Copy-Fail fires is typically being probed for several SUID-binary root primitives in the same session.
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: Alternative local-root avenue (sudo -u#-1 bypass) that commonly co-occurs when an attacker with a foothold cycles through known Linux LPE exploits on the same host to win root.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    name: Linux Kernel Module Insertion
    reason: Shares the kernel-module-loading surface this rule watches (modprobe/kmod); and after Copy-Fail yields root, manual insmod of an LKM is the classic next step to install a rootkit for persistence.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Payoff: once Copy-Fail corrupts a SUID binary and grants root, copying /etc/passwd or /etc/shadow out of a /tmp staging path is the immediate credential-theft objective.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Follow-on recon: reading /etc/sudoers to enumerate the privilege map and confirm the root/elevated access just obtained through the exploit.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Follow-on persistence: cementing the newly-won root by adding a controlled account to the root or sudoers group via usermod.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process executing from a world-writable staging directory (dropped exploit)
    query: data_process_exec_process_binary:/.*\/([Tt][Mm][Pp]|[Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Vv][Aa][Rr]\/[Tt][Mm][Pp])\/.*/
    pivot_on:
    - host
    window: 2h
  - name: On-host compilation of a C exploit (AF_ALG Copy-Fail PoC is built locally)
    query: data_process_exec_process_binary:/.*\/([Cc][Cc]|[Gg][Cc][Cc]|[Cc][Ll][Aa][Nn][Gg]|[Gg]\+\+|[Mm][Aa][Kk][Ee]|[Tt][Cc][Cc])/
    pivot_on:
    - host
    window: 4h
  - name: SUID-root helper executed (the Copy-Fail page-cache corruption payoff)
    query: data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Mm][Oo][Uu][Nn][Tt]|[Uu][Mm][Oo][Uu][Nn][Tt]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Ss][Hh]|[Nn][Ee][Ww][Gg][Rr][Pp]|[Gg][Pp][Aa][Ss][Ss][Ww][Dd]|[Ff][Uu][Ss][Ee][Rr][Mm][Oo][Uu][Nn][Tt])/
    pivot_on:
    - host
    window: 1h
  - name: Credential-store access on this host (/etc/shadow, passwd, sudoers, gshadow)
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Anti-forensics after rooting: audit-rule flush, log deletion, history clearing'
    query: ((data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*-[Dd].*/) OR (data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/.*/ AND data_process_exec_process_binary:/.*\/([Rr][Mm]|[Ss][Hh][Rr][Ee][Dd]|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee])/) OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 4h
