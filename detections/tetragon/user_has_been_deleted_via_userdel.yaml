name: User Has Been Deleted Via Userdel
id: 08f26069-6f80-474b-8d1f-d971c6fedea0
version: 1
schema_version: "1.0"
date: "2022-12-26"
author: Tuan Le (NCSGroup)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 08f26069-6f80-474b-8d1f-d971c6fedea0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "userdel" binary. Which is used to delete a user
  account and related files. This is sometimes abused by threat actors in order
  to cover their tracks. MITRE ATT&CK: T1531.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/userdel"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/userdel'.

known_false_positives: >
  Legitimate administrator activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://linuxize.com/post/how-to-delete-group-in-linux/
  - https://www.cyberciti.biz/faq/linux-remove-user-command/
  - https://www.cybrary.it/blog/0p3n/linux-commands-used-attackers/
  - https://linux.die.net/man/8/userdel
  - https://attack.mitre.org/techniques/T1531/

response:
  message: >
    User Has Been Deleted Via Userdel detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1531
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1531
  custom_tags:
    - deleted
    - userdel
    - linux
    - tetragon
    - process_creation
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Dd][Ee][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8a46f16c-8c4c-82d1-b121-0fdd3ba70a84
    name: Group Has Been Deleted Via Groupdel
    reason: 'Twin command on the same host: userdel removes the account while groupdel removes its primary/created group. Run together they are the account-plus-group teardown that marks either a rogue-account cleanup or a destructive lock-out of legitimate users, so a groupdel in the window is the other half of this deletion.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: The account being deleted was most likely the one earlier granted root/sudoers membership; usermod -aG root/sudoers then userdel is the create-privilege-use-destroy lifecycle of a backdoor account, so a prior usermod on this host names the privileged account this userdel is now erasing.
  - id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
    name: Creation Of An User Account
    reason: userdel is the matching bookend to useradd/ADD_USER. An account created hours earlier and now deleted is the signature of a disposable rogue account used for the intrusion and removed afterward; this auditd detection tells you whether and when the deleted account was created on the same host.
  - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    name: Linux User Account Creation Detection
    reason: Same create-then-delete precursor, caught from Wazuh/syslog full_log (useradd/adduser) rather than auditd. On a host where auditd account events are absent this is the detection that reveals the rogue account's creation that this userdel is undoing.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: userdel's stated purpose here is covering tracks; wiping ~/.bash_history in the same root session erases the commands run as or against the deleted account, so a history deletion alongside this alert turns an isolated userdel into a deliberate anti-forensic cleanup rather than routine offboarding.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Clearing /var/log (and the /var/spool/mail spool that userdel -r also removes) is the companion evidence-destruction step; log removal on the same host in the window reframes the account deletion as post-compromise track-covering, not admin maintenance.
  - id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
    name: Syslog Clearing or Removal Via System Utilities
    reason: syslog carries the authpriv entries that useradd/userdel themselves emit; emptying /var/log/syslog in the same window destroys the very record of the account's creation and deletion, a targeted cover-tracks move that pairs directly with this userdel.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: auditctl -D wipes the audit ruleset that would have recorded the account change; deleting audit rules in the same window as the userdel is the blind-the-host step that confirms the deletion is deliberate evasion rather than benign administration.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Account and group management tooling on this host (full lifecycle around the deletion)
    query: data_process_exec_process_binary:/.*\/([Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Uu][Ss][Ee][Rr][Dd][Ee][Ll]|[Dd][Ee][Ll][Uu][Ss][Ee][Rr]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|[Gg][Rr][Oo][Uu][Pp][Mm][Oo][Dd]|[Gg][Rr][Oo][Uu][Pp][Dd][Ee][Ll]|[Gg][Pp][Aa][Ss][Ss][Ww][Dd]|[Aa][Dd][Dd][Gg][Rr][Oo][Uu][Pp]|[Dd][Ee][Ll][Gg][Rr][Oo][Uu][Pp]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Aa][Gg][Ee]|[Nn][Ee][Ww][Uu][Ss][Ee][Rr][Ss])/
    pivot_on:
    - host
    window: 6h
  - name: Direct edit or read of the account and credential databases on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/([Pp][Aa][Ss][Ss][Ww][Dd]|[Ss][Hh][Aa][Dd][Oo][Ww]|[Gg][Rr][Oo][Uu][Pp]|[Gg][Ss][Hh][Aa][Dd][Oo][Ww]|[Ss][Uu][Dd][Oo][Ee][Rr][Ss]).*/) OR (data_process_exec_process_binary:/.*\/([Vv][Ii][Pp][Ww]|[Vv][Ii][Gg][Rr])/)
    pivot_on:
    - host
    window: 4h
  - name: 'Anti-forensic cleanup accompanying the deletion: history, log and audit destruction on this host'
    query: ((data_process_exec_process_binary:/.*\/([Ss][Hh][Rr][Ee][Dd]|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee])/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*-[Dd].*/) OR (data_process_exec_process_binary:/.*\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Vv][Aa][Cc][Uu][Uu][Mm].*/) OR (data_process_exec_process_arguments:/.*(\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\.[Zz][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Removal of the deleted account's home directory, mail spool and cron on this host
    query: (data_process_exec_process_binary:/.*\/([Rr][Mm]|[Ss][Hh][Rr][Ee][Dd]|[Uu][Nn][Ll][Ii][Nn][Kk]|[Rr][Mm][Dd][Ii][Rr])/) AND (data_process_exec_process_arguments:/.*\/[Hh][Oo][Mm][Ee]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Mm][Aa][Ii][Ll].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Mm][Aa][Ii][Ll].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Privilege escalation to root preceding the account deletion on this host
    query: data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/
    pivot_on:
    - host
    window: 2h
