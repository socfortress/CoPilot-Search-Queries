status: experimental
type: TTP

description: >
  Detects known hacktool execution based on image name. MITRE ATT&CK: T1587.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/crackmapexec"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/havoc"
                    case_insensitive: true
              - wildcard:
