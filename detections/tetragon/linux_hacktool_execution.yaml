Uu][Ss][Tt][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Ff][Ff][Uu][Ff]/ OR data_process_exec_process_binary:/.*\/[Gg][Oo][Bb][Uu][Ss][Tt][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Ww][Ff][Uu][Zz][Zz]/ OR data_process_exec_process_binary:/.*\/[Ww][Hh][Aa][Tt][Ww][Ee][Bb]/ OR data_process_exec_process_binary:/.*\/[Jj][Oo][Oo][Mm][Ss][Cc][Aa][Nn]/ OR data_process_exec_process_binary:/.*\/[Nn][Ii][Kk][Tt][Oo]/ OR data_process_exec_process_binary:/.*\/[Ww][Pp][Ss][Cc][Aa][Nn]/ OR data_process_exec_process_binary:/.*\/[Aa][Ii][Rr][Cc][Rr][Aa][Cc][Kk]-[Nn][Gg]/ OR data_process_exec_process_binary:/.*\/[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]-[Pp][Yy][Tt][Hh][Oo][Nn]/ OR data_process_exec_process_binary:/.*\/[Bb][Pp][Ff][Dd][Oo][Ss]/ OR data_process_exec_process_binary:/.*\/[Ee][Bb][Pp][Ff][Kk][Ii]/ OR data_process_exec_process_binary:/.*\/[Ee][Vv][Ii][Ll]-[Ww][Ii][Nn][Rr][Mm]/ OR data_process_exec_process_binary:/.*\/[Hh][Aa][Ss][Hh][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Hh][Oo][Aa][Xx][Ss][Hh][Ee][Ll][Ll]\.[Pp][Yy]/ OR data_process_exec_process_binary:/.*\/[Hh][Yy][Dd][Rr][Aa]/ OR data_process_exec_process_binary:/.*\/[Jj][Oo][Hh][Nn]/ OR data_process_exec_process_binary:/.*\/[Nn][Cc][Rr][Aa][Cc][Kk]/ OR data_process_exec_process_binary:/.*\/[Nn][Xx][Cc]-[Uu][Bb][Uu][Nn][Tt][Uu]-[Ll][Aa][Tt][Ee][Ss][Tt]/ OR data_process_exec_process_binary:/.*\/[Pp][Ii][Dd][Hh][Ii][Dd][Ee]/ OR data_process_exec_process_binary:/.*\/[Pp][Ss][Pp][Yy]32/ OR data_process_exec_process_binary:/.*\/[Pp][Ss][Pp][Yy]32[Ss]/ OR data_process_exec_process_binary:/.*\/[Pp][Ss][Pp][Yy]64/ OR data_process_exec_process_binary:/.*\/[Pp][Ss][Pp][Yy]64[Ss]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Oo][Oo][Ll][Kk][Ii][Tt]/ OR data_process_exec_process_binary:/.*\/[Ss][Qq][Ll][Mm][Aa][Pp]/ OR data_process_exec_process_binary:/.*\/[Ww][Rr][Ii][Tt][Ee][Bb][Ll][Oo][Cc][Kk][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Ll][Ii][Nn][Pp][Ee][Aa][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Precursor/staging: most of these hacktools (linpeas, pspy, nuclei, Villain, hoaxshell) are not pre-installed — they are pulled with curl/wget into /tmp or /dev/shm and run immediately. A curl|sh stager on the same host just before the hacktool exec shows how the tooling arrived and that this is live tradecraft, not a resident binary.'
  - id: cfec9d29-64ec-4a0f-9ffe-0fdb856d5446
    name: Suspicious Git Clone - Linux
    reason: 'Precursor/staging: several tools in this rule ship as repos the operator git-clones onto the host (bloodhound-python, Villain.py, hoaxshell.py, Sn1per/sniper, merlin, ebpfkit). A git clone of an exploit/PoC repo on the same host preceding the hacktool run is the acquisition step of the same intrusion.'
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Foothold/precursor: when the entry point is a webshell, the operator runs recon and offensive tools as children of the web server (nginx/apache2/httpd/node). A webshell indicator on the same host places this hacktool execution in a post-exploitation-from-web-compromise chain and identifies the initial access vector.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Foothold/precursor: a netcat reverse shell is the hands-on-keyboard context an operator uses to then launch scanners, crackers and C2 implants. A reverse shell on the same host near the alert is the interactive session the hacktool was driven from.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Co-occurring same-phase activity: SUID (find -perm -4000) and credential-file (.htpasswd) discovery runs hand-in-hand with the privesc-enumeration and scanning tools in this rule (linpeas, pspy, nuclei, naabu). Recon indicators on the same host confirm an active discovery/privesc phase rather than an isolated binary name hit.'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Credential-access follow-on: the password crackers and AD-enumeration tools in this rule (hashcat, john, hydra, ncrack, bloodhound-python, crackmapexec, nxc, evil-winrm) are fed stolen credential material. Staging /etc/passwd or /etc/shadow out of /tmp on the same host is the matching credential-theft step that the cracking tooling exists to consume.'
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Defense-evasion follow-on: before or after running noisy tooling, operators stop the firewall/EDR (systemctl stop falcon-sensor, service iptables stop, setenforce 0). Security-tool tampering on the same host around the hacktool run shows the operator clearing the way for the tooling and is a strong escalation signal.'
  - id: 22236d75-d5a0-4287-bf06-c93b1770860f
    name: Triple Cross eBPF Rootkit Install Commands
    reason: 'Same-family rootkit follow-on: this rule already flags offensive eBPF tooling (bpfdos, ebpfki, pidhide). A Triple Cross eBPF rootkit install (sudo tc ... enp0s3 qdisc/filter) on the same host is the kernel-level persistence/hiding escalation of that exact eBPF offensive activity and turns a tool execution into a rootkit incident.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ingress tool transfer that staged the hacktool (wget/curl/scp/git around the alert)
    query: (data_process_exec_process_binary:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Ss][Cc][Pp]|[Tt][Ff][Tt][Pp])/ AND data_process_exec_process_arguments:/.*[Hh][Tt][Tt][Pp].*/) OR (data_process_exec_process_binary:/.*\/[Gg][Ii][Tt]/ AND data_process_exec_process_arguments:/.* [Cc][Ll][Oo][Nn][Ee] .*/) OR data_process_exec_process_arguments:/.*[Rr][Aa][Ww]\.[Gg][Ii][Tt][Hh][Uu][Bb][Uu][Ss][Ee][Rr][Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/
    pivot_on:
    - host
    window: 4h
  - name: Outbound connection / C2 / exfil tooling on this host
    query: (data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt]|[Nn][Ee][Tt][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/) OR (data_process_exec_process_binary:/.*\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]/ AND data_process_exec_process_arguments:/.*[Ss]_[Cc][Ll][Ii][Ee][Nn][Tt].*/) OR (data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*(--[Uu][Pp][Ll][Oo][Aa][Dd]|--[Dd][Aa][Tt][Aa]| -[Tt] | -[Ff] ).*/) OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/
    pivot_on:
    - host
    window: 2h
  - name: Privilege escalation attempts following enumeration (sudo/su/pkexec/setuid/GTFOBins)
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Dd][Oo][Aa][Ss])/) OR (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Ss][Ee][Tt][Cc][Aa][Pp])/ AND data_process_exec_process_arguments:/.*(\+[Ss]| 4[0-7][0-7][0-7]|[Cc][Aa][Pp]_).*/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.* -[Ee][Xx][Ee][Cc] .*/
    pivot_on:
    - host
    window: 4h
  - name: Credential material read on disk (shadow / SSH keys / sudoers / cloud secrets)
    query: data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww]|\/\.[Ss][Ss][Hh]\/|[Ii][Dd]_[Rr][Ss][Aa]|[Ii][Dd]_[Ee][Dd]25519|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|\/\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]|\/\.[Dd][Oo][Cc][Kk][Ee][Rr]\/[Cc][Oo][Nn][Ff][Ii][Gg]).*/
    pivot_on:
    - host
