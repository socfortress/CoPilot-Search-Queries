name: Shell Execution Of Process Located In Tmp Directory
id: 2fade0b6-7423-4835-9d4f-335b39b83867
version: 1
schema_version: "1.0"
date: "2023-06-02"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2fade0b6-7423-4835-9d4f-335b39b83867
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of shells from a parent process located in a temporary
  (/tmp) directory.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_parent_binary:
              value: "/tmp/*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bash"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/csh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/dash"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/fish"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ksh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/sh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/zsh"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '/tmp/*';
  data_process_exec_process_binary matches '*/bash';
  data_process_exec_process_binary matches '*/csh', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.jpcert.or.jp/en/2023/05/gobrat.html
  - https://jstnk9.github.io/jstnk9/research/GobRAT-Malware/
  - https://www.virustotal.com/gui/file/60bcd645450e4c846238cf0e7226dc40c84c96eba99f6b2cffcd0ab4a391c8b3/detection
  - https://www.virustotal.com/gui/file/3e44c807a25a56f4068b5b8186eee5002eed6f26d665a8b791c472ad154585d1/detection

response:
  message: >
    Shell Execution Of Process Located In Tmp Directory detected on host
    $agent_name$. Matched data_process_exec_parent_binary:
    $data_process_exec_parent_binary$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - shell
    - located
    - directory
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_parent_binary:/\/[Tt][Mm][Pp]\/.*/ AND (data_process_exec_process_binary:/.*\/[Bb][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Cc][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Dd][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ff][Ii][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Kk][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Zz][Ss][Hh]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'Same /tmp-execution event seen from the other side: this rule''s parent (the binary living under /tmp) is exactly what 312b42b1 flags when it first exec''d. If it fired on this host moments before, the shell''s parent IS the staged dropper - confirming the /tmp binary actually ran, not merely that a shell was spawned.'
  - id: 30bcce26-51c5-49f2-99c8-7b59e3af36c7
    name: Execution Of Script Located In Potentially Suspicious Directory
    reason: 'Same-family variant: 30bcce26 catches a shell (bash/sh -c) running a script out of /tmp, whereas this rule catches a /tmp binary parenting a shell. The shell spawned here frequently then runs a /tmp script, so co-firing stitches the dropper''s binary and script stages together on one host.'
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'Delivery precursor: wget -O into /tmp is the classic way the shell-spawning /tmp parent binary got onto the host. Seeing it shortly before confirms the /tmp process is downloaded ingress tooling (GobRAT-style, the shared references), not a local admin script.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Higher-confidence stager precursor: curl/wget writing into /tmp or /dev/shm then piping to ''sh -c''. If it co-fired, the /tmp parent spawning this shell is the executed stage of a multi-stage download-and-run dropper rather than a benign fetch.'
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: 'Arming precursor: chmod on a file under /tmp sets the execute bit so the just-dropped payload can run. A chmod of /tmp/<file> immediately preceding this is the step that made the shell-spawning /tmp binary executable (download -> arm -> run).'
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'Fileless-evasion sibling: /dev/shm is the RAM-backed tmpfs equivalent of /tmp. The same actor often re-stages the payload to /dev/shm to keep it off disk, so a /dev/shm execution on this host is the stealthier twin of this /tmp execution.'
  - id: e34cfa0c-0a50-4210-9cb3-5632d08eb041
    name: Potential GobRAT File Discovery Via Grep
    reason: 'Named-malware continuation: this detection''s own references are the GobRAT research, and GobRAT''s loader drops into /tmp and spawns shells. GobRAT-specific grep file-discovery (apached/frpc/sshd.sh/zone.arm) on the same host marks an active GobRAT infection and names the expected next stage.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Post-exploitation follow-on: the interactive shell this /tmp dropper spawned typically enumerates the host next. SUID hunting (find -perm -4000) and credential-file discovery are exactly what 0cf7a157 flags, corroborating hands-on-keyboard activity right after the drop.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Payload delivery and arming into staging dirs (wget/curl/tftp/ftp/scp or chmod against /tmp, /var/tmp, /dev/shm)
    query: (data_process_exec_process_binary:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Tt][Ff][Tt][Pp]|[Ff][Tt][Pp]|[Ss][Cc][Pp])/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Any process executing from a staging directory on this host (/tmp, /var/tmp, /dev/shm) as process or parent
    query: data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_parent_binary:/\/[Tt][Mm][Pp]\/.*/
    pivot_on:
    - host
    window: 2h
  - name: Reverse-shell / C2 channel indicators on this host (nc/ncat/netcat/socat/mkfifo, /dev/tcp, pty.spawn)
    query: (data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt]|[Nn][Ee][Tt][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt]|[Mm][Kk][Ff][Ii][Ff][Oo])/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR (data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Host and credential reconnaissance by the spawned shell on this host
    query: data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp])/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/([Pp][Aa][Ss][Ss][Ww][Dd]|[Ss][Hh][Aa][Dd][Oo][Ww])/
    pivot_on:
    - host
    window: 1h
  - name: Persistence establishment on this host (cron / systemd / rc.local / init.d / profile / authorized_keys)
    query: (data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Aa][Tt]|[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd].*/) OR (data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)
    pivot_on:
    - host
    window: 4h
