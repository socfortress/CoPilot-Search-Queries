name: Enable BPF Kprobes Tracing
id: 7692f583-bd30-4008-8615-75dab3f08a99
version: 1
schema_version: "1.0"
date: "2023-01-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7692f583-bd30-4008-8615-75dab3f08a99
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects common command used to enable bpf kprobes tracing.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_arguments:
              value: "*echo 1 >*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*/sys/kernel/debug/tracing/events/kprobes/*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/myprobe/enable*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/myretprobe/enable*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_arguments matches '*echo 1 >*';
  data_process_exec_process_arguments matches
  '*/sys/kernel/debug/tracing/events/kprobes/*';
  data_process_exec_process_arguments matches '*/myprobe/enable*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://embracethered.com/blog/posts/2021/offensive-bpf-bpftrace/
  - https://bpftrace.org/
  - https://www.kernel.org/doc/html/v5.0/trace/kprobetrace.html

response:
  message: >
    Enable BPF Kprobes Tracing detected on host $agent_name$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_arguments
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - enable
    - kprobes
    - tracing
    - linux
    - tetragon
    - process_creation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_arguments:/.*[Ee][Cc][Hh][Oo] 1 \>.*/ AND data_process_exec_process_arguments:/.*\/[Ss][Yy][Ss]\/[Kk][Ee][Rr][Nn][Ee][Ll]\/[Dd][Ee][Bb][Uu][Gg]\/[Tt][Rr][Aa][Cc][Ii][Nn][Gg]\/[Ee][Vv][Ee][Nn][Tt][Ss]\/[Kk][Pp][Rr][Oo][Bb][Ee][Ss]\/.*/ AND (data_process_exec_process_arguments:/.*\/[Mm][Yy][Pp][Rr][Oo][Bb][Ee]\/[Ee][Nn][Aa][Bb][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*\/[Mm][Yy][Rr][Ee][Tt][Pp][Rr][Oo][Bb][Ee]\/[Ee][Nn][Aa][Bb][Ll][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f8341cb2-ee25-43fa-a975-d8a5a9714b39
    name: BPFtrace Unsafe Option Usage
    reason: 'Tightest sibling: shares the identical offensive-BPF references (embracethered offensive-bpf-bpftrace, bpftrace.org). bpftrace --unsafe programs and arms kprobes; enabling the kprobe trace event is the same eBPF kernel-tracing workflow on the same host.'
  - id: 22236d75-d5a0-4287-bf06-c93b1770860f
    name: Triple Cross eBPF Rootkit Install Commands
    reason: Co-occurring install phase of an eBPF rootkit (deployer.sh tc/qdisc/filter). Enabling a kprobe trace event is a kernel-hook primitive the same eBPF-rootkit campaign sets up on the host.
  - id: 0326c3c8-7803-4a0f-8c5c-368f747f7c3e
    name: Triple Cross eBPF Rootkit Execve Hijack
    reason: Follow-on/co-occurring eBPF-rootkit privilege escalation (execve_hijack via sudo). Same eBPF kernel-subversion incident; confirms the actor is hooking the kernel, not benignly tracing.
  - id: 808146b2-9332-4d78-9416-d7e47012d83d
    name: BPFDoor Abnormal Process ID or Lock File Accessed
    reason: 'Same BPF-abuse/kernel-stealth family: BPFDoor is an eBPF backdoor. A host arming kprobe tracing may already run a BPF implant; a co-sighting strongly confirms malicious kernel-level BPF activity.'
  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    name: Linux Kernel Module Insertion
    reason: 'Precursor/co-occurring kernel manipulation: insmod loads an LKM. A root operator enabling kprobe tracing frequently also loads a kernel module (LKM rootkit or supporting driver) in the same session.'
  - id: f1e2d3c4-5b6a-7d8e-9f0a-1b2c3d4e5f6a
    name: Linux Kernel Module Load
    reason: Precursor/co-occurring kernel manipulation via modprobe/kmod dependency-resolved module load; part of the same kernel-tampering chain that underpins eBPF/kprobe stealth tooling.
  - id: 474b415a-d917-4f3b-8c62-9e1a0d5f7b48
    name: Authencesn Crypto Module Load via Modprobe - Copy-Fail Indicator
    reason: 'Plausible root-gaining precursor: CVE-2026-31431 (Copy-Fail) LPE grants the root privilege required to write debugfs and enable the kprobe trace event this rule detects.'
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Defense-evasion follow-on: a kernel-stealth actor operating via kprobes/eBPF typically blinds the userland sensor (stop/kill EDR, Tetragon, auditd) to hide the kernel hooks just installed.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: eBPF / kprobe / ftrace tooling and tracing-fs writes on this host
    query: ((data_process_exec_process_binary:/.*(\/[Bb][Pp][Ff][Tt][Rr][Aa][Cc][Ee]|\/[Bb][Pp][Ff][Tt][Oo][Oo][Ll]|\/[Pp][Ee][Rr][Ff]|\/[Tt][Rr][Aa][Cc][Ee]-[Cc][Mm][Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ss][Yy][Ss]\/[Kk][Ee][Rr][Nn][Ee][Ll]\/[Dd][Ee][Bb][Uu][Gg]\/[Tt][Rr][Aa][Cc][Ii][Nn][Gg].*/) OR (data_process_exec_process_arguments:/.*\/[Ss][Yy][Ss]\/[Kk][Ee][Rr][Nn][Ee][Ll]\/[Tt][Rr][Aa][Cc][Ii][Nn][Gg].*/) OR (data_process_exec_process_arguments:/.*[Kk][Pp][Rr][Oo][Bb][Ee]_[Ee][Vv][Ee][Nn][Tt][Ss].*/) OR (data_process_exec_process_arguments:/.*[Uu][Pp][Rr][Oo][Bb][Ee]_[Ee][Vv][Ee][Nn][Tt][Ss].*/) OR (data_process_exec_process_arguments:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt]_[Tt][Rr][Aa][Cc][Ee][Rr].*/))
    pivot_on:
    - host
    window: 4h
  - name: Kernel module load or unload on this host
    query: data_process_exec_process_binary:/.*(\/[Ii][Nn][Ss][Mm][Oo][Dd]|\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]|\/[Kk][Mm][Oo][Dd]|\/[Rr][Mm][Mm][Oo][Dd]|\/[Dd][Ee][Pp][Mm][Oo][Dd])/
    pivot_on:
    - host
    window: 4h
  - name: debugfs or tracefs mount on this host
    query: (data_process_exec_process_binary:/.*\/[Mm][Oo][Uu][Nn][Tt]/) AND (data_process_exec_process_arguments:/.*([Dd][Ee][Bb][Uu][Gg][Ff][Ss]|[Tt][Rr][Aa][Cc][Ee][Ff][Ss]|\/[Ss][Yy][Ss]\/[Kk][Ee][Rr][Nn][Ee][Ll]\/[Dd][Ee][Bb][Uu][Gg]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kernel trace-buffer read or credential-file access on this host
    query: ((data_process_exec_process_arguments:/.*[Tt][Rr][Aa][Cc][Ii][Nn][Gg]\/[Tt][Rr][Aa][Cc][Ee].*/) OR (data_process_exec_process_arguments:/.*[Tt][Rr][Aa][Cc][Ee]_[Pp][Ii][Pp][Ee].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/) OR (data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/))
    pivot_on:
    - host
    window: 4h
  - name: Security-sensor or kernel-protection tampering on this host
    query: ((data_process_exec_process_binary:/.*(\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]|\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]|\/[Aa][Aa]-[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|\/[Aa][Aa]-[Tt][Ee][Aa][Rr][Dd][Oo][Ww][Nn])/) OR (data_process_exec_process_arguments:/.*[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee] 0.*/) OR (data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]) .*([Ww][Aa][Zz][Uu][Hh]|[Ff][Aa][Ll][Cc][Oo][Nn]|[Tt][Ee][Tt][Rr][Aa][Gg][Oo][Nn]|[Aa][Uu][Dd][Ii][Tt][Dd]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Ss][Yy][Ss][Mm][Oo][Nn]|[Cc][Ll][Aa][Mm]).*/))
    pivot_on:
    - host
    window: 4h
