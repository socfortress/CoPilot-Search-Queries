name: Suspicious Container Exec Detection
id: 7a1d4c9e-3b2f-4e6a-8f2d-1c9e7f3b5a8c
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects suspicious execution of processes inside containers via runc exec
  or when shell binaries (/bin/sh, /bin/bash, /usr/bin/sh, /usr/bin/bash) are
  executed in Docker-managed processes. This may indicate container escape
  attempts or malicious activity inside containers.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            location: "/var/log/tetragon/tetragon.log"
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments: "*runc*exec*"
              - bool:
                  must:
                    - exists:
                        field: data_process_exec_process_docker
                    - bool:
                        should:
                          - term:
                              data_process_exec_process_binary: "/bin/sh"
                          - term:
                              data_process_exec_process_binary: "/bin/bash"
                          - term:
                              data_process_exec_process_binary: "/usr/bin/sh"
                          - term:
                              data_process_exec_process_binary: "/usr/bin/bash"
                        minimum_should_match: 1
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_docker
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents configured to log process execution
  details including Docker context and command-line arguments.

known_false_positives: >
  Legitimate container management commands, orchestration tasks, or system
  automation that execute shell processes inside containers.

references:
  - https://attack.mitre.org/techniques/T1611/
  - https://tetragon.io/docs/

response:
  message: >
    Suspicious container execution detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Container: $data_process_exec_process_docker$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Container Security
    - Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1611
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_arguments:/.*runc.*exec.*/ OR (_exists_:data_process_exec_process_docker AND (data_process_exec_process_binary:"/bin/sh" OR data_process_exec_process_binary:"/bin/bash" OR data_process_exec_process_binary:"/usr/bin/sh" OR data_process_exec_process_binary:"/usr/bin/bash"))) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: cbef820c-e1ff-407f-887f-0a9240a2d477
      name: "Detect Path Interception By Creation Of program exe"
      reason: "same analytic story: Privilege Escalation"
    - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
      name: "FodHelper UAC Bypass"
      reason: "same analytic story: Privilege Escalation"
    - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
      name: "Get-DomainGroup with PowerShell Script Block"
      reason: "same analytic story: Privilege Escalation"
    - id: 67740bd3-1506-469c-b91d-effc322cc6e5
      name: "Get-WmiObject Ds_Group with PowerShell Script Block"
      reason: "same analytic story: Privilege Escalation"
    - id: 59b51620-94c9-11ec-b3d5-acde48001122
      name: "Kerberos Pre-Authentication Flag Disabled with PowerShell"
      reason: "same analytic story: Privilege Escalation"
    - id: ea61e291-af05-4716-932a-67faddb6ae6f
      name: "PowerShell COM Hijacking InProcServer32 Modification"
      reason: "same analytic story: Privilege Escalation"
    - id: 8470d755-0c13-45b3-bd63-387a373c10cf
      name: "Reg exe Manipulating Windows Services Registry Keys"
      reason: "same analytic story: Privilege Escalation"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Shell / interpreter / networking tooling executed on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ OR data_audit_exe:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/)'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling executed on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ OR data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/)'
      pivot_on: [host]
      window: 2h
    - name: "Persistence via cron / systemd / shell profiles on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/ OR data_audit_exe:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)'
      pivot_on: [host]
      window: 4h
    - name: "Privilege-escalation tooling on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ OR data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/)'
      pivot_on: [host]
      window: 2h
