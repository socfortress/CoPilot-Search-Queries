name: ESXi VM Kill Via ESXCLI
id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
version: 1
schema_version: "1.0"
date: "2023-09-04"
author: Nasreddine Bencherchali (Nextron Systems), Cedric Maurugeon
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "esxcli" command with the "vm" and "kill" flag in
  order to kill/shutdown a specific VM. MITRE ATT&CK: T1059.012, T1529.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/esxcli"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*vm process*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*kill*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/esxcli';
  data_process_exec_process_arguments matches '*vm process*';
  data_process_exec_process_arguments matches '*kill*'.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.crowdstrike.com/blog/hypervisor-jackpotting-ecrime-actors-increase-targeting-of-esxi-servers/
  - https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_vm.html
  - https://www.secuinfra.com/en/techtalk/hide-your-hypervisor-analysis-of-esxiargs-ransomware/
  - https://www.trendmicro.com/en_us/research/22/e/new-linux-based-ransomware-cheerscrypt-targets-exsi-devices.html
  - https://attack.mitre.org/techniques/T1059/012/
  - https://attack.mitre.org/techniques/T1529/

response:
  message: >
    ESXi VM Kill Via ESXCLI detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1059.012, T1529
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.012
    - T1529
  custom_tags:
    - esxcli
    - linux
    - tetragon
    - process_creation
    - execution
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_process_exec_process_arguments:/.*[Kk][Ii][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5f1573a7-363b-4114-9208-ad7a61de46eb
    name: ESXi VM List Discovery Via ESXCLI
    reason: 'Direct precursor: ''esxcli vm process list'' enumerates running VMs and their World IDs, and ''esxcli vm process kill --world-id='' requires that World ID, so operators list immediately before they kill.'
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: 'Pre-encryption recon: enumerates datastores under /vmfs/volumes to locate the .vmdk/.vmx files; the VM is killed to release the locks on those same files so they can then be encrypted (DarkSide/LockBit ESXi playbook).'
  - id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
    name: ESXi VSAN Information Discovery Via ESXCLI
    reason: Pre-encryption recon of vSAN-backed storage to find the VM disk objects to encrypt after the kill releases their locks; same DarkSide ESXi sequence as the storage discovery above.
  - id: 38eb1dbb-011f-40b1-a126-cf03a0210563
    name: ESXi Syslog Configuration Change Via ESXCLI
    reason: 'Defense evasion in the same session: ''esxcli system syslog config set'' redirects or disables ESXi logging to blind the SOC just before the destructive VM kill and encryption.'
  - id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
    name: ESXi Account Creation Via ESXCLI
    reason: 'Backdoor persistence on the compromised hypervisor: ''esxcli system account add'' creates a rogue local account during the same intrusion that runs the kill, so recovery cannot simply lock the attacker out.'
  - id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
    name: ESXi Admin Permission Assigned To Account Via ESXCLI
    reason: 'Completes the backdoor: ''esxcli system permission set'' grants the attacker-created account Admin on the ESXi host; co-occurs with the account creation and the VM kill in the same hands-on session.'
  - id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
    name: ESXi System Information Discovery Via ESXCLI
    reason: Arrival recon on the hypervisor (version, accounts, modules, NTP) via 'esxcli system ... get/list' that precedes the kill and encryption in the ESXi ransomware chain.
  - id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
    name: ESXi Network Configuration Discovery Via ESXCLI
    reason: Host recon of the ESXi network configuration via 'esxcli network ... get/list' during the same operator session, mapping the hypervisor before impact.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: vim-cmd VM lifecycle operations (non-esxcli kill/enumerate path)
    query: data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/
    pivot_on:
    - host
    window: 2h
  - name: ESXi datastore / VMDK / VMX file targeting
    query: (data_process_exec_process_arguments:/.*\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Vv][Mm][Dd][Kk].*/ OR data_process_exec_process_arguments:/.*\.[Vv][Mm][Xx].*/)
    pivot_on:
    - host
    window: 4h
  - name: Binary executed from datastore or tmp path (potential encryptor)
    query: data_process_exec_process_binary:/.*(\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss]\/|\/[Tt][Mm][Pp]\/|\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/).*/
    pivot_on:
    - host
    window: 2h
  - name: File encryption tooling (openssl enc / gpg) on this host
    query: (data_process_exec_process_binary:/.*\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]/ AND data_process_exec_process_arguments:/.*[Ee][Nn][Cc].*/) OR data_process_exec_process_binary:/.*\/[Gg][Pp][Gg]/
    pivot_on:
    - host
    window: 4h
  - name: Interactive shell spawned from SSH (hands-on-keyboard session)
    query: data_process_exec_parent_binary:/.*\/([Ss][Ss][Hh][Dd]|[Dd][Rr][Oo][Pp][Bb][Ee][Aa][Rr])/
    pivot_on:
    - host
    window: 6h
