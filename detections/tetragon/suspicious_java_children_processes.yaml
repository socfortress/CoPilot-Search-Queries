name: Suspicious Java Children Processes
id: d292e0af-9a18-420c-9525-ec0ac3936892
version: 1
schema_version: "1.0"
date: "2022-06-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d292e0af-9a18-420c-9525-ec0ac3936892
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects java process spawning suspicious children. MITRE ATT&CK: T1059.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_parent_binary:
              value: "*/java"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*dash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ksh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*zsh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*csh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*fish*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*curl*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*wget*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*python*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/java';
  data_process_exec_process_arguments matches '*/bin/sh*';
  data_process_exec_process_arguments matches '*bash*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.tecmint.com/different-types-of-linux-shells/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Suspicious Java Children Processes detected on host $agent_name$. Matched
    data_process_exec_parent_binary: $data_process_exec_parent_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - children
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_parent_binary:/.*\/[Jj][Aa][Vv][Aa]/ AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Zz][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Cc][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Ff][Ii][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Cc][Uu][Rr][Ll].*/ OR data_process_exec_process_arguments:/.*[Ww][Gg][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*[Pp][Yy][Tt][Hh][Oo][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7fb14105-530e-4e2e-8cfb-99f7d8700b66
    name: Atlassian Confluence CVE-2022-26134
    reason: 'Specialization of this exact detection scoped to Confluence''s /opt/atlassian/confluence install path: the same java parent spawning /bin/sh, curl, wget or python. If the exploited Java service is Confluence, both fire on the same process_exec event — this names the precursor exploit (OGNL injection RCE).'
  - id: f8987c03-4290-4c96-870f-55e75ee377f4
    name: CVE-2023-22518 Exploitation Attempt - Suspicious Confluence Child Process (Linux)
    reason: 'Second Confluence RCE with the identical shape: java parent whose arguments contain ''confluence'' spawning bash/curl/wget/echo children. Confirms the generic java-spawns-shell alert is a specific Confluence exploitation attempt and pins down the precursor CVE.'
  - id: 69dea60b-2deb-4c9e-a685-ad542f4367f9
    name: Suspicious Child Process of SAP NetWeaver - Linux
    reason: 'Product-specific sibling: the SAP NetWeaver J2EE (Java) servlet stack spawning shells, interpreters or netcat. Same causal pattern as this rule (web-facing Java app server executing OS commands); identifies the exploited application when the host runs SAP.'
  - id: c8a5f584-cdc8-42cc-8cce-0398e4265de3
    name: Apache Spark Shell Command Injection - ProcessCreation
    reason: Spark is a JVM service; its command-injection chain is java -> bash -> 'id -Gn'. This rule catches the java->bash hop while that rule catches the Spark-specific id reconnaissance one process later, so the two fire back-to-back on the same host confirming Spark RCE.
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: Detects a Java app server (Tomcat/WebSphere via java parent args) spawning recon binaries — a webshell dropped on the Java application is the delivery vector that makes java spawn shells. Frequently co-occurs on the same host/event and explains HOW the Java process gained command execution.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Immediate follow-on: the shell this Java process spawned pulls a second-stage payload into /tmp or /dev/shm and executes it. This rule already flags curl/wget as a Java child argument; that rule catches the download+run that typically happens seconds later.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Follow-on escalation: after blind command execution via the Java service, the attacker upgrades to an interactive foothold with ''nc -e <shell>''. A reverse shell on the same host minutes after this alert is strong evidence the RCE succeeded and is now hands-on-keyboard.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'Terminal objective: internet-facing Java RCE (Log4Shell, Confluence) is the single most common entry point for commodity miners (Kinsing, XMRig). A crypto-mining process on the same host after this alert marks the intrusion''s payload stage.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Second-stage download or fileless execution from world-writable dirs on this host
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ OR data_process_exec_process_binary:/\/([Tt][Mm][Pp]|[Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Vv][Aa][Rr]\/[Tt][Mm][Pp])\/.*/)
    pivot_on:
    - host
    window: 1h
  - name: Reverse shell / interactive C2 foothold on this host
    query: (data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/ OR data_process_exec_process_arguments:/.*(\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]|[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn]|[Bb][Aa][Ss][Hh] -[Ii]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Post-exploitation host and network reconnaissance burst on this host
    query: data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Ii][Pp]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Aa][Rr][Pp]|\/[Ll][Aa][Ss][Tt]|\/[Ww])/
    pivot_on:
    - host
    window: 1h
  - name: Persistence via cron / systemd / SSH keys / shell profiles on this host
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Aa][Tt]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll])/ OR data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|\.[Bb][Aa][Ss][Hh][Rr][Cc]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Crypto-miner / resource-hijack payload on this host
    query: (data_process_exec_process_binary:/.*(\/[Xx][Mm][Rr][Ii][Gg]|\/[Mm][Ii][Nn][Ee][Rr][Dd])/ OR data_process_exec_process_arguments:/.*([Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Tt][Cc][Pp]|--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll]|[Xx][Mm][Rr][Ii][Gg]|[Cc][Rr][Yy][Pp][Tt][Oo][Nn][Ii][Gg][Hh][Tt]).*/)
    pivot_on:
    - host
    window: 6h
