name: Shell Execution GCC  - Linux
id: 9b5de532-a757-4d70-946c-1f3e44f48b4d
version: 1
schema_version: "1.0"
date: "2024-09-02"
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9b5de532-a757-4d70-946c-1f3e44f48b4d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the "gcc" utility to execute a shell. Such behavior may be
  associated with privilege escalation, unauthorized command execution, or to
  break out from restricted environments. MITRE ATT&CK: T1083.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/c89"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/c99"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/gcc"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-wrapper*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/bash,-s*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/dash,-s*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/fish,-s*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/sh,-s*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/zsh,-s*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/c89';
  data_process_exec_process_binary matches '*/c99';
  data_process_exec_process_binary matches '*/gcc', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/gcc/#shell
  - https://gtfobins.github.io/gtfobins/c89/#shell
  - https://gtfobins.github.io/gtfobins/c99/#shell
  - https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
  - https://attack.mitre.org/techniques/T1083/

response:
  message: >
    Shell Execution GCC - Linux detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1083
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1083
  custom_tags:
    - shell
    - linux
    - tetragon
    - process_creation
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Cc]89/ OR data_process_exec_process_binary:/.*\/[Cc]99/ OR data_process_exec_process_binary:/.*\/[Gg][Cc][Cc]/) AND data_process_exec_process_arguments:/.*-[Ww][Rr][Aa][Pp][Pp][Ee][Rr].*/ AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh],-[Ss].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh],-[Ss].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ff][Ii][Ss][Hh],-[Ss].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh],-[Ss].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh],-[Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-c89-privilege-escalation-001
    name: Linux c89 Privilege Escalation
    reason: Detects the identical '-wrapper' shell-spawn abuse on c89 - one of the exact compiler front-ends this GCC rule already matches. A breakout operator cycles gcc/c89/c99, so a c89 privesc hit on the same host is the same technique captured from the sudo/auditd angle.
  - id: linux-c99-privilege-escalation-001
    name: Linux c99 Privilege Escalation
    reason: Same '-wrapper /bin/sh,-s' breakout on the c99 front-end, which this rule's binary set also matches. Co-firing with the GCC alert on one host confirms the attacker is enumerating the compiler-family GTFOBins escalation rather than running one tool once.
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Reading /etc/sudoers (or 'sudo -l') is the reconnaissance that reveals gcc/c89/c99 is sudo-allowed - the precursor that selects this breakout. Seeing it on the host shortly before the GCC alert establishes that the shell escape was deliberate privilege escalation.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The gcc '-wrapper' trick is a GTFOBins *sudo* abuse; a correlated sudo/su execution on the same host is the privilege vehicle the breakout rides to turn a restricted shell into a root shell.
  - id: linux-make-privilege-escalation-001
    name: Linux Make Privilege Escalation
    reason: make --eval is the adjacent build-toolchain GTFOBins sudo escalation. An operator who found gcc available on a developer/build host will commonly also try make, so a co-firing make privesc widens this into a toolchain-abuse incident on the same box.
  - id: 6adfbf8f-52be-4444-9bac-81b539624146
    name: Shell Execution via Find - Linux
    reason: The same restricted-environment-breakout technique via a different living-off-the-land binary (find -exec /bin/sh). GTFOBins operators try several utilities in one session, so a find breakout on the same host marks the same hands-on-keyboard escape attempt.
  - id: bed978f8-7f3a-432b-82c5-9286a9b3031a
    name: Shell Invocation via Env Command - Linux
    reason: Another core GTFOBins utility->/bin/sh breakout. Co-firing with the GCC breakout on one host is strong evidence of systematic restricted-shell escape - the operator working down the GTFOBins list - not an isolated event.
  - id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
    name: Potential Discovery Activity Using Find - Linux
    reason: Once the GCC breakout yields an interactive shell, host and file discovery via find is the typical immediate follow-on - the first post-escape enumeration step, confirming the shell was used and showing where the operator looked next.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Compiler / wrapper-style shell breakout invocations on this host
    query: data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/([Bb][Aa][Ss][Hh]|[Dd][Aa][Ss][Hh]|[Ff][Ii][Ss][Hh]|[Ss][Hh]|[Zz][Ss][Hh]),-[Ss].*/ OR data_process_exec_process_arguments:/.*-[Ww][Rr][Aa][Pp][Pp][Ee][Rr].*/
    pivot_on:
    - host
    window: 2h
  - name: Known GTFOBins utilities spawning an interactive shell on this host
    query: (data_process_exec_process_binary:/.*\/([Ff][Ii][Nn][Dd]|[Aa][Ww][Kk]|[Gg][Aa][Ww][Kk]|[Vv][Ii][Mm]|[Nn][Ii][Cc][Ee]|[Ee][Nn][Vv]|[Cc][Aa][Pp][Ss][Hh]|[Ff][Ll][Oo][Cc][Kk]|[Gg][Ii][Tt]|[Rr][Ss][Yy][Nn][Cc]|[Mm][Aa][Kk][Ee]|[Gg][Dd][Bb])/) AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/([Bb][Aa][Ss][Hh]|[Dd][Aa][Ss][Hh]|[Ff][Ii][Ss][Hh]|[Ss][Hh]|[Zz][Ss][Hh]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Sudo or doas launching a compiler, make, or shell on this host
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Dd][Oo][Aa][Ss])/) AND (data_process_exec_process_arguments:/.*([Gg][Cc][Cc]|[Cc]89|[Cc]99|[Mm][Aa][Kk][Ee]|-[Ww][Rr][Aa][Pp][Pp][Ee][Rr]|\/[Bb][Ii][Nn]\/[A-Za-z]*[Ss][Hh]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Sudo-rights and SUID / capabilities reconnaissance on this host
    query: data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*-[Ll].*/) OR (data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm].*/) OR data_process_exec_process_binary:/.*\/[Gg][Ee][Tt][Cc][Aa][Pp]/
    pivot_on:
    - host
    window: 4h
  - name: Credential and secret file access on this host
    query: data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/([Ss][Hh][Aa][Dd][Oo][Ww]|[Gg][Ss][Hh][Aa][Dd][Oo][Ww]).*/ OR data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/
    pivot_on:
    - host
    window: 2h
