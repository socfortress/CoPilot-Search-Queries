name: UFW Disable Attempt
id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
version: 1
schema_version: "1.0"
date: "2026-05-04"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to disable the Uncomplicated Firewall (UFW) on Linux systems.
  UFW is a popular firewall management tool that provides an easy-to-use
  interface for configuring firewall rules. Disabling UFW can leave a system
  vulnerable to attacks, as it may allow unauthorized access to network services
  and resources. MITRE ATT&CK: T1686.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/ufw-init"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* force-stop*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* stop*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* flush*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*ufw *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*disable*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/ufw-init';
  data_process_exec_process_arguments matches '* force-stop*';
  data_process_exec_process_arguments matches '* stop*', among other conditions.

known_false_positives: >
  Legitimate actions by system administrators to disable UFW. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/Joseliyo_Jstnk/status/1620131033474822144
  - https://manpages.debian.org/unstable/ufw/ufw-framework.8.en.html
  - https://www.cyberciti.biz/faq/linux-disable-firewall-command/
  - https://attack.mitre.org/techniques/T1686/

response:
  message: >
    UFW Disable Attempt detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1686
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1686
  custom_tags:
    - disable
    - linux
    - tetragon
    - process_creation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_process_exec_process_binary:/.*\/[Uu][Ff][Ww]-[Ii][Nn][Ii][Tt]/ AND (data_process_exec_process_arguments:/.* [Ff][Oo][Rr][Cc][Ee]-[Ss][Tt][Oo][Pp].*/ OR data_process_exec_process_arguments:/.* [Ss][Tt][Oo][Pp].*/ OR data_process_exec_process_arguments:/.* [Ff][Ll][Uu][Ss][Hh].*/)) OR (data_process_exec_process_arguments:/.*[Uu][Ff][Ww] .*/ AND data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: 'Low-level sibling of this disable: `ufw disable` already tears down the ufw-* chains, and the same actor typically also runs `iptables -F`/`-X`/`-Z` to flush netfilter directly. Disable-then-flush on one host is a single, deliberate firewall takedown, not an admin tweak.'
  - id: 323ff3f5-0013-4847-bbd4-250b5edb62cc
    name: Modify System Firewall
    reason: Firewall-rule removal seen by a second sensor (auditd syscalls vs Tetragon exec). It is purpose-built to catch rule deletion that disable-only detections like this one miss, so it corroborates deliberate firewall manipulation via iptables/nft paths UFW does not cover.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: Disabling UFW is one move inside the broader defense-impairment burst this catches (stop the iptables service, `systemctl disable firewalld`, `setenforce 0`, kill falcon-sensor). Both firing on the host shows the firewall-off was evasion, not maintenance.
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Generic `systemctl/service stop|disable` of any unit. The same hands-on-keyboard session that turns off UFW usually stops other security/logging daemons too, extending the teardown this firewall disable starts.
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Direct payoff of the now-open firewall: with UFW''s inbound/outbound filtering gone, an `nc -e <shell>` reverse/bind shell establishes the C2 channel the disable cleared the path for.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Expected follow-on once egress is unblocked: curl/wget pulls the next-stage payload into /tmp or /dev/shm and runs it - the tool staging the firewall disable enables.'
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: 'The logging counterpart of the firewall disable: `auditctl -D` wipes all audit rules to blind auditd in the same go-dark phase. Firewall-off plus audit-off together leave the host unfiltered and unmonitored.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Cover-tracks follow-on: once defenses are down, the operator wipes /var/log via rm/shred/unlink to erase evidence of the intrusion and of the disable command itself.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other firewall / packet-filter control executed on this host
    query: data_process_exec_process_binary:/.*(\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]|\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]|\/[Nn][Ff][Tt]|\/[Uu][Ff][Ww]|\/[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]-[Cc][Mm][Dd]|\/[Xx][Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii])/
    pivot_on:
    - host
    window: 2h
  - name: Security controls / EDR / SELinux-AppArmor being disabled on this host
    query: ((data_process_exec_process_binary:/.*(\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]|\/[Aa][Aa]-[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|\/[Aa][Aa]-[Tt][Ee][Aa][Rr][Dd][Oo][Ww][Nn]|\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll])/) OR (data_process_exec_process_binary:/.*(\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee])/ AND data_process_exec_process_arguments:/.*([Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Dd]|[Aa][Uu][Dd][Ii][Tt][Dd]|[Ff][Aa][Ll][Cc][Oo][Nn]-[Ss][Ee][Nn][Ss][Oo][Rr]|[Ww][Aa][Zz][Uu][Hh]|[Cc][Ll][Aa][Mm][Aa][Vv]|[Aa][Pp][Pp][Aa][Rr][Mm][Oo][Rr])/))
    pivot_on:
    - host
    window: 2h
  - name: C2 / reverse-shell / payload-staging tooling on this host
    query: ((data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/) OR (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR (data_process_exec_process_arguments:/.*([Ss][Oo][Cc][Kk][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt]|[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn])/))
    pivot_on:
    - host
    window: 2h
  - name: Log / audit / shell-history wiping on this host
    query: ((data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\/[Uu][Nn][Ll][Ii][Nn][Kk])/ AND data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy])/) OR (data_process_exec_process_binary:/.*\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*(--[Vv][Aa][Cc][Uu][Uu][Mm]|--[Rr][Oo][Tt][Aa][Tt][Ee])/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.* -[Dd].*/))
    pivot_on:
    - host
    window: 4h
  - name: Root acquisition preceding the disable (sudo/su/pkexec/doas) on this host
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu]|\/[Ss][Uu][Dd][Oo]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/
    pivot_on:
    - host
    window: 1h
