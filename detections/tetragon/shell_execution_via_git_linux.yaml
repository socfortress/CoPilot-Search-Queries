name: Shell Execution via Git - Linux
id: 47b3bbd4-1bf7-48cc-84ab-995362aaa75a
version: 1
schema_version: "1.0"
date: "2024-09-02"
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 47b3bbd4-1bf7-48cc-84ab-995362aaa75a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the "git" utility to execute a shell. Such behavior may be
  associated with privilege escalation, unauthorized command execution, or to
  break out from restricted environments. MITRE ATT&CK: T1059.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_parent_binary:
              value: "*/git"
              case_insensitive: true
        - wildcard:
            data_process_exec_parent_arguments:
              value: "* -p *"
              case_insensitive: true
        - wildcard:
            data_process_exec_parent_arguments:
              value: "*help*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*bash 0<&1*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*dash 0<&1*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*sh 0<&1*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_parent_arguments
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/git';
  data_process_exec_parent_arguments matches '* -p *';
  data_process_exec_parent_arguments matches '*help*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/git/#shell
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Shell Execution via Git - Linux detected on host $agent_name$. Matched
    data_process_exec_parent_binary: $data_process_exec_parent_binary$. Matched
    data_process_exec_parent_arguments: $data_process_exec_parent_arguments$.
    MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_parent_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - shell
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_parent_binary:/.*\/[Gg][Ii][Tt]/ AND data_process_exec_parent_arguments:/.* -[Pp] .*/ AND data_process_exec_parent_arguments:/.*[Hh][Ee][Ll][Pp].*/ AND (data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh] 0\<\&1.*/ OR data_process_exec_process_arguments:/.*[Dd][Aa][Ss][Hh] 0\<\&1.*/ OR data_process_exec_process_arguments:/.*[Ss][Hh] 0\<\&1.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Precursor: before abusing git an operator reads /etc/sudoers (or runs sudo -l) to find which binaries are sudo-permitted. Discovering git is allowed is the exact prerequisite that turns ''sudo git -p help -> !sh'' into a root shell, so a sudoers read on this host shortly before the breakout establishes intent and whether root was the goal.'
  - id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
    name: Vim GTFOBin Abuse - Linux
    reason: Same GTFOBins technique family - abusing a permitted/benign binary to spawn an interactive shell and break out of a restricted shell or escalate via sudo. An operator probing LOLBin escapes rarely tries just one; a vim shell-escape on the same host is the nearest-neighbour alternative to the git breakout seen here.
  - id: 6adfbf8f-52be-4444-9bac-81b539624146
    name: Shell Execution via Find - Linux
    reason: '''sudo find . -exec /bin/sh \;'' is the single most common sudo-GTFOBins shell breakout; attackers fall back across LOLBins until one is permitted, so an analyst who sees the git escape should immediately check whether find was also used to reach a (root) shell on the same host.'
  - id: 8c1a5675-cb85-452f-a298-b01b22a51856
    name: Suspicious Invocation of Shell via AWK - Linux
    reason: awk's system()/BEGIN shell invocation is another top-tier sudo and restricted-shell GTFOBins breakout; co-occurring awk-to-shell on the same host is the same behaviour as this rule - using an allowed utility to obtain a shell - and signals the attacker is systematically enumerating which binary yields one.
  - id: bed978f8-7f3a-432b-82c5-9286a9b3031a
    name: Shell Invocation via Env Command - Linux
    reason: '''env /bin/sh'' is a canonical rbash / restricted-shell bypass and sudo breakout. The same actor escaping via git would plausibly also try env, so a parallel env-to-shell on this host expands the single git alert into a broader shell-breakout attempt.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: 'Direct follow-on: the ''bash/sh/dash 0<&1'' this rule catches IS the interactive shell, which then becomes a parent to uncommon children. This detection fires on what the breakout shell does next, so it is the clearest confirmation the spawned shell was actually used hands-on-keyboard rather than abandoned.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Follow-on: the first thing an operator does after a successful shell breakout is enumerate the host and their new privileges (whoami/id/uname/sudo -l). Recon indicators on the same host within the window turn the breakout into a confirmed active, hands-on-keyboard intrusion.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Follow-on persistence: when the breakout was via ''sudo git'' the attacker now holds root, and a classic next step is ''usermod -aG sudo <user>'' to keep privileged access. Usermod adding an account to root/sudoers on this host after the breakout signals the intrusion moving from escalation to entrenchment.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sudo / privilege-escalation context around the git breakout on this host
    query: (data_process_exec_parent_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/)
    pivot_on:
    - host
    window: 1h
  - name: Other GTFOBins/LOLBin shell breakouts on this host (interactive fd-redirect, or git/find/vim/awk/env/nice/flock/rsync/capsh spawning a shell)
    query: (data_process_exec_process_arguments:/.*0\<\&1.*/ OR data_process_exec_process_arguments:/.*0\>\&1.*/ OR (data_process_exec_parent_binary:/.*(\/[Gg][Ii][Tt]|\/[Ff][Ii][Nn][Dd]|\/[Vv][Ii][Mm]|\/[Aa][Ww][Kk]|\/[Ee][Nn][Vv]|\/[Nn][Ii][Cc][Ee]|\/[Ff][Ll][Oo][Cc][Kk]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Cc][Aa][Pp][Ss][Hh])/ AND data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh])/))
    pivot_on:
    - host
    window: 2h
  - name: Host and privilege reconnaissance after the breakout on this host
    query: (data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Gg][Rr][Oo][Uu][Pp][Ss]|\/[Ss][Uu][Dd][Oo])/ OR data_process_exec_process_arguments:/.*[Ss][Uu][Dd][Oo] -[Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: Credential and SSH-key access with the new shell on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/[Ii][Dd]_.*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Persistence and privileged-account changes after the breakout on this host
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr])/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/)
    pivot_on:
    - host
    window: 6h
