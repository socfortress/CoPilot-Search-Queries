name: ESXi System Information Discovery Via ESXCLI
id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
version: 1
schema_version: "1.0"
date: "2023-09-04"
author: Cedric Maurugeon
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "esxcli" command with the "system" flag in order to
  retrieve information about the different component of the system. Such as
  accounts, modules, NTP, etc. MITRE ATT&CK: T1033, T1007, T1059.012.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/esxcli"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*system*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* get*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* list*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/esxcli';
  data_process_exec_process_arguments matches '*system*';
  data_process_exec_process_arguments matches '* get*', among other conditions.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.crowdstrike.com/blog/hypervisor-jackpotting-ecrime-actors-increase-targeting-of-esxi-servers/
  - https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_system.html
  - https://attack.mitre.org/techniques/T1033/
  - https://attack.mitre.org/techniques/T1007/
  - https://attack.mitre.org/techniques/T1059/012/

response:
  message: >
    ESXi System Information Discovery Via ESXCLI detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1033, T1007, T1059.012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
    - T1007
    - T1059.012
  custom_tags:
    - system
    - information
    - esxcli
    - linux
    - tetragon
    - process_creation
    - discovery
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND (data_process_exec_process_arguments:/.* [Gg][Ee][Tt].*/ OR data_process_exec_process_arguments:/.* [Ll][Ii][Ss][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
    name: ESXi VM Kill Via ESXCLI
    reason: 'The impact precursor and highest-value escalation after this recon: once the operator has profiled the host they run `esxcli vm process kill` to power off running VMs, releasing the file locks on the .vmdk/.vmx files so the datastore can be encrypted. Recon on this host followed by VM-kill is the ESXi ransomware chain in progress.'
  - id: 5f1573a7-363b-4114-9208-ad7a61de46eb
    name: ESXi VM List Discovery Via ESXCLI
    reason: 'Co-occurring reconnaissance in the same burst: `esxcli vm` enumerates the installed/running VMs, which is the list of targets the attacker will power off and encrypt. System-info and VM-list discovery are routinely chained back-to-back when profiling a hypervisor.'
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: Co-occurring reconnaissance that locates the datastores (the /vmfs/volumes holding the VMDKs to encrypt); this detection's own rule notes it is seen used by DarkSide and LockBit. Finding the storage is the step that turns host recon into an encryption target list.
  - id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
    name: ESXi Network Configuration Discovery Via ESXCLI
    reason: 'Co-occurring reconnaissance in the same profiling sweep: `esxcli network` maps the management network and interfaces, used to understand the host and plan lateral movement to vCenter/other ESXi hosts. Fires on the same host/session as system-info discovery.'
  - id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
    name: ESXi Account Creation Via ESXCLI
    reason: 'Persistence follow-on using the same `esxcli system` namespace: after enumerating existing accounts with system discovery, the attacker runs `esxcli system account add` to plant a backdoor local account on the host. Recon of accounts then creation of one is a direct causal sequence.'
  - id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
    name: ESXi Admin Permission Assigned To Account Via ESXCLI
    reason: 'Privilege-escalation follow-on paired with account creation: `esxcli system permission set` grants Admin to the account the attacker just planted, giving full control of the hypervisor. Same `system` namespace as this discovery and the next step in establishing durable admin access.'
  - id: 38eb1dbb-011f-40b1-a126-cf03a0210563
    name: ESXi Syslog Configuration Change Via ESXCLI
    reason: 'Defense-evasion / anti-forensics follow-on in the same `esxcli system` namespace: `esxcli system syslog config set` redirects or disables log forwarding so the imminent VM-kill and encryption are not shipped off-host. Operators tamper with logging after recon and before impact.'
  - id: 8737b7f6-8df3-4bb7-b1da-06019b99b687
    name: Shell Invocation Via Ssh - Linux
    reason: 'Likely precursor that delivers the interactive session issuing these esxcli commands: ssh used to spawn/break out to an unrestricted shell (ProxyCommand/LocalCommand/localhost tricks) is how an operator escapes the restricted ESXi/DCUI shell. Seeing this on the host just before the esxcli recon explains how the attacker got hands-on access.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Broader ESXi esxcli reconnaissance burst on this host
    query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND (data_process_exec_process_arguments:/.*[Vv][Mm] .*/ OR data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/ OR data_process_exec_process_arguments:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk].*/ OR data_process_exec_process_arguments:/.*[Vv][Ss][Aa][Nn].*/ OR data_process_exec_process_arguments:/.*[Hh][Aa][Rr][Dd][Ww][Aa][Rr][Ee].*/ OR data_process_exec_process_arguments:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: ESXi VM power-off / kill (impact precursor) on this host
    query: (data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_process_exec_process_arguments:/.*[Kk][Ii][Ll][Ll].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*[Pp][Oo][Ww][Ee][Rr]\.[Oo][Ff][Ff].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*[Pp][Oo][Ww][Ee][Rr]\.[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: ESXi persistence / privilege / logging / firewall tampering via esxcli on this host
    query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND (data_process_exec_process_arguments:/.*[Aa][Cc][Cc][Oo][Uu][Nn][Tt] [Aa][Dd][Dd].*/ OR data_process_exec_process_arguments:/.*[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/)
    pivot_on:
    - host
    window: 6h
  - name: Interactive shell / SSH session context on this host
    query: data_process_exec_process_binary:/.*(\/[Ss][Ss][Hh][Dd]|\/[Ss][Ss][Hh]|\/[Dd][Rr][Oo][Pp][Bb][Ee][Aa][Rr]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx]|\/[Aa][Ss][Hh]|\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh])/
    pivot_on:
    - host
    window: 1h
  - name: ESXi datastore access / encryptor staging on this host
    query: (data_process_exec_process_arguments:/.*\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss]\/.*/) OR (data_process_exec_process_binary:/.*\/[Tt][Mm][Pp]\/.*/) OR (data_process_exec_process_binary:/.*\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]/ AND data_process_exec_process_arguments:/.*[Ee][Nn][Cc].*/)
    pivot_on:
    - host
    window: 6h
