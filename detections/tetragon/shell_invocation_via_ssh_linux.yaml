name: Shell Invocation Via Ssh - Linux
id: 8737b7f6-8df3-4bb7-b1da-06019b99b687
version: 1
schema_version: "1.0"
date: "2024-08-29"
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8737b7f6-8df3-4bb7-b1da-06019b99b687
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the "ssh" utility to execute a shell. Such behavior may be
  associated with privilege escalation, unauthorized command execution, or to
  break out from restricted environments. MITRE ATT&CK: T1059.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/ssh"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ProxyCommand=;*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*permitlocalcommand=yes*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*localhost*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/dash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/fish*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/zsh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*sh 0<&2 1>&2*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*sh 1>&2 0<&2*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/ssh';
  data_process_exec_process_arguments matches '*ProxyCommand=;*';
  data_process_exec_process_arguments matches '*permitlocalcommand=yes*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/ssh/
  - https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Shell Invocation Via Ssh - Linux detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - shell
    - invocation
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ss][Ss][Hh]/ AND (data_process_exec_process_arguments:/.*[Pp][Rr][Oo][Xx][Yy][Cc][Oo][Mm][Mm][Aa][Nn][Dd]=;.*/ OR data_process_exec_process_arguments:/.*[Pp][Ee][Rr][Mm][Ii][Tt][Ll][Oo][Cc][Aa][Ll][Cc][Oo][Mm][Mm][Aa][Nn][Dd]=[Yy][Ee][Ss].*/ OR data_process_exec_process_arguments:/.*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt].*/) AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ff][Ii][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Ss][Hh] 0\<\&2 1\>\&2.*/ OR data_process_exec_process_arguments:/.*[Ss][Hh] 1\>\&2 0\<\&2.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
    name: Vim GTFOBin Abuse - Linux
    reason: The canonical restricted-shell escape (vi/vim with :!/bin/sh). An actor reaching for the ssh ProxyCommand=;sh / LocalCommand=/bin/sh breakout is working through the GTFOBins catalogue to escape rbash or a locked-down SSH/bastion session; a vim breakout on the same host is the same technique with a different binary and confirms this is a deliberate escape, not a benign ssh call.
  - id: db1ac3be-f606-4e3a-89e0-9607cbe6b98a
    name: Capsh Shell Invocation - Linux
    reason: Sibling restricted-shell-breakout GTFOBin that also drops into a full/root shell (capsh --). Co-firing with the ssh breakout on one host shows the actor cycling through GTFOBins escapes, and capsh's SUID/capability path hints they are already pursuing the root escalation the ssh breakout is itself meant to enable.
  - id: 8c1a5675-cb85-452f-a298-b01b22a51856
    name: Suspicious Invocation of Shell via AWK - Linux
    reason: Interpreter-style GTFOBin breakout (awk BEGIN{system("/bin/sh")}). Like the ssh ProxyCommand trick it spawns a shell from an unexpected binary to dodge command-line allowlists; the two co-occurring on one host point to systematic restricted-shell escape attempts in a single session rather than legitimate text processing.
  - id: 6adfbf8f-52be-4444-9bac-81b539624146
    name: Shell Execution via Find - Linux
    reason: 'Doubly relevant: find -exec /bin/sh is a sibling breakout, and find -perm -4000 is the exact command used to enumerate abusable SUID binaries before choosing an escape. Whether it fires before (hunting a target) or alongside (a second escape) the ssh breakout, it strengthens the deliberate-breakout hypothesis.'
  - id: c4042d54-110d-45dd-a0e1-05c47822c937
    name: Python Spawning Pretty TTY Via PTY Module
    reason: Immediate follow-on. The ssh ProxyCommand=;sh 0<&2 1>&2 escape yields a raw, non-interactive shell over the ssh channel; the textbook next move is upgrading it to a real interactive TTY with python -c 'import pty; pty.spawn("/bin/bash")'. Seeing this seconds after the ssh breakout confirms a live human operator settling into the shell.
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: Follow-on. Once the ssh breakout (and any pty upgrade) lands an interactive bash -i, this flags that shell launching recon/reverse-shell/encoding children (whoami, nc, pty.spawn, base64) - i.e. what the attacker actually does with the shell the ssh escape just handed them.
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Precursor and post-breakout privilege-escalation recon. find -perm -4000 hunts SUID binaries - both the step that reveals which LOLBin to abuse for an escape/escalation and one of the first things an actor runs once the ssh breakout gives them a shell. Its presence around the ssh event explains the motive and shows the escalation chain progressing.
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Privilege-escalation enumeration, the breakout's objective. Reading /etc/sudoers lists which users and binaries carry sudo rights; an actor who just escaped into a shell via ssh does this to plan the root escalation the breakout was performed to reach.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other GTFOBins restricted-shell breakouts spawning a shell on this host
    query: (data_process_exec_process_binary:/.*(\/[Ff][Ii][Nn][Dd]|\/[Ee][Nn][Vv]|\/[Aa][Ww][Kk]|\/[Gg][Aa][Ww][Kk]|\/[Mm][Aa][Ww][Kk]|\/[Nn][Aa][Ww][Kk]|\/[Vv][Ii]|\/[Vv][Ii][Mm]|\/[Rr][Vv][Ii][Mm]|\/[Vv][Ii][Mm][Dd][Ii][Ff][Ff]|\/[Cc][Aa][Pp][Ss][Hh]|\/[Nn][Ii][Cc][Ee]|\/[Ff][Ll][Oo][Cc][Kk]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Gg][Ii][Tt]|\/[Tt][Aa][Rr])/ AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ff][Ii][Ss][Hh].*/))
    pivot_on:
    - host
    window: 2h
  - name: ssh client breakout-option abuse on this host (ProxyCommand / LocalCommand), any destination
    query: data_process_exec_process_binary:/.*\/[Ss][Ss][Hh]/ AND (data_process_exec_process_arguments:/.*[Pp][Rr][Oo][Xx][Yy][Cc][Oo][Mm][Mm][Aa][Nn][Dd]=.*/ OR data_process_exec_process_arguments:/.*[Pp][Ee][Rr][Mm][Ii][Tt][Ll][Oo][Cc][Aa][Ll][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_process_exec_process_arguments:/.*[Ll][Oo][Cc][Aa][Ll][Cc][Oo][Mm][Mm][Aa][Nn][Dd]=.*/)
    pivot_on:
    - host
    window: 2h
  - name: PTY upgrade and reverse-shell tooling on this host
    query: ((data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/) OR (data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/) OR (data_process_exec_process_arguments:/.*[Ii][Mm][Pp][Oo][Rr][Tt] [Pp][Tt][Yy].*/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp].*/) OR (data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh] -[Ii].*/))
    pivot_on:
    - host
    window: 1h
  - name: Privilege-escalation tooling and SUID/capability discovery on this host
    query: ((data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp]|\/[Gg][Ee][Tt][Cc][Aa][Pp]|\/[Cc][Hh][Ss][Hh]|\/[Nn][Ee][Ww][Gg][Rr][Pp])/) OR (data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -4000.*/) OR (data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -[Uu]=[Ss].*/))
    pivot_on:
    - host
    window: 4h
  - name: SSH-key and credential file access on this host
    query: ((data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Ee][Dd]25519.*/) OR (data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/) OR (data_process_exec_process_arguments:/.*[Kk][Nn][Oo][Ww][Nn]_[Hh][Oo][Ss][Tt][Ss].*/))
    pivot_on:
    - host
    window: 2h
