name: Copy Passwd Or Shadow From TMP Path
id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
version: 1
schema_version: "1.0"
date: "2023-01-31"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the file "passwd" or "shadow" is copied from tmp path. MITRE
  ATT&CK: T1552.001.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/cp"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*/tmp/*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*passwd*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*shadow*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/cp';
  data_process_exec_process_arguments matches '*/tmp/*';
  data_process_exec_process_arguments matches '*passwd*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.blackberry.com/
  - https://twitter.com/Joseliyo_Jstnk/status/1620131033474822144
  - https://attack.mitre.org/techniques/T1552/001/

response:
  message: >
    Copy Passwd Or Shadow From TMP Path detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1552.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.001
  custom_tags:
    - passwd
    - shadow
    - linux
    - tetragon
    - process_creation
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Cc][Pp]/ AND data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ AND (data_process_exec_process_arguments:/.*[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: find -perm -4000 (SUID hunting) and .htpasswd discovery are the privilege-escalation and credential-file reconnaissance that typically precede copying /etc/shadow - the operator locating a root path and secrets before harvesting the hashes.
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: Reading /etc/shadow requires root; a sudo -u#-1 escalation on the same host immediately before this fires explains how the operator gained the privilege needed to copy the shadow file.
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Reading /etc/sudoers is the same sensitive-auth-file harvesting as copying /etc/shadow; attackers map privilege paths from sudoers while grabbing the password hashes, so both commonly appear on one host in one session.
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: This alert stages a credential file into /tmp; a binary later executing out of /tmp points to the same working directory being used to drop and run tooling (cracker, packer, exploit) alongside the staged hashes.
  - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
    name: Suspicious Curl File Upload - Linux
    reason: The natural next step after staging /etc/shadow in /tmp is exfiltration - curl --upload-file/--form/--data to a remote host carries the copied hashes off the box for offline cracking.
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: Alternate exfiltration path for the staged hashes - wget --post-file= uploads the copied shadow/passwd file to attacker infrastructure, the same follow-on exfil step via a different tool.
  - id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
    name: Potential Suspicious Change To Sensitive/Critical Files
    reason: Credential theft and account persistence go together - editing /bin/passwd, /etc/sudoers or cron on the same host is the attacker tampering with the same auth surface to keep access after harvesting the hashes.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Post-operation cleanup - wiping .bash_history/.zsh_history on the same host erases the cp, read and exfil commands used to steal the shadow/passwd file.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Password database / sudoers access on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: SSH keys and cloud credential harvest on this host
    query: (data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Ee][Cc][Dd][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Ee][Dd]25519.*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Nn][Ee][Tt][Rr][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: Archive / compression staging of harvested files on this host
    query: data_process_exec_process_binary:/.*(\/[Tt][Aa][Rr]|\/[Gg][Zz][Ii][Pp]|\/[Bb][Zz][Ii][Pp]2|\/[Xx][Zz]|\/[Zz][Ii][Pp]|\/7[Zz]|\/7[Zz][Aa]|\/7[Zz][Rr]|\/[Zz][Ss][Tt][Dd])/
    pivot_on:
    - host
    window: 2h
  - name: Exfiltration / transfer tooling on this host
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Tt][Ff][Tt][Pp]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Rr][Ss][Yy][Nn][Cc])/) OR (data_process_exec_process_binary:/.*\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]/ AND data_process_exec_process_arguments:/.*[Ss]_[Cc][Ll][Ii][Ee][Nn][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Privilege escalation tooling on this host
    query: (data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Dd][Oo][Aa][Ss]|\/[Pp][Kk][Ee][Xx][Ee][Cc])/ OR data_process_exec_process_arguments:/.* -[Uu]\#.*/)
    pivot_on:
    - host
    window: 2h
