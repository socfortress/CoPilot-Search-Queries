name: Potential Suspicious Change To Sensitive/Critical Files
id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
version: 1
schema_version: "1.0"
date: "2026-03-18"
author: "@d4ns4n_ (Wuerth-Phoenix)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes of sensitive and critical files. Monitors files that you don't
  expect to change without planning on Linux system. These files include, but
  are not limited to, system configuration files, authentication files, and
  critical application files. Attackers often target these files to maintain
  persistence, escalate privileges, or disrupt system operations. MITRE ATT&CK:
  T1565.001.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/cat"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/echo"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/grep"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/head"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/more"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/tail"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_process_exec_process_arguments: "*>*"
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/emacs"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/nano"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/sed"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/vi"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/vim"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/login*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/passwd*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/boot/*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/*.conf*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/cron.*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/crontab*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/hosts*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/init.d*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/sudoers*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/opt/bin/*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/sbin*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/usr/bin/*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/usr/local/bin/*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_process_exec_process_binary"
        - exists:
            field: "data_process_exec_process_arguments"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/bin/sed"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "sed -i /^*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "sed -ne s/^*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*/etc/mdadm/mdadm.conf"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/cat';
  data_process_exec_process_binary matches '*/echo';
  data_process_exec_process_binary matches '*/grep', among other conditions.

known_false_positives: >
  Some false positives are to be expected on user or administrator machines.
  Apply additional filters as needed. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/azure/defender-for-cloud/file-integrity-monitoring-overview#which-files-should-i-monitor
  - https://attack.mitre.org/techniques/T1565/001/

response:
  message: >
    Potential Suspicious Change To Sensitive/Critical Files detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1565.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1565.001
  custom_tags:
    - change
    - sensitive
    - critical
    - linux
    - tetragon
    - process_creation
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_process_exec_process_binary:/.*\/[Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ee][Cc][Hh][Oo]/ OR data_process_exec_process_binary:/.*\/[Gg][Rr][Ee][Pp]/ OR data_process_exec_process_binary:/.*\/[Hh][Ee][Aa][Dd]/ OR data_process_exec_process_binary:/.*\/[Mm][Oo][Rr][Ee]/ OR data_process_exec_process_binary:/.*\/[Tt][Aa][Ii][Ll]/) AND data_process_exec_process_arguments:/.*\>.*/) OR data_process_exec_process_binary:/.*\/[Ee][Mm][Aa][Cc][Ss]/ OR data_process_exec_process_binary:/.*\/[Nn][Aa][Nn][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]/) AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ll][Oo][Gg][Ii][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Oo][Oo][Tt]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/.*\.[Cc][Oo][Nn][Ff].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]\..*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Hh][Oo][Ss][Tt][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Oo][Pp][Tt]\/[Bb][Ii][Nn]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ss][Bb][Ii][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Uu][Ss][Rr]\/[Bb][Ii][Nn]\/.*/ OR data_process_exec_process_arguments:/.*\/[Uu][Ss][Rr]\/[Ll][Oo][Cc][Aa][Ll]\/[Bb][Ii][Nn]\/.*/) AND _exists_:data_process_exec_process_binary AND _exists_:data_process_exec_process_arguments AND NOT (data_process_exec_process_binary:/.*\/[Bb][Ii][Nn]\/[Ss][Ee][Dd]/ AND (data_process_exec_process_arguments:/[Ss][Ee][Dd] -[Ii] \/\^.*/ OR data_process_exec_process_arguments:/[Ss][Ee][Dd] -[Nn][Ee] [Ss]\/\^.*/) AND data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Mm][Dd][Aa][Dd][Mm]\/[Mm][Dd][Aa][Dd][Mm]\.[Cc][Oo][Nn][Ff]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 34979410-e4b5-4e5d-8cfb-389fdff05c12
    name: Remove Immutable File Attribute
    reason: 'Immediate precursor: hardened files like /etc/passwd and /etc/sudoers are often protected with chattr +i, so an attacker runs ''chattr -i'' to unlock the file right before the editor write this rule catches. Both firing on one host minutes apart proves a deliberate defeat-of-protection edit.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Read-before-write precursor on the same /etc/sudoers target: enumerating who holds sudo rights typically precedes tampering with the sudoers file. If this fired first, the subsequent sudoers edit is targeted privilege escalation, not admin maintenance.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Alternate route to the same end as a sudoers edit: granting an account root/sudo via ''usermod -aG''. Seeing both on one host means the attacker is escalating privilege through more than one mechanism.'
  - id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
    name: Creation Of An User Account
    reason: 'Follow-on to tampering with the /bin/passwd and /bin/login targets this rule watches: after altering authentication files the attacker provisions a backdoor account (useradd/adduser) for persistent access.'
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: 'Same cron-persistence intent via a channel this rule misses: ''crontab -e'' edits the per-user spool rather than /etc/cron* or /etc/crontab, so the editor-vs-/etc path match never triggers. Confirms scheduled-task persistence on the host.'
  - id: 31545105-3444-4584-bebf-c466353230d2
    name: Touch Suspicious Service File
    reason: 'Systemd analogue of the /etc/init.d edits this rule flags: creating and timestomping a *.service unit is the modern persistence path. Co-occurring service-file activity expands an init.d edit into a full persistence install plus anti-forensics.'
  - id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
    name: Modification of ld.so.preload
    reason: 'Same behaviour class on a sensitive /etc file this rule cannot see: /etc/ld.so.preload has no .conf extension and is absent from the path list, yet editing it injects a shared object into every process. Complementary coverage of ''edit a sensitive /etc file for persistence''.'
  - id: a94cdd87-6c54-4678-a6cc-2814ffe5a13d
    name: Unix Shell Configuration Modification
    reason: 'Same config-edit-for-persistence behaviour aimed at files outside this rule''s path list (/etc/profile, /etc/profile.d, /etc/shells, shell rc files): a command is planted to run on every new shell. Confirms the host is being seeded with login-triggered persistence.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Immutable-attribute removal or ownership/permission change on sensitive paths
    query: ((data_process_exec_process_binary:/.*\/[Cc][Hh][Aa][Tt][Tt][Rr]/) OR ((data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Oo][Ww][Nn]/) AND (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ss][Bb][Ii][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Uu][Ss][Rr]\/[Bb][Ii][Nn]\/.*/ OR data_process_exec_process_arguments:/.*\/[Bb][Oo][Oo][Tt]\/.*/)))
    pivot_on:
    - host
    window: 2h
  - name: Any process writing to persistence-critical locations (cron/systemd/init.d/rc.local/ld.so.preload)
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Read or copy of credential files (/etc/shadow, /etc/passwd, /etc/sudoers)
    query: ((data_process_exec_process_binary:/.*\/[Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ll][Ee][Ss][Ss]/ OR data_process_exec_process_binary:/.*\/[Cc][Pp]/ OR data_process_exec_process_binary:/.*\/[Gg][Rr][Ee][Pp]/ OR data_process_exec_process_binary:/.*\/[Aa][Ww][Kk]/) AND (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Account and privilege manipulation (useradd/usermod/groupadd/passwd/visudo)
    query: (data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]/ OR data_process_exec_process_binary:/.*\/[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Pp][Aa][Ss][Ss][Ww][Dd]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Ss][Uu][Dd][Oo]/)
    pivot_on:
    - host
    window: 4h
  - name: Persistence activation (crontab/systemctl/service/at/systemd-run)
    query: (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ OR data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_process_exec_process_binary:/.*\/[Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]-[Rr][Uu][Nn]/)
    pivot_on:
    - host
    window: 2h
