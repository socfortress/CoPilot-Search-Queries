name: Potential Suspicious Change To Sensitive/Critical Files
id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
version: 1
schema_version: "1.0"
date: "2026-03-18"
author: "@d4ns4n_ (Wuerth-Phoenix)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes of sensitive and critical files. Monitors files that you don't
  expect to change without planning on Linux system. These files include, but
  are not limited to, system configuration files, authentication files, and
  critical application files. Attackers often target these files to maintain
  persistence, escalate privileges, or disrupt system operations. MITRE ATT&CK:
  T1565.001.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/cat"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/echo"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/grep"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/head"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/more"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/tail"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_process_exec_process_arguments: "*>*"
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/emacs"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/nano"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/sed"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/vi"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/vim"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/login*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/passwd*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/boot/*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/*.conf*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/cron.*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/crontab*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/hosts*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/init.d*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/etc/sudoers*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/opt/bin/*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/sbin*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/usr/bin/*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/usr/local/bin/*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_process_exec_process_binary"
        - exists:
            field: "data_process_exec_process_arguments"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/bin/sed"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "sed -i /^*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "sed -ne s/^*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*/etc/mdadm/mdadm.conf"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/cat';
  data_process_exec_process_binary matches '*/echo';
  data_process_exec_process_binary matches '*/grep', among other conditions.

known_false_positives: >
  Some false positives are to be expected on user or administrator machines.
  Apply additional filters as needed. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/azure/defender-for-cloud/file-integrity-monitoring-overview#which-files-should-i-monitor
  - https://attack.mitre.org/techniques/T1565/001/

response:
  message: >
    Potential Suspicious Change To Sensitive/Critical Files detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1565.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1565.001
  custom_tags:
    - change
    - sensitive
    - critical
    - linux
    - tetragon
    - process_creation
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_process_exec_process_binary:/.*\/[Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ee][Cc][Hh][Oo]/ OR data_process_exec_process_binary:/.*\/[Gg][Rr][Ee][Pp]/ OR data_process_exec_process_binary:/.*\/[Hh][Ee][Aa][Dd]/ OR data_process_exec_process_binary:/.*\/[Mm][Oo][Rr][Ee]/ OR data_process_exec_process_binary:/.*\/[Tt][Aa][Ii][Ll]/) AND data_process_exec_process_arguments:/.*\>.*/) OR data_process_exec_process_binary:/.*\/[Ee][Mm][Aa][Cc][Ss]/ OR data_process_exec_process_binary:/.*\/[Nn][Aa][Nn][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]/) AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ll][Oo][Gg][Ii][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Oo][Oo][Tt]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/.*\.[Cc][Oo][Nn][Ff].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]\..*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Hh][Oo][Ss][Tt][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Oo][Pp][Tt]\/[Bb][Ii][Nn]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ss][Bb][Ii][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Uu][Ss][Rr]\/[Bb][Ii][Nn]\/.*/ OR data_process_exec_process_arguments:/.*\/[Uu][Ss][Rr]\/[Ll][Oo][Cc][Aa][Ll]\/[Bb][Ii][Nn]\/.*/) AND _exists_:data_process_exec_process_binary AND _exists_:data_process_exec_process_arguments AND NOT (data_process_exec_process_binary:/.*\/[Bb][Ii][Nn]\/[Ss][Ee][Dd]/ AND (data_process_exec_process_arguments:/[Ss][Ee][Dd] -[Ii] \/\^.*/ OR data_process_exec_process_arguments:/[Ss][Ee][Dd] -[Nn][Ee] [Ss]\/\^.*/) AND data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Mm][Dd][Aa][Dd][Mm]\/[Mm][Dd][Aa][Dd][Mm]\.[Cc][Oo][Nn][Ff]/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
      name: "Disable Or Stop Services"
      reason: "next kill-chain tactic: Impact"
    - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
      name: "ESXi VM Kill Via ESXCLI"
      reason: "next kill-chain tactic: Impact"
    - id: 8a46f16c-8c4c-82d1-b121-0fdd3ba70a84
      name: "Group Has Been Deleted Via Groupdel"
      reason: "next kill-chain tactic: Impact"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Other executions of this tool-set on this host (any arguments)"
      query: 'data_process_exec_process_binary:/.*(\/[Vv][Ii][Mm])/'
      pivot_on: [host]
      window: 2h
    - name: "Shell / interpreter execution on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/) OR (data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/))'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
    - name: "Destructive tooling on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Dd][Dd]|\/[Mm][Kk][Ff][Ss]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Cc][Rr][Yy][Pp][Tt][Ss][Ee][Tt][Uu][Pp])/) OR (data_process_exec_process_arguments:/.*[Rr][Mm] -[Rr][Ff].*/) OR (data_process_exec_process_arguments:/.*--[Nn][Oo]-[Pp][Rr][Ee][Ss][Ee][Rr][Vv][Ee]-[Rr][Oo][Oo][Tt].*/))'
      pivot_on: [host]
      window: 2h
