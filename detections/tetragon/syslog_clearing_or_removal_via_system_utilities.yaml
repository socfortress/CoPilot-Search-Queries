name: Syslog Clearing or Removal Via System Utilities
id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
version: 1
schema_version: "1.0"
date: "2025-10-15"
author: Max Altgelt (Nextron Systems), Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific commands commonly used to remove or empty the syslog. Which
  is a technique often used by attacker as a method to hide their tracks. MITRE
  ATT&CK: T1685.006.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*/var/log/syslog*"
                          case_insensitive: true
                    - bool:
                        should:
                          - bool:
                              must:
                                - wildcard:
                                    data_process_exec_process_binary:
                                      value: "*/rm"
                                      case_insensitive: true
                                - bool:
                                    should:
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "* -r *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "* -f *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "* -rf *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "*/var/log/syslog*"
                                            case_insensitive: true
                                    minimum_should_match: 1
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/unlink"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/mv"
                                case_insensitive: true
                          - bool:
                              must:
                                - wildcard:
                                    data_process_exec_process_binary:
                                      value: "*/truncate"
                                      case_insensitive: true
                                - wildcard:
                                    data_process_exec_process_arguments: "*0 *"
                                - wildcard:
                                    data_process_exec_process_arguments:
                                      value: "*/var/log/syslog*"
                                      case_insensitive: true
                                - bool:
                                    should:
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "*-s *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "*-c *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "*--size*"
                                            case_insensitive: true
                                    minimum_should_match: 1
                          - bool:
                              must:
                                - wildcard:
                                    data_process_exec_process_binary:
                                      value: "*/ln"
                                      case_insensitive: true
                                - wildcard:
                                    data_process_exec_process_arguments:
                                      value: "*/dev/null *"
                                      case_insensitive: true
                                - wildcard:
                                    data_process_exec_process_arguments:
                                      value: "*/var/log/syslog*"
                                      case_insensitive: true
                                - bool:
                                    should:
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "*-sf *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "*-sfn *"
                                            case_insensitive: true
                                      - wildcard:
                                          data_process_exec_process_arguments:
                                            value: "*-sfT *"
                                            case_insensitive: true
                                    minimum_should_match: 1
                          - bool:
                              must:
                                - wildcard:
                                    data_process_exec_process_binary:
                                      value: "*/cp"
                                      case_insensitive: true
                                - wildcard:
                                    data_process_exec_process_arguments:
                                      value: "*/dev/null*"
                                      case_insensitive: true
                          - bool:
                              must:
                                - wildcard:
                                    data_process_exec_process_binary:
                                      value: "*/shred"
                                      case_insensitive: true
                                - wildcard:
                                    data_process_exec_process_arguments:
                                      value: "*-u *"
                                      case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* > /var/log/syslog*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* >/var/log/syslog*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* >| /var/log/syslog*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*: > /var/log/syslog*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*:> /var/log/syslog*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*:>/var/log/syslog*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*>|/var/log/syslog*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*journalctl --vacuum*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*journalctl --rotate*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_arguments matches '*/var/log/syslog*';
  data_process_exec_process_binary matches '*/rm';
  data_process_exec_process_arguments matches '* -r *', among other conditions.

known_false_positives: >
  Log rotation.. Maintenance. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
  - https://www.virustotal.com/gui/file/54d60fd58d7fa3475fa123985bfc1594df26da25c1f5fbc7dfdba15876dd8ac5/behavior
  - https://attack.mitre.org/techniques/T1685/006/

response:
  message: >
    Syslog Clearing or Removal Via System Utilities detected on host
    $agent_name$. Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$. MITRE
    ATT&CK: T1685.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_arguments
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.006
  custom_tags:
    - syslog
    - clearing
    - removal
    - linux
    - tetragon
    - process_creation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: "((data_process_exec_process_arguments:/.*\\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ AND ((data_process_exec_process_binary:/.*\\/[Rr][Mm]/ AND (data_process_exec_process_arguments:/.* -[Rr] .*/ OR data_process_exec_process_arguments:/.* -[Ff] .*/ OR data_process_exec_process_arguments:/.* -[Rr][Ff] .*/ OR data_process_exec_process_arguments:/.*\\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/)) OR data_process_exec_process_binary:/.*\\/[Uu][Nn][Ll][Ii][Nn][Kk]/ OR data_process_exec_process_binary:/.*\\/[Mm][Vv]/ OR (data_process_exec_process_binary:/.*\\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]/ AND data_process_exec_process_arguments:/.*0 .*/ AND data_process_exec_process_arguments:/.*\\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ AND (data_process_exec_process_arguments:/.*-[Ss] .*/ OR data_process_exec_process_arguments:/.*-[Cc] .*/ OR data_process_exec_process_arguments:/.*--[Ss][Ii][Zz][Ee].*/)) OR (data_process_exec_process_binary:/.*\\/[Ll][Nn]/ AND data_process_exec_process_arguments:/.*\\/[Dd][Ee][Vv]\\/[Nn][Uu][Ll][Ll] .*/ AND data_process_exec_process_arguments:/.*\\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ AND (data_process_exec_process_arguments:/.*-[Ss][Ff] .*/ OR data_process_exec_process_arguments:/.*-[Ss][Ff][Nn] .*/ OR data_process_exec_process_arguments:/.*-[Ss][Ff][Tt] .*/)) OR (data_process_exec_process_binary:/.*\\/[Cc][Pp]/ AND data_process_exec_process_arguments:/.*\\/[Dd][Ee][Vv]\\/[Nn][Uu][Ll][Ll].*/) OR (data_process_exec_process_binary:/.*\\/[Ss][Hh][Rr][Ee][Dd]/ AND data_process_exec_process_arguments:/.*-[Uu] .*/))) OR data_process_exec_process_arguments:/.* \\> \\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.* \\>\\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.* \\>\\| \\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*: \\> \\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*:\\> \\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*:\\>\\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*\\>\\|\\/[Vv][Aa][Rr]\\/[Ll][Oo][Gg]\\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll] --[Vv][Aa][Cc][Uu][Uu][Mm].*/ OR data_process_exec_process_arguments:/.*[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll] --[Rr][Oo][Tt][Aa][Tt][Ee].*/)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: The same rm/shred/unlink tool-set turned on the rest of /var/log (auth.log, messages, wtmp) instead of syslog alone. An actor emptying syslog almost never stops there, so a co-hit means the whole system-log record was destroyed in one coordinated evidence-wipe, not a single stray delete.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: auditctl -D destroys the kernel audit trail, the logging channel that outlives a syslog wipe. Purging /var/log/syslog while deleting audit rules in the same window is systematic takedown of both of the host's logging pipelines - the strongest 'blind the host' signature.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Deleting ~/.bash_history erases the exact commands that cleared syslog, typed in the same interactive session. A history wipe alongside the syslog removal places a live hands-on operator on the host and argues deliberate track-covering over benign log rotation.
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Emptying syslog is undone the instant rsyslog/systemd-journald writes the next line, so operators stop or mask the logging daemon to make the wipe stick. A systemctl/service stop of the syslog daemon on this host is what turns a one-off clear into permanent blinding.
  - id: 34979410-e4b5-4e5d-8cfb-389fdff05c12
    name: Remove Immutable File Attribute
    reason: On a hardened host /var/log/syslog is set chattr +i, so rm/truncate/shred fail until the immutable bit is stripped. A 'chattr -i' on this host just before the clearing is the enabling precursor and near-proof the deletion was intentional tampering.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Killing EDR/firewall/SELinux (falcon-sensor, firewalld, setenforce 0) is the defense-evasion that rides with track-covering: an actor erasing syslog typically first blinds the sensors that would have shipped those log lines off-box before they could be wiped locally.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: bash -i spawning nc/base64/pty.spawn is the hands-on-keyboard session the syslog clear is meant to erase. If it fired on this host you have recovered, from process telemetry, the very activity the attacker destroyed the local log to hide.
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: 'Part of the same host-blinding burst: flushing iptables to allow-all opens egress for exfil/C2 while clearing syslog hides the intrusion. A firewall flush together with a syslog wipe signals a coordinated ''open and blind the host'' teardown rather than maintenance.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other system, auth and login logs destroyed or the journal purged on this host
    query: ((data_process_exec_process_binary:/.*\/[Rr][Mm]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh][Rr][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Uu][Nn][Ll][Ii][Nn][Kk]/ OR data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]/ OR data_process_exec_process_binary:/.*\/[Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Tt][Ee][Ee]/ OR data_process_exec_process_binary:/.*\/[Cc][Pp]/) AND (data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Aa][Uu][Tt][Hh]\.[Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Ss][Ee][Cc][Uu][Rr][Ee].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Mm][Ee][Ss][Ss][Aa][Gg][Ee][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Kk][Ee][Rr][Nn]\.[Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Ww][Tt][Mm][Pp].*/ OR data_process_exec_process_arguments:/.*[Bb][Tt][Mm][Pp].*/ OR data_process_exec_process_arguments:/.*[Ll][Aa][Ss][Tt][Ll][Oo][Gg].*/)) OR data_process_exec_process_arguments:/.*[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll] --[Vv][Aa][Cc][Uu][Uu][Mm].*/ OR data_process_exec_process_arguments:/.*[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll] --[Rr][Oo][Tt][Aa][Tt][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: System logging daemon stopped/masked or audit rules deleted on this host
    query: (((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]/) AND (data_process_exec_process_arguments:/.*[Rr][Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Ll][Oo][Gg]-[Nn][Gg].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Dd]-[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Dd].*/ OR data_process_exec_process_arguments:/.*[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Dd].*/) AND (data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/ OR data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*[Mm][Aa][Ss][Kk].*/)) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.* -[Dd].*/))
    pivot_on:
    - host
    window: 2h
  - name: Immutable attribute stripped from a protected file before the wipe on this host
    query: data_process_exec_process_binary:/.*\/[Cc][Hh][Aa][Tt][Tt][Rr]/ AND data_process_exec_process_arguments:/.* -[Ii] .*/
    pivot_on:
    - host
    window: 2h
  - name: Shell history deleted or interactive attacker session on this host
    query: ((data_process_exec_process_binary:/.*\/[Rr][Mm]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh][Rr][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Uu][Nn][Ll][Ii][Nn][Kk]/) AND (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_process_exec_process_arguments:/.*\.[Zz][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_process_exec_process_arguments:/.*_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/)) OR data_process_exec_parent_arguments:/[Bb][Aa][Ss][Hh] -[Ii]/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/
    pivot_on:
    - host
    window: 2h
  - name: Privilege escalation to root preceding the syslog clearing on this host
    query: data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/
    pivot_on:
    - host
    window: 2h
