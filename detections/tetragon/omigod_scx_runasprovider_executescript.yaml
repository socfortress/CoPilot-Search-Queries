name: OMIGOD SCX RunAsProvider ExecuteScript
id: 6eea1bf6-f8d2-488a-a742-e6ef6c1b67db
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6eea1bf6-f8d2-488a-a742-e6ef6c1b67db
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Rule to detect the use of the SCX RunAsProvider ExecuteScript to execute any
  UNIX/Linux script using the /bin/sh shell. Script being executed gets created
  as a temp file in /tmp folder with a scx* prefix. Then it is invoked from the
  following directory /etc/opt/microsoft/scx/conf/tmpdir/. The file in that
  directory has the same prefix scx*. SCXcore, started as the Microsoft
  Operations Manager UNIX/Linux Agent, is now used in a host of products
  including Microsoft Operations Manager, Microsoft Azure, and Microsoft
  Operations Management Suite. MITRE ATT&CK: T1068, T1190, T1203.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_process_exec_process_uid:
              value: "root"
              case_insensitive: true
        - term:
            data_process_exec_process_auid: "0"
        - term:
            data_process_exec_process_cwd:
              value: "/var/opt/microsoft/scx/tmp"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*/etc/opt/microsoft/scx/conf/tmpdir/scx*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_uid
    - data_process_exec_process_auid
    - data_process_exec_process_cwd
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_uid equals 'root'; data_process_exec_process_auid
  equals '0'; data_process_exec_process_cwd equals '/var/opt/microsoft/scx/tmp',
  among other conditions.

known_false_positives: >
  Legitimate use of SCX RunAsProvider ExecuteScript. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.wiz.io/blog/omigod-critical-vulnerabilities-in-omi-azure
  - https://github.com/Azure/Azure-Sentinel/pull/3059
  - https://attack.mitre.org/techniques/T1068/
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1203/

response:
  message: >
    OMIGOD SCX RunAsProvider ExecuteScript detected on host $agent_name$.
    Matched data_process_exec_process_uid: $data_process_exec_process_uid$.
    Matched data_process_exec_process_auid: $data_process_exec_process_auid$.
    MITRE ATT&CK: T1068, T1190, T1203
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_uid
      type: other
    - field: data_process_exec_process_auid
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1068
    - T1190
    - T1203
  custom_tags:
    - omigod
    - runasprovider
    - executescript
    - linux
    - tetragon
    - process_creation
    - privilege_escalation
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_uid:/[Rr][Oo][Oo][Tt]/ AND data_process_exec_process_auid:"0" AND data_process_exec_process_cwd:/\/[Vv][Aa][Rr]\/[Oo][Pp][Tt]\/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\/[Ss][Cc][Xx]\/[Tt][Mm][Pp]/ AND data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Oo][Pp][Tt]\/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\/[Ss][Cc][Xx]\/[Cc][Oo][Nn][Ff]\/[Tt][Mm][Pp][Dd][Ii][Rr]\/[Ss][Cc][Xx].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21541900-27a9-4454-9c4c-3f0a4240344a
    name: OMIGOD SCX RunAsProvider ExecuteShellCommand
    reason: Identical OMIGOD exploit (CVE-2021-38647) against the same SCX/OMI agent, same root cwd /var/opt/microsoft/scx/tmp - the twin RunAsProvider method; the two frequently fire together or interchangeably as the attacker tries both unauth-RCE primitives on the same host.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Canonical next step after OMIGOD root RCE: the attacker-controlled /bin/sh script pulls a second-stage payload into /tmp or /dev/shm then runs it via sh -c - exactly what this rule matches, showing the ExecuteScript foothold moved to stager delivery.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: OMIGOD's dominant real-world outcome (per the Wiz advisory) was mass deployment of XMRig/Mirai cryptominers; a miner launched on this host soon after the SCX root RCE turns the exploit alert into a confirmed compromise.
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: The ExecuteScript payload commonly spawns a reverse shell for interactive hands-on-keyboard control as root; a netcat -e/-c shell on this host in the same window is the interactive-C2 follow-on to the OMIGOD RCE.
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: OMIGOD itself drops its scx* script into /tmp, and dropped second-stage binaries typically execute from /tmp too; a process whose binary lives in /tmp right after this alert is the staged payload running on the compromised host.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Persistence after root RCE: this rule catches crontab jobs installed from /tmp, the usual way OMIGOD-dropped miners and implants survive reboot - a strong post-exploitation persistence signal on the same host.'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Running as root via OMIGOD, the attacker can harvest /etc/shadow for offline cracking and lateral movement; copying passwd/shadow via a /tmp path (the same staging dir OMIGOD uses) is a credential-access follow-on tightly tied to this foothold.
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Post-exploitation discovery: reading /etc/sudoers to map which accounts hold sudo rights, so the intruder can backdoor a privileged user for stealthy re-entry after the OMIGOD root shell - account mapping on the same host in the incident window.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SCX/OMI management agent spawning child processes on this host
    query: data_process_exec_parent_binary:/.*(\/[Oo][Mm][Ii]\/|\/[Ss][Cc][Xx]\/|[Oo][Mm][Ii][Ss][Ee][Rr][Vv][Ee][Rr]|[Oo][Mm][Ii][Aa][Gg][Ee][Nn][Tt]|[Ss][Cc][Xx][Cc][Ii][Mm][Pp][Rr][Oo][Vv][Aa][Gg][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: Second-stage payload fetched via download utilities on this host
    query: data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Tt][Ff][Tt][Pp]|[Ff][Tt][Pp]|[Ss][Cc][Pp]|[Ff][Ee][Tt][Cc][Hh]|[Ll][Yy][Nn][Xx]|[Aa][Rr][Ii][Aa]2[Cc])/
    pivot_on:
    - host
    window: 2h
  - name: Payload executed from world-writable staging directories on this host
    query: (data_process_exec_process_binary:/\/([Tt][Mm][Pp]|[Vv][Aa][Rr]\/[Tt][Mm][Pp]|[Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Rr][Uu][Nn]\/[Ss][Hh][Mm])\/.*/ OR data_process_exec_parent_binary:/\/([Tt][Mm][Pp]|[Vv][Aa][Rr]\/[Tt][Mm][Pp]|[Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Rr][Uu][Nn]\/[Ss][Hh][Mm])\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence via cron, systemd units, or SSH authorized_keys on this host
    query: ((data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd]|[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg])/) OR (data_process_exec_process_arguments:/.*([Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/|\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]).*/))
    pivot_on:
    - host
    window: 4h
  - name: New privileged account created or sudoers granted on this host
    query: ((data_process_exec_process_binary:/.*\/([Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/))
    pivot_on:
    - host
    window: 4h
