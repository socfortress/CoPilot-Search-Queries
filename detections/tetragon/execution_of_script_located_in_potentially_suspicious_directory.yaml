name: Execution Of Script Located In Potentially Suspicious Directory
id: 30bcce26-51c5-49f2-99c8-7b59e3af36c7
version: 1
schema_version: "1.0"
date: "2023-06-02"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 30bcce26-51c5-49f2-99c8-7b59e3af36c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects executions of scripts located in potentially suspicious locations such
  as "/tmp" via a shell such as "bash", "sh", etc.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bash"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/csh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/dash"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/fish"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ksh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/sh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/zsh"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -c *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*/tmp/*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/bash';
  data_process_exec_process_binary matches '*/csh';
  data_process_exec_process_binary matches '*/dash', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.jpcert.or.jp/en/2023/05/gobrat.html
  - https://jstnk9.github.io/jstnk9/research/GobRAT-Malware/
  - https://www.virustotal.com/gui/file/60bcd645450e4c846238cf0e7226dc40c84c96eba99f6b2cffcd0ab4a391c8b3/detection
  - https://www.virustotal.com/gui/file/3e44c807a25a56f4068b5b8186eee5002eed6f26d665a8b791c472ad154585d1/detection

response:
  message: >
    Execution Of Script Located In Potentially Suspicious Directory detected on
    host $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - located
    - directory
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Bb][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Cc][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Dd][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ff][Ii][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Kk][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Zz][Ss][Hh]/) AND data_process_exec_process_arguments:/.* -[Cc] .*/ AND data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Precursor/superset of this exact event: curl or wget writing into /tmp or /dev/shm immediately followed by ''sh -c''. If it co-fired on this host, the script this rule just ran via sh -c IS the ''execute'' half of a confirmed download-and-run stager, not a benign admin one-liner.'
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'The drop that preceded this execution: wget -O /tmp/<file> is the most common way the script now being run by ''sh -c ... /tmp/...'' arrived on the host. Pair it with this alert to establish ingress-then-execute ordering on the same host.'
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Likely parent/foothold: a web-server process (nginx/apache/php-fpm) spawning a shell is the classic parent that then runs ''sh -c'' against a /tmp script. Check this alert''s data_process_exec_parent_binary against it - a webshell parent makes the /tmp execution attacker-driven initial access.'
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: 'Immediate precursor: chmod +x /tmp/<script> to set the execute bit on the just-dropped payload runs moments before this bash -c executes it. chmod on a /tmp target co-firing just before this alert confirms a deliberate stage-and-run sequence.'
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'Sibling payoff for the binary case: a process whose own path is under /tmp/ is executed (an ELF dropper) rather than a shell script referencing /tmp. Co-firing means both the script stage and a native binary stage ran out of /tmp on this host.'
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'Fileless-evasion sibling: the same staged-execution TTP moved to /dev/shm (RAM-backed tmpfs) so the payload never touches disk. A frequent evasion pivot on a host where a /tmp script was just executed - widen the hunt to /dev/shm when this fires.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Follow-on persistence tied to the exact same directory: this rule detects crontab loading a job from /tmp (crontab */tmp/*). A /tmp loader''s first act is usually to install a cron entry from /tmp so the payload survives reboot, so this is the expected next step after the script runs.'
  - id: e34cfa0c-0a50-4210-9cb3-5632d08eb041
    name: Potential GobRAT File Discovery Via Grep
    reason: 'Named-malware continuation: this detection''s own references ARE the GobRAT research, and the GobRAT loader runs precisely this ''sh -c'' script from /tmp, then greps for its deployed components (apached and friends). Grep file-discovery for GobRAT artifacts on the same host strongly indicates a live GobRAT infection.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reverse-shell / C2 egress on this host (nc/ncat/netcat/socat, /dev/tcp, pty.spawn)
    query: (data_process_exec_process_binary:/.*\/[Nn][Cc]/ OR data_process_exec_process_binary:/.*\/[Nn][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Nn][Ee][Tt][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ss][Oo][Cc][Aa][Tt]/) OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/
    pivot_on:
    - host
    window: 2h
  - name: Host reconnaissance burst after the staged script ran
    query: data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Ii][Pp]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ll][Ss][Oo][Ff]|\/[Ll][Aa][Ss][Tt]|\/[Ff][Ii][Nn][Dd])/
    pivot_on:
    - host
    window: 1h
  - name: Persistence written on this host (cron / systemd / rc.local / init.d / bashrc / authorized_keys)
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt])/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/.*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/
    pivot_on:
    - host
    window: 4h
  - name: Ingress tool transfer into /tmp or /dev/shm (how the script was staged)
    query: (data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Tt][Ff][Tt][Pp]/ OR data_process_exec_process_binary:/.*\/[Ff][Tt][Pp]/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Download or base64 blob piped straight into a shell (what the sh -c is doing)
    query: data_process_exec_process_arguments:/.*([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]).*\|.*([Bb][Aa][Ss][Hh]|[Ss][Hh]).*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Ee]64.*\|.*([Bb][Aa][Ss][Hh]|[Ss][Hh]).*/
    pivot_on:
    - host
    window: 2h
