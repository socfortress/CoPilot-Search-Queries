name: Kaspersky Endpoint Security Stopped Via CommandLine - Linux
id: 36388120-b3f1-4ce9-b50b-280d9a7f4c04
version: 1
schema_version: "1.0"
date: "2025-10-18"
author: Milad Cheraghi
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36388120-b3f1-4ce9-b50b-280d9a7f4c04
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Kaspersky init.d stop script on Linux systems either
  directly or via systemctl. This activity may indicate a manual interruption of
  the antivirus service by an administrator, or it could be a sign of potential
  tampering or evasion attempts by malicious actors. MITRE ATT&CK: T1685.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/systemctl"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bash"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/sh"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "*stop*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*kesl*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/systemctl';
  data_process_exec_process_binary matches '*/bash';
  data_process_exec_process_binary matches '*/sh', among other conditions.

known_false_positives: >
  System administrator manually stopping Kaspersky services. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://support.kaspersky.com/KES4Linux/12.0.0/en-US/197929.htm
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Kaspersky Endpoint Security Stopped Via CommandLine - Linux detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - kaspersky
    - endpoint
    - security
    - linux
    - tetragon
    - process_creation
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Bb][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh]/) AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/ AND data_process_exec_process_arguments:/.*[Kk][Ee][Ss][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: This rule is the specific case (kesl) of that generic 'systemctl/service/chkconfig stop|disable' behaviour; the same hands-on session that stops Kaspersky almost always stops or disables other units too, so a co-occurring hit shows the AV kill was part of a broader service teardown rather than an isolated admin action.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: Parallel EDR/AV kill against other vendors - it catches stopping CrowdStrike (falcon-sensor), Carbon Black (cbdaemon), firewalld and 'setenforce 0'. Killing Kaspersky (kesl) and another security agent on the same host in the window is the same 'blind every endpoint agent' step and strongly raises confidence this is adversarial.
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Auditd/auth.log view of other monitoring agents (Wazuh, auditd, osquery, Tetragon) being stopped. An attacker who kills the AV via Tetragon usually silences the telemetry pipeline too; this corroborates from a different sensor and would catch Tetragon itself being among the services torn down.
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: Firewall takedown that routinely accompanies the AV kill - flushing iptables/ip6tables chains (-F/-Z/-X) to allow-all leaves the host both unmonitored (AV off) and unfiltered (firewall open) for inbound C2 and exfil in one sitting.
  - id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
    name: UFW Disable Attempt
    reason: Same firewall-teardown intent on the ufw stack ('ufw disable', 'ufw-init stop/flush'). On Debian/Ubuntu hosts the firewall usually goes down via ufw rather than raw iptables, so a UFW disable alongside the Kaspersky stop completes the 'defenses off' picture.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: The logging-blinding counterpart to killing the AV - 'auditctl -D' wipes all audit rules so the host stops recording. Disabling the endpoint agent and deleting audit rules in the same window is the matched pair that leaves the box both unprotected and unlogged.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Cover-tracks follow-on once monitoring is down - rm/shred/unlink against /var/log erases the evidence the now-stopped agent and logging would have held, including traces of the AV-stop itself.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Tight anti-forensics follow-on for a command-line kill - after typing the 'systemctl stop ... kesl' (or bash/sh) command this rule caught, a hands-on operator wipes ~/.bash_history to erase the exact command, placing a live human on the host covering their tracks.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Further tampering with the Kaspersky / KESL agent on this host
    query: (data_process_exec_process_binary:/.*[Kk][Ee][Ss][Ll].*/ OR data_process_exec_process_binary:/.*[Kk][Aa][Ss][Pp][Ee][Rr][Ss][Kk][Yy].*/ OR data_process_exec_process_arguments:/.*[Kk][Ee][Ss][Ll].*/ OR data_process_exec_process_arguments:/.*[Kk][Aa][Ss][Pp][Ee][Rr][Ss][Kk][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Root acquisition preceding the stop (sudo/su/pkexec/doas) on this host
    query: (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/)
    pivot_on:
    - host
    window: 1h
  - name: Other security / logging daemons stopped, disabled, masked or killed by name on this host
    query: (((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/) AND data_process_exec_process_arguments:/.*([Aa][Uu][Dd][Ii][Tt][Dd]|[Ww][Aa][Zz][Uu][Hh]|[Ff][Aa][Ll][Cc][Oo][Nn]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Tt][Ee][Tt][Rr][Aa][Gg][Oo][Nn]|[Cc][Ll][Aa][Mm][Aa][Vv]|[Ss][Uu][Rr][Ii][Cc][Aa][Tt][Aa]|[Rr][Ss][Yy][Ss][Ll][Oo][Gg]|[Ff][Ii][Ll][Ee][Bb][Ee][Aa][Tt]|[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Dd]).*/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]).*/) OR ((data_process_exec_process_binary:/.*\/[Pp][Kk][Ii][Ll][Ll]/ OR data_process_exec_process_binary:/.*\/[Kk][Ii][Ll][Ll][Aa][Ll][Ll]/) AND data_process_exec_process_arguments:/.*([Aa][Uu][Dd][Ii][Tt][Dd]|[Ww][Aa][Zz][Uu][Hh]|[Ff][Aa][Ll][Cc][Oo][Nn]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Cc][Ll][Aa][Mm]|[Ss][Uu][Rr][Ii][Cc][Aa][Tt][Aa]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Ingress tool transfer and execution from world-writable directories on this host
    query: ((data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Tt][Ff][Tt][Pp]/) OR (data_process_exec_process_binary:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_binary:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence establishment (cron / systemd enable / new user / ssh keys) on this host
    query: ((data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/) OR (data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.* [Ee][Nn][Aa][Bb][Ll][Ee] .*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/))
    pivot_on:
    - host
    window: 6h
