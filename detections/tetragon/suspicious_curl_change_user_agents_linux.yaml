name: Suspicious Curl Change User Agents - Linux
id: b86d356d-6093-443d-971c-9b07db583c68
version: 1
schema_version: "1.0"
date: "2022-09-15"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b86d356d-6093-443d-971c-9b07db583c68
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious curl process start on linux with set useragent options.
  MITRE ATT&CK: T1071.001.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/curl"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* -A *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --user-agent *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/curl';
  data_process_exec_process_arguments matches '* -A *';
  data_process_exec_process_arguments matches '* --user-agent *'.

known_false_positives: >
  Scripts created by developers and admins. Administrative activity. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://curl.se/docs/manpage.html
  - https://attack.mitre.org/techniques/T1071/001/

response:
  message: >
    Suspicious Curl Change User Agents - Linux detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1071.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.001
  custom_tags:
    - change
    - agents
    - linux
    - tetragon
    - process_creation
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ AND (data_process_exec_process_arguments:/.* -[Aa] .*/ OR data_process_exec_process_arguments:/.* --[Uu][Ss][Ee][Rr]-[Aa][Gg][Ee][Nn][Tt] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Precursor/foothold: an attacker-driven curl is most often launched by a web-server process (nginx/apache/php-fpm/node) spawning a shell after web exploitation. If this fired on the same host just before, the UA-spoofed curl is webshell ingress, not admin activity - compare the curl event''s data_process_exec_parent_binary against the webshell''s child.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Same ingress-tool-transfer TTP at higher confidence: curl/wget writing into /tmp or /dev/shm then piped to ''sh -c''. Co-firing confirms the spoofed-UA request was a stager download that actually ran, turning this medium alert into a confirmed fetch-and-execute.'
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'Co-occurring sibling downloader: attackers routinely stage with both curl and wget. A wget -O into /tmp on the same host shows a multi-tool ingress campaign, and places this UA-spoofed curl inside it rather than treating it as a lone fetch.'
  - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
    name: Suspicious Curl File Upload - Linux
    reason: Same curl binary on the outbound/exfil leg (-F/-T/-d/--data). UA spoofing is applied to both the inbound payload fetch and the outbound beacon, so an upload curl on the same host completes the C2 round-trip (fetch stage in, send data/results out).
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: 'Immediate next step after the fetch: chmod +x on the just-downloaded file (typically under /tmp) to set the execute bit. A chmod touching /tmp/opt/etc right after the curl request is the standard arm-the-payload action before it is run.'
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'The payoff: a process whose binary lives under /tmp executes. This turns ''curl fetched something'' into ''the downloaded payload ran'' - the single most important follow-on to confirm the UA-spoofed download delivered a working implant.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'Most common real-world payoff of a Linux curl-download: a coin miner. Miner command-line flags (-o pool.*, --donate-level=0, --algo=rx/0) on the same host identify exactly what the spoofed-UA curl pulled down and ran.'
  - id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
    name: Shai-Hulud NPM Package Malicious Exfiltration via Curl
    reason: Named supply-chain campaign whose IOC is curl exfil to a webhook endpoint. On a dev/CI host that builds npm packages, a UA-spoofed curl beacon may be the Shai-Hulud exfil itself - if that rule co-fires on this host, treat both as one incident.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: chmod making the curl-dropped payload executable (/tmp or /dev/shm)
    query: data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)
    pivot_on:
    - host
    window: 1h
  - name: Execution of a binary located in /tmp or /dev/shm (the fetched payload runs)
    query: (data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)
    pivot_on:
    - host
    window: 1h
  - name: Fileless download-and-run stager (sh -c with curl/wget/base64, or python -c)
    query: (data_process_exec_process_arguments:/.*[Ss][Hh] -[Cc] .*/ AND (data_process_exec_process_arguments:/.*[Cc][Uu][Rr][Ll].*/ OR data_process_exec_process_arguments:/.*[Ww][Gg][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Ee]64.*/)) OR data_process_exec_process_arguments:/.*[Pp][Yy][Tt][Hh][Oo][Nn][0-9]? -[Cc] .*/
    pivot_on:
    - host
    window: 1h
  - name: C2 / reverse-shell establishment on this host (nc/ncat/socat, /dev/tcp, bash -i, mkfifo, pty.spawn)
    query: data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh] -[Ii].*/ OR data_process_exec_process_arguments:/.*[Mm][Kk][Ff][Ii][Ff][Oo].*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/
    pivot_on:
    - host
    window: 2h
  - name: Download tooling fetching from a hardcoded raw IPv4 (curl/wget to an IP, no domain)
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/) AND data_process_exec_process_arguments:/.*[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}.*/
    pivot_on:
    - host
    window: 2h
