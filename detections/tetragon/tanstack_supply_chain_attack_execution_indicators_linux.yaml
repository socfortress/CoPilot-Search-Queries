name: TanStack Supply-Chain Attack Execution Indicators - Linux
id: 3c6f5e4a-8d0b-6abc-d9e2-4f7a6b8c9d0e
version: 1
schema_version: "1.0"
date: "2026-05-12"
author: Leonardo Gasparini
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3c6f5e4a-8d0b-6abc-d9e2-4f7a6b8c9d0e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process execution indicators associated with the Mini Shai-Hulud
  supply-chain campaign targeting TanStack npm packages and others such as
  mistralai and uipath reported on early May 2026. The preinstall hook runs
  setup.mjs, which downloads a platform-specific Bun runtime. MITRE ATT&CK:
  T1059.007, T1059.006, T1204.002.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/bun"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*bun*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*run*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*tanstack_runner.js*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/python3*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*/tmp/transformers.pyz*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/bun';
  data_process_exec_process_arguments matches '*bun*';
  data_process_exec_process_arguments matches '*run*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://socket.dev/blog/tanstack-npm-packages-compromised-mini-shai-hulud-supply-chain-attack
  - https://socket.dev/supply-chain-attacks/mini-shai-hulud
  - https://safedep.io/mass-npm-supply-chain-attack-tanstack-mistral/
  - https://attack.mitre.org/techniques/T1059/007/
  - https://attack.mitre.org/techniques/T1059/006/
  - https://attack.mitre.org/techniques/T1204/002/

response:
  message: >
    TanStack Supply-Chain Attack Execution Indicators - Linux detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1059.007, T1059.006, T1204.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.007
    - T1059.006
    - T1204.002
  custom_tags:
    - tanstack
    - supply
    - chain
    - linux
    - tetragon
    - process_creation
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_process_exec_process_binary:/.*\/[Bb][Uu][Nn]/ AND data_process_exec_process_arguments:/.*[Bb][Uu][Nn].*/ AND data_process_exec_process_arguments:/.*[Rr][Uu][Nn].*/ AND data_process_exec_process_arguments:/.*[Tt][Aa][Nn][Ss][Tt][Aa][Cc][Kk]_[Rr][Uu][Nn][Nn][Ee][Rr]\.[Jj][Ss].*/) OR (data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3.*/ AND data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/[Tt][Rr][Aa][Nn][Ss][Ff][Oo][Rr][Mm][Ee][Rr][Ss]\.[Pp][Yy][Zz].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: eb827bbd-670a-4d58-8446-c464d8ac2323
    name: Shai-Hulud Malicious Bun Execution - Linux
    reason: 'Same campaign family and same execution primitive: Mini Shai-Hulud/TanStack and Shai-Hulud ''Second Coming'' both run their bundled JS payload through node->bun after a preinstall/setup.mjs installs the Bun runtime. This rule''s ''bun run tanstack_runner.js'' branch is the same node->bun payload-execution step this sibling catches as ''bun run bun_environment.js'' (and the curl -fsSL bun.sh/install bootstrap), so one firing strongly implies the other stage is present on the host.'
  - id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
    name: Script Interpreter Spawning Credential Scanner - Linux
    reason: 'Immediate next step and the campaign''s actual objective: once ''bun run tanstack_runner.js'' (or transformers.pyz) executes, the payload spawns trufflehog/gitleaks under the node/bun parent to harvest secrets. This rule keys on exactly that node|bun -> trufflehog|gitleaks parent/child relationship, making it the direct credential-access follow-on (T1552).'
  - id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
    name: Shai-Hulud NPM Package Malicious Exfiltration via Curl
    reason: 'Final-stage follow-on of the same worm: after secrets are collected it exfiltrates them with ''curl -d'' to an attacker webhook. This sibling detects that exact exfiltration (curl POST to the known webhook.site endpoint); its appearance on the same host after this execution alert confirms harvested data left the box (T1041).'
  - id: d7a650c4-226c-451e-948f-cc490db506aa
    name: PUA - TruffleHog Execution - Linux
    reason: 'Credential-theft follow-on complementary to the interpreter->scanner rule: it catches TruffleHog run with secret-hunting arguments (Git/GitHub/s3/--results=verified) regardless of whether node/bun is the direct parent (e.g. launched via an intermediate shell). TruffleHog is the signature secret-harvesting tool of the Shai-Hulud npm worm, so confirming it ran pins the collection stage.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Precursor mechanism: setup.mjs fetches the platform-specific Bun runtime (and the transformers.pyz payload) into a temp directory and executes it. This rule fires on the generic curl/wget -> /tmp or /dev/shm -> ''sh -c'' download-and-run stager, i.e. the ingress-tool-transfer step (T1105) that stages the very Bun/python payload this TanStack rule then catches executing.'
  - id: 11bb9b26-4179-4a06-afcb-1ec31fce1627
    name: Shai-Hulud Malware Indicators - Linux
    reason: 'Same-campaign IOC: matches the literal ''Shai-Hulud''/''SHA1HULUD'' strings the worm leaves in command lines (e.g. the exfil repo and branch names it creates on GitHub). A host running the TanStack payload is part of the Shai-Hulud wave, so these string indicators are expected to co-occur and corroborate attribution.'
  - id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
    name: Axios NPM Compromise Indicators - Linux
    reason: 'Co-occurring sibling in the same npm-supply-chain family: another malicious npm package whose postinstall runs under a node/bun parent to drop a RAT. A poisoned dev/CI install tree commonly pulls several compromised packages at once, so an axios-style dropper on the same host within the window points to a broader npm-supply-chain compromise rather than an isolated event.'
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'Co-occurring staging signal tied to this rule''s own python branch: the campaign drops and runs artifacts from /tmp (this rule''s second branch is ''python3 /tmp/transformers.pyz'', and the downloaded Bun runtime is staged to a temp dir). A process executing directly out of /tmp on the same host confirms a staged payload ran and corroborates the execution chain.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Developer and cloud secret harvesting (npmrc, git/aws/gcloud creds, SSH keys, /proc environ, trufflehog/gitleaks) on this host
    query: ((data_process_exec_process_arguments:/.*\.[Nn][Pp][Mm][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\.[Gg][Ii][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*\/\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Cc][Oo][Nn][Ff][Ii][Gg]\/[Gg][Cc][Ll][Oo][Uu][Dd].*/ OR data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Ee][Nn][Vv][Ii][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Gg][Ii][Tt][Hh][Uu][Bb]_[Tt][Oo][Kk][Ee][Nn].*/ OR data_process_exec_process_arguments:/.*[Nn][Pp][Mm]_[Tt][Oo][Kk][Ee][Nn].*/) OR (data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]/ OR data_process_exec_process_binary:/.*\/[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss]/))
    pivot_on:
    - host
    window: 6h
  - name: Harvested-secret exfiltration via curl/wget POST or upload to a webhook / GitHub API / paste site on this host
    query: ((data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/) AND (data_process_exec_process_arguments:/.* -[Dd] .*/ OR data_process_exec_process_arguments:/.*--[Dd][Aa][Tt][Aa].*/ OR data_process_exec_process_arguments:/.*-[Xx] [Pp][Oo][Ss][Tt].*/ OR data_process_exec_process_arguments:/.*--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*[Ww][Ee][Bb][Hh][Oo][Oo][Kk]\.[Ss][Ii][Tt][Ee].*/ OR data_process_exec_process_arguments:/.*[Aa][Pp][Ii]\.[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm].*/ OR data_process_exec_process_arguments:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn].*/))
    pivot_on:
    - host
    window: 2h
  - name: Bun runtime acquisition or Node/npm spawning the Bun installer (campaign bootstrap precursor) on this host
    query: ((data_process_exec_process_arguments:/.*[Bb][Uu][Nn]\.[Ss][Hh]\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_process_exec_process_arguments:/.*[Oo][Vv][Ee][Nn]-[Ss][Hh]\/[Bb][Uu][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Ee][Tt][Uu][Pp]\.[Mm][Jj][Ss].*/ OR data_process_exec_process_arguments:/.*[Ss][Ee][Tt][Uu][Pp]_[Bb][Uu][Nn].*/ OR data_process_exec_process_arguments:/.*[Bb][Uu][Nn]_[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\.[Jj][Ss].*/) OR ((data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ OR data_process_exec_parent_binary:/.*\/[Nn][Pp][Mm]/) AND data_process_exec_process_binary:/.*\/[Bb][Uu][Nn]/))
    pivot_on:
    - host
    window: 2h
  - name: 'NPM-token worm self-propagation: npm/npx publish or git push / gh repo creation (likely next worm spread) on this host'
    query: ((data_process_exec_process_binary:/.*\/[Nn][Pp][Mm]/ OR data_process_exec_process_binary:/.*\/[Nn][Pp][Xx]/) AND data_process_exec_process_arguments:/.*[Pp][Uu][Bb][Ll][Ii][Ss][Hh].*/) OR (data_process_exec_process_binary:/.*\/[Gg][Ii][Tt]/ AND (data_process_exec_process_arguments:/.* [Pp][Uu][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Rr][Ee][Mm][Oo][Tt][Ee] [Aa][Dd][Dd].*/ OR data_process_exec_process_arguments:/.* [Ii][Nn][Ii][Tt].*/)) OR data_process_exec_process_binary:/.*\/[Gg][Hh]/
    pivot_on:
    - host
    window: 6h
  - name: Detached or persistent payload execution (nohup/setsid of node/bun/python, or systemctl --user service) on this host
    query: (((data_process_exec_process_binary:/.*\/[Nn][Oo][Hh][Uu][Pp]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ss][Ii][Dd]/) OR data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Oo][Ww][Nn].*/) AND (data_process_exec_process_arguments:/.*[Nn][Oo][Dd][Ee].*/ OR data_process_exec_process_arguments:/.*[Bb][Uu][Nn].*/ OR data_process_exec_process_arguments:/.*[Pp][Yy][Tt][Hh][Oo][Nn].*/)) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*--[Uu][Ss][Ee][Rr].*/)
    pivot_on:
    - host
    window: 4h
