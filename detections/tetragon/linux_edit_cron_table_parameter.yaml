name: Crontab Interactive Edit Execution
id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the crontab binary with the interactive edit flag (-e).
  Adversaries may abuse crontab to establish persistence by modifying scheduled
  tasks to execute malicious commands.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_process_exec_process_binary: "/usr/bin/crontab"
        - wildcard:
            data_process_exec_process_arguments: "*-e*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  This detection requires Linux endpoints with Wazuh agents configured to log
  process execution details, including command-line arguments.

known_false_positives: >
  System administrators legitimately editing scheduled tasks using crontab.
  Consider allowlisting trusted users or maintenance windows.

references:
  - https://attack.mitre.org/techniques/T1053/003/
  - https://gtfobins.github.io/gtfobins/crontab/

response:
  message: >
    Crontab interactive edit detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 60
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 60
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Linux Persistence
    - Scheduled Task Abuse
  asset_type: Linux
  mitre_attack_id:
    - T1053.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:"/usr/bin/crontab" AND data_process_exec_process_arguments:/.*-e.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-edit-cron-table-parameter-001
    name: Linux Edit Cron Table Parameter
    reason: 'Auditd/syslog twin of this exact behaviour: it matches the same crontab invocation (including -e) through full_log, so the same interactive edit is independently confirmed by a second sensor on the host.'
  - id: linux-auditd-crontab-listing-001
    name: Linux Auditd Crontab Listing
    reason: crontab -l enumerates existing jobs; attackers routinely list the current cron table immediately before modifying it, making this the common precursor to an interactive edit.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Same crontab binary used non-interactively (crontab /tmp/<file>) to install a dropped cron table; the automated variant of the very persistence an interactive -e performs by hand.
  - id: c2e234de-03a3-41e1-b39a-1e56dc17ba67
    name: Remove Scheduled Cron Task/Job
    reason: crontab -r wipes the crontab; cryptominers and intruders remove the existing table before (re)writing their own, so a remove frequently brackets this edit in the same cron-tampering sequence.
  - id: linux-auditd-crontab-directory-files-modification-001
    name: Linux Auditd Crontab Directory Files Modification
    reason: crontab -e writes the user table under /var/spool/cron and intruders also touch /etc/cron.d; this flags the actual on-disk cron change that the edit produces or accompanies.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Captures malicious lines appended to cron files (XorDDos/Kaiji/Kinsing tradecraft); the written persistence entry that an edit like this is being used to deliver.
  - id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
    name: Linux Init Script Persistence Detection
    reason: init.d/rc.local startup-script persistence; operators routinely layer a second persistence mechanism alongside cron in the same session, so this often co-occurs on the host (its own block reciprocally links this rule).
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Payload download / ingress tool transfer on this host
    query: data_process_exec_process_binary:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Tt][Ff][Tt][Pp]|[Ff][Tt][Pp]|[Ss][Cc][Pp]|[Ss][Ff][Tt][Pp]|[Ff][Ee][Tt][Cc][Hh])/
    pivot_on:
    - host
    window: 4h
  - name: 'Payload staging: execution from world-writable dirs or made executable'
    query: ((data_process_exec_process_binary:/\/(tmp|dev\/shm|var\/tmp)\/.*/) OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*(\+[Xx]|777|755).*/))
    pivot_on:
    - host
    window: 4h
  - name: Privilege escalation around the cron edit (sudo/su/pkexec/doas)
    query: data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Dd][Oo][Aa][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Cron daemon spawning a shell/interpreter/downloader (persistence firing)
    query: data_process_exec_parent_binary:/.*\/([Cc][Rr][Oo][Nn][Dd]|[Cc][Rr][Oo][Nn]|[Aa][Nn][Aa][Cc][Rr][Oo][Nn])/ AND data_process_exec_process_binary:/.*\/([Bb][Aa][Ss][Hh]|[Dd][Aa][Ss][Hh]|[Zz][Ss][Hh]|[Kk][Ss][Hh]|[Ss][Hh]|[Pp][Yy][Tt][Hh][Oo][Nn]3?|[Pp][Ee][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Nn][Cc][Aa][Tt]|[Nn][Cc]|[Ss][Oo][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 6h
  - name: Reverse shell / remote-access tooling on this host
    query: ((data_process_exec_process_binary:/.*\/([Nn][Cc][Aa][Tt]|[Nn][Cc]|[Ss][Oo][Cc][Aa][Tt]|[Tt][Ee][Ll][Nn][Ee][Tt])/) OR (data_process_exec_process_arguments:/.*(\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]|\/[Dd][Ee][Vv]\/[Uu][Dd][Pp]|[Bb][Aa][Ss][Hh] -[Ii]| -[Ee] ).*/))
    pivot_on:
    - host
    window: 4h
