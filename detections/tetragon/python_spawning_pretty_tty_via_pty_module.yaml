name: Python Spawning Pretty TTY Via PTY Module
id: c4042d54-110d-45dd-a0e1-05c47822c937
version: 1
schema_version: "1.0"
date: "2024-11-04"
author: Nextron Systems
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c4042d54-110d-45dd-a0e1-05c47822c937
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a python process calling to the PTY module in order to spawn a pretty
  tty which could be indicative of potential reverse shell activity. MITRE
  ATT&CK: T1059.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python2"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python3"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python2.*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python3.*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*import pty*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*from pty *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "*spawn*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/python';
  data_process_exec_process_binary matches '*/python2';
  data_process_exec_process_binary matches '*/python3', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.volexity.com/blog/2022/06/02/zero-day-exploitation-of-atlassian-confluence/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Python Spawning Pretty TTY Via PTY Module detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - python
    - spawning
    - pretty
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]2/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]2\..*/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3\..*/) AND (data_process_exec_process_arguments:/.*[Ii][Mm][Pp][Oo][Rr][Tt] [Pp][Tt][Yy].*/ OR data_process_exec_process_arguments:/.*[Ff][Rr][Oo][Mm] [Pp][Tt][Yy] .*/) AND data_process_exec_process_arguments:/.*[Ss][Pp][Aa][Ww][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
    name: Python Reverse Shell Execution Via PTY And Socket Modules
    reason: 'Tightest sibling and near-certain co-fire: that rule catches the python one-liner that opens the socket AND calls pty.spawn, while this rule catches the pty.spawn TTY-upgrade step on its own. They are the same revshells.com payload seen as one or two exec events - if the socket variant fired on the host, this is the stabilisation half of the identical shell.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: 'Overlaps by construction: its query matches a child of ''bash -i'' whose arguments contain pty.spawn. pty.spawn(''/bin/bash'') IS that interactive bash, so this rule and that one flag two sides of the same upgraded TTY - confirming the host now has a hands-on-keyboard operator, not an automated script.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Classic immediate precursor: ''nc -e /bin/sh'' gives a dumb, non-interactive shell with no job control, which operators upgrade seconds later with ''python -c import pty; pty.spawn''. A netcat reverse shell on the same host in-window is the connection this TTY upgrade is attached to.'
  - id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
    name: Inline Python Execution - Spawn Shell Via OS System Library
    reason: 'Same actor, same GTFOBins python-shell toolkit: os.system(''/bin/bash'') is the earlier/alternate way the operator drops into a shell from inline python before (or instead of) pty.spawn. Co-occurrence points to one person interactively driving python one-liners for shell access on the host.'
  - id: 7fb14105-530e-4e2e-8cfb-99f7d8700b66
    name: Atlassian Confluence CVE-2022-26134
    reason: 'The exact initial-access scenario this rule cites (Volexity Confluence zero-day): Confluence java spawns a python/shell child via OGNL injection, giving a non-interactive foothold that the attacker then upgrades with pty.spawn. If this Confluence rule fired on the host first, this alert is the very next kill-chain step.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Immediate follow-on once the TTY is usable: the first thing an operator does in a fresh interactive shell is orient - SUID hunting (find -perm -4000) and .htpasswd discovery to map privesc and credential paths. These need the job-control/TTY the pty.spawn upgrade just provided.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Follow-on privilege-escalation enumeration: reading /etc/sudoers (cat/grep/less) to list who has sudo. This is a hands-on-keyboard action that only makes sense once the attacker has the interactive shell this rule''s pty upgrade created.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Follow-on persistence: having stabilised the shell, the operator installs a crontab job from /tmp to survive disconnect/reboot. A crontab write on the same host shortly after the TTY upgrade turns a transient reverse shell into durable access.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reverse shell connection primitives on this host
    query: (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/ OR ((data_process_exec_process_binary:/.*\/[Nn][Cc]/ OR data_process_exec_process_binary:/.*\/[Nn][Cc][Aa][Tt]/) AND data_process_exec_process_arguments:/.* -[Ee] .*/) OR data_process_exec_process_binary:/.*\/[Ss][Oo][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Mm][Kk][Ff][Ii][Ff][Oo]/)
    pivot_on:
    - host
    window: 2h
  - name: Hands-on-keyboard host and user reconnaissance on this host
    query: (data_process_exec_process_binary:/.*\/[Ww][Hh][Oo][Aa][Mm][Ii]/ OR data_process_exec_process_binary:/.*\/[Ii][Dd]/ OR data_process_exec_process_binary:/.*\/[Uu][Nn][Aa][Mm][Ee]/ OR data_process_exec_process_binary:/.*\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]/ OR data_process_exec_process_binary:/.*\/[Gg][Rr][Oo][Uu][Pp][Ss]/ OR data_process_exec_process_binary:/.*\/[Ww]/ OR data_process_exec_process_binary:/.*\/[Ll][Aa][Ss][Tt]/)
    pivot_on:
    - host
    window: 1h
  - name: Privilege-escalation enumeration and attempts on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -4000.*/ OR data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/)
    pivot_on:
    - host
    window: 2h
  - name: Second-stage payload download and execution from tmp on this host
    query: ((data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/) AND (data_process_exec_process_arguments:/.*[Hh][Tt][Tt][Pp].*/ OR data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)) OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*\+[Xx].*/) OR data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/
    pivot_on:
    - host
    window: 4h
  - name: Persistence establishment (cron / systemd unit / authorized_keys) on this host
    query: (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Ee][Nn][Aa][Bb][Ll][Ee].*/))
    pivot_on:
    - host
    window: 6h
