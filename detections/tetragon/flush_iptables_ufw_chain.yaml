name: Flush Iptables Ufw Chain
id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
version: 1
schema_version: "1.0"
date: "2023-01-18"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of iptables to flush all firewall rules, tables and chains and
  allow all network traffic. MITRE ATT&CK: T1686.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/iptables"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/xtables-legacy-multi"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/iptables-legacy-multi"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ip6tables"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ip6tables-legacy-multi"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-F*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-Z*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-X*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ufw-logging-deny*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ufw-logging-allow*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ufw6-logging-deny*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ufw6-logging-allow*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/iptables';
  data_process_exec_process_binary matches '*/xtables-legacy-multi';
  data_process_exec_process_binary matches '*/iptables-legacy-multi', among
  other conditions.

known_false_positives: >
  Network administrators. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://blogs.blackberry.com/
  - https://www.cyberciti.biz/tips/linux-iptables-how-to-flush-all-rules.html
  - https://twitter.com/Joseliyo_Jstnk/status/1620131033474822144
  - https://attack.mitre.org/techniques/T1686/

response:
  message: >
    Flush Iptables Ufw Chain detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1686
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1686
  custom_tags:
    - flush
    - iptables
    - chain
    - linux
    - tetragon
    - process_creation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Xx][Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii]/) AND (data_process_exec_process_arguments:/.*-[Ff].*/ OR data_process_exec_process_arguments:/.*-[Zz].*/ OR data_process_exec_process_arguments:/.*-[Xx].*/) AND (data_process_exec_process_arguments:/.*[Uu][Ff][Ww]-[Ll][Oo][Gg][Gg][Ii][Nn][Gg]-[Dd][Ee][Nn][Yy].*/ OR data_process_exec_process_arguments:/.*[Uu][Ff][Ww]-[Ll][Oo][Gg][Gg][Ii][Nn][Gg]-[Aa][Ll][Ll][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*[Uu][Ff][Ww]6-[Ll][Oo][Gg][Gg][Ii][Nn][Gg]-[Dd][Ee][Nn][Yy].*/ OR data_process_exec_process_arguments:/.*[Uu][Ff][Ww]6-[Ll][Oo][Gg][Gg][Ii][Nn][Gg]-[Aa][Ll][Ll][Oo][Ww].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
    name: UFW Disable Attempt
    reason: 'Sibling host-firewall teardown: `ufw disable` / `ufw ... force-stop|flush` drives the box to the same wide-open state this rule catches via `iptables -F` on the ufw-logging chains; the two are routinely run back-to-back in one defense-impairment step.'
  - id: 323ff3f5-0013-4847-bbd4-250b5edb62cc
    name: Modify System Firewall
    reason: Same firewall-rule removal seen by a different sensor (auditd vs Tetragon); it is purpose-built to catch rule deletion that disable-only detections miss, so it corroborates this flush even when one sensor misses a variant.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Same defense-impairment burst on the host: stops the iptables/ip6tables service, systemctl disable firewalld, setenforce 0, and kills EDR (falcon-sensor); flushing the chains is one move inside this cluster of turning host protections off.'
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: 'Service-level counterpart to the raw flush: systemctl/service stop|disable of firewalld and other security daemons alongside iptables -F completes the firewall and defense takedown.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Anti-forensics that rides with firewall teardown: once protections are off, the actor wipes /var/log to erase evidence of the intrusion and of the flush itself.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Direct exploitation of the now-open firewall: with inbound/outbound filtering gone, an nc -e <shell> reverse/bind shell establishes the C2 channel the flush cleared the path for.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Expected follow-on once egress is unblocked: curl/wget pulls the next-stage payload into /tmp or /dev/shm and runs it - the staging the firewall flush enables.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'Common end-goal driving the flush: miners and Linux botnets flush iptables to guarantee pool/C2 egress (and drop rival rules), so mining command-line indicators on the same host confirm the impact motive.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Firewall / packet-filter control executed on this host
    query: data_process_exec_process_binary:/.*(\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]|\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]|\/[Nn][Ff][Tt]|\/[Uu][Ff][Ww]|\/[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]-[Cc][Mm][Dd]|\/[Xx][Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii])/
    pivot_on:
    - host
    window: 2h
  - name: Security controls / EDR / SELinux-AppArmor being disabled on this host
    query: ((data_process_exec_process_binary:/.*(\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]|\/[Aa][Aa]-[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|\/[Aa][Aa]-[Tt][Ee][Aa][Rr][Dd][Oo][Ww][Nn]|\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll])/) OR (data_process_exec_process_binary:/.*(\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee])/ AND data_process_exec_process_arguments:/.*([Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Dd]|[Aa][Uu][Dd][Ii][Tt][Dd]|[Ff][Aa][Ll][Cc][Oo][Nn]-[Ss][Ee][Nn][Ss][Oo][Rr]|[Ww][Aa][Zz][Uu][Hh]|[Cc][Ll][Aa][Mm][Aa][Vv]|[Aa][Pp][Pp][Aa][Rr][Mm][Oo][Rr])/))
    pivot_on:
    - host
    window: 2h
  - name: Log / audit / shell-history wiping on this host
    query: ((data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\/[Uu][Nn][Ll][Ii][Nn][Kk])/ AND data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy])/) OR (data_process_exec_process_binary:/.*\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*(--[Vv][Aa][Cc][Uu][Uu][Mm]|--[Rr][Oo][Tt][Aa][Tt][Ee])/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.* -[Dd].*/))
    pivot_on:
    - host
    window: 4h
  - name: C2 / reverse-shell / payload-staging tooling on this host
    query: ((data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/) OR (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR (data_process_exec_process_arguments:/.*([Ss][Oo][Cc][Kk][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt]|[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn])/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence establishment on this host (cron / systemd / new user / ssh keys)
    query: ((data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/) OR (data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd])/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.* [Ee][Nn][Aa][Bb][Ll][Ee] .*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/))
    pivot_on:
    - host
    window: 6h
