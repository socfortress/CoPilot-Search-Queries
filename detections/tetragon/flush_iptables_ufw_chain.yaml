name: Flush Iptables Ufw Chain
id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
version: 1
schema_version: "1.0"
date: "2023-01-18"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of iptables to flush all firewall rules, tables and chains and
  allow all network traffic. MITRE ATT&CK: T1686.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/iptables"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/xtables-legacy-multi"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/iptables-legacy-multi"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ip6tables"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ip6tables-legacy-multi"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-F*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-Z*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-X*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ufw-logging-deny*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ufw-logging-allow*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ufw6-logging-deny*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ufw6-logging-allow*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/iptables';
  data_process_exec_process_binary matches '*/xtables-legacy-multi';
  data_process_exec_process_binary matches '*/iptables-legacy-multi', among
  other conditions.

known_false_positives: >
  Network administrators. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://blogs.blackberry.com/
  - https://www.cyberciti.biz/tips/linux-iptables-how-to-flush-all-rules.html
  - https://twitter.com/Joseliyo_Jstnk/status/1620131033474822144
  - https://attack.mitre.org/techniques/T1686/

response:
  message: >
    Flush Iptables Ufw Chain detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1686
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1686
  custom_tags:
    - flush
    - iptables
    - chain
    - linux
    - tetragon
    - process_creation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Xx][Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii]/) AND (data_process_exec_process_arguments:/.*-[Ff].*/ OR data_process_exec_process_arguments:/.*-[Zz].*/ OR data_process_exec_process_arguments:/.*-[Xx].*/) AND (data_process_exec_process_arguments:/.*[Uu][Ff][Ww]-[Ll][Oo][Gg][Gg][Ii][Nn][Gg]-[Dd][Ee][Nn][Yy].*/ OR data_process_exec_process_arguments:/.*[Uu][Ff][Ww]-[Ll][Oo][Gg][Gg][Ii][Nn][Gg]-[Aa][Ll][Ll][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*[Uu][Ff][Ww]6-[Ll][Oo][Gg][Gg][Ii][Nn][Gg]-[Dd][Ee][Nn][Yy].*/ OR data_process_exec_process_arguments:/.*[Uu][Ff][Ww]6-[Ll][Oo][Gg][Gg][Ii][Nn][Gg]-[Aa][Ll][Ll][Oo][Ww].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Other executions of this tool-set on this host (any arguments)"
      query: 'data_process_exec_process_binary:/.*(\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]|\/[Xx][Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii]|\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii]|\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]|\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]-[Ll][Ee][Gg][Aa][Cc][Yy]-[Mm][Uu][Ll][Tt][Ii])/'
      pivot_on: [host]
      window: 2h
    - name: "Shell / interpreter execution on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/ OR data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/)'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
