name: Python Reverse Shell Execution Via PTY And Socket Modules
id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
version: 1
schema_version: "1.0"
date: "2024-11-04"
author: "@d4ns4n_, Nasreddine Bencherchali (Nextron Systems)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of python with calls to the socket and pty module in
  order to connect and spawn a potential reverse shell.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*python*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -c *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*import*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*pty*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*socket*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*spawn*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*.connect*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*python*';
  data_process_exec_process_arguments matches '* -c *';
  data_process_exec_process_arguments matches '*import*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.revshells.com/

response:
  message: >
    Python Reverse Shell Execution Via PTY And Socket Modules detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - python
    - reverse
    - shell
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*[Pp][Yy][Tt][Hh][Oo][Nn].*/ AND data_process_exec_process_arguments:/.* -[Cc] .*/ AND data_process_exec_process_arguments:/.*[Ii][Mm][Pp][Oo][Rr][Tt].*/ AND data_process_exec_process_arguments:/.*[Pp][Tt][Yy].*/ AND data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*/ AND data_process_exec_process_arguments:/.*[Ss][Pp][Aa][Ww][Nn].*/ AND data_process_exec_process_arguments:/.*\.[Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Shell / interpreter execution on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/) OR (data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/))'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling executed on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp]|\/[Cc][Hh][Ss][Hh]|\/[Nn][Ee][Ww][Gg][Rr][Pp])/'
      pivot_on: [host]
      window: 2h
