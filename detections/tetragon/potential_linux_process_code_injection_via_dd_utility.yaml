name: Potential Linux Process Code Injection Via DD Utility
id: 4cad6c64-d6df-42d6-8dae-eb78defdc415
version: 1
schema_version: "1.0"
date: "2023-12-01"
author: Joseph Kamau
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4cad6c64-d6df-42d6-8dae-eb78defdc415
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the injection of code by overwriting the memory map of a Linux process
  using the "dd" Linux command. MITRE ATT&CK: T1055.009.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/dd"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*of=*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*/proc/*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*/mem*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/dd';
  data_process_exec_process_arguments matches '*of=*';
  data_process_exec_process_arguments matches '*/proc/*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.aon.com/cyber-solutions/aon_cyber_labs/linux-based-inter-process-code-injection-without-ptrace2/
  - https://github.com/AonCyberLabs/Cexigua/blob/34d338620afae4c6335ba8d8d499e1d7d3d5d7b5/overwrite.sh
  - https://attack.mitre.org/techniques/T1055/009/

response:
  message: >
    Potential Linux Process Code Injection Via DD Utility detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1055.009
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055.009
  custom_tags:
    - injection
    - utility
    - linux
    - tetragon
    - process_creation
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Dd][Dd]/ AND data_process_exec_process_arguments:/.*[Oo][Ff]=.*/ AND data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*/ AND data_process_exec_process_arguments:/.*\/[Mm][Ee][Mm].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'Co-occurring fileless tradecraft: the operator who overwrites /proc/<pid>/mem with dd to run code without touching disk typically stages and launches the loader/shellcode from the RAM-backed /dev/shm first. Both are the same disk-avoiding, memory-resident evasion pattern on one host.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Precursor delivery: curl/wget pulling content into /tmp or /dev/shm and piping it to sh is how the injector script and the raw shellcode are fetched onto the host moments before the dd write into process memory.'
  - id: a015e032-146d-4717-8944-7a1884122111
    name: Linux HackTool Execution
    reason: 'Precursor tooling: msfvenom (in this rule''s binary list) generates the ELF/raw shellcode written into the victim''s memory, and pspy/linpeas are used to locate a target process and the privileges needed before injecting.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Entry/C2 context: /proc/mem injection is a manual, interactive step usually driven over the operator''s reverse shell. An nc -e/-c shell on the same host in the window marks the hands-on-keyboard foothold the injection ran from.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Follow-on anti-forensics: the technique is chosen for stealth, so the same operator commonly wipes /var/log with rm/shred/unlink afterward to erase traces of the session that performed the injection.'
  - id: 0326c3c8-7803-4a0f-8c5c-368f747f7c3e
    name: Triple Cross eBPF Rootkit Execve Hijack
    reason: 'Co-occurring sibling tradecraft: another ptrace-less, in-memory code-execution-hijack and privilege-escalation implant (eBPF). On the same host it signals an advanced operator layering process-memory injection with a kernel-level implant.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process memory-map and /proc/<pid>/mem access on this host
    query: ((data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Mm][Aa][Pp][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Mm][Ee][Mm].*/))
    pivot_on:
    - host
    window: 2h
  - name: Alternate process-injection vectors (gdb attach, /dev/mem, LD_PRELOAD) on this host
    query: ((data_process_exec_process_binary:/.*\/[Gg][Dd][Bb]/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Kk]?[Mm][Ee][Mm].*/) OR (data_process_exec_process_arguments:/.*[Ll][Dd]_[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/))
    pivot_on:
    - host
    window: 2h
  - name: Shellcode generation and raw-byte staging on this host
    query: ((data_process_exec_process_binary:/.*\/[Mm][Ss][Ff][Vv][Ee][Nn][Oo][Mm]/) OR (data_process_exec_process_arguments:/.*[Mm][Ss][Ff][Vv][Ee][Nn][Oo][Mm].*/) OR (data_process_exec_process_arguments:/.*[Ss][Hh][Ee][Ll][Ll][Cc][Oo][Dd][Ee].*/) OR (data_process_exec_process_binary:/.*\/[Xx][Xx][Dd]/) OR (data_process_exec_process_arguments:/.*[Xx][Xx][Dd] -[Rr].*/))
    pivot_on:
    - host
    window: 4h
  - name: Running-process enumeration to select an injection target on this host
    query: ((data_process_exec_process_binary:/.*\/[Pp][Ss][Pp][Yy].*/) OR (data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Cc][Mm][Dd][Ll][Ii][Nn][Ee].*/) OR (data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Ss][Tt][Aa][Tt][Uu][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Ee][Xx][Ee].*/))
    pivot_on:
    - host
    window: 2h
