name: Audit Rules Deleted Via Auditctl
id: bed26dea-4525-47f4-b24a-76e30e44ffb0
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Mohamed LAKRI
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bed26dea-4525-47f4-b24a-76e30e44ffb0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of 'auditctl' with the '-D' command line parameter,
  which deletes all configured audit rules and watches on Linux systems. This
  technique is commonly used by attackers to disable audit logging and cover
  their tracks by removing monitoring capabilities. Removal of audit rules can
  significantly impair detection of malicious activities on the affected system.
  MITRE ATT&CK: T1685.004.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/auditctl"
              case_insensitive: true
        - regexp:
            data_process_exec_process_arguments: ".*(-D).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/auditctl';
  data_process_exec_process_arguments matches the regex /.*(-D).*/.

known_false_positives: >
  An administrator troubleshooting. Investigate all attempts. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.atomicredteam.io/atomic-red-team/atomics/T1562.012
  - https://linux.die.net/man/8/auditct
  - https://attack.mitre.org/techniques/T1685/004/

response:
  message: >
    Audit Rules Deleted Via Auditctl detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1685.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.004
  custom_tags:
    - audit
    - rules
    - deleted
    - linux
    - tetragon
    - process_creation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*(-D).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Same hands-on-keyboard defense-impairment phase: an operator who wipes audit rules almost always also disables EDR/SELinux/firewalld on the host in the same minutes, so a co-occurring hit confirms deliberate blinding rather than one stray admin auditctl command.'
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: The natural next move after 'auditctl -D' is stopping the auditd service itself (systemctl/service stop auditd) to kill logging entirely; this rule catches that service teardown on the same host via Tetragon, which keeps seeing it after auditd is gone.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Cover-tracks follow-on: once auditing is off the attacker deletes /var/log files (rm/shred/unlink) to erase what was already recorded - the evidence-destruction half of the same anti-forensics act that began with deleting the audit rules.'
  - id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
    name: Syslog Clearing or Removal Via System Utilities
    reason: Attackers blind auditd and then purge syslog to remove the parallel record of their activity; emptying syslog in the same window as 'auditctl -D' indicates systematic removal of both logging channels on the host.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Operators who disable auditing routinely delete ~/.bash_history in the same interactive session to hide the exact commands they ran; a co-occurring history wipe places a live human attacker on the host, not an automated job.
  - id: 34979410-e4b5-4e5d-8cfb-389fdff05c12
    name: Remove Immutable File Attribute
    reason: chattr -i is the enabler that precedes tampering with protected files; near 'auditctl -D' it suggests the attacker is clearing the immutable flag on audit logs, authorized_keys or persistence files so they can be modified or wiped next.
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: 'Part of the same control takedown: flushing the iptables chains opens the host for inbound/outbound C2 and exfil while the audit blinding hides it, so flushing firewall rules alongside deleting audit rules signals a coordinated defense teardown.'
  - id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
    name: UFW Disable Attempt
    reason: Firewall-disable action on the ufw stack in the same defense-impairment phase; a host where both auditing and UFW are turned off is being cleared for follow-on tooling and egress, so this covers the ufw front-end where the iptables-flush rule covers raw netfilter.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Audit subsystem further disabled or reconfigured on this host
    query: (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*-[Ee] [012].*/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Gg][Ee][Nn][Rr][Uu][Ll][Ee][Ss]/) OR ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/) AND data_process_exec_process_arguments:/.*[Aa][Uu][Dd][Ii][Tt][Dd].*/) OR ((data_process_exec_process_binary:/.*\/[Vv][Ii]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]/ OR data_process_exec_process_binary:/.*\/[Nn][Aa][Nn][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Tt][Ee][Ee]/) AND data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Aa][Uu][Dd][Ii][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Audit and authentication logs truncated or overwritten on this host
    query: (data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]/ OR data_process_exec_process_binary:/.*\/[Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Tt][Ee][Ee]/ OR data_process_exec_process_binary:/.*\/[Cc][Pp]/) AND (data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Aa][Uu][Dd][Ii][Tt].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Ss][Ee][Cc][Uu][Rr][Ee].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Aa][Uu][Tt][Hh]\.[Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Ww][Tt][Mm][Pp].*/ OR data_process_exec_process_arguments:/.*[Bb][Tt][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: System logging daemons stopped or masked, or journal purged, on this host
    query: ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/) AND (data_process_exec_process_arguments:/.*[Rr][Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Ll][Oo][Gg]-[Nn][Gg].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Dd]-[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Dd].*/) AND (data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/ OR data_process_exec_process_arguments:/.*[Mm][Aa][Ss][Kk].*/ OR data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)) OR (data_process_exec_process_binary:/.*\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*--[Vv][Aa][Cc][Uu][Uu][Mm].*/)
    pivot_on:
    - host
    window: 2h
  - name: SELinux, AppArmor or EDR/security agents disabled on this host
    query: (data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]/ AND data_process_exec_process_arguments:/.*0.*/) OR (data_process_exec_process_binary:/.*\/[Aa][Aa]-[Dd][Ii][Ss][Aa][Bb][Ll][Ee]/ OR data_process_exec_process_binary:/.*\/[Aa][Aa]-[Cc][Oo][Mm][Pp][Ll][Aa][Ii][Nn]/ OR data_process_exec_process_binary:/.*\/[Aa][Aa]-[Tt][Ee][Aa][Rr][Dd][Oo][Ww][Nn]/) OR ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/) AND (data_process_exec_process_arguments:/.*[Oo][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR data_process_exec_process_arguments:/.*[Ff][Aa][Ll][Cc][Oo].*/ OR data_process_exec_process_arguments:/.*[Ww][Aa][Zz][Uu][Hh].*/ OR data_process_exec_process_arguments:/.*[Cc][Ll][Aa][Mm][Aa][Vv].*/ OR data_process_exec_process_arguments:/.*[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll].*/) AND (data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/ OR data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: Privilege escalation to root preceding this activity on this host
    query: data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/
    pivot_on:
    - host
    window: 2h
