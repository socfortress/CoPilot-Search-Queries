  - https://github.com/nasbench/Misc-Research/blob/2f651ede832ab34027a7ba005b63bb78f1ade378/Other/React-Next-Child-Processes-Notes.md
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1190/

response:
  message: >
    Linux Suspicious Child Process from Node.js - React2Shell detected on host
    $agent_name$. Matched data_process_exec_parent_binary:
    $data_process_exec_parent_binary$. Matched
    data_process_exec_parent_arguments: $data_process_exec_parent_arguments$.
    MITRE ATT&CK: T1059, T1190
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_parent_arguments
      type: other

