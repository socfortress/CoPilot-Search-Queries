description: >
  Detects suspicious child processes spawned from Node.js server processes on
  Linux systems, potentially indicating remote code execution exploitation such
  as CVE-2025-55182 (React2Shell). This rule particularly looks for exploitation
  of vulnerability on Node.js Servers where attackers abuse Node.js
  child_process module to execute arbitrary system commands. When execSync() or
  exec() is used, the command line often includes a shell invocation followed by
  suspicious commands or scripts (e.g., /bin/sh -c <malicious-command>). For
  other methods, the Image field will show the spawned process directly. MITRE
  ATT&CK: T1059, T1190.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_parent_binary:
              value: "*/node"
              case_insensitive: true
        - bool:
