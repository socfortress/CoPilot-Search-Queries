name: User Added To Root/Sudoers Group Using Usermod
id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
version: 1
schema_version: "1.0"
date: "2022-12-21"
author: TuanLe (GTSC)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "usermod" binary to add users add users to the root or
  suoders groups.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/usermod"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-aG root*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-aG sudoers*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/usermod';
  data_process_exec_process_arguments matches '*-aG root*';
  data_process_exec_process_arguments matches '*-aG sudoers*'.

known_false_positives: >
  Legitimate administrator activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://pberba.github.io/security/2021/11/23/linux-threat-hunting-for-persistence-account-creation-manipulation/
  - https://www.configserverfirewall.com/ubuntu-linux/ubuntu-add-user-to-root-group/

response:
  message: >
    User Added To Root/Sudoers Group Using Usermod detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - added
    - sudoers
    - group
    - linux
    - tetragon
    - process_creation
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]/ AND (data_process_exec_process_arguments:/.*-[Aa][Gg] [Rr][Oo][Oo][Tt].*/ OR data_process_exec_process_arguments:/.*-[Aa][Gg] [Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
    name: Creation Of An User Account
    reason: 'Textbook precursor: the useradd/ADD_USER this rule catches creates the very account that is then elevated with usermod -aG sudo/root. Create-then-elevate on one host is the canonical malicious-account persistence sequence (T1136.001 then T1098), so it firing just before confirms the sudo grant targeted an attacker-controlled account rather than an existing admin.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Precursor reconnaissance: reading /etc/sudoers enumerates who already holds sudo and which group grants it - exactly what an attacker checks before adding their account to root/sudo. That rule''s own correlation already names this usermod grant as its follow-on, so the two are a vetted enumerate-then-grant pair on the same host.'
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: 'Sibling privilege-grant by the other mechanism: instead of (or alongside) group membership the attacker edits /etc/sudoers or sudoers.d or adds a NOPASSWD line. Both yield durable sudo for a controlled account, so this firing on the same host in-window widens an isolated usermod into deliberate sudo-config tampering.'
  - id: linux-visudo-utility-execution-001
    name: Linux Visudo Utility Execution
    reason: 'Sibling privilege-grant: visudo editing /etc/sudoers around the group change is the direct-edit counterpart to usermod -aG sudo. Attackers commonly do both - add the account to the group and drop an explicit/NOPASSWD sudoers entry - so visudo on the same host corroborates intentional sudo configuration tampering, not a one-off group fix.'
  - id: 8a46f16c-8c4c-82d1-b121-0fdd3ba70a84
    name: Group Has Been Deleted Via Groupdel
    reason: 'Same account/group-manipulation actor: groupdel is run by someone reshaping group membership and privileges with root, and the groupdel detection itself flags prior root/sudoers usermod tampering as evidence of exactly this actor. Co-firing shows a privileged account-management spree rather than a single benign command.'
  - id: 08f26069-6f80-474b-8d1f-d971c6fedea0
    name: User Has Been Deleted Via Userdel
    reason: 'Co-occurring account manipulation: having granted a controlled account sudo, the actor often uses that root access to remove or reshape other accounts (lock out admins, delete the staging user after elevation). userdel on the same host in-window corroborates a deliberate account-control operation (T1098/T1531).'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Local account and group management tooling on this host
    query: data_process_exec_process_binary:/.*\/([Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Uu][Ss][Ee][Rr][Dd][Ee][Ll]|[Dd][Ee][Ll][Uu][Ss][Ee][Rr]|[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|[Gg][Rr][Oo][Uu][Pp][Mm][Oo][Dd]|[Gg][Rr][Oo][Uu][Pp][Dd][Ee][Ll]|[Gg][Pp][Aa][Ss][Ss][Ww][Dd]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Aa][Gg][Ee]|[Nn][Ee][Ww][Uu][Ss][Ee][Rr][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Sudoers or privileged-group modification on this host
    query: ((data_process_exec_process_binary:/.*\/[Vv][Ii][Ss][Uu][Dd][Oo]/) OR (data_process_exec_process_binary:/.*\/[Gg][Pp][Aa][Ss][Ss][Ww][Dd]/ AND data_process_exec_process_arguments:/.*([Ss][Uu][Dd][Oo]|[Ww][Hh][Ee][Ee][Ll]|[Rr][Oo][Oo][Tt]).*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/) OR (data_process_exec_process_arguments:/.*[Nn][Oo][Pp][Aa][Ss][Ss][Ww][Dd].*/))
    pivot_on:
    - host
    window: 2h
  - name: Alternative privilege-escalation abuse on this host
    query: ((data_process_exec_process_binary:/.*\/([Pp][Kk][Ee][Xx][Ee][Cc]|[Dd][Oo][Aa][Ss]|[Ss][Ee][Tt][Cc][Aa][Pp])/) OR (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*-[Uu]#.*/) OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*[Uu]\+[Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Post-escalation persistence (cron, systemd, SSH keys, shell profiles) on this host
    query: ((data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Aa][Tt])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/))
    pivot_on:
    - host
    window: 4h
  - name: 'Defense evasion: audit, log and service tampering on this host'
    query: ((data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*-[Dd].*/) OR (data_process_exec_process_binary:/.*\/([Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee])/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]).*/) OR (data_process_exec_process_binary:/.*\/[Ss][Hh][Rr][Ee][Dd]/) OR (data_process_exec_process_arguments:/.*(\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/).*/))
    pivot_on:
    - host
    window: 4h
