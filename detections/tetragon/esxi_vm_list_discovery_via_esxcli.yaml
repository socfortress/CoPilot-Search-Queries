name: ESXi VM List Discovery Via ESXCLI
id: 5f1573a7-363b-4114-9208-ad7a61de46eb
version: 1
schema_version: "1.0"
date: "2023-09-04"
author: Cedric Maurugeon
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5f1573a7-363b-4114-9208-ad7a61de46eb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "esxcli" command with the "vm" flag in order to
  retrieve information about the installed VMs. MITRE ATT&CK: T1033, T1007,
  T1059.012.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/esxcli"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*vm process*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* list"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/esxcli';
  data_process_exec_process_arguments matches '*vm process*';
  data_process_exec_process_arguments matches '* list'.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.crowdstrike.com/blog/hypervisor-jackpotting-ecrime-actors-increase-targeting-of-esxi-servers/
  - https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_vm.html
  - https://www.secuinfra.com/en/techtalk/hide-your-hypervisor-analysis-of-esxiargs-ransomware/
  - https://www.trendmicro.com/en_us/research/22/e/new-linux-based-ransomware-cheerscrypt-targets-exsi-devices.html
  - https://attack.mitre.org/techniques/T1033/
  - https://attack.mitre.org/techniques/T1007/
  - https://attack.mitre.org/techniques/T1059/012/

response:
  message: >
    ESXi VM List Discovery Via ESXCLI detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1033, T1007, T1059.012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
    - T1007
    - T1059.012
  custom_tags:
    - esxcli
    - linux
    - tetragon
    - process_creation
    - discovery
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_process_exec_process_arguments:/.* [Ll][Ii][Ss][Tt]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
    name: ESXi VM Kill Via ESXCLI
    reason: 'Direct follow-on impact: the VM/World IDs harvested by ''esxcli vm process list'' are the exact input to ''esxcli vm process kill''. ESXi ransomware lists running VMs to get their IDs, then kills them to release the locks on the VMDK/VMX files before encrypting. List immediately preceding kill on the same host is the ransomware signature.'
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: 'Co-occurring pre-encryption survey: enumerates the datastores/volumes that physically hold the VMDK files the operator is about to kill and encrypt. Running alongside the VM inventory, it scopes the impact targets on the same host in the same hands-on session.'
  - id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
    name: ESXi System Information Discovery Via ESXCLI
    reason: 'Co-occurring discovery burst on the same host: the operator confirms host build/version and that they are on an ESXi hypervisor (not a guest) to tailor the encryptor, firing from the same interactive esxcli session that produced the VM list.'
  - id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
    name: ESXi Network Configuration Discovery Via ESXCLI
    reason: Co-occurring hands-on-keyboard enumeration via the same esxcli binary on the same host; part of the single pre-impact survey of the hypervisor that bundles VM, storage, network and VSAN discovery together.
  - id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
    name: ESXi VSAN Information Discovery Via ESXCLI
    reason: 'Co-occurring survey: enumerates vSAN distributed storage where clustered VM files reside, completing the datastore picture alongside the VM list so the encryptor can reach every VMDK across the cluster.'
  - id: 38eb1dbb-011f-40b1-a126-cf03a0210563
    name: ESXi Syslog Configuration Change Via ESXCLI
    reason: 'Defense-evasion precursor to impact: the operator redirects or disables ESXi syslog to blind logging before killing and encrypting VMs. Firing on the same host around the VM listing marks the transition from reconnaissance to hiding the attack.'
  - id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
    name: ESXi Account Creation Via ESXCLI
    reason: 'Persistence in the same intrusion: a backdoor local ESXi account (''esxcli system account add'') is created on the same host so the operator retains hypervisor access through and after the attack. Account creation plus VM discovery via esxcli is classic ESXi-ransomware staging.'
  - id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
    name: ESXi Admin Permission Assigned To Account Via ESXCLI
    reason: 'Directly follows backdoor account creation: grants the newly created account the Admin role on the ESXi host, giving the operator full control to kill and encrypt VMs. Same operator, same esxcli session as the VM discovery.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ESXi VM kill / power-off on this host (impact follow-on)
    query: (data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss].*[Kk][Ii][Ll][Ll].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*[Pp][Oo][Ww][Ee][Rr]\.[Oo][Ff][Ff].*/)
    pivot_on:
    - host
    window: 2h
  - name: vim-cmd VM enumeration / snapshot removal on this host (alternate toolset, anti-recovery)
    query: data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*([Gg][Ee][Tt][Aa][Ll][Ll][Vv][Mm][Ss]|[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt]\.[Rr][Ee][Mm][Oo][Vv][Ee]).*/
    pivot_on:
    - host
    window: 2h
  - name: Datastore / VM disk + config file access on this host (encryption-impact telemetry)
    query: data_process_exec_process_arguments:/.*(\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss]|\.[Vv][Mm][Dd][Kk]|\.[Vv][Mm][Xx]|\.[Vv][Mm][Ss][Nn]|\.[Vv][Ss][Ww][Pp]|\.[Nn][Vv][Rr][Aa][Mm]).*/
    pivot_on:
    - host
    window: 4h
  - name: ESXi firewall disable / SSH service enablement on this host (access + evasion)
    query: ((data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk] [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Ss][Ee][Tt].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*[Ee][Nn][Aa][Bb][Ll][Ee]_[Ss][Ss][Hh].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/[Ss][Ss][Hh].*/))
    pivot_on:
    - host
    window: 4h
  - name: Ransomware encryptor execution on this host (openssl enc, or binary run from /tmp or datastore)
    query: ((data_process_exec_process_binary:/.*\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]/ AND data_process_exec_process_arguments:/.* [Ee][Nn][Cc] .*/) OR (data_process_exec_process_binary:/(\/[Tt][Mm][Pp]\/|\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss]\/).*/))
    pivot_on:
    - host
    window: 4h
