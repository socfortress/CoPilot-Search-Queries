name: Suspicious Package Installed - Linux
id: 700fb7e8-2981-401c-8430-be58e189e741
version: 1
schema_version: "1.0"
date: "2026-01-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 700fb7e8-2981-401c-8430-be58e189e741
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects installation of suspicious packages using system installation
  utilities. MITRE ATT&CK: T1553.004.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/apt"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/apt-get"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*install*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/yum"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "*localinstall*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "*install*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/rpm"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*-i*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/dpkg"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "*--install*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "*-i*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*nmap*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* nc*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*netcat*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*wireshark*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*tshark*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*openconnect*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*proxychains*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*socat*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/apt';
  data_process_exec_process_binary matches '*/apt-get';
  data_process_exec_process_arguments matches '*install*', among other
  conditions.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://gist.githubusercontent.com/MichaelKoczwara/12faba9c061c12b5814b711166de8c2f/raw/e2068486692897b620c25fde1ea258c8218fe3d3/history.txt
  - https://attack.mitre.org/techniques/T1553/004/

response:
  message: >
    Suspicious Package Installed - Linux detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1553.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.004
  custom_tags:
    - package
    - installed
    - linux
    - tetragon
    - process_creation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_process_exec_process_binary:/.*\/[Aa][Pp][Tt]/ OR data_process_exec_process_binary:/.*\/[Aa][Pp][Tt]-[Gg][Ee][Tt]/) AND data_process_exec_process_arguments:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/) OR (data_process_exec_process_binary:/.*\/[Yy][Uu][Mm]/ AND (data_process_exec_process_arguments:/.*[Ll][Oo][Cc][Aa][Ll][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_process_exec_process_arguments:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/)) OR (data_process_exec_process_binary:/.*\/[Rr][Pp][Mm]/ AND data_process_exec_process_arguments:/.*-[Ii].*/) OR (data_process_exec_process_binary:/.*\/[Dd][Pp][Kk][Gg]/ AND (data_process_exec_process_arguments:/.*--[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_process_exec_process_arguments:/.*-[Ii].*/))) AND (data_process_exec_process_arguments:/.*[Nn][Mm][Aa][Pp].*/ OR data_process_exec_process_arguments:/.* [Nn][Cc].*/ OR data_process_exec_process_arguments:/.*[Nn][Ee][Tt][Cc][Aa][Tt].*/ OR data_process_exec_process_arguments:/.*[Ww][Ii][Rr][Ee][Ss][Hh][Aa][Rr][Kk].*/ OR data_process_exec_process_arguments:/.*[Tt][Ss][Hh][Aa][Rr][Kk].*/ OR data_process_exec_process_arguments:/.*[Oo][Pp][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ OR data_process_exec_process_arguments:/.*[Pp][Rr][Oo][Xx][Yy][Cc][Hh][Aa][Ii][Nn][Ss].*/ OR data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Aa][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: Netcat is one of the exact packages this rule catches being installed; the textbook next move is `nc -e /bin/bash <ip> <port>` to open the reverse/bind shell, so an nc shell on the same host right after the install turns a tool drop into live C2.
  - id: a015e032-146d-4717-8944-7a1884122111
    name: Linux HackTool Execution
    reason: 'Confirms the host is now operated as an attack platform: once the actor has apt/yum-installed dual-use net tooling they run named offensive tools (naabu, netdiscover, autorecon, ncrack, hydra, sqlmap) - several are scanners equivalent to the nmap this rule saw installed, so a hit here is the installed arsenal being put to use.'
  - id: 97de11cd-4b67-4abf-9a8b-1020e670aa9e
    name: Pnscan Binary Data Transmission Activity
    reason: Network discovery is the main reason to install nmap; this catches a scanner actively sweeping/transmitting across the network (TeamTNT-style worming) by its argument pattern, corroborating that the just-installed scanning tooling is mapping/attacking internal hosts for lateral movement.
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: Freshly-installed nc/socat listeners, proxychains pivots and nmap scans only work if the host firewall is out of the way; flushing iptables/ip6tables (`-F` on the ufw chains) right after the install is the enabling step that opens inbound/outbound paths for the new tooling.
  - id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
    name: UFW Disable Attempt
    reason: 'Same enabling move via a different utility: `ufw disable` tears down host packet filtering so the reverse shells, tunnels and scanners these packages provide can reach the network - installing net tools then disabling ufw is a tight back-to-back pair.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Co-occurring staging: hands-on-keyboard actors arm a box with both the distro package manager (this rule) and curl/wget pulls of custom implants/stagers into /tmp or /dev/shm, so a download-and-run on the same host in the window widens a single install into a full tooling drop.'
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Likely foothold/precursor: on internet-facing Linux the shell that runs `apt install nmap/nc` is frequently a child of a web server (webshell) - this rule''s own reference is a captured attacker history from such a compromise, so a webshell sub-process before the install is how the operator got the privileged shell.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Anti-forensics follow-on: after arming the host the operator wipes /var/log and shell history to hide the package install and everything run with the new tools, so log-clearing on the same host closes the hands-on-keyboard session this rule opened.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Installed offensive network/recon tools executed on this host
    query: data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Nn][Mm][Aa][Pp]|\/[Mm][Aa][Ss][Ss][Cc][Aa][Nn]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Pp][Rr][Oo][Xx][Yy][Cc][Hh][Aa][Ii][Nn][Ss]|\/[Pp][Rr][Oo][Xx][Yy][Cc][Hh][Aa][Ii][Nn][Ss]4|\/[Tt][Ss][Hh][Aa][Rr][Kk]|\/[Ww][Ii][Rr][Ee][Ss][Hh][Aa][Rr][Kk]|\/[Dd][Uu][Mm][Pp][Cc][Aa][Pp]|\/[Tt][Cc][Pp][Dd][Uu][Mm][Pp]|\/[Oo][Pp][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|\/[Hh][Pp][Ii][Nn][Gg]3)/
    pivot_on:
    - host
    window: 4h
  - name: Reverse shell / tunnel / relay establishment on this host
    query: ((data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/ AND data_process_exec_process_arguments:/.*( -[Ee] | -[Cc] |[Ee][Xx][Ee][Cc]:|[Tt][Cc][Pp]-[Ll][Ii][Ss][Tt][Ee][Nn]).*/) OR (data_process_exec_process_arguments:/.*(\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/|\/[Dd][Ee][Vv]\/[Uu][Dd][Pp]\/|[Mm][Kk][Ff][Ii][Ff][Oo]).*/))
    pivot_on:
    - host
    window: 4h
  - name: Host firewall / packet filter flushed or disabled on this host
    query: ((data_process_exec_process_binary:/.*(\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]|\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]|\/[Nn][Ff][Tt]|\/[Nn][Ff][Tt][Aa][Bb][Ll][Ee][Ss])/ AND data_process_exec_process_arguments:/.*(-[Ff]|[Ff][Ll][Uu][Ss][Hh]).*/) OR (data_process_exec_process_binary:/.*\/[Uu][Ff][Ww]/ AND data_process_exec_process_arguments:/.*([Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Rr][Ee][Ss][Ee][Tt]).*/) OR (data_process_exec_process_binary:/.*\/[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]-[Cc][Mm][Dd]/))
    pivot_on:
    - host
    window: 2h
  - name: Payload download and staging via curl/wget into tmp or dev-shm on this host
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*(\/[Tt][Mm][Pp]\/|\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]|\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Log and shell-history clearing on this host
    query: (data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\/[Uu][Nn][Ll][Ii][Nn][Kk])/ AND data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|[Ww][Tt][Mm][Pp]|[Aa][Uu][Tt][Hh]\.[Ll][Oo][Gg]|[Ss][Yy][Ss][Ll][Oo][Gg]).*/)
    pivot_on:
    - host
    window: 4h
