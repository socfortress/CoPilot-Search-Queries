name: ESXi Admin Permission Assigned To Account Via ESXCLI
id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
version: 1
schema_version: "1.0"
date: "2023-09-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "esxcli" command with the "system" and "permission"
  flags in order to assign admin permissions to an account. MITRE ATT&CK:
  T1059.012, T1098.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/esxcli"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*system*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* permission *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* set*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*Admin*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/esxcli';
  data_process_exec_process_arguments matches '*system*';
  data_process_exec_process_arguments matches '* permission *', among other
  conditions.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_system.html
  - https://attack.mitre.org/techniques/T1059/012/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    ESXi Admin Permission Assigned To Account Via ESXCLI detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1059.012, T1098
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.012
    - T1098
  custom_tags:
    - admin
    - permission
    - assigned
    - linux
    - tetragon
    - process_creation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND data_process_exec_process_arguments:/.* [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] .*/ AND data_process_exec_process_arguments:/.* [Ss][Ee][Tt].*/ AND data_process_exec_process_arguments:/.*[Aa][Dd][Mm][Ii][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
    name: ESXi Account Creation Via ESXCLI
    reason: 'Direct companion: ''esxcli system account add'' plants the account that THIS rule''s ''esxcli system permission set'' then grants the Admin role to. Together they are the two halves of a persistent admin backdoor on the hypervisor and typically fire seconds apart on the same host.'
  - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
    name: ESXi VM Kill Via ESXCLI
    reason: 'Follow-on impact: once admin on the host is secured, ''esxcli vm process kill'' force-stops running VMs to release datastore file locks, the hallmark pre-encryption step of ESXi ransomware (ESXiArgs, Cheerscrypt). Its presence after this grant signals the attack has moved to Impact.'
  - id: 38eb1dbb-011f-40b1-a126-cf03a0210563
    name: ESXi Syslog Configuration Change Via ESXCLI
    reason: 'Co-occurring defense evasion: ''esxcli system syslog config set'' redirects or disables host logging to hide the account/permission tampering and later VM kills. Attackers blind the host in the same hands-on session as the privilege grant.'
  - id: 5f1573a7-363b-4114-9208-ad7a61de46eb
    name: ESXi VM List Discovery Via ESXCLI
    reason: 'Target-selection recon: ''esxcli vm process list'' enumerates the running VMs the attacker will kill and encrypt, usually run immediately before VM Kill and within the same esxcli session that grants admin.'
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: 'Precursor recon on the same host: enumerates datastores / VMFS volumes to locate the VM storage the encryptor will target. Finding the datastore is a required step before deploying an ESXi encryptor.'
  - id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
    name: ESXi System Information Discovery Via ESXCLI
    reason: 'Precursor recon on the same host: profiles the ESXi build/version/UUID to confirm the target and pick the right exploit or encryptor variant. A typical opening move of a hands-on ESXi intrusion that surrounds the admin grant.'
  - id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
    name: ESXi Network Configuration Discovery Via ESXCLI
    reason: 'Precursor recon on the same host: maps VMkernel / management interfaces and firewall posture during the same enumeration phase in which the attacker grants themselves admin.'
  - id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
    name: ESXi VSAN Information Discovery Via ESXCLI
    reason: 'Precursor recon on the same host: enumerates vSAN cluster/datastore layout to locate clustered VM storage to encrypt, part of the same esxcli enumeration burst that accompanies the privilege grant.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ESXi hypervisor management tooling (esxcli / vim-cmd / esxcfg / vmkfstools) on this host
    query: data_process_exec_process_binary:/.*\/([Ee][Ss][Xx][Cc][Ll][Ii]|[Vv][Ii][Mm]-[Cc][Mm][Dd]|[Ee][Ss][Xx][Cc][Ff][Gg]-.*|[Vv][Mm][Kk][Ff][Ss][Tt][Oo][Oo][Ll][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: ESXi account and permission administration via esxcli on this host
    query: (data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND (data_process_exec_process_arguments:/.*[Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_process_exec_process_arguments:/.*[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/))
    pivot_on:
    - host
    window: 4h
  - name: ESXi VM power-off / kill and snapshot / datastore manipulation on this host
    query: ((data_process_exec_process_arguments:/.*[Pp][Oo][Ww][Ee][Rr]\.[Oo][Ff][Ff].*/) OR (data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Kk][Ii][Ll][Ll].*/) OR (data_process_exec_process_arguments:/.*[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Mm][Kk][Ff][Ss][Tt][Oo][Oo][Ll][Ss]/))
    pivot_on:
    - host
    window: 4h
  - name: ESXi security-control tampering (SSH / ESXi shell enable, firewall, lockdown) on this host
    query: ((data_process_exec_process_arguments:/.*[Ee][Nn][Aa][Bb][Ll][Ee]_[Ss][Ss][Hh].*/) OR (data_process_exec_process_arguments:/.*[Ee][Nn][Aa][Bb][Ll][Ee]_[Ee][Ss][Xx]_[Ss][Hh][Ee][Ll][Ll].*/) OR (data_process_exec_process_arguments:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/) OR (data_process_exec_process_arguments:/.*[Ll][Oo][Cc][Kk][Dd][Oo][Ww][Nn].*/))
    pivot_on:
    - host
    window: 6h
  - name: Ingress tool transfer / payload staging on this host (encryptor delivery)
    query: data_process_exec_process_binary:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Ss][Cc][Pp]|[Tt][Ff][Tt][Pp]|[Ff][Tt][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 6h
