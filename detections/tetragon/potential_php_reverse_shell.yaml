name: Potential PHP Reverse Shell
id: c6714a24-d7d5-4283-a36b-3ffd091d5f7e
version: 1
schema_version: "1.0"
date: "2023-04-07"
author: "@d4ns4n_"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c6714a24-d7d5-4283-a36b-3ffd091d5f7e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the PHP CLI with the "-r" flag which allows it to run inline
  PHP code. The rule looks for calls to the "fsockopen" function which allows
  the creation of sockets. Attackers often leverage this in combination with
  functions such as "exec" or "fopen" to initiate a reverse shell connection.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/php*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -r *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*fsockopen*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*bsh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*csh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*ksh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*pdksh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*tcsh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*zsh*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/php*';
  data_process_exec_process_arguments matches '* -r *';
  data_process_exec_process_arguments matches '*fsockopen*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
  - https://www.revshells.com/

response:
  message: >
    Potential PHP Reverse Shell detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - reverse
    - shell
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Pp][Hh][Pp].*/ AND data_process_exec_process_arguments:/.* -[Rr] .*/ AND data_process_exec_process_arguments:/.*[Ff][Ss][Oo][Cc][Kk][Oo][Pp][Ee][Nn].*/ AND (data_process_exec_process_arguments:/.*[Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Bb][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Cc][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Pp][Dd][Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Tt][Cc][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Zz][Ss][Hh].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Entry vector: a php -r fsockopen reverse shell is almost always launched from a compromised web app. This rule fires when httpd/nginx/apache/php-fpm spawns a child process on the same host, pinpointing the webshell or RCE that kicked off the one-liner.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: Sibling call-back from the same reverse-shell cheat sheets this rule cites (pentestmonkey/revshells); operators fire several one-liners until one connects, so nc -e /bin/sh on the same host in the window corroborates an active reverse-shell attempt.
  - id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
    name: Inline Python Execution - Spawn Shell Via OS System Library
    reason: 'Direct analog in another interpreter: inline code (python -c os.system) spawning a shell instead of php -r fsockopen. The same operator commonly tries the Python variant on the same host while probing which interpreter yields a working shell.'
  - id: c4042d54-110d-45dd-a0e1-05c47822c937
    name: Python Spawning Pretty TTY Via PTY Module
    reason: 'Canonical immediate next step: a php fsockopen+exec shell is dumb and non-interactive, so operators run python -c import pty;pty.spawn(bash) to upgrade it to a full interactive TTY. Expect this on the same host seconds to minutes after the alert.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: The reverse shell hands the operator an interactive bash -i; this rule fires on that bash spawning uncommon children (base64, python import, etc.) i.e. the hands-on-keyboard commands run through the reverse shell on the same host.
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: First action once the call-back shell is live is host and privilege reconnaissance (find -perm -4000 SUID hunting, .htpasswd/credential files); its presence on the same host confirms a live operator exploring the foothold the php shell opened.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: A web-user reverse shell is only a staging foothold; operators then pull next-stage tooling (enum scripts, implants) with curl/wget into /tmp or /dev/shm and run it, escalating the php shell from bare access to active tooling on the same host.
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: The php shell usually runs as the low-privileged web user (www-data); reading /etc/sudoers to enumerate who can sudo is a top first privilege-escalation check, so this on the same host is the expected next move after the foothold.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by the web stack on this host (webshell command chain)
    query: data_process_exec_parent_binary:/.*\/([Aa][Pp][Aa][Cc][Hh][Ee]2|[Hh][Tt][Tt][Pp][Dd]|[Nn][Gg][Ii][Nn][Xx]|[Ll][Ii][Gg][Hh][Tt][Tt][Pp][Dd]|[Pp][Hh][Pp]-[Ff][Pp][Mm].*|[Pp][Hh][Pp])/
    pivot_on:
    - host
    window: 2h
  - name: Any interpreter opening a reverse-shell network primitive on this host
    query: data_process_exec_process_arguments:/.*([Ff][Ss][Oo][Cc][Kk][Oo][Pp][Ee][Nn]|[Ss][Oo][Cc][Kk][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt]|[Ii][Oo]::[Ss][Oo][Cc][Kk][Ee][Tt]|\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/).*/
    pivot_on:
    - host
    window: 1h
  - name: Post-foothold recon and privilege-check burst on this host
    query: data_process_exec_process_binary:/.*\/([Ww][Hh][Oo][Aa][Mm][Ii]|[Ii][Dd]|[Uu][Nn][Aa][Mm][Ee]|[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|[Ii][Pp]|[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Ss][Ss]|[Aa][Rr][Pp]|[Ss][Uu][Dd][Oo])/
    pivot_on:
    - host
    window: 1h
  - name: Access to credential and sensitive files through the shell on this host
    query: data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd]|\.[Ss][Ss][Hh]\/|[Ii][Dd]_[Rr][Ss][Aa]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]).*/
    pivot_on:
    - host
    window: 4h
  - name: Persistence via cron / systemd / authorized_keys / rc on this host
    query: ((data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Aa][Tt])/) OR (data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|\.[Bb][Aa][Ss][Hh][Rr][Cc]).*/))
    pivot_on:
    - host
    window: 6h
