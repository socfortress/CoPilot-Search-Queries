name: Shai-Hulud Malicious Bun Execution - Linux
id: eb827bbd-670a-4d58-8446-c464d8ac2323
version: 1
schema_version: "1.0"
date: "2025-11-25"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eb827bbd-670a-4d58-8446-c464d8ac2323
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of `bun_environment.js` via the Bun runtime, a behavior
  associated with the Shai-Hulud "Second Coming" NPM supply chain attack. The
  malware uses a `setup_bun.js` script to install the Bun runtime if not
  present, and then executes the malicious `bun_environment.js` payload. MITRE
  ATT&CK: T1195.002, T1203.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_parent_binary:
              value: "*/node"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/bun"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "*bun_environment.js*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "*https://github.com/actions/runner/releases/download/v2.330.0*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*curl *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*-fsSL*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*https://bun.sh/install*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*bash*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*bash -c \"source *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*&& echo*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/node';
  data_process_exec_process_binary matches '*/bun';
  data_process_exec_process_arguments matches '*bun_environment.js*', among
  other conditions.

known_false_positives: >
  Legitimate but uncommon use of files named `bun_environment.js` could trigger
  this rule. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.aikido.dev/blog/shai-hulud-strikes-again-hitting-zapier-ensdomains
  - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
  - https://github.com/asyncapi/cli/blob/2efa4dff59bc3d3cecdf897ccf178f99b115d63d/setup_bun.js
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1203/

response:
  message: >
    Shai-Hulud Malicious Bun Execution - Linux detected on host $agent_name$.
    Matched data_process_exec_parent_binary: $data_process_exec_parent_binary$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. MITRE ATT&CK: T1195.002, T1203
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1195.002
    - T1203
  custom_tags:
    - hulud
    - linux
    - tetragon
    - process_creation
    - execution
    - initial_access
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ AND ((data_process_exec_process_binary:/.*\/[Bb][Uu][Nn]/ AND (data_process_exec_process_arguments:/.*[Bb][Uu][Nn]_[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\.[Jj][Ss].*/ OR data_process_exec_process_arguments:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]\/[Aa][Cc][Tt][Ii][Oo][Nn][Ss]\/[Rr][Uu][Nn][Nn][Ee][Rr]\/[Rr][Ee][Ll][Ee][Aa][Ss][Ee][Ss]\/[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]\/[Vv]2\.330\.0.*/)) OR (data_process_exec_process_arguments:/.*[Cc][Uu][Rr][Ll] .*/ AND data_process_exec_process_arguments:/.*-[Ff][Ss][Ss][Ll].*/ AND data_process_exec_process_arguments:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/[Bb][Uu][Nn]\.[Ss][Hh]\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ AND data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh].*/) OR (data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh] -[Cc] \"[Ss][Oo][Uu][Rr][Cc][Ee] .*/ AND data_process_exec_process_arguments:/.*\&\& [Ee][Cc][Hh][Oo].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 11bb9b26-4179-4a06-afcb-1ec31fce1627
    name: Shai-Hulud Malware Indicators - Linux
    reason: 'Same malware, same host: once bun_environment.js runs, the worm''s other command-line fingerprints (''shai-hulud''/''sha1hulud'' strings in created repo names, branches and workflow files) appear in process arguments. A concurrent hit is near-definitive confirmation this is Shai-Hulud, not a benign bun_environment.js.'
  - id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
    name: Script Interpreter Spawning Credential Scanner - Linux
    reason: 'The direct next action of the payload: bun/node spawns TruffleHog/Gitleaks to harvest secrets. This rule keys on exactly that node|bun parent -> credential-scanner child chain and explicitly names the ''Second Coming'' campaign, so it should fire minutes after this one on the same host.'
  - id: d7a650c4-226c-451e-948f-cc490db506aa
    name: PUA - TruffleHog Execution - Linux
    reason: 'Second detection angle on the same credential-theft step: TruffleHog run with --results=verified regardless of parent process. Catches the harvest when bun spawns it via an intermediate shell (so the parent is not node/bun), which the parent-anchored scanner rule would miss; documented as observed in the Shai-Hulud campaign.'
  - id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
    name: Shai-Hulud NPM Package Malicious Exfiltration via Curl
    reason: 'The exfiltration stage of this exact campaign: after secrets are collected the payload curls them (curl -d) to an attacker webhook.site endpoint. Same host, same incident - this rule confirms stolen data left the box, which escalates severity and scopes blast radius.'
  - id: 3c6f5e4a-8d0b-6abc-d9e2-4f7a6b8c9d0e
    name: TanStack Supply-Chain Attack Execution Indicators - Linux
    reason: Sibling Shai-Hulud variant using the identical delivery mechanism - an npm pre/postinstall hook that downloads and runs the Bun runtime to execute the payload. A host that pulls one poisoned package often pulls others in the same wave, so both firing points to a single npm supply-chain compromise to triage together.
  - id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
    name: Axios NPM Compromise Indicators - Linux
    reason: 'Same initial-access vector and parent context: a malicious npm postinstall dropper with a node/bun parent that curls a payload and runs it detached. Co-occurrence confirms the host is executing untrusted npm lifecycle scripts, the precondition that led to this Bun execution.'
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: 'Generalises the exfil/credential-theft follow-on beyond the single webhook IOC: curl with -d/--form/--upload-file or requests touching AWS credential files. Shai-Hulud steals cloud tokens and pushes them out, so this flags the outbound leg even when the destination differs from the known webhook.site IOC.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Second-stage staging: the payload fetches further components (the setup_bun.js install step, the GitHub Actions runner it drops for persistence, helper tooling) with curl/wget into tmp/shm and executes them. A hit here on the same host places the fetch-and-run stager alongside this execution in the kill chain.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential scanner (TruffleHog / Gitleaks) execution on this host
    query: (data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]/ OR data_process_exec_process_binary:/.*\/[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss]/ OR data_process_exec_process_arguments:/.*[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Access to developer and cloud credential stores on this host
    query: (data_process_exec_process_arguments:/.*\.[Nn][Pp][Mm][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Cc][Oo][Nn][Ff][Ii][Gg]\/[Gg][Cc][Ll][Oo][Uu][Dd].*/ OR data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/[Ii][Dd]_.*/ OR data_process_exec_process_arguments:/.*\.[Nn][Ee][Tt][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Gg][Ii][Tt][Hh][Uu][Bb]_[Tt][Oo][Kk][Ee][Nn].*/ OR data_process_exec_process_arguments:/.*[Nn][Pp][Mm]_[Tt][Oo][Kk][Ee][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Secret exfiltration via curl/wget to webhooks or GitHub API
    query: (((data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/) AND (data_process_exec_process_arguments:/.* -[Dd] .*/ OR data_process_exec_process_arguments:/.*--[Dd][Aa][Tt][Aa].*/ OR data_process_exec_process_arguments:/.*--[Ff][Oo][Rr][Mm].*/ OR data_process_exec_process_arguments:/.*--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.* -[Tt] .*/)) OR data_process_exec_process_arguments:/.*[Ww][Ee][Bb][Hh][Oo][Oo][Kk]\.[Ss][Ii][Tt][Ee].*/ OR data_process_exec_process_arguments:/.*[Aa][Pp][Ii]\.[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm].*/)
    pivot_on:
    - host
    window: 2h
  - name: GitHub Actions self-hosted runner staged for persistence
    query: (data_process_exec_process_arguments:/.*[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]\/[Aa][Cc][Tt][Ii][Oo][Nn][Ss]\/[Rr][Uu][Nn][Nn][Ee][Rr].*/ OR data_process_exec_process_arguments:/.*[Aa][Cc][Tt][Ii][Oo][Nn][Ss]-[Rr][Uu][Nn][Nn][Ee][Rr].*/ OR data_process_exec_process_binary:/.*\/[Cc][Oo][Nn][Ff][Ii][Gg]\.[Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Rr][Uu][Nn]\.[Ss][Hh]/ OR data_process_exec_process_arguments:/.*[Rr][Uu][Nn][Nn][Ee][Rr]\.[Ll][Ii][Ss][Tt][Ee][Nn][Ee][Rr].*/)
    pivot_on:
    - host
    window: 6h
  - name: npm/bun/node package operations - delivery hooks and worm propagation
    query: ((data_process_exec_process_binary:/.*\/[Nn][Pp][Mm]/ OR data_process_exec_process_binary:/.*\/[Nn][Pp][Xx]/ OR data_process_exec_process_binary:/.*\/[Pp][Nn][Pp][Mm]/ OR data_process_exec_process_binary:/.*\/[Yy][Aa][Rr][Nn]/ OR data_process_exec_process_binary:/.*\/[Bb][Uu][Nn]/) AND (data_process_exec_process_arguments:/.* [Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_process_exec_process_arguments:/.* [Pp][Uu][Bb][Ll][Ii][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Rr][Uu][Nn] .*/)) OR data_process_exec_process_arguments:/.*[Ss][Ee][Tt][Uu][Pp]_[Bb][Uu][Nn]\.[Jj][Ss].*/
    pivot_on:
    - host
    window: 6h
