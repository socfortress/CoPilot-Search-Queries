name: Suspicious Curl File Upload - Linux
id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
version: 1
schema_version: "1.0"
date: "2023-05-02"
author: Nasreddine Bencherchali (Nextron Systems), Cedric MAURUGEON (Update)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious curl process start the adds a file to a web request.
  MITRE ATT&CK: T1567, T1105.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/curl"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --form*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --upload-file *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --data *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --data-*"
                    case_insensitive: true
              - regexp:
                  data_process_exec_process_arguments: ".*([ ]-[FTd][ ]).*"
            minimum_should_match: 1
        - exists:
            field: "data_process_exec_process_arguments"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*://localhost*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments: "*://127.0.0.1*"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/curl';
  data_process_exec_process_arguments matches '* --form*';
  data_process_exec_process_arguments matches '* --upload-file *', among other
  conditions.

known_false_positives: >
  Scripts created by developers and admins. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/d1r4c/status/1279042657508081664
  - https://medium.com/@petehouston/upload-files-with-curl-93064dcccc76
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1105/T1105.md#atomic-test-19---curl-upload-file
  - https://curl.se/docs/manpage.html
  - https://www.trendmicro.com/en_us/research/22/i/how-malicious-actors-abuse-native-linux-tools-in-their-attacks.html
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Suspicious Curl File Upload - Linux detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1567, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567
    - T1105
  custom_tags:
    - upload
    - linux
    - tetragon
    - process_creation
    - exfiltration
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ AND (data_process_exec_process_arguments:/.* --[Ff][Oo][Rr][Mm].*/ OR data_process_exec_process_arguments:/.* --[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee] .*/ OR data_process_exec_process_arguments:/.* --[Dd][Aa][Tt][Aa] .*/ OR data_process_exec_process_arguments:/.* --[Dd][Aa][Tt][Aa]-.*/ OR data_process_exec_process_arguments:/.*([ ]-[FTd][ ]).*/) AND _exists_:data_process_exec_process_arguments AND NOT (data_process_exec_process_arguments:/.*:\/\/[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt].*/ OR data_process_exec_process_arguments:/.*:\/\/127\.0\.0\.1.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: 'Sibling egress tool: wget --post-file is the exact wget analogue of this curl --upload-file/--form/--data POST. Both firing on the host means a deliberate file-exfiltration toolkit (often reading /etc/shadow), not incidental curl use.'
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: The same curl upload flags (-F/--form/-T/--upload-file/-d/--data) narrowed to .aws/credentials and .aws/config. If it co-fires it identifies the uploaded payload as AWS cloud credentials being stolen.
  - id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
    name: Shai-Hulud NPM Package Malicious Exfiltration via Curl
    reason: Same tool and behaviour (curl -d POST of collected data to an attacker webhook). Co-firing attributes this upload to the Shai-Hulud npm supply-chain worm rather than admin activity.
  - id: b86d356d-6093-443d-971c-9b07db583c68
    name: Suspicious Curl Change User Agents - Linux
    reason: The same curl egress run with -A/--user-agent to spoof its User-Agent and blend the upload/beacon into normal web traffic - evasion applied to the very channel this rule caught.
  - id: linux-proxy-socks-curl-001
    name: Linux Proxy Socks Curl
    reason: The same curl routed through -x/--proxy/SOCKS to conceal the exfil destination; it can fire on the same invocation and shows the upload endpoint is being deliberately obscured.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Credential collection that typically precedes the upload: passwd/shadow copied into /tmp is exactly the kind of staged loot a curl --upload-file then exfiltrates.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'The ingress half of two-way C2: curl/wget pulling a stager into /tmp or /dev/shm and running it via sh -c - the tooling-delivery step that commonly brackets the exfil this rule detects.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: A hands-on-keyboard foothold (nc -e <shell>) is the interactive channel from which an operator launches the curl upload; its presence on the host reframes the exfil as an active intrusion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Data staged for exfiltration - archive/compression tooling on this host
    query: data_process_exec_process_binary:/.*(\/[Tt][Aa][Rr]|\/[Gg][Zz][Ii][Pp]|\/[Bb][Zz][Ii][Pp]2|\/[Xx][Zz]|\/[Zz][Ss][Tt][Dd]|\/[Zz][Ii][Pp]|\/7[Zz]|\/7[Zz][Aa]|\/[Rr][Aa][Rr])/
    pivot_on:
    - host
    window: 2h
  - name: Alternate exfiltration / transfer tooling on this host
    query: data_process_exec_process_binary:/.*(\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Rr][Cc][Ll][Oo][Nn][Ee]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]|\/[Ff][Tt][Pp]|\/[Tt][Ff][Tt][Pp])/
    pivot_on:
    - host
    window: 4h
  - name: Sensitive credential / secret file paths referenced on this host
    query: data_process_exec_process_arguments:/.*(\/etc\/shadow|\/etc\/passwd|\.ssh\/id_|\.aws\/credentials|\.aws\/config|\.kube\/config|\.env|\.bash_history|\.netrc|\.pgpass)/
    pivot_on:
    - host
    window: 2h
  - name: Web server or interpreter spawning a shell or egress tool (webshell provenance)
    query: data_process_exec_parent_binary:/.*(\/[Nn][Gg][Ii][Nn][Xx]|\/[Aa][Pp][Aa][Cc][Hh][Ee]2|\/[Hh][Tt][Tt][Pp][Dd]|\/[Pp][Hh][Pp]|\/[Pp][Hh][Pp]-[Ff][Pp][Mm]|\/[Tt][Oo][Mm][Cc][Aa][Tt]|\/[Nn][Oo][Dd][Ee])/ AND data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Ee][Rr][Ll])/
    pivot_on:
    - host
    window: 2h
  - name: Curl/Wget pulling remote files to disk (ingress tool transfer) on this host
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/) AND (data_process_exec_process_arguments:/.* -[Oo] .*/ OR data_process_exec_process_arguments:/.*--[Oo][Uu][Tt][Pp][Uu][Tt].*/ OR data_process_exec_process_arguments:/.*--[Rr][Ee][Mm][Oo][Tt][Ee]-[Nn][Aa][Mm][Ee].*/)
    pivot_on:
    - host
    window: 4h
