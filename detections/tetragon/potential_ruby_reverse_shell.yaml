name: Potential Ruby Reverse Shell
id: b8bdac18-c06e-4016-ac30-221553e74f59
version: 1
schema_version: "1.0"
date: "2023-04-07"
author: "@d4ns4n_"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b8bdac18-c06e-4016-ac30-221553e74f59
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of ruby with the "-e" flag and calls to "socket" related
  functions. This could be an indication of a potential attempt to setup a
  reverse shell.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*ruby*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -e*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*rsocket*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*TCPSocket*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* ash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* bsh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* csh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* ksh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* pdksh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* tcsh*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*ruby*';
  data_process_exec_process_arguments matches '* -e*';
  data_process_exec_process_arguments matches '*rsocket*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
  - https://www.revshells.com/

response:
  message: >
    Potential Ruby Reverse Shell detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - reverse
    - shell
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*[Rr][Uu][Bb][Yy].*/ AND data_process_exec_process_arguments:/.* -[Ee].*/ AND data_process_exec_process_arguments:/.*[Rr][Ss][Oo][Cc][Kk][Ee][Tt].*/ AND data_process_exec_process_arguments:/.*[Tt][Cc][Pp][Ss][Oo][Cc][Kk][Ee][Tt].*/ AND (data_process_exec_process_arguments:/.* [Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Bb][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Cc][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Pp][Dd][Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Tt][Cc][Ss][Hh].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Other executions of this tool-set on this host (any arguments)"
      query: 'data_process_exec_process_binary:/.*(\/[Rr][Uu][Bb][Yy])/'
      pivot_on: [host]
      window: 2h
    - name: "Shell / interpreter execution on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/ OR data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/)'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
