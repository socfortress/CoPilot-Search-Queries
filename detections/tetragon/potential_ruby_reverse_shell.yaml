name: Potential Ruby Reverse Shell
id: b8bdac18-c06e-4016-ac30-221553e74f59
version: 1
schema_version: "1.0"
date: "2023-04-07"
author: "@d4ns4n_"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b8bdac18-c06e-4016-ac30-221553e74f59
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of ruby with the "-e" flag and calls to "socket" related
  functions. This could be an indication of a potential attempt to setup a
  reverse shell.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*ruby*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -e*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*rsocket*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*TCPSocket*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* ash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* bsh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* csh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* ksh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* pdksh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* tcsh*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*ruby*';
  data_process_exec_process_arguments matches '* -e*';
  data_process_exec_process_arguments matches '*rsocket*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
  - https://www.revshells.com/

response:
  message: >
    Potential Ruby Reverse Shell detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - reverse
    - shell
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*[Rr][Uu][Bb][Yy].*/ AND data_process_exec_process_arguments:/.* -[Ee].*/ AND data_process_exec_process_arguments:/.*[Rr][Ss][Oo][Cc][Kk][Ee][Tt].*/ AND data_process_exec_process_arguments:/.*[Tt][Cc][Pp][Ss][Oo][Cc][Kk][Ee][Tt].*/ AND (data_process_exec_process_arguments:/.* [Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Bb][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Cc][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Pp][Dd][Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Tt][Cc][Ss][Hh].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Precursor / root cause: a popped web app (apache/nginx/node, Rails included) spawning a child is how ''ruby -e'' gets launched in the first place; a web-server process parenting the interpreter on this host moments before is the initial-access that produced this reverse shell.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Precursor / delivery: the ruby one-liner''s stager or its second stage is typically pulled into /tmp or /dev/shm with curl|wget and run immediately before the TCPSocket shell opens, so a download-and-run on this host just prior is the delivery step of the same intrusion.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: 'Near-simultaneous same-event: this payload ends in exec(''/bin/sh -i''), which IS the interactive shell, and its uncommon children (whoami, nc, base64, pty.spawn) are exactly what that rule flags - the two describe one shell from the exec side and the parent side.'
  - id: c4042d54-110d-45dd-a0e1-05c47822c937
    name: Python Spawning Pretty TTY Via PTY Module
    reason: 'Immediate follow-on: a raw TCPSocket shell is non-interactive (no job control, no sudo), so the operator''s first move is upgrading to a real TTY via python ''import pty; pty.spawn()''; seeing it seconds after confirms a live hands-on-keyboard operator on the shell this rule caught.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Follow-on enumeration: once the shell is live the operator hunts for a way up, and this rule''s SUID sweep (''find -perm -4000'') and .htpasswd search is the classic first recon run through a fresh reverse shell on the same host.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Co-occurring alternate egress: operators keep a fallback channel and ''nc -e sh'' is the most universal one; a netcat reverse shell on the same host within the window is the same session reaching back out, not a separate incident.'
  - id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
    name: Python Reverse Shell Execution Via PTY And Socket Modules
    reason: 'Co-occurring near-identical technique: an interpreter opening a socket to spawn a shell - the python socket/pty one-liner sits directly beside ruby''s on the revshells/pentestmonkey cheat sheet this rule cites, so both firing on one host is one actor trying whichever interpreter answers.'
  - id: 259df6bc-003f-4306-9f54-4ff1a08fa38e
    name: Potential Perl Reverse Shell Execution
    reason: 'Co-occurring alternate one-liner: ''perl -e'' with socket strings from the same cheat sheet; an operator fires whichever interpreter is present on the box, so a perl reverse shell alongside the ruby one on this host is the same hands-on-keyboard attacker.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Interactive shell and TTY upgrade on this host
    query: ((data_process_exec_process_binary:/.*\/([Bb][Aa][Ss][Hh]|[Ss][Hh]|[Dd][Aa][Ss][Hh]|[Zz][Ss][Hh]|[Aa][Ss][Hh])/ AND data_process_exec_process_arguments:/.* -[Ii].*/) OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Cc][Rr][Ii][Pp][Tt] .*-[Qq][Cc].*/)
    pivot_on:
    - host
    window: 1h
  - name: Socket-based reverse-shell one-liners (alternate egress) on this host
    query: (data_process_exec_process_arguments:/.*[Tt][Cc][Pp][Ss][Oo][Cc][Kk][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*[Ff][Ss][Oo][Cc][Kk][Oo][Pp][Ee][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR (data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt])/ AND data_process_exec_process_arguments:/.* -[Ee] .*/))
    pivot_on:
    - host
    window: 2h
  - name: Post-exploitation recon and privilege-escalation enumeration on this host
    query: ((data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp])/) OR (data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -4000.*/) OR (data_process_exec_process_arguments:/.*[Ss][Uu][Dd][Oo] -[Ll].*/))
    pivot_on:
    - host
    window: 1h
  - name: Payload staging in /tmp or /dev/shm on this host
    query: ((data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])/ AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)) OR data_process_exec_process_binary:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)
    pivot_on:
    - host
    window: 2h
