name: Axios NPM Compromise Indicators - Linux
id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
version: 1
schema_version: "1.0"
date: "2026-04-01"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the Linux-specific execution chain of the plain-crypto-js malicious
  npm dependency by Axios NPM package, including payload download via curl and
  detached execution using nohup and python3. On March 30, 2026, malicious
  versions (1.14.1, 0.30.4) were published to npm, injecting a dependency
  (plain-crypto-js@4.2.1) that executed a postinstall script as a cross-platform
  RAT dropper. The dropper contacted a C2 server, delivered platform-specific
  payloads, deleted itself, and replaced package.json to evade detection. MITRE
  ATT&CK: T1195.002, T1059.006, T1059.004, T1105.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_parent_binary:
                                value: "*/node"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_parent_binary:
                                value: "*/bun"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*curl *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*/tmp/ld.py*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*python3 *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*nohup *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments: "*6202033*"
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/curl"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*http://sfrclak.com*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/node';
  data_process_exec_parent_binary matches '*/bun';
  data_process_exec_process_arguments matches '*curl *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.stepsecurity.io/blog/axios-compromised-on-npm-malicious-versions-drop-remote-access-trojan
  - https://www.derp.ca/research/axios-npm-supply-chain-rat/
  - https://www.trendmicro.com/zh_hk/research/26/c/axios-npm-package-compromised.html
  - https://www.elastic.co/security-labs/axios-supply-chain-compromise-detections
  - https://www.virustotal.com/gui/file/e10b1fa84f1d6481625f741b69892780140d4e0e7769e7491e5f4d894c2e0e09
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1059/006/
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Axios NPM Compromise Indicators - Linux detected on host $agent_name$.
    Matched data_process_exec_parent_binary: $data_process_exec_parent_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1195.002, T1059.006,
    T1059.004, T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1195.002
    - T1059.006
    - T1059.004
    - T1105
  custom_tags:
    - axios
    - compromise
    - indicators
    - linux
    - tetragon
    - process_creation
    - initial_access
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ OR data_process_exec_parent_binary:/.*\/[Bb][Uu][Nn]/) AND data_process_exec_process_arguments:/.*[Cc][Uu][Rr][Ll] .*/ AND data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/[Ll][Dd]\.[Pp][Yy].*/ AND data_process_exec_process_arguments:/.*[Pp][Yy][Tt][Hh][Oo][Nn]3 .*/ AND data_process_exec_process_arguments:/.*[Nn][Oo][Hh][Uu][Pp] .*/ AND data_process_exec_process_arguments:/.*6202033.*/) OR (data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ AND data_process_exec_process_arguments:/.*[Hh][Tt][Tt][Pp]:\/\/[Ss][Ff][Rr][Cc][Ll][Aa][Kk]\.[Cc][Oo][Mm].*/))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Shell / interpreter execution on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/) OR (data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/))'
      pivot_on: [host]
      window: 1h
    - name: "Downloader / ingress-tool-transfer on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Tt][Ff][Tt][Pp])/'
      pivot_on: [host]
      window: 1h
    - name: "Persistence via cron / systemd / shell profiles on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/) OR (data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd].*/))'
      pivot_on: [host]
      window: 4h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
