name: Axios NPM Compromise Indicators - Linux
id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
version: 1
schema_version: "1.0"
date: "2026-04-01"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the Linux-specific execution chain of the plain-crypto-js malicious
  npm dependency by Axios NPM package, including payload download via curl and
  detached execution using nohup and python3. On March 30, 2026, malicious
  versions (1.14.1, 0.30.4) were published to npm, injecting a dependency
  (plain-crypto-js@4.2.1) that executed a postinstall script as a cross-platform
  RAT dropper. The dropper contacted a C2 server, delivered platform-specific
  payloads, deleted itself, and replaced package.json to evade detection. MITRE
  ATT&CK: T1195.002, T1059.006, T1059.004, T1105.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_parent_binary:
                                value: "*/node"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_parent_binary:
                                value: "*/bun"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*curl *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*/tmp/ld.py*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*python3 *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*nohup *"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments: "*6202033*"
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/curl"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*http://sfrclak.com*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/node';
  data_process_exec_parent_binary matches '*/bun';
  data_process_exec_process_arguments matches '*curl *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.stepsecurity.io/blog/axios-compromised-on-npm-malicious-versions-drop-remote-access-trojan
  - https://www.derp.ca/research/axios-npm-supply-chain-rat/
  - https://www.trendmicro.com/zh_hk/research/26/c/axios-npm-package-compromised.html
  - https://www.elastic.co/security-labs/axios-supply-chain-compromise-detections
  - https://www.virustotal.com/gui/file/e10b1fa84f1d6481625f741b69892780140d4e0e7769e7491e5f4d894c2e0e09
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1059/006/
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Axios NPM Compromise Indicators - Linux detected on host $agent_name$.
    Matched data_process_exec_parent_binary: $data_process_exec_parent_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1195.002, T1059.006,
    T1059.004, T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1195.002
    - T1059.006
    - T1059.004
    - T1105
  custom_tags:
    - axios
    - compromise
    - indicators
    - linux
    - tetragon
    - process_creation
    - initial_access
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (((data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ OR data_process_exec_parent_binary:/.*\/[Bb][Uu][Nn]/) AND data_process_exec_process_arguments:/.*[Cc][Uu][Rr][Ll] .*/ AND data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/[Ll][Dd]\.[Pp][Yy].*/ AND data_process_exec_process_arguments:/.*[Pp][Yy][Tt][Hh][Oo][Nn]3 .*/ AND data_process_exec_process_arguments:/.*[Nn][Oo][Hh][Uu][Pp] .*/ AND data_process_exec_process_arguments:/.*6202033.*/) OR (data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ AND data_process_exec_process_arguments:/.*[Hh][Tt][Tt][Pp]:\/\/[Ss][Ff][Rr][Cc][Ll][Aa][Kk]\.[Cc][Oo][Mm].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: eb827bbd-670a-4d58-8446-c464d8ac2323
    name: Shai-Hulud Malicious Bun Execution - Linux
    reason: 'Direct sibling: both are npm supply-chain RAT droppers whose postinstall script runs under a node/bun parent (this rule''s branch 1 keys on the same ''*/node''/''*/bun'' parent). A host running one compromised package often pulls others in the same install, so Shai-Hulud bun execution and the axios dropper co-occur in the same npm install tree.'
  - id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
    name: Shai-Hulud NPM Package Malicious Exfiltration via Curl
    reason: 'Same C2/exfil mechanism as this dropper''s second branch: curl reaching out to an attacker-controlled host. Confirms whether the post-compromise curl beacon to sfrclak.com is accompanied by, or is part of, the broader npm-worm exfiltration wave on this dev/CI host.'
  - id: 36603778-030c-43c4-8cbb-cd3c1d1a80c7
    name: LiteLLM / TeamPCP Supply Chain Attack Indicators
    reason: Co-occurring March-2026 supply-chain RAT with the identical goal (harvest every credential, exfiltrate, install a persistent C2 backdoor). A build/dev host hit by the axios compromise should be checked for other active supply-chain backdoors from the same wave hitting package ecosystems.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'The core TTP of this dropper: curl pulls the payload (/tmp/ld.py) into a temp directory and it is executed. This rule fires on the generic curl->/tmp->exec stager pattern, confirming the ingress-tool-transfer-then-run step of the axios RAT chain (T1105).'
  - id: e4ffe466-6ff8-48d4-94bd-e32d1a6061e2
    name: Nohup Execution
    reason: The dropper launches its Python RAT detached via 'nohup python3 /tmp/ld.py' - 'nohup' is literally one of the strings this rule's branch 1 matches. Nohup execution on the same host within the window is the detached-RAT-launch step of this exact chain.
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'Direct follow-on: the staged payload /tmp/ld.py is a process executing from /tmp. This rule fires on that execution, so it is the next-stage confirmation that the downloaded dropper payload actually ran on the host.'
  - id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
    name: Script Interpreter Spawning Credential Scanner - Linux
    reason: 'The objective of npm supply-chain RATs on dev/CI hosts: a node/bun interpreter spawning trufflehog/gitleaks to find and steal secrets (same vector as Shai-Hulud). Its appearance on this host is the likely-next credential-theft stage after the axios dropper gains execution.'
  - id: c70834fa-fb9d-4aa0-9e7d-45ceed36f3f7
    name: Linux Suspicious Child Process from Node.js - React2Shell
    reason: 'Same parent-process abuse: a Node.js process spawning suspicious children (curl/python/shell/nc). Whether from a package postinstall or a server RCE, node spawning a downloader or interpreter on this host is the mechanism that carried the axios dropper and is worth correlating as co-occurring node-child abuse.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Axios RAT campaign IOCs (C2 domain, /tmp/ld.py loader, 6202033 callback) on this host
    query: (data_process_exec_process_arguments:/.*[Ss][Ff][Rr][Cc][Ll][Aa][Kk]\.[Cc][Oo][Mm].*/ OR data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/[Ll][Dd]\.[Pp][Yy].*/ OR data_process_exec_process_arguments:/.*6202033.*/)
    pivot_on:
    - host
    window: 24h
  - name: Detached Python payload execution (nohup/setsid python3, or python3 running from /tmp or /dev/shm) on this host
    query: ((data_process_exec_process_binary:/.*\/[Nn][Oo][Hh][Uu][Pp]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ss][Ii][Dd]/ OR data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Oo][Ww][Nn].*/) AND data_process_exec_process_arguments:/.*[Pp][Yy][Tt][Hh][Oo][Nn].*/) OR (data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3?/ AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/))
    pivot_on:
    - host
    window: 2h
  - name: Developer/CI secret and credential access (npmrc, git/aws creds, SSH keys, /proc environ, trufflehog) on this host
    query: (data_process_exec_process_arguments:/.*\.[Nn][Pp][Mm][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\.[Gg][Ii][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*\/\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Ee][Nn][Vv][Ii][Rr][Oo][Nn].*/ OR data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]/ OR data_process_exec_process_binary:/.*\/[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss]/)
    pivot_on:
    - host
    window: 6h
  - name: Dropper self-deletion / anti-forensics (rm/shred of /tmp payload, ld.py, package.json, bash_history) on this host
    query: ((data_process_exec_process_binary:/.*\/[Rr][Mm]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh][Rr][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Uu][Nn][Ll][Ii][Nn][Kk]/ OR data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Ll][Dd]\.[Pp][Yy].*/ OR data_process_exec_process_arguments:/.*[Pp][Aa][Cc][Kk][Aa][Gg][Ee]\.[Jj][Ss][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/))
    pivot_on:
    - host
    window: 2h
  - name: Package-manager / Node runtime spawning a downloader or interpreter (malicious postinstall precursor) on this host
    query: (data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ OR data_process_exec_parent_binary:/.*\/[Bb][Uu][Nn]/ OR data_process_exec_parent_binary:/.*\/[Nn][Pp][Mm]/ OR data_process_exec_parent_binary:/.*\/[Nn][Pp][Xx]/ OR data_process_exec_parent_binary:/.*\/[Yy][Aa][Rr][Nn]/ OR data_process_exec_parent_binary:/.*\/[Pp][Nn][Pp][Mm]/) AND (data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Bb][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Dd][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3?/)
    pivot_on:
    - host
    window: 2h
