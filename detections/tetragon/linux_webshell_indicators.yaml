name: Linux Webshell Indicators
id: 818f7b24-0fba-4c49-a073-8b755573b9c7
version: 1
schema_version: "1.0"
date: "2022-12-28"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 818f7b24-0fba-4c49-a073-8b755573b9c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious sub processes of web server processes. MITRE ATT&CK:
  T1505.003.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/httpd"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/lighttpd"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/nginx"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/apache2"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/node"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/caddy"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_parent_arguments:
                          value: "*/bin/java*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_parent_arguments:
                          value: "*tomcat*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_parent_arguments:
                          value: "*/bin/java*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_parent_arguments:
                          value: "*websphere*"
                          case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/whoami"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ifconfig"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ip"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bin/uname"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bin/cat"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bin/crontab"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/hostname"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/iptables"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/netstat"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/pwd"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/route"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_parent_arguments
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/httpd';
  data_process_exec_parent_binary matches '*/lighttpd';
  data_process_exec_parent_binary matches '*/nginx', among other conditions.

known_false_positives: >
  Web applications that invoke Linux command line tools. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.acunetix.com/blog/articles/web-shells-101-using-php-introduction-web-shells-part-2/
  - https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    Linux Webshell Indicators detected on host $agent_name$. Matched
    data_process_exec_parent_binary: $data_process_exec_parent_binary$. Matched
    data_process_exec_parent_arguments: $data_process_exec_parent_arguments$.
    MITRE ATT&CK: T1505.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_parent_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
  custom_tags:
    - webshell
    - indicators
    - linux
    - tetragon
    - process_creation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_parent_binary:/.*\/[Hh][Tt][Tt][Pp][Dd]/ OR data_process_exec_parent_binary:/.*\/[Ll][Ii][Gg][Hh][Tt][Tt][Pp][Dd]/ OR data_process_exec_parent_binary:/.*\/[Nn][Gg][Ii][Nn][Xx]/ OR data_process_exec_parent_binary:/.*\/[Aa][Pp][Aa][Cc][Hh][Ee]2/ OR data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ OR data_process_exec_parent_binary:/.*\/[Cc][Aa][Dd][Dd][Yy]/ OR (data_process_exec_parent_arguments:/.*\/[Bb][Ii][Nn]\/[Jj][Aa][Vv][Aa].*/ AND data_process_exec_parent_arguments:/.*[Tt][Oo][Mm][Cc][Aa][Tt].*/) OR (data_process_exec_parent_arguments:/.*\/[Bb][Ii][Nn]\/[Jj][Aa][Vv][Aa].*/ AND data_process_exec_parent_arguments:/.*[Ww][Ee][Bb][Ss][Pp][Hh][Ee][Rr][Ee].*/)) AND (data_process_exec_process_binary:/.*\/[Ww][Hh][Oo][Aa][Mm][Ii]/ OR data_process_exec_process_binary:/.*\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp]/ OR data_process_exec_process_binary:/.*\/[Bb][Ii][Nn]\/[Uu][Nn][Aa][Mm][Ee]/ OR data_process_exec_process_binary:/.*\/[Bb][Ii][Nn]\/[Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Bb][Ii][Nn]\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ OR data_process_exec_process_binary:/.*\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Pp][Ww][Dd]/ OR data_process_exec_process_binary:/.*\/[Rr][Oo][Uu][Tt][Ee]/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Shell / interpreter / networking tooling executed on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ OR data_audit_exe:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/)'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling executed on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ OR data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/)'
      pivot_on: [host]
      window: 2h
    - name: "Persistence via cron / systemd / shell profiles on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/ OR data_audit_exe:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)'
      pivot_on: [host]
      window: 4h
