name: Linux Webshell Indicators
id: 818f7b24-0fba-4c49-a073-8b755573b9c7
version: 1
schema_version: "1.0"
date: "2022-12-28"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 818f7b24-0fba-4c49-a073-8b755573b9c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious sub processes of web server processes. MITRE ATT&CK:
  T1505.003.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/httpd"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/lighttpd"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/nginx"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/apache2"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/node"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/caddy"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_parent_arguments:
                          value: "*/bin/java*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_parent_arguments:
                          value: "*tomcat*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_parent_arguments:
                          value: "*/bin/java*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_parent_arguments:
                          value: "*websphere*"
                          case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/whoami"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ifconfig"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ip"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bin/uname"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bin/cat"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bin/crontab"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/hostname"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/iptables"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/netstat"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/pwd"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/route"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_parent_arguments
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/httpd';
  data_process_exec_parent_binary matches '*/lighttpd';
  data_process_exec_parent_binary matches '*/nginx', among other conditions.

known_false_positives: >
  Web applications that invoke Linux command line tools. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.acunetix.com/blog/articles/web-shells-101-using-php-introduction-web-shells-part-2/
  - https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    Linux Webshell Indicators detected on host $agent_name$. Matched
    data_process_exec_parent_binary: $data_process_exec_parent_binary$. Matched
    data_process_exec_parent_arguments: $data_process_exec_parent_arguments$.
    MITRE ATT&CK: T1505.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_parent_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
  custom_tags:
    - webshell
    - indicators
    - linux
    - tetragon
    - process_creation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_parent_binary:/.*\/[Hh][Tt][Tt][Pp][Dd]/ OR data_process_exec_parent_binary:/.*\/[Ll][Ii][Gg][Hh][Tt][Tt][Pp][Dd]/ OR data_process_exec_parent_binary:/.*\/[Nn][Gg][Ii][Nn][Xx]/ OR data_process_exec_parent_binary:/.*\/[Aa][Pp][Aa][Cc][Hh][Ee]2/ OR data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ OR data_process_exec_parent_binary:/.*\/[Cc][Aa][Dd][Dd][Yy]/ OR (data_process_exec_parent_arguments:/.*\/[Bb][Ii][Nn]\/[Jj][Aa][Vv][Aa].*/ AND data_process_exec_parent_arguments:/.*[Tt][Oo][Mm][Cc][Aa][Tt].*/) OR (data_process_exec_parent_arguments:/.*\/[Bb][Ii][Nn]\/[Jj][Aa][Vv][Aa].*/ AND data_process_exec_parent_arguments:/.*[Ww][Ee][Bb][Ss][Pp][Hh][Ee][Rr][Ee].*/)) AND (data_process_exec_process_binary:/.*\/[Ww][Hh][Oo][Aa][Mm][Ii]/ OR data_process_exec_process_binary:/.*\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp]/ OR data_process_exec_process_binary:/.*\/[Bb][Ii][Nn]\/[Uu][Nn][Aa][Mm][Ee]/ OR data_process_exec_process_binary:/.*\/[Bb][Ii][Nn]\/[Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Bb][Ii][Nn]\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ OR data_process_exec_process_binary:/.*\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Pp][Ww][Dd]/ OR data_process_exec_process_binary:/.*\/[Rr][Oo][Uu][Tt][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d292e0af-9a18-420c-9525-ec0ac3936892
    name: Suspicious Java Children Processes
    reason: 'Co-occurring sibling / Java-stack variant of this exact detection: the webshell rule''s own java+tomcat and java+websphere parent branches. A JSP/servlet webshell running under Tomcat or WebSphere spawns the same shell/curl/wget/python children, so this fires alongside when the compromised web app is Java rather than PHP/nginx.'
  - id: c70834fa-fb9d-4aa0-9e7d-45ceed36f3f7
    name: Linux Suspicious Child Process from Node.js - React2Shell
    reason: 'Node.js counterpart and likely initial-access vector: the webshell rule lists */node as a web-server parent, and a Node/Next.js RCE (e.g. CVE-2025-55182) abuses child_process to spawn recon/reverse-shell children exactly like a webshell. Same host, same parent=node pattern.'
  - id: 69dea60b-2deb-4c9e-a685-ad542f4367f9
    name: Suspicious Child Process of SAP NetWeaver - Linux
    reason: 'Precursor/sibling for the SAP stack: same app-server-spawns-webshell-children pattern (CVE-2025-31324, explicitly arbitrary execution via webshells dropped in the irj servlet work/root dir). Represents how the webshell was planted when the exploited web app is SAP NetWeaver.'
  - id: c6714a24-d7d5-4283-a36b-3ffd091d5f7e
    name: Potential PHP Reverse Shell
    reason: 'Direct follow-on escalation: a PHP webshell (the dominant language under Apache/nginx) moving from one-shot recon commands to an interactive reverse shell via php -r fsockopen. Confirms the operator upgrading the webshell into hands-on-keyboard control on the same host.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Follow-on escalation, language-agnostic: the operator turning the webshell''s one-shot exec into a persistent reverse shell with nc/ncat -e <shell>. The generic ''they now have a live interactive shell'' signal expected right after webshell recon.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Follow-on ingress tool transfer: the webshell pulling a second-stage payload into /tmp or /dev/shm and immediately running it via sh -c. The standard next step once webshell recon confirms the host is worth escalating on.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'Most common end objective of opportunistic internet-facing Linux webshell compromise: an xmrig-style miner (--donate-level, --cpu-priority) launched on the same host after the operator finishes reconnaissance through the webshell.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Web/app-server process spawning any child on this host
    query: (data_process_exec_parent_binary:/.*\/([Hh][Tt][Tt][Pp][Dd]|[Nn][Gg][Ii][Nn][Xx]|[Aa][Pp][Aa][Cc][Hh][Ee]2|[Ll][Ii][Gg][Hh][Tt][Tt][Pp][Dd]|[Cc][Aa][Dd][Dd][Yy]|[Nn][Oo][Dd][Ee]|[Pp][Hh][Pp]-[Ff][Pp][Mm].*)/ OR (data_process_exec_parent_binary:/.*\/[Jj][Aa][Vv][Aa]/ AND data_process_exec_parent_arguments:/.*([Tt][Oo][Mm][Cc][Aa][Tt]|[Ww][Ee][Bb][Ss][Pp][Hh][Ee][Rr][Ee]|[Jj][Bb][Oo][Ss][Ss]|[Cc][Aa][Tt][Aa][Ll][Ii][Nn][Aa]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Reverse shell / interactive TTY on this host
    query: (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Uu][Dd][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Mm][Kk][Ff][Ii][Ff][Oo].*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Hh] -[Ii].*/ OR data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt]|[Nn][Ee][Tt][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/)
    pivot_on:
    - host
    window: 2h
  - name: Second-stage payload download into writable directories on this host
    query: ((data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Ff][Tt][Pp]|[Tt][Ff][Tt][Pp])/ OR data_process_exec_process_arguments:/.*([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]).*/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ww][Ww][Ww]\/.*/))
    pivot_on:
    - host
    window: 4h
  - name: Credential and sensitive file access on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_([Rr][Ss][Aa]|[Dd][Ss][Aa]|[Ee][Cc][Dd][Ss][Aa]|[Ee][Dd]25519).*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Persistence via cron / systemd / service files on this host
    query: (data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Aa][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll])/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/)
    pivot_on:
    - host
    window: 6h
