name: Group Has Been Deleted Via Groupdel
id: 8a46f16c-8c4c-82d1-b121-0fdd3ba70a84
version: 1
schema_version: "1.0"
date: "2022-12-26"
author: Tuan Le (NCSGroup)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a46f16c-8c4c-82d1-b121-0fdd3ba70a84
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "groupdel" binary. Which is used to delete a group.
  This is sometimes abused by threat actors in order to cover their tracks.
  MITRE ATT&CK: T1531.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/groupdel"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/groupdel'.

known_false_positives: >
  Legitimate administrator activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://linuxize.com/post/how-to-delete-group-in-linux/
  - https://www.cyberciti.biz/faq/linux-remove-user-command/
  - https://www.cybrary.it/blog/0p3n/linux-commands-used-attackers/
  - https://linux.die.net/man/8/groupdel
  - https://attack.mitre.org/techniques/T1531/

response:
  message: >
    Group Has Been Deleted Via Groupdel detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1531
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1531
  custom_tags:
    - group
    - deleted
    - groupdel
    - linux
    - tetragon
    - process_creation
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Gg][Rr][Oo][Uu][Pp][Dd][Ee][Ll]/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
      name: "Disable Or Stop Services"
      reason: "next kill-chain tactic: Impact"
    - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
      name: "ESXi VM Kill Via ESXCLI"
      reason: "next kill-chain tactic: Impact"
    - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
      name: "History File Deletion"
      reason: "next kill-chain tactic: Impact"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Shell / interpreter / networking tooling executed on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ OR data_audit_exe:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/)'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling executed on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ OR data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/)'
      pivot_on: [host]
      window: 2h
    - name: "Persistence via cron / systemd / shell profiles on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/ OR data_audit_exe:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)'
      pivot_on: [host]
      window: 4h
    - name: "Destructive tooling on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Dd][Dd]|\/[Mm][Kk][Ff][Ss]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Cc][Rr][Yy][Pp][Tt][Ss][Ee][Tt][Uu][Pp]|\/[Ss][Hh][Rr][Ee][Dd])/ OR data_audit_exe:/.*(\/[Dd][Dd]|\/[Mm][Kk][Ff][Ss]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Cc][Rr][Yy][Pp][Tt][Ss][Ee][Tt][Uu][Pp]|\/[Ss][Hh][Rr][Ee][Dd])/)'
      pivot_on: [host]
      window: 2h
