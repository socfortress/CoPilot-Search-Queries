name: Group Has Been Deleted Via Groupdel
id: 8a46f16c-8c4c-82d1-b121-0fdd3ba70a84
version: 1
schema_version: "1.0"
date: "2022-12-26"
author: Tuan Le (NCSGroup)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a46f16c-8c4c-82d1-b121-0fdd3ba70a84
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "groupdel" binary. Which is used to delete a group.
  This is sometimes abused by threat actors in order to cover their tracks.
  MITRE ATT&CK: T1531.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/groupdel"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/groupdel'.

known_false_positives: >
  Legitimate administrator activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://linuxize.com/post/how-to-delete-group-in-linux/
  - https://www.cyberciti.biz/faq/linux-remove-user-command/
  - https://www.cybrary.it/blog/0p3n/linux-commands-used-attackers/
  - https://linux.die.net/man/8/groupdel
  - https://attack.mitre.org/techniques/T1531/

response:
  message: >
    Group Has Been Deleted Via Groupdel detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1531
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1531
  custom_tags:
    - group
    - deleted
    - groupdel
    - linux
    - tetragon
    - process_creation
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Gg][Rr][Oo][Uu][Pp][Dd][Ee][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 08f26069-6f80-474b-8d1f-d971c6fedea0
    name: User Has Been Deleted Via Userdel
    reason: 'userdel on the same host is the twin of groupdel: deleting user accounts and their groups together is the signature of a deliberate Account Access Removal spree (both T1531) aimed at locking legitimate users and admins out of the box.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: Earlier root/sudoers group-membership tampering on this host points to the same account-manipulation actor; the groupdel often removes the very privileged group that was abused for escalation/persistence, or strips group-based access to deny it to others.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: auditctl -D wipes the Linux audit ruleset and is typically run just before destructive account changes so the groupdel leaves no auditd trail — a precursor on the same host that marks the activity as deliberate evasion rather than routine admin maintenance.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: The groupdel rule itself flags the tool as used to 'cover tracks'; a ~/.bash_history wipe in the same root session is the matching anti-forensic step that turns an isolated group deletion into a cleanup operation.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Clearing /var/log around the account deletion is the other half of covering tracks; log removal on the same host within the window reframes the groupdel as post-compromise anti-forensics, not maintenance.
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Stopping or disabling services with systemctl/service is the destructive-Impact companion to account removal — an actor denying access via groupdel commonly also disrupts operations (T1489) on the same host in the same session.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Account and group management tooling on this host
    query: data_process_exec_process_binary:/.*\/([Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|[Gg][Rr][Oo][Uu][Pp][Mm][Oo][Dd]|[Gg][Rr][Oo][Uu][Pp][Dd][Ee][Ll]|[Gg][Pp][Aa][Ss][Ss][Ww][Dd]|[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Uu][Ss][Ee][Rr][Dd][Ee][Ll]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Aa][Gg][Ee]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Dd][Ee][Ll][Uu][Ss][Ee][Rr]|[Aa][Dd][Dd][Gg][Rr][Oo][Uu][Pp]|[Dd][Ee][Ll][Gg][Rr][Oo][Uu][Pp])/
    pivot_on:
    - host
    window: 2h
  - name: Direct access or modification of account and credential files
    query: data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/([Pp][Aa][Ss][Ss][Ww][Dd]|[Ss][Hh][Aa][Dd][Oo][Ww]|[Gg][Rr][Oo][Uu][Pp]|[Gg][Ss][Hh][Aa][Dd][Oo][Ww]|[Ss][Uu][Dd][Oo][Ee][Rr][Ss]).*/
    pivot_on:
    - host
    window: 2h
  - name: 'Anti-forensic cleanup: history, log and audit destruction'
    query: ((data_process_exec_process_binary:/.*\/([Ss][Hh][Rr][Ee][Dd]|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee])/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*-[Dd].*/) OR (data_process_exec_process_binary:/.*\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Vv][Aa][Cc][Uu][Uu][Mm].*/) OR (data_process_exec_process_arguments:/.*(\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\.[Zz][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]).*/))
    pivot_on:
    - host
    window: 4h
  - name: Service stop, disable or mask on this host (destructive Impact)
    query: ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]).*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ AND data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/))
    pivot_on:
    - host
    window: 2h
