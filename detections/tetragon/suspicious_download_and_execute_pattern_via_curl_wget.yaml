name: Suspicious Download and Execute Pattern via Curl/Wget
id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
version: 1
schema_version: "1.0"
date: "2025-06-17"
author: Aayush Gupta
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious use of command-line tools such as curl or wget to download
  remote content - particularly scripts - into temporary directories (e.g.,
  /dev/shm, /tmp), followed by immediate execution, indicating potential
  malicious activity. This pattern is commonly used by malicious scripts,
  stagers, or downloaders in fileless or multi-stage Linux attacks. MITRE
  ATT&CK: T1059.004, T1203.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/curl*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/wget*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/tmp/*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/dev/shm/*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "*sh -c*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_arguments matches '*/curl*';
  data_process_exec_process_arguments matches '*/wget*';
  data_process_exec_process_arguments matches '*/tmp/*', among other conditions.

known_false_positives: >
  System update scripts using temporary files. Installer scripts or automated
  provisioning tools. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/wget/
  - https://gtfobins.github.io/gtfobins/curl/
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1203/

response:
  message: >
    Suspicious Download and Execute Pattern via Curl/Wget detected on host
    $agent_name$. Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$. MITRE
    ATT&CK: T1059.004, T1203
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_arguments
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.004
    - T1203
  custom_tags:
    - download
    - execute
    - pattern
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_arguments:/.*\/[Cc][Uu][Rr][Ll].*/ OR data_process_exec_process_arguments:/.*\/[Ww][Gg][Ee][Tt].*/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/) AND data_process_exec_process_arguments:/.*[Ss][Hh] -[Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Precursor that explains how this ran: a web server (nginx/apache2/httpd/php-fpm/node) spawning a shell child is web-app RCE. If it fired on the same host just before, the ''sh -c'' curl/wget is attacker-driven ingress launched from a webshell - compare data_process_exec_parent_binary of this rule''s event against the web-server process.'
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'The download half of this same behaviour caught on its own: wget -O / --output-document writing into /tmp without the ''sh -c'' wrapper. It fires on the identical drop, so when both hit one host the fetch is confirmed ingress tooling (T1105), not an admin pull - match the two events'' data_process_exec_process_arguments for the same URL and target path.'
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: 'The make-executable step between download and execution: chmod on a file under /tmp sets the execute bit on the payload this rule just fetched. A ''chmod +x /tmp/<file>'' immediately following the sh -c curl/wget is the clearest sign the drop is being staged to run.'
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'The payoff for an ELF payload: a binary whose own path is under /tmp/ is executed, turning ''a file was fetched into /tmp'' into ''the downloaded binary actually ran''. The single most important follow-on for confirming the download-and-execute completed.'
  - id: 30bcce26-51c5-49f2-99c8-7b59e3af36c7
    name: Execution Of Script Located In Potentially Suspicious Directory
    reason: 'The payoff for a script payload - which this rule explicitly targets (''particularly scripts''): bash/sh invoked to run a script located in /tmp. Catches the execution the /tmp-binary rule misses, because a dropped .sh runs as ''bash /tmp/x.sh'' (binary=/bin/bash, script path in arguments).'
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'The fileless payoff for the /dev/shm branch of this rule: a binary executed straight out of RAM-backed /dev/shm so it never touches disk. When the curl/wget target was /dev/shm this fires as the payload runs - a deliberate disk-evasion follow-on (T1027.011).'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Persistence anchored to the very directory this rule''s download targeted: crontab installing a job that references a file in /tmp. A dropped-and-executed stager that then schedules itself via cron from /tmp is a classic Linux persistence chain (T1053.003).'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'The most common payload delivered by this exact curl/wget-to-temp-and-execute pattern: an XMRig-style miner, identified by its command line (stratum+tcp/udp pools, --donate-level, --cpu-priority). Co-firing on the same host tells you the download-and-execute was a coinminer install (T1496 impact).'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: chmod setting the execute bit on the dropped /tmp or /dev/shm payload
    query: data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)
    pivot_on:
    - host
    window: 1h
  - name: Execution of a binary or script out of /tmp or /dev/shm (the payload runs)
    query: data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR ((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll])/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/))
    pivot_on:
    - host
    window: 1h
  - name: Further ingress tool transfer - more downloaders pulling later stages
    query: data_process_exec_process_binary:/.*(\/[Ww][Gg][Ee][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Tt][Ff][Tt][Pp]|\/[Ff][Tt][Pp]|\/[Ss][Cc][Pp])/
    pivot_on:
    - host
    window: 2h
  - name: Persistence established on this host (cron / systemd / rc.local / shell profiles / authorized_keys)
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt])/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/
    pivot_on:
    - host
    window: 4h
  - name: Reverse-shell / C2 indicators (nc/ncat/socat, /dev/tcp, pty.spawn)
    query: data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/
    pivot_on:
    - host
    window: 2h
