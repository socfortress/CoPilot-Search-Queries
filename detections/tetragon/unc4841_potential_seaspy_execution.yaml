name: UNC4841 - Potential SEASPY Execution
id: f6a711f3-d032-4f9e-890b-bbe776236c84
version: 1
schema_version: "1.0"
date: "2023-06-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f6a711f3-d032-4f9e-890b-bbe776236c84
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of specific named binaries which were used by UNC4841 to
  deploy their SEASPY backdoor.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/BarracudaMailService"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/resize2fstab"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/resize_reisertab"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/BarracudaMailService';
  data_process_exec_process_binary matches '*/resize2fstab';
  data_process_exec_process_binary matches '*/resize_reisertab'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.mandiant.com/resources/blog/barracuda-esg-exploited-globally

response:
  message: >
    UNC4841 - Potential SEASPY Execution detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - unc4841
    - seaspy
    - linux
    - tetragon
    - process_creation
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Bb][Aa][Rr][Rr][Aa][Cc][Uu][Dd][Aa][Mm][Aa][Ii][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_process_exec_process_binary:/.*\/[Rr][Ee][Ss][Ii][Zz][Ee]2[Ff][Ss][Tt][Aa][Bb]/ OR data_process_exec_process_binary:/.*\/[Rr][Ee][Ss][Ii][Zz][Ee]_[Rr][Ee][Ii][Ss][Ee][Rr][Tt][Aa][Bb]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 23835beb-ec38-4e74-a5d4-b99af6684e91
    name: UNC4841 - Download Tar File From Untrusted Direct IP Via Wget
    reason: 'Same intrusion, delivery step: UNC4841''s CVE-2023-2868 exploitation of the Barracuda ESG pulled the SEASPY payload as a .tar from a direct attacker IP with --no-check-certificate. A hit on this host shortly before is the retrieval of the very binary that just executed.'
  - id: 60d050c4-e253-4d9a-b673-5ac100cfddfb
    name: UNC4841 - Download Compressed Files From Temp.sh Using Wget
    reason: 'Same campaign, alternate staging channel: UNC4841 also fetched SEASPY/SALTWATER components as .zip/.rar from temp.sh. On this host it is the other way the backdoor whose named binary this rule caught running was delivered.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Generic drop-and-run that bridges delivery to this execution: curl/wget writing into /tmp or /dev/shm then piping to ''sh -c'' is how the SEASPY ELF lands and is launched when the two strict UNC4841 wget rules (exact IP/temp.sh+flag combos) do not match.'
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: 'The arm step immediately before this fires: a chmod +x on the downloaded file in /tmp or /opt sets the execute bit on the SEASPY binary so it can run as BarracudaMailService. chmod on this host in the same window is the download->arm->execute chain completing.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Follow-on persistence: SEASPY was wired to relaunch at boot, and UNC4841 used cron as well. A crontab installing a job from /tmp on this host right after is the operator making the just-executed backdoor survive reboot (T1053.003).'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: SEASPY is a passive backdoor activated by a magic packet to spawn a shell, and hands-on-keyboard operators also open nc/ncat '-e <shell>' callbacks. A netcat reverse shell on this host is the interactive C2 that follows the backdoor coming alive.
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'First hands-on-keyboard activity through the backdoor: SUID (''find -perm -4000'') and .htpasswd/credential hunting are what an espionage operator runs on the ESG once SEASPY grants shell access, to scope the host for data and privilege escalation.'
  - id: 60911c07-f989-4362-84af-c609828ef829
    name: UNC4841 - SSL Certificate Exfiltration Via Openssl
    reason: 'Same campaign, objective step: UNC4841 used ''openssl s_client -connect <ip>'' to exfiltrate SSL certificates and as a named-pipe C2 channel. On this host it is the data-theft/C2 phase that follows SEASPY establishing its foothold.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'UNC4841 payload retrieval: wget/curl to a direct IP, temp.sh, or with --no-check-certificate'
    query: (data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/) AND (data_process_exec_process_arguments:/.*[Hh][Tt][Tt][Pp][Ss]?:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}.*/ OR data_process_exec_process_arguments:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*--[Nn][Oo]-[Cc][Hh][Ee][Cc][Kk]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: 'SEASPY boot/service persistence: init.d, rc.local, systemd, cron, update-rc.d, chkconfig'
    query: (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ OR data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn].*/)
    pivot_on:
    - host
    window: 6h
  - name: 'SEASPY SSL-cert exfiltration / named-pipe C2: openssl s_client to an IP, or mkfifo'
    query: (data_process_exec_process_binary:/.*\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]/ AND data_process_exec_process_arguments:/.*[Ss]_[Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_process_exec_process_arguments:/.*[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}.*/) OR data_process_exec_process_binary:/.*\/[Mm][Kk][Ff][Ii][Ff][Oo]/
    pivot_on:
    - host
    window: 6h
  - name: 'Backdoor activation to shell: nc/ncat/socat, /dev/tcp, pty.spawn, socket+connect'
    query: ((data_process_exec_process_binary:/.*\/[Nn][Cc]/ OR data_process_exec_process_binary:/.*\/[Nn][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Nn][Ee][Tt][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ss][Oo][Cc][Aa][Tt]/) OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Uu][Dd][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/ OR (data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*/ AND data_process_exec_process_arguments:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: Hands-on-keyboard discovery and credential/key access on the appliance
    query: (data_process_exec_process_binary:/.*\/[Ww][Hh][Oo][Aa][Mm][Ii]/ OR data_process_exec_process_binary:/.*\/[Ii][Dd]/ OR data_process_exec_process_binary:/.*\/[Uu][Nn][Aa][Mm][Ee]/ OR data_process_exec_process_binary:/.*\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]/ OR data_process_exec_process_binary:/.*\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ss][Ss]/ OR data_process_exec_process_binary:/.*\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/.*/)
    pivot_on:
    - host
    window: 2h
