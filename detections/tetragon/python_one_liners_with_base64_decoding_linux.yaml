name: Python One-Liners with Base64 Decoding - Linux
id: 55e862a8-dd9c-4651-807a-f21fcad56716
version: 1
schema_version: "1.0"
date: "2026-03-09"
author: Hugh Ryan (HueCodes), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 55e862a8-dd9c-4651-807a-f21fcad56716
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Python's base64 decoding functions in command line
  executions on Linux systems. Malicious scripts often use python one-liners to
  decode and execute base64-encoded payloads, which is a common technique for
  obfuscation and evasion. MITRE ATT&CK: T1059.006, T1027.010.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/python*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*import*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*base64*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -c*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*.decode*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*b16decode*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*b32decode*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*b32hexdecode*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*b64decode*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*b85decode*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*z85decode*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/python*';
  data_process_exec_process_arguments matches '*import*';
  data_process_exec_process_arguments matches '*base64*', among other
  conditions.

known_false_positives: >
  Legitimate use of Python for decoding data, which is uncommon in typical
  enterprise environments but possible in development or data analysis contexts.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://docs.python.org/3/library/base64.html
  - https://www.virustotal.com/gui/file/bc43e925d7b4b74319f6e74e836a96f1997ba404e14ac566cf12a21e9da463db/behavior
  - https://cloud.google.com/blog/topics/threat-intelligence/cybercriminals-weaponize-fake-ai-websites
  - https://attack.mitre.org/techniques/T1059/006/
  - https://attack.mitre.org/techniques/T1027/010/

response:
  message: >
    Python One-Liners with Base64 Decoding - Linux detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1059.006, T1027.010
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.006
    - T1027.010
  custom_tags:
    - python
    - liners
    - base64
    - linux
    - tetragon
    - process_creation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn].*/ AND data_process_exec_process_arguments:/.*[Ii][Mm][Pp][Oo][Rr][Tt].*/ AND data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Ee]64.*/ AND data_process_exec_process_arguments:/.* -[Cc].*/ AND (data_process_exec_process_arguments:/.*\.[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_process_exec_process_arguments:/.*[Bb]16[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_process_exec_process_arguments:/.*[Bb]32[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_process_exec_process_arguments:/.*[Bb]32[Hh][Ee][Xx][Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_process_exec_process_arguments:/.*[Bb]64[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_process_exec_process_arguments:/.*[Bb]85[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_process_exec_process_arguments:/.*[Zz]85[Dd][Ee][Cc][Oo][Dd][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
    name: Python Reverse Shell Execution Via PTY And Socket Modules
    reason: The base64 blob a `python -c` one-liner decodes is most often a socket+pty reverse shell; this rule catches that same payload run in the clear, so it firing on the host confirms the decode established C2 (the unmasked twin of this obfuscated execution).
  - id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
    name: Inline Python Execution - Spawn Shell Via OS System Library
    reason: Same `python -c` execution class on the same host; the decoded one-liner frequently resolves to `os.system('/bin/sh')`. Both are python spawning an interactive shell, one obfuscated via base64 and one not.
  - id: c4042d54-110d-45dd-a0e1-05c47822c937
    name: Python Spawning Pretty TTY Via PTY Module
    reason: 'Immediate follow-on: operators upgrade the shell the decoded payload gave them to a full TTY with `python -c ''import pty; pty.spawn()''` within seconds of landing.'
  - id: b7c4d8e1-5f2a-4c9b-8d3e-4f5a6b7c8d9e
    name: Linux Suspicious Base64 Execution
    reason: The shell-side twin of this obfuscation (`base64 -d | bash`); an intrusion decoding a payload in python commonly also decodes one straight into bash, so both deobfuscate-then-execute alerts fire in the same burst (same Code-Obfuscation story).
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'The delivery bracket around this execution: the curl/wget stager that fetched the encoded payload into /tmp or /dev/shm before python decoded it, or the second stage the decoded code pulls down next.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Once the decoded payload yields a shell, the operator's first move is privesc reconnaissance - SUID hunting (`find -perm -4000`) and `.htpasswd` discovery - a standard follow-on after landing on the host.
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: Hands-on operators spray several reverse-shell one-liners from one host until one connects back; netcat is the classic fallback to the python reverse shell this base64 one-liner likely carried, so it co-occurs during C2 establishment.
  - id: ba592c6d-6888-43c3-b8c6-689b8fe47337
    name: Linux Base64 Encoded Pipe to Shell
    reason: A second inline base64-decode-then-execute on the same host (`base64 ... | sh`, T1140); co-occurring deobfuscation from the same operator or stager, confirming the obfuscated-execution pattern beyond python alone.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other suspicious python -c one-liners on this host (exec/eval/socket/subprocess/os.system)
    query: data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn].*/ AND data_process_exec_process_arguments:/.* -[Cc].*/ AND (data_process_exec_process_arguments:/.*[Ee][Xx][Ee][Cc].*/ OR data_process_exec_process_arguments:/.*[Ee][Vv][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*[Ss][Uu][Bb][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_process_exec_process_arguments:/.*[Oo][Ss]\.[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_process_exec_process_arguments:/.*[Cc][Oo][Mm][Pp][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*[Ff][Rr][Oo][Mm][Hh][Ee][Xx].*/ OR data_process_exec_process_arguments:/.*[Mm][Aa][Rr][Ss][Hh][Aa][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote payload fetched into /tmp or /dev/shm via curl/wget
    query: (data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_arguments:/.*\/[Cc][Uu][Rr][Ll].*/ OR data_process_exec_process_arguments:/.*\/[Ww][Gg][Ee][Tt].*/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Reverse-shell channel via bash /dev/tcp(/udp) or socat
    query: (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Uu][Dd][Pp]\/.*/ OR data_process_exec_process_binary:/.*\/[Ss][Oo][Cc][Aa][Tt]/)
    pivot_on:
    - host
    window: 1h
  - name: Credential and secret-material access (shadow/passwd/sudoers/ssh keys/aws creds)
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Ee][Dd]25519.*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence established after execution (cron/systemd/rc.local/bashrc/authorized_keys)
    query: (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ OR data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Aa][Tt]/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)
    pivot_on:
    - host
    window: 4h
