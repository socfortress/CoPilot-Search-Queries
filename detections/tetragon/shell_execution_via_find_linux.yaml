name: Shell Execution via Find - Linux
id: 6adfbf8f-52be-4444-9bac-81b539624146
version: 1
schema_version: "1.0"
date: "2024-09-02"
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6adfbf8f-52be-4444-9bac-81b539624146
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the find command to execute a shell. Such behavior may be
  associated with privilege escalation, unauthorized command execution, or
  exploitation attempt. MITRE ATT&CK: T1083.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/find"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments: "* . *"
        - wildcard:
            data_process_exec_process_arguments:
              value: "*-exec*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/dash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/fish*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/zsh*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/find';
  data_process_exec_process_arguments matches '* . *';
  data_process_exec_process_arguments matches '*-exec*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/find/#shell
  - https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
  - https://attack.mitre.org/techniques/T1083/

response:
  message: >
    Shell Execution via Find - Linux detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1083
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1083
  custom_tags:
    - shell
    - linux
    - tetragon
    - process_creation
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND data_process_exec_process_arguments:/.* \. .*/ AND data_process_exec_process_arguments:/.*-[Ee][Xx][Ee][Cc].*/ AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ff][Ii][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
    name: Potential Discovery Activity Using Find - Linux
    reason: 'Direct precursor: the SAME find binary run with -perm -4000/-u=s/-g=s enumerates SUID/SGID binaries; discovering that find (or a sibling LOLBin) carries the SUID bit is exactly what motivates this ''-exec /bin/sh -p'' breakout, so the discovery event typically fires minutes before this one on the same host.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Precursor/co-occurring privesc enumeration: reading /etc/sudoers to map who can run what as root is the other half of the privilege-escalation surface survey that accompanies SUID hunting right before an attacker chooses a LOLBin shell-escape vector.'
  - id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
    name: Vim GTFOBin Abuse - Linux
    reason: 'Co-occurring same TTP: vim '':!/bin/sh'' is the identical GTFOBins restricted-shell-breakout/SUID-privesc technique via a different binary; an attacker probing which LOLBin on the host yields a shell commonly tries several, so seeing this alongside find-exec strengthens the privesc narrative.'
  - id: 8c1a5675-cb85-452f-a298-b01b22a51856
    name: Suspicious Invocation of Shell via AWK - Linux
    reason: 'Co-occurring same TTP: awk ''BEGIN{system("/bin/sh")}'' is a sibling GTFOBins shell escape with the identical break-out-of-restricted-environment intent on the same host/user.'
  - id: bed978f8-7f3a-432b-82c5-9286a9b3031a
    name: Shell Invocation via Env Command - Linux
    reason: 'Co-occurring same TTP: ''env /bin/sh'' is a sibling GTFOBins escape; env is a frequent restricted-shell and sudo-allowlist bypass, so it pairs naturally with a find-exec breakout attempt.'
  - id: 9b5de532-a757-4d70-946c-1f3e44f48b4d
    name: Shell Execution GCC  - Linux
    reason: 'Co-occurring same TTP: gcc (and c89/c99) spawning a shell is a sibling GTFOBins break-out, especially on developer/build hosts where a compiler is the LOLBin the attacker reaches for after find.'
  - id: 47b3bbd4-1bf7-48cc-84ab-995362aaa75a
    name: Shell Execution via Git - Linux
    reason: 'Co-occurring same TTP: ''git -p help'' followed by '':!/bin/sh'' is a sibling GTFOBins pager-abuse shell escape with the same restricted-shell-breakout intent on the same host.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: 'Direct follow-on: the interactive shell that find -exec spawns is exactly the ''bash -i'' parent this rule watches, and its firing (whoami, nc/ncat/netcat, base64, pty.spawn as children) confirms the breakout became a live, hands-on-keyboard foothold.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: A shell-escape LOLBin spawned an interactive shell on this host
    query: (data_process_exec_process_binary:/.*\/([Bb][Aa][Ss][Hh]|[Dd][Aa][Ss][Hh]|[Ss][Hh]|[Zz][Ss][Hh]|[Kk][Ss][Hh]|[Ff][Ii][Ss][Hh]|[Cc][Ss][Hh])/) AND (data_process_exec_parent_binary:/.*\/([Ff][Ii][Nn][Dd]|[Aa][Ww][Kk]|[Gg][Aa][Ww][Kk]|[Vv][Ii][Mm]|[Vv][Ii]|[Ee][Nn][Vv]|[Gg][Cc][Cc]|[Gg][Ii][Tt]|[Ff][Ll][Oo][Cc][Kk]|[Nn][Ii][Cc][Ee]|[Rr][Ss][Yy][Nn][Cc]|[Nn][Mm][Aa][Pp]|[Pp][Ee][Rr][Ll]|[Cc][Aa][Pp][Ss][Hh]|[Tt][Aa][Rr])/)
    pivot_on:
    - host
    window: 1h
  - name: SUID / SGID / weak-permission binary discovery via find
    query: data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND (data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -4000.*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -[Uu]=[Ss].*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -2000.*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -[Gg]=[Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Privilege-escalation binary execution on this host
    query: data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Dd][Oo][Aa][Ss]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Ss][Ee][Tt][Cc][Aa][Pp]|[Nn][Ee][Ww][Gg][Rr][Pp]|[Cc][Hh][Ss][Hh])/
    pivot_on:
    - host
    window: 2h
  - name: Credential & privilege-config file access on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/)
    pivot_on:
    - host
    window: 2h
  - name: Reverse-shell / C2 egress tooling on this host
    query: (data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt]|[Nn][Ee][Tt][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR (data_process_exec_process_arguments:/.* -[Ee] \/[Bb][Ii][Nn]\/.*/)
    pivot_on:
    - host
    window: 1h
