name: Linux Crypto Mining Indicators
id: 9069ea3c-b213-4c52-be13-86506a227ab1
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9069ea3c-b213-4c52-be13-86506a227ab1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command line parameters or strings often used by crypto miners. MITRE
  ATT&CK: T1496.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --cpu-priority=*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*--donate-level=0*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* -o pool.*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --nicehash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --algo=rx/0 *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*stratum+tcp://*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*stratum+udp://*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*sh -c /sbin/modprobe msr allow_writes=on*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*LS1kb25hdGUtbGV2ZWw9*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*0tZG9uYXRlLWxldmVsP*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*tLWRvbmF0ZS1sZXZlbD*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*c3RyYXR1bSt0Y3A6Ly*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*N0cmF0dW0rdGNwOi8v*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*zdHJhdHVtK3RjcDovL*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*c3RyYXR1bSt1ZHA6Ly*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*N0cmF0dW0rdWRwOi8v*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*zdHJhdHVtK3VkcDovL*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_arguments matches '* --cpu-priority=*';
  data_process_exec_process_arguments matches '*--donate-level=0*';
  data_process_exec_process_arguments matches '* -o pool.*', among other
  conditions.

known_false_positives: >
  Legitimate use of crypto miners. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.poolwatch.io/coin/monero
  - https://attack.mitre.org/techniques/T1496/

response:
  message: >
    Linux Crypto Mining Indicators detected on host $agent_name$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. MITRE ATT&CK: T1496
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_arguments
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1496
  custom_tags:
    - crypto
    - mining
    - indicators
    - linux
    - tetragon
    - process_creation
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_arguments:/.* --[Cc][Pp][Uu]-[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]=.*/ OR data_process_exec_process_arguments:/.*--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll]=0.*/ OR data_process_exec_process_arguments:/.* -[Oo] [Pp][Oo][Oo][Ll]\..*/ OR data_process_exec_process_arguments:/.* --[Nn][Ii][Cc][Ee][Hh][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* --[Aa][Ll][Gg][Oo]=[Rr][Xx]\/0 .*/ OR data_process_exec_process_arguments:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Tt][Cc][Pp]:\/\/.*/ OR data_process_exec_process_arguments:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Uu][Dd][Pp]:\/\/.*/ OR data_process_exec_process_arguments:/.*[Ss][Hh] -[Cc] \/[Ss][Bb][Ii][Nn]\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee] [Mm][Ss][Rr] [Aa][Ll][Ll][Oo][Ww]_[Ww][Rr][Ii][Tt][Ee][Ss]=[Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Ll][Ss]1[Kk][Bb]25[Hh][Dd][Gg][Uu][Tt][Bb][Gg][Vv]2[Zz][Ww][Ww]9.*/ OR data_process_exec_process_arguments:/.*0[Tt][Zz][Gg]9[Uu][Yy][Xx][Rr][Ll][Ll][Ww][Xx][Ll][Dd][Mm][Vv][Ss][Pp].*/ OR data_process_exec_process_arguments:/.*[Tt][Ll][Ww][Rr][Vv][Bb][Mm][Ff]0[Zz][Ss]1[Ss][Zz][Xx][Zz][Ll][Bb][Dd].*/ OR data_process_exec_process_arguments:/.*[Cc]3[Rr][Yy][Yy][Xx][Rr]1[Bb][Ss][Tt]0[Yy]3[Aa]6[Ll][Yy].*/ OR data_process_exec_process_arguments:/.*[Nn]0[Cc][Mm][Ff]0[Dd][Ww]0[Rr][Dd][Gg][Nn][Ww][Oo][Ii]8[Vv].*/ OR data_process_exec_process_arguments:/.*[Zz][Dd][Hh][Jj][Hh][Dd][Hh][Vv][Tt][Kk]3[Rr][Jj][Cc][Dd][Oo][Vv][Ll].*/ OR data_process_exec_process_arguments:/.*[Cc]3[Rr][Yy][Yy][Xx][Rr]1[Bb][Ss][Tt]1[Zz][Hh][Aa]6[Ll][Yy].*/ OR data_process_exec_process_arguments:/.*[Nn]0[Cc][Mm][Ff]0[Dd][Ww]0[Rr][Dd][Ww][Rr][Ww][Oo][Ii]8[Vv].*/ OR data_process_exec_process_arguments:/.*[Zz][Dd][Hh][Jj][Hh][Dd][Hh][Vv][Tt][Kk]3[Vv][Kk][Cc][Dd][Oo][Vv][Ll].*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
      name: "Disable Or Stop Services"
      reason: "next kill-chain tactic: Impact"
    - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
      name: "ESXi VM Kill Via ESXCLI"
      reason: "next kill-chain tactic: Impact"
    - id: 8a46f16c-8c4c-82d1-b121-0fdd3ba70a84
      name: "Group Has Been Deleted Via Groupdel"
      reason: "next kill-chain tactic: Impact"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Auditd activity on this host in the window"
      query: 'data_audit_type:*'
      pivot_on: [host]
      window: 1h
    - name: "Process execution (execve) on this host"
      query: 'data_audit_syscall:"execve"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
