name: Linux Crypto Mining Indicators
id: 9069ea3c-b213-4c52-be13-86506a227ab1
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9069ea3c-b213-4c52-be13-86506a227ab1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command line parameters or strings often used by crypto miners. MITRE
  ATT&CK: T1496.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --cpu-priority=*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*--donate-level=0*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* -o pool.*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --nicehash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --algo=rx/0 *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*stratum+tcp://*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*stratum+udp://*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*sh -c /sbin/modprobe msr allow_writes=on*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*LS1kb25hdGUtbGV2ZWw9*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*0tZG9uYXRlLWxldmVsP*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*tLWRvbmF0ZS1sZXZlbD*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*c3RyYXR1bSt0Y3A6Ly*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*N0cmF0dW0rdGNwOi8v*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*zdHJhdHVtK3RjcDovL*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*c3RyYXR1bSt1ZHA6Ly*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*N0cmF0dW0rdWRwOi8v*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*zdHJhdHVtK3VkcDovL*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_arguments matches '* --cpu-priority=*';
  data_process_exec_process_arguments matches '*--donate-level=0*';
  data_process_exec_process_arguments matches '* -o pool.*', among other
  conditions.

known_false_positives: >
  Legitimate use of crypto miners. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.poolwatch.io/coin/monero
  - https://attack.mitre.org/techniques/T1496/

response:
  message: >
    Linux Crypto Mining Indicators detected on host $agent_name$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. MITRE ATT&CK: T1496
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_arguments
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1496
  custom_tags:
    - crypto
    - mining
    - indicators
    - linux
    - tetragon
    - process_creation
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_arguments:/.* --[Cc][Pp][Uu]-[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]=.*/ OR data_process_exec_process_arguments:/.*--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll]=0.*/ OR data_process_exec_process_arguments:/.* -[Oo] [Pp][Oo][Oo][Ll]\..*/ OR data_process_exec_process_arguments:/.* --[Nn][Ii][Cc][Ee][Hh][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* --[Aa][Ll][Gg][Oo]=[Rr][Xx]\/0 .*/ OR data_process_exec_process_arguments:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Tt][Cc][Pp]:\/\/.*/ OR data_process_exec_process_arguments:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Uu][Dd][Pp]:\/\/.*/ OR data_process_exec_process_arguments:/.*[Ss][Hh] -[Cc] \/[Ss][Bb][Ii][Nn]\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee] [Mm][Ss][Rr] [Aa][Ll][Ll][Oo][Ww]_[Ww][Rr][Ii][Tt][Ee][Ss]=[Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Ll][Ss]1[Kk][Bb]25[Hh][Dd][Gg][Uu][Tt][Bb][Gg][Vv]2[Zz][Ww][Ww]9.*/ OR data_process_exec_process_arguments:/.*0[Tt][Zz][Gg]9[Uu][Yy][Xx][Rr][Ll][Ll][Ww][Xx][Ll][Dd][Mm][Vv][Ss][Pp].*/ OR data_process_exec_process_arguments:/.*[Tt][Ll][Ww][Rr][Vv][Bb][Mm][Ff]0[Zz][Ss]1[Ss][Zz][Xx][Zz][Ll][Bb][Dd].*/ OR data_process_exec_process_arguments:/.*[Cc]3[Rr][Yy][Yy][Xx][Rr]1[Bb][Ss][Tt]0[Yy]3[Aa]6[Ll][Yy].*/ OR data_process_exec_process_arguments:/.*[Nn]0[Cc][Mm][Ff]0[Dd][Ww]0[Rr][Dd][Gg][Nn][Ww][Oo][Ii]8[Vv].*/ OR data_process_exec_process_arguments:/.*[Zz][Dd][Hh][Jj][Hh][Dd][Hh][Vv][Tt][Kk]3[Rr][Jj][Cc][Dd][Oo][Vv][Ll].*/ OR data_process_exec_process_arguments:/.*[Cc]3[Rr][Yy][Yy][Xx][Rr]1[Bb][Ss][Tt]1[Zz][Hh][Aa]6[Ll][Yy].*/ OR data_process_exec_process_arguments:/.*[Nn]0[Cc][Mm][Ff]0[Dd][Ww]0[Rr][Dd][Ww][Rr][Ww][Oo][Ii]8[Vv].*/ OR data_process_exec_process_arguments:/.*[Zz][Dd][Hh][Jj][Hh][Dd][Hh][Vv][Tt][Kk]3[Vv][Kk][Cc][Dd][Oo][Vv][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Delivery precursor on the same host: the XMRig binary and its config are pulled into /tmp or /dev/shm with curl/wget and run immediately - this is how the miner this rule catches reached the host.'
  - id: ba592c6d-6888-43c3-b8c6-689b8fe47337
    name: Linux Base64 Encoded Pipe to Shell
    reason: 'Direct tie: this rule''s base64 blobs decode to miner arguments (LS1kb25hdGUtbGV2ZWw9 = ''--donate-level='', c3RyYXR1bSt0Y3A6Ly = ''stratum+tcp://''); they are launched by exactly this base64|sh dropper, so this fires on the same command that produced the crypto match.'
  - id: 880973f3-9708-491c-a77b-2a35a1921158
    name: Linux Shell Pipe to Shell
    reason: The plaintext install one-liner (curl ...|sh) that drops and starts the miner - the un-encoded sibling of the base64 dropper, same delivery step just before the miner runs.
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: Linux cryptojackers (Kinsing, TeamTNT) run the miner from /dev/shm to stay off disk; expect the actual miner process to show here on the same host within the window.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Co-occurring campaign step: the dropper disables AV/EDR and cloud security agents (e.g. Alibaba aegis) to keep the miner from being stopped - routinely runs seconds before or after miner launch.'
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: 'Cryptojacker housekeeping: systemctl/service stop is used to kill rival miners and cloud/monitoring agents and free the CPU for mining - a hallmark co-step, not just a shared Impact tag.'
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: The firewall is flushed so the miner's outbound stratum/pool traffic is unimpeded and the host is opened for SSH worming - a recurring step in TeamTNT/Kinsing miner installs.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Follow-on persistence: a crontab entry pointing at /tmp relaunches the miner after reboot or after it is killed - the mechanism that makes the mining survive remediation.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Miner process footprint on this host (binary names + XMRig/RandomX args)
    query: (data_process_exec_process_binary:/.*\/([Xx][Mm][Rr][Ii][Gg]|[Mm][Ii][Nn][Ee][Rr][Dd]|[Cc][Pp][Uu][Mm][Ii][Nn][Ee][Rr]|[Kk][Ii][Nn][Ss][Ii][Nn][Gg]|[Kk][Dd][Ee][Vv][Tt][Mm][Pp][Ff][Ss][Ii]).*/ OR data_process_exec_process_arguments:/.*([Xx][Mm][Rr][Ii][Gg]|[Rr][Aa][Nn][Dd][Oo][Mm][Xx]|[Cc][Rr][Yy][Pp][Tt][Oo][Nn][Ii][Gg][Hh][Tt]|[Mm][Oo][Nn][Ee][Rr][Oo]|[Hh][Aa][Ss][Hh][Rr][Aa][Tt][Ee]|--[Mm][Aa][Xx]-[Cc][Pp][Uu]-[Uu][Ss][Aa][Gg][Ee]|--[Cc][Oo][Ii][Nn]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Downloader staging the payload into a temp directory on this host
    query: ((data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll].*/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt].*/ OR data_process_exec_process_binary:/.*\/[Tt][Ff][Tt][Pp].*/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.* -[Oo] .*/))
    pivot_on:
    - host
    window: 4h
  - name: Fileless execution from shared memory or temp directories on this host
    query: (data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Cron or systemd persistence install on this host
    query: (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: Hashrate MSR tweak and preload/kernel-module hiding on this host
    query: ((data_process_exec_process_binary:/.*\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee].*/ AND data_process_exec_process_arguments:/.*[Mm][Ss][Rr].*/) OR data_process_exec_process_arguments:/.*[Ll][Dd]_[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/ OR data_process_exec_process_arguments:/.*[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/ OR data_process_exec_process_binary:/.*\/[Ii][Nn][Ss][Mm][Oo][Dd].*/)
    pivot_on:
    - host
    window: 2h
