name: Access of Sudoers File Content
id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
version: 1
schema_version: "1.0"
date: "2025-06-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a text-based file access or inspection utilities to
  read the content of /etc/sudoers in order to potentially list all users that
  have sudo rights. MITRE ATT&CK: T1592.004.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/cat"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ed"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/egrep"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/emacs"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/fgrep"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/grep"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/head"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/less"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/more"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/nano"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/tail"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "* /etc/sudoers*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/cat';
  data_process_exec_process_binary matches '*/ed';
  data_process_exec_process_binary matches '*/egrep', among other conditions.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/sleventyeleven/linuxprivchecker/
  - https://attack.mitre.org/techniques/T1592/004/

response:
  message: >
    Access of Sudoers File Content detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1592.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1592.004
  custom_tags:
    - sudoers
    - content
    - linux
    - tetragon
    - process_creation
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Ee][Gg][Rr][Ee][Pp]/ OR data_process_exec_process_binary:/.*\/[Ee][Mm][Aa][Cc][Ss]/ OR data_process_exec_process_binary:/.*\/[Ff][Gg][Rr][Ee][Pp]/ OR data_process_exec_process_binary:/.*\/[Gg][Rr][Ee][Pp]/ OR data_process_exec_process_binary:/.*\/[Hh][Ee][Aa][Dd]/ OR data_process_exec_process_binary:/.*\/[Ll][Ee][Ss][Ss]/ OR data_process_exec_process_binary:/.*\/[Mm][Oo][Rr][Ee]/ OR data_process_exec_process_binary:/.*\/[Nn][Aa][Nn][Oo]/ OR data_process_exec_process_binary:/.*\/[Tt][Aa][Ii][Ll]/) AND data_process_exec_process_arguments:/.* \/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Co-occurring privilege-escalation reconnaissance from the same linuxprivchecker script both rules cite: it flags the SUID hunt (find -perm -4000) and .htpasswd search that run in the same burst as reading /etc/sudoers to map escalation paths.'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Same recon cluster, different credential file: /etc/passwd and /etc/shadow are staged/read alongside /etc/sudoers to enumerate accounts and crack hashes, so this firing on the same host confirms account-enumeration intent.'
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Auditd/auth.log corroboration of the same /etc/sudoers read at the syscall level, and it also covers sudoers.d edits that this process-exec-of-read-utility rule cannot see.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Companion sudoers detection that additionally fires on NOPASSWD lines, catching the privilege-granting edit an attacker makes right after enumerating who may sudo.
  - id: linux-visudo-utility-execution-001
    name: Linux Visudo Utility Execution
    reason: 'Direct follow-on tamper: visudo editing /etc/sudoers shortly after the file was read indicates the attacker is now adding their own escalation entry rather than just inspecting it.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Follow-on privilege escalation/persistence: having read the sudoers config, the attacker grants themselves sudo by adding an account to the root/sudoers group with usermod -aG.'
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: 'Direct follow-on escalation: after learning which commands a user may sudo, the attacker abuses sudo via the -u#-1 bypass to execute as root.'
  - id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
    name: Doas Privilege Escalation Detection
    reason: Alternative escalation path the attacker pivots to via the doas sudo-replacement when sudoers enumeration shows sudo is restricted or logged.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sensitive credential and privilege files read on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*[Ss][Uu][Dd][Oo][Ee][Rr][Ss]\.[Dd].*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Privilege-escalation launchers and sudo abuse on this host
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Dd][Oo][Aa][Ss]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Nn][Ee][Ww][Gg][Rr][Pp])/ OR data_process_exec_process_arguments:/.* -[Uu]\#.*/)
    pivot_on:
    - host
    window: 2h
  - name: Sudoers file or privileged-group modification on this host
    query: (data_process_exec_process_binary:/.*\/[Vv][Ii][Ss][Uu][Dd][Oo]/ OR (data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*-[Aa][Gg] ([Rr][Oo][Oo][Tt]|[Ss][Uu][Dd][Oo][Ee][Rr][Ss]).*/) OR (data_process_exec_process_binary:/.*\/([Tt][Ee][Ee]|[Dd][Dd]|[Cc][Hh][Mm][Oo][Dd]|[Cc][Hh][Oo][Ww][Nn])/ AND data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: SUID and privilege-escalation discovery on this host
    query: (data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] [-\/]0?4000.*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -[Uu]=[Ss].*/ OR data_process_exec_process_binary:/.*\/[Gg][Ee][Tt][Cc][Aa][Pp]/ OR data_process_exec_process_arguments:/.*[Ll][Ii][Nn][Pp][Ee][Aa][Ss].*/ OR data_process_exec_process_arguments:/.*[Ll][Ii][Nn][Uu][Xx][Pp][Rr][Ii][Vv][Cc][Hh][Ee][Cc][Kk][Ee][Rr].*/)
    pivot_on:
    - host
    window: 1h
