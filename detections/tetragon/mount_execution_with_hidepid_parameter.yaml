name: Mount Execution With Hidepid Parameter
id: ec52985a-d024-41e3-8ff6-14169039a0b3
version: 1
schema_version: "1.0"
date: "2023-01-12"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ec52985a-d024-41e3-8ff6-14169039a0b3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "mount" command with "hidepid" parameter to make
  invisible processes to other users from the system. MITRE ATT&CK: T1564.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/mount"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*hidepid=2*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -o *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/mount';
  data_process_exec_process_arguments matches '*hidepid=2*';
  data_process_exec_process_arguments matches '* -o *'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.blackberry.com/
  - https://www.cyberciti.biz/faq/linux-hide-processes-from-other-users/
  - https://twitter.com/Joseliyo_Jstnk/status/1620131033474822144
  - https://attack.mitre.org/techniques/T1564/

response:
  message: >
    Mount Execution With Hidepid Parameter detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1564
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564
  custom_tags:
    - mount
    - hidepid
    - parameter
    - linux
    - tetragon
    - process_creation
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Mm][Oo][Uu][Nn][Tt]/ AND data_process_exec_process_arguments:/.*[Hh][Ii][Dd][Ee][Pp][Ii][Dd]=2.*/ AND data_process_exec_process_arguments:/.* -[Oo] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    name: Linux Kernel Module Insertion
    reason: 'insmod loading a kernel module is the escalated, kernel-level form of the same process-concealment goal: a LKM rootkit (e.g. Diamorphine) hides processes/files/ports far more thoroughly than hidepid=2. Both need CAP_SYS_ADMIN and are the same implant''s stealth setup, so an insmod on this host near the mount strongly indicates rootkit deployment, not admin tuning.'
  - id: f1e2d3c4-5b6a-7d8e-9f0a-1b2c3d4e5f6a
    name: Linux Kernel Module Load
    reason: modprobe is the alternate loader for the same kernel-rootkit beat as insmod; an attacker who remounts /proc to hide processes commonly also side-loads a process-hiding module. A modprobe of a non-stock module on this host within the window corroborates kernel-level stealth accompanying the user-space hidepid hiding.
  - id: 0326c3c8-7803-4a0f-8c5c-368f747f7c3e
    name: Triple Cross eBPF Rootkit Execve Hijack
    reason: This eBPF rootkit hooks execve to hide and hijack process execution — the exact same objective as hidepid=2 (making attacker processes invisible), achieved in-kernel via eBPF. Its presence on the host means the operator is layering eBPF-based process concealment on top of the /proc mount trick.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: Deleting audit rules (auditctl -D) blinds the Linux audit subsystem that would otherwise record the hidden processes' syscalls. Hiding processes from users and disabling the auditor that logs them are the same 'remove visibility' step, so an auditctl -D on this host in the same session is a direct companion action.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: Stopping/masking/killing EDR and AV agents (Wazuh, Falco, osquery, auditd, CrowdStrike) removes the sensors that would surface the concealed processes. A root operator who remounts /proc to evade per-user process visibility routinely also tears down endpoint monitoring in the same window — the defense-evasion sibling of this mount.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Deleting or shredding /var/log content is the anti-forensic follow-on to process hiding: after concealing live activity via hidepid=2, the operator erases the recorded evidence of how they got there. Log destruction on this host near the mount points to deliberate track-covering rather than maintenance.'
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Wiping .bash_history/.zsh_history removes the record of the very commands (including the hidepid mount and any rootkit install) typed in a hands-on-keyboard session. History deletion on the same host/user in the window is a strong tell that the hidepid mount was interactive intruder activity being cleaned up afterward.
  - id: 34979410-e4b5-4e5d-8cfb-389fdff05c12
    name: Remove Immutable File Attribute
    reason: chattr -i strips immutability so protected files (/etc/passwd, sudoers, SSH keys, service units) can be overwritten for implant and persistence setup. A root operator staging stealth via hidepid frequently unlocks such files in the same session; chattr -i on this host is part of the same implant-deployment chain.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Additional /proc remounts, hidepid, and bind-mount hiding on this host
    query: (data_process_exec_process_binary:/.*\/[Mm][Oo][Uu][Nn][Tt]/ AND data_process_exec_process_arguments:/.*([Hh][Ii][Dd][Ee][Pp][Ii][Dd]|[Rr][Ee][Mm][Oo][Uu][Nn][Tt]|[Bb][Ii][Nn][Dd]).*/) OR data_process_exec_process_binary:/.*\/[Uu][Mm][Oo][Uu][Nn][Tt]/
    pivot_on:
    - host
    window: 2h
  - name: Kernel module / rootkit load activity on this host
    query: data_process_exec_process_binary:/.*(\/[Ii][Nn][Ss][Mm][Oo][Dd]|\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]|\/[Rr][Mm][Mm][Oo][Dd]|\/[Kk][Mm][Oo][Dd]|\/[Dd][Ee][Pp][Mm][Oo][Dd])/
    pivot_on:
    - host
    window: 2h
  - name: Disabling auditing or security sensors on this host
    query: (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.* -[Dd].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]/ AND data_process_exec_process_arguments:/.*0.*/) OR ((data_process_exec_process_binary:/.*(\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee])/) AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Mm][Aa][Ss][Kk]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]).*/ AND data_process_exec_process_arguments:/.*([Aa][Uu][Dd][Ii][Tt][Dd]|[Ww][Aa][Zz][Uu][Hh]|[Ff][Aa][Ll][Cc][Oo]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Ss][Yy][Ss][Mm][Oo][Nn]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Log and shell-history tampering on this host
    query: ((data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\/[Uu][Nn][Ll][Ii][Nn][Kk])/) AND data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|[Ww][Tt][Mm][Pp]|[Bb][Tt][Mm][Pp]).*/) OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Aa][Tt][Tt][Rr]/ AND data_process_exec_process_arguments:/.* -[Ii].*/) OR (data_process_exec_process_binary:/.*\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Vv][Aa][Cc][Uu][Uu][Mm].*/)
    pivot_on:
    - host
    window: 4h
  - name: Privileged account and SSH-key persistence on this host
    query: ((data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr])/) AND data_process_exec_process_arguments:/.*([Ss][Uu][Dd][Oo]|[Rr][Oo][Oo][Tt]|[Ww][Hh][Ee][Ee][Ll]).*/) OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/
    pivot_on:
    - host
    window: 6h
