name: ESXi Syslog Configuration Change Via ESXCLI
id: 38eb1dbb-011f-40b1-a126-cf03a0210563
version: 1
schema_version: "1.0"
date: "2023-09-04"
author: Cedric Maurugeon
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 38eb1dbb-011f-40b1-a126-cf03a0210563
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the ESXi syslog configuration via "esxcli". MITRE ATT&CK:
  T1685, T1690, T1059.012.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/esxcli"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*system*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*syslog*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*config*"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* set*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/esxcli';
  data_process_exec_process_arguments matches '*system*';
  data_process_exec_process_arguments matches '*syslog*', among other
  conditions.

known_false_positives: >
  Legitimate administrative activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://support.solarwinds.com/SuccessCenter/s/article/Configure-ESXi-Syslog-to-LEM?language=en_US
  - https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_system.html
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1690/
  - https://attack.mitre.org/techniques/T1059/012/

response:
  message: >
    ESXi Syslog Configuration Change Via ESXCLI detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1685, T1690, T1059.012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
    - T1690
    - T1059.012
  custom_tags:
    - syslog
    - configuration
    - change
    - linux
    - tetragon
    - process_creation
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Ll][Oo][Gg].*/ AND data_process_exec_process_arguments:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/ AND data_process_exec_process_arguments:/.* [Ss][Ee][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
    name: ESXi VM Kill Via ESXCLI
    reason: Same */esxcli tool on the same host; 'esxcli vm process kill' is the destructive payoff that clearing/redirecting ESXi syslog is meant to blind first - killing running VMs to free their .vmdk files for encryption is the ESXiArgs/Cheerscrypt endgame this defense-impairment step directly precedes.
  - id: c830f15d-6f6e-430f-8074-6f73d6807841
    name: Logging Configuration Changes on Linux Host
    reason: 'Same defense-impairment intent (impair logging) on the same host from a second telemetry source (auditd): an actor who blinds the hypervisor''s syslog via esxcli routinely also tampers with the jump host''s own rsyslog/syslog-ng config. Co-occurrence confirms systematic logging destruction across the estate rather than a one-off admin edit.'
  - id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
    name: ESXi Admin Permission Assigned To Account Via ESXCLI
    reason: Same */esxcli toolset and host; 'esxcli system permission set ... Admin' grants an attacker-controlled account hypervisor admin rights. Privilege-escalation precursor that gives the operator the authority to reconfigure syslog and later kill and encrypt VMs.
  - id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
    name: ESXi Account Creation Via ESXCLI
    reason: Same */esxcli toolset and host; 'esxcli system account add' plants a persistent rogue ESXi account. Foothold/persistence precursor that typically pairs with the admin-permission grant and precedes this defense-impairment action.
  - id: 5f1573a7-363b-4114-9208-ad7a61de46eb
    name: ESXi VM List Discovery Via ESXCLI
    reason: Same */esxcli toolset and host; 'esxcli vm process list' enumerates running VMs to target. Reconnaissance precursor selecting the encryption targets that the syslog blind and the subsequent VM-kill operate on.
  - id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
    name: ESXi System Information Discovery Via ESXCLI
    reason: Same */esxcli toolset and host; 'esxcli system ...' enumerates accounts/modules/NTP to profile the hypervisor before tampering. Early recon in the same esxcli session that leads to this syslog reconfiguration.
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: Same */esxcli toolset and host; 'esxcli storage ...' maps the datastores where VM files live - behaviour the rule itself notes was seen with DarkSide and LockBit. Recon locating the files the campaign will encrypt once logging is blinded.
  - id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
    name: ESXi Network Configuration Discovery Via ESXCLI
    reason: Same */esxcli toolset and host; 'esxcli network ...' maps the hypervisor's network (vmknics/vSwitches/firewall). Recon in the same esxcli attack session that precedes syslog and firewall tampering.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ESXi firewall / SSH / shell / maintenance-mode tampering via esxcli on this host
    query: (data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND (data_process_exec_process_arguments:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_process_exec_process_arguments:/.*[Mm][Aa][Ii][Nn][Tt][Ee][Nn][Aa][Nn][Cc][Ee].*/ OR data_process_exec_process_arguments:/.*[Tt][Ss][Mm].*/ OR data_process_exec_process_arguments:/.*[Ss][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Ss][Hh][Ee][Ll][Ll].*/))
    pivot_on:
    - host
    window: 4h
  - name: Outbound SSH / SCP / SFTP client execution reaching the ESXi hosts
    query: data_process_exec_process_binary:/.*(\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp]|\/[Ss][Ss][Hh][Pp][Aa][Ss][Ss]|\/[Ss][Ss][Hh])/
    pivot_on:
    - host
    window: 4h
  - name: Encryptor download / payload staging tools on this host
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Tt][Aa][Rr]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Tt][Ff][Tt][Pp])/
    pivot_on:
    - host
    window: 4h
  - name: Host syslog / auditd daemon tampering (stop, edit, delete) on this host
    query: ((data_process_exec_process_arguments:/.*[Rr][Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Ll][Oo][Gg]-[Nn][Gg].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Dd][Ii][Tt][Dd].*/) AND (data_process_exec_process_binary:/.*(\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Dd]|\/[Tt][Ee][Ee]|\/[Rr][Mm]|\/[Vv][Ii]|\/[Nn][Aa][Nn][Oo]|\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|\/[Pp][Kk][Ii][Ll][Ll])/))
    pivot_on:
    - host
    window: 6h
