name: Suspicious Invocation of Shell via Rsync
id: 297241f3-8108-4b3a-8c15-2dda9f844594
version: 1
schema_version: "1.0"
date: "2025-01-18"
author: Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 297241f3-8108-4b3a-8c15-2dda9f844594
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a shell as sub process of "rsync" without the
  expected command line flag "-e" being used, which could be an indication of
  exploitation as described in CVE-2024-12084. This behavior is commonly
  associated with attempts to execute arbitrary commands or escalate privileges,
  potentially leading to unauthorized access or further exploitation. MITRE
  ATT&CK: T1059, T1203.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/rsync"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/rsyncd"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ash"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/bash"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/csh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/dash"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/ksh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/sh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/tcsh"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/zsh"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_process_exec_process_arguments"
        - bool:
            must_not:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* -e *"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/rsync';
  data_process_exec_parent_binary matches '*/rsyncd';
  data_process_exec_process_binary matches '*/ash', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://sysdig.com/blog/detecting-and-mitigating-cve-2024-12084-rsync-remote-code-execution/
  - https://gist.github.com/Neo23x0/a20436375a1e26524931dd8ea1a3af10
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1203/

response:
  message: >
    Suspicious Invocation of Shell via Rsync detected on host $agent_name$.
    Matched data_process_exec_parent_binary: $data_process_exec_parent_binary$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. MITRE ATT&CK: T1059, T1203
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1203
  custom_tags:
    - invocation
    - shell
    - rsync
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_parent_binary:/.*\/[Rr][Ss][Yy][Nn][Cc]/ OR data_process_exec_parent_binary:/.*\/[Rr][Ss][Yy][Nn][Cc][Dd]/) AND (data_process_exec_process_binary:/.*\/[Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Bb][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Cc][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Dd][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Kk][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Tt][Cc][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Zz][Ss][Hh]/) AND _exists_:data_process_exec_process_arguments AND NOT (data_process_exec_process_arguments:/.* -[Ee] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e2326866-609f-4015-aea9-7ec634e8aa04
    name: Shell Execution via Rsync - Linux
    reason: 'Complementary rsync-abuse detection on the same host: it fires when rsync spawns a shell WITH the ''-e'' flag (GTFOBins restricted-shell breakout / local privesc), whereas this rule fires on the no-''-e'' CVE-2024-12084 RCE path. Both mean the rsync/rsyncd binary is the unexpected parent of a shell, so either firing on this host confirms rsync is being abused beyond a single code path.'
  - id: c4042d54-110d-45dd-a0e1-05c47822c937
    name: Python Spawning Pretty TTY Via PTY Module
    reason: A shell spawned by the rsync daemon is non-interactive (no controlling TTY). The attacker's canonical first move is `python -c 'import pty; pty.spawn(...)'` to upgrade that dumb foothold into a real terminal; this firing on the same host right after the rsync shell confirms a human is now driving the RCE session.
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: The rsync-spawned shell's most common next action is to call back to the operator. `nc/ncat -e <shell>` establishing an outbound reverse shell on the same host within minutes turns this suspicious daemon shell into a confirmed interactive C2 foothold.
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: Once the foothold is upgraded to `bash -i`, the attacker's hands-on-keyboard commands (base64 decode, pty.spawn, whoami, nc, iptables) become children of that interactive bash and trip this rule. It is the downstream hands-on-keyboard phase of the same intrusion the rsync shell opened.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'After RCE the operator pulls second-stage tooling: curl/wget fetching a script into /tmp or /dev/shm and piping it to `sh -c`. On the same host shortly after the rsync shell, this is the ingress-tool-transfer step that escalates the foothold into a staged implant.'
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'Pairs directly with the download step: an implant fetched into /dev/shm is then executed from that RAM-backed tmpfs for fileless staging. A binary running from /dev/shm on the same host corroborates post-exploitation payload execution following the rsync foothold.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Persistence objective after the foothold: a crontab job installed from /tmp survives reboot and the eventual rsyncd patch. Seen on the same host after the rsync shell, it marks the attacker moving from transient access to durable persistence.'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Credential-access objective: rsyncd frequently runs as root, so dumping /etc/shadow or /etc/passwd is a prime post-RCE goal. A `cp` of passwd/shadow via a /tmp path on the same host after this alert confirms the attacker is harvesting credentials with the compromised daemon''s privileges.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by rsync / rsyncd (RCE blast radius)
    query: (data_process_exec_parent_binary:/.*\/[Rr][Ss][Yy][Nn][Cc]/ OR data_process_exec_parent_binary:/.*\/[Rr][Ss][Yy][Nn][Cc][Dd]/)
    pivot_on:
    - host
    window: 1h
  - name: Reverse shell / C2 callback from the foothold shell
    query: ((data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt]|[Nn][Ee][Tt][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/ AND data_process_exec_process_arguments:/.* -[Ee] .*/) OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt].*/)
    pivot_on:
    - host
    window: 1h
  - name: Second-stage payload download into tmp / shm
    query: ((data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Tt][Ff][Tt][Pp])/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/))
    pivot_on:
    - host
    window: 2h
  - name: Execution of a binary from tmpfs (/dev/shm, /tmp, /var/tmp)
    query: data_process_exec_process_binary:/\/([Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Tt][Mm][Pp]|[Vv][Aa][Rr]\/[Tt][Mm][Pp]|[Rr][Uu][Nn]\/[Ss][Hh][Mm])\/.*/
    pivot_on:
    - host
    window: 2h
  - name: Privilege escalation or credential theft after the foothold
    query: ((data_process_exec_process_binary:/.*\/([Pp][Kk][Ee][Xx][Ee][Cc]|[Ss][Uu][Dd][Oo]|[Ss][Uu])/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] .*4000.*/)
    pivot_on:
    - host
    window: 4h
