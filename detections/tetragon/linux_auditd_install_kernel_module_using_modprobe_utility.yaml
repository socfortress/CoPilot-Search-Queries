name: Linux Kernel Module Load
id: f1e2d3c4-5b6a-7d8e-9f0a-1b2c3d4e5f6a
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects execution of modprobe or any process attempting to
  load kernel modules, which can indicate unauthorized kernel
  manipulation or persistence mechanisms.
data_source:
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary: "*modprobe*"
              - wildcard:
                  full_log: "*modprobe*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "socfortress-lab-agent"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-29 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-29 23:59:59.999"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring modprobe helps detect attempts to load kernel modules for
  persistence or privilege escalation.
known_false_positives: >
  Legitimate kernel module loads by system administrators or automated
  system updates.
references:
  - https://attack.mitre.org/techniques/T1215/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    Kernel module load detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence
    - Kernel Module Monitoring
  asset_type: Linux
  mitre_attack_id:
    - T1215
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*modprobe.*/ OR full_log:/.*modprobe.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: Hidden dot-directories are a common drop zone; a wget into one shortly before shows the payload staging.
  - id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
    name: Program Executions in Suspicious Folders
    reason: 'Follow-on: files placed in a hidden directory are executed from it next.'
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'Same staging pattern: hidden files plus execution from /dev/shm.'
  - id: e2f3g4h5-6789-1011-1213-141516171819
    name: Linux File Permission Modification Detection
    reason: A hidden file is usually made executable with chmod right after creation.
  - id: a5b977d6-8a81-4475-91b9-49dbfcd941f7
    name: Remove Immutable File Attribute - Auditd
    reason: Adversaries planting hidden persistence files also tamper with chattr attributes.
  - id: a94cdd87-6c54-4678-a6cc-2814ffe5a13d
    name: Unix Shell Configuration Modification
    reason: Hidden dotfiles such as .bashrc/.profile are persistence targets; edits confirm persistence intent.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Hidden scripts are often wired into cron after creation.
  - id: 2fade0b6-7423-4835-9d4f-335b39b83867
    name: Shell Execution Of Process Located In Tmp Directory
    reason: Shell execution of a staged payload follows hidden-file staging.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Downloads preceding hidden staging
    query: (full_log:/.*curl.*/ OR full_log:/.*wget.*/ OR full_log:/.*scp .*/ OR full_log:/.*sftp.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: chmod/chattr on hidden paths
    query: ((full_log:/.*chmod.*/ OR full_log:/.*chattr.*/) AND full_log:/.*\/\..*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Execution from hidden paths
    query: ((full_log:/.*execve.*/ OR full_log:/.*exec.*/) AND (full_log:/.*\/tmp\/\..*/ OR full_log:/.*\/dev\/shm\/\..*/ OR full_log:/.*\/var\/tmp\/\..*/)) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Persistence edits in dotfiles and cron
    query: (full_log:/.*\.bashrc.*/ OR full_log:/.*\.profile.*/ OR full_log:/.*crontab.*/ OR full_log:/.*authorized_keys.*/ OR full_log:/.*rc\.local.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 24h
