name: Linux Kernel Module Load
id: f1e2d3c4-5b6a-7d8e-9f0a-1b2c3d4e5f6a
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects execution of modprobe or any process attempting to
  load kernel modules, which can indicate unauthorized kernel
  manipulation or persistence mechanisms.
data_source:
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary: "*modprobe*"
              - wildcard:
                  full_log: "*modprobe*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "socfortress-lab-agent"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-29 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-29 23:59:59.999"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring modprobe helps detect attempts to load kernel modules for
  persistence or privilege escalation.
known_false_positives: >
  Legitimate kernel module loads by system administrators or automated
  system updates.
references:
  - https://attack.mitre.org/techniques/T1215/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    Kernel module load detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence
    - Kernel Module Monitoring
  asset_type: Linux
  mitre_attack_id:
    - T1215
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*modprobe.*/ OR full_log:/.*modprobe.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Hidden payload files are commonly paired with cron entries that run them.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: A cron line appended to execute the hidden file is a typical persistence follow-on.
  - id: linux-unix-shell-configuration-modification-001
    name: Linux Unix Shell Configuration Modification
    reason: Dotfiles like .bashrc/.profile are hidden files attackers modify for persistence.
  - id: linux-file-creation-profile-directory-001
    name: Linux File Creation In Profile Directory
    reason: Hidden scripts dropped in profile.d execute at each login.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: A systemd unit pointing to the hidden binary is another persistence path.
  - id: a1b2c3d4-5678-9101-1121-314151617181
    name: Linux File Attribute Modification Detection
    reason: chattr/attribute changes are often applied to hidden files to hide or protect them.
  - id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
    name: Program Executions in Suspicious Folders
    reason: Hidden files staged in tmp-like directories are then executed from there.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution of hidden files or from hidden directories
    query: data_process_exec_process_binary:/.*\/\.[A-Za-z0-9_.-]+.*/
    pivot_on:
    - host
    window: 2h
  - name: 'Persistence mechanisms: cron, systemd, rc, profile'
    query: data_process_exec_process_arguments:/.*(\/etc\/cron|\/var\/spool\/cron|\/etc\/systemd\/system|\/etc\/rc\.local|\/etc\/profile\.d|\.bashrc|\.profile|authorized_keys).*/
    pivot_on:
    - host
    window: 4h
  - name: Permission and attribute changes on files
    query: data_process_exec_process_binary:/.*(\/[Cc][Hh][Mm][Oo][Dd]|\/[Cc][Hh][Aa][Tt][Tt][Rr]|\/[Cc][Hh][Oo][Ww][Nn])/
    pivot_on:
    - host
    window: 2h
  - name: Payload download to host
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Tt][Ff][Tt][Pp]|\/[Ss][Cc][Pp])/
    pivot_on:
    - host
    window: 2h
