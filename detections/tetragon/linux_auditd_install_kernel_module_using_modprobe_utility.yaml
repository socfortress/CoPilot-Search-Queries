name: Linux Kernel Module Load
id: f1e2d3c4-5b6a-7d8e-9f0a-1b2c3d4e5f6a
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects execution of modprobe or any process attempting to
  load kernel modules, which can indicate unauthorized kernel
  manipulation or persistence mechanisms.
data_source:
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary: "*modprobe*"
              - wildcard:
                  full_log: "*modprobe*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "socfortress-lab-agent"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-29 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-29 23:59:59.999"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring modprobe helps detect attempts to load kernel modules for
  persistence or privilege escalation.
known_false_positives: >
  Legitimate kernel module loads by system administrators or automated
  system updates.
references:
  - https://attack.mitre.org/techniques/T1215/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    Kernel module load detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence
    - Kernel Module Monitoring
  asset_type: Linux
  mitre_attack_id:
    - T1215
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*modprobe.*/ OR full_log:/.*modprobe.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    name: Linux Kernel Module Insertion
    reason: 'insmod is the other primary way to load an LKM: modprobe (this alert) resolves dependencies and then performs the same init_module/finit_module insertion insmod does directly. An insmod event on the same host in the window means the operator is loading modules by more than one tool - the hands-on-keyboard signature of someone force-loading a driver or rootkit, not a package-manager load.'
  - id: 474b415a-d917-4f3b-8c62-9e1a0d5f7b48
    name: Authencesn Crypto Module Load via Modprobe - Copy-Fail Indicator
    reason: This high-fidelity rule inspects the exact kmod/modprobe auto-load events this broad rule fires on. If the module being pulled in is crypto-authencesn, the modprobe here is the CVE-2026-31431 'Copy-Fail' AF_ALG kernel privilege-escalation trigger, not an admin loading a driver - it turns a generic module-load alert into a specific in-progress-exploit hypothesis.
  - id: d9f4b1a6-3c52-4a5c-9c8e-6b7f3e21a0dd
    name: Linux Kernel Driver Activity Detection
    reason: 'Fires on access/writes under /kernel/drivers/, the on-disk tree where .ko module files live. A .ko dropped into or read from that tree on the same host is the file-side half of this load: either the attacker staged the module just before modprobe pulled it in, or it is evidence of the module now resident in the kernel.'
  - id: linux-kernel-module-rmmod-utility-001
    name: Linux Kernel Module Using Rmmod Utility
    reason: 'rmmod removes a loaded module - the unload counterpart to this load. In a kernel-tampering session the two go together: operators rmmod the auditd/security LKM to blind the host before modprobe-loading their own module, or swap a module out and back. rmmod near this alert marks deliberate module manipulation, not a one-off driver load.'
  - id: 106d7cbd-80ff-4985-b682-a7043e5acb72
    name: Loading of Kernel Module via Insmod
    reason: The same kernel-module insertion seen through the auditd SYSCALL lens (data_audit_command=insmod, exe=/usr/bin/kmod) rather than Tetragon process_exec. A matching auditd module-load event confirms a real init_module syscall fired and corroborates this alert across sensors, rather than it being only a process-name match on 'modprobe'.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Loading an unsigned or unexpected LKM is blocked by SELinux policy, kernel lockdown and EDR. This rule catches the precursor: setenforce 0 and stopping firewalld/EDR (falcon-sensor, cbdaemon) to clear the way. A security-tool takedown on the same host shortly before the load is the evasion step that makes this module load malicious.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: A malicious .ko or rootkit installer rarely originates on the host - it is fetched with curl/wget into /tmp or /dev/shm and run. This rule catches that acquisition-and-stage step immediately before modprobe loads the delivered module, answering the analyst's 'where did the module come from' question.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other kernel-module management tooling run on this host
    query: data_process_exec_process_binary:/.*\/([Ii][Nn][Ss][Mm][Oo][Dd]|[Rr][Mm][Mm][Oo][Dd]|[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]|[Kk][Mm][Oo][Dd]|[Dd][Ee][Pp][Mm][Oo][Dd]|[Mm][Oo][Dd][Ii][Nn][Ff][Oo]|[Ll][Ss][Mm][Oo][Dd])/
    pivot_on:
    - host
    window: 2h
  - name: On-host compilation or staging of a kernel module (.ko / build toolchain)
    query: ((data_process_exec_process_binary:/.*\/([Gg][Cc][Cc]|[Cc][Cc]|[Cc][Ll][Aa][Nn][Gg]|[Gg]\+\+|[Mm][Aa][Kk][Ee]|[Tt][Cc][Cc])/) OR (data_process_exec_process_arguments:/.*(\.[Kk][Oo]|\/[Ll][Ii][Bb]\/[Mm][Oo][Dd][Uu][Ll][Ee][Ss]|\/[Uu][Ss][Rr]\/[Ss][Rr][Cc]\/[Ll][Ii][Nn][Uu][Xx])/))
    pivot_on:
    - host
    window: 4h
  - name: Kernel-module load restrictions disabled on this host (SELinux / AppArmor / lockdown / sig enforce)
    query: ((data_process_exec_process_binary:/.*\/([Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]|[Aa][Aa]-[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Aa][Aa]-[Cc][Oo][Mm][Pp][Ll][Aa][Ii][Nn]|[Aa][Aa]-[Tt][Ee][Aa][Rr][Dd][Oo][Ww][Nn])/) OR (data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Ee][Ll][Ii][Nn][Uu][Xx]|[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]|[Ll][Oo][Cc][Kk][Dd][Oo][Ww][Nn]|[Mm][Oo][Dd][Uu][Ll][Ee]_[Ss][Ii][Gg])/))
    pivot_on:
    - host
    window: 2h
  - name: Payload acquisition or execution from a world-writable staging directory on this host
    query: ((data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Tt][Ff][Tt][Pp]|[Ss][Cc][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt])/) OR (data_process_exec_process_binary:/.*\/([Tt][Mm][Pp]|[Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Vv][Aa][Rr]\/[Tt][Mm][Pp])\/.*/))
    pivot_on:
    - host
    window: 4h
  - name: Kernel-module boot persistence configured on this host (/etc/modules, modprobe.d, modules-load.d)
    query: data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Mm][Oo][Dd][Uu][Ll][Ee][Ss]|\/[Ee][Tt][Cc]\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]\.[Dd]|\/[Ee][Tt][Cc]\/[Mm][Oo][Dd][Uu][Ll][Ee][Ss]-[Ll][Oo][Aa][Dd])/
    pivot_on:
    - host
    window: 6h
