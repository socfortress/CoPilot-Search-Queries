name: Potentially Suspicious Execution From Tmp Folder
id: 312b42b1-bded-4441-8b58-163a3af58775
version: 1
schema_version: "1.0"
date: "2025-08-05"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 312b42b1-bded-4441-8b58-163a3af58775
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a potentially suspicious execution of a process located in the '/tmp/'
  folder. MITRE ATT&CK: T1036.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "/tmp/*"
              case_insensitive: true
        - exists:
            field: "data_process_exec_process_binary"
        - bool:
            must_not:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/usr/bin/nextcloud"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '/tmp/*';
  data_process_exec_process_binary matches '*/usr/bin/nextcloud'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.jpcert.or.jp/en/2023/05/gobrat.html
  - https://jstnk9.github.io/jstnk9/research/GobRAT-Malware/
  - https://www.virustotal.com/gui/file/60bcd645450e4c846238cf0e7226dc40c84c96eba99f6b2cffcd0ab4a391c8b3/detection
  - https://www.virustotal.com/gui/file/3e44c807a25a56f4068b5b8186eee5002eed6f26d665a8b791c472ad154585d1/detection
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Potentially Suspicious Execution From Tmp Folder detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1036
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - folder
    - linux
    - tetragon
    - process_creation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ AND _exists_:data_process_exec_process_binary AND NOT (data_process_exec_process_binary:/.*\/[Uu][Ss][Rr]\/[Bb][Ii][Nn]\/[Nn][Ee][Xx][Tt][Cc][Ll][Oo][Uu][Dd]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'Direct precursor: wget writing output into /tmp is exactly how the binary this rule later sees executing got staged there. If this fired on the same host minutes earlier, it names the C2/download source and the dropped filename.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Direct precursor and dropper: curl/wget fetching into /tmp or /dev/shm followed by sh -c execution. It is the single-command version of the chain this rule detects the tail of (the actual run from /tmp).'
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: 'Weaponization step immediately before this event: a dropped file in /tmp is not executable until chmod +x is run on it. This rule''s query explicitly covers chmod against /tmp, so a hit is the missing link between download and execution.'
  - id: 2fade0b6-7423-4835-9d4f-335b39b83867
    name: Shell Execution Of Process Located In Tmp Directory
    reason: 'Same process lineage, opposite end: this rule flags the /tmp binary executing, that rule flags the shell it spawns (parent_binary in /tmp). The two fire on the same parent/child exec pair and together prove the /tmp binary is interactively driving the host.'
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'Adjacent staging location: /dev/shm is the RAM-backed world-writable sibling of /tmp used for the same fileless payload drop. Attackers who run from /tmp routinely use /dev/shm too, so a co-occurring hit widens one drop into a staging footprint.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Canonical follow-on: a payload run from /tmp commonly establishes C2 via netcat -e <shell>. A hit on the same host shortly after confirms the dropped binary is a backdoor/stager rather than a benign temp file.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'Most common real-world payload identity: opportunistic Linux intrusions overwhelmingly drop a cryptominer into /tmp and launch it. Miner command-line args (stratum+tcp, --donate-level, -o pool.) on the same host identify what the /tmp binary actually is.'
  - id: e34cfa0c-0a50-4210-9cb3-5632d08eb041
    name: Potential GobRAT File Discovery Via Grep
    reason: 'Campaign-specific follow-on: this rule''s own references are GobRAT analyses, and GobRAT drops/runs from tmp-like paths. Grep for GobRAT artifacts (apached, frpc, sshd.sh, zone.arm) on the same host is strong corroboration of a GobRAT infection behind the /tmp execution.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ingress tool transfer (downloader binaries) on this host
    query: data_process_exec_process_binary:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Tt][Ff][Tt][Pp]|[Ss][Cc][Pp]|[Ss][Ff][Tt][Pp]|[Ff][Tt][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 6h
  - name: Chmod/chown making a file in a world-writable staging dir executable
    query: (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Cc][Hh][Oo][Ww][Nn])/) AND (data_process_exec_process_arguments:/.*\/([Tt][Mm][Pp]|[Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Vv][Aa][Rr]\/[Tt][Mm][Pp])\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other executions from world-writable staging directories on this host
    query: data_process_exec_process_binary:/\/([Tt][Mm][Pp]|[Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Vv][Aa][Rr]\/[Tt][Mm][Pp]|[Rr][Uu][Nn]\/[Ss][Hh][Mm])\/.*/
    pivot_on:
    - host
    window: 6h
  - name: Reverse shell / C2 indicators spawned around the drop
    query: (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Mm][Kk][Ff][Ii][Ff][Oo].*/ OR (data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt])/ AND data_process_exec_process_arguments:/.* -[Ee] .*/))
    pivot_on:
    - host
    window: 1h
  - name: Persistence or privilege-escalation setup after the drop
    query: ((data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ AND data_process_exec_process_arguments:/.* -[Ee].*/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/([Cc][Rr][Oo][Nn]|[Ss][Yy][Ss][Tt][Ee][Mm][Dd]|[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd]).*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -4000 .*/)
    pivot_on:
    - host
    window: 6h
