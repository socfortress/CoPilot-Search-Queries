name: History File Deletion
id: 1182f3b3-e716-4efa-99ab-d2685d04360f
version: 1
schema_version: "1.0"
date: "2022-09-15"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1182f3b3-e716-4efa-99ab-d2685d04360f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects events in which a history file gets deleted, e.g. the ~/bash_history
  to remove traces of malicious activity. MITRE ATT&CK: T1565.001.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/rm"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/unlink"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/shred"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/.bash_history*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/.zsh_history*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*_history"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*.history"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*zhistory"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/rm';
  data_process_exec_process_binary matches '*/unlink';
  data_process_exec_process_binary matches '*/shred', among other conditions.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/sleventyeleven/linuxprivchecker/
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.003/T1552.003.md
  - https://attack.mitre.org/techniques/T1565/001/

response:
  message: >
    History File Deletion detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1565.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1565.001
  custom_tags:
    - history
    - deletion
    - linux
    - tetragon
    - process_creation
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Rr][Mm]/ OR data_process_exec_process_binary:/.*\/[Uu][Nn][Ll][Ii][Nn][Kk]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh][Rr][Ee][Dd]/) AND (data_process_exec_process_arguments:/.*\/\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_process_exec_process_arguments:/.*\/\.[Zz][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_process_exec_process_arguments:/.*_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]/ OR data_process_exec_process_arguments:/.*\.[Hh][Ii][Ss][Tt][Oo][Rr][Yy]/ OR data_process_exec_process_arguments:/.*[Zz][Hh][Ii][Ss][Tt][Oo][Rr][Yy]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Same rm/shred/unlink tool-set turned on /var/log instead of the shell history. Wiping command history and system logs together is one coordinated evidence-destruction action and the clearest sign this is malicious cleanup, not admin tidying.
  - id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
    name: Syslog Clearing or Removal Via System Utilities
    reason: Empties /var/log/syslog (truncate, redirection to /dev/null, journalctl --vacuum) in the same track-covering phase; syslog records the very session the actor is simultaneously erasing from shell history.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: auditctl -D destroys the kernel audit trail. Blinding auditd is the same anti-forensics intent as erasing command history and is typically done in the same hands-on session to stop the host recording what comes next.
  - id: 34979410-e4b5-4e5d-8cfb-389fdff05c12
    name: Remove Immutable File Attribute
    reason: 'chattr -i is the enabling precursor: a hardened host marks ~/.bash_history (or logs) immutable, so the attacker must strip the immutable bit before rm/shred can succeed. A chattr -i on this host just before this alert is near-proof of deliberate tampering.'
  - id: d7821ff1-4527-4e33-9f84-d0d57fa2fb66
    name: Print History File Contents
    reason: 'The read-then-destroy pair: attackers cat/head/tail the same history file to mine it for credentials and paths, then delete it. A prior Print on this host is the reconnaissance step that motivates this deletion of the exact same file.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: This is the hands-on-keyboard session the history deletion is destroying - bash -i spawning nc/netcat/base64/pty.spawn/whoami. If it fired on this host you have recovered the interactive activity the attacker tried to erase.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: Stopping EDR/firewall (falcon-sensor, firewalld, SELinux setenforce 0) is the defense-evasion that rides alongside track-covering; an actor erasing their footprint commonly disables the sensors that would catch the next action.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Coordinated log, audit and evidence destruction on this host
    query: ((data_process_exec_process_binary:/.*(\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]|\/[Cc][Hh][Aa][Tt][Tt][Rr])/) OR (data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg].*/) OR (data_process_exec_process_arguments:/.*[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll] --[Vv][Aa][Cc][Uu][Uu][Mm].*/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Nn][Uu][Ll][Ll].*/))
    pivot_on:
    - host
    window: 2h
  - name: Interactive shell and interpreter activity (reconstruct the erased session)
    query: ((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/) OR (data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/))
    pivot_on:
    - host
    window: 2h
  - name: Reconnaissance and credential / secret-file access on this host
    query: ((data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Ll][Aa][Ss][Tt]|\/[Nn][Mm][Aa][Pp])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/) OR (data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence installed around the cleanup (cron, systemd, authorized_keys, shell profiles)
    query: ((data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/) OR (data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd].*/))
    pivot_on:
    - host
    window: 4h
  - name: Security-service and firewall tampering on this host
    query: (((data_process_exec_process_binary:/.*(\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg])/) AND (data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]).*/) AND (data_process_exec_process_arguments:/.*([Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Dd]|[Ff][Aa][Ll][Cc][Oo][Nn]-[Ss][Ee][Nn][Ss][Oo][Rr]|[Aa][Uu][Dd][Ii][Tt][Dd]|[Ww][Aa][Zz][Uu][Hh]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Cc][Ll][Aa][Mm]).*/)) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]/) OR (data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]/ AND data_process_exec_process_arguments:/.* -[Ff].*/) OR (data_process_exec_process_binary:/.*\/[Uu][Ff][Ww]/ AND data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/))
    pivot_on:
    - host
    window: 2h
