name: ESXi VSAN Information Discovery Via ESXCLI
id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
version: 1
schema_version: "1.0"
date: "2023-09-04"
author: Nasreddine Bencherchali (Nextron Systems), Cedric Maurugeon
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "esxcli" command with the "vsan" flag in order to
  retrieve information about virtual storage. Seen used by malware such as
  DarkSide. MITRE ATT&CK: T1033, T1007, T1059.012.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/esxcli"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*vsan*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* get*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* list*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/esxcli';
  data_process_exec_process_arguments matches '*vsan*';
  data_process_exec_process_arguments matches '* get*', among other conditions.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.trendmicro.com/en_us/research/21/e/darkside-linux-vms-targeted.html
  - https://www.trendmicro.com/en_us/research/22/a/analysis-and-Impact-of-lockbit-ransomwares-first-linux-and-vmware-esxi-variant.html
  - https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_vsan.html
  - https://attack.mitre.org/techniques/T1033/
  - https://attack.mitre.org/techniques/T1007/
  - https://attack.mitre.org/techniques/T1059/012/

response:
  message: >
    ESXi VSAN Information Discovery Via ESXCLI detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1033, T1007, T1059.012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
    - T1007
    - T1059.012
  custom_tags:
    - information
    - esxcli
    - linux
    - tetragon
    - process_creation
    - discovery
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Vv][Ss][Aa][Nn].*/ AND (data_process_exec_process_arguments:/.* [Gg][Ee][Tt].*/ OR data_process_exec_process_arguments:/.* [Ll][Ii][Ss][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
    name: ESXi VM Kill Via ESXCLI
    reason: 'Immediate pre-encryption impact step: after mapping vSAN storage the operator kills running VMs with ''esxcli vm process kill'' to release their VMDK/VMX file locks so they can be encrypted. vSAN discovery followed by VM kills on the same host is the DarkSide/LockBit ESXi ransomware staging signature.'
  - id: 5f1573a7-363b-4114-9208-ad7a61de46eb
    name: ESXi VM List Discovery Via ESXCLI
    reason: 'Co-occurring enumeration in the same recon burst: ''esxcli vm process list'' inventories the guest VMs to target, run right alongside this vSAN lookup; together they tell the operator exactly what to stop and encrypt.'
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: 'Nearest-sibling reconnaissance: vSAN IS the storage layer, so ''esxcli storage'' get/list maps the datastores/VMFS volumes holding the VMDK files and is typically executed in the same breath as the vSAN query.'
  - id: 38eb1dbb-011f-40b1-a126-cf03a0210563
    name: ESXi Syslog Configuration Change Via ESXCLI
    reason: 'Defense-evasion follow-on: ''esxcli system syslog config set'' redirects or disables host logging to blind responders before the VMs are stopped and the datastore is encrypted.'
  - id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
    name: ESXi Admin Permission Assigned To Account Via ESXCLI
    reason: 'Privilege-escalation precursor (HIGH severity): ''esxcli system permission set'' grants Admin to the attacker''s account, establishing the hands-on-keyboard foothold on this same host from which the vSAN recon is launched.'
  - id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
    name: ESXi Account Creation Via ESXCLI
    reason: 'Persistence/foothold precursor: ''esxcli system account add'' creates the local ESXi account the operator then uses to run this discovery and the subsequent VM-kill/encryption impact.'
  - id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
    name: ESXi System Information Discovery Via ESXCLI
    reason: 'Co-occurring host-profiling recon: ''esxcli system'' get/list enumerates the hypervisor (version, uptime, UUID) as part of the same discovery sweep that includes this vSAN lookup.'
  - id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
    name: ESXi Network Configuration Discovery Via ESXCLI
    reason: 'Co-occurring recon in the same burst: ''esxcli network'' get/list maps the host''s management/vMotion networking, routinely paired with storage and VM discovery during ESXi ransomware staging.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ESXi VM power-off / kill (pre-encryption staging) on this host
    query: ((data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_process_exec_process_arguments:/.*[Kk][Ii][Ll][Ll].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*([Pp][Oo][Ww][Ee][Rr]\.[Oo][Ff][Ff]|[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff]|[Gg][Ee][Tt][Aa][Ll][Ll][Vv][Mm][Ss]).*/))
    pivot_on:
    - host
    window: 2h
  - name: 'ESXi defense evasion: firewall disabled or SSH/shell enabled on this host'
    query: ((data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk] [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND data_process_exec_process_arguments:/.* [Ss][Ee][Tt].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*([Ee][Nn][Aa][Bb][Ll][Ee]_[Ss][Ss][Hh]|[Ee][Nn][Aa][Bb][Ll][Ee]_[Ee][Ss][Xx]_[Ss][Hh][Ee][Ll][Ll]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Datastore / VMDK-VMX-VMSN file access (encryption target) on this host
    query: ((data_process_exec_process_arguments:/.*\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss].*/) OR (data_process_exec_process_arguments:/.*\.[Vv][Mm][Dd][Kk].*/) OR (data_process_exec_process_arguments:/.*\.[Vv][Mm][Xx].*/) OR (data_process_exec_process_arguments:/.*\.[Vv][Mm][Ss][Nn].*/))
    pivot_on:
    - host
    window: 4h
  - name: ESXi snapshot removal (inhibit recovery) on this host
    query: (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt]\.[Rr][Ee][Mm][Oo][Vv][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: ESXi admin-CLI command sequence (esxcli / vim-cmd / esxcfg burst) on this host
    query: (data_process_exec_process_binary:/.*\/([Ee][Ss][Xx][Cc][Ll][Ii]|[Vv][Ii][Mm]-[Cc][Mm][Dd]|[Vv][Mm][Ww][Aa][Rr][Ee]-[Vv][Ii][Mm]-[Cc][Mm][Dd]|[Ee][Ss][Xx][Cc][Ff][Gg]-.*)/)
    pivot_on:
    - host
    window: 2h
