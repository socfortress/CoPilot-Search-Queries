name: Suspicious Invocation of Shell via AWK - Linux
id: 8c1a5675-cb85-452f-a298-b01b22a51856
version: 1
schema_version: "1.0"
date: "2024-09-02"
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8c1a5675-cb85-452f-a298-b01b22a51856
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "awk" or it's sibling commands, to invoke a shell
  using the system() function. This behavior is commonly associated with
  attempts to execute arbitrary commands or escalate privileges, potentially
  leading to unauthorized access or further exploitation. MITRE ATT&CK: T1059.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/awk"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/gawk"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/mawk"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/nawk"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "*BEGIN {system*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/dash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/fish*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/zsh*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/awk';
  data_process_exec_process_binary matches '*/gawk';
  data_process_exec_process_binary matches '*/mawk', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/awk/#shell
  - https://gtfobins.github.io/gtfobins/gawk/#shell
  - https://gtfobins.github.io/gtfobins/nawk/#shell
  - https://gtfobins.github.io/gtfobins/mawk/#shell
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Suspicious Invocation of Shell via AWK - Linux detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - invocation
    - shell
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Aa][Ww][Kk]/ OR data_process_exec_process_binary:/.*\/[Gg][Aa][Ww][Kk]/ OR data_process_exec_process_binary:/.*\/[Mm][Aa][Ww][Kk]/ OR data_process_exec_process_binary:/.*\/[Nn][Aa][Ww][Kk]/) AND data_process_exec_process_arguments:/.*[Bb][Ee][Gg][Ii][Nn] \{[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ff][Ii][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Reading /etc/sudoers (or sudo -l) to learn which binary a low-priv user may run as root is the direct precursor to `sudo awk 'BEGIN{system("/bin/sh")}'`; on this host shortly before the AWK breakout it confirms a sudo-based privilege-escalation path.
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Catches SUID-binary discovery (find -perm -4000) and credential-file hunting — the privilege-escalation enumeration an operator runs to pick an exploitable GTFOBins binary like awk before breaking out.
  - id: 6adfbf8f-52be-4444-9bac-81b539624146
    name: Shell Execution via Find - Linux
    reason: Identical GTFOBins shell-breakout via a different allowed binary (find . -exec /bin/sh); an operator working the GTFOBins menu on this host for privesc or restricted-shell escape commonly trips both in one session.
  - id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
    name: Vim GTFOBin Abuse - Linux
    reason: Another GTFOBins breakout used specifically to escape restricted shells/environments — the same objective as `awk BEGIN{system}`; co-occurrence on one host points to a deliberate interactive breakout, not incidental tool use.
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: The AWK system("/bin/bash") call yields an interactive `bash -i`; this rule fires on that shell spawning staging/recon children (base64, pty.spawn, inline -c import) — the attacker's very next actions after the breakout.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Once the breakout yields an interactive (often root) shell, writing a cron job is the go-to persistence; cron activity on this host soon after the AWK shell is a strong follow-on signal.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: With the root shell obtained via the sudo-awk breakout, copying or reading /etc/passwd and /etc/shadow for offline cracking is a primary objective — a credential-access follow-on on the same host.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: After acting on objectives through the spawned shell, clearing system logs to cover the intrusion is the typical anti-forensics tail; on this host it corroborates hands-on-keyboard activity begun with the AWK breakout.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GTFOBins shell-escape or interpreter launched under sudo (privilege escalation)
    query: data_process_exec_parent_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND (data_process_exec_process_binary:/.*\/[Gg]?[Aa][Ww][Kk]/ OR data_process_exec_process_binary:/.*\/[Mm][Aa][Ww][Kk]/ OR data_process_exec_process_binary:/.*\/[Nn][Aa][Ww][Kk]/ OR data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]?/ OR data_process_exec_process_binary:/.*\/[Pp][Ee][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3?/ OR data_process_exec_process_binary:/.*\/[Rr][Uu][Bb][Yy]/ OR data_process_exec_process_binary:/.*\/[Nn][Mm][Aa][Pp]/)
    pivot_on:
    - host
    window: 1h
  - name: Other GTFOBins LOLBin shell-breakouts on this host
    query: (data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]?/ OR data_process_exec_process_binary:/.*\/[Gg][Ii][Tt]/ OR data_process_exec_process_binary:/.*\/[Rr][Ss][Yy][Nn][Cc]/ OR data_process_exec_process_binary:/.*\/[Nn][Ii][Cc][Ee]/ OR data_process_exec_process_binary:/.*\/[Ff][Ll][Oo][Cc][Kk]/ OR data_process_exec_process_binary:/.*\/[Ee][Nn][Vv]/ OR data_process_exec_process_binary:/.*\/[Cc][Aa][Pp][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Pp][Ee][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Nn][Mm][Aa][Pp]/) AND (data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\(.*/ OR data_process_exec_process_arguments:/.*-[Ee][Xx][Ee][Cc].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/)
    pivot_on:
    - host
    window: 2h
  - name: Privilege-escalation enumeration on this host (sudo -l, /etc/sudoers, SUID discovery)
    query: (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*-[Ll].*/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR (data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm].*/ AND data_process_exec_process_arguments:/.*4000.*/) OR (data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm].*/ AND data_process_exec_process_arguments:/.*-[Uu]=[Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Post-breakout identity, system and network reconnaissance on this host
    query: data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ss][Ss]|\/[Aa][Rr][Pp]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Bb]_[Rr][Ee][Ll][Ee][Aa][Ss][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Persistence and credential-file access following the shell breakout
    query: data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Ee][Nn][Aa][Bb][Ll][Ee].*/)
    pivot_on:
    - host
    window: 4h
