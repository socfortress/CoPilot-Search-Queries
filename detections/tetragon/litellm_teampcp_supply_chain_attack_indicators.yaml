name: LiteLLM / TeamPCP Supply Chain Attack Indicators
id: 36603778-030c-43c4-8cbb-cd3c1d1a80c7
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36603778-030c-43c4-8cbb-cd3c1d1a80c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process executions related to the backdoored versions of LiteLLM
  (v1.82.7 or v1.82.8). In March 2026, a supply chain attack was discovered
  involving the popular open-source LLM framework LiteLLM by Threat Actor
  TeamPCP. The malicious package harvests every credential on the system,
  encrypts and exfiltrates them, and installs a persistent C2 backdoor. MITRE
  ATT&CK: T1195.002, T1560.001, T1543.002.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/python3*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*exec(base64.b64decode('aW1wb3J0*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*kI2NF9TQ1JJUFQgPSAiYV*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/tar"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*tpcp.tar.gz*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*payload.enc*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*session.key.enc*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/curl"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*models.litellm.cloud*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*X-Filename: tpcp.tar.gz*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_parent_binary:
                          value: "*/python3*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*systemctl*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*--user*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*sysmon*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/python3*';
  data_process_exec_process_arguments matches
  '*exec(base64.b64decode('aW1wb3J0*'; data_process_exec_process_arguments
  matches '*kI2NF9TQ1JJUFQgPSAiYV*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://novasky.io/hunts/hunting-litellm-supply-chain
  - https://www.virustotal.com/gui/file/71e35aef03099cd1f2d6446734273025a163597de93912df321ef118bf135238/
  - https://huskyhacks.io/posts/litellm-cred-stealer/
  - https://www.wiz.io/blog/threes-a-crowd-teampcp-trojanizes-litellm-in-continuation-of-campaign
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1560/001/
  - https://attack.mitre.org/techniques/T1543/002/

response:
  message: >
    LiteLLM / TeamPCP Supply Chain Attack Indicators detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1195.002, T1560.001, T1543.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1195.002
    - T1560.001
    - T1543.002
  custom_tags:
    - litellm
    - teampcp
    - supply
    - linux
    - tetragon
    - process_creation
    - initial_access
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: "((data_process_exec_process_binary:/.*\\/[Pp][Yy][Tt][Hh][Oo][Nn]3.*/ AND data_process_exec_process_arguments:/.*[Ee][Xx][Ee][Cc]\\([Bb][Aa][Ss][Ee]64\\.[Bb]64[Dd][Ee][Cc][Oo][Dd][Ee]\\('[Aa][Ww]1[Ww][Bb]3[Jj]0.*/ AND data_process_exec_process_arguments:/.*[Kk][Ii]2[Nn][Ff]9[Tt][Qq]1[Jj][Jj][Uu][Ff][Qq][Gg][Pp][Ss][Aa][Ii][Yy][Vv].*/) OR (data_process_exec_process_binary:/.*\\/[Tt][Aa][Rr]/ AND data_process_exec_process_arguments:/.*[Tt][Pp][Cc][Pp]\\.[Tt][Aa][Rr]\\.[Gg][Zz].*/ AND data_process_exec_process_arguments:/.*[Pp][Aa][Yy][Ll][Oo][Aa][Dd]\\.[Ee][Nn][Cc].*/ AND data_process_exec_process_arguments:/.*[Ss][Ee][Ss][Ss][Ii][Oo][Nn]\\.[Kk][Ee][Yy]\\.[Ee][Nn][Cc].*/) OR (data_process_exec_process_binary:/.*\\/[Cc][Uu][Rr][Ll]/ AND data_process_exec_process_arguments:/.*[Mm][Oo][Dd][Ee][Ll][Ss]\\.[Ll][Ii][Tt][Ee][Ll][Ll][Mm]\\.[Cc][Ll][Oo][Uu][Dd].*/ AND data_process_exec_process_arguments:/.*[Xx]-[Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee]: [Tt][Pp][Cc][Pp]\\.[Tt][Aa][Rr]\\.[Gg][Zz].*/) OR (data_process_exec_parent_binary:/.*\\/[Pp][Yy][Tt][Hh][Oo][Nn]3.*/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll].*/ AND data_process_exec_process_arguments:/.*--[Uu][Ss][Ee][Rr].*/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*/))"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 55e862a8-dd9c-4651-807a-f21fcad56716
    name: Python One-Liners with Base64 Decoding - Linux
    reason: Same obfuscated python3 base64-decode-and-exec loader technique as this malware's first stage (exec(base64.b64decode(...))); this broader rule catches the sibling and secondary base64 loader stages the TeamPCP payload runs on the same host, even when the exact IOC strings differ.
  - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
    name: Suspicious Curl File Upload - Linux
    reason: Generic curl file-upload/exfil detector that independently flags the curl POST shipping the tpcp.tar.gz / payload.enc archive off-box; corroborates and widens this malware's exfiltration step beyond the hard-coded models.litellm.cloud destination.
  - id: 31545105-3444-4584-bebf-c466353230d2
    name: Touch Suspicious Service File
    reason: Timestomping (touch -t) of a .service unit is the anti-forensic step that accompanies dropping the malicious 'sysmon' systemd --user service this rule's persistence branch detects - same host, same persistence stage, backdating the unit so it blends with legitimate ones.
  - id: d7a650c4-226c-451e-948f-cc490db506aa
    name: PUA - TruffleHog Execution - Linux
    reason: TeamPCP's payload harvests every credential on the host; a dedicated secret-scanner (trufflehog) running on the same host within the window independently corroborates active credential/secret harvesting - the collection objective this backdoor is built for.
  - id: 3c6f5e4a-8d0b-6abc-d9e2-4f7a6b8c9d0e
    name: TanStack Supply-Chain Attack Execution Indicators - Linux
    reason: Sibling trojanized-package execution from the same 2026 wave of supply-chain package-poisoning campaigns; its python3-runs-a-staged-payload branch mirrors this loader, so both firing on one host points at a developer or build host pulling from a poisoned package registry.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential-store / secrets file access on this host (harvesting)
    query: ((data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/) OR (data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/) OR (data_process_exec_process_arguments:/.*\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/) OR (data_process_exec_process_arguments:/.*\.[Cc][Oo][Nn][Ff][Ii][Gg]\/[Gg][Cc][Ll][Oo][Uu][Dd].*/) OR (data_process_exec_process_arguments:/.*\.[Kk][Uu][Bb][Ee]\/[Cc][Oo][Nn][Ff][Ii][Gg].*/) OR (data_process_exec_process_arguments:/.*\.[Nn][Ee][Tt][Rr][Cc].*/))
    pivot_on:
    - host
    window: 2h
  - name: Archive / encryption staging of the exfil bundle on this host
    query: ((data_process_exec_process_binary:/.*\/[Tt][Aa][Rr]/) OR (data_process_exec_process_binary:/.*\/[Gg][Zz][Ii][Pp]/) OR (data_process_exec_process_binary:/.*\/[Zz][Ii][Pp]/) OR (data_process_exec_process_binary:/.*\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]/) OR (data_process_exec_process_binary:/.*\/[Gg][Pp][Gg]/) OR (data_process_exec_process_arguments:/.*[Tt][Pp][Cc][Pp]\.[Tt][Aa][Rr]\.[Gg][Zz].*/) OR (data_process_exec_process_arguments:/.*\.[Ee][Nn][Cc].*/))
    pivot_on:
    - host
    window: 2h
  - name: Outbound exfiltration tooling / C2 contact on this host
    query: ((data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ AND (data_process_exec_process_arguments:/.* --[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee] .*/ OR data_process_exec_process_arguments:/.* -[Tt] .*/ OR data_process_exec_process_arguments:/.* --[Dd][Aa][Tt][Aa].*/ OR data_process_exec_process_arguments:/.* -[Dd] .*/ OR data_process_exec_process_arguments:/.* -[Ff] .*/)) OR (data_process_exec_process_arguments:/.*[Mm][Oo][Dd][Ee][Ll][Ss]\.[Ll][Ii][Tt][Ee][Ll][Ll][Mm]\.[Cc][Ll][Oo][Uu][Dd].*/) OR (data_process_exec_process_arguments:/.*[Xx]-[Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: Systemd user-service persistence on this host
    query: ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/) OR (data_process_exec_process_arguments:/.*--[Uu][Ss][Ee][Rr].*[Ss][Yy][Ss][Mm][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*\.[Cc][Oo][Nn][Ff][Ii][Gg]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Uu][Ss][Ee][Rr].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/))
    pivot_on:
    - host
    window: 4h
  - name: Obfuscated python interpreter payload execution on this host
    query: ((data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3?/) AND (data_process_exec_process_arguments:/.*[Bb]64[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Ee]64.*/ OR data_process_exec_process_arguments:/.*[Ee][Xx][Ee][Cc].*/))
    pivot_on:
    - host
    window: 1h
