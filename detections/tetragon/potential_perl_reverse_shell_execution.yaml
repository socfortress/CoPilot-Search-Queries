name: Potential Perl Reverse Shell Execution
id: 259df6bc-003f-4306-9f54-4ff1a08fa38e
version: 1
schema_version: "1.0"
date: "2023-04-07"
author: "@d4ns4n_, Nasreddine Bencherchali (Nextron Systems)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 259df6bc-003f-4306-9f54-4ff1a08fa38e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the perl binary with the "-e" flag and common strings
  related to potential reverse shell activity.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/perl"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -e *"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*fdopen(*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*::Socket::INET*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*Socket*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*connect*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*open*"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*exec*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/perl';
  data_process_exec_process_arguments matches '* -e *';
  data_process_exec_process_arguments matches '*fdopen(*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
  - https://www.revshells.com/

response:
  message: >
    Potential Perl Reverse Shell Execution detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - reverse
    - shell
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Pp][Ee][Rr][Ll]/ AND data_process_exec_process_arguments:/.* -[Ee] .*/ AND ((data_process_exec_process_arguments:/.*[Ff][Dd][Oo][Pp][Ee][Nn]\(.*/ AND data_process_exec_process_arguments:/.*::[Ss][Oo][Cc][Kk][Ee][Tt]::[Ii][Nn][Ee][Tt].*/) OR (data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*/ AND data_process_exec_process_arguments:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ AND data_process_exec_process_arguments:/.*[Oo][Pp][Ee][Nn].*/ AND data_process_exec_process_arguments:/.*[Ee][Xx][Ee][Cc].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Co-occurring alternative C2 from the same pentestmonkey/revshells toolkit: nc/ncat with ''-e <shell>'' is another one-liner reverse shell. An operator who fired a Perl reverse shell commonly tries a netcat shell on the same host when one method is blocked or to open a second channel.'
  - id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
    name: Python Reverse Shell Execution Via PTY And Socket Modules
    reason: 'Alternative and upgrade C2 on the same host: a Python socket+pty reverse shell is both a sibling one-liner and the usual way an operator replaces a non-interactive Perl /bin/sh shell with a fully interactive one minutes later.'
  - id: c6714a24-d7d5-4283-a36b-3ffd091d5f7e
    name: Potential PHP Reverse Shell
    reason: Co-occurring alternative reverse shell (php -r with fsockopen piping a shell) from the same cheat sheet; especially likely on the same host when the entry vector was a PHP web application.
  - id: c4042d54-110d-45dd-a0e1-05c47822c937
    name: Python Spawning Pretty TTY Via PTY Module
    reason: 'Immediate follow-on: the first action after catching a dumb Perl reverse shell is ''python -c import pty;pty.spawn(/bin/bash)'' to upgrade the non-interactive shell into a real TTY. Seeing this on the same host confirms a live operator working the channel.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: 'Hands-on-keyboard activity inside the shell: once the reverse shell is upgraded to an interactive bash, that ''bash -i'' spawns exactly the children this detects (whoami, nc, base64, pty.spawn) - the post-exploitation commands run through the Perl channel.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Follow-on discovery: SUID enumeration (''find -perm -4000'') and credential-file hunting are among the very first commands an operator runs through a fresh reverse shell to scope privilege escalation.'
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Likely precursor and parent lineage on the same host: a web server (apache/nginx/tomcat/node) spawning recon children is the web-exploitation entry that typically precedes - and directly parents - a scripted reverse shell like this one.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Payload staging around the same host: a curl/wget fetch into /tmp or /dev/shm piped to ''sh -c'' is the downloader that drops/launches the reverse shell beforehand, or the operator pulling further tooling through the shell afterwards.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other interpreter / socket reverse-shell one-liners on this host
    query: (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Ff][Ss][Oo][Cc][Kk][Oo][Pp][Ee][Nn].*/ OR data_process_exec_process_arguments:/.*[Tt][Cc][Pp][Ss][Oo][Cc][Kk][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/ OR (data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*/ AND data_process_exec_process_arguments:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/) OR ((data_process_exec_process_binary:/.*\/[Nn][Cc]/ OR data_process_exec_process_binary:/.*\/[Nn][Cc][Aa][Tt]/) AND data_process_exec_process_arguments:/.* -[Ee] .*/))
    pivot_on:
    - host
    window: 1h
  - name: Shell or scripting interpreter spawned by a network-facing service on this host
    query: ((data_process_exec_parent_binary:/.*\/[Aa][Pp][Aa][Cc][Hh][Ee]2/ OR data_process_exec_parent_binary:/.*\/[Hh][Tt][Tt][Pp][Dd]/ OR data_process_exec_parent_binary:/.*\/[Nn][Gg][Ii][Nn][Xx]/ OR data_process_exec_parent_binary:/.*\/[Pp][Hh][Pp]-[Ff][Pp][Mm].*/ OR data_process_exec_parent_binary:/.*[Tt][Oo][Mm][Cc][Aa][Tt].*/ OR data_process_exec_parent_binary:/.*\/[Jj][Aa][Vv][Aa]/ OR data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ OR data_process_exec_parent_binary:/.*\/[Ss][Ss][Hh][Dd]/) AND data_process_exec_process_binary:/.*\/([Bb][Aa][Ss][Hh]|[Ss][Hh]|[Dd][Aa][Ss][Hh]|[Zz][Ss][Hh]|[Pp][Ee][Rr][Ll]|[Pp][Yy][Tt][Hh][Oo][Nn][0-9.]*|[Rr][Uu][Bb][Yy]|[Pp][Hh][Pp])/)
    pivot_on:
    - host
    window: 2h
  - name: Host and privilege-escalation reconnaissance on this host
    query: (data_process_exec_process_binary:/.*\/([Ww][Hh][Oo][Aa][Mm][Ii]|[Ii][Dd]|[Uu][Nn][Aa][Mm][Ee]|[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|[Ii][Pp]|[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Ss][Ss]|[Ww]|[Aa][Rr][Pp]|[Ll][Ss][Oo][Ff])/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -4000 .*/ OR data_process_exec_process_arguments:/.* \/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*[Ss][Uu][Dd][Oo] -[Ll] .*/)
    pivot_on:
    - host
    window: 1h
  - name: Credential and secret-file access on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/[Ii][Dd]_.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence and further payload staging on this host
    query: (data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Aa][Tt])/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR ((data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)))
    pivot_on:
    - host
    window: 4h
