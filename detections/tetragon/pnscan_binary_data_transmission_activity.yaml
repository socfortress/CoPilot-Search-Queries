name: Pnscan Binary Data Transmission Activity
id: 97de11cd-4b67-4abf-9a8b-1020e670aa9e
version: 1
schema_version: "1.0"
date: "2024-04-16"
author: David Burkett (@signalblur)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 97de11cd-4b67-4abf-9a8b-1020e670aa9e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command line patterns associated with the use of Pnscan for sending
  and receiving binary data across the network. This behavior has been
  identified in a Linux malware campaign targeting Docker, Apache Hadoop, Redis,
  and Confluence and was previously used by the threat actor known as TeamTNT.
  MITRE ATT&CK: T1046.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - regexp:
            data_process_exec_process_arguments: ".*(-(W|R)[ ]?([ ]|\"|')([0-9a-fA-F]{2}[ ]?){2,20}([ ]|\"|')).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_arguments matches the regex /.*(-(W|R)[ ]?([
  ]|"|')([0-9a-fA-F]{2}[ ]?){2,20}([ ]|"|')).*/.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.cadosecurity.com/blog/spinning-yarn-a-new-linux-malware-campaign-targets-docker-apache-hadoop-redis-and-confluence
  - https://intezer.com/wp-content/uploads/2021/09/TeamTNT-Cryptomining-Explosion.pdf
  - https://regex101.com/r/RugQYK/1
  - https://www.virustotal.com/gui/file/beddf70a7bab805f0c0b69ac0989db6755949f9f68525c08cb874988353f78a9/content
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    Pnscan Binary Data Transmission Activity detected on host $agent_name$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$. MITRE
    ATT&CK: T1046
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_arguments
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
  custom_tags:
    - pnscan
    - binary
    - transmission
    - linux
    - tetragon
    - process_creation
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_arguments:/.*(-(W|R)[ ]?([ ]|\"|')([0-9a-fA-F]{2}[ ]?){2,20}([ ]|\"|')).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Precursor: the TeamTNT/Spinning YARN loader fetches pnscan and the rest of the toolkit via curl/wget into /tmp or /dev/shm and runs it with sh -c - this is how the scanner reached the host before it began probing the network.'
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'Co-occurring staging: this campaign stages its scanner and miner binaries fileless in /dev/shm; a pnscan or helper binary executing from /dev/shm on the same host is the fileless drop behind the scan.'
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'Co-occurring staging: the dropped pnscan binary and its shell stagers are typically written to and executed from /tmp - an execution from /tmp on this host is the likely origin of the scanning process.'
  - id: a015e032-146d-4717-8944-7a1884122111
    name: Linux HackTool Execution
    reason: 'Co-occurring tooling: sibling network scanners and recon tools (naabu, netdiscover, nuclei, httpx) ship in the same offensive toolkit as pnscan; their presence widens the single scan into a full reconnaissance/propagation campaign.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'Follow-on objective: pnscan''s network sweep exists to propagate the worm whose payload is an XMRig miner - stratum/pool arguments on the same host are the campaign''s end goal landing.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Follow-on persistence: the campaign installs crontab jobs (run from /tmp) to relaunch the miner and scanner - a cron write on this host shows the intrusion establishing persistence around the scan.'
  - id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
    name: UFW Disable Attempt
    reason: 'Follow-on defense evasion: the loader scripts disable the host firewall so the scanner''s probes, worm propagation and miner pool traffic are not blocked - a firewall disable on this host is a companion step to the scan.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Co-occurring C2: TeamTNT drops netcat reverse shells for interactive control - a reverse shell on the scanning host is the likely operator session driving pnscan and landing on the hosts it discovers.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other network-scanning / propagation tooling on this host
    query: data_process_exec_process_binary:/.*(\/[Pp][Nn][Ss][Cc][Aa][Nn]|\/[Mm][Aa][Ss][Ss][Cc][Aa][Nn]|\/[Zz][Mm][Aa][Pp]|\/[Zz][Gg][Rr][Aa][Bb]|\/[Nn][Mm][Aa][Pp]|\/[Nn][Aa][Aa][Bb][Uu]|\/[Nn][Ee][Tt][Dd][Ii][Ss][Cc][Oo][Vv][Ee][Rr]|\/[Ff][Ss][Cc][Aa][Nn]|\/[Hh][Pp][Ii][Nn][Gg]3)/
    pivot_on:
    - host
    window: 2h
  - name: Toolkit fetched via curl/wget into a staging directory on this host
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/) AND (data_process_exec_process_arguments:/.*(\/[Tt][Mm][Pp]\/|\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/|\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/).*/)
    pivot_on:
    - host
    window: 2h
  - name: Binary executed from /tmp, /dev/shm or /var/tmp on this host
    query: data_process_exec_process_binary:/(\/[Tt][Mm][Pp]\/|\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/|\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/).*/
    pivot_on:
    - host
    window: 2h
  - name: Crypto-miner launch on this host
    query: (data_process_exec_process_binary:/.*\/[Xx][Mm][Rr][Ii][Gg].*/) OR (data_process_exec_process_arguments:/.*([Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Tt][Cc][Pp]:\/\/|[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Uu][Dd][Pp]:\/\/|--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll]|--[Cc][Pp][Uu]-[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]|-[Oo] [Pp][Oo][Oo][Ll]\.).*/)
    pivot_on:
    - host
    window: 4h
  - name: Host firewall disabled or flushed on this host
    query: (data_process_exec_process_arguments:/.*[Uu][Ff][Ww][ ]+[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/) OR (data_process_exec_process_arguments:/.*[Ii][Pp]6?[Tt][Aa][Bb][Ll][Ee][Ss][ ]+(-[Ff]|--[Ff][Ll][Uu][Ss][Hh]).*/) OR (data_process_exec_process_binary:/.*\/[Uu][Ff][Ww]-[Ii][Nn][Ii][Tt]/)
    pivot_on:
    - host
    window: 4h
