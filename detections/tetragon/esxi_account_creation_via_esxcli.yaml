name: ESXi Account Creation Via ESXCLI
id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
version: 1
schema_version: "1.0"
date: "2023-08-22"
author: Cedric Maurugeon
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects user account creation on ESXi system via esxcli. MITRE ATT&CK: T1136,
  T1059.012.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/esxcli"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*system *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*account *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*add *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/esxcli';
  data_process_exec_process_arguments matches '*system *';
  data_process_exec_process_arguments matches '*account *', among other
  conditions.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_system.html
  - https://attack.mitre.org/techniques/T1136/
  - https://attack.mitre.org/techniques/T1059/012/

response:
  message: >
    ESXi Account Creation Via ESXCLI detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1136, T1059.012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136
    - T1059.012
  custom_tags:
    - account
    - esxcli
    - linux
    - tetragon
    - process_creation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm] .*/ AND data_process_exec_process_arguments:/.*[Aa][Cc][Cc][Oo][Uu][Nn][Tt] .*/ AND data_process_exec_process_arguments:/.*[Aa][Dd][Dd] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
    name: ESXi Admin Permission Assigned To Account Via ESXCLI
    reason: 'Immediate follow-on: a freshly created ESXi account is inert until empowered, so the attacker runs `esxcli system permission set ... admin` right after `account add` to grant it the Admin role. These two esxcli commands fire back-to-back on the same host and together confirm deliberate rogue-admin persistence, not a benign account tweak.'
  - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
    name: ESXi VM Kill Via ESXCLI
    reason: 'Destructive endgame on the same host: `esxcli vm process kill` powers off running guests to release file locks on their .vmdk/.vmx disks so a ransomware encryptor can touch them. If it fires after this account creation, the persistence was staging for active hypervisor-ransomware impact - escalate immediately.'
  - id: 38eb1dbb-011f-40b1-a126-cf03a0210563
    name: ESXi Syslog Configuration Change Via ESXCLI
    reason: 'Co-occurring defense evasion: `esxcli system syslog config set` disables or redirects the ESXi host''s logging to blind the SOC while the rogue account is created and weaponized. Seeing it alongside the account creation means the operator is actively covering the same session''s tracks.'
  - id: 5f1573a7-363b-4114-9208-ad7a61de46eb
    name: ESXi VM List Discovery Via ESXCLI
    reason: 'Target selection in the same esxcli session: `esxcli vm process list` enumerates the running VMs the attacker will later power off and encrypt. It typically precedes the persistence step as the operator scopes which guests to impact on this hypervisor.'
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: 'Recon of the encryption target surface: `esxcli storage ... get/list` locates the datastores that hold the VM disk files a hypervisor-ransomware payload destroys. Run on the same host as part of the same esxcli reconnaissance that bracketed the account creation.'
  - id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
    name: ESXi System Information Discovery Via ESXCLI
    reason: 'Orientation precursor: the operator profiles the hypervisor (version, UUID, product) with `esxcli system ... get/list` before establishing persistence, confirming hands-on-keyboard activity on this specific ESXi host rather than an automated check.'
  - id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
    name: ESXi VSAN Information Discovery Via ESXCLI
    reason: 'Recon of an additional encryption surface: `esxcli vsan ... get/list` enumerates vSAN-backed storage, another datastore the attacker inventories for impact. Part of the same attacker esxcli reconnaissance accompanying the account creation on this host.'
  - id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
    name: ESXi Network Configuration Discovery Via ESXCLI
    reason: 'Environment mapping: `esxcli network ... get/list` enumerates the host''s vmknics and management interfaces, used to plan lateral movement to sibling ESXi hosts. Part of the same esxcli campaign on this host as the rogue-account persistence.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ESXi account weaponization - role/permission granted via esxcli on this host
    query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/ AND data_process_exec_process_arguments:/.* [Ss][Ee][Tt].*/
    pivot_on:
    - host
    window: 2h
  - name: ESXi account manipulation sequence (add/set/list) via esxcli on this host
    query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND data_process_exec_process_arguments:/.*[Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/
    pivot_on:
    - host
    window: 6h
  - name: ESXi defense teardown - firewall / lockdown / syslog changed via esxcli on this host
    query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND (data_process_exec_process_arguments:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_process_exec_process_arguments:/.*[Ll][Oo][Cc][Kk][Dd][Oo][Ww][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Ll][Oo][Gg].*/)
    pivot_on:
    - host
    window: 4h
  - name: ESXi VM power-off / kill via esxcli on this host (pre-encryption impact)
    query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_process_exec_process_arguments:/.*[Kk][Ii][Ll][Ll].*/
    pivot_on:
    - host
    window: 4h
  - name: ESXi remote-access enablement - SSH ruleset / shell touched via esxcli on this host
    query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Ss][Ss][Hh].*/
    pivot_on:
    - host
    window: 6h
