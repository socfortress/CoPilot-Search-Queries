name: Inline Python Execution - Spawn Shell Via OS System Library
id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
version: 1
schema_version: "1.0"
date: "2024-09-02"
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of inline Python code via the "-c" in order to call the
  "system" function from the "os" library, and spawn a shell. MITRE ATT&CK:
  T1059.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python2"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python3"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python2.*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/python3.*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_process_exec_process_arguments:
              value: "* -c *"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*os.system(*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/dash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/fish*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/zsh*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/python';
  data_process_exec_process_binary matches '*/python2';
  data_process_exec_process_binary matches '*/python3', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/python/#shell
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Inline Python Execution - Spawn Shell Via OS System Library detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - inline
    - python
    - spawn
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]2/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]2\..*/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3\..*/) AND data_process_exec_process_arguments:/.* -[Cc] .*/ AND data_process_exec_process_arguments:/.*[Oo][Ss]\.[Ss][Yy][Ss][Tt][Ee][Mm]\(.*/ AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ff][Ii][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c4042d54-110d-45dd-a0e1-05c47822c937
    name: Python Spawning Pretty TTY Via PTY Module
    reason: 'Tightest sibling: the other canonical Python TTY-upgrade one-liner (pty.spawn). An operator who runs os.system(''/bin/bash'') almost always also runs python -c ''import pty;pty.spawn'' seconds later to get a fully interactive TTY in the same hands-on session.'
  - id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
    name: Python Reverse Shell Execution Via PTY And Socket Modules
    reason: 'Same python -c offensive toolkit: the socket+pty reverse shell is frequently the very channel through which this interactive shell was obtained, so it co-fires on the host as the egress leg of the same intrusion.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Classic precursor: a dumb nc -e reverse shell gives a non-interactive shell with no job control, and python os.system/pty is the textbook TTY upgrade step performed immediately after landing it.'
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Common foothold precursor: a web server (httpd/nginx/apache) spawning a shell is the initial code-execution vector; the attacker then runs python to break out of that constrained www-data context into an interactive shell.'
  - id: c6714a24-d7d5-4283-a36b-3ffd091d5f7e
    name: Potential PHP Reverse Shell
    reason: 'Web-app foothold sibling: php -r fsockopen is the most common Linux web-exploitation reverse shell; a PHP foothold being upgraded to a proper shell via python os.system is a textbook chain, so the two co-fire on the host.'
  - id: 8c1a5675-cb85-452f-a298-b01b22a51856
    name: Suspicious Invocation of Shell via AWK - Linux
    reason: 'Identical technique class: awk ''BEGIN{system("/bin/sh")}'' is the exact same GTFOBins system()-to-shell escape via a different interpreter; attackers enumerating LOLBin shell escapes trip both back to back.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: 'Direct follow-on: once python os.system spawns /bin/bash -i, this rule catches that interactive bash''s uncommon children (whoami, nc, pty.spawn, base64), i.e. the hands-on-keyboard activity that happens inside the shell this rule just created.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Follow-on privilege-escalation recon: the SUID search (find -perm -4000) and .htpasswd hunt are exactly what an operator runs in the first minutes inside the new interactive shell to find a path to root.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other interpreter / LOLBin shell-escape one-liners on this host
    query: ((data_process_exec_process_binary:/.*\/[Pp][Ee][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Rr][Uu][Bb][Yy]/ OR data_process_exec_process_binary:/.*\/[Pp][Hh][Pp]/ OR data_process_exec_process_binary:/.*\/[Ll][Uu][Aa]/ OR data_process_exec_process_binary:/.*\/[GgMmNn]?[Aa][Ww][Kk]/ OR data_process_exec_process_binary:/.*\/[Nn][Oo][Dd][Ee]/) AND (data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\(.*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Ss][Pp][Aa][Ww][Nn].*/))
    pivot_on:
    - host
    window: 1h
  - name: Reverse-shell egress indicators from this host
    query: (((data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*/ AND data_process_exec_process_arguments:/.*\.[Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/) OR data_process_exec_process_arguments:/.*[Ff][Ss][Oo][Cc][Kk][Oo][Pp][Ee][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR ((data_process_exec_process_binary:/.*\/[Nn][Cc]/ OR data_process_exec_process_binary:/.*\/[Nn][Cc][Aa][Tt]/) AND data_process_exec_process_arguments:/.* -[Ee] .*/))
    pivot_on:
    - host
    window: 1h
  - name: Privilege-escalation enumeration on this host
    query: ((data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] [-\/]4000.*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -[Uu]\+[Ss].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.* -[Ll].*/) OR data_process_exec_process_binary:/.*\/[Gg][Ee][Tt][Cc][Aa][Pp]/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential and SSH key access on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 4h
  - name: Payload download into world-writable staging directories on this host
    query: ((data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/))
    pivot_on:
    - host
    window: 2h
