name: ESXi Network Configuration Discovery Via ESXCLI
id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
version: 1
schema_version: "1.0"
date: "2023-09-04"
author: Cedric Maurugeon
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "esxcli" command with the "network" flag in order to
  retrieve information about the network configuration. MITRE ATT&CK: T1033,
  T1007, T1059.012.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/esxcli"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*network*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* get*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* list*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/esxcli';
  data_process_exec_process_arguments matches '*network*';
  data_process_exec_process_arguments matches '* get*', among other conditions.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.crowdstrike.com/blog/hypervisor-jackpotting-ecrime-actors-increase-targeting-of-esxi-servers/
  - https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_network.html
  - https://attack.mitre.org/techniques/T1033/
  - https://attack.mitre.org/techniques/T1007/
  - https://attack.mitre.org/techniques/T1059/012/

response:
  message: >
    ESXi Network Configuration Discovery Via ESXCLI detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1033, T1007, T1059.012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
    - T1007
    - T1059.012
  custom_tags:
    - network
    - configuration
    - esxcli
    - linux
    - tetragon
    - process_creation
    - discovery
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk].*/ AND (data_process_exec_process_arguments:/.* [Gg][Ee][Tt].*/ OR data_process_exec_process_arguments:/.* [Ll][Ii][Ss][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e80273e1-9faf-40bc-bd85-dbaff104c4e9
    name: ESXi System Information Discovery Via ESXCLI
    reason: 'Same hands-on-keyboard esxcli recon burst: after mapping the network the actor profiles the host (esxcli system) in the same sitting. Co-occurring discovery on the identical host/binary.'
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: Co-occurring discovery that identifies the VMFS datastores the actor will encrypt; the rule itself attributes this esxcli storage enumeration to DarkSide and LockBit ESXi ransomware. Network+storage recon pair immediately before impact.
  - id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
    name: ESXi VSAN Information Discovery Via ESXCLI
    reason: Co-occurring discovery of clustered vSAN storage targets in the same esxcli recon sweep, extending datastore enumeration across the cluster before encryption.
  - id: 5f1573a7-363b-4114-9208-ad7a61de46eb
    name: ESXi VM List Discovery Via ESXCLI
    reason: Co-occurring discovery that enumerates the running VMs the actor intends to power off and encrypt; VM inventory is the direct precursor to the VM-kill impact step in the ESXi playbook.
  - id: 2992ac4d-31e9-4325-99f2-b18a73221bb2
    name: ESXi VM Kill Via ESXCLI
    reason: 'Follow-on impact: after recon the actor runs ''esxcli vm process kill'' to power off VMs and release .vmdk file locks so the datastores can be encrypted (ESXiArgs/Cheerscrypt pattern). Strongest escalation signal on the same host.'
  - id: 38eb1dbb-011f-40b1-a126-cf03a0210563
    name: ESXi Syslog Configuration Change Via ESXCLI
    reason: 'Follow-on defense evasion: the actor redirects or disables ESXi syslog (''esxcli system syslog config set'') to blind defenders before the destructive phase, in the same intrusion.'
  - id: b28e4eb3-8bbc-4f0c-819f-edfe8e2f25db
    name: ESXi Account Creation Via ESXCLI
    reason: 'Precursor/co-occurring persistence: the actor creates a rogue local ESXi account (''esxcli system account add'') to retain hands-on access to the host being enumerated.'
  - id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
    name: ESXi Admin Permission Assigned To Account Via ESXCLI
    reason: 'Pairs with account creation as privilege escalation: grants the Admin role to the attacker-controlled ESXi account, giving full control of the host enumerated by this discovery.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ESXi esxcli discovery sweep (storage / vSAN / system / VM inventory) on this host
    query: data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND (data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/ OR data_process_exec_process_arguments:/.*[Vv][Ss][Aa][Nn].*/ OR data_process_exec_process_arguments:/.*[Hh][Aa][Rr][Dd][Ww][Aa][Rr][Ee].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Ll][Ii][Ss][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: ESXi SSH / shell / firewall enablement for persistent access on this host
    query: (data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*([Ee][Nn][Aa][Bb][Ll][Ee]_[Ss][Ss][Hh]|[Ee][Nn][Aa][Bb][Ll][Ee]_[Ee][Ss][Xx]_[Ss][Hh][Ee][Ll][Ll]).*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/[Ss][Ss][Hh].*/)
    pivot_on:
    - host
    window: 4h
  - name: ESXi logging / telemetry tamper (syslog, hostd/vpxa, Wazuh/Tetragon kill) on this host
    query: ((data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Ll][Oo][Gg].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/([Vv][Pp][Xx][Aa]|[Hh][Oo][Ss][Tt][Dd]|[Ww][Aa][Zz][Uu][Hh]).*/) OR (data_process_exec_process_binary:/.*\/([Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Kk][Ii][Ll][Ll]|[Pp][Kk][Ii][Ll][Ll])/ AND data_process_exec_process_arguments:/.*([Ww][Aa][Zz][Uu][Hh]|[Tt][Ee][Tt][Rr][Aa][Gg][Oo][Nn]).*/))
    pivot_on:
    - host
    window: 4h
  - name: ESXi VM power-off / kill via esxcli or vim-cmd (pre-encryption impact) on this host
    query: (data_process_exec_process_binary:/.*\/[Ee][Ss][Xx][Cc][Ll][Ii]/ AND data_process_exec_process_arguments:/.*[Vv][Mm] [Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_process_exec_process_arguments:/.*[Kk][Ii][Ll][Ll].*/) OR (data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]-[Cc][Mm][Dd]/ AND data_process_exec_process_arguments:/.*[Vv][Mm][Ss][Vv][Cc]\/[Pp][Oo][Ww][Ee][Rr]\.[Oo][Ff][Ff].*/)
    pivot_on:
    - host
    window: 4h
  - name: Ransomware encryptor executed from / against VMFS datastores on this host
    query: (data_process_exec_process_binary:/.*\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss]\/.*/) OR (data_process_exec_process_binary:/.*\/[Tt][Mm][Pp]\/.*/ AND data_process_exec_process_arguments:/.*(\.[Vv][Mm][Dd][Kk]|\.[Vv][Mm][Xx]|\.[Vv][Mm][Ss][Nn]|\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss]).*/) OR (data_process_exec_process_arguments:/.*[Ee][Nn][Cc][Rr][Yy][Pp][Tt].*/ AND data_process_exec_process_arguments:/.*\/[Vv][Mm][Ff][Ss]\/[Vv][Oo][Ll][Uu][Mm][Ee][Ss].*/)
    pivot_on:
    - host
    window: 6h
