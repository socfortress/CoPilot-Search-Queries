name: PUA - TruffleHog Execution - Linux
id: d7a650c4-226c-451e-948f-cc490db506aa
version: 1
schema_version: "1.0"
date: "2025-09-24"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d7a650c4-226c-451e-948f-cc490db506aa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of TruffleHog, a tool used to search for secrets in
  different platforms like Git, Jira, Slack, SharePoint, etc. that could be used
  maliciously. While it is a legitimate tool, intended for use in CI pipelines
  and security assessments, It was observed in the Shai-Hulud malware campaign
  targeting npm packages to steal sensitive information. MITRE ATT&CK: T1083,
  T1552.001.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/trufflehog"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* docker --image *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* Git *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* GitHub *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* Jira *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* Slack *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* Confluence *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* SharePoint *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* s3 *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* gcs *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "* --results=verified*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/trufflehog';
  data_process_exec_process_arguments matches '* docker --image *';
  data_process_exec_process_arguments matches '* Git *', among other conditions.

known_false_positives: >
  Legitimate use of TruffleHog by security teams or developers. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/trufflesecurity/trufflehog
  - https://www.getsafety.com/blog-posts/shai-hulud-npm-attack
  - https://attack.mitre.org/techniques/T1083/
  - https://attack.mitre.org/techniques/T1552/001/

response:
  message: >
    PUA - TruffleHog Execution - Linux detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1083, T1552.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1083
    - T1552.001
  custom_tags:
    - trufflehog
    - linux
    - tetragon
    - process_creation
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]/ OR ((data_process_exec_process_arguments:/.* [Dd][Oo][Cc][Kk][Ee][Rr] --[Ii][Mm][Aa][Gg][Ee] .*/ OR data_process_exec_process_arguments:/.* [Gg][Ii][Tt] .*/ OR data_process_exec_process_arguments:/.* [Gg][Ii][Tt][Hh][Uu][Bb] .*/ OR data_process_exec_process_arguments:/.* [Jj][Ii][Rr][Aa] .*/ OR data_process_exec_process_arguments:/.* [Ss][Ll][Aa][Cc][Kk] .*/ OR data_process_exec_process_arguments:/.* [Cc][Oo][Nn][Ff][Ll][Uu][Ee][Nn][Cc][Ee] .*/ OR data_process_exec_process_arguments:/.* [Ss][Hh][Aa][Rr][Ee][Pp][Oo][Ii][Nn][Tt] .*/ OR data_process_exec_process_arguments:/.* [Ss]3 .*/ OR data_process_exec_process_arguments:/.* [Gg][Cc][Ss] .*/) AND data_process_exec_process_arguments:/.* --[Rr][Ee][Ss][Uu][Ll][Tt][Ss]=[Vv][Ee][Rr][Ii][Ff][Ii][Ee][Dd].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
    name: Script Interpreter Spawning Credential Scanner - Linux
    reason: 'Same exec seen from the parent: a node/bun interpreter spawning trufflehog/gitleaks. Its presence on the host proves this TruffleHog run was launched by the Shai-Hulud payload, not an engineer''s CI secret-scan.'
  - id: eb827bbd-670a-4d58-8446-c464d8ac2323
    name: Shai-Hulud Malicious Bun Execution - Linux
    reason: 'Immediate precursor: node executing bun_environment.js / setup_bun.js is the Shai-Hulud 2.0 loader that bootstraps the Bun runtime and then launches the TruffleHog secret sweep this rule catches.'
  - id: 11bb9b26-4179-4a06-afcb-1ec31fce1627
    name: Shai-Hulud Malware Indicators - Linux
    reason: Same-host 'Shai-Hulud'/'SHA1HULUD' command-line markers attribute this TruffleHog execution to the npm worm rather than legitimate scanning, escalating the PUA hit to active compromise.
  - id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
    name: Shai-Hulud NPM Package Malicious Exfiltration via Curl
    reason: 'Direct follow-on: curl -d POSTing the verified secrets TruffleHog just harvested to the hard-coded Shai-Hulud webhook.site endpoint - the exfiltration half of the same kill chain.'
  - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
    name: Suspicious Curl File Upload - Linux
    reason: 'Generalized exfiltration: curl --data/--upload-file to any non-localhost host catches the same credential outflow when the actor uses a different C2 than the hard-coded Shai-Hulud webhook.'
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: 'Co-occurring credential access: find/grep for id_rsa/authorized_keys harvests the SSH and git keys TruffleHog''s SaaS/repo scan misses and that Shai-Hulud reuses to propagate to other hosts and repos.'
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: 'Co-occurring credential access: find/grep for password/credential/creds files is the on-disk complement to TruffleHog''s scan - the actor sweeping the local filesystem for the same secrets.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Co-occurring discovery on the same Tetragon pipeline: hunting .htpasswd files and SUID binaries is the file-and-credential discovery (T1083/T1552.001, this rule''s own techniques) run alongside automated secret scanning to find local secrets and a privesc path.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shai-Hulud Bun loader / npm supply-chain payload on this host
    query: (data_process_exec_process_binary:/.*\/[Bb][Uu][Nn]/ OR data_process_exec_process_arguments:/.*[Bb][Uu][Nn]_[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\.[Jj][Ss].*/ OR data_process_exec_process_arguments:/.*[Ss][Ee][Tt][Uu][Pp]_[Bb][Uu][Nn]\.[Jj][Ss].*/ OR data_process_exec_process_arguments:/.*[Bb][Uu][Nn]\.[Ss][Hh]\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other credential / secret scanners on this host
    query: (data_process_exec_process_binary:/.*(\/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]|\/[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss]|\/[Gg][Ii][Tt][Aa][Ll][Ll][Ss][Ee][Cc][Rr][Ee][Tt][Ss])/ OR data_process_exec_process_arguments:/.*[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss].*/ OR data_process_exec_process_arguments:/.*[Dd][Ee][Tt][Ee][Cc][Tt]-[Ss][Ee][Cc][Rr][Ee][Tt][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Cloud / git / package credential files touched on this host
    query: (data_process_exec_process_arguments:/.*\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Nn][Pp][Mm][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\.[Gg][Ii][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Cc][Oo][Nn][Ff][Ii][Gg]\/[Gg][Cc][Ll][Oo][Uu][Dd].*/ OR data_process_exec_process_arguments:/.*\.[Dd][Oo][Cc][Kk][Ee][Rr]\/[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*\.[Ee][Nn][Vv].*/)
    pivot_on:
    - host
    window: 2h
  - name: Environment-variable secret dumping on this host
    query: (data_process_exec_process_binary:/.*\/[Pp][Rr][Ii][Nn][Tt][Ee][Nn][Vv]/ OR data_process_exec_process_arguments:/.*[Pp][Rr][Ii][Nn][Tt][Ee][Nn][Vv].*/ OR data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/.*\/[Ee][Nn][Vv][Ii][Rr][Oo][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Exfiltration of harvested secrets via curl / wget on this host
    query: ((data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ AND (data_process_exec_process_arguments:/.* -[Dd] .*/ OR data_process_exec_process_arguments:/.*--[Dd][Aa][Tt][Aa].*/ OR data_process_exec_process_arguments:/.*--[Ff][Oo][Rr][Mm].*/ OR data_process_exec_process_arguments:/.*--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*--[Pp][Oo][Ss][Tt]-[Dd][Aa][Tt][Aa].*/)) OR data_process_exec_process_arguments:/.*[Ww][Ee][Bb][Hh][Oo][Oo][Kk]\.[Ss][Ii][Tt][Ee].*/ OR data_process_exec_process_arguments:/.*[Rr][Ee][Qq][Uu][Ee][Ss][Tt][Bb][Ii][Nn].*/ OR data_process_exec_process_arguments:/.*[Pp][Ii][Pp][Ee][Dd][Rr][Ee][Aa][Mm]\.[Nn][Ee][Tt].*/)
    pivot_on:
    - host
    window: 2h
