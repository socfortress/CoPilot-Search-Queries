name: Mask System Power Settings Via Systemctl
id: c172b7b5-f3a1-4af2-90b7-822c63df86cb
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Milad Cheraghi, Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c172b7b5-f3a1-4af2-90b7-822c63df86cb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of systemctl mask to disable system power management targets
  such as suspend, hibernate, or hybrid sleep. Adversaries may mask these
  targets to prevent a system from entering sleep or shutdown states, ensuring
  their malicious processes remain active and uninterrupted. This behavior can
  be associated with persistence or defense evasion, as it impairs normal system
  power operations to maintain long-term access or avoid termination of
  malicious activity. MITRE ATT&CK: T1653.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/systemctl"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "* mask*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*suspend.target*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*hibernate.target*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*hybrid-sleep.target*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/systemctl';
  data_process_exec_process_arguments matches '* mask*';
  data_process_exec_process_arguments matches '*suspend.target*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.man7.org/linux/man-pages/man1/systemctl.1.html
  - https://linux-audit.com/systemd/faq/what-is-the-difference-between-systemctl-disable-and-systemctl-mask/
  - https://attack.mitre.org/techniques/T1653/

response:
  message: >
    Mask System Power Settings Via Systemctl detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1653
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1653
  custom_tags:
    - system
    - power
    - settings
    - linux
    - tetragon
    - process_creation
    - persistence
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.* [Mm][Aa][Ss][Kk].*/ AND (data_process_exec_process_arguments:/.*[Ss][Uu][Ss][Pp][Ee][Nn][Dd]\.[Tt][Aa][Rr][Gg][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*[Hh][Ii][Bb][Ee][Rr][Nn][Aa][Tt][Ee]\.[Tt][Aa][Rr][Gg][Ee][Tt].*/ OR data_process_exec_process_arguments:/.*[Hh][Yy][Bb][Rr][Ii][Dd]-[Ss][Ll][Ee][Ee][Pp]\.[Tt][Aa][Rr][Gg][Ee][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: The motive behind the mask. Preventing suspend/hibernate guarantees uninterrupted 24/7 hashing, which is exactly what a miner needs; a mining-argument hit (stratum/-o pool/--donate-level) on the same host converts 'power settings masked' into confirmed cryptojacking and is the single most likely co-event.
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: 'Literal sibling verb: ''systemctl mask'' is the hardest form of ''systemctl disable''. The same hands-on-keyboard systemctl burst that masks power targets routinely stops/disables other units (updates, monitoring, rival miners) in the same session, so this fires on the surrounding command lines.'
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Same protect-the-workload intent one layer down: the operator who masks sleep so the payload is never interrupted also stops the EDR/firewall (falcon-sensor, firewalld, iptables) so that payload is never detected or killed. Defense-impairment that co-occurs in the setup script.'
  - id: 31545105-3444-4584-bebf-c466353230d2
    name: Touch Suspicious Service File
    reason: 'Persistence via the same subsystem: the systemd-manipulation session that masks power targets typically also drops and timestomps a rogue ''.service'' unit so the kept-alive payload auto-starts and survives reboot. Both are systemd tampering on the same host in the same window.'
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: 'File-creation counterpart (auditd/auth.log) of the systemd-persistence step: the malicious unit whose uptime the mask protects is written into /etc/systemd/system or /lib/systemd. Confirms the persistence mechanism from a second telemetry source.'
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'Ingress tool transfer: the miner/backdoor whose continuous execution the mask guarantees is pulled into /tmp or /dev/shm via wget just before or after. Finding this download identifies the actual payload being kept alive.'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'The belt-and-braces keep-running mechanism paired with power-masking: a cron job (often uploaded from /tmp) re-launches the miner if it dies while the mask ensures the host itself never sleeps. Same ''ensure it keeps running'' goal via a second channel.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Cover-tracks finisher of the same setup: once payload, persistence and the power-mask are in place, /var/log is wiped (rm/shred/truncate) to erase the sequence. A log wipe on the same host shortly after corroborates malicious intent over benign admin maintenance.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scope of the systemctl/service tampering burst on this host (mask/disable/stop of any unit)
    query: (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]/) AND (data_process_exec_process_arguments:/.* [Mm][Aa][Ss][Kk].*/ OR data_process_exec_process_arguments:/.* [Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_process_exec_process_arguments:/.* [Ss][Tt][Oo][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Crypto-miner execution and pool/stratum indicators on this host (the keep-alive motive)
    query: ((data_process_exec_process_binary:/.*\/[Xx][Mm][Rr][Ii][Gg]/ OR data_process_exec_process_binary:/.*\/[Mm][Ii][Nn][Ee][Rr][Dd]/ OR data_process_exec_process_binary:/.*\/[Cc][Pp][Uu][Mm][Ii][Nn][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Kk][Ii][Nn][Ss][Ii][Nn][Gg]/) OR (data_process_exec_process_arguments:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Tt][Cc][Pp]:\/\/.*/ OR data_process_exec_process_arguments:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]\+[Uu][Dd][Pp]:\/\/.*/ OR data_process_exec_process_arguments:/.*--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll].*/ OR data_process_exec_process_arguments:/.* -[Oo] [Pp][Oo][Oo][Ll]\..*/ OR data_process_exec_process_arguments:/.*--[Nn][Ii][Cc][Ee][Hh][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*--[Cc][Pp][Uu]-[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy].*/))
    pivot_on:
    - host
    window: 4h
  - name: Payload staged then made executable on this host (wget/curl/tftp, chmod +x, exec from /tmp or /dev/shm)
    query: ((data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/) OR (data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/) OR (data_process_exec_process_binary:/.*\/[Tt][Ff][Tt][Pp]/) OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*(\+[Xx]|777|755).*/) OR (data_process_exec_process_binary:/.*\/[Tt][Mm][Pp]\/.*/) OR (data_process_exec_process_binary:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/) OR (data_process_exec_process_binary:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence installed alongside the mask on this host (systemd enable/daemon-reload, crontab, rc.local)
    query: ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*([Ee][Nn][Aa][Bb][Ll][Ee]|[Dd][Aa][Ee][Mm][Oo][Nn]-[Rr][Ee][Ll][Oo][Aa][Dd]).*/) OR (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/))
    pivot_on:
    - host
    window: 2h
  - name: Root acquisition immediately before the mask on this host (sudo/su/pkexec/doas)
    query: (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/)
    pivot_on:
    - host
    window: 1h
