name: Disable Or Stop Services
id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
version: 1
schema_version: "1.0"
date: "2025-03-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of utilities such as 'systemctl', 'service'...etc to stop or
  disable tools and services on Linux systems. Attackers may stop or disable
  security tools and services to evade detection, maintain persistence, or
  disrupt system operations. MITRE ATT&CK: T1685, T1489.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/service"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/systemctl"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/chkconfig"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* stop *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* disable *"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_process_exec_process_binary"
        - exists:
            field: "data_process_exec_process_arguments"
        - exists:
            field: "data_process_exec_parent_arguments"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/systemctl"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_process_exec_process_arguments:
                                      value: "*--no-reload disable snap-snapd-*"
                                      case_insensitive: true
                                - wildcard:
                                    data_process_exec_process_arguments:
                                      value: "* stop snap-snapd-*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/systemctl"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_parent_arguments:
                                value: "*tmp.ci/preinst upgrade*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "* stop *"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_arguments:
                                value: "*ssh.*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_process_exec_parent_arguments:
                                value: "*/dpkg/info/ubuntu-pro-client.prerm upgrade*"
                                case_insensitive: true
                          - wildcard:
                              data_process_exec_process_binary:
                                value: "*/systemctl"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_process_exec_process_binary"
        - exists:
            field: "data_process_exec_process_arguments"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_process_exec_process_binary:
                          value: "*/systemctl"
                          case_insensitive: true
                    - wildcard:
                        data_process_exec_process_arguments:
                          value: "*snap.amazon-ssm-agent.amazon-ssm-agent.service"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/service';
  data_process_exec_process_binary matches '*/systemctl';
  data_process_exec_process_binary matches '*/chkconfig', among other
  conditions.

known_false_positives: >
  Legitimate administration activities. Some false positives are to be expected.
  Apply additional filters as needed before pushing to production. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://www.trendmicro.com/pl_pl/research/20/i/the-evolution-of-malicious-shell-scripts.html
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1489/

response:
  message: >
    Disable Or Stop Services detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1685, T1489
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
    - T1489
  custom_tags:
    - disable
    - services
    - linux
    - tetragon
    - process_creation
    - defense_impairment
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]/) AND (data_process_exec_process_arguments:/.* [Ss][Tt][Oo][Pp] .*/ OR data_process_exec_process_arguments:/.* [Dd][Ii][Ss][Aa][Bb][Ll][Ee] .*/) AND _exists_:data_process_exec_process_binary AND _exists_:data_process_exec_process_arguments AND _exists_:data_process_exec_parent_arguments AND NOT ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND (data_process_exec_process_arguments:/.*--[Nn][Oo]-[Rr][Ee][Ll][Oo][Aa][Dd] [Dd][Ii][Ss][Aa][Bb][Ll][Ee] [Ss][Nn][Aa][Pp]-[Ss][Nn][Aa][Pp][Dd]-.*/ OR data_process_exec_process_arguments:/.* [Ss][Tt][Oo][Pp] [Ss][Nn][Aa][Pp]-[Ss][Nn][Aa][Pp][Dd]-.*/)) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_parent_arguments:/.*[Tt][Mm][Pp]\.[Cc][Ii]\/[Pp][Rr][Ee][Ii][Nn][Ss][Tt] [Uu][Pp][Gg][Rr][Aa][Dd][Ee].*/ AND data_process_exec_process_arguments:/.* [Ss][Tt][Oo][Pp] .*/ AND data_process_exec_process_arguments:/.*[Ss][Ss][Hh]\..*/) OR (data_process_exec_parent_arguments:/.*\/[Dd][Pp][Kk][Gg]\/[Ii][Nn][Ff][Oo]\/[Uu][Bb][Uu][Nn][Tt][Uu]-[Pp][Rr][Oo]-[Cc][Ll][Ii][Ee][Nn][Tt]\.[Pp][Rr][Ee][Rr][Mm] [Uu][Pp][Gg][Rr][Aa][Dd][Ee].*/ AND data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/)) AND _exists_:data_process_exec_process_binary AND _exists_:data_process_exec_process_arguments AND NOT (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*[Ss][Nn][Aa][Pp]\.[Aa][Mm][Aa][Zz][Oo][Nn]-[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt]\.[Aa][Mm][Aa][Zz][Oo][Nn]-[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Twin of this rule and the same defense-impairment burst: ''service <x> stop'' of iptables/security daemons. Routinely fires on the identical command sequence, confirming the stop/disable targeted defenses rather than routine admin.'
  - id: 36388120-b3f1-4ce9-b50b-280d9a7f4c04
    name: Kaspersky Endpoint Security Stopped Via CommandLine - Linux
    reason: A named EDR stopped via the same 'systemctl stop'/init.d path. Co-fires when this stop lands on the AV service and is high-fidelity proof the target was a security product, not a benign unit.
  - id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
    name: UFW Disable Attempt
    reason: 'Same firewall/defense teardown: disabling UFW alongside stopping services leaves the host both unmonitored and unfiltered in one sitting.'
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: 'Parallel defense teardown: flushing all iptables chains to allow-all right after stopping services opens the host for inbound C2 and lateral movement.'
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: 'The logging counterpart to stopping services: operators delete auditd rules in the same burst to kill host telemetry and blind detection.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Cover-tracks follow-on: once the logging service is stopped, wiping /var/log via rm/shred/unlink removes the evidence the stop itself would leave.'
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Cover-tracks follow-on: deleting shell history erases the very ''systemctl stop/disable'' commands this rule caught, hiding the operator''s hand.'
  - id: 31545105-3444-4584-bebf-c466353230d2
    name: Touch Suspicious Service File
    reason: 'Persistence follow-on: having disabled the legitimate service, the operator drops a rogue systemd ''.service'' unit to re-persist under their own control.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Security/telemetry services targeted via service managers on this host
    query: ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]/) AND data_process_exec_process_arguments:/.*([Aa][Uu][Dd][Ii][Tt][Dd]|[Ww][Aa][Zz][Uu][Hh]|[Ff][Aa][Ll][Cc][Oo][Nn]|[Cc][Rr][Oo][Ww][Dd][Ss][Tt][Rr][Ii][Kk][Ee]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Tt][Ee][Tt][Rr][Aa][Gg][Oo][Nn]|[Rr][Ss][Yy][Ss][Ll][Oo][Gg]|[Ss][Yy][Ss][Ll][Oo][Gg]|[Ff][Ii][Ll][Ee][Bb][Ee][Aa][Tt]|[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Dd]|[Aa][Pp][Pp][Aa][Rr][Mm][Oo][Rr]|[Cc][Ll][Aa][Mm][Aa][Vv]|[Ss][Uu][Rr][Ii][Cc][Aa][Tt][Aa]|[Ss][Nn][Oo][Rr][Tt]|[Ss][Ss][Hh][Dd]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Direct termination of security/logging daemons (kill/pkill/killall) on this host
    query: (((data_process_exec_process_binary:/.*\/[Pp][Kk][Ii][Ll][Ll]/ OR data_process_exec_process_binary:/.*\/[Kk][Ii][Ll][Ll][Aa][Ll][Ll]/) AND data_process_exec_process_arguments:/.*([Aa][Uu][Dd][Ii][Tt][Dd]|[Ww][Aa][Zz][Uu][Hh]|[Ff][Aa][Ll][Cc][Oo][Nn]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy][Dd]|[Rr][Ss][Yy][Ss][Ll][Oo][Gg][Dd]|[Ss][Yy][Ss][Ll][Oo][Gg]|[Ff][Ii][Ll][Ee][Bb][Ee][Aa][Tt]|[Tt][Ee][Tt][Rr][Aa][Gg][Oo][Nn]|[Cc][Ll][Aa][Mm][Dd]|[Ss][Uu][Rr][Ii][Cc][Aa][Tt][Aa]|[Ss][Nn][Oo][Rr][Tt]).*/) OR (data_process_exec_process_binary:/.*\/[Kk][Ii][Ll][Ll]/ AND data_process_exec_process_arguments:/.*-(9|[Kk][Ii][Ll][Ll]|[Ss][Ii][Gg][Kk][Ii][Ll][Ll]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Log, journal and SELinux tampering on this host
    query: ((data_process_exec_process_binary:/.*\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*([Vv][Aa][Cc][Uu][Uu][Mm]|[Rr][Oo][Tt][Aa][Tt][Ee]|[Ff][Ll][Uu][Ss][Hh]).*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*-([Dd]|[Ee] 0).*/) OR (data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]/ AND data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg].*/))
    pivot_on:
    - host
    window: 4h
  - name: Root acquisition preceding the stop (sudo/su/pkexec/doas) on this host
    query: (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/)
    pivot_on:
    - host
    window: 1h
  - name: Destructive / wiper / ransomware tooling on this host
    query: ((data_process_exec_process_binary:/.*\/[Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Mm][Kk][Ff][Ss].*/ OR data_process_exec_process_binary:/.*\/[Ww][Ii][Pp][Ee][Ff][Ss]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh][Rr][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Cc][Rr][Yy][Pp][Tt][Ss][Ee][Tt][Uu][Pp]/) OR (data_process_exec_process_arguments:/.*--[Nn][Oo]-[Pp][Rr][Ee][Ss][Ee][Rr][Vv][Ee]-[Rr][Oo][Oo][Tt].*/) OR (data_process_exec_process_binary:/.*\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]/ AND data_process_exec_process_arguments:/.* [Ee][Nn][Cc] .*/))
    pivot_on:
    - host
    window: 6h
