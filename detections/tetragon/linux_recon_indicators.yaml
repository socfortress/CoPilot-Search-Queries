name: Linux Recon Indicators
id: 0cf7a157-8879-41a2-8f55-388dd23746b7
version: 1
schema_version: "1.0"
date: "2022-06-20"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0cf7a157-8879-41a2-8f55-388dd23746b7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects events with patterns found in commands used for reconnaissance on
  linux systems. MITRE ATT&CK: T1592.004, T1552.001.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* -name .htpasswd*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* -perm -4000 *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_arguments
    - data_process_exec_process_binary
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_arguments matches '* -name .htpasswd*';
  data_process_exec_process_arguments matches '* -perm -4000 *'.

known_false_positives: >
  Legitimate administration activities. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/sleventyeleven/linuxprivchecker/blob/0d701080bbf92efd464e97d71a70f97c6f2cd658/linuxprivchecker.py
  - https://attack.mitre.org/techniques/T1592/004/
  - https://attack.mitre.org/techniques/T1552/001/

response:
  message: >
    Linux Recon Indicators detected on host $agent_name$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. MITRE ATT&CK: T1592.004, T1552.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_arguments
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1592.004
    - T1552.001
  custom_tags:
    - recon
    - indicators
    - linux
    - tetragon
    - process_creation
    - reconnaissance
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_arguments:/.* -[Nn][Aa][Mm][Ee] \.[Hh][Tt][Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -4000 .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
    name: Potential Discovery Activity Using Find - Linux
    reason: 'Co-occurring enumeration: fires on the very same ''find -perm -4000'' SUID sweep this rule matches, plus the sibling ''-perm -2000/-u=s/-g=s/0777'' permission probes emitted by one linuxprivchecker/LinPEAS run - both detections light up within seconds of each other on the same host.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Same privilege-mapping recon step: after hunting SUID binaries and .htpasswd, the operator reads /etc/sudoers to list who holds sudo. Same author, same linuxprivchecker reference and T1592.004 technique, routinely issued in the same hands-on session.'
  - id: 6adfbf8f-52be-4444-9bac-81b539624146
    name: Shell Execution via Find - Linux
    reason: 'Direct follow-on exploitation: a SUID ''find'' located by the ''-perm -4000'' sweep is then abused via ''find . -exec /bin/sh'' (GTFOBins) to escalate - enumerating the SUID binary and weaponising it are consecutive actions on the same host.'
  - id: a015e032-146d-4717-8944-7a1884122111
    name: Linux HackTool Execution
    reason: 'The automation behind it and the payoff after it: linpeas/pspy (in this rule''s binary list) are what generate the ''find -perm -4000''/.htpasswd recon automatically, and john/hashcat crack the /etc/shadow hashes the credential hunt leads to - same host, same intrusion.'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Credential-access payoff of the .htpasswd/secret hunt: once recon locates the password stores, the operator stages /etc/shadow or passwd into /tmp to exfiltrate and crack. This rule already lists Linux Recon Indicators as its precursor, confirming the pairing.'
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: 'Follow-on escalation: the privesc enumeration surfaces an exploitable sudo path, then the operator fires the ''sudo -u#-1'' CVE-2019-14287 bypass to become root on the same host shortly after the recon.'
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Likely foothold that precedes it: a web server (httpd/nginx/apache2) spawning a shell is the classic origin of this post-exploitation enumeration, and the .htpasswd target points squarely at a compromised web host - the recon runs as a descendant of the webshell.'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: 'The interactive shell the recon runs under: ''bash -i'' (interactive/reverse shell) spawning whoami and other recon children is the hands-on-keyboard session from which the ''find -perm -4000''/.htpasswd commands are issued.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SUID/SGID and weak-permission file enumeration on this host
    query: (data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND (data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -4000.*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -2000.*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -[Uu]=[Ss].*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -[Gg]=[Ss].*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] 0777.*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -222.*/ OR data_process_exec_process_arguments:/.* -[Pp][Ee][Rr][Mm] -[Oo] [Ww].*/))
    pivot_on:
    - host
    window: 2h
  - name: Credential, key and secret-file access on this host
    query: ((data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Ee][Cc][Dd][Ss][Aa].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Ee][Dd]25519.*/) OR (data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*\.[Hh][Tt][Pp][Aa][Ss][Ss][Ww][Dd].*/) OR (data_process_exec_process_arguments:/.*\/\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/) OR (data_process_exec_process_arguments:/.*\.[Nn][Ee][Tt][Rr][Cc].*/))
    pivot_on:
    - host
    window: 2h
  - name: Privilege-escalation binary execution on this host
    query: ((data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Cc][Aa][Pp]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Nn][Ee][Ww][Gg][Rr][Pp]/ OR data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]/) OR (data_process_exec_process_arguments:/.* -[Uu]\#.*/))
    pivot_on:
    - host
    window: 4h
  - name: Host, user and capability discovery commands on this host
    query: ((data_process_exec_process_binary:/.*\/[Ww][Hh][Oo][Aa][Mm][Ii]/) OR (data_process_exec_process_binary:/.*\/[Ii][Dd]/) OR (data_process_exec_process_binary:/.*\/[Gg][Rr][Oo][Uu][Pp][Ss]/) OR (data_process_exec_process_binary:/.*\/[Uu][Nn][Aa][Mm][Ee]/) OR (data_process_exec_process_binary:/.*\/[Gg][Ee][Tt][Cc][Aa][Pp]/))
    pivot_on:
    - host
    window: 1h
  - name: Enumeration tooling downloaded into a writable directory on this host
    query: ((data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ff][Ee][Tt][Cc][Hh]/ OR data_process_exec_process_binary:/.*\/[Tt][Ff][Tt][Pp]/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Ll][Ii][Nn][Pp][Ee][Aa][Ss].*/ OR data_process_exec_process_arguments:/.*[Ll][Ii][Nn][Uu][Xx][Pp][Rr][Ii][Vv][Cc][Hh][Ee][Cc][Kk][Ee][Rr].*/ OR data_process_exec_process_arguments:/.*[Ll][Ii][Nn][Ee][Nn][Uu][Mm].*/))
    pivot_on:
    - host
    window: 2h
