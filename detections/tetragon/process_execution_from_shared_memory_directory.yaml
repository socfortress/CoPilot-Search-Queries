name: Process Execution From Shared Memory Directory
id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
version: 1
schema_version: "1.0"
date: "2026-06-20"
author: Stan Beukers
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a binary from the Linux shared memory directory
  /dev/shm. This directory is a tmpfs mount backed entirely by RAM and is abused
  by attackers for fileless malware staging because files written there never
  touch physical disk and may evade disk-based detection. MITRE ATT&CK:
  T1027.011.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "/dev/shm/*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '/dev/shm/*'.

known_false_positives: >
  Unlikely in production environments; some container runtimes or IPC frameworks
  may use /dev/shm for inter-process communication but should not spawn
  executables. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sysdig.com/blog/containers-read-only-fileless-malware
  - https://unfinished.bike/fun-with-the-new-bpfdoor-2023
  - https://asiapacificdefencereporter.com/wp-content/uploads/2023/08/Final-CRWD-2023-Threat-Hunting-Report.pdf
  - https://www.crowdstrike.com/en-us/blog/how-to-hunt-for-decisivearchitect-and-justforfun-implant/
  - https://www.linkedin.com/posts/avradeep_malware-apt-infostealer-activity-7373203959697719296-JR-7
  - https://www.stormshield.com/news/orbit-analysis-of-a-linux-dedicated-malware/
  - https://attack.mitre.org/techniques/T1027/011/

response:
  message: >
    Process Execution From Shared Memory Directory detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1027.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027.011
  custom_tags:
    - shared
    - memory
    - directory
    - linux
    - tetragon
    - process_creation
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: 'Foothold / parent: Tetragon stamps the spawning process in data_process_exec_parent_binary, and when the /dev/shm binary''s parent is a web server (nginx/apache2/php-fpm/tomcat), the fileless payload was dropped and launched through a webshell. Compare the alert''s parent_binary against this rule - it explains how an internet-facing Linux host got attacker code into RAM in the first place.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Direct delivery precursor: this rule matches curl/wget writing into /dev/shm (or /tmp) immediately followed by ''sh -c''. It is literally the command that stages the binary this rule then catches executing from /dev/shm, so co-firing on the same host reconstructs the download-then-run of the fileless payload.'
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'Delivery / ingress-tool-transfer: wget -O into a staging directory is how the ELF now running from /dev/shm was fetched onto the host. Seeing it shortly before this exec turns ''a binary ran from RAM'' into ''attacker-downloaded tooling ran from RAM'' - its own authored block already lists this /dev/shm rule as a fileless-evasion sibling.'
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: 'Arming step: a dropped ELF must be made executable (chmod +x) before it can run as /dev/shm/<file>, so a chmod touching the staging path right before this event confirms a stage -> arm -> run sequence rather than a benign container IPC file (the exact false positive this rule warns about).'
  - id: ba592c6d-6888-43c3-b8c6-689b8fe47337
    name: Linux Base64 Encoded Pipe to Shell
    reason: 'Fileless-staging companion (T1140): base64 ... | sh is the other way an actor materialises a payload in memory with no disk artifact, frequently decoding straight into /dev/shm. Same intrusion, same no-disk evasion intent as execution from shared memory.'
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'Sibling staging-directory execution: /tmp is the twin of /dev/shm for running dropped payloads, and actors routinely use both (stage in /tmp, re-stage and run from /dev/shm to dodge disk scanning). It is the closest behavioural analog - if both fire on the host it is a coordinated staging-dir execution cluster, not a one-off.'
  - id: 22236d75-d5a0-4287-bf06-c93b1770860f
    name: Triple Cross eBPF Rootkit Install Commands
    reason: 'Reference-cited payload / follow-on: this detection''s own references point at BPFDoor and eBPF rootkits, and a /dev/shm-staged loader frequently installs exactly this (sudo tc qdisc/filter deploying the Triple Cross eBPF rootkit). Its appearance names what the fileless binary was for - stealthy kernel-level persistence.'
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: 'Most common real-world payload / follow-on: XMRig-style miners (--donate-level=0, -o pool.*, --algo=rx/0) are the single most frequent thing dropped into /dev/shm to run fileless. If the /dev/shm process or a child matches these args, the investigation resolves to resource-hijacking (T1496).'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Payload staged into /dev/shm or /tmp (downloaded, copied or decoded into RAM)
    query: (data_process_exec_process_binary:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Cc][Pp]|[Mm][Vv]|[Ss][Cc][Pp]|[Dd][Dd]|[Tt][Ee][Ee]|[Bb][Aa][Ss][Ee]64|[Oo][Pp][Ee][Nn][Ss][Ss][Ll])/) AND (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: chmod arming a file in /dev/shm or /tmp (execute bit on the staged payload)
    query: data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/)
    pivot_on:
    - host
    window: 1h
  - name: Web-server or app-server process spawning a shell/interpreter (webshell foothold)
    query: data_process_exec_parent_binary:/.*\/([Nn][Gg][Ii][Nn][Xx]|[Aa][Pp][Aa][Cc][Hh][Ee]2|[Hh][Tt][Tt][Pp][Dd]|[Ll][Ii][Gg][Hh][Tt][Tt][Pp][Dd]|[Pp][Hh][Pp]-[Ff][Pp][Mm]|[Tt][Oo][Mm][Cc][Aa][Tt]|[Jj][Aa][Vv][Aa]|[Nn][Oo][Dd][Ee])/ AND data_process_exec_process_binary:/.*\/([Bb][Aa][Ss][Hh]|[Ss][Hh]|[Dd][Aa][Ss][Hh]|[Zz][Ss][Hh]|[Pp][Yy][Tt][Hh][Oo][Nn]3?|[Pp][Ee][Rr][Ll])/
    pivot_on:
    - host
    window: 4h
  - name: Other fileless / staging-directory executions on this host (shm, tmp, var/tmp, run/shm)
    query: data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Rr][Uu][Nn]\/[Ss][Hh][Mm]\/.*/ OR (data_process_exec_process_binary:/.*\/([Bb][Aa][Ss][Hh]|[Ss][Hh]|[Pp][Yy][Tt][Hh][Oo][Nn]3?|[Pp][Ee][Rr][Ll])/ AND data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Follow-on C2 / reverse-shell indicators on this host (nc/ncat/socat, /dev/tcp, pty.spawn)
    query: data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt]|[Nn][Ee][Tt][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Uu][Dd][Pp]\/.*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt].*/
    pivot_on:
    - host
    window: 2h
