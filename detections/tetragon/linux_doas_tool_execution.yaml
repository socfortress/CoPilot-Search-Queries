name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: lnx-doas-001
    name: Linux doas Execution Detection
    reason: Syslog/auditd view of the same doas execution; confirms the escalation from a second telemetry source
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Precursor recon: attacker reads privilege config (sudoers/doas.conf) to learn which escalation path is allowed before invoking doas'
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Sibling escalation primitive; attacker falling back from sudo to doas (or vice versa) on the same host
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: Alternative privilege-escalation attempt on the same host when doas is not permitted
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: 'Follow-on: after gaining root via doas, attackers plant SUID binaries for persistent root'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Follow-on persistence: root cron job created after elevated execution'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Follow-on: root-level account/group change to keep privileged access after doas escalation'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands run with doas (what was elevated)
    query: data_process_exec_parent_binary:"/usr/bin/doas"
    pivot_on:
    - host
    window: 2h
  - name: Reads/edits of doas.conf or sudoers config
    query: data_process_exec_process_arguments:(*doas.conf* OR */etc/sudoers*)
    pivot_on:
    - host
    window: 6h
  - name: Account, SSH key and shadow tampering after elevation
    query: data_process_exec_process_binary:("/usr/sbin/useradd" OR "/usr/sbin/usermod" OR "/usr/bin/passwd" OR "/usr/sbin/adduser") OR data_process_exec_process_arguments:(*authorized_keys* OR */etc/shadow* OR */etc/passwd*)
    pivot_on:
    - host
    window: 2h
  - name: SUID/capability changes and root persistence
    query: (data_process_exec_process_binary:"/usr/bin/chmod" AND data_process_exec_process_arguments:(*u+s* OR *4755* OR *+s*)) OR data_process_exec_process_binary:("/usr/sbin/setcap" OR "/usr/bin/crontab") OR data_process_exec_process_arguments:(*/etc/cron* OR */etc/systemd/system* OR *rc.local*)
    pivot_on:
    - host
    window: 4h
  - name: Download-and-execute tooling around elevation
    query: data_process_exec_process_binary:("/usr/bin/wget" OR "/usr/bin/curl") AND data_process_exec_process_arguments:(*/tmp/* OR */dev/shm/* OR *|*sh* OR *http*)
    pivot_on:
    - host
    window: 2h
