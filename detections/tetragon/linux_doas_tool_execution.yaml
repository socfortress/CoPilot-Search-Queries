name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: lnx-doas-001
    name: Linux doas Execution Detection
    reason: Auditd view of the same doas execution; confirms the escalation and gives the invoking user and exact command line
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Other privilege-switch tooling on the host; shows whether the actor also tried sudo/su before or after doas
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Host and user recon commands usually precede an escalation attempt via doas
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Common follow-on once root: adding an account to the root/sudoers group for persistence'
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: 'Root-level persistence follow-on: planting a setuid binary after elevating'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Credential harvesting follow-on: copying passwd/shadow out of tmp staging once root is obtained'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Cron persistence is typically installed with the elevated privileges doas grants
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Anti-forensics after elevated activity: shell history removal'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells spawned by doas (root shell obtained)
    query: data_process_exec_parent_binary:"/usr/bin/doas" AND data_process_exec_process_binary:/.*\/([Ss][Hh]|[Bb][Aa][Ss][Hh]|[Dd][Aa][Ss][Hh]|[Zz][Ss][Hh]|[Kk][Ss][Hh]|[Aa][Ss][Hh]|[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/
    pivot_on:
    - host
    window: 1h
  - name: Setuid / capability / doas-sudoers config tampering
    query: (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Ss][Ee][Tt][Cc][Aa][Pp])/ AND data_process_exec_process_arguments:/.*(\+[Ss]|[2467][0-7]{3}|[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd]).*/) OR data_process_exec_process_arguments:/.*(\/etc\/doas\.conf|\/etc\/sudoers).*/
    pivot_on:
    - host
    window: 2h
  - name: Account and credential manipulation on this host
    query: data_process_exec_process_binary:/.*\/([Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|[Vv][Ii][Ss][Uu][Dd][Oo]|[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|[Gg][Pp][Aa][Ss][Ss][Ww][Dd])/
    pivot_on:
    - host
    window: 2h
  - name: Sensitive credential files read or copied
    query: data_process_exec_process_arguments:/.*(\/etc\/shadow|\/etc\/passwd|\.ssh\/id_|authorized_keys|\/etc\/doas\.conf).*/ AND data_process_exec_process_binary:/.*\/([Cc][Aa][Tt]|[Cc][Pp]|[Tt][Aa][Rr]|[Ss][Cc][Pp]|[Bb][Aa][Ss][Ee]64|[Ll][Ee][Ss][Ss]|[Hh][Ee][Aa][Dd]|[Tt][Aa][Ii][Ll]|[Gg][Rr][Ee][Pp]|[Rr][Ss][Yy][Nn][Cc])/
    pivot_on:
    - host
    window: 2h
  - name: Tooling pulled into tmp / shared-memory staging paths
    query: data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Cc][Pp]|[Tt][Ff][Tt][Pp])/ AND data_process_exec_process_arguments:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*/
    pivot_on:
    - host
    window: 4h
