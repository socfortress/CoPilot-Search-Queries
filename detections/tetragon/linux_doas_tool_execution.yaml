name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Reconnaissance of sudo/privilege config precedes choosing doas as an escalation path; shows attacker mapping which elevation mechanism is permitted.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Sibling privilege-elevation binaries; attacker falling back from sudo/su to doas (or vice versa) on the same host.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Alternative SUID elevation tool; attackers try several (doas, pkexec) in sequence until one yields root.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: 'Follow-on: once root via doas, a common step is planting a SUID binary for durable privileged access.'
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: Post-escalation permission tampering on system directories by the newly elevated process.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Root obtained via doas enables credential file access/staging (passwd/shadow) as the next objective.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Elevated attacker commonly installs cron persistence immediately after gaining root.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Anti-forensic cleanup commonly follows a privileged session on the same host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands run through doas (child execution as root)
    query: data_process_exec_parent_binary:"/usr/bin/doas" AND NOT data_process_exec_process_binary:"/usr/bin/doas"
    pivot_on:
    - host
    window: 1h
  - name: Doas or sudoers configuration read or modified
    query: (data_process_exec_process_arguments:*doas.conf* OR data_process_exec_process_arguments:*\/etc\/sudoers* OR data_process_exec_process_arguments:*visudo*)
    pivot_on:
    - host
    window: 2h
  - name: Post-root persistence and SUID/credential tampering
    query: (data_process_exec_process_binary:("/usr/bin/chmod" OR "/usr/bin/crontab" OR "/usr/sbin/useradd" OR "/usr/sbin/usermod" OR "/usr/bin/passwd" OR "/usr/bin/setcap" OR "/usr/bin/systemctl") OR data_process_exec_process_arguments:(*\/etc\/shadow* OR *\/etc\/passwd* OR *u+s* OR *4755* OR *authorized_keys*))
    pivot_on:
    - host
    window: 2h
  - name: Download-and-execute or reverse shell tooling on host
    query: (data_process_exec_process_binary:("/usr/bin/curl" OR "/usr/bin/wget" OR "/usr/bin/nc" OR "/usr/bin/ncat") OR data_process_exec_process_arguments:(*\/dev\/tcp\/* OR *bash\ \-i* OR *pty.spawn*))
    pivot_on:
    - host
    window: 2h
  - name: Shell history cleanup or log tampering
    query: (data_process_exec_process_arguments:(*.bash_history* OR *HISTFILE* OR *\/var\/log\/auth.log* OR *\/var\/log\/wtmp*) AND data_process_exec_process_binary:("/usr/bin/rm" OR "/usr/bin/shred" OR "/usr/bin/truncate" OR "/usr/bin/unset" OR "/usr/bin/ln"))
    pivot_on:
    - host
    window: 4h
