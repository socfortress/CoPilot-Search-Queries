name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: 'Sibling elevation path: an attacker without a working doas rule falls back to sudo/su on the same host'
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Alternative privilege-escalation binary tried alongside or after doas when escalation is blocked
  - id: linux-common-process-elevation-control-001
    name: Linux Common Process For Elevation Control
    reason: Generic elevation-control binaries (sudo, su, doas, setcap, chsh) co-occur with doas abuse in the same escalation burst
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Privilege config reconnaissance or tampering (sudoers/doas.conf) typically precedes granting oneself elevated rights
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Auditd view of reads/edits to privilege-delegation files, the setup step before running doas as root
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Root via doas is commonly used next to create a backdoor account for persistence
  - id: e2f3g4h5-6789-1011-1213-141516171819
    name: Linux File Permission Modification Detection
    reason: After elevation, chmod/chown (SUID bits, root-owned payloads) are the usual follow-on to make access durable
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: Root obtained via doas is used to read shadow/credential files, the likely next objective
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other privilege delegation binaries run (sudo/su/pkexec/setcap)
    query: data_process_exec_process_binary:("/usr/bin/sudo" OR "/usr/bin/su" OR "/bin/su" OR "/usr/bin/pkexec" OR "/usr/sbin/setcap")
    pivot_on:
    - host
    window: 1h
  - name: Edits to doas.conf / sudoers / sudoers.d
    query: (data_process_exec_process_arguments:*doas.conf* OR data_process_exec_process_arguments:*sudoers*) AND data_process_exec_process_binary:("/usr/bin/vi" OR "/usr/bin/vim" OR "/usr/bin/nano" OR "/usr/bin/tee" OR "/usr/bin/sed" OR "/usr/bin/echo" OR "/usr/bin/cp" OR "/usr/bin/mv" OR "/usr/bin/visudo")
    pivot_on:
    - host
    window: 2h
  - name: Account/credential changes after elevation (useradd, passwd, shadow reads)
    query: data_process_exec_process_binary:("/usr/sbin/useradd" OR "/usr/sbin/adduser" OR "/usr/sbin/usermod" OR "/usr/bin/passwd" OR "/usr/sbin/chpasswd") OR data_process_exec_process_arguments:(*/etc/shadow* OR */etc/passwd*)
    pivot_on:
    - host
    window: 2h
  - name: Persistence and SUID/permission changes
    query: data_process_exec_process_binary:("/usr/bin/chmod" OR "/usr/bin/chown" OR "/usr/bin/crontab") AND (data_process_exec_process_arguments:(*+s* OR *4755* OR *u+s*) OR data_process_exec_process_arguments:(*crontab* OR *authorized_keys* OR *systemd*))
    pivot_on:
    - host
    window: 4h
  - name: Payload staging via download tools before escalation
    query: data_process_exec_process_binary:("/usr/bin/wget" OR "/usr/bin/curl" OR "/usr/bin/scp" OR "/usr/bin/nc" OR "/usr/bin/ncat") AND data_process_exec_process_arguments:(*http* OR */tmp/* OR */dev/shm/* OR *-e*)
    pivot_on:
    - host
    window: 2h
