name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: lnx-doas-001
    name: Linux doas Execution Detection
    reason: Syslog/auditd view of the same doas invocation; confirms the exec from a second telemetry source and shows the full command line run via doas.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: An actor with doas rights usually also tries sudo/su; co-occurring elevation attempts on the same host widen the escalation picture.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Alternative escalation primitive tried when doas or sudo is unavailable or denied.
  - id: linux-auditd-chown-to-root-001
    name: Linux Auditd Chown To Root
    reason: 'Post-escalation step: files handed to root to plant a SUID backdoor or persist elevated access.'
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: 'Common follow-on once root is obtained: creating a backdoor account.'
  - id: linux-unix-shell-configuration-modification-001
    name: Linux Unix Shell Configuration Modification
    reason: 'Persistence after elevation: shell rc/profile edits so the privileged foothold survives re-login.'
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Root-level persistence via cron typically follows successful privilege escalation.
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Interactive crontab edit under elevated context is a frequent persistence follow-on to doas use.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands run through doas (what executed as root)
    query: data_process_exec_process_binary:/.*(\/[Dd][Oo][Aa][Ss])/ AND _exists_:data_process_exec_process_arguments
    pivot_on:
    - host
    window: 1h
  - name: Account, sudoers and doas.conf changes
    query: (data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Vv][Ii][Ss][Uu][Dd][Oo]|\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|\/[Vv][Ii][Pp][Ww])/ OR (data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Dd][Oo][Aa][Ss].[Cc][Oo][Nn][Ff].*/ OR data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Ss][Hh][Aa][Dd][Oo][Ww].*/))
    pivot_on:
    - host
    window: 2h
  - name: SUID and capability tampering
    query: (data_process_exec_process_binary:/.*(\/[Cc][Hh][Mm][Oo][Dd]|\/[Cc][Hh][Oo][Ww][Nn]|\/[Ss][Ee][Tt][Cc][Aa][Pp]|\/[Cc][Hh][Aa][Tt][Tt][Rr])/ AND (data_process_exec_process_arguments:/.*[Uu]+[Ss].*/ OR data_process_exec_process_arguments:/.*4755.*/ OR data_process_exec_process_arguments:/.*4777.*/ OR data_process_exec_process_arguments:/.*+[Ss].*/ OR data_process_exec_process_arguments:/.*[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd].*/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence set up after escalation
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt])/ OR (data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]/[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Rr][Cc].[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*.[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/))
    pivot_on:
    - host
    window: 4h
