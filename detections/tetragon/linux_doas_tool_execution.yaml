name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
    name: Potential Suspicious Change To Sensitive/Critical Files
    reason: 'Precursor/co-occurring: doas only elevates what /etc/doas.conf permits, so edits or redirects into sensitive config files around the same time suggest the permit rule was just planted.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Recon of the privilege-delegation config (sudoers) shares the intent of reading doas.conf to find a permitted escalation path before using doas.
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Parallel privilege grant: adding the account to root/sudoers via usermod makes the escalation durable alongside doas.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Linux recon (id/whoami/uname/enumeration) typically precedes an attacker trying doas to become root.
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: Interactive bash spawning nc/whoami/iptables/pty children is the foothold shell from which doas gets invoked.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Post-root follow-on: copying passwd/shadow to a tmp path is a common first action once root is obtained.'
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Post-root defense evasion: shell history deletion commonly follows a privileged session to hide the doas commands.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Post-root defense evasion: log clearing after a root-level doas session removes the audit trail of the escalation.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Root shells and interpreters spawned by doas
    query: data_process_exec_parent_binary:"/usr/bin/doas" AND (data_process_exec_process_binary:/.*\/[Bb][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Zz][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Dd][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]/ OR data_process_exec_process_binary:/.*\/[Pp][Ee][Rr][Ll]/)
    pivot_on: host
    window: 2h
  - name: Edits to doas.conf and privilege-delegation config
    query: data_process_exec_process_arguments:/.*[Dd][Oo][Aa][Ss]\.[Cc][Oo][Nn][Ff].*/ OR (data_process_exec_process_arguments:/.*\/etc\/sudoers.*/ AND (data_process_exec_process_binary:/.*\/[Nn][Aa][Nn][Oo]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Tt][Ee][Ee]/))
    pivot_on: host
    window: 6h
  - name: Credential file access (shadow/passwd/SSH keys)
    query: (data_process_exec_process_binary:/.*\/[Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Hh][Ee][Aa][Dd]/ OR data_process_exec_process_binary:/.*\/[Tt][Aa][Ii][Ll]/ OR data_process_exec_process_binary:/.*\/[Ll][Ee][Ss][Ss]/ OR data_process_exec_process_binary:/.*\/[Mm][Oo][Rr][Ee]/ OR data_process_exec_process_binary:/.*\/[Gg][Rr][Ee][Pp]/ OR data_process_exec_process_binary:/.*\/[Cc][Pp]/ OR data_process_exec_process_binary:/.*\/[Ss][Cc][Pp]/) AND (data_process_exec_process_arguments:/.*\/etc\/shadow.*/ OR data_process_exec_process_arguments:/.*\/etc\/passwd.*/ OR data_process_exec_process_arguments:/.*\.ssh\/.*/)
    pivot_on: host
    window: 4h
  - name: Account creation and privilege persistence
    query: (data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]/ OR data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]/ OR data_process_exec_process_binary:/.*\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]/ OR data_process_exec_process_binary:/.*\/[Pp][Aa][Ss][Ss][Ww][Dd]/ OR data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 6h
  - name: Tool staging via curl/wget to writable directories
    query: (data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/) AND (data_process_exec_process_arguments:/.*\/tmp\/.*/ OR data_process_exec_process_arguments:/.*\/dev\/shm\/.*/ OR data_process_exec_process_arguments:/.*\/var\/tmp\/.*/)
    pivot_on: host
    window: 6h
