name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Attacker enumerates user, id and sudo/doas rights before invoking doas; recon on the same host precedes the escalation.
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: Alternative privilege-delegation abuse (sudo vs doas); an attacker probing sudo then falling back to doas is the same escalation attempt.
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Reading sudoers/doas policy to learn which commands can be run as root is the usual precursor to invoking doas.
  - id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
    name: Potential Suspicious Change To Sensitive/Critical Files
    reason: After gaining root via doas, attackers modify sensitive files such as doas.conf, passwd or sshd_config for persistence.
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: Root commands run through doas are commonly used to grant a backdoor user root group membership.
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: Privileged chmod of sensitive paths is a follow-on action once doas yields root.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: Root-level payload staging via curl/wget typically follows a successful doas escalation.
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: doas spawning an interactive shell or its child commands is the interactive hands-on-keyboard phase around escalation.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Doas/sudo invocation spawning a root shell
    query: data_process_exec_parent_binary:("/usr/bin/doas" OR "/usr/bin/sudo" OR "/bin/su") AND data_process_exec_process_binary:("/bin/bash" OR "/bin/sh" OR "/usr/bin/bash" OR "/usr/bin/sh" OR "/usr/bin/zsh" OR "/bin/dash")
    pivot_on:
    - host
    window: 1h
  - name: Account, sudoers or doas policy changes
    query: data_process_exec_process_binary:("/usr/sbin/useradd" OR "/usr/sbin/usermod" OR "/usr/sbin/adduser" OR "/usr/bin/passwd" OR "/usr/sbin/visudo" OR "/usr/bin/chpasswd" OR "/usr/sbin/chpasswd") OR data_process_exec_process_arguments:(*sudoers* OR *doas.conf* OR */etc/passwd* OR */etc/shadow*)
    pivot_on:
    - host
    window: 2h
  - name: Payload download and staging by wget/curl
    query: data_process_exec_process_binary:("/usr/bin/wget" OR "/usr/bin/curl") AND (data_process_exec_process_arguments:*http* OR data_process_exec_process_arguments:*\/tmp\/* OR data_process_exec_process_arguments:*\/dev\/shm*)
    pivot_on:
    - host
    window: 2h
  - name: Persistence via cron, SSH keys or systemd after escalation
    query: data_process_exec_process_binary:("/usr/bin/crontab" OR "/bin/systemctl" OR "/usr/bin/systemctl") OR data_process_exec_process_arguments:(*authorized_keys* OR */etc/cron* OR *\/etc\/systemd\/system* OR *.bashrc* OR *ld.so.preload*)
    pivot_on:
    - host
    window: 4h
  - name: 'Defense evasion: log clearing and history wiping'
    query: data_process_exec_process_arguments:(*\/var\/log\/* OR *HISTFILE* OR *.bash_history* OR *history\ -c*) AND data_process_exec_process_binary:("/bin/rm" OR "/usr/bin/rm" OR "/usr/bin/shred" OR "/usr/bin/truncate" OR "/bin/ln" OR "/usr/bin/unset")
    pivot_on:
    - host
    window: 2h
