name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: lnx-doas-001
    name: Linux doas Execution Detection
    reason: Same doas invocation seen via syslog/auditd; confirms the escalation from a second sensor.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Attacker probing alternative escalation paths (sudo/su) before or after doas on the same host.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Recon of privilege configuration precedes choosing doas or sudo; same intent as reading doas.conf.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: 'Follow-on persistence: planting a setuid binary once root is obtained via doas.'
  - id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
    name: Linux Init Script Persistence Detection
    reason: Root gained through doas is commonly used to install init-script persistence.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Root-level cron persistence frequently follows privileged execution.
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Post-escalation credential hunting for SSH keys under root.
  - id: a94cdd87-6c54-4678-a6cc-2814ffe5a13d
    name: Unix Shell Configuration Modification
    reason: Shell profile tampering to persist after privilege gain.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Doas process execution
    query: data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas"
    pivot_on: host
    window: 1h
  - name: doas.conf read or edited
    query: data_process_exec_process_arguments:*doas.conf* OR full_log:*doas.conf*
    pivot_on: host
    window: 4h
  - name: Shell spawned under doas
    query: data_process_exec_parent_binary:"/usr/bin/doas" AND data_process_exec_process_binary:(*\/sh OR *\/bash OR *\/dash OR *\/zsh)
    pivot_on: host
    window: 1h
  - name: Sensitive file access after escalation
    query: data_process_exec_process_arguments:(*\/etc\/shadow* OR *\/etc\/sudoers* OR *authorized_keys* OR *id_rsa*)
    pivot_on: host
    window: 4h
  - name: Download or persistence tooling
    query: data_process_exec_process_binary:(*\/curl OR *\/wget OR *\/crontab OR *\/chmod OR *\/systemctl)
    pivot_on: host
    window: 4h
