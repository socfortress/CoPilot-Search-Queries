name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: lnx-doas-001
    name: Linux doas Execution Detection
    reason: Syslog/auditd view of the same doas invocation; confirms the escalation from a second telemetry source and may show the target user/command
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Attacker reading sudoers/doas policy to learn which escalation paths exist is a typical precursor to invoking doas
  - id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
    name: Potential Suspicious Change To Sensitive/Critical Files
    reason: Modification of /etc/doas.conf, sudoers or passwd/shadow to grant or persist elevated rights is the usual follow-on or enabler of doas abuse
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Once root is obtained via doas, cron persistence is a common next step
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Elevated privileges via doas are often used to read/copy shadow and passwd for credential access
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: Root-level permission changes after doas escalation, e.g. to open sensitive paths or set up backdoors
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Defense evasion commonly following a successful root escalation to hide the doas-run commands
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log clearing as root after escalation is a typical cleanup step
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands run through doas with a different user or shell
    query: data_process_exec_parent_binary:"/usr/bin/doas" AND (data_process_exec_process_binary:("/bin/sh" OR "/bin/bash" OR "/usr/bin/bash" OR "/usr/bin/sh" OR "/bin/dash" OR "/usr/bin/python3" OR "/usr/bin/perl") OR data_process_exec_process_binary:/.*/(vi|vim|nano|cat|cp|mv|tee|chmod|chown|useradd|usermod|passwd).*/)
    pivot_on:
    - host
    window: 1h
  - name: Edits or reads of doas/sudoers policy and passwd/shadow
    query: data_process_exec_process_arguments:(*doas.conf* OR */etc/sudoers* OR */etc/shadow* OR */etc/passwd* OR */etc/sudoers.d*)
    pivot_on:
    - host
    window: 2h
  - name: Account creation or group changes granting admin
    query: data_process_exec_process_binary:/.*/(useradd|adduser|usermod|passwd|chpasswd|gpasswd)/ AND (data_process_exec_process_arguments:(*wheel* OR *sudo* OR *root* OR *-G* OR *-aG*) OR data_process_exec_process_binary:/.*/(useradd|adduser)/)
    pivot_on:
    - host
    window: 2h
  - name: SUID/capability changes and persistence after escalation
    query: (data_process_exec_process_binary:/.*/chmod/ AND data_process_exec_process_arguments:(*u+s* OR *4755* OR *+s*)) OR data_process_exec_process_binary:/.*/(setcap|crontab|systemctl)/ OR data_process_exec_process_arguments:(*authorized_keys* OR */etc/cron* OR */etc/systemd/system*)
    pivot_on:
    - host
    window: 4h
