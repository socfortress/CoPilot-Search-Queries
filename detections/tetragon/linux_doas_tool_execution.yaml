name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: 'Sibling escalation binary: doas is the OpenBSD drop-in for sudo, so an operator hunting a root path on this host routinely tries both. A sudo ''-u#-1'' exploit attempt in the same window as this doas invocation points to one deliberate escalation effort across every available setuid helper, not an isolated event (that rule''s own block reciprocally cites this doas detection).'
  - id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
    name: Potential Suspicious Change To Sensitive/Critical Files
    reason: 'Precursor and payoff: this rule flags editor/redirect writes to /etc/*.conf (which includes /etc/doas.conf) and /etc/sudoers. Planting a ''permit nopass'' line in doas.conf is exactly how an attacker grants the passwordless root that the doas invocation then uses; the same rule also catches post-root tampering with /bin/passwd and /bin/login, so a hit just before or after confirms the escalation was configured, not inherited.'
  - id: 34979410-e4b5-4e5d-8cfb-389fdff05c12
    name: Remove Immutable File Attribute
    reason: 'Enabling precursor: hardened hosts protect /etc/doas.conf (and /etc/sudoers) with chattr +i, so an attacker runs ''chattr -i'' to unlock the file before writing a permissive doas rule. A chattr -i on this host shortly before the doas use is the step that made a malicious doas.conf edit possible.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: 'Precursor recon: ''find / -perm -4000'' SUID hunting enumerates the local privilege-escalation paths an operator weighs before choosing doas. Seeing it just before the doas invocation shows the escalation came from deliberate privesc-vector discovery, not a routine admin command.'
  - id: a015e032-146d-4717-8944-7a1884122111
    name: Linux HackTool Execution
    reason: 'Precursor / co-occurring tooling: linpeas and pspy are precisely what flag a usable doas rule, and offensive agents (metasploit, havoc, merlin, crackmapexec) stage the surrounding activity. Their execution on this host corroborates a hands-on attacker toolkit behind the doas use rather than a trusted admin.'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Follow-on credential access: reading and copying /etc/shadow is root-only and the classic first action after escalation. A ''cp'' of passwd/shadow into /tmp right after this doas invocation confirms doas reached uid 0 and is being used to harvest password hashes.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Follow-on persistence: having gained root through doas, ''usermod -aG root/sudoers'' makes the privilege durable so the operator never has to re-run doas. It cements exactly the access this alert represents and commonly fires minutes after it.'
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Follow-on defense evasion: root obtained via doas lets the operator stop or disable firewalld, falcon-sensor, Carbon Black or SELinux. If it fires after the doas invocation, the escalation is being used to blind the very telemetry that caught it, sharply raising incident confidence.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: doas configuration file (/etc/doas.conf, /etc/doas.d) created, read or modified on this host
    query: (data_process_exec_process_arguments:/.*\/[Dd][Oo][Aa][Ss]\.[Cc][Oo][Nn][Ff].*/ OR data_process_exec_process_arguments:/.*\/[Dd][Oo][Aa][Ss]\.[Dd]\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other privilege-escalation binaries (sudo/su/pkexec/setcap/newgrp/gpasswd) on this host
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu]|\/[Ss][Uu][Dd][Oo]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp]|\/[Nn][Ee][Ww][Gg][Rr][Pp]|\/[Gg][Pp][Aa][Ss][Ss][Ww][Dd])/
    pivot_on:
    - host
    window: 2h
  - name: Credential store access (shadow/gshadow/SSH keys) after escalation on this host
    query: ((data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/.*/))
    pivot_on:
    - host
    window: 1h
  - name: Commands executed as a child of doas on this host (what ran as root)
    query: data_process_exec_parent_binary:/.*\/[Dd][Oo][Aa][Ss]/
    pivot_on:
    - host
    window: 1h
  - name: Account and persistence changes after escalation (usermod/useradd/passwd/visudo/crontab/systemctl, authorized_keys, sudoers, cron) on this host
    query: ((data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|\/[Vv][Ii][Ss][Uu][Dd][Oo]|\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll])/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/))
    pivot_on:
    - host
    window: 2h
