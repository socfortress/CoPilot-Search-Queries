name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Alternative privilege grant: an attacker who can run doas as root often adds an account to root/sudoers groups to make elevated access durable.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Privilege-config discovery on the same host: reading sudoers/escalation config typically precedes or accompanies doas-based escalation attempts.'
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: Sibling privilege-delegation abuse; attacker pivoting between sudo and doas on the same host while probing for a working escalation path.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Root obtained via doas is commonly followed by credential staging (copying passwd/shadow) for offline cracking.
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: Post-escalation permission tampering (chmod on /etc, /tmp, /opt) executed as root to plant or enable persistence.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Root-level persistence follow-on: escalated attacker installing a cron job to keep elevated access.'
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Persistence via crontab editing, commonly run via a privilege wrapper such as doas after escalation.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Anti-forensics after root is gained: attackers wipe shell history to hide the doas-driven activity.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands run through doas (what was elevated)
    query: data_process_exec_parent_binary:"/usr/bin/doas" AND NOT data_process_exec_process_binary:"/usr/bin/doas"
    pivot_on:
    - host
    window: 1h
  - name: Shell spawned under doas / interactive root shell
    query: data_process_exec_parent_binary:"/usr/bin/doas" AND data_process_exec_process_binary:/.*\/(bash|sh|dash|zsh|ksh|ash)/
    pivot_on:
    - host
    window: 1h
  - name: Account and credential file manipulation
    query: data_process_exec_process_binary:/.*\/(useradd|usermod|adduser|passwd|chpasswd|visudo|userdel|gpasswd)/ OR data_process_exec_process_arguments:/.*\/etc\/(shadow|passwd|sudoers|doas\.conf).*/
    pivot_on:
    - host
    window: 2h
  - name: Ingress tool download before or after escalation
    query: data_process_exec_process_binary:/.*\/(wget|curl)/ AND data_process_exec_process_arguments:/.*(http|ftp|\/tmp\/|\/dev\/shm).*/
    pivot_on:
    - host
    window: 2h
  - name: Persistence and SUID/permission tampering as root
    query: (data_process_exec_process_binary:/.*\/(crontab|systemctl|chattr)/ OR (data_process_exec_process_binary:/.*\/(chmod|chown)/ AND data_process_exec_process_arguments:/.*(\+s|[0-7]?[4-7][0-7]{3}|\/etc\/|\/root\/).*/))
    pivot_on:
    - host
    window: 2h
