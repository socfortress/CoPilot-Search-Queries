name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: lnx-doas-001
    name: Linux doas Execution Detection
    reason: Same doas invocation seen through auditd/syslog; confirms the execution from a second telemetry source.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Actor probing sudo/doas privilege config before or after using doas to elevate.
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Reading sudoers/doas policy to learn what elevation paths exist; a typical precursor.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Alternative elevation tooling used by the same actor when doas is unavailable or denied.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: 'Post-elevation persistence: root shell/binary given setuid bit.'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Root obtained through doas is commonly used to stage passwd/shadow for cracking.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Anti-forensics after privileged commands are run via doas.
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Root-level cron persistence typically follows successful elevation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands executed as children of doas
    query: data_process_exec_parent_binary:"/usr/bin/doas"
    pivot_on: host
    window: 4h
  - name: Sudoers/doas policy file access
    query: data_process_exec_process_arguments:(/.*doas\.conf.*/ OR /.*sudoers.*/)
    pivot_on: host
    window: 6h
  - name: Shell spawned with root-level elevation tooling
    query: data_process_exec_process_binary:("/usr/bin/sudo" OR "/usr/bin/su" OR "/usr/bin/pkexec") AND data_process_exec_process_arguments:(/.*[Bb]ash.*/ OR /.*\/bin\/sh.*/)
    pivot_on: host
    window: 4h
  - name: Passwd/shadow access or copy
    query: data_process_exec_process_arguments:(/.*\/etc\/shadow.*/ OR /.*\/etc\/passwd.*/)
    pivot_on: host
    window: 6h
  - name: Persistence set up via cron or systemd
    query: data_process_exec_process_arguments:(/.*crontab.*/ OR /.*\/etc\/cron.*/ OR /.*systemctl.*enable.*/)
    pivot_on: host
    window: 6h
