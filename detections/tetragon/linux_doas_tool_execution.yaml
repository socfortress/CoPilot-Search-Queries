name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Sibling privilege-config recon: reading sudoers content is how an attacker maps who can elevate before or after leaning on doas'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Follow-on: once elevated via doas, adding an account to root/sudoers groups makes the privilege durable'
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Follow-on: root obtained via doas is typically used to copy passwd/shadow out to tmp for offline cracking'
  - id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
    name: Potential Suspicious Change To Sensitive/Critical Files
    reason: 'Follow-on: root-level edits to sensitive/critical files (doas.conf, sudoers, passwd) after the elevation'
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Follow-on: persistence via cron planted with the elevated rights'
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: 'Co-occurring: doas launched from an interactive bash that spawns suspicious children shows a hands-on-keyboard escalation'
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Follow-on: history deletion is anti-forensics commonly run right after a root shell is gained'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Follow-on: clearing logs after escalation to hide the doas use and later actions'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells and interpreters launched through doas (escalated command execution)
    query: data_process_exec_parent_binary:"/usr/bin/doas" AND (data_process_exec_process_binary:/.*(\/[Ss][Hh]|\/[Bb][Aa][Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt])/)
    pivot_on:
    - host
    window: 1h
  - name: Edits to auth and privilege config files (doas.conf, sudoers, passwd, shadow, authorized_keys)
    query: data_process_exec_process_arguments:/.*(\/etc\/[Dd][Oo][Aa][Ss].[Cc][Oo][Nn][Ff]|\/etc\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss]|\/etc\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/etc\/[Ss][Hh][Aa][Dd][Oo][Ww]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]).*/ AND (data_process_exec_process_binary:/.*(\/[Vv][Ii]|\/[Vv][Ii][Mm]|\/[Nn][Aa][Nn][Oo]|\/[Tt][Ee][Ee]|\/[Ss][Ee][Dd]|\/[Cc][Pp]|\/[Mm][Vv]|\/[Ee][Cc][Hh][Oo]|\/[Cc][Aa][Tt]|\/[Cc][Hh][Mm][Oo][Dd]|\/[Cc][Hh][Oo][Ww][Nn]|\/[Vv][Ii][Ss][Uu][Dd][Oo]|\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd])/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence planted after escalation (cron, systemd units, rc.local, init scripts)
    query: data_process_exec_process_arguments:/.*([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/etc\/[Cc][Rr][Oo][Nn]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm]\/.*\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll] +[Ee][Nn][Aa][Bb][Ll][Ee]|[Rr][Cc].[Ll][Oo][Cc][Aa][Ll]|\/etc\/[Ii][Nn][Ii][Tt].[Dd]).*/
    pivot_on:
    - host
    window: 4h
  - name: Download-and-execute or tool staging as root
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Ff][Ee][Tt][Cc][Hh])/) AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]://|[Hh][Tt][Tt][Pp][Ss]://|-[Oo] +\/[Tt][Mm][Pp]|\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]).*/
    pivot_on:
    - host
    window: 2h
  - name: 'Anti-forensics: history and log tampering'
    query: data_process_exec_process_arguments:/.*([Hh][Ii][Ss][Tt][Oo][Rr][Yy] -[Cc]|.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/|[Uu][Nn][Ss][Ee][Tt] [Hh][Ii][Ss][Tt][Ff][Ii][Ll][Ee]|[Hh][Ii][Ss][Tt][Ss][Ii][Zz][Ee]=0).*/ AND (data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\/[Uu][Nn][Ll][Ii][Nn][Kk]|\/[Cc][Aa][Tt]|\/[Ee][Cc][Hh][Oo]|\/[Ll][Nn]|\/[Ss][Hh]|\/[Bb][Aa][Ss][Hh])/)
    pivot_on:
    - host
    window: 4h
