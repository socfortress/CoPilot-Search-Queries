name: Doas Privilege Escalation Detection
id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects usage of the doas binary or its invocation as a parent process.
  May indicate privilege escalation attempts on systems using doas
  for elevated command execution.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_process_exec_process_binary: "/usr/bin/doas"
              - term:
                  data_process_exec_parent_binary: "/usr/bin/doas"
              - wildcard:
                  full_log: "*\"/usr/bin/doas\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  parent process context. Monitoring doas invocations can reveal privilege
  escalation attempts.

known_false_positives: >
  Legitimate administrative use of doas by trusted users or automated
  scripts. Allowlist known administrative workflows.

references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man.openbsd.org/doas

response:
  message: >
    doas usage detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Linux Security
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:"/usr/bin/doas" OR data_process_exec_parent_binary:"/usr/bin/doas" OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Recon of privilege config on the same host, often just before or after switching to doas
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Reading or editing privilege config (sudoers, doas.conf) alongside doas use points to deliberate rule tampering
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: Sudoers edit in progress on the same host; a doas.conf edit is the equivalent persistence step
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: After gaining root via doas, attackers plant SUID binaries for persistent escalation
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Root obtained via doas is commonly used to stage passwd/shadow for credential theft
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Post-escalation anti-forensics: shell history wiped after privileged commands'
  - id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
    name: Creation Of An User Account
    reason: Root-level persistence by adding a local account right after elevation
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Sibling elevation mechanism; sudo/su/doas together show escalation hunting on this host
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Privileged account or group changes
    query: data_process_exec_process_binary:("/usr/sbin/useradd" OR "/usr/sbin/usermod" OR "/usr/sbin/adduser" OR "/usr/bin/passwd" OR "/usr/sbin/groupadd")
    pivot_on: host
    window: 4h
  - name: Edits to doas, sudoers or passwd files
    query: data_process_exec_process_arguments:(/.*doas\.conf.*/ OR /.*sudoers.*/ OR /.*\/etc\/passwd.*/ OR /.*\/etc\/shadow.*/)
    pivot_on: host
    window: 6h
  - name: SUID bit or capabilities set
    query: data_process_exec_process_binary:("/usr/bin/chmod" OR "/usr/sbin/setcap") AND data_process_exec_process_arguments:(/.*u\+s.*/ OR /.*[24][0-7][0-7][0-7].*/ OR /.*cap_setuid.*/)
    pivot_on: host
    window: 6h
  - name: Reverse shell or interpreter spawn
    query: data_process_exec_process_binary:("/bin/bash" OR "/bin/sh" OR "/usr/bin/python3" OR "/usr/bin/perl") AND data_process_exec_process_arguments:(/.*\/dev\/tcp.*/ OR /.*socket.*connect.*/ OR /.*nc .*-e.*/)
    pivot_on: host
    window: 4h
  - name: Persistence via cron or ssh keys
    query: data_process_exec_process_arguments:(/.*crontab.*/ OR /.*authorized_keys.*/ OR /.*\/etc\/cron.*/ OR /.*\.bashrc.*/)
    pivot_on: host
    window: 6h
