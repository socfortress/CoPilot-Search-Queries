name: Script Interpreter Spawning Credential Scanner - Linux
id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
version: 1
schema_version: "1.0"
date: "2025-11-25"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a script interpreter process (like node.js or bun) spawning a known
  credential scanning tool (e.g., trufflehog, gitleaks). This behavior is
  indicative of an attempt to find and steal secrets, as seen in the
  "Shai-Hulud: The Second Coming" campaign. MITRE ATT&CK: T1552, T1005,
  T1059.004.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/node"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_parent_binary:
                    value: "*/bun"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/trufflehog"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/gitleaks"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*trufflehog*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*gitleaks*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_parent_binary
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_parent_binary matches '*/node';
  data_process_exec_parent_binary matches '*/bun';
  data_process_exec_process_binary matches '*/trufflehog', among other
  conditions.

known_false_positives: >
  Legitimate pre-commit hooks or CI/CD pipeline jobs that use a script to run a
  credential scanner as part of a security check. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/asyncapi/cli/blob/2efa4dff59bc3d3cecdf897ccf178f99b115d63d/bun_environment.js
  - https://www.stepsecurity.io/blog/sha1-hulud-the-second-coming-zapier-ens-domains-and-other-prominent-npm-packages-compromised
  - https://www.endorlabs.com/learn/shai-hulud-2-malware-campaign-targets-github-and-cloud-credentials-using-bun-runtime
  - https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/
  - https://attack.mitre.org/techniques/T1552/
  - https://attack.mitre.org/techniques/T1005/
  - https://attack.mitre.org/techniques/T1059/004/

response:
  message: >
    Script Interpreter Spawning Credential Scanner - Linux detected on host
    $agent_name$. Matched data_process_exec_parent_binary:
    $data_process_exec_parent_binary$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. MITRE ATT&CK: T1552, T1005, T1059.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_parent_binary
      type: other
    - field: data_process_exec_process_binary
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552
    - T1005
    - T1059.004
  custom_tags:
    - interpreter
    - spawning
    - credential
    - linux
    - tetragon
    - process_creation
    - credential_access
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_parent_binary:/.*\/[Nn][Oo][Dd][Ee]/ OR data_process_exec_parent_binary:/.*\/[Bb][Uu][Nn]/) AND (data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]/ OR data_process_exec_process_binary:/.*\/[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss]/ OR data_process_exec_process_arguments:/.*[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: eb827bbd-670a-4d58-8446-c464d8ac2323
    name: Shai-Hulud Malicious Bun Execution - Linux
    reason: 'Immediate precursor: the malicious bun_environment.js / setup_bun.js payload running under the node->bun runtime is the exact parent that spawns this credential scanner, the stage right before secret scanning in the Shai-Hulud ''Second Coming'' chain on the same host.'
  - id: efd2eb09-b72e-4a61-8dc7-b1382a1e8983
    name: Shai-Hulud NPM Package Malicious Exfiltration via Curl
    reason: 'Immediate follow-on: after trufflehog/gitleaks harvests secrets the worm POSTs them via curl to its exfiltration webhook. A same-host hit in the window shows the credential theft reached exfiltration.'
  - id: 11bb9b26-4179-4a06-afcb-1ec31fce1627
    name: Shai-Hulud Malware Indicators - Linux
    reason: 'Co-occurring campaign marker: matches the literal ''Shai-Hulud''/''SHA1HULUD'' strings the worm writes into its own command lines, corroborating that this credential scan belongs to the Shai-Hulud campaign rather than a benign CI secret check.'
  - id: d7a650c4-226c-451e-948f-cc490db506aa
    name: PUA - TruffleHog Execution - Linux
    reason: 'Co-detection of the same tool: flags the TruffleHog secret scanning itself (Git/GitHub/s3/gcs with --results=verified) independent of the node/bun parent this rule requires, confirming and broadening the same credential-harvesting activity on the host.'
  - id: c70834fa-fb9d-4aa0-9e7d-45ceed36f3f7
    name: Linux Suspicious Child Process from Node.js - React2Shell
    reason: 'Co-occurring interpreter abuse via the same mechanism: a Node.js runtime spawning an unexpected non-interpreter child. On a host already running malicious npm/bun payload code, node spawning a shell (execSync RCE) indicates the compromised runtime being driven to run arbitrary commands.'
  - id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
    name: Axios NPM Compromise Indicators - Linux
    reason: 'Co-occurring same attack class: another malicious npm dependency whose postinstall payload executes under the node runtime (curl download -> nohup/python3 RAT). Shares this rule''s root cause (the host/CI pulled a compromised npm package), so a co-hit points to broader npm supply-chain compromise on the host.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential / secret material access on this host
    query: (data_process_exec_process_arguments:/.*\.[Nn][Pp][Mm][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\.[Cc][Oo][Nn][Ff][Ii][Gg]\/[Gg][Cc][Ll][Oo][Uu][Dd].*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*\.[Dd][Oo][Cc][Kk][Ee][Rr]\/[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_process_exec_process_arguments:/.*\.[Gg][Ii][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*169\.254\.169\.254.*/)
    pivot_on:
    - host
    window: 2h
  - name: Secret exfiltration to GitHub API / webhook / paste sites
    query: (((data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Nn][Oo][Dd][Ee]|\/[Bb][Uu][Nn])/) AND (data_process_exec_process_arguments:/.*[Aa][Pp][Ii]\.[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm].*/ OR data_process_exec_process_arguments:/.*[Ww][Ee][Bb][Hh][Oo][Oo][Kk]\.[Ss][Ii][Tt][Ee].*/ OR data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Cc][Oo][Mm]\/[Aa][Pp][Ii]\/[Ww][Ee][Bb][Hh][Oo][Oo][Kk][Ss].*/ OR data_process_exec_process_arguments:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn].*/)) OR ((data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/) AND (data_process_exec_process_arguments:/.*--[Dd][Aa][Tt][Aa].*/ OR data_process_exec_process_arguments:/.*-[Xx] [Pp][Oo][Ss][Tt].*/ OR data_process_exec_process_arguments:/.* -[Dd] .*/)))
    pivot_on:
    - host
    window: 2h
  - name: npm / Bun package publish or token abuse (worming)
    query: (((data_process_exec_process_binary:/.*(\/[Nn][Pp][Mm]|\/[Bb][Uu][Nn]|\/[Yy][Aa][Rr][Nn]|\/[Pp][Nn][Pp][Mm]|\/[Nn][Pp][Xx]|\/[Bb][Uu][Nn][Xx])/) AND (data_process_exec_process_arguments:/.*[Pp][Uu][Bb][Ll][Ii][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Tt][Oo][Kk][Ee][Nn].*/ OR data_process_exec_process_arguments:/.*[Ll][Oo][Gg][Ii][Nn].*/)) OR (data_process_exec_process_arguments:/.*_[Aa][Uu][Tt][Hh][Tt][Oo][Kk][Ee][Nn].*/))
    pivot_on:
    - host
    window: 4h
  - name: git / gh repository creation and remote push for exfil
    query: (((data_process_exec_process_binary:/.*\/[Gg][Ii][Tt]/) AND (data_process_exec_process_arguments:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Aa][Dd][Dd].*/ OR data_process_exec_process_arguments:/.* [Pp][Uu][Ss][Hh].*/ OR data_process_exec_process_arguments:/.* [Ii][Nn][Ii][Tt].*/)) OR ((data_process_exec_process_binary:/.*\/[Gg][Hh]/) AND (data_process_exec_process_arguments:/.*[Rr][Ee][Pp][Oo] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Compromised node/bun runtime spawning tooling on this host
    query: ((data_process_exec_parent_binary:/.*(\/[Nn][Oo][Dd][Ee]|\/[Bb][Uu][Nn]|\/[Nn][Pp][Mm]|\/[Nn][Pp][Xx]|\/[Bb][Uu][Nn][Xx])/) AND (data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Gg][Ii][Tt]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]|\/[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss])/))
    pivot_on:
    - host
    window: 1h
