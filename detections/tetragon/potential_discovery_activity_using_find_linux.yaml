name: Potential Discovery Activity Using Find - Linux
id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
version: 1
schema_version: "1.0"
date: "2022-12-28"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of "find" binary in a suspicious manner to perform discovery.
  MITRE ATT&CK: T1083.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/find"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-perm -4000*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-perm -2000*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-perm 0777*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-perm -222*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-perm -o w*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-perm -o x*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-perm -u=s*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*-perm -g=s*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/find';
  data_process_exec_process_arguments matches '*-perm -4000*';
  data_process_exec_process_arguments matches '*-perm -2000*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SaiSathvik1/Linux-Privilege-Escalation-Notes
  - https://attack.mitre.org/techniques/T1083/

response:
  message: >
    Potential Discovery Activity Using Find - Linux detected on host
    $agent_name$. Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1083
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1083
  custom_tags:
    - linux
    - tetragon
    - process_creation
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND (data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -4000.*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -2000.*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] 0777.*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -222.*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -[Oo] [Ww].*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -[Oo] [Xx].*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -[Uu]=[Ss].*/ OR data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm] -[Gg]=[Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6adfbf8f-52be-4444-9bac-81b539624146
    name: Shell Execution via Find - Linux
    reason: 'Direct privesc payoff on the same binary: if the SUID set this alert enumerated includes find, the actor abuses it with ''find . -exec /bin/sh \;'' to spawn a root shell (GTFOBins find#shell).'
  - id: linux-find-privilege-escalation-001
    name: Linux Find Privilege Escalation
    reason: 'Same binary escalating: ''find -exec'' to run commands as root, the payoff step right after enumerating SUID/SGID files with find.'
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Near-sibling detection firing on the identical '-perm -4000' SUID enumeration (linuxprivchecker) - confirms this is privesc recon and is often the very same command.
  - id: a015e032-146d-4717-8944-7a1884122111
    name: Linux HackTool Execution
    reason: 'Driver of the recon: LinPEAS/pspy run ''find -perm'' internally, so a hit means this find enumeration was produced by a known local-privesc enumeration tool.'
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: 'Co-occurring recon in the same session: reading /etc/sudoers to list who has sudo, run alongside SUID/world-writable enumeration to map the privesc surface.'
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: 'Follow-on escalation: pkexec (PwnKit, CVE-2021-4034) is the most common SUID binary surfaced by this enumeration and then abused to reach root.'
  - id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
    name: Vim GTFOBin Abuse - Linux
    reason: 'Follow-on escalation: abusing a discovered SUID/sudo vim via '':!/bin/sh'' or ''-c'' to break out to a root shell, a classic use of a binary found by this scan.'
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: 'Follow-on escalation: the ''sudo -u#-1'' exploit attempted once the actor has mapped the host''s privilege-escalation surface.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SUID binary shell-escape or privilege-escalation utility on this host
    query: ((data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND data_process_exec_process_arguments:/.*-[Ee][Xx][Ee][Cc].*/) OR (data_process_exec_process_binary:/.*(\/[Vv][Ii][Mm]|\/[Rr][Vv][Ii][Mm]|\/[Vv][Ii]|\/[Nn][Mm][Aa][Pp]|\/[Gg][Dd][Bb]|\/[Aa][Ww][Kk]|\/[Gg][Aa][Ww][Kk]|\/[Ee][Nn][Vv])/ AND data_process_exec_process_arguments:/.*(\/[Bb][Ii][Nn]\/[Ss][Hh]|\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh]|\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh]|\/[Bb][Ii][Nn]\/[Zz][Ss][Hh]|--[Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee]).*/) OR data_process_exec_process_binary:/.*(\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/)
    pivot_on:
    - host
    window: 2h
  - name: Privilege-escalation enumeration (capabilities, kernel, sudo rights, cron) on this host
    query: ((data_process_exec_process_binary:/.*\/[Gg][Ee][Tt][Cc][Aa][Pp]/) OR (data_process_exec_process_binary:/.*\/[Uu][Nn][Aa][Mm][Ee]/ AND data_process_exec_process_arguments:/.*-[Aa].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*-[Ll].*/) OR (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ AND data_process_exec_process_arguments:/.*-[Ll].*/))
    pivot_on:
    - host
    window: 1h
  - name: Sudoers / credential file access on this host
    query: ((data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/))
    pivot_on:
    - host
    window: 2h
  - name: Local privilege-escalation enumeration tooling on this host
    query: data_process_exec_process_binary:/.*(\/[Ll][Ii][Nn][Pp][Ee][Aa][Ss].*|\/[Pp][Ss][Pp][Yy].*|\/[Ll][Ii][Nn][Uu][Xx]-[Ee][Xx][Pp][Ll][Oo][Ii][Tt]-[Ss][Uu][Gg][Gg][Ee][Ss][Tt][Ee][Rr].*|\/[Ll][Ss][Ee]\.[Ss][Hh]|\/[Ll][Ee][Ss]\.[Ss][Hh]|\/[Ll][Ii][Nn][Ee][Nn][Uu][Mm].*)/
    pivot_on:
    - host
    window: 4h
  - name: SUID/SGID or setcap capability backdoor creation on this host
    query: ((data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*([Uu]\+[Ss]|[Gg]\+[Ss]|4[0-7][0-7][0-7]|2[0-7][0-7][0-7]|6[0-7][0-7][0-7]).*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Cc][Aa][Pp]/ AND data_process_exec_process_arguments:/.*[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd].*/))
    pivot_on:
    - host
    window: 2h
