name: Potential GobRAT File Discovery Via Grep
id: e34cfa0c-0a50-4210-9cb3-5632d08eb041
version: 1
schema_version: "1.0"
date: "2023-06-02"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e34cfa0c-0a50-4210-9cb3-5632d08eb041
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of grep to discover specific files created by the GobRAT
  malware. MITRE ATT&CK: T1082.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/grep"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*apached*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*frpc*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*sshd.sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*zone.arm*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/grep';
  data_process_exec_process_arguments matches '*apached*';
  data_process_exec_process_arguments matches '*frpc*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.jpcert.or.jp/en/2023/05/gobrat.html
  - https://www.virustotal.com/gui/file/60bcd645450e4c846238cf0e7226dc40c84c96eba99f6b2cffcd0ab4a391c8b3/detection
  - https://www.virustotal.com/gui/file/3e44c807a25a56f4068b5b8186eee5002eed6f26d665a8b791c472ad154585d1/detection
  - https://attack.mitre.org/techniques/T1082/

response:
  message: >
    Potential GobRAT File Discovery Via Grep detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
    MITRE ATT&CK: T1082
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1082
  custom_tags:
    - gobrat
    - linux
    - tetragon
    - process_creation
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Gg][Rr][Ee][Pp]/ AND (data_process_exec_process_arguments:/.*[Aa][Pp][Aa][Cc][Hh][Ee][Dd].*/ OR data_process_exec_process_arguments:/.*[Ff][Rr][Pp][Cc].*/ OR data_process_exec_process_arguments:/.*[Ss][Ss][Hh][Dd]\.[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Zz][Oo][Nn][Ee]\.[Aa][Rr][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: 'Ingress precursor from the same GobRAT research (both rules cite the JPCERT GobRAT blog): GobRAT''s Start Script fetches the RAT and its helpers via ''wget -O /tmp/<file>''. If it fired on this host shortly before, the grep is the loader verifying the apached/frpc components it just downloaded.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Higher-confidence loader step: curl/wget writing into /tmp or /dev/shm immediately followed by ''sh -c'' - i.e. the GobRAT Start Script staging and launching the payload the grep then enumerates. Co-firing on this host confirms attacker-driven ingress rather than admin activity.'
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: 'The payoff, again sharing this rule''s JPCERT GobRAT references: a binary under /tmp/ actually executes - the masqueraded GobRAT body (''apached'') running from its staging path. Turns ''the components were grepped for'' into ''the RAT is running'' on this host.'
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: 'Documented GobRAT loader action: the Start Script flushes iptables (''-F'') to open the box for C2/proxy traffic before the implant runs. On the same host in-window it places this grep inside GobRAT''s firewall-takedown step.'
  - id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
    name: UFW Disable Attempt
    reason: ufw-based variant of the same firewall teardown the GobRAT loader performs ('ufw disable' / 'ufw-init force-stop'). Corroborates the defense-impairment that precedes the RAT's C2 on hosts running ufw rather than raw iptables.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: 'Persistence follow-on: a crontab job staged from /tmp to relaunch the implant on a schedule - the companion to the sshd.sh/zone.arm startup scripts this rule greps for. Confirms the GobRAT infection is being made to survive reboot.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GobRAT component binaries (apached / frpc) actually executing on this host
    query: (data_process_exec_process_binary:/.*\/[Aa][Pp][Aa][Cc][Hh][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Ff][Rr][Pp][Cc]/)
    pivot_on:
    - host
    window: 4h
  - name: 'Loader ingress: wget/curl downloading a payload into a staging directory'
    query: ((data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/) AND (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/))
    pivot_on:
    - host
    window: 6h
  - name: Host firewall teardown (iptables / ufw / firewalld / nft) on this host
    query: (data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Uu][Ff][Ww]/ OR data_process_exec_process_binary:/.*\/[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]-[Cc][Mm][Dd]/ OR data_process_exec_process_binary:/.*\/[Nn][Ff][Tt]/)
    pivot_on:
    - host
    window: 6h
  - name: Persistence established on this host (cron / rc.local / init.d / systemd)
    query: ((data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/.*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/))
    pivot_on:
    - host
    window: 6h
  - name: Any process handling GobRAT artifact names (apached / frpc / sshd.sh / zone.arm)
    query: (data_process_exec_process_arguments:/.*[Aa][Pp][Aa][Cc][Hh][Ee][Dd].*/ OR data_process_exec_process_arguments:/.*[Ff][Rr][Pp][Cc].*/ OR data_process_exec_process_arguments:/.*[Ss][Ss][Hh][Dd]\.[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Zz][Oo][Nn][Ee]\.[Aa][Rr][Mm].*/)
    pivot_on:
    - host
    window: 6h
