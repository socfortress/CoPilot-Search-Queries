name: Vim GTFOBin Abuse - Linux
id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
version: 1
schema_version: "1.0"
date: "2026-06-05"
author: Nasreddine Bencherchali (Nextron Systems), Luc Génaux
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of "vim" and it's siblings commands to execute a shell or
  proxy commands. Such behavior may be associated with privilege escalation,
  unauthorized command execution, or to break out from restricted environments.
  MITRE ATT&CK: T1059, T1083.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/rvim"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/vi"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/vim"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_binary:
                    value: "*/vimdiff"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* --cmd *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "* -c*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_process_exec_process_arguments: "*:!/*"
              - wildcard:
                  data_process_exec_process_arguments: "*:!$*"
              - wildcard:
                  data_process_exec_process_arguments: "*:!..*"
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*:lua *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*:py *"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*:shell*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/bash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/dash*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/fish*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/sh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/csh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/ksh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/zsh*"
                    case_insensitive: true
              - wildcard:
                  data_process_exec_process_arguments:
                    value: "*/bin/tmux*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/rvim';
  data_process_exec_process_binary matches '*/vi';
  data_process_exec_process_binary matches '*/vim', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://gtfobins.github.io/gtfobins/vi/
  - https://gtfobins.github.io/gtfobins/vim/
  - https://gtfobins.github.io/gtfobins/rvim/
  - https://gtfobins.github.io/gtfobins/vimdiff/
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1083/

response:
  message: >
    Vim GTFOBin Abuse - Linux detected on host $agent_name$. Matched
    data_process_exec_process_binary: $data_process_exec_process_binary$.
    Matched data_process_exec_process_arguments:
    $data_process_exec_process_arguments$. MITRE ATT&CK: T1059, T1083
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1083
  custom_tags:
    - gtfobin
    - abuse
    - linux
    - tetragon
    - process_creation
    - execution
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_process_exec_process_binary:/.*\/[Rr][Vv][Ii][Mm]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm][Dd][Ii][Ff][Ff]/) AND (data_process_exec_process_arguments:/.* --[Cc][Mm][Dd] .*/ OR data_process_exec_process_arguments:/.* -[Cc].*/) AND (data_process_exec_process_arguments:/.*:!\/.*/ OR data_process_exec_process_arguments:/.*:!\$.*/ OR data_process_exec_process_arguments:/.*:!\.\..*/ OR data_process_exec_process_arguments:/.*:[Ll][Uu][Aa] .*/ OR data_process_exec_process_arguments:/.*:[Pp][Yy] .*/ OR data_process_exec_process_arguments:/.*:[Ss][Hh][Ee][Ll][Ll].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ff][Ii][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Cc][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Kk][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Tt][Mm][Uu][Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6adfbf8f-52be-4444-9bac-81b539624146
    name: Shell Execution via Find - Linux
    reason: Same GTFOBins shell-breakout technique family. An attacker working through privilege-escalation binaries who reaches for vim -c :!sh will typically also try find . -exec /bin/sh; both fire on the identical Tetragon process_exec telemetry, so co-firing on the same host within minutes turns a possible false positive into a confirmed GTFOBins enumeration session.
  - id: 8c1a5675-cb85-452f-a298-b01b22a51856
    name: Suspicious Invocation of Shell via AWK - Linux
    reason: Sibling GTFOBins breakout (awk 'BEGIN{system("/bin/sh")}'). Same hands-on enumeration of shell-spawning binaries on the same host, same breakout goal as the vim :! escape; its presence alongside this alert indicates the attacker is iterating over GTFOBins for a shell.
  - id: db1ac3be-f606-4e3a-89e0-9607cbe6b98a
    name: Capsh Shell Invocation - Linux
    reason: capsh -- spawns a shell for capability-based privilege escalation, the same breakout outcome as vim -c :!/bin/sh. Co-occurrence on the same host points to a deliberate search for a privileged shell rather than benign editor use.
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Direct precursor. Reading /etc/sudoers reveals which commands a user may run as root; discovering that vim (or vi/view) is sudo-allowed is exactly what makes the subsequent sudo vim -c :!/bin/sh escalate to root, so this read just before the alert explains the privesc vector.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The vim breakout is almost always run under sudo for privilege escalation (sudo vim -c :!sh -> root shell). A sudo/su event on the same host immediately before this alert is the privilege boundary being crossed and distinguishes a low-priv user escaping to root from an ordinary editor session.
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: Follow-on. vim's :!bash / :shell spawns an interactive shell; this rule fires when that shell runs the recon, base64, pty.spawn or netcat children that are the hands-on-keyboard activity directly produced by the breakout.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Post-escalation credential access. Once the vim breakout yields a root shell, dumping or copying /etc/passwd or /etc/shadow is a common immediate next action on the same host, confirming the escalation achieved its objective.
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: 'Follow-on persistence that reuses the identical editor-breakout primitive: crontab -e launches the user''s $EDITOR (often vim), both establishing a cron foothold and offering the same :!sh escape to run as the cron/root owner. Seeing it after this alert signals the attacker is consolidating access.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sudo running an editor, pager or interpreter on this host (the privesc mechanism)
    query: data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*([Vv][Ii][Mm]|[Rr][Vv][Ii][Mm]|[Vv][Ii][Mm][Dd][Ii][Ff][Ff]|[Nn][Aa][Nn][Oo]|[Ee][Mm][Aa][Cc][Ss]|[Ll][Ee][Ss][Ss]|[Mm][Oo][Rr][Ee]|[Mm][Aa][Nn]|[Aa][Ww][Kk]|[Ff][Ii][Nn][Dd]|[Gg][Dd][Bb]|[Nn][Mm][Aa][Pp]|[Pp][Yy][Tt][Hh][Oo][Nn]|[Pp][Ee][Rr][Ll]|[Rr][Uu][Bb][Yy]|[Cc][Aa][Pp][Ss][Hh]).*/
    pivot_on:
    - host
    window: 2h
  - name: Other GTFOBins binaries spawning a shell on this host (breakout enumeration)
    query: (data_process_exec_process_binary:/.*\/([Ff][Ii][Nn][Dd]|[Aa][Ww][Kk]|[Gg][Aa][Ww][Kk]|[Mm][Aa][Ww][Kk]|[Nn][Aa][Ww][Kk]|[Gg][Dd][Bb]|[Ee][Nn][Vv]|[Nn][Ii][Cc][Ee]|[Ff][Ll][Oo][Cc][Kk]|[Cc][Aa][Pp][Ss][Hh]|[Nn][Mm][Aa][Pp]|[Rr][Ss][Yy][Nn][Cc]|[Tt][Mm][Uu][Xx])/) AND (data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Dd][Aa][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*\/[Bb][Ii][Nn]\/[Zz][Ss][Hh].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\(.*/ OR data_process_exec_process_arguments:/.*[Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Privilege-escalation recon on this host (sudoers, SUID and capability hunting)
    query: (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.* -[Ll].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/) OR (data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND data_process_exec_process_arguments:/.*-[Pp][Ee][Rr][Mm].*/) OR (data_process_exec_process_binary:/.*\/[Gg][Ee][Tt][Cc][Aa][Pp]/)
    pivot_on:
    - host
    window: 4h
  - name: Credential file access on this host (post-escalation)
    query: data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/[Ii][Dd]_.*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Ee][Dd]25519.*/
    pivot_on:
    - host
    window: 2h
  - name: Persistence via cron, systemd, shell profiles or SSH keys on this host (post-escalation)
    query: (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/) OR (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*([Ee][Nn][Aa][Bb][Ll][Ee]|[Ss][Tt][Aa][Rr][Tt]).*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/.*/)
    pivot_on:
    - host
    window: 4h
