name: Triple Cross eBPF Rootkit Execve Hijack
id: 0326c3c8-7803-4a0f-8c5c-368f747f7c3e
version: 1
schema_version: "1.0"
date: "2022-07-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0326c3c8-7803-4a0f-8c5c-368f747f7c3e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of a the file "execve_hijack" which is used by the Triple
  Cross rootkit as a way to elevate privileges.

data_source:
  - Tetragon process_exec via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_process_exec_process_binary:
              value: "*/sudo"
              case_insensitive: true
        - wildcard:
            data_process_exec_process_arguments:
              value: "*execve_hijack*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - data_process_exec_process_uid

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Tetragon deployed on the Linux endpoint emitting process_exec events
  (rule_groups "tetragon, process_exec"), shipped by the Wazuh agent and
  ingested into the wazuh-* indices. Tetragon records the executable in
  data_process_exec_process_binary and its arguments separately in
  data_process_exec_process_arguments. The detection looks for events where
  data_process_exec_process_binary matches '*/sudo';
  data_process_exec_process_arguments matches '*execve_hijack*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/h3xduck/TripleCross/blob/1f1c3e0958af8ad9f6ebe10ab442e75de33e91de/src/helpers/execve_hijack.c#L275

response:
  message: >
    Triple Cross eBPF Rootkit Execve Hijack detected on host $agent_name$.
    Matched data_process_exec_process_binary:
    $data_process_exec_process_binary$. Matched
    data_process_exec_process_arguments: $data_process_exec_process_arguments$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_process_exec_process_binary
      type: other
    - field: data_process_exec_process_arguments
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - triple
    - cross
    - rootkit
    - linux
    - tetragon
    - process_creation
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*[Ee][Xx][Ee][Cc][Vv][Ee]_[Hh][Ii][Jj][Aa][Cc][Kk].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 22236d75-d5a0-4287-bf06-c93b1770860f
    name: Triple Cross eBPF Rootkit Install Commands
    reason: 'Direct precursor: the deployer.sh install phase of this exact rootkit (sudo tc qdisc/filter on enp0s3) that plants the eBPF programs. execve_hijack is merely the trigger that fires the syscall hook this install laid down - same rootkit, same host, install-then-abuse.'
  - id: 7692f583-bd30-4008-8615-75dab3f08a99
    name: Enable BPF Kprobes Tracing
    reason: 'Co-occurring kernel-hook setup: writing debugfs to enable a kprobe trace event (/sys/kernel/debug/tracing/.../enable) is the same eBPF/kprobe plumbing TripleCross arms to intercept execve. A hit on the same host places the kernel-instrumentation step beside the privesc trigger.'
  - id: f8341cb2-ee25-43fa-a975-d8a5a9714b39
    name: BPFtrace Unsafe Option Usage
    reason: 'Same weaponized-eBPF operator: bpftrace --unsafe runs arbitrary system() from a kernel probe, the lighter-weight cousin of TripleCross''s syscall hijack. Co-firing on this host indicates deliberate offensive use of the eBPF subsystem, not debugging.'
  - id: 808146b2-9332-4d78-9416-d7e47012d83d
    name: BPFDoor Abnormal Process ID or Lock File Accessed
    reason: A second eBPF kernel-stealth implant (BPFDoor is an eBPF backdoor) on the same host. TripleCross ships its own eBPF backdoor/C2; co-sighting two rare eBPF implants is strong confirmation of a hands-on kernel-level intrusion rather than an isolated privesc.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: 'Immediate follow-on with the root shell execve_hijack hands the attacker: staging and copying /etc/passwd or /etc/shadow out of /tmp is the first credential-access objective once UID 0 is obtained via the hijack.'
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Defense-evasion follow-on: a rootkit operator stops/disables the userland sensor (service ... stop on iptables, EDR, auditd, Tetragon) to protect the kernel hooks it just activated. Blinding monitoring is a core goal of the stealth rootkit this alert belongs to.'
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: 'Cover-tracks follow-on: auditctl -D wipes all audit rules to erase the trail of the root escalation and the actions that follow it - the classic post-root defense-evasion step after a successful privesc.'
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Persistence follow-on: usermod -aG root/sudoers banks the newly won privilege into a standing account so the attacker keeps root without re-triggering the rootkit''s execve hijack each time.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Offensive eBPF / TripleCross rootkit footprint on this host
    query: (data_process_exec_process_binary:/.*\/([Bb][Pp][Ff][Tt][Oo][Oo][Ll]|[Bb][Pp][Ff][Tt][Rr][Aa][Cc][Ee])/) OR (data_process_exec_process_arguments:/.*[Ee][Xx][Ee][Cc][Vv][Ee]_[Hh][Ii][Jj][Aa][Cc][Kk].*/) OR (data_process_exec_process_arguments:/.* [Tt][Cc] .*([Qq][Dd][Ii][Ss][Cc]|[Ff][Ii][Ll][Tt][Ee][Rr]|[Cc][Ll][Ss][Aa][Cc][Tt]).*/) OR (data_process_exec_process_arguments:/.*\/[Ss][Yy][Ss]\/[Kk][Ee][Rr][Nn][Ee][Ll]\/[Dd][Ee][Bb][Uu][Gg]\/[Tt][Rr][Aa][Cc][Ii][Nn][Gg].*/) OR (data_process_exec_process_arguments:/.*[Kk][Pp][Rr][Oo][Bb][Ee][Ss].*[Ee][Nn][Aa][Bb][Ll][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: Post-escalation credential / secret-file access on this host
    query: (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/([Ss][Hh][Aa][Dd][Oo][Ww]|[Gg][Ss][Hh][Aa][Dd][Oo][Ww]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Ss][Uu][Dd][Oo][Ee][Rr][Ss]).*/) OR (data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/) OR (data_process_exec_process_arguments:/.*([Ii][Dd]_[Rr][Ss][Aa]|[Ii][Dd]_[Ee][Dd]25519|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Security sensor / audit tampering on this host
    query: (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*-[Dd].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee]/ AND data_process_exec_process_arguments:/.*0.*/) OR ((data_process_exec_process_binary:/.*\/([Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Kk][Ii][Ll][Ll]|[Pp][Kk][Ii][Ll][Ll]|[Kk][Ii][Ll][Ll][Aa][Ll][Ll])/) AND (data_process_exec_process_arguments:/.*([Ww][Aa][Zz][Uu][Hh]|[Tt][Ee][Tt][Rr][Aa][Gg][Oo][Nn]|[Aa][Uu][Dd][Ii][Tt][Dd]|[Ff][Aa][Ll][Cc][Oo][Nn]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Cc][Ll][Aa][Mm]|[Ss][Yy][Ss][Mm][Oo][Nn]).*/))
    pivot_on:
    - host
    window: 4h
  - name: Persistence establishment on this host
    query: (data_process_exec_process_binary:/.*\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*-[Aa]?[Gg].*([Rr][Oo][Oo][Tt]|[Ss][Uu][Dd][Oo]).*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/([Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm]|[Cc][Rr][Oo][Nn]|[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd]).*/) OR (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)
    pivot_on:
    - host
    window: 6h
  - name: Reverse shell / backdoor / C2 setup on this host
    query: (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/([Tt][Cc][Pp]|[Uu][Dd][Pp])\/.*/) OR (data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt]|[Nn][Ee][Tt][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/) OR (data_process_exec_process_binary:/.*\/[Mm][Kk][Ff][Ii][Ff][Oo]/) OR (data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/) OR (data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*[Dd][Uu][Pp]2.*/)
    pivot_on:
    - host
    window: 2h
