  query: (data_process_exec_parent_binary:/.*\/[Jj]2[Ee][Ee]\/[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\/[Aa][Pp][Pp][Ss]\/[Ss][Aa][Pp]\.[Cc][Oo][Mm]\/[Ii][Rr][Jj]\/[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\/[Ii][Rr][Jj]\/[Ww][Oo][Rr][Kk].*/ OR data_process_exec_parent_binary:/.*\/[Jj]2[Ee][Ee]\/[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\/[Aa][Pp][Pp][Ss]\/[Ss][Aa][Pp]\.[Cc][Oo][Mm]\/[Ii][Rr][Jj]\/[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\/[Ii][Rr][Jj]\/[Rr][Oo][Oo][Tt].*/ OR data_process_exec_process_cwd:/.*\/[Jj]2[Ee][Ee]\/[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\/[Aa][Pp][Pp][Ss]\/[Ss][Aa][Pp]\.[Cc][Oo][Mm]\/[Ii][Rr][Jj]\/[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\/[Ii][Rr][Jj]\/[Ww][Oo][Rr][Kk].*/ OR data_process_exec_process_cwd:/.*\/[Jj]2[Ee][Ee]\/[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\/[Aa][Pp][Pp][Ss]\/[Ss][Aa][Pp]\.[Cc][Oo][Mm]\/[Ii][Rr][Jj]\/[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\/[Ii][Rr][Jj]\/[Rr][Oo][Oo][Tt].*/) AND (data_process_exec_process_binary:/.*\/[Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Bb][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Cc][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Dd][Aa][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Kk][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Tt][Cc][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Zz][Ss][Hh]/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]2/ OR data_process_exec_process_binary:/.*\/[Pp][Yy][Tt][Hh][Oo][Nn]3/ OR data_process_exec_process_binary:/.*\/[Pp][Ee][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Rr][Uu][Bb][Yy]/ OR data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Nn][Cc]/ OR data_process_exec_process_binary:/.*\/[Nn][Ee][Tt][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Nn][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Ss][Oo][Cc][Aa][Tt]/ OR data_process_exec_process_binary:/.*\/[Nn][Mm][Aa][Pp]/ OR data_process_exec_process_binary:/.*\/[Tt][Ee][Ll][Nn][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Aa][Ww][Kk]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Dd]/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Shell / interpreter execution on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/ OR data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/)'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
    - name: "Persistence via cron / systemd / shell profiles on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd].*/)'
      pivot_on: [host]
      window: 4h
