name: Windows Credential Guard Related Registry Value Deleted - Registry
id: d645ef86-2396-48a1-a2b6-b629ca3f57ff
version: 1
schema_version: "1.0"
date: "2025-12-26"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d645ef86-2396-48a1-a2b6-b629ca3f57ff
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to disable Windows Credential Guard by deleting registry
  values. Credential Guard uses virtualization-based security to isolate secrets
  so that only privileged system software can access them. Adversaries may
  disable Credential Guard to gain access to sensitive credentials stored in the
  system, such as NTLM hashes and Kerberos tickets, which can be used for
  lateral movement and privilege escalation. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 12 - Registry Key Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "12"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\DeviceGuard\\\\EnableVirtualizationBasedSecurity"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\DeviceGuard\\\\LsaCfgFlags"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\DeviceGuard\\\\RequirePlatformSecurityFeatures"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Lsa\\\\LsaCfgFlags"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\DeviceGuard\EnableVirtualizationBasedSecurity';
  data_win_eventdata_targetObject matches '*\DeviceGuard\LsaCfgFlags';
  data_win_eventdata_targetObject matches
  '*\DeviceGuard\RequirePlatformSecurityFeatures', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/DambergC/SaveFolder/blob/90e945eba80fae85f2d54b4616e05a44ec90c500/Cygate%20Installation%20tool%206.22/Script/OSD/OSDeployment-CredentialGuardDisable.ps1#L50
  - https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/configure
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Credential Guard Related Registry Value Deleted - Registry detected
    on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - credential
    - guard
    - related
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"12" AND (data_win_eventdata_targetObject:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd]\\[Ee][Nn][Aa][Bb][Ll][Ee][Vv][Ii][Rr][Tt][Uu][Aa][Ll][Ii][Zz][Aa][Tt][Ii][Oo][Nn][Bb][Aa][Ss][Ee][Dd][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]/ OR data_win_eventdata_targetObject:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd]\\[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd]\\[Rr][Ee][Qq][Uu][Ii][Rr][Ee][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Ff][Ee][Aa][Tt][Uu][Rr][Ee][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Ll][Ss][Aa]\\[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c17d47b7-dcd6-4109-87eb-d1817bd4cbc9
    name: Windows Credential Guard Registry Tampering Via CommandLine
    reason: 'The EID 1 process-creation view of the exact action that produced this EID 12 event: reg.exe/powershell running delete/del/Remove-ItemProperty against the same DeviceGuard and Control\Lsa LsaCfgFlags/EnableVirtualizationBasedSecurity values. Pivot to it to name the process, parent and user that deleted the key.'
  - id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
    name: Windows Credential Guard Disabled - Registry
    reason: Direct sibling on the identical keys via EID 13 set-to-0. Deleting the value and writing it to DWORD 0 are the two ways to turn Credential Guard off; seeing both on the host confirms a deliberate, complete disable rather than a stray deletion.
  - id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
    name: Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via CommandLine
    reason: HVCI lives in the same HKLM\...\DeviceGuard virtualization-based-security subtree. Attackers tearing down Credential Guard routinely strip HVCI in the same session to fully disable VBS, so a HVCI reg tamper on this host is the same protection-stack teardown.
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: The other guard on LSASS secrets. Credential Guard (VBS) and RunAsPPL both block reading LSASS memory; adversaries disable both before dumping. A RunAsPPL/IsPplAutoEnabled change on this host within the window means every LSASS protection is being removed together.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Classic companion tamper: with Credential Guard removed, setting WDigest UseLogonCredential=1 forces LSASS to cache cleartext passwords, so the imminent dump yields plaintext rather than only hashes. Same credential-theft preparation.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'The payoff this deletion enables: suspicious GrantedAccess handle opens on lsass.exe (EID 10) to read the now-unprotected NTLM hashes and Kerberos tickets. This is the follow-on the whole teardown exists for.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: A concrete LSASS-dump method (rundll32 comsvcs.dll MiniDump) commonly executed once credential isolation is down. Its appearance on this host confirms the registry teardown has moved to active credential extraction.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: The Credential-Guard-proof alternative path. Disabling Credential Guard needs a reboot to take effect, so attackers frequently also reg save HKLM\SAM/SECURITY/SYSTEM for offline hash extraction that works immediately; a hive dump here is the parallel credential-theft route.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Command line that disabled Credential Guard / VBS / LSA protections on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Vv][Ii][Rr][Tt][Uu][Aa][Ll][Ii][Zz][Aa][Tt][Ii][Oo][Nn][Bb][Aa][Ss][Ee][Dd][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Qq][Uu][Ii][Rr][Ee][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Ff][Ee][Aa][Tt][Uu][Rr][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: WDigest cleartext credential caching enabled on this host
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: LSASS memory access or dump on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss]\.[Dd][Mm][Pp].*/))
    pivot_on:
    - host
    window: 4h
  - name: SAM / SECURITY / SYSTEM registry hive dump on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* [Ss][Aa][Vv][Ee] .*[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.* [Ss][Aa][Vv][Ee] .*[Hh][Kk][Ll][Mm]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.* [Ss][Aa][Vv][Ee] .*[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*[Ss][Aa][Mm].*/)
    pivot_on:
    - host
    window: 4h
  - name: Host reboot forced after the protection change on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn].* \/[Rr].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Tt][Aa][Rr][Tt]-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_image:/.*\\[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
