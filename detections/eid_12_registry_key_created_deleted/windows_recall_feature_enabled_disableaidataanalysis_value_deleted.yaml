name: Windows Recall Feature Enabled - DisableAIDataAnalysis Value Deleted
id: 5dfc1465-8f65-4fde-8eb5-6194380c6a62
version: 1
schema_version: "1.0"
date: "2024-06-02"
author: Sajid Nawaz Khan
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5dfc1465-8f65-4fde-8eb5-6194380c6a62
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the enabling of the Windows Recall feature via registry manipulation.
  Windows Recall can be enabled by deleting the existing "DisableAIDataAnalysis"
  registry value. Adversaries may enable Windows Recall as part of
  post-exploitation discovery and collection activities. This rule assumes that
  Recall is already explicitly disabled on the host, and subsequently enabled by
  the adversary. MITRE ATT&CK: T1113.

data_source:
  - Sysmon EventID 12 - Registry Key Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "12"
        
        - term:
            data_win_eventdata_eventType:
              value: "DeleteValue"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Windows\\\\WindowsAI\\\\DisableAIDataAnalysis"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_eventType
    - data_win_eventdata_targetObject
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_eventType equals
  'DeleteValue'; data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis'.

known_false_positives: >
  Legitimate use/activation of Windows Recall. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/windows/client-management/manage-recall
  - https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowsai#disableaidataanalysis
  - https://attack.mitre.org/techniques/T1113/

response:
  message: >
    Windows Recall Feature Enabled - DisableAIDataAnalysis Value Deleted
    detected on host $agent_name$. Matched data_win_eventdata_eventType:
    $data_win_eventdata_eventType$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. MITRE ATT&CK: T1113
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_eventType
      type: other
    - field: data_win_eventdata_targetObject
      type: registry_key

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1113
  custom_tags:
    - recall
    - feature
    - disableaidataanalysis
    - registry
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"12" AND data_win_eventdata_eventType:/[Dd][Ee][Ll][Ee][Tt][Ee][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Ii]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Ii][Dd][Aa][Tt][Aa][Aa][Nn][Aa][Ll][Yy][Ss][Ii][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 817f252c-5143-4dae-b418-48c3e9f63728
    name: Windows Recall Feature Enabled Via Reg.EXE
    reason: 'Process-creation twin of this very event: the reg.exe (or equivalent) command that removed the DisableAIDataAnalysis policy value is what produced this EID12 DeleteValue. Firing together confirms a deliberate, command-line-driven Recall enablement by a hands-on operator rather than a benign UI toggle, and hands the analyst the parent process and user that did it.'
  - id: 75180c5f-4ea1-461a-a4f6-6e4700c065d4
    name: Windows Recall Feature Enabled - Registry
    reason: 'Companion enablement path for the same objective: setting DisableAIDataAnalysis to 0 under ...\Policies\Microsoft\Windows\WindowsAI instead of deleting it. Seeing both the delete (this rule) and the set on one host within the window shows the adversary iterating to force Recall on.'
  - id: windows-archive-collected-data-via-rar-001
    name: Windows Archive Collected Data via Rar
    reason: 'Collection payoff that enabling Recall sets up: once Recall populates its ukg.db and ImageStore, operators RAR the harvested snapshot/OCR data for staging and exfil. This realises the T1113 collection objective the registry change was performed to serve.'
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: Same exfil-staging payoff via Compress-Archive into Temp — bundling the Recall snapshot database and screenshot store before egress. A natural next step after Recall has been force-enabled to gather screen data.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: 'Complementary screen-data collection on the same host: force-enabling Recall and running psr.exe both pursue a screen-capture objective (T1113). Co-occurrence corroborates a deliberate screen-harvesting incident rather than an isolated config change.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Recall / WindowsAI feature controls tampered on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Ii].*/
    pivot_on:
    - host
    window: 4h
  - name: Process that modified Recall / WindowsAI settings on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Ii].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Ii][Dd][Aa][Tt][Aa][Aa][Nn][Aa][Ll][Yy][Ss][Ii][Ss].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ll][Ll][Oo][Ww][Rr][Ee][Cc][Aa][Ll][Ll][Ee][Nn][Aa][Bb][Ll][Ee][Mm][Ee][Nn][Tt].*/)
    pivot_on:
    - host
    window: 1h
  - name: Access to the Windows Recall snapshot store / database on this host
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Cc][Oo][Rr][Ee][Aa][Ii][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm].*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Rr][Ee][Aa][Ii][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm].*/ OR data_win_eventdata_commandLine:/.*[Uu][Kk][Gg]\.[Dd][Bb].*/ OR data_win_eventdata_commandLine:/.*[Ii][Mm][Aa][Gg][Ee][Ss][Tt][Oo][Rr][Ee].*/))
    pivot_on:
    - host
    window: 24h
  - name: Archive / staging & outbound-transfer tooling on this host
    query: (((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\7[Zz][Aa]\.[Ee][Xx][Ee]|\\7[Zz][Rr]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Zz][Zz][Ii][Pp]\.[Ee][Xx][Ee]|\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*\.7[Zz].*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.* -[Hh][Pp].*/)) OR (((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Mm][Ee][Gg][Aa][Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee])/) OR ((data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_commandLine:/.*-[Oo][Uu][Tt][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/)))))
    pivot_on:
    - host
    window: 4h
  - name: Security-tool / Defender tampering on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/)
    pivot_on:
    - host
    window: 2h
