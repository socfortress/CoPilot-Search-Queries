Ww][Ss]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\[Mm][Ss][Ii].*/ OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Jj][Aa][Vv][Aa]\\.*/ AND data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Cc][Ll][Ss][Ii][Dd]\\\{4299124[Ff]-[Ff]2[Cc]3-41[Bb]4-9[Cc]73-9236[Bb]2[Aa][Dd]0[Ee]8[Ff]\}.*/) OR data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Aa][Vv][Ii][Rr][Aa]\\[Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss][\\]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Vv][Ii][Rr][Aa]\\[Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss][\\]/) AND (data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\\{305[Cc][Aa]226-[Dd]286-468[Ee]-[Bb]848-2[Bb]2[Ee]8[Ee]697[Bb]74\}\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]/ OR data_win_eventdata_targetObject:/.*\\[Aa][Nn][Tt][Ii][Vv][Ii][Rr]\.[Kk][Ee][Yy][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]/)) OR (data_win_eventdata_image:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp].*/ AND data_win_eventdata_image:/.*\\[Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee].*/) OR (data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\[Ii][Ss]-.*/ AND data_win_eventdata_image:/.*\\[Tt][Aa][Rr][Gg][Ee][Tt]\.[Tt][Mm][Pp].*/) OR data_win_eventdata_image:/.*\\[Nn][Ii][Nn][Ii][Tt][Ee]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]/) OR (data_win_eventdata_image:/.*\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]/) OR (data_win_eventdata_image:/.*[Cc]:\\[Ee][Cc][Ll][Ii][Pp][Ss][Ee]\\[Ee][Cc][Ll][Ii][Pp][Ss][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*_[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Ee][Cc][Ll][Ii][Pp][Ss][Ee]\+.*/) OR (data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp].*/ AND data_win_eventdata_image:/.*\\[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
    name: Suspicious Shell Open Command Registry Modification
    reason: 'Write-side twin of this rule: it fires when a ''*\shell\open\command'' key is SET to a suspicious payload path; this rule fires when that same key is later DELETED to erase the track. Its hit names what was planted before the cleanup.'
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: Detects the exefile / ms-settings shell\open\command manipulation used by the fodhelper/computerdefaults/slui UAC-bypass chain (UACMe 33/62) - the exact hijack whose teardown this deletion represents.
  - id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
    name: Bypass UAC Using Event Viewer
    reason: The eventvwr bypass writes HKCU\...\mscfile\shell\open\command; after eventvwr.exe runs the payload elevated the attacker deletes that key, which is what this rule catches. Its hit is the matching setup event.
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: Fileless fodhelper/computerdefaults bypass that creates an empty '...\open\command\DelegateExecute' value; the '\shell\open\command' subtree it builds is deleted on cleanup, triggering this rule.
  - id: 07743f65-7ec9-404a-a519-913db7118a8d
    name: COM Hijack via Sdclt
    reason: Writes HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute for the sdclt bypass - a literal shell\open\command key that this rule later sees being removed to cover tracks.
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: 'Trigger side: fodhelper.exe reading the planted ms-settings\shell\open\command and spawning an elevated child is the elevation this cleanup follows. A child of fodhelper near this delete confirms the bypass ran.'
  - id: da2738f2-fadb-4394-afa7-0a0674885afa
    name: Sdclt Child Processes
    reason: 'Trigger side for the sdclt variant: sdclt.exe spawning a child is the payload executing from the hijacked Folder\shell\open\command key just before this rule records its deletion.'
  - id: 3c05e90d-7eba-4324-9972-5d7f711a60a8
    name: UAC Bypass Tools Using ComputerDefaults
    reason: 'Trigger side: computerdefaults.exe producing a High/System-integrity process is the elevation obtained from the shell\open\command hijack whose removal this rule detects.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: UAC-bypass / shell-open-command registry writes on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ss][Cc][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Ee][Xx][Ee][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Ff][Oo][Ll][Dd][Ee][Rr]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ee][Xx][Ee][Cc][Uu][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Auto-elevating UAC-bypass binary spawning a child on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
