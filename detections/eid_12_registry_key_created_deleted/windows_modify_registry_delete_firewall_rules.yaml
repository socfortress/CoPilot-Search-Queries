name: Windows Modify Registry Delete Firewall Rules
id: windows-modify-registry-delete-firewall-rules-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects deletion of firewall rules via registry, indicating potential security 
  breach or unauthorized access attempt. Monitors Sysmon EventID 12 for DeleteValue 
  events targeting FirewallRules registry path. Removing firewall rules exposes 
  the network to external threats. Used by ShrinkLocker, NetSupport RAT.

data_source:
  - Sysmon EventID 12

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "12"
        - wildcard:
            data_win_eventdata_targetObject: "*\\SharedAccess\\Parameters\\FirewallPolicy\\FirewallRules\\*"
        - term:
            data_win_eventdata_eventType: "DeleteValue"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_eventType
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 12 (Registry Key/Value Create/Delete) configured 
  to monitor the FirewallPolicy registry path. Ensure Sysmon config includes 
  FirewallPolicy\FirewallRules in EventID 12 TargetObject rules.

known_false_positives: >
  Network administrators may add/remove/modify firewall rules. Investigate 
  the process making the change and volume of rules deleted.

references:
  - https://www.bleepingcomputer.com/news/security/new-shrinklocker-ransomware-uses-bitlocker-to-encrypt-your-files/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Firewall rule deleted via registry on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - ShrinkLocker
    - CISA AA24-241A
    - NetSupport RMM Tool Abuse
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - firewall_rules
    - registry_delete
    - defense_evasion
    - network_exposure
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"12" AND data_win_eventdata_targetObject:/.*SharedAccess.*Parameters.*FirewallPolicy.*FirewallRules.*/ AND data_win_eventdata_eventType:"DeleteValue"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
    name: Firewall Rule Deleted Via Netsh.EXE
    reason: 'Direct cause: ''netsh advfirewall firewall delete rule'' is what writes the EID12 DeleteValue events on FirewallPolicy\FirewallRules that fire this alert; this EID1 detection names the actor process and command line behind the registry telemetry.'
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: 'Escalation of the same impair-firewall action: after stripping individual rules the actor typically turns the whole firewall off (''netsh advfirewall set allprofiles state off'' / ''set opmode disable''); same host, same intent to expose the network.'
  - id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
    name: Disable Microsoft Defender Firewall via Registry
    reason: 'Registry sibling: SetValue EnableFirewall=0 under the very same Services\SharedAccess\Parameters\FirewallPolicy hive this rule watches for DeleteValue - the registry-value form of disabling the firewall, same Sysmon EID12/13 source.'
  - id: a5d85486-b89c-11eb-8267-acde48001122
    name: Allow Inbound Traffic In Firewall Rule
    reason: 'Hole-punch complement: deleting restrictive rules is usually paired with adding a New-NetFirewallRule -Inbound -Allow -LocalPort to expose a listening service for C2/RDP/lateral movement; the two together open the host to the attacker.'
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: 'Co-occurring impair-defenses via the registry: stripping firewall rules and setting DisableAntiSpyware/DisableRealtimeMonitoring are the same host-protection-teardown pass, both landing as Sysmon registry writes on the same host.'
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Independent confirmation of the AV teardown: Defender''s own operational log (EID 5001) shows real-time protection is actually off, corroborating the firewall-plus-Defender impair-defenses campaign from a data source separate from Sysmon.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Ransomware recovery-destruction follow-on: ShrinkLocker (named in this rule) strips firewall/defenses then eliminates backups (vssadmin/wmic/wbadmin delete) before encrypting; deleting shadows on the same host turns defense evasion into an imminent ransomware incident.'
  - id: windows-modify-registry-configure-bitlocker-001
    name: Windows Modify Registry Configure BitLocker
    reason: 'ShrinkLocker encryption step: registry FVE changes (EnableBDEWithNoTPM / UseAdvancedStartup) to force BitLocker without TPM - the exact threat named in this rule, and registry-based like the firewall-rule deletion, so the same actor''s next move on the host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Firewall turned off entirely on this host (netsh / PowerShell / registry)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND ((data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Oo][Ff][Ff].*/) OR (data_win_eventdata_commandLine:/.*[Oo][Pp][Mm][Oo][Dd][Ee].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/))) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ AND data_win_eventdata_scriptBlockText:/.*[Ff][Aa][Ll][Ss][Ee].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Pp][Oo][Ll][Ii][Cc][Yy].*/ AND data_win_eventdata_targetObject:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]/ AND data_win_eventdata_details:/.*0[Xx]00000000.*/)
    pivot_on:
    - host
    window: 2h
  - name: Process that deleted or removed firewall rules on this host (netsh / NetFirewallRule cmdlets)
    query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ee][Tt].*/)) OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Microsoft Defender tampering on this host (registry disable or Set/Add-MpPreference)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/ AND (data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee]/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]/ OR data_win_eventdata_targetObject:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/))
    pivot_on:
    - host
    window: 2h
  - name: System recovery destruction on this host (shadow copy / backup / recovery disable)
    query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Tt][Aa][Ll][Oo][Gg].*/) OR (data_win_eventdata_image:/.*\\[Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ AND data_win_eventdata_commandLine:/.*[Nn][Oo].*/))
    pivot_on:
    - host
    window: 4h
  - name: BitLocker forced / no-TPM encryption setup on this host (ShrinkLocker)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ff][Vv][Ee].*/ AND (data_win_eventdata_targetObject:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Nn][Oo][Nn][Tt][Pp][Mm].*/ OR data_win_eventdata_targetObject:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Bb][Dd][Ee][Ww][Ii][Tt][Hh][Nn][Oo][Tt][Pp][Mm].*/ OR data_win_eventdata_targetObject:/.*[Uu][Ss][Ee][Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd][Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Aa][Nn][Aa][Gg][Ee]-[Bb][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Nn][Aa][Gg][Ee]-[Bb][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr].*/))
    pivot_on:
    - host
    window: 4h
