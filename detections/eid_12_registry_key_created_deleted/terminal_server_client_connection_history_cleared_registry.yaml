name: Terminal Server Client Connection History Cleared - Registry
id: 07bdd2f5-9c58-4f38-aec8-e101bb79ef8d
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07bdd2f5-9c58-4f38-aec8-e101bb79ef8d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the deletion of registry keys containing the MSTSC connection history.
  MITRE ATT&CK: T1070, T1112.

data_source:
  - Sysmon EventID 12 - Registry Key Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "12"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "DeleteValue"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Microsoft\\\\Terminal Server Client\\\\Default\\\\MRU*"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "DeleteKey"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Microsoft\\\\Terminal Server Client\\\\Servers\\\\*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_eventType
    - data_win_eventdata_targetObject
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_eventType equals
  'DeleteValue'; data_win_eventdata_targetObject matches '*\Microsoft\Terminal
  Server Client\Default\MRU*'; data_win_eventdata_eventType equals 'DeleteKey',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/troubleshoot/windows-server/remote/remove-entries-from-remote-desktop-connection-computer
  - http://woshub.com/how-to-clear-rdp-connections-history/
  - https://www.trendmicro.com/en_us/research/23/a/vice-society-ransomware-group-targets-manufacturing-companies.html
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Terminal Server Client Connection History Cleared - Registry detected on
    host $agent_name$. Matched data_win_eventdata_eventType:
    $data_win_eventdata_eventType$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. MITRE ATT&CK: T1070, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_eventType
      type: other
    - field: data_win_eventdata_targetObject
      type: registry_key

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1112
  custom_tags:
    - terminal
    - server
    - client
    - registry
    - sysmon
    - persistence
    - stealth
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"12" AND ((data_win_eventdata_eventType:/[Dd][Ee][Ll][Ee][Tt][Ee][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr] [Cc][Ll][Ii][Ee][Nn][Tt]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\[Mm][Rr][Uu].*/) OR (data_win_eventdata_eventType:/[Dd][Ee][Ll][Ee][Tt][Ee][Kk][Ee][Yy]/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr] [Cc][Ll][Ii][Ee][Nn][Tt]\\[Ss][Ee][Rr][Vv][Ee][Rr][Ss]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: 'Direct precursor: `mstsc /v:<host>` is the exact action that writes the Terminal Server Client\Default\MRU and Servers\ entries this rule later deletes. It names the outbound RDP destinations the MRU wipe is trying to erase.'
  - id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
    name: Mstsc.EXE Execution From Uncommon Parent
    reason: 'Precursor on the same host: mstsc spawned by a browser/Outlook is rogue-RDP (a phished .rdp lure) outbound connection that populates the same MSTSC MRU; clearing that MRU hides where the lure sent this host.'
  - id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
    name: Outbound RDP Connections Over Non-Standard Tools
    reason: 'Network-side record of the hidden pivots: outbound 3389 lateral movement from this host is exactly the destination history the registry wipe removes, and its destinationIp recovers targets the MRU deletion erased.'
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: 'Same operator, same RDP registry objective (T1112): reg.exe flipping CurrentControlSet\Control\Terminal Server to enable inbound RDP on this jump box pairs with manually scrubbing the outbound Terminal Server Client history in one hands-on session.'
  - id: windows-eventlog-cleared-wevtutil-001
    name: Windows Eventlog Cleared Via Wevtutil
    reason: 'Follow-on cover-tracks: wiping the RDP connection history is one step of a sanitisation burst; `wevtutil cl` clearing the event logs on the same host is the operator''s next anti-forensic move in the same ransomware playbooks (Vice Society/Rhysida).'
  - id: 26b692dc-1722-49b2-b496-a8258aa6371d
    name: Clear PowerShell History - PowerShell
    reason: 'Co-occurring indicator removal (T1070): clearing the PSReadline history is the same ''erase my per-user activity trail'' behaviour as wiping the MSTSC MRU, and is routinely done back-to-back in a hands-on cleanup.'
  - id: c6438007-e081-42ce-9483-b067fbef33c3
    name: Powershell Timestomp
    reason: 'Co-occurring anti-forensics: timestomping files in the same window as the RDP-history deletion marks a deliberate forensic-defeat phase rather than a one-off registry edit, raising the whole cluster to an incident.'
  - id: windows-indicator-removal-rmdir-001
    name: Windows Indicator Removal Via Rmdir
    reason: 'Follow-on cleanup: `rmdir /s /q` silently deleting tool/staging directories completes the same host-sanitisation that the MSTSC MRU deletion began.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound RDP from this host (the destinations the MRU wipe hid)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Vv]:.*/ OR data_win_eventdata_commandLine:/.* -[Vv]:.*/)) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Anti-forensic / cover-tracks sweep on this host (log & shadow-copy clearing)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*\/[Cc][Ll][Ee][Aa][Rr].*/)) OR data_win_system_eventID:"1102" OR data_win_system_eventID:"104"
    pivot_on:
    - host
    window: 2h
  - name: Other user-activity / MRU history artifacts deleted on this host
    query: data_win_system_eventID:"12" AND (data_win_eventdata_targetObject:/.*\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr] [Cc][Ll][Ii][Ee][Nn][Tt]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Rr][Uu][Nn][Mm][Rr][Uu].*/ OR data_win_eventdata_targetObject:/.*\\[Rr][Ee][Cc][Ee][Nn][Tt][Dd][Oo][Cc][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Tt][Yy][Pp][Ee][Dd][Pp][Aa][Tt][Hh][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Tt][Yy][Pp][Ee][Dd][Uu][Rr][Ll][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Uu][Ss][Ee][Rr][Aa][Ss][Ss][Ii][Ss][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Inbound RDP logon to this host (how the operator reached the jump box)
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625") AND data_win_eventdata_logonType:"10"
    pivot_on:
    - host
    window: 4h
  - name: Credential access on this host (the creds that enabled the outbound RDP)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 4h
