name: Removal Of AMSI Provider Registry Keys
id: 41d1058a-aea7-4952-9293-29eaaf516465
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 41d1058a-aea7-4952-9293-29eaaf516465
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the deletion of AMSI provider registry key entries in
  HKLM\Software\Microsoft\AMSI. This technique could be used by an attacker in
  order to disable AMSI inspection. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 12 - Registry Key Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "12"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*{2781761E-28E0-4109-99FE-B9D127C57AFE}"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*{A7C452EF-8E9F-42EB-9F2B-245613CA0DC9}"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\Windows Defender\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files (x86)\\\\Windows Defender\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\MsMpEng.exe"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*{2781761E-28E0-4109-99FE-B9D127C57AFE}'; data_win_eventdata_targetObject
  matches '*{A7C452EF-8E9F-42EB-9F2B-245613CA0DC9}'; data_win_eventdata_image
  matches 'C:\ProgramData\Microsoft\Windows Defender\Platform\*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
  - https://seclists.org/fulldisclosure/2020/Mar/45
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Removal Of AMSI Provider Registry Keys detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - removal
    - provider
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"12" AND (data_win_eventdata_targetObject:/.*\{2781761[Ee]-28[Ee]0-4109-99[Ff][Ee]-[Bb]9[Dd]127[Cc]57[Aa][Ff][Ee]\}/ OR data_win_eventdata_targetObject:/.*\{[Aa]7[Cc]452[Ee][Ff]-8[Ee]9[Ff]-42[Ee][Bb]-9[Ff]2[Bb]-245613[Cc][Aa]0[Dd][Cc]9\}/) AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/) AND data_win_eventdata_image:/.*\\[Mm][Ss][Mm][Pp][Ee][Nn][Gg]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7dbbcac2-57a0-45ac-b306-ff30a8bd2981
    name: Windows AMSI Related Registry Tampering Via CommandLine
    reason: Process-creation (EID 1) view of AMSI registry tampering by reg.exe/PowerShell -- the same class of elevated tool that performs this provider-key deletion; its hit names the process and command line behind the EID 12 delete.
  - id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f705
    name: Potential Persistence Via New AMSI Providers - Registry
    reason: Writes under the very same HKLM\SOFTWARE\Microsoft\AMSI\Providers subtree this rule watches for deletion; attackers who remove the real Defender provider often register a rogue/fake one, so both firing on one host is one AMSI-provider manipulation.
  - id: 160d2780-31f7-4922-8b3a-efce30e63e96
    name: Potential AMSI COM Server Hijacking
    reason: Neuters AMSI by breaking its COM provider registration (CLSID InprocServer32) -- the same objective (kill AMSI via its registration) reached by a sibling registry method; co-firing confirms a determined AMSI-neutering effort.
  - id: aa37cbb0-da36-42cb-a90f-fdf216fc7467
    name: AMSI Disabled via Registry Modification
    reason: Sets AmsiEnable=0 -- the registry-value variant of disabling AMSI; adversaries commonly try several AMSI-disable methods in one session, so this on the same host corroborates the provider-key deletion.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: In-process amsiInitFailed bypass -- a complementary AMSI kill that covers the current process when the registry route is insufficient; seen alongside, it widens a single evasion event into a campaign.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Obfuscated AMSI-bypass PowerShell -- the kind of script that runs once AMSI is blinded; a strong follow-on marking the payload/execution stage after the provider keys are removed.
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: In-memory AMSI tampering via System.Management.Automation.Amsi -- co-occurring AMSI neutralization in the same session, confirming intent to execute unscanned code right after the registry bypass.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: The elevated actor disabling Defender's self-protection in the same defense-evasion phase -- clearing the way to freely tamper with Defender/AMSI registration; strongly co-occurring with killing the Defender AMSI provider.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AMSI registration tampering on this host (provider keys, AmsiEnable, COM server)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Aa][Mm][Ss][Ii]\\.*/ OR data_win_eventdata_targetObject:/.*[Aa][Mm][Ss][Ii][Ee][Nn][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_targetObject:/.*\{[Ff][Dd][Bb]00[Ee]52-[Aa]214-4[Aa][Aa]1-8[Ff][Bb][Aa]-4357[Bb][Bb]0072[Ee][Cc]\}.*/)
    pivot_on:
    - host
    window: 2h
  - name: Process deleting or editing AMSI provider registration via reg.exe / PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Aa][Mm][Ss][Ii].*/ OR data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Ee][Nn][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*\{2781761[Ee]-28[Ee]0-4109-99[Ff][Ee]-[Bb]9[Dd]127[Cc]57[Aa][Ff][Ee]\}.*/ OR data_win_eventdata_commandLine:/.*\{[Aa]7[Cc]452[Ee][Ff]-8[Ee]9[Ff]-42[Ee][Bb]-9[Ff]2[Bb]-245613[Cc][Aa]0[Dd][Cc]9\}.*/)
    pivot_on:
    - host
    window: 2h
  - name: AMSI in-memory bypass in PowerShell script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ss][Cc][Aa][Nn][Bb][Uu][Ff][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Cc][Oo][Nn][Tt][Ee][Xx][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt]\.[Aa][Uu][Tt][Oo][Mm][Aa][Tt][Ii][Oo][Nn]\.[Aa][Mm][Ss][Ii].*/)
    pivot_on:
    - host
    window: 4h
  - name: Windows Defender impairment on this host (same evasion phase)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ii][Oo][Aa][Vv][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee][Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from script interpreters on this host (post-bypass C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
