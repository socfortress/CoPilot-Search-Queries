name: Delete Defender Scan ShellEx Context Menu Registry Key
id: 72a0369a-2576-4aaf-bfc9-6bb24a574ac6
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: Matt Anderson (Huntress)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 72a0369a-2576-4aaf-bfc9-6bb24a574ac6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects deletion of registry key that adds 'Scan with Defender' option in
  context menu. Attackers may use this to make it harder for users to scan files
  that are suspicious.

data_source:
  - Sysmon EventID 12 - Registry Key Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "12"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*shellex\\\\ContextMenuHandlers\\\\EPP*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\Windows Defender\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files (x86)\\\\Windows Defender\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\MsMpEng.exe"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*shellex\ContextMenuHandlers\EPP*'; data_win_eventdata_image matches
  'C:\ProgramData\Microsoft\Windows Defender\Platform\*';
  data_win_eventdata_image matches 'C:\Program Files\Windows Defender\*', among
  other conditions.

known_false_positives: >
  Unlikely as this weakens defenses and normally would not be done even if using
  another AV. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.splunk.com/endpoint/395ed5fe-ad13-4366-9405-a228427bdd91/
  - https://winaero.com/how-to-delete-scan-with-windows-defender-from-context-menu-in-windows-10/
  - https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
  - https://blog.malwarebytes.com/malwarebytes-news/2021/02/lazyscripter-from-empire-to-double-rat/

response:
  message: >
    Delete Defender Scan ShellEx Context Menu Registry Key detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - delete
    - defender
    - shellex
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"12" AND data_win_eventdata_targetObject:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx]\\[Cc][Oo][Nn][Tt][Ee][Xx][Tt][Mm][Ee][Nn][Uu][Hh][Aa][Nn][Dd][Ll][Ee][Rr][Ss]\\[Ee][Pp][Pp].*/ AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/) AND data_win_eventdata_image:/.*\\[Mm][Ss][Mm][Pp][Ee][Nn][Gg]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b9e8c7d6-a5f4-4e3d-8b1a-9f0c8d7e6a5b
    name: Windows Defender Context Menu Removed
    reason: 'Process-creation twin of this alert: it catches the reg.exe/PowerShell command that deletes the Defender ShellEx context-menu (EPP) handler keys - i.e. the exact process that produces this EID 12 key-deletion. Correlating them attributes the deletion to a concrete process and its parent lineage.'
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: reg.exe is the usual tool for this key deletion; this rule flags reg.exe disabling other Defender registry keys in the same burst, so a same-host hit in-window shows the context-menu removal is part of broader Defender registry tampering, not an isolated edit.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'The escalation of the same defense-impairment goal, seen from Defender''s own operational log: after hiding on-demand scanning the actor turns off active real-time scanning so the next payload executes unscanned.'
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: 'Classic companion action in the same evasion sequence: once scanning is weakened the actor registers exclusion paths so tooling staged in those paths is never inspected; frequently paired with context-menu/key removal.'
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: 'Enabler/precursor: Tamper Protection must be off for most Defender registry tampering to stick, so a nearby hit explains how this deletion succeeded and marks a deliberate, privileged defender-disable effort rather than a stray config change.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Downstream ransomware preparation in the exact intrusion chain the references describe (IcedID->XingLocker): defenses are weakened first, then shadow copies are destroyed before encryption. A later same-host hit turns this evasion alert into an imminent-ransomware incident.'
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: 'Co-occurring anti-forensics: actors that strip Defender visibility commonly clear or tamper Windows event logs in the same session to blind the SOC; a nearby hit widens this from single-tool AV impairment to a coordinated defense-evasion effort.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Defender / AV disabling command on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Volume shadow copy or backup deletion on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Windows event log clearing or tampering on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*([Cc][Ll]|[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg]|[Ss][Ll]).*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll].*[Uu][Ss][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence written to the registry on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\([Ss][Hh][Ee][Ll][Ll]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]).*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/)
    pivot_on:
    - host
    window: 4h
  - name: LSASS credential-dump process access on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1010/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/)
    pivot_on:
    - host
    window: 4h
