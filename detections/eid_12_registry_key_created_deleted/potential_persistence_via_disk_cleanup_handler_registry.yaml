correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 790317c0-0a36-4a6a-a105-6e576bf99a14
    name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
    reason: The new VolumeCaches handler key's (Default) value is a CLSID; this detects a CLSID's InprocServer32/LocalServer32 being repointed to a DLL in a user-writable path - i.e. the executable payload cleanmgr will load when it enumerates the handler. Same COM-handler chain (T1546.015) on the host.
  - id: windows-com-hijacking-inprocserver32-001
    name: Windows COM Hijacking InprocServer32 Modification
    reason: 'reg.exe writing an InprocServer32 key is the payload-registration step behind the handler: the CLSID the new VolumeCaches key points to must resolve to a DLL via InprocServer32. Direct precursor/co-registration in the same disk-cleanup-handler chain.'
  - id: ea61e291-af05-4716-932a-67faddb6ae6f
    name: PowerShell COM Hijacking InProcServer32 Modification
    reason: PowerShell variant of the same InprocServer32 COM-payload registration; the handler's CLSID-to-DLL mapping is frequently written from a PowerShell script in the same intrusion.
  - id: 724ea201-6514-4f38-9739-e5973c34f49a
    name: Bypass UAC Using SilentCleanup Task
    reason: SilentCleanup is the auto-elevated scheduled task that runs cleanmgr.exe and loads the VolumeCaches handlers; a windir hijack here weaponizes that exact task to execute the just-registered handler at high integrity - the trigger that both fires and elevates this persistence.
  - id: b697e69c-746f-4a86-9f59-7bfff8eab881
    name: UAC Bypass Using Disk Cleanup
    reason: The elevated cleanmgr.exe /autoclean execution launched by the Schedule service - the exact process that enumerates and loads registered VolumeCaches disk-cleanup handlers, i.e. the execution event that fires this persistence.
  - id: f1edd233-30b5-4823-9e6a-c4171b24d316
    name: Rundll32 Registered COM Objects
    reason: rundll32 loading a registered COM object is a common way the attacker tests or executes the COM DLL behind the handler; same registered-COM execution surface (T1546.015) on the host.
  - id: fe20dda1-6f37-4379-bbe0-a98d400cae90
    name: Potential Persistence Via Scrobj.dll COM Hijacking
    reason: 'Sibling COM-based persistence (T1546.015): registers a scriptlet COM payload via ScriptletURL under a CLSID. Operators planting a disk-cleanup handler often stage additional COM-hijack persistence in the same intrusion.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Malicious COM server (InprocServer32/LocalServer32) registered under a CLSID on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_targetObject:/.*\\[Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ee][Rr]32.*/)
    pivot_on:
    - host
    window: 4h
  - name: Further writes under the Disk Cleanup VolumeCaches handler path on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Vv][Oo][Ll][Uu][Mm][Ee][Cc][Aa][Cc][Hh][Ee][Ss]\\.*/
    pivot_on:
    - host
    window: 4h
  - name: DLL payload dropped to a user-writable location on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: Disk Cleanup trigger executed on this host (cleanmgr.exe / SilentCleanup)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
  - name: Registration tooling referencing the handler / COM payload on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Oo][Ll][Uu][Mm][Ee][Cc][Aa][Cc][Hh][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
