type: TTP

description: >
  Detects when an attacker modifies values of the Disk Cleanup Handler in the
  registry to achieve persistence. The disk cleanup manager is part of the
  operating system. It displays the dialog box […] The user has the option of
  enabling or disabling individual handlers by selecting or clearing their check
  box in the disk cleanup manager's UI. Although Windows comes with a number of
  disk cleanup handlers, they aren't designed to handle files produced by other
  applications. Instead, the disk cleanup manager is designed to be flexible and
  extensible by enabling any developer to implement and register their own disk
  cleanup handler. Any developer can extend the available disk cleanup services
  by implementing and registering a disk cleanup handler.

data_source:
  - Sysmon EventID 12 - Registry Key Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "12"
        
        - term:
            data_win_eventdata_eventType:
              value: "CreateKey"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\VolumeCaches\\\\*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Active Setup Temp Folders"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\BranchCache"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Content Indexer Cleaner"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\D3D Shader Cache"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Delivery Optimization Files"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Device Driver Packages"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Diagnostic Data Viewer database files"
                          case_insensitive: true
                    - wildcard:
