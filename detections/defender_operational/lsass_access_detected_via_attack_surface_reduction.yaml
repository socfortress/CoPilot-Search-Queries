name: LSASS Access Detected via Attack Surface Reduction
id: a0a278fe-2c0e-4de2-ac3c-c68b08a9ba98
version: 1
schema_version: "1.0"
date: "2022-08-13"
author: Markus Neis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a0a278fe-2c0e-4de2-ac3c-c68b08a9ba98
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Access to LSASS Process. MITRE ATT&CK: T1003.001.

data_source:
  - Windows Defender Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "1121"
        - wildcard:
            data_win_eventdata_path:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_processName"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_processName:
                                value: "C:\\\\Windows\\\\Temp\\\\asgard2-agent\\\\*"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\thor64.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_processName:
                                      value: "*\\\\thor.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\atiesrxx.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\CompatTelRunner.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\msiexec.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\nvwmi64.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\svchost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\Taskmgr.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\System32\\wbem\\WmiPrvSE.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_processName:
                          value: "C:\\Windows\\SysWOW64\\msiexec.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "C:\\\\Windows\\\\System32\\\\DriverStore\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "C:\\\\WINDOWS\\\\Installer\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_processName:
                          value: "C:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_path
    - data_win_eventdata_processName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '1121'; data_win_eventdata_path
  matches '*\lsass.exe'; data_win_eventdata_processName matches
  'C:\Windows\Temp\asgard2-agent\*', among other conditions.

known_false_positives: >
  Google Chrome GoogleUpdate.exe. Some Taskmgr.exe related activity. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Access Detected via Attack Surface Reduction detected on host
    $agent_name$. Matched data_win_eventdata_path: $data_win_eventdata_path$.
    Matched data_win_eventdata_processName: $data_win_eventdata_processName$.
    MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_path
      type: file_name
    - field: data_win_eventdata_processName
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - attack
    - surface
    - defender
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1121" AND data_win_eventdata_path:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_processName AND NOT ((data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Aa][Ss][Gg][Aa][Rr][Dd]2-[Aa][Gg][Ee][Nn][Tt]\\.*/ AND (data_win_eventdata_processName:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/)) OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Tt][Ii][Ee][Ss][Rr][Xx][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Mm][Pp][Aa][Tt][Tt][Ee][Ll][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Nn][Vv][Ww][Mm][Ii]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss][Tt][Oo][Rr][Ee]\\.*/ OR data_win_eventdata_processName:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\.*/ OR data_win_eventdata_processName:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_processName:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Co-occurring corroboration: Sysmon EID 10''s view of the very LSASS handle this ASR rule blocked - an open with dump-grade access masks (0x1fffff/0x1438) and a dbgcore/dbghelp/ntdll call trace. ASR blocks at the Defender layer but Sysmon still records the attempt, so this firing on the same host confirms the 1121 was a genuine dump try, not an allowlist gap.'
  - id: windows-defender-asr-threat-tamper-001
    name: Windows Defender ASR or Threat Configuration Tamper
    reason: 'Direct follow-on to being blocked: Set-/Add-MpPreference -AttackSurfaceReductionRules_Actions Disabled turns off the exact ASR rule that just stopped the dump, clearing the way for a retry. The most causally-tied next action after a 1121 block.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'ASR-evading retry: rundll32 comsvcs.dll MiniDump (#24) is precisely the LOLBin LSASS-dump this ASR rule is built to block (its own how_to_implement names this rule as the blocker). Seen after the block, it means the operator switched to the living-off-the-land variant to get around ASR.'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: 'ASR-evading retry with a signed tool: ProcDump -ma/-mm against ls*/samss/keyiso is the common fallback dumper once direct LSASS access is denied; its Microsoft signature makes it a frequent next attempt on the same host.'
  - id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
    name: Credential Dumping Attempt Via WerFault
    reason: 'ASR/PPL-bypass retry: WerFault.exe opening lsass with 0x1FFFFF (the ''Shtinkering'' technique) abuses a trusted Windows process to dump LSASS - a known path around the credential-theft ASR rule.'
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Plaintext-harvest prep: flipping WDigest UseLogonCredential=1 forces LSASS to cache cleartext passwords so a retried dump yields plaintext, not just NTLM hashes - a classic companion to an LSASS theft attempt.'
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: 'Pivot to another credential store: with LSASS locked down by ASR, the attacker falls back to reg.exe save of the SAM/SYSTEM/SECURITY hives to recover local-account secrets offline (T1003.002/004/005).'
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: 'Escalation objective: if a dump that evades ASR yields a privileged/domain credential, DCSync (4662 ''Replicating Directory Changes'') pulls every account hash straight from the DC - the end goal this credential theft serves.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Alternative LSASS memory-dump techniques on this host (ASR-bypass retries)
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt]|[Hh][Aa][Nn][Dd][Ll][Ee][Kk][Aa][Tt][Zz])\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
  - name: Defender / ASR being disabled on this host (neutralising the control that just blocked them)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Tt][Tt][Aa][Cc][Kk][Ss][Uu][Rr][Ff][Aa][Cc][Ee][Rr][Ee][Dd][Uu][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Pivot to other credential stores on this host (SAM/SYSTEM/SECURITY hives, NTDS.dit, shadow copies)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*/ AND data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm].*/) OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: This account's remote/failed logons across the estate (harvested-credential reuse & lateral movement)
    query: ((data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 6h
  - name: Remote-execution / lateral-movement tooling launched on this host (post-theft movement)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Ww][Ii][Nn][Rr][Ss]|[Mm][Ss][Tt][Ss][Cc])\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*[Cc][Aa][Ll][Ll].*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)) OR (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ss] .*/)))
    pivot_on:
    - host
    window: 4h
