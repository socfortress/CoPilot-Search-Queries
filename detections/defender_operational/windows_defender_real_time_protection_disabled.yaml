name: Windows Defender Real-time Protection Disabled
id: b28e58e4-2a72-4fae-bdee-0fbe904db642
version: 1
schema_version: "1.0"
date: "2023-11-22"
author: Ján Trenčanský, frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b28e58e4-2a72-4fae-bdee-0fbe904db642
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects disabling of Windows Defender Real-time Protection. As this event
  doesn't contain a lot of information on who initiated this action you might
  want to reduce it to a "medium" level if this occurs too many times in your
  environment. MITRE ATT&CK: T1685.

data_source:
  - Windows Defender Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5001"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '5001'.

known_false_positives: >
  Administrator actions (should be investigated). Seen being triggered
  occasionally during Windows 8 Defender Updates. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/defender-endpoint/troubleshoot-microsoft-defender-antivirus?view=o365-worldwide#event-id-5001
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
  - https://craigclouditpro.wordpress.com/2020/03/04/hunting-malicious-windows-defender-activity/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Real-time Protection Disabled detected on host
    $agent_name$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - protection
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5001"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: 'The Sysmon EID 1 process view of the action that produces this 5001: PowerShell ''Set-MpPreference -DisableBehaviorMonitoring/-DisableRuntimeMonitoring $true'' or ''sc.exe stop/delete/config WinDefend''. The 5001 operational event records no initiating process or user, so a hit here on the same host is what identifies WHO turned Real-Time Protection off and how.'
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: 'The registry route to the same outcome (Sysmon EID 13): a write setting DisableRealtimeMonitoring/DisableBehaviorMonitoring=1 under the Windows Defender key is frequently the exact change that flips Real-Time Protection off and emits this 5001, and it carries the data_win_eventdata_image the operational event omits.'
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: EID 5013 fires when Tamper Protection BLOCKS an attempt to flip DisableRealtimeMonitoring/DisableBehaviorMonitoring - the very setting this alert reports as off. A 5013 on the same host means the attacker tried and was blocked, then succeeded by an unprotected route (GPO/service), so the pair confirms deliberate, repeated targeting of Real-Time Protection rather than an update glitch.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: 'Classic companion in the same tamper burst, from the SAME Defender Operational log (EID 5007): with Real-Time Protection off - or even once it is restored - an exclusion path/process/extension keeps the dropped payload unscanned. Exclusion-added plus RTP-off on one host is a strong malicious pattern, not an admin tweak.'
  - id: 686c0b4b-9dd3-4847-9077-d6c1bbe36fcb
    name: Windows Defender Virus Scanning Feature Disabled
    reason: 'Same ''disable everything'' sweep seen on the same Defender Operational log (EID 5012): a sibling protection switched off in the same window. Several distinct Defender-feature-disable events on one host within minutes defeats the rule''s known-FP (a one-off update glitch) and marks a deliberate AV takedown.'
  - id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
    name: Disabled Windows Defender Eventlog
    reason: 'The attacker silences the telemetry this detection rides on: a registry write setting ...WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational\Enabled=0 (behaviour seen with LockBit 3.0). A hit here means future 5001 and all Defender events go dark on this host - turning RTP off and then killing its log channel is a complete blind-the-endpoint sequence.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'The documented ransomware endgame once Defender is neutralised (the exact chain in IcedID->Xinglocker and Hive/Conti/AvosLocker intrusions): vssadmin/wmic/wbadmin/bcdedit destroying shadow copies and backups so files cannot be recovered before encryption. A hit shortly after RTP-off escalates this from defense-evasion to imminent impact.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'The credential-theft objective the AV-blinding clears the way for: with Real-Time Protection off, Mimikatz runs without being quarantined. The same ransomware crews disable Defender and then dump LSASS credentials for lateral movement, so Mimikatz on this host in the window is the payoff of the tamper.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Who turned Real-Time Protection off on this host (Defender-disable command or registry write)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ii][Oo][Aa][Vv][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/))) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]/))
    pivot_on:
    - host
    window: 1h
  - name: Defender exclusion added on this host (safe path for the payload)
    query: (data_win_system_eventID:"1" OR data_win_system_eventID:"4104") AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Wider blinding on this host (firewall off / AMSI bypass / event-log cleared)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Ss][Tt][Aa][Tt][Ee] [Oo][Ff][Ff].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] [Ss][Ee][Tt] [Oo][Pp][Mm][Oo][Dd][Ee] [Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)) OR ((data_win_system_eventID:"1" OR data_win_system_eventID:"4104") AND (data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ss][Cc][Aa][Nn][Bb][Uu][Ff][Ff][Ee][Rr].*/)) OR data_win_system_eventID:"1102"
    pivot_on:
    - host
    window: 4h
  - name: Credential theft while protection is down (LSASS access or dump on this host)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/)
    pivot_on:
    - host
    window: 2h
  - name: Ransomware pre-encryption on this host (shadow-copy / backup destruction)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*[Nn][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss].*/)) OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/)
    pivot_on:
    - host
    window: 6h
