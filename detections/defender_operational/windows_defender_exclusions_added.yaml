name: Windows Defender Exclusions Added
id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
version: 1
schema_version: "1.0"
date: "2022-12-06"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects the Setting of Windows Defender Exclusions. MITRE ATT&CK: T1685.

data_source:
  - Windows Defender Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5007"
        - wildcard:
            data_win_eventdata_newValue:
              value: "*\\\\Microsoft\\\\Windows Defender\\\\Exclusions*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_newValue

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '5007';
  data_win_eventdata_newValue matches '*\Microsoft\Windows
  Defender\Exclusions*'.

known_false_positives: >
  Administrator actions. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://twitter.com/_nullbind/status/1204923340810543109
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Exclusions Added detected on host $agent_name$. Matched
    data_win_eventdata_newValue: $data_win_eventdata_newValue$. MITRE ATT&CK:
    T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_newValue
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - exclusions
    - added
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5007" AND data_win_eventdata_newValue:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: 'Same action seen by Sysmon registry (EID 13): the write to the ...\Windows Defender\Exclusions key that Event 5007 reports, but carrying data_win_eventdata_image -- it names the process that actually added the exclusion, which 5007 omits.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: 'Process-creation (EID 1) view of the same action: Add/Set-MpPreference with -ExclusionPath/Process/Extension on the command line, revealing the shell, parent process, user and the exact object excluded.'
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: 'Script-block (EID 4104) view of the same action: the full Add/Set-MpPreference exclusion script text and the user who ran it -- confirms intent when the exclusion came from PowerShell rather than the UI.'
  - id: 48917adc-a28e-4f5d-b729-11e75da8941f
    name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
    reason: The reg.exe method (used by Qbot) that writes the Exclusions\Paths value directly; a hit here on the same host identifies the parent process and the folder being shielded, i.e. where the payload will land.
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: 'Same intrusion usually blinds Defender in one burst: reg.exe flipping DisableRealtimeMonitoring / DisableAntiSpyware / TamperProtection beside the exclusion -- escalates a lone exclusion into a deliberate AV takedown.'
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: 'Co-occurring defense impairment (EID 13): registry values turning off real-time / behavior / IOAV protection, the registry twin of adding an exclusion and a hallmark of IcedID/Hive/Conti/AvosLocker on the same host.'
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: 'Frequent precursor/companion: Tamper Protection is cleared so that exclusion and other MpPreference changes actually stick -- its presence in the window raises confidence the exclusion is adversarial, not an admin tweak.'
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: The other half of the same tampering burst, emitted by the SAME Windows Defender Operational log (EID 5001) as this 5007 exclusion event -- exclusion plus real-time-off on one host is a strong malicious pattern.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender exclusion command executed on this host (MpPreference cmdlet or reg.exe Exclusions key)
    query: (data_win_system_eventID:"1" OR data_win_system_eventID:"4104") AND ((data_win_eventdata_commandLine:/.*[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/) AND (data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/) OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Aa][Nn][Tt][Ii][Mm][Aa][Ll][Ww][Aa][Rr][Ee]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Broader Defender / AV protection disabled on this host (same tamper burst)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ii][Oo][Aa][Vv][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Ss][Cc][Aa][Nn][Nn][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Bb][Ll][Oo][Cc][Kk][Aa][Tt][Ff][Ii][Rr][Ss][Tt][Ss][Ee][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Pp][Uu][Aa][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Mm][Pp][Ee][Nn][Aa][Bb][Ll][Ee][Pp][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Dd][Nn][Ii][Ss][Ss][Vv][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww][Dd][Ff][Ii][Ll][Tt][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Process executing from a commonly-excluded staging directory on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_image:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Payload staging on this host: downloader LOLBins / PowerShell web download'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]/)) OR ((data_win_system_eventID:"1" OR data_win_system_eventID:"4104") AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence established on this host (Run keys / services / IFEO / scheduled tasks)
    query: ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/))
    pivot_on:
    - host
    window: 4h
