name: RedSun - TieringEngineService.exe Detected as EICAR Test File
id: a7c3e5f2-8b1d-4e9a-b6c2-3d7f5e8a9b4c
version: 1
schema_version: "1.0"
date: "2026-04-17"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a7c3e5f2-8b1d-4e9a-b6c2-3d7f5e8a9b4c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Windows Defender (EventID 1119 - Remediation Action Failed) flagging
  TieringEngineService.exe dropped in a characteristic RS-{GUID} temporary
  directory, or the RedSun.exe process itself being present. This covers the
  staging pattern used by RedSun, a Cloud Files API and opportunistic lock
  (oplock) based AV bypass/privilege escalation tool. RedSun works as follows:
  1. Registers a Cloud Files sync root and creates a Cloud Files placeholder for
  TieringEngineService.exe under %TEMP%\RS-{GUID}\ 2. The placeholder file
  carries EICAR test file content (Virus:DOS/EICAR_Test_File) to reliably
  trigger a Defender scan and remediation attempt 3. Requests a batch oplock
  (FSCTL_REQUEST_BATCH_OPLOCK) on the placeholder file 4. When Defender attempts
  to scan/quarantine the file, the oplock triggers - holding the file open 5.
  During the oplock break window, RedSun swaps the mount point (junction) to
  redirect \\?\C:\Windows\System32 to the attacker-controlled temp path 6. This
  races the AV/OS into executing the malicious TieringEngineService.exe with
  elevated privileges. MITRE ATT&CK: T1036.005, T1685, T1055.

data_source:
  - Windows Defender Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "1119"
        - term:
            data_win_eventdata_sourceName:
              value: "Real-Time Protection"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_path:
                          value: "*\\\\TieringEngineService.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_threatName:
                          value: "*EICAR_Test_File"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_processName:
                    value: "*\\\\RedSun.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceName
    - data_win_eventdata_path
    - data_win_eventdata_threatName
    - data_win_eventdata_processName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '1119';
  data_win_eventdata_sourceName equals 'Real-Time Protection';
  data_win_eventdata_path matches '*\TieringEngineService.exe', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Nightmare-Eclipse/RedSun/blob/7456cc8cf066f5e5fc6cdf7d3272a466ebd6b2f6/RedSun.cpp#L605
  - https://deadeclipse666.blogspot.com/2026/04/public-disclosure-response-for-cve-2026.html
  - https://attack.mitre.org/techniques/T1036/005/
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    RedSun - TieringEngineService.exe Detected as EICAR Test File detected on
    host $agent_name$. Matched data_win_eventdata_sourceName:
    $data_win_eventdata_sourceName$. Matched data_win_eventdata_path:
    $data_win_eventdata_path$. MITRE ATT&CK: T1036.005, T1685, T1055
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_sourceName
      type: other
    - field: data_win_eventdata_path
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.005
    - T1685
    - T1055
  custom_tags:
    - redsun
    - tieringengineservice
    - eicar
    - defender
    - stealth
    - defense_impairment
    - privilege_escalation
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1119" AND data_win_eventdata_sourceName:/[Rr][Ee][Aa][Ll]-[Tt][Ii][Mm][Ee] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]/ AND ((data_win_eventdata_path:/.*\\[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_threatName:/.*[Ee][Ii][Cc][Aa][Rr]_[Tt][Ee][Ss][Tt]_[Ff][Ii][Ll][Ee]/) OR data_win_eventdata_processName:/.*\\[Rr][Ee][Dd][Ss][Uu][Nn]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f2e4b7d9-5c3a-4f8b-9e1d-7a6c2b3f4e5d
    name: RedSun - TieringEngineService.exe Staged in RS-Prefixed Temp Dir
    reason: 'Same-tool precursor from Sysmon: this is the EventID 11 file-create of the very RS-{GUID}\TieringEngineService.exe Cloud Files placeholder that Defender then scanned and failed to remediate. It confirms RedSun staged the EICAR-laden file on this host moments before the 1119 event.'
  - id: 9b4e7c2a-3f6d-4a8b-b5e9-1c7d3f2e6a4b
    name: RedSun - Named Pipe Created
    reason: 'Same-tool co-occurrence: RedSun opens \\.\pipe\REDSUN to receive the attacker''s session id and drive SYSTEM-token duplication during the exact oplock-break window that makes Defender''s remediation fail. Its pipe on this host in-window shows the escalation IPC is live right now.'
  - id: 2ad78473-6978-40f5-b8f1-89c7e1c27a1a
    name: RedSun - Conhost.exe Spawned by TieringEngineService.exe
    reason: 'Same-tool proof of success: once the oplock/junction race wins, the masqueraded TieringEngineService.exe runs as SYSTEM via services.exe and spawns an argument-less conhost.exe then a shell in the attacker''s session. Firing after this rule means the privilege escalation the failed remediation enabled actually completed.'
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: 'Defender-side sibling event: the 1116/1117 ''threat detected / action taken'' entries for the same EICAR hit are the counterpart to this rule''s 1119 ''remediation failed''. Both on one host reconstruct the scan-then-fail sequence that is RedSun''s defining signature.'
  - id: windows-access-token-winlogon-duplicate-handle-001
    name: Windows Access Token Manipulation Winlogon Duplicate Token Handle
    reason: 'The getsystem primitive from the ProcessAccess angle: RedSun duplicates a SYSTEM process''s token (GrantedAccess 0x1040) and re-stamps its session before CreateProcessAsUser. This rule catches that exact winlogon/SYSTEM token-handle duplication, corroborating the user->SYSTEM jump independently of Defender.'
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: 'Expected next move: RedSun exists to beat AV, so once it holds SYSTEM the operator attacks Defender itself. A tamper-protection trigger on the same host shortly after marks the pivot from bypassing AV to dismantling it.'
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Concrete AV-neutralization follow-on: with SYSTEM in hand the operator turns off real-time protection so later payloads go unscanned. On the same host after this alert it shows the defense-impairment objective being carried out.'
  - id: a0a278fe-2c0e-4de2-ac3c-c68b08a9ba98
    name: LSASS Access Detected via Attack Surface Reduction
    reason: 'Post-escalation credential access: after reaching SYSTEM the operator pivots to dumping LSASS, and ASR reports that access in the same Defender operational log this rule reads. On the same host it escalates the local privesc into a credential-theft incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RedSun own artifacts (staging file / RedSun.exe / REDSUN pipe) on this host
    query: ((data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Rr][Ss]-\{.*/ AND data_win_eventdata_targetFilename:/.*\\[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Dd][Ss][Uu][Nn]\.[Ee][Xx][Ee]/) OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/\\[Rr][Ee][Dd][Ss][Uu][Nn]/))
    pivot_on:
    - host
    window: 2h
  - name: TieringEngineService.exe masquerade spawning a console/shell on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_grandParentImage:/.*\\[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: SYSTEM-process token/handle duplication (getsystem) on this host
    query: data_win_system_eventID:"10" AND (data_win_eventdata_targetImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_grantedAccess:/0[Xx]1040/ OR data_win_eventdata_grantedAccess:/0[Xx]1440/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]10[Cc]0/)
    pivot_on:
    - host
    window: 1h
  - name: Defender tamper / real-time-protection disable on this host
    query: ((data_win_system_eventID:"5001" OR data_win_system_eventID:"5004" OR data_win_system_eventID:"5007" OR data_win_system_eventID:"5010" OR data_win_system_eventID:"5012") OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*/)) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_targetObject:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping - LSASS access and dump tooling on this host
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]1440/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff]0[Ff][Ff][Ff]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/)) OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_pipeName:/.*[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/)))
    pivot_on:
    - host
    window: 2h
