name: Win Defender Restored Quarantine File
id: bc92ca75-cd42-4d61-9a37-9d5aa259c88b
version: 1
schema_version: "1.0"
date: "2022-12-06"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bc92ca75-cd42-4d61-9a37-9d5aa259c88b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the restoration of files from the defender quarantine. MITRE ATT&CK:
  T1685.

data_source:
  - Windows Defender Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "1009"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '1009'.

known_false_positives: >
  Legitimate administrator activity restoring a file. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/defender-endpoint/troubleshoot-microsoft-defender-antivirus?view=o365-worldwide
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Win Defender Restored Quarantine File detected on host $agent_name$. MITRE
    ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - restored
    - quarantine
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1009"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: 'Precursor: Defender had to detect and quarantine this file (EID 1006/1116/1117) before it could be restored; this identifies the actual malware that is now back on disk.'
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: 'Co-occurring enabler: an exclusion (EID 5007) for the restored file''s path or process stops Defender re-quarantining it immediately after the restore.'
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Co-occurring enabler: real-time protection turned off (EID 5001) so the restored malware is not re-detected when it lands or executes.'
  - id: 1e8a9b4d-3c2a-4f9b-8d1e-7c6a5b4f3d2e
    name: PowerShell Defender Threat Severity Default Action Set to 'Allow' or 'NoAction'
    reason: 'Co-occurring: Set-MpPreference forcing Defender to take no action on the threat''s severity class, so the restored detection is never automatically re-actioned.'
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: 'Co-occurring: blocked attempts (EID 5013) to flip Defender settings around the restore show the actor fighting tamper protection to keep the file live.'
  - id: bc275be9-0bec-4d77-8c8f-281a2df6710f
    name: Windows Defender Malware And PUA Scanning Disabled
    reason: 'Co-occurring enabler: malware/PUA scanning turned off (EID 5010) so the restored binary is not caught on access after it is put back.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: 'Co-occurring mechanism: Add/Set-MpPreference -Exclusion* at the command line (Sysmon EID 1) names the actor and process tree that excluded the restored file, often the same session that ran the restore.'
  - id: 5a9e1b2c-8f7d-4a1e-9b3c-0f6d7e5a4b1f
    name: Windows Defender Threat Severity Default Action Modified
    reason: 'Co-occurring: registry confirmation (Sysmon EID 13) of the threat default action set to Allow(6)/NoAction(9) - the registry-side twin of the restore-and-ignore tactic.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender restore command & protection-tamper command lines on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Tt][Oo][Rr][Ee]-[Mm][Pp][Tt][Hh][Rr][Ee][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*[Rr][Ee][Ss][Tt][Oo][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Execution of a binary from a user-writable location on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Full Windows Defender detection & configuration timeline on this host
    query: (data_win_system_eventID:"1006" OR data_win_system_eventID:"1007" OR data_win_system_eventID:"1008" OR data_win_system_eventID:"1009" OR data_win_system_eventID:"1015" OR data_win_system_eventID:"1116" OR data_win_system_eventID:"1117" OR data_win_system_eventID:"1118" OR data_win_system_eventID:"1119" OR data_win_system_eventID:"5001" OR data_win_system_eventID:"5004" OR data_win_system_eventID:"5007" OR data_win_system_eventID:"5010" OR data_win_system_eventID:"5012" OR data_win_system_eventID:"5013")
    pivot_on:
    - host
    window: 24h
  - name: Outbound network from script interpreters or user-directory binaries on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
