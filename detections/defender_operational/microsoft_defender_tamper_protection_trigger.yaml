name: Microsoft Defender Tamper Protection Trigger
id: 49e5bc24-8b86-49f1-b743-535f332c2856
version: 1
schema_version: "1.0"
date: "2022-12-06"
author: Bhabesh Raj, Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 49e5bc24-8b86-49f1-b743-535f332c2856
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects blocked attempts to change any of Defender's settings such as "Real
  Time Monitoring" and "Behavior Monitoring". MITRE ATT&CK: T1685.

data_source:
  - Windows Defender Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "5013"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_value:
                    value: "*\\\\Windows Defender\\\\DisableAntiSpyware"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_value:
                    value: "*\\\\Windows Defender\\\\DisableAntiVirus"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_value:
                    value: "*\\\\Windows Defender\\\\Scan\\\\DisableArchiveScanning"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_value:
                    value: "*\\\\Windows Defender\\\\Scan\\\\DisableScanningNetworkFiles"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_value:
                    value: "*\\\\Real-Time Protection\\\\DisableRealtimeMonitoring"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_value:
                    value: "*\\\\Real-Time Protection\\\\DisableBehaviorMonitoring"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_value:
                    value: "*\\\\Real-Time Protection\\\\DisableIOAVProtection"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_value:
                    value: "*\\\\Real-Time Protection\\\\DisableScriptScanning"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_value

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '5013'; data_win_eventdata_value
  matches '*\Windows Defender\DisableAntiSpyware'; data_win_eventdata_value
  matches '*\Windows Defender\DisableAntiVirus', among other conditions.

known_false_positives: >
  Administrator might try to disable defender features during testing (must be
  investigated). Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://bhabeshraj.com/post/tampering-with-microsoft-defenders-tamper-protection
  - https://learn.microsoft.com/en-us/defender-endpoint/troubleshoot-microsoft-defender-antivirus?view=o365-worldwide
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Microsoft Defender Tamper Protection Trigger detected on host $agent_name$.
    Matched data_win_eventdata_value: $data_win_eventdata_value$. MITRE ATT&CK:
    T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_value
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - microsoft
    - defender
    - tamper
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"5013" AND (data_win_eventdata_value:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee]/ OR data_win_eventdata_value:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss]/ OR data_win_eventdata_value:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ss][Cc][Aa][Nn]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Rr][Cc][Hh][Ii][Vv][Ee][Ss][Cc][Aa][Nn][Nn][Ii][Nn][Gg]/ OR data_win_eventdata_value:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ss][Cc][Aa][Nn]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ss][Cc][Aa][Nn][Nn][Ii][Nn][Gg][Nn][Ee][Tt][Ww][Oo][Rr][Kk][Ff][Ii][Ll][Ee][Ss]/ OR data_win_eventdata_value:/.*\\[Rr][Ee][Aa][Ll]-[Tt][Ii][Mm][Ee] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]/ OR data_win_eventdata_value:/.*\\[Rr][Ee][Aa][Ll]-[Tt][Ii][Mm][Ee] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]/ OR data_win_eventdata_value:/.*\\[Rr][Ee][Aa][Ll]-[Tt][Ii][Mm][Ee] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ii][Oo][Aa][Vv][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]/ OR data_win_eventdata_value:/.*\\[Rr][Ee][Aa][Ll]-[Tt][Ii][Mm][Ee] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Ss][Cc][Aa][Nn][Nn][Ii][Nn][Gg]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: reg.exe writing the very same DisableAntiSpyware / DisableAntiVirus / DisableRealtimeMonitoring / DisableBehaviorMonitoring / DisableIOAVProtection / DisableScriptScanning values is the process that generates this 5013 block; correlating the two identifies the exact binary and command line behind a tamper attempt that 5013 alone records without an initiating process.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: 'The direct next move once per-feature disable writes are blocked: set Features\TamperProtection to 0 so that subsequent Defender-disable registry writes stop being rejected. A hit here on the same host means the attacker is attacking the very control that produced this alert.'
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Sysmon EID 13 view of the same disable attempt, and it also catches writes under SOFTWARE\Policies\...\Windows Defender (the GPO path) that Tamper Protection does NOT block - i.e. the attacker's successful alternate route to the disable 5013 just refused.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: 'Classic pivot after a blocked disable: instead of turning Real-Time Protection off, carve out an exclusion path/process so the payload is dropped and run in a location Defender will not scan.'
  - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
    name: Windows Defender Service Disabled - Registry
    reason: Escalation to killing Defender wholesale by setting Services\WinDefend\Start=4 (disabled) when per-feature disables are blocked - a coarser but effective route to the same blind-the-endpoint goal.
  - id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
    name: Disabled Windows Defender Eventlog
    reason: The attacker blinds the telemetry this detection rides on by disabling the Windows Defender Operational channel (behaviour seen with LockBit 3.0); a follow-on here means future 5013 and other Defender events go dark on this host.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: EID 5001 confirming Real-Time Monitoring actually went off. The blocked 5013 attempt explicitly targeted DisableRealtimeMonitoring, so a 5001 on the same host is the smoking gun that a parallel method (GPO, service, or TP-disable) succeeded where this one was blocked.
  - id: a0a278fe-2c0e-4de2-ac3c-c68b08a9ba98
    name: LSASS Access Detected via Attack Surface Reduction
    reason: 'The objective the AV-blinding is clearing the way for: credential theft via LSASS access, here still caught by ASR. Expect it to run before or shortly after the Defender-disable attempt on the same host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender-tamper process on this host (reg.exe / Set-MpPreference / sc WinDefend / MpCmdRun / taskkill MsMpEng)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/) OR data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*/ OR (data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Mm][Ss][Mm][Pp][Ee][Nn][Gg].*/))
    pivot_on:
    - host
    window: 1h
  - name: Defender exclusion being added on this host (disable blocked, so whitelist the payload instead)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Security / Defender event log being cleared or logging disabled on this host (going dark)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ii][Mm][Ii][Tt]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)) OR data_win_system_eventID:"1102"
    pivot_on:
    - host
    window: 4h
  - name: Shadow-copy / backup deletion on this host (ransomware endgame once AV is neutralised)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*[Nn][Oo].*/) OR (data_win_eventdata_image:/.*\\[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*[Cc][Aa][Tt][Aa][Ll][Oo][Gg].*/))
    pivot_on:
    - host
    window: 6h
  - name: Encoded / download-cradle PowerShell execution on this host (the payload the AV-blinding was for)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 1h
