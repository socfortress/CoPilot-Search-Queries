name: Potential COLDSTEEL RAT File Indicators
id: c708a93f-46b4-4674-a5b8-54aa6219c5fa
version: 1
schema_version: "1.0"
date: "2023-04-30"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c708a93f-46b4-4674-a5b8-54aa6219c5fa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file named "dllhost.exe" in the
  "C:\users\public\Documents\" directory. Seen being used by the COLDSTEEL RAT
  in some of its variants.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_targetFilename:
              value: "C:\\users\\public\\Documents\\dllhost.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename equals
  'C:\users\public\Documents\dllhost.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/cold-steel/NCSC-MAR-Cold-Steel.pdf

response:
  message: >
    Potential COLDSTEEL RAT File Indicators detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - coldsteel
    - indicators
    - file_event
    - sysmon
    - persistence
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\[Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1fea93a2-1524-4a3c-9828-3aa0c2414e27
    name: Potential COLDSTEEL Persistence Service DLL Creation
    reason: Same implant drops newdev.dll for service persistence on the same host.
  - id: 1d7a57da-02e0-4f7f-92b1-c7b486ccfed5
    name: Potential COLDSTEEL Persistence Service DLL Load
    reason: Confirms the persistence DLL actually ran.
  - id: e01b6eb5-1eb4-4465-a165-85d40d874add
    name: COLDSTEEL RAT Anonymous User Process Execution
    reason: The fake dllhost.exe in Public\Documents executes as an anonymous-logon user.
  - id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
    name: COLDSTEEL RAT Service Persistence Execution
    reason: Execution of the persistence service tied to the implant.
  - id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
    name: COLDSTEEL RAT Cleanup Command Execution
    reason: Follow-on cleanup of dropped files.
  - id: 95214813-4c7a-4a50-921b-ee5c538e1d16
    name: Potential COLDSTEEL RAT Windows User Creation
    reason: RAT creates a local user for access persistence.
  - id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
    name: Dllhost.EXE Execution Anomaly
    reason: Detects the masquerading dllhost.exe running from a non-System32 path.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: dllhost.exe running outside System32
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Dd]ll[Hh]ost\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/[Cc]:\\[Ww]indows\\[Ss]ystem32\\.*/ AND NOT data_win_eventdata_image:/[Cc]:\\[Ww]indows\\[Ss]ys[Ww][Oo][Ww]64\\.*/
    pivot_on: host
    window: 6h
  - name: Process activity from Public Documents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Uu][Bb][Ll][Ii][Cc]\\[Dd]ocuments\\.*/
    pivot_on: host
    window: 24h
  - name: Network connections from Public folder binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Uu]sers\\[Pp]ublic\\.*/ AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 24h
  - name: Account creation commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*user*\/add* OR *localgroup*administrators*\/add*)
    pivot_on: host
    window: 24h
  - name: Deletion of files after use
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND data_win_eventdata_targetFilename:/.*[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/
    pivot_on: host
    window: 24h
