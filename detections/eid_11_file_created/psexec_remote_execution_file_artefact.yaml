name: PSEXEC Remote Execution File Artefact
id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
version: 1
schema_version: "1.0"
date: "2023-02-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of the PSEXEC key file. Which is created anytime a PsExec
  command is executed. It gets written to the file system and will be recorded
  in the USN Journal on the target system. MITRE ATT&CK: T1136.002, T1543.003,
  T1570.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Windows\\\\PSEXEC-*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.key"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows\PSEXEC-*'; data_win_eventdata_targetFilename matches '*.key'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://aboutdfir.com/the-key-to-identify-psexec/
  - https://twitter.com/davisrichardg/status/1616518800584704028
  - https://attack.mitre.org/techniques/T1136/002/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1570/

response:
  message: >
    PSEXEC Remote Execution File Artefact detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1136.002, T1543.003, T1570
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.002
    - T1543.003
    - T1570
  custom_tags:
    - psexec
    - artefact
    - file_event
    - sysmon
    - lateral_movement
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ss][Ee][Xx][Ee][Cc]-.*/ AND data_win_eventdata_targetFilename:/.*\.[Kk][Ee][Yy]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PSEXESVC service starting is the execution half of the same PsExec session.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Children of the PsExec service as SYSTEM show what the operator did.
  - id: 41504465-5e3a-4a5b-a5b4-2a0baadd4463
    name: PsExec Tool Execution From Suspicious Locations - PipeName
    reason: PsExec named pipes accompany the .key file on the target.
  - id: f6451de4-df0a-41fa-8d72-b39f54a08db5
    name: PUA - PAExec Default Named Pipe
    reason: PAExec is a PsExec clone leaving analogous artefacts.
  - id: d36f87ea-c403-44d2-aa79-1a0ac7c24456
    name: PUA - RemCom Default Named Pipe
    reason: RemCom clone pipe covers PsExec-like alternatives.
  - id: 7eff1a7f-dd45-4c20-877a-f21e342a7611
    name: RemCom Service File Creation
    reason: RemCom service file creation is the same lateral-movement artefact from a clone.
  - id: 51ae86a2-e2e1-4097-ad85-c46cb6851de4
    name: Renamed PsExec Service Execution
    reason: A renamed PSEXESVC indicates evasion of standard PsExec detection.
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: PsExec installs a service on the target; the registry trace corroborates.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PsExec service image on target
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/)
    pivot_on: host
    window: 1h
  - name: Children of the PsExec service
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: PsExec-style named pipes
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Rr][Ee][Mm][Cc][Oo][Mm]|[Cc][Ss][Ee][Xx][Ee][Cc]).*/
    pivot_on: host
    window: 1h
  - name: Executables dropped into Windows root
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[^\\]*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Recon and credential access follow-on
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ll][Ss][Aa][Ss][Ss]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Rr][Ee][Gg] [Ss][Aa][Vv][Ee]).*/
    pivot_on: host
    window: 4h
