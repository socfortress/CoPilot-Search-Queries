name: UAC Bypass Abusing Winsat Path Parsing - File
id: 155dbf56-e0a4-4dd0-8905-8a98705045e8
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 155dbf56-e0a4-4dd0-8905-8a98705045e8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using a path parsing issue in winsat.exe
  (UACMe 52). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Users\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\system32\\\\winsat.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\system32\\\\winmm.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Users\*'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\system32\winsat.exe'; data_win_eventdata_targetFilename
  matches '*\AppData\Local\Temp\system32\winmm.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Abusing Winsat Path Parsing - File detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - abusing
    - winsat
    - file_event
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ss][Aa][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Mm][Mm]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7a01183d-71a2-46ad-ad5c-acd989ac1793
    name: UAC Bypass Abusing Winsat Path Parsing - Process
    reason: Process-side detection of the same UACMe 52 winsat chain; confirms the planted winsat.exe actually ran.
  - id: 6597be7b-ac61-4ac8-bef4-d3ec88174853
    name: UAC Bypass Abusing Winsat Path Parsing - Registry
    reason: Registry-side winsat bypass variant; co-occurring artefact of the same technique.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi implements this method and is the likely source of the planted files.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell from an uncommon parent is the expected outcome of a successful bypass.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: winsat running outside System32
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Ww]insat\.exe/) AND NOT data_win_eventdata_image:(/[Cc]:\\[Ww]indows\\[Ss]ystem32.*/)
    pivot_on: host
    window: 2h
  - name: Files created in a Temp system32 lookalike folder
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Tt]emp\\[Ss]ystem32\\.*/)
    pivot_on: host
    window: 2h
  - name: High-integrity children of winsat
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww]insat\.exe/) AND data_win_eventdata_integrityLevel:High
    pivot_on: host
    window: 2h
  - name: Elevated shells after the bypass
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:(High OR System) AND data_win_eventdata_image:(/.*[\\\/](cmd|powershell|pwsh)\.exe/) AND data_win_eventdata_parentImage:(/.*[Ww]insat.*/)
    pivot_on: host
    window: 2h
