name: LSASS Process Dump Artefact In CrashDumps Folder
id: 6902955a-01b7-432c-b32a-6f5f81d8f625
version: 1
schema_version: "1.0"
date: "2022-12-08"
author: "@pbssubhash"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6902955a-01b7-432c-b32a-6f5f81d8f625
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the presence of an LSASS dump file in the "CrashDumps" folder. This
  could be a sign of LSASS credential dumping. Techniques such as the LSASS
  Shtinkering have been seen abusing the Windows Error Reporting to dump said
  process. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Windows\\\\System32\\\\config\\\\systemprofile\\\\AppData\\\\Local\\\\CrashDumps\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*lsass.exe.*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.dmp"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows\System32\config\systemprofile\AppData\Local\CrashDumps\*';
  data_win_eventdata_targetFilename matches '*lsass.exe.*';
  data_win_eventdata_targetFilename matches '*.dmp'.

known_false_positives: >
  Rare legitimate dump of the process by the operating system due to a crash of
  lsass. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://github.com/deepinstinct/Lsass-Shtinkering
  - https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Process Dump Artefact In CrashDumps Folder detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - artefact
    - crashdumps
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Yy][Ss][Tt][Ee][Mm][Pp][Rr][Oo][Ff][Ii][Ll][Ee]\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Cc][Rr][Aa][Ss][Hh][Dd][Uu][Mm][Pp][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]\..*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
    name: Credential Dumping Attempt Via WerFault
    reason: WerFault opening LSASS is the process-access event that causes the CrashDumps lsass.exe.*.dmp to be written (LSASS Shtinkering).
  - id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
    name: Potential Credential Dumping Via WER
    reason: Command-line view of the same WER-based LSASS dump abuse; confirms how the dump was triggered.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Generic LSASS dump file creation elsewhere on the host; attacker may have produced additional dump copies.
  - id: a18e0862-127b-43ca-be12-1a542c75c7c5
    name: LSASS Process Crashed - Application
    reason: LSASS crash recorded in Application log is a by-product of forced WER dumping and corroborates the artefact.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Suspicious GrantedAccess flags on LSASS precede the dump as the process handle is opened.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Process access to LSASS by a tool shortly before the dump file appears.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Alternative dump tooling (procdump) commonly used by the same actor if the WER route is blocked.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on: dump files compressed with 7zip for exfiltration.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WerFault or WerFaultSecure touching LSASS
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt].*/
    pivot_on: host
    window: 1h
  - name: Any LSASS or crash .dmp file written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ll][Ss][Aa][Ss][Ss]|[Cc][Rr][Aa][Ss][Hh]).*\.[Dd][Mm][Pp]/
    pivot_on: host
    window: 6h
  - name: Process access to LSASS with high-privilege access mask
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x143a")
    pivot_on: host
    window: 2h
  - name: Dump compression or exfil staging after dump
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Dd][Mm][Pp].*/ AND (data_win_eventdata_image:/.*\\(7z|7za|rar|[Ww]inrar|tar|curl)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/)
    pivot_on: host
    window: 6h
  - name: SilentProcessExit or WER LocalDumps registry tampering
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ss]ilent[Pp]rocess[Ee]xit.*/ OR data_win_eventdata_targetObject:/.*Windows Error Reporting.*[Ll]ocal[Dd]umps.*/)
    pivot_on: host
    window: 24h
