name: Goofy Guineapig Backdoor IOC
id: f0bafe60-1240-4798-9e60-4364b97e6bad
version: 1
schema_version: "1.0"
date: "2023-05-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0bafe60-1240-4798-9e60-4364b97e6bad
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects malicious indicators seen used by the Goofy Guineapig malware.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_targetFilename:
                    value: "C:\\ProgramData\\GoogleUpdate\\config.dat"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetFilename:
                    value: "C:\\ProgramData\\GoogleUpdate\\GoogleUpdate.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetFilename:
                    value: "C:\\ProgramData\\GoogleUpdate\\GoogleUpdate\\tmp.bat"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetFilename:
                    value: "C:\\ProgramData\\GoogleUpdate\\goopdate.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename equals
  'C:\ProgramData\GoogleUpdate\config.dat'; data_win_eventdata_targetFilename
  equals 'C:\ProgramData\GoogleUpdate\GoogleUpdate.exe';
  data_win_eventdata_targetFilename equals
  'C:\ProgramData\GoogleUpdate\GoogleUpdate\tmp.bat', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/goofy-guineapig/NCSC-MAR-Goofy-Guineapig.pdf

response:
  message: >
    Goofy Guineapig Backdoor IOC detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - goofy
    - guineapig
    - backdoor
    - file_event
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Cc][Oo][Nn][Ff][Ii][Gg]\.[Dd][Aa][Tt]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Tt][Mm][Pp]\.[Bb][Aa][Tt]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Gg][Oo][Oo][Pp][Dd][Aa][Tt][Ee]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 477a5ed3-a374-4282-9f3b-ed94e159a108
    name: Potential Goofy Guineapig Backdoor Activity
    reason: 'Same malware family: process-creation view of the backdoor running from the C:\ProgramData\GoogleUpdate staging dir that this file-drop IOC just created; confirms the dropped payload executed.'
  - id: bdbab15a-3826-48fa-a1b7-723cd8f32fcc
    name: Potential Goofy Guineapig GoolgeUpdate Process Anomaly
    reason: A fake GoogleUpdate.exe launched from ProgramData instead of the real Google install path is the loader that sideloads the dropped goopdate.dll.
  - id: 8c15dd74-9570-4f48-80b2-29996fd91ee6
    name: Goofy Guineapig Backdoor Service Creation
    reason: Goofy Guineapig persists the dropped GoogleUpdate.exe as a Windows service; this is the direct persistence follow-on to the file drop.
  - id: 84b1ecf9-6eff-4004-bafb-bae5c0e251b2
    name: Potentially Suspicious GoogleUpdate Child Process
    reason: The trojanised GoogleUpdate.exe/goopdate.dll spawns cmd/tmp.bat children for tasking, which this rule catches as anomalous GoogleUpdate children.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Backdoor staged in ProgramData may be given a scheduled task as a secondary persistence mechanism launched from that folder.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: After the implant is dropped and run from ProgramData it beacons to its C2 over HTTP; this surfaces the outbound connection from a non-standard path.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Dropped goopdate.dll is loaded by the sideloaded GoogleUpdate.exe from a non-standard location, matching this DLL-sideloading-from-suspicious-path behaviour.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GoogleUpdate.exe or cmd/bat executing from ProgramData\GoogleUpdate
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/ OR data_win_eventdata_parentImage:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/ OR data_win_eventdata_commandLine:*[Tt][Mm][Pp].[Bb][Aa][Tt]*)
    pivot_on:
    - host
    window: 4h
  - name: goopdate.dll loaded from ProgramData (sideloading)
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Gg][Oo][Oo][Pp][Dd][Aa][Tt][Ee].[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 4h
  - name: Network connections from GoogleUpdate binary in ProgramData (C2 beaconing)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/
    pivot_on:
    - host
    window: 6h
  - name: Service or scheduled task installed pointing at ProgramData\GoogleUpdate
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*[Ss][Cc].[Ee][Xx][Ee]*[Cc][Rr][Ee][Aa][Tt][Ee]* OR data_win_eventdata_commandLine:*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]*[Cc][Rr][Ee][Aa][Tt][Ee]*) AND data_win_eventdata_commandLine:*[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]*) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_details:*[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]*)
    pivot_on:
    - host
    window: 4h
  - name: Other files written under ProgramData\GoogleUpdate (staging, config, payloads)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/
    pivot_on:
    - host
    window: 4h
