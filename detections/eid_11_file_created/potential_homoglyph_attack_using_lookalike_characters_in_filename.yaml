correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 32e280f1-8ad4-46ef-9e80-910657611fbc
    name: Potential Homoglyph Attack Using Lookalike Characters
    reason: 'Process-creation view of lookalike characters: the homoglyph file or command was actually run'
  - id: 979baf41-ca44-4540-9d0c-4fcef3b5a3a4
    name: Potential File Extension Spoofing Using Right-to-Left Override
    reason: RTLO filename spoofing, the sibling Unicode masquerade from the same lure family
  - id: b4926b47-a9d7-434c-b3a0-adc3fa0bd13e
    name: Suspicious Double Extension Files
    reason: Double-extension file creation, a companion disguise for the same dropped lure
  - id: 1cdd9a09-06c9-4769-99ff-626e2b3991b8
    name: Suspicious Double Extension File Execution
    reason: Execution of a double-extension file following the disguised drop
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: 'System DLL names dropped in unexpected locations: homoglyph names often impersonate system files'
  - id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd
    name: Suspicious Process Masquerading As SvcHost.EXE
    reason: Process masquerading as a system binary, the runtime counterpart of a lookalike name
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: Script host executing uncommon script extensions, the typical launch of SocGholish-style lure files
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution where image or command line contains Cyrillic/Greek lookalikes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[АВЕКМНОРСТХаеорсхѕіјԁοΑΒΕΖΗΙΚΜΝΟΡΤΥΧ].*/ OR data_win_eventdata_commandLine:/.*[АВЕКМНОРСТХаеорсхѕіјԁοΑΒΕΖΗΙΚΜΝΟΡΤΥΧ].*/)
    pivot_on:
    - host
    window: 2h
  - name: Script hosts launching script files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/) AND data_win_eventdata_commandLine:/.*\.([Jj][Ss]|[Jj][Ss][Ee]|[Vv][Bb][Ss]|[Vv][Bb][Ee]|[Ww][Ss][Ff]|[Hh][Tt][Aa]).*/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from script hosts and LOLBins
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*(\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: Active Directory and host reconnaissance after execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Aa][Rr][Pp]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence written on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]|[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\).*/
    pivot_on:
    - host
    window: 4h
