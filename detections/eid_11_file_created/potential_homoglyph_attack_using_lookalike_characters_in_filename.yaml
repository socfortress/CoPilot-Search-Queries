name: Potential Homoglyph Attack Using Lookalike Characters in Filename
id: 4f1707b1-b50b-45b4-b5a2-3978b5a5d0d6
version: 1
schema_version: "1.0"
date: "2023-05-08"
author: Micah Babinski, @micahbabinski
source:
