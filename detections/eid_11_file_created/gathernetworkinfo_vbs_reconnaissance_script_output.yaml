name: GatherNetworkInfo.VBS Reconnaissance Script Output
id: f92a6f1e-a512-4a15-9735-da09e78d7273
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f92a6f1e-a512-4a15-9735-da09e78d7273
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of files which are the results of executing the built-in
  reconnaissance script "C:\Windows\System32\gatherNetworkInfo.vbs".

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Windows\\\\System32\\\\config*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Hotfixinfo.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\netiostate.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sysportslog.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\VmSwitchLog.evtx"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows\System32\config*'; data_win_eventdata_targetFilename matches
  '*\Hotfixinfo.txt'; data_win_eventdata_targetFilename matches
  '*\netiostate.txt', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.slayerlabs.com/living-off-the-land/#gathernetworkinfovbs
  - https://www.mandiant.com/resources/blog/trojanized-windows-installers-ukrainian-government

response:
  message: >
    GatherNetworkInfo.VBS Reconnaissance Script Output detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - gathernetworkinfo
    - reconnaissance
    - output
    - file_event
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ff][Ii][Gg].*/ AND (data_win_eventdata_targetFilename:/.*\\[Hh][Oo][Tt][Ff][Ii][Xx][Ii][Nn][Ff][Oo]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Ee][Tt][Ii][Oo][Ss][Tt][Aa][Tt][Ee]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Pp][Oo][Rr][Tt][Ss][Ll][Oo][Gg]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Vv][Mm][Ss][Ww][Ii][Tt][Cc][Hh][Ll][Oo][Gg]\.[Ee][Vv][Tt][Xx]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 575dce0c-8139-4e30-9295-1ee75969f7fe
    name: Potential Reconnaissance Activity Via GatherNetworkInfo.VBS
    reason: 'Direct process-side twin: cscript/wscript launching gatherNetworkInfo.vbs is what writes Hotfixinfo.txt/netiostate.txt/sysportslog.txt into System32\config; same execution seen from EID 1.'
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: gatherNetworkInfo.vbs runs under cscript/wscript; a script host spawning cmd/powershell/rundll32 around the same time shows the script was driven by an operator or dropper rather than an admin.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Trojanized installers and droppers use script hosts to run built-in recon then stage payloads; precursor that explains why the LOLBin script was run.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Same operator typically pairs the all-in-one network/host dump with whoami /all to learn privileges; co-occurring discovery on the same host.
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: Script output covers hotfix/network state; manual WMIC computer-system queries are the companion hand-run host enumeration in the same discovery burst.
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: netiostate.txt/sysportslog.txt capture connection and port state; netstat is the manual equivalent used to find lateral-movement targets.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: After host/network mapping, attackers move to domain and DC discovery with nltest to choose lateral-movement targets.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Recon output files are commonly collected and archived for exfiltration; a follow-on staging step to the gathered data.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script host executing gatherNetworkInfo.vbs or recon-output staging
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc]?[Ww]?[Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Gg][Aa][Tt][Hh][Ee][Rr][Nn][Ee][Tt][Ww][Oo][Rr][Kk][Ii][Nn][Ff][Oo]|[Hh][Oo][Tt][Ff][Ii][Xx][Ii][Nn][Ff][Oo]|[Nn][Ee][Tt][Ii][Oo][Ss][Tt][Aa][Tt][Ee]).*/
    pivot_on:
    - host
    window: 1h
  - name: Script host spawning shells or LOLBins (who launched the recon script)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Uu][Rr][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Follow-on host/domain discovery commands (whoami, nltest, net, netstat, ipconfig, systeminfo)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Nn][Ee][Tt]1?|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Archiving or staging of collected recon output
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Hh][Oo][Tt][Ff][Ii][Xx][Ii][Nn][Ff][Oo]|[Nn][Ee][Tt][Ii][Oo][Ss][Tt][Aa][Tt][Ee]|[Ss][Yy][Ss][Pp][Oo][Rr][Tt][Ss][Ll][Oo][Gg]|[Gg][Aa][Tt][Hh][Ee][Rr][Nn][Ee][Tt][Ww][Oo][Rr][Kk][Ii][Nn][Ff][Oo]).*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz]|[Cc][Aa][Bb])/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|7[Zz]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Rr][Aa][Rr]|[Tt][Aa][Rr])\.?[Ee]?[Xx]?[Ee]?/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network connections from script hosts (exfil or C2 after recon)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Uu][Rr][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
