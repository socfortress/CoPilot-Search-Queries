name: HackTool - Mimikatz Kirbi File Creation
id: 9e099d99-44c2-42b6-a6d8-54c3545cab29
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Florian Roth (Nextron Systems), David ANDRE
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e099d99-44c2-42b6-a6d8-54c3545cab29
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of files created by mimikatz such as ".kirbi",
  "mimilsa.log", etc. MITRE ATT&CK: T1558.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.kirbi"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*mimilsa.log"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*.kirbi'; data_win_eventdata_targetFilename matches '*mimilsa.log'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://cobalt.io/blog/kerberoast-attack-techniques
  - https://pentestlab.blog/2019/10/21/persistence-security-support-provider/
  - https://attack.mitre.org/techniques/T1558/

response:
  message: >
    HackTool - Mimikatz Kirbi File Creation detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1558
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558
  custom_tags:
    - hacktool
    - mimikatz
    - kirbi
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR data_win_eventdata_targetFilename:/.*[Mm][Ii][Mm][Ii][Ll][Ss][Aa]\.[Ll][Oo][Gg]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: A .kirbi file is only written when mimikatz (kerberos::list /export, sekurlsa::tickets /export) actually runs, so the process-creation event for the tool is the direct cause of this file.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Rubeus dump/triage/ptt is the other common way tickets are exported or injected; co-occurs with .kirbi staging on the same host.
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: 'Likely follow-on: exported .kirbi tickets are replayed with kerberos::ptt, the pass-the-ticket step that consumes the file.'
  - id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
    name: Password Dumper Activity on LSASS
    reason: Ticket export requires reading LSASS memory (sekurlsa::tickets), the precursor step that produces the tickets written to disk.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Sysmon process-access on lsass.exe with credential-reading access masks immediately precedes ticket/credential extraction to .kirbi files.
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: Same mimikatz operator on a DC or privileged account often chains DCSync/krbtgt theft to forge golden tickets saved as .kirbi.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Alternate credential-reuse path used alongside stolen tickets for lateral movement from the same compromised host.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: In-memory Invoke-Mimikatz can write the same .kirbi/mimilsa.log artefacts without a mimikatz.exe on disk.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mimikatz/Rubeus Kerberos ticket commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::.*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg].*/ OR data_win_eventdata_commandLine:/.*(asktgt|asktgs|\/ptt|\/ticket:|tgtdeleg|harvest).*/ OR data_win_eventdata_image:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_image:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS memory access preceding ticket export
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1438" OR data_win_eventdata_grantedAccess:"0x143a" OR data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x1f3fff")
    pivot_on:
    - host
    window: 1h
  - name: mimilsa SSP / LSA package persistence registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss].*/ OR data_win_eventdata_details:/.*[Mm][Ii][Mm][Ii][Ll][Ss][Aa].*/)
    pivot_on:
    - host
    window: 24h
  - name: Unexpected DLL or mimilib/mimilsa loaded into LSASS
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*[Mm][Ii][Mm][Ii].*/ OR data_win_eventdata_signed:"false")
    pivot_on:
    - host
    window: 24h
  - name: 'Ticket reuse: NewCredentials logons and RC4 service tickets for this account'
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9") OR (data_win_system_eventID:"4769" AND data_win_eventdata_ticketEncryptionType:"0x17")
    pivot_on:
    - user
    window: 6h
