name: Office Macro File Creation From Suspicious Process
id: b1c50487-1967-4315-a026-6491686d860e
version: 1
schema_version: "1.0"
date: "2023-02-22"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b1c50487-1967-4315-a026-6491686d860e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a office macro file from a a suspicious process. MITRE
  ATT&CK: T1566.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.docm"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dotm"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xlsm"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xltm"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.potm"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.pptm"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\cscript.exe'; data_win_eventdata_image matches '*\mshta.exe';
  data_win_eventdata_image matches '*\regsvr32.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1566.001/T1566.001.md
  - https://learn.microsoft.com/en-us/deployoffice/compat/office-file-format-reference
  - https://attack.mitre.org/techniques/T1566/001/

response:
  message: >
    Office Macro File Creation From Suspicious Process detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    MITRE ATT&CK: T1566.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.001
  custom_tags:
    - office
    - macro
    - file_event
    - sysmon
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Tt][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Tt][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Oo][Tt][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Pp][Tt][Mm]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Precursor: the script-host dropper that builds and writes the macro document is flagged here'
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Precursor: wscript/cscript spawning a suspicious child while generating the macro-enabled file'
  - id: 91239011-fe3c-4b54-9f24-15c86bb65913
    name: Office Macros Warning Disabled
    reason: 'Co-occurring: Office macro warnings disabled so the weaponised document runs without prompt'
  - id: a5c7a43f-6009-4a8c-80c5-32abf1c53ecc
    name: Microsoft Office Protected View Disabled
    reason: 'Co-occurring: macros enabled for a suspicious document by registry trust change'
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: 'Follow-on: Office opening the macro file and spawning cmd/powershell, the macro payload running'
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: 'Follow-on: macro-enabled files dropped into the Office startup folder give persistence'
  - id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
    name: Uncommon File Created In Office Startup Folder
    reason: 'Follow-on: uncommon files written to an Office startup folder to load on each launch'
  - id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    name: File With Uncommon Extension Created By An Office Application
    reason: 'Co-occurring: other uncommon file types written by an Office application on the same host'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office applications spawning shells or script engines (macro executing)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd].[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll].[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt].[Ee][Xx][Ee]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk].[Ee][Xx][Ee]|\\[Mm][Ss][Pp][Uu][Bb].[Ee][Xx][Ee]|\\[Vv][Ii][Ss][Ii][Oo].[Ee][Xx][Ee])/ AND (data_win_eventdata_image:/.*(\\[Cc][Mm][Dd].[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: Macro security weakened (VBA warnings, VBOM access, Protected View)
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Vv][Bb][Aa][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss]|[Aa][Cc][Cc][Ee][Ss][Ss][Vv][Bb][Oo][Mm]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Tt][Tt][Aa][Cc][Hh][Mm][Ee][Nn][Tt][Ss][Ii][Nn][Pp][Vv]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt][Ff][Ii][Ll][Ee][Ss][Ii][Nn][Pp][Vv]|[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Vv][Ii][Ee][Ww]).*/
    pivot_on:
    - host
    window: 4h
  - name: Macro-enabled documents and templates written by any process
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Dd][Oo][Cc][Mm]|[Xx][Ll][Ss][Mm]|[Pp][Pp][Tt][Mm]|[Dd][Oo][Tt][Mm]|[Xx][Ll][Tt][Mm]|[Pp][Oo][Tt][Mm]|[Xx][Ll][Aa][Mm]|[Pp][Pp][Aa][Mm]|[Xx][Ll][Ss][Bb])/
    pivot_on:
    - host
    window: 4h
  - name: Office add-in and startup-folder persistence files
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ww][Oo][Rr][Dd]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]|[Ee][Xx][Cc][Ee][Ll]\\[Xx][Ll][Ss][Tt][Aa][Rr][Tt]|[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Aa][Dd][Dd][Ii][Nn][Ss]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss]\\[Nn][Oo][Rr][Mm][Aa][Ll]).*/
    pivot_on:
    - host
    window: 4h
  - name: Payload download by LOLBins after the document is staged
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll].[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee])/) AND data_win_eventdata_commandLine:/.*([Hh][Tt][Tt][Pp]://|[Hh][Tt][Tt][Pp][Ss]://|-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]).*/
    pivot_on:
    - host
    window: 2h
