name: Diamond Sleet APT File Creation Indicators
id: e1212b32-55ff-4dfb-a595-62b572248056
version: 1
schema_version: "1.0"
date: "2023-10-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e1212b32-55ff-4dfb-a595-62b572248056
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file creation activity that is related to Diamond Sleet APT activity.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\ProgramData\\\\4800-84DC-063A6A41C5C"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\ProgramData\\\\clip.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\ProgramData\\\\DSROLE.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\ProgramData\\\\Forest64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\ProgramData\\\\readme.md"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\ProgramData\\\\Version.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\ProgramData\\\\wsmprovhost.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*:\ProgramData\4800-84DC-063A6A41C5C'; data_win_eventdata_targetFilename
  matches '*:\ProgramData\clip.exe'; data_win_eventdata_targetFilename matches
  '*:\ProgramData\DSROLE.dll', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/10/18/multiple-north-korean-threat-actors-exploiting-the-teamcity-cve-2023-42793-vulnerability/

response:
  message: >
    Diamond Sleet APT File Creation Indicators detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - diamond
    - sleet
    - indicators
    - file_event
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\4800-84[Dd][Cc]-063[Aa]6[Aa]41[Cc]5[Cc]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Cc][Ll][Ii][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Dd][Ss][Rr][Oo][Ll][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ff][Oo][Rr][Ee][Ss][Tt]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Rr][Ee][Aa][Dd][Mm][Ee]\.[Mm][Dd]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Vv][Ee][Rr][Ss][Ii][Oo][Nn]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d1b65d98-37d7-4ff6-b139-2d87c1af3042
    name: Diamond Sleet APT DLL Sideloading Indicators
    reason: The dropped DSROLE.dll / Version.dll in ProgramData are the proxy DLLs sideloaded by the staged EXEs (clip.exe, wsmprovhost.exe); this is the direct execution step after the file drop.
  - id: b5495d8d-24ad-4a44-8caf-ceae9a07a5c2
    name: Diamond Sleet APT Process Activity Indicators
    reason: Same campaign's process-side IOC (ForestTiger/loader command-line argument); confirms the dropped payloads were actually launched.
  - id: fba38e0f-4607-4344-bb8f-a4b50cdeef7f
    name: Diamond Sleet APT DNS Communication Indicators
    reason: Once the loader runs from ProgramData it beacons to Diamond Sleet C2 domains; DNS from the same host confirms live implant.
  - id: 9f9f92ba-5300-43a4-b435-87d1ee571688
    name: Diamond Sleet APT Scheduled Task Creation - Registry
    reason: Diamond Sleet persists the dropped payloads via scheduled tasks; registry TaskCache writes on this host follow the file drop.
  - id: 3b8e5084-4de9-449a-a40d-0e11014f2e2d
    name: Diamond Sleet APT Scheduled Task Creation
    reason: Security 4698 task creation pointing at the ProgramData payloads is the persistence stage of the same intrusion chain.
  - id: 24007168-a26b-4049-90d0-ce138e13a5cf
    name: Lazarus APT DLL Sideloading Activity
    reason: Diamond Sleet is a Lazarus-cluster actor reusing the same sideload-into-legitimate-binary tradecraft; a hit here corroborates the sideloaded DLL stage.
  - id: 24c4d154-05a4-4b99-b57d-9b977472443a
    name: Lazarus Group Activity
    reason: Overlapping North Korean tooling and command patterns (post-exploitation commands run after initial TeamCity compromise).
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Persistence of ProgramData-dropped binaries via schtasks referencing C:\ProgramData is the expected next step after these file drops.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution or sideload of the dropped ProgramData payloads (clip.exe, Forest64, wsmprovhost, DSROLE/Version.dll)
    query: (data_win_system_eventID:"1" OR data_win_system_eventID:"7") AND (data_win_eventdata_image:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\(DSROLE|Version)\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 1h
  - name: Scheduled task or service persistence referencing ProgramData
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Ss][Cc]\.[Ee][Xx][Ee]).*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(TaskCache|CurrentVersion\\Run|Services\\).*/ AND data_win_eventdata_details:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/)
    pivot_on:
    - host
    window: 4h
  - name: Credential dumping and hands-on discovery after TeamCity-style compromise
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ll][Ss][Aa][Ss][Ss]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm])|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ww][Hh][Oo][Aa][Mm][Ii]).*/ OR data_win_eventdata_parentImage:/.*([Jj][Aa][Vv][Aa]|[Tt][Ee][Aa][Mm][Cc][Ii][Tt][Yy]).*/)
    pivot_on:
    - host
    window: 4h
  - name: DNS lookups and outbound connections by processes running from ProgramData
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3") AND data_win_eventdata_image:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Other executable or DLL drops into ProgramData by the same writer
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[^\\]*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1)/
    pivot_on:
    - host
    window: 2h
