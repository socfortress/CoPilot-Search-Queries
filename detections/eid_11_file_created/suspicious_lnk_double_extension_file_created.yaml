name: Suspicious LNK Double Extension File Created
id: 3215aa19-f060-4332-86d5-5602511f3ca8
version: 1
schema_version: "1.0"
date: "2023-10-18"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3215aa19-f060-4332-86d5-5602511f3ca8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of files with an "LNK" as a second extension. This is
  sometimes used by malware as a method to abuse the fact that Windows hides the
  "LNK" extension by default. MITRE ATT&CK: T1036.007.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.lnk"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.doc.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.docx.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.jpg.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.pdf.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ppt.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.pptx.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xls.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xlsx.*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Recent\\\\*"
                    case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\excel.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\powerpnt.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\winword.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Office\\\\Recent\\\\*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\excel.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Excel*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powerpnt.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Roaming\\\\Microsoft\\\\PowerPoint*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\winword.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Word*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*.lnk'; data_win_eventdata_targetFilename matches '*.doc.*';
  data_win_eventdata_targetFilename matches '*.docx.*', among other conditions.

known_false_positives: >
  Some tuning is required for other general purpose directories of third party
  apps. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://www.crowdstrike.com/blog/meet-crowdstrikes-adversary-of-the-month-for-june-mustang-panda/
  - https://www.anomali.com/blog/china-based-apt-mustang-panda-targets-minority-groups-public-and-private-sector-organizations
  - https://www.cybereason.com/blog/research/a-bazar-of-tricks-following-team9s-development-cycles
  - https://twitter.com/malwrhunterteam/status/1235135745611960321
  - https://twitter.com/luc4m/status/1073181154126254080
  - https://attack.mitre.org/techniques/T1036/007/

response:
  message: >
    Suspicious LNK Double Extension File Created detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1036.007
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.007
  custom_tags:
    - double
    - extension
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ll][Nn][Kk]/ AND (data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc]\..*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Xx]\..*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Pp][Gg]\..*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Dd][Ff]\..*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Pp][Tt]\..*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Pp][Tt][Xx]\..*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss]\..*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss][Xx]\..*/) AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Rr][Ee][Cc][Ee][Nn][Tt]\\.*/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetFilename AND NOT (((data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\[Rr][Ee][Cc][Ee][Nn][Tt]\\.*/) OR (data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Xx][Cc][Ee][Ll].*/) OR (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Pp][Oo][Ww][Ee][Rr][Pp][Oo][Ii][Nn][Tt].*/) OR (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Oo][Rr][Dd].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b4926b47-a9d7-434c-b3a0-adc3fa0bd13e
    name: Suspicious Double Extension Files
    reason: 'Same masquerade family: other double-extension files dropped on the host'
  - id: 1cdd9a09-06c9-4769-99ff-626e2b3991b8
    name: Suspicious Double Extension File Execution
    reason: 'Next step: the user double-clicks the fake document and the double-extension file executes'
  - id: 5e6a80c8-2d45-4633-9ef4-fa2671a39c5c
    name: Suspicious Parent Double Extension File Execution
    reason: Process launched by a double-extension parent shows what the shortcut ran
  - id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
    name: Hidden Powershell in Link File Pattern
    reason: Malicious LNKs usually launch a hidden PowerShell payload
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: Emotet-style LNK delivery chain that executes via the shortcut
  - id: windows-process-creating-lnk-suspicious-location-001
    name: Windows Process Creating LNK File in Suspicious Location
    reason: LNK written into suspicious locations by a process corroborates the dropper
  - id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
    name: ISO File Created Within Temp Folders
    reason: ISO or container in temp is a common delivery wrapper for these shortcuts
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: LNK pointing at a WebDAV path fetches the next stage remotely
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process launched from a double-extension shortcut
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\.(doc|docx|xls|xlsx|pdf|jpg|jpeg|png|txt)\.[Ll][Nn][Kk].*/
    pivot_on: host
    window: 2h
  - name: Script interpreters or LOLBins started by explorer
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee]xplorer\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Cc]md|[Mm]shta|[Ww]script|[Cc]script|[Rr]undll32|[Rr]egsvr32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Archive or disk-image delivery files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ii][Ss][Oo]|[Ii][Mm][Gg]|[Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz]|[Vv][Hh][Dd][Xx]?)/
    pivot_on: host
    window: 4h
  - name: Payloads dropped into user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Jj][Ss]|[Vv][Bb][Ss]|[Hh][Tt][Aa]|[Pp][Ss]1)/ AND data_win_eventdata_targetFilename:/.*\\([Aa]pp[Dd]ata|[Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata)\\.*/
    pivot_on: host
    window: 2h
  - name: Download commands via LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm]shta|[Cc]url|[Cc]ertutil|[Bb]itsadmin|[Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ss]tring).*[Hh][Tt][Tt][Pp][Ss]?:.*/
    pivot_on: host
    window: 2h
