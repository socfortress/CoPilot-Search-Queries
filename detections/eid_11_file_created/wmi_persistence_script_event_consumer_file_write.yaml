name: WMI Persistence - Script Event Consumer File Write
id: 33f41cdd-35ac-4ba8-814b-c6a4244a1ad4
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 33f41cdd-35ac-4ba8-814b-c6a4244a1ad4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file writes of WMI script event consumer. MITRE ATT&CK: T1546.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\WINDOWS\\system32\\wbem\\scrcons.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals
  'C:\WINDOWS\system32\wbem\scrcons.exe'.

known_false_positives: >
  Dell Power Manager (C:\Program Files\Dell\PowerManager\DpmPowerPlanSetup.exe).
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    WMI Persistence - Script Event Consumer File Write detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1546.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - persistence
    - consumer
    - write
    - file_event
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
    name: WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load
    reason: scrcons.exe loading scripting DLLs is the execution of the ActiveScriptEventConsumer whose file write fired here.
  - id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
    name: Suspicious Scripting in a WMI Consumer
    reason: The consumer's embedded script (WMI event 20) usually reveals the payload behind the scrcons file write.
  - id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
    name: Suspicious Encoded Scripts in a WMI Consumer
    reason: 'Encoded scripts in a WMI consumer: the obfuscated variant of the same persistence mechanism.'
  - id: 0f06a3a5-6a09-413f-8743-e6cf35561297
    name: WMI Event Subscription
    reason: The filter/consumer/binding registration (EID 19-21) is the persistence installation that precedes scrcons activity.
  - id: windows-wmi-permanent-event-subscription-001
    name: Windows WMI Permanent Event Subscription
    reason: Permanent subscription creation is the setup step; scrcons writing files is the subscription triggering.
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: wmic creating an ActiveScriptEventConsumer is a common installation command for this persistence.
  - id: 1dd05363-104e-4b4a-b963-196a534b03a1
    name: Potential Suspicious Mofcomp Execution
    reason: mofcomp compiling a MOF is the other classic way the consumer is installed.
  - id: 493fb4ab-cdcc-4c4f-818c-0e363bd1e4bb
    name: WMI Event Consumer Created Named Pipe
    reason: Consumer processes opening unusual named pipes indicate the script doing IPC or C2.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI filter/consumer/binding activity
    query: data_win_system_eventID:("19" OR "20" OR "21")
    pivot_on: host
    window: 24h
  - name: Processes spawned by scrcons or wmiprvse
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss].[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee].[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Consumer installation commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Oo][Ff][Cc][Oo][Mm][Pp].[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Aa][Cc][Tt][Ii][Vv][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr]|[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr]|__[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr]|[Ff][Ii][Ll][Tt][Ee][Rr][Tt][Oo][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr][Bb][Ii][Nn][Dd][Ii][Nn][Gg]).*/)
    pivot_on: host
    window: 24h
  - name: scrcons network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss].[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: MOF or script files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Mm][Oo][Ff]|[Vv][Bb][Ss]|[Jj][Ss]|[Pp][Ss]1)/
    pivot_on: host
    window: 4h
