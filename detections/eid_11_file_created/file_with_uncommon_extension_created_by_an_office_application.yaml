name: File With Uncommon Extension Created By An Office Application
id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Vadim Khrykov (ThreatIntel), Cyb3rEng (Rule), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of files with an executable or script extension by an
  Office application. MITRE ATT&CK: T1204.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\excel.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msaccess.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mspub.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powerpnt.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\visio.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winword.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bat"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.cmd"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.hta"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ocx"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.proj"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ps1"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.scf"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.scr"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.sys"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbs"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.wsf"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.wsh"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\AppData\\\\Local\\\\assembly\\\\tmp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.dll"
                          case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetFilename"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\Office\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\WebServiceCache\\\\AllUsers*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.com"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\winword.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\webexdelta\\\\*"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.dll"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\Office\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\BackstageInAppNavCache\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.com"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\excel.exe'; data_win_eventdata_image matches '*\msaccess.exe';
  data_win_eventdata_image matches '*\mspub.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
  - https://github.com/vadim-hunter/Detection-Ideas-Rules/blob/02bcbfc2bfb8b4da601bb30de0344ae453aa1afe/Threat%20Intelligence/The%20DFIR%20Report/20210329_Sodinokibi_(aka_REvil)_Ransomware.yaml
  - https://attack.mitre.org/techniques/T1204/002/

response:
  message: >
    File With Uncommon Extension Created By An Office Application detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1204.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.002
  custom_tags:
    - uncommon
    - extension
    - office
    - file_event
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Ss][Ii][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Oo][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa]/ OR data_win_eventdata_targetFilename:/.*\.[Oo][Cc][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Rr][Oo][Jj]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Ff]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ss][Ff]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ss][Hh]/) AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\\[Tt][Mm][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_targetFilename AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_targetFilename:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Ww][Ee][Bb][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Cc][Aa][Cc][Hh][Ee]\\[Aa][Ll][Ll][Uu][Ss][Ee][Rr][Ss].*/ AND data_win_eventdata_targetFilename:/.*\.[Cc][Oo][Mm]/) OR (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ww][Ee][Bb][Ee][Xx][Dd][Ee][Ll][Tt][Aa]\\.*/ AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/)) OR (data_win_eventdata_targetFilename:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Bb][Aa][Cc][Kk][Ss][Tt][Aa][Gg][Ee][Ii][Nn][Aa][Pp][Pp][Nn][Aa][Vv][Cc][Aa][Cc][Hh][Ee]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Cc][Oo][Mm]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Office dropping an executable/script is usually followed (or preceded) by the same Office process spawning cmd/powershell/wscript to run the dropped payload.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: 'Direct follow-on: the EXE just written to a user-writable path is launched by the Office process, confirming macro/exploit dropper execution.'
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Office downloading a remote file is a common way the dropped DLL/EXE/script arrives before this file-create fires.
  - id: e1693bc8-7168-4eab-8718-cdcaa68a1738
    name: Suspicious WMIC Execution Via Office Process
    reason: Macro droppers often run the written payload through WMIC from the Office process, an alternative execution path.
  - id: 3b5ba899-9842-4bc2-acc2-12308498bf42
    name: Office Application Initiated Network Connection Over Uncommon Ports
    reason: The same Office process staging a payload may fetch it or beacon to the attacker over a non-standard port.
  - id: d13c43f0-f66b-4279-8b2c-5912077c1780
    name: CLR DLL Loaded Via Office Applications
    reason: A dropped .NET DLL/assembly executed in-process by Office (loading the CLR) is the in-memory execution path for a dropped DLL.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Next step after dropping a payload from a document is persistence via a Run key pointing at the dropped file in a user-writable folder.
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: Office-originated file writes into Office startup folders give persistence through the same application the attacker already controls.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office process spawning script/LOLBin children (payload execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([wW][iI][nN][wW][oO][rR][dD]\.[eE][xX][eE]|[eE][xX][cC][eE][lL]\.[eE][xX][eE]|[pP][oO][wW][eE][rR][pP][nN][tT]\.[eE][xX][eE]|[mM][sS][aA][cC][cC][eE][sS][sS]\.[eE][xX][eE]|[mM][sS][pP][uU][bB]\.[eE][xX][eE]|[vV][iI][sS][iI][oO]\.[eE][xX][eE])/ AND data_win_eventdata_image:/.*\\([cC][mM][dD]\.[eE][xX][eE]|[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[eE][xX][eE]|[pP][wW][sS][hH]\.[eE][xX][eE]|[wW][sS][cC][rR][iI][pP][tT]\.[eE][xX][eE]|[cC][sS][cC][rR][iI][pP][tT]\.[eE][xX][eE]|[mM][sS][hH][tT][aA]\.[eE][xX][eE]|[rR][uU][nN][dD][lL][lL]32\.[eE][xX][eE]|[rR][eE][gG][sS][vV][rR]32\.[eE][xX][eE]|[wW][mM][iI][cC]\.[eE][xX][eE]|[cC][eE][rR][tT][uU][tT][iI][lL]\.[eE][xX][eE]|[bB][iI][tT][sS][aA][dD][mM][iI][nN]\.[eE][xX][eE]|[mM][sS][iI][eE][xX][eE][cC]\.[eE][xX][eE])/
    pivot_on:
    - host
    window: 1h
  - name: Execution of dropped binary from user-writable path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([uU][sS][eE][rR][sS]|[pP][rR][oO][gG][rR][aA][mM][dD][aA][tT][aA]|[wW][iI][nN][dD][oO][wW][sS]\\[tT][eE][mM][pP])\\.*\.([eE][xX][eE]|[sS][cC][rR]|[cC][oO][mM])/ OR data_win_eventdata_commandLine:/.*\\([uU][sS][eE][rR][sS]|[pP][rR][oO][gG][rR][aA][mM][dD][aA][tT][aA]|[wW][iI][nN][dD][oO][wW][sS]\\[tT][eE][mM][pP])\\.*\.([pP][sS]1|[vV][bB][sS]|[vV][bB][eE]|[wW][sS][fF]|[hH][tT][aA]|[bB][aA][tT]|[cC][mM][dD]|[dD][lL][lL]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections from Office or freshly dropped payload
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\\([wW][iI][nN][wW][oO][rR][dD]\.[eE][xX][eE]|[eE][xX][cC][eE][lL]\.[eE][xX][eE]|[pP][oO][wW][eE][rR][pP][nN][tT]\.[eE][xX][eE]|[mM][sS][aA][cC][cC][eE][sS][sS]\.[eE][xX][eE]|[mM][sS][pP][uU][bB]\.[eE][xX][eE]|[vV][iI][sS][iI][oO]\.[eE][xX][eE])/ OR data_win_eventdata_image:/.*\\([uU][sS][eE][rR][sS]|[pP][rR][oO][gG][rR][aA][mM][dD][aA][tT][aA]|[wW][iI][nN][dD][oO][wW][sS]\\[tT][eE][mM][pP])\\.*\.[eE][xX][eE]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Persistence: Run keys, startup folder or Office add-in files written after drop'
    query: ((data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[cC][uU][rR][rR][eE][nN][tT][vV][eE][rR][sS][iI][oO][nN]\\([rR][uU][nN]|[rR][uU][nN][oO][nN][cC][eE]).*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([sS][tT][aA][rR][tT] [mM][eE][nN][uU]\\[pP][rR][oO][gG][rR][aA][mM][sS]\\[sS][tT][aA][rR][tT][uU][pP]|[mM][iI][cC][rR][oO][sS][oO][fF][tT]\\[wW][oO][rR][dD]\\[sS][tT][aA][rR][tT][uU][pP]|[mM][iI][cC][rR][oO][sS][oO][fF][tT]\\[eE][xX][cC][eE][lL]\\[xX][lL][sS][tT][aA][rR][tT]|[mM][iI][cC][rR][oO][sS][oO][fF][tT]\\[aA][dD][dD][iI][nN][sS]).*/))
    pivot_on:
    - host
    window: 4h
  - name: DNS lookups by Office or dropped payload processes
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\([wW][iI][nN][wW][oO][rR][dD]\.[eE][xX][eE]|[eE][xX][cC][eE][lL]\.[eE][xX][eE]|[pP][oO][wW][eE][rR][pP][nN][tT]\.[eE][xX][eE]|[mM][sS][aA][cC][cC][eE][sS][sS]\.[eE][xX][eE]|[mM][sS][pP][uU][bB]\.[eE][xX][eE]|[vV][iI][sS][iI][oO]\.[eE][xX][eE])/ OR data_win_eventdata_image:/.*\\([uU][sS][eE][rR][sS]|[pP][rR][oO][gG][rR][aA][mM][dD][aA][tT][aA]|[wW][iI][nN][dD][oO][wW][sS]\\[tT][eE][mM][pP])\\.*\.[eE][xX][eE]/)
    pivot_on:
    - host
    window: 2h
