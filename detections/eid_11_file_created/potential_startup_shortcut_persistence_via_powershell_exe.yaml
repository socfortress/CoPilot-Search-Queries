name: Potential Startup Shortcut Persistence Via PowerShell.EXE
id: 92fa78e7-4d39-45f1-91a3-8b23f3f1088d
version: 1
schema_version: "1.0"
date: "2023-02-23"
author: Christopher Peacock '@securepeacock', SCYTHE
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 92fa78e7-4d39-45f1-91a3-8b23f3f1088d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell writing startup shortcuts. This procedure was highlighted
  in Red Canary Intel Insights Oct. 2021, "We frequently observe adversaries
  using PowerShell to write malicious .lnk files into the startup directory to
  establish persistence. Accordingly, this detection opportunity is likely to
  identify persistence mechanisms in multiple threats. In the context of Yellow
  Cockatoo, this persistence mechanism eventually launches the command-line
  script that leads to the installation of a malicious DLL". MITRE ATT&CK:
  T1547.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\start menu\\\\programs\\\\startup\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.lnk"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_targetFilename matches '*\start menu\programs\startup\*',
  among other conditions.

known_false_positives: >
  Depending on your environment accepted applications may leverage this at
  times. It is recommended to search for anomalies inidicative of malware.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://redcanary.com/blog/intelligence-insights-october-2021/
  - https://github.com/redcanaryco/atomic-red-team/blob/36d49de4c8b00bf36054294b4a1fcbab3917d7c5/atomics/T1547.001/T1547.001.md#atomic-test-7---add-executable-shortcut-link-to-user-startup-folder
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    Potential Startup Shortcut Persistence Via PowerShell.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1547.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - startup
    - shortcut
    - persistence
    - file_event
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Ll][Nn][Kk]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: 'Generic startup folder write: same persistence location written by other processes.'
  - id: 28208707-fe31-437f-9a7f-4b1108b94d2e
    name: Suspicious Startup Folder Persistence
    reason: Suspicious startup folder persistence by uncommon writers; corroborates the LNK drop.
  - id: 9c226817-8dc9-46c2-a58d-66655aafd7dc
    name: Modify User Shell Folders Startup Value
    reason: Redirecting the Startup shell folder is an alternative persistence step by the same actor.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Run key persistence via reg.exe: attackers often plant several mechanisms.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Direct autorun key modification co-occurs with startup persistence.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Dropper script execution that commonly precedes PowerShell writing the shortcut.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell creating shortcuts via WScript.Shell
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Cc]reate[Ss]hortcut.*/ OR data_win_eventdata_commandLine:/.*[Ww][Ss]cript\.[Ss]hell.*/ OR data_win_eventdata_commandLine:/.*[Ss]tartup.*/)
    pivot_on: host
    window: 2h
  - name: Other file writes into Startup folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss]tart [Mm]enu\\[Pp]rograms\\[Ss]tartup\\.*/
    pivot_on: host
    window: 24h
  - name: Processes launched from the Startup folder
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss]tart [Mm]enu\\[Pp]rograms\\[Ss]tartup.*/
    pivot_on: host
    window: 24h
  - name: Run key registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc]urrent[Vv]ersion\\[Rr]un.*/
    pivot_on: host
    window: 4h
  - name: PowerShell download cradles fetching the persisted payload
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Nn]et\.[Ww]eb[Cc]lient.*/)
    pivot_on: host
    window: 4h
