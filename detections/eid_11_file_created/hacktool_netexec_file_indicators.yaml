name: HackTool - NetExec File Indicators
id: efc21479-9e83-41da-8cf1-122e06ba8db3
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: efc21479-9e83-41da-8cf1-122e06ba8db3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file creation events indicating NetExec (nxc.exe) execution on the
  local machine. NetExec is a PyInstaller-bundled binary that extracts its
  embedded data files to a "_MEI<random>" directory under the Temp folder upon
  execution. Files dropped under the "\nxc\" sub-directory of that extraction
  path are unique to NetExec and serve as reliable on-disk indicators of
  execution. NetExec (formerly CrackMapExec) is a widely used post-exploitation
  and lateral movement tool used for Active Directory enumeration, credential
  harvesting, and remote code execution. MITRE ATT&CK: T1021.002, T1059.005.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\nxc-windows-latest\\\\*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\Temp\\\\_MEI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\nxc\\\\data\\\\*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\nxc-windows-latest\*'; data_win_eventdata_targetFilename matches
  '*\Temp\_MEI*'; data_win_eventdata_targetFilename matches '*\nxc\data\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Pennyw0rth/NetExec
  - https://www.netexec.wiki/
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1059/005/

response:
  message: >
    HackTool - NetExec File Indicators detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1021.002, T1059.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1059.005
  custom_tags:
    - hacktool
    - netexec
    - indicators
    - file_event
    - sysmon
    - execution
    - lateral_movement
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Nn][Xx][Cc]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ll][Aa][Tt][Ee][Ss][Tt]\\.*/ OR (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\_[Mm][Ee][Ii].*/ AND data_win_eventdata_targetFilename:/.*\\[Nn][Xx][Cc]\\[Dd][Aa][Tt][Aa]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7638e5fe-600c-4289-a968-f49dd537ec7d
    name: HackTool - NetExec Execution
    reason: Process-creation view of the same nxc.exe run whose PyInstaller _MEI/nxc/data extraction triggered this file alert; confirms commandline, modules and target.
  - id: 736ffa74-5f6f-44ca-94ef-1c0df4f51d2a
    name: HackTool - CrackMapExec File Indicators
    reason: NetExec is the CrackMapExec successor; older builds or renamed forks drop the same PyInstaller artefacts under a cme path, indicating the same operator toolkit.
  - id: 03f4ca17-de95-428d-a75a-4ee78b047256
    name: HackTool - Impacket File Indicators
    reason: NetExec bundles Impacket; operators commonly run Impacket scripts alongside nxc on the same pivot host for lateral movement.
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: nxc --sam/--lsa/--ntds drops dump output files on targets; a direct follow-on credential harvesting step after nxc is run.
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: nxc smb exec methods and Impacket psexec create a service executable on the remote host, the target-side artefact of lateral movement.
  - id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
    name: Wmiexec Default Output File
    reason: nxc wmiexec/Impacket wmiexec writes command output files under ADMIN$; a target-side execution-method footprint.
  - id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
    name: Writing Local Admin Share
    reason: nxc authenticates to ADMIN$/C$ shares and writes payloads there when executing remotely, so file writes to admin shares follow the tool run.
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: nxc --sam saves SAM/SYSTEM hives to disk for offline extraction, a typical credential-harvesting follow-on.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NetExec process execution and CLI flags
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Xx][Cc].*/ OR data_win_eventdata_commandLine:/.*[Nn][Xx][Cc](\.[Ee][Xx][Ee])? +(smb|winrm|ldap|mssql|rdp|ssh|wmi|ftp|vnc).*/ OR data_win_eventdata_commandLine:/.*(--local-auth|--sam|--lsa|--ntds|--shares|--pass-pol|--rid-brute).*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound SMB/WinRM/RPC/LDAP/RDP fan-out from this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636")
    pivot_on:
    - host
    window: 2h
  - name: Credential dump artefacts written to disk (SAM/SYSTEM/NTDS/LSASS)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Cc][Aa][Cc][Hh][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Hacktool staging: Impacket/Mimikatz/archive files dropped'
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\([Ii]mpacket|[Ss]ecretsdump|[Mm]imikatz|[Ss]haphound|[Bb]lood[Hh]ound|[Rr]ubeus|[Ll]aZagne)[^\\]*/ OR data_win_eventdata_targetFilename:/.*_[Bb]lood[Hh]ound\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Xx][Cc][^\\]*\.([Ee][Xx][Ee]|[Zz][Ii][Pp])/)
    pivot_on:
    - host
    window: 4h
  - name: Remote execution tooling and PowerShell remoting on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ee]nter|[Nn]ew)-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Cc]ommand.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_commandLine:/.*[Nn]et +use +\\\\.*/)
    pivot_on:
    - host
    window: 2h
