name: Malicious DLL File Dropped in the Teams or OneDrive Folder
id: 1908fcc1-1b92-4272-8214-0fbaf2fa5163
version: 1
schema_version: "1.0"
date: "2022-08-12"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1908fcc1-1b92-4272-8214-0fbaf2fa5163
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a malicious DLL file in the location where the OneDrive or
  Team applications Upon execution of the Teams or OneDrive application, the
  dropped malicious DLL file ("iphlpapi.dll") is sideloaded. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*iphlpapi.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Microsoft*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*iphlpapi.dll*'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Microsoft*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.cyble.com/2022/07/27/targeted-attacks-being-carried-out-via-dll-sideloading/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Malicious DLL File Dropped in the Teams or OneDrive Folder detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - dropped
    - teams
    - onedrive
    - file_event
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ii][Pp][Hh][Ll][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    name: File With Uncommon Extension Created By An Office Application
    reason: If the dropper was an Office app, uncommon file types it created show the delivery stage.
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'Same family: DLL search-order hijack drop in a user-writable app folder.'
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: System DLL names such as iphlpapi.dll created in unexpected locations on the same host.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Next step: the dropped abusable DLL is loaded by the app from a suspicious location.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: 'Next step: DLL load by a signed process from a suspicious path, confirming sideload execution.'
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: Creation of non-existent system DLL, another sideload staging pattern.
  - id: 7047d730-036f-4f40-b9d8-1c63e36d5e62
    name: Potential Binary Or Script Dropper Via PowerShell
    reason: 'Dropper context: scripts or binaries dropped via PowerShell that may have placed this DLL.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: iphlpapi.dll loaded from user profile
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*[Ii][Pp][Hh][Ll][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 2h
  - name: Teams or OneDrive process starts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt]eams\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo]ne[Dd]rive.*\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Shells or LOLBins spawned by Teams or OneDrive
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Tt]eams\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Oo]ne[Dd]rive.*\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|rundll32|regsvr32|mshta|wscript|cscript)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: DLLs written to AppData Local by non-installer
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa]pp[Dd]ata\\[Ll]ocal\\.*\.[Dd][Ll][Ll]/ AND NOT data_win_eventdata_image:/.*\\(msiexec|[Ss]etup|[Uu]pdate|[Tt]eams|[Oo]ne[Dd]rive).*/
    pivot_on: host
    window: 6h
  - name: Run-key persistence pointing into AppData
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\CurrentVersion\\Run.*/ AND data_win_eventdata_details:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/
    pivot_on: host
    window: 24h
