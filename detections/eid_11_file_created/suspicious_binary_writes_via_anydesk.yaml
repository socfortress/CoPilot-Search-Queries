name: Suspicious Binary Writes Via AnyDesk
id: 2d367498-5112-4ae5-a06a-96e7bc33a211
version: 1
schema_version: "1.0"
date: "2025-02-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2d367498-5112-4ae5-a06a-96e7bc33a211
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects AnyDesk writing binary files to disk other than "gcapi.dll". According
  to RedCanary research it is highly abnormal for AnyDesk to write executable
  files to disk besides gcapi.dll, which is a legitimate DLL that is part of the
  Google Chrome web browser used to interact with the Google Cloud API. (See
  reference section for more details). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AnyDesk.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AnyDeskMSI.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\gcapi.dll"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\AnyDesk.exe'; data_win_eventdata_image matches '*\AnyDeskMSI.exe';
  data_win_eventdata_targetFilename matches '*.dll', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/misbehaving-rats/
  - https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Suspicious Binary Writes Via AnyDesk detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1219.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - binary
    - writes
    - anydesk
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk][Mm][Ss][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/.*\\[Gg][Cc][Aa][Pp][Ii]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: AnyDesk execution is the precondition; check whether it is sanctioned on this host.
  - id: 065b00ca-5d5c-4557-ac95-64a6d0b64d86
    name: Remote Access Tool - Anydesk Execution From Suspicious Folder
    reason: AnyDesk from a user-writable folder means an attacker-brought copy rather than the managed install.
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: Silent install is how operators deploy AnyDesk before it starts dropping files.
  - id: b1377339-fda6-477a-b455-ac0923f9ec2c
    name: Remote Access Tool - AnyDesk Piped Password Via CLI
    reason: Piped password via CLI sets unattended access, usually just before file transfer through the session.
  - id: 41f407b5-3096-44ea-a74f-96d04fbc41be
    name: Remote Access Tool - AnyDesk Execution With Known Revoked Signing Certificate
    reason: Revoked-certificate AnyDesk builds are trojanized or stolen copies; strong malicious signal.
  - id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
    name: Remote Access Tool - AnyDesk Incoming Connection
    reason: Incoming AnyDesk connection shows the remote operator driving the session that wrote the binary.
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Attackers pair AnyDesk with ngrok tunnels for backup access.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Rclone follows remote-access sessions for exfiltration, as in the Confluence-to-LockBit case.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by AnyDesk
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Aa][Nn][Yy][Dd][Ee][Ss][Kk].[Ee][Xx][Ee]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk][Mm][Ss][Ii].[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: AnyDesk install and unattended access setup
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(--[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|--[Ss][Ii][Ll][Ee][Nn][Tt]|--[Ss][Ee][Tt]-[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|--[Ss][Tt][Aa][Rr][Tt]-[Ww][Ii][Tt][Hh]-[Ww][Ii][Nn]|--[Rr][Ee][Mm][Oo][Vv][Ee]-[Ff][Ii][Rr][Ss][Tt]).*/ AND data_win_eventdata_image:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/
    pivot_on: host
    window: 6h
  - name: Other remote tools and tunnels
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Gg][Rr][Oo][Kk].[Ee][Xx][Ee]|[Pp][Ll][Ii][Nn][Kk].[Ee][Xx][Ee]|[Rr][Cc][Ll][Oo][Nn][Ee].[Ee][Xx][Ee]|[Cc][Hh][Ii][Ss][Ee][Ll].[Ee][Xx][Ee]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].[Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee].[Ee][Xx][Ee]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt].[Ee][Xx][Ee])/
    pivot_on: host
    window: 24h
  - name: Discovery after remote access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ww][Hh][Oo][Aa][Mm][Ii] /[Aa][Ll][Ll]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Qq][Uu][Ss][Ee][Rr]|[Aa][Rr][Pp] -[Aa]).*/
    pivot_on: host
    window: 6h
  - name: AnyDesk network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/
    pivot_on: host
    window: 6h
