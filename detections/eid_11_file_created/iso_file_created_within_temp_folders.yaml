name: ISO File Created Within Temp Folders
id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
version: 1
schema_version: "1.0"
date: "2022-07-30"
author: "@sam0x90"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a ISO file in the Outlook temp folder or in the
  Appdata temp folder. Typical of Qakbot TTP from end-July 2022. MITRE ATT&CK:
  T1566.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.zip\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.iso"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\\INetCache\\\\Content.Outlook\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.iso"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\*'; data_win_eventdata_targetFilename matches '*.zip\*';
  data_win_eventdata_targetFilename matches '*.iso', among other conditions.

known_false_positives: >
  Potential FP by sysadmin opening a zip file containing a legitimate ISO file.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/Sam0x90/status/1552011547974696960
  - https://securityaffairs.co/wordpress/133680/malware/dll-sideloading-spread-qakbot.html
  - https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1553.005/T1553.005.md#atomic-test-1---mount-iso-image
  - https://attack.mitre.org/techniques/T1566/001/

response:
  message: >
    ISO File Created Within Temp Folders detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1566.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.001
  custom_tags:
    - within
    - folders
    - file_event
    - sysmon
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Ii][Ss][Oo]/) OR (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Nn][Ee][Tt][Cc][Aa][Cc][Hh][Ee]\\[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Ii][Ss][Oo]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: 'Same delivery chain: the ISO in a zip temp path is produced by an archiver extracting an ISO from an attachment; this catches the archiver/ISO-tool process side.'
  - id: fabb0e80-030c-4e3e-a104-d09676991ac3
    name: Suspicious File Created in Outlook Temporary Directory
    reason: 'Co-occurring precursor: the ISO lands via Content.Outlook, so other risky attachment types dropped in the same Outlook INetCache path indicate the same phishing email.'
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: 'Follow-on: a user opening the attachment directly from the Outlook temp folder executes payload instead of only staging the ISO.'
  - id: 0248a7bc-8a9a-4cd8-a57e-3ae8e073a073
    name: ISO Image Mounted
    reason: 'Direct next step: the user double-clicks the dropped ISO and Windows mounts it as a virtual drive, exposing the hidden LNK/DLL payload.'
  - id: 4358e5a5-7542-4dcb-b9f3-87667371839b
    name: ISO or Image Mount Indicator in Recent Files
    reason: Confirms the user actually opened/mounted the ISO via Recent shortcut artifacts.
  - id: 902cedee-0398-4e3a-8183-6f3a89773a96
    name: Suspicious Invoke-Item From Mount-DiskImage
    reason: Scripted variant of mounting the ISO and launching its content, used by loaders to run the payload after mount.
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: The rule cites Qakbot July 2022 ISO campaigns; the LNK in the ISO ends in rundll32 loading a Qakbot DLL from a user-writable path.
  - id: 0033cf83-fb87-446d-9cac-43d63ad4d5a9
    name: Qakbot Regsvr32 Calc Pattern
    reason: Qakbot ISO-delivery variant that registers its DLL via regsvr32 -s with a calc-style argument after the ISO is mounted.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ISO mounted via PowerShell Mount-DiskImage
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:*Mount-DiskImage*) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:*Mount-DiskImage*)
    pivot_on:
    - host
    window: 1h
  - name: Shortcut or script payload dropped to user-writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa]/) AND (data_win_eventdata_targetFilename:/.*\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_targetFilename:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_targetFilename:/.*\[Uu][Ss][Ee][Rr][Ss]\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Explorer/cmd launching rundll32 or regsvr32 on a DLL in user paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Ss]\[Pp][Uu][Bb][Ll][Ii][Cc].*/)
    pivot_on:
    - host
    window: 1h
  - name: Injected host process making outbound connections (Qakbot-style C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Rr][Ii][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Scheduled-task persistence and discovery after ISO execution
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii] \/[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Aa][Rr][Pp] -[Aa].*/)
    pivot_on:
    - host
    window: 4h
