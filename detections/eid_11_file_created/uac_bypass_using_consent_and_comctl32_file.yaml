name: UAC Bypass Using Consent and Comctl32 - File
id: 62ed5b55-f991-406a-85d9-e8e8fdf18789
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 62ed5b55-f991-406a-85d9-e8e8fdf18789
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using consent.exe and comctl32.dll (UACMe
  22). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Windows\\\\System32\\\\consent.exe.@*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\comctl32.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows\System32\consent.exe.@*'; data_win_eventdata_targetFilename
  matches '*\comctl32.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using Consent and Comctl32 - File detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - consent
    - comctl32
    - file_event
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt]\.[Ee][Xx][Ee]\.\@.*/ AND data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Mm][Cc][Tt][Ll]32\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1ca6bd18-0ba0-44ca-851c-92ed89a61085
    name: UAC Bypass Using Consent and Comctl32 - Process
    reason: Process-side detection of the UACMe 22 consent.exe chain; confirms the hijack executed.
  - id: 6360757a-d460-456c-8b13-74cf0e60cceb
    name: Potential DLL Sideloading Via comctl32.dll
    reason: comctl32.dll sideloading image load is the DLL consent.exe actually loads from the planted side-by-side folder.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi implements this method; likely tooling source.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell from an uncommon parent is the outcome of a successful bypass.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: consent.exe executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Cc]onsent\.exe/)
    pivot_on: host
    window: 2h
  - name: comctl32 loaded from non-Windows paths
    query: data_win_system_eventID:7 AND data_win_eventdata_imageLoaded:(/.*[Cc]omctl32\.dll/) AND NOT data_win_eventdata_imageLoaded:(/[Cc]:\\[Ww]indows\\.*/)
    pivot_on: host
    window: 2h
  - name: consent.exe.@ redirection folder creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Cc]onsent\.exe\.@.*/)
    pivot_on: host
    window: 2h
  - name: Elevated children of consent.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Cc]onsent\.exe/) AND data_win_eventdata_integrityLevel:(High OR System)
    pivot_on: host
    window: 2h
