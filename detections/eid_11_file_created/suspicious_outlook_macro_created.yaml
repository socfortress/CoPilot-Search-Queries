name: Suspicious Outlook Macro Created
id: 117d3d3a-755c-4a61-b23e-9171146d094c
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 117d3d3a-755c-4a61-b23e-9171146d094c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a macro file for Outlook. MITRE ATT&CK: T1137, T1008,
  T1546.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Microsoft\\\\Outlook\\\\VbaProject.OTM"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\outlook.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Microsoft\Outlook\VbaProject.OTM'; data_win_eventdata_image matches
  '*\outlook.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.mdsec.co.uk/2020/11/a-fresh-outlook-on-mail-based-persistence/
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=53
  - https://www.linkedin.com/pulse/outlook-backdoor-using-vba-samir-b-/
  - https://attack.mitre.org/techniques/T1137/
  - https://attack.mitre.org/techniques/T1008/
  - https://attack.mitre.org/techniques/T1546/

response:
  message: >
    Suspicious Outlook Macro Created detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1137, T1008, T1546
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137
    - T1008
    - T1546
  custom_tags:
    - outlook
    - macro
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Vv][Bb][Aa][Pp][Rr][Oo][Jj][Ee][Cc][Tt]\.[Oo][Tt][Mm]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
    name: New Outlook Macro Created
    reason: Companion rule on the same VbaProject.OTM artifact to compare writer and context
  - id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
    name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
    reason: LoadMacroProviderOnBoot makes Outlook load the planted macro at every start
  - id: e3b50fa5-3c3f-444e-937b-0a99d33731cd
    name: Outlook Macro Execution Without Warning Setting Enabled
    reason: Macro security lowered so the planted OTM runs without warning
  - id: c3cefdf4-6703-4e1c-bad8-bf422fc5015a
    name: Outlook Security Settings Updated - Registry
    reason: Outlook security settings changed to permit the backdoor macro
  - id: 9a0b8719-cd3c-4f0a-90de-765a4cb3f5ed
    name: Microsoft VBA For Outlook Addin Loaded Via Outlook
    reason: Outlook loading VBA runtime confirms the OTM macro is actually executing
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Child processes of Outlook show the macro payload running
  - id: c3edc6a5-d9d4-48d8-930e-aab518390917
    name: Potential Persistence Via Outlook Form
    reason: Alternative Outlook persistence (forms) from the same operator tradecraft
  - id: ddd171b5-2cc6-4975-9e78-f0eccd08cc76
    name: Potential Persistence Via Outlook Home Page
    reason: Outlook home page persistence, sibling mail-client persistence technique
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outlook macro security registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo]utlook\\([Ss]ecurity|[Ss]etup)\\.*/
    pivot_on: host
    window: 6h
  - name: Outlook spawning child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc]md|[Pp]ower[Ss]hell|[Ww]script|[Cc]script|[Mm]shta|[Rr]undll32|[Cc]url|[Cc]ertutil)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Commands editing Outlook macro settings
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(LoadMacroProviderOnBoot|[Oo]utlook\\[Ss]ecurity|[Vv]ba[Pp]roject\.[Oo][Tt][Mm]).*/
    pivot_on: host
    window: 6h
  - name: Other files written in the Outlook profile folder
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Mm]icrosoft\\[Oo]utlook\\.*/ AND NOT data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Outlook loading the VBA runtime
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Vv][Bb][Ee]7.*/
    pivot_on: host
    window: 24h
