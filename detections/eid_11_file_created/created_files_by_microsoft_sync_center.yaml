name: Created Files by Microsoft Sync Center
id: 409f8a98-4496-4aaa-818a-c931c0a8b832
version: 1
schema_version: "1.0"
date: "2022-06-02"
author: elhoim
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 409f8a98-4496-4aaa-818a-c931c0a8b832
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This rule detects suspicious files created by Microsoft Sync Center (mobsync).
  MITRE ATT&CK: T1055, T1218.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\mobsync.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\mobsync.exe'; data_win_eventdata_targetFilename matches '*.dll';
  data_win_eventdata_targetFilename matches '*.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/intelligence-insights-november-2021/
  - https://attack.mitre.org/techniques/T1055/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Created Files by Microsoft Sync Center detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1055, T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
    - T1218
  custom_tags:
    - microsoft
    - center
    - file_event
    - sysmon
    - privilege_escalation
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Mm][Oo][Bb][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: mobsync.exe is a classic Cobalt Strike spawn-to/injection host; a mobsync dropping DLL/EXE files often follows or accompanies beacon injection into it
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: Injection into mobsync.exe is performed via CreateRemoteThread from a non-standard source process; confirms the mobsync file writes are injected code, not Sync Center
  - id: a1a144b7-5c9b-4853-a559-2172be8d4a03
    name: Remote Thread Creation In Uncommon Target Image
    reason: mobsync.exe is a rarely-active process that is an uncommon remote-thread target; direct evidence of the injection that precedes the file drop
  - id: 02d1d718-dd13-41af-989d-ea85c7fab93f
    name: Rare Remote Thread Creation By Uncommon Source Image
    reason: Rare-source remote thread creation on the same host corroborates process injection staging around the mobsync activity
  - id: 5bb68627-3198-40ca-b458-49f973db8752
    name: Rundll32 Execution Without Parameters
    reason: Cobalt Strike post-exploitation commonly spawns parameterless rundll32 as a sacrificial process after injecting a beacon, a likely next step
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: The dropped EXE/DLL payload, once run, typically beacons out from a user-writable path
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: A DLL written by mobsync is commonly loaded by a system process from the same unusual folder for execution or persistence
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Injected beacons in a hijacked process are frequently used next for LSASS credential theft
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote thread injection into or from mobsync.exe
    query: data_win_system_eventID:"8" AND (data_win_eventdata_targetImage:/.*\\[Mm][Oo][Bb][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Mm][Oo][Bb][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Process access targeting mobsync.exe
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Mm][Oo][Bb][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: mobsync.exe network connections or child processes
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Mm][Oo][Bb][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Oo][Bb][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: mobsync.exe DNS lookups
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Mm][Oo][Bb][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Execution or load of files dropped by mobsync from user-writable paths
    query: (data_win_system_eventID:"1" OR data_win_system_eventID:"7") AND (data_win_eventdata_image:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc])\\.*/ OR data_win_eventdata_imageLoaded:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
