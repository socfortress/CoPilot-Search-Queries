name: Potential SAP NetWeaver Webshell Creation
id: 86a7c91f-98c3-4f14-a58d-d989421e1234
version: 1
schema_version: "1.0"
date: "2025-04-28"
author: Elastic (idea), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 86a7c91f-98c3-4f14-a58d-d989421e1234
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of suspicious files (jsp, java, class) in SAP NetWeaver
  directories, which may indicate exploitation attempts of vulnerabilities such
  as CVE-2025-31324. MITRE ATT&CK: T1190, T1059.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\j2ee\\\\cluster\\\\apps\\\\sap.com\\\\irj\\\\servlet_jsp\\\\irj\\\\work*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\j2ee\\\\cluster\\\\apps\\\\sap.com\\\\irj\\\\servlet_jsp\\\\irj\\\\root*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.jsp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.java"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.class"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work*';
  data_win_eventdata_targetFilename matches
  '*\j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root*';
  data_win_eventdata_targetFilename matches '*.jsp', among other conditions.

known_false_positives: >
  Legitimate creation of jsc or java files in these locations. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2025-31324
  - https://reliaquest.com/blog/threat-spotlight-reliaquest-uncovers-vulnerability-behind-sap-netweaver-compromise/
  - https://onapsis.com/blog/active-exploitation-of-sap-vulnerability-cve-2025-31324/
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Potential SAP NetWeaver Webshell Creation detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1190, T1059.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
    - T1059.003
  custom_tags:
    - netweaver
    - webshell
    - file_event
    - sysmon
    - execution
    - initial_access
    - persistence
    - cve_2025_31324
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Jj]2[Ee][Ee]\\[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\\[Aa][Pp][Pp][Ss]\\[Ss][Aa][Pp]\.[Cc][Oo][Mm]\\[Ii][Rr][Jj]\\[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\\[Ii][Rr][Jj]\\[Ww][Oo][Rr][Kk].*/ OR data_win_eventdata_targetFilename:/.*\\[Jj]2[Ee][Ee]\\[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\\[Aa][Pp][Pp][Ss]\\[Ss][Aa][Pp]\.[Cc][Oo][Mm]\\[Ii][Rr][Jj]\\[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\\[Ii][Rr][Jj]\\[Rr][Oo][Oo][Tt].*/) AND (data_win_eventdata_targetFilename:/.*\.[Jj][Ss][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Aa][Vv][Aa]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Ll][Aa][Ss][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5b304bcb-ac33-49d0-87af-fa1b3ca94333
    name: Suspicious Child Process of SAP NetWeaver
    reason: After the JSP webshell is dropped, commands run as child processes of the NetWeaver Java process.
  - id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
    name: Potential Webshell Creation On Static Website
    reason: Generic webshell-drop detection on web roots; same drop action on other web servers on the host.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Command-line patterns from a webshell executing recon or payload commands follow the drop.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Typical post-shell discovery chain (whoami, net, ipconfig) from the web server process.
  - id: f64e5c19-879c-4bae-b471-6d84c8339677
    name: Webshell Tool Reconnaissance Activity
    reason: Recon chain run through the webshell right after access is gained.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Classic webshell process pattern (cmd /c with directory change and redirect) if the shell is China Chopper-like.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell and recon children of SAP Java processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\[Jj][Aa][Vv][Aa].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Jj][Ll][Aa][Uu][Nn][Cc][Hh].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Ss][Aa][Pp][Ss][Tt][Aa][Rr][Tt][Ss][Rr][Vv].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Dd][Ii][Ss][Pp]+[Ww][Oo][Rr][Kk].[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\[Cc][Mm][Dd].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Pp][Ww][Ss][Hh].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Mm][Ii][Cc].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Hh][Oo][Aa][Mm][Ii].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Nn][Ee][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Nn][Ee][Tt]1.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Nn][Ll][Tt][Ee][Ss][Tt].[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 24h
  - name: Other files written under SAP irj application paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\[Jj]2[Ee][Ee]\[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\[Aa][Pp][Pp][Ss]\[Ss][Aa][Pp].[Cc][Oo][Mm]\[Ii][Rr][Jj]\.*/) AND (data_win_eventdata_targetFilename:/.*.[Jj][Ss][Pp].*/ OR data_win_eventdata_targetFilename:/.*.[Jj][Ss][Pp][Xx].*/ OR data_win_eventdata_targetFilename:/.*.[Ww][Aa][Rr].*/ OR data_win_eventdata_targetFilename:/.*.[Jj][Aa][Rr].*/ OR data_win_eventdata_targetFilename:/.*.[Cc][Ll][Aa][Ss][Ss].*/ OR data_win_eventdata_targetFilename:/.*.[Jj][Aa][Vv][Aa].*/ OR data_win_eventdata_targetFilename:/.*.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*.[Bb][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*.[Pp][Ss]1.*/)
    pivot_on:
    - host
    window: 24h
  - name: Download cradles launched by SAP processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\[Jj][Aa][Vv][Aa].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Jj][Ll][Aa][Uu][Nn][Cc][Hh].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Ss][Aa][Pp][Ss][Tt][Aa][Rr][Tt][Ss][Rr][Vv].[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/)
    pivot_on:
    - host
    window: 24h
  - name: Outbound connections from Java and SAP processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\[Jj][Aa][Vv][Aa].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Jj][Ll][Aa][Uu][Nn][Cc][Hh].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ss][Aa][Pp][Ss][Tt][Aa][Rr][Tt][Ss][Rr][Vv].[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 24h
  - name: Persistence and account changes after SAP compromise
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/)) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.*/))
    pivot_on:
    - host
    window: 24h
