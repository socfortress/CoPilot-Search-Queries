name: Suspicious File Drop by Exchange
id: 6b269392-9eba-40b5-acb6-55c882b20ba6
version: 1
schema_version: "1.0"
date: "2022-10-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6b269392-9eba-40b5-acb6-55c882b20ba6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious file type dropped by an Exchange component in IIS. MITRE
  ATT&CK: T1190, T1505.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\w3wp.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*MSExchange*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.aspx"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.asp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ashx"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ps1"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bat"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbs"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\w3wp.exe'; data_win_eventdata_commandLine matches '*MSExchange*';
  data_win_eventdata_targetFilename matches '*.aspx', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/09/30/analyzing-attacks-using-the-exchange-vulnerabilities-cve-2022-41040-and-cve-2022-41082/
  - https://www.gteltsc.vn/blog/canh-bao-chien-dich-tan-cong-su-dung-lo-hong-zero-day-tren-microsoft-exchange-server-12714.html
  - https://en.gteltsc.vn/blog/cap-nhat-nhe-ve-lo-hong-bao-mat-0day-microsoft-exchange-dang-duoc-su-dung-de-tan-cong-cac-to-chuc-tai-viet-nam-9685.html
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    Suspicious File Drop by Exchange detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1190, T1505.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
    - T1505.003
  custom_tags:
    - exchange
    - file_event
    - sysmon
    - persistence
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Mm][Ss][Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee].*/ AND (data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Hh][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: The dropped ASPX webshell is driven through w3wp.exe spawning cmd/powershell/net tools.
  - id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
    name: HAFNIUM Exchange Exploitation Activity
    reason: ProxyLogon-era Exchange exploitation yields the same w3wp-hosted shell and post-exploit command patterns.
  - id: b06335b3-55ac-4b41-937e-16b7f5d57dfd
    name: CVE-2021-26858 Exchange Exploitation
    reason: Alternate Exchange arbitrary-file-write exploit path producing webshell drops from the Exchange worker.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: China Chopper style commands are the typical use of a freshly dropped ASPX shell.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Recon commands run through the webshell right after the drop.
  - id: 83809e84-4475-4b69-bc3e-4aad8568612f
    name: MSExchange Transport Agent Installation
    reason: 'Exchange-specific persistence once the foothold exists: a malicious transport agent.'
  - id: 25676e10-2121-446e-80a4-71ff8506af47
    name: Exchange PowerShell Snap-Ins Usage
    reason: Attackers load Exchange snap-ins to export mailboxes or change roles after gaining SYSTEM via the shell.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands spawned by the IIS worker (w3wp) on this Exchange server
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp].[Ee][Xx][Ee]/) AND ((data_win_eventdata_image:/.*\\[Cc][Mm][Dd].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]/))
    pivot_on: host
    window: 4h
  - name: Script and binary writes under Exchange FrontEnd, OWA and wwwroot paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ff][Rr][Oo][Nn][Tt][Ee][Nn][Dd]\\[Hh][Tt][Tt][Pp][Pp][Rr][Oo][Xx][Yy]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee] [Ss][Ee][Rr][Vv][Ee][Rr]\\[Vv]15\\[Ff][Rr][Oo][Nn][Tt][Ee][Nn][Dd].*/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Ee][Tt][Pp][Uu][Bb]\\[Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Oo][Ww][Aa]\\[Aa][Uu][Tt][Hh]\\.*/) AND (data_win_eventdata_targetFilename:/.*.[Aa][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*.[Aa][Ss][Hh][Xx]/ OR data_win_eventdata_targetFilename:/.*.[Aa][Ss][Mm][Xx]/ OR data_win_eventdata_targetFilename:/.*.[Aa][Ss][Pp]/ OR data_win_eventdata_targetFilename:/.*.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*.[Pp][Ss]1/)
    pivot_on: host
    window: 4h
  - name: Exchange cmdlets for mailbox export or role and transport abuse
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ee][Xx][Pp][Oo][Rr][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt][Rr][Oo][Ll][Ee][Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Oo][Aa][Bb][Vv][Ii][Rr][Tt][Uu][Aa][Ll][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Pp][Ss][Ss][Nn][Aa][Pp][Ii][Nn] [Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Aa][Gg][Ee][Nn][Tt].*/)
    pivot_on: host
    window: 6h
  - name: Credential theft and archive staging following Exchange compromise
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Rr][Aa][Rr].[Ee][Xx][Ee] [Aa].*/ OR data_win_eventdata_commandLine:/.*7[Zz].[Ee][Xx][Ee] [Aa].*/)
    pivot_on: host
    window: 6h
