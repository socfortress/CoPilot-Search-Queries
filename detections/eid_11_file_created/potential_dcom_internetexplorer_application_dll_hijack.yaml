  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/[Ss][Yy][Ss][Tt][Ee][Mm]/ AND data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/

