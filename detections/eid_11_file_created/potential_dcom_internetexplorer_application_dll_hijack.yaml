name: Potential DCOM InternetExplorer.Application DLL Hijack
id: 2f7979ae-f82b-45af-ac1d-2b10e93b0baa
version: 1
schema_version: "1.0"
date: "2022-12-18"
author: Roberto Rodriguez @Cyb3rWard0g, Open Threat Research (OTR), wagga
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f7979ae-f82b-45af-ac1d-2b10e93b0baa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL hijack of "iertutil.dll" found in the DCOM
  InternetExplorer.Application Class over the network. MITRE ATT&CK: T1021.002,
  T1021.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_image:
              value: "System"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Internet Explorer\\\\iertutil.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals 'System';
  data_win_eventdata_targetFilename matches '*\Internet Explorer\iertutil.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/201009-RemoteDCOMIErtUtilDLLHijack/notebook.html
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1021/003/

response:
  message: >
    Potential DCOM InternetExplorer.Application DLL Hijack detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1021.002, T1021.003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1021.003
  custom_tags:
    - internetexplorer
    - application
    - hijack
    - file_event
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/[Ss][Yy][Ss][Tt][Ee][Mm]/ AND data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f354eba5-623b-450f-b073-0b5b2773b6aa
    name: Potential DCOM InternetExplorer.Application DLL Hijack - Image Load
    reason: 'Direct follow-on: after iertutil.dll is planted over SMB, instantiating the IE COM object loads it, seen as an image-load event.'
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: 'Same lateral-movement family: DCOM abuse via MMC20.Application.'
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: Another DCOM lateral movement variant (Excel ActivateMicrosoftApp) from the same toolkit.
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: Planted DLL carrying a system DLL name in an unexpected place; generic hijack signal on the same host.
  - id: f0e2b768-5220-47dd-b891-d57b96fc0ec1
    name: CSExec Service File Creation
    reason: Alternative remote execution via service file creation (CSExec); operators often try several lateral techniques.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: iertutil.dll loaded by iexplore.exe
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ii][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/ AND (data_win_eventdata_image:/.*\\([Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Network logons (type 3) by non-machine accounts
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on:
    - host
    window: 1h
  - name: DLL and EXE files written over SMB (System as writer)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:"System" AND (data_win_eventdata_targetFilename:/.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: iexplore.exe started with COM embedding or spawning children
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_parentImage:/.*\\([Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee])\.[Ee][Xx][Ee]/) OR ((data_win_eventdata_image:/.*\\([Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee])\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*-[Ee][Mm][Bb][Ee][Dd][Dd][Ii][Nn][Gg].*/))
    pivot_on:
    - host
    window: 2h
  - name: Run-key or service persistence after remote execution
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/)
    pivot_on:
    - host
    window: 4h
