response:
  message: >
    Creation Of Non-Existent System DLL detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - existent
    - system
    - file_event
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Xx][Ee][Oo][Nn][Oo][Ff][Ff][Hh][Ee][Ll][Pp][Ee][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Dd][Pp][Ss][Gg][Ss][Hh][Ii][Mm][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Oo][Cc][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Oo][Ff][Ff][Dd][Mm][Pp][Ss][Vv][Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Hh][Ee][Ll][Ll][Cc][Hh][Rr][Oo][Mm][Ee][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Ss][Mm][Ss][Ii][Ss][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Ss][Vv][Ii][Pp][Ss][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ll][Bb][Ss][Cc][Tt][Rr][Ll]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Oo][Ww]64[Ll][Oo][Gg]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Pp][Tt][Ss][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Pp][Rr][Ii][Nn][Tt][Cc][Ss][Pp]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: 'Direct follow-on: the planted phantom DLL is loaded (Sysmon EID 7) by the privileged service or LOLBin that searches for it, the moment code execution occurs.'
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: 'Sibling drop detection: system-DLL-named files written outside System32 indicate the same hijack staging.'
  - id: 614a7e17-5643-4d89-b6fe-f9df1a79641c
    name: Wmiprvse Wbemcomn DLL Hijack - File
    reason: wbemcomn.dll is one of this rule's phantom names; this is the same wbem hijack file drop and can co-fire.
  - id: 7707a579-e0d8-4886-a853-ce47e4575aaa
    name: Wmiprvse Wbemcomn DLL Hijack
    reason: 'Execution stage for the wbemcomn.dll phantom: wmiprvse loading the planted DLL runs attacker code with high privilege.'
  - id: ee4c5d06-3abc-48cc-8885-77f1c20f4451
    name: DLL Sideloading Of ShellChromeAPI.DLL
    reason: shellchromeapi.dll is a listed phantom name; its load confirms the dropped DLL was executed.
  - id: 50dbc08b-60ce-40f1-a6b6-346497e34c88
    name: Potential CVE-2023-36874 Exploitation - Fake Wermgr Execution
    reason: Same Windows Error Reporting hijack family (wermgr/offdmpsvc.dll phantom) and local privilege-escalation tradecraft.
  - id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
    name: HackTool - SysmonEOP Execution
    reason: SysmonEOP is a public exploit that plants DLLs in System32 to reach SYSTEM; its execution precedes this drop.
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: Corroborates hijack execution when a system process loads a DLL from an abnormal path.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Planted phantom DLL being loaded by a process
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*[Aa][Xx][Ee][Oo][Nn][Oo][Ff][Ff][Hh][Ee][Ll][Pp][Ee][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Cc][Dd][Pp][Ss][Gg][Ss][Hh][Ii][Mm][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Oo][Ff][Ff][Dd][Mm][Pp][Ss][Vv][Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ss][Hh][Ee][Ll][Ll][Cc][Hh][Rr][Oo][Mm][Ee][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Tt][Ss][Mm][Ss][Ii][Ss][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Tt][Ss][Vv][Ii][Pp][Ss][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ww][Ll][Bb][Ss][Cc][Tt][Rr][Ll]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ww][Oo][Ww]64[Ll][Oo][Gg]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ww][Pp][Tt][Ss][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ss][Pp][Rr][Ii][Nn][Tt][Cc][Ss][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\[Oo][Cc][Ii]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: Other DLL/EXE/SYS files written to System32 on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]32\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Ss][Yy][Ss])/
    pivot_on:
    - host
    window: 1h
  - name: Trigger of the hijacked component (wermgr, wpr boot trace, scheduled task, service start)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ww][Pp][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww][Pp][Rr].*-[Bb][Oo][Oo][Tt][Tt][Rr][Aa][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +(start|config|create).*/)
    pivot_on:
    - host
    window: 1h
  - name: Scripting/Office parent copying DLLs into System32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*[Ss][Yy][Ss][Tt][Ee][Mm]32.*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]32.*\.[Dd][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: SYSTEM-written files and services.exe children (remote/service-delivered drop)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_image:"System") OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_user:/.*([Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee]).*/)
    pivot_on:
    - host
    window: 2h
