name: RedSun - TieringEngineService.exe Staged in RS-Prefixed Temp Dir
id: f2e4b7d9-5c3a-4f8b-9e1d-7a6c2b3f4e5d
version: 1
schema_version: "1.0"
date: "2026-04-17"
author: Swachchhanda Shrawan Poudel (Nextron Systems), @unresolvedhost
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f2e4b7d9-5c3a-4f8b-9e1d-7a6c2b3f4e5d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file named TieringEngineService.exe inside a
  directory whose path contains the RS- prefix characteristic of RedSun's
  staging directory (e.g. %TEMP%\RS-{GUID}\TieringEngineService.exe). RedSun
  registers a Cloud Files sync root under this RS-prefixed path and drops a
  masqueraded placeholder there as part of its oplock-based AV bypass and
  privilege escalation chain. The RS-{GUID} directory name is generated by
  RedSun itself and has no legitimate system usage, making the combination of
  this path prefix and the TieringEngineService.exe filename a highly specific
  indicator of RedSun activity. MITRE ATT&CK: T1036.005.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Temp*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\RS-{*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\TieringEngineService.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Temp*'; data_win_eventdata_targetFilename matches '*\RS-{*';
  data_win_eventdata_targetFilename matches '*\TieringEngineService.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Nightmare-Eclipse/RedSun/blob/7456cc8cf066f5e5fc6cdf7d3272a466ebd6b2f6/RedSun.cpp#L591
  - https://deadeclipse666.blogspot.com/2026/04/public-disclosure-response-for-cve-2026.html
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    RedSun - TieringEngineService.exe Staged in RS-Prefixed Temp Dir detected on
    host $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1036.005
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.005
  custom_tags:
    - redsun
    - tieringengineservice
    - staged
    - file_event
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp].*/ AND data_win_eventdata_targetFilename:/.*\\[Rr][Ss]-\{.*/ AND data_win_eventdata_targetFilename:/.*\\[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a7c3e5f2-8b1d-4e9a-b6c2-3d7f5e8a9b4c
    name: RedSun - TieringEngineService.exe Detected as EICAR Test File
    reason: Defender flagging the placeholder as EICAR is a RedSun step in the same oplock AV bypass.
  - id: 2ad78473-6978-40f5-b8f1-89c7e1c27a1a
    name: RedSun - Conhost.exe Spawned by TieringEngineService.exe
    reason: conhost spawned by TieringEngineService.exe shows the privileged payload executed.
  - id: 9b4e7c2a-3f6d-4a8b-b5e9-1c7d3f2e6a4b
    name: RedSun - Named Pipe Created
    reason: The REDSUN named pipe is created by the same exploit during the race.
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: Defender threat detection on the staged file precedes the bypass.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: TieringEngineService execution from RS- path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\RS-\{.*[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Children of TieringEngineService
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: REDSUN named pipe
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*[Rr][Ee][Dd][Ss][Uu][Nn].*/
    pivot_on: host
    window: 2h
  - name: Cloud Files sync root registration
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Yy][Nn][Cc][Rr][Oo][Oo][Tt][Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/
    pivot_on: host
    window: 2h
  - name: Files created under RS- temp directories
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\RS-\{.*/
    pivot_on: host
    window: 2h
