name: Uncommon File Created In Office Startup Folder
id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
version: 1
schema_version: "1.0"
date: "2023-12-13"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file with an uncommon extension in an Office
  application startup folder. MITRE ATT&CK: T1587.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\Microsoft\\\\Word\\\\STARTUP*"
                                case_insensitive: true
                          - bool:
                              must:
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*\\\\Office*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*\\\\Program Files*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*\\\\STARTUP*"
                                      case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_targetFilename"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.docb"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.docm"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.docx"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.dotm"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.mdb"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.mdw"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.pdf"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.wll"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.wwl"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\Microsoft\\\\Excel\\\\XLSTART*"
                                case_insensitive: true
                          - bool:
                              must:
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*\\\\Office*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*\\\\Program Files*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*\\\\XLSTART*"
                                      case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_targetFilename"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.xll"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.xls"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.xlsm"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.xlsx"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.xlt"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.xltm"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetFilename:
                                      value: "*.xlw"
                                      case_insensitive: true
                              minimum_should_match: 1
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\OfficeClickToRun.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*:\\\\Program Files\\\\Microsoft Office\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*:\\\\Program Files (x86)\\\\Microsoft Office\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\winword.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\excel.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Microsoft\Word\STARTUP*'; data_win_eventdata_targetFilename matches
  '*\Office*'; data_win_eventdata_targetFilename matches '*\Program Files*',
  among other conditions.

known_false_positives: >
  False positive might stem from rare extensions used by other Office utilities.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://app.any.run/tasks/d6fe6624-6ef8-485d-aa75-3d1bdda2a08c/
  - http://addbalance.com/word/startup.htm
  - https://answers.microsoft.com/en-us/msoffice/forum/all/document-in-word-startup-folder-doesnt-open-when/44ab0932-2917-4150-8cdc-2f2cf39e86f3
  - https://en.wikipedia.org/wiki/List_of_Microsoft_Office_filename_extensions
  - https://attack.mitre.org/techniques/T1587/001/

response:
  message: >
    Uncommon File Created In Office Startup Folder detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1587.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1587.001
  custom_tags:
    - uncommon
    - office
    - startup
    - file_event
    - sysmon
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (((data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Oo][Rr][Dd]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/ OR (data_win_eventdata_targetFilename:/.*\\[Oo][Ff][Ff][Ii][Cc][Ee].*/ AND data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss].*/ AND data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/)) AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Bb]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Tt][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Mm][Dd][Bb]/ OR data_win_eventdata_targetFilename:/.*\.[Mm][Dd][Ww]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Dd][Ff]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ww][Ll]/)) OR ((data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Xx][Cc][Ee][Ll]\\[Xx][Ll][Ss][Tt][Aa][Rr][Tt].*/ OR (data_win_eventdata_targetFilename:/.*\\[Oo][Ff][Ff][Ii][Cc][Ee].*/ AND data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss].*/ AND data_win_eventdata_targetFilename:/.*\\[Xx][Ll][Ss][Tt][Aa][Rr][Tt].*/)) AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Tt][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ww]/))) AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Cc][Ll][Ii][Cc][Kk][Tt][Oo][Rr][Uu][Nn]\\.*/ AND data_win_eventdata_image:/.*\\[Oo][Ff][Ff][Ii][Cc][Ee][Cc][Ll][Ii][Cc][Kk][Tt][Oo][Rr][Uu][Nn]\.[Ee][Xx][Ee]/) OR ((data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee]\\.*/) AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: Sibling file-creation rule on the same startup folders; same persistence mechanism.
  - id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
    name: Potential Persistence Via Microsoft Office Add-In
    reason: Add-in directory drops (XLL/WLL) are the same persistence family.
  - id: b1c50487-1967-4315-a026-6491686d860e
    name: Office Macro File Creation From Suspicious Process
    reason: 'Precursor: macro-enabled template/add-in written by a suspicious process.'
  - id: 961e33d1-4f86-4fcf-80ab-930a708b2f82
    name: Potential Persistence Via Excel Add-in - Registry
    reason: Registry counterpart used to register the dropped add-in.
  - id: af4c4609-5755-42fe-8075-4effb49f5d44
    name: Microsoft Excel Add-In Loaded From Uncommon Location
    reason: 'Follow-on: Excel loading the planted add-in.'
  - id: 91239011-fe3c-4b54-9f24-15c86bb65913
    name: Office Macros Warning Disabled
    reason: Attackers disable macro warnings so the startup payload runs silently.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other writes to Office STARTUP and Addins paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Mm]icrosoft.*STARTUP.*/ OR /.*[Mm]icrosoft.*[Aa]dd[Ii]ns.*/ OR /.*XLSTART.*/)
    pivot_on: host
    window: 4h
  - name: Office loads DLLs from AppData
    query: data_win_system_eventID:7 AND data_win_eventdata_image:(/.*[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.exe/ OR /.*[Ee][Xx][Cc][Ee][Ll]\.exe/) AND data_win_eventdata_imageLoaded:/.*[Aa]pp[Dd]ata.*/
    pivot_on: host
    window: 4h
  - name: Office spawning script hosts or shells
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.exe/ OR /.*[Ee][Xx][Cc][Ee][Ll]\.exe/) AND data_win_eventdata_image:(/.*cmd\.exe/ OR /.*powershell\.exe/ OR /.*wscript\.exe/ OR /.*rundll32\.exe/)
    pivot_on: host
    window: 4h
  - name: Office trust and macro registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*[Ss]ecurity.*[Vv][Bb][Aa][Ww]arnings.*/ OR /.*[Tt]rusted [Ll]ocations.*/ OR /.*AccessVBOM.*/)
    pivot_on: host
    window: 4h
