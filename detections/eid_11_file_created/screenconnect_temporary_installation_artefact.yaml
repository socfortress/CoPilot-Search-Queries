name: ScreenConnect Temporary Installation Artefact
id: fec96f39-988b-4586-b746-b93d59fd1922
version: 1
schema_version: "1.0"
date: "2022-02-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fec96f39-988b-4586-b746-b93d59fd1922
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Bin\\\\ScreenConnect.*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Bin\ScreenConnect.*'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-5---screenconnect-application-download-and-install-on-windows
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    ScreenConnect Temporary Installation Artefact detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - screenconnect
    - temporary
    - installation
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Bb][Ii][Nn]\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\..*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 75bfe6e6-cd8e-429e-91d3-03921e1d7962
    name: Remote Access Tool - ScreenConnect Installation Execution
    reason: The installer run that produces these artefacts; separates a scripted install from an expected deployment.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Shows the ScreenConnect client/service actually executing on this host after its files were written.
  - id: 7b582f1a-b318-4c6a-bf4e-66fe49bf55a5
    name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
    reason: Remote commands pushed through ScreenConnect temp scripts are what an operator does once a session exists.
  - id: c8b00925-926c-47e3-beea-298fd563728e
    name: Remote Access Tool Services Have Been Installed - Security
    reason: Service-install event for the remote access client marks persistent access.
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: System-log 7045 for the ScreenConnect client service created by this install.
  - id: 0b9ad457-2554-44c1-82c2-d56a99c42377
    name: Anydesk Temporary Artefact
    reason: Attackers often layer multiple RMM tools; a second RMM artefact on the same host signals deliberate remote-access staging.
  - id: 9711de76-5d4f-4c50-a94f-21e4e8f8384d
    name: Installation of TeamViewer Desktop
    reason: Another remote-access install on the same host would indicate redundant attacker access.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ScreenConnect client process execution
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee]=[Aa][Cc][Cc][Ee][Ss][Ss]&[Yy]=[Gg][Uu][Ee][Ss][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: ScreenConnect relay DNS and connections
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Rr][Ee][Ll][Aa][Yy]\.[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: Shells executing ScreenConnect-delivered scripts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\\.*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp]\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other remote-access tools running
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr].*/ OR data_win_eventdata_image:/.*\\[Aa][Tt][Ee][Rr][Aa][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_image:/.*\\[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp].*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Tt][Ss][Ee][Rr][Vv].*/ OR data_win_eventdata_image:/.*\\[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_image:/.*\\[Nn][Ii][Nn][Jj][Aa][Rr][Mm][Mm].*/ OR data_win_eventdata_image:/.*\\[Cc][Ll][Ii][Ee][Nn][Tt]32.*/)
    pivot_on:
    - host
    window: 6h
  - name: ScreenConnect service or autostart registration
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ OR data_win_eventdata_targetObject:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt] [Cc][Ll][Ii][Ee][Nn][Tt].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/))
    pivot_on:
    - host
    window: 24h
