name: HackTool - CrackMapExec File Indicators
id: 736ffa74-5f6f-44ca-94ef-1c0df4f51d2a
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 736ffa74-5f6f-44ca-94ef-1c0df4f51d2a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file creation events with filename patterns used by CrackMapExec.
  MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Windows\\\\Temp\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\temp.ps1"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\msol.ps1"
                    case_insensitive: true
              - regexp:
                  data_win_eventdata_targetFilename: ".*(\\\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\.txt)"
              - regexp:
                  data_win_eventdata_targetFilename: ".*(\\\\[a-zA-Z]{8}\\.tmp)"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows\Temp\*'; data_win_eventdata_targetFilename matches '*\temp.ps1';
  data_win_eventdata_targetFilename matches '*\msol.ps1', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/byt3bl33d3r/CrackMapExec/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - CrackMapExec File Indicators detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - crackmapexec
    - indicators
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\\[Mm][Ss][Oo][Ll]\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*(\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt)/ OR data_win_eventdata_targetFilename:/.*(\\[a-zA-Z]{8}\.tmp)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: 'Same tool family and same C:\Windows\Temp random 8-char .tmp artefact: remote SAM/LSA hive dump output landing on the target, the direct credential-access result of the CME file indicators.'
  - id: 03f4ca17-de95-428d-a75a-4ee78b047256
    name: HackTool - Impacket File Indicators
    reason: CME is built on Impacket; its smbexec/atexec/wmiexec execution modes drop the same style of temp output files, so co-firing confirms remote-exec tooling rather than a stray temp file.
  - id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
    name: Wmiexec Default Output File
    reason: CME's wmiexec method writes command output to a file on the target; a hit on the same host confirms WMI-based remote command execution preceding these file writes.
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: Alternative remote execution artefact (PSEXESVC / Impacket psexec) on the same target host, showing the operator switching exec methods during the same CME sweep.
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: 'Process-side view of the same tool: CME command-lines (cmd /Q /c with ADMIN$ output redirection) executing on the host whose temp files fired the alert.'
  - id: f26307d8-14cd-47e3-a26b-4b4769f24af6
    name: HackTool - CrackMapExec Process Patterns
    reason: Process-creation patterns CME produces on targets (service/WMI-spawned cmd and powershell), the execution that produces the dropped temp.ps1/msol.ps1 and tmp files.
  - id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
    name: Possible Impacket SecretDump Remote Activity
    reason: Secretsdump-style remote access to ADMIN$ and the winreg/SAMR pipes is the network-side counterpart of the 8-letter .tmp hive export; confirms credential extraction followed the file write.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: CME smbexec/psexec modes install a transient service over SMB; a service install just before the temp file creation establishes the remote execution mechanism.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CME-style remote command execution with ADMIN$ output redirection
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd](\.[Ee][Xx][Ee])? \/[Qq] \/[Cc].*2>&1.*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*\.[Tt][Mm][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: Registry hive / LSASS / NTDS credential extraction on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg](\.[Ee][Xx][Ee])? +[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm]\\(([Ss][Aa][Mm])|([Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])|([Ss][Yy][Ss][Tt][Ee][Mm])).*|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Ss][Hh][Aa][Dd][Oo][Ww].*|[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*)/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Other script/tool/dump files dropped in Windows Temp on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*\.([Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Ee][Xx][Ee]|[Dd][Ll][Ll]|[Dd][Mm][Pp]|[Dd][Aa][Tt]|[Zz][Ii][Pp]|[Hh][Ii][Vv][Ee]|[Ss][Aa][Vv][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Inbound network logons (NTLM type 3) from the scanning source IP
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on:
    - ip
    window: 6h
  - name: PowerShell script blocks with credential-theft or offensive tooling content
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*Invoke-BloodHound* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*FromBase64String*)
    pivot_on:
    - host
    window: 2h
