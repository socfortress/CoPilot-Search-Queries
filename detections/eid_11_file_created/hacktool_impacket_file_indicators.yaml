name: HackTool - Impacket File Indicators
id: 03f4ca17-de95-428d-a75a-4ee78b047256
version: 1
schema_version: "1.0"
date: "2025-05-19"
author: The DFIR Report, IrishDeath
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 03f4ca17-de95-428d-a75a-4ee78b047256
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file creation events with filename patterns used by Impacket. MITRE
  ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - regexp:
            data_win_eventdata_targetFilename: ".*(\\\\sessionresume_[a-zA-Z]{8})"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches the
  regex /.*(\\sessionresume_[a-zA-Z]{8})/.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2025/05/19/another-confluence-bites-the-dust-falling-to-elpaco-team-ransomware/
  - https://github.com/fortra/impacket
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - Impacket File Indicators detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - impacket
    - indicators
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\sessionresume_[a-zA-Z]{8})/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: A sessionresume_ file is secretsdump's resume artefact; this rule catches the same remote SAM/NTDS dump tooling dropping its temp output on the target.
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: 'Same toolkit: Impacket binaries/scripts run on this host (or its operator staging) usually precede or accompany the file artefact.'
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Impacket psexec/smbexec/wmiexec spawn cmd via services or WMI on remote hosts; the dump files follow the operator gaining remote exec with stolen credentials.
  - id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
    name: Wmiexec Default Output File
    reason: Impacket wmiexec writes its __<timestamp> output file to ADMIN$; same operator toolkit and often the access path used before the credential dump.
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: Remote service-exec file artefacts (PSEXESVC/impacket psexec) are the lateral-movement precursor on the same host.
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: Secretsdump against a domain controller via VSS/DRSUAPI leaves ntds.dit copies; confirms domain credential database theft on a DC.
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: Output filenames of NTDS dump tooling (secretsdump .ntds/.sam/.secrets) are the direct product of the resumed session.
  - id: e6e88853-5f20-4c4a-8d26-cd469fd8d31f
    name: Ntdsutil Abuse
    reason: Alternative/fallback NTDS extraction an attacker uses on the DC when or after secretsdump runs.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NTDS/SAM/SECURITY hive and dump output files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*\.[Nn][Tt][Dd][Ss]$/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Ee][Cc][Rr][Ee][Tt][Ss]$/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[A-Za-z]{8}\.[Tt][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[A-Za-z]{8}\.[Tt][Mm][Pp]/)
    pivot_on:
    - host
    window: 1h
  - name: Impacket exec-channel command lines (wmiexec/smbexec/atexec) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*\/[Qq] \/[Cc].*\\\\127\.0\.0\.1\\.*/ OR data_win_eventdata_commandLine:/.*\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_commandLine:/.*\\\\127\.0\.0\.1\\[Cc]\$\\__output.*/ OR data_win_eventdata_commandLine:/.*2>&1.*[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on:
    - host
    window: 1h
  - name: Service installs and remote-service binaries (psexec/smbexec style)
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_imagePath:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*/ OR data_win_eventdata_imagePath:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*\/[Qq].*/ OR data_win_eventdata_imagePath:/.*\\\\.*\\[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_imagePath:/.*[Bb][Tt][Oo][Bb][Tt][Oo].*/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons (type 3, NTLM) by this account preceding dump
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on:
    - user
    window: 6h
  - name: Outbound SMB/RPC connections from non-system processes on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135") AND NOT data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
