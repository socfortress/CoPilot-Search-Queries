name: ScreenConnect User Database Modification
id: 1a821580-588b-4323-9422-660f7e131020
version: 1
schema_version: "1.0"
date: "2024-02-21"
author: Matt Anderson, Andrew Schwartz, Caleb Stewart, Huntress
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1a821580-588b-4323-9422-660f7e131020
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file modifications to the temporary xml user database file indicating
  local user modification in the ScreenConnect server. This will occur during
  exploitation of the ScreenConnect Authentication Bypass vulnerability
  (CVE-2024-1709) in versions <23.9.8, but may also be observed when making
  legitimate modifications to local users or permissions.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.xml"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*Temp*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*ScreenConnect*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\ScreenConnect.Service.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*.xml'; data_win_eventdata_targetFilename matches '*Temp*';
  data_win_eventdata_targetFilename matches '*ScreenConnect*', among other
  conditions.

known_false_positives: >
  This will occur legitimately as well and will result in some benign activity.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.connectwise.com/company/trust/security-bulletins/connectwise-screenconnect-23.9.8
  - https://www.cve.org/CVERecord?id=CVE-2024-1709
  - https://www.huntress.com/blog/a-catastrophe-for-control-understanding-the-screenconnect-authentication-bypass

response:
  message: >
    ScreenConnect User Database Modification detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - screenconnect
    - database
    - file_event
    - sysmon
    - persistence
    - cve_2024_1709
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Xx][Mm][Ll]/ AND data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp].*/ AND data_win_eventdata_targetFilename:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ AND data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4109cb6a-a4af-438a-9f0c-056abba41c6f
    name: ScreenConnect User Database Modification - Security
    reason: Security-log view of the same User.xml change; two sources agreeing strengthens the case.
  - id: 44d7af7e-88e6-4490-be11-55f7ff4d9fc1
    name: CVE-2024-1708 - ScreenConnect Path Traversal Exploitation
    reason: Companion path-traversal half of the SlashAndGrab chain writing files outside the intended directory.
  - id: b19146a3-25d4-41b4-928b-1e2a92641b1b
    name: Remote Access Tool - ScreenConnect Server Web Shell Execution
    reason: On a ScreenConnect server, exploitation leads to web-shell style extension execution.
  - id: 7b582f1a-b318-4c6a-bf4e-66fe49bf55a5
    name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
    reason: Remote commands pushed through ScreenConnect temp scripts are what an operator does once a session exists.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Shows the ScreenConnect client/service actually executing on this host after its files were written.
  - id: 05164d17-8e11-4d7d-973e-9e4962436b87
    name: ScreenConnect - SlashAndGrab Exploitation Indicators
    reason: Payload artefacts (lb3.exe, mpyutd.msi, update.dat) dropped after the rogue admin gains access.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of the ScreenConnect server service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Executable or script files written by the ScreenConnect service
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Mm][Ss][Ii].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1.*/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Hh][Xx].*/)
    pivot_on:
    - host
    window: 4h
  - name: Extension and web-root drops under ScreenConnect
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\\[Aa][Pp][Pp]_[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\\[Aa][Pp][Pp]_[Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\\[Ww][Ee][Bb].*/) AND (data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Hh][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1.*/)
    pivot_on:
    - host
    window: 4h
  - name: Account creation and discovery commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1 [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1 [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on:
    - host
    window: 4h
  - name: Ransomware prep and credential theft
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 6h
