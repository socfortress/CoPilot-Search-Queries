name: Potential Webshell Creation On Static Website
id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
version: 1
schema_version: "1.0"
date: "2023-10-15"
author: Beyu Denis, oscd.community, Tim Shelton, Thurein Oo
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of files with certain extensions on a static web site.
  This can be indicative of potential uploads of a web shell. MITRE ATT&CK:
  T1505.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\inetpub\\\\wwwroot\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.ashx*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.asp*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.ph*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.soap*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\www\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\htdocs\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\html\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.ph*"
                          case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetFilename"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\Windows\\\\Temp\\\\*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "System"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\xampp*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\inetpub\wwwroot\*'; data_win_eventdata_targetFilename matches '*.ashx*';
  data_win_eventdata_targetFilename matches '*.asp*', among other conditions.

known_false_positives: >
  Legitimate administrator or developer creating legitimate executable files in
  a web application folder. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - PT ESC rule and personal experience
  - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/c95a0a1a2855dc0cd7f7327614545fe30482a636/Upload%20Insecure%20Files/README.md
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    Potential Webshell Creation On Static Website detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1505.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
  custom_tags:
    - webshell
    - static
    - website
    - file_event
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Ee][Tt][Pp][Uu][Bb]\\[Ww][Ww][Ww][Rr][Oo][Oo][Tt]\\.*/ AND (data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Hh][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Hh].*/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Oo][Aa][Pp].*/)) OR ((data_win_eventdata_targetFilename:/.*\\[Ww][Ww][Ww]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Hh][Tt][Dd][Oo][Cc][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Hh][Tt][Mm][Ll]\\.*/) AND data_win_eventdata_targetFilename:/.*\.[Pp][Hh].*/)) AND _exists_:data_win_eventdata_targetFilename AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_targetFilename:/.*\\[Xx][Aa][Mm][Pp][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bd1212e5-78da-431e-95fa-c58e3237a8e6
    name: Suspicious ASPX File Drop by Exchange
    reason: 'Suspicious ASPX dropped by Exchange: same webshell-drop pattern on another web stack.'
  - id: 86a7c91f-98c3-4f14-a58d-d989421e1234
    name: Potential SAP NetWeaver Webshell Creation
    reason: 'SAP NetWeaver webshell creation: same technique on a different server.'
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Chopper-style webshell commands once the shell is used.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Command-line keywords of webshell use following the drop.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Webshell hacking activity patterns after upload.
  - id: f64e5c19-879c-4bae-b471-6d84c8339677
    name: Webshell Tool Reconnaissance Activity
    reason: Recon tooling driven through the webshell.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: Log deletion by the attacker after webshell use.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Web server worker spawning shells or recon tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww]3[Ww][Pp]|[Hh]ttpd|[Pp]hp-cgi|[Nn]ginx)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc]md|[Pp]ower[Ss]hell|[Ww]hoami|[Nn]et1?|[Nn]ltest|[Ii]pconfig)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Other script files created under web roots
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ii]netpub\\[Ww]wwroot.*/ OR data_win_eventdata_targetFilename:/.*\\[Hh]tdocs\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww]ww\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp][Xx]?/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Hh][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Hh][Xx]/)
    pivot_on: host
    window: 24h
  - name: Web server process outbound connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ww]3[Ww][Pp]|[Hh]ttpd|[Pp]hp-cgi)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Download tools fetching payloads on the web host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]ertutil.*-[Uu]rlcache.*/ OR data_win_eventdata_commandLine:/.*[Bb]itsadmin.*[Tt]ransfer.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Cc]url .*[Hh]ttp.*/)
    pivot_on: host
    window: 4h
  - name: IIS log or config tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]pp[Cc]md.*/ OR data_win_eventdata_commandLine:/.*[Ii]netpub\\[Ll]ogs.*/)
    pivot_on: host
    window: 24h
