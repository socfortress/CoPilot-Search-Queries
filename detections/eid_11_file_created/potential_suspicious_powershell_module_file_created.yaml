name: Potential Suspicious PowerShell Module File Created
id: e8a52bbd-bced-459f-bd93-64db45ce7657
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e8a52bbd-bced-459f-bd93-64db45ce7657
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a new PowerShell module in the first folder of the
  module directory structure "\WindowsPowerShell\Modules\malware\malware.psm1".
  This is somewhat an uncommon practice as legitimate modules often includes a
  version folder.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\WindowsPowerShell\\\\Modules\\\\*\\\\.ps"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\WindowsPowerShell\\\\Modules\\\\*\\\\.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\WindowsPowerShell\Modules\*\.ps'; data_win_eventdata_targetFilename matches
  '*\WindowsPowerShell\Modules\*\.dll'.

known_false_positives: >
  False positive rate will vary depending on the environments. Additional
  filters might be required to make this logic usable in production. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - Internal Research
  - https://learn.microsoft.com/en-us/powershell/scripting/developer/module/understanding-a-windows-powershell-module?view=powershell-7.3

response:
  message: >
    Potential Suspicious PowerShell Module File Created detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - powershell
    - module
    - file_event
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Mm][Oo][Dd][Uu][Ll][Ee][Ss]\\.*\\\.[Pp][Ss]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Mm][Oo][Dd][Uu][Ll][Ee][Ss]\\.*\\\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e3845023-ca9a-4024-b2b2-5422156d5527
    name: PowerShell Module File Created By Non-PowerShell Process
    reason: 'Module file written by a non-PowerShell process: the same planting seen from the writer side.'
  - id: c31364f7-8be6-4b77-8483-dd2b5a7b69a3
    name: Import PowerShell Modules From Suspicious Directories - ProcCreation
    reason: 'Import-Module from suspicious directories: the load step after planting.'
  - id: 21f9162c-5f5d-4b01-89a8-b705bd7d10ab
    name: Import PowerShell Modules From Suspicious Directories
    reason: 'Script block showing Import-Module from suspicious paths: execution of the planted module.'
  - id: 3fc16961-97e5-4a5b-a079-e4ab0d9763eb
    name: Windows PowerShell Add Module to Global Assembly Cache
    reason: Adding modules to the GAC is a sibling persistence/loading technique.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Import-Module of non-standard modules
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii]mport-[Mm]odule.*/ OR data_win_eventdata_commandLine:/.*[Ii]pmo .*/)
    pivot_on: host
    window: 24h
  - name: Other files created in PowerShell module paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ww]indows[Pp]ower[Ss]hell\\[Mm]odules.*/
    pivot_on: host
    window: 24h
  - name: Command lines referencing module paths or psm1 files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]indows[Pp]ower[Ss]hell\\[Mm]odules.*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1.*/)
    pivot_on: host
    window: 4h
  - name: PowerShell with bypass or hidden flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*-[Ee]xecution[Pp]olicy.*[Bb]ypass.*/ OR data_win_eventdata_commandLine:/.*-[Ww]indow[Ss]tyle.*[Hh]idden.*/ OR data_win_eventdata_commandLine:/.*-[Nn]o[Pp]rofile.*/)
    pivot_on: host
    window: 4h
