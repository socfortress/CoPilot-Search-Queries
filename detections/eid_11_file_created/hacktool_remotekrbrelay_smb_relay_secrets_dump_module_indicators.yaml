name: HackTool - RemoteKrbRelay SMB Relay Secrets Dump Module Indicators
id: 3ab79e90-9fab-4cdf-a7b2-6522bc742adb
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ab79e90-9fab-4cdf-a7b2-6522bc742adb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of file with specific names used by RemoteKrbRelay SMB
  Relay attack module. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\windows\\\\temp\\\\sam.tmp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\windows\\\\temp\\\\sec.tmp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\windows\\\\temp\\\\sys.tmp"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*:\windows\temp\sam.tmp'; data_win_eventdata_targetFilename matches
  '*:\windows\temp\sec.tmp'; data_win_eventdata_targetFilename matches
  '*:\windows\temp\sys.tmp'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/CICADA8-Research/RemoteKrbRelay/blob/19ec76ba7aa50c2722b23359bc4541c0a9b2611c/Exploit/RemoteKrbRelay/Relay/Attacks/RemoteRegistry.cs#L31-L40
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    HackTool - RemoteKrbRelay SMB Relay Secrets Dump Module Indicators detected
    on host $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1219.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - hacktool
    - remotekrbrelay
    - relay
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Ss][Aa][Mm]\.[Tt][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Ss][Ee][Cc]\.[Tt][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Ss][Yy][Ss]\.[Tt][Mm][Pp]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
    name: HackTool - RemoteKrbRelay Execution
    reason: 'Same tool: the RemoteKrbRelay binary execution precedes its RemoteRegistry module writing sam/sec/sys.tmp hive dumps.'
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: RemoteKrbRelay is a KrbRelay derivative; parent relay tooling is often staged alongside it on the same host.
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: Kerberos relay escalation tooling from the same family, a common precursor to remote registry secrets dumping.
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: 'Same outcome via another route: SAM/SYSTEM/SECURITY hive export files confirm credential hive theft on the host.'
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: Co-occurring file-creation evidence of SAM copies, the same secrets-dump objective as sam.tmp.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Reg save of SAM/SECURITY/SYSTEM is the native equivalent of the hive save this module performs remotely.
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: Authentication coercion that feeds a relay attack; precursor to the relayed SMB session behind this dump.
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: RemoteKrbRelay relies on coerced Kerberos auth via DNS SPN spoofing; this is the coercion step preceding the relay.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive save commands and hive export files
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*(SAM|SECURITY|SYSTEM).*/) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*sam.save OR data_win_eventdata_targetFilename:*system.save OR data_win_eventdata_targetFilename:*security.save OR data_win_eventdata_targetFilename:*\config\SAM*))
    pivot_on:
    - host
    window: 2h
  - name: Relay and Kerberos abuse tooling execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\(RemoteKrbRelay|KrbRelay|KrbRelayUp|Rubeus|Coercer|PetitPotam|Inveigh)[^\]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Rr]emote[Kk]rb[Rr]elay|[Kk]rb[Rr]elay|[Pp]etit[Pp]otam|[Cc]oercer).*/)
    pivot_on:
    - host
    window: 2h
  - name: SMB connections from non-svchost processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445" AND NOT data_win_eventdata_image:/.*\svchost\.exe/ AND NOT data_win_eventdata_image:"System"
    pivot_on:
    - host
    window: 1h
  - name: Remote registry service activation and remote service creation
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]emote[Rr]egistry.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee].*\\.*[Cc]reate.*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss]ervices\[Rr]emote[Rr]egistry.*/)
    pivot_on:
    - host
    window: 1h
  - name: Dumped hive temp files staged or archived
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\[Ww]indows\[Tt]emp\.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww]indows\[Tt]emp\(sam|sec|sys)\.tmp.*/)
    pivot_on:
    - host
    window: 2h
