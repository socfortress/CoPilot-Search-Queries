name: RemCom Service File Creation
id: 7eff1a7f-dd45-4c20-877a-f21e342a7611
version: 1
schema_version: "1.0"
date: "2023-08-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7eff1a7f-dd45-4c20-877a-f21e342a7611
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects default RemCom service filename which indicates RemCom service
  installation and execution. MITRE ATT&CK: T1569.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\RemComSvc.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\RemComSvc.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/kavika13/RemCom/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    RemCom Service File Creation detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - remcom
    - service
    - file_event
    - sysmon
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e36ed87-4986-482e-8e3b-5c23ffff11bf
    name: RemCom Service Installation
    reason: RemCom service install (7045) is the immediate follow-on of the binary landing.
  - id: d36f87ea-c403-44d2-aa79-1a0ac7c24456
    name: PUA - RemCom Default Named Pipe
    reason: RemCom default named pipe is created when the service runs.
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: 'PsExec file artefact: same remote-exec family, often tried alongside RemCom.'
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Impacket/Metasploit SMB service installs share the same remote service-exec pattern.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: SVCCTL named-pipe access over IPC$ is how the remote service is created.
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: Admin share write is how RemComSvc.exe is copied to the target.
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Service installed by an unusual client identifies the remote operator source.
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: Suspicious service installation generic detection corroborating the remote service.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RemCom service installation
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]/ OR data_win_eventdata_imagePath:/.*[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Processes spawned by RemComSvc
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: RemCom named pipes
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*[Rr][Ee][Mm][Cc][Oo][Mm].*/
    pivot_on: host
    window: 2h
  - name: Remote service control over IPC$
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND data_win_eventdata_relativeTargetName:/(svcctl|[Rr][Ee][Mm][Cc][Oo][Mm])/
    pivot_on: host
    window: 2h
  - name: Network logons preceding remote exec
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on: host
    window: 2h
