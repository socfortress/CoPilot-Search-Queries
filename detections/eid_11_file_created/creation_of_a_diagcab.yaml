name: Creation of a Diagcab
id: 3d0ed417-3d94-4963-a562-4a92c940656a
version: 1
schema_version: "1.0"
date: "2022-06-08"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3d0ed417-3d94-4963-a562-4a92c940656a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of diagcab file, which could be caused by some legitimate
  installer or is a sign of exploitation (review the filename and its location).

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.diagcab"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*.diagcab'.

known_false_positives: >
  Legitimate microsoft diagcab. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://threadreaderapp.com/thread/1533879688141086720.html

response:
  message: >
    Creation of a Diagcab detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - diagcab
    - file_event
    - sysmon
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ii][Aa][Gg][Cc][Aa][Bb]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dc4576d4-7467-424f-9eee-fd2b02855fe0
    name: Suspicious Cabinet File Execution Via Msdt.EXE
    reason: 'Direct follow-on: a dropped .diagcab is launched with msdt.exe /cab, which is how the troubleshooting pack''s embedded PowerShell actually runs.'
  - id: 9c8c7000-3065-44a8-a555-79bcba5d9955
    name: MSDT Execution Via Answer File
    reason: Sibling msdt.exe abuse path (/af answer file) that runs a diagnostic pack, often alongside a dropped diagcab.
  - id: f3d39c45-de1a-4486-a687-ab126124f744
    name: Sdiagnhost Calling Suspicious Child Process
    reason: The diagcab payload executes inside sdiagnhost.exe; suspicious children of it confirm the pack was weaponised rather than a legitimate installer.
  - id: 7a74da6b-ea76-47db-92cc-874ad90df734
    name: Suspicious MSDT Parent Process
    reason: Shows msdt.exe spawned by an office, script or shell parent, the usual delivery chain for a diagcab/MSDT lure.
  - id: ec8c4047-fad9-416a-8c81-0f479353d7f6
    name: Diagnostic Library Sdiageng.DLL Loaded By Msdt.EXE
    reason: Image-load evidence that msdt.exe began executing a diagnostic package after the diagcab was written.
  - id: 318557a5-150c-4c8d-b70e-a9910e199857
    name: File Creation In Suspicious Directory By Msdt.EXE
    reason: 'Post-execution: the diagnostic pack dropping files into startup or temp locations to stage payloads.'
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: Same msdt.exe execution primitive abused for arbitrary command execution, a likely next step after the diagcab drops.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: msdt.exe launched with a cab or answer file
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*.diagcab* OR data_win_eventdata_commandLine:*\/cab* OR data_win_eventdata_commandLine:*\/af*)
    pivot_on:
    - host
    window: 1h
  - name: sdiagnhost.exe spawning shells or script engines
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections from msdt/sdiagnhost
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Files written by the process that created the diagcab (archives, scripts, lures)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.diagcab OR data_win_eventdata_targetFilename:*.zip OR data_win_eventdata_targetFilename:*.iso OR data_win_eventdata_targetFilename:*.lnk OR data_win_eventdata_targetFilename:*.ps1 OR data_win_eventdata_targetFilename:*.hta OR data_win_eventdata_targetFilename:*.js)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks from diagnostic pack execution
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*TS_* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*FromBase64String*)
    pivot_on:
    - host
    window: 1h
