name: EVTX Created In Uncommon Location
id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
version: 1
schema_version: "1.0"
date: "2024-03-26"
author: D3F7A5105
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of new files with the ".evtx" extension in non-common or
  non-standard location. This could indicate tampering with default EVTX
  locations in order to evade security controls or simply exfiltration of event
  log to search for sensitive information within. Note that backup software and
  legitimate administrator might perform similar actions during troubleshooting.
  MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.evtx"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "C:\\\\Windows\\\\System32\\\\winevt\\\\Logs\\\\*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "C:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Containers\\\\BaseImages\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\Windows\\\\System32\\\\winevt\\\\Logs\\\\"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*.evtx'; data_win_eventdata_targetFilename matches
  'C:\Windows\System32\winevt\Logs\*'; data_win_eventdata_targetFilename matches
  'C:\ProgramData\Microsoft\Windows\Containers\BaseImages\*', among other
  conditions.

known_false_positives: >
  Administrator or backup activity. An unknown bug seems to trigger the Windows
  "svchost" process to drop EVTX files in the "C:\Windows\Temp" directory in the
  form "<log_name">_<uuid>.evtx". See
  https://superuser.com/questions/1371229/low-disk-space-after-filling-up-c-windows-temp-with-evtx-and-txt-files.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/win32/eventlog/eventlog-key
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    EVTX Created In Uncommon Location detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1685.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - uncommon
    - location
    - file_event
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ee][Vv][Tt][Xx]/ AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Ll][Oo][Gg][Ss]\\.*/ OR (data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr][Ss]\\[Bb][Aa][Ss][Ee][Ii][Mm][Aa][Gg][Ee][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Ll][Oo][Gg][Ss][\\]/))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
