name: EVTX Created In Uncommon Location
id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
version: 1
schema_version: "1.0"
date: "2024-03-26"
author: D3F7A5105
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of new files with the ".evtx" extension in non-common or
  non-standard location. This could indicate tampering with default EVTX
  locations in order to evade security controls or simply exfiltration of event
  log to search for sensitive information within. Note that backup software and
  legitimate administrator might perform similar actions during troubleshooting.
  MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.evtx"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "C:\\\\Windows\\\\System32\\\\winevt\\\\Logs\\\\*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "C:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Containers\\\\BaseImages\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\Windows\\\\System32\\\\winevt\\\\Logs\\\\"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*.evtx'; data_win_eventdata_targetFilename matches
  'C:\Windows\System32\winevt\Logs\*'; data_win_eventdata_targetFilename matches
  'C:\ProgramData\Microsoft\Windows\Containers\BaseImages\*', among other
  conditions.

known_false_positives: >
  Administrator or backup activity. An unknown bug seems to trigger the Windows
  "svchost" process to drop EVTX files in the "C:\Windows\Temp" directory in the
  form "<log_name">_<uuid>.evtx". See
  https://superuser.com/questions/1371229/low-disk-space-after-filling-up-c-windows-temp-with-evtx-and-txt-files.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/win32/eventlog/eventlog-key
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    EVTX Created In Uncommon Location detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1685.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - uncommon
    - location
    - file_event
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ee][Vv][Tt][Xx]/ AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Ll][Oo][Gg][Ss]\\.*/ OR (data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr][Ss]\\[Bb][Aa][Ss][Ee][Ii][Mm][Aa][Gg][Ee][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Ll][Oo][Gg][Ss][\\]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: wevtutil epl/export writes .evtx copies to arbitrary paths; the same tool clearing logs afterwards is the classic export-then-wipe anti-forensics sequence.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Log export to a non-standard location is often followed by clearing or reconfiguring the live logs on the same host to cover tracks.
  - id: beaa66d6-aa1b-4e3c-80f5-e0145369bfaf
    name: Potentially Suspicious EventLog Recon Activity Using Log Query Utilities
    reason: Querying/exporting event logs (wevtutil qe/epl, Get-WinEvent) to mine for credentials and logon history precedes copying evtx out to a staging path.
  - id: 63c779ba-f638-40a0-a593-ddd45e8b1ddc
    name: EventLog EVTX File Deleted
    reason: Deleting evtx files from the default Logs directory after a copy was made elsewhere completes the copy-and-destroy tampering pattern.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disabling channels via wevtutil sl /e:false is a co-occurring defense-impairment step by an actor already handling event log files.
  - id: ba226dcf-d390-4642-b9af-b534872f1156
    name: Windows Event Log Access Tampering Via Registry
    reason: Redirecting or restricting event log channel access/file paths in the registry is the persistent form of relocating evtx files out of the default location.
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Registry-based disabling of logging is a sibling defense-impairment technique commonly paired with relocated or exported evtx files.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: If the evtx copy is for exfiltration, it is typically archived into a zip in a staging folder before leaving the host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Event log export or query tooling run on this host
    query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Ee][Pp][Ll] .*/ OR data_win_eventdata_commandLine:/.* [Ee][Xx][Pp][Oo][Rr][Tt]-[Ll][Oo][Gg] .*/ OR data_win_eventdata_commandLine:/.* [Qq][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Qq][Uu][Ee][Rr][Yy]-[Ee][Vv][Ee][Nn][Tt][Ss] .*/)) OR (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ww][Ii][Nn][Ee][Vv][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt][Ee][Vv][Tt][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Ee][Vv][Tt]\[Ll][Oo][Gg][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Archive or copy of evtx files for staging
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*.[Ee][Vv][Tt][Xx].*/) AND ((data_win_eventdata_image:/.*\[Cc][Mm][Dd].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Xx][Cc][Oo][Pp][Yy].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\7[Zz].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Rr][Aa][Rr].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ww][Ii][Nn][Rr][Aa][Rr].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Tt][Aa][Rr].[Ee][Xx][Ee]/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm].*/))) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*.[Zz][Ii][Pp].*/ OR data_win_eventdata_targetFilename:/.*.7[Zz].*/ OR data_win_eventdata_targetFilename:/.*.[Rr][Aa][Rr].*/ OR data_win_eventdata_targetFilename:/.*.[Cc][Aa][Bb].*/))
    pivot_on:
    - host
    window: 2h
  - name: Event log clearing, disabling or evtx deletion on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Cc][Ll] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg] .*/ OR data_win_eventdata_commandLine:/.* /[Ee]:[Ff][Aa][Ll][Ss][Ee].*/)) OR (data_win_system_eventID:"23" AND (data_win_eventdata_targetFilename:/.*.[Ee][Vv][Tt][Xx].*/)) OR (data_win_system_eventID:"26" AND (data_win_eventdata_targetFilename:/.*.[Ee][Vv][Tt][Xx].*/)) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_targetObject:/.*[Mm][Ii][Nn][Ii][Nn][Tt].*/))
    pivot_on:
    - host
    window: 4h
  - name: Outbound transfer tooling after evtx handling
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\[Cc][Uu][Rr][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Rr][Cc][Ll][Oo][Nn][Ee].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ss][Cc][Pp].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ff][Tt][Pp].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]/) OR (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/))) OR (data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Cc][Uu][Rr][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Rr][Cc][Ll][Oo][Nn][Ee].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\7[Zz].[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 6h
