name: UAC Bypass Using Windows Media Player - File
id: 68578b43-65df-4f81-9a9b-92f32711a951
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 68578b43-65df-4f81-9a9b-92f32711a951
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using Windows Media Player osksupport.dll
  (UACMe 32). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\OskSupport.dll"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\system32\\DllHost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_targetFilename:
                          value: "C:\\Program Files\\Windows Media Player\\osk.exe"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Users\*'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\OskSupport.dll'; data_win_eventdata_image equals
  'C:\Windows\system32\DllHost.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using Windows Media Player - File detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - media
    - player
    - file_event
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Oo][Ss][Kk][Ss][Uu][Pp][Pp][Oo][Rr][Tt]\.[Dd][Ll][Ll]/) OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Mm][Ee][Dd][Ii][Aa] [Pp][Ll][Aa][Yy][Ee][Rr]\\[Oo][Ss][Kk]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5f9db380-ea57-4d1e-beab-8a2d33397e93
    name: UAC Bypass Using Windows Media Player - Registry
    reason: 'Same UACMe 32 chain: the registry step that redirects the Windows Media Player osk.exe lookup accompanies the OskSupport.dll drop.'
  - id: 0058b9e5-bcd7-40d4-9205-95ca5a16d7b2
    name: UAC Bypass Using Windows Media Player - Process
    reason: 'Follow-on: the elevated wmplayer/osk process launch that loads the dropped OskSupport.dll.'
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe method 32 is delivered by the Akagi tool; its execution precedes the file drop.
  - id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
    name: Dllhost.EXE Execution Anomaly
    reason: The rule second branch is DllHost writing osk.exe; anomalous dllhost activity corroborates elevated COM abuse.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: OskSupport.dll load into elevated process
    query: data_win_system_eventID:7 AND data_win_eventdata_imageLoaded:/.*[Oo]sk[Ss]upport\.dll.*/
    pivot_on: host
    window: 1h
  - name: Process launches from Windows Media Player dir
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]indows [Mm]edia [Pp]layer.*/
    pivot_on: host
    window: 1h
  - name: Registry edits to osk or wmplayer keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*[Oo]sk.*/ OR /.*[Ww]indows [Mm]edia [Pp]layer.*/)
    pivot_on: host
    window: 1h
  - name: Elevated shell spawned by osk or dllhost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\osk\.exe/ OR /.*\\[Dd]ll[Hh]ost\.exe/) AND data_win_eventdata_image:(/.*\\cmd\.exe/ OR /.*\\powershell\.exe/)
    pivot_on: host
    window: 1h
