name: NTDS.DIT Creation By Uncommon Parent Process
id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a file named "ntds.dit" (Active Directory Database) by an
  uncommon parent process or directory. MITRE ATT&CK: T1003.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\ntds.dit"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\httpd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\nginx.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\php-cgi.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\w3wp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\apache*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\tomcat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\AppData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\PerfLogs\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\ntds.dit'; data_win_eventdata_parentImage matches '*\cscript.exe';
  data_win_eventdata_parentImage matches '*\httpd.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/ntds.dit-enumeration
  - https://www.n00py.io/2022/03/manipulating-user-passwords-without-mimikatz/
  - https://pentestlab.blog/tag/ntds-dit/
  - https://github.com/samratashok/nishang/blob/414ee1104526d7057f9adaeee196d91ae447283e/Gather/Copy-VSS.ps1
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    NTDS.DIT Creation By Uncommon Parent Process detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. MITRE ATT&CK: T1003.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.003
  custom_tags:
    - uncommon
    - parent
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]/ AND (data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Hh][Tt][Tt][Pp][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Nn][Gg][Ii][Nn][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Hh][Pp]-[Cc][Gg][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt].*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)

