name: Cred Dump Tools Dropped Files
id: 8fbf3271-1ef6-4e94-8210-03c2317947f6
version: 1
schema_version: "1.0"
date: "2025-10-25"
author: Teymur Kheirkhabarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8fbf3271-1ef6-4e94-8210-03c2317947f6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Files with well-known filenames (parts of credential dump software or files
  produced by them) creation. MITRE ATT&CK: T1003.001, T1003.002, T1003.003,
  T1003.004, T1003.005.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\fgdump-log*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\kirbi*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\pwdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\pwhashes*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\wce_ccache*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\wce_krbtkts*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\cachedump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\cachedump64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\DumpExt.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\DumpSvc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Dumpy.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\fgexec.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\lsremora.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\lsremora64.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\NTDS.out"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\procdump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\procdump64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\procdump64a.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\pstgdump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\pwdump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\SAM.out"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\SECURITY.out"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\servpw.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\servpw64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\SYSTEM.out"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\test.pwd"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\wceaux.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\fgdump-log*'; data_win_eventdata_targetFilename matches '*\kirbi*';
  data_win_eventdata_targetFilename matches '*\pwdump*', among other conditions.

known_false_positives: >
  Legitimate Administrator using tool for password recovery. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/003/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/005/

response:
  message: >
    Cred Dump Tools Dropped Files detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.001, T1003.002, T1003.003, T1003.004, T1003.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1003.002
    - T1003.003
    - T1003.004
    - T1003.005
  custom_tags:
    - tools
    - dropped
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ff][Gg][Dd][Uu][Mm][Pp]-[Ll][Oo][Gg].*/ OR data_win_eventdata_targetFilename:/.*\\[Kk][Ii][Rr][Bb][Ii].*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ww][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ww][Hh][Aa][Ss][Hh][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Cc][Ee]_[Cc][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Cc][Ee]_[Kk][Rr][Bb][Tt][Kk][Tt][Ss].*/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Uu][Mm][Pp][Ee][Xx][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Uu][Mm][Pp][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Uu][Mm][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Ff][Gg][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Ll][Ss][Rr][Ee][Mm][Oo][Rr][Aa]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ll][Ss][Rr][Ee][Mm][Oo][Rr][Aa]64\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Tt][Dd][Ss]\.[Oo][Uu][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64[Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ss][Tt][Gg][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ww][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Oo][Uu][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Oo][Uu][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Ee][Rr][Vv][Pp][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Ee][Rr][Vv][Pp][Ww]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\.[Oo][Uu][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Ss][Tt]\.[Pp][Ww][Dd]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Cc][Ee][Aa][Uu][Xx]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: A dropped procdump.exe/procdump64.exe is typically run next against lsass to write the memory dump
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Execution of the Sysinternals binary whose file drop (procdump*.exe) triggered this alert
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: kirbi/ticket files and pwdump-style outputs are Mimikatz/Kekeo artifacts; the tool run produces or consumes them
  - id: 7aa7009a-28b9-4344-8c1f-159489a390df
    name: HackTool - Windows Credential Editor (WCE) Execution
    reason: wce_ccache, wce_krbtkts and wceaux.dll dropped files are WCE output; execution of WCE is the direct precursor
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: NTDS.out/SAM.out/SYSTEM.out/SECURITY.out are the dump files produced when ntdsutil/hive export is run on a DC
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: SAM.out/SYSTEM.out/SECURITY.out files result from copying registry hives or shadow-copy SAM for offline hash extraction
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Alternate way to obtain locked SAM/NTDS data that results in the same dropped hive/dump files
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Process access to lsass by the dropped tool is the co-occurring step that harvests credentials
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access or memory-dump tool execution
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg].*/))
    pivot_on:
    - host
    window: 1h
  - name: Registry hive / NTDS extraction commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm]\\(([Ss][Aa][Mm])|([Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])|([Ss][Yy][Ss][Tt][Ee][Mm])).*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*[Vv][Ss][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Staging of dump output files and archiving
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Zz][Ii][Pp]|[Dd][Aa][Tt])/ OR data_win_eventdata_targetFilename:/.*\.([Kk][Ii][Rr][Bb][Ii]|[Cc][Cc][Aa][Cc][Hh][Ee])/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7z|7za|[Ww]in[Rr][Aa][Rr]|[Rr]ar)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Remote execution and share transfer for lateral spread
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] +[Uu][Ss][Ee].*/)) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"135"))
    pivot_on:
    - host
    window: 4h
  - name: Network logons by the account after credential theft
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
