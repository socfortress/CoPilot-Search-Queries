name: HackTool - Inveigh Execution Artefacts
id: bb09dd3e-2b78-4819-8e35-a7c1b874e449
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bb09dd3e-2b78-4819-8e35-a7c1b874e449
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the presence and execution of Inveigh via dropped artefacts. MITRE
  ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh-Log.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh-Cleartext.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh-NTLMv1Users.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh-NTLMv2Users.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh-NTLMv1.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh-NTLMv2.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh-FormInput.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh.ps1"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Inveigh-Relay.ps1"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Inveigh-Log.txt'; data_win_eventdata_targetFilename matches
  '*\Inveigh-Cleartext.txt'; data_win_eventdata_targetFilename matches
  '*\Inveigh-NTLMv1Users.txt', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Kevin-Robertson/Inveigh/blob/29d9e3c3a625b3033cdaf4683efaafadcecb9007/Inveigh/Support/Output.cs
  - https://github.com/Kevin-Robertson/Inveigh/blob/29d9e3c3a625b3033cdaf4683efaafadcecb9007/Inveigh/Support/Control.cs
  - https://thedfirreport.com/2020/11/23/pysa-mespinoza-ransomware/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    HackTool - Inveigh Execution Artefacts detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1219.002
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - hacktool
    - inveigh
    - artefacts
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]-[Ll][Oo][Gg]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]-[Cc][Ll][Ee][Aa][Rr][Tt][Ee][Xx][Tt]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]-[Nn][Tt][Ll][Mm][Vv]1[Uu][Ss][Ee][Rr][Ss]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]-[Nn][Tt][Ll][Mm][Vv]2[Uu][Ss][Ee][Rr][Ss]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]-[Nn][Tt][Ll][Mm][Vv]1\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]-[Nn][Tt][Ll][Mm][Vv]2\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]-[Ff][Oo][Rr][Mm][Ii][Nn][Pp][Uu][Tt]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]-[Rr][Ee][Ll][Aa][Yy]\.[Pp][Ss]1/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
    name: HackTool - Inveigh Execution
    reason: 'Same tool seen from process creation: the launch (Inveigh.exe/Invoke-Inveigh) that precedes the log and hash files dropped to disk.'
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: Inveigh-Relay and sibling tools (Responder, ntlmrelayx) run together to relay the NTLM hashes Inveigh captures.
  - id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
    name: NetNTLM Downgrade Attack
    reason: Poisoners are often paired with forcing NTLMv1/LM so captured challenge-response hashes are easier to crack.
  - id: 39b31e81-5f5f-4898-9c0e-2160cfc0f9bf
    name: HackTool - Hashcat Password Cracker Execution
    reason: Inveigh-NTLMv2.txt hashes are cracked offline next, often with hashcat on the same compromised host.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Captured or relayed NTLM material is reused as a pass-the-hash logon against other hosts.
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Relayed or cracked credentials are typically used with Impacket exec tools for lateral movement.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Remote service execution with harvested credentials is the common follow-on (as in the PYSA case cited).
  - id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
    name: Writing Local Admin Share
    reason: Relayed admin authentication leads to files written over ADMIN$/C$ shares for payload staging.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Inveigh/Responder tool execution on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ii]nveigh.*/ OR data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ii]nveigh|[Ii]nveigh|[Ii]nveigh[Rr]elay|[Rr]esponder).*/ OR data_win_eventdata_commandLine:/.*(-LLMNR|-NBNS|-mDNS|-SMB|-ConsoleOutput).*[Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Listener/poisoning network activity (LLMNR, NBNS, mDNS, SMB, HTTP) from the dropper process
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5355" OR data_win_eventdata_destinationPort:"137" OR data_win_eventdata_destinationPort:"5353" OR data_win_eventdata_sourcePort:"445" OR data_win_eventdata_sourcePort:"5355" OR data_win_eventdata_sourcePort:"137") AND (data_win_eventdata_image:/.*\\(powershell|pwsh|[Ii]nveigh|cmd|rundll32)\.exe/ OR data_win_eventdata_image:/.*\\[Ii]nveigh.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks loading or running Inveigh
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ii]nvoke-[Ii]nveigh|[Ii]nveigh|[Ss]tart-[Ii]nveigh|[Gg]et-[Ii]nveigh|NTLMv2|[Ll]LMNR[Ss]poof).*/
    pivot_on:
    - host
    window: 2h
  - name: Hash cracking or credential-file staging after capture
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Hh]ashcat|[Jj]ohn|[Jj]ohn-?the-?[Rr]ipper)[^\\]*\.exe/ OR data_win_eventdata_commandLine:/.*(-m 5600|-m 5500|[Nn][Tt][Ll][Mm]v2|[Nn][Tt][Ll][Mm]v1|[Ii]nveigh-[Nn][Tt][Ll][Mm]).*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Nn][Tt][Ll][Mm]|[Hh]ashes|[Cc]leartext|[Cc]redentials|[Pp]otfile).*\.([Tt][Xx][Tt]|[Zz][Ii][Pp]|[Ll][Oo][Gg])/)
    pivot_on:
    - host
    window: 4h
  - name: Admin-share and remote-service lateral movement with captured credentials
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(ADMIN\$|C\$)\\.*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp]s[Ee]xec[^\\]*|[Ww]mic|[Ss]c)\.exe/ OR data_win_eventdata_parentImage:/.*\\[Ww]mi[Pp]rv[Ss][Ee]\.exe/) AND data_win_eventdata_commandLine:/.*(\\\\|[Aa]ccepteula|[Pp]rocess [Cc]all [Cc]reate|[Cc]reate [Bb]in[Pp]ath).*/)
    pivot_on:
    - host
    window: 4h
