name: Potential Hidden Directory Creation Via NTFS INDEX_ALLOCATION Stream
id: a8f866e1-bdd4-425e-a27a-37619238d9c7
version: 1
schema_version: "1.0"
date: "2023-10-09"
author: Scoubi (@ScoubiMtl)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a8f866e1-bdd4-425e-a27a-37619238d9c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of hidden file/folder with the "::$index_allocation"
  stream. Which can be used as a technique to prevent access to folder and files
  from tooling such as "explorer.exe" and "powershell.exe". MITRE ATT&CK:
  T1564.004.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*::$index_allocation*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*::$index_allocation*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/pfiatde/status/1681977680688738305
  - https://soroush.me/blog/2010/12/a-dotty-salty-directory-a-secret-place-in-ntfs-for-secret-files/
  - https://sec-consult.com/blog/detail/pentesters-windows-ntfs-tricks-collection/
  - https://github.com/redcanaryco/atomic-red-team/blob/5c3b23002d2bbede3c07e7307165fc2a235a427d/atomics/T1564.004/T1564.004.md#atomic-test-5---create-hidden-directory-via-index_allocation
  - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-fscc/c54dec26-1551-4d3a-a0ea-4fa40f848eb3
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Potential Hidden Directory Creation Via NTFS INDEX_ALLOCATION Stream
    detected on host $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1564.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - hidden
    - directory
    - index
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*::\$[Ii][Nn][Dd][Ee][Xx]_[Aa][Ll][Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0900463c-b33b-49a8-be1d-552a3b553dae
    name: Potential Hidden Directory Creation Via NTFS INDEX_ALLOCATION Stream - CLI
    reason: Process-creation (CLI) view of the same ::$index_allocation mkdir; names the command line and parent
  - id: 573df571-a223-43bc-846e-3f98da481eca
    name: Creation Of a Suspicious ADS File Outside a Browser Download
    reason: 'Alternate-data-stream creation by a non-browser: sibling NTFS hiding trick on the same host'
  - id: b69888d4-380c-45ce-9cf9-d9ce46e67821
    name: Hidden Executable In NTFS Alternate Data Stream
    reason: Executable stored in an ADS, the payload commonly stashed once a hidden location exists
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: 'Execution from alternate data streams: the run phase after hiding a payload'
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: attrib-based hiding of files and directories, a parallel stealth technique often paired with this one
  - id: 4281cb20-2994-4580-aa63-c8b86d019934
    name: Hiding Files with Attrib.exe
    reason: Second attrib hiding detection; covers +h/+s variants on the same host
  - id: efec536f-72e8-4656-8960-5e85d091345b
    name: Set Suspicious Files as System Files Using Attrib.EXE
    reason: Marking suspicious files as system files to hide them, same stealth intent
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands creating or addressing ::$index_allocation / ADS paths, and stream-hash events
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*::\$[Ii][Nn][Dd][Ee][Xx]_[Aa][Ll][Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*:\$[Dd][Aa][Tt][Aa].*/)) OR data_win_system_eventID:"15"
    pivot_on:
    - host
    window: 1h
  - name: attrib used to hide files or directories
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Tt][Tt][Rr][Ii][Bb]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.* [+\/-]([Hh]|[Ss]).*/
    pivot_on:
    - host
    window: 2h
  - name: Files written into user-writable staging locations by shell and script hosts
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/) AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\.*|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*)/
    pivot_on:
    - host
    window: 2h
  - name: Archive / staging tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\7[Zz][Aa]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|\.7[Zz]|\.[Rr][Aa][Rr]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence written on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]|[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\).*/
    pivot_on:
    - host
    window: 2h
