name: CVE-2021-44077 POC Default Dropped File
id: 7b501acf-fa98-4272-aa39-194f82edc8a3
version: 1
schema_version: "1.0"
date: "2022-06-06"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7b501acf-fa98-4272-aa39-194f82edc8a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of "msiexec.exe" in the "bin" directory of the
  ManageEngine SupportCenter Plus (Related to CVE-2021-44077) and public POC
  available (See references section).

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\ManageEngine\\\\SupportCenterPlus\\\\bin\\\\msiexec.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\ManageEngine\SupportCenterPlus\bin\msiexec.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/06/06/will-the-real-msiexec-please-stand-up-exploit-leads-to-data-exfiltration/
  - https://github.com/horizon3ai/CVE-2021-44077/blob/b7a48e25824e8ead95e028475c7fd0e107e6e6bf/exploit.py

response:
  message: >
    CVE-2021-44077 POC Default Dropped File detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - default
    - dropped
    - file_event
    - sysmon
    - execution
    - cve_2021_44077
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Mm][Aa][Nn][Aa][Gg][Ee][Ee][Nn][Gg][Ii][Nn][Ee]\\[Ss][Uu][Pp][Pp][Oo][Rr][Tt][Cc][Ee][Nn][Tt][Ee][Rr][Pp][Ll][Uu][Ss]\\[Bb][Ii][Nn]\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cea2b7ea-792b-405f-95a1-b903ea06458f
    name: Suspicious Child Process Of Manage Engine ServiceDesk
    reason: Same Java-hosted ManageEngine family; after the exploit drops msiexec.exe, the Java service spawns shells/LOLBins - the execution step that follows this file drop.
  - id: 58d8341a-5849-44cd-8ac8-8b020413a31b
    name: Mint Sandstorm - ManageEngine Suspicious Process Execution
    reason: Post-exploitation process execution from the ManageEngine process tree, the direct follow-on to the CVE-2021-44077 payload landing.
  - id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
    name: Potential MsiExec Masquerading
    reason: The dropped file is a fake msiexec.exe outside System32; its launch is the masquerading execution of the payload dropped here.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: The DFIR-report intrusion followed the exploit with webshell-style hands-on commands from the Java/web service.
  - id: f64e5c19-879c-4bae-b471-6d84c8339677
    name: Webshell Tool Reconnaissance Activity
    reason: Whoami/net/ipconfig style recon issued via the compromised web service right after initial access.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain/DC discovery is the typical first lateral-movement preparation after the foothold on the ManageEngine server.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Credential theft from the compromised server (SYSTEM-level service) is the expected escalation after initial access.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: The intrusion in the referenced report progressed to AD database theft and exfiltration.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Fake msiexec.exe executed from the ManageEngine bin directory
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm][Aa][Nn][Aa][Gg][Ee][Ee][Nn][Gg][Ii][Nn][Ee]\\[Ss][Uu][Pp][Pp][Oo][Rr][Tt][Cc][Ee][Nn][Tt][Ee][Rr][Pp][Ll][Uu][Ss]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Shells and recon tools spawned by Java / ManageEngine service
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Jj][Aa][Vv][Aa]|[Jj][Aa][Vv][Aa][Ww]|[Tt][Oo][Mm][Cc][Aa][Tt].*|[Mm][Aa][Nn][Aa][Gg][Ee][Ee][Nn][Gg][Ii][Nn][Ee].*)\.?[Ee]?[Xx]?[Ee]?/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]1?|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping and AD database access after compromise
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*comsvcs*MiniDump* OR data_win_eventdata_commandLine:*ntdsutil* OR data_win_eventdata_commandLine:*procdump*lsass* OR data_win_eventdata_commandLine:*[Ss]ekurlsa*))
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections initiated by the dropped msiexec or Java service
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Ss][Uu][Pp][Pp][Oo][Rr][Tt][Cc][Ee][Nn][Tt][Ee][Rr][Pp][Ll][Uu][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Jj][Aa][Vv][Aa][Ww]?\.[Ee][Xx][Ee]/) AND data_win_eventdata_destinationIsIpv6:"false" AND NOT data_win_eventdata_destinationIp:(10.* OR 192.168.* OR 127.*)
    pivot_on:
    - host
    window: 2h
  - name: Other files dropped into ManageEngine directories (webshells, tools)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Mm][Aa][Nn][Aa][Gg][Ee][Ee][Nn][Gg][Ii][Nn][Ee]\\.*\.([Jj][Ss][Pp][Xx]?|[Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Ww][Aa][Rr])/
    pivot_on:
    - host
    window: 4h
