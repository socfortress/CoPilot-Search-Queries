name: Publisher Attachment File Dropped In Suspicious Location
id: 3d2a2d59-929c-4b78-8c1a-145dfe9e07b1
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3d2a2d59-929c-4b78-8c1a-145dfe9e07b1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of files with the ".pub" extension in suspicious or uncommon
  locations. This could be a sign of attackers abusing Publisher documents.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*C:\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.pub"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\*'; data_win_eventdata_targetFilename matches
  '*\Users\Public\*'; data_win_eventdata_targetFilename matches
  '*\Windows\Temp\*', among other conditions.

known_false_positives: >
  Legitimate usage of ".pub" files from those locations. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/EmericNasi/status/1623224526220804098

response:
  message: >
    Publisher Attachment File Dropped In Suspicious Location detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - publisher
    - attachment
    - dropped
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\[Tt][Ee][Mm][Pp]\\.*/) AND data_win_eventdata_targetFilename:/.*\.[Pp][Uu][Bb]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3b3c7f55-f771-4dd6-8a6e-08d057a17caf
    name: Arbitrary File Download Via MSPUB.EXE
    reason: MSPUB.EXE used as a download LOLBin is the sibling Publisher abuse; check whether the same host also pulled payloads via mspub.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Opening the dropped .pub makes MSPUB a malicious Office parent; a script or shell child confirms the lure was executed.
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Office app fetching an arbitrary file after the .pub opens is the typical second-stage download from a Publisher lure.
  - id: Windows-Office-Product-Spawned-Child-Process-For-Download
    name: Windows Office Product Spawned Child Process For Download
    reason: Office product spawning a downloading child is the follow-on once the Publisher document is opened.
  - id: 7fd164ba-126a-4d9c-9392-0d4f7c243df0
    name: OneNote Attachment File Dropped In Suspicious Location
    reason: OneNote attachment dropped in the same temp locations is the parallel mail-lure vector; campaigns often mix both.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Publisher spawning child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Publisher outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Script and LOLBin execution referencing .pub or user temp
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*(\.[Pp][Uu][Bb]|[Aa]pp[Dd]ata\\[Ll]ocal\\[Tt]emp).*/
    pivot_on: host
    window: 4h
  - name: Other lure payloads dropped to writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ii][Ss][Oo]|[Ii][Mm][Gg]|[Ll][Nn][Kk]|[Jj][Ss]|[Vv][Bb][Ss]|[Hh][Tt][Aa]|[Ww][Ss][Ff]|[Dd][Oo][Cc][Mm]|[Xx][Ll][Ss][Mm]|[Oo][Nn][Ee])/
    pivot_on: host
    window: 4h
  - name: Publisher DNS lookups
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
