name: Files With System DLL Name In Unsuspected Locations
id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
version: 1
schema_version: "1.0"
date: "2024-06-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file with the ".dll" extension that has the name of
  a System DLL in uncommon or unsuspected locations. (Outisde of "System32",
  "SysWOW64", etc.). It is highly recommended to perform an initial baseline
  before using this rule in production. MITRE ATT&CK: T1036.005.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\secur32.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\tdh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\$WINDOWS.~BT\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\$WinREAgent\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\Windows\\\\SoftwareDistribution\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\Windows\\\\uus\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\secur32.dll'; data_win_eventdata_targetFilename matches '*\tdh.dll';
  data_win_eventdata_targetFilename matches '*C:\$WINDOWS.~BT\*', among other
  conditions.

known_false_positives: >
  Third party software might bundle specific versions of system DLLs. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    Files With System DLL Name In Unsuspected Locations detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1036.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.005
  custom_tags:
    - system
    - unsuspected
    - locations
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ss][Ee][Cc][Uu][Rr]32\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Dd][Hh]\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/.*[Cc]:\\\$[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.\~[Bb][Tt]\\.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\\$[Ww][Ii][Nn][Rr][Ee][Aa][Gg][Ee][Nn][Tt]\\.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee][Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]\\.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Uu][Uu][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: 'Same DLL-planting tradecraft: a system-named DLL is dropped so a trusted binary loads it by name; this variant covers names that do not exist on disk.'
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: A DLL dropped by an archive/Office/browser process is the typical precursor that places a system-named DLL beside an attacker-chosen host exe.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Follow-on: the planted secur32/tdh-style DLL is actually loaded from a non-system path, confirming sideloading rather than a bundled copy.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: Follow-on image-load evidence that a system process loaded the masquerading DLL from a user-writable folder.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Co-occurring hijack of phantom DLL names by system binaries, the privileged counterpart of dropping system-named DLLs.
  - id: b6f91281-20aa-446a-b986-38a92813a18f
    name: DLL Search Order Hijackig Via Additional Space in Path
    reason: Another file-creation-based search-order hijack where a DLL is planted to shadow a legitimate system DLL.
  - id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
    name: Creation of WerFault.exe/Wer.dll in Unusual Folder
    reason: 'Same pattern: signed host plus system-named DLL copied to an unusual folder as a sideload bundle.'
  - id: 07a99744-56ac-40d2-97b7-2095967b0e03
    name: Potential Privilege Escalation Attempt Via .Exe.Local Technique
    reason: Alternative DLL redirection technique often paired with dropped DLLs to make a trusted exe load attacker code.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Masquerading secur32/tdh DLL actually loaded from non-system path
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Ss][Ee][Cc][Uu][Rr]32\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Dd][Hh]\.[Dd][Ll][Ll]/) AND NOT data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on:
    - host
    window: 1h
  - name: Other DLLs dropped into user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Execution from user-writable folders that could host the sideload
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: DLL proxy execution via rundll32/regsvr32 from user paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:*Users* OR data_win_eventdata_commandLine:*ProgramData* OR data_win_eventdata_commandLine:*Temp* OR data_win_eventdata_commandLine:*Public*)
    pivot_on:
    - host
    window: 2h
  - name: Persistence via Run keys or service DLL registration
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\([Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll])/)
    pivot_on:
    - host
    window: 4h
