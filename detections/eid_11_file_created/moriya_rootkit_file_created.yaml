name: Moriya Rootkit File Created
id: a1507d71-0b60-44f6-b17c-bf53220fdd88
version: 1
schema_version: "1.0"
date: "2023-05-05"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a1507d71-0b60-44f6-b17c-bf53220fdd88
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file named "MoriyaStreamWatchmen.sys" in a specific
  location. This filename was reported to be related to the Moriya rootkit as
  described in the securelist's Operation TunnelSnake report. MITRE ATT&CK:
  T1543.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_targetFilename:
              value: "C:\\Windows\\System32\\drivers\\MoriyaStreamWatchmen.sys"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename equals
  'C:\Windows\System32\drivers\MoriyaStreamWatchmen.sys'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/operation-tunnelsnake-and-moriya-rootkit/101831
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Moriya Rootkit File Created detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1543.003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - moriya
    - rootkit
    - file_event
    - sysmon
    - persistence
    - privilege_escalation
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Mm][Oo][Rr][Ii][Yy][Aa][Ss][Tt][Rr][Ee][Aa][Mm][Ww][Aa][Tt][Cc][Hh][Mm][Ee][Nn]\.[Ss][Yy][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Moriya's MoriyaStreamWatchmen.sys must be registered as a kernel service to load; sc create type= kernel is the usual install step right after the file drop.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Driver-backed rootkit persistence is a new service pointing at the dropped .sys in System32\drivers.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Operators often stage and load the rootkit driver from a temp path before or alongside copying it into System32\drivers.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: The Sysmon EID 6 driver-load that follows the file creation when the rootkit is actually started.
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: Alternative driver staging route used to install an attacker-supplied .sys without sc.exe.
  - id: 22154f0e-5132-4a54-aa78-cc62f6def531
    name: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
    reason: Loading an unsigned/unknown kernel driver on modern Windows often requires first weakening driver blocklist or signing protections.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: TunnelSnake operators spread the implant laterally with PsExec-style service execution; the rootkit drop may be the result of remote execution.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Rootkit operators blind telemetry by unloading the Sysmon filter driver after installing their own kernel component.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Moriya driver loaded or service registered
    query: (data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:*[Mm]oriya*) OR (data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:*[Mm]oriya*) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:*[Mm]oriya*)
    pivot_on:
    - host
    window: 4h
  - name: Kernel driver service created via sc.exe or driver service registry key
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*\.[Ss][Yy][Ss].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ AND data_win_eventdata_details:*.sys*)
    pivot_on:
    - host
    window: 2h
  - name: Other .sys files written to the drivers directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*\.[Ss][Yy][Ss]/
    pivot_on:
    - host
    window: 6h
  - name: Driver loads from non-standard paths
    query: data_win_system_eventID:"6" AND NOT data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/
    pivot_on:
    - host
    window: 4h
  - name: Lateral tool transfer and remote service execution preceding the drop
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:*[Pp][Ss][Ee][Xx][Ee]*  OR data_win_eventdata_parentImage:*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]* OR data_win_eventdata_parentImage:*[Ss][Vv][Cc][Hh][Oo][Ss][Tt]*)) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:("445" OR "135" OR "5985"))
    pivot_on:
    - host
    window: 6h
