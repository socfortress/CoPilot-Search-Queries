name: BloodHound Collection Files
id: 02773bed-83bf-469f-b7ff-e676e7d78bab
version: 1
schema_version: "1.0"
date: "2026-02-19"
author: C.J. May
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 02773bed-83bf-469f-b7ff-e676e7d78bab
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects default file names outputted by the BloodHound collection tool
  SharpHound. MITRE ATT&CK: T1087.001, T1087.002, T1482, T1069.001, T1069.002,
  T1059.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*BloodHound.zip"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_computers.json"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_containers.json"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_gpos.json"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_groups.json"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_ous.json"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_users.json"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\svchost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "C:\\\\Program Files\\\\WindowsApps\\\\Microsoft.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\pocket_containers.json"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*BloodHound.zip'; data_win_eventdata_targetFilename matches
  '*_computers.json'; data_win_eventdata_targetFilename matches
  '*_containers.json', among other conditions.

known_false_positives: >
  Some false positives may arise in some environment and this may require some
  tuning. Add additional filters or reduce level depending on the level of
  noise. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://academy.hackthebox.com/course/preview/active-directory-bloodhound/bloodhound--data-collection
  - https://attack.mitre.org/techniques/T1087/001/
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1482/
  - https://attack.mitre.org/techniques/T1069/001/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    BloodHound Collection Files detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1087.001, T1087.002, T1482, T1069.001, T1069.002, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.001
    - T1087.002
    - T1482
    - T1069.001
    - T1069.002
    - T1059.001
  custom_tags:
    - bloodhound
    - collection
    - file_event
    - sysmon
    - discovery
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*_[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Gg][Pp][Oo][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Gg][Rr][Oo][Uu][Pp][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Oo][Uu][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Uu][Ss][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\..*/ AND data_win_eventdata_targetFilename:/.*\\[Pp][Oo][Cc][Kk][Ee][Tt]_[Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: The collector process that writes these JSON/zip files; same host seconds earlier confirms SharpHound/BloodHound ran rather than a renamed benign file.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: Process-creation evidence of SharpHound whose output is the file set seen here; establishes who launched the collection.
  - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
    name: Detect SharpHound Command-Line Arguments
    reason: Collection-method flags (-c All, --zipfilename) explain the scope of the AD data that was dumped into these files.
  - id: 0a1255c5-d732-4b62-ac02-b5152d34fb83
    name: ADExplorer Writing Complete AD Snapshot Into .dat File
    reason: Alternative or parallel full AD dump by the same operator; both signal bulk AD mapping before targeting.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: Operators commonly pair AdFind with SharpHound for domain/trust/group enumeration in the same recon phase.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain controller and trust discovery typically precedes SharpHound collection to pick targets.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration is the Kerberoasting prerequisite that BloodHound output (kerberoastable users) feeds into.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Collected BloodHound zip/JSON is often archived for staging and exfiltration after collection.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SharpHound / BloodHound launch or collection arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|[Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Ee][Tt][Hh][Oo][Dd]|--[Zz][Ii][Pp][Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee]|[Ss][Tt][Ee][Aa][Ll][Tt][Hh]).*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell script blocks loading BloodHound/SharpHound ingestors
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Tt][Rr][Uu][Ss][Tt]|[Gg][Ee][Tt]-[Nn][Ee][Tt][Ss][Ee][Ss][Ss][Ii][Oo][Nn]|[Gg][Ee][Tt]-[Nn][Ee][Tt][Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*/
    pivot_on:
    - host
    window: 2h
  - name: Directory-service and SMB enumeration traffic from non-system processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:(389 OR 636 OR 3268 OR 3269 OR 445) AND NOT data_win_eventdata_image:/.*\\([Ll][Ss][Aa][Ss][Ss]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm])\.?[Ee]?[Xx]?[Ee]?/
    pivot_on:
    - host
    window: 1h
  - name: Collection output being archived, copied or sent off host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|_[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]|_[Uu][Ss][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]|_[Gg][Rr][Oo][Uu][Pp][Ss]\.[Jj][Ss][Oo][Nn]).*/ AND data_win_eventdata_image:/.*\\([Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|7[Zz]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Ss][Cc][Pp])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Kerberoasting, SPN and credential-access follow-on tooling
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Uu][Bb][Ee][Uu][Ss]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Ss][Ee][Tt][Ss][Pp][Nn].* -[Qq]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]).*/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
