name: Potential SAM Database Dump
id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of files that look like exports of the local SAM
  (Security Account Manager). MITRE ATT&CK: T1003.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Temp\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sam.sav"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Intel\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sam.hive"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Perflogs\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\ProgramData\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Users\\\\Public\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Local\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Roaming\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_ShadowSteal.zip"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Documents\\\\SAM.export"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\hive_sam_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sam.save*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sam.export*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\~reg_sam.save*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sam_backup*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sam.bck*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sam.backup*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Temp\sam'; data_win_eventdata_targetFilename matches '*\sam.sav';
  data_win_eventdata_targetFilename matches '*\Intel\sam', among other
  conditions.

known_false_positives: >
  Rare cases of administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/search?q=CVE-2021-36934
  - https://web.archive.org/web/20210725081645/https://github.com/cube0x0/CVE-2021-36934
  - https://www.google.com/search?q=%22reg.exe+save%22+sam
  - https://github.com/HuskyHacks/ShadowSteal
  - https://github.com/FireFart/hivenightmare
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    Potential SAM Database Dump detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - database
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\[Ss][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Ss][Aa][Vv]/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Tt][Ee][Ll]\\[Ss][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Hh][Ii][Vv][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\[Ss][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ss][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\[Ss][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Ss][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Ss][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*_[Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Ee][Aa][Ll]\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]\\[Ss][Aa][Mm]\.[Ee][Xx][Pp][Oo][Rr][Tt]/ OR data_win_eventdata_targetFilename:/.*:\\[Ss][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\\[Hh][Ii][Vv][Ee]_[Ss][Aa][Mm]_.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Ee][Xx][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\\~[Rr][Ee][Gg]_[Ss][Aa][Mm]\.[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]_[Bb][Aa][Cc][Kk][Uu][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Bb][Cc][Kk].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Bb][Aa][Cc][Kk][Uu][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: reg save of SAM/SYSTEM/SECURITY is the most common way the sam file in this rule is produced.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: esentutl /y /vss copies the locked SAM from a shadow copy, ending with the same file-creation artifact.
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Scripted SAM copying via shadow copy or raw access yields the same exported hive.
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: HiveNightmare/SeriousSAM exports shadow-copy SAM files with sibling names in the same staging directories.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Copying hives out of a VSS snapshot is the way around the file lock before the dump file appears.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Command-line copy of SAM/SYSTEM/NTDS from repair or shadow paths is the sibling credential-file theft.
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: Remote secretsdump writes SAM/SYSTEM/SECURITY hive copies to ADMIN$ or temp, matching this artifact remotely.
  - id: 8b93a509-1cb8-42e1-97aa-ee24224cdc15
    name: Sensitive File Dump Via Wbadmin.EXE
    reason: Backup-based recovery of SAM/SYSTEM/NTDS is an alternative path producing the same hive files.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive export commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* [Ss][Aa][Vv][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Ee][Xx][Pp][Oo][Rr][Tt] .*/) AND (data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\[Ss][Aa][Mm].*/)
    pivot_on:
    - host
    window: 6h
  - name: Shadow copy creation or hive copy from shadow
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Cc][Rr][Ee][Aa][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/) OR ((data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/) AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg]\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg]\[Ss][Yy][Ss][Tt][Ee][Mm].*/)))
    pivot_on:
    - host
    window: 6h
  - name: SYSTEM and SECURITY hive companion files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\[Ss][Yy][Ss][Tt][Ee][Mm].[Ss][Aa][Vv].*/ OR data_win_eventdata_targetFilename:/.*\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].[Ss][Aa][Vv].*/ OR data_win_eventdata_targetFilename:/.*\[Ss][Yy][Ss][Tt][Ee][Mm].[Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].[Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*\[Tt][Ee][Mm][Pp]\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_targetFilename:/.*\[Tt][Ee][Mm][Pp]\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_targetFilename:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_targetFilename:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/)
    pivot_on:
    - host
    window: 6h
  - name: Credential dumping tools and LSASS access
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Mm][Dd][Uu][Mm][Pp].*/)) OR (data_win_system_eventID:"10" AND (data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss].[Ee][Xx][Ee].*/))
    pivot_on:
    - host
    window: 6h
  - name: Archiving or exfiltration of the dumped hives
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.* [Aa] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Rr] .*/) OR (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Pp].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/)) AND (data_win_eventdata_commandLine:/.*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/)
    pivot_on:
    - host
    window: 6h
