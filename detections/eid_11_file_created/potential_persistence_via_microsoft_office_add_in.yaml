name: Potential Persistence Via Microsoft Office Add-In
id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: NVISO
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential persistence activity via startup add-ins that load when
  Microsoft Office starts (.wll/.xll are simply .dll fit for Word or Excel).
  MITRE ATT&CK: T1137.006.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\Microsoft\\\\Word\\\\Startup\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.wll"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\Microsoft\\\\Excel\\\\Startup\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.xll"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*Microsoft\\\\Excel\\\\XLSTART\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.xlam"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\Microsoft\\\\Addins\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.xlam"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.xla"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.ppam"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Microsoft\Word\Startup\*'; data_win_eventdata_targetFilename matches
  '*.wll'; data_win_eventdata_targetFilename matches
  '*\Microsoft\Excel\Startup\*', among other conditions.

known_false_positives: >
  Legitimate add-ins. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - Internal Research
  - https://labs.withsecure.com/publications/add-in-opportunities-for-office-persistence
  - https://github.com/redcanaryco/atomic-red-team/blob/4ae9580a1a8772db87a1b6cdb0d03e5af231e966/atomics/T1137.006/T1137.006.md
  - https://attack.mitre.org/techniques/T1137/006/

response:
  message: >
    Potential Persistence Via Microsoft Office Add-In detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1137.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137.006
  custom_tags:
    - persistence
    - microsoft
    - office
    - file_event
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Oo][Rr][Dd]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Ww][Ll][Ll]/) OR (data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Xx][Cc][Ee][Ll]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ll]/) OR (data_win_eventdata_targetFilename:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Xx][Cc][Ee][Ll]\\[Xx][Ll][Ss][Tt][Aa][Rr][Tt]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Aa][Mm]/) OR (data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Aa][Dd][Dd][Ii][Nn][Ss]\\.*/ AND (data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Aa]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Pp][Aa][Mm]/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: af4c4609-5755-42fe-8075-4effb49f5d44
    name: Microsoft Excel Add-In Loaded From Uncommon Location
    reason: 'Follow-on: the planted .xll/.xlam loading when Excel next starts proves the persistence fired.'
  - id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
    name: Uncommon File Created In Office Startup Folder
    reason: Sibling drop in the same autoload folders with a different extension.
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: Same T1137 family; attackers use either an add-in or a template/workbook in startup folders.
  - id: 3d27f6dd-1c74-4687-b4fa-ca849d128d1c
    name: Office Application Startup - Office Test
    reason: Alternate Office persistence via registry often paired with add-in drops.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: 'Follow-on: payload executing from the Office process once the add-in runs.'
  - id: b1c50487-1967-4315-a026-6491686d860e
    name: Office Macro File Creation From Suspicious Process
    reason: 'Precursor: dropper writing macro/add-in files into Office folders.'
  - id: 829a3bdf-34da-4051-9cf4-8ed221a8ae4f
    name: Microsoft Office DLL Sideload
    reason: Alternative DLL-based Office code loading used for persistence.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office apps loading add-in DLLs
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|\\[Ee][Xx][Cc][Ee][Ll]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk])\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\.([Ww][Ll][Ll]|[Xx][Ll][Ll]|[Xx][Ll][Aa][Mm]?)/
    pivot_on: host
    window: 24h
  - name: Office child process spawn
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|\\[Ee][Xx][Cc][Ee][Ll]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Network connections from Office apps
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|\\[Ee][Xx][Cc][Ee][Ll]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Office add-in registration keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Oo]ffice\\.*\\([Ee]xcel|[Ww]ord|[Pp]ower[Pp]oint)\\[Oo]ptions.*/
    pivot_on: host
    window: 24h
  - name: Files written to Office Addins/Startup folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Ss][Tt][Aa][Rr][Tt][Uu][Pp]|[Xx][Ll][Ss][Tt][Aa][Rr][Tt]|[Aa][Dd][Dd][Ii][Nn][Ss])\\.*/
    pivot_on: host
    window: 24h
