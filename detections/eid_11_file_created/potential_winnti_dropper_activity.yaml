name: Potential Winnti Dropper Activity
id: 130c9e58-28ac-4f83-8574-0a4cc913b97e
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: Alexander Rausch
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 130c9e58-28ac-4f83-8574-0a4cc913b97e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects files dropped by Winnti as described in RedMimicry Winnti playbook.
  MITRE ATT&CK: T1027.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\gthread-3.6.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\sigcmm-2.4.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Windows\\\\Temp\\\\tmp.bat"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\gthread-3.6.dll'; data_win_eventdata_targetFilename matches
  '*\sigcmm-2.4.dll'; data_win_eventdata_targetFilename matches
  '*\Windows\Temp\tmp.bat'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redmimicry.com/posts/redmimicry-winnti/#dropper
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Potential Winnti Dropper Activity detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - winnti
    - dropper
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Gg][Tt][Hh][Rr][Ee][Aa][Dd]-3\.6\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Ii][Gg][Cc][Mm][Mm]-2\.4\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Tt][Mm][Pp]\.[Bb][Aa][Tt]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 95022b85-ff2a-49fa-939a-d7b8f56eeb9b
    name: HackTool - RedMimicry Winnti Playbook Execution
    reason: 'RedMimicry Winnti playbook execution: same playbook, process level.'
  - id: 5b175490-b652-4b02-b1de-5b5b4083c5f8
    name: RedMimicry Winnti Playbook Registry Manipulation
    reason: 'RedMimicry Winnti registry manipulation: persistence by the same loader.'
  - id: 73d70463-75c9-4258-92c6-17500fe972f2
    name: Winnti Pipemon Characteristics
    reason: 'Winnti Pipemon characteristics: related Winnti backdoor behaviour.'
  - id: 3121461b-5aa0-4a41-b910-66d25524edbb
    name: Winnti Malware HK University Campaign
    reason: Winnti campaign process indicators seen alongside dropped DLLs.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution referencing the dropped files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Gg]thread-3\.6.*/ OR data_win_eventdata_commandLine:/.*[Ss]igcmm-2\.4.*/ OR data_win_eventdata_commandLine:/.*[Ww]indows\\[Tt]emp\\[Tt]mp\.[Bb][Aa][Tt].*/)
    pivot_on: host
    window: 24h
  - name: DLL loads of the dropped libraries
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*([Gg]thread-3\.6|[Ss]igcmm-2\.4)\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 24h
  - name: Service or Run-key persistence by the implant
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss]ervices\\.*/ OR data_win_eventdata_targetObject:/.*\\[Rr]un\\.*/)
    pivot_on: host
    window: 24h
  - name: Discovery commands after implant start
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]hoami.*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? (user|group|view).*/ OR data_win_eventdata_commandLine:/.*[Nn]ltest.*/ OR data_win_eventdata_commandLine:/.*[Tt]asklist.*/)
    pivot_on: host
    window: 24h
  - name: Other batch files in Windows Temp
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww]indows\\[Tt]emp\\.*\.[Bb][Aa][Tt]/
    pivot_on: host
    window: 24h
