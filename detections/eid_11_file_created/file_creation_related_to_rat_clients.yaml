name: File Creation Related To RAT Clients
id: 2f3039c8-e8fe-43a9-b5cf-dcd424a2522d
version: 1
schema_version: "1.0"
date: "2024-12-19"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f3039c8-e8fe-43a9-b5cf-dcd424a2522d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  File .conf created related to VenomRAT, AsyncRAT and Lummac samples observed
  in the wild.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Roaming\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\mydata\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\datalogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\hvnc\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\dcrat\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\datalogs.conf"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\hvnc.conf"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\dcrat.conf"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Roaming\*'; data_win_eventdata_targetFilename matches '*\mydata\*';
  data_win_eventdata_targetFilename matches '*\datalogs\*', among other
  conditions.

known_false_positives: >
  Legitimate software creating a file with the same name. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.virustotal.com/gui/file/c9f9f193409217f73cc976ad078c6f8bf65d3aabcf5fad3e5a47536d47aa6761
  - https://www.virustotal.com/gui/file/e96a0c1bc5f720d7f0a53f72e5bb424163c943c24a437b1065957a79f5872675

response:
  message: >
    File Creation Related To RAT Clients detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - related
    - clients
    - file_event
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ AND (data_win_eventdata_targetFilename:/.*\\[Mm][Yy][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Aa][Tt][Aa][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Hh][Vv][Nn][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Cc][Rr][Aa][Tt]\\.*/) AND (data_win_eventdata_targetFilename:/.*\\[Dd][Aa][Tt][Aa][Ll][Oo][Gg][Ss]\.[Cc][Oo][Nn][Ff]/ OR data_win_eventdata_targetFilename:/.*\\[Hh][Vv][Nn][Cc]\.[Cc][Oo][Nn][Ff]/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Cc][Rr][Aa][Tt]\.[Cc][Oo][Nn][Ff]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 19b3806e-46f2-4b4c-9337-e3d8653245ea
    name: Lummac Stealer Activity - Execution Of More.com And Vbc.exe
    reason: The rule's own description ties the .conf drops to Lummac samples; this is the same family's process-hollowing execution chain, confirming the loader that dropped the config.
  - id: d7b50671-d1ad-4871-aa60-5aa5b331fe04
    name: Suspicious File Creation In Uncommon AppData Folder
    reason: RATs stage payloads and configs in non-standard AppData subfolders (mydata, datalogs, hvnc) just like the .conf; same host dropping other files there widens the implant footprint.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: Once the RAT config is written the client beacons to its C2 from AppData/user paths; this is the first network confirmation of an active implant.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: AsyncRAT/VenomRAT/DcRAT install persistence by pointing a Run key at the binary in AppData\Roaming, the same directory holding the .conf.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Common alternative persistence for these RAT clients is a scheduled task launching the Roaming-folder executable at logon.
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: Directly matches RAT persistence scheduling an AppData payload; follow-on to the config drop on the same host.
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: AV hits on the same host (AsyncRAT/VenomRAT/DCRat signatures) corroborate the file drop as a genuine RAT rather than a name collision.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: RAT operators and loaders add Defender exclusions for the Roaming install directory to keep the implant alive after initial execution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process that wrote the RAT config - other files created in AppData Roaming by same host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Cc][Oo][Nn][Ff]|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Pp][Ss]1|[Dd][Aa][Tt]|[Ll][Oo][Gg])/
    pivot_on:
    - host
    window: 4h
  - name: Execution of binaries from AppData Roaming (RAT client launch)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from AppData / user-writable processes (RAT C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp])\\.*/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Run key or scheduled task persistence pointing at AppData
    query: ((data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND data_win_eventdata_details:*[Aa][Pp][Pp][Dd][Aa][Tt][Aa]*) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Rr][Oo][Aa][Mm][Ii][Nn][Gg]).*/))
    pivot_on:
    - host
    window: 6h
  - name: Process injection / hollowing into trusted binaries (RAT and stealer loaders)
    query: (data_win_system_eventID:"8" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Mm][Oo][Rr][Ee]\.[Cc][Oo][Mm]|[Vv][Bb][Cc]\.[Ee][Xx][Ee]|[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee])/))
    pivot_on:
    - host
    window: 2h
