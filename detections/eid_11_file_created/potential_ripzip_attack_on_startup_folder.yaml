name: Potential RipZip Attack on Startup Folder
id: a6976974-ea6f-4e97-818e-ea08625c52cb
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: Greg (rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a6976974-ea6f-4e97-818e-ea08625c52cb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a phishing attack which expands a ZIP file containing a malicious
  shortcut. If the victim expands the ZIP file via the explorer process, then
  the explorer process expands the malicious ZIP file and drops a malicious
  shortcut redirected to a backdoor into the Startup folder. Additionally, the
  file name of the malicious shortcut in Startup folder contains
  {0AFACED1-E828-11D1-9187-B532F1E9575D} meaning the folder shortcut operation.
  MITRE ATT&CK: T1547.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\explorer.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Microsoft\Windows\Start Menu\Programs\Startup*';
  data_win_eventdata_targetFilename matches
  '*.lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}*'; data_win_eventdata_image
  matches '*\explorer.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/jonasLyk/status/1549338335243534336?t=CrmPocBGLbDyE4p6zTX1cg&s=19
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    Potential RipZip Attack on Startup Folder detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1547
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547
  custom_tags:
    - ripzip
    - attack
    - startup
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/ AND data_win_eventdata_targetFilename:/.*\.[Ll][Nn][Kk]\.\{0[Aa][Ff][Aa][Cc][Ee][Dd]1-[Ee]828-11[Dd]1-9187-[Bb]532[Ff]1[Ee]9575[Dd]\}.*/ AND data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Same Startup folder drop observed generically, catching the shortcut and any payload written beside it.
  - id: 28208707-fe31-437f-9a7f-4b1108b94d2e
    name: Suspicious Startup Folder Persistence
    reason: Persistence via Startup folder files with suspicious extensions complements the shortcut-based variant.
  - id: 74a2b37d-fea4-41e0-9ac7-c9fbcf1f60cc
    name: WinRAR Creating Files in Startup Locations
    reason: Archive tools extracting directly into Startup is the same ZIP-extraction persistence primitive.
  - id: 3215aa19-f060-4332-86d5-5602511f3ca8
    name: Suspicious LNK Double Extension File Created
    reason: The weaponised shortcut in a phishing zip commonly uses a deceptive double extension.
  - id: windows-process-creating-lnk-suspicious-location-001
    name: Windows Process Creating LNK File in Suspicious Location
    reason: Another view of the malicious shortcut being created in a persistence-prone location.
  - id: 92fa78e7-4d39-45f1-91a3-8b23f3f1088d
    name: Potential Startup Shortcut Persistence Via PowerShell.EXE
    reason: 'Alternative route to the same end state: a Startup shortcut created by script instead of archive extraction.'
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: Shortcuts in phishing archives frequently point at WebDAV/UNC payloads executed on logon.
  - id: c3d76afc-93df-461e-8e67-9b2bad3f2ac4
    name: File Explorer Folder Opened Using Explorer Folder Shortcut Via Shell
    reason: The {0AFACED1-...} shell-folder shortcut GUID is the same mechanism the RipZip filename abuses.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All file writes to Startup folders
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\.*/)
    pivot_on:
    - host
    window: 24h
  - name: Zip archives and shortcuts written to disk
    query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*.[Zz][Ii][Pp].*/ OR data_win_eventdata_targetFilename:/.*.[Rr][Aa][Rr].*/ OR data_win_eventdata_targetFilename:/.*.7[Zz].*/) OR (data_win_eventdata_targetFilename:/.*.[Ll][Nn][Kk].*/))
    pivot_on:
    - host
    window: 6h
  - name: Explorer launching shells or LOLBins with remote or temp payloads
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr].[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\[Cc][Mm][Dd].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Pp][Ww][Ss][Hh].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Mm][Ii][Cc].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\[Uu][Ss][Ee][Rr][Ss]\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*\\\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: Executables running from the Startup folder
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\.*/) OR (data_win_eventdata_commandLine:/.*\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\.*/))
    pivot_on:
    - host
    window: 24h
  - name: Run-key and scheduled task persistence on the same host
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.* /[Cc][Rr][Ee][Aa][Tt][Ee].*/))
    pivot_on:
    - host
    window: 24h
