name: CVE-2022-24527 Microsoft Connected Cache LPE
id: e0a41412-c69a-446f-8e6e-0e6d7483dad7
version: 1
schema_version: "1.0"
date: "2022-04-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e0a41412-c69a-446f-8e6e-0e6d7483dad7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects files created during the local privilege exploitation of
  CVE-2022-24527 Microsoft Connected Cache. MITRE ATT&CK: T1059.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*WindowsPowerShell\\\\Modules\\\\webAdministration\\\\webAdministration.psm1"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_user"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*AUTHORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*AUTORI*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*WindowsPowerShell\Modules\webAdministration\webAdministration.psm1';
  data_win_eventdata_user matches '*AUTHORI*'; data_win_eventdata_user matches
  '*AUTORI*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.rapid7.com/blog/post/2022/04/12/cve-2022-24527-microsoft-connected-cache-local-privilege-escalation-fixed/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    CVE-2022-24527 Microsoft Connected Cache LPE detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_user:
    $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - microsoft
    - connected
    - cache
    - file_event
    - sysmon
    - execution
    - privilege_escalation
    - cve_2022_24527
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Mm][Oo][Dd][Uu][Ll][Ee][Ss]\\[Ww][Ee][Bb][Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Ii][Oo][Nn]\\[Ww][Ee][Bb][Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Ii][Oo][Nn]\.[Pp][Ss][Mm]1/ AND _exists_:data_win_eventdata_user AND NOT (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e3845023-ca9a-4024-b2b2-5422156d5527
    name: PowerShell Module File Created By Non-PowerShell Process
    reason: 'Same primitive: the exploit plants a .psm1 in a PowerShell module path as a non-PowerShell process; this generic rule confirms the module-hijack drop.'
  - id: e8a52bbd-bced-459f-bd93-64db45ce7657
    name: Potential Suspicious PowerShell Module File Created
    reason: Co-occurring file-create view of the same planted module file, helping identify the dropper and any additional modules written alongside.
  - id: c31364f7-8be6-4b77-8483-dd2b5a7b69a3
    name: Import PowerShell Modules From Suspicious Directories - ProcCreation
    reason: 'Follow-on: the hijacked webAdministration module is auto-imported by a privileged PowerShell, and a module loaded from a nonstandard path shows the payload executing.'
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: 'Outcome of a successful LPE: a SYSTEM-level shell spawned from an unusual parent after the Connected Cache service loads the planted module.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SYSTEM-context PowerShell started on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*\.[Ee][Xx][Ee]/ AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/
    pivot_on:
    - host
    window: 1h
  - name: Other PowerShell module or script files dropped on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.psm1 OR data_win_eventdata_targetFilename:*.psd1 OR data_win_eventdata_targetFilename:*.ps1) AND NOT data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 2h
  - name: Account or admin-group changes via command line on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +(user|localgroup).*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] *[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Encoded or download-cradle PowerShell on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*\-[Ee]nc* OR *[Ee]ncodedcommand* OR *DownloadString* OR *DownloadFile* OR *[Ii]nvoke\-[Ww]eb[Rr]equest* OR *IEX*)
    pivot_on:
    - host
    window: 2h
