name: DarkGate - Drop DarkGate Loader In C:\Temp Directory
id: df49c691-8026-48dd-94d3-4ba6a79102a8
version: 1
schema_version: "1.0"
date: "2024-05-31"
author: Tomasz Dyduch, Josh Nickels
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: df49c691-8026-48dd-94d3-4ba6a79102a8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attackers attempting to save, decrypt and execute the DarkGate Loader
  in C:\temp folder. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*:\\\\temp\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.au3"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\autoit3.exe"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\temp\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*.au3"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\autoit3.exe"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*:\temp\*'; data_win_eventdata_targetFilename matches '*.au3';
  data_win_eventdata_targetFilename matches '*\autoit3.exe', among other
  conditions.

known_false_positives: >
  Unlikely legitimate usage of AutoIT in temp folders. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.bleepingcomputer.com/news/security/hackers-exploit-windows-smartscreen-flaw-to-drop-darkgate-malware/
  - https://www.trendmicro.com/en_us/research/24/c/cve-2024-21412--darkgate-operators-exploit-microsoft-windows-sma.html
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    DarkGate - Drop DarkGate Loader In C:\Temp Directory detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - darkgate
    - loader
    - directory
    - file_event
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ AND (data_win_eventdata_targetFilename:/.*\.[Aa][Uu]3/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/)) OR (data_win_eventdata_image:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ AND (data_win_eventdata_image:/.*\.[Aa][Uu]3/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1a433e1d-03d2-47a6-8063-ece992cf4e73
    name: DarkGate - Autoit3.EXE File Creation By Uncommon Process
    reason: 'Same staging step seen from the dropper side: DarkGate''s installer writes Autoit3.exe and the .au3 script, so both rules firing confirms the loader drop'
  - id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
    name: DarkGate - Autoit3.EXE Execution Parameters
    reason: 'Direct follow-on: the dropped Autoit3.exe is launched against the .au3 script, which is when the loader decrypts and runs the payload'
  - id: f4264e47-f522-4c38-a420-04525d5b880f
    name: Renamed AutoIt Execution
    reason: DarkGate copies AutoIt under other names to dodge filename detections, so the dropped interpreter may run under a different image name
  - id: windows-autoit3-execution-001
    name: Windows AutoIt3 Execution
    reason: Generic AutoIt3 process start on the host confirms the staged interpreter was actually executed after the drop
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: 'Known DarkGate post-execution behaviour: the running loader creates a local backdoor account through net.exe'
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Generic form of the DarkGate backdoor-account step if the specific DarkGate user pattern is not matched
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: DarkGate persists the AutoIt loader with a Run key so it survives reboot after the temp-directory drop
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Once the loader is running, DarkGate operators commonly perform domain and trust reconnaissance before lateral movement
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AutoIt3 or .au3 script process starts from temp/user-writable paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Aa][Uu]3.*/ OR data_win_eventdata_originalFileName:"AutoIt3.exe")
    pivot_on:
    - host
    window: 2h
  - name: Network connections from AutoIt processes (DarkGate C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Tt][Ee][Mm][Pp]\\.*\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Other files created in C:\Temp (.au3, .exe, .dll, .txt, .ps1, .vbs)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*:\\[Tt][Ee][Mm][Pp]\\.*\.([Aa][Uu]3|[Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ll][Nn][Kk]|[Mm][Ss][Ii])/
    pivot_on:
    - host
    window: 2h
  - name: Local account creation or admin group changes via net.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Aa][Dd][Mm][Ii][Nn].*\/[Aa][Dd][Dd].*/)
    pivot_on:
    - host
    window: 4h
  - name: Run key or startup persistence pointing at temp/AutoIt
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND (data_win_eventdata_details:/.*([Aa][Uu][Tt][Oo][Ii][Tt]|\.[Aa][Uu]3|[Tt][Ee][Mm][Pp]\\).*/ OR data_win_eventdata_targetObject:/.*([Aa][Uu][Tt][Oo][Ii][Tt]|[Aa][Uu]3).*/)
    pivot_on:
    - host
    window: 4h
