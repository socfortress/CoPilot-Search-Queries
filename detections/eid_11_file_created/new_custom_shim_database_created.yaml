name: New Custom Shim Database Created
id: ee63c85c-6d51-4d12-ad09-04e25877a947
version: 1
schema_version: "1.0"
date: "2023-12-06"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ee63c85c-6d51-4d12-ad09-04e25877a947
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may establish persistence and/or elevate privileges by executing
  malicious content triggered by application shims. The Microsoft Windows
  Application Compatibility Infrastructure/Framework (Application Shim) was
  created to allow for backward compatibility of software as the operating
  system codebase changes over time. MITRE ATT&CK: T1547.009.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\Windows\\\\apppatch\\\\Custom\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\Windows\\\\apppatch\\\\CustomSDB\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*:\Windows\apppatch\Custom\*'; data_win_eventdata_targetFilename matches
  '*:\Windows\apppatch\CustomSDB\*'.

known_false_positives: >
  Legitimate custom SHIM installations will also trigger this rule. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.011/T1546.011.md#atomic-test-2---new-shim-database-files-created-in-the-default-shim-database-directory
  - https://www.mandiant.com/resources/blog/fin7-shim-databases-persistence
  - https://liberty-shell.com/sec/2020/02/25/shim-persistence/
  - https://andreafortuna.org/2018/11/12/process-injection-and-persistence-using-application-shimming/
  - https://attack.mitre.org/techniques/T1547/009/

response:
  message: >
    New Custom Shim Database Created detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1547.009
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.009
  custom_tags:
    - custom
    - database
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Pp][Aa][Tt][Cc][Hh]\\[Cc][Uu][Ss][Tt][Oo][Mm]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Pp][Aa][Tt][Cc][Hh]\\[Cc][Uu][Ss][Tt][Oo][Mm][Ss][Dd][Bb]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 517490a7-115a-48c6-8862-1a481504d5a8
    name: Potential Shim Database Persistence via Sdbinst.EXE
    reason: sdbinst.exe is the installer that registers the .sdb just dropped under apppatch\Custom; process creation of it right after the file write confirms the shim is being activated, not just staged
  - id: 18ee686c-38a3-4f65-9f44-48a077141f42
    name: Uncommon Extension Shim Database Installation Via Sdbinst.EXE
    reason: Attackers rename the shim database to evade .sdb checks; sdbinst of a non-.sdb file is the evasive variant of installing the database written here
  - id: dfb5b4e8-91d0-4291-b40a-e3b0d3942c45
    name: Potential Persistence Via Shim Database Modification
    reason: Installing the custom SDB writes AppCompatFlags\InstalledSDB/Custom registry values; this is the registry side effect that makes the dropped file persistent
  - id: 6b6976a3-b0e6-4723-ac24-ae38a737af41
    name: Potential Persistence Via Shim Database In Uncommon Location
    reason: Same registration step but pointing at an SDB staged outside the default apppatch directory, a variant of the same actor tradecraft on this host
  - id: bf344fea-d947-4ef4-9192-34d008315d3a
    name: Suspicious Shim Database Patching Activity
    reason: Registry patching of AppCompatFlags for a shim entry (e.g. targeting a system binary) is the effect that makes the custom SDB inject code into the chosen process
  - id: b86852fb-4c77-48f9-8519-eb1b2c308b59
    name: Potential Persistence Via AppCompat RegisterAppRestart Layer
    reason: Another AppCompat-layer persistence abuse via the same AppCompatFlags registry area; indicates the actor is using compatibility infrastructure for persistence
  - id: b0524451-19af-4efa-a46f-562a977f792e
    name: ShimCache Flush
    reason: Flushing the shim cache (rundll32 apphelp.dll,ShimFlushCache) forces a newly installed shim to take effect and is cleanup/activation that follows shim installation
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sdbinst.exe installing a shim database
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Dd][Bb][Ii][Nn][Ss][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: AppCompatFlags custom/installed SDB registry changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\([Cc][Uu][Ss][Tt][Oo][Mm]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Dd][Ss][Dd][Bb]).*/ OR data_win_eventdata_targetObject:/.*[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll]\\\{.*/)
    pivot_on:
    - host
    window: 2h
  - name: Shim database or DLL files written outside the default shim directory
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ss][Dd][Bb]/ OR (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)))
    pivot_on:
    - host
    window: 2h
  - name: ShimCache flush or apphelp shim API usage
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*[Ss][Hh][Ii][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Ii][Mm][Ff][Ll][Uu][Ss][Hh][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Ii][Mm][Dd][Bb].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Process that wrote the SDB: script/shell parents and Sysmon-visible command lines'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*([Ss][Dd][Bb]|[Aa][Pp][Pp][Pp][Aa][Tt][Cc][Hh]|[Cc][Oo][Mm][Pp][Aa][Tt]).*/)
    pivot_on:
    - host
    window: 2h
