name: Assembly DLL Creation Via AspNetCompiler
id: 4c7f49ee-2638-43bb-b85b-ce676c30b260
version: 1
schema_version: "1.0"
date: "2023-08-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4c7f49ee-2638-43bb-b85b-ce676c30b260
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of new DLL assembly files by "aspnet_compiler.exe", which
  could be a sign of "aspnet_compiler" abuse to proxy execution through a build
  provider.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\aspnet_compiler.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Temporary ASP.NET Files\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\assembly\\\\tmp\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\aspnet_compiler.exe'; data_win_eventdata_targetFilename matches
  '*\Temporary ASP.NET Files\*'; data_win_eventdata_targetFilename matches
  '*\assembly\tmp\*', among other conditions.

known_false_positives: >
  Legitimate assembly compilation using a build provider. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - Internal Research

response:
  message: >
    Assembly DLL Creation Via AspNetCompiler detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - assembly
    - aspnetcompiler
    - file_event
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Aa][Ss][Pp]\.[Nn][Ee][Tt] [Ff][Ii][Ll][Ee][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\\[Tt][Mm][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a01b8329-5953-4f73-ae2d-aa01e1f35f00
    name: AspNetCompiler Execution
    reason: The process launch of aspnet_compiler.exe that necessarily precedes the DLL being written to Temporary ASP.NET Files; its command line shows the -v/-p source path being compiled.
  - id: 9f50fe98-fe5c-4a2d-86c7-fad7f63ed622
    name: Potentially Suspicious ASP.NET Compilation Via AspNetCompiler
    reason: 'Same invocation seen from the argument side: compilation of a source tree in a user-writable or odd path is what turns this DLL write into a build-provider proxy-execution attempt.'
  - id: 9ccba514-7cb6-4c5c-b377-700758f2f120
    name: Suspicious Child Process of AspNetCompiler
    reason: 'Follow-on: once the attacker-built assembly runs inside or beside aspnet_compiler, it spawns cmd/powershell/rundll32 children; confirms the compiled DLL was executed.'
  - id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
    name: Suspicious Msbuild Execution By Uncommon Parent Process
    reason: Sibling .NET build-tool LOLBin (T1127) used the same way to compile and run attacker code; operators often rotate between msbuild and aspnet_compiler.
  - id: 213b3148-24ea-11ec-93a2-acde48001122
    name: MSBuild Suspicious Spawned By Script Process
    reason: Co-occurring trusted-developer-utility abuse launched from a script host, a typical delivery chain preceding compiled-payload execution.
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: 'Follow-on: the freshly compiled assembly under Temporary ASP.NET Files/assembly\tmp is loaded as a module from a temp directory.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: aspnet_compiler.exe launch with its command line and parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Children spawned by aspnet_compiler.exe after compilation
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Network or DNS activity from aspnet_compiler.exe or the compiled assembly
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other .NET build tools abused to compile and run code (msbuild, csc, vbc)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Bb][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Script hosts or Office apps launching the compiler (delivery stage)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
