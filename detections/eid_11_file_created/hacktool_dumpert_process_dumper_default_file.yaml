name: HackTool - Dumpert Process Dumper Default File
id: 93d94efc-d7ad-4161-ad7d-1638c4f908d8
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 93d94efc-d7ad-4161-ad7d-1638c4f908d8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of the default dump file used by Outflank Dumpert tool. A
  process dumper, which dumps the lsass process memory. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*dumpert.dmp"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*dumpert.dmp'.

known_false_positives: >
  Very unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/outflanknl/Dumpert
  - https://unit42.paloaltonetworks.com/actors-still-exploiting-sharepoint-vulnerability/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - Dumpert Process Dumper Default File detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - dumpert
    - dumper
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Dd][Mm][Pp]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2704ab9e-afe2-4854-a3b1-0c0706d03578
    name: HackTool - Dumpert Process Dumper Execution
    reason: 'Process-creation side of the same tool: Dumpert.dll/Outflank-Dumpert.exe execution is the direct cause of the dumpert.dmp file creation.'
  - id: 3f3f3506-1895-401b-9cc3-e86b16e630d0
    name: Potential Direct Syscall of NtOpenProcess
    reason: Dumpert opens LSASS via direct/indirect syscalls to evade EDR hooks; this process-access signature is the precursor to the dump file being written.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Dumpert must obtain a read handle on lsass.exe before MiniDumpWriteDump produces the file; this is the LSASS handle-access event right before it.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Dumper tools request memory-read access masks on LSASS; co-occurs immediately before the dumpert.dmp write.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Generic file-creation detection for LSASS dump artefacts; a renamed dumpert output or a second dump by another tool confirms the credential theft.
  - id: 8fbf3271-1ef6-4e94-8210-03c2317947f6
    name: Cred Dump Tools Dropped Files
    reason: Attackers who drop Dumpert often stage other credential dump tools and their output files on the same host.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Natural follow-on: the dump is compressed before exfiltration off the host.'
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: 'Follow-on: the dumped LSASS memory is pulled from the victim over SMB to the attacker''s workstation for offline parsing.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dumpert execution or DLL load on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*[Dd][Uu][Mm][Pp].*/)) OR (data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/)
    pivot_on:
    - host
    window: 1h
  - name: Process access to lsass.exe with memory-read rights
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x1438" OR data_win_eventdata_grantedAccess:"0x143a" OR data_win_eventdata_grantedAccess:"0x1f3fff")
    pivot_on:
    - host
    window: 1h
  - name: Other memory dump files created on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Uu][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Dd][Mm][Pp]/)
    pivot_on:
    - host
    window: 2h
  - name: Archiving or staging of dump files for exfiltration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp].*/) AND (data_win_eventdata_commandLine:/.*[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*[Zz][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*7[Zz].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Network logons using the compromised account after the dump
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
