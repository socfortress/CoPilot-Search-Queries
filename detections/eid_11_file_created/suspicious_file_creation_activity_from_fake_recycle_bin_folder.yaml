name: Suspicious File Creation Activity From Fake Recycle.Bin Folder
id: cd8b36ac-8e4a-4c2f-a402-a29b8fbd5bca
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd8b36ac-8e4a-4c2f-a402-a29b8fbd5bca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file write event from/to a fake recycle bin folder that is often used
  as a staging directory for malware.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*RECYCLERS.BIN\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*RECYCLER.BIN\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*RECYCLERS.BIN\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*RECYCLER.BIN\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*RECYCLERS.BIN\*'; data_win_eventdata_image matches '*RECYCLER.BIN\*';
  data_win_eventdata_targetFilename matches '*RECYCLERS.BIN\*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.mandiant.com/resources/blog/infected-usb-steal-secrets
  - https://unit42.paloaltonetworks.com/cloaked-ursa-phishing/

response:
  message: >
    Suspicious File Creation Activity From Fake Recycle.Bin Folder detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - recycle
    - folder
    - file_event
    - sysmon
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_image:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr]\.[Bb][Ii][Nn]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ce0f04e-3efc-42af-839d-5b3a543b76c0
    name: Suspicious Process Execution From Fake Recycle.Bin Folder
    reason: Execution of a binary from the fake RECYCLER.BIN folder is the direct process-side companion signal.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: Generic execution from unusual folders catches the same staged payload.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: Network connections from the staged binary show C2 or exfiltration.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Fake recycle folders are common on removable drives; abnormal-drive LOLBin execution overlaps in USB worms.
  - id: 2c6bea3a-ef58-4f2e-a775-4928f6b7c58a
    name: Raspberry Robin Initial Execution From External Drive
    reason: Raspberry Robin-style external-drive initial execution uses the same hide-in-recycler staging.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Persistence pointing at the staged file typically follows.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution from fake recycle folders
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?\.[Bb][Ii][Nn]\\.*/)
    pivot_on: host
    window: 4h
  - name: Network connections from fake recycle folders
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?\.[Bb][Ii][Nn]\\.*/
    pivot_on: host
    window: 6h
  - name: Attribute hiding commands on recycle folders
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Tt][Tt][Rr][Ii][Bb]|[Ii][Cc][Aa][Cc][Ll][Ss]).*[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/
    pivot_on: host
    window: 4h
  - name: Registry persistence referencing recycle folders
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_details:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?\.[Bb][Ii][Nn].*/ OR data_win_eventdata_targetObject:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?\.[Bb][Ii][Nn].*/)
    pivot_on: host
    window: 6h
  - name: Executable or script files written in recycle folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?\.[Bb][Ii][Nn]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ll][Nn][Kk]|[Bb][Aa][Tt]|[Pp][Ss]1)/
    pivot_on: host
    window: 6h
