name: LiveKD Driver Creation
id: 16fe46bb-4f64-46aa-817d-ff7bec4a2352
version: 1
schema_version: "1.0"
date: "2023-05-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 16fe46bb-4f64-46aa-817d-ff7bec4a2352
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of the LiveKD driver, which is used for live kernel
  debugging.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_targetFilename:
              value: "C:\\Windows\\System32\\drivers\\LiveKdD.SYS"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\livekd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\livek64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename equals
  'C:\Windows\System32\drivers\LiveKdD.SYS'; data_win_eventdata_image matches
  '*\livekd.exe'; data_win_eventdata_image matches '*\livek64.exe'.

known_false_positives: >
  Legitimate usage of LiveKD for debugging purposes will also trigger this.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - Internal Research

response:
  message: >
    LiveKD Driver Creation detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - livekd
    - driver
    - file_event
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Ll][Ii][Vv][Ee][Kk][Dd][Dd]\.[Ss][Yy][Ss]/ AND (data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk]64\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 814ddeca-3d31-4265-8e07-8cc54fb44903
    name: LiveKD Kernel Memory Dump File Created
    reason: 'Direct follow-on: LiveKD''s purpose is to write a kernel memory dump, so a dump file created after the driver drop confirms memory capture.'
  - id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
    name: Kernel Memory Dump Via LiveKD
    reason: Same-session process-creation evidence of livekd with the -m dump option, confirming the driver was used to dump kernel memory.
  - id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
    name: Potential Memory Dumping Activity Via LiveKD
    reason: Process-creation view of livekd memory-dump command lines that explains why the driver was installed.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: 'Co-occurring: kernel drivers are registered as services, so sc.exe creating a kernel service next to the livekd drop shows driver loading.'
  - id: c7da8edc-49ae-45a2-9e61-9fd860e4e73d
    name: PUA - Sysinternals Tools Execution - Registry
    reason: 'Co-occurring: Sysinternals tools set an EulaAccepted registry value on first run, corroborating LiveKD was executed here.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Downstream objective: kernel/full memory dumps are mined for LSASS credentials, so LSASS dump files are a likely outcome.'
  - id: aba15bdd-657f-422a-bab3-ac2d2a0d6f1c
    name: Potentially Suspicious DMP/HDMP File Creation
    reason: 'Downstream: any DMP/HDMP file created by an unusual process around the driver drop is the memory dump artefact.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Downstream: dump files are compressed with 7-Zip before exfiltration.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LiveKD execution and memory-dump options
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ll][Ii][Vv][Ee][Kk][Dd]|[Ll][Ii][Vv][Ee][Kk][Dd]64)\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ll][Ii][Vv][Ee][Kk][Dd].[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Memory dump files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Dd][Mm][Pp]/)
    pivot_on: host
    window: 4h
  - name: Kernel driver service registration and driver load
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*([Tt][Yy][Pp][Ee]= [Kk][Ee][Rr][Nn][Ee][Ll]|[Tt][Yy][Pp][Ee]=[Kk][Ee][Rr][Nn][Ee][Ll]|\.[Ss][Yy][Ss]).*/) OR (data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*[Ll][Ii][Vv][Ee][Kk][Dd][Dd].[Ss][Yy][Ss]/)
    pivot_on: host
    window: 2h
  - name: Sysinternals EULA registry set (tool first run)
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss]\\.*\\[Ee][Uu][Ll][Aa][Aa][Cc][Cc][Ee][Pp][Tt][Ee][Dd]/
    pivot_on: host
    window: 4h
  - name: Archiving of dump files for staging
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Rr][Aa][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/) AND data_win_eventdata_commandLine:/.*(.[Dd][Mm][Pp]|[Dd][Uu][Mm][Pp]).*/
    pivot_on: host
    window: 6h
