name: Writing Local Admin Share
id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
version: 1
schema_version: "1.0"
date: "2022-08-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Aversaries may use to interact with a remote network share using Server
  Message Block (SMB). This technique is used by post-exploitation frameworks.
  MITRE ATT&CK: T1546.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename: "*\\\\\\\\127.0.0*"
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\ADMIN$\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\\127.0.0*'; data_win_eventdata_targetFilename matches '*\ADMIN$\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.002/T1021.002.md#atomic-test-4---execute-command-writing-output-to-local-admin-share
  - https://attack.mitre.org/techniques/T1546/002/

response:
  message: >
    Writing Local Admin Share detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.002
  custom_tags:
    - writing
    - local
    - admin
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\\\127\.0\.0.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Dd][Mm][Ii][Nn]\$\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ab9e3b40-0c85-4ba1-aede-455d226fd124
    name: Suspicious Redirection to Local Admin Share
    reason: Command-line view of redirection to \\127.0.0.1\ADMIN$, the same behaviour seen as a file create.
  - id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
    name: Wmiexec Default Output File
    reason: wmiexec writes its output to the local ADMIN$ share; this is its dedicated filename signature.
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Impacket wmiexec command line redirecting output to \\127.0.0.1\ADMIN$.
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: smbexec writes batch/output through the local admin share the same way.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Copying to/from admin shares in command lines is a sibling of the file write on the share.
  - id: 03f4ca17-de95-428d-a75a-4ee78b047256
    name: HackTool - Impacket File Indicators
    reason: Impacket tool file artefacts commonly accompany local admin-share output.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec-style remote execution also relies on ADMIN$ and follows the same lateral movement path.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands redirecting to local ADMIN$
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$.*/
    pivot_on: host
    window: 2h
  - name: Admin share access and network logons
    query: (data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*([Aa][Dd][Mm][Ii][Nn]|[Cc])\$.*/) OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3")
    pivot_on: host
    window: 2h
  - name: Shells spawned by WMI, services or MMC
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee].[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss].[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Mm][Cc].[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Credential access tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll][Ss][Aa][Ss][Ss]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Rr][Ee][Gg] [Ss][Aa][Vv][Ee]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]).*/
    pivot_on: host
    window: 4h
