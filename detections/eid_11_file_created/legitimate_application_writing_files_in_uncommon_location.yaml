                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\eqnedt32.exe'; data_win_eventdata_image matches '*\wordpad.exe';
  data_win_eventdata_image matches '*\wordview.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/#/download
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Legitimate Application Writing Files In Uncommon Location detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1218, T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1105
  custom_tags:
    - legitimate
    - application
    - writing
    - file_event
    - sysmon
    - stealth
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Ee][Qq][Nn][Ee][Dd][Tt]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Oo][Rr][Dd][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Rr][Ee][Qq]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp][Ii][Mm][Gg][Dd][Oo][Ww][Nn][Ll][Dd][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Aa][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Tt][Rr][Aa][Cc]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Pp][Ll][Aa][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Dd][Rr][Cc][Ee][Ff]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Gg][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss].*/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Nn][Tt][Aa][Cc][Tt][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ff][Aa][Vv][Oo][Rr][Ii][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ff][Aa][Vv][Oo][Uu][Rr][Ii][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Ee][Tt][Pp][Uu][Bb]\\[Ww][Ww][Ww][Rr][Oo][Oo][Tt]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Mm][Uu][Ss][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ii][Cc][Tt][Uu][Rr][Ee][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Vv][Ii][Dd][Ee][Oo][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: 'Process-creation twin: certutil -urlcache download whose file landing in Temp/ProgramData/AppData is what EID 11 flagged'
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: bitsadmin /transfer into a suspicious folder is the command-line side of the bitsadmin.exe file write
  - id: 70ad0861-d1fe-491c-a45f-fa48148a300d
    name: File Download via CertOC.EXE
    reason: certoc.exe -GetCACAB download is the command that produces a certoc.exe file write in an uncommon path
  - id: f37aba28-a9e6-4045-882c-d5004043b337
    name: Potential Arbitrary File Download Via Cmdl32.EXE
    reason: cmdl32 VPN-profile download abuse writes the payload to a temp path, matching the cmdl32.exe file-create
  - id: 4480827a-9799-4232-b2c4-ccc6c4e9e12b
    name: Suspicious CertReq Command to Download
    reason: certreq -Post -config with output file drops remote content to disk, same CertReq.exe file write
  - id: 587254ee-a24b-4335-b3cd-065c0f1f4baa
    name: Remote File Download Via Findstr.EXE
    reason: findstr pulling a remote file over SMB/WebDAV into a writable path explains findstr.exe creating files
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: certutil -decode/-decodehex of a staged blob is the likely next step after a certutil drop
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: dropped script/HTA then run via wscript/cscript/mshta is the natural execution follow-on
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LOLBin download command lines (certutil/bitsadmin/certoc/certreq/cmdl32/hh/mshta with URL)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR /.*\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Ee][Rr][Tt][Rr][Ee][Qq]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee]/ OR /.*\[Hh][Hh]\.[Ee][Xx][Ee]/ OR /.*\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR /.*\[Ee][Xx][Pp][Aa][Nn][Dd]\.[Ee][Xx][Ee]/ OR /.*\[Ee][Xx][Tt][Rr][Aa][Cc]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(*http* OR *ftp\:* OR *urlcache* OR *\/transfer* OR *\-decode* OR *\\*)
    pivot_on:
    - host
    window: 1h
  - name: Dropped file executed from the same uncommon directory
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/ OR /.*:\[Uu][Ss][Ee][Rr][Ss]\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/ OR /.*:\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\.*/ OR /.*:\[Tt][Ee][Mm][Pp]\.*/ OR /.*\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\.*/ OR /.*\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\.*/ OR /.*:\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Tt][Ee][Mm][Pp]\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Executable or script-type files created in startup, public or web-root paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(/.*\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\.*/ OR /.*\[Uu][Ss][Ee][Rr][Ss]\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/ OR /.*\[Ww][Ww][Ww][Rr][Oo][Oo][Tt]\.*/ OR /.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/) AND data_win_eventdata_targetFilename:(*.exe OR *.dll OR *.ps1 OR *.bat OR *.vbs OR *.js OR *.hta OR *.lnk OR *.scr OR *.msi)
    pivot_on:
    - host
    window: 2h
  - name: Network connections by the download-capable LOLBins
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:(/.*\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR /.*\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Ee][Rr][Tt][Rr][Ee][Qq]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee]/ OR /.*\[Ff][Tt][Pp]\.[Ee][Xx][Ee]/ OR /.*\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR /.*\[Hh][Hh]\.[Ee][Xx][Ee]/ OR /.*\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: DNS lookups by download-capable LOLBins
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:(/.*\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR /.*\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Ee][Rr][Tt][Rr][Ee][Qq]\.[Ee][Xx][Ee]/ OR /.*\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR /.*\[Hh][Hh]\.[Ee][Xx][Ee]/ OR /.*\[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
