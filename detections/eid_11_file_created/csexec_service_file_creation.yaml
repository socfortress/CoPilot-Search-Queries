name: CSExec Service File Creation
id: f0e2b768-5220-47dd-b891-d57b96fc0ec1
version: 1
schema_version: "1.0"
date: "2023-08-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0e2b768-5220-47dd-b891-d57b96fc0ec1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects default CSExec service filename which indicates CSExec service
  installation and execution. MITRE ATT&CK: T1569.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\csexecsvc.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\csexecsvc.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/malcomvetter/CSExec
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    CSExec Service File Creation detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - csexec
    - service
    - file_event
    - sysmon
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: Sibling PsExec-style remote service tool dropped to the same ADMIN$ share; seeing both means several remote-exec utilities are being tried on this host
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Same remote service-execution mechanic (service binary copied over SMB and started via SCM); co-occurrence confirms lateral movement tooling
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Process-level view of a remotely installed service binary running; the execution step that follows csexecsvc.exe being written
  - id: 8c3c76ca-8f8b-4b1d-aaf3-81aebcd367c9
    name: Creation Exe for Service with Unquoted Path
    reason: Another file-drop-for-service artefact on the same host; may indicate the operator planting additional service binaries
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Operators using CSExec often alternate with Impacket psexec/smbexec on the same targets when one is blocked
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: CSExec copies its service binary via the ADMIN$ share; admin-share copying is the staging step preceding this file creation
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: CSExec runs with credentials/hashes stolen earlier; Mimikatz on this or the source host is the likely credential source
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: CSExec is a Cobalt Strike-adjacent C# PsExec clone used for lateral movement; a CS pipe on the host suggests a beacon followed by this pivot
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: New service installed or sc.exe create/config on host
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(create|config|binpath).*/)
    pivot_on:
    - host
    window: 2h
  - name: Execution of csexecsvc.exe or services.exe child from ADMIN$ / system32
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_parentImage:/.*[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Ee][Xx][Ee][Cc].*/)
    pivot_on:
    - host
    window: 1h
  - name: Inbound SMB connections to this host (service binary delivery)
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445" AND data_win_eventdata_initiated:"false"
    pivot_on:
    - host
    window: 1h
  - name: Remote network logons (type 3) to this host
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:*$
    pivot_on:
    - host
    window: 2h
  - name: Credential access or tooling on host after CSExec
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ss][Aa][Mm] [Ss][Aa][Vv][Ee]|[Ll][Ss][Aa][Ss][Ss]).*/)
    pivot_on:
    - host
    window: 4h
