name: Windows CAB File on Disk
id: windows-cab-file-on-disk-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects .cab file creation on disk via Sysmon EventID 11. CAB files can be 
  used to deliver malicious payloads including embedded .url files that execute 
  harmful code. Used by DarkGate malware and APT37 for payload delivery and 
  staging.

data_source:
  - Sysmon EventID 11

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        - wildcard:
            data_win_eventdata_targetFilename: "*.cab"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log file creation events (EventID 11) for .cab 
  files. Verify Sysmon config includes .cab in FileCreate rules. The semicolon-
  separated condition syntax may need to be split into individual rules.

known_false_positives: >
  Windows Update and legitimate software installations may create .cab files. 
  Filter by file path — focus on user-writable directories like Temp, Downloads, 
  AppData, and Public.

references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2023-10-25-IOCs-from-DarkGate-activity.txt

response:
  message: >
    CAB file created on $agent_name$. 
    File: $data_win_eventdata_targetFilename$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1566.001
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.001
  custom_tags:
    - cab
    - file_creation
    - payload_delivery
    - archive
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.cab/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 60c0a111-787a-4e8a-9262-ee485f3ef9d5
    name: Suspicious Word Cab File Write CVE-2021-40444
    reason: Same file-drop behaviour from an Office parent; confirms the .cab came from a weaponised document rather than an installer.
  - id: 9f107a84-532c-41af-b005-8d12a607639f
    name: Potentially Suspicious Cabinet File Expansion
    reason: 'Follow-on: the dropped CAB is unpacked via expand.exe to stage the embedded payload.'
  - id: c74c0390-3e20-41fd-a69a-128f0275a5ea
    name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
    reason: Alternate extraction route for a CAB sitting in a user-writable path.
  - id: dc4576d4-7467-424f-9eee-fd2b02855fe0
    name: Suspicious Cabinet File Execution Via Msdt.EXE
    reason: CAB-based execution via msdt is a way the dropped file gets run.
  - id: 3d0ed417-3d94-4963-a562-4a92c940656a
    name: Creation of a Diagcab
    reason: Closely related cabinet-format drop (.diagcab) used to run attacker diagnostic packages.
  - id: 185d7418-f250-42d0-b72e-0c8b70661e93
    name: Suspicious Diantz Download and Compress Into a CAB File
    reason: Produces the CAB on disk via a LOLBin, an alternate origin of the same artifact.
  - id: 1a433e1d-03d2-47a6-8063-ece992cf4e73
    name: DarkGate - Autoit3.EXE File Creation By Uncommon Process
    reason: 'DarkGate chain: CAB delivers .url and AutoIt payload, which then gets written by an uncommon process.'
  - id: df49c691-8026-48dd-94d3-4ba6a79102a8
    name: DarkGate - Drop DarkGate Loader In C:\Temp Directory
    reason: Later DarkGate staging step after the CAB is unpacked.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files extracted around the CAB (url, exe, dll, script, lnk)
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[.](url|exe|dll|lnk|js|vbs|ps1|hta|bat|au3).*/
    pivot_on: host
    window: 2h
  - name: Cabinet expansion or extraction commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*(expand|wusa|extrac32|makecab|diantz|msdt)[.]exe/ OR data_win_eventdata_commandLine:/.*[.]cab.*/)
    pivot_on: host
    window: 2h
  - name: Script hosts or AutoIt launched from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(wscript|cscript|mshta|autoit3|rundll32|powershell)[.]exe/ AND data_win_eventdata_commandLine:/.*(Temp|Downloads|AppData|Public|ProgramData).*/
    pivot_on: host
    window: 2h
  - name: Network connections from freshly dropped binaries
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*(Temp|Downloads|AppData|Public|ProgramData).*/
    pivot_on: host
    window: 4h
  - name: Archive and disk-image delivery files
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[.](zip|iso|img|rar|7z).*/
    pivot_on: host
    window: 4h
