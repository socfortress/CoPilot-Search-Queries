name: LSASS Process Memory Dump Creation Via Taskmgr.EXE
id: 69ca12af-119d-44ed-b50f-a47af0ebc364
version: 1
schema_version: "1.0"
date: "2023-10-19"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 69ca12af-119d-44ed-b50f-a47af0ebc364
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of an "lsass.dmp" file by the taskmgr process. This
  indicates a manual dumping of the LSASS.exe process memory using Windows Task
  Manager. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\system32\\\\taskmgr.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\SysWOW64\\\\taskmgr.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\lsass*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.DMP*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*:\Windows\system32\taskmgr.exe'; data_win_eventdata_image matches
  '*:\Windows\SysWOW64\taskmgr.exe'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\*', among other conditions.

known_false_positives: >
  Rare case of troubleshooting by an administrator or support that has to be
  investigated regardless. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/987e3ca988ae3cff4b9f6e388c139c05bf44bbb8/atomics/T1003.001/T1003.001.md#L1
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Process Memory Dump Creation Via Taskmgr.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - memory
    - taskmgr
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Tt][Aa][Ss][Kk][Mm][Gg][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Ll][Ss][Aa][Ss][Ss].*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Generic lsass dump file creation; catches copies or renamed dumps from the same session.
  - id: 9fff585c-c33e-4a86-b3cd-39312079a65f
    name: Taskmgr as LOCAL_SYSTEM
    reason: Taskmgr running as LOCAL_SYSTEM suggests privileged interactive abuse around the dump.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Process-access event to LSASS with suspicious access flags generated when Task Manager creates the dump.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Generic LSASS access signal in the same time window corroborating the Task Manager dump.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on: dump archived with 7zip prior to exfiltration.'
  - id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
    name: Winrar Compressing Dump Files
    reason: 'Follow-on: dump compressed with WinRAR for exfiltration.'
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: 'Follow-on: .dmp copied to or from a share via cmd to move the dump off-host.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Taskmgr accessing LSASS
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*\\[Tt][Aa][Ss][Kk][Mm][Gg][Rr]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Taskmgr process starts and parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Mm][Gg][Rr]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Dump file collected, copied or archived
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]).*/
    pivot_on: host
    window: 6h
  - name: Remote session network context (RDP/WinRM inbound svchost)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986") AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Credential extraction tooling run on a dump
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]ekurlsa|[Pp]ypykatz|[Mm]imikatz).*/
    pivot_on: host
    window: 24h
