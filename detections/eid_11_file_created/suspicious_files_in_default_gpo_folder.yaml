name: Suspicious Files in Default GPO Folder
id: 5f87308a-0a5b-4623-ae15-d8fa1809bc60
version: 1
schema_version: "1.0"
date: "2022-04-28"
author: elhoim
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5f87308a-0a5b-4623-ae15-d8fa1809bc60
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of copy of suspicious files (EXE/DLL) to the default GPO
  storage folder. MITRE ATT&CK: T1036.005.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Policies\\\\{31B2F340-016D-11D2-945F-00C04FB984F9}\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Policies\{31B2F340-016D-11D2-945F-00C04FB984F9}\*';
  data_win_eventdata_targetFilename matches '*.dll';
  data_win_eventdata_targetFilename matches '*.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/intelligence-insights-november-2021/
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    Suspicious Files in Default GPO Folder detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1036.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.005
  custom_tags:
    - default
    - folder
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\\{31[Bb]2[Ff]340-016[Dd]-11[Dd]2-945[Ff]-00[Cc]04[Ff][Bb]984[Ff]9\}\\.*/ AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
    name: Suspicious SYSVOL Domain Group Policy Access
    reason: Browsing or searching SYSVOL policies is the recon preceding planting files in the Default Domain Policy folder.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: The copy into SYSVOL seen here at file level appears as a command in this detection.
  - id: dcff7e85-d01f-4eb5-badd-84e2e6be8294
    name: Windows Default Domain GPO Modification via GPME
    reason: Editing the Default Domain GPO is the companion step to push the planted binary domain-wide.
  - id: ada4b0c4-758b-46ac-9033-9004613a150d
    name: Modify Group Policy Settings
    reason: Policy changes that wire the dropped EXE or DLL into policy-based execution.
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Task creation used to execute a payload staged for distribution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution from or against the SYSVOL policy path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Vv][Oo][Ll]\\.*/ OR data_win_eventdata_commandLine:/.*31[Bb]2[Ff]340-016[Dd]-11[Dd]2-945[Ff]-00[Cc]04[Ff][Bb]984[Ff]9.*/)
    pivot_on: host
    window: 2h
  - name: GPO scheduled task, startup script or settings files written to policy folders
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\.*/) AND (data_win_eventdata_targetFilename:/.*[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk][Ss].[Xx][Mm][Ll]/ OR data_win_eventdata_targetFilename:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Ss].[Ii][Nn][Ii]/ OR data_win_eventdata_targetFilename:/.*[Pp][Ss][Ss][Cc][Rr][Ii][Pp][Tt][Ss].[Ii][Nn][Ii]/ OR data_win_eventdata_targetFilename:/.*[Gg][Pp][Tt][Tt][Mm][Pp][Ll].[Ii][Nn][Ff]/ OR data_win_eventdata_targetFilename:/.*[Gg][Rr][Oo][Uu][Pp][Ss].[Xx][Mm][Ll]/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy].[Pp][Oo][Ll]/)
    pivot_on: host
    window: 4h
  - name: Remote execution or forced policy refresh pushing the payload to hosts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)
    pivot_on: host
    window: 4h
  - name: Security tooling tampering around the GPO change
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp] [Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh] [Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] [Ss][Ee][Tt].*/)
    pivot_on: host
    window: 4h
