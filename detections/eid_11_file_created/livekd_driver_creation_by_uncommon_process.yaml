name: LiveKD Driver Creation By Uncommon Process
id: 059c5af9-5131-4d8d-92b2-de4ad6146712
version: 1
schema_version: "1.0"
date: "2023-05-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 059c5af9-5131-4d8d-92b2-de4ad6146712
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of the LiveKD driver by a process image other than
  "livekd.exe".

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_targetFilename:
              value: "C:\\Windows\\System32\\drivers\\LiveKdD.SYS"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\livekd.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\livek64.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename equals
  'C:\Windows\System32\drivers\LiveKdD.SYS'; data_win_eventdata_image matches
  '*\livekd.exe'; data_win_eventdata_image matches '*\livek64.exe'.

known_false_positives: >
  Administrators might rename LiveKD before its usage which could trigger this.
  Add additional names you use to the filter. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - Internal Research

response:
  message: >
    LiveKD Driver Creation By Uncommon Process detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - livekd
    - driver
    - uncommon
    - file_event
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Ll][Ii][Vv][Ee][Kk][Dd][Dd]\.[Ss][Yy][Ss]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk]64\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 16fe46bb-4f64-46aa-817d-ff7bec4a2352
    name: LiveKD Driver Creation
    reason: 'Sibling: the same driver written by the genuine livekd binary; both on one host shows renamed plus original use.'
  - id: 814ddeca-3d31-4265-8e07-8cc54fb44903
    name: LiveKD Kernel Memory Dump File Created
    reason: 'Direct follow-on: a renamed livekd writing livekdd.sys is expected to produce a kernel memory dump file.'
  - id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
    name: Kernel Memory Dump Via LiveKD
    reason: Process-creation evidence of livekd memory dumping; originalFileName detection survives renaming.
  - id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
    name: Potential Memory Dumping Activity Via LiveKD
    reason: Process-creation memory-dump command lines for livekd, even when renamed.
  - id: f50f3c09-557d-492d-81db-9064a8d4e211
    name: Suspicious Execution Of Renamed Sysinternals Tools - Registry
    reason: 'Co-occurrence: renamed Sysinternals tools leave registry EULA traces identifying the renamed binary.'
  - id: 8023f872-3f1d-4301-a384-801889917ab4
    name: Usage of Renamed Sysinternals Tools - RegistrySet
    reason: 'Co-occurrence: renamed Sysinternals tool usage observed via registry set.'
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: 'Co-occurring: kernel driver service creation used to load the dropped driver.'
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: 'Adjacent BYOVD behaviour: loading known abusable drivers by name often accompanies kernel-level credential theft.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Renamed LiveKD process and its parent
    query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ll][Ii][Vv][Ee][Kk][Dd].[Ee][Xx][Ee]/ OR data_win_eventdata_description:/.*[Ll][Ii][Vv][Ee][Kk][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ii][Vv][Ee][Kk][Dd].*/)
    pivot_on: host
    window: 2h
  - name: Kernel memory dump files
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Dd][Mm][Pp]/)
    pivot_on: host
    window: 4h
  - name: Driver service creation and driver loads from odd paths
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*([Tt][Yy][Pp][Ee]= [Kk][Ee][Rr][Nn][Ee][Ll]|\.[Ss][Yy][Ss]).*/) OR (data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*([Ll][Ii][Vv][Ee][Kk][Dd][Dd]|\\[Tt][Ee][Mm][Pp]\\|\\[Uu][Ss][Ee][Rr][Ss]\\).*/)
    pivot_on: host
    window: 2h
  - name: Defense evasion around driver activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR (data_win_eventdata_image:/.*\\([Ss][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|[Dd][Ee][Ll][Ee][Tt][Ee]).*/) OR (data_win_eventdata_image:/.*\\([Ff][Ll][Tt][Mm][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/))
    pivot_on: host
    window: 4h
  - name: LSASS access in the same window
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss].[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
