name: Potential COLDSTEEL Persistence Service DLL Creation
id: 1fea93a2-1524-4a3c-9828-3aa0c2414e27
version: 1
schema_version: "1.0"
date: "2023-04-30"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1fea93a2-1524-4a3c-9828-3aa0c2414e27
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file in a specific location and with a specific name
  related to COLDSTEEL RAT.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Users\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Roaming\\\\newdev.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Users\*'; data_win_eventdata_targetFilename matches
  '*\AppData\Roaming\newdev.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/cold-steel/NCSC-MAR-Cold-Steel.pdf

response:
  message: >
    Potential COLDSTEEL Persistence Service DLL Creation detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - coldsteel
    - persistence
    - service
    - file_event
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Nn][Ee][Ww][Dd][Ee][Vv]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1d7a57da-02e0-4f7f-92b1-c7b486ccfed5
    name: Potential COLDSTEEL Persistence Service DLL Load
    reason: 'Next stage: the newdev.dll just created is loaded by the service, confirming the persistence worked.'
  - id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
    name: COLDSTEEL RAT Service Persistence Execution
    reason: The rundll32/service command that runs newdev.dll under the persistence service.
  - id: c708a93f-46b4-4674-a5b8-54aa6219c5fa
    name: Potential COLDSTEEL RAT File Indicators
    reason: Sibling COLDSTEEL artifact (dllhost.exe in Public\Documents) from the same implant variant.
  - id: 95214813-4c7a-4a50-921b-ee5c538e1d16
    name: Potential COLDSTEEL RAT Windows User Creation
    reason: COLDSTEEL creates a hidden local account as a later persistence step.
  - id: e01b6eb5-1eb4-4465-a165-85d40d874add
    name: COLDSTEEL RAT Anonymous User Process Execution
    reason: RAT processes run as an anonymous-logon user once active.
  - id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
    name: COLDSTEEL RAT Cleanup Command Execution
    reason: Operator cleanup of implant artifacts after use.
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: The service that hosts newdev.dll is registered via the registry.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service registrations or ServiceDll pointing at newdev.dll
    query: data_win_system_eventID:"13" AND data_win_eventdata_details:/.*[Nn][Ee][Ww][Dd][Ee][Vv]\.[Dd][Ll][Ll].*/
    pivot_on: host
    window: 24h
  - name: Load or execution of newdev.dll
    query: (data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Nn][Ee][Ww][Dd][Ee][Vv]\.[Dd][Ll][Ll]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Ww][Dd][Ee][Vv]\.[Dd][Ll][Ll].*/)
    pivot_on: host
    window: 6h
  - name: Service creation via sc.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*create* AND *binpath*)
    pivot_on: host
    window: 6h
  - name: Local account creation and group changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*user*\/add* OR *localgroup*administrators*\/add*)
    pivot_on: host
    window: 24h
  - name: Files written under Public Documents
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Pp][Uu][Bb][Ll][Ii][Cc]\\[Dd]ocuments\\.*/
    pivot_on: host
    window: 24h
