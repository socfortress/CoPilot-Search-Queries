name: Suspicious MSExchangeMailboxReplication ASPX Write
id: 7280c9f3-a5af-45d0-916a-bc01cb4151c9
version: 1
schema_version: "1.0"
date: "2022-02-25"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7280c9f3-a5af-45d0-916a-bc01cb4151c9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious activity in which the MSExchangeMailboxReplication process
  writes .asp and .apsx files to disk, which could be a sign of ProxyShell
  exploitation. MITRE ATT&CK: T1190, T1505.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\MSExchangeMailboxReplication.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.aspx"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.asp"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\MSExchangeMailboxReplication.exe'; data_win_eventdata_targetFilename
  matches '*.aspx'; data_win_eventdata_targetFilename matches '*.asp'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/blackbyte-ransomware/
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    Suspicious MSExchangeMailboxReplication ASPX Write detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1190, T1505.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
    - T1505.003
  custom_tags:
    - msexchangemailboxreplication
    - write
    - file_event
    - sysmon
    - initial_access
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee][Mm][Aa][Ii][Ll][Bb][Oo][Xx][Rr][Ee][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bd1212e5-78da-431e-95fa-c58e3237a8e6
    name: Suspicious ASPX File Drop by Exchange
    reason: Other ASPX files dropped by Exchange processes confirm webshell placement
  - id: 6b269392-9eba-40b5-acb6-55c882b20ba6
    name: Suspicious File Drop by Exchange
    reason: Other suspicious files written by Exchange components beyond the ASPX shell
  - id: b06335b3-55ac-4b41-937e-16b7f5d57dfd
    name: CVE-2021-26858 Exchange Exploitation
    reason: Sibling Exchange exploitation (ProxyLogon file write) from the same intrusion toolset
  - id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
    name: HAFNIUM Exchange Exploitation Activity
    reason: Post-exploitation commands launched from Exchange after the shell lands
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Webshell commands executed through the dropped ASPX
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Webshell hacking activity patterns that follow the shell being planted
  - id: 25676e10-2121-446e-80a4-71ff8506af47
    name: Exchange PowerShell Snap-Ins Usage
    reason: Attacker use of Exchange PowerShell snap-ins (ProxyShell abuses New-MailboxExportRequest)
  - id: 3eb8c339-a765-48cc-a150-4364c04652bf
    name: IIS WebServer Access Logs Deleted
    reason: IIS log deletion to hide the exploit requests after the shell is written
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Exchange mailbox export requests
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Mm]ailbox[Ee]xport[Rr]equest.*/
    pivot_on: host
    window: 6h
  - name: Web worker or Exchange process spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww]3wp|[Uu][Mm][Ww]orker[Pp]rocess|[Mm][Ss][Ee]xchange[A-Za-z]*)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc]md|[Pp]ower[Ss]hell|[Ww]hoami|[Nn]et1?|[Cc]ertutil|[Bb]itsadmin)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Script files written in web roots
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(aspx|asp|ashx|asmx)/ AND data_win_eventdata_targetFilename:/.*(\\[Ii]netpub\\|\\[Ff]ront[Ee]nd\\|\\[Hh]ttp[Pp]roxy\\|\\[Ee]xchange [Ss]erver\\).*/
    pivot_on: host
    window: 24h
  - name: Ransomware preparation commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]hadow.*[Dd]elete|[Bb]cdedit.*[Rr]ecovery[Ee]nabled|[Ww]badmin.*[Dd]elete|[Ww]mic.*[Ss]hadowcopy.*[Dd]elete).*/
    pivot_on: host
    window: 24h
  - name: Credential dumping or tooling after Exchange compromise
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(comsvcs.*MiniDump|procdump.*[Ll]sass|[Nn]tds[Uu]til|[Ss]ekurlsa|[Rr]eg.*save.*(sam|system)).*/
    pivot_on: host
    window: 24h
