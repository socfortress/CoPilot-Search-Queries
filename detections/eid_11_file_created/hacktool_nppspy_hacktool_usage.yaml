name: HackTool - NPPSpy Hacktool Usage
id: cad1fe90-2406-44dc-bd03-59d0b58fe722
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cad1fe90-2406-44dc-bd03-59d0b58fe722
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of NPPSpy hacktool that stores cleartext passwords of users
  that logged in to a local file.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\NPPSpy.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\NPPSpy.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\NPPSpy.txt'; data_win_eventdata_targetFilename matches '*\NPPSpy.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003/T1003.md#atomic-test-2---credential-dumping-with-nppspy
  - https://twitter.com/0gtweet/status/1465282548494487554

response:
  message: >
    HackTool - NPPSpy Hacktool Usage detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - hacktool
    - nppspy
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Nn][Pp][Pp][Ss][Pp][Yy]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Pp][Pp][Ss][Pp][Yy]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
    name: Potential Credential Dumping Attempt Using New NetworkProvider - REG
    reason: NPPSpy only works once its DLL is registered in the NetworkProvider ProviderOrder registry value; this is the registration step that makes the dropped NPPSpy.dll capture logon passwords.
  - id: baef1ec6-2ca9-47a3-97cc-4cf2bda10b77
    name: Potential Credential Dumping Attempt Using New NetworkProvider - CLI
    reason: Command-line (PowerShell/reg) installation of the malicious network provider, the usual way NPPSpy is enabled after the files are dropped.
  - id: b3503044-60ce-4bf4-bbcb-e3db98788823
    name: DLL Load via LSASS
    reason: Registered network provider DLLs are loaded by LSASS/mpnotify at logon; confirms NPPSpy.dll actually became active.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: The unsigned NPPSpy.dll loaded into lsass.exe is the point where cleartext passwords start being harvested.
  - id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
    name: Security Support Provider (SSP) Added to LSA Configuration
    reason: Sibling LSA-loaded credential-capture persistence (SSP/mimilib); operators using NPPSpy often try other LSA plug-in mechanisms on the same host.
  - id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
    name: Potential Persistence Via LSA Extensions
    reason: LSA extension registry changes are an alternate way to load credential-stealing DLLs into LSASS alongside NPPSpy.
  - id: 8fbf3271-1ef6-4e94-8210-03c2317947f6
    name: Cred Dump Tools Dropped Files
    reason: 'Same file-creation stage: credential dumping tools or their output files dropped on the host by the same operator.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network provider / LSA plug-in registry registration
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Oo][Rr][Dd][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*\[Cc]ontrol\[Ll][Ss][Aa]\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Unsigned DLL loaded into LSASS or mpnotify/winlogon
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Mm][Pp][Nn][Oo][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_signed:"false"
    pivot_on:
    - host
    window: 6h
  - name: Process that dropped NPPSpy and its command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Pp][Pp][Ss][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Nn][Pp][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: DLL or credential-log file creation in System32 and NPPSpy artefacts
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Ss][Yy][Ss][Tt][Ee][Mm]32\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\[Nn][Pp][Pp][Ss][Pp][Yy].*/)
    pivot_on:
    - host
    window: 6h
  - name: Interactive logon activity that NPPSpy would capture
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"2" OR data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"7")
    pivot_on:
    - host
    window: 24h
