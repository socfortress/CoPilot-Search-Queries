name: Suspicious Executable File Creation
id: 74babdd6-a758-4549-9632-26535279e654
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 74babdd6-a758-4549-9632-26535279e654
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect creation of suspicious executable file names. Some strings look for
  suspicious file extensions, others look for filenames that exploit unquoted
  service paths. MITRE ATT&CK: T1564.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\$Recycle.Bin.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\Documents and Settings.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\MSOCache.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\PerfLogs.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\Recovery.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bat.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.sys.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*:\$Recycle.Bin.exe'; data_win_eventdata_targetFilename matches '*:\Documents
  and Settings.exe'; data_win_eventdata_targetFilename matches
  '*:\MSOCache.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/@SumitVerma101/windows-privilege-escalation-part-1-unquoted-service-path-c7a011a8d8ae
  - https://app.any.run/tasks/76c69e2d-01e8-49d9-9aea-fb7cc0c4d3ad/
  - https://attack.mitre.org/techniques/T1564/

response:
  message: >
    Suspicious Executable File Creation detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1564
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564
  custom_tags:
    - executable
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*:\\[Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss] [Aa][Nn][Dd] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*:\\[Mm][Ss][Oo][Cc][Aa][Cc][Hh][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*:\\[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c3c76ca-8f8b-4b1d-aaf3-81aebcd367c9
    name: Creation Exe for Service with Unquoted Path
    reason: Same unquoted-service-path planting (e.g. C:\Program.exe) aimed at privilege escalation.
  - id: 68bcd73b-37ef-49cb-95fc-edc809730be6
    name: Potential Unquoted Service Path Reconnaissance Via Wmic.EXE
    reason: Recon for unquoted paths typically precedes planting the root-level exe.
  - id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
    name: Suspicious Binaries and Scripts in Public Folder
    reason: Another odd-location staging behaviour by the same actor.
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: Service abuse route that would execute the planted binary.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installs and ImagePath changes
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss]ervices\\.*\\[Ii]mage[Pp]ath/)
    pivot_on: host
    window: 4h
  - name: Process started from drive root or protected-name exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/[A-Za-z]:\\(?:[Rr]ecovery|[Pp]erf[Ll]ogs|[Mm][Ss][Oo][Cc]ache|[Pp]rogram|[Dd]ocuments and [Ss]ettings)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Service path reconnaissance
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Aa][Tt][Hh][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*[Gg][Ee][Tt].*/)
    pivot_on: host
    window: 4h
  - name: Binary writes in staging directories
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(?:[Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Yy][Ss])/ AND data_win_eventdata_targetFilename:/.*\\(?:[Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata)\\.*/
    pivot_on: host
    window: 4h
