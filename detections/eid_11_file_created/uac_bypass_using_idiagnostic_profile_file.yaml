name: UAC Bypass Using IDiagnostic Profile - File
id: 48ea844d-19b1-4642-944e-fe39c2cc1fec
version: 1
schema_version: "1.0"
date: "2022-07-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 48ea844d-19b1-4642-944e-fe39c2cc1fec
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file by "dllhost.exe" in System32 directory part of
  "IDiagnosticProfileUAC" UAC bypass technique. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\DllHost.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Windows\\\\System32\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\DllHost.exe'; data_win_eventdata_targetFilename matches
  'C:\Windows\System32\*'; data_win_eventdata_targetFilename matches '*.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Wh04m1001/IDiagnosticProfileUAC
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using IDiagnostic Profile - File detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - idiagnostic
    - profile
    - file_event
    - sysmon
    - execution
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4cbef972-f347-4170-b62a-8253f6168e6d
    name: UAC Bypass Using IDiagnostic Profile
    reason: Process-side detection of the same IDiagnosticProfile COM abuse; confirms the elevated dllhost activity behind the DLL write.
  - id: 1ca6bd18-0ba0-44ca-851c-92ed89a61085
    name: UAC Bypass Using Consent and Comctl32 - Process
    reason: Sibling UACMe DLL-planting bypass; same operator toolkit often chains multiple methods.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi launcher execution is the usual precursor of this file drop.
  - id: 49f2f17b-b4c8-4172-a68b-d5bf95d05130
    name: UAC Bypass via ICMLuaUtil
    reason: Alternate COM-elevation bypass tried when one UACMe method fails.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DllHost writes DLL into System32
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Dd]ll[Hh]ost\.exe/ AND data_win_eventdata_targetFilename:/.*[Ss]ystem32.*\.dll/
    pivot_on: host
    window: 1h
  - name: DllHost with COM elevation args
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Dd]ll[Hh]ost\.exe/ AND data_win_eventdata_commandLine:/.*([Pp]rocessid|\{[0-9A-Fa-f-]{36}\}).*/
    pivot_on: host
    window: 1h
  - name: Unsigned DLL load from System32 just written
    query: data_win_system_eventID:7 AND data_win_eventdata_signed:false AND data_win_eventdata_imageLoaded:/.*[Ss]ystem32.*/
    pivot_on: host
    window: 2h
  - name: Elevated high-integrity children of auto-elevate binaries
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:High AND data_win_eventdata_parentImage:/.*\\(consent|mmc|wusa|pkgmgr|dism|dllhost|ieinstal|msconfig|sdclt|fodhelper|eventvwr)\.exe/
    pivot_on: host
    window: 1h
  - name: Defender tamper or exclusion after elevation
    query: data_win_system_eventID:(13 OR 1) AND (data_win_eventdata_targetObject:/.*[Dd]efender.*([Ee]xclusions|DisableAntiSpyware|DisableRealtimeMonitoring).*/ OR data_win_eventdata_commandLine:/.*([Ss]et-MpPreference|[Aa]dd-MpPreference).*/)
    pivot_on: host
    window: 2h
