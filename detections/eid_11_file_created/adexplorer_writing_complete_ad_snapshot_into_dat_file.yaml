name: ADExplorer Writing Complete AD Snapshot Into .dat File
id: 0a1255c5-d732-4b62-ac02-b5152d34fb83
version: 1
schema_version: "1.0"
date: "2025-07-09"
author: Arnim Rupp (Nextron Systems), Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0a1255c5-d732-4b62-ac02-b5152d34fb83
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the dual use tool ADExplorer writing a complete AD snapshot into a
  .dat file. This can be used by attackers to extract data for Bloodhound,
  usernames for password spraying or use the meta data for social engineering.
  The snapshot doesn't contain password hashes but there have been cases, where
  administrators put passwords in the comment field. MITRE ATT&CK: T1087.002,
  T1069.002, T1482.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ADExp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ADExplorer.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ADExplorer64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ADExplorer64a.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.dat"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\ADExp.exe'; data_win_eventdata_image matches '*\ADExplorer.exe';
  data_win_eventdata_image matches '*\ADExplorer64.exe', among other conditions.

known_false_positives: >
  Legitimate use of ADExplorer by administrators creating .dat snapshots.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://learn.microsoft.com/de-de/sysinternals/downloads/adexplorer
  - https://github.com/c3c/ADExplorerSnapshot.py/tree/f700904defac330802bbfedd1d8ffd9248f4ee24
  - https://www.packetlabs.net/posts/scattered-spider-is-a-young-ransomware-gang-exploiting-large-corporations/
  - https://www.nccgroup.com/us/research-blog/lapsus-recent-techniques-tactics-and-procedures/
  - https://trustedsec.com/blog/adexplorer-on-engagements
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://attack.mitre.org/techniques/T1482/

response:
  message: >
    ADExplorer Writing Complete AD Snapshot Into .dat File detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1087.002, T1069.002,
    T1482
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
    - T1069.002
    - T1482
  custom_tags:
    - adexplorer
    - writing
    - complete
    - file_event
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]64[Aa]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\.[Dd][Aa][Tt]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9212f354-7775-4e28-9c9f-8f0a4544e664
    name: Active Directory Database Snapshot Via ADExplorer
    reason: 'Process-creation view of the same snapshot: the ADExplorer command line (-snapshot) that produced this .dat file, showing who launched it and with what arguments.'
  - id: ef61af62-bc74-4f58-b49b-626448227652
    name: Suspicious Active Directory Database Snapshot Via ADExplorer
    reason: Same snapshot action run from a suspicious path or parent (e.g. temp/user-writable dir), strengthening the case that the .dat was attacker-driven rather than admin use.
  - id: 02773bed-83bf-469f-b7ff-e676e7d78bab
    name: BloodHound Collection Files
    reason: The snapshot is commonly converted (ADExplorerSnapshot.py) to BloodHound data; BloodHound JSON/zip collection files on the host confirm AD attack-path mapping.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Parallel or alternative AD enumeration by the same operator; SharpHound often runs alongside or instead of ADExplorer snapshots.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is another dual-use AD discovery tool frequently used in the same reconnaissance phase (Scattered Spider/LAPSUS-style intrusions).
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Follow-on staging: the large .dat snapshot is typically archived with a password before exfiltration.'
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: 'Follow-on exfiltration: the snapshot or other staged data is pushed out with rclone.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ADExplorer snapshot command line and launch context
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp].*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: BloodHound / SharpHound / AD enumeration tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr]|[Gg][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 4h
  - name: BloodHound output or archive files written after snapshot
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*_[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*(computers|users|groups|domains|gpos|ous)\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr])/)
    pivot_on:
    - host
    window: 4h
  - name: Archiving or exfiltration tooling (7-Zip, WinRAR, rclone, MEGA) after snapshot
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Gg]|[Ww]in[Rr][Aa][Rr]|[Rr][Aa][Rr]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: Outbound DNS to file-sharing or cloud storage after snapshot
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Mm][Ee][Gg][Aa]\.([Nn][Zz]|[Ii][Oo])|[Tt][Ra][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]|[Ff][Ii][Ll][Ee]\.[Ii][Oo]|[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]|[Dd][Rr][Oo][Pp][Bb][Oo][Xx]|[Pp][Cc][Ll][Oo][Uu][Dd]|[Ww][Ee][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]).*/
    pivot_on:
    - host
    window: 6h
