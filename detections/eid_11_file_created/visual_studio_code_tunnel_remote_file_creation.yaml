name: Visual Studio Code Tunnel Remote File Creation
id: 56e05d41-ce99-4ecd-912d-93f019ee0b71
version: 1
schema_version: "1.0"
date: "2023-10-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 56e05d41-ce99-4ecd-912d-93f019ee0b71
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of file by the "node.exe" process in the ".vscode-server"
  directory. Could be a sign of remote file creation via VsCode tunnel feature.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\servers\\\\Stable-*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\server\\\\node.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\.vscode-server\\\\data\\\\User\\\\History\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\servers\Stable-*'; data_win_eventdata_image matches '*\server\node.exe';
  data_win_eventdata_targetFilename matches
  '*\.vscode-server\data\User\History\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research

response:
  message: >
    Visual Studio Code Tunnel Remote File Creation detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - visual
    - studio
    - tunnel
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ss][Ee][Rr][Vv][Ee][Rr][Ss]\\[Ss][Tt][Aa][Bb][Ll][Ee]-.*/ AND data_win_eventdata_image:/.*\\[Ss][Ee][Rr][Vv][Ee][Rr]\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\\.[Vv][Ss][Cc][Oo][Dd][Ee]-[Ss][Ee][Rr][Vv][Ee][Rr]\\[Dd][Aa][Tt][Aa]\\[Uu][Ss][Ee][Rr]\\[Hh][Ii][Ss][Tt][Oo][Rr][Yy]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 90d6bd71-dffb-4989-8d86-a827fedd6624
    name: Visual Studio Code Tunnel Execution
    reason: Tunnel must be started before remote file edits occur
  - id: 30bf1789-379d-4fdc-900f-55cd0a90a801
    name: Visual Studio Code Tunnel Service Installation
    reason: Tunnel installed as a service explains durable remote access
  - id: f4a623c2-4ef5-4c33-b811-0642f702c9f1
    name: Visual Studio Code Tunnel Shell Execution
    reason: Remote operator opens a shell through the tunnel, co-occurs with file writes
  - id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
    name: Renamed Visual Studio Code Tunnel Execution
    reason: Evasive renamed code binary establishing the same tunnel
  - id: 4b657234-038e-4ad5-997c-4be42340bce4
    name: Network Connection Initiated To Visual Studio Code Tunnels Domain
    reason: Network side of the tunnel carrying the remote file operations
  - id: b3e6418f-7c7a-4fad-993a-93b65027a9f1
    name: DNS Query To Visual Studio Code Tunnels Domain
    reason: DNS resolution of the tunnel relay preceding the session
  - id: 5a3164f2-b373-4152-93cf-090b13c12d27
    name: Potentially Suspicious Child Process Of VsCode
    reason: Commands executed by the remote operator via VS Code
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: VS Code tunnel launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll].*/ AND data_win_eventdata_image:/.*([Cc][Oo][Dd][Ee][^\\]*|[Nn][Oo][Dd][Ee])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
  - name: Connections to tunnel relay domains
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*(tunnels\.api\.visualstudio\.com|devtunnels\.ms|vscode\.dev).*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationHostname:/.*(tunnels\.api\.visualstudio\.com|devtunnels\.ms).*/)
    pivot_on:
    - host
    window: 6h
  - name: Shells spawned from node/code server
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Nn][Oo][Dd][Ee]|[Cc][Oo][Dd][Ee][^\\]*)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
  - name: Files written under .vscode-server
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Vv][Ss][Cc][Oo][Dd][Ee]-[Ss][Ee][Rr][Vv][Ee][Rr].*/
    pivot_on:
    - host
    window: 6h
