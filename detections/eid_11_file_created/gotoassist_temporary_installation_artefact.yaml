name: GoToAssist Temporary Installation Artefact
id: 5d756aee-ad3e-4306-ad95-cb1abec48de2
version: 1
schema_version: "1.0"
date: "2022-02-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5d756aee-ad3e-4306-ad95-cb1abec48de2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\LogMeInInc\\\\GoToAssist Remote Support Expert\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\*'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-4---gotoassist-files-detected-test-on-windows
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    GoToAssist Temporary Installation Artefact detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - gotoassist
    - temporary
    - installation
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ll][Oo][Gg][Mm][Ee][Ii][Nn][Ii][Nn][Cc]\\[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt] [Rr][Ee][Mm][Oo][Tt][Ee] [Ss][Uu][Pp][Pp][Oo][Rr][Tt] [Ee][Xx][Pp][Ee][Rr][Tt]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6d98a4f-cef0-4abf-bbf6-24132854a83d
    name: Remote Access Tool - GoToAssist Execution
    reason: 'Same tool: the GoToAssist Remote Support Expert binary launching from the Temp/LogMeInInc dir is the process-side confirmation that the dropped files were actually run, not just staged.'
  - id: d85873ef-a0f8-4c48-a53a-6b621f11729d
    name: Remote Access Tool - LogMeIn Execution
    reason: GoToAssist is a LogMeIn product; its helper/agent processes overlap and show the interactive session going live.
  - id: fec96f39-988b-4586-b746-b93d59fd1922
    name: ScreenConnect Temporary Installation Artefact
    reason: Attackers often stack several remote-support tools for redundant C2; a sibling RMM temp-install artefact on the same host indicates multiple access channels.
  - id: 0b9ad457-2554-44c1-82c2-d56a99c42377
    name: Anydesk Temporary Artefact
    reason: Same behaviour class (RMM runtime artefact in user temp); co-occurrence signals tool-shopping for persistent remote access.
  - id: 9711de76-5d4f-4c50-a94f-21e4e8f8384d
    name: Installation of TeamViewer Desktop
    reason: Another remote-support installation on the same host strengthens the case of deliberate remote-control tooling deployment.
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: 'Follow-on: a temporary GoToAssist session often converts to an installed remote-access service for persistence.'
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Identifies remote-access binaries by file metadata, catching renamed copies of the same tooling dropped alongside the GoToAssist files.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: 'Typical post-access follow-on: once a remote operator has interactive control, data is staged and exfiltrated with tools like Rclone.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GoToAssist/LogMeIn processes launched
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt].*/ OR data_win_eventdata_image:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn].*/ OR data_win_eventdata_image:/.*[Gg]2[Aa][Xx].*/ OR data_win_eventdata_image:/.*[Gg]2[Mm].*/ OR data_win_eventdata_commandLine:/.*[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Network and DNS to GoTo/LogMeIn infrastructure
    query: (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*gotoassist* OR data_win_eventdata_queryName:*logmein* OR data_win_eventdata_queryName:*goto.com* OR data_win_eventdata_queryName:*gotoresolve*)) OR (data_win_system_eventID:"3" AND (data_win_eventdata_image:*GoToAssist* OR data_win_eventdata_image:*g2ax* OR data_win_eventdata_image:*LogMeIn*))
    pivot_on:
    - host
    window: 2h
  - name: Other remote-access tool files or processes
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*ScreenConnect* OR data_win_eventdata_targetFilename:*AnyDesk* OR data_win_eventdata_targetFilename:*TeamViewer* OR data_win_eventdata_targetFilename:*Splashtop* OR data_win_eventdata_targetFilename:*NetSupport*)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:*ScreenConnect* OR data_win_eventdata_image:*AnyDesk* OR data_win_eventdata_image:*TeamViewer* OR data_win_eventdata_image:*ngrok*))
    pivot_on:
    - host
    window: 4h
  - name: Hands-on-keyboard discovery or tooling from remote session
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Qq][Uu][Ee][Rr][Yy] [Uu][Ss][Ee][Rr]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]).*/ OR data_win_eventdata_parentImage:/.*([Gg][Oo][Tt][Oo]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence written after remote tool drop
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*([Gg][Oo][Tt][Oo]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]).*/)
    pivot_on:
    - host
    window: 4h
