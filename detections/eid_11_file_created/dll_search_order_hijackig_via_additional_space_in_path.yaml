name: DLL Search Order Hijackig Via Additional Space in Path
id: b6f91281-20aa-446a-b986-38a92813a18f
version: 1
schema_version: "1.0"
date: "2022-07-30"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b6f91281-20aa-446a-b986-38a92813a18f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker create a similar folder structure to windows system
  folders such as (Windows, Program Files...) but with a space in order to trick
  DLL load search order and perform a "DLL Search Order Hijacking" attack. MITRE
  ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "C:\\\\Windows \\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "C:\\\\Program Files \\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "C:\\\\Program Files (x86) \\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows \*'; data_win_eventdata_targetFilename matches 'C:\Program Files
  \*'; data_win_eventdata_targetFilename matches 'C:\Program Files (x86) \*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/cyb3rops/status/1552932770464292864
  - https://www.wietzebeukema.nl/blog/hijacking-dlls-in-windows
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    DLL Search Order Hijackig Via Additional Space in Path detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - search
    - order
    - hijackig
    - file_event
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\) \\.*/) AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0cbe38c0-270c-41d9-ab79-6e5a9a669290
    name: Trusted Path Bypass via Windows Directory Spoofing
    reason: 'Same trick one step later: the space-padded ''C:\Windows \System32'' dir created here is what a trusted-path-bypass image load then loads from, confirming the hijack executed.'
  - id: a5ea83a7-05a5-44c1-be2e-addccbbd8c03
    name: UAC Bypass With Fake DLL
    reason: Fake-folder DLL drops are the classic mock-trusted-directory UAC bypass; an auto-elevating binary loading the planted DLL means privilege escalation succeeded.
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: The dropped DLL is often named after a system DLL (e.g. version.dll, wtsapi32.dll) placed outside System32 for the hijack, which this rule flags on the same file creation.
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: Phantom-DLL hijack variant using the same file-creation telemetry; attacker operating both techniques indicates deliberate DLL hijack tooling.
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: Co-occurring DLL search-order hijack file drop, often from a delivery archive/LNK; shows how the malicious DLL arrived on the host.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Follow-on image load: a legitimate binary loading the planted DLL from the attacker-controlled path is the execution step of the hijack.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: A system process loading a DLL from a look-alike directory is the payoff of the planted file and shows code running in a trusted process.
  - id: 8c3c76ca-8f8b-4b1d-aaf3-81aebcd367c9
    name: Creation Exe for Service with Unquoted Path
    reason: Same path-trickery family (spaces in system-like paths); an attacker exploiting path parsing may chain both for privilege escalation or persistence.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL loaded from space-padded Windows/Program Files directory
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/[Cc]:\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\) \.*/)
    pivot_on:
    - host
    window: 2h
  - name: Process executed from space-padded system look-alike directory
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/[Cc]:\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \.*/ OR data_win_eventdata_image:/[Cc]:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \.*/ OR data_win_eventdata_image:/[Cc]:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\) \.*/)
    pivot_on:
    - host
    window: 2h
  - name: Fake trusted directory creation or binary copy via command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww][Ii][Nn][Dd][Oo][Ww][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]) \.*/ AND (data_win_eventdata_commandLine:/.*([Mm][Kk][Dd][Ii][Rr]|[Mm][Dd]|[Xx][Cc][Oo][Pp][Yy]|[Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|[Mm][Oo][Vv][Ee]|[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Executable dropped into space-padded system directory (auto-elevate binary copy)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/[Cc]:\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \.*/ OR data_win_eventdata_targetFilename:/[Cc]:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \.*/ OR data_win_eventdata_targetFilename:/[Cc]:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\) \.*/) AND data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network from process in space-padded directory
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/[Cc]:\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \.*/ OR data_win_eventdata_image:/[Cc]:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \.*/ OR data_win_eventdata_image:/[Cc]:\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\) \.*/)
    pivot_on:
    - host
    window: 4h
