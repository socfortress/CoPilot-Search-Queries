name: Suspicious Screensaver Binary File Creation
id: 97aa2e88-555c-450d-85a6-229bcd87efb8
version: 1
schema_version: "1.0"
date: "2022-11-08"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 97aa2e88-555c-450d-85a6-229bcd87efb8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may establish persistence by executing malicious content triggered
  by user inactivity. Screensavers are programs that execute after a
  configurable time of user inactivity and consist of Portable Executable (PE)
  files with a .scr file extension. MITRE ATT&CK: T1546.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.scr"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Kindle.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Bin\\\\ccSvcHst.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\TiWorker.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\uwfservicingscr.scr"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*.scr'; data_win_eventdata_image matches '*\Kindle.exe';
  data_win_eventdata_image matches '*\Bin\ccSvcHst.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.002/T1546.002.md
  - https://attack.mitre.org/techniques/T1546/002/

response:
  message: >
    Suspicious Screensaver Binary File Creation detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1546.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.002
  custom_tags:
    - screensaver
    - binary
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_image:/.*\\[Kk][Ii][Nn][Dd][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Nn]\\[Cc][Cc][Ss][Vv][Cc][Hh][Ss][Tt]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Tt][Ii][Ww][Oo][Rr][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Uu][Ww][Ff][Ss][Ee][Rr][Vv][Ii][Cc][Ii][Nn][Gg][Ss][Cc][Rr]\.[Ss][Cc][Rr]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c048f047-7e2a-4888-b302-55f509d4a91d
    name: SCR File Write Event
    reason: Sibling .scr write detection; corroborates the same dropped screensaver.
  - id: 40b6e656-4e11-4c0c-8772-c1cc6dae34ce
    name: ScreenSaver Registry Key Set
    reason: ScreenSaver registry key set is the activation step after the .scr drop.
  - id: 67a6c006-3fbe-46a7-9074-2ba3b82c3000
    name: Path To Screensaver Binary Modified
    reason: Path to screensaver binary modified in registry points the system at the dropped .scr.
  - id: 15bd98ea-55f4-4d37-b09a-e7caa0fa2221
    name: Rundll32 InstallScreenSaver Execution
    reason: Rundll32 InstallScreenSaver is an alternate way to register the .scr.
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: A .scr dropped in a Startup folder is the alternate persistence path.
  - id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
    name: Suspicious Binaries and Scripts in Public Folder
    reason: Binaries in Public folders show the same staging area for the dropped payload.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ScreenSaver registry configuration
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc]ontrol [Pp]anel\\[Dd]esktop\\(SCRNSAVE\.EXE|ScreenSaveTimeOut|ScreenSaveActive|ScreenSaverIsSecure).*/
    pivot_on: host
    window: 4h
  - name: Screensaver launched or installed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\.[Ss][Cc][Rr]/ OR data_win_eventdata_commandLine:/.*([Ii]nstall[Ss]creen[Ss]aver|\.[Ss][Cc][Rr]).*/)
    pivot_on: host
    window: 24h
  - name: Executable drops in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Cc][Rr]|[Pp][Ss]1|[Bb][Aa][Tt])/ AND data_win_eventdata_targetFilename:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp])\\.*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from unusual paths
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc])\\.*/
    pivot_on: host
    window: 4h
