name: UEFI Persistence Via Wpbbin - FileCreation
id: e94b9ddc-eec5-4bb8-8a58-b9dc5f4e185f
version: 1
schema_version: "1.0"
date: "2022-07-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e94b9ddc-eec5-4bb8-8a58-b9dc5f4e185f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a file named "wpbbin" in the "%systemroot%\system32\"
  directory. Which could be indicative of UEFI based persistence method. MITRE
  ATT&CK: T1542.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_targetFilename:
              value: "C:\\Windows\\System32\\wpbbin.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename equals
  'C:\Windows\System32\wpbbin.exe'.

known_false_positives: >
  Legitimate usage of the file by hardware manufacturer such as lenovo (Thanks
  @0gtweet for the tip). Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://grzegorztworek.medium.com/using-uefi-to-inject-executable-files-into-bitlocker-protected-drives-8ff4ca59c94c
  - https://persistence-info.github.io/Data/wpbbin.html
  - https://attack.mitre.org/techniques/T1542/001/

response:
  message: >
    UEFI Persistence Via Wpbbin - FileCreation detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1542.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1542.001
  custom_tags:
    - persistence
    - wpbbin
    - filecreation
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Pp][Bb][Bb][Ii][Nn]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4abc0ec4-db5a-412f-9632-26659cddf145
    name: UEFI Persistence Via Wpbbin - ProcessCreation
    reason: 'Same technique seen from process creation: wpbbin.exe is what Windows runs at boot from the WPBT table.'
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Boot-level persistence is commonly paired with boot configuration changes that weaken protections.
  - id: d7662ff6-9e97-4596-a61d-9839e32dee8d
    name: Add SafeBoot Keys Via Reg Utility
    reason: Boot-time tampering that often accompanies firmware/boot persistence to disable security tooling.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other unexpected System32 writers
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ss]ystem32.*\.(exe|dll|sys).*/ AND NOT data_win_eventdata_image:/.*(TrustedInstaller|svchost|msiexec|TiWorker).*/
    pivot_on: host
    window: 6h
  - name: Execution of wpbbin
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]pbbin.*/
    pivot_on: host
    window: 24h
  - name: Boot config and safeboot tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Bb]cdedit.*/ OR /.*[Mm]ountvol.*/ OR /.*[Ss]afeboot.*/)
    pivot_on: host
    window: 6h
  - name: BootExecute and Defender disable registry edits
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*[Ss]ession [Mm]anager.*[Bb]oot[Ee]xecute.*/ OR /.*[Ww]indows [Dd]efender.*[Dd]isable.*/)
    pivot_on: host
    window: 6h
