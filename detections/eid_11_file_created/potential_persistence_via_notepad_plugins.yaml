name: Potential Persistence Via Notepad++ Plugins
id: 54127bd4-f541-4ac3-afdb-ea073f63f692
version: 1
schema_version: "1.0"
date: "2025-09-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 54127bd4-f541-4ac3-afdb-ea073f63f692
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of new ".dll" files inside the plugins directory of a
  notepad++ installation by a process other than "gup.exe". Which could
  indicates possible persistence.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Notepad++\\\\plugins\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Notepad++\\\\updater\\\\gup.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\target.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*Installer.x64.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\npp.*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_targetFilename:
                                      value: "C:\\Program Files\\Notepad++\\plugins\\NppExport\\NppExport.dll"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetFilename:
                                      value: "C:\\Program Files\\Notepad++\\plugins\\mimeTools\\mimeTools.dll"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetFilename:
                                      value: "C:\\Program Files\\Notepad++\\plugins\\NppConverter\\NppConverter.dll"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetFilename:
                                      value: "C:\\Program Files\\Notepad++\\plugins\\Config\\nppPluginList.dll"
                                      case_insensitive: true
                              minimum_should_match: 1
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Notepad++\plugins\*'; data_win_eventdata_targetFilename matches '*.dll';
  data_win_eventdata_image matches '*\Notepad++\updater\gup.exe', among other
  conditions.

known_false_positives: >
  Possible FPs during first installation of Notepad++. Legitimate use of custom
  plugins by users in order to enhance notepad++ functionalities. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://pentestlab.blog/2022/02/14/persistence-notepad-plugins/

response:
  message: >
    Potential Persistence Via Notepad++ Plugins detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - notepad
    - plugins
    - file_event
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Pp][Ll][Uu][Gg][Ii][Nn][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_image:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Uu][Pp][Dd][Aa][Tt][Ee][Rr]\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND (data_win_eventdata_image:/.*\\[Tt][Aa][Rr][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Xx]64\.[Ee][Xx][Ee]/)) OR (data_win_eventdata_image:/.*\\[Nn][Pp][Pp]\..*/ AND data_win_eventdata_image:/.*\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Pp][Ll][Uu][Gg][Ii][Nn][Ss]\\[Nn][Pp][Pp][Ee][Xx][Pp][Oo][Rr][Tt]\\[Nn][Pp][Pp][Ee][Xx][Pp][Oo][Rr][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Pp][Ll][Uu][Gg][Ii][Nn][Ss]\\[Mm][Ii][Mm][Ee][Tt][Oo][Oo][Ll][Ss]\\[Mm][Ii][Mm][Ee][Tt][Oo][Oo][Ll][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Pp][Ll][Uu][Gg][Ii][Nn][Ss]\\[Nn][Pp][Pp][Cc][Oo][Nn][Vv][Ee][Rr][Tt][Ee][Rr]\\[Nn][Pp][Pp][Cc][Oo][Nn][Vv][Ee][Rr][Tt][Ee][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Pp][Ll][Uu][Gg][Ii][Nn][Ss]\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Nn][Pp][Pp][Pp][Ll][Uu][Gg][Ii][Nn][Ll][Ii][Ss][Tt]\.[Dd][Ll][Ll]/)))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Execution of programs from user-writable paths on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/)'
      pivot_on: [host]
      window: 1h
    - name: "Autostart persistence written on this host"
      query: '(data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ll][Oo][Aa][Dd].*/)'
      pivot_on: [host]
      window: 2h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
