name: ISO or Image Mount Indicator in Recent Files
id: 4358e5a5-7542-4dcb-b9f3-87667371839b
version: 1
schema_version: "1.0"
date: "2022-02-11"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4358e5a5-7542-4dcb-b9f3-87667371839b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of recent element file that points to an .ISO, .IMG, .VHD
  or .VHDX file as often used in phishing attacks. This can be a false positive
  on server systems but on workstations users should rarely mount .iso or .img
  files. MITRE ATT&CK: T1566.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.iso.lnk"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.img.lnk"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vhd.lnk"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vhdx.lnk"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Microsoft\\\\Windows\\\\Recent\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*.iso.lnk'; data_win_eventdata_targetFilename matches '*.img.lnk';
  data_win_eventdata_targetFilename matches '*.vhd.lnk', among other conditions.

known_false_positives: >
  Cases in which a user mounts an image file for legitimate reasons. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2021/05/27/new-sophisticated-email-based-attack-from-nobelium/
  - https://www.trendmicro.com/vinfo/us/security/news/cybercrime-and-digital-threats/malicious-spam-campaign-uses-iso-image-files-to-deliver-lokibot-and-nanocore
  - https://blog.emsisoft.com/en/32373/beware-new-wave-of-malware-spreads-via-iso-file-email-attachments/
  - https://insights.sei.cmu.edu/blog/the-dangers-of-vhd-and-vhdx-files/
  - https://attack.mitre.org/techniques/T1566/001/

response:
  message: >
    ISO or Image Mount Indicator in Recent Files detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1566.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.001
  custom_tags:
    - image
    - mount
    - indicator
    - file_event
    - sysmon
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ii][Ss][Oo]\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Ii][Mm][Gg]\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Hh][Dd]\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Hh][Dd][Xx]\.[Ll][Nn][Kk]/) AND data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Rr][Ee][Cc][Ee][Nn][Tt]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
    name: ISO File Created Within Temp Folders
    reason: 'Precursor: the ISO is dropped to Temp (browser/mail attachment) before the user opens it, creating the Recent .lnk this rule sees.'
  - id: 8468111a-ef07-4654-903b-b863a80bbc95
    name: VHD Image Download Via Browser
    reason: 'Precursor: browser-downloaded VHD/VHDX is the delivery step for the image whose mount produced the Recent shortcut.'
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: 'Co-occurring delivery variant: ISO nested in a zip/rar opened from 7zFM/WinRAR to evade mark-of-the-web.'
  - id: 0248a7bc-8a9a-4cd8-a57e-3ae8e073a073
    name: ISO Image Mounted
    reason: 'Same event from the Security log: confirms the user actually mounted the image.'
  - id: 902cedee-0398-4e3a-8183-6f3a89773a96
    name: Suspicious Invoke-Item From Mount-DiskImage
    reason: Scripted mount-and-run of image content via PowerShell, an alternative to the Explorer double-click.
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: 'Follow-on: ISO payloads typically contain an LNK that launches cmd/powershell, as in Emotet ISO campaigns.'
  - id: 1723e720-616d-4ddc-ab02-f7e3685a4713
    name: Rundll32 Spawned Via Explorer.EXE
    reason: 'Follow-on: user double-clicks the LNK in the mounted image and Explorer spawns rundll32 to load the bundled DLL.'
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: 'Follow-on: Qakbot/IcedID ISO lures end in rundll32 loading a DLL from a cmd/script parent.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process launched from a non-system drive letter (mounted image volume)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/[D-Zd-z]:\\.*/ AND NOT data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss].*/
    pivot_on:
    - host
    window: 1h
  - name: Explorer spawning script host or LOLBin (LNK launched from image)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Disk image mount or ISO tooling command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Mount-DiskImage* OR data_win_eventdata_commandLine:*[Ii][Ss][Oo][Bb][Uu][Rr][Nn]* OR data_win_eventdata_commandLine:/.*\.[Ii][Ss][Oo]"?/ OR data_win_eventdata_commandLine:/.*\.[Vv][Hh][Dd]x?"?/)
    pivot_on:
    - host
    window: 2h
  - name: Payload files (DLL/EXE/script) written to user-writable paths after mount
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc])\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Jj][Ss]|[Vv][Bb][Ss]|[Hh][Tt][Aa]|[Bb][Aa][Tt])/
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from rundll32, regsvr32 or script hosts (C2 after image execution)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
