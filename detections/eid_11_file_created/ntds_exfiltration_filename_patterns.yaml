name: NTDS Exfiltration Filename Patterns
id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
version: 1
schema_version: "1.0"
date: "2023-05-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of files with specific name patterns seen used in various
  tools that export the NTDS.DIT for exfiltration. MITRE ATT&CK: T1003.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\All.cab"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ntds.cleartext"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\All.cab'; data_win_eventdata_targetFilename matches '*.ntds.cleartext'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/rapid7/metasploit-framework/blob/eb6535009f5fdafa954525687f09294918b5398d/modules/post/windows/gather/ntds_grabber.rb
  - https://github.com/rapid7/metasploit-framework/blob/eb6535009f5fdafa954525687f09294918b5398d/data/post/powershell/NTDSgrab.ps1
  - https://github.com/SecureAuthCorp/impacket/blob/7d2991d78836b376452ca58b3d14daa61b67cb40/impacket/examples/secretsdump.py#L2405
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    NTDS Exfiltration Filename Patterns detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.003
  custom_tags:
    - exfiltration
    - filename
    - patterns
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Ll][Ll]\.[Cc][Aa][Bb]/ OR data_win_eventdata_targetFilename:/.*\.[Nn][Tt][Dd][Ss]\.[Cc][Ll][Ee][Aa][Rr][Tt][Ee][Xx][Tt]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: 'Precursor: the ntds.dit copy is created by an uncommon process before being packaged as All.cab'
  - id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
    name: NTDS.DIT Creation By Uncommon Parent Process
    reason: 'Precursor: ntds.dit creation by an uncommon parent process on the same host'
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: 'Precursor: ntdsutil export is how the NTDS data is produced before it is compressed'
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: 'Co-occurring: command patterns for NTDS.dit exfiltration, same tooling family as the All.cab and .ntds.cleartext outputs'
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: 'Co-occurring: Conti operators'' NTDS exfiltration commands (copy and compress of ntds)'
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: 'Same output family: impacket secretsdump writes the .ntds files remotely, the origin of *.ntds.cleartext'
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: 'Precursor: shadow-copy copy of ntds.dit that feeds the grabber'
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: 'Precursor: sensitive file read from a shadow copy backup'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NTDS extraction tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|\\[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].[Ee][Xx][Ee]|\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc].[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee])/) AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Aa][Cc] [Ii] [Nn][Tt][Dd][Ss]|[Ii][Ff][Mm]|[Cc][Rr][Ee][Aa][Tt][Ee] [Ff][Uu][Ll][Ll]|[Ss][Hh][Aa][Dd][Oo][Ww]|[Nn][Tt][Dd][Ss]).*/
    pivot_on:
    - host
    window: 1h
  - name: Impacket/CrackMapExec remote-exec artefacts (ADMIN$ __ output)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Mm][Dd].[Ee][Xx][Ee] +\/[Qq] +\/[Cc].*\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$|\\[Aa][Dd][Mm][Ii][Nn]\$\\__).*/
    pivot_on:
    - host
    window: 1h
  - name: Credential-store files and cab/cleartext artefacts written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Nn][Tt][Dd][Ss].[Dd][Ii][Tt]|[Aa][Ll][Ll].[Cc][Aa][Bb]|[Nn][Tt][Dd][Ss].[Cc][Ll][Ee][Aa][Rr][Tt][Ee][Xx][Tt]|\\[Ss][Yy][Ss][Tt][Ee][Mm]\.([Hh][Ii][Vv]|[Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])|\\[Ss][Aa][Mm]\.([Hh][Ii][Vv]|[Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])|\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.([Hh][Ii][Vv]|[Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])).*/
    pivot_on:
    - host
    window: 2h
  - name: Compression of the harvested files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Rr][Aa][Rr].[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr].[Ee][Xx][Ee]|\\7[Zz].[Ee][Xx][Ee]|\\7[Zz][Aa].[Ee][Xx][Ee]|\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb].[Ee][Xx][Ee]|\\[Tt][Aa][Rr].[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|\\[Ee][Xx][Pp][Aa][Nn][Dd].[Ee][Xx][Ee])/) AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss]|[Aa][Ll][Ll].[Cc][Aa][Bb]|.[Dd][Ii][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm].[Hh][Ii][Vv]|[Nn][Tt][Dd][Ss].[Cc][Ll][Ee][Aa][Rr][Tt][Ee][Xx][Tt]).*/
    pivot_on:
    - host
    window: 4h
  - name: Outbound transfer tooling after the files are created
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Cc][Uu][Rr][Ll].[Ee][Xx][Ee]|\\[Rr][Cc][Ll][Oo][Nn][Ee].[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ss][Cc][Pp].[Cc][Oo][Mm]|\\[Pp][Ss][Cc][Pp].[Ee][Xx][Ee]|\\[Ff][Tt][Pp].[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|\\[Ss][Cc][Pp].[Ee][Xx][Ee])/) AND data_win_eventdata_commandLine:/.*([Hh][Tt][Tt][Pp]|[Ff][Tt][Pp]|[Ss][Ff][Tt][Pp]|-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]|[Uu][Pp][Ll][Oo][Aa][Dd]|[Ss][Yy][Nn][Cc]|/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]).*/
    pivot_on:
    - host
    window: 6h
