name: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl - File
id: d353dac0-1b41-46c2-820c-d7d2561fc6ed
version: 1
schema_version: "1.0"
date: "2022-11-28"
author: Julia Fomina, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d353dac0-1b41-46c2-820c-d7d2561fc6ed
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of attacker-controlled WsmPty.xsl or WsmTxt.xsl via
  winrm.vbs and copied cscript.exe (can be renamed). MITRE ATT&CK: T1216.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*WsmPty.xsl"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*WsmTxt.xsl"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*WsmPty.xsl'; data_win_eventdata_targetFilename matches '*WsmTxt.xsl';
  data_win_eventdata_targetFilename matches 'C:\Windows\System32\*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.specterops.io/application-whitelisting-bypass-and-arbitrary-unsigned-code-execution-technique-in-winrm-vbs-c8c24fb40404
  - https://attack.mitre.org/techniques/T1216/

response:
  message: >
    AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl - File
    detected on host $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1216
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1216
  custom_tags:
    - bypass
    - winrm
    - wsmpty
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ww][Ss][Mm][Pp][Tt][Yy]\.[Xx][Ss][Ll]/ OR data_win_eventdata_targetFilename:/.*[Ww][Ss][Mm][Tt][Xx][Tt]\.[Xx][Ss][Ll]/) AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
    name: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
    reason: 'Process-creation twin of this file-drop: the same attacker-controlled WsmPty/WsmTxt.xsl staging is followed by a copied cscript running winrm.vbs, which executes the XSL payload.'
  - id: 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0
    name: Remote Code Execute via Winrm.vbs
    reason: winrm.vbs with format:pretty/text is the execution trigger that loads the dropped XSL; it confirms the staged file was actually used for code execution.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: If the malicious XSL payload ran, winrm/cscript spawns unexpected child processes; this shows the post-bypass payload.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The bypass relies on a (renamed) cscript.exe host; suspicious children of it reveal what the XSL/script launched.
  - id: 05c36dd6-79d6-4a9a-97da-3db20298ab2d
    name: XSL Script Execution Via WMIC.EXE
    reason: 'Sibling XSL-based AWL bypass (T1220): an operator dropping malicious XSL for winrm.vbs often also tries wmic /format:XSL.'
  - id: 9e50a8b3-dd05-4eb8-9153-bdb6b79d50b0
    name: Msxsl.EXE Execution
    reason: Alternative XSL script-execution LOLBin in the same family of stylesheet-based application-whitelisting bypasses.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: The dropped XSL/script content originates from a dropper; script-host execution of staged files is the likely preceding or concurrent step.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: winrm.vbs run via cscript/wscript (incl. renamed copies) with format option
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Mm]\.[Vv][Bb][Ss].*/
    pivot_on:
    - host
    window: 1h
  - name: cscript.exe copied or executed from non-System32 location
    query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:"cscript.exe" AND NOT data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\(([Ss][Yy][Ss][Tt][Ee][Mm]32)|([Ss][Yy][Ss][Ww][Oo][Ww]64))\\.*/
    pivot_on:
    - host
    window: 1h
  - name: Other file drops in user-writable paths by the same dropper (scripts, XSL, copied binaries)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.([Xx][Ss][Ll]|[Vv][Bb][Ss]|[Vv][Bb][Ee]|[Jj][Ss]|[Ww][Ss][Ff]|[Ee][Xx][Ee]|[Dd][Ll][Ll])/) AND (data_win_eventdata_targetFilename:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp])\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Network connections by script hosts or winrm-driven processes (C2 / payload fetch)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\([Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Suspicious children of script hosts: shells, LOLBins, download tools'
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
