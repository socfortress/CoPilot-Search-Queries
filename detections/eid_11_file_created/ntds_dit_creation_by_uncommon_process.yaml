name: NTDS.DIT Creation By Uncommon Process
id: 11b1ed55-154d-4e82-8ad7-83739298f720
version: 1
schema_version: "1.0"
date: "2022-07-14"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 11b1ed55-154d-4e82-8ad7-83739298f720
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a file named "ntds.dit" (Active Directory Database) by an
  uncommon process or a process located in a suspicious directory. MITRE ATT&CK:
  T1003.002, T1003.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\ntds.dit"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wsl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wt.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AppData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\PerfLogs\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\ntds.dit'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\cscript.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://stealthbits.com/blog/extracting-password-hashes-from-the-ntds-dit-file/
  - https://adsecurity.org/?p=2398
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    NTDS.DIT Creation By Uncommon Process detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.002, T1003.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
    - T1003.003
  custom_tags:
    - uncommon
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
    name: NTDS.DIT Creation By Uncommon Parent Process
    reason: 'Sibling on the same Sysmon event: the same ntds.dit file creation judged by uncommon parent process, confirms which launcher produced it'
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: 'Follow-on: tools that export NTDS name their output All.cab or *.ntds.cleartext, showing the dump was packaged for removal'
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: 'Precursor: ntdsutil IFM export is the most common way ntds.dit lands on disk in a new folder'
  - id: a58353df-af43-4753-bad0-cd83ef35eef5
    name: Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: 'Precursor: suspicious ntdsutil usage (snapshot mount, ifm, create full) that produces the ntds.dit copy'
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: 'Precursor/co-occurring: command-line patterns used to exfiltrate NTDS.dit via copy, ntdsutil or shadow copy'
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: 'Precursor: copying ntds.dit out of a VolumeShadowCopy via cmd, the way a locked live NTDS is read'
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: 'Precursor: sensitive AD/registry file access via a shadow copy backup that yields the ntds.dit copy'
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: 'Alternative path: remote VSS/DRSUAPI dump by secretsdump or CrackMapExec leaves temp files and the same credential-theft outcome'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tooling that extracts NTDS (ntdsutil IFM, diskshadow, vssadmin, esentutl)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|\\[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].[Ee][Xx][Ee]|\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc].[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee])/) AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Aa][Cc] [Ii] [Nn][Tt][Dd][Ss]|[Ii][Ff][Mm]|[Cc][Rr][Ee][Aa][Tt][Ee] [Ff][Uu][Ll][Ll]|[Ss][Hh][Aa][Dd][Oo][Ww]|[Nn][Tt][Dd][Ss]).*/
    pivot_on:
    - host
    window: 1h
  - name: Shadow-copy creation or access used to read the locked NTDS
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]|[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]|[Mm][Kk][Ll][Ii][Nn][Kk] /[Dd]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Cc][Rr][Ee][Aa][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww]|[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]).*/
    pivot_on:
    - host
    window: 1h
  - name: Registry hive saves (SYSTEM/SAM/SECURITY) needed to decrypt ntds.dit
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Aa][Vv][Ee] +.*[Hh][Kk][Ll][Mm]\\([Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])|[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]|[Nn][Tt][Dd][Ss].[Dd][Ii][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: Credential-store files written to disk (ntds.dit, hive saves, All.cab)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Nn][Tt][Dd][Ss].[Dd][Ii][Tt]|[Aa][Ll][Ll].[Cc][Aa][Bb]|[Nn][Tt][Dd][Ss].[Cc][Ll][Ee][Aa][Rr][Tt][Ee][Xx][Tt]|\\[Ss][Yy][Ss][Tt][Ee][Mm]\.([Hh][Ii][Vv]|[Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])|\\[Ss][Aa][Mm]\.([Hh][Ii][Vv]|[Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])|\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.([Hh][Ii][Vv]|[Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])).*/
    pivot_on:
    - host
    window: 2h
  - name: Staging and compression of the dump for exfiltration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Rr][Aa][Rr].[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr].[Ee][Xx][Ee]|\\7[Zz].[Ee][Xx][Ee]|\\7[Zz][Aa].[Ee][Xx][Ee]|\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb].[Ee][Xx][Ee]|\\[Tt][Aa][Rr].[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|\\[Ee][Xx][Pp][Aa][Nn][Dd].[Ee][Xx][Ee])/) AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss]|[Aa][Ll][Ll].[Cc][Aa][Bb]|.[Dd][Ii][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm].[Hh][Ii][Vv]|[Nn][Tt][Dd][Ss].[Cc][Ll][Ee][Aa][Rr][Tt][Ee][Xx][Tt]).*/
    pivot_on:
    - host
    window: 4h
