name: Windows Process Creating LNK File in Suspicious Location
id: windows-process-creating-lnk-suspicious-location-001
version: 1
schema_version: "1.0"
date: "2026-02-16"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects .lnk file creation in suspicious locations such as user profile 
  directories and Temp folders via Sysmon EventID 11 (File Create). This is a 
  common spear phishing technique used by Qakbot, IcedID, Amadey, and Gozi 
  to establish persistence or execute malicious payloads.

data_source:
  - Sysmon EventID 11

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        - wildcard:
            data_win_eventdata_targetFilename: "*.lnk"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename: "C:\\Users\\*"
              - wildcard:
                  data_win_eventdata_targetFilename: "*\\Temp\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-16 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-16 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log file creation events (EventID 11). Ensure Sysmon 
  configuration includes monitoring of .lnk file creation.

known_false_positives: >
  Some legitimate applications may create .lnk files in user directories. Filter 
  based on the creating process image. Browser downloads and application installers 
  are common sources of benign .lnk files.

references:
  - https://attack.mitre.org/techniques/T1566/002/
  - https://www.trendmicro.com/en_us/research/17/e/rising-trend-attackers-using-lnk-files-download-malware.html

response:
  message: >
    Suspicious .lnk file created on $agent_name$. 
    File: $data_win_eventdata_targetFilename$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1566.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Spearphishing Attachments
    - Qakbot
    - IcedID
    - Amadey
    - Gozi Malware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.lnk/ AND (data_win_eventdata_targetFilename:/.*Users.*/ OR data_win_eventdata_targetFilename:/.*Temp.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3215aa19-f060-4332-86d5-5602511f3ca8
    name: Suspicious LNK Double Extension File Created
    reason: A double-extension LNK (invoice.pdf.lnk) is the phishing-delivery form of the same file drop.
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: Once the dropped LNK is clicked, Emotet-style loaders launch cmd/PowerShell from it; confirms execution.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: LNK pointing at a WebDAV share is a staged-payload variant that follows an LNK drop.
  - id: 33339be3-148b-4e16-af56-ad16ec6c7e7b
    name: Findstr Launching .lnk File
    reason: findstr launching a .lnk is a known LNK-based loader technique following the drop.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: LNK payloads commonly chain into wscript/cscript child processes.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Dropper script run via WScript/CScript/MSHTA is the usual next stage after the shortcut is opened.
  - id: 92fa78e7-4d39-45f1-91a3-8b23f3f1088d
    name: Potential Startup Shortcut Persistence Via PowerShell.EXE
    reason: A startup shortcut written by PowerShell turns the LNK into persistence.
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Startup folder writes are the persistence outcome of LNK creation by an unusual process.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shortcut targets launching interpreters
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ll][Nn][Kk].*/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Script/archive/executable drops in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(Users|ProgramData)\\.*\.(js|jse|vbs|hta|ps1|bat|dll|exe|iso|img)/
    pivot_on: host
    window: 4h
  - name: Startup folder writes
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/
    pivot_on: host
    window: 24h
  - name: Network connections from script hosts and LOLBins
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Mm][Ss][Hh][Tt][Aa]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
