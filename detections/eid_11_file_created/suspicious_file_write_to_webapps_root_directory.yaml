name: Suspicious File Write to Webapps Root Directory
id: 89c42960-f244-4dad-9151-ae9b1a3287a2
version: 1
schema_version: "1.0"
date: "2025-10-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 89c42960-f244-4dad-9151-ae9b1a3287a2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious file writes to the root directory of web applications,
  particularly Apache web servers or Tomcat servers. This may indicate an
  attempt to deploy malicious files such as web shells or other unauthorized
  scripts. MITRE ATT&CK: T1505.003, T1190.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dotnet.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\w3wp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\java.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\apache*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\tomcat*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\webapps\\\\ROOT\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.jsp"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\dotnet.exe'; data_win_eventdata_image matches '*\w3wp.exe';
  data_win_eventdata_image matches '*\java.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.watchtowr.com/guess-who-would-be-stupid-enough-to-rob-the-same-vault-twice-pre-auth-rce-chains-in-commvault/
  - https://attack.mitre.org/techniques/T1505/003/
  - https://attack.mitre.org/techniques/T1190/

response:
  message: >
    Suspicious File Write to Webapps Root Directory detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1505.003, T1190
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
    - T1190
  custom_tags:
    - write
    - webapps
    - directory
    - file_event
    - sysmon
    - persistence
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Dd][Oo][Tt][Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt].*/) AND data_win_eventdata_targetFilename:/.*\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\[Rr][Oo][Oo][Tt]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Jj][Ss][Pp]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bd3b3fff-a018-4994-9876-68af5809160f
    name: Commvault QOperation Path Traversal Webshell Drop (CVE-2025-57790)
    reason: 'The origin of this rule''s reference: Commvault path traversal drops a JSP into Tomcat webapps ROOT.'
  - id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
    name: Shell Process Spawned by Java.EXE
    reason: A dropped JSP shell executes commands through the Tomcat java.exe process.
  - id: 0d34ed8b-1c12-4ff2-828c-16fc860b766d
    name: Suspicious Processes Spawned by Java.EXE
    reason: Recon and LOLBin children of Tomcat after the JSP is invoked.
  - id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
    name: Potential Webshell Creation On Static Website
    reason: Sibling file-create detection for webshells in other web roots.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Command-line webshell keywords seen when the dropped shell is used.
  - id: 7c97c625-0350-4f0a-8943-f6cadc88125e
    name: Mint Sandstorm - Log4J Wstomcat Process Execution
    reason: Alternate Tomcat compromise path with the same follow-on process activity.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells and tools spawned by Java, Tomcat or the IIS worker
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Jj][Aa][Vv][Aa].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt].*/ OR data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp].[Ee][Xx][Ee].*/) AND ((data_win_eventdata_image:/.*\\[Cc][Mm][Dd].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]/))
    pivot_on: host
    window: 4h
  - name: JSP, WAR and script creation in other web application directories
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ww][Ww][Rr][Oo][Oo][Tt]\\.*/) AND (data_win_eventdata_targetFilename:/.*.[Jj][Ss][Pp]/ OR data_win_eventdata_targetFilename:/.*.[Jj][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*.[Ww][Aa][Rr]/ OR data_win_eventdata_targetFilename:/.*.[Aa][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*.[Pp][Hh][Pp]/)
    pivot_on: host
    window: 4h
  - name: Download-and-run tooling from the web service account
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll] -[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] [Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from the Java or IIS process (reverse shell or staging)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Jj][Aa][Vv][Aa].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww]3[Ww][Pp].[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
