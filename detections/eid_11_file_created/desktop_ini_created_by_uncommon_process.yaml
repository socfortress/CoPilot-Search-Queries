name: Desktop.INI Created by Uncommon Process
id: 81315b50-6b60-4d8f-9928-3466e1022515
version: 1
schema_version: "1.0"
date: "2025-12-09"
author: Maxime Thiebaut (@0xThiebaut), Tim Shelton (HAWK.IO)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 81315b50-6b60-4d8f-9928-3466e1022515
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects unusual processes accessing desktop.ini, which can be leveraged to
  alter how Explorer displays a folder's content (i.e. renaming files) without
  changing them on disk. MITRE ATT&CK: T1547.009.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\desktop.ini"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "C:\\\\$WINDOWS.~BT\\\\NewOS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\JetBrains\\\\Toolbox\\\\bin\\\\7z.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\JetBrains\\\\apps\\\\*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\OneDrive\\\\*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\desktop.ini'; data_win_eventdata_image matches 'C:\Windows\*';
  data_win_eventdata_image matches 'C:\Program Files\*', among other conditions.

known_false_positives: >
  Operations performed through Windows SCCM or equivalent. Read only access list
  authority. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://isc.sans.edu/forums/diary/Desktopini+as+a+postexploitation+tool/25912/
  - https://attack.mitre.org/techniques/T1547/009/

response:
  message: >
    Desktop.INI Created by Uncommon Process detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1547.009
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.009
  custom_tags:
    - desktop
    - uncommon
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\.[Ii][Nn][Ii]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\\$[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.\~[Bb][Tt]\\[Nn][Ee][Ww][Oo][Ss]\\.*/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetFilename AND NOT ((data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Jj][Ee][Tt][Bb][Rr][Aa][Ii][Nn][Ss]\\[Tt][Oo][Oo][Ll][Bb][Oo][Xx]\\[Bb][Ii][Nn]\\7[Zz]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Jj][Ee][Tt][Bb][Rr][Aa][Ii][Nn][Ss]\\[Aa][Pp][Pp][Ss]\\.*/) OR (data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: desktop.ini writes by an odd process often accompany dropping a payload or shortcut into a Startup folder; same persistence intent, same Sysmon EID 11 telemetry
  - id: 92fa78e7-4d39-45f1-91a3-8b23f3f1088d
    name: Potential Startup Shortcut Persistence Via PowerShell.EXE
    reason: PowerShell-created .lnk in Startup is a common companion to folder-display tricks that disguise the planted file
  - id: 35bc7e28-ee6b-492f-ab04-da58fcf6402e
    name: Windows Network Access Suspicious desktop.ini Action
    reason: same desktop.ini abuse seen over SMB shares; shows the technique spreading to network shares from this host
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: desktop.ini only takes effect on folders with system/read-only attributes, and attackers pair it with attrib +h/+s to conceal the staged content
  - id: efec536f-72e8-4656-8960-5e85d091345b
    name: Set Suspicious Files as System Files Using Attrib.EXE
    reason: marking the folder or desktop.ini as system is required for Explorer to honour the file, so this is the direct companion step
  - id: a8f866e1-bdd4-425e-a27a-37619238d9c7
    name: Potential Hidden Directory Creation Via NTFS INDEX_ALLOCATION Stream
    reason: another way of disguising a folder holding attacker content, often used alongside folder-presentation tricks
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: the technique is tagged persistence; actors who tweak folder presentation typically also add Run-key autostarts for the same payload
  - id: 74babdd6-a758-4549-9632-26535279e654
    name: Suspicious Executable File Creation
    reason: the uncommon process that wrote desktop.ini is usually the dropper that also writes the hidden executable payload into the same folder
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other files written by the process that created desktop.ini
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ll][Nn][Kk]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Cc][Mm][Dd]|[Ss][Cc][Rr])/)
    pivot_on:
    - host
    window: 1h
  - name: Attrib hiding or system-flagging of folders and files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Tt][Tt][Rr][Ii][Bb]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\+[HhSs].*/
    pivot_on:
    - host
    window: 2h
  - name: Startup folder and autostart file writes
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Run key and logon-persistence registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ss][Hh][Ee][Ll][Ll] [Ff][Oo][Ll][Dd][Ee][Rr][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Process lineage and command line of the desktop.ini writer
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*desktop.ini* OR data_win_eventdata_commandLine:*[Ii]con[Rr]esource* OR data_win_eventdata_commandLine:*[Ll]ocalized[Rr]esource[Nn]ame*)
    pivot_on:
    - host
    window: 1h
