name: Pingback Backdoor File Indicators
id: 2bd63d53-84d4-4210-80ff-bf0658f1bf78
version: 1
schema_version: "1.0"
date: "2023-02-17"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2bd63d53-84d4-4210-80ff-bf0658f1bf78
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Pingback backdoor that creates ICMP tunnel for C2 as
  described in the trustwave report. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*updata.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_targetFilename:
              value: "C:\\Windows\\oci.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*updata.exe'; data_win_eventdata_targetFilename equals 'C:\Windows\oci.dll'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/backdoor-at-the-end-of-the-icmp-tunnel
  - https://app.any.run/tasks/4a54c651-b70b-4b72-84d7-f34d301d6406
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Pingback Backdoor File Indicators detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - pingback
    - backdoor
    - indicators
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Uu][Pp][Dd][Aa][Tt][Aa]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Oo][Cc][Ii]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b2400ffb-7680-47c0-b08a-098a7de7e7a9
    name: Pingback Backdoor Activity
    reason: updata.exe configuring and starting MSDTC is the step that makes the service load the dropped oci.dll.
  - id: 35a7dc42-bc6f-46e0-9f83-81f8e56c8d4b
    name: Pingback Backdoor DLL Loading Activity
    reason: msdtc.exe loading C:\Windows\oci.dll proves the sideload executed and the ICMP backdoor is live.
  - id: c0e0bdec-3e3d-47aa-9974-05539c999c89
    name: Registry Modification for OCI DLL Redirection
    reason: MSDTC OCI DLL registry redirection used to load a rogue oci.dll; companion of the file drop.
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: Phantom-DLL planting in Windows folders, the same technique oci.dll uses.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Sideload of non-existent DLLs by system services, which oci.dll through MSDTC exemplifies.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: updata.exe as process or parent
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Pp][Dd][Aa][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Uu][Pp][Dd][Aa][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: MSDTC service configuration and start
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ss][Dd][Tt][Cc].*/) AND data_win_eventdata_image:/.*(\\[Ss][Cc]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|\\[Mm][Ss][Dd][Tt][Cc]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: oci.dll loaded from the Windows folder
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Oo][Cc][Ii]\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 6h
  - name: MSDTC OCI library registry changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Mm][Ss][Dd][Tt][Cc]\\[Mm][Tt][Xx][Oo][Cc][Ii].*/ OR data_win_eventdata_targetObject:/.*[Oo][Rr][Aa][Cc][Ll][Ee][Oo][Cc][Ii][Ll][Ii][Bb].*/ OR data_win_eventdata_targetObject:/.*[Oo][Rr][Aa][Cc][Ll][Ee][Ss][Qq][Ll][Ll][Ii][Bb].*/ OR data_win_eventdata_targetObject:/.*[Oo][Rr][Aa][Cc][Ll][Ee][Xx][Aa][Ll][Ii][Bb].*/)
    pivot_on: host
    window: 6h
  - name: Network activity by msdtc.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Mm][Ss][Dd][Tt][Cc]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 24h
