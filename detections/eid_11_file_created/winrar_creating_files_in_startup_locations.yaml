name: WinRAR Creating Files in Startup Locations
id: 74a2b37d-fea4-41e0-9ac7-c9fbcf1f60cc
version: 1
schema_version: "1.0"
date: "2025-07-16"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 74a2b37d-fea4-41e0-9ac7-c9fbcf1f60cc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects WinRAR creating files in Windows startup locations, which may indicate
  an attempt to establish persistence by adding malicious files to the Startup
  folder. This kind of behaviour has been associated with exploitation of WinRAR
  path traversal vulnerability CVE-2025-6218 or CVE-2025-8088. MITRE ATT&CK:
  T1547.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WinRAR.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Rar.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Start Menu\\\\Programs\\\\Startup\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\WinRAR.exe'; data_win_eventdata_image matches '*\Rar.exe';
  data_win_eventdata_targetFilename matches '*\Start Menu\Programs\Startup\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/mulwareX/CVE-2025-6218-POC
  - https://x.com/0x534c/status/1944694507787710685
  - https://www.welivesecurity.com/en/eset-research/update-winrar-tools-now-romcom-and-others-exploiting-zero-day-vulnerability/
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    WinRAR Creating Files in Startup Locations detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1547.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - winrar
    - creating
    - startup
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a6976974-ea6f-4e97-818e-ea08625c52cb
    name: Potential RipZip Attack on Startup Folder
    reason: Generic archive path-traversal into Startup; same technique class as CVE-2025-6218/8088.
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Corroborates the Startup write irrespective of writer.
  - id: Windows_EXE_File_Created_in_Startup_Folder
    name: Windows EXE File Created in Startup Folder
    reason: If the extracted file is an EXE it triggers this too; confirms payload type.
  - id: 28208707-fe31-437f-9a7f-4b1108b94d2e
    name: Suspicious Startup Folder Persistence
    reason: Catches script or shortcut payloads placed in Startup.
  - id: 146aace8-9bd6-42ba-be7a-0070d8027b76
    name: Potentially Suspicious Child Process Of WinRAR.EXE
    reason: WinRAR spawning shells or interpreters is a parallel exploitation outcome.
  - id: ec3a3c2f-9bb0-4a9b-8f4b-5ec386544343
    name: CVE-2023-38331 Exploitation Attempt - Suspicious WinRAR Child Process
    reason: Earlier WinRAR exploit family; same abuse of the archiver.
  - id: e4556676-fc5c-4e95-8c39-5ef27791541f
    name: CVE-2023-38331 Exploitation Attempt - Suspicious Double Extension File
    reason: Double-extension lures extracted by WinRAR accompany these exploits.
  - id: e5a29b54-6fe7-4258-8a23-82960e31231a
    name: CVE-2023-40477 Potential Exploitation - WinRAR Application Crash
    reason: WinRAR crash events from malformed archives indicate exploitation attempts.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Everything WinRAR wrote to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*(WinRAR|Rar|UnRAR)[.]exe/
    pivot_on: host
    window: 2h
  - name: Execution of binaries or scripts from Startup folders
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*Start Menu.Programs.Startup.*/
    pivot_on: host
    window: 24h
  - name: Archive downloads (the lure)
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[.](rar|zip|7z).*/ AND data_win_eventdata_targetFilename:/.*(Downloads|Temp|Outlook|INetCache|AppData).*/
    pivot_on: host
    window: 6h
  - name: Child processes of WinRAR
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(WinRAR|Rar)[.]exe/
    pivot_on: host
    window: 2h
  - name: Network connections from processes in user profile paths
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*(AppData|Startup|Temp|Public).*/
    pivot_on: host
    window: 24h
