name: Anydesk Temporary Artefact
id: 0b9ad457-2554-44c1-82c2-d56a99c42377
version: 1
schema_version: "1.0"
date: "2024-07-20"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0b9ad457-2554-44c1-82c2-d56a99c42377
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Roaming\\\\AnyDesk\\\\user.conf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Roaming\\\\AnyDesk\\\\system.conf*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Roaming\AnyDesk\user.conf*'; data_win_eventdata_targetFilename
  matches '*\AppData\Roaming\AnyDesk\system.conf*'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-2---anydesk-files-detected-test-on-windows
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Anydesk Temporary Artefact detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - anydesk
    - temporary
    - artefact
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\\[Uu][Ss][Ee][Rr]\.[Cc][Oo][Nn][Ff].*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\\[Ss][Yy][Ss][Tt][Ee][Mm]\.[Cc][Oo][Nn][Ff].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: AnyDesk only writes user.conf/system.conf in AppData\Roaming after the client process has run, so process creation of AnyDesk.exe on the same host is the direct cause of this file artefact.
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: Attackers deploy AnyDesk with --install --silent; the config files appear as a result, so silent install confirms scripted deployment rather than a user download.
  - id: b1377339-fda6-477a-b455-ac0923f9ec2c
    name: Remote Access Tool - AnyDesk Piped Password Via CLI
    reason: Setting an unattended-access password via 'echo | anydesk --set-password' right after the config files are created is the step that gives the operator persistent hands-on access.
  - id: 065b00ca-5d5c-4557-ac95-64a6d0b64d86
    name: Remote Access Tool - Anydesk Execution From Suspicious Folder
    reason: Portable AnyDesk run from Temp/Downloads/Public (the typical way it is dropped) is what generates the config artefacts, separating attacker use from sanctioned installs in Program Files.
  - id: 530a6faa-ff3d-4022-b315-50828e77eef5
    name: Anydesk Remote Access Software Service Installation
    reason: AnyDesk installing as a Windows service after first config creation indicates it was set up for persistent unattended access that survives logoff and reboot.
  - id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
    name: Remote Access Tool - AnyDesk Incoming Connection
    reason: 'Follow-on: the remote operator actually connecting to the session on this host (port 7070 / relay) confirms the tool is in live use as a C2 channel.'
  - id: 2d367498-5112-4ae5-a06a-96e7bc33a211
    name: Suspicious Binary Writes Via AnyDesk
    reason: Once connected, operators use AnyDesk file transfer to push tooling; executables written by the AnyDesk process on the same host show payload staging.
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: AnyDesk resolving its relay/rendezvous domains from a non-browser process on the host corroborates an active client reaching the AnyDesk network.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AnyDesk process launched with install, password or unattended-access arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/ AND (data_win_eventdata_commandLine:/.*--install.*/ OR data_win_eventdata_commandLine:/.*--silent.*/ OR data_win_eventdata_commandLine:/.*--set-password.*/ OR data_win_eventdata_commandLine:/.*--start-with-win.*/ OR data_win_eventdata_commandLine:/.*--remove-first.*/)
    pivot_on:
    - host
    window: 2h
  - name: AnyDesk network connections and relay DNS lookups
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/) OR (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*anydesk.com* OR data_win_eventdata_queryName:*net.anydesk.com* OR data_win_eventdata_queryName:*anydesk.net*))
    pivot_on:
    - host
    window: 2h
  - name: Files dropped by AnyDesk process (file transfer staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/ AND NOT data_win_eventdata_targetFilename:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\\.*/
    pivot_on:
    - host
    window: 4h
  - name: AnyDesk persistence via service, Run key or scheduled task
    query: ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/ AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/))
    pivot_on:
    - host
    window: 4h
  - name: Hands-on-keyboard discovery or account creation spawned under AnyDesk
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/ AND (data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|whoami|net|net1|nltest|ipconfig|systeminfo|reg|wmic)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? [Uu][Ss][Ee][Rr].*/)
    pivot_on:
    - host
    window: 4h
