name: Suspicious PROCEXP152.sys File Created In TMP
id: 3da70954-0f2c-4103-adff-b7440368f50e
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: xknow (@xknow_infosec), xorxes (@xor_xes)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3da70954-0f2c-4103-adff-b7440368f50e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of the PROCEXP152.sys file in the application-data local
  temporary folder. This driver is used by Sysinternals Process Explorer but
  also by KDU (https://github.com/hfiref0x/KDU) or Ghost-In-The-Logs
  (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU. MITRE ATT&CK:
  T1685.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*PROCEXP152.sys"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp64.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp64a.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procmon64.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procmon64a.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procmon.exe*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\*'; data_win_eventdata_targetFilename matches
  '*PROCEXP152.sys'; data_win_eventdata_image matches '*\procexp64.exe*', among
  other conditions.

known_false_positives: >
  Other legimate tools using this driver and filename (like Sysinternals). Note
  - Clever attackers may easily bypass this detection by just renaming the
  driver filename. Therefore just Medium-level and don't rely on it. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Suspicious PROCEXP152.sys File Created In TMP detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - procexp152
    - file_event
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Cc][Ee][Xx][Pp]152\.[Ss][Yy][Ss]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64[Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]64\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]64[Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de46c52b-0bf8-4936-a327-aace94f94ac6
    name: Process Explorer Driver Creation By Non-Sysinternals Binary
    reason: Same driver drop seen from the Sysinternals-driver angle; confirms a non-Sysinternals binary staged the signed vulnerable driver.
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: KDU is the tool that drops PROCEXP152.sys; its execution is the direct precursor.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: The dropped driver is next loaded from a Temp directory, the BYOVD step following file creation.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: Driver load by known-malicious name would confirm the driver was actually loaded.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Kernel driver registration via sc.exe is how the dropped .sys is typically loaded.
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: KDU/Ghost-In-The-Logs goal is blinding Sysmon; altitude change is the follow-on evasion.
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Unloading a filter driver (Sysmon) via fltmc is a follow-on log-evasion step after kernel access.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Driver-load events from AppData
    query: data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Ss][Yy][Ss]/
    pivot_on: host
    window: 1h
  - name: KDU or driver-loader command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Kk][Dd][Uu].*-[Pp][Rr][Vv].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Xx][Pp]152.*/ OR data_win_eventdata_originalFileName:/[Kk][Dd][Uu]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Kernel service/driver creation
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (data_win_system_eventID:"7045" AND data_win_eventdata_serviceType:/.*[Kk]ernel.*/)
    pivot_on: host
    window: 2h
  - name: Sysmon/ETW tampering after driver load
    query: (data_win_system_eventID:"16") OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/)
    pivot_on: host
    window: 2h
  - name: Executables written to Temp
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*\.([Ss][Yy][Ss]|[Ee][Xx][Ee]|[Dd][Ll][Ll])/
    pivot_on: host
    window: 1h
