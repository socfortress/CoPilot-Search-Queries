name: InstallerFileTakeOver LPE CVE-2021-41379 File Create Event
id: 3be82d5d-09fe-4d6a-a275-0d40d234d324
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3be82d5d-09fe-4d6a-a275-0d40d234d324
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects signs of the exploitation of LPE CVE-2021-41379 that include an
  msiexec process that creates an elevation_service.exe file. MITRE ATT&CK:
  T1068.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\msiexec.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Program Files (x86)\\\\Microsoft\\\\Edge\\\\Application*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\elevation_service.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\msiexec.exe'; data_win_eventdata_targetFilename matches 'C:\Program Files
  (x86)\Microsoft\Edge\Application*'; data_win_eventdata_targetFilename matches
  '*\elevation_service.exe'.

known_false_positives: >
  Unknown. Possibly some Microsoft Edge upgrades. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://web.archive.org/web/20220421061949/https://github.com/klinix5/InstallerFileTakeOver
  - https://www.zerodayinitiative.com/advisories/ZDI-21-1308/
  - https://attack.mitre.org/techniques/T1068/

response:
  message: >
    InstallerFileTakeOver LPE CVE-2021-41379 File Create Event detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1068
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1068
  custom_tags:
    - installerfiletakeover
    - create
    - file_event
    - sysmon
    - privilege_escalation
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_targetFilename:/.*\\[Ee][Ll][Ee][Vv][Aa][Tt][Ii][Oo][Nn]_[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: af8bbce4-f751-46b4-8d91-82a33a736f61
    name: Potential CVE-2021-41379 Exploitation Attempt
    reason: 'Same CVE: process-creation view of the InstallerFileTakeOver PoC (msiexec rollback abuse), confirming the file drop was exploit execution.'
  - id: 7dbb86de-a0cc-494c-8aa8-b2996c9ef3c8
    name: LPE InstallerFileTakeOver PoC CVE-2021-41379
    reason: Same exploit seen in the Application event log (MsiInstaller errors from the PoC), an independent confirmation on the host.
  - id: 4a2a2c3e-209f-4d01-b513-4155a540b469
    name: Suspicious MsiExec Embedding Parent
    reason: The exploit drives the Windows Installer service via msiexec; abnormal msiexec parentage accompanies the elevation_service.exe overwrite.
  - id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
    name: Potential MsiExec Masquerading
    reason: PoC binaries may run as a renamed or relocated msiexec, indicating the same exploit staging.
  - id: cd951fdc-4b2f-47f5-ba99-a33bf61e3770
    name: Always Install Elevated Windows Installer
    reason: Alternate Windows Installer privilege-escalation path; co-occurs when an attacker probes installer-based LPE.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Once the replaced Edge elevation service runs as SYSTEM, SYSTEM child processes are the likely post-exploitation step.
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: Attackers check privileges (whoami /priv) before the exploit and to verify SYSTEM afterwards.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: With SYSTEM obtained, LSASS credential dumping is the typical follow-on from local privilege escalation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Edge directory file writes by non-updater processes
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ AND NOT data_win_eventdata_image:/.*[Mm][Ss][Ee][Dd][Gg][Ee][Uu][Pp][Dd][Aa][Tt][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: msiexec executions and children with command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: SYSTEM or elevation_service children spawning shells/recon
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ee][Ll][Ee][Vv][Aa][Tt][Ii][Oo][Nn]_[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1)\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 1h
  - name: Executables/installers dropped in user-writable paths (PoC staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Mm][Ss][Ii]|[Rr][Bb][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Service creation or autorun persistence after elevation
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(sc(\.exe)? +create|schtasks.*\/create|net +(user|localgroup).*\/add).*/)
    pivot_on:
    - host
    window: 4h
