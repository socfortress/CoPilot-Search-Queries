name: ADSI-Cache File Creation By Uncommon Tool
id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
version: 1
schema_version: "1.0"
date: "2023-10-18"
author: xknow @xknow_infosec, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of an "Active Directory Schema Cache File" (.sch) file by
  an uncommon tool. MITRE ATT&CK: T1001.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Local\\\\Microsoft\\\\Windows\\\\SchCache\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.sch"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\Cylance\\\\Desktop\\\\CylanceSvc.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\CCM\\\\CcmExec.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\windows\\\\system32\\\\dllhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\system32\\\\dsac.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\system32\\\\efsui.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\windows\\\\system32\\\\mmc.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\windows\\\\system32\\\\svchost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\wbem\\\\WmiPrvSE.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\windows\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\ccmsetup\\\\autoupgrade\\\\ccmsetup*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\SentinelOne\\\\Sentinel Agent*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Program Files\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Microsoft Office*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\OUTLOOK.EXE"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\LANDesk\\\\LDCLient\\\\ldapwhoami.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\Citrix\\\\Receiver StoreFront\\\\Services\\\\DefaultDomainServices\\\\Citrix.DeliveryServices.DomainServices.ServiceHost.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Local\Microsoft\Windows\SchCache\*'; data_win_eventdata_targetFilename
  matches '*.sch'; data_win_eventdata_image matches '*:\Program
  Files\Cylance\Desktop\CylanceSvc.exe', among other conditions.

known_false_positives: >
  Other legimate tools, which do ADSI (LDAP) operations, e.g. any remoting
  activity by MMC, Powershell, Windows etc. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://medium.com/@ivecodoe/detecting-ldapfragger-a-newly-released-cobalt-strike-beacon-using-ldap-for-c2-communication-c274a7f00961
  - https://blog.fox-it.com/2020/03/19/ldapfragger-command-and-control-over-ldap-attributes/
  - https://github.com/fox-it/LDAPFragger
  - https://attack.mitre.org/techniques/T1001/003/

response:
  message: >
    ADSI-Cache File Creation By Uncommon Tool detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1001.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1001.003
  custom_tags:
    - cache
    - uncommon
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Cc][Hh][Cc][Aa][Cc][Hh][Ee]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Hh]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Yy][Ll][Aa][Nn][Cc][Ee]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Cc][Yy][Ll][Aa][Nn][Cc][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Cc][Mm]\\[Cc][Cc][Mm][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ss][Aa][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ee][Ff][Ss][Uu][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Vv]1\.0\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Cc][Mm][Ss][Ee][Tt][Uu][Pp]\\[Aa][Uu][Tt][Oo][Uu][Pp][Gg][Rr][Aa][Dd][Ee]\\[Cc][Cc][Mm][Ss][Ee][Tt][Uu][Pp].*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Oo][Nn][Ee]\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll] [Aa][Gg][Ee][Nn][Tt].*/ OR (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee].*/ AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/)) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Ll][Aa][Nn][Dd][Ee][Ss][Kk]\\[Ll][Dd][Cc][Ll][Ii][Ee][Nn][Tt]\\[Ll][Dd][Aa][Pp][Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Ii][Tt][Rr][Ii][Xx]\\[Rr][Ee][Cc][Ee][Ii][Vv][Ee][Rr] [Ss][Tt][Oo][Rr][Ee][Ff][Rr][Oo][Nn][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Dd][Oo][Mm][Aa][Ii][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Cc][Ii][Tt][Rr][Ii][Xx]\.[Dd][Ee][Ll][Ii][Vv][Ee][Rr][Yy][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b3ad3c0f-c949-47a1-a30e-b0491ccae876
    name: Uncommon Connection to Active Directory Web Services
    reason: 'Same tool doing directory work: an uncommon process that wrote a SchCache .sch file is likely also talking to AD over ADWS/LDAP, so the network side of the same LDAP session.'
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: SharpHound/BloodHound enumerate AD via LDAP/ADSI and populate the schema cache on first use; a precursor or co-occurring cause of the .sch write.
  - id: 02773bed-83bf-469f-b7ff-e676e7d78bab
    name: BloodHound Collection Files
    reason: 'Follow-on: after ADSI enumeration the collector writes JSON/zip output files on the same host, confirming recon rather than LDAP C2.'
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is a native LDAP client that creates the schema cache; AD reconnaissance by an uncommon binary is the most common benign-looking cause of this alert.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: Command-line confirmation of ransomware-style AD enumeration (objectcategory, trustdmp, subnets) driving the LDAP activity behind the schema cache.
  - id: 9f8fc146-1d1a-4dbf-b8fd-dfae15e08541
    name: HackTool - SharpLDAPmonitor Execution
    reason: Offensive LDAP tooling polling attributes over LDAP, the same channel LDAPFragger abuses for C2 and that produces ADSI cache files.
  - id: d9367cbb-c2e0-47ce-bdc0-128cb6da898d
    name: HackTool - SharpLdapWhoami Execution
    reason: Post-compromise LDAP identity check from an implant host; a .NET LDAP client that loads ADSI and creates the schema cache.
  - id: de7fcadc-04f3-11ec-a241-acde48001122
    name: AdsiSearcher Account Discovery
    reason: PowerShell [adsisearcher] account discovery uses ADSI and is the scripted counterpart of the same LDAP queries; shows the operator moving from implant to domain enumeration.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Non-system processes connecting to LDAP/GC/ADWS ports
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"3269" OR data_win_eventdata_destinationPort:"9389") AND NOT (data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: AD recon tooling execution (AdFind, SharpHound, dsquery, ldifde)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee]|[Ll][Dd][Aa][Pp][Ss][Ee][Aa][Rr][Cc][Hh])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Oo][Bb][Jj][Ee][Cc][Tt][Cc][Aa][Tt][Ee][Gg][Oo][Rr][Yy]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|[Tt][Rr][Uu][Ss][Tt][Dd][Mm][Pp]|-[Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Ee][Tt][Hh][Oo][Dd]).*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell ADSI / DirectorySearcher script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*adsisearcher* OR data_win_eventdata_scriptBlockText:*DirectorySearcher* OR data_win_eventdata_scriptBlockText:*System.DirectoryServices* OR data_win_eventdata_scriptBlockText:*LDAP\:\/\/*)
    pivot_on:
    - host
    window: 2h
  - name: Recon output or beacon artifacts written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|_[Uu][Ss][Ee][Rr][Ss]|_[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss]|_[Gg][Rr][Oo][Uu][Pp][Ss]|_[Dd][Oo][Mm][Aa][Ii][Nn][Ss]).*\.([Jj][Ss][Oo][Nn]|[Zz][Ii][Pp])/ OR data_win_eventdata_targetFilename:/.*\\([Aa][Dd][Ff][Ii][Nn][Dd]|[Aa][Dd]_?[Oo][Uu][Tt]).*\.([Tt][Xx][Tt]|[Cc][Ss][Vv])/)
    pivot_on:
    - host
    window: 4h
  - name: Remote thread creation or injection into processes (beacon behaviour)
    query: data_win_system_eventID:"8" AND NOT (data_win_eventdata_sourceImage:/.*\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Ww][Ii][Nn][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
