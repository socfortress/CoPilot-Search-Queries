name: Installation of TeamViewer Desktop
id: 9711de76-5d4f-4c50-a94f-21e4e8f8384d
version: 1
schema_version: "1.0"
date: "2022-01-28"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9711de76-5d4f-4c50-a94f-21e4e8f8384d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  TeamViewer_Desktop.exe is create during install. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\TeamViewer_Desktop.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\TeamViewer_Desktop.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-1---teamviewer-files-detected-test-on-windows
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Installation of TeamViewer Desktop detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - installation
    - teamviewer
    - desktop
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]_[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 162ab1e4-6874-4564-853c-53ec3ab8be01
    name: TeamViewer Remote Session
    reason: 'Direct follow-on: TeamViewer session/connection log files written after install show the tool was actually used for an inbound remote session.'
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: 'Co-occurring: execution of remote access software on the same host confirms the installed tool is running.'
  - id: 0b9ad457-2554-44c1-82c2-d56a99c42377
    name: Anydesk Temporary Artefact
    reason: 'Same-class co-occurrence: attackers often deploy redundant remote-access tools (TeamViewer plus AnyDesk) for resilient access.'
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: 'Redundant-RAT pattern: silent install of a second remote tool alongside TeamViewer suggests deliberate access staging, not helpdesk use.'
  - id: fec96f39-988b-4586-b746-b93d59fd1922
    name: ScreenConnect Temporary Installation Artefact
    reason: 'Same-class co-occurrence: ScreenConnect is another RMM favored for hands-on-keyboard access; both on one host suggests tool staging.'
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: TeamViewer installs a service for unattended access; a suspicious service creation nearby reveals persistence or a separate implant.
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: 'Likely next step: after securing remote access, attackers create a backup local admin account for durable access.'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Likely next step: Run-key persistence keeps the remote client or a companion payload alive across reboots.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: TeamViewer process execution and unattended-access command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Tt]eam[Vv]iewer.*/ OR data_win_eventdata_parentImage:/.*\[Tt]eam[Vv]iewer.*/ OR data_win_eventdata_commandLine:/.*[Tt]eam[Vv]iewer.*(--|\/)([Ss]ilent|[Pp]assword|[Ss]etup|[Ss]ervice|[Cc]onnect|[Aa]ssign).*/)
    pivot_on:
    - host
    window: 2h
  - name: Network and DNS contact with TeamViewer infrastructure
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\[Tt]eam[Vv]iewer.*/) OR (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Tt]eam[Vv]iewer\.com|[Rr]outer[0-9]*\.[Tt]eam[Vv]iewer).*/)
    pivot_on:
    - host
    window: 2h
  - name: TeamViewer files and session logs written on host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*[Tt]eam[Vv]iewer*.exe OR data_win_eventdata_targetFilename:*[Tt]eam[Vv]iewer*.msi OR data_win_eventdata_targetFilename:*[Tt]eam[Vv]iewer*Logfile*.log OR data_win_eventdata_targetFilename:*Connections_incoming.txt)
    pivot_on:
    - host
    window: 2h
  - name: 'Access hardening after remote tool install: new accounts, firewall, services'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]et1? +user .*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? +localgroup +[Aa]dministrators.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*[Aa]dvfirewall.*[Aa]dd.*/ OR data_win_eventdata_commandLine:/.*(sc|sc\.exe) +(create|config).*/)
    pivot_on:
    - host
    window: 4h
  - name: Other remote-access/RMM tools staged on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\([Aa]ny[Dd]esk|[Ss]creen[Cc]onnect.*|[Aa]tera[Aa]gent|[Rr]ust[Dd]esk|[Ss]plashtop.*|[Nn]et[Ss]upport.*|[Uu]ltra[Vv]iewer|[Mm]esh[Aa]gent|[Ll]og[Mm]e[Ii]n.*|[Rr]utserv|[Tt]ight[Vv][Nn][Cc]).*/
    pivot_on:
    - host
    window: 24h
