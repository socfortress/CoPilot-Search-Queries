name: New Outlook Macro Created
id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: "@ScoubiMtl"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a macro file for Outlook. MITRE ATT&CK: T1137, T1008,
  T1546.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\outlook.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Microsoft\\\\Outlook\\\\VbaProject.OTM"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\outlook.exe'; data_win_eventdata_targetFilename matches
  '*\Microsoft\Outlook\VbaProject.OTM'.

known_false_positives: >
  User genuinely creates a VB Macro for their email. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.mdsec.co.uk/2020/11/a-fresh-outlook-on-mail-based-persistence/
  - https://attack.mitre.org/techniques/T1137/
  - https://attack.mitre.org/techniques/T1008/
  - https://attack.mitre.org/techniques/T1546/

response:
  message: >
    New Outlook Macro Created detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1137, T1008, T1546
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137
    - T1008
    - T1546
  custom_tags:
    - outlook
    - macro
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Vv][Bb][Aa][Pp][Rr][Oo][Jj][Ee][Cc][Tt]\.[Oo][Tt][Mm]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3edc6a5-d9d4-48d8-930e-aab518390917
    name: Potential Persistence Via Outlook Form
    reason: Outlook form persistence, a sibling Outlook persistence method often used alongside VbaProject.OTM.
  - id: 9a0b8719-cd3c-4f0a-90de-765a4cb3f5ed
    name: Microsoft VBA For Outlook Addin Loaded Via Outlook
    reason: 'Next step: Outlook loading the VBA add-in on start shows the macro is active.'
  - id: 55f0a3a1-846e-40eb-8273-677371b8d912
    name: Outlook EnableUnsafeClientMailRules Setting Enabled
    reason: Outlook security setting weakening that accompanies macro-based persistence.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: 'Payload execution: suspicious children spawned by Outlook when the macro fires.'
  - id: e212d415-0e93-435f-9e1a-f29005bb4723
    name: Suspicious Remote Child Process From Outlook
    reason: 'Payload execution: remote child process from Outlook run by the macro.'
  - id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
    name: Potential Persistence Via Microsoft Office Add-In
    reason: Other Office persistence (add-ins) frequently planted in the same operation.
  - id: ab871450-37dc-4a3a-997f-6662aa8ae0f1
    name: Disable Macro Runtime Scan Scope
    reason: Macro runtime scan disabled lets the VBA run without AMSI inspection.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: VBA for Outlook add-in loaded
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*[Vv][Bb][Ee][Ff][Oo][Rr][Oo][Uu][Tt][Ll][Oo][Oo][Kk].*/ OR data_win_eventdata_imageLoaded:/.*[Vv][Bb][Ee]7.*/)
    pivot_on: host
    window: 24h
  - name: Outlook spawning scripts or shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|certutil|bitsadmin)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Outlook macro security registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Oo]ffice.*[Oo]utlook.*[Ss]ecurity.*/
    pivot_on: host
    window: 24h
  - name: Outlook network connections to non-mail ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND NOT (data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"993" OR data_win_eventdata_destinationPort:"587")
    pivot_on: host
    window: 24h
  - name: Other Office persistence file drops
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Oo]utlook\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*\.([Xx][Ll][Aa]|[Ww][Ll][Ll]|[Dd][Oo][Tt][Mm]|[Xx][Ll][Aa][Mm])/)
    pivot_on: host
    window: 24h
