name: Adwind RAT / JRAT File Artifact
id: 0bcfabcb-7929-47f4-93d6-b33fb67d34d1
version: 1
schema_version: "1.0"
date: "2022-12-02"
author: Florian Roth (Nextron Systems), Tom Ueltschi, Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0bcfabcb-7929-47f4-93d6-b33fb67d34d1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects javaw.exe in AppData folder as used by Adwind / JRAT. MITRE ATT&CK:
  T1059.005, T1059.007.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\AppData\\\\Roaming\\\\Oracle\\\\bin\\\\java*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.exe*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\Retrive*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*.vbs*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Roaming\Oracle\bin\java*'; data_win_eventdata_targetFilename
  matches '*.exe*'; data_win_eventdata_targetFilename matches '*\Retrive*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hybrid-analysis.com/sample/ba86fa0d4b6af2db0656a88b1dd29f36fe362473ae8ad04255c4e52f214a541c?environmentId=100
  - https://www.first.org/resources/papers/conf2017/Advanced-Incident-Detection-and-Threat-Hunting-using-Sysmon-and-Splunk.pdf
  - https://attack.mitre.org/techniques/T1059/005/
  - https://attack.mitre.org/techniques/T1059/007/

response:
  message: >
    Adwind RAT / JRAT File Artifact detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.005, T1059.007
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.005
    - T1059.007
  custom_tags:
    - adwind
    - artifact
    - file_event
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Oo][Rr][Aa][Cc][Ll][Ee]\\[Bb][Ii][Nn]\\[Jj][Aa][Vv][Aa].*/ AND data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/) OR (data_win_eventdata_targetFilename:/.*\\[Rr][Ee][Tt][Rr][Ii][Vv][Ee].*/ AND data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1fac1481-2dbc-48b2-9096-753c49b4ec71
    name: Adwind RAT / JRAT
    reason: 'Process-creation counterpart of the same family: the dropped AppData Roaming Oracle bin javaw.exe being launched, or the JAR run via java, confirms the file artifact became live execution.'
  - id: 0d34ed8b-1c12-4ff2-828c-16fc860b766d
    name: Suspicious Processes Spawned by Java.EXE
    reason: Adwind runs inside java/javaw; cmd, wscript, powershell or other children spawned by the Java runtime are its post-infection command execution.
  - id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
    name: Shell Process Spawned by Java.EXE
    reason: A RAT operator's remote shell shows up as cmd/powershell under the dropped javaw.exe.
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Adwind/JRAT persists by writing a launcher or VBS to the Startup folder; follows the AppData Oracle drop.
  - id: 28208707-fe31-437f-9a7f-4b1108b94d2e
    name: Suspicious Startup Folder Persistence
    reason: 'Persistence stage: dropped java/VBS launcher placed in Startup to survive reboot.'
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: Scheduled-task persistence pointing at the AppData-resident javaw.exe or Retrive*.vbs dropper.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Run-key persistence for the dropped javaw.exe or VBS is the common Adwind follow-on.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The Retrive*.vbs branch of this rule means wscript executes the VBS stager which then launches java/PowerShell children.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Java runtime launched from AppData or user-writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Jj][Aa][Vv][Aa][Ww]?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Java or wscript/cscript spawning shells, VBS or JAR execution
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_parentImage:/.*[Jj][Aa][Vv][Aa][Ww]?\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Ee][Gg]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/) OR data_win_eventdata_commandLine:/.*[Jj][Aa][Vv][Aa].* -[Jj][Aa][Rr].*/ OR (data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Network connections from javaw/java or script hosts (RAT C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Jj][Aa][Vv][Aa][Ww]?|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Persistence for Java or VBS dropper (Run keys, Startup folder)
    query: ((data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND (data_win_eventdata_details:/.*[Jj][Aa][Vv][Aa].*/ OR data_win_eventdata_details:/.*\.[Vv][Bb][Ss].*/ OR data_win_eventdata_details:/.*[Oo][Rr][Aa][Cc][Ll][Ee].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ AND (data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Aa][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Ll][Nn][Kk]/)))
    pivot_on:
    - host
    window: 4h
