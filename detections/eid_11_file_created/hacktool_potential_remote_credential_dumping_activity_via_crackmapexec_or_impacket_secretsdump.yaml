name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: SecurityAura
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects default filenames output from the execution of CrackMapExec and
  Impacket-secretsdump against an endpoint. MITRE ATT&CK: T1003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - regexp:
            data_win_eventdata_targetFilename: ".*(\\\\Windows\\\\System32\\\\[a-zA-Z0-9]{8}\\.tmp)"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\svchost.exe'; data_win_eventdata_targetFilename matches the regex
  /.*(\\Windows\\System32\\[a-zA-Z0-9]{8}\.tmp)/.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Porchetta-Industries/CrackMapExec
  - https://github.com/fortra/impacket/blob/ff8c200fd040b04d3b5ff05449646737f836235d/examples/secretsdump.py
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or
    Impacket-Secretsdump detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - hacktool
    - credential
    - dumping
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*(\\Windows\\System32\\[a-zA-Z0-9]{8}\.tmp)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 252902e3-5830-4cf6-bf21-c22083dfd5cf
    name: Possible Impacket SecretDump Remote Activity
    reason: 'Same secretsdump run seen from the network side: the DRSUAPI/remote-registry share access that precedes the svchost-written random .tmp output file.'
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Secretsdump starts the RemoteRegistry service and runs reg save over SVCCTL; the 8-char .tmp file is that service-spawned output.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Impacket remote service install over SMB is the common execution channel that precedes the dump on the same target.
  - id: 736ffa74-5f6f-44ca-94ef-1c0df4f51d2a
    name: HackTool - CrackMapExec File Indicators
    reason: Other CrackMapExec default output files created on the same host by the same tool run (co-occurring file artifacts).
  - id: 03f4ca17-de95-428d-a75a-4ee78b047256
    name: HackTool - Impacket File Indicators
    reason: Impacket default output files on the same host confirm the same toolkit alongside the secretsdump .tmp file.
  - id: efc21479-9e83-41da-8cf1-122e06ba8db3
    name: HackTool - NetExec File Indicators
    reason: NetExec (CME successor) leaves comparable file artifacts and shares the same remote SAM/LSA dump behaviour.
  - id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
    name: Wmiexec Default Output File
    reason: Impacket wmiexec output file; the same operator often uses wmiexec/smbexec for remote execution before or after the dump.
  - id: 52a85084-6989-40c3-8f32-091e12e13f09
    name: smbexec.py Service Installation
    reason: Impacket smbexec service creation on the same host is a follow-on or alternate lateral-execution step by the same credentials.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive saves (SAM/SECURITY/SYSTEM) and RemoteRegistry use on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*(HKLM|HKEY_LOCAL_MACHINE)\\(SAM|SECURITY|SYSTEM).*/
    pivot_on:
    - host
    window: 1h
  - name: Service creation or RemoteRegistry start by remote execution tooling
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(create|config|start).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*\/[Qq] \/[Cc].*\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on:
    - host
    window: 1h
  - name: Network logons (type 3) to this host from remote sources
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - host
    window: 2h
  - name: Inbound SMB/RPC connections to this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135") AND data_win_eventdata_initiated:"false"
    pivot_on:
    - host
    window: 1h
  - name: Harvested account used for logons across hosts
    query: data_win_system_eventID:"4624" OR data_win_system_eventID:"4625"
    pivot_on:
    - user
    window: 6h
