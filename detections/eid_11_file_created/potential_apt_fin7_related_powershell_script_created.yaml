name: Potential APT FIN7 Related PowerShell Script Created
id: a88d9f45-ec8a-4b0e-85ee-c9f6a65e9128
version: 1
schema_version: "1.0"
date: "2023-05-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a88d9f45-ec8a-4b0e-85ee-c9f6a65e9128
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell script file creation with specific name or suffix which was
  seen being used often by FIN7 PowerShell scripts.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_64refl.ps1"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetFilename:
                    value: "host_ip.ps1"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*_64refl.ps1'; data_win_eventdata_targetFilename equals 'host_ip.ps1'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers

response:
  message: >
    Potential APT FIN7 Related PowerShell Script Created detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - related
    - powershell
    - file_event
    - sysmon
    - execution
    - g0046
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*_64[Rr][Ee][Ff][Ll]\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/[Hh][Oo][Ss][Tt]_[Ii][Pp]\.[Pp][Ss]1/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 911389c7-5ae3-43ea-bab3-a947ebdeb85e
    name: Potential APT FIN7 Reconnaissance/POWERTRASH Related Activity
    reason: FIN7 POWERTRASH loader runs the dropped _64refl.ps1/host_ip.ps1 scripts; process-creation confirms execution on the same host.
  - id: 6676896b-2cce-422d-82af-5a1abe65e241
    name: Potential APT FIN7 Exploitation Activity
    reason: Same FIN7 tradecraft family; an exploitation-stage process chain often precedes the script drop.
  - id: 7047d730-036f-4f40-b9d8-1c63e36d5e62
    name: Potential Binary Or Script Dropper Via PowerShell
    reason: The .ps1 is typically written by PowerShell itself, so this fires from the same dropper process.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: FIN7 stagers usually launch the in-memory reflective loader with encoded commands right after the script lands.
  - id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
    name: Execution of Powershell Script in Public Folder
    reason: Follow-on execution of the dropped script from a world-writable staging path.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell processes launching the FIN7 script names
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*_64refl.ps1* OR *host_ip.ps1*)
    pivot_on: host
    window: 2h
  - name: Encoded or hidden PowerShell execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:(*-[Ee]nc* OR *[Hh]idden* OR *[Bb]ypass*)
    pivot_on: host
    window: 2h
  - name: Script and executable files written by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:(*.ps1 OR *.exe OR *.dll OR *.bat OR *.vbs OR *.js)
    pivot_on: host
    window: 4h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 2h
  - name: Persistence via Run keys or scheduled tasks
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*CurrentVersion*Run*) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
