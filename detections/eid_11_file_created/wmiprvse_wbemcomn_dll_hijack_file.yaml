name: Wmiprvse Wbemcomn DLL Hijack - File
id: 614a7e17-5643-4d89-b6fe-f9df1a79641c
version: 1
schema_version: "1.0"
date: "2022-12-02"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 614a7e17-5643-4d89-b6fe-f9df1a79641c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a threat actor creating a file named `wbemcomn.dll` in the
  `C:\Windows\System32\wbem\` directory over the network and loading it for a
  WMI DLL Hijack scenario. MITRE ATT&CK: T1047, T1021.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_image:
              value: "System"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\wbem\\\\wbemcomn.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals 'System';
  data_win_eventdata_targetFilename matches '*\wbem\wbemcomn.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/201009-RemoteWMIWbemcomnDLLHijack/notebook.html
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Wmiprvse Wbemcomn DLL Hijack - File detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1047, T1021.002
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1021.002
  custom_tags:
    - wmiprvse
    - wbemcomn
    - hijack
    - file_event
    - sysmon
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/[Ss][Yy][Ss][Tt][Ee][Mm]/ AND data_win_eventdata_targetFilename:/.*\\[Ww][Bb][Ee][Mm]\\[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7707a579-e0d8-4886-a853-ce47e4575aaa
    name: Wmiprvse Wbemcomn DLL Hijack
    reason: WmiPrvSE loading the planted wbemcomn.dll is the execution half of the hijack whose file drop fired here.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Once the hijacked WmiPrvSE runs attacker code, WmiPrvSE spawning PowerShell is a likely sign.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: Suspicious child processes of WmiPrvSE after the DLL is loaded.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: The DLL is written over SMB to C$/ADMIN$; admin-share copy commands from the source host belong to the same lateral move.
  - id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
    name: Writing Local Admin Share
    reason: Another admin-share file-write artefact of remote tooling against the same host.
  - id: 52d8b0c6-53d6-439a-9e41-52ad442ad9ad
    name: First Time Seen Remote Named Pipe
    reason: Remote file placement over SMB often shows as first-seen remote named-pipe/IPC use.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WmiPrvSE loading unsigned or wbemcomn DLLs
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee].[Ee][Xx][Ee]/ AND (data_win_eventdata_signed:"false" OR data_win_eventdata_imageLoaded:/.*[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn].[Dd][Ll][Ll]/)
    pivot_on: host
    window: 4h
  - name: Processes created by WmiPrvSE
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee].[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: SMB DLL writes into System32 by System
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:"System" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 4h
  - name: Network logon and share access preceding the drop
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR (data_win_system_eventID:"5145" AND data_win_eventdata_relativeTargetName:/.*[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn].*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from WmiPrvSE
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee].[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
