name: UAC Bypass Using MSConfig Token Modification - File
id: 41bb431f-56d8-4691-bb56-ed34e390906f
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 41bb431f-56d8-4691-bb56-ed34e390906f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using a msconfig GUI hack (UACMe 55). MITRE
  ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Users\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\pkgmgr.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Users\*'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\pkgmgr.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using MSConfig Token Modification - File detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - msconfig
    - token
    - file_event
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Pp][Kk][Gg][Mm][Gg][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ad92e3f9-7eb6-460e-96b1-582b0ccbb980
    name: UAC Bypass Using MSConfig Token Modification - Process
    reason: Process-side detection of the same MSConfig token trick (UACMe 55).
  - id: cce58e2c-988a-4319-9390-0daa9eefa3cd
    name: Windows Bypass UAC via Pkgmgr Tool
    reason: pkgmgr.exe abuse is the core of this technique; the Pkgmgr UAC bypass rule corroborates.
  - id: a743ceba-c771-4d75-97eb-8a90f7f4844c
    name: UAC Bypass Using PkgMgr and DISM
    reason: PkgMgr/DISM bypass is a close sibling using the same binaries.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi is the likely tool delivering method 55.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: pkgmgr.exe dropped or run from Temp
    query: (data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Tt]emp.*pkgmgr\.exe/) OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Tt]emp.*pkgmgr\.exe/)
    pivot_on: host
    window: 1h
  - name: msconfig.exe launched with child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Mm][Ss][Cc]onfig\.exe/
    pivot_on: host
    window: 1h
  - name: Children of pkgmgr or dism
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(pkgmgr|dism|dismhost)\.exe/
    pivot_on: host
    window: 1h
  - name: Elevated high-integrity children of auto-elevate binaries
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:High AND data_win_eventdata_parentImage:/.*\\(consent|mmc|wusa|pkgmgr|dism|dllhost|ieinstal|msconfig|sdclt|fodhelper|eventvwr)\.exe/
    pivot_on: host
    window: 1h
  - name: Defender tamper or exclusion after elevation
    query: data_win_system_eventID:(13 OR 1) AND (data_win_eventdata_targetObject:/.*[Dd]efender.*([Ee]xclusions|DisableAntiSpyware|DisableRealtimeMonitoring).*/ OR data_win_eventdata_commandLine:/.*([Ss]et-MpPreference|[Aa]dd-MpPreference).*/)
    pivot_on: host
    window: 2h
