name: Forest Blizzard APT - JavaScript Constrained File Creation
id: ec7c4e9b-9bc9-47c7-a32f-b53b598da642
version: 1
schema_version: "1.0"
date: "2024-04-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ec7c4e9b-9bc9-47c7-a32f-b53b598da642
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of JavaScript files inside of the DriverStore directory.
  Forest Blizzard used this to exploit the CVE-2022-38028 vulnerability in
  Windows Print Spooler service by modifying a JavaScript constraints file and
  executing it with SYSTEM-level permissions. MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\.js"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows\System32\DriverStore\FileRepository\*';
  data_win_eventdata_targetFilename matches '*\.js'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Forest Blizzard APT - JavaScript Constrained File Creation detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1685.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - forest
    - blizzard
    - javascript
    - file_event
    - sysmon
    - defense_impairment
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss][Tt][Oo][Rr][Ee]\\[Ff][Ii][Ll][Ee][Rr][Ee][Pp][Oo][Ss][Ii][Tt][Oo][Rr][Yy]\\.*/ AND data_win_eventdata_targetFilename:/.*\\\.[Jj][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b92d1d19-f5c9-4ed6-bbd5-7476709dc389
    name: Forest Blizzard APT - File Creation Activity
    reason: 'Same GooseEgg toolkit: the JS constraints file is dropped alongside the tool''s batch/DLL payloads (execute/doit/servtask, wayzgoose DLL) on the same host.'
  - id: 07db928c-8632-488e-ac7d-3db847489175
    name: Forest Blizzard APT - Process Creation Activity
    reason: 'Follow-on: GooseEgg launcher and the SYSTEM-level child processes spawned after the spooler loads the modified constraints file.'
  - id: 5cdeb555-65de-4767-99fe-e26807465148
    name: Forest Blizzard APT - Custom Protocol Handler Creation
    reason: GooseEgg registers a rogue protocol handler pointing at its DLL so the spooler (SYSTEM) loads it; this is the CVE-2022-38028 exploit step paired with the JS file write.
  - id: d807056b-0e00-4cec-b7f8-b8b7518e382b
    name: Forest Blizzard APT - Custom Protocol Handler DLL Registry Set
    reason: Registry value that binds the handler to the attacker DLL, the privilege-escalation hook that runs right after the JS constraints file is modified.
  - id: 002bdb95-0cf1-46a6-9e08-d38c128a6127
    name: WScript or CScript Dropper - File
    reason: Script-file drops by a script host are the common precursor for staging JS/batch payloads on the same endpoint before escalating.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes launched from or referencing DriverStore FileRepository
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Dd][Rr][Ii][Vv][Ee][Rr][Ss][Tt][Oo][Rr][Ee]\\[Ff][Ii][Ll][Ee][Rr][Ee][Pp][Oo][Ss][Ii][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Rr][Ii][Vv][Ee][Rr][Ss][Tt][Oo][Rr][Ee]\\[Ff][Ii][Ll][Ee][Rr][Ee][Pp][Oo][Ss][Ii][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Print Spooler spawning shells or script hosts (SYSTEM child)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Ee][Gg]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: GooseEgg staging files and protocol handler / DLL registry writes
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Ee][Xx][Ee][Cc][Uu][Tt][Ee]\.[Bb][Aa][Tt]|\\[Dd][Oo][Ii][Tt]\.[Bb][Aa][Tt]|\\[Ss][Ee][Rr][Vv][Tt][Aa][Ss][Kk]\.[Bb][Aa][Tt]|[Ww][Aa][Yy][Zz][Gg][Oo][Oo][Ss][Ee].*|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Vv][Aa][Uu][Ll][Tt]\\.*)/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll].*[Hh][Aa][Nn][Dd][Ll][Ee][Rr].*|.*[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry hive dump or LSASS access after SYSTEM escalation
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg](\.[Ee][Xx][Ee])? +[Ss][Aa][Vv][Ee] +.*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]).*/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from SYSTEM-spawned or spooler-related processes
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss][Tt][Oo][Rr][Ee]\\.*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
