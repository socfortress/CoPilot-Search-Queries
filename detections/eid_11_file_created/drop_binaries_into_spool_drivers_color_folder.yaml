name: Drop Binaries Into Spool Drivers Color Folder
id: ce7066a6-508a-42d3-995b-2952c65dc2ce
version: 1
schema_version: "1.0"
date: "2022-07-28"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ce7066a6-508a-42d3-995b-2952c65dc2ce
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of suspcious binary files inside the
  "\windows\system32\spool\drivers\color\" as seen in the blog referenced below.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Windows\\\\System32\\\\spool\\\\drivers\\\\color\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.sys"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows\System32\spool\drivers\color\*'; data_win_eventdata_targetFilename
  matches '*.dll'; data_win_eventdata_targetFilename matches '*.exe', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/07/27/untangling-knotweed-european-private-sector-offensive-actor-using-0-day-exploits/

response:
  message: >
    Drop Binaries Into Spool Drivers Color Folder detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - binaries
    - spool
    - drivers
    - file_event
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Cc][Oo][Ll][Oo][Rr]\\.*/ AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2131cfb3-8c12-45e8-8fa0-31f5924e9f07
    name: CVE-2021-1675 Print Spooler Exploitation Filename Pattern
    reason: Both are Print Spooler abuse leaving DLLs in spool\drivers; a PrintNightmare-style driver install is a common way a payload lands in the color folder.
  - id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
    name: Suspicious Spool Service Child Process
    reason: 'Follow-on: once the dropped binary is loaded or run via the spooler (spoolsv.exe), shells or LOLBins spawn as its children, which confirms execution.'
  - id: 5b2bbc47-dead-4ef7-8908-0cf73fcbecbf
    name: Potential PrintNightmare Exploitation Attempt
    reason: 'Co-occurring: PrintNightmare exploits write then delete DLLs in spool driver directories, so deletion alongside the drop points to the same exploitation.'
  - id: ba6b9e43-1d45-4d3c-a504-1043a64c8469
    name: PrinterNightmare Mimikatz Driver Name
    reason: 'Precursor/co-occurring: the Mimikatz printer-driver trick registers a fake driver to get a DLL into spool\drivers, the same staging area as this detection.'
  - id: windows-print-processor-registry-autostart-001
    name: Windows Print Processor Registry Autostart
    reason: 'Follow-on persistence: a DLL staged in spool\drivers can be registered as a print processor so spoolsv loads it as SYSTEM at each start.'
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Likely next step: Knotweed-style actors use SYSTEM-level footholds for credential access, and an unsigned DLL injected or loaded into lsass.exe would confirm it.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Follow-on: after SYSTEM code execution via the dropped binary, actors typically read LSASS memory for credentials to move laterally.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: 'Follow-on persistence: the dropped payload is often paired with Run/autorun key writes so it survives reboot.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes launched from or loading code out of the spool drivers folder
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/) OR (data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Spooler service spawning shells or LOLBins (code running in spoolsv)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\(([Cc][Mm][Dd])|([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])|([Pp][Ww][Ss][Hh])|([Rr][Uu][Nn][Dd][Ll][Ll]32)|([Rr][Ee][Gg][Ss][Vv][Rr]32)|([Mm][Ss][Hh][Tt][Aa])|([Ww][Mm][Ii][Cc])|([Ww][Hh][Oo][Aa][Mm][Ii])|([Nn][Ee][Tt])|([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]))\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Other DLL/EXE/SYS files written into spool driver directories
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/ AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Gg][Pp][Dd]/)
    pivot_on:
    - host
    window: 4h
  - name: Print monitor/processor/driver registry changes for spooler persistence
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\(([Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ss])|([Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt][Ss])|([Pp][Rr][Ii][Nn][Tt][Ee][Rr][Ss])).*/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from spoolsv or binaries in the spool drivers folder
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
