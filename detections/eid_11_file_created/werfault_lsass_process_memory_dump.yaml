name: WerFault LSASS Process Memory Dump
id: c3e76af5-4ce0-4a14-9c9a-25ceb8fda182
version: 1
schema_version: "1.0"
date: "2022-06-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c3e76af5-4ce0-4a14-9c9a-25ceb8fda182
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects WerFault creating a dump file with a name that indicates that the dump
  file could be an LSASS process memory, which contains user credentials. MITRE
  ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\WINDOWS\\system32\\WerFault.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*lsass.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals
  'C:\WINDOWS\system32\WerFault.exe'; data_win_eventdata_targetFilename matches
  '*\lsass*'; data_win_eventdata_targetFilename matches '*lsass.exe*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/helpsystems/nanodump
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    WerFault LSASS Process Memory Dump detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - werfault
    - lsass
    - memory
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\\[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
    name: Potential Credential Dumping Via WER
    reason: Command-line trigger of WER dumping, direct precursor of this WerFault file write
  - id: 1f0b4cac-9c81-41f4-95d0-8475ff46b3e2
    name: PPL Tampering Via WerFaultSecure
    reason: WerFaultSecure abuse used to dump protected LSASS
  - id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
    name: Lsass Full Dump Request Via DumpType Registry Settings
    reason: Registry setup forcing full LSASS dumps on crash
  - id: 55e29995-75e7-451a-bef0-6225e2f13597
    name: Potential Credential Dumping Via LSASS SilentProcessExit Technique
    reason: Sibling WER-based LSASS dump technique
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Same dump artefact seen through other writers
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Dump is archived for exfiltration next
  - id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
    name: Winrar Compressing Dump Files
    reason: Dump staged in an archive before exfiltration
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Dump moved off host or across a share
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WER / WerFault dump invocations
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]([Ss][Ee][Cc][Uu][Rr][Ee])?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(-[Pp] |-[Ss] |-[Ss][Ii][Dd]|-[Uu] ).*/
    pivot_on:
    - host
    window: 4h
  - name: LSASS process access
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Dump files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp]).*/
    pivot_on:
    - host
    window: 4h
  - name: Archiving or exfil tooling after dump
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(7z|[Rr][Aa][Rr]|[Cc][Uu][Rr][Ll]|[Ss][Cc][Pp]|[Rr][Cc][Ll][Oo][Nn][Ee])[^\\]*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Network and remote logons with possibly stolen credentials
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:(3 OR 9 OR 10)
    pivot_on:
    - user
    window: 6h
