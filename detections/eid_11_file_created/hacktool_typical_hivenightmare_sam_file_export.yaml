name: HackTool - Typical HiveNightmare SAM File Export
id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects files written by the different tools that exploit HiveNightmare. MITRE
  ATT&CK: T1552.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\hive_sam_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\SAM-2021-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\SAM-2022-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\SAM-2023-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\SAM-haxx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Sam.save*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetFilename:
                    value: "C:\\windows\\temp\\sam"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\hive_sam_*'; data_win_eventdata_targetFilename matches '*\SAM-2021-*';
  data_win_eventdata_targetFilename matches '*\SAM-2022-*', among other
  conditions.

known_false_positives: >
  Files that accidentally contain these strings. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/GossiTheDog/HiveNightmare
  - https://github.com/FireFart/hivenightmare/
  - https://github.com/WiredPulse/Invoke-HiveNightmare
  - https://twitter.com/cube0x0/status/1418920190759378944
  - https://attack.mitre.org/techniques/T1552/001/

response:
  message: >
    HackTool - Typical HiveNightmare SAM File Export detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1552.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.001
  custom_tags:
    - hacktool
    - typical
    - hivenightmare
    - file_event
    - sysmon
    - credential_access
    - cve_2021_36934
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Hh][Ii][Vv][Ee]_[Ss][Aa][Mm]_.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]-2021-.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]-2022-.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]-2023-.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]-[Hh][Aa][Xx][Xx].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Ss][Aa][Mm]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Alternative/co-occurring way to export SAM/SYSTEM/SECURITY hives; an operator who gets a HiveNightmare SAM file often also saves SYSTEM (needed for the boot key) with reg save.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: 'Same objective via a LOLBin: copying the locked SAM hive from a shadow copy; a fallback when the HiveNightmare tool is blocked.'
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Invoke-HiveNightmare-style PowerShell copying SAM from the VSS GLOBALROOT path is the scripted variant that writes the same exported files.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: HiveNightmare exploits readable shadow copies; copying hive files out of HarddiskVolumeShadowCopy is the direct precursor/equivalent of the file export.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Shadow-copy path access to SAM/SYSTEM/NTDS is the exact primitive CVE-2021-36934 abuses, seen just before the hive file is written.
  - id: 40b19fa6-d835-400c-b301-41f3a2baacaf
    name: VolumeShadowCopy Symlink Creation Via Mklink
    reason: mklink to a shadow copy is a common way to expose the VSS copy so the SAM/SYSTEM hives become readable before export.
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: Attackers on patched or no-snapshot hosts create a shadow copy themselves so the hive can then be read and exported.
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: 'Follow-on/parallel: after local hive export the same operator may dump SAM remotely with secretsdump/CME against other hosts using the recovered hashes.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive saves and shadow-copy hive access
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*(\\[Ss][Aa][Mm]|\\[Ss][Yy][Ss][Tt][Ee][Mm]|\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/) OR data_win_eventdata_commandLine:/.*[Gg][Ll][Oo][Bb][Aa][Ll][Rr][Oo][Oo][Tt].*[Dd][Ee][Vv][Ii][Cc][Ee].*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Cc][Oo][Nn][Ff][Ii][Gg].*[Ss][Aa][Mm].*/ OR (data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Mm].*/))
    pivot_on:
    - host
    window: 1h
  - name: Shadow copy creation, listing or linking
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|[Ll][Ii][Ss][Tt]).*[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/) OR (data_win_eventdata_commandLine:/.*[Mm][Kk][Ll][Ii][Nn][Kk].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: SAM/SYSTEM/SECURITY hive files written elsewhere
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])(\.[Ss][Aa][Vv][Ee]|\.[Bb][Aa][Kk]|\.[Hh][Ii][Vv]|\.[Tt][Xx][Tt])?/ OR data_win_eventdata_targetFilename:/.*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm])[-_.](save|dump|copy|backup|hive).*/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/) AND NOT data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ff][Ii][Gg]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Credential-cracking and pass-the-hash tooling after hive export
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]|[Ii][Mm][Pp][Aa][Cc][Kk][Ee][Tt]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]|[Cc][Rr][Aa][Cc][Kk][Mm][Aa][Pp][Ee][Xx][Ee][Cc]|[Pp][Aa][Ss][Ss]-[Tt][Hh][Ee]-[Hh][Aa][Ss][Hh]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::[Pp][Tt][Hh]).*/ OR data_win_eventdata_commandLine:/.*([Nn][Tt][Ll][Mm]|[Nn][Tt][Hh][Aa][Ss][Hh]).*[Hh][Aa][Ss][Hh].*/ OR data_win_eventdata_image:/.*\\([Hh][Aa][Ss][Hh][Cc][Aa][Tt]|[Jj][Oo][Hh][Nn])(64)?\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Outbound transfer of the exported hive or archive
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Cc][Uu][Rr][Ll]|[Ss][Cc][Pp]|[Ff][Tt][Pp]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Hh][Ii][Vv][Ee]).*/) OR (data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|[Rr][Aa][Rr]|7[Zz]).*/ AND data_win_eventdata_commandLine:/.*([Ss][Aa][Mm]|[Hh][Ii][Vv][Ee]).*/))) OR (data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Uu][Rr][Ll]|[Ss][Cc][Pp])(\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 4h
