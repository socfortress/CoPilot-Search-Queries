name: HackTool - QuarksPwDump Dump File
id: 847def9e-924d-4e90-b7c4-5f581395a2b4
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 847def9e-924d-4e90-b7c4-5f581395a2b4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a dump file written by QuarksPwDump password dumper. MITRE ATT&CK:
  T1003.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\SAM-*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.dmp*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\SAM-*'; data_win_eventdata_targetFilename matches
  '*.dmp*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://jpcertcc.github.io/ToolAnalysisResultSheet/details/QuarksPWDump.htm
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    HackTool - QuarksPwDump Dump File detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.002
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - hacktool
    - quarkspwdump
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ss][Aa][Mm]-.*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0685b176-c816-4837-8e7b-1216f346636b
    name: HackTool - Quarks PwDump Execution
    reason: 'Same tool: the process-creation event for QuarksPwDump.exe that produces the SAM-*.dmp temp file; confirms execution and gives the command line and parent.'
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: Co-occurring file-creation evidence of SAM/hive material being written, the same credential-store theft by a different tool or method.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Alternate path to the same SAM/SYSTEM secrets; attacker may fall back to reg save if the dumper is blocked or to complement hashes.
  - id: 8fbf3271-1ef6-4e94-8210-03c2317947f6
    name: Cred Dump Tools Dropped Files
    reason: Other credential dumpers (wce, pwdump, gsecdump) drop characteristic output files on the same host in the same toolkit.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Operators commonly pair SAM hash dumping with LSASS memory dumps to harvest cached and domain credentials on the same host.
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Another route to copy the SAM hive, typically a fallback or complement after dumping with a hacktool.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: LOLBin SAM hive copy by the same operator trying alternate extraction when the dump tool is detected.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: 'Likely next step: dumped NTLM hashes are used for pass-the-hash and PsExec lateral movement to other hosts.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: QuarksPwDump execution and credential-dumper command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Qq][Uu][Aa][Rr][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*[Qq][Uu][Aa][Rr][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.* -dhl.*/ OR data_win_eventdata_commandLine:/.* -dhdc.*/ OR data_win_eventdata_commandLine:/.* -dhl .*/ OR data_win_eventdata_commandLine:/.*[Pp][Ww][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: SAM/SYSTEM/SECURITY hive and NTDS export activity
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*([Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]).*(HKLM\\[Ss][Aa][Mm]|HKLM\\[Ss][Yy][Ss][Tt][Ee][Mm]|HKLM\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.([Ss][Aa][Vv][Ee]|[Hh][Ii][Vv][Ee]|[Bb][Aa][Kk]).*/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: LSASS access and memory dump files on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ll][Ss][Aa][Ss][Ss]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]).*\.[Dd][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Staging and archiving of dump files before exfiltration
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/) AND (data_win_eventdata_image:/.*([Rr][Aa][Rr]|7[Zz]|7[Zz][Aa]|[Tt][Aa][Rr]|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy]|[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]).*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\.*\.([Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Pass-the-hash style network logons by this account
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on:
    - user
    window: 6h
