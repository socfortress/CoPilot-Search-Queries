name: HackTool - Powerup Write Hijack DLL
id: 602a1f13-c640-4d73-b053-be9a2fa58b96
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Subhash Popuri (@pbssubhash)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 602a1f13-c640-4d73-b053-be9a2fa58b96
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Powerup tool's Write Hijack DLL exploits DLL hijacking for privilege
  escalation. In it's default mode, it builds a self deleting .bat file which
  executes malicious command. The detection rule relies on creation of the
  malicious bat file (debug.bat by default). MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.bat"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_targetFilename matches '*.bat'.

known_false_positives: >
  Any powershell script that creates bat files. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://powersploit.readthedocs.io/en/latest/Privesc/Write-HijackDll/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    HackTool - Powerup Write Hijack DLL detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - hacktool
    - powerup
    - write
    - file_event
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 68bcd73b-37ef-49cb-95fc-edc809730be6
    name: Potential Unquoted Service Path Reconnaissance Via Wmic.EXE
    reason: PowerUp's Get-ServiceUnquoted/Find-PathDLLHijack enumeration is the recon step that precedes Write-HijackDll; WMIC unquoted-path hunting is the same privesc-vector discovery.
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: Weak service ACL abuse (sc config binpath) is PowerUp's sibling privesc primitive (Invoke-ServiceAbuse) used when DLL hijack is not the chosen vector.
  - id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
    name: Potential Privilege Escalation via Service Permissions Weakness
    reason: 'Same PowerUp AllChecks outcome family: attacker modifies service config to run payload as SYSTEM alongside or instead of the DLL drop.'
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: Service binary hijack via registry ImagePath edit is an alternative privesc path attempted when the hijacked DLL path fails.
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: Hijacked services often end up pointing at or running from user-writable directories where the planted DLL/bat lives.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: PowerUp.ps1 is normally pulled in-memory with IEX/DownloadString just before Write-HijackDll runs; this is the delivery precursor.
  - id: 56c217c3-2de2-479b-990f-5c109ba8458f
    name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
    reason: Same PowerSploit toolkit; scheduled-task persistence is a common follow-on once SYSTEM is obtained via the hijacked DLL.
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: The default Write-HijackDll payload (debug.bat) classically runs 'net user ... /add' and 'net localgroup administrators', so admin account creation is the expected outcome.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Net user / local admin creation after privesc
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?\s+[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?\s+[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]\s+[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Bat or DLL executed by SYSTEM-level service or cmd from writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/ AND (data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: DLL written to disk by PowerShell (hijack DLL drop)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: PowerUp / PowerSploit privesc cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Write\-HijackDll* OR data_win_eventdata_scriptBlockText:*Find\-PathDLLHijack* OR data_win_eventdata_scriptBlockText:*Invoke\-AllChecks* OR data_win_eventdata_scriptBlockText:*Get\-ServiceUnquoted* OR data_win_eventdata_scriptBlockText:*Invoke\-ServiceAbuse* OR data_win_eventdata_scriptBlockText:*PowerUp*)
    pivot_on:
    - host
    window: 4h
  - name: Service configuration changes via sc.exe or registry
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/)
    pivot_on:
    - host
    window: 2h
