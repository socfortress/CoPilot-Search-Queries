name: Lace Tempest File Indicators
id: e94486ea-2650-4548-bf25-88cbd0bb32d7
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e94486ea-2650-4548-bf25-88cbd0bb32d7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell script file creation with specific names or suffixes which
  was seen being used often in PowerShell scripts by FIN7.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\Program Files\\\\SysAidServer\\\\tomcat\\\\webapps\\\\usersfiles\\\\user.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\Program Files\\\\SysAidServer\\\\tomcat\\\\webapps\\\\usersfiles.war"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\Program Files\\\\SysAidServer\\\\tomcat\\\\webapps\\\\leave"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*:\\\\Program Files\\\\SysAidServer\\\\tomcat\\\\webapps\\\\user.*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*:\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe';
  data_win_eventdata_targetFilename matches '*:\Program
  Files\SysAidServer\tomcat\webapps\usersfiles.war';
  data_win_eventdata_targetFilename matches '*:\Program
  Files\SysAidServer\tomcat\webapps\leave', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sysaid.com/blog/service-desk/on-premise-software-security-vulnerability-notification

response:
  message: >
    Lace Tempest File Indicators detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - tempest
    - indicators
    - file_event
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr]\\[Tt][Oo][Mm][Cc][Aa][Tt]\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\[Uu][Ss][Ee][Rr][Ss][Ff][Ii][Ll][Ee][Ss]\\[Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr]\\[Tt][Oo][Mm][Cc][Aa][Tt]\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\[Uu][Ss][Ee][Rr][Ss][Ff][Ii][Ll][Ee][Ss]\.[Ww][Aa][Rr]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr]\\[Tt][Oo][Mm][Cc][Aa][Tt]\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\[Ll][Ee][Aa][Vv][Ee]/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr]\\[Tt][Oo][Mm][Cc][Aa][Tt]\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\[Uu][Ss][Ee][Rr]\..*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 745ea50b-9673-4ba7-9426-cb45cf4a8e6d
    name: Lace Tempest Malware Loader Execution
    reason: 'Direct follow-on: the dropped SysAidServer usersfiles\user.exe loader being executed (same CVE-2023-47246 chain) confirms the file drop became code execution.'
  - id: aa5b0a40-ed88-46aa-9fdc-0337b379ca9d
    name: Lace Tempest Cobalt Strike Download
    reason: 'Next stage of the Lace Tempest (Clop affiliate) chain: the loader/PowerShell pulls a Cobalt Strike beacon after the webshell/loader drop.'
  - id: 0d34ed8b-1c12-4ff2-828c-16fc860b766d
    name: Suspicious Processes Spawned by Java.EXE
    reason: SysAid runs on Tomcat (java.exe); after the malicious usersfiles.war upload the webshell spawns cmd/powershell children from Java, the exploitation execution step.
  - id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
    name: Shell Process Spawned by Java.EXE
    reason: Webshell in the SysAid Tomcat webapp executing commands appears as a shell spawned by java.exe on the same server.
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: Generic web-server-to-shell execution catches the SysAid webshell tradecraft used right after the .war/leave file is written.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Lace Tempest's post-exploitation PowerShell script downloads and runs the GraceWire/Cobalt Strike payloads via cradles.
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: Beacon activity is the established follow-on for this actor's loader, expanding the file drop into hands-on intrusion.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: The actor's cleanup/evasion script adds Defender exclusions to protect dropped loaders before ransomware or data theft.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by Java/Tomcat (SysAid webshell execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|wscript|cscript|mshta|certutil|bitsadmin|whoami|net|net1)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Execution of dropped SysAid loader or PowerShell download cradle
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr]\\.*/) OR (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]|[Ii][Ee][Xx]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq]|-[Ee][Nn][Cc]).*/))
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from SysAid Tomcat, loader or PowerShell (beacon/C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_image:/.*[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Other files written under SysAid webapps or by Java (webshell/WAR drops)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr]\\.*\.(jsp|war|exe|dll|ps1|bat)/ OR (data_win_eventdata_image:/.*[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|bat|jsp)/))
    pivot_on:
    - host
    window: 6h
  - name: Defender tampering and credential access following compromise
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ll][Ss][Aa][Ss][Ss]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]).*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
