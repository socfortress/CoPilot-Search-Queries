name: Suspicious Get-Variable.exe Creation
id: 0c3fac91-5627-46e8-a6a8-a0d7b9b8ae1b
version: 1
schema_version: "1.0"
date: "2022-04-23"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0c3fac91-5627-46e8-a6a8-a0d7b9b8ae1b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Get-Variable is a valid PowerShell cmdlet WindowsApps is by default in the
  path where PowerShell is executed. So when the Get-Variable command is issued
  on PowerShell execution, the system first looks for the Get-Variable
  executable in the path and executes the malicious binary instead of looking
  for the PowerShell cmdlet. MITRE ATT&CK: T1546, T1027.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*Local\\\\Microsoft\\\\WindowsApps\\\\Get-Variable.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*Local\Microsoft\WindowsApps\Get-Variable.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.malwarebytes.com/threat-intelligence/2022/04/colibri-loader-combines-task-scheduler-and-powershell-in-clever-persistence-technique/
  - https://www.joesandbox.com/analysis/465533/0/html
  - https://attack.mitre.org/techniques/T1546/
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Suspicious Get-Variable.exe Creation detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546, T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546
    - T1027
  custom_tags:
    - variable
    - file_event
    - sysmon
    - privilege_escalation
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Gg][Ee][Tt]-[Vv][Aa][Rr][Ii][Aa][Bb][Ll][Ee]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b66474aa-bd92-4333-a16c-298155b120df
    name: Potential Persistence Via Powershell Search Order Hijacking - Task
    reason: Colibri persistence is a scheduled task launching PowerShell that resolves Get-Variable through the hijacked search order; this is the execution half of the dropped binary
  - id: 4720b7df-40c3-48fd-bbdf-fd4b3c464f0d
    name: Scheduled TaskCache Change by Uncommon Program
    reason: The scheduled task that triggers the planted Get-Variable.exe is registered in TaskCache, often by an uncommon program
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: A task XML written to System32\Tasks near the drop confirms the persistence wiring Colibri uses
  - id: 7047d730-036f-4f40-b9d8-1c63e36d5e62
    name: Potential Binary Or Script Dropper Via PowerShell
    reason: PowerShell dropping a binary is how the loader places Get-Variable.exe in WindowsApps
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Loader stage typically PowerShell with a hidden window reaching out to download the payload before the drop
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded PowerShell is the usual staging wrapper around the Colibri dropper and task creation
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Get-Variable.exe executed from WindowsApps
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww]indows[Aa]pps\\[Gg]et-[Vv]ariable\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Scheduled task registration in TaskCache
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Tt]ask[Cc]ache\\[Tt]ree\\.*/
    pivot_on: host
    window: 6h
  - name: schtasks creating tasks that run PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss]chtasks\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*[Pp]ower[Ss]hell.*/
    pivot_on: host
    window: 6h
  - name: PowerShell download or drop commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ss]tart-[Bb]its[Tt]ransfer|[Ii][Ee][Xx]).*/
    pivot_on: host
    window: 2h
  - name: Executables written under WindowsApps
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Mm]icrosoft\\[Ww]indows[Aa]pps\\.*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
