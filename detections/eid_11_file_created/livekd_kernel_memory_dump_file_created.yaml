name: LiveKD Kernel Memory Dump File Created
id: 814ddeca-3d31-4265-8e07-8cc54fb44903
version: 1
schema_version: "1.0"
date: "2023-05-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 814ddeca-3d31-4265-8e07-8cc54fb44903
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file that has the same name as the default LiveKD
  kernel memory dump.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_targetFilename:
              value: "C:\\Windows\\livekd.dmp"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename equals
  'C:\Windows\livekd.dmp'.

known_false_positives: >
  In rare occasions administrators might leverage LiveKD to perform live kernel
  debugging. This should not be allowed on production systems. Investigate and
  apply additional filters where necessary. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - Internal Research

response:
  message: >
    LiveKD Kernel Memory Dump File Created detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - livekd
    - kernel
    - memory
    - file_event
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ll][Ii][Vv][Ee][Kk][Dd]\.[Dd][Mm][Pp]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
    name: Kernel Memory Dump Via LiveKD
    reason: The livekd.exe process launch with dump switches is the direct cause of the C:\Windows\livekd.dmp file creation; confirms the actor and command line.
  - id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
    name: Potential Memory Dumping Activity Via LiveKD
    reason: Same tool producing the dump via different command-line shapes (e.g. -m/-o, renamed or staged binary); co-occurs with the resulting livekd.dmp.
  - id: 16fe46bb-4f64-46aa-817d-ff7bec4a2352
    name: LiveKD Driver Creation
    reason: LiveKD drops livekd.sys when first run; this precedes the dump file and shows the tool was freshly executed on the host.
  - id: 059c5af9-5131-4d8d-92b2-de4ad6146712
    name: LiveKD Driver Creation By Uncommon Process
    reason: Indicates LiveKD was deployed or launched by an unusual parent (script, renamed binary) rather than an admin, raising the odds the dump is hostile.
  - id: 27ee9438-90dc-4bef-904b-d3ef927f5e7e
    name: Windows Kernel Debugger Execution
    reason: Kernel debuggers (kd/windbg) are used to open and parse the dump after creation to extract credentials or secrets from kernel memory.
  - id: 6902955a-01b7-432c-b32a-6f5f81d8f625
    name: LSASS Process Dump Artefact In CrashDumps Folder
    reason: Alternate memory-dump-for-credentials path; seen alongside kernel dump when an attacker harvests secrets from memory by several methods.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Another Sysinternals memory dumping tool; attackers chain Sysinternals utilities (LiveKD, ProcDump) for credential theft.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Common companion/fallback technique to obtain credential material from memory when kernel dump is the goal.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LiveKD execution and dump command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ll][Ii][Vv][Ee][Kk][Dd](64)?\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ll][Ii][Vv][Ee][Kk][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ii][Vv][Ee][Kk][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: LiveKD driver and dump-related file creation
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Ii][Vv][Ee][Kk][Dd].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Mm][Ee][Mm][Oo][Rr][Yy]\.[Dd][Mm][Pp]/)
    pivot_on:
    - host
    window: 2h
  - name: Debugger or dump-parsing tools opening the dump
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Kk][Dd]|[Ww][Ii][Nn][Dd][Bb][Gg]|[Cc][Dd][Bb]|[Dd][Bb][Gg][Hh][Oo][Ss][Tt])(64)?\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ll][Ii][Vv][Ee][Kk][Dd]\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Vv][Oo][Ll][Aa][Tt][Ii][Ll][Ii][Tt][Yy].*/)
    pivot_on:
    - host
    window: 4h
  - name: Dump staging, archiving or exfil after creation
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\(7z|7za|rar|winrar|tar|makecab|compact)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Mm][Pp].*/ AND (data_win_eventdata_commandLine:/.*([Cc][Uu][Rr][Ll]|[Ss][Cc][Pp]|[Ff][Tt][Pp]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]).*/)))
    pivot_on:
    - host
    window: 6h
  - name: Process access to LSASS on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
