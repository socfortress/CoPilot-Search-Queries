name: UAC Bypass Using NTFS Reparse Point - File
id: 7fff6773-2baa-46de-a24a-b6eec1aba2d1
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7fff6773-2baa-46de-a24a-b6eec1aba2d1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using NTFS reparse point and wusa.exe DLL
  hijacking (UACMe 36). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Users\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\api-ms-win-core-kernel32-legacy-l1.DLL"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Users\*'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\api-ms-win-core-kernel32-legacy-l1.DLL'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using NTFS Reparse Point - File detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - reparse
    - point
    - file_event
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Aa][Pp][Ii]-[Mm][Ss]-[Ww][Ii][Nn]-[Cc][Oo][Rr][Ee]-[Kk][Ee][Rr][Nn][Ee][Ll]32-[Ll][Ee][Gg][Aa][Cc][Yy]-[Ll]1\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 39ed3c80-e6a1-431b-9df3-911ac53d08a7
    name: UAC Bypass Using NTFS Reparse Point - Process
    reason: Process-side detection of the same NTFS reparse/wusa technique (UACMe 36).
  - id: c74c0390-3e20-41fd-a69a-128f0275a5ea
    name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
    reason: wusa.exe extraction from suspicious paths is the mechanism used to plant the DLL.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi commonly delivers method 36.
  - id: 853e74f9-9392-4935-ad3b-2e8c040dae86
    name: UAC Bypass Using DismHost
    reason: DismHost DLL hijack is the sibling UACMe method; attackers try several.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Fake api-ms DLL in user Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Tt]emp.*api-ms-win-.*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 1h
  - name: wusa.exe extracting cab content
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*wusa\.exe/ AND data_win_eventdata_commandLine:/.*(\/extract|\.cab).*/
    pivot_on: host
    window: 1h
  - name: Reparse point or junction creation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(mklink|reparsepoint|junction).*/
    pivot_on: host
    window: 1h
  - name: Elevated children of wusa pkgmgr dism
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(wusa|pkgmgr|dism)\.exe/ AND data_win_eventdata_integrityLevel:High
    pivot_on: host
    window: 1h
  - name: Defender tamper or exclusion after elevation
    query: data_win_system_eventID:(13 OR 1) AND (data_win_eventdata_targetObject:/.*[Dd]efender.*([Ee]xclusions|DisableAntiSpyware|DisableRealtimeMonitoring).*/ OR data_win_eventdata_commandLine:/.*([Ss]et-MpPreference|[Aa]dd-MpPreference).*/)
    pivot_on: host
    window: 2h
