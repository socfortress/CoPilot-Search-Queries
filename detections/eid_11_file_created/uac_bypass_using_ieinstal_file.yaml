name: UAC Bypass Using IEInstal - File
id: bdd8157d-8e85-4397-bb82-f06cc9c71dbb
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bdd8157d-8e85-4397-bb82-f06cc9c71dbb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using IEInstal.exe (UACMe 64). MITRE ATT&CK:
  T1548.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\Program Files\\Internet Explorer\\IEInstal.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "C:\\\\Users\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*consent.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals 'C:\Program
  Files\Internet Explorer\IEInstal.exe'; data_win_eventdata_targetFilename
  matches 'C:\Users\*'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using IEInstal - File detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - ieinstal
    - file_event
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Ii][Nn][Ss][Tt][Aa][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_targetFilename:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 80fc36aa-945e-4181-89f2-2f907ab6775d
    name: UAC Bypass Using IEInstal - Process
    reason: Process-side detection of the same IEInstal bypass; shows the elevated child launched.
  - id: 1ca6bd18-0ba0-44ca-851c-92ed89a61085
    name: UAC Bypass Using Consent and Comctl32 - Process
    reason: Fake consent.exe dropped in Temp matches the Consent/Comctl32 style of UACMe consent abuse.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi tool execution typically precedes this IEInstal method.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell from an uncommon parent location is the payoff after the bypass.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: consent.exe created in user Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Aa]pp[Dd]ata.*[Tt]emp.*consent\.exe/
    pivot_on: host
    window: 1h
  - name: IEInstal.exe spawning children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ii][Ee][Ii]nstal\.exe/
    pivot_on: host
    window: 1h
  - name: consent.exe running outside System32
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*consent\.exe/ AND NOT data_win_eventdata_image:/.*[Ss]ystem32.*/
    pivot_on: host
    window: 1h
  - name: Elevated high-integrity children of auto-elevate binaries
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:High AND data_win_eventdata_parentImage:/.*\\(consent|mmc|wusa|pkgmgr|dism|dllhost|ieinstal|msconfig|sdclt|fodhelper|eventvwr)\.exe/
    pivot_on: host
    window: 1h
  - name: Persistence created after UAC bypass
    query: (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\CurrentVersion\\Run.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(schtasks|sc)\.exe/ AND data_win_eventdata_commandLine:/.*([Cc]reate|[Cc]hange|config).*/)
    pivot_on: host
    window: 4h
