name: Renamed VsCode Code Tunnel Execution - File Indicator
id: d102b8f5-61dc-4e68-bd83-9a3187c67377
version: 1
schema_version: "1.0"
date: "2023-10-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d102b8f5-61dc-4e68-bd83-9a3187c67377
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a file with the name "code_tunnel.json" which indicate
  execution and usage of VsCode tunneling utility by an "Image" or "Process"
  other than VsCode.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\code_tunnel.json"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\code-tunnel.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\code.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\code_tunnel.json'; data_win_eventdata_image matches '*\code-tunnel.exe';
  data_win_eventdata_image matches '*\code.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://ipfyx.fr/post/visual-studio-code-tunnel/
  - https://badoption.eu/blog/2023/01/31/code_c2.html

response:
  message: >
    Renamed VsCode Code Tunnel Execution - File Indicator detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - renamed
    - vscode
    - tunnel
    - file_event
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Dd][Ee]_[Tt][Uu][Nn][Nn][Ee][Ll]\.[Jj][Ss][Oo][Nn]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Cc][Oo][Dd][Ee]-[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
    name: Renamed Visual Studio Code Tunnel Execution
    reason: Process-creation view of the same renamed code.exe launching the tunnel; confirms the binary that wrote code_tunnel.json was run with tunnel arguments.
  - id: 90d6bd71-dffb-4989-8d86-a827fedd6624
    name: Visual Studio Code Tunnel Execution
    reason: Tunnel started via the genuine binary name on the same host; shows whether tunnel use is wider than the renamed copy.
  - id: 30bf1789-379d-4fdc-900f-55cd0a90a801
    name: Visual Studio Code Tunnel Service Installation
    reason: Installing the tunnel as a service makes the code_tunnel.json-backed access persistent across reboots.
  - id: f4a623c2-4ef5-4c33-b811-0642f702c9f1
    name: Visual Studio Code Tunnel Shell Execution
    reason: Once the tunnel is up the operator gets an interactive shell; this shows commands run through it.
  - id: b3e6418f-7c7a-4fad-993a-93b65027a9f1
    name: DNS Query To Visual Studio Code Tunnels Domain
    reason: The tunnel binary must resolve the VS Code tunnel service to register; DNS from a non-VS Code process corroborates it.
  - id: 4b657234-038e-4ad5-997c-4be42340bce4
    name: Network Connection Initiated To Visual Studio Code Tunnels Domain
    reason: An established outbound connection to the relay confirms the tunnel is live and reachable by the attacker.
  - id: 9501f8e6-8e3d-48fc-a8a6-1089dd5d7ef4
    name: Network Connection Initiated To DevTunnels Domain
    reason: Devtunnels relay connections carry the attacker session once the tunnel is authenticated.
  - id: 56e05d41-ce99-4ecd-912d-93f019ee0b71
    name: Visual Studio Code Tunnel Remote File Creation
    reason: Files written by the tunnel server show what the remote operator staged on the host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tunnel-mode launch of the code CLI under any name
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll].*/) AND (data_win_eventdata_commandLine:/.*--[Aa][Cc][Cc][Ee][Pp][Tt]-[Ss][Ee][Rr][Vv][Ee][Rr]-[Ll][Ii][Cc][Ee][Nn][Ss][Ee]-[Tt][Ee][Rr][Mm][Ss].*/ OR data_win_eventdata_commandLine:/.*--[Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*--[Cc][Ll][Ii]-[Dd][Aa][Tt][Aa]-[Dd][Ii][Rr].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] [Ll][Oo][Gg][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*--[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Renamed VS Code CLI (original filename code) not at its usual name
    query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/.*[Cc][Oo][Dd][Ee].*/ AND NOT (data_win_eventdata_image:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Dd][Ee]-[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Tunnel relay DNS and outbound connections
    query: (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss].*/ OR data_win_eventdata_queryName:/.*[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Rr][Ee][Ll]\.[Tt][Uu][Nn][Nn][Ee][Ll][Ss].*/)) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss].*/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*[Rr][Ee][Ll]\.[Tt][Uu][Nn][Nn][Ee][Ll][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Shells and recon spawned from the tunnel host process
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Cc][Oo][Dd][Ee]-[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Ll]\.[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Tunnel service persistence
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) AND (data_win_eventdata_targetObject:/.*[Cc][Oo][Dd][Ee].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/))
    pivot_on:
    - host
    window: 24h
