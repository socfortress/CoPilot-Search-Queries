name: Suspicious ASPX File Drop by Exchange
id: bd1212e5-78da-431e-95fa-c58e3237a8e6
version: 1
schema_version: "1.0"
date: "2022-10-01"
author: Florian Roth (Nextron Systems), MSTI (query, idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bd1212e5-78da-431e-95fa-c58e3237a8e6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious file type dropped by an Exchange component in IIS into a
  suspicious folder. MITRE ATT&CK: T1505.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\w3wp.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*MSExchange*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*FrontEnd\\\\HttpProxy\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\inetpub\\\\wwwroot\\\\aspnet_client\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.aspx"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.asp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ashx"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\w3wp.exe'; data_win_eventdata_commandLine matches '*MSExchange*';
  data_win_eventdata_targetFilename matches '*FrontEnd\HttpProxy\*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/09/30/analyzing-attacks-using-the-exchange-vulnerabilities-cve-2022-41040-and-cve-2022-41082/
  - https://www.gteltsc.vn/blog/canh-bao-chien-dich-tan-cong-su-dung-lo-hong-zero-day-tren-microsoft-exchange-server-12714.html
  - https://en.gteltsc.vn/blog/cap-nhat-nhe-ve-lo-hong-bao-mat-0day-microsoft-exchange-dang-duoc-su-dung-de-tan-cong-cac-to-chuc-tai-viet-nam-9685.html
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    Suspicious ASPX File Drop by Exchange detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1505.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
  custom_tags:
    - exchange
    - file_event
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Mm][Ss][Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee].*/ AND (data_win_eventdata_targetFilename:/.*[Ff][Rr][Oo][Nn][Tt][Ee][Nn][Dd]\\[Hh][Tt][Tt][Pp][Pp][Rr][Oo][Xx][Yy]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Ee][Tt][Pp][Uu][Bb]\\[Ww][Ww][Ww][Rr][Oo][Oo][Tt]\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Ll][Ii][Ee][Nn][Tt]\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Hh][Xx]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b06335b3-55ac-4b41-937e-16b7f5d57dfd
    name: CVE-2021-26858 Exchange Exploitation
    reason: Same w3wp arbitrary-write primitive via a different Exchange bug; shows the exploit chain on the same server.
  - id: 6b269392-9eba-40b5-acb6-55c882b20ba6
    name: Suspicious File Drop by Exchange
    reason: Sibling rule for non-ASPX payloads (dll/exe/ps1) dropped by Exchange w3wp; tooling delivered next to the shell.
  - id: 7280c9f3-a5af-45d0-916a-bc01cb4151c9
    name: Suspicious MSExchangeMailboxReplication ASPX Write
    reason: Mailbox Replication ASPX write is the ProxyShell export-to-webshell route and confirms how the shell landed.
  - id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
    name: HAFNIUM Exchange Exploitation Activity
    reason: HAFNIUM-style Exchange commands (w3wp spawning cmd/powershell) are the first use of a dropped shell.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Chopper-style cmd child of the web server is typical first interaction with a fresh shell.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Webshell command keywords (whoami, net user, ipconfig) show the operator testing the shell.
  - id: f64e5c19-879c-4bae-b471-6d84c8339677
    name: Webshell Tool Reconnaissance Activity
    reason: Webshell hacking command patterns confirm hands-on post-exploitation through the dropped file.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Webshell reconnaissance from the IIS worker follows placement as operators map the server.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: IIS worker spawning shells and recon tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp].[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd].[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]|[Cc][Ss][Cc].[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii].[Ee][Xx][Ee]|[Nn][Ee][Tt].[Ee][Xx][Ee]|[Nn][Ee][Tt]1.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt].[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: Script and binary files written by IIS worker
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ww]3[Ww][Pp].[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Hh][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Mm][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/)
    pivot_on: host
    window: 24h
  - name: Exchange admin PowerShell and mailbox export abuse
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Ww]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ee][Xx][Pp][Oo][Rr][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Nn][Ee][Ww]-[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt][Rr][Oo][Ll][Ee][Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt]|[Aa][Dd][Dd]-[Pp][Ss][Ss][Nn][Aa][Pp][Ii][Nn]|[Ss][Ee][Tt]-[Oo][Aa][Bb][Vv][Ii][Rr][Tt][Uu][Aa][Ll][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy]).*/
    pivot_on: host
    window: 24h
  - name: Credential dumping after web compromise
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Ll][Ss][Aa][Ss][Ss]).*/
    pivot_on: host
    window: 24h
  - name: Persistence and tunneling tools on the server
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].[Ee][Xx][Ee]|[Ss][Cc].[Ee][Xx][Ee]|[Nn][Gg][Rr][Oo][Kk].[Ee][Xx][Ee]|[Pp][Ll][Ii][Nn][Kk].[Ee][Xx][Ee]|[Ff][Rr][Pp][Cc].[Ee][Xx][Ee]|[Cc][Hh][Ii][Ss][Ee][Ll].[Ee][Xx][Ee])/
    pivot_on: host
    window: 24h
