name: DPAPI Backup Keys And Certificate Export Activity IOC
id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
version: 1
schema_version: "1.0"
date: "2024-06-26"
author: Nounou Mbeiri, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file names with specific patterns seen generated and used by tools
  such as Mimikatz and DSInternals related to exported or stolen DPAPI backup
  keys and certificates. MITRE ATT&CK: T1555, T1552.004.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*ntds_capi_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*ntds_legacy_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*ntds_unknown_*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.cer"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.key"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.pfx"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.pvk"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*ntds_capi_*'; data_win_eventdata_targetFilename matches '*ntds_legacy_*';
  data_win_eventdata_targetFilename matches '*ntds_unknown_*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.dsinternals.com/en/dpapi-backup-key-theft-auditing/
  - https://github.com/MichaelGrafnetter/DSInternals/blob/39ee8a69bbdc1cfd12c9afdd7513b4788c4895d4/Src/DSInternals.Common/Data/DPAPI/DPAPIBackupKey.cs#L28-L32
  - https://attack.mitre.org/techniques/T1555/
  - https://attack.mitre.org/techniques/T1552/004/

response:
  message: >
    DPAPI Backup Keys And Certificate Export Activity IOC detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1555, T1552.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555
    - T1552.004
  custom_tags:
    - dpapi
    - backup
    - certificate
    - file_event
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]_[Cc][Aa][Pp][Ii]_.*/ OR data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]_[Ll][Ee][Gg][Aa][Cc][Yy]_.*/ OR data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]_[Uu][Nn][Kk][Nn][Oo][Ww][Nn]_.*/) AND (data_win_eventdata_targetFilename:/.*\.[Cc][Ee][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ee][Yy]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Vv][Kk]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz lsadump::backupkeys /export is what writes the ntds_capi_*/ntds_legacy_* .pfx/.pvk/.key/.cer files this rule matches; the process-creation event names the tool and its command line.
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: 'Follow-on: the stolen domain DPAPI backup key is fed to SharpDPAPI (masterkeys/credentials /pvk) to decrypt every domain user''s DPAPI-protected secrets.'
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: 'Precursor: the attacker needs ntds.dit (via ntdsutil IFM) so DSInternals Get-ADDBBackupKey can extract the DPAPI backup key offline.'
  - id: 94dc4390-6b7c-4784-8ffc-335334404650
    name: Dump Ntds.dit To Suspicious Location
    reason: 'Precursor or co-occurring: ntds.dit copied out is the source for offline extraction of the DPAPI backup key by DSInternals.'
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: 'Same domain controller credential-store theft chain: ntds.dit staging/exfiltration alongside exported backup key material.'
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Co-occurring export of certificates or private keys (.pfx) with a native tool, the same artifact class as the exported backup key/cert files.
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Alternative way to export certs/private keys (Export-PfxCertificate) as part of the same key-material theft.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Attacker copying credential stores (ntds.dit, SAM, SYSTEM) on the same host, the data source or companion of DPAPI backup key theft.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mimikatz/DSInternals DPAPI backup key extraction commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Dd][Bb][Bb][Aa][Cc][Kk][Uu][Pp][Kk][Ee][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii]::.*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)
    pivot_on:
    - host
    window: 2h
  - name: NTDS.dit access or copy preceding key extraction
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]/ OR data_win_eventdata_targetFilename:/.*\[Ss][Yy][Ss][Tt][Ee][Mm]32\[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt].*/))
    pivot_on:
    - host
    window: 4h
  - name: Other key, certificate and archive files dropped on host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Vv][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Pp]12/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ee][Yy]/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*\.7[Zz]/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Aa][Rr]/)
    pivot_on:
    - host
    window: 2h
  - name: Domain-wide DPAPI secret decryption tooling and Credential Manager/browser store access
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Ss][Tt][Ee][Rr][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Pp][Vv][Kk].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Aa][Tt][Bb][Ee][Ll][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ll][Aa][Zz][Aa][Gg][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]\\[Pp][Rr][Oo][Tt][Ee][Cc][Tt].*/)
    pivot_on:
    - host
    window: 4h
  - name: Remote shares or tools used to move key files off host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*[Uu][Pp][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Pp] .*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*\\\\.*/)) OR (data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"22" OR data_win_eventdata_destinationPort:"21"))
    pivot_on:
    - host
    window: 2h
