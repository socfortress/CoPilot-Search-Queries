name: TanStack Supply-Chain Attack File Creation Indicators - Windows
id: 8a3f2c1e-5d7b-4e9a-b6c8-1f2a3d4e5f6a
version: 1
schema_version: "1.0"
date: "2026-05-12"
author: Leonardo Gasparini
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a3f2c1e-5d7b-4e9a-b6c8-1f2a3d4e5f6a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file creation indicators associated with the Mini Shai-Hulud
  supply-chain campaign targeting TanStack npm packages and others such as
  mistralai, uipath, etc reported on early May 2026. MITRE ATT&CK: T1195.002,
  T1059.007, T1554.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\router_init.js"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\tanstack_runner.js"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\.claude\\\\router_runtime.js"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\.vscode\\\\router_runtime.js"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\router_init.js'; data_win_eventdata_targetFilename matches
  '*\tanstack_runner.js'; data_win_eventdata_targetFilename matches
  '*\.claude\router_runtime.js', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://socket.dev/blog/tanstack-npm-packages-compromised-mini-shai-hulud-supply-chain-attack
  - https://socket.dev/supply-chain-attacks/mini-shai-hulud
  - https://safedep.io/mass-npm-supply-chain-attack-tanstack-mistral/
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1059/007/
  - https://attack.mitre.org/techniques/T1554/

response:
  message: >
    TanStack Supply-Chain Attack File Creation Indicators - Windows detected on
    host $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1195.002, T1059.007, T1554
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1195.002
    - T1059.007
    - T1554
  custom_tags:
    - tanstack
    - supply
    - chain
    - file_event
    - sysmon
    - initial_access
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Rr][Oo][Uu][Tt][Ee][Rr]_[Ii][Nn][Ii][Tt]\.[Jj][Ss]/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Aa][Nn][Ss][Tt][Aa][Cc][Kk]_[Rr][Uu][Nn][Nn][Ee][Rr]\.[Jj][Ss]/ OR data_win_eventdata_targetFilename:/.*\\\.[Cc][Ll][Aa][Uu][Dd][Ee]\\[Rr][Oo][Uu][Tt][Ee][Rr]_[Rr][Uu][Nn][Tt][Ii][Mm][Ee]\.[Jj][Ss]/ OR data_win_eventdata_targetFilename:/.*\\\.[Vv][Ss][Cc][Oo][Dd][Ee]\\[Rr][Oo][Uu][Tt][Ee][Rr]_[Rr][Uu][Nn][Tt][Ii][Mm][Ee]\.[Jj][Ss]/)

