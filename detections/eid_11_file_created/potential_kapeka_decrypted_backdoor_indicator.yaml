name: Potential Kapeka Decrypted Backdoor Indicator
id: 20228d05-dd68-435d-8b4e-e7e64938880c
version: 1
schema_version: "1.0"
date: "2024-07-03"
author: Swachchhanda Shrawan Poudel, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 20228d05-dd68-435d-8b4e-e7e64938880c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the presence of a file that is decrypted backdoor binary dropped by
  the Kapeka Dropper, which disguises itself as a hidden file under a folder
  named "Microsoft" within "CSIDL_COMMON_APPDATA" or "CSIDL_LOCAL_APPDATA",
  depending on the process privileges. The file, typically 5-6 characters long
  with a random combination of consonants and vowels followed by a ".wll"
  extension to pose as a legitimate file to evade detection.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*:\\\\ProgramData\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Local\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - regexp:
                        data_win_eventdata_targetFilename: ".*(\\\\[a-zA-Z]{5,6}\\.wll).*"
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\win32log.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\crdss.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*:\ProgramData\*'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\*'; data_win_eventdata_targetFilename matches the regex
  /.*(\\[a-zA-Z]{5,6}\.wll).*/, among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/kapeka
  - https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/

response:
  message: >
    Potential Kapeka Decrypted Backdoor Indicator detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - kapeka
    - decrypted
    - backdoor
    - file_event
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (((data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/) AND data_win_eventdata_targetFilename:/.*(\\[a-zA-Z]{5,6}\.wll).*/) OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn]32[Ll][Oo][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Rr][Dd][Ss][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a7e6b1f9-8d2c-4f1e-9a7d-63e4c8a2bf4c
    name: Kapeka Backdoor Loaded Via Rundll32.EXE
    reason: 'Direct follow-on: the dropped .wll backdoor is loaded by rundll32 as the dropper''s launch step.'
  - id: e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
    name: Kapeka Backdoor Execution Via RunDLL32.EXE
    reason: Process-creation view of the same rundll32 launch of the dropped .wll payload.
  - id: 64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
    name: Kapeka Backdoor Persistence Activity
    reason: Kapeka sets autorun or scheduled-task persistence for the decrypted backdoor right after dropping it.
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: .wll is a Word add-in extension; same idea of planting loadable add-ins in Office startup locations.
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: Kapeka hides the dropped backdoor file; attrib +h on the new file is a common companion step.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: rundll32 loading a .wll or Microsoft-folder payload
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]/) AND ((data_win_eventdata_commandLine:/.*.[Ww][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].*/))
    pivot_on: host
    window: 4h
  - name: Autostart persistence pointing at the dropped payload
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg].[Ee][Xx][Ee]/)) AND (data_win_eventdata_commandLine:/.*[Oo][Nn][Ss][Tt][Aa][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Oo][Nn][Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].*/)) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) AND (data_win_eventdata_details:/.*.[Ww][Ll][Ll].*/ OR data_win_eventdata_details:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/))
    pivot_on: host
    window: 4h
  - name: Other loadable payloads written under Microsoft folders in ProgramData/AppData
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\.*/) AND (data_win_eventdata_targetFilename:/.*.[Ww][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from rundll32 (backdoor C2 beaconing)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
