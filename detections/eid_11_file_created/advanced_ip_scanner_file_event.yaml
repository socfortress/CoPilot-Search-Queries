name: Advanced IP Scanner - File Event
id: fed85bf9-e075-4280-9159-fbe8a023d6fa
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: "@ROxPinTeddy"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fed85bf9-e075-4280-9159-fbe8a023d6fa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Advanced IP Scanner. Seems to be a popular tool for
  ransomware groups. MITRE ATT&CK: T1046.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\Advanced IP Scanner 2*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\AppData\Local\Temp\Advanced IP Scanner 2*'.

known_false_positives: >
  Legitimate administrative use. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://news.sophos.com/en-us/2019/12/09/snatch-ransomware-reboots-pcs-into-safe-mode-to-bypass-protection/
  - https://www.fireeye.com/blog/threat-research/2020/05/tactics-techniques-procedures-associated-with-maze-ransomware-incidents.html
  - https://labs.f-secure.com/blog/prelude-to-ransomware-systembc
  - https://assets.documentcloud.org/documents/20444693/fbi-pin-egregor-ransomware-bc-01062021.pdf
  - https://thedfirreport.com/2021/01/18/all-that-for-a-coinminer
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    Advanced IP Scanner - File Event detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1046
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
  custom_tags:
    - advanced
    - scanner
    - file_event
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd] [Ii][Pp] [Ss][Cc][Aa][Nn][Nn][Ee][Rr] 2.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: 'Same tool seen at process creation: the Temp file drop is the extraction of the portable scanner, and its execution (advanced_ip_scanner.exe) confirms the scan actually ran.'
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: Ransomware affiliates pair Advanced IP Scanner with its sibling Advanced Port Scanner for host and service enumeration in the same discovery phase.
  - id: ca387a8e-1c84-4da3-9993-028b45342d30
    name: PUA - SoftPerfect Netscan Execution
    reason: Alternative network scanner commonly used by the same intruders (Conti, Maze, Egregor) when mapping hosts and shares before lateral movement.
  - id: 78e678d2-bf64-4fe6-aa52-2f7b11dddee7
    name: Windows Detect Network Scanner Behavior
    reason: Network-level evidence (many connections to many hosts/ports from this host) that the dropped scanner was run against the LAN.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: After the scanner reveals reachable hosts, operators commonly push payloads or tooling to them with PsExec (lateral movement follow-on).
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Remote service-based execution against hosts just enumerated by the scanner is the typical next step in pre-ransomware intrusions.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Scanner use is a staple of ransomware playbooks that proceed to data exfiltration with Rclone before encryption.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Advanced IP Scanner process execution and helper files
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Ii][Pp]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_image:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Pp][Oo][Rr][Tt]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_image:/.*[Nn][Ee][Tt][Ss][Cc][Aa][Nn].*/ OR data_win_eventdata_description:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd] [Ii][Pp] [Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Ii][Pp]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr]|[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Pp][Oo][Rr][Tt]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Scanner or tool dropper: who wrote the file and what launched it'
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: 'Scanner-style network sweep: SMB, RDP, WinRM, NetBIOS connections'
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"139" OR data_win_eventdata_destinationPort:"135")
    pivot_on:
    - host
    window: 2h
  - name: Lateral movement and remote service tooling after discovery
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Mm][Ss][Tt][Ss][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] .*\\\\.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee]:.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Staging and exfiltration tooling following discovery
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Pp][Ss][Cc][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(-[Pp]|\/[Pp])[Ww]? .*[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*(copy|sync|[Cc][Oo][Pp][Yy]|[Ss][Yy][Nn][Cc]).*/)
    pivot_on:
    - host
    window: 6h
