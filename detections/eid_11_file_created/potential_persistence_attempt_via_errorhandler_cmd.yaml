name: Potential Persistence Attempt Via ErrorHandler.Cmd
id: 15904280-565c-4b73-9303-3291f964e7f9
version: 1
schema_version: "1.0"
date: "2022-12-19"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 15904280-565c-4b73-9303-3291f964e7f9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a file named "ErrorHandler.cmd" in the
  "C:\WINDOWS\Setup\Scripts\" directory which could be used as a method of
  persistence The content of C:\WINDOWS\Setup\Scripts\ErrorHandler.cmd is read
  whenever some tools under C:\WINDOWS\System32\oobe\ (e.g. Setup.exe) fail to
  run for any reason.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\WINDOWS\\\\Setup\\\\Scripts\\\\ErrorHandler.cmd"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\WINDOWS\Setup\Scripts\ErrorHandler.cmd'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hexacorn.com/blog/2022/01/16/beyond-good-ol-run-key-part-135/
  - https://github.com/last-byte/PersistenceSniper

response:
  message: >
    Potential Persistence Attempt Via ErrorHandler.Cmd detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - errorhandler
    - file_event
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Ee][Tt][Uu][Pp]\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\\[Ee][Rr][Rr][Oo][Rr][Hh][Aa][Nn][Dd][Ll][Ee][Rr]\.[Cc][Mm][Dd]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 28208707-fe31-437f-9a7f-4b1108b94d2e
    name: Suspicious Startup Folder Persistence
    reason: 'Same operator habit: a more common autostart planted alongside the obscure OOBE hook.'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Redundant persistence commonly set in the same session as ErrorHandler.cmd.
  - id: 21d856f9-9281-4ded-9377-51a1a6e2a432
    name: Potential Persistence Via Logon Scripts - CommandLine
    reason: Another low-noise logon-triggered persistence the same operator may layer on.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files created under Windows Setup Scripts
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Ee][Tt][Uu][Pp]\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\\.*/
    pivot_on: host
    window: 24h
  - name: Execution referencing ErrorHandler.cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Rr][Rr][Oo][Rr][Hh][Aa][Nn][Dd][Ll][Ee][Rr]\.[Cc][Mm][Dd].*/
    pivot_on: host
    window: 24h
  - name: OOBE binaries executing (trigger)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Oo][Oo][Bb][Ee]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Oo][Oo][Bb][Ee]\\.*/)
    pivot_on: host
    window: 24h
  - name: Children of cmd run from Setup Scripts
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*[Ss][Ee][Tt][Uu][Pp]\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss].*/
    pivot_on: host
    window: 24h
  - name: Run key writes on same host
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/
    pivot_on: host
    window: 24h
