name: DarkGate - Autoit3.EXE File Creation By Uncommon Process
id: 1a433e1d-03d2-47a6-8063-ece992cf4e73
version: 1
schema_version: "1.0"
date: "2023-10-15"
author: Micah Babinski
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1a433e1d-03d2-47a6-8063-ece992cf4e73
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of curl.exe, KeyScramblerLogon, or other
  non-standard/suspicious processes used to create Autoit3.exe. This activity
  has been associated with DarkGate malware, which uses Autoit3.exe to execute
  shellcode that performs process injection and connects to the DarkGate
  command-and-control server. Curl, KeyScramblerLogon, and these other processes
  consitute non-standard and suspicious ways to retrieve the Autoit3 executable.
  MITRE ATT&CK: T1105, T1059.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Autoit3.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ExtExport.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\KeyScramblerLogon.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmprph.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Autoit3.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\Autoit3.exe'; data_win_eventdata_image matches '*\curl.exe';
  data_win_eventdata_image matches '*\ExtExport.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.security.telekom.com/2023/08/darkgate-loader.html
  - https://www.kroll.com/en/insights/publications/cyber/microsoft-teams-used-as-initial-access-for-darkgate-malware
  - https://github.com/pr0xylife/DarkGate/tree/main
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    DarkGate - Autoit3.EXE File Creation By Uncommon Process detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1105, T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
    - T1059
  custom_tags:
    - darkgate
    - autoit3
    - uncommon
    - file_event
    - sysmon
    - command_and_control
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Tt][Ee][Xx][Pp][Oo][Rr][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Pp][Rr][Pp][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
    name: DarkGate - Autoit3.EXE Execution Parameters
    reason: 'Direct follow-on: after Autoit3.exe is dropped, DarkGate launches it against its .au3 script; this process-creation rule confirms the dropped binary was actually executed.'
  - id: f4264e47-f522-4c38-a420-04525d5b880f
    name: Renamed AutoIt Execution
    reason: DarkGate often copies/renames the AutoIt interpreter; a renamed AutoIt run on the host confirms the dropped interpreter is in use.
  - id: windows-autoit3-execution-001
    name: Windows AutoIt3 Execution
    reason: AutoIt3 running on the host after the drop shows the loader stage executing its script and shellcode.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: 'Precursor: DarkGate retrieves Autoit3.exe and the payload with curl.exe; this is the download-then-run chain that precedes the file creation.'
  - id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: Suspicious Curl.EXE Download
    reason: 'Precursor: curl.exe fetching the AutoIt binary or payload from a remote host is the ingress step the file-creation alert reflects.'
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: Autoit3.exe executes shellcode that injects into another process via remote thread, the next stage after execution.
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: 'Documented DarkGate post-execution behaviour: creating a local backdoor account via net.exe.'
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: DarkGate persists Autoit3/script via a Run key pointing at a ProgramData/Temp folder; likely persistence after the drop.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AutoIt3 execution against .au3 script or from user-writable path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Tt][Oo][Ii][Tt]3.*/) AND (data_win_eventdata_commandLine:/.*\.[Aa][Uu]3.*/ OR data_win_eventdata_image:/.*([Pp]rogram[Dd]ata|[Tt]emp|[Aa]pp[Dd]ata|[Uu]sers\\[Pp]ublic).*/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections initiated by AutoIt3 (DarkGate C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Remote thread / process access from AutoIt3 (shellcode injection)
    query: (data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: DarkGate staging files (.au3, shellcode, test.txt) created in ProgramData/Temp
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Aa][Uu]3/ OR data_win_eventdata_targetFilename:/.*([Pp]rogram[Dd]ata|[Tt]emp|[Aa]pp[Dd]ata).*(shellcode|script|test)\.(au3|txt|sc|bin)/)
    pivot_on:
    - host
    window: 1h
  - name: Persistence via Run key, startup folder or scheduled task pointing to AutoIt
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ AND data_win_eventdata_details:/.*([Aa][Uu][Tt][Oo][Ii][Tt]|\.[Aa][Uu]3|[Pp]rogram[Dd]ata).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Rr][Ee][Gg] +[Aa][Dd][Dd]).*([Aa][Uu][Tt][Oo][Ii][Tt]|\.[Aa][Uu]3).*/)
    pivot_on:
    - host
    window: 4h
