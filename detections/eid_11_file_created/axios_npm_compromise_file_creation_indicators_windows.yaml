name: Axios NPM Compromise File Creation Indicators - Windows
id: cd6386fa-bb9a-4b67-b006-786b6ab5d2ba
version: 1
schema_version: "1.0"
date: "2026-04-01"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd6386fa-bb9a-4b67-b006-786b6ab5d2ba
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file creation events linked to the Axios NPM supply chain compromise.
  Axios is a popular JavaScript HTTP client. On March 30, 2026, malicious
  versions (1.14.1, 0.30.4) were published to npm, injecting a dependency
  (plain-crypto-js@4.2.1) that executed a postinstall script as a cross-platform
  RAT dropper. The dropper contacted a C2 server, delivered platform-specific
  payloads, deleted itself, and replaced package.json to evade detection. The
  attack used cscript.exe (VBScript), curl.exe (C2), and PowerShell masquerading
  as Windows Terminal. MITRE ATT&CK: T1195.002.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\node.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_targetFilename:
                    value: "C:\\ProgramData\\wt.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetFilename:
                    value: "C:\\ProgramData\\system.bat"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\6202033.vbs*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetFilename:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\6202033.ps1*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\node.exe'; data_win_eventdata_image matches '*\powershell.exe';
  data_win_eventdata_targetFilename equals 'C:\ProgramData\wt.exe', among other
  conditions.

known_false_positives: >
  Highly unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.stepsecurity.io/blog/axios-compromised-on-npm-malicious-versions-drop-remote-access-trojan
  - https://www.derp.ca/research/axios-npm-supply-chain-rat/
  - https://www.trendmicro.com/zh_hk/research/26/c/axios-npm-package-compromised.html
  - https://www.elastic.co/security-labs/axios-supply-chain-compromise-detections
  - https://www.virustotal.com/gui/file/e10b1fa84f1d6481625f741b69892780140d4e0e7769e7491e5f4d894c2e0e09
  - https://attack.mitre.org/techniques/T1195/002/

response:
  message: >
    Axios NPM Compromise File Creation Indicators - Windows detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1195.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1195.002
  custom_tags:
    - axios
    - compromise
    - indicators
    - file_event
    - sysmon
    - initial_access
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ww][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ss][Yy][Ss][Tt][Ee][Mm]\.[Bb][Aa][Tt]/ OR (data_win_eventdata_targetFilename:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\6202033\.[Vv][Bb][Ss].*/) OR (data_win_eventdata_targetFilename:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\6202033\.[Pp][Ss]1.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f6c27ecc-d890-4452-80e6-2e274a10e097
    name: Axios NPM Compromise Indicators - Windows
    reason: 'Process-side view of the same plain-crypto-js postinstall chain: node/bun spawning cmd+cscript on 6202033.vbs, curl/powershell to the sfrclak C2, and the wt.exe hidden PowerShell launch that follows the files this rule saw being dropped.'
  - id: 002bdb95-0cf1-46a6-9e08-d38c128a6127
    name: WScript or CScript Dropper - File
    reason: The dropper writes and runs a VBScript (6202033.vbs) from Temp via cscript; generic script-dropper file creation confirms the stage-one loader.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The 6202033.vbs stage launches curl/powershell as children of cscript to fetch the platform-specific RAT payload.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Execution of the dropped VBS from AppData\Local\Temp is the immediate follow-on to the file creation.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The chain drops 6202033.ps1 and wt.exe (copied powershell) and uses download cradles to pull the second-stage RAT from C2.
  - id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
    name: Node Process Executions
    reason: Postinstall runs under node.exe during npm install; ties the file drops to the compromised package installation.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: After the wt.exe/system.bat payload is staged, the RAT is likely to persist via Run keys.
  - id: b7916c2a-fa2f-4795-9477-32b731f70f11
    name: Registry Persistence via Explorer Run Key
    reason: Registry autorun persistence for the dropped wt.exe/system.bat payload is the expected next step.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Node/Bun postinstall spawning cmd/cscript/curl/powershell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Hidden PowerShell executed from ProgramData wt.exe or Temp 6202033 scripts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ww][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*6202033\.(vbs|ps1).*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ss][Yy][Ss][Tt][Ee][Mm]\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Pp] [Bb][Yy][Pp][Aa][Ss][Ss].*-[Ww] [Hh][Ii][Dd][Dd][Ee][Nn].*/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections from node, curl, powershell or wt.exe (C2 callback)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups for Axios RAT C2 (sfrclak) or npm registry from scripting hosts
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*sfrclak* OR (data_win_eventdata_queryName:*registry.npmjs.org* AND data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 4h
  - name: Dropper self-deletion and temp script/payload file activity
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*6202033* OR data_win_eventdata_targetFilename:*plain-crypto-js* OR data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.(exe|bat|ps1|vbs)/)
    pivot_on:
    - host
    window: 2h
