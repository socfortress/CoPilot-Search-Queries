name: Process Explorer Driver Creation By Non-Sysinternals Binary
id: de46c52b-0bf8-4936-a327-aace94f94ac6
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: de46c52b-0bf8-4936-a327-aace94f94ac6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of the Process Explorer drivers by processes other than
  Process Explorer (procexp) itself. Hack tools or malware may use the Process
  Explorer driver to elevate privileges, drops it to disk for a few moments,
  runs a service using that driver and removes it afterwards. MITRE ATT&CK:
  T1068.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\PROCEXP*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.sys"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp64a.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\PROCEXP*'; data_win_eventdata_targetFilename matches '*.sys';
  data_win_eventdata_image matches '*\procexp.exe', among other conditions.

known_false_positives: >
  Some false positives may occur with legitimate renamed process explorer
  binaries. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/process-explorer
  - https://github.com/Yaxser/Backstab
  - https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks
  - https://news.sophos.com/en-us/2023/04/19/aukill-edr-killer-malware-abuses-process-explorer-driver/
  - https://attack.mitre.org/techniques/T1068/

response:
  message: >
    Process Explorer Driver Creation By Non-Sysinternals Binary detected on host
    $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1068
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1068
  custom_tags:
    - explorer
    - driver
    - sysinternals
    - file_event
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp].*/ AND data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64[Aa]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3da70954-0f2c-4103-adff-b7440368f50e
    name: Suspicious PROCEXP152.sys File Created In TMP
    reason: Same abused PROCEXP152.sys driver written to TMP; direct sibling signal.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: The dropped driver is loaded from a temporary directory right after creation.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: sc.exe creating a kernel-driver service is how the dropped .sys gets loaded.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: Known-bad driver names loading confirms BYOVD use.
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: Kernel Driver Utility (KDU) is a common tool that drops and loads such drivers.
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: A suspicious new service registration is the registry trace of driver service installation.
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: pnputil driver installation is an alternate loading path.
  - id: d526c60a-e236-4011-b165-831ffa52ab70
    name: Windows Vulnerable Driver Blocklist Disabled
    reason: Disabling the vulnerable driver blocklist is the enabler that lets abused drivers load.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel driver service creation via sc.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|[Cc][Oo][Nn][Ff][Ii][Gg]).*[Kk][Ee][Rr][Nn][Ee][Ll].*/
    pivot_on: host
    window: 1h
  - name: Driver image loads from user-writable paths
    query: data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\).*\.[Ss][Yy][Ss]/
    pivot_on: host
    window: 1h
  - name: Services registered pointing at .sys files
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/ AND data_win_eventdata_details:/.*\.[Ss][Yy][Ss].*/
    pivot_on: host
    window: 1h
  - name: Process access to LSASS after driver load
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
