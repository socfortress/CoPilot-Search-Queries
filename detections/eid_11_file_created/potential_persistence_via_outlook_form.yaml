name: Potential Persistence Via Outlook Form
id: c3edc6a5-d9d4-48d8-930e-aab518390917
version: 1
schema_version: "1.0"
date: "2023-02-22"
author: Tobias Michalski (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c3edc6a5-d9d4-48d8-930e-aab518390917
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a new Outlook form which can contain malicious code.
  MITRE ATT&CK: T1137.003.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\outlook.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\FORMS\\\\IPM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Local Settings\\\\Application Data\\\\Microsoft\\\\Forms*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\outlook.exe'; data_win_eventdata_targetFilename matches
  '*\AppData\Local\Microsoft\FORMS\IPM*'; data_win_eventdata_targetFilename
  matches '*\Local Settings\Application Data\Microsoft\Forms*'.

known_false_positives: >
  Legitimate use of outlook forms. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=76
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=79
  - https://learn.microsoft.com/en-us/office/vba/outlook/concepts/outlook-forms/create-an-outlook-form
  - https://www.slipstick.com/developer/custom-form/clean-outlooks-forms-cache/
  - https://attack.mitre.org/techniques/T1137/003/

response:
  message: >
    Potential Persistence Via Outlook Form detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1137.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137.003
  custom_tags:
    - persistence
    - outlook
    - file_event
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ff][Oo][Rr][Mm][Ss]\\[Ii][Pp][Mm].*/ OR data_win_eventdata_targetFilename:/.*\\[Ll][Oo][Cc][Aa][Ll] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ff][Oo][Rr][Mm][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
    name: New Outlook Macro Created
    reason: Outlook macro project (VbaProject.OTM) is the sibling Outlook-native persistence; actors often plant both a form and a macro.
  - id: 117d3d3a-755c-4a61-b23e-9171146d094c
    name: Suspicious Outlook Macro Created
    reason: A macro file written by a non-Outlook process alongside a new form points to scripted Outlook persistence setup.
  - id: 55f0a3a1-846e-40eb-8273-677371b8d912
    name: Outlook EnableUnsafeClientMailRules Setting Enabled
    reason: Forms/rules abuse (Ruler) needs this setting flipped so malicious rules/forms trigger; it typically precedes the form drop.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: The form's embedded VBScript fires when a trigger mail arrives, executing as a child of outlook.exe.
  - id: e212d415-0e93-435f-9e1a-f29005bb4723
    name: Suspicious Remote Child Process From Outlook
    reason: Form/rule payloads often launch from a WebDAV/UNC path, so the child runs a remote binary from outlook.exe.
  - id: 9a0b8719-cd3c-4f0a-90de-765a4cb3f5ed
    name: Microsoft VBA For Outlook Addin Loaded Via Outlook
    reason: Outlook loading the VBA engine when no user macro is expected confirms form/macro code is executing.
  - id: fabb0e80-030c-4e3e-a104-d09676991ac3
    name: Suspicious File Created in Outlook Temporary Directory
    reason: Phishing attachments saved via Outlook's temp directory are a common initial step before the implant.
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: Execution of an attachment dropped via Outlook is the typical foothold that leads to this persistence.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Suspicious processes spawned by Outlook
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\[Oo][Uu][Tt][Ll][Oo][Oo][Kk].[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\[Cc][Mm][Dd].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Pp][Ww][Ss][Hh].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Mm][Ii][Cc].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Outlook form, macro and template files written
    query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\[Ff][Oo][Rr][Mm][Ss]\.*/ OR data_win_eventdata_targetFilename:/.*\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\[Vv][Bb][Aa][Pp][Rr][Oo][Jj][Ee][Cc][Tt].*/ OR data_win_eventdata_targetFilename:/.*\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss]\.*/) OR (data_win_eventdata_targetFilename:/.*.[Oo][Tt][Mm].*/ OR data_win_eventdata_targetFilename:/.*.[Oo][Ff][Tt].*/ OR data_win_eventdata_targetFilename:/.*.[Cc][Ff][Gg].*/))
    pivot_on:
    - host
    window: 24h
  - name: Outlook security, rules and home page registry tampering
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_targetObject:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Uu][Nn][Ss][Aa][Ff][Ee][Cc][Ll][Ii][Ee][Nn][Tt][Mm][Aa][Ii][Ll][Rr][Uu][Ll][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\[Ww][Ee][Bb][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_targetObject:/.*\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\[Tt][Oo][Dd][Aa][Yy].*/)
    pivot_on:
    - host
    window: 24h
  - name: Outlook loading script and VBA engines
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\[Oo][Uu][Tt][Ll][Oo][Oo][Kk].[Ee][Xx][Ee].*/) AND (data_win_eventdata_imageLoaded:/.*[Vv][Bb][Ee]7.*/ OR data_win_eventdata_imageLoaded:/.*[Oo][Uu][Tt][Ll][Vv][Bb][Aa].*/ OR data_win_eventdata_imageLoaded:/.*[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt].[Dd][Ll][Ll].*/ OR data_win_eventdata_imageLoaded:/.*[Jj][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_imageLoaded:/.*[Ss][Cc][Rr][Rr][Uu][Nn].[Dd][Ll][Ll].*/ OR data_win_eventdata_imageLoaded:/.*[Ww][Ss][Hh][Oo][Mm].*/)
    pivot_on:
    - host
    window: 6h
  - name: Outbound connections from Outlook to non-mail ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\[Oo][Uu][Tt][Ll][Oo][Oo][Kk].[Ee][Xx][Ee].*/) AND data_win_eventdata_destinationPort:(80 OR 8080 OR 8443 OR 4444 OR 445 OR 135)
    pivot_on:
    - host
    window: 6h
