name: Potential Privilege Escalation Attempt Via .Exe.Local Technique
id: 07a99744-56ac-40d2-97b7-2095967b0e03
version: 1
schema_version: "1.0"
date: "2022-12-19"
author: Nasreddine Bencherchali (Nextron Systems), Subhash P (@pbssubhash)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07a99744-56ac-40d2-97b7-2095967b0e03
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential privilege escalation attempt via the creation of the
  "*.Exe.Local" folder inside the "System32" directory in order to sideload
  "comctl32.dll".

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "C:\\\\Windows\\\\System32\\\\logonUI.exe.local*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "C:\\\\Windows\\\\System32\\\\werFault.exe.local*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "C:\\\\Windows\\\\System32\\\\consent.exe.local*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "C:\\\\Windows\\\\System32\\\\narrator.exe.local*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "C:\\\\Windows\\\\System32\\\\wermgr.exe.local*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\comctl32.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  'C:\Windows\System32\logonUI.exe.local*'; data_win_eventdata_targetFilename
  matches 'C:\Windows\System32\werFault.exe.local*';
  data_win_eventdata_targetFilename matches
  'C:\Windows\System32\consent.exe.local*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/binderlabs/DirCreate2System
  - https://github.com/sailay1996/awesome_windows_logical_bugs/blob/60cbb23a801f4c3195deac1cc46df27c225c3d07/dir_create2system.txt

response:
  message: >
    Potential Privilege Escalation Attempt Via .Exe.Local Technique detected on
    host $agent_name$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - privilege
    - escalation
    - local
    - file_event
    - sysmon
    - persistence
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Oo][Gg][Oo][Nn][Uu][Ii]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll].*/) AND data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Mm][Cc][Tt][Ll]32\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6360757a-d460-456c-8b13-74cf0e60cceb
    name: Potential DLL Sideloading Via comctl32.dll
    reason: 'This is the load-side of the same technique: the target binary loading comctl32.dll from the .local folder instead of WinSxS.'
  - id: a5ea83a7-05a5-44c1-be2e-addccbbd8c03
    name: UAC Bypass With Fake DLL
    reason: Fake system DLL planted so an auto-elevating binary loads it is the same elevation-by-DLL-redirect pattern.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: A planted DLL in a system folder loaded by a trusted binary is the same sideload-for-elevation outcome.
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: The hijacked consent/logonui/WerFault process loads the attacker DLL from an unusual path.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Companion sideload detection for abusable DLLs loaded from non-standard directories after the drop.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: comctl32.dll loaded from a non-standard path
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\[Cc][Oo][Mm][Cc][Tt][Ll]32.[Dd][Ll][Ll].*/) AND NOT (data_win_eventdata_imageLoaded:/.*\[Ww][Ii][Nn][Ss][Xx][Ss]\.*/ OR data_win_eventdata_imageLoaded:/.*[Cc]:\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Ss][Yy][Ss][Tt][Ee][Mm]32\.*/ OR data_win_eventdata_imageLoaded:/.*[Cc]:\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Ss][Yy][Ss][Ww][Oo][Ww]64\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Execution of the hijackable system binaries
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Cc][Oo][Nn][Ss][Ee][Nn][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ll][Oo][Gg][Oo][Nn][Uu][Ii].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Ee][Rr][Mm][Gg][Rr].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr].[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Any .local folder or comctl32.dll file created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*.[Ee][Xx][Ee].[Ll][Oo][Cc][Aa][Ll].*/ OR data_win_eventdata_targetFilename:/.*\[Cc][Oo][Mm][Cc][Tt][Ll]32.[Dd][Ll][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Registry settings enabling DLL redirection
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Dd][Ee][Vv][Oo][Vv][Ee][Rr][Rr][Ii][Dd][Ee][Ee][Nn][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Pp][Rr][Ee][Ff][Ee][Rr][Ee][Xx][Tt][Ee][Rr][Nn][Aa][Ll][Mm][Aa][Nn][Ii][Ff][Ee][Ss][Tt].*/)
    pivot_on:
    - host
    window: 4h
  - name: Shells and tools spawned by the hijacked binaries
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\[Cc][Oo][Nn][Ss][Ee][Nn][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Ll][Oo][Gg][Oo][Nn][Uu][Ii].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Ww][Ee][Rr][Mm][Gg][Rr].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr].[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\[Cc][Mm][Dd].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Pp][Ww][Ss][Hh].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Ww][Mm][Ii][Cc].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 2h
