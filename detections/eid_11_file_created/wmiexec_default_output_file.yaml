name: Wmiexec Default Output File
id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
version: 1
schema_version: "1.0"
date: "2023-03-08"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of the default output filename used by the wmiexec tool.
  MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - regexp:
                  data_win_eventdata_targetFilename: ".*(\\\\Windows\\\\__1[0-9]{9}\\.[0-9]{1,7})"
              - regexp:
                  data_win_eventdata_targetFilename: ".*(C:\\\\__1[0-9]{9}\\.[0-9]{1,7})"
              - regexp:
                  data_win_eventdata_targetFilename: ".*(D:\\\\__1[0-9]{9}\\.[0-9]{1,7})"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches the
  regex /.*(\\Windows\\__1[0-9]{9}\.[0-9]{1,7})/;
  data_win_eventdata_targetFilename matches the regex
  /.*(C:\\__1[0-9]{9}\.[0-9]{1,7})/; data_win_eventdata_targetFilename matches
  the regex /.*(D:\\__1[0-9]{9}\.[0-9]{1,7})/.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.crowdstrike.com/blog/how-to-detect-and-prevent-impackets-wmiexec/
  - https://github.com/fortra/impacket/blob/f4b848fa27654ca95bc0f4c73dbba8b9c2c9f30a/examples/wmiexec.py
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Wmiexec Default Output File detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1047
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - wmiexec
    - default
    - output
    - file_event
    - sysmon
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*(\\Windows\\__1[0-9]{9}\.[0-9]{1,7})/ OR data_win_eventdata_targetFilename:/.*(C:\\__1[0-9]{9}\.[0-9]{1,7})/ OR data_win_eventdata_targetFilename:/.*(D:\\__1[0-9]{9}\.[0-9]{1,7})/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: The cmd.exe /Q /c ... \\127.0.0.1\ADMIN$\__<ts> command line from wmiprvse is the process-side view of the same wmiexec output file.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: wmiexec-style activity often shows WmiPrvSE spawning PowerShell on the target.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: WmiPrvSE spawning shells/tools is the execution leg of remote WMI command execution.
  - id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
    name: Writing Local Admin Share
    reason: wmiexec redirects output through the local ADMIN$ share; this file-create variant fires beside the __timestamp output.
  - id: ab9e3b40-0c85-4ba1-aede-455d226fd124
    name: Suspicious Redirection to Local Admin Share
    reason: Command-line redirection to the local admin share is how wmiexec writes its output.
  - id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
    name: HackTool - Wmiexec Default Powershell Command
    reason: Default PowerShell command used by wmiexec variants.
  - id: 03f4ca17-de95-428d-a75a-4ee78b047256
    name: HackTool - Impacket File Indicators
    reason: Impacket file indicators co-occur when wmiexec/smbexec/secretsdump tooling is used against the host.
  - id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
    name: WMIC Remote Command Execution
    reason: WMIC remote command execution is the native-tool analogue of the same remote WMI execution.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands spawned by WmiPrvSE with output redirect
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee].[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$|__[0-9]{10}\.[0-9]+).*/
    pivot_on: host
    window: 2h
  - name: Network logons and admin share access
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR (data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*([Aa][Dd][Mm][Ii][Nn]|[Cc]|[Ii][Pp][Cc])\$.*/)
    pivot_on: host
    window: 2h
  - name: Recon commands run under WmiPrvSE
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee].[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Qq][Uu][Ss][Ee][Rr]).*/
    pivot_on: host
    window: 2h
  - name: Output file deletion after read
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND data_win_eventdata_targetFilename:/.*__[0-9]{10}\.[0-9]+/
    pivot_on: host
    window: 2h
  - name: Credential access follow-on
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg] [Ss][Aa][Vv][Ee]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Cc][Rr][Ee][Aa][Tt][Ee]|[Ll][Ss][Aa][Ss][Ss]).*/
    pivot_on: host
    window: 4h
