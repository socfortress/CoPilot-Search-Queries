name: UAC Bypass Using EventVwr
id: 63e4f530-65dc-49cc-8f80-ccfa95c69d43
version: 1
schema_version: "1.0"
date: "2022-11-22"
author: Antonio Cocomazzi (idea), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 63e4f530-65dc-49cc-8f80-ccfa95c69d43
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of a UAC bypass using Windows Event Viewer.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Microsoft\\\\Event Viewer\\\\RecentViews"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\Microsoft\\\\EventV~1\\\\RecentViews"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Microsoft\Event Viewer\RecentViews'; data_win_eventdata_targetFilename
  matches '*\Microsoft\EventV~1\RecentViews'; data_win_eventdata_image matches
  'C:\Windows\System32\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/orange_8361/status/1518970259868626944?s=20&t=RFXqZjtA7tWM3HxqEH78Aw
  - https://twitter.com/splinter_code/status/1519075134296006662?s=12&t=DLUXH86WtcmG_AZ5gY3C6g
  - https://lolbas-project.github.io/lolbas/Binaries/Eventvwr/#execute

response:
  message: >
    UAC Bypass Using EventVwr detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - bypass
    - eventvwr
    - file_event
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Vv][Ee][Nn][Tt] [Vv][Ii][Ee][Ww][Ee][Rr]\\[Rr][Ee][Cc][Ee][Nn][Tt][Vv][Ii][Ee][Ww][Ss]/ OR data_win_eventdata_targetFilename:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Vv][Ee][Nn][Tt][Vv]\~1\\[Rr][Ee][Cc][Ee][Nn][Tt][Vv][Ii][Ee][Ww][Ss]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
    name: Bypass UAC Using Event Viewer
    reason: Registry mscfile hijack for eventvwr is the precursor that makes Event Viewer launch the attacker binary.
  - id: 7c81fec3-1c1d-43b0-996a-46753041b1b6
    name: UAC Bypass via Event Viewer
    reason: Second registry-side Event Viewer bypass rule; same hijack with different key coverage.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi implements the eventvwr method; likely tool.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell from an uncommon parent is expected post-bypass behaviour.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hijack of mscfile/ms-settings shell open command
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*(mscfile|ms-settings)\\[Ss]hell\\[Oo]pen\\[Cc]ommand.*/)
    pivot_on: host
    window: 2h
  - name: Non-mmc children of eventvwr
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ee]ventvwr\.exe/) AND NOT data_win_eventdata_image:(/.*[Mm]mc\.exe/)
    pivot_on: host
    window: 2h
  - name: Shells under eventvwr or mmc
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*([Ee]ventvwr|[Mm]mc)\.exe/) AND data_win_eventdata_image:(/.*[\\\/](cmd|powershell|pwsh)\.exe/)
    pivot_on: host
    window: 2h
  - name: Event Viewer RecentViews writes
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*RecentViews/)
    pivot_on: host
    window: 2h
