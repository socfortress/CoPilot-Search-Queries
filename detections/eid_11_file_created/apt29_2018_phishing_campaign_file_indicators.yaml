name: APT29 2018 Phishing Campaign File Indicators
id: 3a3f81ca-652c-482b-adeb-b1c804727f74
version: 1
schema_version: "1.0"
date: "2023-02-20"
author: "@41thexplorer"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3a3f81ca-652c-482b-adeb-b1c804727f74
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects indicators of APT 29 (Cozy Bear) phishing-campaign as reported by
  mandiant. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*ds7002.lnk*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*ds7002.pdf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*ds7002.zip*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*ds7002.lnk*'; data_win_eventdata_targetFilename matches '*ds7002.pdf*';
  data_win_eventdata_targetFilename matches '*ds7002.zip*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/DrunkBinary/status/1063075530180886529
  - https://www.mandiant.com/resources/blog/not-so-cozy-an-uncomfortable-examination-of-a-suspected-apt29-phishing-campaign
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    APT29 2018 Phishing Campaign File Indicators detected on host $agent_name$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218.011
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - apt29
    - phishing
    - campaign
    - file_event
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Dd][Ss]7002\.[Ll][Nn][Kk].*/ OR data_win_eventdata_targetFilename:/.*[Dd][Ss]7002\.[Pp][Dd][Ff].*/ OR data_win_eventdata_targetFilename:/.*[Dd][Ss]7002\.[Zz][Ii][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7453575c-a747-40b9-839b-125a0aae324b
    name: APT29 2018 Phishing Campaign CommandLine Indicators
    reason: 'Same campaign, next stage: the ds7002.pdf.lnk shortcut launches PowerShell (-noni -ep bypass) and rundll32 cyzfc.dat,PointFunctionCall; a hit confirms the dropped files were opened and executed.'
  - id: 3215aa19-f060-4332-86d5-5602511f3ca8
    name: Suspicious LNK Double Extension File Created
    reason: ds7002.pdf.lnk is a PDF-masquerading shortcut; the generic double-extension LNK creation is the same lure artifact seen when the zip is extracted.
  - id: windows-process-creating-lnk-suspicious-location-001
    name: Windows Process Creating LNK File in Suspicious Location
    reason: Extraction of the zip (or the malicious process itself) drops the lure .lnk into a user-writable location, the same file-creation event seen from the process side.
  - id: 654fcc6d-840d-4844-9b07-2c3300e54a26
    name: Legitimate Application Dropped Archive
    reason: ds7002.zip arrives as an email/browser-delivered archive; an app such as a mail client or browser writing a zip precedes the extraction that creates the lure files.
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: 'Phishing delivery path: attachments opened from the Outlook temp folder lead to the zip/lnk executing from there.'
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: The campaign's payload is a dropped DLL (cyzfc.dat) run through rundll32 with an exported function; this catches that proxy-execution pattern.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: The APT29 2018 payload was a Cobalt Strike-style beacon DLL loaded via rundll32, the expected implant stage after the LNK runs.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Post-compromise persistence for the loaded implant via Run keys is the typical next step after initial execution.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell/cmd launched from LNK with bypass and hidden flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Cc]md)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*\-[Ee][Pp]* OR data_win_eventdata_commandLine:*\-[Nn][Oo][Nn][Ii]* OR data_win_eventdata_commandLine:*[Ee]xecution[Pp]olicy* OR data_win_eventdata_commandLine:*[Hh]idden*) AND data_win_eventdata_parentImage:/.*\\[Ee]xplorer\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Rundll32 loading a .dat/.tmp or non-DLL payload with exported function
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr]undll32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*.dat,* OR data_win_eventdata_commandLine:*.tmp,* OR data_win_eventdata_commandLine:*PointFunctionCall* OR data_win_eventdata_commandLine:*\\AppData\\* OR data_win_eventdata_commandLine:*\\Temp\\*)
    pivot_on:
    - host
    window: 2h
  - name: Executable/DLL/dat payloads dropped into user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Aa]pp[Dd]ata|[Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata)\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Dd][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss])/ AND NOT data_win_eventdata_targetFilename:*ds7002*
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from rundll32/powershell after lure execution
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Rr]undll32|[Pp]ower[Ss]hell)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Run-key / startup persistence set after phishing execution
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ss]tart [Mm]enu\\[Pp]rograms\\[Ss]tartup\\.*/)
    pivot_on:
    - host
    window: 4h
