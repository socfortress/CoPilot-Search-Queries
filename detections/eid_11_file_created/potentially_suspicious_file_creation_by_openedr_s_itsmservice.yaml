name: Potentially Suspicious File Creation by OpenEDR's ITSMService
id: 9e4b7d3a-6f2c-4e9a-8d1b-3c5e7a9f2b4d
version: 1
schema_version: "1.0"
date: "2026-02-19"
author: "@kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e4b7d3a-6f2c-4e9a-8d1b-3c5e7a9f2b4d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of potentially suspicious files by OpenEDR's ITSMService
  process. The ITSMService is responsible for remote management operations and
  can create files on the system through the Process Explorer or file management
  features. While legitimate for IT operations, creation of executable or script
  files could indicate unauthorized file uploads, data staging, or malicious
  file deployment. MITRE ATT&CK: T1105, T1570, T1219.

data_source:
  - Sysmon EventID 11 - File Created

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "11"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\COMODO\\\\Endpoint Manager\\\\ITSMService.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.7z"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bat"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.cmd"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.hta"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.js"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.pif"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ps1"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.rar"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.scr"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbs"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.zip"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\COMODO\Endpoint Manager\ITSMService.exe'; data_win_eventdata_targetFilename
  matches '*.7z'; data_win_eventdata_targetFilename matches '*.bat', among other
  conditions.

known_false_positives: >
  Legitimate OpenEDR file management operations. Authorized remote file uploads
  by IT administrators. Software deployment through OpenEDR console. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://kostas-ts.medium.com/detecting-abuse-of-openedrs-permissive-edr-trial-a-security-researcher-s-perspective-fc55bf53972c
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1570/
  - https://attack.mitre.org/techniques/T1219/

response:
  message: >
    Potentially Suspicious File Creation by OpenEDR's ITSMService detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1105, T1570, T1219
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
    - T1570
    - T1219
  custom_tags:
    - openedr
    - itsmservice
    - file_event
    - sysmon
    - command_and_control
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Cc][Oo][Mm][Oo][Dd][Oo]\\[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Ii][Tt][Ss][Mm][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\.7[Zz]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Oo][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa]/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ii][Ff]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Aa][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f3a9c2d-4e8b-4a7f-9d3e-5c6f8a9b2e1d
    name: OpenEDR Spawning Command Shell
    reason: OpenEDR/ITSM spawning a shell is the execution step that normally follows a pushed file
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Attackers using a hijacked RMM agent often exclude the dropped payload from Defender next
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Registry-level Defender exclusions set after the agent dropped a payload
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Dropped ps1 scripts commonly run as PowerShell download/execution cradles
  - id: 7d604714-e071-49ff-8726-edeb95a70679
    name: Legitimate Application Dropped Script
    reason: Same file-drop pattern for scripts written by legitimate applications, helps judge scope
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands spawned by the Comodo/OpenEDR ITSM service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ii][Tt][Ss][Mm][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ii][Tt][Ss][Mm][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Script hosts and shells launched by the ITSM service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ii][Tt][Ss][Mm][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ii][Tt][Ss][Mm][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: ITSM service outbound connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ii][Tt][Ss][Mm][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ii][Tt][Ss][Mm][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Persistence created after the drop (run keys, services)
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Defender or security tooling tampering following the drop
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/) AND (data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Ss][Ee].*/)
    pivot_on:
    - host
    window: 4h
