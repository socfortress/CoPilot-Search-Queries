name: Potentially Suspicious File Download From ZIP TLD
id: 0bb4bbeb-fe52-4044-b40c-430a04577ebe
version: 1
schema_version: "1.0"
date: "2023-05-18"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0bb4bbeb-fe52-4044-b40c-430a04577ebe
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the download of a file with a potentially suspicious extension from a
  .zip top level domain.

data_source:
  - Sysmon EventID 15 - FileCreateStreamHash

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "15"
        
        - wildcard:
            data_win_eventdata_contents:
              value: "*.zip/*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bat:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dat:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.doc:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.docm:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.hta:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.pptm:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ps1:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.rar:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.rtf:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.sct:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbe:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbs:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ws:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.wsf:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xll:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xls:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xlsm:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.zip:Zone*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contents
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_contents matches
  '*.zip/*'; data_win_eventdata_targetFilename matches '*.bat:Zone*';
  data_win_eventdata_targetFilename matches '*.dat:Zone*', among other
  conditions.

known_false_positives: >
  Legitimate file downloads from a websites and web services that uses the
  ".zip" top level domain. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://twitter.com/cyb3rops/status/1659175181695287297
  - https://fabian-voith.de/2020/06/25/sysmon-v11-1-reads-alternate-data-streams/

response:
  message: >
    Potentially Suspicious File Download From ZIP TLD detected on host
    $agent_name$. Matched data_win_eventdata_contents:
    $data_win_eventdata_contents$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_contents
      type: other
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - download
    - create_stream_hash
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"15" AND data_win_eventdata_contents:/.*\.[Zz][Ii][Pp]\/.*/ AND (data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Aa][Tt]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Mm]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Pp][Tt][Mm]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Aa][Rr]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Tt][Ff]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Tt]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ee]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ss]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ss][Ff]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ll]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss][Mm]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]:[Zz][Oo][Nn][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3109530e-ab47-4cc6-a953-cac5ebcc93ae
    name: ADS Zone.Identifier Deleted By Uncommon Application
    reason: 'Defense-evasion follow-on acting on this exact artifact: the alert recorded the Zone.Identifier (Mark-of-the-Web) stream written onto the downloaded file, and this rule catches that same *:Zone.Identifier ADS being deleted by a non-browser process to strip SmartScreen/Protected-View so the dangerous file runs without warning.'
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: 'Primary execution follow-on for the Office payloads this rule flags (.docm/.xlsm/.pptm/.doc/.xls/.rtf): once the downloaded macro document is opened, Word/Excel/PowerPoint spawns cmd/powershell/wscript or a signed-binary-proxy LOLBin -- the moment delivery turns into code execution.'
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: 'Second Office execution path: the downloaded macro document drops and launches an EXE from the user''s Downloads/AppData directory (T1204.002) -- the Office app running the dropped payload itself rather than a LOLBin.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Execution follow-on for the script payloads this rule flags (.vbs/.vbe/.ws/.wsf/.hta): the downloaded script is run from a user/Temp directory by wscript/cscript/mshta -- the classic GootLoader / malvertising dropper chain that this download initiates.'
  - id: windows-winrar-spawning-shell-001
    name: Windows WinRAR Spawning Shell Application
    reason: 'Execution follow-on for the archive payloads this rule flags (.zip/.rar): opening the downloaded archive in WinRAR spawns a shell, matching CVE-2023-38831 spoofed-extension exploitation where a benign lure sits beside a same-named malicious script inside the archive.'
  - id: af4c4609-5755-42fe-8075-4effb49f5d44
    name: Microsoft Excel Add-In Loaded From Uncommon Location
    reason: 'Execution follow-on for the .xll payload this rule flags: double-clicking the downloaded .xll makes Excel load it as an add-in from the Downloads/uncommon location and run its DllMain (T1204.002).'
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Persistence follow-on tied to the same Downloads folder: the executed payload writes a CurrentVersion\Run key from a binary located in Downloads / Outlook-attachment temp, the standard autorun foothold established right after a phishing/drive-by download.'
  - id: 52182dfb-afb7-41db-b4bc-5336cb29b464
    name: Suspicious File Download From File Sharing Websites -  File Stream
    reason: 'Co-occurring delivery via the same Mark-of-the-Web mechanism (Sysmon EID 15): a sibling detection firing for a dangerous-extension download from an abused file/paste-sharing host, which phishing campaigns commonly stage on the same victim alongside the .zip-TLD lure.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution of a downloaded payload from a user-writable download directory on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Download opener (Office / WinRAR / 7-Zip) spawning a shell or signed-binary-proxy on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Vv][Ii][Ss][Ii][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\7[Zz][Ff][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\7[Zz][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Mark-of-the-Web stripped or download/Office protection disabled on this host
    query: ((data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND data_win_eventdata_targetFilename:/.*:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]/) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ss][Aa][Vv][Ee][Zz][Oo][Nn][Ee][Ii][Nn][Ff][Oo][Rr][Mm][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ll][Oo][Ww][Rr][Ii][Ss][Kk][Ff][Ii][Ll][Ee][Tt][Yy][Pp][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*[Vv][Bb][Aa][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss].*/ OR data_win_eventdata_targetObject:/.*[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt][Ff][Ii][Ll][Ee][Ss][Ii][Nn][Pp][Vv].*/))
    pivot_on:
    - host
    window: 4h
  - name: Run/Startup persistence written by a process in a download or temp directory on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/) AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: Outbound C2 (network or DNS) from a script host or LOLBin on this host
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
