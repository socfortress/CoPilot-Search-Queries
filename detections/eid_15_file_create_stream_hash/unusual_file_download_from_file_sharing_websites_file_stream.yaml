graylog:
  query: data_win_system_eventID:"15" AND (data_win_eventdata_contents:/.*\.[Gg][Ii][Tt][Hh][Uu][Bb][Uu][Ss][Ee][Rr][Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*0[Xx]0\.[Ss][Tt].*/ OR data_win_eventdata_contents:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Bb][Aa][Ss][Hh][Uu][Pp][Ll][Oo][Aa][Dd]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Cc][Dd][Nn]\.[Dd][Ii][Ss][Cc][Oo][Rr][Dd][Aa][Pp][Pp]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Cc][Hh][Uu][Nn][Kk]\.[Ii][Oo].*/ OR data_win_eventdata_contents:/.*[Dd][Dd][Nn][Ss]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_contents:/.*[Dd][Ll]\.[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Uu][Ss][Ee][Rr][Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Gg][Hh][Oo][Ss][Tt][Bb][Ii][Nn]\.[Cc][Oo].*/ OR data_win_eventdata_contents:/.*[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Gg][Ll][Ii][Tt][Cc][Hh]\.[Mm][Ee].*/ OR data_win_eventdata_contents:/.*[Gg][Oo][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_contents:/.*[Hh][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Mm][Ee][Dd][Ii][Aa][Ff][Ii][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_contents:/.*[Oo][Nn][Rr][Ee][Nn][Dd][Ee][Rr]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Pp][Aa][Gg][Ee][Ss]\.[Dd][Ee][Vv].*/ OR data_win_eventdata_contents:/.*[Pp][Aa][Ss][Tt][Ee]\.[Ee][Ee].*/ OR data_win_eventdata_contents:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Pp][Ll].*/ OR data_win_eventdata_contents:/.*[Pp][Aa][Ss][Tt][Ee][Tt][Ee][Xx][Tt]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_contents:/.*[Pp][Ii][Xx][Ee][Ll][Dd][Rr][Aa][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Pp][Rr][Ii][Vv][Aa][Tt][Ll][Aa][Bb]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Pp][Rr][Ii][Vv][Aa][Tt][Ll][Aa][Bb]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_contents:/.*[Ss][Ee][Nn][Dd]\.[Ee][Xx][Pp][Ll][Oo][Ii][Tt]\.[Ii][Nn].*/ OR data_win_eventdata_contents:/.*[Ss][Ee][Nn][Dd][Ss][Pp][Aa][Cc][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee]\.[Gg][Oo][Oo][Gg][Ll][Ee][Aa][Pp][Ii][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Ss][Tt][Oo][Rr][Jj][Ss][Hh][Aa][Rr][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_contents:/.*[Ss][Uu][Pp][Aa][Bb][Aa][Ss][Ee]\.[Cc][Oo].*/ OR data_win_eventdata_contents:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh].*/ OR data_win_eventdata_contents:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_contents:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Uu][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_contents:/.*[Ww]3[Ss][Pp][Aa][Cc][Ee][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_contents:/.*[Ww][Oo][Rr][Kk][Ee][Rr][Ss]\.[Dd][Ee][Vv].*/ OR data_win_eventdata_contents:/.*[Xx]0\.[Aa][Tt].*/) AND (data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1:[Zz][Oo][Nn][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8518ed3d-f7c9-4601-a26c-f361a4256a0c
    name: Suspicious Download From File-Sharing Website Via Bitsadmin
    reason: 'Download vector that produces exactly this telemetry: bitsadmin pulls from these same sharing domains, and BITS is one of the few mechanisms that writes a full Zone.Identifier with HostUrl/ReferrerUrl - so a bitsadmin hit on the same host is very likely the process that fetched the MotW-marked script this rule flagged.'
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: 'The dominant download cradle for these domains seen from the process-creation angle: PowerShell fetching from the same file-sharing sites is either the precursor pull that dropped the script or the stage-2 pull triggered by the downloaded .ps1/.bat, i.e. how the flagged file reached the host.'
  - id: 52182dfb-afb7-41db-b4bc-5336cb29b464
    name: Suspicious File Download From File Sharing Websites -  File Stream
    reason: 'Twin detection: identical EID 15 Zone.Identifier logic and the same file-sharing domain list, but matching downloaded binaries (.exe/.dll/.hta/.lnk/.vbs/.cpl/.xll) instead of this rule''s .bat/.cmd/.ps1 - firing together on one host means the same actor pulled multiple payload types from the same sharing infrastructure.'
  - id: 5947497f-1aa4-41dd-9693-c9848d58727d
    name: Suspicious Unblock-File
    reason: 'Direct follow-on against the very artifact this rule saw: PowerShell Unblock-File removes the Zone.Identifier (Mark-of-the-Web) from the downloaded path so the .ps1/.bat runs without SmartScreen or execution-policy prompts - the step that converts the flagged download into a runnable payload.'
  - id: 3109530e-ab47-4cc6-a953-cac5ebcc93ae
    name: ADS Zone.Identifier Deleted By Uncommon Application
    reason: 'Same Mark-of-the-Web laundering by a different mechanism: a non-browser process deleting the :Zone.Identifier stream (EID 23/26) on the downloaded file, erasing the internet-origin mark this rule detected so the script loses its zone warning before it is executed.'
  - id: 1228c958-e64e-4e71-92ad-7d429f4138ba
    name: Script Interpreter Execution From Suspicious Folder
    reason: 'The payoff execution: cmd/powershell/wscript/cscript running a script (or with -ep bypass / -w hidden) from Temp/AppData/Public - exactly where a file-sharing download lands - i.e. the downloaded .bat/.cmd/.ps1 this rule flagged actually being run.'
  - id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    reason: 'Enables the downloaded .ps1 to run: setting the PowerShell ExecutionPolicy to bypass signing from the command line is the standard precursor to executing an unsigned script pulled from an untrusted sharing site.'
  - id: e0f8ab85-0ac9-423b-a73a-81b3c7b1aa97
    name: Network Communication Initiated To File Sharing Domains From Process Located In Suspicious Folder
    reason: 'Network-layer confirmation and stage-2/C2: a process in a user-writable folder beaconing back to the same class of file-sharing domains - the executed download reaching out for its next stage, corroborating the drop this rule caught.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Downloaded script (.bat/.cmd/.ps1) executed by an interpreter on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Mm][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Mark-of-the-Web stripped from the downloaded file on this host
    query: ((data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND data_win_eventdata_targetFilename:/.*:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Uu][Nn][Bb][Ll][Oo][Cc][Kk]-[Ff][Ii][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: LOLBin / cmdlet ingress tool transfer on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups to abused file-sharing / tunneling delivery domains from this host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Dd][Ii][Ss][Cc][Oo][Rr][Dd][Aa][Pp][Pp]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_queryName:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Gg][Oo][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Ww][Oo][Rr][Kk][Ee][Rr][Ss]\.[Dd][Ee][Vv].*/ OR data_win_eventdata_queryName:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh].*/ OR data_win_eventdata_queryName:/.*[Pp][Aa][Ss][Tt][Ee]\.[Ee][Ee].*/ OR data_win_eventdata_queryName:/.*[Bb][Aa][Ss][Hh][Uu][Pp][Ll][Oo][Aa][Dd]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Pp][Ii][Xx][Ee][Ll][Dd][Rr][Aa][Ii][Nn]\.[Cc][Oo][Mm].*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence via scheduled task or Run-key autostart on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/))
    pivot_on:
    - host
    window: 4h
