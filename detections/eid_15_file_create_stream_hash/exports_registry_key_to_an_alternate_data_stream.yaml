name: Exports Registry Key To an Alternate Data Stream
id: 0d7a9363-af70-4e7b-a3b7-1a176b7fbe84
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Oddvar Moe, Sander Wiebing, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0d7a9363-af70-4e7b-a3b7-1a176b7fbe84
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Exports the target Registry key and hides it in the specified alternate data
  stream. MITRE ATT&CK: T1564.004.

data_source:
  - Sysmon EventID 15 - FileCreateStreamHash

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "15"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\regedit.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\regedit.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Regedit/
  - https://gist.github.com/api0cradle/cdd2d0d0ec9abb686f0e89306e277b8f
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Exports Registry Key To an Alternate Data Stream detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$. MITRE ATT&CK: T1564.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - exports
    - registry
    - alternate
    - create_stream_hash
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"15" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0b80ade5-6997-4b1d-99a1-71701778ea61
    name: Imports Registry Key From an ADS
    reason: 'Direct reverse of this exact action: same regedit + ADS, reading the hidden registry payload back in (regedit /i file:stream). The hide-then-reapply cycle completes here, often minutes to hours after the export.'
  - id: 77946e79-97f1-45a2-84b4-f37b5c0d8682
    name: Suspicious Registry Modification From ADS Via Regini.EXE
    reason: Sibling LOLBin that reads registry data straight out of an alternate data stream; the attacker's alternate tool for applying the key they just stashed, so it is the other likely follow-on to the ADS export.
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: The retrieval/execution side of the same ADS stash. Its own logic treats 'regedit /E' as an ADS-write primitive, so it watches the identical technique and catches a payload being pulled or run out of a stream on this host.
  - id: b69888d4-380c-45ce-9cf9-d9ce46e67821
    name: Hidden Executable In NTFS Alternate Data Stream
    reason: 'Same EventID 15 sensor on the same host: a PE hidden in an ADS (non-zero Imphash). Fires when the host is being used to stash executable payloads in streams, not just one registry key - the broader stealth-staging picture.'
  - id: 573df571-a223-43bc-846e-3f98da481eca
    name: Creation Of a Suspicious ADS File Outside a Browser Download
    reason: Same EventID 15 sensor catching non-browser ADS files (including .reg) written to the stream. Corroborates ongoing alternate-data-stream stashing on this host from a different angle than the regedit-specific match.
  - id: a699b30e-d010-46c8-bbd1-ee2e26765fe9
    name: Powershell Store File In Alternate Data Stream
    reason: Same T1564.004 ADS-hiding goal carried out with PowerShell (Astaroth-style). If PowerShell also fired on this host, it shows the actor's ADS tradecraft spans tools and the regedit export is one step of a wider hide operation.
  - id: 82880171-b475-4201-b811-e9c826cd5eaa
    name: Exports Critical Registry Keys To a File
    reason: Same actor intent - regedit dumping the registry, specifically SAM/SYSTEM/SECURITY - in its non-stealth form. If the hidden ADS held a credential hive, this is the precursor or sibling to hunt for on the same host, tying the stealth export to credential theft.
  - id: windows-modify-registry-regedit-silent-import-001
    name: Windows Modify Registry Regedit Silent Reg Import
    reason: 'Plausible next step: regedit /s silently applying a .reg payload (possibly the one just hidden in the ADS) with no user prompt - the quiet counterpart to this stealth export, and classic Azorult-style registry tradecraft.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hidden registry payload re-applied via regedit/regini/reg on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ii][Nn][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[SsIi] .*/ OR data_win_eventdata_commandLine:/.* [Ii][Mm][Pp][Oo][Rr][Tt] .*/ OR data_win_eventdata_commandLine:/.*(:[^ \\]).*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other non-Mark-of-the-Web ADS streams created on this host
    query: data_win_system_eventID:"15" AND data_win_eventdata_targetFilename:/.*:[^ \\].*/ AND NOT (data_win_eventdata_targetFilename:/.*:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]/)
    pivot_on:
    - host
    window: 4h
  - name: Process image launched directly from an alternate data stream on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\..*:[^ \\].*/
    pivot_on:
    - host
    window: 2h
  - name: Credential registry hive (SAM/SECURITY/SYSTEM) export or save on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Aa][Mm].*/ OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* [Ss][Aa][Vv][Ee] .*/))
    pivot_on:
    - host
    window: 2h
  - name: Registry LOLBins spawned by a script host or Office app on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ii][Nn][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
