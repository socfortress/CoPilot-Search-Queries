name: Hidden Executable In NTFS Alternate Data Stream
id: b69888d4-380c-45ce-9cf9-d9ce46e67821
version: 1
schema_version: "1.0"
date: "2023-02-10"
author: Florian Roth (Nextron Systems), @0xrawsec
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b69888d4-380c-45ce-9cf9-d9ce46e67821
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of an ADS (Alternate Data Stream) that contains an
  executable by looking at a non-empty Imphash. MITRE ATT&CK: T1564.004.

data_source:
  - Sysmon EventID 15 - FileCreateStreamHash

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "15"
        
        - wildcard:
            data_win_eventdata_hash:
              value: "*IMPHASH=*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_hash"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_hash:
                    value: "*IMPHASH=00000000000000000000000000000000*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_hash
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_hash matches '*IMPHASH=*';
  data_win_eventdata_hash matches '*IMPHASH=00000000000000000000000000000000*'.

known_false_positives: >
  This rule isn't looking for any particular binary characteristics. As
  legitimate installers and programs were seen embedding hidden binaries in
  their ADS. Some false positives are expected from browser processes and
  similar. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0xrawsec/status/1002478725605273600?s=21
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Hidden Executable In NTFS Alternate Data Stream detected on host
    $agent_name$. Matched data_win_eventdata_hash: $data_win_eventdata_hash$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1564.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_hash
      type: file_hash
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - hidden
    - executable
    - alternate
    - create_stream_hash
    - sysmon
    - stealth
    - s0139
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"15" AND data_win_eventdata_hash:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=.*/ AND _exists_:data_win_eventdata_hash AND NOT (data_win_eventdata_hash:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=00000000000000000000000000000000.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-alternate-datastream-process-execution-001
    name: Windows Alternate DataStream - Process Execution
    reason: 'The direct follow-on: a LOLBin (wmic/forfiles/rundll32/regsvr32/mshta/cscript/wscript/bitsadmin) launching a file straight out of an ADS via the file.ext:stream colon syntax. This is the hidden PE this rule just saw staged actually being executed on the same host.'
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: 'Watches the ADS staging/retrieval primitives (type > txt:stream, makecab/.cab, reg/regedit export, esentutl /y /d /o) that push a payload into or pull it back out of a txt: stream; the command-line counterpart to this FileCreateStreamHash event, showing how the executable was written and is being retrieved on the same host.'
  - id: 45a594aa-1fbd-4972-a809-ff5a99dd81b8
    name: Run PowerShell Script from ADS
    reason: PowerShell-native execution-from-ADS via Get-Content -Stream. If the stashed stream holds a script stager rather than a bare PE, this is how it runs; a high-severity follow-on on the same host meaning the hidden stream is being read back and executed.
  - id: 573df571-a223-43bc-846e-3f98da481eca
    name: Creation Of a Suspicious ADS File Outside a Browser Download
    reason: Same EventID 15 FileCreateStreamHash sensor catching dangerous-extension ADS files written by a non-browser process; corroborates that this host is actively being used to stash payloads in alternate streams beyond this one non-zero-Imphash hit.
  - id: 0d7a9363-af70-4e7b-a3b7-1a176b7fbe84
    name: Exports Registry Key To an Alternate Data Stream
    reason: Same EventID 15 sensor, regedit hiding a registry key in an ADS. Shows the actor's ADS-hiding tradecraft on this host spans artifact types (PE and registry); this rule is listed reciprocally in its block as part of the same stealth-staging picture.
  - id: a699b30e-d010-46c8-bbd1-ee2e26765fe9
    name: Powershell Store File In Alternate Data Stream
    reason: 'A write mechanism: Astaroth-style PowerShell storing a file into an ADS. A likely precursor explaining how the executable reached the stream this rule flagged, on the same host and user.'
  - id: 4b13db67-0c45-40f1-aba8-66a1a7198a1e
    name: Suspicious Extrac32 Alternate Data Stream Execution
    reason: 'Precursor write primitive: the extrac32 LOLBin extracting a cab payload directly into an ADS, a documented way to plant the hidden executable this rule detects without a plain file ever touching disk visibly.'
  - id: 6b369ced-4b1d-48f1-b427-fdc0de0790bd
    name: Suspicious Diantz Alternate Data Stream Execution
    reason: 'Precursor write primitive: the diantz LOLBin compressing a file into an ADS cab stream, the compress-into-stream counterpart to extrac32 for staging the concealed payload on the same host.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process image launched directly from an alternate data stream on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\..*:[^ \\].*/
    pivot_on:
    - host
    window: 4h
  - name: ADS-capable LOLBin invoking a stream payload on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\..*:[^ \\].*/
    pivot_on:
    - host
    window: 4h
  - name: ADS staging / payload movement primitives on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*\..*:[^ \\].*/ AND (data_win_eventdata_commandLine:/.*[Mm][Aa][Kk][Ee][Cc][Aa][Bb].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Aa][Nn][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Tt][Rr][Aa][Cc]32.*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/ OR data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee] .*/)) OR (data_win_eventdata_commandLine:/.*-[Ss][Tt][Rr][Ee][Aa][Mm].*/ AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Other non-Mark-of-the-Web alternate data streams created on this host
    query: data_win_system_eventID:"15" AND data_win_eventdata_targetFilename:/.*:[^ \\].*/ AND NOT (data_win_eventdata_targetFilename:/.*:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]/)
    pivot_on:
    - host
    window: 4h
  - name: Autostart persistence value pointing at an alternate data stream on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/) AND data_win_eventdata_details:/.*\..*:[^ \\].*/
    pivot_on:
    - host
    window: 4h
