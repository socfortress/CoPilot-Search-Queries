name: Unusual File Download from Direct IP Address
id: 025bd229-fd1f-4fdb-97ab-20006e1a5368
version: 1
schema_version: "1.0"
date: "2023-02-10"
author: Nasreddine Bencherchali (Nextron Systems), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 025bd229-fd1f-4fdb-97ab-20006e1a5368
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the download of suspicious file type from URLs with IP. MITRE ATT&CK:
  T1564.004.

data_source:
  - Sysmon EventID 15 - FileCreateStreamHash

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "15"
        
        - regexp:
            data_win_eventdata_contents: ".*(http[s]?://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}).*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ps1:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bat:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbe:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vbs:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dll:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.one:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.cmd:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.hta:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xll:Zone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.lnk:Zone*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contents
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_contents matches the regex
  /.*(http[s]?://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/;
  data_win_eventdata_targetFilename matches '*.ps1:Zone*';
  data_win_eventdata_targetFilename matches '*.bat:Zone*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/trustedsec/SysmonCommunityGuide/blob/adcdfee20999f422b974c8d4149bf4c361237db7/chapters/file-stream-creation-hash.md
  - https://labs.withsecure.com/publications/detecting-onenote-abuse
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Unusual File Download from Direct IP Address detected on host $agent_name$.
    Matched data_win_eventdata_contents: $data_win_eventdata_contents$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1564.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_contents
      type: other
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - unusual
    - download
    - direct
    - create_stream_hash
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"15" AND data_win_eventdata_contents:/.*(http[s]?:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/ AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ee]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Oo][Nn][Ee]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ll]:[Zz][Oo][Nn][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Ll][Nn][Kk]:[Zz][Oo][Nn][Ee].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
