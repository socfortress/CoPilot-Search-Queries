name: Suspicious File Download From File Sharing Websites -  File Stream
id: 52182dfb-afb7-41db-b4bc-5336cb29b464
version: 1
schema_version: "1.0"
date: "2026-03-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 52182dfb-afb7-41db-b4bc-5336cb29b464
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the download of suspicious file type from a well-known file and paste
  sharing domain. MITRE ATT&CK: T1564.004.

data_source:
  - Sysmon EventID 15 - FileCreateStreamHash

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "15"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*.githubusercontent.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*0x0.st*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*anonfiles.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*bashupload.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*cdn.discordapp.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*chunk.io*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*ddns.net*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*dl.dropboxusercontent.com*"
                    case_insensitive: true
