                    value: "*temp.sh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*transfer.sh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*trycloudflare.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*ufile.io*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*w3spaces.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*workers.dev*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*x0.at*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.cpl:Zone*"
                    case_insensitive: true
              - wildcard:
