correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ae02ed70-11aa-4a22-b397-c0d0e8f6ea99
    name: Unusual File Download From File Sharing Websites - File Stream
    reason: Same Sysmon EID 15 Mark-of-the-Web detection against the identical file-sharing domain list, but matching dropped script payloads (.bat/.cmd/.ps1); a hit on the same host means the same download wave staged a script alongside or instead of the executable this rule flags.
  - id: 025bd229-fd1f-4fdb-97ab-20006e1a5368
    name: Unusual File Download from Direct IP Address
    reason: Sibling MOTW download detection where the Zone.Identifier records a raw IP host rather than a named site; the same actor commonly stages payloads from both, so an IP-sourced dangerous download on this host in the window is the same delivery behaviour.
  - id: 0bb4bbeb-fe52-4044-b40c-430a04577ebe
    name: Potentially Suspicious File Download From ZIP TLD
    reason: Sibling MOTW download detection firing on the high-risk .zip TLD; another dangerous-file download marked by Mark-of-the-Web on the same host points to one coordinated delivery attempt.
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: The same file-sharing download carried out by a PowerShell cradle instead of a browser - a parallel/precursor ingress vector; browser-dropped payloads are routinely chained with PowerShell second-stage pulls from these very domains.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Immediate execution follow-on: the dropped .hta/.vbs/.vbe runs from the user''s Downloads/Temp directory via mshta/wscript/cscript - the exact handlers for the script extensions this rule marks with MOTW.'
  - id: 089fc3d2-71e8-4763-a8a5-c97fbb0a403e
    name: Regsvr32 DLL Execution With Suspicious File Extension
    reason: 'Execution follow-on for the .dll payload this rule flags: a just-downloaded DLL masquerading as another extension is loaded via regsvr32 to run the second stage.'
  - id: 84b1706c-932a-44c4-ae28-892b28a25b94
    name: OneNote.EXE Execution of Malicious Embedded Scripts
    reason: 'Execution follow-on for the .one payload this rule flags: the downloaded OneNote file is opened and onenote.exe exports and runs its embedded script from a user directory.'
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Persistence follow-on: a Run-key entry pointing at a binary in Downloads/Temp/Outlook-attachments - the just-downloaded payload establishing autostart on the same host after it executes.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dropped payload executed via its native handler from a download/temp path on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Oo][Ll][Kk]\\[Aa][Tt][Tt][Aa][Cc][Hh][Mm][Ee][Nn][Tt][Ss]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Ingress / second-stage download via LOLBins or a PowerShell cradle on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/)
    pivot_on:
    - host
