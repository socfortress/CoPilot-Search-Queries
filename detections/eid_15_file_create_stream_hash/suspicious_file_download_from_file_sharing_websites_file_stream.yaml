                    value: "*github.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*glitch.me*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contents:
                    value: "*gofile.io*"
                    case_insensitive: true
              - wildcard:
