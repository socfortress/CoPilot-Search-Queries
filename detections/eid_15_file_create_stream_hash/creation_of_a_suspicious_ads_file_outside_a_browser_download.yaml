name: Creation Of a Suspicious ADS File Outside a Browser Download
id: 573df571-a223-43bc-846e-3f98da481eca
version: 1
schema_version: "1.0"
date: "2023-06-12"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 573df571-a223-43bc-846e-3f98da481eca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a suspicious ADS (Alternate Data Stream) file by
  software other than browsers.

data_source:
  - Sysmon EventID 15 - FileCreateStreamHash

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "15"
        
        - wildcard:
            data_win_eventdata_contents:
              value: "[ZoneTransfer]  ZoneId=3*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*:Zone.Identifier"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.scr*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.cmd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.docx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.hta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.jse*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.lnk*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.pptx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.ps*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.reg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.sct*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.vb*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.wsc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.wsf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.xlsx*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\brave.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Mozilla Firefox\\firefox.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Mozilla Firefox\\firefox.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Internet Explorer\\iexplore.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Internet Explorer\\iexplore.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\maxthon.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeWebView\\\\Application\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WindowsApps\\\\MicrosoftEdge.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeCore\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Microsoft\\\\EdgeCore\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\msedge.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\msedgewebview2.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\opera.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\safari.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\seamonkey.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\vivaldi.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\whale.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\WindowsApps\\\\Microsoft.ScreenSketch_*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\SnippingTool\\\\SnippingTool.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\AppData\\\\Local\\\\Packages\\\\Microsoft.ScreenSketch_*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*\\\\TempState\\\\Screenshot *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetFilename:
                                value: "*.png:Zone.Identifier"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contents
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_contents matches
  '[ZoneTransfer] ZoneId=3*'; data_win_eventdata_targetFilename matches
  '*:Zone.Identifier'; data_win_eventdata_targetFilename matches '*.exe*', among
  other conditions.

known_false_positives: >
  Other legitimate browsers not currently included in the filter (please add
  them). Legitimate downloads via scripting or command-line tools (Investigate
  to determine if it's legitimate). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.bleepingcomputer.com/news/security/exploited-windows-zero-day-lets-javascript-files-bypass-security-warnings/

response:
  message: >
    Creation Of a Suspicious ADS File Outside a Browser Download detected on
    host $agent_name$. Matched data_win_eventdata_contents:
    $data_win_eventdata_contents$. Matched data_win_eventdata_targetFilename:
    $data_win_eventdata_targetFilename$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_contents
      type: other
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - outside
    - browser
    - download
    - create_stream_hash
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"15" AND data_win_eventdata_contents:/\[[Zz][Oo][Nn][Ee][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\]  [Zz][Oo][Nn][Ee][Ii][Dd]=3.*/ AND data_win_eventdata_targetFilename:/.*:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]/ AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr].*/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Ll][Nn][Kk].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Pp][Tt][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Ee][Gg].*/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Tt].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb].*/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ss][Cc].*/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ss][Ff].*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss][Xx].*/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Aa][Xx][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Ww][Ee][Bb][Vv][Ii][Ee][Ww]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Cc][Oo][Rr][Ee]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Cc][Oo][Rr][Ee]\\.*/) AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee][Ww][Ee][Bb][Vv][Ii][Ee][Ww]2\.[Ee][Xx][Ee]/)) OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Aa][Ff][Aa][Rr][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ee][Aa][Mm][Oo][Nn][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Aa][Ll][Ee]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ss][Cc][Rr][Ee][Ee][Nn][Ss][Kk][Ee][Tt][Cc][Hh]_.*/ AND data_win_eventdata_image:/.*\\[Ss][Nn][Ii][Pp][Pp][Ii][Nn][Gg][Tt][Oo][Oo][Ll]\\[Ss][Nn][Ii][Pp][Pp][Ii][Nn][Gg][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ss][Cc][Rr][Ee][Ee][Nn][Ss][Kk][Ee][Tt][Cc][Hh]_.*/ AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp][Ss][Tt][Aa][Tt][Ee]\\[Ss][Cc][Rr][Ee][Ee][Nn][Ss][Hh][Oo][Tt] .*/ AND data_win_eventdata_targetFilename:/.*\.[Pp][Nn][Gg]:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: The ADS-tainted set includes .hta/.js/.jse/.vbs/.wsf/.wsc/.sct/.ps1; the imminent next step after such a MotW-marked script lands is wscript/cscript/mshta running it from a user directory - this catches that payload executing on the same host.
  - id: cc7abbd0-762b-41e3-8a26-57ad50d2eea3
    name: MSHTA Execution with Suspicious File Extensions
    reason: 'Direct follow-on for the .hta branch and polyglots: mshta.exe executing the dropped payload hidden under a misleading extension (T1218.005) - the exact execution of what this rule just saw written with Mark-of-the-Web.'
  - id: 3109530e-ab47-4cc6-a953-cac5ebcc93ae
    name: ADS Zone.Identifier Deleted By Uncommon Application
    reason: 'Evasion counterpart on the very same ADS: after dropping the MotW-marked payload an attacker strips the Zone.Identifier with an uncommon process to defeat SmartScreen/Office MotW enforcement before launching it.'
  - id: fabb0e80-030c-4e3e-a104-d09676991ac3
    name: Suspicious File Created in Outlook Temporary Directory
    reason: 'Delivery precursor: Outlook saving a dangerous attachment to its temp dir is a prime way a non-browser process writes MotW onto an exe/script, identifying spear-phishing attachment (T1566.001) as the vector that produced this ADS write.'
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: 'Ties delivery to execution: the saved attachment runs straight from Outlook''s temp folder, confirming the phishing payload this rule flagged is now executing on the same host.'
  - id: 0bb4bbeb-fe52-4044-b40c-430a04577ebe
    name: Potentially Suspicious File Download From ZIP TLD
    reason: Sibling on the same EID 15 FileCreateStreamHash telemetry reading the same Zone.Identifier contents - corroborates that the MotW referrer URL for this file points at a suspicious .zip top-level-domain source.
  - id: 025bd229-fd1f-4fdb-97ab-20006e1a5368
    name: Unusual File Download from Direct IP Address
    reason: Sibling on the same EID 15 ADS contents - corroborates a bare direct-IP download source (no domain) in the MotW referrer, a strong malicious-download indicator for the dropped dangerous file.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: 'Follow-on for the .lnk branch of the trigger set: a downloaded malicious shortcut launching its next stage from a remote WebDAV share after landing with Mark-of-the-Web.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script host / LOLBin executing a payload from a user-writable path on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)) OR (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.[Ss][Cc][Rr]/))
    pivot_on:
    - host
    window: 1h
  - name: Outbound C2 connection from a script host or LOLBin on this host
