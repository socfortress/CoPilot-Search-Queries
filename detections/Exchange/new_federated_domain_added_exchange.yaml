name: New Federated Domain Added - Exchange
id: 42127bdd-9133-474f-a6f1-97b6c08a4339
version: 1
schema_version: "1.0"
date: "2022-02-08"
author: Splunk Threat Research Team (original rule), '@ionsor (rule)'
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 42127bdd-9133-474f-a6f1-97b6c08a4339
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects the addition of a new Federated Domain. MITRE ATT&CK: T1136.003.
data_source:
  - Office 365 Management Activity API
  - "Workload: Exchange"
workload: Exchange
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'Exchange'; data_office365_eventName
  equals 'Add-FederatedDomain'; data_office365_status equals 'success'.
known_false_positives: >
  The creation of a new Federated domain is not necessarily malicious, however
  these events need to be followed closely, as it may indicate federated
  credential abuse or backdoor via federated identities at a similar or
  different cloud provider. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.
references:
  - https://www.fireeye.com/content/dam/fireeye-www/blog/pdfs/wp-m-unc2452-2021-000343-01.pdf
  - https://us-cert.cisa.gov/ncas/alerts/aa21-008a
  - https://www.splunk.com/en_us/blog/security/a-golden-saml-journey-solarwinds-continued.html
  - https://www.sygnia.co/golden-saml-advisory
  - https://o365blog.com/post/aadbackdoor/
  - https://attack.mitre.org/techniques/T1136/003/
response:
  message: >
    New Federated Domain Added - Exchange detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$. MITRE ATT&CK: T1136.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1136.003
  custom_tags:
    - federated
    - domain
    - added
    - o365
    - exchange
    - persistence
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee]/ AND data_office365_eventName:/[Aa][Dd][Dd]-[Ff][Ee][Dd][Ee][Rr][Aa][Tt][Ee][Dd][Dd][Oo][Mm][Aa][Ii][Nn]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 58f88172-a73d-442b-94c9-95eaed3cbb36
    name: New Federated Domain Added
    reason: Same Add-FederatedDomain action logged from the AzureActiveDirectory audit workload instead of Exchange; firing together on the same admin confirms a genuine federation-trust change (the Golden-SAML / AAD-backdoor setup) rather than a single-workload parsing artifact.
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: 'Same AAD-backdoor playbook on the same compromised admin: the actor disables Strong Authentication to cement the federation persistence, usually within the same operator session as the domain change.'
  - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
    name: Azure Login Bypassing Conditional Access Policies
    reason: The federation backdoor exists to forge/steal tokens that bypass Conditional Access and MFA; a CA-bypassing login by the same admin is the forged-token session that issues or immediately follows the Add-FederatedDomain change.
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: Defender flags the acting admin's sign-in as risky — direct evidence the Global-Admin account that ran Add-FederatedDomain is taken over, which is the prerequisite for this federation-management action.
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: An impossible-travel sign-in on the same admin around the change is the account-takeover signal that explains who actually issued the federation cmdlet, separating a hijacked session from legitimate administration.
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: The admin operated from a Tor/anonymizer proxy on the same user, consistent with a remote operator establishing the federation backdoor rather than in-tenant administration from a known location.
  - id: ee111937-1fe7-40f0-962a-0eb44d57d174
    name: Suspicious OAuth App File Download Activities
    reason: 'Companion persistence+exfil vector the same actors plant alongside federation trust (UNC2452 pattern): a rogue OAuth app pulling SharePoint/OneDrive files from the tenant the forged tokens now let them impersonate into.'
  - id: 6897cd82-6664-11ed-9022-0242ac120002
    name: PST Export Alert Using New-ComplianceSearchAction
    reason: Classic data-theft follow-on once Golden SAML grants impersonation of any mailbox — tenant-wide mail export via compliance search is the payoff of the federation backdoor and often runs hours after the trust is added.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Federation / domain-trust modifications by this admin
    query: (data_office365_Operation:/.*[Ff][Ee][Dd][Ee][Rr][Aa][Tt].*/ OR data_office365_eventName:/.*[Ff][Ee][Dd][Ee][Rr][Aa][Tt].*/ OR data_office365_Operation:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Uu][Pp][Dd][Aa][Tt][Ee] [Dd][Oo][Mm][Aa][Ii][Nn].*/)
    pivot_on:
    - user
    window: 24h
  - name: Privileged role, service-principal and app-consent backdoors by this admin
    query: (data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll] [Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt].*/)
    pivot_on:
    - user
    window: 24h
  - name: Risky sign-in telemetry for the acting admin (account-takeover check)
    query: (data_office365_eventName:/.*[Rr][Ii][Ss][Kk][Yy] [Ii][Pp].*/ OR data_office365_eventName:/.*[Ii][Mm][Pp][Oo][Ss][Ss][Ii][Bb][Ll][Ee] [Tt][Rr][Aa][Vv][Ee][Ll].*/ OR data_office365_eventName:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ii][Pp].*/ OR data_office365_eventName:/.*[Ii][Nn][Ff][Rr][Ee][Qq][Uu][Ee][Nn][Tt] [Cc][Oo][Uu][Nn][Tt][Rr][Yy].*/)
    pivot_on:
    - user
    window: 6h
  - name: Mailbox export / compliance-search mail collection by this admin
    query: (data_office365_Operation:/.*[Nn][Ee][Ww]-[Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Ss][Ee][Aa][Rr][Cc][Hh].*/ OR data_office365_Payload:/.*[Nn][Ee][Ww]-[Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Ss][Ee][Aa][Rr][Cc][Hh][Aa][Cc][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ee][Xx][Pp][Oo][Rr][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_office365_Operation:/.*[Mm][Aa][Ii][Ll][Ii][Tt][Ee][Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd].*/)
    pivot_on:
    - user
    window: 24h
