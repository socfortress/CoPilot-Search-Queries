name: M365 Mass Email Deletion - Evidence Wipe
id: M365_Mass_Email_Deletion_Evidence_Wipe
version: 1
schema_version: "1.0"
date: "2026-07-02"
author: SOCFortress LLC
status: production
type: aggregation
description: >
  Detects a single user deleting an unusually high volume of email messages
  within a short time window, excluding routine cleanup of the Deleted Items
  and Junk folders. Bulk deletion from the Inbox, Sent Items, or Drafts is a
  common anti-forensics and evidence-destruction technique following a business
  email compromise or account takeover, where an attacker removes traces of
  phishing replies, fraudulent messages, or forwarded mail. Covers both
  SoftDelete (moved to recoverable items) and HardDelete (permanent purge).
  MITRE ATT&CK: T1070.008 (Indicator Removal: Clear Mailbox Data), T1114 (Email Collection).
data_source:
  - Office 365 Management Activity API
  - "Workload: Exchange"
workload: Exchange
how_to_implement: >
  Requires the Office 365 audit log ingestion pipeline feeding Graylog via the
  O365 Management Activity API, with Exchange mailbox auditing enabled so
  SoftDelete and HardDelete operations (RecordType 3, ExchangeItemGroup) are
  recorded. This is an aggregation detection: the base graylog.query isolates
  delete events and excludes deletions originating from Deleted Items and Junk
  folders, and the aggregation block counts them per user over the window.
  Note: data_office365_Folder_Path is localized per tenant language (e.g.
  "Deleted Items", "Itens Excluidos", "Elementos eliminados", "Correo no deseado",
  "Junk Email", "Lixo Eletronico"); the exclusion regex covers English, Portuguese,
  and Spanish variants and may need additional folder names added for tenants in
  other locales. Each delete event carries a single message in
  data_office365_AffectedItems, so event count is a close proxy for messages
  deleted. O365 CreationTime arrives with a malformed timezone offset (+0000) and
  is replaced at ingest, so windowing keys off Graylog's own timestamp rather than
  data_office365_CreationTime. Confirmed against live AGTNetworks tenant data.
known_false_positives: >
  Users performing legitimate bulk cleanup of their Inbox (mass-selecting and
  deleting old mail, newsletter purges, mailbox archiving) can trigger this.
  Automated mailbox rules and retention/cleanup tooling may also delete in bulk.
  Emptying the Deleted Items or Junk folder is already excluded. Tune the
  threshold per tenant and consider excluding known automation/service accounts.
references:
  - https://attack.mitre.org/techniques/T1070/008/
  - https://attack.mitre.org/techniques/T1114/
response:
  message: >
    Mass email deletion detected: $data_office365_UserId$ deleted a high volume
    of messages (excluding Deleted Items/Junk cleanup) within the aggregation
    window. Source IP: $data_office365_ClientIP$ ($data_office365_ClientIP_country_code$).
    Possible evidence wipe following account compromise. MITRE ATT&CK: T1070.008
  risk_score: 70
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 70
  threat_objects:
    - field: data_office365_ClientIP
      type: ip_address
    - field: data_office365_Folder_Path
      type: folder
tags:
  analytic_story:
    - Office 365 Anti-Forensics
    - Business Email Compromise
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1070.008
    - T1114
  custom_tags:
    - o365
    - exchange
    - mail_deletion
    - anti_forensics
    - evidence_wipe
    - aggregation
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:("SoftDelete" OR "HardDelete") AND NOT data_office365_Folder_Path:/.*([dD]eleted [iI]tems|[jJ]unk [eE]mail|[iI]tens [eE]xclu.dos|[eE]lementos eliminados|[cC]orreo no deseado|[lL]ixo [eE]letr.nico).*/
aggregation:
  enabled: true
  function: count
  field: null
  group_by:
    - data_office365_UserId
  window: 10m
  threshold: 30
  condition: ">"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: 'Tightest behavioural pairing on the same mailbox: BEC attackers first create an inbox rule to move replies/NDRs to Deleted Items or mark-as-read, then bulk-delete the thread. A New-InboxRule by this user just before the wipe shows the hide-then-delete tradecraft, not a user housekeeping their inbox.'
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: 'Set-Mailbox forwarding siphons a copy of the mail to an attacker address before the local copies are destroyed. Forwarding + mass deletion on the same mailbox is collect-then-wipe: the attacker keeps the stream while erasing the victim''s record of it.'
  - id: ff246f56-7f24-402a-baca-b86540e3925c
    name: Microsoft 365 - User Restricted from Sending Email
    reason: 'Direct corroboration of the outbound abuse being erased: the account sent enough spam/phishing that Microsoft throttled it. When this fires on the same user, the mass deletion is almost certainly wiping the Sent Items evidence of that outbound campaign.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: The canonical account-takeover signal. If the same user has an impossible-travel sign-in in the window, it places the compromise this deletion is covering up and turns a 'bulk cleanup' false positive into a confirmed ATO.
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'Establishes a hands-on-keyboard adversary: the destructive session was driven from Tor/VPN/anonymiser infrastructure. Same user/IP anonymisation around the deletion is strong evidence of deliberate anti-forensics rather than a user clearing mail.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: Threat-intel-flagged malicious sign-in source for the account. A risky-IP logon for this user corroborates that the mailbox was accessed by an attacker and gives the ClientIP to pivot the rest of the incident on.
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: 'Persistence step in the takeover (T1556): weaken auth to keep access, then operate. MFA disable for this user shortly before the wipe fits the compromise-persist-then-clean-up sequence and raises confidence the account is attacker-controlled.'
  - id: 0f2468a2-5055-4212-a368-7321198ee706
    name: Activity from Infrequent Country
    reason: Geo-baseline anomaly distinct from impossible-travel (first-seen country vs velocity). A sign-in from a country this user never operates from, in the same window, is independent corroboration of the account takeover behind the deletion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Inbox and transport rule changes by this user
    query: data_office365_Operation:("New-InboxRule" OR "Set-InboxRule" OR "UpdateInboxRules" OR "Remove-InboxRule" OR "Disable-InboxRule" OR "New-TransportRule" OR "Set-TransportRule")
    pivot_on:
    - user
    window: 6h
  - name: Mailbox forwarding, delegation and permission grants by this user
    query: data_office365_Operation:("Set-Mailbox" OR "Add-MailboxPermission" OR "Add-RecipientPermission" OR "Set-MailboxFolderPermission" OR "Add-MailboxFolderPermission")
    pivot_on:
    - user
    window: 24h
  - name: Suspicious sign-ins and failed logons for this account
    query: data_office365_Operation:("UserLoggedIn" OR "MailboxLogin" OR "UserLoginFailed")
    pivot_on:
    - user
    window: 24h
  - name: Full mail-purge footprint for this user beyond the alert window
    query: data_office365_Operation:("HardDelete" OR "SoftDelete" OR "MoveToDeletedItems")
    pivot_on:
    - user
    window: 2h
  - name: BEC tradecraft from the same source IP across accounts
    query: data_office365_Operation:("New-InboxRule" OR "Set-InboxRule" OR "Set-Mailbox" OR "Add-MailboxPermission" OR "UserLoggedIn" OR "MailboxLogin")
    pivot_on:
    - ip
    window: 24h
