name: M365 Inbox Rule Created
id: M365_Inbox_Rule_Created
version: 1
schema_version: "1.0"
date: "2026-07-02"
author: SOCFortress LLC
status: production
type: match
description: >
  Detects the creation of any Exchange inbox rule (New-InboxRule). Inbox rules
  that forward, redirect, move, or delete incoming mail are a common persistence
  and evidence-hiding technique following a business email compromise, where an
  attacker auto-forwards mail externally or silently routes security and reply
  messages to Deleted Items or an obscure folder. Inbox rule creation is a
  low-frequency, high-value event worth reviewing on every occurrence in a
  monitored tenant.
  MITRE ATT&CK: T1114.003 (Email Collection: Email Forwarding Rule), T1564.008 (Hide Artifacts: Email Hiding Rules).
data_source:
  - Office 365 Management Activity API
  - "Workload: Exchange"
workload: Exchange
how_to_implement: >
  Requires the Office 365 audit log ingestion pipeline feeding Graylog via the
  O365 Management Activity API, with Exchange admin auditing enabled so
  New-InboxRule operations (RecordType 1, ExchangeAdmin) are recorded. This is a
  single-event match detection that fires on every inbox rule creation. The rule's
  actions and name are carried in data_office365_Parameters as a flattened string
  of {Name=..., Value=...} pairs (e.g. RedirectTo, ForwardTo, MoveToFolder,
  DeleteMessage, StopProcessingRules), which is surfaced in the alert for triage.
  Note: data_office365_ClientIP includes an appended source port (e.g.
  "203.0.113.10:12824") for these admin-log events.
known_false_positives: >
  Users legitimately create inbox rules to organize mail (moving newsletters to
  folders, redirecting to shared/team mailboxes, auto-filing internal messages).
  Review each alert: forwarding or redirecting to an external domain, or rules
  that move mail to Deleted Items / RSS / Archive combined with marking as read,
  are the higher-risk patterns. Given the low frequency of this operation, all
  occurrences are alerted for analyst review.
references:
  - https://attack.mitre.org/techniques/T1114/003/
  - https://attack.mitre.org/techniques/T1564/008/
response:
  message: >
    Inbox rule created by $data_office365_UserId$ from $data_office365_ClientIP$.
    Rule details: $data_office365_Parameters$.
    Review for external forwarding/redirection or mail-hiding behavior.
    MITRE ATT&CK: T1114.003
  risk_score: 60
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 60
  threat_objects:
    - field: data_office365_ClientIP
      type: ip_address
    - field: data_office365_ObjectId
      type: rule_name
tags:
  analytic_story:
    - Office 365 Persistence
    - Business Email Compromise
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1114.003
    - T1564.008
  custom_tags:
    - o365
    - exchange
    - inbox_rule
    - mail_forwarding
    - persistence
    - bec
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:"New-InboxRule"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: 'The same mail-exfiltration goal by a second mechanism: a BEC actor who creates a forwarding inbox rule commonly also sets mailbox-level ForwardingSmtpAddress (Set-Mailbox) on the same mailbox. Both auto-copy incoming mail to an attacker address; seeing them together on this user confirms deliberate exfiltration over benign mail organisation.'
  - id: M365_Mass_Email_Deletion_Evidence_Wipe
    name: M365 Mass Email Deletion - Evidence Wipe
    reason: 'The evidence-wipe a hiding inbox rule sets up: the rule shunts NDRs, security notices and victim replies to Deleted Items, then the attacker bulk-purges them (Soft/HardDelete) to cover the fraud. Mass deletion on the same mailbox around the rule is the cover-up half of the same BEC.'
  - id: ff246f56-7f24-402a-baca-b86540e3925c
    name: Microsoft 365 - User Restricted from Sending Email
    reason: Microsoft throttled this mailbox for exceeding send limits - hard confirmation the account is compromised and being used to blast phishing/fraud mail. The hiding inbox rule exists precisely to route the resulting bounces and victim replies out of the Inbox so the owner never notices; same user.
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'The account-takeover precursor: an impossible-travel sign-in on the same user is how the attacker reached the mailbox before dropping the rule. Pairing a credential-compromise signal with the persistence action turns a possibly-benign rule into a confirmed BEC.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: BEC operators create inbox rules from behind Tor/VPN/anonymising proxies to mask origin; an anonymous-IP session by the same user around the rule corroborates attacker control rather than the legitimate owner filing their own mail.
  - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
    name: Azure Login Bypassing Conditional Access Policies
    reason: A stolen-token / Conditional-Access-bypass sign-in (TokenSmith via the Intune Company Portal app) is a common way the attacker reached the mailbox without tripping MFA, immediately preceding the persistence rule on the same user.
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: 'Co-occurring identity entrenchment: an attacker who plants a mailbox-persistence rule frequently also disables Strong Authentication on the same identity to keep access. Both land in the same takeover session and reinforce that this is an intruder, not the owner.'
  - id: 6897cd82-6664-11ed-9022-0242ac120002
    name: PST Export Alert Using New-ComplianceSearchAction
    reason: 'The back-catalogue theft that pairs with the rule: where the forwarding/hiding rule drips new mail going forward, a New-ComplianceSearchAction -Export PST exfiltrates the mailbox''s existing contents. Both are mailbox collection by the same compromised user.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Additional mailbox rule, forwarding and delegate-permission changes by this user
    query: (data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Rr][Ee][Cc][Ii][Pp][Ii][Ee][Nn][Tt][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - user
    window: 24h
  - name: Sign-ins and failed logins by this user
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: Mailbox access and outbound send operations by this user
    query: (data_office365_Operation:/.*[Mm][Aa][Ii][Ll][Ii][Tt][Ee][Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Ee][Nn][Dd].*/ OR data_office365_Operation:/.*[Ss][Ee][Nn][Dd][Aa][Ss].*/ OR data_office365_Operation:/.*[Ss][Ee][Nn][Dd][Oo][Nn][Bb][Ee][Hh][Aa][Ll][Ff].*/ OR data_office365_Operation:/.*[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ll][Oo][Gg][Ii][Nn].*/)
    pivot_on:
    - user
    window: 6h
  - name: Mailbox item deletion / evidence-wipe operations by this user
    query: (data_office365_Operation:/.*[Ss][Oo][Ff][Tt][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_office365_Operation:/.*[Hh][Aa][Rr][Dd][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_office365_Operation:/.*[Mm][Oo][Vv][Ee][Tt][Oo][Dd][Ee][Ll][Ee][Tt][Ee][Dd][Ii][Tt][Ee][Mm][Ss].*/)
    pivot_on:
    - user
    window: 6h
  - name: Inbox-rule, forwarding and sign-in operations from the rule's source IP
    query: (data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - ip
    window: 6h
