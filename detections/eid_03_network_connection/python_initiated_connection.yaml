name: Python Initiated Connection
id: bef0bc5a-b9ae-425d-85c6-7b2d705980c6
version: 1
schema_version: "1.0"
date: "2025-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bef0bc5a-b9ae-425d-85c6-7b2d705980c6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a Python process initiating a network connection. While this often
  relates to package installation, it can also indicate a potential malicious
  script communicating with a C&C server. MITRE ATT&CK: T1046.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\python*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*.exe*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_destinationIp"
        - exists:
            field: "data_win_eventdata_sourceIp"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_destinationIp: "127.0.0.1"
                          - term:
                              data_win_eventdata_sourceIp: "127.0.0.1"
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*pip.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*install*"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_parentImage:
                                value: "C:\\ProgramData\\Anaconda3\\Scripts\\conda.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*:\\\\ProgramData\\\\Anaconda3\\\\Scripts\\\\conda-script.py*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*update*"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_parentImage:
                                value: "C:\\ProgramData\\Anaconda3\\python.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*C:\\\\ProgramData\\\\Anaconda3\\\\Scripts\\\\jupyter-notebook-script.py*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_sourceIp
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_image matches
  '*\python*'; data_win_eventdata_image matches '*.exe*', among other
  conditions.

known_false_positives: >
  Legitimate python scripts using the socket library or similar will trigger
  this. Apply additional filters and perform an initial baseline before
  deploying. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1046/T1046.md#atomic-test-4---port-scan-using-python
  - https://pypi.org/project/scapy/
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    Python Initiated Connection detected on host $agent_name$. Matched
    data_win_eventdata_initiated: $data_win_eventdata_initiated$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1046
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
  custom_tags:
    - python
    - initiated
    - connection
    - network_connection
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn].*/ AND data_win_eventdata_image:/.*\.[Ee][Xx][Ee].*/ AND _exists_:data_win_eventdata_destinationIp AND _exists_:data_win_eventdata_sourceIp AND _exists_:data_win_eventdata_commandLine AND NOT ((data_win_eventdata_destinationIp:"127.0.0.1" AND data_win_eventdata_sourceIp:"127.0.0.1") OR (data_win_eventdata_commandLine:/.*[Pp][Ii][Pp]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/)) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT ((data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Nn][Aa][Cc][Oo][Nn][Dd][Aa]3\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\\[Cc][Oo][Nn][Dd][Aa]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Nn][Aa][Cc][Oo][Nn][Dd][Aa]3\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\\[Cc][Oo][Nn][Dd][Aa]-[Ss][Cc][Rr][Ii][Pp][Tt]\.[Pp][Yy].*/ AND data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Aa][Tt][Ee].*/) OR (data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Nn][Aa][Cc][Oo][Nn][Dd][Aa]3\\[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Nn][Aa][Cc][Oo][Nn][Dd][Aa]3\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\\[Jj][Uu][Pp][Yy][Tt][Ee][Rr]-[Nn][Oo][Tt][Ee][Bb][Oo][Oo][Kk]-[Ss][Cc][Rr][Ii][Pp][Tt]\.[Pp][Yy].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 899133d5-4d7c-4a7f-94ee-27355c879d90
    name: Python Inline Command Execution
    reason: The EID 1 that explains this connection. A `python -c` one-liner is the usual launcher for a socket reverse shell or an inline scapy/socket scanner, and it carries the full command line, parent process and user that the EID 3 network event omits - the evidence that decides whether this python was dev tooling or an attacker payload.
  - id: 50a0aa3d-ab16-4594-a8aa-5145a6e6792b
    name: Python One-Liners with Base64 Decoding
    reason: 'Precursor that removes the benign reading: a `python -c ... b64decode(...)` one-liner decodes and runs a hidden payload. If it fired on this host just before the connection, the outbound traffic is attacker-staged, not a script politely using the socket library.'
  - id: 480e7e51-e797-47e3-8d72-ebfce65b6d8d
    name: Python Spawning Pretty TTY on Windows
    reason: 'Co-occurring interactive-shell upgrade: `import pty; pty.spawn()` turns a python reverse shell into a full TTY. The connection this rule caught is most likely that reverse shell, and this is its hands-on-keyboard follow-on on the same host.'
  - id: 78e678d2-bf64-4fe6-aa52-2f7b11dddee7
    name: Windows Detect Network Scanner Behavior
    reason: 'Same-incident corroboration on the same data source (EID 3): it fires when one process opens many unique ports/destinations in a short window. Python port-scanning with scapy/socket - the rule''s own primary T1046 behaviour - produces exactly that fan-out, so the two together confirm a scan rather than a single benign call.'
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: 'Co-occurring discovery tooling: operators mapping the subnet with python scapy routinely also drop Advanced Port Scanner (a ransomware-affiliate favourite) in the same recon stage on the same host, so its execution corroborates the network-discovery read of this alert.'
  - id: f8be3e82-46a3-4e4e-ada5-8e538ae8b9c9
    name: Credential Dumping Activity By Python Based Tool
    reason: 'Follow-on escalation of a python-tooled intrusion: after recon or C2 the same Python stack (LaZagne/pypykatz) opens LSASS for credentials. Seeing it on this host turns a discovery/connection alert into an active credential-access incident.'
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: 'Sibling tool-initiated outbound connection (EID 3) and the classic ingress-transfer follow-on: if python''s connection was pulling a second stage, certutil fetching the payload on the same host in the same window corroborates ingress tool transfer by a non-browser utility.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Python launch on this host with network / scanning / reverse-shell libraries (EID 1 command line, parent, user)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn].*\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Aa][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Qq][Uu][Ee][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Ll][Ii][Bb].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Rr][Aa][Mm][Ii][Kk][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Pp][Ll][Ii][Bb].*/ OR data_win_eventdata_commandLine:/.*[Ss][Mm][Tt][Pp][Ll][Ii][Bb].*/ OR data_win_eventdata_commandLine:/.*[Pp][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Mm][Aa][Pp].*/ OR data_win_eventdata_commandLine:/.* -[Cc] .*/)
    pivot_on:
    - host
    window: 2h
  - name: Full outbound-connection fan-out by Python on this host (port scan vs C2 beacon)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn].*\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: DNS queries made by Python on this host (C2 domain / target-name resolution)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn].*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts contacting the same destination (shared C2 / lateral target across the estate)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/) OR data_win_system_eventID:"22"
    pivot_on:
    - ip
    window: 24h
  - name: 'How Python got here: suspicious-parent spawn or dropped .py / python.exe on this host'
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn].*\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Yy]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn].*\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 4h
