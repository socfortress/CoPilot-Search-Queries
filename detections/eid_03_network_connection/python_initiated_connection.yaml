name: Python Initiated Connection
id: bef0bc5a-b9ae-425d-85c6-7b2d705980c6
version: 1
schema_version: "1.0"
date: "2025-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bef0bc5a-b9ae-425d-85c6-7b2d705980c6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a Python process initiating a network connection. While this often
  relates to package installation, it can also indicate a potential malicious
  script communicating with a C&C server. MITRE ATT&CK: T1046.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\python*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*.exe*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_destinationIp"
        - exists:
            field: "data_win_eventdata_sourceIp"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_destinationIp: "127.0.0.1"
                          - term:
                              data_win_eventdata_sourceIp: "127.0.0.1"
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*pip.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*install*"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_parentImage:
                                value: "C:\\ProgramData\\Anaconda3\\Scripts\\conda.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*:\\\\ProgramData\\\\Anaconda3\\\\Scripts\\\\conda-script.py*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*update*"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_parentImage:
                                value: "C:\\ProgramData\\Anaconda3\\python.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*C:\\\\ProgramData\\\\Anaconda3\\\\Scripts\\\\jupyter-notebook-script.py*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_sourceIp
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_image matches
  '*\python*'; data_win_eventdata_image matches '*.exe*', among other
  conditions.

known_false_positives: >
  Legitimate python scripts using the socket library or similar will trigger
  this. Apply additional filters and perform an initial baseline before
  deploying. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1046/T1046.md#atomic-test-4---port-scan-using-python
  - https://pypi.org/project/scapy/
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    Python Initiated Connection detected on host $agent_name$. Matched
    data_win_eventdata_initiated: $data_win_eventdata_initiated$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1046
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
  custom_tags:
    - python
    - initiated
    - connection
    - network_connection
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

