name: Uncommon Outbound Kerberos Connection
id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
version: 1
schema_version: "1.0"
date: "2024-03-15"
author: Ilyas Ochkov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon outbound network activity via Kerberos default port
  indicating possible lateral movement or first stage PrivEsc via delegation.
  MITRE ATT&CK: T1558, T1550.003.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_destinationPort: "88"
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_image:
                    value: "C:\\Windows\\System32\\lsass.exe"
                    case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Mozilla Firefox\\firefox.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Mozilla Firefox\\firefox.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\tomcat\\\\bin\\\\tomcat8.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destinationPort
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destinationPort equals '88'; data_win_eventdata_initiated
  equals 'true'; data_win_eventdata_image equals
  'C:\Windows\System32\lsass.exe', among other conditions.

known_false_positives: >
  Web Browsers and third party application might generate similar activity. An
  initial baseline is required. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/GhostPack/Rubeus
  - https://attack.mitre.org/techniques/T1558/
  - https://attack.mitre.org/techniques/T1550/003/

response:
  message: >
    Uncommon Outbound Kerberos Connection detected on host $agent_name$. Matched
    data_win_eventdata_destinationPort: $data_win_eventdata_destinationPort$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$. MITRE
    ATT&CK: T1558, T1550.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_destinationPort
      type: other
    - field: data_win_eventdata_initiated
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558
    - T1550.003
  custom_tags:
    - uncommon
    - outbound
    - kerberos
    - network_connection
    - sysmon
    - credential_access
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt]\\[Bb][Ii][Nn]\\[Tt][Oo][Mm][Cc][Aa][Tt]8\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Rubeus is the exact tool the rule cites (GhostPack/Rubeus reference); it speaks raw Kerberos to the KDC itself instead of via LSASS, so its EID1 process-creation event on this host names the binary/arguments that opened the port-88 socket this alert saw.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: The outbound port-88 connection IS a ticket request; this catches the on-host command (asktgt/asktgs/kerberoast/asreproast) that generated it, confirming a tool - not LSASS - drove the Kerberos traffic.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration is the recon step immediately before Kerberoasting - the attacker lists service accounts with SPNs, then requests their TGS over port 88 to crack offline; seeing it on the same host just before is the precursor.
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: 'This is the KDC-side (4769 TGS) view of what the port-88 tool pulled: a burst of service-ticket requests for the same account context confirms the raw connection was Kerberoasting, not a benign client.'
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: The other roast a non-LSASS tool performs over port 88 - 4768 AS-REQ for pre-auth-disabled accounts; correlating it by the same user/account confirms the raw Kerberos connection was AS-REP roasting.
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Roasting tools force RC4 (etype 0x17) so the returned tickets are crackable offline; an RC4 ticket for the same account in-window is the encryption-downgrade signature that proves the port-88 requests were made to steal crackable credentials.
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: A non-LSASS process requesting a TGT with stolen key material is textbook overpass-the-hash; this security-log confirmation that the ticket was issued turns the raw connection into the rule's stated 'first-stage privesc / lateral movement' outcome.
  - id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
    name: Impacket Lateral Movement Commandline Parameters
    reason: The ticket obtained over port 88 is then reused (Impacket's -k Kerberos auth) to execute on other hosts; Impacket wmiexec/smbexec/atexec launched from this host right after is the lateral-movement hop the Kerberos theft enables.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberos-abuse tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Bb][Ee][Uu][Ss].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Rr][Uu][Bb][Ee][Uu][Ss]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt]|[Aa][Ss][Kk][Tt][Gg][Tt]|[Aa][Ss][Kk][Tt][Gg][Ss]|[Tt][Gg][Tt][Dd][Ee][Ll][Ee][Gg]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::|[Cc][Rr][Ee][Aa][Tt][Ee][Nn][Ee][Tt][Oo][Nn][Ll][Yy]).*/)
    pivot_on:
    - host
    window: 2h
  - name: SPN enumeration / Kerberoast target discovery on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Gg][Ee][Tt][Uu][Ss][Ee][Rr][Ss][Pp][Nn][Ss]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee]|[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt]).*/)
    pivot_on:
    - host
    window: 6h
  - name: LSASS credential/key access on this host (material for overpass-the-hash)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Kerberos ticket requests and pre-auth failures for this account
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4771")
    pivot_on:
    - user
    window: 6h
  - name: Lateral-movement / remote-execution tooling launched from this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ww][Mm][Ii][Ee][Xx][Ee][Cc]|[Ss][Mm][Bb][Ee][Xx][Ee][Cc]|[Aa][Tt][Ee][Xx][Ee][Cc]|[Dd][Cc][Oo][Mm][Ee][Xx][Ee][Cc]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn]).*/)
    pivot_on:
    - host
    window: 2h
