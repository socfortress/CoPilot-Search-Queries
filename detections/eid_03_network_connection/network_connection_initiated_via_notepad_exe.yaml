name: Network Connection Initiated Via Notepad.EXE
id: e81528db-fc02-45e8-8e98-4e84aba1f10b
version: 1
schema_version: "1.0"
date: "2024-02-02"
author: EagleEye Team
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e81528db-fc02-45e8-8e98-4e84aba1f10b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a network connection that is initiated by the "notepad.exe" process.
  This might be a sign of process injection from a beacon process or something
  similar. Notepad rarely initiates a network communication except when printing
  documents for example. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\notepad.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_destinationPort"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_destinationPort: "9100"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_destinationPort
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\notepad.exe';
  data_win_eventdata_destinationPort equals '9100'.

known_false_positives: >
  Printing documents via notepad might cause communication with the printer via
  port 9100 or similar. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20200219102749/https://www.sans.org/cyber-security-summit/archives/file/summit-archive-1492186586.pdf
  - https://www.cobaltstrike.com/blog/why-is-notepad-exe-connecting-to-the-internet
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Network Connection Initiated Via Notepad.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_destinationPort: $data_win_eventdata_destinationPort$.
    MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_destinationPort
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - privilege_escalation
    - command_and_control
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_destinationPort AND NOT (data_win_eventdata_destinationPort:"9100")

