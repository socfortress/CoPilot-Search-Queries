name: Network Connection Initiated Via Notepad.EXE
id: e81528db-fc02-45e8-8e98-4e84aba1f10b
version: 1
schema_version: "1.0"
date: "2024-02-02"
author: EagleEye Team
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e81528db-fc02-45e8-8e98-4e84aba1f10b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a network connection that is initiated by the "notepad.exe" process.
  This might be a sign of process injection from a beacon process or something
  similar. Notepad rarely initiates a network communication except when printing
  documents for example. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\notepad.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_destinationPort"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_destinationPort: "9100"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_destinationPort
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\notepad.exe';
  data_win_eventdata_destinationPort equals '9100'.

known_false_positives: >
  Printing documents via notepad might cause communication with the printer via
  port 9100 or similar. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20200219102749/https://www.sans.org/cyber-security-summit/archives/file/summit-archive-1492186586.pdf
  - https://www.cobaltstrike.com/blog/why-is-notepad-exe-connecting-to-the-internet
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Network Connection Initiated Via Notepad.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_destinationPort: $data_win_eventdata_destinationPort$.
    MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_destinationPort
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - privilege_escalation
    - command_and_control
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_destinationPort AND NOT (data_win_eventdata_destinationPort:"9100")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5adbc5f1-9a2f-41c1-a810-f37e015f8179
    name: Notepad with no Command Line Arguments
    reason: 'Direct precursor and the tightest link: Sliver/Cobalt Strike spawn a bare notepad.exe (no file argument) specifically as a sacrificial injection target, then VirtualAllocEx/WriteProcessMemory/CreateRemoteThread shellcode into it. That spawn fires seconds before the injected notepad egresses - this rule IS the ''concurrent network egress'' that confirms the injection took hold.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'The injection step itself: a CreateRemoteThread carrying Cobalt Strike''s characteristic beacon start-address offsets. This is the mechanism that plants the C2 code inside the sacrificial process; when that process is notepad, it fires immediately before notepad beacons out.'
  - id: a1a144b7-5c9b-4853-a559-2172be8d4a03
    name: Remote Thread Creation In Uncommon Target Image
    reason: Generic form of the same precursor - a remote thread created into an uncommon target image whose target list explicitly includes notepad.exe. Catches the injection into notepad even when the injector is not CS-specific, directly preceding the outbound connection.
  - id: a7c3d773-caef-227e-a7e7-c2f13c622329
    name: Bad Opsec Defaults Sacrificial Processes With Improper Arguments
    reason: 'Explains WHY a benign Microsoft-signed binary is on the network: C2 frameworks spawn a sacrificial process with default/improper arguments to inject a capability into it. A notepad launched this way and then beaconing is the realized version of that tradecraft.'
  - id: 20384606-a124-4fec-acbb-8bd373728613
    name: Suspicious Network Connection Binary No CommandLine
    reason: 'Sibling egress detection: an argument-less signed binary (rundll32/regsvr32/dllhost) initiating a connection - the identical inject-into-sacrificial-process beacon pattern as notepad. A beacon rotating its spawnto trips both on the same host, corroborating that the egress is injected code, not the app.'
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Co-occurring beacon artifact: a live Cobalt Strike beacon inside notepad opens its named pipe (msagent_/MSSE-/postex_) on the same host. Seeing it alongside the notepad egress confirms the connection is a CS beacon rather than a one-off anomaly.'
  - id: f356a9c4-effd-4608-bbf8-408afd5cd006
    name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
    reason: 'The same beacon''s alternate C2 channel: Cobalt Strike DNS beaconing from the same host runs in parallel with, or as a fallback to, the TCP egress notepad just made. Confirms sustained C2 and helps pin the beacon''s infrastructure.'
  - id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
    name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
    reason: 'Likely follow-on: once the beacon in notepad has execution, the most common next action is credential theft via LSASS memory access. Finding LSASS access on the same host shortly after escalates this from a lone injection indicator to an active hands-on-keyboard intrusion.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote-thread / handle injection targeting notepad on this host
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND data_win_eventdata_targetImage:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: notepad.exe process creation - reveals injector parent and missing file argument
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other sacrificial / LOLBIN processes initiating connections on this host (beacon spawnto rotation)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Dd][Ll][Ll][Hh][Oo][Ss][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]|[Ss][Ee][Aa][Rr][Cc][Hh][Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Oo][Ss][Tt]|[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]|[Ww][Uu][Aa][Uu][Cc][Ll][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: C2 framework named-pipe artifacts on this host (Cobalt Strike / Sliver defaults)
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Mm][Ss][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_pipeName:/.*[Mm][Ss][Ss][Ee]-.*/ OR data_win_eventdata_pipeName:/.*[Pp][Oo][Ss][Tt][Ee][Xx].*/ OR data_win_eventdata_pipeName:/.*[Ss][Tt][Aa][Tt][Uu][Ss]_.*/ OR data_win_eventdata_pipeName:/.*[Ss][Ll][Ii][Vv][Ee][Rr].*/)
    pivot_on:
    - host
    window: 1h
  - name: Other hosts talking to the same C2 destination (campaign / beacon spread)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22")
    pivot_on:
    - ip
    window: 24h
