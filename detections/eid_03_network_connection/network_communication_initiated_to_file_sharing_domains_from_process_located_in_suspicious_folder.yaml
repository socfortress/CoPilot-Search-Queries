    Network Communication Initiated To File Sharing Domains From Process Located
    In Suspicious Folder detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_initiated: $data_win_eventdata_initiated$. MITRE ATT&CK:
