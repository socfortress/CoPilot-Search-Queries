correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: 'Process-creation view of the most likely cause: a PowerShell download cradle fetching from these same file-sharing domains is frequently the exact command that produced this EID 3 outbound connection.'
  - id: 42a5f1e7-9603-4f6d-97ae-3f37d130d794
    name: Suspicious File Downloaded From File-Sharing Website Via Certutil.EXE
    reason: 'Alternate ingress-tool-transfer vehicle on the same host: certutil pulling from a file-sharing site is a common LOLBin path by which the binary now sitting in the suspicious folder was staged or updated.'
  - id: 065cceea-77ec-4030-9052-fc0affea7110
    name: DNS Query for Anonfiles.com Domain - Sysmon
    reason: 'DNS precursor: name resolution of an anonymous file-upload domain fires just before the EID 3 connect and confirms the file-sharing destination this process reached.'
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: Direct superset sibling (same EID 3, same suspicious-folder process) without the file-sharing-domain filter, so it surfaces the same binary's other outbound C2/beacon connections to non-file-sharing hosts.
  - id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
    name: Suspicious Dropbox API Usage
    reason: 'Same network vantage, specific allowlisted service: a non-Dropbox process talking to the Dropbox API is the identical staging/exfil-over-web-service behaviour aimed at another reputable provider the same actor may rotate to.'
  - id: 52182dfb-afb7-41db-b4bc-5336cb29b464
    name: Suspicious File Download From File Sharing Websites -  File Stream
    reason: 'File-on-disk corroboration: the Mark-of-the-Web / ADS zone-identifier stamped when a suspicious file type lands from a file/paste-sharing domain confirms this connection actually delivered a payload rather than beaconing.'
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: 'Exfiltration reading of the same alert: if the outbound flow is data leaving rather than a download, a curl upload to these same file-sharing domains is the matching exfil-over-web-service action.'
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Likely follow-on persistence: once a second stage is pulled into a temp/Download directory, malware commonly writes a Run key pointing at that location to survive reboot.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ingress-tool-transfer / download & upload tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp][Ii][Mm][Gg][Dd][Oo][Ww][Nn][Ll][Dd][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Executable or script dropped into a world-writable / suspicious folder on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn].*/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd]/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss]/)
    pivot_on:
    - host
