name: Network Communication Initiated To Portmap.IO Domain
id: 07837ab9-60e1-481f-a74d-c31fb496a94c
version: 1
schema_version: "1.0"
date: "2024-05-31"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07837ab9-60e1-481f-a74d-c31fb496a94c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an executable accessing the portmap.io domain, which could be a sign
  of forbidden C2 traffic or data exfiltration by malicious actors. MITRE
  ATT&CK: T1041, T1090.002.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_destinationHostname:
              value: "*.portmap.io"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches '*.portmap.io'.

known_false_positives: >
  Legitimate use of portmap.io domains. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://portmap.io/
  - https://github.com/rapid7/metasploit-framework/issues/11337
  - https://pro.twitter.com/JaromirHorejsi/status/1795001037746761892/photo/2
  - https://attack.mitre.org/techniques/T1041/
  - https://attack.mitre.org/techniques/T1090/002/

response:
  message: >
    Network Communication Initiated To Portmap.IO Domain detected on host
    $agent_name$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1041, T1090.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1041
    - T1090.002
  custom_tags:
    - network
    - communication
    - initiated
    - network_connection
    - sysmon
    - command_and_control
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_destinationHostname:/.*\.[Pp][Oo][Rr][Tt][Mm][Aa][Pp]\.[Ii][Oo]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Identical behaviour from the same Sysmon EID 3 source - a process reaching an abusable reverse-tunnel relay; operators who stand up a portmap.io forward routinely also run ngrok, so a hit on the same host/IP in-window turns one connection into a confirmed tunnelling toolkit.
  - id: 3ab65069-d82a-4d44-a759-466661a082d1
    name: Communication To LocaltoNet Tunneling Service Initiated
    reason: LocaltoNet is a direct portmap.io equivalent (free TCP/UDP reverse tunnels via a third-party relay); a parallel connection from the same host corroborates deliberate C2/exfil tunnelling rather than one incidental domain hit.
  - id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
    name: Network Connection Initiated To Cloudflared Tunnels Domains
    reason: Cloudflared quick-tunnels expose an internal endpoint through an external relay exactly as portmap.io does; co-occurrence points to an actor spraying multiple tunnel providers for resilient command-and-control.
  - id: 9501f8e6-8e3d-48fc-a8a6-1089dd5d7ef4
    name: Network Connection Initiated To DevTunnels Domain
    reason: Microsoft Dev Tunnels is another external relay abused for the same reverse-tunnel C2/pivot; a Dev Tunnels connection from the same host widens the single portmap.io hit into a multi-service tunnelling pattern.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: portmap.io's documented mechanism is an SSH reverse tunnel (ssh -R); this rule catches exactly the ssh.exe -R that establishes the portmap.io forward, so a hit is the local half of the same tunnel that produced this alert.
  - id: 48a61b29-389f-4032-b317-b30de6b95314
    name: Suspicious Plink Port Forwarding
    reason: plink -R is the PuTTY/Windows way to build the same reverse SSH tunnel to portmap.io (the service's own Metasploit reverse-shell reference uses this), so its presence on the host explains how the portmap.io connection was created.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: netsh interface portproxy wires a local service (RDP/SMB/C2 handler) onto the port the tunnel exposes; a rule added around the same time shows the host being set up as a relay behind the portmap.io forward.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: A frequent portmap.io use is tunnelling RDP back for hands-on pivoting; this rule flags :3389 carried over an ssh/plink forward, the likely follow-on once the portmap.io reverse tunnel is up.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reverse-tunnel / port-forward client executed on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*(\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|\\[Oo][Pp][Ee][Nn][Vv][Pp][Nn]\.[Ee][Xx][Ee]|\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\\[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.* -[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.* -[Dd] .*/))
    pivot_on:
    - host
    window: 2h
  - name: Other third-party tunnel/relay services contacted from this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationHostname:/.*\.[Nn][Gg][Rr][Oo][Kk]\..*/ OR data_win_eventdata_destinationHostname:/.*[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*\.[Ll][Oo][Cc][Aa][Ll][Tt][Oo]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_destinationHostname:/.*[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*\.[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss].*/ OR data_win_eventdata_destinationHostname:/.*[Ss][Ee][Rr][Vv][Ee][Oo]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_destinationHostname:/.*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]\.[Rr][Uu][Nn].*/)
    pivot_on:
    - host
    window: 24h
  - name: DNS resolution of tunnel/relay domains on this host (reveals the resolver process)
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Pp][Oo][Rr][Tt][Mm][Aa][Pp]\.[Ii][Oo].*/ OR data_win_eventdata_queryName:/.*\.[Nn][Gg][Rr][Oo][Kk]\..*/ OR data_win_eventdata_queryName:/.*[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*\.[Ll][Oo][Cc][Aa][Ll][Tt][Oo]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_queryName:/.*\.[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Local listener / port-proxy wiring a service into the tunnel on this host
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/) OR ((data_win_eventdata_commandLine:/.*:3389.*/ OR data_win_eventdata_commandLine:/.*:445.*/) AND (data_win_eventdata_commandLine:/.* -[Rr] .*/ OR data_win_eventdata_commandLine:/.* -[Ll] .*/)))) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same portmap.io relay (campaign)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/) OR data_win_system_eventID:"22"
    pivot_on:
    - domain
    window: 24h
