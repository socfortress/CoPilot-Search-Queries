name: Network Communication Initiated To Portmap.IO Domain
id: 07837ab9-60e1-481f-a74d-c31fb496a94c
version: 1
schema_version: "1.0"
date: "2024-05-31"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07837ab9-60e1-481f-a74d-c31fb496a94c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an executable accessing the portmap.io domain, which could be a sign
  of forbidden C2 traffic or data exfiltration by malicious actors. MITRE
  ATT&CK: T1041, T1090.002.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_destinationHostname:
              value: "*.portmap.io"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches '*.portmap.io'.

known_false_positives: >
  Legitimate use of portmap.io domains. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://portmap.io/
  - https://github.com/rapid7/metasploit-framework/issues/11337
  - https://pro.twitter.com/JaromirHorejsi/status/1795001037746761892/photo/2
  - https://attack.mitre.org/techniques/T1041/
  - https://attack.mitre.org/techniques/T1090/002/

response:
  message: >
    Network Communication Initiated To Portmap.IO Domain detected on host
    $agent_name$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1041, T1090.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1041
    - T1090.002
  custom_tags:
    - network
    - communication
    - initiated
    - network_connection
    - sysmon
    - command_and_control
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_destinationHostname:/.*\.[Pp][Oo][Rr][Tt][Mm][Aa][Pp]\.[Ii][Oo]/

