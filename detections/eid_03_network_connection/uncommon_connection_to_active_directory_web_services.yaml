name: Uncommon Connection to Active Directory Web Services
id: b3ad3c0f-c949-47a1-a30e-b0491ccae876
version: 1
schema_version: "1.0"
date: "2024-01-26"
author: "@kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b3ad3c0f-c949-47a1-a30e-b0491ccae876
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon network connections to the Active Directory Web Services
  (ADWS) from processes not typically associated with ADWS management. MITRE
  ATT&CK: T1087.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated: true
        - term:
            data_win_eventdata_destinationPort: "9389"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\system32\\dsac.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Microsoft Monitoring Agent\\"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\PowerShell\\\\7\\\\pwsh.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\PowerShell\\\\7-preview\\\\pwsh.ex*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\WindowsPowerShell\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationPort
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'True'; data_win_eventdata_destinationPort
  equals '9389'; data_win_eventdata_image equals 'C:\Windows\system32\dsac.exe',
  among other conditions.

known_false_positives: >
  ADWS is used by a number of legitimate applications that need to interact with
  Active Directory. These applications should be added to the allow-listing to
  avoid false positives. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://medium.com/falconforce/soaphound-tool-to-collect-active-directory-data-via-adws-165aca78288c
  - https://github.com/FalconForceTeam/FalconFriday/blob/a9219dfcfd89836f34660223f47d766982bdce46/Discovery/ADWS_Connection_from_Unexpected_Binary-Win.md
  - https://attack.mitre.org/techniques/T1087/

response:
  message: >
    Uncommon Connection to Active Directory Web Services detected on host
    $agent_name$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. Matched data_win_eventdata_destinationPort:
    $data_win_eventdata_destinationPort$. MITRE ATT&CK: T1087
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationPort
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087
  custom_tags:
    - uncommon
    - connection
    - active
    - network_connection
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:true AND data_win_eventdata_destinationPort:"9389" AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ss][Aa][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg] [Aa][Gg][Ee][Nn][Tt][\\]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\7\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\7-[Pp][Rr][Ee][Vv][Ii][Ee][Ww]\\[Pp][Ww][Ss][Hh]\.[Ee][Xx].*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e92a4287-e072-4a40-9739-370c106bb750
    name: HackTool - SOAPHound Execution
    reason: SOAPHound is the FalconForce .NET tool that collects AD data over ADWS (port 9389) and this alert's own reference; the uncommon process hitting 9389 is most likely SOAPHound itself, so this is the process-creation half of the same collection on the same host/user.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: BloodHound/SharpHound performs the same bulk AD collection and modern collectors can harvest over ADWS; its execution on this host corroborates the 9389 connection as attacker enumeration rather than admin tooling.
  - id: 02773bed-83bf-469f-b7ff-e676e7d78bab
    name: BloodHound Collection Files
    reason: The ADWS enumeration's output landing on disk (*_users.json, *_groups.json, BloodHound.zip) is the direct downstream artifact proving directory data was actually collected on this host.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: Loading Microsoft.ActiveDirectory.Management.dll enumerates AD through the DC's ADWS endpoint; a parallel/alternative ADWS query path by the same actor on this host (and this rule already excludes the benign pwsh/WindowsPowerShell callers).
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: AdFind runs the same domain enumeration over LDAP - the actor's parallel AD reconnaissance by a different channel, commonly seen alongside ADWS collection on the same host/user.
  - id: 9212f354-7775-4e28-9c9f-8f0a4544e664
    name: Active Directory Database Snapshot Via ADExplorer
    reason: ADExplorer -snapshot dumps the whole AD database to feed BloodHound - an alternative bulk collection of the same target that co-occurs when an actor is harvesting the directory.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: Once the domain graph reveals kerberoastable service accounts, SPN enumeration via setspn is the classic next step toward Kerberoasting - a follow-on credential-access move on the same host/user.
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: DC-side reads (4661) of privileged users/groups are exactly what ADWS collection drives toward (Domain Admins, etc.) - a follow-on/confirming enumeration of the high-value principals the actor just mapped.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BloodHound / SOAPHound collection output written on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*_[Uu][Ss][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Gg][Rr][Oo][Uu][Pp][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Gg][Pp][Oo][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Oo][Uu][Ss]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*_[Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr][Ss]\.[Jj][Ss][Oo][Nn]/)
    pivot_on:
    - host
    window: 2h
  - name: AD-enumeration tooling / cmdlets executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]\.[Ee][Xx][Ee]|\\[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]\.[Ee][Xx][Ee]|\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ss][Vv][Dd][Ee]\.[Ee][Xx][Ee]|\\[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]|\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]|\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]64\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy]\.[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Dd][Oo][Mm][Aa][Ii][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: SPN enumeration / Kerberoasting on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]/) OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Uu][Ss][Ee][Rr][Ss][Pp][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Qq][Uu][Ee][Ss][Tt]-[Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*\\[Rr][Uu][Bb][Ee][Uu][Ss].*/
    pivot_on:
    - host
    window: 4h
  - name: LSASS access / DCSync / credential dumping on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/
    pivot_on:
    - host
    window: 6h
  - name: Other hosts reaching the same DC's ADWS endpoint (port 9389)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:true AND data_win_eventdata_destinationPort:"9389"
    pivot_on:
    - ip
    window: 24h
