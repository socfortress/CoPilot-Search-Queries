name: Network Connection Initiated By IMEWDBLD.EXE
id: 8d7e392e-9b28-49e1-831d-5949c6281228
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8d7e392e-9b28-49e1-831d-5949c6281228
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a network connection initiated by IMEWDBLD.EXE. This might indicate
  potential abuse of the utility as a LOLBIN in order to download arbitrary
  files or additional payloads. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\IMEWDBLD.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_image matches
  '*\IMEWDBLD.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1105/T1105.md#atomic-test-10---windows---powershell-download
  - https://lolbas-project.github.io/lolbas/Binaries/IMEWDBLD/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Network Connection Initiated By IMEWDBLD.EXE detected on host $agent_name$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\[Ii][Mm][Ee][Ww][Dd][Bb][Ll][Dd]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 863218bd-c7d0-4c52-80cd-0a96c09f54af
    name: Arbitrary File Download Via IMEWDBLD.EXE
    reason: 'The process-creation twin of this exact event: the same IMEWDBLD invocation seen from Sysmon EID 1, where the command line carries the http(s) URL being fetched and parentImage names the process that launched it — the two fields this network-only alert cannot see. Pair them first to learn what was downloaded and who ran it.'
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: The identical behaviour (a signed download LOLBIN initiating an outbound connection, EID 3) via certutil, the commodity ingress tool. An operator reaching for the obscure IMEWDBLD routinely also runs certutil in the same session, so its firing on this host turns one download into a tooling pattern.
  - id: c7e91a02-d771-4a6d-a700-42587e0b1095
    name: Network Connection Initiated By Regsvr32.EXE
    reason: 'The same abnormal EID-3 pattern — a LOLBIN that has no business touching the network initiating a connection — but regsvr32 /i:URL fetches AND runs a remote scriptlet. Seen alongside the IMEWDBLD download on this host it points to systematic signed-binary abuse: one binary stages the payload, another fetches-and-executes.'
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Certutil's -urlcache/-split -f download from the process-creation side. It is the most common alternative to a niche downloader like IMEWDBLD; if it fired on this host in the window the actor is cycling through download utilities, and its command line exposes a second fetched URL and output path.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: bitsadmin /transfer is a stealth download LOLBIN whose BITS job survives reboots and logoffs. Actors pair it with ad-hoc downloaders like IMEWDBLD to re-fetch payloads resiliently, so its presence on the same host in the window signals staged, persistent ingress tooling.
  - id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: Suspicious Curl.EXE Download
    reason: curl.exe, built into modern Windows, is today's default ingress tool. An IMEWDBLD download followed by curl on the same host is the typical 'try the obscure binary, then the reliable downloader' progression, and curl's command line names the next URL and -o/-O output file.
  - id: f37aba28-a9e6-4045-882c-d5004043b337
    name: Potential Arbitrary File Download Via Cmdl32.EXE
    reason: Cmdl32 coerced into downloading a file is the exact same class of trick as IMEWDBLD — an obscure signed Microsoft binary abused as a downloader. An operator who knows one of these LOLBAS downloaders rotates through them to evade per-binary blocking, making it a strong same-campaign companion on this host.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: 'The escalation an IMEWDBLD download is building toward: a single command that fetches a file and immediately runs it. On the same host it marks the transition from ''payload staged to disk'' to ''payload executing'', and usually names the dropped file path.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: IMEWDBLD process creation on this host (recover the download URL and parent process)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ii][Mm][Ee][Ww][Dd][Bb][Ll][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Mm][Ee][Ww][Dd][Bb][Ll][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: DNS query made by IMEWDBLD on this host (resolve the connection's destination to a domain)
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Ii][Mm][Ee][Ww][Dd][Bb][Ll][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Mm][Ee][Ww][Dd][Bb][Ll][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Payload staged to the browser download cache or temp on this host (the fetched file hitting disk)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ii][Nn][Ee][Tt][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/) AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Cc][Rr]|[Pp][Ss]1|[Bb][Aa][Tt]|[Cc][Mm][Dd]|[Hh][Tt][Aa]|[Vv][Bb][Ss]|[Jj][Ss]|[Ss][Cc][Tt]|[Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]|[Ii][Ss][Oo]|[Ii][Mm][Gg])/
    pivot_on:
    - host
    window: 1h
  - name: Execution of a binary from a download-staging directory on this host (the staged payload being run)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ii][Nn][Ee][Tt][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other hosts initiating a connection to the same destination (download-server / campaign spread)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
