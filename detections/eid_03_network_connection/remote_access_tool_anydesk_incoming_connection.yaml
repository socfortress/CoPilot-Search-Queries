name: Remote Access Tool - AnyDesk Incoming Connection
id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
version: 1
schema_version: "1.0"
date: "2025-02-24"
author: "@d4ns4n_ (Wuerth-Phoenix)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects incoming connections to AnyDesk. This could indicate a potential
  remote attacker trying to connect to a listening instance of AnyDesk and use
  it as potential command and control channel. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AnyDesk.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AnyDeskMSI.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_initiated:
              value: "false"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\AnyDesk.exe'; data_win_eventdata_image
  matches '*\AnyDeskMSI.exe'; data_win_eventdata_initiated equals 'false'.

known_false_positives: >
  Legitimate incoming connections (e.g. sysadmin activity). Most of the time I
  would expect outgoing connections (initiated locally). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-2---anydesk-files-detected-test-on-windows
  - https://asec.ahnlab.com/en/40263/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - AnyDesk Incoming Connection detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_initiated
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - anydesk
    - incoming
    - connection
    - network_connection
    - sysmon
    - persistence
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk][Mm][Ss][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:/[Ff][Aa][Ll][Ss][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b1377339-fda6-477a-b455-ac0923f9ec2c
    name: Remote Access Tool - AnyDesk Piped Password Via CLI
    reason: 'Precursor on the same host: an operator pipes ''anydesk.exe --set-password'' to configure an unattended-access password so the host accepts inbound sessions without anyone clicking Accept. An incoming connection right after this is unattended attacker access, not a prompted support session.'
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: 'Precursor: ''--install --start-with-win --silent'' deploys AnyDesk as an auto-starting service that listens for incoming connections. It explains why an unmanaged host has a listening AnyDesk instance for this connection to land on.'
  - id: 530a6faa-ff3d-4022-b315-50828e77eef5
    name: Anydesk Remote Access Software Service Installation
    reason: 'Precursor from a separate data source (System log SCM 7045): the AnyDesk service created to listen for connections. Corroborates the listening instance even when the install was done via MSI and no ''--silent'' command line was captured.'
  - id: 065b00ca-5d5c-4557-ac95-64a6d0b64d86
    name: Remote Access Tool - Anydesk Execution From Suspicious Folder
    reason: 'Confirmation: AnyDesk run from a non-standard path (not Program Files or AppData\AnyDesk) is a dropped portable binary, so the instance accepting this connection is attacker-staged rather than a sanctioned deployment.'
  - id: 0b9ad457-2554-44c1-82c2-d56a99c42377
    name: Anydesk Temporary Artefact
    reason: 'Same-host co-occurring confirmation: user.conf/system.conf written under %APPDATA%\Roaming\AnyDesk when the instance is configured and connects, evidence the inbound session is a live, configured AnyDesk and not a stray port probe.'
  - id: 2d367498-5112-4ae5-a06a-96e7bc33a211
    name: Suspicious Binary Writes Via AnyDesk
    reason: 'Direct follow-on abuse: AnyDesk.exe writing .exe/.dll files (other than the benign gcapi.dll) means the remote operator is using AnyDesk''s file-transfer to drop tooling during the session, the classic next action after connecting in (RedCanary / DFIR LockBit chain).'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Binaries dropped through this AnyDesk session (file transfer)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]([Mm][Ss][Ii])?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/) AND NOT data_win_eventdata_targetFilename:/.*\\[Gg][Cc][Aa][Pp][Ii]\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: Processes spawned by AnyDesk (hands-on-keyboard commands)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]([Mm][Ss][Ii])?\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Interactive host/domain discovery commands on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Additional remote-access or tunnel tooling started on this host
    query: ((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee]|[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ee][Xx][Ee]|[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Ss][Ss][Hh] .*-[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/))
    pivot_on:
    - host
    window: 2h
  - name: Same source address opening inbound AnyDesk sessions elsewhere
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Ff][Aa][Ll][Ss][Ee]/ AND data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]([Mm][Ss][Ii])?\.[Ee][Xx][Ee]/
    pivot_on:
    - ip
    window: 24h
