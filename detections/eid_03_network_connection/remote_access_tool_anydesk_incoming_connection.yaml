name: Remote Access Tool - AnyDesk Incoming Connection
id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
version: 1
schema_version: "1.0"
date: "2025-02-24"
author: "@d4ns4n_ (Wuerth-Phoenix)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects incoming connections to AnyDesk. This could indicate a potential
  remote attacker trying to connect to a listening instance of AnyDesk and use
  it as potential command and control channel. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AnyDesk.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AnyDeskMSI.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_initiated:
              value: "false"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\AnyDesk.exe'; data_win_eventdata_image
  matches '*\AnyDeskMSI.exe'; data_win_eventdata_initiated equals 'false'.

known_false_positives: >
  Legitimate incoming connections (e.g. sysadmin activity). Most of the time I
  would expect outgoing connections (initiated locally). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-2---anydesk-files-detected-test-on-windows
  - https://asec.ahnlab.com/en/40263/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - AnyDesk Incoming Connection detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_initiated
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - anydesk
    - incoming
    - connection
    - network_connection
    - sysmon
    - persistence
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk][Mm][Ss][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:/[Ff][Aa][Ll][Ss][Ee]/

correlation:
