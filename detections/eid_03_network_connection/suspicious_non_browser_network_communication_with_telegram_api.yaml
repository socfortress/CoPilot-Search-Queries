  query: data_win_system_eventID:"3" AND data_win_eventdata_destinationHostname:/.*[Aa][Pp][Ii]\.[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\.[Oo][Rr][Gg].*/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Aa][Xx][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Ww][Ee][Bb][Vv][Ii][Ee][Ww]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Cc][Oo][Rr][Ee]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Cc][Oo][Rr][Ee]\\.*/) AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee][Ww][Ee][Bb][Vv][Ii][Ee][Ww]2\.[Ee][Xx][Ee]/)) OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Aa][Ff][Aa][Rr][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ee][Aa][Mm][Oo][Nn][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Aa][Ll][Ee]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d6b0d627-d0bf-46b1-936f-c48284767d21
    name: Potential Telegram API Request Via CommandLine
    reason: 'Co-occurring, same C2 channel at the command-line/script layer: when the connecting non-browser process is a LOLBIN HTTP client (curl/wget/Invoke-WebRequest) or a PowerShell script, it trips this rule on the very same api.telegram.org request and reveals the exact process, bot token and method (sendDocument/getUpdates) behind this network connection.'
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'Precursor collection: the Telegram Bot API is the dominant exfil channel for commodity infostealers, which read browser credential stores moments before POSTing the loot to a Telegram bot. This is the harvest step that explains what is leaving the host over Telegram.'
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: 'Precursor collection: PowerShell access to the browser Login Data credential store (T1555.003) is exactly what a Telegram-exfil stealer does before sending; co-firing on the same host pins the credential theft to this exfiltration.'
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: 'Precursor collection: session-cookie theft (to bypass MFA) is a top infostealer objective exfiltrated over Telegram; a curl cookie save on this host is the loot staged just before this Telegram upload.'
  - id: windows-curl-upload-remote-destination-001
    name: Windows Curl Upload to Remote Destination
    reason: 'Co-occurring exfil mechanism: curl.exe with -T/--upload-file/-F/-d is precisely how a Telegram sendDocument exfil is performed, and such a curl upload to api.telegram.org would itself trip this network rule (curl is not browser-excluded) - the two describe one exfiltration from two sensors.'
  - id: 7e9cf7b6-e827-11ed-a05b-0242ac120003
    name: Suspicious Non-Browser Network Communication With Google API
    reason: Same covert-C2-over-trusted-web-service technique (non-browser process abusing an allow-listed API); co-firing on a host points to multi-channel or dead-drop-resolver C2 where the operator fronts command-and-control behind several legitimate APIs.
  - id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
    name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
    reason: Same non-browser-to-trusted-cloud-service evasion used for malware hosting and exfil; a sibling egress channel worth checking on the same host once Telegram-based C2 is confirmed.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Telegram Bot API referenced in a process command line or PowerShell script block (identifies the C2 process and method)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Pp][Ii]\.[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\.[Oo][Rr][Gg].*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Aa][Pp][Ii]\.[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\.[Oo][Rr][Gg].*/)
    pivot_on:
    - host
    window: 1h
  - name: Browser credential-store / cookie harvesting on this host (the loot being exfiltrated)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Bb] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS resolution of api.telegram.org on this host (beacon cadence and querying image)
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Aa][Pp][Ii]\.[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\.[Oo][Rr][Gg].*/
    pivot_on:
    - host
    window: 6h
  - name: 'Payload origin: execution from user-writable drop directories or scripting interpreters on this host'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn][Ww]?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Additional dead-drop / cloud-exfil destinations contacted by this host (multi-channel exfil beyond Telegram)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_destinationHostname:/.*([Dd][Ii][Ss][Cc][Oo][Rr][Dd]|[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]|[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]|[Gg][Oo][Ff][Ii][Ll][Ee]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]|[Mm][Ee][Gg][Aa]\.[Nn][Zz]).*/ OR data_win_eventdata_queryName:/.*([Dd][Ii][Ss][Cc][Oo][Rr][Dd]|[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]|[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]|[Gg][Oo][Ff][Ii][Ll][Ee]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]|[Mm][Ee][Gg][Aa]\.[Nn][Zz]).*/)
    pivot_on:
    - host
    window: 6h
