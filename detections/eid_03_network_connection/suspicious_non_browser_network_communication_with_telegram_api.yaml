    Suspicious Non-Browser Network Communication With Telegram API detected on
    host $agent_name$. Matched data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1102, T1567, T1105
  risk_score: 50
  severity: medium
  risk_objects:
