name: Windows Detect Network Scanner Behavior
id: 78e678d2-bf64-4fe6-aa52-2f7b11dddee7
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects when an application is used to connect a large number of unique
  ports/targets within a short time frame. Network enumeration may be used by adversaries as a method
  of discovery, lateral movement, or remote execution. This analytic leverages Sysmon EventID 3
  (network connections) to identify suspicious scanning behavior. By monitoring for processes that
  establish connections to multiple unique ports or destinations within a 5-minute window, this detection
  can identify potential network reconnaissance activities. This activity is significant as it may
  indicate lateral movement or system discovery by an attacker. If confirmed malicious, this could
  allow an attacker to map the network, identify vulnerable systems, and plan further attacks.

data_source:
  - Sysmon EventID 3

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_destinationIp
    - data_win_eventdata_image
    - data_win_eventdata_sourcePort
    - data_win_eventdata_sourceIp
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-5m"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  This detection relies on Sysmon EventID 3 events being ingested and tagged into the network traffic
  data model. Ensure that Sysmon is configured to log network connections (EventID 3) and that these
  logs are properly ingested into Elasticsearch with complete command-line arguments and process information.
  The detection works by aggregating unique destination ports and IPs per process over a 5-minute
  time window and alerting when thresholds are exceeded (>10 unique ports OR >10 unique destinations).
  Configure exclusions for known scanners and legitimate applications that perform network enumeration.

known_false_positives: >
  Various applications may legitimately trigger this detection through their normal operation.
  Network monitoring tools, vulnerability scanners, patch management systems, and load balancers
  commonly make connections to multiple ports. The lookup file browser_app_list may not contain all
  legitimate applications that perform network enumeration. Consider tuning port/dest count thresholds
  based on your environment and excluding known legitimate scanning tools.

references:
  - https://attack.mitre.org/techniques/T1595

response:
  message: >
    Process $data_win_eventdata_image$ on $agent_name$ exhibited network scanning
    behavior with connections to multiple ports/destinations. This may indicate network reconnaissance
    or lateral movement activity.
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
  threat_objects:
    - field: data_win_eventdata_image
      type: process

tags:
  analytic_story:
    - Network Discovery
    - Lateral Movement
    - Network Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1595.001
    - T1595.002
  custom_tags:
    - network_scanning
    - lateral_movement
    - discovery
  product:
    - Wazuh
  security_domain: network

graylog:
  query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"4444" OR data_win_eventdata_destinationPort:"31337" OR data_win_eventdata_destinationPort:"5555" OR data_win_eventdata_destinationPort:"6667" OR data_win_eventdata_destinationPort:"8081" OR data_win_eventdata_destinationPort:"1080" OR data_win_eventdata_destinationPort:"3128" OR data_win_eventdata_destinationPort:"8080")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: 'Precursor on the same host: netstat -ano enumerates the host''s existing TCP/UDP connections and listeners - the situational-awareness step operators run to choose targets immediately before launching the internal sweep this rule flags.'
  - id: windows-network-connection-discovery-with-arp-001
    name: Windows Network Connection Discovery With Arp
    reason: 'Precursor on the same host: arp -a dumps the local-subnet neighbour cache (live L2 hosts), the exact address list an operator reads to decide which IPs to sweep next.'
  - id: dd83407e-439f-11ec-ab8e-acde48001122
    name: Network Discovery Using Route Windows App
    reason: 'Precursor on the same host: route print exposes reachable subnets and pivot interfaces, telling the operator which networks are worth scanning in the multi-destination sweep this rule detects.'
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: 'The scanner itself: Advanced IP Scanner is the ransomware-crew host-sweep tool that generates exactly this many-destinations EID3 pattern; its EID1 alert names the binary behind the traffic this rule only sees as connections.'
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: 'The scanner itself: Advanced Port Scanner fans out connections across many ports - the precise behaviour this rule flags - so its process-creation alert identifies the scanning process this network alert cannot name.'
  - id: c539afac-c12a-46ed-b1bd-5a5567c9f045
    name: Potential Remote PowerShell Session Initiated
    reason: 'Follow-on on the same pivot host: outbound WinRM (5985/5986) is the lateral-movement step after a sweep, turning reconnaissance into confirmed movement toward a host the scan just discovered.'
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: 'Follow-on on the same host: PsExec to a remote \\host is the classic post-scan lateral-movement action, showing the operator acting on a target the sweep identified.'
  - id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
    name: WMIC Remote Command Execution
    reason: 'Follow-on on the same host: wmic /node:<remote> is the WMI lateral-movement channel operators run against scan-discovered hosts, corroborating movement after the reconnaissance.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: This host's lateral-movement fan-out to admin ports (SMB/RDP/WinRM/WMI/SSH)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"139" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"22" OR data_win_eventdata_destinationPort:"23")
    pivot_on:
    - host
    window: 2h
  - name: Known network-scanner / sweep tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Zz][Ee][Nn][Mm][Aa][Pp].*/ OR data_win_eventdata_image:/.*\\[Mm][Aa][Ss][Ss][Cc][Aa][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Ii][Pp]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Pp][Oo][Rr][Tt]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Cc][Aa][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Pp][Ss][Cc][Aa][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Pp][Ii][Nn][Gg].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/.*[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_originalFileName:/.*[Nn][Mm][Aa][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Network-position reconnaissance LOLBins on this host (the recon burst framing the scan)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Rr][Pp]\.[Ee][Xx][Ee]|\\[Rr][Oo][Uu][Tt][Ee]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|\\[Nn][Bb][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]|\\[Tt][Rr][Aa][Cc][Ee][Rr][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Tunneling / proxy / reverse-shell tooling on this host (the proxy & 4444 ports angle)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|\\[Nn][Cc]\.[Ee][Xx][Ee]|\\[Nn][Cc][Aa][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Cc][Aa][Tt]\.[Ee][Xx][Ee]|\\[Ss][Oo][Cc][Aa][Tt]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Ss]\.[Ee][Xx][Ee]|\\[Rr][Ee][Vv][Ss][Oo][Cc][Kk][Ss]\.[Ee][Xx][Ee])/ OR data_win_eventdata_originalFileName:/.*([Nn][Gg][Rr][Oo][Kk]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Pp][Ll][Ii][Nn][Kk])/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt].*/)
    pivot_on:
    - host
    window: 4h
  - name: Other internal hosts initiating connections to the same target (campaign fan-in)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
