name: Windows Detect Network Scanner Behavior
id: 78e678d2-bf64-4fe6-aa52-2f7b11dddee7
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects when an application is used to connect a large number of unique
  ports/targets within a short time frame. Network enumeration may be used by adversaries as a method
  of discovery, lateral movement, or remote execution. This analytic leverages Sysmon EventID 3
  (network connections) to identify suspicious scanning behavior. By monitoring for processes that
  establish connections to multiple unique ports or destinations within a 5-minute window, this detection
  can identify potential network reconnaissance activities. This activity is significant as it may
  indicate lateral movement or system discovery by an attacker. If confirmed malicious, this could
  allow an attacker to map the network, identify vulnerable systems, and plan further attacks.

data_source:
  - Sysmon EventID 3

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_destinationIp
    - data_win_eventdata_image
    - data_win_eventdata_sourcePort
    - data_win_eventdata_sourceIp
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-5m"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  This detection relies on Sysmon EventID 3 events being ingested and tagged into the network traffic
  data model. Ensure that Sysmon is configured to log network connections (EventID 3) and that these
  logs are properly ingested into Elasticsearch with complete command-line arguments and process information.
  The detection works by aggregating unique destination ports and IPs per process over a 5-minute
  time window and alerting when thresholds are exceeded (>10 unique ports OR >10 unique destinations).
  Configure exclusions for known scanners and legitimate applications that perform network enumeration.

known_false_positives: >
  Various applications may legitimately trigger this detection through their normal operation.
  Network monitoring tools, vulnerability scanners, patch management systems, and load balancers
  commonly make connections to multiple ports. The lookup file browser_app_list may not contain all
  legitimate applications that perform network enumeration. Consider tuning port/dest count thresholds
  based on your environment and excluding known legitimate scanning tools.

references:
  - https://attack.mitre.org/techniques/T1595

response:
  message: >
    Process $data_win_eventdata_image$ on $agent_name$ exhibited network scanning
    behavior with connections to multiple ports/destinations. This may indicate network reconnaissance
    or lateral movement activity.
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
  threat_objects:
    - field: data_win_eventdata_image
      type: process

tags:
  analytic_story:
    - Network Discovery
    - Lateral Movement
    - Network Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1595.001
    - T1595.002
  custom_tags:
    - network_scanning
    - lateral_movement
    - discovery
  product:
    - Wazuh
  security_domain: network

graylog:
  query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"4444" OR data_win_eventdata_destinationPort:"31337" OR data_win_eventdata_destinationPort:"5555" OR data_win_eventdata_destinationPort:"6667" OR data_win_eventdata_destinationPort:"8081" OR data_win_eventdata_destinationPort:"1080" OR data_win_eventdata_destinationPort:"3128" OR data_win_eventdata_destinationPort:"8080")

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: a5d85486-b89c-11eb-8267-acde48001122
      name: "Allow Inbound Traffic In Firewall Rule"
      reason: "same analytic story: Lateral Movement"
    - id: f64da023-b988-4775-8d57-38e512beb56e
      name: "Get-DomainComputer with PowerShell Script Block"
      reason: "same analytic story: Lateral Movement"
    - id: 89275e7e-0548-11ec-bf75-acde48001122
      name: "Get-DomainTrust with PowerShell Script Block"
      reason: "same analytic story: Lateral Movement"
    - id: 70fac80e-0bf1-11ec-9ba0-acde48001122
      name: "Get-ForestTrust with PowerShell Script Block"
      reason: "same analytic story: Lateral Movement"
    - id: 091712ff-b02a-4d43-82ed-34765515d95d
      name: "Get-NetTcpconnection with PowerShell Script Block"
      reason: "same analytic story: Network Reconnaissance"
    - id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
      name: "Interactive Session on Remote Endpoint with PowerShell"
      reason: "same analytic story: Lateral Movement"
    - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
      name: "Network Connection Discovery With Netstat"
      reason: "same analytic story: Network Discovery"
    - id: dd83407e-439f-11ec-ab8e-acde48001122
      name: "Network Discovery Using Route Windows App"
      reason: "same analytic story: Network Discovery"
    - id: windows-powershell-invoke-wmiexec-usage-001
      name: "PowerShell Invoke WmiExec Usage"
      reason: "same analytic story: Lateral Movement"
    - id: windows-powershell-remote-services-add-trustedhost-001
      name: "Powershell Remote Services Add TrustedHost"
      reason: "same analytic story: Lateral Movement"
    - id: 3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb
      name: "Windows Create Local Account"
      reason: "same analytic story: Lateral Movement"
    - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
      name: "Windows Create Local Administrator Account Via Net"
      reason: "same analytic story: Lateral Movement"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))'
      pivot_on: [host]
      window: 1h
    - name: "Other hosts connecting to the same destination address (campaign)"
      query: '(data_win_system_eventID:"22" OR data_win_system_eventID:"3")'
      pivot_on: [ip]
      window: 24h
    - name: "Downloader / C2 tooling executed on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt] .*/)'
      pivot_on: [host]
      window: 1h
    - name: "DNS queries by script interpreters / LOLBins on this host"
      query: 'data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/)'
      pivot_on: [host]
      window: 1h
    - name: "Remote-execution / lateral-movement tooling on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))'
      pivot_on: [host]
      window: 2h
