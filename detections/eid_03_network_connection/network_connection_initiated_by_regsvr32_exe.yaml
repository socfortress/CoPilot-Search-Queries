name: Network Connection Initiated By Regsvr32.EXE
id: c7e91a02-d771-4a6d-a700-42587e0b1095
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Dmitriy Lifanov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c7e91a02-d771-4a6d-a700-42587e0b1095
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a network connection initiated by "Regsvr32.exe". MITRE ATT&CK:
  T1559.001, T1218.010.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\regsvr32.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_image matches
  '*\regsvr32.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2017/05/11/applocker-bypass-regsvr32/
  - https://oddvar.moe/2017/12/13/applocker-case-study-how-insecure-is-it-really-part-1/
  - https://attack.mitre.org/techniques/T1559/001/
  - https://attack.mitre.org/techniques/T1218/010/

response:
  message: >
    Network Connection Initiated By Regsvr32.EXE detected on host $agent_name$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1559.001, T1218.010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1559.001
    - T1218.010
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 867356ee-9352-41c9-a8f2-1be690d78216
    name: Potentially Suspicious Regsvr32 HTTP/FTP Pattern
    reason: 'The EID 1 process-creation form of this exact event: regsvr32 launched with /i and an http/ftp URL in its command line. That download command is the direct cause of the outbound connection this rule sees from the network vantage — pair them to recover the full URL and parent.'
  - id: 2dd2c217-bf68-437a-b57c-fe9fd01d5de8
    name: Potentially Suspicious Regsvr32 HTTP IP Pattern
    reason: Same regsvr32 /i:http://<IP> download command, but the target is a bare IP with no domain. If it fired, this alert's destinationIp is attacker infrastructure reached with no DNS lookup — a higher-fidelity malicious read of the connection.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: regsvr32 loading scrobj.dll — the Squiblydoo engine. scrobj.dll is what fetches and runs the remote .sct scriptlet, so it is the execution mechanism behind this outbound connection; its firing confirms the connect is a remote-scriptlet pull, not benign DLL registration.
  - id: f421c250-24e7-11ec-bc43-acde48001122
    name: Regsvr32 Silent and Install Param Dll Loading
    reason: The canonical /s /i Squiblydoo fingerprint on regsvr32. The /i:URL form is precisely what makes regsvr32 reach out, so this catches the same download even when the URL/scrobj patterns miss (obfuscated or locally staged scriptlet).
  - id: 36e037c4-c228-4866-b6a3-48eb292b9955
    name: DNS Query Request By Regsvr32.EXE
    reason: 'The resolve half of the resolve-then-connect pair: same process and host moments before this connection. Its QueryName is the download/C2 domain behind this alert''s destinationIp — the pivot to run against threat intel.'
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: 'The follow-on: regsvr32 normally spawns nothing, so a child (powershell/mshta/cmd/wscript/net/schtasks) on this host after the connection is the downloaded scriptlet executing its next stage.'
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: 'A delivery-chain precursor: mshta.exe (a malicious .hta from phishing) spawning this regsvr32. Explains how the host reached this point and ties the connection back to an initial-access HTA.'
  - id: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
    name: Scripting/CommandLine Process Spawned Regsvr32
    reason: 'The parent-chain precursor: a script host (powershell/wscript/cscript/cmd/mshta) spawned this regsvr32 — the macro/script-to-LOLBin hand-off that typically immediately precedes the remote-scriptlet download this rule catches.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Regsvr32 remote-scriptlet / scrobj process-creation on this host (recover command line and parent)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Oo][Bb][Jj].*/ OR data_win_eventdata_commandLine:/.*\/[Ii]:.*/ OR data_win_eventdata_commandLine:/.*-[Ii]:.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: DNS query made by regsvr32 on this host (resolve the connection's destination to a domain)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by regsvr32 on this host (follow-on payload execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: scrobj.dll (Script Component Runtime) image load on this host (confirms Squiblydoo remote-scriptlet)
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ss][Cc][Rr][Oo][Bb][Jj]\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 1h
  - name: Other hosts initiating a connection to the same destination (campaign spread)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
