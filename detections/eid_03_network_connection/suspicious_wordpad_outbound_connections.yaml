name: Suspicious Wordpad Outbound Connections
id: 786cdae8-fefb-4eb2-9227-04e34060db01
version: 1
schema_version: "1.0"
date: "2023-12-15"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 786cdae8-fefb-4eb2-9227-04e34060db01
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a network connection initiated by "wordpad.exe" over uncommon
  destination ports. This might indicate potential process injection activity
  from a beacon or similar mechanisms.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\wordpad.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_destinationPort"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_destinationPort: "80"
                    - term:
                        data_win_eventdata_destinationPort: "139"
                    - term:
                        data_win_eventdata_destinationPort: "443"
                    - term:
                        data_win_eventdata_destinationPort: "445"
                    - term:
                        data_win_eventdata_destinationPort: "465"
                    - term:
                        data_win_eventdata_destinationPort: "587"
                    - term:
                        data_win_eventdata_destinationPort: "993"
                    - term:
                        data_win_eventdata_destinationPort: "995"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationPort
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_image matches
  '*\wordpad.exe'; data_win_eventdata_destinationPort equals '80', among other
  conditions.

known_false_positives: >
  Other ports can be used, apply additional filters accordingly. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://blogs.blackberry.com/en/2023/07/romcom-targets-ukraine-nato-membership-talks-at-nato-summit

response:
  message: >
    Suspicious Wordpad Outbound Connections detected on host $agent_name$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - wordpad
    - outbound
    - connections
    - network_connection
    - sysmon
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\[Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_destinationPort AND NOT (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"139" OR data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"465" OR data_win_eventdata_destinationPort:"587" OR data_win_eventdata_destinationPort:"993" OR data_win_eventdata_destinationPort:"995")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a1a144b7-5c9b-4853-a559-2172be8d4a03
    name: Remote Thread Creation In Uncommon Target Image
    reason: This rule's target-image list explicitly includes wordpad.exe/write.exe. A remote thread injected into WordPad is the exact 'process injection from a beacon' this detection hypothesises and the immediate precursor that makes WordPad beacon.
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Cobalt Strike spawns/injects a benign host process then beacons over non-standard ports; a CS-signature remote thread on the same host is a likely injector behind WordPad's outbound connection.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: The RomCom campaign in this rule's own reference side-loaded a malicious DLL into wordpad.exe from a writable path. An abusable DLL loaded from Temp/Public/Perflogs just before the connection is the code now beaconing.
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: Loaders drop the side-loaded DLL to %TEMP% before the host binary loads it; a temp-dir DLL load on this host points at how injected/side-loaded code entered WordPad ahead of the beacon.
  - id: e81528db-fc02-45e8-8e98-4e84aba1f10b
    name: Network Connection Initiated Via Notepad.EXE
    reason: Notepad is the same class of GUI editor that 'rarely initiates a network communication' and whose outbound connection likewise signals injection. A sibling Notepad beacon on the same host means the actor is injecting multiple benign processes.
  - id: 3b5ba899-9842-4bc2-acc2-12308498bf42
    name: Office Application Initiated Network Connection Over Uncommon Ports
    reason: 'Near-identical logic (trusted app to uncommon-port C2) and the usual delivery vehicle: a malicious Office document that then injects into wordpad.exe. Co-occurrence ties the delivery to this beacon.'
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: The second-stage payload the WordPad beacon pulls down typically runs from Temp/Public/Perflogs and beacons too; its connection expands the same C2 picture around this host.
  - id: 20384606-a124-4fec-acbb-8bd373728613
    name: Suspicious Network Connection Binary No CommandLine
    reason: Injected/proxied beacons commonly run rundll32/regsvr32/dllhost with an empty command line while calling out - the same inject-then-beacon tradecraft as this alert, seen on the host's LOLBins.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Suspicious or unsigned DLL loaded by wordpad.exe (side-load vector)
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/ OR data_win_eventdata_imageLoaded:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss])\\.*\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: Remote thread / process access injected into wordpad.exe
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND data_win_eventdata_targetImage:/.*\\[Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by wordpad.exe (injected-code execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: DNS queries made by wordpad.exe (C2 domain resolution)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other processes/hosts beaconing to the same destination (C2 infra & spread)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
