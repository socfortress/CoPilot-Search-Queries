name: Suspicious Wordpad Outbound Connections
id: 786cdae8-fefb-4eb2-9227-04e34060db01
version: 1
schema_version: "1.0"
date: "2023-12-15"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 786cdae8-fefb-4eb2-9227-04e34060db01
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a network connection initiated by "wordpad.exe" over uncommon
  destination ports. This might indicate potential process injection activity
  from a beacon or similar mechanisms.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\wordpad.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_destinationPort"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_destinationPort: "80"
                    - term:
                        data_win_eventdata_destinationPort: "139"
                    - term:
                        data_win_eventdata_destinationPort: "443"
                    - term:
                        data_win_eventdata_destinationPort: "445"
                    - term:
                        data_win_eventdata_destinationPort: "465"
                    - term:
                        data_win_eventdata_destinationPort: "587"
                    - term:
                        data_win_eventdata_destinationPort: "993"
                    - term:
                        data_win_eventdata_destinationPort: "995"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationPort
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_image matches
  '*\wordpad.exe'; data_win_eventdata_destinationPort equals '80', among other
  conditions.

known_false_positives: >
  Other ports can be used, apply additional filters accordingly. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://blogs.blackberry.com/en/2023/07/romcom-targets-ukraine-nato-membership-talks-at-nato-summit

response:
  message: >
    Suspicious Wordpad Outbound Connections detected on host $agent_name$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - wordpad
    - outbound
    - connections
    - network_connection
    - sysmon
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\[Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_destinationPort AND NOT (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"139" OR data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"465" OR data_win_eventdata_destinationPort:"587" OR data_win_eventdata_destinationPort:"993" OR data_win_eventdata_destinationPort:"995")

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Any activity involving this address"
      query: '_exists_:srcip OR _exists_:dstip OR _exists_:data_srcip OR _exists_:data_dest_ip'
      pivot_on: [ip]
      window: 1h
    - name: "High-severity alerts involving this address"
      query: 'rule_level:>=10'
      pivot_on: [ip]
      window: 1h
