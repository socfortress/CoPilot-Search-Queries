correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7e9cf7b6-e827-11ed-a05b-0242ac120003
    name: Suspicious Non-Browser Network Communication With Google API
    reason: 'Twin detection: a non-browser process using a trusted cloud API (Google Drive/Sheets, e.g. GC2) as covert C2 - the same evasion as hiding C2 in azurewebsites.net; a host beaconing to Azure is worth checking for a parallel Google-cloud channel.'
  - id: c3dbbc9f-ef1d-470a-a90a-d343448d5875
    name: Suspicious Non-Browser Network Communication With Telegram API
    reason: 'Twin detection: a non-browser process talking to the Telegram Bot API as covert C2/exfil - same ''blend C2 into a trusted web service'' tradecraft, so co-firing shows the Azure beacon is one of several cloud channels on this host.'
  - id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
    name: Suspicious Dropbox API Usage
    reason: A non-Dropbox executable reaching the Dropbox API - the cloud-storage exfil/tool-transfer variant of the same trusted-cloud abuse; azurewebsites.net is cited as an exfil site too, so pair the Azure channel with cloud-storage exfil here.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: Tells you whether the process that reached Azure is running from a user-writable/uncommon path (Temp, AppData, ProgramData) - turning 'a non-browser process' into 'a dropped payload beaconing out' rather than an installed app.
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: certutil.exe is a non-browser LOLBin that trips this rule when it reaches azurewebsites.net; co-firing identifies the Azure connection as a certutil download/beacon rather than benign traffic.
  - id: c7e91a02-d771-4a6d-a700-42587e0b1095
    name: Network Connection Initiated By Regsvr32.EXE
    reason: regsvr32.exe fetching a remote scriptlet/COM payload (squiblydoo) is a non-browser process that reaches out; co-firing points the Azure connection at a regsvr32 remote-scriptlet C2.
  - id: 9501f8e6-8e3d-48fc-a8a6-1089dd5d7ef4
    name: Network Connection Initiated To DevTunnels Domain
    reason: Dev Tunnels is Microsoft's own trusted cloud abused for a reverse shell/tunnel - the same 'hide C2 in Microsoft infrastructure' playbook as azurewebsites.net, a strong parallel-channel check on the same host.
  - id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
    name: PowerShell Download Pattern
    reason: The non-browser process reaching Azure is most often powershell.exe running a download cradle; this flags that cradle in the command line, explaining what the Azure connection is pulling or beaconing.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DNS lookups and connections to azurewebsites.net on this host (resolver process + beacon cadence)
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Aa][Zz][Uu][Rr][Ee][Ww][Ee][Bb][Ss][Ii][Tt][Ee][Ss]\.[Nn][Ee][Tt].*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationHostname:/.*[Aa][Zz][Uu][Rr][Ee][Ww][Ee][Bb][Ss][Ii][Tt][Ee][Ss]\.[Nn][Ee][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download / C2 cradle execution on this host (LOLBins and web-request cmdlets)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Other hosts initiating connections to the same azurewebsites.net host (campaign)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - domain
    window: 24h
  - name: Archive / staging and cloud-transfer (exfil) tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Aa]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Pp][Ss][Cc][Pp]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]|[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Persistence establishment on this host (run key / scheduled task / service)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Rr][Ee][Gg]|[Ss][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|[Aa][Dd][Dd]).*/) OR data_win_eventdata_commandLine:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Nn][Ee][Ww]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk]).*/)
    pivot_on:
    - host
    window: 6h
