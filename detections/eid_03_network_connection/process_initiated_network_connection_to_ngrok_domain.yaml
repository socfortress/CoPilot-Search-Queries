name: Process Initiated Network Connection To Ngrok Domain
id: 18249279-932f-45e2-b37a-8925f2597670
version: 1
schema_version: "1.0"
date: "2025-07-30"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 18249279-932f-45e2-b37a-8925f2597670
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an executable initiating a network connection to "ngrok" domains.
  Attackers were seen using this "ngrok" in order to store their second stage
  payloads and malware. While communication with such domains can be legitimate,
  often times is a sign of either data exfiltration by malicious actors or
  additional download. MITRE ATT&CK: T1567, T1572, T1102.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*.ngrok-free.app"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*.ngrok-free.dev"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*.ngrok.app"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*.ngrok.dev"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*.ngrok.io"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches '*.ngrok-free.app';
  data_win_eventdata_destinationHostname matches '*.ngrok-free.dev', among other
  conditions.

known_false_positives: >
  Legitimate use of the ngrok service. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://ngrok.com/
  - https://ngrok.com/blog-post/new-ngrok-domains
  - https://www.virustotal.com/gui/file/cca0c1182ac114b44dc52dd2058fcd38611c20bb6b5ad84710681d38212f835a/
  - https://www.rnbo.gov.ua/files/2023_YEAR/CYBERCENTER/november/APT29%20attacks%20Embassies%20using%20CVE-2023-38831%20-%20report%20en.pdf
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1102/

response:
  message: >
    Process Initiated Network Connection To Ngrok Domain detected on host
    $agent_name$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1567, T1572, T1102
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567
    - T1572
    - T1102
  custom_tags:
    - initiated
    - network
    - connection
    - network_connection
    - sysmon
    - exfiltration
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationHostname:/.*\.[Nn][Gg][Rr][Oo][Kk]-[Ff][Rr][Ee][Ee]\.[Aa][Pp][Pp]/ OR data_win_eventdata_destinationHostname:/.*\.[Nn][Gg][Rr][Oo][Kk]-[Ff][Rr][Ee][Ee]\.[Dd][Ee][Vv]/ OR data_win_eventdata_destinationHostname:/.*\.[Nn][Gg][Rr][Oo][Kk]\.[Aa][Pp][Pp]/ OR data_win_eventdata_destinationHostname:/.*\.[Nn][Gg][Rr][Oo][Kk]\.[Dd][Ee][Vv]/ OR data_win_eventdata_destinationHostname:/.*\.[Nn][Gg][Rr][Oo][Kk]\.[Ii][Oo]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: The ngrok.exe agent whose outbound session this network connection actually is; its command line (it keys on 'tcp 3389'/'445'/'5985' and 'start --all'/'authtoken') reveals which local service is being tunnelled and confirms this is a live ngrok tunnel, not a browser resolving an ngrok-hosted URL.
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Sibling network detection matching the ngrok agent's control-channel hosts (tunnel.<region>.ngrok.com) while this rule matches the public tunnel endpoints (*.ngrok.io/.app/.dev); together they confirm both legs of the same tunnel and catch region variants either hostname list alone would miss.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: netsh firewall rule opening inbound TCP 3389 - the host-side step that makes a tunnelled RDP session reachable, routinely run just before/after an ngrok tunnel is pointed at RDP (observed with Sarwent).
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: netsh portproxy forwarding port 3389 relays the tunnel's local endpoint onto the RDP service - the classic ngrok-to-RDP plumbing on the same host.
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: Grants an account interactive logon over the tunnel; attackers add a user to Remote Desktop Users so the RDP they just exposed through ngrok can actually be logged into.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: SSH/plink reverse-tunnelling RDP (':3389' with -R/-L) pursues the same objective - expose RDP over a covert outbound tunnel - by an alternative tool; seen alongside ngrok it marks deliberate remote-access tunnelling rather than incidental ngrok use.
  - id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
    name: Network Connection Initiated To Cloudflared Tunnels Domains
    reason: A second tunnelling provider (Cloudflare Tunnel) on the same host indicates the actor is standing up a redundant covert channel / reverse shell - a common fallback when one tunnel service is blocked.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Rclone staging/exfil to cloud storage (REvil/Conti/FiveHands) is the data-theft follow-on this rule's own description warns ngrok is used for; on the same host it turns a tunnel alert into an exfiltration incident.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ngrok agent process and the local service it is exposing on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Gg][Rr][Oo][Kk] [Tt][Cc][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Gg][Rr][Oo][Kk] [Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Gg][Rr][Oo][Kk] [Ss][Tt][Aa][Rr][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Firewall opened or RDP port-forwarded via netsh on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR (data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ AND (data_win_eventdata_commandLine:/.*[Aa][Ll][Ll][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Oo][Pp][Ee][Nn][Ii][Nn][Gg].*/)))
    pivot_on:
    - host
    window: 2h
  - name: ngrok binary download / DNS / file staging on this host
    query: (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Ee][Qq][Uu][Ii][Nn][Oo][Xx]\.[Ii][Oo].*/ OR data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk]\.[Cc][Oo][Mm].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Nn][Gg][Rr][Oo][Kk].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Gg][Rr][Oo][Kk].*/ AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 4h
  - name: Other reverse-tunnel / proxy tooling on this host (redundant covert channel)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee]|\\[Ii][Oo][Xx]\.[Ee][Xx][Ee]|\\[Ss][Ss][Hh]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.* -[Rr] .*3389.*/ OR data_win_eventdata_commandLine:/.* -[Rr] .*445.*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Pp][Cc].*/ OR data_win_eventdata_commandLine:/.*[Cc][Hh][Ii][Ss][Ee][Ll] [Cc][Ll][Ii][Ee][Nn][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Archive staging and cloud-exfil tooling on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Mm][Ee][Gg][Aa][Cc][Mm][Dd][Ss][Ee][Rr][Vv][Ee][Rr]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.* -[Hh][Pp].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee] [Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee] [Ss][Yy][Nn][Cc].*/)
    pivot_on:
    - host
    window: 4h
