graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_sourcePort AND _exists_:data_win_eventdata_protocol AND NOT ((data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Nn][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourcePort:"53" AND data_win_eventdata_protocol:/[Uu][Dd][Pp]/) OR data_win_eventdata_image:/.*\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Aa][Vv][Aa][Ss][Tt]\\[Aa][Vv][Aa][Ss][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Vv][Aa][Ss][Tt]\\[Aa][Vv][Aa][Ss][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Dd][Cc][Mm][Aa][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ss][Aa][Ss][Ss][Ee][Ss][Ss][Mm][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ss][Dd][Ii][Ss][Cc][Oo][Vv][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Oo][Bb][Aa][Rr][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Rr][Ee][Mm][Oo][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Rr][Ee][Mm][Oo][Tt][Ee][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss][Tt][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Mm][Oo][Tt][Ee][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Mm][Oo][Tt][Ee][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Mm][Aa][Nn][Aa][Gg][Ee][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Mm][Oo][Tt][Ee][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Mm][Aa][Nn][Aa][Gg][Ee][Rr][Ff][Rr][Ee][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ss][Ss][Ee][Nn][Ss][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Tt][Ss]2[Aa][Pp][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Tt][Ss][Aa][Pp][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Pp][Ii][Cc][Ee][Ww][Oo][Rr][Kk][Ss]-[Ff][Ii][Nn][Dd][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss]_[Tt][Uu][Nn][Nn][Ee][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Pp][Ll][Uu][Nn][Kk][Uu][Nn][Ii][Vv][Ee][Rr][Ss][Aa][Ll][Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ee][Rr]\\[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_image:/.*\\[Rr][Aa][Nn][Gg][Ee][Rr]\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Rr][Aa][Nn][Gg][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa] [Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Tt][Ss][Pp][Ll][Uu][Ss]\\[Jj][Aa][Vv][Aa]\\[Bb][Ii][Nn]\\[Hh][Tt][Mm][Ll]5[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Tt][Ss][Pp][Ll][Uu][Ss]\\[Jj][Aa][Vv][Aa]\\[Bb][Ii][Nn]\\[Hh][Tt][Mm][Ll]5[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ OR NOT _exists_:data_win_eventdata_image OR data_win_eventdata_image:"" OR data_win_eventdata_image:/\<[Uu][Nn][Kk][Nn][Oo][Ww][Nn] [Pp][Rr][Oo][Cc][Ee][Ss][Ss]\>/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Precursor on the same beachhead: an outbound RDP pivot by a non-mstsc tool needs valid credentials, and a comsvcs!MiniDump of LSASS yields the NTLM hashes and Kerberos tickets later used to authenticate that RDP session.'
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: 'Direct enabler seen seconds before the pivot: a logon-type-9 (sekurlsa::pth) forges a Kerberos ticket from a stolen hash, which is exactly how an operator authenticates an RDP session without the plaintext password.'
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: 'Same pivot observed at process creation: the non-standard process making the outbound 3389 connection is frequently an SSH/plink client forwarding RDP (-L/-R ...:3389) to tunnel into an otherwise unreachable host.'
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: plink.exe forwarding :3389 over SSH is a textbook non-mstsc RDP tool that trips this detection; confirms the outbound 3389 connection is a deliberate RDP tunnel rather than a benign third-party client.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: netsh portproxy relay to 3389 configured on this host; the outbound RDP connection from a non-standard process is the forwarded/relayed RDP traffic that the portproxy creates.
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: 'Co-occurring fan-out from the same beachhead: an operator pivoting by RDP commonly also runs Impacket wmiexec/smbexec/atexec against neighbouring hosts in the same burst.'
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: 'Co-occurring fan-out: PsExec SMB service-exec is a staple of the same hands-on-keyboard lateral movement as RDP and is often pushed to adjacent hosts from the host making the outbound RDP connection.'
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: 'Same T1021.001 campaign: reg.exe flipping the Terminal Server keys (e.g. fDenyTSConnections) turns RDP on so the lateral session can land, pairing with the outbound RDP this rule observes.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Non-standard tool forwarding or tunnelling RDP (port 3389) on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*:3389.*/ OR data_win_eventdata_commandLine:/.*=3389.*/ OR data_win_eventdata_image:/.*(\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]|\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Credential theft / LSASS memory access on this host (how the RDP creds were obtained)
    query: ((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: Other lateral-movement execution from this host (PsExec / WMI / PowerShell remoting)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Nn][Oo][Dd][Ee]:.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: Remote-admin-port connections initiated from this host (map the pivot targets)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"22")
    pivot_on:
    - host
    window: 2h
  - name: Other hosts making non-standard outbound RDP to the same destination (campaign spread)
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND NOT (data_win_eventdata_image:/.*\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - ip
    window: 24h
