name: Network Connection Initiated By AddinUtil.EXE
id: 5205613d-2a63-4412-a895-3a2458b587b3
version: 1
schema_version: "1.0"
date: "2024-07-16"
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5205613d-2a63-4412-a895-3a2458b587b3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a network connection initiated by the Add-In deployment cache updating
  utility "AddInutil.exe". This could indicate a potential command and control
  communication as this tool doesn't usually initiate network activity. MITRE
  ATT&CK: T1218.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\addinutil.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_image matches
  '*\addinutil.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Network Connection Initiated By AddinUtil.EXE detected on host $agent_name$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
    name: Suspicious AddinUtil.EXE CommandLine Execution
    reason: 'Same-host/same-process precursor: fires when AddinUtil.exe is launched with -AddInRoot:/-PipelineRoot: pointing at Temp/Desktop/Downloads/Public, loading the attacker''s Addins.Store payload - that redirected add-in assembly is almost certainly what is now beaconing in this EID 3 connection.'
  - id: b5746143-59d6-4603-8d06-acbd60e166ee
    name: Uncommon Child Process Of AddinUtil.EXE
    reason: 'Same-host/same-process precursor: AddinUtil spawning a non-conhost/WerFault child is the proxy-execution payload; the outbound connection in this alert may originate from that spawned process, so it names the executing malware.'
  - id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
    name: AddinUtil.EXE Execution From Uncommon Directory
    reason: 'Same-host precursor: shows AddinUtil.exe ran from a dropped, non-Microsoft.NET\Framework path (delivery stage) - the reason a trusted LOLBAS binary came to make an unexpected outbound connection.'
  - id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
    name: Uncommon AddinUtil.EXE CommandLine Execution
    reason: 'Same-host precursor: AddInRoot/PipelineRoot set to a non-VSTA path is the broader weaponization signal that the add-in pipeline was redirected to attacker content immediately before this connection fired.'
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: 'Same EID 3 event co-detection: if AddinUtil.exe was executed from a suspicious path (this rule''s location list even includes \Windows\addins\), it fires on the identical initiated connection and corroborates the beacon independently of the image name.'
  - id: 4fbf9270-43da-11ec-9486-acde48001122
    name: Windows InstallUtil Remote Network Connection
    reason: 'Closest .NET Framework LOLBin cousin: InstallUtil.exe (same Microsoft.NET\Framework* family) reaching a remote URL is the sibling signed-binary-proxy + ingress technique attackers pair with AddinUtil in the same intrusion.'
  - id: 50e54b8d-ad73-43f8-96a1-5191685b17a4
    name: Silenttrinity Stager Msbuild Activity
    reason: 'Near-identical behaviour on the same host: another signed .NET Framework utility (MSBuild) initiating an EID 3 C2 connection over 80/443 - the same ''.NET LOLBin beaconing'' pattern, and evidence a known C2 framework is active.'
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: 'Likely follow-on: once AddinUtil establishes C2, certutil.exe is the classic next step to pull the second-stage payload; its appearance on the same host in the window expands this into a staged ingress intrusion.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AddinUtil.EXE execution and command line on this host (recover the weaponization)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by AddinUtil.EXE on this host (proxy-exec payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Add-in pipeline / Addins.Store payload dropped on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Aa][Dd][Dd][Ii][Nn][Ss]\.[Ss][Tt][Oo][Rr][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Hh][Oo][Ss][Tt][Ss][Ii][Dd][Ee][Aa][Dd][Aa][Pp][Tt][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Dd][Dd][Ii][Nn][Ss][Ii][Dd][Ee][Aa][Dd][Aa][Pp][Tt][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Dd][Dd][Ii][Nn][Vv][Ii][Ee][Ww][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ii][Pp][Ee][Ll][Ii][Nn][Ee][Ss][Ee][Gg][Mm][Ee][Nn][Tt][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS resolution of the C2 by AddinUtil / script interpreters on this host
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*(\\[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Other hosts beaconing to the same destination address (campaign spread)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/) OR data_win_system_eventID:"22"
    pivot_on:
    - ip
    window: 24h
