  - https://www.tanium.com/blog/apt41-deploys-google-gc2-for-attacks-cyber-threat-intelligence-roundup/
  - https://www.bleepingcomputer.com/news/security/hackers-abuse-google-command-and-control-red-team-tool-in-attacks/
  - https://attack.mitre.org/techniques/T1102/

response:
  message: >
    Suspicious Non-Browser Network Communication With Google API detected on
    host $agent_name$. Matched data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1102
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_destinationHostname
      type: domain
    - field: data_win_eventdata_image
      type: process

