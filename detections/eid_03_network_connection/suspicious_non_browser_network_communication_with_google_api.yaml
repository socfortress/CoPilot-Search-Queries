name: Suspicious Non-Browser Network Communication With Google API
id: 7e9cf7b6-e827-11ed-a05b-0242ac120003
version: 1
schema_version: "1.0"
date: "2025-02-22"
author: Gavin Knapp
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7e9cf7b6-e827-11ed-a05b-0242ac120003
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a non-browser process interacting with the Google API which could
  indicate the use of a covert C2 such as Google Sheet C2 (GC2-sheet). MITRE
  ATT&CK: T1102.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*drive.googleapis.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*oauth2.googleapis.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*sheets.googleapis.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*www.googleapis.com*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                    - term:
                        data_win_eventdata_image: ""
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\brave.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Google\\\\Chrome\\\\Application\\\\chrome.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Program Files\\\\Google\\\\Drive File Stream\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\GoogleDriveFS.exe"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\Mozilla Firefox\\\\firefox.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Mozilla Firefox\\\\firefox.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Internet Explorer\\\\iexplore.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\Internet Explorer\\\\iexplore.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\maxthon.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeWebView\\\\Application\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Microsoft\\\\Edge\\\\Application\\\\msedge.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\Microsoft\\\\Edge\\\\Application\\\\msedge.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WindowsApps\\\\MicrosoftEdge.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeCore\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*:\\\\Program Files\\\\Microsoft\\\\EdgeCore\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\msedge.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\msedgewebview2.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\opera.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\safari.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\seamonkey.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\vivaldi.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\whale.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\GoogleUpdate.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\outlook.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destinationHostname matches '*drive.googleapis.com*';
  data_win_eventdata_destinationHostname matches '*oauth2.googleapis.com*';
  data_win_eventdata_destinationHostname matches '*sheets.googleapis.com*',
  among other conditions.

known_false_positives: >
  Legitimate applications communicating with the "googleapis.com" endpoints that
  are not already in the exclusion list. This is environmental dependent and
  requires further testing and tuning. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

