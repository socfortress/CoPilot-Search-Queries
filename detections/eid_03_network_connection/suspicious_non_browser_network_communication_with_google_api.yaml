Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Aa][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3dbbc9f-ef1d-470a-a90a-d343448d5875
    name: Suspicious Non-Browser Network Communication With Telegram API
    reason: 'Identical TTP to this alert: a non-browser process using a trusted web service for covert C2 (T1102). A GC2-style implant with a Telegram fallback channel, or a second tool from the same intrusion, trips both on the same host within minutes - co-firing turns a single-service anomaly into a confirmed web-service-C2 incident.'
  - id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
    name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
    reason: 'The direct Azure analogue of this rule: a non-browser process initiating an outbound connection to a trusted cloud host used for malware hosting and exfiltration (T1102/T1102.001). The same implant staging and exfiltrating across clouds fires both.'
  - id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
    name: Suspicious Dropbox API Usage
    reason: A non-Dropbox binary hitting the Dropbox API for ingress-tool-transfer and exfil (T1105/T1567.002). Operators running cloud-service C2 routinely pivot between Google Drive and Dropbox for payload delivery and data theft, so both fire within one intrusion.
  - id: edf3485d-dac4-4d50-90e4-b0e5813f7e60
    name: Suspicious Network Connection to IP Lookup Service APIs
    reason: A non-browser process resolving an external IP-lookup service (T1016) is the victim-profiling/check-in step that accompanies a first C2 beacon; co-firing on the same host corroborates that the Google-API traffic is an implant checking in, not a benign app.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: If the beaconing binary runs from Temp/AppData/ProgramData/Recycle.Bin it fires on the SAME network-connection event and identifies the non-browser process as a dropped implant (T1105) - answering the first triage question this alert raises.
  - id: 20384606-a124-4fec-acbb-8bd373728613
    name: Suspicious Network Connection Binary No CommandLine
    reason: A signed Windows binary (rundll32/regsvr32/etc.) making an outbound connection with no command line is the injected/LOLBin-proxied variant of this same stealth-C2 profile; confirms the implant may be hollowed into a system process rather than a dropped EXE.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: rclone bulk-copying to cloud storage is the collection-and-exfiltration step a cloud C2 channel sets up; its execution on the same host inside the window marks the intrusion progressing from beacon to data theft (T1567.002).
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Implant candidates: processes executed from user-writable / staging directories on this host'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS resolution of Google-API and fallback web-service-C2 domains on this host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Gg][Oo][Oo][Gg][Ll][Ee][Aa][Pp][Ii][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Aa][Pp][Ii]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Aa][Pp][Ii]\.[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\.[Oo][Rr][Gg].*/ OR data_win_eventdata_queryName:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Aa][Zz][Uu][Rr][Ee][Ww][Ee][Bb][Ss][Ii][Tt][Ee][Ss]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_queryName:/.*[Dd][Ii][Ss][Cc][Oo][Rr][Dd][Aa][Pp][Pp]\.[Cc][Oo][Mm].*/)
    pivot_on:
    - host
    window: 1h
  - name: Post-exploitation discovery and shell/LOLBin execution on this host (commands run through the channel)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Aa][Rr][Pp]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Qq][Uu][Ee][Rr][Yy]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy])\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Collection / archiving and cloud-upload exfil tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Aa]|7[Zz][Rr]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.* -[Hh][Pp].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/)
    pivot_on:
    - host
