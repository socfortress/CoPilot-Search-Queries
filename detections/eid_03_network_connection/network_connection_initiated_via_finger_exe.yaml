name: Network Connection Initiated via Finger.EXE
id: 2fdaf50b-9fd5-449f-ba69-f17248119af6
version: 1
schema_version: "1.0"
date: "2025-11-19"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2fdaf50b-9fd5-449f-ba69-f17248119af6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects network connections via finger.exe, which can be abused by threat
  actors to retrieve remote commands for execution on Windows devices. In one
  ClickFix malware campaign, adversaries leveraged the finger protocol to fetch
  commands from a remote server. Since the finger utility is not commonly used
  in modern Windows environments, its presence already raises suspicion.
  Investigating such network connections can also help identify potential
  malicious infrastructure used by threat actors. MITRE ATT&CK: T1071.004,
  T1059.003.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\finger.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_image matches
  '*\finger.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.bleepingcomputer.com/news/security/decades-old-finger-protocol-abused-in-clickfix-malware-attacks/
  - https://attack.mitre.org/techniques/T1071/004/
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Network Connection Initiated via Finger.EXE detected on host $agent_name$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1071.004, T1059.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.004
    - T1059.003
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - command_and_control
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Gg][Ee][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: af491bca-e752-4b44-9c86-df5680533dbc
    name: Finger.EXE Execution
    reason: 'The EID 1 process-creation twin of this exact event: the same finger.exe, moments earlier, with its command line and parent. This network-only alert omits how finger was invoked - pair them to recover the ''finger user@host | cmd/powershell'' one-liner whose pipe target executes the commands finger retrieves.'
  - id: c082c2b0-525b-4dbc-9a26-a57dc4692074
    name: DNS Query by Finger Utility
    reason: 'The resolve half of the resolve-then-connect pair, same finger.exe on this host seconds before: its QueryName is the C2 hostname behind this alert''s destinationIp - the pivot to run against threat intel to name the malicious infrastructure the finger campaign uses.'
  - id: f5fe36cf-f1ec-4c23-903d-09a3110f6bbb
    name: Potential ClickFix Execution Pattern - Registry
    reason: 'The initial-access artifact: a RunMRU registry value holding the pasted one-liner. This rule''s own query explicitly lists ''finger'', so it fires on the exact ClickFix Run-dialog paste that launches this finger retrieval - a direct precursor on the same host.'
  - id: d487ed4a-fd24-436d-a0b2-f4e95f7b2635
    name: Suspicious ClickFix/FileFix Execution Pattern
    reason: 'The documented delivery vector: an explorer-spawned interpreter carrying the fake-CAPTCHA / verify lure text of a ClickFix paste. The reported finger ClickFix campaign arrives this way, so its firing is the social-engineering step that hand-delivered the finger one-liner just before this connection.'
  - id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
    name: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
    reason: The concealment variant of the same ClickFix paste - a '#'-commented command padded with Unicode whitespace to push the finger invocation off-screen. Catches the launching paste when it uses evasion rather than lure keywords; a precursor minutes before this connection.
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: 'The closest behavioural sibling and typical follow-on: another rarely-networked LOLBin opening an outbound connection (EID 3, initiated=true) to pull payload. After finger delivers its commands they commonly certutil-fetch the second stage - the same detection logic, one hop downstream on the same host.'
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: 'The second-stage ingress tool transfer: the commands finger retrieves routinely certutil-download the next-stage binary to disk. Firing on the same host shortly after confirms this connection was a command-retrieval step in a live intrusion, not a dead end.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'The execution follow-on: a scripting host running a dropped payload. The commands finger pipes in frequently stage and launch a wscript/cscript/mshta dropper, so this is the next-stage code execution the finger retrieval sets up on the host.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: finger.exe invoked with its output piped to an interpreter on this host (the execute-fetched-commands mechanism)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Gg][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*\|.*/
    pivot_on:
    - host
    window: 1h
  - name: ClickFix / FileFix Run-dialog paste launching an interpreter or finger on this host (initial access)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ff][Ii][Nn][Gg][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Second-stage download by LOLBins or PowerShell cradles on this host (what the fetched commands pull next)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Proxy-execution / scripting-host / Run-key persistence follow-on on this host (fetched commands staging the next stage)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn].*/))
    pivot_on:
    - host
    window: 2h
  - name: Other hosts initiating a connection to the same destination (finger C2 campaign spread)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
