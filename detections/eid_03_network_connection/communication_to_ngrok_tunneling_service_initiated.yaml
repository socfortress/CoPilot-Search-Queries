name: Communication To Ngrok Tunneling Service Initiated
id: 1d08ac94-400d-4469-a82f-daee9a908849
version: 1
schema_version: "1.0"
date: "2024-02-02"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1d08ac94-400d-4469-a82f-daee9a908849
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an executable initiating a network connection to "ngrok" tunneling
  domains. Attackers were seen using this "ngrok" in order to store their second
  stage payloads and malware. While communication with such domains can be
  legitimate, often times is a sign of either data exfiltration by malicious
  actors or additional download. MITRE ATT&CK: T1567, T1568.002, T1572, T1090,
  T1102.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*tunnel.us.ngrok.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*tunnel.eu.ngrok.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*tunnel.ap.ngrok.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*tunnel.au.ngrok.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*tunnel.sa.ngrok.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*tunnel.jp.ngrok.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*tunnel.in.ngrok.com*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destinationHostname matches '*tunnel.us.ngrok.com*';
  data_win_eventdata_destinationHostname matches '*tunnel.eu.ngrok.com*';
  data_win_eventdata_destinationHostname matches '*tunnel.ap.ngrok.com*', among
  other conditions.

known_false_positives: >
  Legitimate use of the ngrok service. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/hakluke/status/1587733971814977537/photo/1
  - https://ngrok.com/docs/secure-tunnels/tunnels/ssh-reverse-tunnel-agent
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1568/002/
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1090/
  - https://attack.mitre.org/techniques/T1102/

response:
  message: >
    Communication To Ngrok Tunneling Service Initiated detected on host
    $agent_name$. Matched data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1567, T1568.002, T1572, T1090,
    T1102
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_destinationHostname
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567
    - T1568.002
    - T1572
    - T1090
    - T1102
  custom_tags:
    - communication
    - ngrok
    - tunneling
    - network_connection
    - sysmon
    - exfiltration
    - command_and_control
    - s0508
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll]\.[Uu][Ss]\.[Nn][Gg][Rr][Oo][Kk]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Uu]\.[Nn][Gg][Rr][Oo][Kk]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll]\.[Aa][Pp]\.[Nn][Gg][Rr][Oo][Kk]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll]\.[Aa][Uu]\.[Nn][Gg][Rr][Oo][Kk]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ss][Aa]\.[Nn][Gg][Rr][Oo][Kk]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll]\.[Jj][Pp]\.[Nn][Gg][Rr][Oo][Kk]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ii][Nn]\.[Nn][Gg][Rr][Oo][Kk]\.[Cc][Oo][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: 'Process-side of the very same ngrok agent that opened this connection: EventID 1 for ngrok.exe exposes the tunnel subcommand and the internal port being published (e.g. `tcp 3389`), confirming which binary initiated the tunnel and exactly which local service is now reachable off-box.'
  - id: 18249279-932f-45e2-b37a-8925f2597670
    name: Process Initiated Network Connection To Ngrok Domain
    reason: Sibling network detection covering ngrok's control/web domains (ngrok.io/.app/.dev, ngrok-free.*); co-firing on the same host within the window confirms a live, authenticated ngrok agent session rather than an incidental one-off resolution of a tunnel endpoint.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: The dominant purpose of an ngrok tunnel on an endpoint is to forward RDP (3389) over a reverse channel for hands-on access; seen on the same host it shows the just-opened tunnel is being used to carry interactive remote control past the firewall/NAT.
  - id: 51e33403-2a37-4d66-a574-1fda1782cc31
    name: RDP Login from Localhost
    reason: A logonType 10 (RemoteInteractive/RDP) session sourced from 127.0.0.1 or ::1 is the signature of an RDP session delivered through a local tunnel terminator - direct proof the ngrok reverse tunnel was actually used to gain an interactive session on this host.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Opening the host firewall for TCP 3389 via netsh is the enabling step that lets ngrok-tunneled RDP reach the local listener; on the same host it is the precursor that makes the tunneled remote-access usable.
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: Attackers persist reverse tunnels so the foothold survives reboots; a scheduled task launching a reverse tunnel on the same host is the durability step for the exact access this ngrok tunnel just established.
  - id: 32410e29-5f94-4568-b6a3-d91a8adad863
    name: PUA - Fast Reverse Proxy (FRP) Execution
    reason: A second reverse-proxy tunneler (frpc/frps) running on the same host signals a deliberate tunneling toolkit and attacker redundancy, strongly raising confidence that the ngrok connection is an intrusion rather than sanctioned developer use.
  - id: a54f842a-3713-4b45-8c84-5f136fdebd3c
    name: New PortProxy Registry Entry Added
    reason: A netsh portproxy v4tov4\tcp registry entry wires a durable local port-forward that routes the ngrok-exposed port onto an internal service; a co-occurring enabler that extends and persists the off-box exposure this tunnel creates.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ngrok agent execution and the local port it is tunnelling (same host)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] (3389|445|139|22|5985|5986).*/ OR data_win_eventdata_commandLine:/.* [Hh][Tt][Tt][Pp] [0-9].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Tt][Hh][Tt][Oo][Kk][Ee][Nn] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt] --[Aa][Ll][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other reverse-tunnel / port-forward tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ll][Ii][Nn][Kk]|[Ss][Ss][Hh]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Ff][Rr][Pp][Cc]|[Ff][Rr][Pp][Ss]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]|[Ii][Oo][Xx]|[Gg][Oo][Ss][Tt]|[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll]|[Rr][Ee][Vv][Ss][Oo][Cc][Kk][Ss]|3[Pp][Rr][Oo][Xx][Yy])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* -[Rr] [0-9].*:.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ss][Hh].* -[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Yy][Nn][Aa][Mm][Ii][Cc][Ff][Oo][Rr][Ww][Aa][Rr][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: RDP exposed or used through the tunnel on this host (firewall / portproxy / localhost RDP logon)
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"10" AND (data_win_eventdata_ipAddress:"127.0.0.1" OR data_win_eventdata_ipAddress:"::1")) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*3389.*/ AND (data_win_eventdata_commandLine:/.*[Aa][Ll][Ll][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Oo][Pp][Ee][Nn][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Aa][Dd][Dd][Rr][Ee][Ss][Ss].*/)) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_targetObject:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/))
    pivot_on:
    - host
    window: 4h
  - name: DNS resolution of ngrok and alternative tunnelling services on this host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk].*/ OR data_win_eventdata_queryName:/.*[Ee][Qq][Uu][Ii][Nn][Oo][Xx].*/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/ OR data_win_eventdata_queryName:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss].*/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt].*/ OR data_win_eventdata_queryName:/.*[Ss][Ee][Rr][Vv][Ee][Oo].*/ OR data_win_eventdata_queryName:/.*[Pp][Aa][Gg][Ee][Kk][Ii][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other internal hosts beaconing to the same ngrok tunnel endpoint (campaign)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_destinationHostname:/.*[Nn][Gg][Rr][Oo][Kk].*/
    pivot_on:
    - ip
    window: 24h
