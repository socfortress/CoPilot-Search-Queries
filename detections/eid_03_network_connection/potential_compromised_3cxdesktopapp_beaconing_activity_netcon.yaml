correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Any activity involving this address"
      query: '_exists_:srcip OR _exists_:dstip OR _exists_:data_srcip OR _exists_:data_dest_ip'
      pivot_on: [ip]
      window: 1h
    - name: "High-severity alerts involving this address"
      query: 'rule_level:>=10'
      pivot_on: [ip]
      window: 1h
