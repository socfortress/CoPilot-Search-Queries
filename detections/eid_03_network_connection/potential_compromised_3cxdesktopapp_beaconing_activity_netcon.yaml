description: >
  Detects potential beaconing activity to domains related to 3CX 3CXDesktopApp
  compromise.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\3CXDesktopApp.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*akamaicontainer.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*akamaitechcloudservices.com*"
                    case_insensitive: true
              - wildcard:
