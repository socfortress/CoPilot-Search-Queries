type: TTP

description: >
  Detects potential beaconing activity to domains related to 3CX 3CXDesktopApp
  compromise.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\3CXDesktopApp.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*akamaicontainer.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*akamaitechcloudservices.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*azuredeploystore.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*azureonlinecloud.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*azureonlinestorage.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*dunamistrd.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*glcloudservice.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*journalide.org*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*msedgepackageinfo.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*msstorageazure.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*msstorageboxes.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*officeaddons.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*officestoragebox.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*pbxcloudeservices.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*pbxphonenetwork.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*pbxsources.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*qwepoi123098.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*sbmsa.wiki*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*sourceslabs.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*visualstudiofactory.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*zacharryblogs.com*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\3CXDesktopApp.exe';
  data_win_eventdata_destinationHostname matches '*akamaicontainer.com*';
  data_win_eventdata_destinationHostname matches
  '*akamaitechcloudservices.com*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.reddit.com/r/crowdstrike/comments/125r3uu/20230329_situational_awareness_crowdstrike/

response:
  message: >
    Potential Compromised 3CXDesktopApp Beaconing Activity - Netcon detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  custom_tags:
    - compromised
    - 3cxdesktopapp
    - beaconing
    - network_connection
    - sysmon
    - command_and_control
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

