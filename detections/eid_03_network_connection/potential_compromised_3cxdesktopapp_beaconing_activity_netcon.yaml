correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d0b65ad3-e945-435e-a7a9-438e62dd48e9
    name: Malicious DLL Load By Compromised 3CXDesktopApp
    reason: 'Fires moments before this beacon on the same host: 3CXDesktopApp.exe sideloads the trojanized ffmpeg.dll / d3dcompiler_47.dll (matched by the known-bad hashes) whose decrypted shellcode retrieves the C2 list and opens exactly this network connection. It is the compromise mechanism that produces the beacon.'
  - id: bd03a0dc-5d93-49eb-b2e8-2dfd268600f8
    name: Potential Compromised 3CXDesktopApp Beaconing Activity - DNS
    reason: 'Immediate co-occurring sibling: it is the DNS resolution (EID 22) of the very same 3CX C2 domains this netcon (EID 3) connects to. A resolve-then-connect pair on the same host within seconds confirms a live beacon rather than a stale cache entry.'
  - id: 93bbde78-dc86-4e73-9ffc-ff8a384ca89c
    name: Potential Compromised 3CXDesktopApp Execution
    reason: 'Root precursor on the same host: confirms the process doing the beaconing is the known-compromised 3CX build (18.12.407/416) by OriginalFileName/product/image, not an unrelated process reusing the 3CXDesktopApp.exe name.'
  - id: e7581747-1e44-4d4b-85a6-0db0b4a00f2a
    name: Potential Compromised 3CXDesktopApp Update Activity
    reason: 'Initial-access precursor: the 3CX updater (3CXDesktopApp\app\update.exe) pulling the trojanized 18.12 build through the official update channel is how this endpoint became compromised before it ever beaconed.'
  - id: 63f3605b-979f-48c2-b7cc-7f90523fed88
    name: Potential Suspicious Child Process Of 3CXDesktopApp
    reason: 'Expected follow-on: 3CXDesktopApp.exe spawning cmd/powershell/mshta/regsvr32 is the hands-on second stage (e.g. IconicStealer) launched once this beacon establishes C2 — the next step in the same incident on the same host.'
  - id: 553d0429-1a1c-44bf-b3f5-a8513deb9ee5
    name: Hunting 3CXDesktopApp Software
    reason: 'Blast-radius scoping: inventories every endpoint running the 3CX client, so the SOC can size how many hosts the org-wide trojanized build exposed to the same beaconing compromise.'
  - id: 4d16c9a6-4362-4863-9940-1dee35f1d70f
    name: DPRK Threat Actor - C2 Communication DNS Indicators
    reason: 'Same-actor infrastructure co-occurrence: the 3CX/SmoothOperator compromise is DPRK (Labyrinth Chollima). A host that also resolves other known DPRK C2 domains corroborates active operator presence and additional staging infra beyond the supply-chain beacon itself.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Trojanized DLL sideloaded by 3CXDesktopApp on this host (ffmpeg / d3dcompiler_47)
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Ff][Ff][Mm][Pp][Ee][Gg]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Dd]3[Dd][Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]_47\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: 3CXDesktopApp resolving GitHub icon-staging / C2 config infrastructure
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_queryName:/.*[Gg][Ii][Tt][Hh][Uu][Bb][Uu][Ss][Ee][Rr][Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Rr][Aa][Ww]\.[Gg][Ii][Tt][Hh][Uu][Bb].*/ OR data_win_eventdata_queryName:/.*[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]/)
    pivot_on:
    - host
    window: 4h
  - name: Suspicious child process spawned by the beaconing 3CXDesktopApp
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts' 3CXDesktopApp beaconing to this same C2 domain (campaign spread)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/
    pivot_on:
    - domain
    window: 24h
  - name: Browser credential / profile theft after the beacon (IconicStealer objective)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Bb] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Oo][Kk][Ii][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ll][Aa][Cc][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee].*/)
    pivot_on:
    - host
    window: 6h
