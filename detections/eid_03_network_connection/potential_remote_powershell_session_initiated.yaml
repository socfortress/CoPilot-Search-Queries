name: Potential Remote PowerShell Session Initiated
id: c539afac-c12a-46ed-b1bd-5a5567c9f045
version: 1
schema_version: "1.0"
date: "2024-02-02"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c539afac-c12a-46ed-b1bd-5a5567c9f045
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a process that initiated a network connection over ports 5985 or 5986
  from a non-network service account. This could potentially indicates a remote
  PowerShell connection. MITRE ATT&CK: T1059.001, T1021.006.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_destinationPort: "5985"
              - term:
                  data_win_eventdata_destinationPort: "5986"
            minimum_should_match: 1
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - term:
            data_win_eventdata_sourceIsIpv6:
              value: "false"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_user"
        - exists:
            field: "data_win_eventdata_sourceIp"
        - exists:
            field: "data_win_eventdata_destinationIp"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*NETWORK SERVICE*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*NETZWERKDIENST*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*SERVICIO DE RED*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*SERVIZIO DI RETE*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*SERVICE R*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*SEAU*"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_sourceIp: "::1"
                                - term:
                                    data_win_eventdata_sourceIp: "127.0.0.1"
                              minimum_should_match: 1
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_destinationIp: "::1"
                                - term:
                                    data_win_eventdata_destinationIp: "127.0.0.1"
                              minimum_should_match: 1
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Avast Software\\Avast\\AvastSvc.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Avast Software\\Avast\\AvastSvc.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destinationPort
    - data_win_eventdata_initiated
    - data_win_eventdata_sourceIsIpv6
    - data_win_eventdata_user
    - data_win_eventdata_sourceIp
    - data_win_eventdata_destinationIp
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destinationPort equals '5985';
  data_win_eventdata_destinationPort equals '5986'; data_win_eventdata_initiated
  equals 'true', among other conditions.

known_false_positives: >
  Legitimate usage of remote PowerShell, e.g. remote administration and
  monitoring.. Network Service user name of a not-covered localization. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190511-RemotePwshExecution/notebook.html
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1021/006/

response:
  message: >
    Potential Remote PowerShell Session Initiated detected on host $agent_name$.
    Matched data_win_eventdata_destinationPort:
    $data_win_eventdata_destinationPort$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. MITRE ATT&CK: T1059.001, T1021.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_destinationPort
      type: other
    - field: data_win_eventdata_initiated
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1021.006
  custom_tags:
    - powershell
    - session
    - initiated
    - network_connection
    - sysmon
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986") AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_sourceIsIpv6:/[Ff][Aa][Ll][Ss][Ee]/ AND _exists_:data_win_eventdata_user AND _exists_:data_win_eventdata_sourceIp AND _exists_:data_win_eventdata_destinationIp AND NOT (data_win_eventdata_user:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk] [Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_user:/.*[Nn][Ee][Tt][Zz][Ww][Ee][Rr][Kk][Dd][Ii][Ee][Nn][Ss][Tt].*/ OR data_win_eventdata_user:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ii][Oo] [Dd][Ee] [Rr][Ee][Dd].*/ OR data_win_eventdata_user:/.*[Ss][Ee][Rr][Vv][Ii][Zz][Ii][Oo] [Dd][Ii] [Rr][Ee][Tt][Ee].*/ OR (data_win_eventdata_user:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Rr].*/ AND data_win_eventdata_user:/.*[Ss][Ee][Aa][Uu].*/) OR ((data_win_eventdata_sourceIp:"::1" OR data_win_eventdata_sourceIp:"127.0.0.1") AND (data_win_eventdata_destinationIp:"::1" OR data_win_eventdata_destinationIp:"127.0.0.1"))) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Aa][Vv][Aa][Ss][Tt]\\[Aa][Vv][Aa][Ss][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Aa][Vv][Aa][Ss][Tt]\\[Aa][Vv][Aa][Ss][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d4c618e-4716-11ec-951c-3e22fbd008af
    name: Remote Process Instantiation via WinRM and PowerShell Script Block
    reason: Script-block (4104) proof on this same host that Invoke-Command started a process on a remote endpoint over WinRM - the exact cmdlet behind this outbound 5985/5986 connection.
  - id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
    name: Interactive Session on Remote Endpoint with PowerShell
    reason: Enter-PSSession to a remote -ComputerName in this host's script-block logs is the interactive form of the WinRM session this network event records.
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: Evil-WinRM is the offensive WinRM client that produces exactly this outbound 5985/5986 traffic; its presence on this host means the session is attacker tooling, not administration.
  - id: windows-powershell-remote-services-add-trustedhost-001
    name: Powershell Remote Services Add TrustedHost
    reason: Adding a WSMan TrustedHost on this host is the setup step that enables outbound WinRM auth to a non-domain/workgroup target - a direct precursor to this initiated session.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: WinRM authenticates with valid credentials; Invoke-Mimikatz on this host/user is the likely precursor that harvested the account now being used to pivot laterally.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec remote execution from this same pivot host is the co-occurring alternate lateral-movement channel operators mix with WinRM, expanding one alert into a campaign.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: On the destination (shared IP), wsmprovhost.exe spawning PowerShell is the receiving side of this WinRM session - confirmation the remote code execution actually landed on the target.
  - id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
    name: Potential Lateral Movement via Windows Remote Shell
    reason: winrshost.exe spawning a child on the destination is WinRs over the same WinRM transport - a sibling landing signal that the session reached command execution on the target.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell Remoting cmdlets in script-block logging on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ss][Mm]an.*/)
    pivot_on:
    - host
    window: 1h
  - name: WinRM / remote-execution client binaries launched on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Bb][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Cc]ommand.*/ OR data_win_eventdata_commandLine:/.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_commandLine:/.*\/[Nn][Oo][Dd][Ee]:.*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS access or credential-dumping on this host (WinRM auth precursor)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 6h
  - name: This pivot's outbound SMB/RDP/WinRM lateral-movement fan-out
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"135")
    pivot_on:
    - host
    window: 2h
  - name: Other hosts initiating WinRM to the same destination (campaign)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986") AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
