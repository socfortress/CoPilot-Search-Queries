name: Network Connection Initiated To Cloudflared Tunnels Domains
id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
version: 1
schema_version: "1.0"
date: "2024-05-27"
author: Kamran Saifullah, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects network connections to Cloudflared tunnels domains initiated by a
  process on the system. Attackers can abuse that feature to establish a reverse
  shell or persistence on a machine. MITRE ATT&CK: T1567, T1572.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*.v2.argotunnel.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*protocol-v2.argotunnel.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*trycloudflare.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*update.argotunnel.com"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches '*.v2.argotunnel.com';
  data_win_eventdata_destinationHostname matches '*protocol-v2.argotunnel.com',
  among other conditions.

known_false_positives: >
  Legitimate use of cloudflare tunnels will also trigger this. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://defr0ggy.github.io/research/Abusing-Cloudflared-A-Proxy-Service-To-Host-Share-Applications/
  - https://www.guidepointsecurity.com/blog/tunnel-vision-cloudflared-abused-in-the-wild/
  - Internal Research
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Network Connection Initiated To Cloudflared Tunnels Domains detected on host
    $agent_name$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1567, T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567
    - T1572
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - exfiltration
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationHostname:/.*\.[Vv]2\.[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll]-[Vv]2\.[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Uu][Pp][Dd][Aa][Tt][Ee]\.[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 222129f7-f4dc-4568-b0d2-22440a9639ba
    name: Cloudflared Quick Tunnel Execution
    reason: 'The process that opens this connection: a free TryCloudflare quick tunnel generates the random *.trycloudflare.com host this rule matched (Akira-observed). If it fired on this host in-window, the EID 3 connection is a confirmed quick-tunnel, not incidental Cloudflare traffic.'
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: The `cloudflared ... tunnel run` execution that dials back to a named tunnel this rule saw on the wire - a direct process-to-network pairing confirming the outbound reverse tunnel used for persistent remote access.
  - id: e0c69ebd-b54f-4aed-8ae3-e3467843f3f0
    name: Renamed Cloudflared.EXE Execution
    reason: Operators rename cloudflared to defeat image-name detection; this network rule is the backstop that still catches the argotunnel traffic. Both firing on one host means evasive cloudflared, high confidence.
  - id: a1d9eec5-33b2-4177-8d24-27fe754d0812
    name: Cloudflared Tunnels Related DNS Requests
    reason: The DNS resolution of the same argotunnel/trycloudflare domains one event before this connect - the immediately-preceding link in the same resolve-then-connect chain on this host.
  - id: 7050bba1-1aed-454e-8f73-3f46f09ce56a
    name: Cloudflared Tunnel Connections Cleanup
    reason: A later `cloudflared tunnel cleanup` run tears down and clears tunnel state - an anti-forensics follow-on that marks the end of the session this connection opened.
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Same reverse-tunnel TTP via an alternate provider; operators routinely fall back to ngrok when one edge is blocked. Both from one host in-window widens this into a deliberate tunnelling campaign, not a one-off.
  - id: 4b657234-038e-4ad5-997c-4be42340bce4
    name: Network Connection Initiated To Visual Studio Code Tunnels Domain
    reason: Interchangeable abuse of VS Code dev-tunnels for the same reverse-shell/persistence goal; co-occurrence on the host signals the actor is cycling through multiple tunnel brokers for resilient C2.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: 'The payoff: a reverse SSH tunnel forwarding :3389 for interactive access - what these quick tunnels are typically stood up to expose (RDP/SSH/SMB). Its presence shows the tunnel is being used for hands-on-keyboard access.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cloudflared tunnel process executed on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll] --[Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll] [Rr][Uu][Nn].*/))
    pivot_on:
    - host
    window: 2h
  - name: DNS resolution of Cloudflare tunnel domains on this host
    query: (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/))
    pivot_on:
    - host
    window: 2h
  - name: Alternate reverse-tunnel brokers reached from this host
    query: ((data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_destinationHostname:/.*[Nn][Gg][Rr][Oo][Kk].*/ OR data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk].*/ OR data_win_eventdata_destinationHostname:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/ OR data_win_eventdata_queryName:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt].*/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt].*/ OR data_win_eventdata_destinationHostname:/.*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]\.[Rr][Uu][Nn]/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]\.[Rr][Uu][Nn]/))
    pivot_on:
    - host
    window: 4h
  - name: Local RDP/SSH/SMB service exposed or forwarded through a tunnel on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*--[Uu][Rr][Ll].*(127\.0\.0\.1|[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|[Rr][Dd][Pp]:\/\/|[Ss][Ss][Hh]:\/\/|[Tt][Cc][Pp]:\/\/).*/ OR data_win_eventdata_commandLine:/.* -[LlRr] .*:(3389|445|5985|5986|139).*/ OR data_win_eventdata_commandLine:/.*(127\.0\.0\.1|[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]):(3389|445|5985|5986).*/))
    pivot_on:
    - host
    window: 2h
  - name: Cloudflared binary downloaded or dropped onto this host
    query: ((data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd].*\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd].*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]\/[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/) AND (data_win_eventdata_image:/.*\\([Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ii][Ww][Rr] ).*/)))
    pivot_on:
    - host
    window: 6h
