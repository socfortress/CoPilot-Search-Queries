Dd][Ss][Pp][Aa][Cc][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee]\.[Gg][Oo][Oo][Gg][Ll][Ee][Aa][Pp][Ii][Ss]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Ss][Tt][Oo][Rr][Jj][Ss][Hh][Aa][Rr][Ee]\.[Ii][Oo]/ OR data_win_eventdata_destinationHostname:/.*[Ss][Uu][Pp][Aa][Bb][Aa][Ss][Ee]\.[Cc][Oo]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Uu][Ff][Ii][Ll][Ee]\.[Ii][Oo]/ OR data_win_eventdata_destinationHostname:/.*[Ww]3[Ss][Pp][Aa][Cc][Ee][Ss]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Ww][Oo][Rr][Kk][Ee][Rr][Ss]\.[Dd][Ee][Vv]/ OR data_win_eventdata_destinationHostname:/.*[Xx]0\.[Aa][Tt]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: 'The EID 1 process-creation counterpart of this EID 3 alert: it fires on the launch of a binary from these same world-writable/uncommon folders and carries the command line, parent process and hashes the network event lacks. Pull it first to identify the process that is beaconing.'
  - id: 5ce0f04e-3efc-42af-839d-5b3a543b76c0
    name: Suspicious Process Execution From Fake Recycle.Bin Folder
    reason: Execution from a fake $Recycle.bin directory, a location in this rule's own list used to dodge AV. If the process now calling out lives under $Recycle.bin, this confirms it was deliberately staged there for evasion.
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: A \Users\Public parent spawning shell/scripting children. For a Public-folder payload (one of this rule's locations) it gives the parent/child lineage behind the process initiating the outbound connection.
  - id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
    name: Suspicious Binaries and Scripts in Public Folder
    reason: 'The on-disk drop: an executable/script written into \Users\Public (an uncommon location in this rule). If the beaconing image sits in Public, this EID 11 event is how it landed before it ran and called home.'
  - id: bbb7e38c-0b41-4a11-b306-d2a457b7ac2b
    name: Suspicious File Created In PerfLogs
    reason: The drop into C:\PerfLogs, a directory in this rule's list that normally holds only .etl files. A payload staged here that then beacons out is the precursor file-create on the same host for this alert.
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: 'Certutil reaching out is the classic ingress-tool-transfer LOLBin, a sibling EID 3 network anomaly: it is either how this suspicious-location payload was fetched to disk, or the beacon pulling its next stage on the same host.'
  - id: f356a9c4-effd-4608-bbf8-408afd5cd006
    name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
    reason: If the uncommon-location binary is a C2 implant, its beacon surfaces as Cobalt Strike-style DNS queries on the same host, giving co-occurring confirmation that the outbound connection this rule caught is command-and-control, not a one-off.
  - id: 424273ea-7cf8-43a6-b712-375f925e481f
    name: Scheduled Task Executed From A Suspicious Location
    reason: 'Follow-on persistence: a scheduled task launching a program from a suspicious path (this rule even keys on \Windows\Tasks and \System32\Tasks). Indicates the attacker is pinning the beaconing payload to survive reboot.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process-creation record for the binary running from an uncommon location (identify the beaconing process)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*:\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn].*/ OR data_win_eventdata_image:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_image:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\.*/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Yy][Ss][Tt][Ee][Mm][Pp][Rr][Oo][Ff][Ii][Ll][Ee]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Dd][Dd][Ii][Nn][Ss]\\.*/)
    pivot_on:
    - host
