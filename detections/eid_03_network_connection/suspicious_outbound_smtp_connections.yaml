name: Suspicious Outbound SMTP Connections
id: 9976fa64-2804-423c-8a5b-646ade840773
version: 1
schema_version: "1.0"
date: "2022-09-21"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9976fa64-2804-423c-8a5b-646ade840773
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may steal data by exfiltrating it over an un-encrypted network
  protocol other than that of the existing command and control channel. The data
  may also be sent to an alternate network location from the main command and
  control server. MITRE ATT&CK: T1048.003.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_destinationPort: "25"
              - term:
                  data_win_eventdata_destinationPort: "587"
              - term:
                  data_win_eventdata_destinationPort: "465"
              - term:
                  data_win_eventdata_destinationPort: "2525"
            minimum_should_match: 1
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\thunderbird.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\outlook.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\Microsoft\\\\Exchange Server\\\\*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\WindowsApps\\\\microsoft.windowscommunicationsapps_*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\HxTsr.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destinationPort
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destinationPort equals '25';
  data_win_eventdata_destinationPort equals '587';
  data_win_eventdata_destinationPort equals '465', among other conditions.

known_false_positives: >
  Other SMTP tools. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1048.003/T1048.003.md#atomic-test-5---exfiltration-over-alternative-protocol---smtp
  - https://www.ietf.org/rfc/rfc2821.txt
  - https://attack.mitre.org/techniques/T1048/003/

response:
  message: >
    Suspicious Outbound SMTP Connections detected on host $agent_name$. Matched
    data_win_eventdata_destinationPort: $data_win_eventdata_destinationPort$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$. MITRE
    ATT&CK: T1048.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_destinationPort
      type: other
    - field: data_win_eventdata_initiated
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048.003
  custom_tags:
    - outbound
    - connections
    - network_connection
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"25" OR data_win_eventdata_destinationPort:"587" OR data_win_eventdata_destinationPort:"465" OR data_win_eventdata_destinationPort:"2525") AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Tt][Hh][Uu][Nn][Dd][Ee][Rr][Bb][Ii][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee] [Ss][Ee][Rr][Vv][Ee][Rr]\\.*/ OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Cc][Oo][Mm][Mm][Uu][Nn][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss][Aa][Pp][Pp][Ss]_.*/ AND data_win_eventdata_image:/.*\\[Hh][Xx][Tt][Ss][Rr]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 312d0384-401c-4b8b-abdf-685ffba9a332
    name: Email Exifiltration Via Powershell
    reason: 'Likely the exact process behind this SMTP connection: PowerShell harvesting mailbox/SMTP addresses (Get-Recipient, SmtpAddress) to mail stolen data out (DEV-0270 pattern) - process-creation twin of this network detection on the same host.'
  - id: 2837e152-93c8-43d2-85ba-c3cd3c2ae614
    name: Powershell Local Email Collection
    reason: 'Precursor collection (T1114.001): harvests local Outlook mail via Interop.Outlook; the stolen mailbox data is what a non-mail process then exfiltrates over SMTP.'
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: 'Precursor collection (T1119): bulk automated gathering of internal files on the same host immediately before the data is mailed out.'
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Staging step (T1560.001): password-locked 7-Zip archive of collected data is the bundle a non-mail process then ships out over SMTP - stage directly precedes this exfil.'
  - id: afe52666-401e-4a02-b4ff-5d128990b8cb
    name: Suspicious Greedy Compression Using Rar.EXE
    reason: 'Staging step (T1560): recursive password-protected RAR of system/staging folders; the archive produced is the payload of this SMTP exfiltration.'
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Co-occurring exfil over an additional channel (CLI web-request upload) from the same host - points to a multi-channel exfiltration, not an isolated SMTP send.
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: 'Sibling exfiltration-over-alternative-protocol (T1048.001 DNS vs this rule''s T1048.003 SMTP): the same actor falling back to DNS to move data when SMTP is blocked.'
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Co-occurring attacker-controlled egress/tunnel (EID 3 network sibling) used for exfiltration or second-stage pull - corroborates unauthorized outbound data movement from this host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mail-sending tooling or scripting executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Bb][Ll][Aa][Tt]\.[Ee][Xx][Ee]|\\[Ss][Ee][Nn][Dd][Ee][Mm][Aa][Ii][Ll]\.[Ee][Xx][Ee]|\\[Mm][Aa][Ii][Ll][Ss][Ee][Nn][Dd]\.[Ee][Xx][Ee]|\\[Bb][Mm][Aa][Ii][Ll]\.[Ee][Xx][Ee]|\\[Ss][Ww][Aa][Kk][Ss]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Dd]-[Mm][Aa][Ii][Ll][Mm][Ee][Ss][Ss][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Mm][Aa][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Mm][Tt][Pp][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Ii][Ll][Mm][Ee][Ss][Ss][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Ss][Mm][Tt][Pp][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Ii][Ll][Kk][Ii][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell SMTP mail-send code in script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Nn][Dd]-[Mm][Aa][Ii][Ll][Mm][Ee][Ss][Ss][Aa][Gg][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Mm][Aa][Ii][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Mm][Tt][Pp][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Aa][Ii][Ll][Mm][Ee][Ss][Ss][Aa][Gg][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Ss][Ss][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*-[Ss][Mm][Tt][Pp][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ee][Ll][Ii][Vv][Ee][Rr][Yy][Mm][Ee][Tt][Hh][Oo][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Data archived / password-staged on this host (exfil payload)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\7[Zz][Aa]\.[Ee][Xx][Ee]|\\7[Zz][Rr]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Zz][Zz][Ii][Pp]\.[Ee][Xx][Ee]|\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*\.7[Zz].*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.* -[Hh][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Additional outbound upload / egress channels on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ee][Gg][Aa][Cc][Mm][Dd]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other hosts making outbound SMTP to the same destination (campaign)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationPort:"25" OR data_win_eventdata_destinationPort:"587" OR data_win_eventdata_destinationPort:"465" OR data_win_eventdata_destinationPort:"2525")
    pivot_on:
    - ip
    window: 24h
