name: RDP to HTTP or HTTPS Target Ports
id: b1e5da3b-ca8e-4adf-915c-9921f3d85481
version: 1
schema_version: "1.0"
date: "2022-07-14"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b1e5da3b-ca8e-4adf-915c-9921f3d85481
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects svchost hosting RDP termsvcs communicating to target systems on TCP
  port 80 or 443. MITRE ATT&CK: T1572, T1021.001.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - term:
            data_win_eventdata_sourcePort: "3389"
        - bool:
            should:
              - term:
                  data_win_eventdata_destinationPort: "80"
              - term:
                  data_win_eventdata_destinationPort: "443"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_initiated
    - data_win_eventdata_sourcePort
    - data_win_eventdata_destinationPort
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\svchost.exe'; data_win_eventdata_initiated
  equals 'true'; data_win_eventdata_sourcePort equals '3389', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/tekdefense/status/1519711183162556416?s=12&t=OTsHCBkQOTNs1k3USz65Zg
  - https://www.mandiant.com/resources/bypassing-network-restrictions-through-rdp-tunneling
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    RDP to HTTP or HTTPS Target Ports detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_initiated: $data_win_eventdata_initiated$. MITRE ATT&CK:
    T1572, T1021.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_initiated
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1572
    - T1021.001
  custom_tags:
    - https
    - target
    - ports
    - network_connection
    - sysmon
    - command_and_control
    - lateral_movement
    - car_2013_07_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_sourcePort:"3389" AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: 'Direct precursor and most likely cause: plink -R forwarding local 3389 over a web port is the canonical tool in the Mandiant RDP-tunneling technique this rule references, and its execution is exactly what makes svchost/termsvcs egress to 80/443.'
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: 'Direct precursor: ssh.exe reverse-forwarding :3389 relays the RDP service out over 80/443 - the same tunnel this rule observes leaving the host, seen from the process-creation side.'
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: 'Precursor: generic SSH-utility setup of a reverse RDP tunnel; broadens coverage of the tool that established the 3389-over-web-port relay this egress is carrying.'
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: 'Living-off-the-land precursor: netsh portproxy of port 3389 is the native-tooling alternative to plink/ssh for building the same 3389->remote forward that produces this outbound connection.'
  - id: a54f842a-3713-4b45-8c84-5f136fdebd3c
    name: New PortProxy Registry Entry Added
    reason: 'Persistent precursor artifact: the Services\PortProxy\v4tov4 registry entry that backs a netsh 3389 port-forward; its presence on the host confirms the forward driving this egress was configured.'
  - id: a2863fbc-d5cb-48d5-83fb-d976d4b1743b
    name: RDP Sensitive Settings Changed to Zero
    reason: 'Enablement precursor: setting fDenyTSConnections=0 turns the RDP (termsvcs) service on so it can be relayed; a common setup step before tunnelling RDP into or out of the host.'
  - id: 5bed80b6-b3e8-428e-a3ae-d3c757589e41
    name: RDP over Reverse SSH Tunnel WFP
    reason: 'Closest sibling - same behaviour, different sensor: detects svchost/termsvcs RDP talking to the loopback address (the local tunnel endpoint) via WFP; firing alongside this rule confirms the reverse-RDP-tunnel from the security-event-log vantage.'
  - id: 51e33403-2a37-4d66-a574-1fda1782cc31
    name: RDP Login from Localhost
    reason: 'Follow-on payoff: a tunnelled RDP session lands as a logon sourced from 127.0.0.1; its appearance on the same host confirms an attacker is now interactively logged in through this tunnel.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reverse-tunnel / port-forwarding tooling staged on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]|\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|\\[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee]|\\[Ii][Oo][Xx]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy]|:3389|=3389).*/))
    pivot_on:
    - host
    window: 2h
  - name: Native RDP enablement, firewall-open and portproxy setup on this host
    query: (data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*3389.*/ OR data_win_eventdata_commandLine:/.*[Rr][Dd][Pp]-[Tt][Cc][Pp].*[Pp][Oo][Rr][Tt][Nn][Uu][Mm][Bb][Ee][Rr].*/ OR ((data_win_system_eventID:"13" OR data_win_system_eventID:"12" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/)))
    pivot_on:
    - host
    window: 6h
  - name: LSASS access and credential-dump tooling on this host
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]).*/)))
    pivot_on:
    - host
    window: 6h
  - name: Lateral-movement and RDP-session follow-on from this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|\\[Tt][Ss][Cc][Oo][Nn]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn]).*/)))
    pivot_on:
    - host
    window: 2h
  - name: Other internal hosts relaying RDP to the same destination (campaign)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_sourcePort:"3389" OR data_win_eventdata_destinationPort:"3389"))
    pivot_on:
    - ip
    window: 24h
