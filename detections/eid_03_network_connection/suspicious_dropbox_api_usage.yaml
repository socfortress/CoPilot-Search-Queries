name: Suspicious Dropbox API Usage
id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
version: 1
schema_version: "1.0"
date: "2022-04-20"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an executable that isn't dropbox but communicates with the Dropbox
  API. MITRE ATT&CK: T1105, T1567.002.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*api.dropboxapi.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*content.dropboxapi.com"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Dropbox*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches '*api.dropboxapi.com';
  data_win_eventdata_destinationHostname matches '*content.dropboxapi.com',
  among other conditions.

known_false_positives: >
  Legitimate use of the API with a tool that the author wasn't aware of.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://app.any.run/tasks/7e906adc-9d11-447f-8641-5f40375ecebb
  - https://www.zscaler.com/blogs/security-research/new-espionage-attack-molerats-apt-targeting-users-middle-east
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1567/002/

response:
  message: >
    Suspicious Dropbox API Usage detected on host $agent_name$. Matched
    data_win_eventdata_initiated: $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1105, T1567.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
    - T1567.002
  custom_tags:
    - dropbox
    - network_connection
    - sysmon
    - command_and_control
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationHostname:/.*[Aa][Pp][Ii]\.[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Aa][Pp][Ii]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Aa][Pp][Ii]\.[Cc][Oo][Mm]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3dbbc9f-ef1d-470a-a90a-d343448d5875
    name: Suspicious Non-Browser Network Communication With Telegram API
    reason: 'Exact sibling behaviour: a non-browser process reaching a legitimate cloud web-service API for covert C2/exfil over Sysmon EID 3. Actors who abuse Dropbox (e.g. MoleRats) routinely run a parallel Telegram channel on the same host, so this firing alongside strongly corroborates web-service C2 or cloud exfil rather than a benign integration.'
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Collection/staging precursor: data compressed and password-locked on the host is the step that immediately precedes pushing it to Dropbox (T1560.001 -> T1567.002). Seeing it just before this alert reframes the Dropbox traffic as deliberate exfiltration of staged data.'
  - id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
    name: Compress Data and Lock With Password for Exfiltration With WINZIP
    reason: 'Staging precursor, WinZip variant: the other common password-protect archiver used to collect and encrypt data before cloud upload. Covers the case the operator staged with WinZip rather than 7-Zip ahead of the Dropbox exfil.'
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Same exfiltration-to-cloud behaviour (T1567.002) via a different carrier (curl upload). On the same host it confirms intentional cloud exfil and often reveals a second egress path the Dropbox channel is only one part of.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Co-occurring CLI utilities exfiltrating over web requests. It corroborates the exfil reading of the Dropbox connection and names the actual tool/command driving the upload, which the network event alone does not show.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Ingress precursor on the T1105 branch: the download cradle that fetched and launched the non-Dropbox binary now talking to the Dropbox API. It pins how the connecting process arrived on the host before it used Dropbox as a payload/C2 channel.'
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: 'Parallel ingress-tool-transfer over the same Sysmon EID 3 outbound family: a LOLBin pulling payloads at the same time indicates a staged tool-delivery chain running alongside the Dropbox channel rather than a one-off.'
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Follow-on persistence: a payload pulled through the Dropbox channel typically lands in a Download or temp directory and registers Run-key persistence from there. Firing shortly after this alert escalates ingress into an established foothold.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DNS resolution of the Dropbox API hostnames on this host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Aa][Pp][Ii]\.[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Aa][Pp][Ii]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Aa][Pp][Ii]\.[Cc][Oo][Mm]/)
    pivot_on:
    - host
    window: 1h
  - name: 'Collection staging: password-protected archiving on this host'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|7[Zz][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Zz][Zz][Ii][Pp]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.* -[Hh][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Staged archive files written to dropper-favored directories on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(7[Zz]|[Rr][Aa][Rr]|[Zz][Ii][Pp]|[Tt][Aa][Rr]|[Gg][Zz]|[Cc][Aa][Bb])/ AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Parallel web-service C2 / cloud-exfil channels contacted from this host
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3") AND (data_win_eventdata_queryName:/.*([Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]|[Dd][Ii][Ss][Cc][Oo][Rr][Dd]|[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]|[Mm][Ee][Gg][Aa]\.[Nn][Zz]|[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]|[Ff][Ii][Ll][Ee]\.[Ii][Oo])/ OR data_win_eventdata_destinationHostname:/.*([Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]|[Dd][Ii][Ss][Cc][Oo][Rr][Dd]|[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]|[Mm][Ee][Gg][Aa]\.[Nn][Zz]|[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]|[Ff][Ii][Ll][Ee]\.[Ii][Oo])/)
    pivot_on:
    - host
    window: 2h
  - name: Office / script-host spawned child processes on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
