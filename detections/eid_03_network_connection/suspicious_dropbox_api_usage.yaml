name: Suspicious Dropbox API Usage
id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
version: 1
schema_version: "1.0"
date: "2022-04-20"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an executable that isn't dropbox but communicates with the Dropbox
  API. MITRE ATT&CK: T1105, T1567.002.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*api.dropboxapi.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*content.dropboxapi.com"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Dropbox*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches '*api.dropboxapi.com';
  data_win_eventdata_destinationHostname matches '*content.dropboxapi.com',
  among other conditions.

known_false_positives: >
  Legitimate use of the API with a tool that the author wasn't aware of.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://app.any.run/tasks/7e906adc-9d11-447f-8641-5f40375ecebb
  - https://www.zscaler.com/blogs/security-research/new-espionage-attack-molerats-apt-targeting-users-middle-east
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1567/002/

response:
  message: >
    Suspicious Dropbox API Usage detected on host $agent_name$. Matched
    data_win_eventdata_initiated: $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1105, T1567.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
    - T1567.002
  custom_tags:
    - dropbox
    - network_connection
    - sysmon
    - command_and_control
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationHostname:/.*[Aa][Pp][Ii]\.[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Aa][Pp][Ii]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Aa][Pp][Ii]\.[Cc][Oo][Mm]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx].*/)

correlation:
