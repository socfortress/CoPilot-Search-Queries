name: Uncommon Network Connection Initiated By Certutil.EXE
id: 0dba975d-a193-4ed1-a067-424df57570d1
version: 1
schema_version: "1.0"
date: "2024-05-31"
author: frack113, Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0dba975d-a193-4ed1-a067-424df57570d1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a network connection initiated by the certutil.exe utility. Attackers
  can abuse the utility in order to download malware or additional payloads.
  MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\certutil.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_destinationPort: "80"
              - term:
                  data_win_eventdata_destinationPort: "135"
              - term:
                  data_win_eventdata_destinationPort: "443"
              - term:
                  data_win_eventdata_destinationPort: "445"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationPort
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\certutil.exe';
  data_win_eventdata_initiated equals 'true'; data_win_eventdata_destinationPort
  equals '80', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Uncommon Network Connection Initiated By Certutil.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_initiated: $data_win_eventdata_initiated$. MITRE
    ATT&CK: T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_initiated
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - uncommon
    - network
    - connection
    - network_connection
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"445")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: 'Process-creation (EID 1) view of the very download this EID 3 connection caught: certutil run with -urlcache/-verifyctl/-url plus an http URL. Its command line reveals the download URL and the output file path that the bare network event hides.'
  - id: 13e6fe51-d478-4c7e-b0f2-6da9b400a829
    name: Suspicious File Downloaded From Direct IP Via Certutil.EXE
    reason: Same certutil download, but the target is a hard-coded IP with no domain - a strong sign this is attacker staging/C2 rather than the benign CRL/OCSP fetch the port 80/443 match would otherwise excuse.
  - id: 42a5f1e7-9603-4f6d-97ae-3f37d130d794
    name: Suspicious File Downloaded From File-Sharing Website Via Certutil.EXE
    reason: Same certutil download resolved to a file-sharing host (mega/anonfiles/transfer.sh and the like); identifies the payload-hosting infrastructure sitting behind this outbound connection.
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: 'Certutil''s typical next move after a download: -decode/-decodehex reconstructs the real executable from the base64/hex blob just pulled over the wire, slipping the payload past content inspection before it is run.'
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Sibling ingress-transfer LOLBin; actors fall back to bitsadmin /transfer when certutil is AV-flagged or blocked, so both firing on one host in the window marks a deliberate tool-transfer effort rather than a one-off.
  - id: c7e91a02-d771-4a6d-a700-42587e0b1095
    name: Network Connection Initiated By Regsvr32.EXE
    reason: Identical 'uncommon LOLBin phoning out' pattern (EID 3, initiated=true) via regsvr32; co-occurrence on the same host points to a LOLBin-driven stager/C2 toolkit rather than isolated noise.
  - id: Windows-Office-Product-Spawned-Child-Process-For-Download
    name: Windows Office Product Spawned Child Process For Download
    reason: 'Upstream delivery: a malicious Office document spawning a downloader child with an http(s) URL is the classic parent that launches certutil - finding it names the phishing entry point for this transfer.'
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Downstream persistence: a Run key created by a binary sitting in Downloads/Outlook-temp directories is how the payload certutil just fetched survives reboot - its appearance confirms the download delivered a live implant.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certutil download command line on this host (URL + output path)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ee][Rr][Ii][Ff][Yy][Cc][Tt][Ll].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: Certutil decode of the downloaded blob on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Cc][Oo][Dd][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts connecting outbound to the same download server (campaign)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
  - name: Payload executed from a user-writable staging directory on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Run-key or scheduled-task persistence established on this host
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
