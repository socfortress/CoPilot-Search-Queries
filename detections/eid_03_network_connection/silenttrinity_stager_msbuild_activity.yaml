name: Silenttrinity Stager Msbuild Activity
id: 50e54b8d-ad73-43f8-96a1-5191685b17a4
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Kiran kumar s, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 50e54b8d-ad73-43f8-96a1-5191685b17a4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a possible remote connections to Silenttrinity c2. MITRE ATT&CK:
  T1127.001.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\msbuild.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_destinationPort: "80"
              - term:
                  data_win_eventdata_destinationPort: "443"
            minimum_should_match: 1
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_destinationPort
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\msbuild.exe';
  data_win_eventdata_destinationPort equals '80';
  data_win_eventdata_destinationPort equals '443', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.blackhillsinfosec.com/my-first-joyride-with-silenttrinity/
  - https://attack.mitre.org/techniques/T1127/001/

response:
  message: >
    Silenttrinity Stager Msbuild Activity detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_destinationPort: $data_win_eventdata_destinationPort$.
    MITRE ATT&CK: T1127.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_destinationPort
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127.001
  custom_tags:
    - silenttrinity
    - stager
    - msbuild
    - network_connection
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443") AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/

correlation:
