name: Silenttrinity Stager Msbuild Activity
id: 50e54b8d-ad73-43f8-96a1-5191685b17a4
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Kiran kumar s, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 50e54b8d-ad73-43f8-96a1-5191685b17a4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a possible remote connections to Silenttrinity c2. MITRE ATT&CK:
  T1127.001.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\msbuild.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_destinationPort: "80"
              - term:
                  data_win_eventdata_destinationPort: "443"
            minimum_should_match: 1
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_destinationPort
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationIp
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\msbuild.exe';
  data_win_eventdata_destinationPort equals '80';
  data_win_eventdata_destinationPort equals '443', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.blackhillsinfosec.com/my-first-joyride-with-silenttrinity/
  - https://attack.mitre.org/techniques/T1127/001/

response:
  message: >
    Silenttrinity Stager Msbuild Activity detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_destinationPort: $data_win_eventdata_destinationPort$.
    MITRE ATT&CK: T1127.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_destinationPort
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127.001
  custom_tags:
    - silenttrinity
    - stager
    - msbuild
    - network_connection
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443") AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 213b3148-24ea-11ec-93a2-acde48001122
    name: MSBuild Suspicious Spawned By Script Process
    reason: 'Precursor / how msbuild got on the network: this flags msbuild.exe spawned by a Windows Script Host parent (wscript/cscript) - the phishing .vbs/.js delivery stage that drops and runs the inline-task project. The msbuild.exe it names is the very process that then opens this 80/443 C2 socket.'
  - id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
    name: Suspicious Msbuild Execution By Uncommon Parent Process
    reason: 'Precursor / generalized launch: msbuild.exe started by a non-Visual-Studio parent (cmd, powershell, Office). It is the process-creation half of this same abuse - the launch that this network-connection alert is the outbound beacon of.'
  - id: 03552375-cc2c-4883-bbe4-7958d5a980be
    name: HackTool - SILENTTRINITY Stager Execution
    reason: 'Same intrusion, process view: matches the st2stager PE metadata (data_win_eventdata_description *st2stager*) on the host. Our alert is the stager''s C2 callback; this is the SILENTTRINITY stager process itself - they land on the same host within seconds.'
  - id: 75c505b1-711d-4f68-a357-8c3fe37dbf2d
    name: HackTool - SILENTTRINITY Stager DLL Load
    reason: 'Same intrusion, in-memory confirmation: the st2stager .NET DLLs loading (EID 7) prove the SILENTTRINITY payload MSBuild compiled is actually executing in memory - not merely that msbuild touched the network.'
  - id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    reason: 'Sibling LOLBAS vector: dotnet.exe running arbitrary code from a .csproj is the same trusted-.NET-build-tool-executes-a-project-file abuse as MSBuild. Its appearance on the same host points to the same operator reaching for an alternate signed build-tool proxy.'
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: 'Follow-on objective: once the SILENTTRINITY beacon is live, the operator''s canonical next move is LSASS credential theft (a remote thread into lsass.exe). Seeing it on the same host within the window turns a C2 foothold into confirmed hands-on-keyboard credential access.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MSBuild launched with a project/XML file argument (inline-task proxy exec on this host)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\.[Cc][Ss][Pp][Rr][Oo][Jj].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Rr][Oo][Jj].*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Aa][Rr][Gg][Ee][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Ss][Ll][Nn].*/ OR data_win_eventdata_commandLine:/.*\.[Xx][Mm][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Malicious MSBuild project file (.csproj/.proj/.targets/.sln/.xml) written to a user-writable path
    query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*\.[Cc][Ss][Pp][Rr][Oo][Jj]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Rr][Oo][Jj]/ OR data_win_eventdata_targetFilename:/.*\.[Tt][Aa][Rr][Gg][Ee][Tt][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Ll][Nn]/) OR (data_win_eventdata_targetFilename:/.*\.[Xx][Mm][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)))
    pivot_on:
    - host
    window: 4h
  - name: Child processes spawned by MSBuild.exe (stager detonation / payload hand-off)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other hosts initiating web-port connections to the same C2 address (campaign spread)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443")
    pivot_on:
    - ip
    window: 24h
  - name: C2 domain resolved by MSBuild or the script-interpreter/LOLBin chain on this host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
