name: Network Connection Initiated By Eqnedt32.EXE
id: a66bc059-c370-472c-a0d7-f8fd1bf9d583
version: 1
schema_version: "1.0"
date: "2024-05-31"
author: Max Altgelt (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a66bc059-c370-472c-a0d7-f8fd1bf9d583
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects network connections from the Equation Editor process "eqnedt32.exe".
  MITRE ATT&CK: T1203.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\eqnedt32.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_image matches '*\eqnedt32.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/forensicitguy/status/1513538712986079238
  - https://forensicitguy.github.io/xloader-formbook-velvetsweatshop-spreadsheet/
  - https://news.sophos.com/en-us/2019/07/18/a-new-equation-editor-exploit-goes-commercial-as-maldoc-attacks-using-it-spike/
  - https://attack.mitre.org/techniques/T1203/

response:
  message: >
    Network Connection Initiated By Eqnedt32.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_destinationIp: $data_win_eventdata_destinationIp$. MITRE
    ATT&CK: T1203
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_destinationIp
      type: ip_address

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1203
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ee][Qq][Nn][Ee][Dd][Tt]32\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Equation Editor legitimately never spawns child processes; this rule fires when eqnedt32.exe (an explicit parent in it) launches a LOLBin like cmd/powershell/certutil/mshta. Paired with the network connection it confirms the CVE-2017-11882 shellcode dropped and executed the downloaded second stage.
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Also lists eqnedt32.exe among exploited Office parents (path-traversal child, CVE-2021-40444/2022-30190). A hit on the same host corroborates active client-side exploitation of the Office suite rather than a benign equation render.
  - id: Windows-Office-Product-Spawned-Child-Process-For-Download
    name: Windows Office Product Spawned Child Process For Download
    reason: The malicious document's Office parent (Word/Excel) spawning a child carrying an http(s) URL is the payload-pull that accompanies the equation-editor exploit; it names the download URL that eqnedt32's connection is fetching.
  - id: 3b5ba899-9842-4bc2-acc2-12308498bf42
    name: Office Application Initiated Network Connection Over Uncommon Ports
    reason: Sibling EID 3 egress from the Office-app side of the same maldoc chain (winword/excel beaconing on an odd port) — the parent application's C2/download alongside eqnedt32's own connection.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: 'The follow-on: the second-stage payload the exploit downloaded is dropped to the user profile and executed by the Office chain — the infostealer/RAT (Formbook, AgentTesla, Lokibot) that the eqnedt32 download delivers.'
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: 'The precursor delivery vector: equation-editor maldocs are overwhelmingly phishing attachments, so a process launched from the Outlook attachment temp folder on the same host/user places the exploited document''s arrival by email.'
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Office applications abused as a download LOLBin (T1202) is the parallel payload-fetch mechanism inside the same weaponized document, confirming the maldoc is staging remote content around the exploit.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child process spawned by eqnedt32.exe on this host (shellcode ran a payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Qq][Nn][Ee][Dd][Tt]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Files written to disk by eqnedt32.exe on this host (dropped second stage)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ee][Qq][Nn][Ee][Dd][Tt]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: DNS lookups by the exploited Office document chain on this host (C2 / download domain)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*(\\[Ee][Qq][Nn][Ee][Dd][Tt]32\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]|\\[Vv][Ii][Ss][Ii][Oo]\.[Ee][Xx][Ee]|\\[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Other hosts whose Equation Editor / Office apps reached the same address (campaign)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Ee][Qq][Nn][Ee][Dd][Tt]32\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - ip
    window: 24h
  - name: Second-stage download cradle / downloader LOLBin executed on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/)
    pivot_on:
    - host
    window: 2h
