name: Network Connection Initiated To Visual Studio Code Tunnels Domain
id: 4b657234-038e-4ad5-997c-4be42340bce4
version: 1
schema_version: "1.0"
date: "2023-11-20"
author: Kamran Saifullah
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4b657234-038e-4ad5-997c-4be42340bce4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects network connections to Visual Studio Code tunnel domains initiated by
  a process on a system. Attackers can abuse that feature to establish a reverse
  shell or persistence on a machine. MITRE ATT&CK: T1567, T1572.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_destinationHostname:
              value: "*.tunnels.api.visualstudio.com"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches
  '*.tunnels.api.visualstudio.com'.

known_false_positives: >
  Legitimate use of Visual Studio Code tunnel will also trigger this. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://ipfyx.fr/post/visual-studio-code-tunnel/
  - https://badoption.eu/blog/2023/01/31/code_c2.html
  - https://cydefops.com/vscode-data-exfiltration
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Network Connection Initiated To Visual Studio Code Tunnels Domain detected
    on host $agent_name$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1567, T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567
    - T1572
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - exfiltration
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_destinationHostname:/.*\.[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 90d6bd71-dffb-4989-8d86-a827fedd6624
    name: Visual Studio Code Tunnel Execution
    reason: 'Process-creation root of THIS network connection: the ''code.exe tunnel'' / code-server command that registered the tunnel and opened the session to *.tunnels.api.visualstudio.com. Names the binary and user that initiated the C2 channel.'
  - id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
    name: Renamed Visual Studio Code Tunnel Execution
    reason: Same 'code tunnel' command launched from a renamed binary to evade the execution rule; when the tunnel process is not caught under its real name, this is how the precursor shows on the same host.
  - id: b3e6418f-7c7a-4fad-993a-93b65027a9f1
    name: DNS Query To Visual Studio Code Tunnels Domain
    reason: The DNS-resolution leg (Sysmon EID22) of this very connection for *.tunnels.api.visualstudio.com; co-occurs on the same host moments before the EID3 connect and confirms the tunnel even when the EID3 destinationHostname is unparsed.
  - id: f4a623c2-4ef5-4c33-b811-0642f702c9f1
    name: Visual Studio Code Tunnel Shell Execution
    reason: 'Escalation signal: a powershell/pwsh/bash/wsl shell spawned by the vscode-server node.exe, i.e. the remote operator running commands THROUGH the tunnel. Turns ''tunnel registered'' into ''tunnel actively used for hands-on-keyboard C2''.'
  - id: 30bf1789-379d-4fdc-900f-55cd0a90a801
    name: Visual Studio Code Tunnel Service Installation
    reason: 'Persistence: ''code tunnel service install'' registers the tunnel as a Windows service so the C2 channel auto-starts and survives reboot/logoff. Expect it shortly before or after this connection on the same host.'
  - id: 3a9fa2ec-30bc-4ebd-b49e-7c9cff225502
    name: VsCode Powershell Profile Modification
    reason: 'Persistence via the badoption/code_c2 technique the references describe: a dropped Microsoft.VSCode_profile.ps1 that auto-executes attacker code every time the tunnel''s PowerShell terminal opens.'
  - id: 56e05d41-ce99-4ecd-912d-93f019ee0b71
    name: Visual Studio Code Tunnel Remote File Creation
    reason: node.exe writing files under .vscode-server, i.e. the remote operator dropping tooling or staging data over this same tunnel channel (tool-in / exfil-staging) once connected.
  - id: 5a3164f2-b373-4152-93cf-090b13c12d27
    name: Potentially Suspicious Child Process Of VsCode
    reason: 'Hands-on-keyboard follow-on through the tunnel: code.exe spawning regsvr32/rundll32/cmd with IEX/DownloadString or binaries from Temp/Public - recon and payload execution after the operator is connected.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rest of the VS Code / Dev Tunnels ecosystem reached from this host
    query: (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/ OR data_win_eventdata_queryName:/.*[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Vv][Ss][Cc][Oo][Dd][Ee]\.[Dd][Ee][Vv]/ OR data_win_eventdata_queryName:/.*[Vv][Ss][Cc][Oo][Dd][Ee]-[Cc][Dd][Nn]\.[Nn][Ee][Tt]/)) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Vv][Ss][Cc][Oo][Dd][Ee]\.[Dd][Ee][Vv]/ OR data_win_eventdata_destinationHostname:/.*[Vv][Ss][Cc][Oo][Dd][Ee]-[Cc][Dd][Nn]\.[Nn][Ee][Tt]/))
    pivot_on:
    - host
    window: 6h
  - name: Acquisition of the VS Code tunnel CLI on this host (download / unpack)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Cc][Oo][Dd][Ee]_[Cc][Ll][Ii].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Dd][Ee]-[Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Aa][Kk][Aa]\.[Mm][Ss]\/[Vv][Ss][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Aa][Tt][Ee]\.[Cc][Oo][Dd][Ee]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Cc][Oo][Dd][Ee]\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]\.[Pp][Rr][Ss][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Hands-on-keyboard host/domain discovery on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|\\[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee]|\\[Aa][Rr][Pp]\.[Ee][Xx][Ee]|\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ll][Ii][Ss][Tt].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping / LSASS access on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Cloud-storage / web-service exfiltration tooling on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Mm][Ee][Gg][Aa][Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_commandLine:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/)
    pivot_on:
    - host
    window: 4h
