name: Potential Pikabot C2 Activity
id: cae6cee6-0244-44d2-84ed-e65f548eb7dc
version: 1
schema_version: "1.0"
date: "2024-01-26"
author: Andreas Braathen (mnemonic.io)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cae6cee6-0244-44d2-84ed-e65f548eb7dc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of rundll32 that leads to an external network
  connection. The malware Pikabot has been seen to use this technique to
  initiate C2-communication through hard-coded Windows binaries. MITRE ATT&CK:
  T1573.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SearchFilterHost.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SearchProtocolHost.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sndvol.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wermgr.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wwahost.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_protocol:
              value: "tcp"
              case_insensitive: true
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_protocol
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_parentImage matches '*\rundll32.exe';
  data_win_eventdata_image matches '*\SearchFilterHost.exe';
  data_win_eventdata_image matches '*\SearchProtocolHost.exe', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.virustotal.com/gui/file/d72af640b71b8e3eca3eba660dd7c7f029ff8852bcacaa379e7b6c57cf4d9b44
  - https://www.virustotal.com/gui/file/6bb4cdbaef03b732a93559a58173e7f16b29bfb159a1065fae9185000ff23b4b
  - https://github.com/pr0xylife/Pikabot/blob/7f7723a74ca325ec54c6e61e076acce9a4b20538/Pikabot_06.12.2023.txt
  - https://attack.mitre.org/techniques/T1573/

response:
  message: >
    Potential Pikabot C2 Activity detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1573
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1573
  custom_tags:
    - pikabot
    - network_connection
    - sysmon
    - command_and_control
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Ss][Ee][Aa][Rr][Cc][Hh][Ff][Ii][Ll][Tt][Ee][Rr][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ee][Aa][Rr][Cc][Hh][Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Nn][Dd][Vv][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ww][Aa][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_protocol:/[Tt][Cc][Pp]/ AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e5144106-8198-4f6e-bfc2-0a551cc8dd94
    name: Potential Pikabot Infection - Suspicious Command Combinations Via Cmd.EXE
    reason: 'Initial-access precursor on the same host: Pikabot''s chained `cmd /c ... & curl/wget/ping/timeout ... rundll32` delivery one-liner downloads the payload and launches the very rundll32 that becomes this alert''s parentImage.'
  - id: 1bf0ba65-9a39-42a2-9271-31d31bf2f0bf
    name: Pikabot Fake DLL Extension Execution Via Rundll32.EXE
    reason: 'Direct precursor: a script host spawns rundll32 to load the Pikabot DLL (fake extension, from ProgramData/AppData/Users\Public) — that rundll32 loader process is exactly the parentImage=rundll32 seen beaconing here.'
  - id: d8937fe7-42d5-4b4d-8178-e089c908f63f
    name: Potential Pikabot Hollowing Activity
    reason: 'Same mechanism, immediately prior: rundll32 process-hollows the identical five signed binaries (SearchFilterHost/SearchProtocolHost/sndvol/wermgr/wwahost); this C2 alert is that hollowed process making its outbound TCP beacon.'
  - id: 698d4431-514f-4c82-af4d-cf573872a9f5
    name: Potential Pikabot Discovery Activity
    reason: 'Follow-on on the same host: once C2 is live the hollowed SearchHost/rundll32 chain runs ipconfig /all, netstat -aon and whoami /all — confirms hands-on recon after the beacon.'
  - id: 396f6630-f3ac-44e3-bfc8-1b161bc00c4e
    name: Suspicious Child Process Of Wermgr.EXE
    reason: wermgr.exe is one of this rule's exact injection targets; a hollowed wermgr spawning cmd/powershell/net/whoami children is the same compromised beaconing process pivoting to execution and recon.
  - id: ba42babc-0666-4393-a4f7-ceaf5a69191e
    name: Uncommon Child Processes Of SndVol.exe
    reason: sndvol.exe is another injection target in this rule; the Windows volume mixer spawning any non-benign child is only explained by Pikabot having hollowed it — same host, same incident.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Post-C2 escalation: Pikabot is a loader whose observed next-stage payload is a Cobalt Strike beacon loaded via rundll32 StartW; this firing on the same host signals progression from loader to a hands-on-keyboard implant.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process injection (CreateRemoteThread / ProcessAccess) into the signed binaries that beacon
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND data_win_eventdata_targetImage:/.*(\\[Ss][Ee][Aa][Rr][Cc][Hh][Ff][Ii][Ll][Tt][Ee][Rr][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Ee][Aa][Rr][Cc][Hh][Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Nn][Dd][Vv][Oo][Ll]\.[Ee][Xx][Ee]|\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ww][Aa][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Rundll32 loading a DLL from a user-writable staging path (the Pikabot loader)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Discovery / recon spawned by the hollowed signed binaries or the rundll32 chain
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*(\\[Ss][Ee][Aa][Rr][Cc][Hh][Ff][Ii][Ll][Tt][Ee][Rr][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Ee][Aa][Rr][Cc][Hh][Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Nn][Dd][Vv][Oo][Ll]\.[Ee][Xx][Ee]|\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ww][Aa][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_grandParentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Tt][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.*[Aa][Rr][Pp] -[Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS queries by the signed binaries used for injection (recovers the C2 domain)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*(\\[Ss][Ee][Aa][Rr][Cc][Hh][Ff][Ii][Ll][Tt][Ee][Rr][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Ee][Aa][Rr][Cc][Hh][Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Nn][Dd][Vv][Oo][Ll]\.[Ee][Xx][Ee]|\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ww][Aa][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Other hosts beaconing to the same destination address (Pikabot campaign scope)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_protocol:/[Tt][Cc][Pp]/
    pivot_on:
    - ip
    window: 24h
