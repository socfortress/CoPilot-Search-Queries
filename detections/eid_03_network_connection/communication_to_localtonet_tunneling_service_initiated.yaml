name: Communication To LocaltoNet Tunneling Service Initiated
id: 3ab65069-d82a-4d44-a759-466661a082d1
version: 1
schema_version: "1.0"
date: "2024-06-17"
author: Andreas Braathen (mnemonic.io)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ab65069-d82a-4d44-a759-466661a082d1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an executable initiating a network connection to "LocaltoNet"
  tunneling sub-domains. LocaltoNet is a reverse proxy that enables localhost
  services to be exposed to the Internet. Attackers have been seen to use this
  service for command-and-control activities to bypass MFA and perimeter
  controls. MITRE ATT&CK: T1572, T1090, T1102.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*.localto.net"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*.localtonet.com"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_initiated
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destinationHostname matches '*.localto.net';
  data_win_eventdata_destinationHostname matches '*.localtonet.com';
  data_win_eventdata_initiated equals 'true'.

known_false_positives: >
  Legitimate use of the LocaltoNet service. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://localtonet.com/documents/supported-tunnels
  - https://cloud.google.com/blog/topics/threat-intelligence/unc3944-targets-saas-applications
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1090/
  - https://attack.mitre.org/techniques/T1102/

response:
  message: >
    Communication To LocaltoNet Tunneling Service Initiated detected on host
    $agent_name$. Matched data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. Matched
    data_win_eventdata_initiated: $data_win_eventdata_initiated$. MITRE ATT&CK:
    T1572, T1090, T1102
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_destinationHostname
      type: domain
    - field: data_win_eventdata_initiated
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1572
    - T1090
    - T1102
  custom_tags:
    - communication
    - localtonet
    - tunneling
    - network_connection
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*\.[Ll][Oo][Cc][Aa][Ll][Tt][Oo]\.[Nn][Ee][Tt]/ OR data_win_eventdata_destinationHostname:/.*\.[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]\.[Cc][Oo][Mm]/) AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: 'Twin detection on the same Sysmon EID 3 behaviour: an executable beaconing out (initiated=true) to a hosted reverse-tunnel provider. Operators routinely stand up a second tunnel (ngrok) as fallback C2, so a matching ngrok beacon from this host confirms deliberate, redundant tunnelling rather than a one-off and widens the set of C2 domains to block.'
  - id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
    name: Network Connection Initiated To Cloudflared Tunnels Domains
    reason: Same EID 3 outbound-tunnel behaviour against the most common alternative provider (Cloudflare Tunnel). A parallel beacon to cloudflared from the same host shows the operator piercing the perimeter with more than one tunnel service and surfaces extra C2 domains tied to this foothold.
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Process-creation (EID 1) of a reverse-tunnel client. The LocalToNet alert is only the network layer; a chisel launch on the same host names an actual tunnelling process and its args (reverse / socks5 / 127.0.0.1 forward) that stands up an outbound channel like this one.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: ssh.exe run with reverse/local forward flags (-R/-L) is the same 'expose an internal port out through an attacker relay' mechanism LocalToNet provides. On this host it indicates the operator relaying traffic outbound and names the forwarded ports and destination.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: netsh portproxy add v4tov4 wires the host as a relay that forwards internal traffic onward. Seen with the LocalToNet beacon it shows the host being set up to route other services (e.g. RDP/SMB) over the tunnel, extending the channel beyond this one process.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: 'Follow-on payoff: an SSH utility routing RDP (:3389) over a reverse tunnel. Once a LocalToNet channel is live, interactive RDP through it is the hands-on-keyboard access objective, so this firing on the same host shows the tunnel being used for remote control.'
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: 'Follow-on persistence: schtasks creating a task that launches OpenSSH to re-establish a reverse tunnel. It turns a transient LocalToNet beacon into durable C2 that survives reboot or logoff, a clear escalation when seen on the same host.'
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: 'Likely initial-access foothold: UNC3944 (cited in this rule''s references) installs commercial RMM first, then layers a tunnel such as LocalToNet to bypass MFA and the perimeter. AnyDesk execution on the same host in the window supports a hands-on-keyboard intrusion over benign tunnel use.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tunnelling / reverse-proxy client executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]|[Nn][Gg][Rr][Oo][Kk]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Ff][Rr][Pp][Cc]|[Pp][Ll][Ii][Nn][Kk])\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*([Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]|[Nn][Gg][Rr][Oo][Kk]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Ff][Rr][Pp][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]|[Aa][Uu][Tt][Hh][Tt][Oo][Kk][Ee][Nn]|[Hh][Tt][Tt][Pp] 127\.0\.0\.1|[Tt][Cc][Pp] 127\.0\.0\.1).*/)
    pivot_on:
    - host
    window: 2h
  - name: Tunnel-service DNS resolutions on this host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Ll][Oo][Cc][Aa][Ll][Tt][Oo]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk]\.(([Ii][Oo])|([Aa][Pp][Pp])|([Dd][Ee][Vv]))/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/)
    pivot_on:
    - host
    window: 2h
  - name: Port-forward / SOCKS relay configured on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/) OR data_win_eventdata_commandLine:/.* -[Rr] [0-9].*/ OR data_win_eventdata_commandLine:/.* -[Ll] [0-9].*/ OR data_win_eventdata_commandLine:/.* -[Dd] [0-9].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ss]5.*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Downloader that may have delivered the tunnel client
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Other hosts beaconing to the same C2 destination address
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
