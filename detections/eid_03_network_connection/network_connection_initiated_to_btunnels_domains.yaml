name: Network Connection Initiated To BTunnels Domains
id: 9e02c8ec-02b9-43e8-81eb-34a475ba7965
version: 1
schema_version: "1.0"
date: "2024-09-13"
author: Kamran Saifullah
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e02c8ec-02b9-43e8-81eb-34a475ba7965
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects network connections to BTunnels domains initiated by a process on the
  system. Attackers can abuse that feature to establish a reverse shell or
  persistence on a machine. MITRE ATT&CK: T1567, T1572.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_destinationHostname:
              value: "*.btunnel.co.in"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches '*.btunnel.co.in'.

known_false_positives: >
  Legitimate use of BTunnels will also trigger this. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://defr0ggy.github.io/research/Utilizing-BTunnel-For-Data-Exfiltration/
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Network Connection Initiated To BTunnels Domains detected on host
    $agent_name$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1567, T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567
    - T1572
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - exfiltration
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_destinationHostname:/.*\.[Bb][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo]\.[Ii][Nn]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Same Sysmon EID 3 'process initiated a connection to a tunnelling service' behaviour, ngrok instead of BTunnel; a host beaconing to two different anonymizing-tunnel providers in one window is deliberate tunnelling infrastructure, not one user's legitimate tool.
  - id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
    name: Network Connection Initiated To Cloudflared Tunnels Domains
    reason: Another tunnel-service beacon (cloudflared) from the same host corroborates a deliberate egress/backup-C2 channel; operators routinely stand up a second tunnel provider so losing one does not cut their access.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: 'Same protocol-tunnelling outcome by a native mechanism: ssh.exe -R/-L forwards a local port out exactly as the BTunnel client does, so SSH forwarding on this host points to the operator exposing an internal service or layering a second tunnel.'
  - id: edc2f8ae-2412-4dfd-b9d5-0c57727e70be
    name: Potential Powershell ReverseShell Connection
    reason: The TcpClient reverse shell that a BTunnel reverse tunnel is frequently built to carry; if it fires on the same host the tunnel is almost certainly a live C2 shell rather than benign port exposure.
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: A second covert channel (iodine/dnscat2 DNS tunnelling) launched on the same host; two independent exfil/tunnel tools together is strong evidence of intentional data-smuggling, not stray software.
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: 'The persistence follow-on: a schtasks job that re-launches a reverse SSH tunnel on boot, turning the one-off BTunnel connection into durable remote access the operator keeps across reboot/logoff.'
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: 'The documented BTunnel abuse (data exfiltration): recon output POSTed out with curl/Invoke-RestMethod/wget on the same host indicates the tunnel is being used to push collected data off the box.'
  - id: windows-curl-upload-remote-destination-001
    name: Windows Curl Upload to Remote Destination
    reason: A concrete file-upload exfiltration (curl -T/--upload-file/-F) close in time to the tunnel connection is the data-theft action the BTunnel reference describes, pairing with the tunnel as the staging-then-exfil endgame.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Anonymizing tunnel / reverse-proxy client launched on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Gg][Rr][Oo][Kk]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]|[Ff][Rr][Pp][Cc]|[Ff][Rr][Pp][Ss]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Bb][Tt][Uu][Nn][Nn][Ee][Ll]|[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]|[Ii][Oo][Xx]|[Nn][Pp][Ss])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: DNS resolution of tunnelling / ephemeral-exposure services on this host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Bb][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo]\.[Ii][Nn]/ OR data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk]\.[Ii][Oo]/ OR data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk]-[Ff][Rr][Ee][Ee]\.[Aa][Pp][Pp]/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Ss][Ee][Rr][Vv][Ee][Oo]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Cc][Aa]\.[Ll][Tt]/ OR data_win_eventdata_queryName:/.*[Pp][Aa][Gg][Ee][Kk][Ii][Tt][Ee]\.[Mm][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Local port-forwarding / SOCKS proxy configuration on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ss][Hh].*[ ]-[RLD][ ].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ll][Ii][Nn][Kk].*[ ]-[RL][ ].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Yy][Nn][Aa][Mm][Ii][Cc][Ff][Oo][Rr][Ww][Aa][Rr][Dd].*/ OR data_win_eventdata_commandLine:/.*-[Rr][ ]+127\.0\.0\.1.*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ss]5.*/)
    pivot_on:
    - host
    window: 2h
  - name: Data staging and outbound file-transfer tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Aa]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Pp][Ss][Cc][Pp]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*--[Pp][Oo][Ss][Tt]-[Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[ ]-[Hh][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Other hosts beaconing to the same tunnel endpoint (campaign)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on:
    - ip
    window: 24h
