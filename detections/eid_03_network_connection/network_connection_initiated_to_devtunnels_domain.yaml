name: Network Connection Initiated To DevTunnels Domain
id: 9501f8e6-8e3d-48fc-a8a6-1089dd5d7ef4
version: 1
schema_version: "1.0"
date: "2023-11-20"
author: Kamran Saifullah
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9501f8e6-8e3d-48fc-a8a6-1089dd5d7ef4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects network connections to Devtunnels domains initiated by a process on a
  system. Attackers can abuse that feature to establish a reverse shell or
  persistence on a machine. MITRE ATT&CK: T1567.001, T1572.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - term:
            data_win_eventdata_initiated:
              value: "true"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_destinationHostname:
              value: "*.devtunnels.ms"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_initiated
    - data_win_eventdata_destinationHostname
    - data_win_eventdata_image
    - data_win_eventdata_destinationIp
    - data_win_eventdata_destinationPort
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 3 (network connection) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_initiated equals 'true';
  data_win_eventdata_destinationHostname matches '*.devtunnels.ms'.

known_false_positives: >
  Legitimate use of Devtunnels will also trigger this. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://blueteamops.medium.com/detecting-dev-tunnels-16f0994dc3e2
  - https://learn.microsoft.com/en-us/azure/developer/dev-tunnels/security
  - https://cydefops.com/devtunnels-unleashed
  - https://attack.mitre.org/techniques/T1567/001/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Network Connection Initiated To DevTunnels Domain detected on host
    $agent_name$. Matched data_win_eventdata_initiated:
    $data_win_eventdata_initiated$. Matched
    data_win_eventdata_destinationHostname:
    $data_win_eventdata_destinationHostname$. MITRE ATT&CK: T1567.001, T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_initiated
      type: other
    - field: data_win_eventdata_destinationHostname
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567.001
    - T1572
  custom_tags:
    - network
    - connection
    - initiated
    - network_connection
    - sysmon
    - exfiltration
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_destinationHostname:/.*\.[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1cb0c6ce-3d00-44fc-ab9c-6d6d577bf20b
    name: DNS Query To Devtunnels Domain
    reason: 'Direct precursor on the same host: the Sysmon EID22 resolution of *.devtunnels.ms moments before this EID3 connect, naming the process that resolved the relay before dialing it.'
  - id: 90d6bd71-dffb-4989-8d86-a827fedd6624
    name: Visual Studio Code Tunnel Execution
    reason: 'Identifies the process behind this connection: `code.exe tunnel` / devtunnel CLI is what opens a *.devtunnels.ms channel, so its EID1 command line reveals which binary and args created the tunnel seen on the wire.'
  - id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
    name: Renamed Visual Studio Code Tunnel Execution
    reason: Same tunnel binary renamed to evade detection; firing alongside this devtunnels connect upgrades the verdict from possible developer use to deliberate covert-channel setup.
  - id: 30bf1789-379d-4fdc-900f-55cd0a90a801
    name: Visual Studio Code Tunnel Service Installation
    reason: 'Follow-on persistence: `tunnel ... service internal-run` registers the tunnel as a Windows service so this remote-access channel survives reboot and logoff.'
  - id: f4a623c2-4ef5-4c33-b811-0642f702c9f1
    name: Visual Studio Code Tunnel Shell Execution
    reason: 'The payoff of the tunnel: a shell (powershell/cmd/bash/wsl) launched through the VS Code tunnel is hands-on-keyboard command execution over the very channel this connection established.'
  - id: 5a3164f2-b373-4152-93cf-090b13c12d27
    name: Potentially Suspicious Child Process Of VsCode
    reason: code.exe spawning uncommon child processes signals interactive operator activity or VS Code task/terminal-profile persistence driven through the tunnel session.
  - id: 56e05d41-ce99-4ecd-912d-93f019ee0b71
    name: Visual Studio Code Tunnel Remote File Creation
    reason: 'node.exe writing into .vscode-server is the attacker pushing tooling/payloads onto the host through the established tunnel: the inbound side of the same channel.'
  - id: 4b657234-038e-4ad5-997c-4be42340bce4
    name: Network Connection Initiated To Visual Studio Code Tunnels Domain
    reason: 'Sibling channel of the same client: VS Code Remote Tunnels also reach *.tunnels.api.visualstudio.com, so one `code tunnel` session typically trips this on the same host in the same window.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dev Tunnels / VS Code tunnel client process and arguments on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_image:/.*\\([Cc][Oo][Dd][Ee]-[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee]|[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 1h
  - name: Tunnel made persistent as a service or scheduled task on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll]-[Rr][Uu][Nn].*/) OR data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ll][Oo][Gg].*/ OR (data_win_eventdata_image:/.*\\([Ss][Cc]\.[Ee][Xx][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Cc][Oo][Dd][Ee]-[Tt][Uu][Nn][Nn][Ee][Ll]|[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll]|[Tt][Uu][Nn][Nn][Ee][Ll]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Shell or child process spawned by the tunnel host process (hands-on-keyboard)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]|[Cc][Oo][Dd][Ee]-[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee]|[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Ll]\.[Ee][Xx][Ee]|[Ww][Ss][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Other tunnel / reverse-proxy tooling staged on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee])/) OR data_win_eventdata_commandLine:/.*-[Rr] 127\.0\.0\.1.*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Ff][Ww][Dd].*/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same Dev Tunnels endpoint (campaign)
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*\.[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationHostname:/.*\.[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/)
    pivot_on:
    - domain
    window: 24h
