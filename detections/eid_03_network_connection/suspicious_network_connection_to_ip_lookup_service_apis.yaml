status: experimental
type: TTP

description: >
  Detects external IP address lookups by non-browser processes via services such
  as "api.ipify.org". This could be indicative of potential post compromise
  internet test activity. MITRE ATT&CK: T1016.

data_source:
  - Sysmon EventID 3 - Network Connection

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "3"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_destinationHostname:
                    value: "www.ip.cn"
                    case_insensitive: true
              - term:
                  data_win_eventdata_destinationHostname:
                    value: "l2.io"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*api.2ip.ua*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destinationHostname:
                    value: "*api.bigdatacloud.net*"
