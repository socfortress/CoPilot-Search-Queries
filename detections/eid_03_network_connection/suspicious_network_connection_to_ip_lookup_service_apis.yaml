correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: 'Co-occurring, same EID 3 telemetry: the non-browser process doing the IP-echo lookup is typically a dropped payload in Temp/AppData/ProgramData; this flags that same binary''s other outbound connections, pinning down which process is phoning home.'
  - id: 20384606-a124-4fec-acbb-8bd373728613
    name: Suspicious Network Connection Binary No CommandLine
    reason: 'Co-occurring: loaders frequently run as a hollowed/injected well-known Windows binary with an empty command line, and that is a common shape of the very process that performs the public-IP victim-profiling check seen here.'
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: 'Precursor on the same host: certutil.exe is a favoured LOLBin for pulling the payload that then runs the egress/IP-geolocation check; a certutil network connection just before this alert is often the download that delivered the implant.'
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: 'Co-occurring discovery (T1016): a public-IP lookup is rarely isolated - it accompanies the host/network recon burst (net/arp/ipconfig/route), so recon commands on the same host in-window separate deliberate attacker situational awareness from a benign one-off.'
  - id: cae6cee6-0244-44d2-84ed-e65f548eb7dc
    name: Potential Pikabot C2 Activity
    reason: 'Follow-on, named family: Pikabot is a loader that performs egress checks like this one and then beacons out via rundll32; Pikabot C2 on the same host after the IP lookup is the real command-and-control this profiling step confirmed reachability for.'
  - id: c3dbbc9f-ef1d-470a-a90a-d343448d5875
    name: Suspicious Non-Browser Network Communication With Telegram API
    reason: 'Follow-on, same non-browser-abusing-a-legit-API class: after confirming egress, loaders and infostealers (DuckTail in this rule''s references) use the Telegram API as a covert C2 / exfiltration channel from the same kind of non-browser process.'
  - id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
    name: Suspicious Dropbox API Usage
    reason: 'Follow-on exfil, same behavioural class: a non-Dropbox executable talking to the Dropbox API is C2/exfiltration (T1567.002) by the same kind of non-browser process - the staged-data egress that typically follows victim profiling.'
  - id: e0f8ab85-0ac9-423b-a73a-81b3c7b1aa97
    name: Network Communication Initiated To File Sharing Domains From Process Located In Suspicious Folder
    reason: 'Follow-on staging, same EID 3 telemetry: the dropped process that checked its public IP next reaches a file-sharing domain to pull the next stage or exfiltrate, so a suspicious-folder binary hitting a file-sharing host on the same box extends the chain.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Suspicious process execution from user-writable / staging locations on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\).*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Payload download / staging tooling and PowerShell download cradles on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Cc][Ee][Rr][Tt][Oo][Cc]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])\.[Ee][Xx][Ee]/) OR data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]).*/
    pivot_on:
    - host
    window: 2h
  - name: Network-configuration and host discovery command burst on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Aa][Rr][Pp]|[Rr][Oo][Uu][Tt][Ee]|[Nn][Bb][Tt][Ss][Tt][Aa][Tt]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: DNS queries by script interpreters and LOLBins on this host (C2 domain resolution)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Mm][Ss][Bb][Uu][Ii][Ll][Dd]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other endpoints opening network connections to the same destination address (campaign)
    query: data_win_system_eventID:"3"
    pivot_on:
    - ip
    window: 24h
