name: M365 Suspicious File Deletion
id: M365_Suspicious_File_Deletion
version: 1
schema_version: "1.0"
date: "2026-07-02"
author: SOCFortress LLC
status: production
type: aggregation
description: >
  Detects a user recycling (deleting) an unusually high number of files from
  SharePoint or OneDrive within a short time window. A burst of file deletions by
  a single user can indicate a malicious insider destroying data before departure,
  an attacker on a compromised account wiping files, or the cleanup phase of a
  ransomware-style operation. Automated OneDrive sync-engine deletions and the
  SharePoint system account are excluded so that only interactive, user-driven
  deletions are counted.
  MITRE ATT&CK: T1485 (Data Destruction), T1070 (Indicator Removal).
data_source:
  - Office 365 Management Activity API
  - "Workload: SharePoint / OneDrive"
workload: SharePoint
how_to_implement: >
  Requires the Office 365 audit log ingestion pipeline feeding Graylog via the
  O365 Management Activity API, with SharePoint/OneDrive auditing enabled so
  FileRecycled operations (RecordType 6, SharePointFileOperation) are recorded.
  Note the operation is FileRecycled (a user sending a file to the recycle bin),
  not FileDeleted, which in practice is generated by the automated
  SPFileExpirationJob system process clearing cache files and is not a user
  action. This is an aggregation detection: the base graylog.query isolates
  user-driven recycle events and excludes the SharePoint system account
  (SHAREPOINT\system) and the OneDrive/SkyDrive sync engine (matched on
  UserAgent), then the aggregation block counts them per user over the window.
  O365 CreationTime arrives with a malformed timezone offset (+0000) and is
  replaced at ingest, so windowing keys off Graylog's own timestamp.
known_false_positives: >
  Legitimate bulk cleanup by users runs high in normal environments, especially
  clearing Microsoft Teams chat files and old OneDrive content via the browser,
  so a low threshold will surface routine cleanup as well as malicious deletion.
  The threshold is intentionally sensitive and should be raised per tenant after
  observing real deletion volume. Migrations, offboarding handovers, and
  power-user housekeeping are common benign causes.
references:
  - https://attack.mitre.org/techniques/T1485/
  - https://attack.mitre.org/techniques/T1070/
response:
  message: >
    Suspicious file deletion: $data_office365_UserId$ recycled multiple files from
    SharePoint/OneDrive within the aggregation window from $data_office365_ClientIP$
    ($data_office365_ClientIP_country_code$). Review for data destruction or
    account compromise. MITRE ATT&CK: T1485
  risk_score: 65
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 65
  threat_objects:
    - field: data_office365_ClientIP
      type: ip_address
    - field: data_office365_ObjectId
      type: file_name
tags:
  analytic_story:
    - Office 365 Data Destruction
    - Insider Threat
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1485
    - T1070
  custom_tags:
    - o365
    - sharepoint
    - onedrive
    - file_deletion
    - data_destruction
    - aggregation
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:"FileRecycled" AND NOT data_office365_UserId:"SHAREPOINT\\system" AND NOT data_office365_UserAgent:/.*([oO]ne[dD]rive|[sS]ky[dD]rive[sS]ync).*/
aggregation:
  enabled: true
  function: count
  field: null
  group_by:
    - data_office365_UserId
  window: 10m
  threshold: 5
  condition: ">"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: M365_Mass_File_Deletion
    name: M365 Mass File Deletion
    reason: Shares the exact same FileRecycled base query at a far higher threshold (>50 vs >5); a genuine destruction burst trips both, and its co-firing confirms high-volume, deliberate data destruction rather than the routine cleanup this sensitive rule also surfaces.
  - id: 78a34b67-3c39-4886-8fb4-61c46dc18ecd
    name: Microsoft 365 - Unusual Volume of File Deletion
    reason: 'Microsoft Defender/MCAS''s own anomaly engine flagging an abnormal deletion volume for the same user: independent, second-engine corroboration that the recycle burst is genuinely anomalous and not this user''s baseline.'
  - id: bd132164-884a-48f1-aa2d-c6d646b04c69
    name: Microsoft 365 - Potential Ransomware Activity
    reason: MCAS ransomware anomaly on the same user; this rule's description names the ransomware cleanup/removal phase as a cause, so a FileRecycled burst coinciding with ransomware activity is the destruction stage of that operation.
  - id: M365_Mass_Email_Deletion_Evidence_Wipe
    name: M365 Mass Email Deletion - Evidence Wipe
    reason: 'Same actor destroying data in a second workload: a compromised-account or insider wipe of SharePoint/OneDrive files is routinely paired with bulk mailbox deletion to erase phishing/fraud traces (T1070 anti-forensics).'
  - id: M365_Mass_File_Download
    name: M365 Mass File Download
    reason: 'Exfil-before-destroy precursor: an insider or attacker downloads and stages the data, then recycles it to deny the business access. A download burst by the same user just before this fires reframes the incident as exfiltration followed by destruction.'
  - id: M365_Mass_External_Sharing
    name: M365 Mass External Sharing
    reason: 'Alternate exfiltration vector preceding the wipe: the same user pushing files to anonymous links or external guests and then deleting them is a strong insider steal-then-destroy sequence.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Account-takeover entry signal for the ''attacker on a compromised account wiping files'' branch: an impossible-travel sign-in on the same user shortly before the deletion burst indicates the destruction came from a hijacked session, not the real owner.'
  - id: 2e669ed8-742e-4fe5-b3c4-5a59b486c2ee
    name: Activity Performed by Terminated User
    reason: 'Directly confirms this rule''s ''malicious insider destroying data before departure'' scenario: a terminated/offboarded account still active and burst-deleting files is deliberate pre-exit data destruction.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Anomalous sign-ins and failed-logon bursts by this user
    query: data_office365_Operation:("UserLoggedIn" OR "UserLoginFailed")
    pivot_on:
    - user
    window: 6h
  - name: Exfiltration staging (downloads + external/anonymous sharing) by this user before the wipe
    query: data_office365_Operation:("FileDownloaded" OR "FileSyncDownloadedFull" OR "FileAccessed" OR "SharingSet" OR "AddedToSecureLink" OR "AnonymousLinkCreated" OR "SharingInvitationCreated" OR "CompanyLinkCreated")
    pivot_on:
    - user
    window: 24h
  - name: Escalating / irrecoverable destruction (permanent deletes, recycle-bin purge, version wiping) by this user
    query: data_office365_Operation:("FileDeleted" OR "FileDeletedFirstStageRecycleBin" OR "FileDeletedSecondStageRecycleBin" OR "FileVersionRecycled" OR "FileVersionsAllRecycled")
    pivot_on:
    - user
    window: 6h
  - name: Mailbox evidence wipe (SoftDelete/HardDelete) by this user
    query: data_office365_Operation:("SoftDelete" OR "HardDelete")
    pivot_on:
    - user
    window: 6h
  - name: Sign-ins and destructive/exfil operations from the deletion source IP
    query: data_office365_Operation:("UserLoggedIn" OR "UserLoginFailed" OR "FileRecycled" OR "FileDeleted" OR "FileDeletedSecondStageRecycleBin" OR "SoftDelete" OR "HardDelete" OR "FileDownloaded")
    pivot_on:
    - ip
    window: 6h
