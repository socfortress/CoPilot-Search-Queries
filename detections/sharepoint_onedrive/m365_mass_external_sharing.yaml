name: M365 Mass External Sharing
id: M365_Mass_External_Sharing
version: 1
schema_version: "1.0"
date: "2026-07-02"
author: SOCFortress LLC
status: production
type: aggregation
description: >
  Detects a user externally sharing multiple SharePoint or OneDrive files within a
  short time window, via anonymous ("anyone with the link") sharing links or by
  granting access to external guest accounts. While occasional external sharing is
  normal, a burst of external shares by one user is a strong data-exfiltration
  signal: a malicious insider or a compromised account exposing corporate documents
  to attacker-controlled anonymous links or external identities. The base query
  isolates external and anonymous shares (ignoring the far more common internal
  group and member shares, and automated meeting-recording shares), then counts
  them per user.
  MITRE ATT&CK: T1213.002 (Data from Information Repositories: SharePoint), T1567 (Exfiltration Over Web Service).
data_source:
  - Office 365 Management Activity API
  - "Workload: SharePoint / OneDrive"
workload: SharePoint
how_to_implement: >
  Requires the Office 365 audit log ingestion pipeline feeding Graylog via the
  O365 Management Activity API, with SharePoint/OneDrive auditing enabled so
  sharing operations (SharingSet, AddedToSecureLink; RecordType 14,
  SharePointSharingOperation) are recorded. This is an aggregation detection: the
  base graylog.query isolates external shares only, matched three ways in
  data_office365_TargetUserOrGroupName / data_office365_TargetUserOrGroupType:
  anonymous links (name contains "Anonymous"), external guest UPNs (name contains
  "#ext#"), and guest targets (type "Guest"). These are standard M365 markers and
  are consistent across tenants and locales. Internal SharePointGroup/SecurityGroup/
  Member shares and automated app@sharepoint meeting-recording shares are naturally
  excluded because their targets are internal. The aggregation then counts external
  shares per user over the window. O365 CreationTime arrives with a malformed
  timezone offset (+0000) and is replaced at ingest, so windowing keys off Graylog's
  own timestamp.
known_false_positives: >
  Legitimate external collaboration (sharing documents with clients, partners, or
  vendors via guest access or link) will trigger this if done in volume. Users who
  routinely work with external parties, and departments that share deliverables
  externally, are common benign causes. Review the shared file names and external
  targets; tune the threshold per tenant and consider allowlisting known partner
  domains if external collaboration is heavy.
references:
  - https://attack.mitre.org/techniques/T1213/002/
  - https://attack.mitre.org/techniques/T1567/
response:
  message: >
    Mass external sharing: $data_office365_UserId$ shared multiple files externally
    (anonymous link or guest access) within the aggregation window from
    $data_office365_ClientIP$ ($data_office365_ClientIP_country_code$). Latest target:
    $data_office365_TargetUserOrGroupName$. Review for data exfiltration.
    MITRE ATT&CK: T1213.002
  risk_score: 70
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 70
  threat_objects:
    - field: data_office365_ClientIP
      type: ip_address
    - field: data_office365_TargetUserOrGroupName
      type: recipient
tags:
  analytic_story:
    - Office 365 Data Exfiltration
    - Insider Threat
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1213.002
    - T1567
  custom_tags:
    - o365
    - sharepoint
    - onedrive
    - external_sharing
    - anonymous_link
    - guest_access
    - data_exfiltration
    - aggregation
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:("SharingSet" OR "AddedToSecureLink") AND (data_office365_TargetUserOrGroupName:/.*[aA]nonymous.*/ OR data_office365_TargetUserOrGroupName:/.*#ext#.*/ OR data_office365_TargetUserOrGroupType:"Guest")
aggregation:
  enabled: true
  function: count
  field: null
  group_by:
    - data_office365_UserId
  window: 10m
  threshold: 2
  condition: ">"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'An impossible-travel sign-in on this same user is the account-takeover behind the sharing burst. It is the decisive discriminator: it converts the rule''s main false positive (heavy but legitimate external collaboration) into a confirmed compromised-session exfiltration.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: Same user active from a Tor/anonymizing-proxy IP means the external shares are being created from hidden attacker infrastructure - an anonymous source IP creating anonymous 'anyone with the link' shares is a fully anonymized exfil channel, not collaboration.
  - id: 0f2468a2-5055-4212-a368-7321198ee706
    name: Activity from Infrequent Country
    reason: A sign-in from a country never/rarely seen for this user right before the share burst points to a hijacked session rather than the user's normal external-sharing pattern, and names the geography to block.
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: If the mass sharing was performed from a threat-intel-flagged IP (same user/source), it corroborates a compromised credential as the root cause and gives the attacker IP to contain.
  - id: M365_Mass_File_Download
    name: M365 Mass File Download
    reason: The same user bulk-downloading SharePoint/OneDrive files is the sibling exfil vector on the identical workload; download-then-externally-share (or both at once) is the complete data-theft pattern and scopes how much data left.
  - id: ee111937-1fe7-40f0-962a-0eb44d57d174
    name: Suspicious OAuth App File Download Activities
    reason: A malicious OAuth app pulling this user's files points to consent-grant compromise driving the exfil - the same consented app can be the actor behind both the downloads and the external-link creation, which changes the response from password reset to app revocation.
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: Same user pushing data to an unsanctioned cloud app is a parallel exfil channel to the external shares; the two together indicate deliberate, multi-vector data removal rather than one-off partner collaboration.
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: A compromised O365 identity used for SharePoint exfil very commonly also plants an inbox forwarding/hiding rule (BEC persistence and collection); its presence on the same user within the window turns a single sharing alert into a full account-compromise incident.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sharing / anonymous-link operations by this user
    query: data_office365_Operation:("SharingSet" OR "SharingInvitationCreated" OR "AddedToSecureLink" OR "SecureLinkCreated" OR "AnonymousLinkCreated" OR "AnonymousLinkUpdated" OR "AnonymousLinkUsed" OR "CompanyLinkCreated")
    pivot_on:
    - user
    window: 24h
  - name: Bulk file download / sync / access by this user
    query: data_office365_Operation:("FileDownloaded" OR "FileSyncDownloadedFull" OR "FileAccessed" OR "FileAccessedExtended")
    pivot_on:
    - user
    window: 6h
  - name: Sign-in successes and failures for this user
    query: data_office365_Operation:("UserLoggedIn" OR "UserLoginFailed")
    pivot_on:
    - user
    window: 24h
  - name: OAuth app consent / permission grants by this user
    query: data_office365_Operation:("Consent to application" OR "Add OAuth2PermissionGrant" OR "Add delegated permission grant" OR "Add app role assignment grant to user" OR "Add service principal")
    pivot_on:
    - user
    window: 24h
  - name: External sharing / anonymous-link creation from this source IP
    query: data_office365_Operation:("SharingSet" OR "SharingInvitationCreated" OR "AddedToSecureLink" OR "AnonymousLinkCreated" OR "AnonymousLinkUsed" OR "CompanyLinkCreated")
    pivot_on:
    - ip
    window: 6h
