name: M365 Mass File Deletion
id: M365_Mass_File_Deletion
version: 1
schema_version: "1.0"
date: "2026-07-02"
author: SOCFortress LLC
status: production
type: aggregation
description: >
  Detects a user recycling (deleting) a very large number of files from SharePoint
  or OneDrive within a short time window. This is the high-confidence, high-volume
  tier of file-deletion detection: while a handful of deletions is routine, deleting
  dozens of files in minutes strongly indicates deliberate data destruction by a
  departing insider, an attacker wiping a compromised account, or the removal phase
  of a ransomware-style operation. Automated OneDrive sync-engine deletions and the
  SharePoint system account are excluded so that only interactive, user-driven
  deletions are counted.
  MITRE ATT&CK: T1485 (Data Destruction), T1070 (Indicator Removal).
data_source:
  - Office 365 Management Activity API
  - "Workload: SharePoint / OneDrive"
workload: SharePoint
how_to_implement: >
  Requires the Office 365 audit log ingestion pipeline feeding Graylog via the
  O365 Management Activity API, with SharePoint/OneDrive auditing enabled so
  FileRecycled operations (RecordType 6, SharePointFileOperation) are recorded.
  Note the operation is FileRecycled (a user sending a file to the recycle bin),
  not FileDeleted, which in practice is generated by the automated
  SPFileExpirationJob system process clearing cache files and is not a user
  action. This detection shares its base query with the lower-threshold
  "Suspicious File Deletion" rule; it uses a substantially higher threshold to act
  as a high-confidence mass-destruction alert. It excludes the SharePoint system
  account (SHAREPOINT\system) and the OneDrive/SkyDrive sync engine (matched on
  UserAgent), then counts user-driven recycle events per user over the window.
  O365 CreationTime arrives with a malformed timezone offset (+0000) and is
  replaced at ingest, so windowing keys off Graylog's own timestamp.
known_false_positives: >
  Large-scale legitimate cleanup can still occur (mass clearing of Microsoft Teams
  chat files, bulk removal of old OneDrive content, offboarding data handovers,
  and migrations). The threshold is set high to minimize this, but very active
  power users may still trigger it; tune per tenant and consider excluding known
  bulk-maintenance or service accounts.
references:
  - https://attack.mitre.org/techniques/T1485/
  - https://attack.mitre.org/techniques/T1070/
response:
  message: >
    Mass file deletion: $data_office365_UserId$ recycled a large number of files
    from SharePoint/OneDrive within the aggregation window from
    $data_office365_ClientIP$ ($data_office365_ClientIP_country_code$).
    High-confidence data destruction or account compromise. MITRE ATT&CK: T1485
  risk_score: 80
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 80
  threat_objects:
    - field: data_office365_ClientIP
      type: ip_address
    - field: data_office365_ObjectId
      type: file_name
tags:
  analytic_story:
    - Office 365 Data Destruction
    - Insider Threat
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1485
    - T1070
  custom_tags:
    - o365
    - sharepoint
    - onedrive
    - file_deletion
    - data_destruction
    - mass_deletion
    - aggregation
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:"FileRecycled" AND NOT data_office365_UserId:"SHAREPOINT\\system" AND NOT data_office365_UserAgent:/.*([oO]ne[dD]rive|[sS]ky[dD]rive[sS]ync).*/
aggregation:
  enabled: true
  function: count
  field: null
  group_by:
    - data_office365_UserId
  window: 10m
  threshold: 50
  condition: ">"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: M365_Suspicious_File_Deletion
    name: M365 Suspicious File Deletion
    reason: Lower-threshold sibling that shares the identical base query (FileRecycled, same SHAREPOINT\system and OneDrive/SkyDrive-sync exclusions); this high-volume tier is a strict superset, so the same user's deletion burst fires both. Co-firing confirms the mass-recycle is real user-driven destruction and not a threshold artefact.
  - id: 78a34b67-3c39-4886-8fb4-61c46dc18ecd
    name: Microsoft 365 - Unusual Volume of File Deletion
    reason: Independent MCAS/Defender detection of the same behaviour (one user deleting an unusual volume of files). Cross-engine agreement on the same UserId raises confidence from 'our count threshold tripped' to 'two sources see mass deletion'.
  - id: bd132164-884a-48f1-aa2d-c6d646b04c69
    name: Microsoft 365 - Potential Ransomware Activity
    reason: MCAS ransomware heuristic on mass file operations. If the recycle burst is the trailing half of an encrypt-then-delete ransomware run on the account, both fire together; its presence reclassifies the incident from a plain data wipe to active ransomware (Impact).
  - id: M365_Mass_File_Download
    name: M365 Mass File Download
    reason: 'Classic steal-then-wipe precursor: the same user bulk-downloads files (exfil/staging) immediately before recycling them. If this preceded the deletion it upgrades the incident from pure destruction to exfiltration followed by destruction.'
  - id: M365_Mass_External_Sharing
    name: M365 Mass External Sharing
    reason: 'Alternate exfil-before-destroy channel: the same user pushes data out via anonymous/guest sharing links before wiping the originals. Together with mass deletion this is the insider/takeover pattern of exposing corporate data then removing the local copy.'
  - id: M365_Mass_Email_Deletion_Evidence_Wipe
    name: M365 Mass Email Deletion - Evidence Wipe
    reason: 'Parallel destruction in a second workload by the same account: bulk mailbox deletion is the anti-forensics counterpart to SharePoint/OneDrive wiping. Co-firing widens the blast radius from files to the whole mailbox and signals deliberate evidence destruction after a takeover.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Account-takeover root-cause precursor: a risky impossible-travel sign-in by the same user shortly before the deletion burst points to a compromised account driving the destruction rather than a reckless-but-legitimate user. Resolves the compromise branch of ''why did this fire''.'
  - id: 2e669ed8-742e-4fe5-b3c4-5a59b486c2ee
    name: Activity Performed by Terminated User
    reason: 'Insider root-cause precursor: if the destroying account belongs to a terminated/offboarded user, mass deletion is a near-certain malicious-insider or offboarding-failure case rather than external compromise. Resolves the insider branch of ''why did this fire''.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Bulk file download / sync-down by this user (steal-before-wipe exfil)
    query: data_office365_Operation:("FileDownloaded" OR "FileSyncDownloadedFull" OR "FileSyncDownloadedPartial")
    pivot_on:
    - user
    window: 6h
  - name: Anonymous / external sharing-link creation by this user (exfil before destruction)
    query: data_office365_Operation:("AnonymousLinkCreated" OR "AnonymousLinkUsed" OR "SharingSet" OR "AddedToSecureLink" OR "SharingInvitationCreated")
    pivot_on:
    - user
    window: 24h
  - name: Mailbox soft/hard deletion by this user (parallel evidence wipe)
    query: data_office365_Operation:("SoftDelete" OR "HardDelete" OR "MoveToDeletedItems")
    pivot_on:
    - user
    window: 24h
  - name: MCAS account-risk / takeover alerts for this user (is this a compromise?)
    query: data_office365_eventName:/.*([Ii]mpossible [Tt]ravel|[Aa]nonymous [Ii][Pp]|[Ii]nfrequent [Cc]ountry|[Rr]isky [Ii][Pp]|[Tt]erminated [Uu]ser).*/
    pivot_on:
    - user
    window: 24h
  - name: Destructive / exfil operations from this client IP across all users (blast radius)
    query: data_office365_Operation:("FileRecycled" OR "FileDeleted" OR "FileDownloaded" OR "SoftDelete" OR "HardDelete" OR "AnonymousLinkCreated")
    pivot_on:
    - ip
    window: 6h
