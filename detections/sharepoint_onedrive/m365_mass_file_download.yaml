name: M365 Mass File Download
id: M365_Mass_File_Download
version: 1
schema_version: "1.0"
date: "2026-07-02"
author: SOCFortress LLC
status: production
type: aggregation
description: >
  Detects a single user downloading an unusually high volume of files from
  SharePoint or OneDrive within a short time window. High-volume downloads by
  one user are a strong indicator of data exfiltration, whether by a malicious
  insider staging data for removal or an attacker operating a compromised
  account. Fires when a user exceeds the download threshold within the
  aggregation window.
  MITRE ATT&CK: T1213 (Data from Information Repositories), T1567 (Exfiltration Over Web Service).

data_source:
  - Office 365 Management Activity API
  - "Workload: SharePoint / OneDrive"

workload: SharePoint

how_to_implement: >
  Requires the Office 365 audit log ingestion pipeline feeding Graylog via the
  O365 Management Activity API, with SharePoint/OneDrive auditing enabled so
  FileDownloaded operations (RecordType 6) are recorded. This is an aggregation
  detection: the base graylog.query isolates download events, and the
  aggregation block counts them per user over the window. Note: O365 CreationTime
  arrives with a malformed timezone offset (+0000) and is replaced at ingest, so
  windowing keys off Graylog's own timestamp rather than data_office365_CreationTime.
  Confirmed against live AGTNetworks tenant data — FileDownloaded events populate
  data_office365_UserId, data_office365_ClientIP, and data_office365_ObjectId.

known_false_positives: >
  Legitimate bulk activity can trigger this: users syncing a large SharePoint
  library for the first time, migrations, backups, offboarding data handovers,
  or automated/service accounts that pull many files. Tune the threshold and
  window per tenant, and consider excluding known service accounts by UserId.
  A high sustained baseline for specific power users may warrant per-user tuning.

references:
  - https://attack.mitre.org/techniques/T1213/
  - https://attack.mitre.org/techniques/T1567/

response:
  message: >
    Mass file download detected: $data_office365_UserId$ downloaded a high volume
    of files from SharePoint/OneDrive within the aggregation window.
    Source IP: $data_office365_ClientIP$ ($data_office365_ClientIP_country_code$).
    Review for potential data exfiltration. MITRE ATT&CK: T1213, T1567
  risk_score: 75
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 75
  threat_objects:
    - field: data_office365_ClientIP
      type: ip_address
    - field: data_office365_ObjectId
      type: file_name

tags:
  analytic_story:
    - Office 365 Data Exfiltration
    - Insider Threat
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1213
    - T1567
  custom_tags:
    - o365
    - sharepoint
    - onedrive
    - file_download
    - data_exfiltration
    - aggregation
  product:
    - Office 365
  security_domain: cloud

graylog:
  query: data_office365_Operation:"FileDownloaded"

aggregation:
  enabled: true
  function: count          
  field: null             
  group_by:
    - data_office365_UserId
  window: 10m
  threshold: 21
  condition: ">"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ee111937-1fe7-40f0-962a-0eb44d57d174
    name: Suspicious OAuth App File Download Activities
    reason: 'Same mass-download behaviour seen through MCAS: an OAuth app pulling an unusual volume of SharePoint/OneDrive files for this user. Firing on the same identity reveals whether an illicit consented app, rather than the user, is driving the bulk download.'
  - id: M365_Mass_External_Sharing
    name: M365 Mass External Sharing
    reason: 'Exfiltration continuation on the same user: after staging files via download, a burst of anonymous-link / external-guest shares is the other half of the O365 data-exfil pattern, exposing the pulled documents to attacker-controlled parties.'
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: 'Egress follow-on: MCAS flags this user moving data into an unsanctioned/personal cloud app, the likely destination the mass-downloaded files are being carried out through.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Account-takeover precursor: an impossible-travel sign-in on the same user shortly before the bulk pull indicates the download is from a compromised account, not the legitimate owner.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'Hidden-origin precursor/concurrent signal: the same user active from a Tor/anonymous-proxy IP points to an attacker masking the source of the mass download.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: 'Compromise precursor: a sign-in from a threat-intel-flagged risky IP on the same user just before the download corroborates account takeover as the driver of the exfiltration.'
  - id: 2e669ed8-742e-4fe5-b3c4-5a59b486c2ee
    name: Activity Performed by Terminated User
    reason: 'Insider-threat corroboration: if the bulk-downloading identity belongs to a terminated/offboarded user, this is textbook departing-insider data theft and the account should be disabled immediately.'
  - id: M365_Mass_File_Deletion
    name: M365 Mass File Deletion
    reason: 'Destruction / cover-tracks follow-on: the same user recycling files en masse after downloading them signals data theft followed by deliberate destruction or evidence removal on the compromised account.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Full extent of file download / access burst by this user
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd][Ee][Xx][Tt][Ee][Nn][Dd][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: External / anonymous-link sharing by this user
    query: (data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ss][Ee][Tt].*/ OR data_office365_Operation:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk][Uu][Ss][Ee][Dd].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd][Ee][Dd][Tt][Oo][Ss][Ee][Cc][Uu][Rr][Ee][Ll][Ii][Nn][Kk].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ii][Nn][Vv][Ii][Tt][Aa][Tt][Ii][Oo][Nn][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Cc][Oo][Mm][Pp][Aa][Nn][Yy][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: File deletion / recycle by this user after the download
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Rr][Ee][Cc][Yy][Cc][Ll][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Ee][Ll][Ee][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Ee][Ll][Ee][Tt][Ee][Dd][Ff][Ii][Rr][Ss][Tt][Ss][Tt][Aa][Gg][Ee][Rr][Ee][Cc][Yy][Cc][Ll][Ee][Bb][Ii][Nn].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Ee][Ll][Ee][Tt][Ee][Dd][Ss][Ee][Cc][Oo][Nn][Dd][Ss][Tt][Aa][Gg][Ee][Rr][Ee][Cc][Yy][Cc][Ll][Ee][Bb][Ii][Nn].*/)
    pivot_on:
    - user
    window: 6h
  - name: Sign-in successes and failures for this user
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: Sign-ins and file downloads from this source IP (other identities)
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll].*/)
    pivot_on:
    - ip
    window: 6h
