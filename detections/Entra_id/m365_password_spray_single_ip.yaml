name: M365 Password Spray From One IP
id: 4639f8bc-31dd-4a7a-a35c-6bf18b00e626
version: 1
schema_version: "1.0"
date: "2026-11-20"
author: SOCFortress LLC
status: experimental
type: aggregation
description: >
  Detects one source IP failing sign-ins against many distinct Entra ID
  accounts in a short window, the shape of a password spray. Agentic frameworks
  like ARTEX run enumeration and credential attempts across many accounts at
  machine speed (FBI FLASH-20261113-001).
  MITRE ATT&CK: T1110.003 (Brute Force: Password Spraying).
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module subscribed to Audit.AzureActiveDirectory.
  The base query isolates UserLoginFailed events and the aggregation counts
  distinct data_office365_UserId values per data_office365_ClientIP over 30
  minutes. If the tenant's own egress IPs trip the rule (for example after a
  password policy change), exclude them with AND NOT data_office365_ClientIP
  clauses in a tenant-specific copy rather than in the shared rule.
known_false_positives: >
  A shared corporate egress or proxy IP where many users fail at once (expired
  passwords, an outage at the identity provider), and Microsoft service IPs
  relaying legacy authentication. Check whether the IP belongs to the customer.
references:
  - https://www.ic3.gov/CSA/2026/261113.pdf
  - https://attack.mitre.org/techniques/T1110/003/
response:
  message: >
    Possible password spray: $data_office365_ClientIP$ failed sign-ins against
    many distinct accounts within the aggregation window. Check for any
    successful sign-in from the same IP. MITRE ATT&CK: T1110.003
  risk_score: 70
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 40
  threat_objects:
    - field: data_office365_ClientIP
      type: ip_address
tags:
  analytic_story:
    - ARTEX Agentic Intrusion (FBI FLASH-20261113-001)
    - Office 365 Credential Access
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1110.003
  custom_tags:
    - o365
    - entra_id
    - password_spray
    - aggregation
    - artex
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:"UserLoginFailed"
aggregation:
  enabled: true
  function: distinct_count
  field: data_office365_UserId
  group_by:
    - data_office365_ClientIP
  window: 30m
  threshold: 10
  condition: ">="

correlation:
  related_rules:
  - id: 8c0bec35-db45-469d-8128-dfba743f40ba
    name: M365 Failed Sign-in Burst Against One Account
    reason: 'Same source switching from spray to focused guessing on an account that looked promising.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: 'Microsoft flagging the same IP as risky corroborates the spray.'
  window: 2h
  enrichment_searches:
  - name: Successful sign-ins from the spraying IP
    query: data_office365_Operation:"UserLoggedIn"
    pivot_on:
    - ip
    window: 6h
  - name: Any other Office 365 activity from the spraying IP
    query: _exists_:data_office365_Operation
    pivot_on:
    - ip
    window: 24h
