name: Suspicious Email Delivered In Microsoft 365
id: 3569aefd-e535-4391-8c18-24bd01a21eaf
version: 1
schema_version: "1.0"
date: "2026-01-27"
author: Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3569aefd-e535-4391-8c18-24bd01a21eaf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects instances where an email, identified as malicious or suspicious by the
  Microsoft Defender for Office 365 (formerly ATP) engine, was delivered to a
  user's Inbox or Junk folder. It might indicate that a potential threat, such
  as a spearphishing attachment or links, has bypassed initial blocking
  mechanisms and reached an end-user, requiring further investigation and
  potential remediation. MITRE ATT&CK: T1566.001, T1566.002.
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_Workload equals 'ThreatIntelligence';
  data_office365_Operation equals 'TIMailData'; data_office365_Directionality
  equals 'Inbound', among other conditions.
known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-office-365/threat-explorer-real-time-detections-about
  - https://research.splunk.com/cloud/605cc93a-70e4-4ee3-9a3d-1a62e8c9b6c2/
  - https://github.com/Bert-JanP/Hunting-Queries-Detection-Rules/blob/e7250648cb16d4a497ae8737943bf010ea96d2e6/Defender%20For%20Cloud%20Apps/MaliciousEmailDeliveredInMailbox.md
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1566/002/
response:
  message: >
    Suspicious Email Delivered In Microsoft 365 detected for user
    $data_office365_UserId$. Matched data_office365_Workload:
    $data_office365_Workload$. Matched data_office365_Operation:
    $data_office365_Operation$. MITRE ATT&CK: T1566.001, T1566.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_Workload
      type: other
    - field: data_office365_Operation
      type: operation
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1566.001
    - T1566.002
  custom_tags:
    - email
    - delivered
    - microsoft
    - o365
    - audit
    - initial_access
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Workload:/[Tt][Hh][Rr][Ee][Aa][Tt][Ii][Nn][Tt][Ee][Ll][Ll][Ii][Gg][Ee][Nn][Cc][Ee]/ AND data_office365_Operation:/[Tt][Ii][Mm][Aa][Ii][Ll][Dd][Aa][Tt][Aa]/ AND data_office365_Directionality:/[Ii][Nn][Bb][Oo][Uu][Nn][Dd]/ AND _exists_:data_office365_DeliveryAction AND NOT (data_office365_DeliveryAction:/[Bb][Ll][Oo][Cc][Kk][Ee][Dd]/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
      name: "Activity from Anonymous IP Addresses"
      reason: "next kill-chain tactic: Command and Control"
    - id: 0f2468a2-5055-4212-a368-7321198ee706
      name: "Activity from Infrequent Country"
      reason: "next kill-chain tactic: Command and Control"
    - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
      name: "Azure Login Bypassing Conditional Access Policies"
      reason: "next kill-chain tactic: Initial Access"
    - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
      name: "Data Exfiltration to Unsanctioned Apps"
      reason: "next kill-chain tactic: Exfiltration"
    - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
      name: "Disabling Multi Factor Authentication"
      reason: "next kill-chain tactic: Persistence"
    - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
      name: "Logon from a Risky IP Address"
      reason: "next kill-chain tactic: Initial Access"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Sign-in activity by this user"
      query: '(data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)'
      pivot_on: [user]
      window: 6h
    - name: "Directory / role / app-consent changes by this user"
      query: '(data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/ OR data_office365_Operation:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt] [Ff][Ee][Dd][Ee][Rr][Aa][Tt][Ii][Oo][Nn] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss].*/)'
      pivot_on: [user]
      window: 24h
    - name: "Mailbox-rule / app-consent persistence by this user"
      query: '(((data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Rr][Ee][Cc][Ii][Pp][Ii][Ee][Nn][Tt][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/)) OR ((data_office365_Operation:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Aa][Pp][Pp] [Rr][Oo][Ll][Ee] [Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt] [Gg][Rr][Aa][Nn][Tt] [Tt][Oo] [Uu][Ss][Ee][Rr].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Oo][Aa][Uu][Tt][Hh]2[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Gg][Rr][Aa][Nn][Tt].*/)))'
      pivot_on: [user]
      window: 24h
