name: Suspicious Email Delivered In Microsoft 365
id: 3569aefd-e535-4391-8c18-24bd01a21eaf
version: 1
schema_version: "1.0"
date: "2026-01-27"
author: Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3569aefd-e535-4391-8c18-24bd01a21eaf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects instances where an email, identified as malicious or suspicious by the
  Microsoft Defender for Office 365 (formerly ATP) engine, was delivered to a
  user's Inbox or Junk folder. It might indicate that a potential threat, such
  as a spearphishing attachment or links, has bypassed initial blocking
  mechanisms and reached an end-user, requiring further investigation and
  potential remediation. MITRE ATT&CK: T1566.001, T1566.002.
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_Workload equals 'ThreatIntelligence';
  data_office365_Operation equals 'TIMailData'; data_office365_Directionality
  equals 'Inbound', among other conditions.
known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-office-365/threat-explorer-real-time-detections-about
  - https://research.splunk.com/cloud/605cc93a-70e4-4ee3-9a3d-1a62e8c9b6c2/
  - https://github.com/Bert-JanP/Hunting-Queries-Detection-Rules/blob/e7250648cb16d4a497ae8737943bf010ea96d2e6/Defender%20For%20Cloud%20Apps/MaliciousEmailDeliveredInMailbox.md
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1566/002/
response:
  message: >
    Suspicious Email Delivered In Microsoft 365 detected for user
    $data_office365_UserId$. Matched data_office365_Workload:
    $data_office365_Workload$. Matched data_office365_Operation:
    $data_office365_Operation$. MITRE ATT&CK: T1566.001, T1566.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_Workload
      type: other
    - field: data_office365_Operation
      type: operation
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1566.001
    - T1566.002
  custom_tags:
    - email
    - delivered
    - microsoft
    - o365
    - audit
    - initial_access
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Workload:/[Tt][Hh][Rr][Ee][Aa][Tt][Ii][Nn][Tt][Ee][Ll][Ll][Ii][Gg][Ee][Nn][Cc][Ee]/ AND data_office365_Operation:/[Tt][Ii][Mm][Aa][Ii][Ll][Dd][Aa][Tt][Aa]/ AND data_office365_Directionality:/[Ii][Nn][Bb][Oo][Uu][Nn][Dd]/ AND _exists_:data_office365_DeliveryAction AND NOT (data_office365_DeliveryAction:/[Bb][Ll][Oo][Cc][Kk][Ee][Dd]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: If the delivered phish harvested this user's credentials, the attacker's first action is a sign-in; MDCA flagging that same user for impossible travel against their normal geography is the clearest confirmation the phishing email actually succeeded in an account takeover.
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: Attackers replay stolen credentials or AiTM session tokens from VPN/Tor/proxy infrastructure; an anonymous-IP sign-in on the recipient shortly after this email was delivered corroborates that the phish led to a compromise.
  - id: 0f2468a2-5055-4212-a368-7321198ee706
    name: Activity from Infrequent Country
    reason: A sign-in from a country the organization never sees, on the user who just received the flagged phishing email, is the geo-anomaly signature of a credential-phish takeover and turns 'email delivered' into 'account compromised'.
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: An MDCA risky-IP sign-in on the same recipient confirms the credentials harvested by the delivered phishing email are now being used by the attacker to authenticate into the tenant.
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: 'The hallmark first move after a mailbox is phished: a New-/Set-InboxRule that auto-deletes security warnings and reply mail or forwards it externally. Seeing it on the recipient directly ties this delivered phish to business-email-compromise persistence.'
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: Mailbox forwarding (Set-Mailbox ForwardingSmtpAddress/ForwardingAddress) configured on the recipient soon after the phish lands silently exfiltrates all incoming mail to the attacker, the collection step of a BEC that begins with this email.
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: If the phished account carries privilege, disabling MFA afterwards is how the attacker cements the access the email gave them; MFA tampering on or by the recipient is a must-check whenever a flagged phish reaches a user.
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: 'The impact stage of the same chain: once the phish yields account access, MDCA flags this user pushing data to an unsanctioned app, completing the delivery -> compromise -> exfiltration arc the analyst must reconstruct.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other threat-flagged inbound mail to this recipient (campaign scope)
    query: data_office365_Workload:/[Tt][Hh][Rr][Ee][Aa][Tt][Ii][Nn][Tt][Ee][Ll][Ll][Ii][Gg][Ee][Nn][Cc][Ee]/ AND data_office365_Operation:/[Tt][Ii][Mm][Aa][Ii][Ll][Dd][Aa][Tt][Aa]/ AND data_office365_Directionality:/[Ii][Nn][Bb][Oo][Uu][Nn][Dd]/
    pivot_on:
    - user
    window: 24h
  - name: MDCA sign-in anomaly for this user (account-takeover confirmation)
    query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND (data_office365_eventName:/[Ii][Mm][Pp][Oo][Ss][Ss][Ii][Bb][Ll][Ee] [Tt][Rr][Aa][Vv][Ee][Ll] [Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy]/ OR data_office365_eventName:/[Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy] [Ff][Rr][Oo][Mm] [Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ii][Pp] [Aa][Dd][Dd][Rr][Ee][Ss][Ss][Ee][Ss]/ OR data_office365_eventName:/[Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy] [Ff][Rr][Oo][Mm] [Ii][Nn][Ff][Rr][Ee][Qq][Uu][Ee][Nn][Tt] [Cc][Oo][Uu][Nn][Tt][Rr][Yy]/ OR data_office365_eventName:/[Ll][Oo][Gg] [Oo][Nn] [Ff][Rr][Oo][Mm] [Aa] [Rr][Ii][Ss][Kk][Yy] [Ii][Pp] [Aa][Dd][Dd][Rr][Ee][Ss][Ss]/)
    pivot_on:
    - user
    window: 6h
  - name: Interactive and failed sign-ins by this user
    query: (data_office365_Operation:/[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn]/ OR data_office365_Operation:/[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd]/)
    pivot_on:
    - user
    window: 6h
  - name: Mailbox hide/forward persistence rules created by this user
    query: (data_office365_Operation:/[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee]/ OR data_office365_Operation:/[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee]/ OR data_office365_Operation:/[Nn][Ee][Ww]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee]/ OR (data_office365_Operation:/[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx]/ AND data_office365_Parameters:/.*[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ii][Nn][Gg].*/))
    pivot_on:
    - user
    window: 24h
  - name: OAuth app consent / delegated-permission grants by this user
    query: (data_office365_Operation:/[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]/ OR data_office365_Operation:/[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt]/ OR data_office365_Operation:/[Aa][Dd][Dd] [Aa][Pp][Pp] [Rr][Oo][Ll][Ee] [Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt] [Gg][Rr][Aa][Nn][Tt] [Tt][Oo] [Uu][Ss][Ee][Rr]/ OR data_office365_Operation:/[Aa][Dd][Dd] [Oo][Aa][Uu][Tt][Hh]2[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Gg][Rr][Aa][Nn][Tt]/)
    pivot_on:
    - user
    window: 24h
