name: M365 Bulk Admin Password Resets by One Actor
id: 622ba115-254b-41ec-a450-75a79baecb9c
version: 1
schema_version: "1.0"
date: "2026-11-20"
author: SOCFortress LLC
status: experimental
type: aggregation
description: >
  Detects one actor performing several admin-initiated password resets on other
  accounts in a short window. FBI FLASH-20261113-001 lists account takeover
  through password resets as an ARTEX persistence technique; a compromised
  helpdesk or admin identity resetting many accounts is how that scales.
  MITRE ATT&CK: T1098 (Account Manipulation), T1531 (Account Access Removal).
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module subscribed to Audit.AzureActiveDirectory.
  The base query isolates "Reset user password." (admin-initiated resets, not
  self-service resets, which log under a different operation) and the
  aggregation counts them per actor (data_office365_UserId) over 1 hour.
  data_office365_ObjectId on the underlying events carries each target account.
known_false_positives: >
  Helpdesk staff on a busy day, onboarding batches, and scripted resets during
  an incident response. Compare the actor's normal daily volume using the
  CoPilot backtest before setting the threshold.
references:
  - https://www.ic3.gov/CSA/2026/261113.pdf
  - https://attack.mitre.org/techniques/T1098/
  - https://attack.mitre.org/techniques/T1531/
response:
  message: >
    $data_office365_UserId$ performed multiple admin password resets within the
    aggregation window. Review the target accounts and the actor's recent
    sign-ins. MITRE ATT&CK: T1098, T1531
  risk_score: 55
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 55
  threat_objects:
    - field: data_office365_Operation
      type: operation
tags:
  analytic_story:
    - ARTEX Agentic Intrusion (FBI FLASH-20261113-001)
    - Office 365 Account Takeover
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1098
    - T1531
  custom_tags:
    - o365
    - entra_id
    - password_reset
    - account_takeover
    - aggregation
    - artex
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:/Reset user password\.?/
aggregation:
  enabled: true
  function: count
  field: null
  group_by:
    - data_office365_UserId
  window: 1h
  threshold: 5
  condition: ">="

correlation:
  related_rules:
  - id: 6b719abd-33ee-40ed-9819-e02388f40e19
    name: M365 Directory Role Assigned
    reason: 'An actor that just gained a helpdesk or admin role and then resets many passwords is escalating.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Precursor: the resetting identity itself may have been hijacked.'
  window: 6h
  enrichment_searches:
  - name: Role and authentication changes by this actor
    query: (data_office365_Operation:/Add (eligible )?member to role.*/ OR data_office365_Operation:/Disable Strong Authentication\.?/)
    pivot_on:
    - user
    window: 24h
  - name: Sign-ins by this actor
    query: (data_office365_Operation:"UserLoggedIn" OR data_office365_Operation:"UserLoginFailed")
    pivot_on:
    - user
    window: 24h
