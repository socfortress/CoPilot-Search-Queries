name: New Federated Domain Added
id: 58f88172-a73d-442b-94c9-95eaed3cbb36
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Splunk Threat Research Team (original rule), Harjot Singh @cyb3rjy0t (sigma rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 58f88172-a73d-442b-94c9-95eaed3cbb36
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects the addition of a new Federated Domain. MITRE ATT&CK: T1484.002.
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_Operation matches '*domain*'; data_office365_Operation
  matches '*add*'; data_office365_Operation matches '*new*'.
known_false_positives: >
  The creation of a new Federated domain is not necessarily malicious, however
  these events need to be followed closely, as it may indicate federated
  credential abuse or backdoor via federated identities at a similar or
  different cloud provider. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.
references:
  - https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/
  - https://o365blog.com/post/aadbackdoor/
  - https://attack.mitre.org/techniques/T1484/002/
response:
  message: >
    New Federated Domain Added detected for user $data_office365_UserId$.
    Matched data_office365_Operation: $data_office365_Operation$. Matched
    data_office365_ClientIP: $data_office365_ClientIP$. MITRE ATT&CK: T1484.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_Operation
      type: operation
    - field: data_office365_ClientIP
      type: ip_address
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1484.002
  custom_tags:
    - federated
    - domain
    - added
    - o365
    - audit
    - privilege_escalation
    - defense_impairment
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:/.*[Dd][Oo][Mm][Aa][Ii][Nn].*/ AND (data_office365_Operation:/.*[Aa][Dd][Dd].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 42127bdd-9133-474f-a6f1-97b6c08a4339
    name: New Federated Domain Added - Exchange
    reason: Same federation backdoor captured on the Exchange workload (Add-FederatedDomain); a matching event for this actor confirms the added domain is actually being federated, not just registered.
  - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
    name: Azure Login Bypassing Conditional Access Policies
    reason: 'Likely precursor: a token that bypasses Conditional Access (TokenSmith/Intune device-trust) is a common way to reach Global-Admin domain operations without tripping CA.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: 'Precursor account compromise: a risky-IP sign-in for this admin explains how the account that added the domain was taken over.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'Precursor: the privileged domain change running from an anonymizing proxy/Tor points to a compromised, attacker-operated session rather than the real admin.'
  - id: 0f2468a2-5055-4212-a368-7321198ee706
    name: Activity from Infrequent Country
    reason: 'Precursor: a Global-Admin domain change from a country the tenant never operates from signals the admin credential is in attacker hands.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Precursor: impossible travel on this admin means the credential is being used by an attacker in parallel with the legitimate user around the time of the domain add.'
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: 'Co-occurring tenant-takeover step: the same privileged actor disabling MFA while planting a federation backdoor is a coordinated identity-persistence play.'
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: 'Downstream objective: once the federated domain lets the attacker forge SAML tokens, mailbox/file exfiltration by the same actor is the payoff to watch for.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Domain federation / trust weaponization by this user
    query: (data_office365_Operation:/.*[Ss][Ee][Tt] [Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt] [Ff][Ee][Dd][Ee][Rr][Aa][Tt][Ii][Oo][Nn] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss] [Oo][Nn] [Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Pp][Dd][Aa][Tt][Ee] [Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_office365_Operation:/.*[Vv][Ee][Rr][Ii][Ff][Yy] [Dd][Oo][Mm][Aa][Ii][Nn].*/)
    pivot_on:
    - user
    window: 24h
  - name: Privileged role / app / OAuth-consent grants by this user
    query: (data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Oo][Aa][Uu][Tt][Hh]2[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Gg][Rr][Aa][Nn][Tt].*/)
    pivot_on:
    - user
    window: 24h
  - name: MFA / conditional-access / password weakening by this user
    query: (data_office365_Operation:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee] [Ss][Tt][Rr][Oo][Nn][Gg] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Dd][Ii][Tt][Ii][Oo][Nn][Aa][Ll][Aa][Cc][Cc][Ee][Ss][Ss][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_office365_Operation:/.*[Uu][Pp][Dd][Aa][Tt][Ee] [Cc][Oo][Nn][Dd][Ii][Tt][Ii][Oo][Nn][Aa][Ll] [Aa][Cc][Cc][Ee][Ss][Ss] [Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_office365_Operation:/.*[Rr][Ee][Ss][Ee][Tt] [Uu][Ss][Ee][Rr] [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_office365_Operation:/.*[Uu][Pp][Dd][Aa][Tt][Ee] [Ss][Tt][Ss][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Oo][Kk][Ee][Nn][Vv][Aa][Ll][Ii][Dd][Ff][Rr][Oo][Mm].*/)
    pivot_on:
    - user
    window: 24h
  - name: Sign-in activity by this user
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: Operations from this client address
    query: _exists_:data_office365_UserId
    pivot_on:
    - ip
    window: 6h
