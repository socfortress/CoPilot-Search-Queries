name: New Federated Domain Added
id: 58f88172-a73d-442b-94c9-95eaed3cbb36
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Splunk Threat Research Team (original rule), Harjot Singh @cyb3rjy0t (sigma rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 58f88172-a73d-442b-94c9-95eaed3cbb36
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects the addition of a new Federated Domain. MITRE ATT&CK: T1484.002.
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_Operation matches '*domain*'; data_office365_Operation
  matches '*add*'; data_office365_Operation matches '*new*'.
known_false_positives: >
  The creation of a new Federated domain is not necessarily malicious, however
  these events need to be followed closely, as it may indicate federated
  credential abuse or backdoor via federated identities at a similar or
  different cloud provider. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.
references:
  - https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/
  - https://o365blog.com/post/aadbackdoor/
  - https://attack.mitre.org/techniques/T1484/002/
response:
  message: >
    New Federated Domain Added detected for user $data_office365_UserId$.
    Matched data_office365_Operation: $data_office365_Operation$. Matched
    data_office365_ClientIP: $data_office365_ClientIP$. MITRE ATT&CK: T1484.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_Operation
      type: operation
    - field: data_office365_ClientIP
      type: ip_address
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1484.002
  custom_tags:
    - federated
    - domain
    - added
    - o365
    - audit
    - privilege_escalation
    - defense_impairment
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:/.*[Dd][Oo][Mm][Aa][Ii][Nn].*/ AND (data_office365_Operation:/.*[Aa][Dd][Dd].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww].*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
      name: "Activity from Anonymous IP Addresses"
      reason: "next kill-chain tactic: Command and Control"
    - id: 0f2468a2-5055-4212-a368-7321198ee706
      name: "Activity from Infrequent Country"
      reason: "next kill-chain tactic: Command and Control"
    - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
      name: "Azure Login Bypassing Conditional Access Policies"
      reason: "next kill-chain tactic: Privilege Escalation"
    - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
      name: "Data Exfiltration to Unsanctioned Apps"
      reason: "next kill-chain tactic: Exfiltration"
    - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
      name: "Disabling Multi Factor Authentication"
      reason: "next kill-chain tactic: Credential Access"
    - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
      name: "Logon from a Risky IP Address"
      reason: "next kill-chain tactic: Privilege Escalation"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Sign-in activity by this user"
      query: '(data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)'
      pivot_on: [user]
      window: 6h
    - name: "Directory / role / app-consent changes by this user"
      query: '(data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/ OR data_office365_Operation:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt] [Ff][Ee][Dd][Ee][Rr][Aa][Tt][Ii][Oo][Nn] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss].*/)'
      pivot_on: [user]
      window: 24h
    - name: "Operations from this client address"
      query: '_exists_:data_office365_UserId'
      pivot_on: [ip]
      window: 6h
    - name: "Role / admin changes by this user"
      query: '(data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Ee][Ll][Ii][Gg][Ii][Bb][Ll][Ee] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Aa][Dd][Mm][Ii][Nn][Aa][Uu][Dd][Ii][Tt][Ll][Oo][Gg][Cc][Oo][Nn][Ff][Ii][Gg].*/)'
      pivot_on: [user]
      window: 24h
