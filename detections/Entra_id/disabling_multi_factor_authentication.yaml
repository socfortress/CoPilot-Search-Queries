name: Disabling Multi Factor Authentication
id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Splunk Threat Research Team (original rule), Harjot Singh @cyb3rjy0t (sigma rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects disabling of Multi Factor Authentication. MITRE ATT&CK: T1556.006.
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_Operation matches '*Disable Strong Authentication.*'.
known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://research.splunk.com/cloud/c783dd98-c703-4252-9e8a-f19d9f5c949e/
  - https://attack.mitre.org/techniques/T1556/006/
response:
  message: >
    Disabling Multi Factor Authentication detected for user
    $data_office365_UserId$. Matched data_office365_Operation:
    $data_office365_Operation$. Matched data_office365_ClientIP:
    $data_office365_ClientIP$. MITRE ATT&CK: T1556.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 75
  threat_objects:
    - field: data_office365_Operation
      type: operation
    - field: data_office365_ClientIP
      type: ip_address
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1556.006
  custom_tags:
    - disabling
    - multi
    - factor
    - o365
    - audit
    - persistence
    - credential_access
    - defense_impairment
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee] [Ss][Tt][Rr][Oo][Nn][Gg] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\..*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
      name: "Activity from Anonymous IP Addresses"
      reason: "next kill-chain tactic: Command and Control"
    - id: 0f2468a2-5055-4212-a368-7321198ee706
      name: "Activity from Infrequent Country"
      reason: "next kill-chain tactic: Command and Control"
    - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
      name: "Azure Login Bypassing Conditional Access Policies"
      reason: "next kill-chain tactic: Persistence"
    - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
      name: "Data Exfiltration to Unsanctioned Apps"
      reason: "next kill-chain tactic: Exfiltration"
    - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
      name: "Logon from a Risky IP Address"
      reason: "next kill-chain tactic: Persistence"
    - id: M365_Email_Forwarding_Created
      name: "M365 Email Forwarding Created"
      reason: "next kill-chain tactic: Collection"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "All Office 365 operations by this user"
      query: 'data_office365_UserId:*'
      pivot_on: [user]
      window: 1h
    - name: "Office 365 sign-in activity by this user"
      query: 'data_office365_Operation:("UserLoggedIn" OR "UserLoginFailed")'
      pivot_on: [user]
      window: 6h
    - name: "High-severity alerts for this user"
      query: 'rule_level:>=10'
      pivot_on: [user]
      window: 1h
