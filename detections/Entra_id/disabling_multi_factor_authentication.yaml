name: Disabling Multi Factor Authentication
id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Splunk Threat Research Team (original rule), Harjot Singh @cyb3rjy0t (sigma rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects disabling of Multi Factor Authentication. MITRE ATT&CK: T1556.006.
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_Operation matches '*Disable Strong Authentication.*'.
known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://research.splunk.com/cloud/c783dd98-c703-4252-9e8a-f19d9f5c949e/
  - https://attack.mitre.org/techniques/T1556/006/
response:
  message: >
    Disabling Multi Factor Authentication detected for user
    $data_office365_UserId$. Matched data_office365_Operation:
    $data_office365_Operation$. Matched data_office365_ClientIP:
    $data_office365_ClientIP$. MITRE ATT&CK: T1556.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 75
  threat_objects:
    - field: data_office365_Operation
      type: operation
    - field: data_office365_ClientIP
      type: ip_address
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1556.006
  custom_tags:
    - disabling
    - multi
    - factor
    - o365
    - audit
    - persistence
    - credential_access
    - defense_impairment
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_Operation:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee] [Ss][Tt][Rr][Oo][Nn][Gg] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\..*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: 'Precursor account takeover: disabling another user''s MFA needs a privileged session, which the attacker usually obtains via a risky-IP sign-in on the same account/IP minutes before the Disable Strong Authentication event.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Precursor stolen-session indicator: an impossible-travel sign-in on the same user just before MFA is removed is strong evidence the account was hijacked rather than an admin doing housekeeping.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'Precursor: the actor often reaches the tenant through Tor/VPN/anonymizing proxy to hide origin; an anonymous-IP sign-in on the same user/IP shortly before the disable corroborates malicious intent.'
  - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
    name: Azure Login Bypassing Conditional Access Policies
    reason: 'Same goal, same campaign: removing MFA and bypassing Conditional Access (TokenSmith) are both auth-friction-removal moves; seeing the same user defeat CA around the MFA disable points to deliberate control evasion.'
  - id: 58f88172-a73d-442b-94c9-95eaed3cbb36
    name: New Federated Domain Added
    reason: 'Co-occurring identity-trust tampering: Disable Strong Authentication and adding a federated domain are the paired AADInternals/golden-SAML backdoor TTPs an actor runs together to weaken and then forge tenant authentication.'
  - id: 42127bdd-9133-474f-a6f1-97b6c08a4339
    name: New Federated Domain Added - Exchange
    reason: Co-occurring Exchange-workload variant of the federation backdoor (Add-FederatedDomain, golden-SAML); the same actor stripping MFA frequently also establishes a federated-identity backdoor in the same window.
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: 'Follow-on BEC collection: once MFA no longer blocks re-entry, the attacker sets mailbox forwarding (Set-Mailbox) on the account to silently exfiltrate incoming mail.'
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: 'Follow-on BEC persistence/evidence-hiding: after securing MFA-free access, the attacker creates an inbox rule (New-InboxRule) to auto-forward or hide security and reply mail on the same account.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MFA and strong-authentication changes on this account
    query: (data_office365_Operation:/.*[Ss][Tt][Rr][Oo][Nn][Gg] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Ii][Nn][Ff][Oo].*/ OR data_office365_Operation:/.*[Ss][Tt][Ss][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Oo][Kk][Ee][Nn].*/)
    pivot_on:
    - user
    window: 24h
  - name: Password reset or change on this account
    query: data_office365_Operation:/.*[Uu][Ss][Ee][Rr] [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/
    pivot_on:
    - user
    window: 24h
  - name: Privileged role granted to this account
    query: data_office365_Operation:/.*[Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/
    pivot_on:
    - user
    window: 24h
  - name: Mailbox forwarding or inbox rules set for this account
    query: (data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/)
    pivot_on:
    - user
    window: 6h
  - name: Other sign-ins from the same source IP
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - ip
    window: 2h
