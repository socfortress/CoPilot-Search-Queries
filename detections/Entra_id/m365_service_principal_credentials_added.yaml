name: M365 Service Principal or Application Credentials Added
id: b3b194b9-ce18-43bf-b6dd-81347e61c04d
version: 1
schema_version: "1.0"
date: "2026-11-20"
author: SOCFortress LLC
status: experimental
type: match
description: >
  Detects a new client secret or certificate being added to an Entra ID
  application or service principal. Adding credentials to an existing, already
  consented OAuth application gives an attacker durable app-only access (for
  example Microsoft Graph mail and file reads) that survives user password
  resets and MFA. FBI FLASH-20261113-001 reports ARTEX operators adding
  credentials to existing OAuth applications for persistence. Low-volume event,
  worth reviewing on every occurrence.
  MITRE ATT&CK: T1098.001 (Account Manipulation: Additional Cloud Credentials).
data_source:
  - Office 365 Management Activity API
  - "Workload: AzureActiveDirectory"
workload: AzureActiveDirectory
how_to_implement: >
  Requires the Wazuh office365 module subscribed to Audit.AzureActiveDirectory.
  Matches the Entra ID audit operations "Add service principal credentials."
  and "Update application ... Certificates and secrets management". Microsoft's
  second operation name uses a non-ASCII dash and a trailing space, so the
  query matches the separator with a single-character wildcard and tolerates a
  trailing space or period. data_office365_ObjectId carries the target app or
  service principal. If the pipeline flattens ModifiedProperties, the key type
  and display name are in data_office365_ModifiedProperties.
known_false_positives: >
  Planned secret or certificate rotation by app owners, CI/CD automation that
  rotates its own credentials, and Microsoft first-party services rotating keys.
  Confirm the actor (data_office365_UserId) and the target app. A new secret on
  a high-privilege app (mail, files or directory write scopes) that nobody
  planned should be treated as a compromise until proven otherwise.
references:
  - https://www.ic3.gov/CSA/2026/261113.pdf
  - https://attack.mitre.org/techniques/T1098/001/
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
response:
  message: >
    Credentials added to application or service principal
    $data_office365_ObjectId$ by $data_office365_UserId$. Operation:
    $data_office365_Operation$. Source IP: $data_office365_ClientIP$.
    Confirm the change was planned. MITRE ATT&CK: T1098.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 75
  threat_objects:
    - field: data_office365_Operation
      type: operation
    - field: data_office365_ObjectId
      type: other
    - field: data_office365_ClientIP
      type: ip_address
tags:
  analytic_story:
    - ARTEX Agentic Intrusion (FBI FLASH-20261113-001)
    - Office 365 Persistence
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1098.001
  custom_tags:
    - o365
    - entra_id
    - service_principal
    - oauth
    - persistence
    - artex
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: (data_office365_Operation:/Add service principal credentials[ .]*/ OR data_office365_Operation:/Update application . Certificates and secrets management[ .]*/)

correlation:
  related_rules:
  - id: ac79ba54-3626-416c-81ca-f48654667092
    name: M365 OAuth Consent or App Permission Granted
    reason: 'Same persistence chain: an attacker who adds a secret to an app often grants that app new application permissions (Mail.Read, Files.Read.All) in the same session, turning the secret into broad app-only data access.'
  - id: 07b3a5b9-f4bf-4146-9a78-8b5b9072b1a8
    name: M365 Application or Service Principal Owner Added
    reason: 'Owners can add credentials themselves. A new owner on the same app shortly before the secret appears explains who was able to add it.'
  - id: be9d9e2d-5daf-4db4-b5c5-1e65864329bf
    name: M365 One Identity Reading Many Mailboxes
    reason: 'Follow-on collection: the new app credential is typically used for app-only Graph mail reads across many mailboxes (T1114.002).'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: 'Precursor: the actor usually gained the admin or app-owner session from a risky IP before modifying app credentials.'
  window: 6h
  enrichment_searches:
  - name: Other app, consent, owner and credential changes by this actor
    query: (data_office365_Operation:/Consent to application\.?/ OR data_office365_Operation:/Add delegated permission grant\.?/ OR data_office365_Operation:/Add app role assignment to service principal\.?/ OR data_office365_Operation:/Add owner to (service principal|application)\.?/ OR data_office365_Operation:/Add service principal credentials[ .]*/)
    pivot_on:
    - user
    window: 24h
  - name: Sign-ins and failed sign-ins by this actor
    query: (data_office365_Operation:"UserLoggedIn" OR data_office365_Operation:"UserLoginFailed")
    pivot_on:
    - user
    window: 24h
