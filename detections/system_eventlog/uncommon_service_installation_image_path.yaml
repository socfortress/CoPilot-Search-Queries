name: Uncommon Service Installation Image Path
id: 26481afe-db26-4228-b264-25a29fe6efc7
version: 1
schema_version: "1.0"
date: "2024-02-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 26481afe-db26-4228-b264-25a29fe6efc7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon service installation commands by looking at suspicious or
  uncommon image path values containing references to encoded powershell
  commands, temporary paths, etc. MITRE ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\\\\\.\\\\pipe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "* -e*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "* aQBlAHgA*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "* aWV4I*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "* IAB*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "* JAB*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "* PAA*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "* SQBFAFgA*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "* SUVYI*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imagePath"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "C:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Definition Updates\\\\*"
                    case_insensitive: true
        - exists:
            field: "data_win_eventdata_imagePath"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "C:\\\\WINDOWS\\\\TEMP\\\\thor10-remote\\\\thor64.exe*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*\\.\pipe*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Uncommon Service Installation Image Path detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE
    ATT&CK: T1543.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - uncommon
    - service
    - installation
    - windows_system
    - persistence
    - privilege_escalation
    - car_2013_09_005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*\\\\\.\\[Pp][Ii][Pp][Ee].*/ OR data_win_eventdata_imagePath:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imagePath:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR (data_win_eventdata_imagePath:/.* -[Ee].*/ AND (data_win_eventdata_imagePath:/.* [Aa][Qq][Bb][Ll][Aa][Hh][Gg][Aa].*/ OR data_win_eventdata_imagePath:/.* [Aa][Ww][Vv]4[Ii].*/ OR data_win_eventdata_imagePath:/.* [Ii][Aa][Bb].*/ OR data_win_eventdata_imagePath:/.* [Jj][Aa][Bb].*/ OR data_win_eventdata_imagePath:/.* [Pp][Aa][Aa].*/ OR data_win_eventdata_imagePath:/.* [Ss][Qq][Bb][Ff][Aa][Ff][Gg][Aa].*/ OR data_win_eventdata_imagePath:/.* [Ss][Uu][Vv][Yy][Ii].*/))) AND _exists_:data_win_eventdata_imagePath AND NOT (data_win_eventdata_imagePath:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn] [Uu][Pp][Dd][Aa][Tt][Ee][Ss]\\.*/) AND _exists_:data_win_eventdata_imagePath AND NOT (data_win_eventdata_imagePath:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Tt][Hh][Oo][Rr]10-[Rr][Ee][Mm][Oo][Tt][Ee]\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Named-pipe or Temp image paths in a 7045 are the PsExec/SMBExec remote-service pattern; PSEXESVC process start is the same lateral movement seen from process creation
  - id: f0e2b768-5220-47dd-b891-d57b96fc0ec1
    name: CSExec Service File Creation
    reason: Remote service tools drop their service binary to disk before SCM installs it; this is the file-write precursor of the 7045
  - id: 7eff1a7f-dd45-4c20-877a-f21e342a7611
    name: RemCom Service File Creation
    reason: RemCom drops a service executable then registers it via SCM, producing the same 7045 with an uncommon image path
  - id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
    name: Potential CobaltStrike Service Installations - Registry
    reason: Cobalt Strike psexec/jump and encoded -e PowerShell service payloads write the same ImagePath to the Services registry key, confirming the installation
  - id: a07f0359-4c90-4dc4-a681-8ffea40b4f47
    name: Service Binary in Suspicious Folder
    reason: Registry-side view of the same ImagePath pointing at Public or Temp folders, corroborating the service-install event
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Registry ImagePath of a newly created service with suspicious values is the same installation seen via Sysmon registry telemetry
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: sc.exe/New-Service command line is the usual way the service is created locally, revealing the parent process and account behind the 7045
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: Process execution from a suspicious service binary directory is the payload actually starting after installation
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service creation via sc.exe / New-Service / Install-Service
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/) OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on:
    - host
    window: 1h
  - name: Service binary or PSEXESVC payload written to Public/Temp
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Service-spawned shell or encoded PowerShell (services.exe child)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote network logon and SMB admin-share access (lateral movement)
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR (data_win_system_eventID:"5140" AND data_win_eventdata_shareName:/.*(ADMIN|C)\$/)
    pivot_on:
    - host
    window: 1h
  - name: Credential dumping and LSASS access after service install
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]).*/)
    pivot_on:
    - host
    window: 2h
