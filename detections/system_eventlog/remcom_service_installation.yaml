name: RemCom Service Installation
id: 9e36ed87-4986-482e-8e3b-5c23ffff11bf
version: 1
schema_version: "1.0"
date: "2023-08-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e36ed87-4986-482e-8e3b-5c23ffff11bf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects RemCom service installation and execution events. MITRE ATT&CK:
  T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - term:
                  data_win_eventdata_serviceName:
                    value: "RemComSvc"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\RemComSvc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'RemComSvc', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/kavika13/RemCom/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    RemCom Service Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - remcom
    - service
    - installation
    - windows_system
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]/ OR data_win_eventdata_imagePath:/.*\\[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d36f87ea-c403-44d2-aa79-1a0ac7c24456
    name: PUA - RemCom Default Named Pipe
    reason: RemCom's service creates its default communication pipes right after the 7045 install; confirms the service started and is being driven remotely
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Remote service creation over SMB via the SVCCTL pipe is the mechanism that produces the 7045; shows the remote source of the install
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: RemCom is a PsExec clone; operators swap between PsExec/RemCom/PAExec/CSExec on the same target during lateral movement
  - id: 52a85084-6989-40c3-8f32-091e12e13f09
    name: smbexec.py Service Installation
    reason: Alternate SMB service-exec lateral-movement tooling producing the same 7045 pattern if RemCom is blocked
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Other offensive-tool services registered on the host once remote execution is established
  - id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
    name: Credential Dumping Tools Service Execution - System
    reason: 'Typical follow-on: SYSTEM-level remote execution used to launch credential dumping tools as a service'
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Same 7045 event keyed on the installing client account; identifies the remote account that installed the service
  - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
    name: Eventlog Cleared
    reason: Attackers often clear logs on the target after RemCom-driven execution to remove service-install traces
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RemComSvc process and children on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: RemComSvc binary written to host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: RemCom named pipes created or connected
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*[Rr][Ee][Mm][Cc][Oo][Mm].*/
    pivot_on:
    - host
    window: 1h
  - name: ADMIN$ / SVCCTL share access and network logon preceding the install
    query: (data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*([Aa][Dd][Mm][Ii][Nn]|[Ii][Pp][Cc])\$.*/ AND (data_win_eventdata_relativeTargetName:/.*[Rr][Ee][Mm][Cc][Oo][Mm].*/ OR data_win_eventdata_relativeTargetName:/.*[Ss][Vv][Cc][Cc][Tt][Ll].*/)) OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM")
    pivot_on:
    - host
    window: 1h
  - name: Recon / post-exploitation commands spawned by RemComSvc
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Rr][Ee][Mm][Cc][Oo][Mm][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Mm][Ii][Cc]|[Nn][Ee][Tt]1?|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Rr][Ee][Gg])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
