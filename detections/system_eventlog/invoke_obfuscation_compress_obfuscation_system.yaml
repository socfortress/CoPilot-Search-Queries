name: Invoke-Obfuscation COMPRESS OBFUSCATION - System
id: 175997c5-803c-4b08-8bb0-70b099f47595
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 175997c5-803c-4b08-8bb0-70b099f47595
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via COMPRESS OBFUSCATION. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*new-object*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*text.encoding]::ascii*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*readtoend*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*:system.io.compression.deflatestream*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*system.io.streamreader*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*new-object*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation COMPRESS OBFUSCATION - System detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_imagePath:
    $data_win_eventdata_imagePath$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - compress
    - windows_system
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_imagePath:/.*[Tt][Ee][Xx][Tt]\.[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]\]::[Aa][Ss][Cc][Ii][Ii].*/ AND data_win_eventdata_imagePath:/.*[Rr][Ee][Aa][Dd][Tt][Oo][Ee][Nn][Dd].*/ AND (data_win_eventdata_imagePath:/.*:[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]\.[Dd][Ee][Ff][Ll][Aa][Tt][Ee][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_imagePath:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Ss][Tt][Rr][Ee][Aa][Mm][Rr][Ee][Aa][Dd][Ee][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7
    name: Invoke-Obfuscation COMPRESS OBFUSCATION
    reason: Same DeflateStream/StreamReader payload seen as a process command line; the service's powershell child (or the launcher before it) confirms what the 7045 service actually ran.
  - id: 7034cbbb-cc55-4dc2-8dad-36c0b942e8f1
    name: Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell Module
    reason: Once the service starts powershell.exe, the decompress-and-IEX stage is logged in module logging (4103) on the same host, proving the payload executed.
  - id: 51aa9387-1c53-4153-91cc-d73c59ae1ca9
    name: Invoke-Obfuscation Obfuscated IEX Invocation - System
    reason: Decompressed payload is normally passed to an obfuscated IEX; the sibling 7045 rule indicates the same operator tooling creating multiple obfuscated services.
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: Service-based PowerShell payload delivery (psexec/jump psexec_psh) is the typical Cobalt Strike lateral/privesc route that produces this same 7045 pattern.
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: 'Same 7045 service-creation channel: known offensive tooling registering a service on the host alongside the obfuscated one.'
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Remote service creation with an inline PowerShell ImagePath is how PsExec-style lateral movement lands a payload; indicates the source of the service.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The sc.exe/New-Service command that created the malicious service is the direct precursor of the 7045 event.
  - id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
    name: Credential Dumping Tools Service Execution - System
    reason: After SYSTEM-level execution via a service, credential dumping (mimikatz/wce services) is the common next step on the same host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell spawned by services.exe with compression/decode primitives
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Script blocks using DeflateStream/GZip decompression into IEX
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DeflateStream* OR data_win_eventdata_scriptBlockText:*GzipStream* OR data_win_eventdata_scriptBlockText:*FromBase64String*) AND (data_win_eventdata_scriptBlockText:*ReadToEnd* OR data_win_eventdata_scriptBlockText:*IEX* OR data_win_eventdata_scriptBlockText:*Invoke-Expression*)
    pivot_on:
    - host
    window: 1h
  - name: Network connections by PowerShell after service payload runs (stager/C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Service-key registry writes pointing at PowerShell or cmd
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc]ontrol[Ss]et.*\\[Ss]ervices\\.*\\[Ii]mage[Pp]ath.*/ AND (data_win_eventdata_details:*powershell* OR data_win_eventdata_details:*cmd.exe*)
    pivot_on:
    - host
    window: 2h
  - name: 'Credential access follow-on: LSASS access or credential tool execution'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*procdump* OR data_win_eventdata_commandLine:*comsvcs.dll*))
    pivot_on:
    - host
    window: 4h
