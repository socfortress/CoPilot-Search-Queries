name: New PDQDeploy Service - Server Side
id: ee9ca27c-9bd7-4cee-9b01-6e906be7cae3
version: 1
schema_version: "1.0"
date: "2022-07-22"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ee9ca27c-9bd7-4cee-9b01-6e906be7cae3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a PDQDeploy service installation which indicates that PDQDeploy was
  installed on the machines. PDQDeploy can be abused by attackers to remotely
  install packages or execute commands on target machines. MITRE ATT&CK:
  T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*PDQDeployService.exe*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "PDQDeploy"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "PDQ Deploy"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*PDQDeployService.exe*', among other conditions.

known_false_positives: >
  Legitimate use of the tool. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://documentation.pdq.com/PDQDeploy/13.0.3.0/index.html?windows-services.htm
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    New PDQDeploy Service - Server Side detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE ATT&CK:
    T1543.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - pdqdeploy
    - service
    - server
    - windows_system
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_serviceName:/[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy]/ OR data_win_eventdata_serviceName:/[Pp][Dd][Qq] [Dd][Ee][Pp][Ll][Oo][Yy]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b98a10af-1e1e-44a7-bab2-4cc026917648
    name: New PDQDeploy Service - Client Side
    reason: The PDQ Deploy server-side service means a console was installed here; the client-side PDQ runner service on other hosts confirms the tool is already pushing to targets.
  - id: d679950c-abb7-43a6-80fb-2a480c4fc450
    name: PDQ Deploy Remote Adminstartion Tool Execution
    reason: Process-level execution of PDQ Deploy right after its service is installed shows the tool actually being used rather than just installed.
  - id: 12b8e9f5-96b2-41e1-9a42-8c6779a5c184
    name: Potentially Suspicious Execution Of PDQDeployRunner
    reason: PDQDeployRunner is the child that executes deployed packages and commands, so this is the payload-execution step following installation.
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: A 7045 for PDQ installed by a remote or unusual client suggests the tool was pushed over SMB rather than installed by a local admin.
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: Attackers who install PDQ as a remote-execution channel often also use PsExec-style service pushes for lateral movement on the same host.
  - id: 5e993621-67d4-488a-b9ae-b420d08b96cb
    name: Service Installation in Suspicious Folder
    reason: A PDQ service whose image path sits in a user-writable folder indicates a dropped, attacker-staged copy rather than a managed install.
  - id: 530a6faa-ff3d-4022-b315-50828e77eef5
    name: Anydesk Remote Access Software Service Installation
    reason: Dual-use remote access tooling installed as a service close in time points to attacker staging of redundant remote-control channels.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PDQ Deploy binaries executing on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy].*/ OR data_win_eventdata_image:/.*[Pp][Dd][Qq][Rr][Uu][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_parentImage:/.*[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy].*/ OR data_win_eventdata_parentImage:/.*[Pp][Dd][Qq][Rr][Uu][Nn][Nn][Ee][Rr].*/)
    pivot_on:
    - host
    window: 4h
  - name: Shells and LOLBins spawned by PDQ services
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Pp][Dd][Qq].*/) AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Other new services installed on this host
    query: data_win_system_eventID:"7045" AND NOT data_win_eventdata_serviceName:/.*[Pp][Dd][Qq].*/
    pivot_on:
    - host
    window: 6h
  - name: PDQ installer or runner files dropped
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy].*/ OR data_win_eventdata_targetFilename:/.*[Pp][Dd][Qq][Rr][Uu][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_targetFilename:/.*[Aa][Dd][Mm][Ii][Nn]\$.*[Pp][Dd][Qq].*/)
    pivot_on:
    - host
    window: 4h
  - name: Network logons to this host preceding PDQ install
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    window: 2h
