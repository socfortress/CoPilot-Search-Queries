name: Invoke-Obfuscation Obfuscated IEX Invocation - System
id: 51aa9387-1c53-4153-91cc-d73c59ae1ca9
version: 1
schema_version: "1.0"
date: "2022-11-27"
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 51aa9387-1c53-4153-91cc-d73c59ae1ca9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the code block linked in the references.
  MITRE ATT&CK: T1027.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$PSHome\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$PSHome\\[).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$ShellId\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$ShellId\\[).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$env:Public\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$env:Public\\[).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$env:ComSpec\\[([ ]*[0-9]{1,3}[ ]*,){2}).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\\\*mdr\\*[^A-Za-z0-9_][ ]*\\)\\.Name).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$VerbosePreference\\.ToString\\().*"
              - regexp:
                  data_win_eventdata_imagePath: ".*([^ ]tring\\][ ]*\\$VerbosePreference).*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '7045';
  data_win_eventdata_imagePath matches the regex /.*(\$PSHome\[[ ]*[0-9]{1,3}[
  ]*\][ ]*\+[ ]*\$PSHome\[).*/; data_win_eventdata_imagePath matches the regex
  /.*(\$ShellId\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$ShellId\[).*/, among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Invoke-Obfuscation Obfuscated IEX Invocation - System detected on host
    $agent_name$. Matched data_win_eventdata_imagePath:
    $data_win_eventdata_imagePath$. MITRE ATT&CK: T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - invoke
    - obfuscation
    - obfuscated
    - windows_system
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*(\$PSHome\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$PSHome\[).*/ OR data_win_eventdata_imagePath:/.*(\$ShellId\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$ShellId\[).*/ OR data_win_eventdata_imagePath:/.*(\$env:Public\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$env:Public\[).*/ OR data_win_eventdata_imagePath:/.*(\$env:ComSpec\[([ ]*[0-9]{1,3}[ ]*,){2}).*/ OR data_win_eventdata_imagePath:/.*(\\*mdr\*[^A-Za-z0-9_][ ]*\)\.Name).*/ OR data_win_eventdata_imagePath:/.*(\$VerbosePreference\.ToString\().*/ OR data_win_eventdata_imagePath:/.*([^ ]tring\][ ]*\$VerbosePreference).*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
