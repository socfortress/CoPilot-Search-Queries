name: Invoke-Obfuscation Obfuscated IEX Invocation - System
id: 51aa9387-1c53-4153-91cc-d73c59ae1ca9
version: 1
schema_version: "1.0"
date: "2022-11-27"
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 51aa9387-1c53-4153-91cc-d73c59ae1ca9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the code block linked in the references.
  MITRE ATT&CK: T1027.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$PSHome\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$PSHome\\[).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$ShellId\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$ShellId\\[).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$env:Public\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$env:Public\\[).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$env:ComSpec\\[([ ]*[0-9]{1,3}[ ]*,){2}).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\\\*mdr\\*[^A-Za-z0-9_][ ]*\\)\\.Name).*"
              - regexp:
                  data_win_eventdata_imagePath: ".*(\\$VerbosePreference\\.ToString\\().*"
              - regexp:
                  data_win_eventdata_imagePath: ".*([^ ]tring\\][ ]*\\$VerbosePreference).*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '7045';
  data_win_eventdata_imagePath matches the regex /.*(\$PSHome\[[ ]*[0-9]{1,3}[
  ]*\][ ]*\+[ ]*\$PSHome\[).*/; data_win_eventdata_imagePath matches the regex
  /.*(\$ShellId\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$ShellId\[).*/, among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Invoke-Obfuscation Obfuscated IEX Invocation - System detected on host
    $agent_name$. Matched data_win_eventdata_imagePath:
    $data_win_eventdata_imagePath$. MITRE ATT&CK: T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - invoke
    - obfuscation
    - obfuscated
    - windows_system
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*(\$PSHome\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$PSHome\[).*/ OR data_win_eventdata_imagePath:/.*(\$ShellId\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$ShellId\[).*/ OR data_win_eventdata_imagePath:/.*(\$env:Public\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$env:Public\[).*/ OR data_win_eventdata_imagePath:/.*(\$env:ComSpec\[([ ]*[0-9]{1,3}[ ]*,){2}).*/ OR data_win_eventdata_imagePath:/.*(\\*mdr\*[^A-Za-z0-9_][ ]*\)\.Name).*/ OR data_win_eventdata_imagePath:/.*(\$VerbosePreference\.ToString\().*/ OR data_win_eventdata_imagePath:/.*([^ ]tring\][ ]*\$VerbosePreference).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
    reason: 'Same 7045 mechanism: C2 frameworks install a throwaway service whose ImagePath runs an encoded/obfuscated PowerShell one-liner to get SYSTEM; the obfuscated IEX is the payload of that service.'
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: Cobalt Strike psexec/jump-psexec services carry PowerShell stagers in ImagePath, a direct co-occurring way to land an obfuscated IEX cradle.
  - id: a2e5019d-a658-4c6a-92bf-7197b54e2cae
    name: PowerShell Scripts Installed as Services
    reason: Same service event 7045 launching PowerShell; confirms the service was a script-execution vehicle rather than a normal binary.
  - id: 70f00d10-60b2-4f34-b9a0-dc3df3fe762a
    name: Suspicious Service Installation Script
    reason: Generic suspicious-command service ImagePath detection that fires alongside the obfuscation-specific variant when the payload is a script launcher.
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: A remotely created service (SMB/RPC from another host) shows the lateral-movement origin of the obfuscated service payload.
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: PsExec-style remote service creation is the common delivery path for service-based obfuscated PowerShell during lateral movement.
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: The same IEX obfuscation decoded at execution time in script block logging, showing what the service actually ran.
  - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
    name: Eventlog Cleared
    reason: Attackers using obfuscated service execution often clear logs afterwards to hide the 7045 and script traces.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Obfuscated IEX / launcher in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(\$PSHome\[|\$ShellId\[|\$env:ComSpec\[|\$VerbosePreference\.ToString).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*-[Jj]oin.*[Ii][Ee][Xx].*/)
    pivot_on:
    - host
    window: 1h
  - name: Service-spawned shell with obfuscated command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[\\][Ss]ervices\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*[\\]([Pp]ower[Ss]hell|[Cc]md|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from PowerShell after service execution
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[\\]([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups from PowerShell (payload staging)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[\\]([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Remote network logons preceding service creation
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_ipAddress:("-" OR "127.0.0.1" OR "::1")
    pivot_on:
    - host
    window: 1h
