name: PsExec Service Installation
id: 42c575ea-e41e-41f1-b248-8093c3e82a28
version: 1
schema_version: "1.0"
date: "2023-08-04"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 42c575ea-e41e-41f1-b248-8093c3e82a28
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PsExec service installation and execution events. MITRE ATT&CK:
  T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - term:
                  data_win_eventdata_serviceName:
                    value: "PSEXESVC"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\PSEXESVC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'PSEXESVC', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.jpcert.or.jp/english/pub/sr/ir_research.html
  - https://jpcertcc.github.io/ToolAnalysisResultSheet
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PsExec Service Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - psexec
    - service
    - installation
    - windows_system
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]/ OR data_win_eventdata_imagePath:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: PsExec first copies PSEXESVC.exe into ADMIN$ over SMB; a remote admin-share file write just before the 7045 is the delivery step.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: The service is created remotely via RPC over the svcctl pipe on IPC$; this is the network-side counterpart of the 7045 service creation.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Sysmon process creation of PSEXESVC.exe from C:\Windows right after the service is installed confirms the service actually started.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: 'Shows what the operator ran through the service: child processes of PSEXESVC.exe running as SYSTEM, the actual hands-on-keyboard payload.'
  - id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82
    name: Suspicious PsExec Execution
    reason: PsExec's -stdin/-stdout/-stderr pipes opened on IPC$ (event 5145) are the I/O channel of the session that the service serves.
  - id: 41504465-5e3a-4a5b-a5b4-2a0baadd4463
    name: PsExec Tool Execution From Suspicious Locations - PipeName
    reason: The PSEXESVC named pipe created by a binary from a user-writable path indicates a dropped or renamed copy rather than sanctioned admin use.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: 'Same tool on the source side: if the source host is also monitored, psexec.exe launch there identifies the pivot origin.'
  - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
    name: Eventlog Cleared
    reason: Attackers using PsExec for remote SYSTEM access commonly clear logs afterwards to hide the lateral movement.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by PSEXESVC (commands run remotely)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: PSEXESVC binary drop and named pipes
    query: ((data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/) OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/))
    pivot_on:
    - host
    window: 1h
  - name: Admin share and svcctl/PsExec pipe access over SMB
    query: data_win_system_eventID:"5145" AND (data_win_eventdata_shareName:/.*[Aa][Dd][Mm][Ii][Nn]\$/ OR data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/) AND (data_win_eventdata_relativeTargetName:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/ OR data_win_eventdata_relativeTargetName:/.*[Ss][Vv][Cc][Cc][Tt][Ll].*/ OR data_win_eventdata_relativeTargetName:/.*-[Ss][Tt][Dd][Ii][Nn]/ OR data_win_eventdata_relativeTargetName:/.*-[Ss][Tt][Dd][Oo][Uu][Tt]/)
    pivot_on:
    - host
    - ip
    window: 1h
  - name: Network (type 3) logons preceding the remote service install
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - host
    - ip
    window: 1h
  - name: 'Post-exploitation under SYSTEM: credential dumping, log clearing, shadow copy abuse'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\(wevtutil|vssadmin|ntdsutil|procdump64?)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Ss][Aa][Vv][Ee] [Hh][Kk][Ll][Mm]\[Ss][Aa][Mm]).*/)
    pivot_on:
    - host
    window: 4h
