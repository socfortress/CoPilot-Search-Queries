name: Important Windows Service Terminated Unexpectedly
id: 56abae0c-6212-4b97-adc0-0b559bb950c3
version: 1
schema_version: "1.0"
date: "2023-04-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 56abae0c-6212-4b97-adc0-0b559bb950c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects important or interesting Windows services that got terminated
  unexpectedly.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7034"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Message Queuing*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*4d0053004d005100*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*6d0073006d007100*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_param1
    - data_win_eventdata_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7034'; data_win_eventdata_param1 matches
  '*Message Queuing*', among other conditions.

known_false_positives: >
  Rare false positives could occur since service termination could happen due to
  multiple reasons. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.randori.com/blog/vulnerability-analysis-queuejumper-cve-2023-21554/

response:
  message: >
    Important Windows Service Terminated Unexpectedly detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_param1:
    $data_win_eventdata_param1$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_param1
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - important
    - service
    - terminated
    - windows_system
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7034" AND (data_win_eventdata_param1:/.*[Mm][Ee][Ss][Ss][Aa][Gg][Ee] [Qq][Uu][Ee][Uu][Ii][Nn][Gg].*/ OR data_win_eventdata_binary:/.*4[Dd]0053004[Dd]005100.*/ OR data_win_eventdata_binary:/.*6[Dd]0073006[Dd]007100.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ae94b10d-fee9-4767-82bb-439b309d5a27
    name: MSMQ Corrupted Packet Encountered
    reason: 'Same MSMQ service: a malformed packet logged by MSMQ just before the crash is the QueueJumper (CVE-2023-21554) exploit attempt that kills mqsvc.exe.'
  - id: d6b5520d-3934-48b4-928c-2aa3f92d6963
    name: Important Windows Service Terminated With Error
    reason: Sibling SCM detection (7023/7024) for the same services; a failed exploit often yields both a termination and an error-exit on restart.
  - id: 882fbe50-d8d7-4e29-ae80-0648a8556866
    name: Crash Dump Created By Operating System
    reason: A service killed by memory corruption frequently leaves a crash dump, confirming a crash rather than an administrative stop.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: After a successful RCE in a service, attackers commonly create a new service for persistence or SYSTEM execution.
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: 'Post-exploitation follow-on: C2 payloads from service exploits are often installed as services (7045).'
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Hacktool services registered after the crashed service was exploited indicate lateral movement tooling.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by MSMQ service (mqsvc.exe)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Mm][Qq][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Inbound connections to MSMQ port 1801
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"1801" AND data_win_eventdata_initiated:"false"
    pivot_on:
    - host
    window: 2h
  - name: Service Control Manager new service installs and failures
    query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND (data_win_system_eventID:"7045" OR data_win_system_eventID:"7031" OR data_win_system_eventID:"7023" OR data_win_system_eventID:"7024")
    pivot_on:
    - host
    window: 6h
  - name: Application crash and WER faults around the service
    query: (data_win_system_eventID:"1000" OR data_win_system_eventID:"1001") AND (data_win_system_providerName:/[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Rr][Rr][Oo][Rr]/ OR data_win_system_providerName:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]/)
    pivot_on:
    - host
    window: 1h
  - name: 'Payload staging: suspicious interpreters or file drops under SYSTEM'
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/ AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/
    pivot_on:
    - host
    window: 2h
