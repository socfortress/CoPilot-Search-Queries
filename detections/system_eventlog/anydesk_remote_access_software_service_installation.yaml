name: Anydesk Remote Access Software Service Installation
id: 530a6faa-ff3d-4022-b315-50828e77eef5
version: 1
schema_version: "1.0"
date: "2025-02-24"
author: Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 530a6faa-ff3d-4022-b315-50828e77eef5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the installation of the anydesk software service. Which could be an
  indication of anydesk abuse if you the software isn't already used.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_serviceName:
                          value: "*AnyDesk*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_serviceName:
                          value: "*Service*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*AnyDesk*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName matches
  '*AnyDesk*', among other conditions.

known_false_positives: >
  Legitimate usage of the anydesk tool. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://thedfirreport.com/2022/08/08/bumblebee-roasts-its-way-to-domain-admin/
  - https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/

response:
  message: >
    Anydesk Remote Access Software Service Installation detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_serviceName:
    $data_win_eventdata_serviceName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  custom_tags:
    - anydesk
    - software
    - service
    - windows_system
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND ((data_win_eventdata_serviceName:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/ AND data_win_eventdata_serviceName:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/) OR data_win_eventdata_imagePath:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: The command line that usually causes this 7045 service install (AnyDesk --install ... --silent); shows who/what launched the install and from where.
  - id: b1377339-fda6-477a-b455-ac0923f9ec2c
    name: Remote Access Tool - AnyDesk Piped Password Via CLI
    reason: Attackers set an unattended-access password right after installing the service so they can reconnect without the user; confirms hands-on-keyboard abuse.
  - id: 065b00ca-5d5c-4557-ac95-64a6d0b64d86
    name: Remote Access Tool - Anydesk Execution From Suspicious Folder
    reason: A service installed from Temp/Downloads/ProgramData by a dropper rather than from Program Files indicates a malicious deployment, not IT use.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Process execution of the AnyDesk binary on the same host that precedes or follows the service registration.
  - id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
    name: Remote Access Tool - AnyDesk Incoming Connection
    reason: 'Follow-on: the installed service accepting an inbound remote session proves the attacker actually used the foothold.'
  - id: 0b9ad457-2554-44c1-82c2-d56a99c42377
    name: Anydesk Temporary Artefact
    reason: AnyDesk trace/config files (ad.trace, system.conf) written on the host corroborate a session and show connecting IDs.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Operators commonly create a backdoor local account alongside the remote tool to retain access (seen in Bumblebee and LockBit intrusions).
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: Intruders often stack multiple remote-management tools for redundancy; a second RMM agent on the host raises confidence in an intrusion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AnyDesk install/execution command lines (silent install, password pipe, license)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*[Aa]ny[Dd]esk* AND (*--install* OR *--silent* OR *--set-password* OR *--start-with-win* OR *--create-shortcuts* OR *--remove*))
    pivot_on:
    - host
    window: 2h
  - name: Parent chain that dropped or launched AnyDesk (scripts, browsers, shells, Office)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:*[Aa]ny[Dd]esk* AND data_win_eventdata_parentImage:(*cmd.exe OR *powershell.exe OR *pwsh.exe OR *wscript.exe OR *cscript.exe OR *mshta.exe OR *rundll32.exe OR *msiexec.exe OR *winword.exe OR *excel.exe OR *chrome.exe OR *msedge.exe OR *firefox.exe)
    pivot_on:
    - host
    window: 2h
  - name: AnyDesk config/trace files and downloads written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(*[Aa]ny[Dd]esk* OR *ad.trace* OR *system.conf* OR *user.conf* OR *connection_trace.txt*)
    pivot_on:
    - host
    window: 4h
  - name: AnyDesk relay network and DNS activity (net.anydesk.com)
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:(*anydesk.com* OR *anydesk.net*)) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:*[Aa]ny[Dd]esk*)
    pivot_on:
    - host
    window: 4h
  - name: Backdoor account creation or firewall changes alongside remote tool
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:(*net*user*/add* OR *net*localgroup*administrators*/add* OR *netsh*advfirewall*add*rule* OR *netsh*firewall*) )
    pivot_on:
    - host
    window: 4h
