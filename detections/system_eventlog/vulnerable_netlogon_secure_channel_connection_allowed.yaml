name: Vulnerable Netlogon Secure Channel Connection Allowed
id: a0cb7110-edf0-47a4-9177-541a4083128a
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: NVISO
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a0cb7110-edf0-47a4-9177-541a4083128a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects that a vulnerable Netlogon secure channel connection was allowed,
  which could be an indicator of CVE-2020-1472. MITRE ATT&CK: T1548.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "NetLogon"
              case_insensitive: true
        - term:
            data_win_system_eventID: "5829"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'NetLogon';
  data_win_system_eventID equals '5829'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://support.microsoft.com/en-us/help/4557222/how-to-manage-the-changes-in-netlogon-secure-channel-connections-assoc
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    Vulnerable Netlogon Secure Channel Connection Allowed detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. MITRE ATT&CK: T1548
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548
  custom_tags:
    - vulnerable
    - netlogon
    - secure
    - windows_system
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]/ AND data_win_system_eventID:"5829"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcc6a01e-9471-44a0-a699-71ea96f8ed8b
    name: Exploitation Attempt Of CVE-2020-1472 - Execution of ZeroLogon PoC
    reason: 'Same CVE-2020-1472 exploit: the PoC process (zerologon/cve-2020-1472 tooling) is what causes the DC to allow the vulnerable Netlogon secure channel logged as 5829.'
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: 'Classic ZeroLogon follow-on: after blanking the DC machine account password the attacker DCSyncs all domain hashes via directory replication.'
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: DCSync using the DC machine account (spoofed via Netlogon) to pull krbtgt and admin hashes right after the Netlogon bypass.
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: Impacket secretsdump is the standard tool used with the ZeroLogon-reset DC account to remotely dump SAM/NTDS secrets.
  - id: f8a66a02-4a16-46e5-b7fd-a42c8a93d137
    name: LSASS Crash Via Netlogon Stack Buffer Overflow - CVE-2026-41089
    reason: Another Netlogon-service exploitation signal on a DC; indicates active attack against the same Netlogon attack surface.
  - id: e9d4ab66-a532-4ef7-a502-66a9e4a34f5d
    name: NTLMv1 Logon Between Client and Server
    reason: Co-occurring weak Netlogon/NTLM authentication in the same System log, indicating the vulnerable or downgraded client that can be abused or relayed.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Alternative or follow-on domain credential extraction on the DC once Netlogon compromise has yielded privileged access.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Netlogon secure-channel enforcement events (5827/5828/5830/5831)
    query: data_win_system_providerName:/[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]/ AND (data_win_system_eventID:"5827" OR data_win_system_eventID:"5828" OR data_win_system_eventID:"5830" OR data_win_system_eventID:"5831")
    pivot_on:
    - host
    window: 24h
  - name: DC machine/computer account password or attribute change (4742)
    query: data_win_system_eventID:"4742" AND (data_win_eventdata_targetUserName:*$ OR data_win_eventdata_passwordLastSet:*)
    pivot_on:
    - host
    window: 2h
  - name: Directory replication rights used (DCSync, 4662 DS-Replication-Get-Changes)
    query: data_win_system_eventID:"4662" AND (data_win_eventdata_properties:*1131f6aa* OR data_win_eventdata_properties:*1131f6ad* OR data_win_eventdata_properties:*89e95b76*)
    pivot_on:
    - host
    window: 2h
  - name: Secretsdump / NTDS / ZeroLogon tooling process execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]|[Zz][Ee][Rr][Oo][Ll][Oo][Gg][Oo][Nn]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]).*/ OR data_win_eventdata_commandLine:/.*([Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Zz][Ee][Rr][Oo][Ll][Oo][Gg][Oo][Nn]|[Dd][Cc][Ss][Yy][Nn][Cc]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons to the DC by machine accounts / anonymous (4624 type 3)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND (data_win_eventdata_targetUserName:*$ OR data_win_eventdata_targetUserName:"ANONYMOUS LOGON")
    pivot_on:
    - host
    window: 2h
