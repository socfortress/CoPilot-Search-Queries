name: Service Installed By Unusual Client - System
id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: Tim Rauch (Nextron Systems), Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a service installed by a client which has PID 0 or whose parent has
  PID 0. MITRE ATT&CK: T1543.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - term:
            data_win_eventdata_processId: "0"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_processId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_processId equals
  '0'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/windows-service-installed-via-an-unusual-client.html
  - https://attack.mitre.org/techniques/T1543/

response:
  message: >
    Service Installed By Unusual Client - System detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_processId: $data_win_eventdata_processId$. MITRE
    ATT&CK: T1543
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_processId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543
  custom_tags:
    - service
    - installed
    - unusual
    - windows_system
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_processId:"0"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: 'Same behaviour from the Security log (4697): confirms the service install through a second channel with the client logon/account details.'
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: Remote/PID-0 service installs are the classic Cobalt Strike psexec/getsystem delivery; 7045 with cmd/powershell/rundll32 in ImagePath confirms a beacon service.
  - id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
    name: Credential Dumping Tools Service Execution - System
    reason: Attackers install a service remotely to run a dumper (mimikatz/wce/pwdump) as SYSTEM; same 7045 event with tool-named service.
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Same 7045 telemetry matching known offensive-tool service names/paths; confirms the unusual-client install was a hack tool.
  - id: a27e5fa9-c35e-4e3d-b7e0-1ce2af66ad12
    name: CSExec Service Installation
    reason: CSExec/PsExec-style remote exec drops a service over SMB, producing the same remote 7045 installer pattern.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: The installed PSEXESVC-style service spawning child processes is the direct follow-on to a remote service install.
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: 'Precursor: the remote SCM call over the svcctl pipe on the share is what creates the PID-0 service install.'
  - id: 32d56ea1-417f-44ff-822b-882873f5f43b
    name: Impacket PsExec Execution
    reason: Impacket psexec/smbexec creates the service remotely via RPC and runs it as SYSTEM, matching this alert's installer profile.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installs with suspicious ImagePath on this host
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Aa][Dd][Mm][Ii][Nn]\$|[Tt][Ee][Mm][Pp]\\).*/ OR data_win_eventdata_imagePath:*\\\\* OR data_win_eventdata_imagePath:*%COMSPEC%* OR data_win_eventdata_imagePath:*-enc*)
    pivot_on:
    - host
    window: 2h
  - name: Service binary / process spawned by services.exe as SYSTEM
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Cc][Oo][Nn][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on:
    - host
    window: 1h
  - name: 'Credential access: LSASS access or dump tools after service install'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*comsvcs* OR data_win_eventdata_commandLine:*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]* OR data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*ntdsutil* OR data_win_eventdata_commandLine:*procdump*))
    pivot_on:
    - host
    window: 2h
  - name: Remote payload dropped to admin share or Windows dirs
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1)/) AND (data_win_eventdata_image:"System" OR data_win_eventdata_image:*System32*)
    pivot_on:
    - host
    window: 1h
  - name: 'Persistence follow-on: Run keys, services registry and scheduled tasks'
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:*\\CurrentVersion\\Run* OR data_win_eventdata_targetObject:*\\Services\\*\\ImagePath*)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*create* OR data_win_eventdata_commandLine:*config*))
    pivot_on:
    - host
    window: 4h
