name: ProcessHacker Privilege Elevation
id: c4ff1eac-84ad-44dd-a6fb-d56a92fc43a9
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c4ff1eac-84ad-44dd-a6fb-d56a92fc43a9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a ProcessHacker tool that elevated privileges to a very high level.
  MITRE ATT&CK: T1543.003, T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - wildcard:
            data_win_eventdata_serviceName:
              value: "ProcessHacker*"
              case_insensitive: true
        - term:
            data_win_eventdata_accountName:
              value: "LocalSystem"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_accountName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName matches
  'ProcessHacker*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/1kwpeter/status/1397816101455765504
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    ProcessHacker Privilege Elevation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1543.003, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
    - T1569.002
  custom_tags:
    - processhacker
    - privilege
    - elevation
    - windows_system
    - persistence
    - execution
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_serviceName:/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Hh][Aa][Cc][Kk][Ee][Rr].*/ AND data_win_eventdata_accountName:/[Ll][Oo][Cc][Aa][Ll][Ss][Yy][Ss][Tt][Ee][Mm]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 811e0002-b13b-4a15-9d00-a613fce66e42
    name: PUA - Process Hacker Execution
    reason: 'Direct precursor: the 7045 service is created when the ProcessHacker/System Informer binary is launched elevated, so the process-creation event shows who ran it and from where.'
  - id: 67add051-9ee7-4ad3-93ba-42935615ae8d
    name: PUA - Process Hacker Driver Load
    reason: 'Co-occurring: the elevated service loads the kprocesshacker kernel driver, which gives the tool kernel-level process and token access.'
  - id: 10cb6535-b31d-4512-9962-513dcbc42cc1
    name: PUA - System Informer Driver Load
    reason: Renamed successor of Process Hacker uses the same kernel driver path; same behaviour under a different service/driver name.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: Attackers who run Process Hacker as SYSTEM often load further vulnerable or malicious drivers (BYOVD) to kill EDR next.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Likely follow-on: a SYSTEM-level Process Hacker can open and dump lsass memory for credentials.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Process Hacker reading lsass shows up as process-access with high-privilege GrantedAccess flags on the same host.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: With SYSTEM and kernel access the operator can terminate or tamper with security products; AV disablement is a typical next step.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process Hacker / System Informer process launch and driver service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp]rocess[Hh]acker.*/ OR data_win_eventdata_image:/.*[Ss]ystem[Ii]nformer.*/ OR data_win_eventdata_originalFileName:/.*[Pp]rocess[Hh]acker.*/ OR data_win_eventdata_commandLine:/.*[Kk][Pp]rocess[Hh]acker.*/)
    pivot_on:
    - host
    window: 4h
  - name: Kernel driver loads (kprocesshacker or unsigned/temp drivers)
    query: data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*[Kk][Pp]rocess[Hh]acker.*/ OR data_win_eventdata_imageLoaded:/.*[Ss]ystem[Ii]nformer.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt]emp\\.*\.sys/ OR data_win_eventdata_signed:"false")
    pivot_on:
    - host
    window: 2h
  - name: Process access to LSASS (credential dumping after elevation)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Security product tampering and service stop after elevation
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc].*(stop|delete|config).*/ OR data_win_eventdata_commandLine:/.*[Tt]ask[Kk]ill.*/ OR data_win_eventdata_commandLine:/.*[Nn]et.*[Ss]top.*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Dd]efender.*/)
    pivot_on:
    - host
    window: 2h
  - name: Dump files written after Process Hacker activity
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp])/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*/)
    pivot_on:
    - host
    window: 2h
