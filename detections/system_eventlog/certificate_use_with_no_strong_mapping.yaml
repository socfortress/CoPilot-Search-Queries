name: Certificate Use With No Strong Mapping
id: 993c2665-e6ef-40e3-a62a-e1a97686af79
version: 1
schema_version: "1.0"
date: "2025-09-22"
author: "@br4dy5"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 993c2665-e6ef-40e3-a62a-e1a97686af79
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a user certificate that was valid but could not be mapped to a user in
  a strong way (such as via explicit mapping, key trust mapping, or a SID) This
  could be a sign of exploitation of the elevation of privilege vulnerabilities
  (CVE-2022-34691, CVE-2022-26931, CVE-2022-26923) that can occur when the KDC
  allows certificate spoofing by not requiring a strong mapping. Events where
  the AccountName and CN of the Subject do not match, or where the CN ends in a
  dollar sign indicating a machine, may indicate certificate spoofing.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_providerName:
                    value: "Kerberos-Key-Distribution-Center"
                    case_insensitive: true
              - term:
                  data_win_system_providerName:
                    value: "Microsoft-Windows-Kerberos-Key-Distribution-Center"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_system_eventID: "39"
              - term:
                  data_win_system_eventID: "41"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals
  'Kerberos-Key-Distribution-Center'; data_win_system_providerName equals
  'Microsoft-Windows-Kerberos-Key-Distribution-Center'; data_win_system_eventID
  equals '39', among other conditions.

known_false_positives: >
  If prevalent in the environment, filter on events where the AccountName and CN
  of the Subject do not reference the same user. If prevalent in the
  environment, filter on CNs that end in a dollar sign indicating it is a
  machine name. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://support.microsoft.com/en-us/topic/kb5014754-certificate-based-authentication-changes-on-windows-domain-controllers-ad2c23b0-15d8-4340-a468-4d4f3b188f16

response:
  message: >
    Certificate Use With No Strong Mapping detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - certificate
    - strong
    - mapping
    - windows_system
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_providerName:/[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]-[Kk][Ee][Yy]-[Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]-[Cc][Ee][Nn][Tt][Ee][Rr]/ OR data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]-[Kk][Ee][Yy]-[Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]-[Cc][Ee][Nn][Tt][Ee][Rr]/) AND (data_win_system_eventID:"39" OR data_win_system_eventID:"41")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 762f2482-ff21-4970-8939-0aa317a886bb
    name: HackTool - Certify Execution
    reason: Certify enumerates/abuses vulnerable ADCS templates to request a spoofed-SAN certificate; the weak-mapping KDC event is what appears when that certificate is later used for PKINIT.
  - id: cd8c163e-a19b-402e-bdd5-419ff5859f12
    name: HackTool - ADCSPwn Execution
    reason: ADCSPwn relays to ADCS to obtain a certificate; using it for Kerberos auth against a non-strict-mapping KDC triggers this event.
  - id: bfbd3291-de87-4b7c-88a2-d6a5deb28668
    name: ADCS Certificate Template Configuration Vulnerability with Risky EKU
    reason: A template with risky EKU/enrollee-supplied SAN is the precondition that lets an attacker obtain the certificate later used without strong mapping (ESC1/ESC6, CVE-2022-26923 class).
  - id: f598ea0c-c25a-4f72-a219-50c44411c791
    name: Possible Shadow Credentials Added
    reason: Writing msDS-KeyCredentialLink gives an attacker a key-trust certificate to authenticate as the victim via PKINIT, an alternate path to certificate logon with weak mapping.
  - id: 6a53d871-682d-40b6-83e0-b7c1a6c4e3a5
    name: PetitPotam Suspicious Kerberos TGT Request
    reason: Coercion plus ADCS relay ends in a machine-account certificate and a certificate-based TGT request, the same machine-name-spoofing outcome this event flags.
  - id: f7644214-0eb0-4ace-9455-331ec4c09253
    name: Kerberos Manipulation
    reason: Follow-on Kerberos failures/anomalies as the attacker uses the forged-identity TGT and tickets.
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Exporting a PFX/private key is how a stolen or enrolled certificate is carried to another host for PKINIT logon.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ADCS abuse tooling execution (Certify/Certipy/ADCSPwn/Rubeus)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[\\\/]([Cc]ertify|[Rr]ubeus|[Aa][Dd][Cc][Ss][Pp][Ww][Nn]|[Cc]ertipy|[Ww]hisker|[Pp][Ss][Ee][Xx][Ee][Cc]).*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc]ertify|[Rr]ubeus|[Cc]ertipy|[Ww]hisker).*/ OR data_win_eventdata_commandLine:/.*(\/[Aa]ltname|\/[Tt]emplate:|asktgt.*\/certificate|[Pp][Kk][Ii][Nn][Ii][Tt]|[Cc]ertreq).*/)
    pivot_on:
    - host
    window: 2h
  - name: Certificate/PFX export or enrollment request
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]ertutil.*(-[Ee]xportPFX|-[Ss]plit|-[Rr]equest|-[Ee]nroll).*/ OR data_win_eventdata_commandLine:/.*([Ee]xport-[Pp]fx[Cc]ertificate|[Ee]xport-[Cc]ertificate|[Cc]ertreq).*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.pfx OR data_win_eventdata_targetFilename:*.p12 OR data_win_eventdata_targetFilename:*.ccache OR data_win_eventdata_targetFilename:*.kirbi))
    pivot_on:
    - host
    window: 4h
  - name: Certificate-based Kerberos logons and ticket requests (PKINIT)
    query: (data_win_system_eventID:"4768" AND data_win_eventdata_preAuthType:"16") OR (data_win_system_eventID:"4769" AND data_win_eventdata_ticketEncryptionType:"0x17") OR (data_win_system_eventID:"4771") OR data_win_eventdata_certIssuerName:*
    pivot_on:
    - host
    - user
    window: 2h
  - name: Shadow credentials / key-credential and AD object modification
    query: (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:"msDS-KeyCredentialLink") OR (data_win_system_eventID:"4742" AND data_win_eventdata_userAccountControl:*) OR (data_win_system_eventID:"4738" AND data_win_eventdata_userPrincipalName:*)
    pivot_on:
    - host
    window: 6h
  - name: Lateral movement or privileged logon after certificate auth
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND data_win_eventdata_authenticationPackageName:"Kerberos") OR data_win_system_eventID:"4672" OR (data_win_system_eventID:"4662" AND data_win_eventdata_properties:*1131f6a*)
    pivot_on:
    - host
    - user
    window: 2h
