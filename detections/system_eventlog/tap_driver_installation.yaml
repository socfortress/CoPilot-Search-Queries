name: Tap Driver Installation
id: 8e4cf0e5-aa5d-4dc3-beff-dc26917744a9
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Daniil Yugoslavskiy, Ian Davis, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8e4cf0e5-aa5d-4dc3-beff-dc26917744a9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Well-known TAP software installation. Possible preparation for data
  exfiltration using tunnelling techniques. MITRE ATT&CK: T1048.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*tap0901*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*tap0901*'.

known_false_positives: >
  Legitimate OpenVPN TAP installation. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://community.openvpn.net/openvpn/wiki/ManagingWindowsTAPDrivers
  - https://attack.mitre.org/techniques/T1048/

response:
  message: >
    Tap Driver Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE ATT&CK:
    T1048
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048
  custom_tags:
    - driver
    - installation
    - windows_system
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*[Tt][Aa][Pp]0901.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7b687634-ab20-11ea-bb37-0242ac130002
    name: Windows Pcap Drivers
    reason: Another network-driver install (Npcap/WinPcap) often dropped alongside TAP/VPN components when an attacker stages sniffing or tunnelling tooling
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: Same 7045 service-install telemetry; a remote access service installed near a TAP driver indicates a persistent covert access channel, not a benign VPN client
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: A TAP driver service installed remotely (via SMB/service control from another host) points to an attacker staging a tunnel rather than a user installing OpenVPN
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Ngrok is a co-occurring tunnelling alternative; both establish a covert egress/pivot channel on the same host
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Chisel/other tunnel tools are typically run after or instead of a TAP VPN to carry traffic out of the network
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Once a virtual adapter exists, attackers use netsh portproxy to route internal services through it; follow-on pivoting step
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: The stated purpose of TAP installation is exfiltration tunnelling; CLI transfer tools are the likely next step
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Driver services can be created via sc.exe instead of an installer; same kernel-driver staging behaviour seen through process creation
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: OpenVPN / TAP installer and driver tooling execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Oo][Pp][Ee][Nn][Vv][Pp][Nn]|[Tt][Aa][Pp]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]|[Tt][Aa][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll]|[Dd][Ee][Vv][Cc][Oo][Nn]|[Pp][Nn][Pp][Uu][Tt][Ii][Ll]|[Ww][Ii][Nn][Tt][Uu][Nn]).*/ OR data_win_eventdata_commandLine:/.*([Tt][Aa][Pp]0901|[Tt][Aa][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll]|[Pp][Nn][Pp][Uu][Tt][Ii][Ll].*-[Aa]|[Ss][Cc].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Tt][Yy][Pp][Ee]= *[Kk][Ee][Rr][Nn][Ee][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Tunnelling / reverse-proxy tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Gg][Rr][Oo][Kk]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Pp][Ll][Ii][Nn][Kk]|[Ff][Rr][Pp][Cc]|[Ll][Ii][Gg][Oo][Ll][Oo]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]|[Ii][Oo][Xx]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy]|-[Rr] +[0-9]+:|[Ss][Ee][Rr][Vv][Ee][Rr] +-[-]?[Rr][Ee][Vv][Ee][Rr][Ss][Ee]|[Tt][Uu][Nn][Nn][Ee][Ll]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Network adapter / routing reconfiguration after virtual NIC install
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Ee][Tt][Ss][Hh]|[Rr][Oo][Uu][Tt][Ee]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Gg][Ee][Tt][Mm][Aa][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Tt][Aa][Pp]|[Ww][Ii][Nn][Tt][Uu][Nn]|[Ii][Nn][Tt][Ee][Rr][Ff][Aa][Cc][Ee]|[Aa][Dd][Dd]|[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy]|[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from VPN/tunnel processes to unusual ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*([Oo][Pp][Ee][Nn][Vv][Pp][Nn]|[Nn][Gg][Rr][Oo][Kk]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Pp][Ll][Ii][Nn][Kk]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]|[Ff][Rr][Pp][Cc]).*/
    pivot_on:
    - host
    window: 4h
  - name: Archive and exfiltration tooling preceding or following tunnel setup
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Aa]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Pp][Ss][Cc][Pp]|[Cc][Uu][Rr][Ll])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Uu][Pp][Ll][Oo][Aa][Dd]).*/)
    pivot_on:
    - host
    window: 6h
