name: CSExec Service Installation
id: a27e5fa9-c35e-4e3d-b7e0-1ce2af66ad12
version: 1
schema_version: "1.0"
date: "2023-08-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a27e5fa9-c35e-4e3d-b7e0-1ce2af66ad12
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects CSExec service installation and execution events. MITRE ATT&CK:
  T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - term:
                  data_win_eventdata_serviceName:
                    value: "csexecsvc"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\csexecsvc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'csexecsvc', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/malcomvetter/CSExec
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    CSExec Service Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - csexec
    - service
    - installation
    - windows_system
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]/ OR data_win_eventdata_imagePath:/.*\\[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d08a2711-ee8b-4323-bdec-b7d85e892b31
    name: PUA - CsExec Execution
    reason: The csexec.exe client launched on the same host (or its source) is the direct cause of the csexecsvc service install; confirms the tool was run rather than merely staged
  - id: f318b911-ea88-43f4-9281-0de23ede628e
    name: PUA - CSExec Default Named Pipe
    reason: After the csexecsvc service starts it creates the csexecsvc named pipe for the remote command channel; confirms the service is live and being used for remote execution
  - id: f0e2b768-5220-47dd-b891-d57b96fc0ec1
    name: CSExec Service File Creation
    reason: csexecsvc.exe is copied to the target (typically via ADMIN$) immediately before the 7045 service install; same artefact seen from the file-write side
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: CSExec is a PsExec clone; operators often switch between PsExec/CSExec/PAExec/RemCom on the same hosts, so a sibling remote-service-exec install indicates the same lateral-movement campaign
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Same 4697/7045 service-install-over-SMB primitive; other psexec-style tooling used alongside CSExec during lateral movement
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Remote service creation by a non-local SCM client is the lateral-movement signature; CSExec installs arrive from the attacker's pivot host
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: Binary staging to ADMIN$/C$ over SMB precedes the service install; identifies the source of the lateral movement
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: CSExec needs admin credentials on the target; stolen creds used with explicit credential logons precede the remote service creation
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CSExec client/service process and pipe activity
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_originalFileName:/.*[Cc][Ss][Ee][Xx][Ee][Cc].*/)) OR (data_win_system_eventID:("17" OR "18") AND data_win_eventdata_pipeName:/.*[Cc][Ss][Ee][Xx][Ee][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: csexecsvc.exe dropped to disk (ADMIN$ staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Cc][Ss][Ee][Xx][Ee][Cc].*/
    pivot_on:
    - host
    window: 1h
  - name: Commands spawned by csexecsvc as SYSTEM
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Network logons and SMB inbound from pivot host
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_ipAddress:("-" OR "::1" OR "127.0.0.1")
    pivot_on:
    - host
    window: 1h
  - name: Credential access or defense evasion after remote exec
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff].*/))
    pivot_on:
    - host
    window: 4h
