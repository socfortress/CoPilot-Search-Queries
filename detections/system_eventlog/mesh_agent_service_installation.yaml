name: Mesh Agent Service Installation
id: e0d1ad53-c7eb-48ec-a87a-72393cc6cedc
version: 1
schema_version: "1.0"
date: "2022-11-28"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e0d1ad53-c7eb-48ec-a87a-72393cc6cedc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a Mesh Agent service installation. Mesh Agent is used to remotely
  manage computers. MITRE ATT&CK: T1219.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*MeshAgent.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Mesh Agent*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*MeshAgent.exe*', among other conditions.

known_false_positives: >
  Legitimate use of the tool. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/11/28/emotet-strikes-again-lnk-file-leads-to-domain-wide-ransomware/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Mesh Agent Service Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE ATT&CK:
    T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - agent
    - service
    - installation
    - windows_system
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_serviceName:/.*[Mm][Ee][Ss][Hh] [Aa][Gg][Ee][Nn][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: Attackers commonly stack multiple RMM agents (Mesh, Atera) for redundant C2 persistence; a second RMM install on the same host confirms tooling abuse.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: AnyDesk is the other RMM frequently deployed alongside MeshAgent as a fallback remote-access channel after initial compromise.
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Process-creation evidence of remote-access software by file metadata; corroborates the MeshAgent binary actually executing and other RMM tools in use.
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: The referenced DFIR report shows an Emotet LNK loader as the precursor to Mesh Agent deployment and later ransomware.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Operators using MeshAgent for remote control also push payloads to other hosts via PsExec services; lateral movement follow-on.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: After establishing a persistent remote channel, intruders typically run AD discovery with AdFind before expanding.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Hands-on-keyboard access via Mesh is often used to stage and exfiltrate data with Rclone before ransomware.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Operators exclude the dropped agent paths from AV to keep the RMM service alive; co-occurs with installation.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MeshAgent process execution and install arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ff][Uu][Ll][Ll][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Ss][Hh][Ss][Ee][Rr][Vv][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: MeshAgent network connections and MeshCentral DNS
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/) OR (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*meshcentral* OR data_win_eventdata_image:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/))
    pivot_on:
    - host
    window: 4h
  - name: MeshAgent binary dropped to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Mm][Ee][Ss][Hh][Cc][Ee][Nn][Tt][Rr][Aa][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Downloader or script that delivered the agent
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]).*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc].*[Hh][Tt][Tt][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: Post-access discovery and Defender tampering after RMM install
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa][Dd][Ff][Ii][Nn][Dd]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ww][Hh][Oo][Aa][Mm][Ii])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss]|[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]).*/)
    pivot_on:
    - host
    window: 4h
