name: Important Windows Service Terminated With Error
id: d6b5520d-3934-48b4-928c-2aa3f92d6963
version: 1
schema_version: "1.0"
date: "2023-04-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d6b5520d-3934-48b4-928c-2aa3f92d6963
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects important or interesting Windows services that got terminated for
  whatever reason.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7023"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_param1:
                    value: "* Antivirus*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "* Firewall*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Application Guard*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*BitLocker Drive Encryption Service*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Encrypting File System*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Microsoft Defender*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Threat Protection*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Windows Event Log*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*770069006e0064006500660065006e006400*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*4500760065006e0074004c006f006700*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*6d0070007300730076006300*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*530065006e0073006500*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary: "*450046005300*"
              - wildcard:
                  data_win_eventdata_binary: "*420044004500530056004300*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_param1
    - data_win_eventdata_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7023'; data_win_eventdata_param1 matches '*
  Antivirus*', among other conditions.

known_false_positives: >
  Rare false positives could occur since service termination could happen due to
  multiple reasons. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/04/11/guidance-for-investigating-attacks-using-cve-2022-21894-the-blacklotus-campaign/

response:
  message: >
    Important Windows Service Terminated With Error detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_param1:
    $data_win_eventdata_param1$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_param1
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - important
    - service
    - terminated
    - windows_system
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7023" AND (data_win_eventdata_param1:/.* [Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss].*/ OR data_win_eventdata_param1:/.* [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_param1:/.*[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Gg][Uu][Aa][Rr][Dd].*/ OR data_win_eventdata_param1:/.*[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr] [Dd][Rr][Ii][Vv][Ee] [Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ii][Oo][Nn] [Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_param1:/.*[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ii][Nn][Gg] [Ff][Ii][Ll][Ee] [Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_param1:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/ OR data_win_eventdata_param1:/.*[Tt][Hh][Rr][Ee][Aa][Tt] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_param1:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Vv][Ee][Nn][Tt] [Ll][Oo][Gg].*/ OR data_win_eventdata_binary:/.*770069006[Ee]0064006500660065006[Ee]006400.*/ OR data_win_eventdata_binary:/.*4500760065006[Ee]0074004[Cc]006[Ff]006700.*/ OR data_win_eventdata_binary:/.*6[Dd]0070007300730076006300.*/ OR data_win_eventdata_binary:/.*530065006[Ee]0073006500.*/ OR data_win_eventdata_binary:/.*450046005300.*/ OR data_win_eventdata_binary:/.*420044004500530056004300.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 56abae0c-6212-4b97-adc0-0b559bb950c3
    name: Important Windows Service Terminated Unexpectedly
    reason: Sibling SCM rule (7034) for the same defensive services; crashes and error terminations of Defender/Firewall/EventLog services together point to forced kill or tampering rather than a one-off fault.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: 'The command-line cause: net stop/sc stop/Stop-Service against AV or firewall services is what produces this 7023 termination.'
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: If the Defender service terminated, real-time protection being disabled confirms the AV was blinded intentionally.
  - id: 6c0a7755-6d31-44fa-80e1-133e57752680
    name: Windows Defender Threat Detection Service Disabled
    reason: Same System log channel; Defender threat-detection service disabled immediately before or after a termination shows defense evasion in progress.
  - id: 100ef69e-3327-481c-8e5c-6d80d9507556
    name: Important Windows Eventlog Cleared
    reason: Attackers who kill the Windows Event Log or AV services frequently follow by clearing logs to hide their actions.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender tampering often pairs exclusions with service disruption so payloads can be staged and run unscanned.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: BlackLotus-style and BYOVD attacks load a kernel driver to kill protected security services; a new driver around the termination is the likely mechanism.
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: A malicious service (7045) installed alongside or after the security service termination is the typical persistence or execution follow-on.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service stop/disable commands against security services
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]1? [Ss][Tt][Oo][Pp]|[Ss][Cc](\.[Ee][Xx][Ee])? (stop|config|delete)|[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]).*([Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Ss][Ee][Nn][Ss][Ee]|[Mm][Pp][Ss][Ss][Vv][Cc]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Mm][Pp][Ss][Ww][Nn][Ss][Cc]|[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]|[Mm][Pp][Ss][Ss][Vv][Cc]|[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]|[Bb][Dd][Ee][Ss][Vv][Cc]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Defender and firewall disable via registry or Set-MpPreference
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]|[Ee][Nn][Aa][Bb][Ll][Ee][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]|[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]\\[Ss][Tt][Aa][Rr][Tt]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Oo][Ff][Ff]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Service installs and kernel driver loads (BYOVD/BlackLotus follow-on)
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +[Cc][Rr][Ee][Aa][Tt][Ee].*([Tt][Yy][Pp][Ee]= *[Kk][Ee][Rr][Nn][Ee][Ll]).*/) OR data_win_system_eventID:"6"
    pivot_on:
    - host
    window: 6h
  - name: Boot configuration and Secure Boot tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Nn][Oo][Ii][Nn][Tt][Ee][Gg][Rr][Ii][Tt][Yy][Cc][Hh][Ee][Cc][Kk][Ss]|[Tt][Ee][Ss][Tt][Ss][Ii][Gg][Nn][Ii][Nn][Gg]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy]).*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Uu][Nn][Tt][Vv][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc].*[/-][Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: Event log clearing or audit disabling after termination
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104") OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*( cl | clear-log|sl .*\/e:false)|[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]|[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*(\/clear|\/remove|[Nn][Oo] [Aa][Uu][Dd][Ii][Tt][Ii][Nn][Gg])).*/)
    pivot_on:
    - host
    window: 4h
