name: Important Windows Service Terminated With Error
id: d6b5520d-3934-48b4-928c-2aa3f92d6963
version: 1
schema_version: "1.0"
date: "2023-04-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d6b5520d-3934-48b4-928c-2aa3f92d6963
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects important or interesting Windows services that got terminated for
  whatever reason.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7023"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_param1:
                    value: "* Antivirus*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "* Firewall*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Application Guard*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*BitLocker Drive Encryption Service*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Encrypting File System*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Microsoft Defender*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Threat Protection*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_param1:
                    value: "*Windows Event Log*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*770069006e0064006500660065006e006400*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*4500760065006e0074004c006f006700*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*6d0070007300730076006300*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary:
                    value: "*530065006e0073006500*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_binary: "*450046005300*"
              - wildcard:
                  data_win_eventdata_binary: "*420044004500530056004300*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_param1
    - data_win_eventdata_binary

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7023'; data_win_eventdata_param1 matches '*
  Antivirus*', among other conditions.

known_false_positives: >
  Rare false positives could occur since service termination could happen due to
  multiple reasons. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/04/11/guidance-for-investigating-attacks-using-cve-2022-21894-the-blacklotus-campaign/

response:
  message: >
    Important Windows Service Terminated With Error detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_param1:
    $data_win_eventdata_param1$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_param1
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - important
    - service
    - terminated
    - windows_system
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7023" AND (data_win_eventdata_param1:/.* [Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss].*/ OR data_win_eventdata_param1:/.* [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_param1:/.*[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Gg][Uu][Aa][Rr][Dd].*/ OR data_win_eventdata_param1:/.*[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr] [Dd][Rr][Ii][Vv][Ee] [Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ii][Oo][Nn] [Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_param1:/.*[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ii][Nn][Gg] [Ff][Ii][Ll][Ee] [Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_param1:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/ OR data_win_eventdata_param1:/.*[Tt][Hh][Rr][Ee][Aa][Tt] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_param1:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Vv][Ee][Nn][Tt] [Ll][Oo][Gg].*/ OR data_win_eventdata_binary:/.*770069006[Ee]0064006500660065006[Ee]006400.*/ OR data_win_eventdata_binary:/.*4500760065006[Ee]0074004[Cc]006[Ff]006700.*/ OR data_win_eventdata_binary:/.*6[Dd]0070007300730076006300.*/ OR data_win_eventdata_binary:/.*530065006[Ee]0073006500.*/ OR data_win_eventdata_binary:/.*450046005300.*/ OR data_win_eventdata_binary:/.*420044004500530056004300.*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Service installations on this host"
      query: 'data_win_system_eventID:"7045"'
      pivot_on: [host]
      window: 6h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 2h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))'
      pivot_on: [host]
      window: 1h
