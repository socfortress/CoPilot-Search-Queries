name: StoneDrill Service Install
id: 9e987c6c-4c1e-40d8-bd85-dd26fba8fdd6
version: 1
schema_version: "1.0"
date: "2021-11-30"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e987c6c-4c1e-40d8-bd85-dd26fba8fdd6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This method detects a service install of the malicious Microsoft Network
  Realtime Inspection Service service described in StoneDrill report by
  Kaspersky. MITRE ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - term:
            data_win_eventdata_serviceName:
              value: "NtsSrv"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "* LocalService"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'NtsSrv', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/blog/research/77725/from-shamoon-to-stonedrill/
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    StoneDrill Service Install detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - stonedrill
    - service
    - install
    - windows_system
    - privilege_escalation
    - persistence
    - g0064
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_serviceName:/[Nn][Tt][Ss][Ss][Rr][Vv]/ AND data_win_eventdata_imagePath:/.* [Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The 7045 event is the result of a service creation; the sc.exe/New-Service process-creation event on the same host identifies the installing process and parent (dropper, psexec, WMI).
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: StoneDrill's NtsSrv service masquerades as a Microsoft inspection service; a service binary in a non-standard directory corroborates the rogue install.
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Co-occurring 7045/7036 service events from attacker tooling on the same host indicate the same intrusion staging more malicious services.
  - id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
    name: Credential Dumping Tools Service Execution - System
    reason: Shamoon/StoneDrill operators harvest credentials to spread across the domain before wiping; credential-dump tool services are a direct precursor/follow-on.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: StoneDrill is a destructive wiper family; deleting shadow copies removes recovery options just before or during the destructive phase.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Boot configuration tampering is a typical wiper/destructive pre-step once the persistent service is established.
  - id: 2f974656-6d83-4059-bbdf-68ac5403422f
    name: Hermetic Wiper TG Process Patterns
    reason: Another wiper-family process pattern; co-firing indicates the destructive payload is executing after the persistence service was installed.
  - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
    name: Eventlog Cleared
    reason: Wiper operators clear event logs to hinder forensics after installing the service and before/while destroying data.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service creation activity by sc.exe or PowerShell on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee].*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Ss][Ss][Rr][Vv].*/))
    pivot_on:
    - host
    window: 2h
  - name: NtsSrv binary dropped or masquerading Microsoft Network Realtime Inspection file
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Ss][Ss][Rr][Vv].*/ OR data_win_eventdata_targetFilename:/.*[Nn][Rr][Ii][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]32.*\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Remote execution tooling spreading to or from this host (psexec, WMI, admin shares)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_commandLine:/.*[Cc]\$\\.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll] [Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: 'Destructive precursors: shadow copy deletion, boot config and disk wiping'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ii][Pp][Hh][Ee][Rr].*\/[Ww].*/ OR data_win_eventdata_commandLine:/.*\\\\\.\\[Pp][Hh][Yy][Ss][Ii][Cc][Aa][Ll][Dd][Rr][Ii][Vv][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: Other service installs and unexpected service stops on this host
    query: data_win_system_providerName:"Service Control Manager" AND (data_win_system_eventID:"7045" OR data_win_system_eventID:"7034" OR data_win_system_eventID:"7036")
    pivot_on:
    - host
    window: 6h
