name: Invoke-Obfuscation Via Use Clip - System
id: 63e3365d-4824-42d8-8b82-e56810fefa0c
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 63e3365d-4824-42d8-8b82-e56810fefa0c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via use Clip.exe in Scripts. MITRE ATT&CK:
  T1027, T1059.001.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*(Clipboard|i*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*(Clipboard|i*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Use Clip - System detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE
    ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - system
    - windows_system
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*\([Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd]\|[Ii].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2e5019d-a658-4c6a-92bf-7197b54e2cae
    name: PowerShell Scripts Installed as Services
    reason: 'Same 7045 service-install vector: a service whose ImagePath launches PowerShell, the sibling of this clip-obfuscated variant'
  - id: b222df08-0e07-11eb-adc1-0242ac120002
    name: Invoke-Obfuscation CLIP+ Launcher
    reason: Process-creation view of the same clip.exe/Clipboard launcher; confirms the service actually spawned the obfuscated powershell child
  - id: 4a5f5a5e-ac01-474b-9b4e-d61298c9df1d
    name: PowerShell as a Service in Registry
    reason: Sysmon registry write of the service ImagePath pointing at PowerShell, same persistence/execution act seen from registry telemetry
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Remote-installed services (SMB/svcctl) are how this payload is usually delivered; flags the unusual installing client
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: PsExec-style lateral movement installs command-line services; the obfuscated one-liner is often the payload it runs
  - id: 52a85084-6989-40c3-8f32-091e12e13f09
    name: smbexec.py Service Installation
    reason: Impacket smbexec creates a 7045 service with a cmd/powershell command line, the same delivery mechanism for obfuscated payloads
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: Cobalt Strike psexec/getsystem services carry encoded PowerShell in ImagePath; likely follow-on C2 staging if the actor is using a framework
  - id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
    reason: Named-pipe getsystem services use the same cmd/powershell-in-ImagePath trick for SYSTEM escalation right after execution
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell/cmd children of services.exe (service-launched payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Clipboard-based obfuscated PowerShell command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:*Clipboard* AND (data_win_eventdata_commandLine:*clip* OR data_win_eventdata_commandLine:*[Ii][Ee][Xx]* OR data_win_eventdata_commandLine:*Invoke-Expression*)
    pivot_on:
    - host
    window: 1h
  - name: Script blocks reading the clipboard and invoking content
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:*Clipboard* AND (data_win_eventdata_scriptBlockText:*[Ii][Ee][Xx]* OR data_win_eventdata_scriptBlockText:*Invoke-Expression* OR data_win_eventdata_scriptBlockText:*FromBase64String*)
    pivot_on:
    - host
    window: 2h
  - name: Service ImagePath registry set to shell interpreter
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.*\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ AND (data_win_eventdata_details:*[Pp]ower[Ss]hell* OR data_win_eventdata_details:*cmd.exe* OR data_win_eventdata_details:*[Cc]lip*)
    pivot_on:
    - host
    window: 2h
  - name: Network logons preceding remote service install
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:*$
    pivot_on:
    - host
    window: 1h
