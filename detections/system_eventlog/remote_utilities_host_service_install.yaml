name: Remote Utilities Host Service Install
id: 85cce894-dd8b-4427-a958-5cc47a4dc9b9
version: 1
schema_version: "1.0"
date: "2022-10-31"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 85cce894-dd8b-4427-a958-5cc47a4dc9b9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Remote Utilities Host service installation on the target system.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*\\\\rutserv.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*-service*"
                          case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "Remote Utilities - Host"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*\rutserv.exe*', among other conditions.

known_false_positives: >
  Legitimate use of the tool. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.remoteutilities.com/support/kb/host-service-won-t-start/

response:
  message: >
    Remote Utilities Host Service Install detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - utilities
    - service
    - install
    - windows_system
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND ((data_win_eventdata_imagePath:/.*\\[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_imagePath:/.*-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/) OR data_win_eventdata_serviceName:/[Rr][Ee][Mm][Oo][Tt][Ee] [Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss] - [Hh][Oo][Ss][Tt]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e01fa958-6893-41d4-ae03-182477c5e77d
    name: Remote Access Tool - RURAT Execution From Unusual Location
    reason: The installed rutserv.exe service host often runs from a staging path (Temp, ProgramData, Downloads); this confirms the dropped binary is an attacker deployment, not an IT-managed install.
  - id: 9ef27c24-4903-4192-881a-3adde7ff92a5
    name: Renamed Remote Utilities RAT (RURAT) Execution
    reason: Same product run under a renamed binary evades the rutserv.exe image match; co-occurrence indicates deliberate masquerading around the service install.
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: Attackers commonly stack several RMM tools (Atera, Remote Utilities) on the same host for redundant persistent remote access.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Another legitimate remote-access tool abused as a backup channel; a second RAT on the same host points to hands-on-keyboard intrusion.
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: Silent RAT install is the same tradecraft as an unattended Remote Utilities Host service deployment; both are typical ransomware pre-staging.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The 7045 event is the result of a service creation via sc.exe/PowerShell; this rule catches the process-side command line that created the Remote Utilities service.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: After installing the Host service, actors open an inbound firewall rule for rutserv.exe so the relay/direct connection works.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Attackers exclude the RAT install directory from Defender right before or after installing the persistent service so it is not quarantined.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote Utilities (rutserv/rfusclient) process execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Ff][Uu][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Tt][Ss][Ee][Rr][Vv].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Installer or service-creation command lines for the RAT
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Rr][Uu][Tt]|[Rr][Ee][Mm][Oo][Tt][Ee][Uu][Tt][Ii][Ll]).*/) OR data_win_eventdata_commandLine:/.*[Rr][Uu][Tt][Ss][Ee][Rr][Vv].*-([Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: RAT binary or installer files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*[Rr][Ff][Uu][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Mm][Oo][Tt][Ee][Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: DNS and network connections to Remote Utilities relay infrastructure
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Rr][Uu][Tt][Ss][Ee][Rr][Vv]|[Rr][Ee][Mm][Oo][Tt][Ee][Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss]|[Rr][Uu][Tt]\.[Cc][Oo][Mm]).*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Firewall opening or Defender exclusion near the RAT install
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/) OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 2h
