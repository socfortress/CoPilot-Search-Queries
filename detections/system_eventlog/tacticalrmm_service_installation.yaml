name: TacticalRMM Service Installation
id: 4bb79b62-ef12-4861-981d-2aab43fab642
version: 1
schema_version: "1.0"
date: "2022-11-28"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4bb79b62-ef12-4861-981d-2aab43fab642
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a TacticalRMM service installation. Tactical RMM is a remote
  monitoring & management tool. MITRE ATT&CK: T1219.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*tacticalrmm.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*TacticalRMM Agent Service*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*tacticalrmm.exe*', among other conditions.

known_false_positives: >
  Legitimate use of the tool. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/11/28/emotet-strikes-again-lnk-file-leads-to-domain-wide-ransomware/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    TacticalRMM Service Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE ATT&CK:
    T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - tacticalrmm
    - service
    - installation
    - windows_system
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*[Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_serviceName:/.*[Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm] [Aa][Gg][Ee][Nn][Tt] [Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2db93a3f-3249-4f73-9e68-0e77a0f8ae7e
    name: Remote Access Tool - TacticalRMM Agent Registration to Potentially Attacker-Controlled Server
    reason: 'Same TacticalRMM agent: its installer registers to an attacker-controlled server via command line, the process-creation side of this service install.'
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: Generic 7045 detection for other RMM services; attackers often stack several remote-access tools for persistence redundancy.
  - id: e0d1ad53-c7eb-48ec-a87a-72393cc6cedc
    name: Mesh Agent Service Installation
    reason: MeshAgent is another open-source RMM commonly dropped alongside TacticalRMM (which bundles MeshCentral) as backup C2.
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: Attackers rotate among commercial RMM agents like Atera for redundant persistent remote access on the same host.
  - id: 530a6faa-ff3d-4022-b315-50828e77eef5
    name: Anydesk Remote Access Software Service Installation
    reason: AnyDesk service install is a frequent companion remote-access tool deployed after initial RMM foothold.
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Shows whether the 7045 service was installed remotely over SMB/RPC, indicating lateral deployment of the agent.
  - id: 26481afe-db26-4228-b264-25a29fe6efc7
    name: Uncommon Service Installation Image Path
    reason: Agent service installed from a nonstandard path (Temp/ProgramData) points to dropper-driven rather than admin-driven install.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: 'Post-RMM follow-on: with persistent access established, operators exfiltrate data with rclone before ransomware.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: TacticalRMM / MeshAgent process and install artefacts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn]|[Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Aa][Gg][Ee][Nn][Tt]).*/ OR data_win_eventdata_commandLine:/.*([Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm]|--api|--auth|--client-id|--agent-type).*/)
    pivot_on:
    - host
    window: 2h
  - name: Agent installer dropped or downloaded (file create / download cradle)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn]|[Rr][Mm][Mm]-.*).*\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Cc][Uu][Rr][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]).*[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups to RMM / remote-access infrastructure
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm]|[Mm][Ee][Ss][Hh][Cc][Ee][Nn][Tt][Rr][Aa][Ll]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Aa][Tt][Ee][Rr][Aa]|[Nn][Gg][Rr][Oo][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]).*/
    pivot_on:
    - host
    window: 2h
  - name: Hands-on-keyboard discovery and defense tampering after RMM install
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii] \/[Aa][Ll][Ll]|[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee]|[Aa][Dd][Ff][Ii][Nn][Dd]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Other service installations on host (remote-exec and persistence tooling)
    query: data_win_system_eventID:"7045" AND NOT data_win_eventdata_serviceName:/.*[Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm].*/
    pivot_on:
    - host
    window: 6h
