name: Sysmon Application Crashed
id: 4d7f1827-1637-4def-8d8a-fd254f9454df
version: 1
schema_version: "1.0"
date: "2024-01-17"
author: Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4d7f1827-1637-4def-8d8a-fd254f9454df
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects application popup reporting a failure of the Sysmon service. MITRE
  ATT&CK: T1685.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Application Popup"
              case_insensitive: true
        - term:
            data_win_system_eventID: "26"
        - bool:
            should:
              - term:
                  data_win_eventdata_caption:
                    value: "sysmon64.exe - Application Error"
                    case_insensitive: true
              - term:
                  data_win_eventdata_caption:
                    value: "sysmon.exe - Application Error"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_caption

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Application Popup';
  data_win_system_eventID equals '26'; data_win_eventdata_caption equals
  'sysmon64.exe - Application Error', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/nasbench/EVTX-ETW-Resources/blob/f1b010ce0ee1b71e3024180de1a3e67f99701fe4/ETWProvidersManifests/Windows10/1803/W10_1803_Pro_19700101_17134.1/WEPExplorer/Application%20Popup.xml#L36
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Sysmon Application Crashed detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_caption: $data_win_eventdata_caption$. MITRE ATT&CK:
    T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_caption
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - sysmon
    - application
    - crashed
    - windows_system
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Pp][Oo][Pp][Uu][Pp]/ AND data_win_system_eventID:"26" AND (data_win_eventdata_caption:/[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee] - [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Rr][Rr][Oo][Rr]/ OR data_win_eventdata_caption:/[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee] - [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Rr][Rr][Oo][Rr]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Unloading the SysmonDrv minifilter is the deliberate way to blind Sysmon; a crash popup right after it suggests the sensor was killed on purpose rather than by a fault.
  - id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
    name: Uninstall Sysinternals Sysmon
    reason: sysmon -u after the service dies is the attacker's follow-through to remove the sensor permanently.
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: Changing the Sysmon driver altitude in the registry silently breaks its filter and can cause service failure; a precursor of the crash.
  - id: 8ac03a65-6c84-4116-acad-dc1558ff7a77
    name: Sysmon Configuration Change
    reason: A config swap that excludes attacker tooling often precedes or accompanies a Sysmon service failure.
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: sysmon -c on the command line shows who changed the config just before the service failed.
  - id: 18beca67-ab3e-4ee3-ba7a-a46ca8d7d0cc
    name: Sysmon Channel Reference Deletion
    reason: Deleting the Sysmon channel registration blinds collection of its log; same defense-evasion goal as a killed Sysmon service.
  - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
    name: Eventlog Cleared
    reason: Log clearing commonly follows sensor disruption to erase the window where telemetry was missing.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Attackers stopping security services (including Sysmon) co-occurs with the sensor failing.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon service state changes and errors on this host
    query: data_win_system_providerName:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*/ AND (data_win_system_eventID:"4" OR data_win_system_eventID:"255" OR data_win_system_eventID:"16")
    pivot_on:
    - host
    window: 2h
  - name: Sysmon tampering commands (fltmc unload, sysmon -u/-c, sc stop/delete)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn](64)?(\.[Ee][Xx][Ee])?"? +-[UuCc].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] +(stop|delete|config).*[Ss][Yy][Ss][Mm][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn]Drv.*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry tampering of Sysmon service, driver altitude or channel
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*/
    pivot_on:
    - host
    window: 2h
  - name: Event log clearing after Sysmon failure
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* +(cl|clear-log).*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)))
    pivot_on:
    - host
    window: 4h
  - name: Execution from user-writable paths while Sysmon was down
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa])\\.*/
    pivot_on:
    - host
    window: 2h
