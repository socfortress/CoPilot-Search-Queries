name: Critical Hive In Suspicious Location Access Bits Cleared
id: 39f919f3-980b-4e6f-a975-8af7e507ef2b
version: 1
schema_version: "1.0"
date: "2024-01-18"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39f919f3-980b-4e6f-a975-8af7e507ef2b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects events from the Kernel-General ETW indicating that the access bits of
  a hive with a system like hive name located in the temp directory have been
  reset. This occurs when an application tries to access a hive and the hive has
  not be recognized since the last 7 days (by default). Registry hive dumping
  utilities such as QuarksPwDump were seen emitting this behavior. MITRE ATT&CK:
  T1003.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "16"
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-Kernel-General"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_hiveName:
                    value: "*\\\\Temp\\\\SAM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hiveName:
                    value: "*\\\\Temp\\\\SECURITY*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_hiveName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '16'; data_win_system_providerName
  equals 'Microsoft-Windows-Kernel-General'; data_win_eventdata_hiveName matches
  '*\Temp\SAM*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/nasbench/Misc-Research/blob/b20da2336de0f342d31ef4794959d28c8d3ba5ba/ETW/Microsoft-Windows-Kernel-General.md
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    Critical Hive In Suspicious Location Access Bits Cleared detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_hiveName:
    $data_win_eventdata_hiveName$. MITRE ATT&CK: T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_hiveName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - critical
    - location
    - cleared
    - windows_system
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"16" AND data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Kk][Ee][Rr][Nn][Ee][Ll]-[Gg][Ee][Nn][Ee][Rr][Aa][Ll]/ AND (data_win_eventdata_hiveName:/.*\\[Tt][Ee][Mm][Pp]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_hiveName:/.*\\[Tt][Ee][Mm][Pp]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/)

correlation:
