name: Critical Hive In Suspicious Location Access Bits Cleared
id: 39f919f3-980b-4e6f-a975-8af7e507ef2b
version: 1
schema_version: "1.0"
date: "2024-01-18"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39f919f3-980b-4e6f-a975-8af7e507ef2b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects events from the Kernel-General ETW indicating that the access bits of
  a hive with a system like hive name located in the temp directory have been
  reset. This occurs when an application tries to access a hive and the hive has
  not be recognized since the last 7 days (by default). Registry hive dumping
  utilities such as QuarksPwDump were seen emitting this behavior. MITRE ATT&CK:
  T1003.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "16"
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-Kernel-General"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_hiveName:
                    value: "*\\\\Temp\\\\SAM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hiveName:
                    value: "*\\\\Temp\\\\SECURITY*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_hiveName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '16'; data_win_system_providerName
  equals 'Microsoft-Windows-Kernel-General'; data_win_eventdata_hiveName matches
  '*\Temp\SAM*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/nasbench/Misc-Research/blob/b20da2336de0f342d31ef4794959d28c8d3ba5ba/ETW/Microsoft-Windows-Kernel-General.md
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    Critical Hive In Suspicious Location Access Bits Cleared detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_hiveName:
    $data_win_eventdata_hiveName$. MITRE ATT&CK: T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_hiveName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - critical
    - location
    - cleared
    - windows_system
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"16" AND data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Kk][Ee][Rr][Nn][Ee][Ll]-[Gg][Ee][Nn][Ee][Rr][Aa][Ll]/ AND (data_win_eventdata_hiveName:/.*\\[Tt][Ee][Mm][Pp]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_hiveName:/.*\\[Tt][Ee][Mm][Pp]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: reg save/export of SAM/SECURITY/SYSTEM is the usual way the Temp hive copy is created before it is loaded and triggers this Kernel-General event
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Alternate copy method (esentutl /y /vss) that drops a SAM copy into Temp, which this rule later sees being opened
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Scripted copy of SAM/SECURITY hives (often via shadow copy) that produces the same Temp hive files
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Copy of SAM/SYSTEM/NTDS credential stores to a staging path precedes the hive being accessed from Temp
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Shadow copy is how locked SAM/SECURITY files are copied out to Temp, the direct precursor of this hive access
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Same locked-hive extraction via VSS backup; confirms the hive copy was deliberately sourced
  - id: 82880171-b475-4201-b811-e9c826cd5eaa
    name: Exports Critical Registry Keys To a File
    reason: Registry export of credential-bearing keys is a sibling offline-hive harvesting technique that co-occurs on the same host
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SAM/SECURITY/SYSTEM hive copies written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Yy][Ss][Tt][Ee][Mm])[^\\]*/
    pivot_on:
    - host
    window: 1h
  - name: Hive-saving commands (reg save, esentutl, vss copy)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*(hklm|[Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/) OR (data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*[Vv][Ss][Ss].*/) OR (data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Ss][Aa][Mm].*/) OR (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/))
    pivot_on:
    - host
    window: 1h
  - name: Offline hive credential extraction tooling (secretsdump/mimikatz/QuarksPwDump)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Qq][Uu][Aa][Rr][Kk][Ss][Pp][Ww][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]|[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]|[Ww][Cc][Ee]|[Ff][Gg][Dd][Uu][Mm][Pp]|[Pp][Ww][Dd][Uu][Mm][Pp])[^\\]*/ OR data_win_eventdata_commandLine:/.*([Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Ss][Aa][Mm][Dd][Uu][Mm][Pp]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Oo][Cc][Aa][Ll]\.[Ss][Aa][Mm]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Staged hive/credential archives or exfil tooling after hive access
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Rr][Cc][Ll][Oo][Nn][Ee]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Logons by this account after credential theft (Type 3/10, explicit creds)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"9")
    pivot_on:
    - user
    window: 6h
