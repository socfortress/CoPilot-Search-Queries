name: DHCP Server Loaded the CallOut DLL
id: 13fc89a9-971e-4ca6-b9dc-aa53a445bf40
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Dimitrios Slamaris
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 13fc89a9-971e-4ca6-b9dc-aa53a445bf40
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This rule detects a DHCP server in which a specified Callout DLL (in registry)
  was loaded. MITRE ATT&CK: T1574.001.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "1033"
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-DHCP-Server"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '1033';
  data_win_system_providerName equals 'Microsoft-Windows-DHCP-Server'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.3or.de/mimilib-dhcp-server-callout-dll-injection.html
  - https://technet.microsoft.com/en-us/library/cc726884(v=ws.10).aspx
  - https://msdn.microsoft.com/de-de/library/windows/desktop/aa363389(v=vs.85).aspx
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    DHCP Server Loaded the CallOut DLL detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - server
    - callout
    - windows_system
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1033" AND data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Dd][Hh][Cc][Pp]-[Ss][Ee][Rr][Vv][Ee][Rr]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9d3436ef-9476-4c43-acca-90ce06bdf33a
    name: DHCP Callout DLL Installation
    reason: 'Direct precursor: the registry write to DHCPServer\Parameters CalloutDlls/CalloutEnabled that registers the DLL this event (1033) shows being loaded by the DHCP service.'
  - id: e61e8a88-59a9-451c-874e-70fcc9740d67
    name: New DNS ServerLevelPluginDll Installed
    reason: 'Sibling technique: same attacker tradecraft of registering a rogue DLL in a DC-hosted network service (DNS) via registry for SYSTEM-level persistence; often tried alongside DHCP callout.'
  - id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
    name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
    reason: Alternative service-DLL backdoor on the same infrastructure server; if present, attacker is persisting through multiple network-service plugin points.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The classic payload is mimilib.dll as a DHCP callout, which logs credentials/runs in the DHCP service; Mimikatz tooling on the same host is the staging that produced the DLL.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Follow-on credential access: a DLL planted on a server is often paired with LSASS-loaded unsigned modules (mimilib/SSP) to capture credentials.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Likely next step on a DHCP/DC server: dumping LSASS memory to harvest privileged credentials after SYSTEM code execution is obtained.'
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Attacker establishing a second persistence/execution path (new service) on the same server alongside the callout DLL.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DHCP callout registry configuration changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Dd][Hh][Cc][Pp][Ss][Ee][Rr][Vv][Ee][Rr].*[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss].*[Cc][Aa][Ll][Ll][Oo][Uu][Tt].*/
    pivot_on:
    - host
    window: 24h
  - name: DLL files dropped to System32 or user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]32.*/ OR data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/)
    pivot_on:
    - host
    window: 6h
  - name: Unsigned or unexpected DLL image loads into DHCP service or LSASS
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_signed:"false"
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping tooling and LSASS access
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
  - name: DHCP service stop/restart and service installs
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*[Dd][Hh][Cc][Pp][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Tt][Aa][Rr][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*[Dd][Hh][Cc][Pp].*/))
    pivot_on:
    - host
    window: 6h
