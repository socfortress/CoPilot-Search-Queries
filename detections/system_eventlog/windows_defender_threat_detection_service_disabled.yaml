name: Windows Defender Threat Detection Service Disabled
id: 6c0a7755-6d31-44fa-80e1-133e57752680
version: 1
schema_version: "1.0"
date: "2024-07-02"
author: Ján Trenčanský, frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6c0a7755-6d31-44fa-80e1-133e57752680
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects when the "Windows Defender Threat Protection" service is disabled.
  MITRE ATT&CK: T1685.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "7036"
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_param1:
                    value: "Windows Defender Antivirus Service"
                    case_insensitive: true
              - term:
                  data_win_eventdata_param1:
                    value: "Service antivirus Microsoft Defender"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_param2:
                    value: "stopped"
                    case_insensitive: true
              - term:
                  data_win_eventdata_param2:
                    value: "arrêté"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_param1
    - data_win_eventdata_param2

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '7036';
  data_win_system_providerName equals 'Service Control Manager';
  data_win_eventdata_param1 equals 'Windows Defender Antivirus Service', among
  other conditions.

known_false_positives: >
  Administrator actions. Auto updates of Windows Defender causes restarts.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/defender-endpoint/troubleshoot-microsoft-defender-antivirus
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Threat Detection Service Disabled detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_param1:
    $data_win_eventdata_param1$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_param1
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - threat
    - service
    - windows_system
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7036" AND data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND (data_win_eventdata_param1:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr] [Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_param1:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss] [Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]/) AND (data_win_eventdata_param2:/[Ss][Tt][Oo][Pp][Pp][Ee][Dd]/ OR data_win_eventdata_param2:/[Aa][Rr][Rr][Êê][Tt][Éé]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Tamper Protection blocking an attempt to stop/alter Defender is the failed-attempt twin of this service stop; shows what the actor tried.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender engine is typically degraded in the same window as the service stop; confirms deliberate defense impairment rather than a restart.
  - id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
    name: Tamper Windows Defender Remove-MpPreference
    reason: Precursor/co-occurring PowerShell Defender preference tampering that precedes or accompanies the service being stopped.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Attackers add exclusions before or alongside stopping Defender so payloads survive if it restarts.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender-side record of exclusions added in the same tampering sequence that ends with the service stopped.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Setting a service Start value to disabled via reg.exe is a common mechanism that causes the 7036 stopped event.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: sc/net stop of security services is the process-level command that produces this Service Control Manager stop event.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Log clearing commonly follows blinding the AV to cover tracks before ransomware or payload staging.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands stopping or disabling Defender services
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc]\.?[Ee]?[Xx]?[Ee]? +(stop|config).*([Ww]in[Dd]efend|[Ss]ense|[Ww]d[Ff]ilter|[Ww]d[Bb]oot|[Ww]d[Nn]is[Ss]vc).*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? +stop.*([Ww]in[Dd]efend|[Ss]ense).*/ OR data_win_eventdata_commandLine:/.*[Ss]top-[Ss]ervice.*([Ww]in[Dd]efend|[Ss]ense).*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Aa]nti[Ss]pyware.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/)
    pivot_on:
    - host
    window: 1h
  - name: Defender and security-service registry tampering
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*/ OR data_win_eventdata_targetObject:/.*[Ss]ervices.[Ww]in[Dd]efend.*/ OR data_win_eventdata_targetObject:/.*[Ss]ervices.[Ss]ense.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other security-tool services stopped or service config changes
    query: (data_win_system_eventID:"7040" OR data_win_system_eventID:"7036" OR data_win_system_eventID:"7045") AND data_win_system_providerName:/[Ss]ervice [Cc]ontrol [Mm]anager/
    pivot_on:
    - host
    window: 2h
  - name: Payload staging and execution after protection loss
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Pp]ower[Ss]hell|[Cc]md|[Mm]shta|[Cc]ertutil|[Bb]itsadmin)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*([Ii][Ee][Xx]|[Dd]ownload[Ss]tring|[Ii]nvoke-[Ww]eb[Rr]equest|-[Ee]nc|[Uu]rlcache|http).*/))
    pivot_on:
    - host
    window: 2h
  - name: Log clearing and recovery inhibition
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]evtutil.*(cl|clear-log).*/ OR data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Rr]ecovery.*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on:
    - host
    window: 4h
