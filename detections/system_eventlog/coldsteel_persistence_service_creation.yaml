name: COLDSTEEL Persistence Service Creation
id: 3ced239c-7285-4b54-99c4-8525b69293f7
version: 1
schema_version: "1.0"
date: "2023-05-02"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ced239c-7285-4b54-99c4-8525b69293f7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of new services potentially related to COLDSTEEL RAT.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - term:
                  data_win_eventdata_serviceName:
                    value: "Name"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "msupdate"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "msupdate2"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*\\\\Windows\\\\System32\\\\svchost.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'Name', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/cold-steel/NCSC-MAR-Cold-Steel.pdf

response:
  message: >
    COLDSTEEL Persistence Service Creation detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_serviceName: $data_win_eventdata_serviceName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  custom_tags:
    - coldsteel
    - persistence
    - service
    - windows_system
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Nn][Aa][Mm][Ee]/ OR data_win_eventdata_serviceName:/[Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee]/ OR data_win_eventdata_serviceName:/[Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee]2/) AND data_win_eventdata_imagePath:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
    name: COLDSTEEL RAT Service Persistence Execution
    reason: 'Direct follow-on: SCM launches svchost.exe -k msupdate/msupdate2/alg to run the ColdSteel DLL service just installed.'
  - id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
    name: COLDSTEEL RAT Cleanup Command Execution
    reason: The same persistence service (svchost -k msupdate) spawns rundll32 calling its own cleanup export, the self-removal stage.
  - id: e01b6eb5-1eb4-4465-a165-85d40d874add
    name: COLDSTEEL RAT Anonymous User Process Execution
    reason: MileStone2016 ColdSteel variant runs child processes as user ANONYMOUS, hands-on activity after persistence.
  - id: 612e47e9-8a59-43a6-b404-f48683f45bd6
    name: ServiceDll Hijack
    reason: The svchost-hosted fake service needs a ServiceDll registry value pointing at the RAT DLL; registry side of the same install.
  - id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
    name: Uncommon Svchost Parent Process
    reason: Anomalous svchost lineage indicates a hijacked or fake service host like the one ColdSteel registers.
  - id: 16c37b52-b141-42a5-a3ea-bbe098444397
    name: Suspect Svchost Activity
    reason: Svchost in unusual context is the process-level footprint of a malicious svchost-hosted service.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: svchost launched with ColdSteel service group (msupdate/msupdate2/alg)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Kk] [Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.* -[Kk] [Aa][Ll][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: ServiceDll / service key registry writes for ColdSteel service names
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Nn][Aa][Mm][Ee]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: DLL dropped to writable/system paths (service payload staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: rundll32 spawned by svchost (cleanup export or payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Processes running as ANONYMOUS user (MileStone2016 variant)
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss].*/
    pivot_on:
    - host
    window: 4h
