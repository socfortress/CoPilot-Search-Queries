name: COLDSTEEL Persistence Service Creation
id: 3ced239c-7285-4b54-99c4-8525b69293f7
version: 1
schema_version: "1.0"
date: "2023-05-02"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ced239c-7285-4b54-99c4-8525b69293f7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of new services potentially related to COLDSTEEL RAT.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - term:
                  data_win_eventdata_serviceName:
                    value: "Name"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "msupdate"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "msupdate2"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*\\\\Windows\\\\System32\\\\svchost.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'Name', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/cold-steel/NCSC-MAR-Cold-Steel.pdf

response:
  message: >
    COLDSTEEL Persistence Service Creation detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_serviceName: $data_win_eventdata_serviceName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  custom_tags:
    - coldsteel
    - persistence
    - service
    - windows_system
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Nn][Aa][Mm][Ee]/ OR data_win_eventdata_serviceName:/[Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee]/ OR data_win_eventdata_serviceName:/[Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee]2/) AND data_win_eventdata_imagePath:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
