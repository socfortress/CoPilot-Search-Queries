name: Credential Dumping Tools Service Execution - System
id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Florian Roth (Nextron Systems), Teymur Kheirkhabarov, Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects well-known credential dumping tools execution via service execution
  events. MITRE ATT&CK: T1003.001, T1003.002, T1003.004, T1003.005, T1003.006,
  T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*cachedump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*dumpsvc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*fgexec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*gsecdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*mimidrv*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*pwdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*servpw*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*cachedump*', among other conditions.

known_false_positives: >
  Legitimate Administrator using credential dumping tool for password recovery.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/005/
  - https://attack.mitre.org/techniques/T1003/006/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Credential Dumping Tools Service Execution - System detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_imagePath:
    $data_win_eventdata_imagePath$. MITRE ATT&CK: T1003.001, T1003.002,
    T1003.004, T1003.005, T1003.006, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1003.002
    - T1003.004
    - T1003.005
    - T1003.006
    - T1569.002
  custom_tags:
    - credential
    - dumping
    - tools
    - windows_system
    - credential_access
    - execution
    - s0005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_imagePath:/.*[Dd][Uu][Mm][Pp][Ss][Vv][Cc].*/ OR data_win_eventdata_imagePath:/.*[Ff][Gg][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_imagePath:/.*[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_imagePath:/.*[Mm][Ii][Mm][Ii][Dd][Rr][Vv].*/ OR data_win_eventdata_imagePath:/.*[Pp][Ww][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_imagePath:/.*[Ss][Ee][Rr][Vv][Pp][Ww].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Dump tools (pwdump/fgexec/gsecdump) are often pushed and installed as a remote service via PsExec-style SCM execution; same 7045 service-install mechanism, indicates remote delivery of the tool
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: smbexec/Impacket creates a temporary service via SCM to run commands remotely; same service-creation vector that can deliver credential dumpers
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Process-side view of sc.exe create / service install that precedes the 7045 event and shows the operator's command line
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: mimidrv service install is the kernel-driver stage of Mimikatz; the user-mode Mimikatz process execution is the direct co-occurring activity
  - id: 0685b176-c816-4837-8e7b-1216f346636b
    name: HackTool - Quarks PwDump Execution
    reason: pwdump-family tool matched by the service name executes locally to extract SAM hashes right after the service starts
  - id: 7aa7009a-28b9-4344-8c1f-159489a390df
    name: HackTool - Windows Credential Editor (WCE) Execution
    reason: WCE/gsecdump-class tools run as a service or process to dump logon session credentials, a sibling execution of the same tool class
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Follow-on or alternative SAM/SECURITY/SYSTEM hive extraction by the same operator once dumper services are run or blocked
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Operator frequently switches to living-off-the-land LSASS dumping when a dedicated dump tool is detected or fails
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dump-tool binary or driver dropped to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Mm][Ii][Mm][Ii][Dd][Rr][Vv]|[Pp][Ww][Dd][Uu][Mm][Pp]|[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp]|[Ff][Gg][Ee][Xx][Ee][Cc]|[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp]|[Dd][Uu][Mm][Pp][Ss][Vv][Cc]|[Ss][Ee][Rr][Vv][Pp][Ww]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Sensitive hive, NTDS or LSASS dump output files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]|\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|\\[Ss][Aa][Mm]\.([Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])|\\[Ss][Yy][Ss][Tt][Ee][Mm]\.([Ss][Aa][Vv][Ee]|[Bb][Aa][Kk])|[Pp][Ww][Dd][Uu][Mm][Pp].*\.[Tt][Xx][Tt]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Direct LSASS access or credential-tool command lines
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ss][Aa][Mm][Ss][Rr][Vv]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Ss][Aa][Mm] [Ss][Aa][Vv][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm] [Ss][Aa][Vv][Ee]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]).*/))
    pivot_on:
    - host
    window: 1h
  - name: Service created via sc.exe or driver load of dump tool
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|[Bb][Ii][Nn][Pp][Aa][Tt][Hh]).*/) OR (data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*([Mm][Ii][Mm][Ii][Dd][Rr][Vv]|[Pp][Ww][Dd][Uu][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Network logon and remote service activity from this host (use of harvested hashes)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND data_win_eventdata_authenticationPackageName:/.*[Nn][Tt][Ll][Mm].*/
    pivot_on:
    - host
    window: 6h
