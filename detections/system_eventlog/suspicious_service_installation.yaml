name: Suspicious Service Installation
id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
version: 1
schema_version: "1.0"
date: "2023-12-04"
author: pH-T (Nextron Systems), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious service installation commands. MITRE ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -nop *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -sta *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -w hidden *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*.downloadfile(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*.downloadstring(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\ADMIN$\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\Perflogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath: "*&&*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches '*
  -nop *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Suspicious Service Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE ATT&CK:
    T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - service
    - installation
    - windows_system
    - persistence
    - privilege_escalation
    - car_2013_09_005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.* -[Nn][Oo][Pp] .*/ OR data_win_eventdata_imagePath:/.* -[Ss][Tt][Aa] .*/ OR data_win_eventdata_imagePath:/.* -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] .*/ OR data_win_eventdata_imagePath:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imagePath:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]\(.*/ OR data_win_eventdata_imagePath:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]\(.*/ OR data_win_eventdata_imagePath:/.*\\[Aa][Dd][Mm][Ii][Nn]\$\\.*/ OR data_win_eventdata_imagePath:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_imagePath:/.*\&\&.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: 'Process-creation view of the same act: sc.exe/PowerShell creating the service whose 7045 event fired here; confirms the creating process and parent.'
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: ADMIN$ and temp-path service images in 7045 are the PsExec/remote-service pattern; this confirms the PSEXESVC service actually ran.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Remote service-based execution is a common cause of the cmd/-nop/&& service images; confirms lateral movement via a service.
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: smbexec installs a temporary service with a cmd/&& ImagePath over ADMIN$; the process-side trace of the same technique.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Service installation can be a kernel driver load (BYOVD) for defence evasion; a sibling variant of service-based privilege escalation.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Attackers who cannot or need not install a new service hijack an existing one's binpath/failure command; alternative or follow-on persistence.
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: Same persistence goal through registry ImagePath edits, which produce no 7045 event and sit beside the installed service.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Cobalt Strike/Meterpreter psexec-style service payloads use cmd/powershell pipe images and surface in the same way.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process that created the service (sc.exe / PowerShell New-Service)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)
    pivot_on:
    - host
    window: 1h
  - name: Service binary or payload written to disk (temp, ADMIN$, Perflogs, system32 exe)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*\.(exe|dll|bat|ps1)/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*\.exe/)
    pivot_on:
    - host
    window: 1h
  - name: Remote logon (network/RDP) preceding the service install
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    window: 2h
  - name: Service payload outbound network connections or DNS
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Credential access or defence tampering after SYSTEM-level persistence
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].* [Ss][Aa][Vv][Ee].*/))
    pivot_on:
    - host
    window: 4h
