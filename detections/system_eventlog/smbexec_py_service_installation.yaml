name: smbexec.py Service Installation
id: 52a85084-6989-40c3-8f32-091e12e13f09
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Omer Faruk Celik
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 52a85084-6989-40c3-8f32-091e12e13f09
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of smbexec.py tool by detecting a specific service
  installation. MITRE ATT&CK: T1021.002, T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - term:
                  data_win_eventdata_serviceName:
                    value: "BTOBTO"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*.bat & del *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*__output 2^>^&1 >*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'BTOBTO', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.ropnop.com/using-credentials-to-own-windows-boxes-part-2-psexec-and-services/
  - https://github.com/fortra/impacket/blob/33058eb2fde6976ea62e04bc7d6b629d64d44712/examples/smbexec.py#L286-L296
  - https://github.com/fortra/impacket/blob/edef71f17bc1240f9f8c957bbda98662951ac3ec/examples/smbexec.py#L60
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    smbexec.py Service Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1021.002, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1569.002
  custom_tags:
    - smbexec
    - service
    - installation
    - windows_system
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Bb][Tt][Oo][Bb][Tt][Oo]/ OR data_win_eventdata_imagePath:/.*\.[Bb][Aa][Tt] \& [Dd][Ee][Ll] .*/ OR data_win_eventdata_imagePath:/.*__[Oo][Uu][Tt][Pp][Uu][Tt] 2\^\>\^\&1 \>.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: 'Process-creation view of the same smbexec.py execution: the service''s cmd.exe /Q /c ... \127.0.0.1\C$\__output command line is the child of the 7045 service install.'
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Generic Impacket remote-exec child process (cmd.exe from services.exe/wmiprvse/mmc with ADMIN$/C$ output redirect) confirms the toolkit behind the service install.
  - id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
    name: Potentially Suspicious CMD Shell Output Redirect
    reason: smbexec writes each command's output to a share file via cmd output redirection; this catches the redirect pattern executed by the installed service.
  - id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
    name: Writing Local Admin Share
    reason: smbexec reads results from the __output file written on the C$/ADMIN$ share; file creation on the admin share is an artefact of the same remote session.
  - id: 03f4ca17-de95-428d-a75a-4ee78b047256
    name: HackTool - Impacket File Indicators
    reason: Impacket tools drop characteristic output/batch files (__output, execute.bat); same toolkit and session as the service installation.
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: 'Likely follow-on: an attacker with a SYSTEM shell via smbexec commonly dumps SAM/LSA secrets remotely with secretsdump from the same source.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Commands typed into the smbexec semi-interactive SYSTEM shell frequently include LSASS dumping to harvest credentials for further lateral movement.
  - id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    name: CobaltStrike Service Installations - Security
    reason: Sibling service-install lateral movement detection (4697); both flag remote execution through a malicious Service Control Manager service on the same host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: cmd.exe spawned by services.exe with smbexec-style command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*__output* OR data_win_eventdata_commandLine:*execute.bat* OR data_win_eventdata_commandLine:*127.0.0.1* OR data_win_eventdata_commandLine:*COMSPEC*)
    pivot_on:
    - host
    window: 1h
  - name: Commands run by the SYSTEM service shell (recon and credential access)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*whoami* OR data_win_eventdata_commandLine:*net\ user* OR data_win_eventdata_commandLine:*net\ group* OR data_win_eventdata_commandLine:*ipconfig* OR data_win_eventdata_commandLine:*systeminfo* OR data_win_eventdata_commandLine:*reg\ save* OR data_win_eventdata_commandLine:*comsvcs* OR data_win_eventdata_commandLine:*procdump* OR data_win_eventdata_commandLine:*mimikatz*)
    pivot_on:
    - host
    window: 2h
  - name: Batch/output files written to temp or admin shares
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*__output* OR data_win_eventdata_targetFilename:*execute.bat* OR data_win_eventdata_targetFilename:*Temp*.bat)
    pivot_on:
    - host
    window: 1h
  - name: Remote logons and SMB-share access to this host
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"5140" OR data_win_system_eventID:"5145"
    pivot_on:
    - host
    window: 1h
  - name: Other service installations or log clearing on this host
    query: data_win_system_eventID:"7045" OR data_win_system_eventID:"4697" OR data_win_system_eventID:"1102" OR data_win_system_eventID:"7040"
    pivot_on:
    - host
    window: 6h
