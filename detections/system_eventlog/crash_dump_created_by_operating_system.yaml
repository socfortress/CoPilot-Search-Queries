name: Crash Dump Created By Operating System
id: 882fbe50-d8d7-4e29-ae80-0648a8556866
version: 1
schema_version: "1.0"
date: "2025-05-12"
author: Jason Mull
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 882fbe50-d8d7-4e29-ae80-0648a8556866
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects "BugCheck" errors indicating the system rebooted due to a crash,
  capturing the bugcheck code, dump file path, and report ID. MITRE ATT&CK:
  T1003.002, T1005.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-WER-SystemErrorReporting"
              case_insensitive: true
        - term:
            data_win_system_eventID: "1001"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals
  'Microsoft-Windows-WER-SystemErrorReporting'; data_win_system_eventID equals
  '1001'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sans.edu/cyber-research/from-crash-compromise-unlocking-potential-windows-crash-dumps-offensive-security/
  - https://jasonmull.com/articles/offensive/2025-05-12-windows-crash-dumps-offensive-security/
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1005/

response:
  message: >
    Crash Dump Created By Operating System detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$. MITRE
    ATT&CK: T1003.002, T1005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
    - T1005
  custom_tags:
    - crash
    - operating
    - system
    - windows_system
    - credential_access
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ww][Ee][Rr]-[Ss][Yy][Ss][Tt][Ee][Mm][Ee][Rr][Rr][Oo][Rr][Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]/ AND data_win_system_eventID:"1001"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a18e0862-127b-43ca-be12-1a542c75c7c5
    name: LSASS Process Crashed - Application
    reason: A bugcheck and an LSASS crash can share one cause (exploit or dumping tool destabilising the host); LSASS crash on the same host points to credential-theft or exploit activity rather than a hardware fault.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Crash dumps are a credential-harvesting source (T1003.002); a live comsvcs MiniDump of LSASS on the same host shows the attacker is actively harvesting memory.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Procdump is the common tool for dumping LSASS or other processes; running it near a system dump suggests deliberate memory collection.
  - id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
    name: Kernel Memory Dump Via LiveKD
    reason: LiveKD produces kernel memory dumps without a crash; both paths yield a full-memory file an attacker can mine for secrets.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Unexpected bugchecks are often caused by a freshly loaded unsigned or vulnerable kernel driver (BYOVD); a driver loaded from a temp path just before the crash is the likely cause.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: A known-malicious or abused driver loading shortly before the bugcheck explains a kernel crash caused by an exploit or rootkit.
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: After a dump is written (MEMORY.DMP / Minidump), the next step is copying it off the host for offline credential extraction.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Compressing dump files is the staging step before exfiltration of the memory dump produced by the crash.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Crash-forcing / dump-configuration tampering on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Nn][Oo][Tt][Mm][Yy][Ff][Aa][Uu][Ll][Tt].*/ OR data_win_eventdata_image:/.*[Ll][Ii][Vv][Ee][Kk][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Aa][Ss][Hh][Oo][Nn][Cc][Tt][Rr][Ll][Ss][Cc][Rr][Oo][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Aa][Ss][Hh][Cc][Oo][Nn][Tt][Rr][Oo][Ll].*/)) OR (data_win_system_eventID:("12" OR "13") AND data_win_eventdata_targetObject:/.*[Cc][Rr][Aa][Ss][Hh][Cc][Oo][Nn][Tt][Rr][Oo][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Kernel driver loaded from user-writable paths before crash
    query: data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*([Tt]emp|[Uu]sers|[Pp]rogram[Dd]ata|[Dd]ownloads|[Pp]ublic).*\.[Ss][Yy][Ss]/
    pivot_on:
    - host
    window: 2h
  - name: Kernel driver service installation (sc create / 7045)
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Tt][Yy][Pp][Ee].*=.*[Kk][Ee][Rr][Nn][Ee][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS process access and memory-dump tooling
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: Dump file creation, copy, or archiving
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ee][Mm][Oo][Rr][Yy]\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ AND data_win_eventdata_commandLine:/.*([Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|7[Zz]|[Rr][Aa][Rr]|[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]).*/)))
    pivot_on:
    - host
    window: 4h
