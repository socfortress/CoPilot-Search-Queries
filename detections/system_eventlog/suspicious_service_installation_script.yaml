name: Suspicious Service Installation Script
id: 70f00d10-60b2-4f34-b9a0-dc3df3fe762a
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 70f00d10-60b2-4f34-b9a0-dc3df3fe762a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious service installation scripts. MITRE ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* /c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* –c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* —c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* ―c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* /r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* –r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* —r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* ―r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* /k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* –k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* —k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* ―k *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*cscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*mshta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*pwsh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*regsvr32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*rundll32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*wscript*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches '*
  -c *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Suspicious Service Installation Script detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE
    ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - service
    - installation
    - windows_system
    - persistence
    - privilege_escalation
    - car_2013_09_005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.* -[Cc] .*/ OR data_win_eventdata_imagePath:/.* \/[Cc] .*/ OR data_win_eventdata_imagePath:/.* –[Cc] .*/ OR data_win_eventdata_imagePath:/.* —[Cc] .*/ OR data_win_eventdata_imagePath:/.* ―[Cc] .*/ OR data_win_eventdata_imagePath:/.* -[Rr] .*/ OR data_win_eventdata_imagePath:/.* \/[Rr] .*/ OR data_win_eventdata_imagePath:/.* –[Rr] .*/ OR data_win_eventdata_imagePath:/.* —[Rr] .*/ OR data_win_eventdata_imagePath:/.* ―[Rr] .*/ OR data_win_eventdata_imagePath:/.* -[Kk] .*/ OR data_win_eventdata_imagePath:/.* \/[Kk] .*/ OR data_win_eventdata_imagePath:/.* –[Kk] .*/ OR data_win_eventdata_imagePath:/.* —[Kk] .*/ OR data_win_eventdata_imagePath:/.* ―[Kk] .*/) AND (data_win_eventdata_imagePath:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_imagePath:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_imagePath:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_imagePath:/.*[Pp][Ww][Ss][Hh].*/ OR data_win_eventdata_imagePath:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR data_win_eventdata_imagePath:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_imagePath:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: The 7045 imagePath running cmd/powershell with -c or /c is the classic Meterpreter/Cobalt Strike getsystem or psexec-style service; this catches the same pattern at process creation.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Process-side view of the same service creation (sc create binpath= / New-Service); confirms the creating parent and command line.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: A script-interpreter service installed remotely is often a PsExec/PAExec-style lateral movement service; PSEXESVC.exe running corroborates remote origin.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Operator-side PsExec command line with credentials and UNC target that precedes the remote 7045 service install.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Services running cmd /c echo to a pipe are the getsystem named-pipe impersonation technique; same causal chain as this service install.
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: Attacker-staged services point at user-writable paths; corroborates the installed service is malicious persistence.
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: A powershell service imagePath commonly carries an encoded payload; detects the encoded command executing when the service starts.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Script-based services often run a download cradle to fetch the next-stage implant after installation.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service-spawned script interpreters (services.exe parent)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Encoded or download-cradle PowerShell execution
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Ee][Nn]?[Cc]?.*/ OR data_win_eventdata_commandLine:*DownloadString* OR data_win_eventdata_commandLine:*DownloadFile* OR data_win_eventdata_commandLine:*Invoke-WebRequest* OR data_win_eventdata_commandLine:*FromBase64String* OR data_win_eventdata_commandLine:*[Ii][Ee][Xx]*)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*Invoke-Expression*))
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from script interpreters
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Remote service-exec artefacts: network logons and PsExec/RemCom files'
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_targetFilename:/.*\\[Rr][Ee][Mm][Cc][Oo][Mm].*/))
    pivot_on:
    - host
    window: 1h
  - name: Service binaries and drivers dropped to writable system paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/) AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 1h
