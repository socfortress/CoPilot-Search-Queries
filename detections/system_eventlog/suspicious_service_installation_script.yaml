name: Suspicious Service Installation Script
id: 70f00d10-60b2-4f34-b9a0-dc3df3fe762a
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 70f00d10-60b2-4f34-b9a0-dc3df3fe762a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious service installation scripts. MITRE ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* /c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* –c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* —c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* ―c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* /r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* –r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* —r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* ―r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* -k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* /k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* –k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* —k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "* ―k *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*cscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*mshta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*pwsh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*regsvr32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*rundll32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*wscript*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches '*
  -c *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Suspicious Service Installation Script detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE
    ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - service
    - installation
    - windows_system
    - persistence
    - privilege_escalation
    - car_2013_09_005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.* -[Cc] .*/ OR data_win_eventdata_imagePath:/.* \/[Cc] .*/ OR data_win_eventdata_imagePath:/.* –[Cc] .*/ OR data_win_eventdata_imagePath:/.* —[Cc] .*/ OR data_win_eventdata_imagePath:/.* ―[Cc] .*/ OR data_win_eventdata_imagePath:/.* -[Rr] .*/ OR data_win_eventdata_imagePath:/.* \/[Rr] .*/ OR data_win_eventdata_imagePath:/.* –[Rr] .*/ OR data_win_eventdata_imagePath:/.* —[Rr] .*/ OR data_win_eventdata_imagePath:/.* ―[Rr] .*/ OR data_win_eventdata_imagePath:/.* -[Kk] .*/ OR data_win_eventdata_imagePath:/.* \/[Kk] .*/ OR data_win_eventdata_imagePath:/.* –[Kk] .*/ OR data_win_eventdata_imagePath:/.* —[Kk] .*/ OR data_win_eventdata_imagePath:/.* ―[Kk] .*/) AND (data_win_eventdata_imagePath:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_imagePath:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_imagePath:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_imagePath:/.*[Pp][Ww][Ss][Hh].*/ OR data_win_eventdata_imagePath:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR data_win_eventdata_imagePath:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_imagePath:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0255a820-e564-4e40-af2b-6ac61160335c
      name: "A New Trust Was Created To A Domain"
      reason: "next kill-chain tactic: Persistence"
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
      name: "Account Tampering - Suspicious Failed Logon Reasons"
      reason: "next kill-chain tactic: Persistence"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
      name: "Active Directory User Backdoors"
      reason: "next kill-chain tactic: Persistence"
    - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
      name: "Addition of SID History to Active Directory Object"
      reason: "next kill-chain tactic: Privilege Escalation"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
