name: New PDQDeploy Service - Client Side
id: b98a10af-1e1e-44a7-bab2-4cc026917648
version: 1
schema_version: "1.0"
date: "2022-07-22"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b98a10af-1e1e-44a7-bab2-4cc026917648
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PDQDeploy service installation on the target system. When a package is
  deployed via PDQDeploy it installs a remote service on the target machine with
  the name "PDQDeployRunner-X" where "X" is an integer starting from 1. MITRE
  ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*PDQDeployRunner-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "PDQDeployRunner-*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*PDQDeployRunner-*', among other conditions.

known_false_positives: >
  Legitimate use of the tool. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://documentation.pdq.com/PDQDeploy/13.0.3.0/index.html?windows-services.htm
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    New PDQDeploy Service - Client Side detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE ATT&CK:
    T1543.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - pdqdeploy
    - service
    - client
    - windows_system
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy][Rr][Uu][Nn][Nn][Ee][Rr]-.*/ OR data_win_eventdata_serviceName:/[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy][Rr][Uu][Nn][Nn][Ee][Rr]-.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ee9ca27c-9bd7-4cee-9b01-6e906be7cae3
    name: New PDQDeploy Service - Server Side
    reason: 'Same tool, other end: the PDQDeploy console host installs its own service when a push is initiated, so a pair across hosts shows which machine is the deployment source.'
  - id: d679950c-abb7-43a6-80fb-2a480c4fc450
    name: PDQ Deploy Remote Adminstartion Tool Execution
    reason: PDQ binaries running on the host shortly before or after the PDQDeployRunner service install confirms the push actually executed rather than just a service registration.
  - id: 12b8e9f5-96b2-41e1-9a42-8c6779a5c184
    name: Potentially Suspicious Execution Of PDQDeployRunner
    reason: The runner service launches payloads; this fires when PDQDeployRunner spawns shells, script hosts or runs from unusual paths, the follow-on that distinguishes admin deployment from abuse.
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: Attackers who obtain PDQ rights often also drop other RATs/RMM services via the same push; co-occurring 7045 service installs on the host indicate tooling stacking.
  - id: 5e993621-67d4-488a-b9ae-b420d08b96cb
    name: Service Installation in Suspicious Folder
    reason: A malicious PDQ package or attacker-staged runner may register a service whose binary sits in Temp/ProgramData/user folders instead of the normal PDQ path.
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: PDQDeploy is used as an alternative to PsExec for remote service-based execution; both appearing on a host suggests an operator mixing lateral movement tools.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PDQDeployRunner process execution and spawned children
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy][Rr][Uu][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_parentImage:/.*[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy][Rr][Uu][Nn][Nn][Ee][Rr].*/)
    pivot_on:
    - host
    window: 1h
  - name: Shell or script interpreter launched by PDQ deployment payload
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Pp][Dd][Qq].*/ AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Files dropped by PDQ runner or AdminArsenal paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Pp][Dd][Qq].*/ OR data_win_eventdata_targetFilename:/.*([Aa][Dd][Mm][Ii][Nn][Aa][Rr][Ss][Ee][Nn][Aa][Ll]|[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Inbound SMB/RPC admin logon preceding the PDQ service install
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "2" OR "10") AND data_win_eventdata_authenticationPackageName:("NTLM" OR "Negotiate" OR "Kerberos")
    pivot_on:
    - host
    window: 1h
  - name: Other service installs from Service Control Manager on this host
    query: data_win_system_eventID:"7045" AND data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND NOT data_win_eventdata_serviceName:/[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy][Rr][Uu][Nn][Nn][Ee][Rr]-.*/
    pivot_on:
    - host
    window: 6h
