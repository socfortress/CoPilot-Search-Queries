name: Invoke-Obfuscation Via Stdin - System
id: 487c7524-f892-4054-b263-8a0ace63fc25
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 487c7524-f892-4054-b263-8a0ace63fc25
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via Stdin in Scripts. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath: "*&&*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*environment*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*invoke*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*input*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*set*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Stdin - System detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE ATT&CK:
    T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - stdin
    - windows_system
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*[Ss][Ee][Tt].*/ AND data_win_eventdata_imagePath:/.*\&\&.*/ AND (data_win_eventdata_imagePath:/.*[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt].*/ OR data_win_eventdata_imagePath:/.*[Ii][Nn][Vv][Oo][Kk][Ee].*/ OR data_win_eventdata_imagePath:/.*[Ii][Nn][Pp][Uu][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 72862bf2-0eb1-11eb-adc1-0242ac120002
    name: Invoke-Obfuscation STDIN+ Launcher - System
    reason: Sibling 7045 detection for the STDIN+ launcher variant; same obfuscated cmd/powershell service ImagePath technique, so one operator often trips both
  - id: 0c718a5e-4284-4fb9-b4d9-b9a50b3a1974
    name: Invoke-Obfuscation STDIN+ Launcher - Security
    reason: Same obfuscated stdin service image path recorded as Security 4697, confirming the service install from a second log source
  - id: 80b708f3-d034-40e4-a6c8-d23b7a7db3d1
    name: Invoke-Obfuscation Via Stdin - Security
    reason: Security-log (4697) twin of this System 7045 detection for the identical stdin obfuscation in a service ImagePath
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: The alert is itself a service created with a command-line payload; generic suspicious 7045 service-install patterns corroborate the persistence/execution vector
  - id: 70f00d10-60b2-4f34-b9a0-dc3df3fe762a
    name: Suspicious Service Installation Script
    reason: Service ImagePath running script interpreters is the same vector; this confirms scripted payload launched via a new service
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Obfuscated command services are commonly created remotely over SMB by PsExec-style tooling, indicating lateral movement delivery
  - id: 52a85084-6989-40c3-8f32-091e12e13f09
    name: smbexec.py Service Installation
    reason: smbexec creates a service whose ImagePath is a cmd /c command line; an obfuscated stdin variant is a likely lateral-execution cause
  - id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell
    reason: 'Follow-on: the service-launched obfuscated PowerShell executes and its deobfuscated script block is logged as 4104'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell/cmd spawned from services.exe with set/&&/stdin patterns
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Obfuscated PowerShell command lines (stdin, env var, invoke tokens)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Vv]:.*/ OR data_win_eventdata_commandLine:/.*-[Cc]\s+-.*/ OR data_win_eventdata_commandLine:/.*&&.*/)
    pivot_on:
    - host
    window: 1h
  - name: Script block logging of deobfuscated payload (download cradle / IEX)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64.*/)
    pivot_on:
    - host
    window: 1h
  - name: New service installations (7045) with command-interpreter image paths
    query: data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Oo][Mm][Ss][Pp][Ee][Cc]).*/
    pivot_on:
    - host
    window: 6h
  - name: Outbound network connections from cmd/powershell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
