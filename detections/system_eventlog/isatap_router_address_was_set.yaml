name: ISATAP Router Address Was Set
id: d22df9cd-2aee-4089-93c7-9dc4eae77f2c
version: 1
schema_version: "1.0"
date: "2025-10-19"
author: hamid
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d22df9cd-2aee-4089-93c7-9dc4eae77f2c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the configuration of a new ISATAP router on a Windows host. While
  ISATAP is a legitimate Microsoft technology for IPv6 transition, unexpected or
  unauthorized ISATAP router configurations could indicate a potential IPv6 DNS
  Takeover attack using tools like mitm6. In such attacks, adversaries advertise
  themselves as DHCPv6 servers and set malicious ISATAP routers to intercept
  traffic. This detection should be correlated with network baselines and known
  legitimate ISATAP deployments in your environment. MITRE ATT&CK: T1557,
  T1565.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "4100"
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-Iphlpsvc"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_isatapRouter"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_isatapRouter: "127.0.0.1"
                    - term:
                        data_win_eventdata_isatapRouter: "::1"
                  minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  must_not:
                    - exists:
                        field: "data_win_eventdata_isatapRouter"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_isatapRouter

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '4100';
  data_win_system_providerName equals 'Microsoft-Windows-Iphlpsvc';
  data_win_eventdata_isatapRouter equals '127.0.0.1', among other conditions.

known_false_positives: >
  Legitimate ISATAP router configuration in enterprise environments. IPv6
  transition projects and network infrastructure changes. Network administrators
  configuring dual-stack networking. Automatic ISATAP configuration in some
  Windows deployments. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://www.blackhillsinfosec.com/mitm6-strikes-again-the-dark-side-of-ipv6/
  - https://redfoxsec.com/blog/ipv6-dns-takeover/
  - https://www.securityhq.com/blog/malicious-isatap-tunneling-unearthed-on-windows-server/
  - https://medium.com/@ninnesoturan/detecting-ipv6-dns-takeover-a54a6a88be1f
  - https://attack.mitre.org/techniques/T1557/
  - https://attack.mitre.org/techniques/T1565/002/

response:
  message: >
    ISATAP Router Address Was Set detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_isatapRouter: $data_win_eventdata_isatapRouter$. MITRE
    ATT&CK: T1557, T1565.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_isatapRouter
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557
    - T1565.002
  custom_tags:
    - isatap
    - router
    - address
    - windows_system
    - impact
    - credential_access
    - collection
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4100" AND data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ii][Pp][Hh][Ll][Pp][Ss][Vv][Cc]/ AND _exists_:data_win_eventdata_isatapRouter AND NOT (data_win_eventdata_isatapRouter:"127.0.0.1" OR data_win_eventdata_isatapRouter:"::1") AND NOT (NOT _exists_:data_win_eventdata_isatapRouter)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: mitm6 poisoning exists to feed NTLM relay (ntlmrelayx/Inveigh); relay tooling on or near this host is the direct follow-on of a rogue ISATAP/DHCPv6 takeover
  - id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
    name: NetNTLM Downgrade Attack - Registry
    reason: Attackers capturing authentication via IPv6/WPAD poisoning also weaken NTLM settings to make captured hashes relayable or crackable
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: Coerced machine authentication (spooler) is paired with a mitm6 relay to land NTLM auth on the attacker-controlled IPv6 host
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: DNS-based coercion/spoofing is the sibling of mitm6 DNS takeover and uses the same attacker-controlled name resolution to redirect auth
  - id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
    name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
    reason: Marshalled-SPN DNS names resolving through a poisoned resolver show the DNS takeover being used to redirect Kerberos/NTLM auth
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: A relayed machine-account authentication from mitm6 is commonly escalated to local SYSTEM via KrbRelayUp (RBCD/shadow credentials)
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: Authentication captured via IPv6 takeover is relayed to LDAP/Kerberos with KrbRelay-style tooling
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: After a relay to LDAP succeeds, attackers enumerate SPNs/domain objects to pick Kerberoast or delegation targets
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: IPv6 transition / ISATAP configuration changes via netsh or PowerShell
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ii][Ss][Aa][Tt][Aa][Pp].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ii][Pp][Vv]6|[Tt][Ee][Rr][Ee][Dd][Oo]|6[Tt][Oo]4).*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(Set-NetIsatapConfiguration|Set-Net6to4Configuration|Set-NetTeredoConfiguration).*/)
    pivot_on:
    - host
    window: 2h
  - name: NTLM relay / mitm6 / LLMNR poisoning tooling executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Mm][Ii][Tt][Mm]6|[Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy][Xx]|[Ii][Nn][Vv][Ee][Aa][Hh]|[Rr][Ee][Ss][Pp][Oo][Nn][Dd][Ee][Rr]|[Ss][Mm][Bb][Rr][Ee][Ll][Aa][Yy])[^\\]*/ OR data_win_eventdata_commandLine:/.*([Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy][Xx]|[Mm][Ii][Tt][Mm]6|[Ii][Nn][Vv][Ee][Aa][Hh]|[Ss][Mm][Bb][Rr][Ee][Ll][Aa][Yy]).*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups for WPAD / ISATAP names (poisoned resolver targets)
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/[Ww][Pp][Aa][Dd].*/ OR data_win_eventdata_queryName:/[Ii][Ss][Aa][Tt][Aa][Pp].*/ OR data_win_eventdata_queryName:*UWhRCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA*)
    pivot_on:
    - host
    window: 2h
  - name: Outbound LDAP/LDAPS/SMB connections by non-system processes (relay targets)
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:("389" OR "636" OR "3268" OR "445") AND NOT data_win_eventdata_image:/.*\([Ll][Ss][Aa][Ss][Ss]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:"System"
    pivot_on:
    - host
    window: 1h
  - name: Machine account creation or RBCD delegation attribute changes
    query: data_win_system_eventID:"4741" OR (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:"msDS-AllowedToActOnBehalfOfOtherIdentity")
    pivot_on:
    - host
    window: 6h
