name: Local Privilege Escalation Indicator TabTip
id: bc2e25ed-b92b-4daa-b074-b502bdd1982b
version: 1
schema_version: "1.0"
date: "2023-04-14"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bc2e25ed-b92b-4daa-b074-b502bdd1982b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the invocation of TabTip via CLSID as seen when JuicyPotatoNG is used
  on a system in brute force mode. MITRE ATT&CK: T1557.001.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-DistributedCOM"
              case_insensitive: true
        - term:
            data_win_system_eventID: "10001"
        - term:
            data_win_eventdata_param1:
              value: "C:\\Program Files\\Common Files\\microsoft shared\\ink\\TabTip.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_param2: "2147943140"
        - term:
            data_win_eventdata_param3:
              value: "{054AAE20-4BEA-4347-8A35-64A533254A9D}"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_param1
    - data_win_eventdata_param2
    - data_win_eventdata_param3

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals
  'Microsoft-Windows-DistributedCOM'; data_win_system_eventID equals '10001';
  data_win_eventdata_param1 equals 'C:\Program Files\Common Files\microsoft
  shared\ink\TabTip.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/antonioCoco/JuicyPotatoNG
  - https://attack.mitre.org/techniques/T1557/001/

response:
  message: >
    Local Privilege Escalation Indicator TabTip detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_param1: $data_win_eventdata_param1$. MITRE
    ATT&CK: T1557.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_param1
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.001
  custom_tags:
    - local
    - privilege
    - escalation
    - windows_system
    - collection
    - execution
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ee][Dd][Cc][Oo][Mm]/ AND data_win_system_eventID:"10001" AND data_win_eventdata_param1:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Ii][Nn][Kk]\\[Tt][Aa][Bb][Tt][Ii][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_param2:"2147943140" AND data_win_eventdata_param3:/\{054[Aa][Aa][Ee]20-4[Bb][Ee][Aa]-4347-8[Aa]35-64[Aa]533254[Aa]9[Dd]\}/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: 'Sibling potato-family tool: same DCOM/NTLM-reflection SYSTEM token theft; an attacker brute-forcing CLSIDs with JuicyPotatoNG may pivot to CoercedPotato'
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Alternate local NTLM-reflection privilege escalation tooling tried when JuicyPotatoNG is blocked or fails
  - id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
    name: HackTool - EfsPotato Named Pipe Creation
    reason: Another potato variant that abuses a named pipe for SYSTEM impersonation on the same host
  - id: 4d0083b3-580b-40da-9bba-626c19fe4033
    name: HackTool - CoercedPotato Named Pipe Creation
    reason: Pipe artifact of potato-style coercion that accompanies the DCOM activation failures seen here
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: The token impersonation technique JuicyPotatoNG relies on after the COM callback; confirms SYSTEM token acquisition
  - id: 16f5d8ca-44bd-47c8-acbe-6fc95a16c12f
    name: RottenPotato Like Attack Pattern
    reason: Security log logon pattern (4624 with anonymous/NTLM loopback) produced by the same potato token-reflection mechanism
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: Common post-exploitation SYSTEM elevation path; follows or substitutes for potato escalation in the same intrusion
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: Once SYSTEM is obtained, attackers commonly install a service for persistence or payload execution (7045)
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Potato-style tooling process execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Jj][Uu][Ii][Cc][Yy][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_image:/.*[Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Jj][Uu][Ii][Cc][Yy][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*-[Tt] [Tt] .*-[Pp] .*/ OR data_win_eventdata_commandLine:/.*-[Ll] [0-9]+.*-[Cc] \{.*/)
    pivot_on:
    - host
    window: 1h
  - name: SYSTEM-level shell spawned by non-service parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*(SYSTEM|System)/ AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/) AND NOT data_win_eventdata_parentImage:/.*\\([Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Potato named pipe creation or connection
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_pipeName:/.*[Ee][Ff][Ss][Rr][Pp][Cc].*/ OR data_win_eventdata_pipeName:/.*[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ll].*/ OR data_win_eventdata_pipeName:/.*[Ss][Pp][Oo][Oo][Ll][Ss][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: New service installation after escalation
    query: data_win_system_eventID:"7045"
    pivot_on:
    - host
    window: 2h
  - name: Credential access and persistence by SYSTEM-privileged actions
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].* [Ss][Aa][Vv][Ee] .*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn].*/))
    pivot_on:
    - host
    window: 2h
