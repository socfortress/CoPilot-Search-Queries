name: HackTool Service Registration or Execution
id: d26ce60c-2151-403c-9a42-49420d87b5e4
version: 1
schema_version: "1.0"
date: "2023-08-07"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d26ce60c-2151-403c-9a42-49420d87b5e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects installation or execution of services. MITRE ATT&CK: T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_system_eventID: "7045"
              - term:
                  data_win_system_eventID: "7036"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*cachedump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*DumpSvc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*gsecdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*pwdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*UACBypassedService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*WCE SERVICE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*WCESERVICE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*winexesvc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*bypass*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_system_eventID equals '7036',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    HackTool Service Registration or Execution detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_serviceName: $data_win_eventdata_serviceName$.
    MITRE ATT&CK: T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - hacktool
    - service
    - registration
    - windows_system
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND (data_win_system_eventID:"7045" OR data_win_system_eventID:"7036") AND (data_win_eventdata_serviceName:/.*[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_serviceName:/.*[Dd][Uu][Mm][Pp][Ss][Vv][Cc].*/ OR data_win_eventdata_serviceName:/.*[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_serviceName:/.*[Pp][Ww][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_serviceName:/.*[Uu][Aa][Cc][Bb][Yy][Pp][Aa][Ss][Ss][Ee][Dd][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Ww][Cc][Ee] [Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Ww][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Ww][Ii][Nn][Ee][Xx][Ee][Ss][Vv][Cc].*/ OR data_win_eventdata_imagePath:/.*[Bb][Yy][Pp][Aa][Ss][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PsExec-style remote service (PSEXESVC/winexesvc) is the same service-based remote execution channel; both fire when a hacktool is pushed to this host over SMB admin shares
  - id: 51ae86a2-e2e1-4097-ad85-c46cb6851de4
    name: Renamed PsExec Service Execution
    reason: Attackers rename the service to dodge name matching like this rule's; the renamed variant is the same lateral-execution service seen by process creation
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: smbexec creates a temporary service via SCM (7045) to run commands remotely; a hacktool service plus smbexec command line confirms remote service-exec lateral movement
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Same sc/service creation primitive from the process side; shows the command line and parent that registered the hacktool service
  - id: 7aa7009a-28b9-4344-8c1f-159489a390df
    name: HackTool - Windows Credential Editor (WCE) Execution
    reason: WCESERVICE/WCE SERVICE names in this rule are the WCE credential tool installing its service; process-side execution of WCE corroborates credential theft
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: pwdump/gsecdump/cachedump service installs precede or accompany credential extraction; Mimikatz is the common sibling or follow-on tool on the same host
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Dumper services read LSASS memory to harvest hashes; process access to LSASS right after the service starts confirms the dump
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Attackers disable AV just before dropping and starting hacktool services so the binary survives; precursor on the same host
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installs with suspicious binary paths or admin-share origin
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_imagePath:/.*\\\\.*\\[Cc]\$.*/ OR data_win_eventdata_imagePath:/.*[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imagePath:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_imagePath:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_imagePath:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_imagePath:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping tooling and LSASS access on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*sekurlsa.*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ww][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee] +[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 1h
  - name: Hacktool binary or dump file written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Pp][Ww][Dd][Uu][Mm][Pp]|[Gg][Ss][Ee][Cc][Dd][Uu][Mm][Pp]|[Ww][Cc][Ee]|[Cc][Aa][Cc][Hh][Ee][Dd][Uu][Mm][Pp]|[Ww][Ii][Nn][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]).*/ OR data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp])/ OR data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Security tooling tampered or disabled around the service install
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.?[Ee]?[Xx]?[Ee]? +(stop|config).*(WinDefend|Sense|EventLog).*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* +cl .*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote logons to this host preceding service creation
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on:
    - host
    window: 2h
