name: NetSupport Manager Service Install
id: 2d510d8d-912b-45c5-b1df-36faa3d8c3f4
version: 1
schema_version: "1.0"
date: "2022-10-31"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2d510d8d-912b-45c5-b1df-36faa3d8c3f4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects NetSupport Manager service installation on the target system.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\NetSupport Manager\\\\client32.exe*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "Client32"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*\NetSupport Manager\client32.exe*', among other conditions.

known_false_positives: >
  Legitimate use of the tool. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - http://resources.netsupportsoftware.com/resources/manualpdfs/nsm_manual_uk.pdf

response:
  message: >
    NetSupport Manager Service Install detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_imagePath: $data_win_eventdata_imagePath$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - netsupport
    - manager
    - service
    - windows_system
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*\\[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_serviceName:/[Cc][Ll][Ii][Ee][Nn][Tt]32/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: The installed Client32 service launches client32.exe; process-creation of NetSupport on the same host confirms the agent is actually running, not just registered.
  - id: 37e8d358-6408-4853-82f4-98333fca7014
    name: Remote Access Tool - NetSupport Execution From Unusual Location
    reason: Malicious NetSupport RAT deployments drop client32.exe into user-writable paths (AppData, Temp, ProgramData); this separates abuse from a sanctioned install.
  - id: 0afbd410-de03-4078-8491-f132303cb67d
    name: Renamed NetSupport RAT Execution
    reason: Attackers rename client32.exe to dodge name-based rules while keeping the Client32 service; same implant, evasion variant.
  - id: Windows-NetSupport-RMM-DLL-Loaded-By-Uncommon-Process
    name: Windows NetSupport RMM DLL Loaded By Uncommon Process
    reason: NetSupport's support DLLs (pcicl32/HTCTL32) side-loaded by an unrelated process indicates a staged or loader-driven install preceding the service.
  - id: 2f3039c8-e8fe-43a9-b5cf-dcd424a2522d
    name: File Creation Related To RAT Clients
    reason: Dropping of RAT client files (client32.ini, NSM.lic, etc.) immediately precedes service registration, showing the payload staging step.
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: Same 7045 service-install telemetry for other remote-access tools; attackers frequently stack several RMM/RAT tools for redundant access.
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: After install, the agent resolves NetSupport gateway/geo-lookup domains from a non-browser process, confirming outbound C2 check-in.
  - id: 26481afe-db26-4228-b264-25a29fe6efc7
    name: Uncommon Service Installation Image Path
    reason: A service whose image path is outside standard directories is a co-occurring persistence-quality indicator on the same 7045 event.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NetSupport client files dropped (client32, NSM.lic, pcicl32)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Cc][Ll][Ii][Ee][Nn][Tt]32\.(exe|ini).*/ OR data_win_eventdata_targetFilename:/.*[Nn][Ss][Mm]\.[Ll][Ii][Cc].*/ OR data_win_eventdata_targetFilename:/.*[Pp][Cc][Ii][Cc][Ll]32\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*[Hh][Tt][Cc][Tt][Ll]32\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Mm][Cc][Mm][Dd][Ss][Tt][Uu][Bb]\.[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: client32.exe process execution and its parent (dropper chain)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:*NetSupport*)
    pivot_on:
    - host
    window: 6h
  - name: Outbound connections from NetSupport client32 (gateway/C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: DNS lookups for NetSupport geo/gateway domains
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*netsupportsoftware.com* OR data_win_eventdata_queryName:*netsupport-manager* OR data_win_eventdata_queryName:*geo.netsupportsoftware*)
    pivot_on:
    - host
    window: 4h
  - name: Other remote-access tool installs or hands-on-keyboard shells after install
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Rr][Uu][Tt][Ss][Ee][Rr][Vv]|[Nn][Gg][Rr][Oo][Kk])[^\\]*\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
