name: Turla PNG Dropper Service
id: 1228f8e2-7e79-4dea-b0ad-c91f1d5016c1
version: 1
schema_version: "1.0"
date: "2021-11-30"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1228f8e2-7e79-4dea-b0ad-c91f1d5016c1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This method detects malicious services mentioned in Turla PNG dropper report
  by NCC Group in November 2018. MITRE ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - term:
            data_win_eventdata_serviceName:
              value: "WerFaultSvc"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'WerFaultSvc'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.nccgroup.com/2018/11/22/turla-png-dropper-is-back/
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Turla PNG Dropper Service detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1543.003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - turla
    - dropper
    - service
    - windows_system
    - privilege_escalation
    - persistence
    - g0010
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_serviceName:/[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt][Ss][Vv][Cc]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: Same 7045 service-install telemetry; confirms the WerFaultSvc registration used a suspicious binary path or arguments.
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: The dropper service runs a payload from a non-standard directory; this flags the binary location behind the fake WerFaultSvc.
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Registry-side view of the same service creation (ImagePath under Services key); corroborates the 7045 event.
  - id: a07f0359-4c90-4dc4-a681-8ffea40b4f47
    name: Service Binary in Suspicious Folder
    reason: Service ImagePath pointing to a user-writable folder is how the PNG dropper's service payload is staged.
  - id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
    name: Creation of WerFault.exe/Wer.dll in Unusual Folder
    reason: The service name masquerades as Windows Error Reporting; dropped fake WerFault binaries/DLLs are the masquerade payload.
  - id: 9e2e51c5-c699-4794-ba5a-29f5da40ac0c
    name: Turla Group Commands May 2020
    reason: Follow-on Turla operator discovery commands after the backdoor service starts.
  - id: c601f20d-570a-4cde-a7d6-e17f99cb8e7f
    name: Turla Group Lateral Movement
    reason: Turla's next step after establishing persistence is lateral movement with the same toolset.
  - id: 739915e4-1e70-4778-8b8a-17db02f66db1
    name: Turla Group Named Pipes
    reason: Turla backdoors communicate via named pipes; co-occurring pipe creation confirms the implant is running.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service registry ImagePath set for WerFaultSvc
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*WerFaultSvc*
    pivot_on:
    - host
    window: 2h
  - name: Fake WerFault/Wer binaries or PNG/DLL dropped outside System32
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*[Ww]er[Ff]ault* OR data_win_eventdata_targetFilename:*.png) AND NOT data_win_eventdata_targetFilename:*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss]ystem32*
    pivot_on:
    - host
    window: 4h
  - name: WerFault-named process or svchost child running from unusual path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*[Ww]er[Ff]ault* OR data_win_eventdata_parentCommandLine:*WerFaultSvc*) AND NOT data_win_eventdata_image:*[Ss]ystem32*
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections from WerFault-named or unsigned service process
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:*[Ww]er[Ff]ault* OR data_win_eventdata_image:*[Pp]rogram[Dd]ata*) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Named pipe creation by suspicious service payload
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_image:*[Ww]er[Ff]ault* OR data_win_eventdata_image:*[Pp]rogram[Dd]ata* OR data_win_eventdata_image:*[Tt]emp*)
    pivot_on:
    - host
    window: 4h
