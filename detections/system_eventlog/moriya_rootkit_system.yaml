name: Moriya Rootkit - System
id: 25b9c01c-350d-4b95-bed1-836d04a4f324
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 25b9c01c-350d-4b95-bed1-836d04a4f324
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Moriya rootkit as described in the securelist's Operation
  TunnelSnake report. MITRE ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - term:
            data_win_eventdata_serviceName:
              value: "ZzNetSvc"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'ZzNetSvc'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/operation-tunnelsnake-and-moriya-rootkit/101831
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Moriya Rootkit - System detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1543.003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - moriya
    - rootkit
    - system
    - windows_system
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_serviceName:/[Zz][Zz][Nn][Ee][Tt][Ss][Vv][Cc]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5e993621-67d4-488a-b9ae-b420d08b96cb
    name: Service Installation in Suspicious Folder
    reason: Moriya's ZzNetSvc is a 7045 service whose driver is dropped to a writable path; the same 7045 event with a suspicious ImagePath folder is the generic form of this install.
  - id: 26481afe-db26-4228-b264-25a29fe6efc7
    name: Uncommon Service Installation Image Path
    reason: Rootkit services register a .sys/odd ImagePath at the same 7045 moment; a hit here on the same host confirms a non-standard driver service.
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Operation TunnelSnake installed the rootkit on servers via remote execution; a remote client creating the service shows lateral deployment rather than local install.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: 'Precursor/co-occurring: attackers create the kernel driver service with sc.exe create type=kernel, which then surfaces as the 7045 ZzNetSvc event.'
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: 'Follow-on: once the service starts, the driver load (Sysmon EID 6) of the rootkit or a known-bad driver on the same host proves the kernel component actually loaded.'
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Moriya's .sys is staged by an earlier implant in a user-writable path before service creation; a driver loaded from temp on this host is the staging-to-load link.
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: Moriya operators pushed the rootkit and tooling between servers with remote service execution; PsExec 7045 events on the host or neighbours show the lateral path.
  - id: d7654f02-e04b-4934-9838-65c46f187ebc
    name: PUA- IOX Tunneling Tool Execution
    reason: Moriya's purpose is stealth C2 traffic interception, and the same campaign used proxy/tunnel tools (Termite, EarthWorm class) for pivoting; IOX is the closest co-occurring tunnelling tool.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel driver services and driver loads outside System32
    query: (data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*\.[Ss][Yy][Ss].*/) OR (data_win_system_eventID:"6" AND NOT data_win_eventdata_imageLoaded:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss].[Ss][Yy][Ss][Tt][Ee][Mm]32.*/)
    pivot_on:
    - host
    window: 6h
  - name: Remote service deployment (PsExec/ADMIN$/COMSPEC service images)
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/ OR data_win_eventdata_imagePath:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_imagePath:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/)
    pivot_on:
    - host
    window: 6h
  - name: Tunneling and proxy pivot tools (Termite, EarthWorm, iox, frp, chisel)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Ee][Ww]_[Ff][Oo][Rr]_[Ww][Ii][Nn]|[Tt][Ee][Rr][Mm][Ii][Tt][Ee]|[Ee][Aa][Rr][Tt][Hh][Ww][Oo][Rr][Mm]|[Ii][Oo][Xx]|[Ff][Rr][Pp][Cc]|[Cc][Hh][Ii][Ss][Ee][Ll]).*/ OR data_win_eventdata_commandLine:/.*([Ee][Ww]_[Ff][Oo][Rr]_[Ww][Ii][Nn]|[Rr][Cc][Ss][Oo][Cc][Kk][Ss]|[Rr][Ss][Ss][Oo][Cc][Kk][Ss]|[Ss][Ss][Oo][Cc][Kk][Ss][Dd]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Web-server spawned shells (China Chopper / webshell recon)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ww]3[Ww][Pp]|[Hh][Tt][Tt][Pp][Dd]|[Tt][Oo][Mm][Cc][Aa][Tt]|[Nn][Gg][Ii][Nn][Xx]|[Pp][Hh][Pp]-[Cc][Gg][Ii]).*/ AND data_win_eventdata_image:/.*([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]1?|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]).*/
    pivot_on:
    - host
    window: 24h
  - name: Log clearing and security service tampering on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* [Cc][Ll] .*/) OR (data_win_eventdata_image:/.*[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|[Cc][Oo][Nn][Ff][Ii][Gg]|[Dd][Ee][Ll][Ee][Tt][Ee]).*([Ss][Yy][Ss][Mm][Oo][Nn]|[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Ss][Ee][Nn][Ss][Ee]|[Ww][Aa][Zz][Uu][Hh]|[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]).*/))
    pivot_on:
    - host
    window: 4h
