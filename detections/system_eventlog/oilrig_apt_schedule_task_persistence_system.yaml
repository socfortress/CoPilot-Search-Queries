name: OilRig APT Schedule Task Persistence - System
id: 53ba33fd-3a50-4468-a5ef-c583635cfa92
version: 1
schema_version: "1.0"
date: "2023-03-08"
author: Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 53ba33fd-3a50-4468-a5ef-c583635cfa92
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects OilRig schedule task persistence as reported by Nyotron in their March
  2018 report. MITRE ATT&CK: T1053.005, T1543.003, T1112, T1071.004.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - term:
                  data_win_eventdata_serviceName:
                    value: "SC Scheduled Scan"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "UpdatMachine"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'SC Scheduled Scan', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20180402134442/https://nyotron.com/wp-content/uploads/2018/03/Nyotron-OilRig-Malware-Report-March-2018C.pdf
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1071/004/

response:
  message: >
    OilRig APT Schedule Task Persistence - System detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_serviceName: $data_win_eventdata_serviceName$.
    MITRE ATT&CK: T1053.005, T1543.003, T1112, T1071.004
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1543.003
    - T1112
    - T1071.004
  custom_tags:
    - oilrig
    - schedule
    - persistence
    - windows_system
    - privilege_escalation
    - execution
    - defense_impairment
    - g0049
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Ss][Cc] [Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd] [Ss][Cc][Aa][Nn]/ OR data_win_eventdata_serviceName:/[Uu][Pp][Dd][Aa][Tt][Mm][Aa][Cc][Hh][Ii][Nn][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: Same 7045 service-creation telemetry; a generic suspicious-service hit on the same host alongside the OilRig-named service shows the implant installed its own service payload.
  - id: 5e993621-67d4-488a-b9ae-b420d08b96cb
    name: Service Installation in Suspicious Folder
    reason: OilRig's rogue service binary typically sits in a user-writable or temp folder; this confirms the service image path was staged by the attacker.
  - id: 26481afe-db26-4228-b264-25a29fe6efc7
    name: Uncommon Service Installation Image Path
    reason: Flags the same 7045 event when the ImagePath is non-standard, corroborating that 'SC Scheduled Scan'/'UpdatMachine' is malware rather than a vendor service.
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Shows the service was created by an unexpected client process or remote install, revealing how the persistence was dropped.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: OilRig pairs the fake service with a SYSTEM scheduled task for redundant persistence; a schtasks /ru SYSTEM creation just before or after is the second persistence leg.
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: The scheduled task backing the persistence usually launches the implant from AppData, tying the task to the dropped payload.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: The OilRig report persistence set includes registry modification (T1112) for Run keys, a co-occurring persistence mechanism on the same host.
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: OilRig implants communicate over DNS tunneling (T1071.004); once persistence is in place, DNS tunneling tooling is the expected C2/exfil follow-on.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task creation by schtasks/at on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*(\/[Cc][Rr][Ee][Aa][Tt][Ee]|\/[Cc][Hh][Aa][Nn][Gg][Ee]).*/) OR data_win_system_eventID:"4698"
    pivot_on:
    - host
    window: 4h
  - name: Service creation via sc.exe or other 7045 services
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)
    pivot_on:
    - host
    window: 4h
  - name: Run key and service registry persistence writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: New executables dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\).*\.(exe|dll|ps1|vbs|bat)/
    pivot_on:
    - host
    window: 2h
  - name: DNS tunneling style queries from interpreters or odd processes
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
