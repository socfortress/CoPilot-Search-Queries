name: Eventlog Cleared
id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
version: 1
schema_version: "1.0"
date: "2023-11-15"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  One of the Windows Eventlogs has been cleared. e.g. caused by "wevtutil cl"
  command execution. MITRE ATT&CK: T1685.005.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "104"
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-Eventlog"
              case_insensitive: true
        - exists:
            field: "data_win_system_channel"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_system_channel:
                          value: "Microsoft-Windows-PowerShell/Operational"
                          case_insensitive: true
                    - term:
                        data_win_system_channel:
                          value: "Microsoft-Windows-Sysmon/Operational"
                          case_insensitive: true
                    - term:
                        data_win_system_channel:
                          value: "PowerShellCore/Operational"
                          case_insensitive: true
                    - term:
                        data_win_system_channel:
                          value: "Security"
                          case_insensitive: true
                    - term:
                        data_win_system_channel:
                          value: "System"
                          case_insensitive: true
                    - term:
                        data_win_system_channel:
                          value: "Windows PowerShell"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_system_channel

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '104';
  data_win_system_providerName equals 'Microsoft-Windows-Eventlog';
  data_win_system_channel equals 'Microsoft-Windows-PowerShell/Operational',
  among other conditions.

known_false_positives: >
  Rollout of log collection agents (the setup routine often includes a reset of
  the local Eventlog). System provisioning (system reset before the golden image
  creation). Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/deviouspolack/status/832535435960209408
  - https://www.hybrid-analysis.com/sample/027cc450ef5f8c5f653329641ec1fed91f694e0d229928963b30f6b0d7d3a745?environmentId=100
  - https://attack.mitre.org/techniques/T1685/005/

response:
  message: >
    Eventlog Cleared detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_system_channel: $data_win_system_channel$. MITRE ATT&CK: T1685.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_system_channel
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.005
  custom_tags:
    - eventlog
    - cleared
    - windows_system
    - defense_impairment
    - car_2016_04_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"104" AND data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]/ AND _exists_:data_win_system_channel AND NOT (data_win_system_channel:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\/[Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn][Aa][Ll]/ OR data_win_system_channel:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ss][Yy][Ss][Mm][Oo][Nn]\/[Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn][Aa][Ll]/ OR data_win_system_channel:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][Cc][Oo][Rr][Ee]\/[Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn][Aa][Ll]/ OR data_win_system_channel:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]/ OR data_win_system_channel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_system_channel:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: 'Same wevtutil tool: operator disabling channels (sl /e:false) alongside clearing (cl) is one anti-forensics sweep on the host.'
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Attackers weaken audit policy before or after wiping logs so new activity is never recorded.
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: ETW/logman trace tampering is the sibling telemetry-blinding step used with log clearing.
  - id: caf201a9-c2ce-4a26-9c3a-2b9525413711
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    reason: WMI Win32_NTEventlogFile ClearEventLog is an alternate method of clearing logs without wevtutil.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Ransomware/destructive operators clear logs and delete shadow copies together before encryption.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup destruction co-occurs with log wiping as impact-stage cleanup preceding or following encryption.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Defense impairment chain: AV disabled just before malicious activity, logs cleared afterwards to hide it.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Credential dumping is a typical action whose traces an intruder then erases by clearing logs.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wevtutil / Clear-EventLog / wmic log-clearing commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*( cl|clear-log|sl ).*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Nn][Tt][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*[Cc][Ll][Ee][Aa][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Security log cleared (1102) and audit policy change (4719)
    query: data_win_system_eventID:("1102" OR "4719")
    pivot_on:
    - host
    window: 4h
  - name: Auditpol, logman and ETW tampering commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Mm][Aa][Nn].*(stop|delete|update).*/ OR data_win_eventdata_commandLine:/.*[Ee][Tt][Ww][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Shadow copy / backup deletion and recovery inhibition
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)
    pivot_on:
    - host
    window: 4h
  - name: Defender disable / exclusion changes preceding log wipe
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/)
    pivot_on:
    - host
    window: 6h
