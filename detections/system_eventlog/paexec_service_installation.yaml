name: PAExec Service Installation
id: de7ce410-b3fb-4e8a-b38c-3b999e2c3420
version: 1
schema_version: "1.0"
date: "2022-10-26"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: de7ce410-b3fb-4e8a-b38c-3b999e2c3420
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PAExec service installation. MITRE ATT&CK: T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "PAExec-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "C:\\\\WINDOWS\\\\PAExec-*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName matches
  'PAExec-*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.poweradmin.com/paexec/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PAExec Service Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - paexec
    - service
    - installation
    - windows_system
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Pp][Aa][Ee][Xx][Ee][Cc]-.*/ OR data_win_eventdata_imagePath:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Aa][Ee][Xx][Ee][Cc]-.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f6451de4-df0a-41fa-8d72-b39f54a08db5
    name: PUA - PAExec Default Named Pipe
    reason: PAExec creates its default named pipe right after the PAExec-* service starts on the target; same tool, same remote execution session
  - id: c4e49831-1496-40cf-8ce1-b53f942b02f9
    name: Renamed PAExec Execution
    reason: The PAExec-* service launches the PAExec binary on the host; a renamed copy confirms evasion and execution following installation
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Remote service creation is done over the svcctl pipe via SMB; this is the network-side precursor of the 7045 event
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: PAExec copies its executable to ADMIN$ (C:\Windows\PAExec-*) before the service is installed; the file drop precedes the 7045
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: 'Same service installation seen from the logon side: identifies the remote client/account that installed the service'
  - id: a27e5fa9-c35e-4e3d-b7e0-1ce2af66ad12
    name: CSExec Service Installation
    reason: Sibling PsExec-style tool; operators who use PAExec often also use CSExec or PsExec on other hosts in the same lateral movement sweep
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Alternative SMB PsExec-style service installation that co-occurs when the attacker tries multiple remote exec tools
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Related remote service execution behaviour; PAExec is a PsExec clone and the resulting service runs commands the same way
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PAExec-spawned child processes (service parent or PAExec image)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Pp][Aa][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_image:/.*[Pp][Aa][Ee][Xx][Ee][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: PAExec named pipe and file artefacts
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*[Pp][Aa][Ee][Xx][Ee][Cc].*/
    pivot_on:
    - host
    window: 2h
  - name: PAExec binary dropped to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Pp][Aa][Ee][Xx][Ee][Cc].*/
    pivot_on:
    - host
    window: 2h
  - name: Network (type 3) logons preceding remote service install
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:*$
    pivot_on:
    - host
    window: 1h
  - name: Admin share access (ADMIN$/C$/IPC$) from remote source
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*(ADMIN|C|IPC)\$.*/
    pivot_on:
    - host
    window: 1h
