name: Invoke-Obfuscation RUNDLL LAUNCHER - System
id: 11b52f18-aaec-4d60-9143-5dd8cc4706b9
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 11b52f18-aaec-4d60-9143-5dd8cc4706b9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via RUNDLL LAUNCHER. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*rundll32.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*shell32.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*shellexec_rundll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*powershell*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*rundll32.exe*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation RUNDLL LAUNCHER - System detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE
    ATT&CK: T1027, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - rundll
    - windows_system
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_imagePath:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_imagePath:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND data_win_eventdata_imagePath:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 641a4bfb-c017-44f7-800c-2aee0184ce9b
    name: Invoke-Obfuscation Via Use Rundll32 - System
    reason: Sibling Invoke-Obfuscation Rundll32 launcher variant also registered as a 7045 service; same tooling run with a different obfuscation flavour confirms an obfuscation framework in use.
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: The alert is itself a 7045 service install whose ImagePath launches PowerShell; a generic suspicious service-install hit on the same host corroborates service-based execution.
  - id: 70f00d10-60b2-4f34-b9a0-dc3df3fe762a
    name: Suspicious Service Installation Script
    reason: Service whose image path is a script/interpreter command line, the same service-as-launcher technique used here.
  - id: a2e5019d-a658-4c6a-92bf-7197b54e2cae
    name: PowerShell Scripts Installed as Services
    reason: 'Direct overlap: a service created to run PowerShell, as in the rundll32 shell32 ShellExec_RunDLL powershell launcher.'
  - id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
    reason: Service-installed PowerShell/rundll32 launchers are a common getsystem/SYSTEM-privilege step; indicates the service was used for privilege escalation by a C2 framework.
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: Cobalt Strike psexec/jump-psexec payloads install services with PowerShell command lines; follow-on or look-alike service install on the host.
  - id: e6cb92b4-b470-4eb8-8a9d-d63e8583aae0
    name: Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell
    reason: Same launcher seen at execution time in script block logging (4104), showing the obfuscated payload that the service ran.
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: Remote service creation via PsExec is the typical delivery path for an obfuscated launcher service, so lateral movement origin may be shown here.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell/rundll32 children of services.exe or services-run processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Obfuscated or encoded PowerShell command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*ShellExec_RunDLL* OR *-enc* OR *-EncodedCommand* OR *FromBase64String* OR *-nop* OR *-w\ hidden* OR *IEX*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network from PowerShell or rundll32
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Executables or scripts dropped before service install
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/)
    pivot_on:
    - host
    window: 1h
  - name: Service creation via sc.exe or remote logon preceding service
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee].*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3")
    pivot_on:
    - host
    window: 1h
