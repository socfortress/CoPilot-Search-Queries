name: Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION - System
id: 14bcba49-a428-42d9-b943-e2ce0f0f7ae6
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 14bcba49-a428-42d9-b943-e2ce0f0f7ae6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via VAR++ LAUNCHER. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*&&set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*cmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*/c*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*-f*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath: "*{0}*"
              - wildcard:
                  data_win_eventdata_imagePath: "*{1}*"
              - wildcard:
                  data_win_eventdata_imagePath: "*{2}*"
              - wildcard:
                  data_win_eventdata_imagePath: "*{3}*"
              - wildcard:
                  data_win_eventdata_imagePath: "*{4}*"
              - wildcard:
                  data_win_eventdata_imagePath: "*{5}*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*&&set*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION - System detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_imagePath:
    $data_win_eventdata_imagePath$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - launcher
    - windows_system
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*\&\&[Ss][Ee][Tt].*/ AND data_win_eventdata_imagePath:/.*[Cc][Mm][Dd].*/ AND data_win_eventdata_imagePath:/.*\/[Cc].*/ AND data_win_eventdata_imagePath:/.*-[Ff].*/ AND (data_win_eventdata_imagePath:/.*\{0\}.*/ OR data_win_eventdata_imagePath:/.*\{1\}.*/ OR data_win_eventdata_imagePath:/.*\{2\}.*/ OR data_win_eventdata_imagePath:/.*\{3\}.*/ OR data_win_eventdata_imagePath:/.*\{4\}.*/ OR data_win_eventdata_imagePath:/.*\{5\}.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e9f55347-2928-4c06-88e5-1a7f8169942e
    name: Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION
    reason: 'Same VAR++ launcher string seen as a process-creation command line: the service ImagePath is executed by services.exe as cmd /c, so this is the runtime twin of the 7045 service install'
  - id: 52a85084-6989-40c3-8f32-091e12e13f09
    name: smbexec.py Service Installation
    reason: Impacket smbexec installs a throwaway service whose ImagePath is a cmd /c ... payload; an obfuscated cmd /c service ImagePath is the same remote-execution-by-service mechanism
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: PsExec-style remote execution also surfaces as a 7045 service install; confirms the VAR++ service came from lateral movement tooling rather than a local one-off
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: Cobalt Strike psexec/jump and getsystem create 7045 services with cmd/powershell ImagePath; co-occurring on the host points to a C2 framework deploying the obfuscated launcher
  - id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
    reason: Named-pipe getsystem privilege escalation installs a cmd /c service the same way; an obfuscated launcher service may be the escalation or staging step
  - id: 70f00d10-60b2-4f34-b9a0-dc3df3fe762a
    name: Suspicious Service Installation Script
    reason: Service ImagePath invoking script interpreters/command shells is the generic form of this detection; corroborates malicious service creation on the same host
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Shows whether the 7045 service was pushed remotely by an unusual client over RPC/SMB, distinguishing lateral movement from local persistence
  - id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
    name: Remote Service Activity via SVCCTL Named Pipe
    reason: Remote service creation requires SVCCTL over SMB; a hit just before the 7045 event proves the service was created from another machine
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Command shells/PowerShell spawned by services.exe (service-launched payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: VAR++ / format-operator obfuscated command lines on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\&\&[Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*\{[0-9]\}.*/ AND data_win_eventdata_commandLine:/.*-[Ff].*/
    pivot_on:
    - host
    window: 2h
  - name: Remote-exec and C2 named pipes created (PsExec, RemCom, CSExec, Cobalt Strike)
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/ OR data_win_eventdata_pipeName:/.*[Rr][Ee][Mm][Cc][Oo][Mm].*/ OR data_win_eventdata_pipeName:/.*[Cc][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_pipeName:/.*[Pp][Aa][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_pipeName:/.*[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/.*[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/.*[Mm][Ss][Ss][Ee]-.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from PowerShell/cmd on this host (payload staging or C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: LSASS process access following the launcher (credential theft)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
