name: Service Installation with Suspicious Folder Pattern
id: 1b2ae822-6fe1-43ba-aa7c-d1a3b3d1d5f2
version: 1
schema_version: "1.0"
date: "2022-03-24"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1b2ae822-6fe1-43ba-aa7c-d1a3b3d1d5f2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service installation with suspicious folder patterns. MITRE ATT&CK:
  T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - regexp:
                  data_win_eventdata_imagePath: "([Cc]:\\\\[Pp]rogram[Dd]ata\\\\.{1,9}\\.exe).*"
              - regexp:
                  data_win_eventdata_imagePath: "([Cc]:\\\\.{1,9}\\.exe).*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  the regex /([Cc]:\\[Pp]rogram[Dd]ata\\.{1,9}\.exe).*/, among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Service Installation with Suspicious Folder Pattern detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_imagePath:
    $data_win_eventdata_imagePath$. MITRE ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - service
    - installation
    - folder
    - windows_system
    - persistence
    - privilege_escalation
    - car_2013_09_005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/([Cc]:\\[Pp]rogram[Dd]ata\\.{1,9}\.exe).*/ OR data_win_eventdata_imagePath:/([Cc]:\\.{1,9}\.exe).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5e993621-67d4-488a-b9ae-b420d08b96cb
    name: Service Installation in Suspicious Folder
    reason: Same 7045 event from a sibling image-path check (Temp/AppData/Users/Public); a co-firing hit confirms the service binary sits in an attacker-writable staging path rather than a one-off path quirk.
  - id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
    reason: Short-name binaries at C:\ root or ProgramData are the classic getsystem/named-pipe SYSTEM escalation service; confirms the install was a privilege-escalation primitive.
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: A PSEXESVC-style service dropped to a root/ProgramData exe is the lateral-movement flavour of this same 7045 event; distinguishes remote execution from local persistence.
  - id: 52a85084-6989-40c3-8f32-091e12e13f09
    name: smbexec.py Service Installation
    reason: Impacket smbexec creates a transient service with a short random-named binary path; overlap with this rule points to remote SMB-driven execution.
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Offensive tooling registered as a service from a short path (Mimikatz, Impacket, Metasploit services); a precursor/co-occurrence that names the tool behind the install.
  - id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
    name: Credential Dumping Tools Service Execution - System
    reason: A service running from an obscure path is a common vehicle for SYSTEM-level credential dumpers (wce, fgdump, cachedump); likely follow-on objective after the service starts.
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Identifies the installing client/account for the 7045; an unusual client plus a short-path binary indicates remote installation instead of local software setup.
  - id: 8c3c76ca-8f8b-4b1d-aaf3-81aebcd367c9
    name: Creation Exe for Service with Unquoted Path
    reason: Binary dropped into C:\ root or a path-hijack location just before service registration; the file-creation precursor to the 7045 event.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executable dropped to C:\ root or ProgramData before service install
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/[Cc]:\\.{1,9}\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp]rogram[Dd]ata\\.{1,9}\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Service created or reconfigured via sc.exe / PowerShell / reg on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*[Cc][Rr][Ee][Aa][Tt][Ee]* OR data_win_eventdata_commandLine:*[Bb][Ii][Nn][Pp][Aa][Tt][Hh]* OR data_win_eventdata_commandLine:*[Cc][Oo][Nn][Ff][Ii][Gg]*)) OR data_win_eventdata_commandLine:*[Nn]ew-[Ss]ervice* OR data_win_eventdata_commandLine:/.*[Cc]urrent[Cc]ontrol[Ss]et.*[Ss]ervices.*[Ii]mage[Pp]ath.*/)
    pivot_on:
    - host
    window: 2h
  - name: Processes launched by services.exe from root or ProgramData short-name binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss]ervices\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/[Cc]:\\.{1,9}\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp]rogram[Dd]ata\\.{1,9}\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: SYSTEM-context child shells and recon spawned by the service binary
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/[Cc]:\\.{1,9}\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/[Cc]:\\[Pp]rogram[Dd]ata\\.{1,9}\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|whoami|net|net1|nltest|tasklist|reg|wmic)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Network connections from the dropped service binary
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/[Cc]:\\.{1,9}\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp]rogram[Dd]ata\\.{1,9}\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
