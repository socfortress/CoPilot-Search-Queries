name: Remote Access Tool Services Have Been Installed - System
id: 1a31b18a-f00c-4061-9900-f735b96c99fc
version: 1
schema_version: "1.0"
date: "2023-06-22"
author: Connor Martin, Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1a31b18a-f00c-4061-9900-f735b96c99fc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service installation of different remote access tools software. These
  software are often abused by threat actors to perform. MITRE ATT&CK:
  T1543.003, T1569.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_system_eventID: "7045"
              - term:
                  data_win_system_eventID: "7036"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*AmmyyAdmin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Atera*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*BASupportExpressSrvcUpdater*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*BASupportExpressStandaloneService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*chromoting*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*GoToAssist*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*GoToMyPC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*jumpcloud*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*LMIGuardianSvc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*LogMeIn*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*monblanking*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Parsec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RManService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RPCPerformanceService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*RPCService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*SplashtopRemoteService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*SSUService*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*TeamViewer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*TightVNC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*vncserver*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_serviceName:
                    value: "*Zoho*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_system_eventID equals '7036',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/misbehaving-rats/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Remote Access Tool Services Have Been Installed - System detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_serviceName:
    $data_win_eventdata_serviceName$. MITRE ATT&CK: T1543.003, T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
    - T1569.002
  custom_tags:
    - services
    - installed
    - system
    - windows_system
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND (data_win_system_eventID:"7045" OR data_win_system_eventID:"7036") AND (data_win_eventdata_serviceName:/.*[Aa][Mm][Mm][Yy][Yy][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_serviceName:/.*[Aa][Tt][Ee][Rr][Aa].*/ OR data_win_eventdata_serviceName:/.*[Bb][Aa][Ss][Uu][Pp][Pp][Oo][Rr][Tt][Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ss][Rr][Vv][Cc][Uu][Pp][Dd][Aa][Tt][Ee][Rr].*/ OR data_win_eventdata_serviceName:/.*[Bb][Aa][Ss][Uu][Pp][Pp][Oo][Rr][Tt][Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ss][Tt][Aa][Nn][Dd][Aa][Ll][Oo][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Cc][Hh][Rr][Oo][Mm][Oo][Tt][Ii][Nn][Gg].*/ OR data_win_eventdata_serviceName:/.*[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt].*/ OR data_win_eventdata_serviceName:/.*[Gg][Oo][Tt][Oo][Mm][Yy][Pp][Cc].*/ OR data_win_eventdata_serviceName:/.*[Jj][Uu][Mm][Pp][Cc][Ll][Oo][Uu][Dd].*/ OR data_win_eventdata_serviceName:/.*[Ll][Mm][Ii][Gg][Uu][Aa][Rr][Dd][Ii][Aa][Nn][Ss][Vv][Cc].*/ OR data_win_eventdata_serviceName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn].*/ OR data_win_eventdata_serviceName:/.*[Mm][Oo][Nn][Bb][Ll][Aa][Nn][Kk][Ii][Nn][Gg].*/ OR data_win_eventdata_serviceName:/.*[Pp][Aa][Rr][Ss][Ee][Cc].*/ OR data_win_eventdata_serviceName:/.*[Rr][Mm][Aa][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Rr][Pp][Cc][Pp][Ee][Rr][Ff][Oo][Rr][Mm][Aa][Nn][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Rr][Pp][Cc][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp][Rr][Ee][Mm][Oo][Tt][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Ss][Ss][Uu][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_serviceName:/.*[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr].*/ OR data_win_eventdata_serviceName:/.*[Tt][Ii][Gg][Hh][Tt][Vv][Nn][Cc].*/ OR data_win_eventdata_serviceName:/.*[Vv][Nn][Cc][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_serviceName:/.*[Zz][Oo][Hh][Oo].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: Atera is one of the services this rule matches; the Application-log MSI install record confirms the same RMM agent landed and shows the installer context.
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: Silent CLI install of AnyDesk is the process-level precursor that produces the service install seen here, indicating scripted or hands-on-keyboard deployment.
  - id: 75bfe6e6-cd8e-429e-91d3-03921e1d7962
    name: Remote Access Tool - ScreenConnect Installation Execution
    reason: ScreenConnect client install is the process-creation counterpart of a ScreenConnect service install and often exposes the attacker relay URL.
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Atera, Splashtop, ScreenConnect and Zoho agents deploy via msiexec /quiet; this is the precursor that lands the service.
  - id: 8150732a-0c9d-4a99-82b9-9efb9b90c40c
    name: Suspicious Msiexec Quiet Install From Remote Location
    reason: RMM installer pulled straight from a remote URL/share by msiexec points to attacker staging rather than IT deployment.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: After installing a remote access service, actors open inbound firewall rules so the tool or RDP is reachable.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Actors pair a new RAT service with a backdoor local account for fallback access, a common follow-on to persistence installs.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender is often disabled just before or after dropping a RAT/RMM to keep the agent from being quarantined.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Silent installer of a remote access tool
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm][Ss][Ii][Ee][Xx][Ee][Cc]|[Ss][Ee][Tt][Uu][Pp]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll]).*/ AND data_win_eventdata_commandLine:/.*([Qq][Uu][Ii][Ee][Tt]|\/[Qq]|[Ss][Ii][Ll][Ee][Nn][Tt]).*/ AND data_win_eventdata_commandLine:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Aa][Tt][Ee][Rr][Aa]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Rr][Mm][Aa][Nn]|[Zz][Oo][Hh][Oo]|[Tt][Ii][Gg][Hh][Tt][Vv][Nn][Cc]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]).*/
    pivot_on:
    - host
    window: 2h
  - name: Remote access tool DNS and network contact
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:(*anydesk* OR *teamviewer* OR *screenconnect* OR *atera* OR *splashtop* OR *logmein* OR *gotoassist* OR *zoho*)) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:(*anydesk* OR *teamviewer* OR *screenconnect* OR *ateraagent* OR *splashtop* OR *winvnc* OR *tvnserver* OR *rutserv*))
    pivot_on:
    - host
    window: 2h
  - name: Firewall opening, RDP enablement or local account creation
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]|[Ss][Ee][Tt]).*[Rr][Uu][Ll][Ee].*/) OR (data_win_eventdata_image:/.*\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]?.*\/[Aa][Dd][Dd]).*/) OR data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering around RAT install
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee]).*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote logons on host after RAT install
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"7")) OR data_win_system_eventID:"4648"
    pivot_on:
    - host
    window: 2h
