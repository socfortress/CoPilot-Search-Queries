name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
version: 1
schema_version: "1.0"
date: "2023-11-15"
author: Teymur Kheirkhabarov, Ecco, Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of getsystem Meterpreter/Cobalt Strike command by detecting a
  specific service installation. MITRE ATT&CK: T1134.001, T1134.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*/c*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*echo*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*\\\\pipe\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "*cmd*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imagePath:
                                value: "*%COMSPEC%*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*rundll32*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*.dll,a*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*/p:*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "\\\\\\\\127.0.0.1\\\\ADMIN$\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*/c*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
  - https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
  - https://attack.mitre.org/techniques/T1134/001/
  - https://attack.mitre.org/techniques/T1134/002/

response:
  message: >
    Meterpreter or Cobalt Strike Getsystem Service Installation - System
    detected on host $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_imagePath:
    $data_win_eventdata_imagePath$. MITRE ATT&CK: T1134.001, T1134.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.001
    - T1134.002
  custom_tags:
    - meterpreter
    - cobalt
    - strike
    - windows_system
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND ((data_win_eventdata_imagePath:/.*\/[Cc].*/ AND data_win_eventdata_imagePath:/.*[Ee][Cc][Hh][Oo].*/ AND data_win_eventdata_imagePath:/.*\\[Pp][Ii][Pp][Ee]\\.*/ AND (data_win_eventdata_imagePath:/.*[Cc][Mm][Dd].*/ OR data_win_eventdata_imagePath:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/)) OR (data_win_eventdata_imagePath:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_imagePath:/.*\.[Dd][Ll][Ll],[Aa].*/ AND data_win_eventdata_imagePath:/.*\/[Pp]:.*/) OR data_win_eventdata_imagePath:/\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: Same getsystem service install seen as Security 4697; confirms the 7045 and shows the installing account/logon session.
  - id: 5a105d34-05fc-401e-8553-272b45c1522d
    name: CobaltStrike Service Installations - System
    reason: Same operator typically installs other Cobalt Strike service-exec payloads (jump psexec) via 7045 on this host.
  - id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
    name: Potential CobaltStrike Service Installations - Registry
    reason: Sysmon registry view of the same service creation (ImagePath written under Services key) corroborating the SCM event.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: The getsystem service's cmd echo to a named pipe is pipe impersonation; this catches the process-creation side of the same technique.
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: Beacon default pipes are created by the SYSTEM beacon right after getsystem succeeds.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Process-creation signature of the same framework (cmd echo pipe / getsystem patterns), co-occurring on the host.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: SYSTEM token is what the operator needs to dump LSASS; credential access is the usual immediate follow-on to getsystem.
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Related Metasploit service-install tradecraft; distinguishes local getsystem from remote psexec lateral movement from the same toolkit.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Named pipes created around getsystem (Beacon/Meterpreter pipes)
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*(msagent_|postex_|status_|MSSE-|isapi_http|ntsvcs_).*/ OR data_win_eventdata_image:/.*\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: cmd/rundll32/powershell spawned by services.exe (SYSTEM service payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*[Ee][Cc][Hh][Oo].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS access and credential dumping after SYSTEM elevation
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Remote-thread / injection into SYSTEM processes
    query: data_win_system_eventID:"8" OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\([Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ss][Pp][Oo][Oo][Ll][Ss][Vv])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Persistence and lateral movement from the elevated session
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Ss][Cc]\.[Ee][Xx][Ee] [Cc][Rr][Ee][Aa][Tt][Ee]|[Nn][Ee][Tt] [Uu][Ss][Ee]|[Rr][Ee][Gg] [Aa][Dd][Dd]).*/) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"5985"))
    pivot_on:
    - host
    window: 2h
