name: Turla Service Install
id: 1df8b3da-b0ac-4d8a-b7c7-6cb7c24160e4
version: 1
schema_version: "1.0"
date: "2021-11-30"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1df8b3da-b0ac-4d8a-b7c7-6cb7c24160e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This method detects a service install of malicious services mentioned in
  Carbon Paper - Turla report by ESET. MITRE ATT&CK: T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - term:
                  data_win_eventdata_serviceName:
                    value: "srservice"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "ipvpn"
                    case_insensitive: true
              - term:
                  data_win_eventdata_serviceName:
                    value: "hkmsvc"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'srservice', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.welivesecurity.com/2017/03/30/carbon-paper-peering-turlas-second-stage-backdoor/
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Turla Service Install detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - turla
    - service
    - install
    - windows_system
    - privilege_escalation
    - persistence
    - g0010
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/[Ss][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_serviceName:/[Ii][Pp][Vv][Pp][Nn]/ OR data_win_eventdata_serviceName:/[Hh][Kk][Mm][Ss][Vv][Cc]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 739915e4-1e70-4778-8b8a-17db02f66db1
    name: Turla Group Named Pipes
    reason: Carbon/Turla second-stage backdoor components talk over named pipes; pipe creation right after the service installs confirms the implant is running.
  - id: 9e2e51c5-c699-4794-ba5a-29f5da40ac0c
    name: Turla Group Commands May 2020
    reason: Same actor's post-compromise discovery/staging commands; follow-on hands-on activity once Carbon service persistence is in place.
  - id: c601f20d-570a-4cde-a7d6-e17f99cb8e7f
    name: Turla Group Lateral Movement
    reason: Turla uses the foothold to spread laterally; fires when the implant host is used to pivot to other systems.
  - id: c4e92a97-a9ff-4392-9d2d-7a4c642768ca
    name: Service Installed By Unusual Client - Security
    reason: Same service creation seen in the Security log (4697) on the host; reveals the installing logon/client, e.g. remote SMB install versus local dropper.
  - id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
    name: Credential Dumping Tools Service Execution - System
    reason: 'Typical next step after persistence: credential theft tools run as services to harvest creds for lateral movement.'
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Co-occurring malicious service registrations on the same host indicate a broader toolkit being deployed, not an isolated Carbon service.
  - id: cb062102-587e-4414-8efa-dbe3c7bf19c6
    name: CosmicDuke Service Installation
    reason: Another APT backdoor persisting as a Windows service; same mechanism and often paired nation-state tooling on a compromised host.
  - id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
    name: Potential CobaltStrike Service Installations - Registry
    reason: Service key registry writes capture the same malicious service creation at registry level and expose the ImagePath of the dropped binary.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service created via sc.exe or registry for srservice/ipvpn/hkmsvc
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*srservice* OR data_win_eventdata_commandLine:*ipvpn* OR data_win_eventdata_commandLine:*hkmsvc*)) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:*srservice* OR data_win_eventdata_targetObject:*ipvpn* OR data_win_eventdata_targetObject:*hkmsvc*))
    pivot_on:
    - host
    window: 2h
  - name: Carbon service binary or DLL dropped to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*srservice* OR data_win_eventdata_targetFilename:*ipvpn* OR data_win_eventdata_targetFilename:*hkmsvc* OR (data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss].[Ss][Yy][Ss][Tt][Ee][Mm]32.*\.[Dd][Ll][Ll]/ AND data_win_eventdata_image:/.*(cmd|powershell|wscript|rundll32)\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: Implant outbound connections (C2 beaconing) from service-related processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:*srservice* OR data_win_eventdata_image:*ipvpn* OR data_win_eventdata_image:*hkmsvc* OR data_win_eventdata_image:/.*(svchost|rundll32)\.[Ee][Xx][Ee]/) AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*)/
    pivot_on:
    - host
    window: 4h
  - name: Turla/Carbon named pipes and admin-share lateral movement
    query: (data_win_system_eventID:("17" OR "18") AND (data_win_eventdata_pipeName:*atctl* OR data_win_eventdata_pipeName:*userpipe* OR data_win_eventdata_pipeName:*iehelper* OR data_win_eventdata_pipeName:*sdlrpc* OR data_win_eventdata_pipeName:*comnap*)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*net\ use* OR data_win_eventdata_commandLine:*admin$* OR data_win_eventdata_commandLine:*tasklist\ \/v*))
    pivot_on:
    - host
    window: 4h
  - name: Credential access and discovery after service persistence
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(cmd|powershell|net|net1|whoami|nslookup)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
