name: Service Installation in Suspicious Folder
id: 5e993621-67d4-488a-b9ae-b420d08b96cb
version: 1
schema_version: "1.0"
date: "2024-01-18"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5e993621-67d4-488a-b9ae-b420d08b96cb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service installation in suspicious folder appdata. MITRE ATT&CK:
  T1543.003.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\AppData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imagePath: "*\\\\\\\\127.0.0.1*"
              - wildcard:
                  data_win_eventdata_imagePath:
                    value: "*\\\\\\\\localhost*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_serviceName"
        - exists:
            field: "data_win_eventdata_imagePath"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_serviceName:
                          value: "Zoom Sharing Service"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imagePath:
                          value: "*:\\\\Program Files\\\\Common Files\\\\Zoom\\\\Support\\\\CptService.exe*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_imagePath
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_imagePath matches
  '*\AppData\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Service Installation in Suspicious Folder detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_imagePath: $data_win_eventdata_imagePath$. MITRE
    ATT&CK: T1543.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_imagePath
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - service
    - installation
    - folder
    - windows_system
    - persistence
    - privilege_escalation
    - car_2013_09_005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND (data_win_eventdata_imagePath:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imagePath:/.*\\\\127\.0\.0\.1.*/ OR data_win_eventdata_imagePath:/.*\\\\[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt].*/) AND _exists_:data_win_eventdata_serviceName AND _exists_:data_win_eventdata_imagePath AND NOT (data_win_eventdata_serviceName:/[Zz][Oo][Oo][Mm] [Ss][Hh][Aa][Rr][Ii][Nn][Gg] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ AND data_win_eventdata_imagePath:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Zz][Oo][Oo][Mm]\\[Ss][Uu][Pp][Pp][Oo][Rr][Tt]\\[Cc][Pp][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1b2ae822-6fe1-43ba-aa7c-d1a3b3d1d5f2
    name: Service Installation with Suspicious Folder Pattern
    reason: Sibling 7045 detection for other staging paths (Temp, ProgramData, Public); together they show the same service binary dropped outside normal install locations.
  - id: 1d61f71d-59d2-479e-9562-4ff5f4ead16b
    name: Suspicious Service Installation
    reason: Same 7045 event with suspicious service names/ImagePath content; indicates the AppData service is a malicious implant rather than a per-user app updater.
  - id: 26481afe-db26-4228-b264-25a29fe6efc7
    name: Uncommon Service Installation Image Path
    reason: Same event, different ImagePath anomaly (non-standard or unquoted path); co-fires when the attacker service is crudely registered.
  - id: 71c276aa-49cd-43d2-b920-2dcd3e6962d5
    name: Service Installed By Unusual Client - System
    reason: Identifies the client that registered the service, separating local persistence from remote installation (PsExec-style lateral movement).
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The sc.exe/New-Service process-creation side of the same registration, giving parent process and command line behind the 7045.
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: Process-creation view of a service whose binary lives in a user-writable directory, confirming the service launched from that folder.
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Offensive tooling (PsExec-like, Impacket, Meterpreter) registers services that can land in AppData; confirms attacker tooling.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Attackers often add a second persistence mechanism (Run key) pointing at the same user-writable payload as the service.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executable or DLL written to AppData (service payload drop)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Yy][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Service created or reconfigured via sc.exe / PowerShell pointing at user paths
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(create|config).*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/) OR data_win_eventdata_commandLine:/.*([Nn]ew-[Ss]ervice|[Ss]et-[Ss]ervice).*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Process launched by services.exe from AppData
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connection or DNS from AppData binary (C2 beacon)
    query: ((data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ AND data_win_eventdata_initiated:"true") OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/))
    pivot_on:
    - host
    window: 4h
  - name: 'Additional persistence: Run keys and scheduled tasks to user paths'
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND data_win_eventdata_details:/.*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 4h
