name: NTLMv1 Logon Between Client and Server
id: e9d4ab66-a532-4ef7-a502-66a9e4a34f5d
version: 1
schema_version: "1.0"
date: "2023-06-06"
author: Tim Shelton, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e9d4ab66-a532-4ef7-a502-66a9e4a34f5d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the reporting of NTLMv1 being used between a client and server. NTLMv1
  is insecure as the underlying encryption algorithms can be brute-forced by
  modern hardware. MITRE ATT&CK: T1550.002.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "LsaSrv"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_system_eventID: "6038"
              - term:
                  data_win_system_eventID: "6039"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'LsaSrv';
  data_win_system_eventID equals '6038'; data_win_system_eventID equals '6039'.

known_false_positives: >
  Environments that use NTLMv1. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/nasbench/EVTX-ETW-Resources/blob/f1b010ce0ee1b71e3024180de1a3e67f99701fe4/ETWProvidersManifests/Windows10/22H2/W10_22H2_Pro_20230321_19045.2728/WEPExplorer/LsaSrv.xml
  - https://attack.mitre.org/techniques/T1550/002/

response:
  message: >
    NTLMv1 Logon Between Client and Server detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$. MITRE
    ATT&CK: T1550.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1550.002
  custom_tags:
    - ntlmv1
    - logon
    - between
    - windows_system
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ll][Ss][Aa][Ss][Rr][Vv]/ AND (data_win_system_eventID:"6038" OR data_win_system_eventID:"6039")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
    name: NetNTLM Downgrade Attack - Registry
    reason: 'Precursor: LmCompatibilityLevel/NtlmMinClientSec lowered on the host is what lets NTLMv1 be negotiated at all, so a registry downgrade just before LsaSrv 6038/6039 means the NTLMv1 use was engineered.'
  - id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
    name: NetNTLM Downgrade Attack
    reason: Security-log variant of the same downgrade (registry value set via 4657); confirms the host was deliberately weakened to NTLMv1 before the authentication.
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: NTLMv1 challenge/response captured from a rogue SMB/NTLM server (Responder, ntlmrelayx, Inveigh) is crackable to the NT hash; tool execution on the same or nearby host is the likely cause.
  - id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
    name: Possible PetitPotam Coerce Authentication Attempt
    reason: Coercion over MS-EFSR forces a machine account to authenticate to an attacker server, producing exactly this kind of unexpected NTLM logon, which is then relayed or cracked.
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: Spooler coercion (PrinterBug) triggers outbound NTLM auth from a server to an attacker host; the NTLMv1 logon can be its victim-side artifact.
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: Certutil fetching a UNC/remote path forces an outbound NTLM authentication; a downgraded-NTLM logon right after points to credential capture.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'Follow-on: once the NT hash is cracked or replayed from the NTLMv1 exchange, the attacker authenticates elsewhere with NTLM network logons (4624 type 3) using the hash.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Alternate source of the NTLM material: LSASS access on the same host shows the attacker harvesting hashes locally in parallel with, or after, the NTLMv1 authentication.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NTLM network logons using NTLM V1 / LM package
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_lmPackageName:/.*[Nn][Tt][Ll][Mm].*[Vv]1.*/ OR (data_win_eventdata_authenticationPackageName:"NTLM" AND data_win_eventdata_logonType:"3"))
    pivot_on:
    - host
    - user
    window: 1h
  - name: NTLM credential validation on DC (4776) and failed NTLM logons
    query: data_win_system_eventID:"4776" OR (data_win_system_eventID:"4625" AND data_win_eventdata_authenticationPackageName:"NTLM")
    pivot_on:
    - user
    - host
    window: 6h
  - name: LM compatibility / NTLM restriction registry changes
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Ll][Mm][Cc]ompatibility[Ll]evel.*/ OR data_win_eventdata_targetObject:/.*[Nn][Tt][Ll][Mm][Mm]in(Client|Server)[Ss]ec.*/ OR data_win_eventdata_targetObject:/.*[Rr]estrict[Ss]ending[Nn][Tt][Ll][Mm][Tt]raffic.*/)
    pivot_on:
    - host
    window: 24h
  - name: NTLM capture / relay tooling execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Rr]esponder|\\[Ii]nveigh|\\[Nn]tlmrelayx|\\[Mm]ultirelay).*/ OR data_win_eventdata_commandLine:/.*([Rr]esponder|[Ii]nveigh|[Nn]tlmrelayx|[Pp]etit[Pp]otam|[Pp]rinter[Bb]ug|[Cc]oerce).*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound SMB/NTLM connections to unusual servers
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"139") AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
