name: DHCP Server Error Failed Loading the CallOut DLL
id: 75edd3fd-7146-48e5-9848-3013d7f0282c
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Dimitrios Slamaris, @atc_project (fix)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 75edd3fd-7146-48e5-9848-3013d7f0282c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This rule detects a DHCP server error in which a specified Callout DLL (in
  registry) could not be loaded. MITRE ATT&CK: T1574.001.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "1031"
              - term:
                  data_win_system_eventID: "1032"
              - term:
                  data_win_system_eventID: "1034"
            minimum_should_match: 1
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-DHCP-Server"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '1031'; data_win_system_eventID
  equals '1032'; data_win_system_eventID equals '1034', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.3or.de/mimilib-dhcp-server-callout-dll-injection.html
  - https://technet.microsoft.com/en-us/library/cc726884(v=ws.10).aspx
  - https://msdn.microsoft.com/de-de/library/windows/desktop/aa363389(v=vs.85).aspx
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    DHCP Server Error Failed Loading the CallOut DLL detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - server
    - error
    - failed
    - windows_system
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"1031" OR data_win_system_eventID:"1032" OR data_win_system_eventID:"1034") AND data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Dd][Hh][Cc][Pp]-[Ss][Ee][Rr][Vv][Ee][Rr]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9d3436ef-9476-4c43-acca-90ce06bdf33a
    name: DHCP Callout DLL Installation
    reason: 'The CalloutDlls/CalloutEnabled registry write is the direct precursor: a load failure (1031/1032/1034) means the attacker just registered a callout DLL that is broken, mis-pathed or blocked.'
  - id: 13fc89a9-971e-4ca6-b9dc-aa53a445bf40
    name: DHCP Server Loaded the CallOut DLL
    reason: Same provider; a retry after a failed load (fixed path or DLL) produces the successful-load event, confirming the attacker's DLL now runs inside the DHCP service.
  - id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
    name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
    reason: Sibling DC/infrastructure-server service-DLL injection technique (DNS plugin); attackers abusing DHCP callouts commonly try the DNS plugin on the same server.
  - id: e61e8a88-59a9-451c-874e-70fcc9740d67
    name: New DNS ServerLevelPluginDll Installed
    reason: Registry-level evidence of the equivalent DNS server plugin DLL abuse on the same host, indicating a campaign of service-DLL persistence.
  - id: b7966f4a-b333-455b-8370-8ca53c229762
    name: Dropping Of Password Filter DLL
    reason: The mimilib callout DLL is a credential-harvesting tool; password-filter DLL drops are the parallel in-server credential-capture persistence on domain servers.
  - id: 5e993621-67d4-488a-b9ae-b420d08b96cb
    name: Service Installation in Suspicious Folder
    reason: The callout DLL has to be staged on disk; a service or binary installed from a user-writable folder on the same server suggests the attacker's staging path.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: If the DLL is credential-stealing code (mimilib), a follow-on or companion step is unsigned module loading into LSASS on the same DC/server.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Attackers with admin rights on the server often add services alongside the DLL for additional persistence or execution.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes to DHCP Server CalloutDlls/CalloutEnabled
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Dd][Hh][Cc][Pp][Ss][Ee][Rr][Vv][Ee][Rr].*([Cc][Aa][Ll][Ll][Oo][Uu][Tt][Dd][Ll][Ll][Ss]|[Cc][Aa][Ll][Ll][Oo][Uu][Tt][Ee][Nn][Aa][Bb][Ll][Ee][Dd]).*/
    pivot_on:
    - host
    window: 6h
  - name: DLL file drops by non-system processes in System32 or user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]32.*/ OR data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*[Pp][Uu][Bb][Ll][Ii][Cc].*/)
    pivot_on:
    - host
    window: 6h
  - name: Remote admin tooling and service control used to restart DHCP service
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Nn][Ee][Tt]1?|[Ss][Cc]|[Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Dd][Hh][Cc][Pp][Ss][Ee][Rr][Vv][Ee][Rr]|[Dd][Hh][Cc][Pp]).*/) OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll][Oo][Uu][Tt].*/) OR (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll][Oo][Uu][Tt][Dd][Ll][Ll][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Unsigned or user-path module loaded by DHCP/LSASS services
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ll][Ss][Aa][Ss][Ss])\.[Ee][Xx][Ee]/) AND (data_win_eventdata_signed:"false" OR data_win_eventdata_imageLoaded:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_imageLoaded:/.*[Tt][Ee][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping tools and remote logons on the server
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "10") AND NOT data_win_eventdata_targetUserName:/.*\$/)
    pivot_on:
    - host
    window: 2h
