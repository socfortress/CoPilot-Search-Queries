name: KrbRelayUp Service Installation
id: e97d9903-53b2-41fc-8cb9-889ed4093e80
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Sittikorn S, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e97d9903-53b2-41fc-8cb9-889ed4093e80
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service creation from KrbRelayUp tool used for privilege escalation in
  Windows domain environments where LDAP signing is not enforced (the default
  settings). MITRE ATT&CK: T1543.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "7045"
        - term:
            data_win_eventdata_serviceName:
              value: "KrbSCM"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_serviceName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '7045';
  data_win_eventdata_serviceName equals 'KrbSCM'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Dec0ne/KrbRelayUp
  - https://attack.mitre.org/techniques/T1543/

response:
  message: >
    KrbRelayUp Service Installation detected on host $agent_name$. Matched
    data_win_eventdata_serviceName: $data_win_eventdata_serviceName$. MITRE
    ATT&CK: T1543
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543
  custom_tags:
    - krbrelayup
    - service
    - installation
    - windows_system
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7045" AND data_win_eventdata_serviceName:/[Kk][Rr][Bb][Ss][Cc][Mm]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: 'Same tool seen from process creation: KrbRelayUp.exe relay/spawn phases run on this host just before or after the KrbSCM service (7045) appears, confirming the SYSTEM-service stage.'
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: KrbRelayUp wraps the KrbRelay primitive; a KrbRelay command line on the host is the relay precursor that yields the S4U/RBCD-based service install.
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: Kerberos relay chains rely on coercing authentication via DNS SPN spoofing; this precedes the relayed ticket that lets KrbRelayUp install KrbSCM as SYSTEM.
  - id: 44bbff3e-4ca3-452d-a49a-6efa4cafa06f
    name: Potential CVE-2021-42278 Exploitation Attempt
    reason: KrbRelayUp's RBCD path creates a machine account and abuses computer-account names (sAMAccountName spoofing); this machine-account abuse is a precursor in the same domain-takeover family.
  - id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
    name: Uncommon Outbound Kerberos Connection
    reason: The relay tool talks Kerberos/LDAP to the DC from a non-lsass process on the host before the service install, a network precursor.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: KrbRelayUp is commonly paired with Rubeus S4U/ticket requests to impersonate an admin and use the resulting ticket after the SYSTEM service is created.
  - id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
    reason: Another 7045 SYSTEM-escalation service install on the same host; co-occurrence indicates the attacker used multiple privilege-escalation means or followed up with C2 getsystem.
  - id: d26ce60c-2151-403c-9a42-49420d87b5e4
    name: HackTool Service Registration or Execution
    reason: Generic hacktool 7045 service registration; follow-on tooling installed as a service once SYSTEM is obtained via KrbSCM.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: KrbRelayUp / KrbRelay tool execution and arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy].*/ OR data_win_eventdata_commandLine:/.*[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Rr][Bb][Cc][Dd].*[Ss][Aa][Mm][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Kk][Rr][Bb][Ss][Cc][Mm].*/ OR data_win_eventdata_commandLine:/.*-[Mm][Ee][Tt][Hh][Oo][Dd].*[Rr][Ee][Ll][Aa][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: KrbSCM service binary creation and its command line
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Kk][Rr][Bb][Ss][Cc][Mm].*/ OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/))) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Kk][Rr][Bb].*\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Machine account creation / delegation attribute change in AD
    query: (data_win_system_eventID:"4741") OR (data_win_system_eventID:"5136" AND data_win_eventdata_attributeLDAPDisplayName:"msDS-AllowedToActOnBehalfOfOtherIdentity") OR (data_win_system_eventID:"4742" AND data_win_eventdata_allowedToDelegateTo:*)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos S4U / suspicious ticket requests
    query: (data_win_system_eventID:"4769" AND data_win_eventdata_transitedServices:*) OR (data_win_system_eventID:"4768" AND data_win_eventdata_ticketEncryptionType:"0x17") OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"Kerberos")
    pivot_on:
    - host
    window: 2h
  - name: 'SYSTEM-level follow-on actions: credential dumping, new accounts, shells'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?.*[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/))
    pivot_on:
    - host
    window: 2h
