name: Goofy Guineapig Backdoor Service Creation
id: 8c15dd74-9570-4f48-80b2-29996fd91ee6
version: 1
schema_version: "1.0"
date: "2023-05-15"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8c15dd74-9570-4f48-80b2-29996fd91ee6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service creation persistence used by the Goofy Guineapig backdoor.

data_source:
  - Windows System Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Service Control Manager"
              case_insensitive: true
        - term:
            data_win_system_eventID: "7045"
        - term:
            data_win_eventdata_serviceName:
              value: "GoogleUpdate"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*rundll32*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*FileProtocolHandler*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imagePath:
              value: "*\\\\ProgramData\\\\GoogleUpdate\\\\GoogleUpdate.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_serviceName
    - data_win_eventdata_imagePath

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Service Control Manager';
  data_win_system_eventID equals '7045'; data_win_eventdata_serviceName equals
  'GoogleUpdate', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/goofy-guineapig/NCSC-MAR-Goofy-Guineapig.pdf

response:
  message: >
    Goofy Guineapig Backdoor Service Creation detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_serviceName: $data_win_eventdata_serviceName$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_serviceName
      type: service

tags:
  asset_type: Endpoint
  custom_tags:
    - goofy
    - guineapig
    - backdoor
    - windows_system
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]/ AND data_win_system_eventID:"7045" AND data_win_eventdata_serviceName:/[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]/ AND data_win_eventdata_imagePath:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_imagePath:/.*[Ff][Ii][Ll][Ee][Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Aa][Nn][Dd][Ll][Ee][Rr].*/ AND data_win_eventdata_imagePath:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f0bafe60-1240-4798-9e60-4364b97e6bad
    name: Goofy Guineapig Backdoor IOC
    reason: 'Precursor: the loader drops config.dat, GoogleUpdate.exe, goopdate.dll and tmp.bat into ProgramData GoogleUpdate before the service pointing at that exe is registered.'
  - id: b6188d2f-b3c4-4d2c-a17d-9706e0851af0
    name: Potential Goopdate.DLL Sideloading
    reason: 'Precursor/co-occurring: the malicious goopdate.dll is sideloaded by the dropped GoogleUpdate.exe outside Program Files, the payload the new service launches.'
  - id: 72ca7c75-bf85-45cd-aca7-255d360e423c
    name: Potential Chrome Frame Helper DLL Sideloading
    reason: Same Google-updater sideloading tradecraft; corroborates DLL hijack of a Google binary on the same host.
  - id: bdbab15a-3826-48fa-a1b7-723cd8f32fcc
    name: Potential Goofy Guineapig GoolgeUpdate Process Anomaly
    reason: 'Follow-on: once the service starts, GoogleUpdate.exe runs from ProgramData and spawns itself outside legitimate Google install paths.'
  - id: 477a5ed3-a374-4282-9f3b-ed94e159a108
    name: Potential Goofy Guineapig Backdoor Activity
    reason: 'Follow-on: the backdoor''s tmp.bat delay/cleanup command line (choice /t %d /d y /n) after the implant runs.'
  - id: 84b1ecf9-6eff-4004-bafb-bae5c0e251b2
    name: Potentially Suspicious GoogleUpdate Child Process
    reason: 'Follow-on: the fake GoogleUpdate service process spawning shells or tools for attacker commands.'
  - id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
    name: Dllhost.EXE Execution Anomaly
    reason: Goofy Guineapig is reported to abuse dllhost as a post-load host; anomalous dllhost marks implant activity.
  - id: 5e993621-67d4-488a-b9ae-b420d08b96cb
    name: Service Installation in Suspicious Folder
    reason: Same 7045 event also fits a service binary installed from ProgramData, a generic corroboration of the persistence.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Goofy Guineapig staging files written to ProgramData GoogleUpdate
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/
    pivot_on:
    - host
    window: 4h
  - name: GoogleUpdate.exe running from ProgramData or spawning children
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: goopdate.dll loaded from a non-Program-Files path
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Gg][Oo][Oo][Pp][Dd][Aa][Tt][Ee]\.[Dd][Ll][Ll]/ AND NOT data_win_eventdata_imageLoaded:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss].*/
    pivot_on:
    - host
    window: 4h
  - name: Network connections from GoogleUpdate.exe in ProgramData (C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/
    pivot_on:
    - host
    window: 6h
  - name: GoogleUpdate service registry key written
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Gg][Oo][Oo][Gg][Ll][Ee][Uu][Pp][Dd][Aa][Tt][Ee].*/
    pivot_on:
    - host
    window: 4h
