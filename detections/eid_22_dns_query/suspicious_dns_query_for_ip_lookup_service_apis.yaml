                  data_win_eventdata_queryName:
                    value: "*ipapi.co*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipconfig.io*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipecho.net*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipinfo.io*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipip.net*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipof.in*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipv4.icanhazip.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipv4bot.whatismyipaddress.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipv6-test.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipwho.is*"
                    case_insensitive: true
              - wildcard:
