name: Suspicious DNS Query for IP Lookup Service APIs
id: ec82e2a5-81ea-4211-a1f8-37a0286df2c2
version: 1
schema_version: "1.0"
date: "2024-03-22"
author: Brandon George (blog post), Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ec82e2a5-81ea-4211-a1f8-37a0286df2c2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries for IP lookup services such as "api.ipify.org" originating
  from a non browser process. MITRE ATT&CK: T1590.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_queryName:
                    value: "www.ip.cn"
                    case_insensitive: true
              - term:
                  data_win_eventdata_queryName:
                    value: "l2.io"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*api.2ip.ua*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*api.bigdatacloud.net*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*api.ipify.org*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*bot.whatismyipaddress.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*canireachthe.net*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*checkip.amazonaws.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*checkip.dyndns.org*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*curlmyip.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*db-ip.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*edns.ip-api.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*eth0.me*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*freegeoip.app*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*geoipy.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*getip.pro*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*icanhazip.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ident.me*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ifconfig.io*"
                    case_insensitive: true
              - wildcard:
