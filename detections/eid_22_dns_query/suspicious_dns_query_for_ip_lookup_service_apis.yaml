                    value: "*ip-api.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ip.360.cn*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ip.anysrc.net*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ip.taobao.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ip.tyk.nu*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*ipaddressworld.com*"
                    case_insensitive: true
