name: Notepad++ Updater DNS Query to Uncommon Domains
id: 2074e137-1b73-4e2d-88ba-5a3407dbdce0
version: 1
schema_version: "1.0"
date: "2026-03-16"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2074e137-1b73-4e2d-88ba-5a3407dbdce0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the Notepad++ updater (gup.exe) makes DNS queries to domains that
  are not part of the known legitimate update infrastructure. This could
  indicate potential exploitation of the updater mechanism or suspicious network
  activity that warrants further investigation. MITRE ATT&CK: T1195.002, T1557.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\gup.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_queryName"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_queryName:
                    value: "notepad-plus-plus.org"
                    case_insensitive: true
        - exists:
            field: "data_win_eventdata_queryName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_queryName:
                          value: "*.sourceforge.net"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_queryName:
                          value: "*.githubusercontent.com"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_queryName:
                          value: "github.com"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_queryName:
                          value: "*.googleapis.com"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_queryName:
                          value: "*.azurewebsites.net"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_queryName:
                          value: "*block.opendns.com"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_queryName:
                          value: "*gateway.zscalerthree.net"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_queryName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_image matches
  '*\gup.exe'; data_win_eventdata_queryName equals 'notepad-plus-plus.org';
  data_win_eventdata_queryName matches '*.sourceforge.net', among other
  conditions.

known_false_positives: >
  Some legitimate network misconfigurations or proxy issues causing unexpected
  DNS queries.. Other legitimate query to official domains not listed in the
  filter, needing tuning. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://notepad-plus-plus.org/news/v889-released/
  - https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
  - https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
  - https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
  - https://securelist.com/notepad-supply-chain-attack/118708/
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1557/

response:
  message: >
    Notepad++ Updater DNS Query to Uncommon Domains detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_queryName: $data_win_eventdata_queryName$. MITRE
    ATT&CK: T1195.002, T1557
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_queryName
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1195.002
    - T1557
  custom_tags:
    - notepad
    - updater
    - query
    - dns_query
    - sysmon
    - collection
    - credential_access
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_queryName AND NOT (data_win_eventdata_queryName:/[Nn][Oo][Tt][Ee][Pp][Aa][Dd]-[Pp][Ll][Uu][Ss]-[Pp][Ll][Uu][Ss]\.[Oo][Rr][Gg]/) AND _exists_:data_win_eventdata_queryName AND NOT (data_win_eventdata_queryName:/.*\.[Ss][Oo][Uu][Rr][Cc][Ee][Ff][Oo][Rr][Gg][Ee]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*\.[Gg][Ii][Tt][Hh][Uu][Bb][Uu][Ss][Ee][Rr][Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*\.[Gg][Oo][Oo][Gg][Ll][Ee][Aa][Pp][Ii][Ss]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*\.[Aa][Zz][Uu][Rr][Ee][Ww][Ee][Bb][Ss][Ii][Tt][Ee][Ss]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*[Bb][Ll][Oo][Cc][Kk]\.[Oo][Pp][Ee][Nn][Dd][Nn][Ss]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Gg][Aa][Tt][Ee][Ww][Aa][Yy]\.[Zz][Ss][Cc][Aa][Ll][Ee][Rr][Tt][Hh][Rr][Ee][Ee]\.[Nn][Ee][Tt]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
    name: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
    reason: 'Documented compromise mechanism for this exact binary (Rapid7 Lotus Blossom/Chrysalis reference): a planted libcurl.dll next to gup.exe does the HTTPS beaconing, so the uncommon domain this rule flags is almost certainly the sideloaded DLL''s C2 resolution. If this fired on the same host, the DNS query is the sideload phoning home.'
  - id: 44143844-0631-49ab-97a0-96387d6b2d7c
    name: File Download Using Notepad++ GUP Utility
    reason: gup.exe's built-in '-unzipTo <http-url>' turns the updater into a download LOLBin. The uncommon-domain DNS query is the resolution step of exactly this download when gup is pointed at attacker infrastructure instead of notepad-plus-plus.org. Direct co-occurring cause of the flagged lookup.
  - id: 3b8f4c92-6a51-4d7e-9c3a-8e2d1f5a7b09
    name: Uncommon File Created by Notepad++ Updater Gup.EXE
    reason: 'Immediate follow-on: after gup.exe resolves and connects to the attacker domain it writes the fetched payload to disk outside the legitimate update temp path. A gup.exe file-create on the same host right after this DNS query is the downloaded malware landing.'
  - id: bb0e87ce-c89f-4857-84fa-095e4483e9cb
    name: Suspicious Child Process of Notepad++ Updater - GUP.Exe
    reason: 'Terminal step of the updater-hijack chain: gup.exe spawns cmd/powershell/mshta/certutil/curl/bitsadmin to run the payload it just downloaded. A suspicious gup.exe child on the same host confirms the uncommon-domain lookup resulted in code execution, not a stray query.'
  - id: d65aee4d-2292-4cea-b832-83accd6cfa43
    name: Arbitrary Binary Execution Using GUP Utility
    reason: gup.exe acting as parent to launch another executable - the execution that follows the download the uncommon DNS query serviced. Co-occurring execution evidence for the same abused updater process on the same host.
  - id: 0a4f6091-223b-41f6-8743-f322ec84930b
    name: Suspicious GUP Usage
    reason: gup.exe running from a directory other than the real Notepad++ updater install path - the hallmark of a planted copy used for DLL sideloading. A gup.exe outside its install dir that also resolves an uncommon domain is a relocated, weaponised updater beaconing out; strong corroboration of the sideload hypothesis.
  - id: 54127bd4-f541-4ac3-afdb-ea073f63f692
    name: Potential Persistence Via Notepad++ Plugins
    reason: 'Post-compromise foothold in the same software: a non-gup process dropping a .dll into the Notepad++ plugins directory. After an updater hijack delivers a payload, planting a plugin DLL gives durable code execution every time Notepad++ launches - a plausible next move on the same host.'
  - id: 933f0bb5-0681-4fe7-8a17-4e6cccbaac44
    name: Potential Notepad++ CVE-2025-49144 Exploitation
    reason: 'Alternative/paired compromise path for the same product: the Notepad++ installer calling an unqualified regsvr32 (planted binary) for local privilege escalation. A hijacked update that fetches a weaponised installer can deliver exactly this, so CVE-2025-49144 activity on the same host extends the updater-abuse incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: gup.exe actually connected to the resolved host (network session, not just DNS)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: File written to disk by gup.exe (downloaded payload landing)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: 'gup.exe process context: who launched it and what it spawned'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: DLLs loaded by gup.exe (libcurl.dll / non-standard module sideload)
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same domain (campaign spread)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
