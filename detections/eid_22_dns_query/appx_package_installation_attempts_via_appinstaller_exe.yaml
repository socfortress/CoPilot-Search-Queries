name: AppX Package Installation Attempts Via AppInstaller.EXE
id: 7cff77e1-9663-46a3-8260-17f2e1aa9d0a
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7cff77e1-9663-46a3-8260-17f2e1aa9d0a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries made by "AppInstaller.EXE". The AppInstaller is the
  default handler for the "ms-appinstaller" URI. It attempts to load/install a
  package from the referenced URL. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_image:
              value: "C:\\\\Program Files\\\\WindowsApps\\\\Microsoft.DesktopAppInstaller_*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\AppInstaller.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_queryName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_image matches
  'C:\Program Files\WindowsApps\Microsoft.DesktopAppInstaller_*';
  data_win_eventdata_image matches '*\AppInstaller.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/notwhickey/status/1333900137232523264
  - https://lolbas-project.github.io/lolbas/Binaries/AppInstaller/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    AppX Package Installation Attempts Via AppInstaller.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_queryName: $data_win_eventdata_queryName$. MITRE
    ATT&CK: T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_queryName
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - package
    - installation
    - appinstaller
    - dns_query
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]_.*/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 180c7c5c-d64b-4a63-86e9-68910451bc8b
    name: Potential File Download Via MS-AppInstaller Protocol Handler
    reason: 'Co-occurring cause: the EID 1 process-creation view of the exact same action. An ''ms-appinstaller://?source=http...'' command line is what makes AppInstaller.EXE resolve the remote host this DNS alert fired on. Both on one host in the window confirms protocol-handler abuse fetching a remote package (CVE-2021-43890).'
  - id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
    name: Unsigned AppX Installation Attempt Using Add-AppxPackage
    reason: 'Follow-on install: after AppInstaller fetches the .appx/.msix, the package is sideloaded via PowerShell Add-AppxPackage -AllowUnsigned. Confirms the resolved/downloaded package was actually installed, not just reached out to.'
  - id: d2f77901-dbfa-42d9-8af7-dcd0f1a50a2f
    name: Windows PowerShell MSIX Package Installation
    reason: 'Follow-on install (MSIX on Win11): Add-AppxPackage/-AllowUnsigned on an MSIX. Strongly co-occurring when the package AppInstaller fetched is an unsigned MSIX used to bypass signing or establish persistence.'
  - id: windows-advanced-installer-msix-ai-stubs-001
    name: Windows Advanced Installer MSIX with AI_STUBS Execution
    reason: 'Follow-on payload execution: malicious MSIX packages (FakeBat/EugenLoader families) built with Advanced Installer launch their payload via AI_STUBS popupwrapper.exe once installed — exactly what a package pulled by AppInstaller runs next.'
  - id: a3f5c081-e75b-43a0-9f5b-51f26fe5dba2
    name: Potential Suspicious Winget Package Installation
    reason: 'Confirming on-disk evidence: an internet-sourced package landing with a mark-of-the-web/alternate-data-stream from a suspicious source — the downloaded .appx/.msix written by the AppInstaller fetch this DNS query started.'
  - id: 313d6012-51a0-4d93-8dfc-de8553239e25
    name: Install New Package Via Winget Local Manifest
    reason: 'Sibling abuse of the same Microsoft.DesktopAppInstaller binary (which ships both AppInstaller.EXE and winget): a local YAML manifest that downloads and runs a remote exe/msi/msix. Often chained with protocol-handler fetching in the same intrusion.'
  - id: fa277e82-9b78-42dd-b05c-05555c7b6015
    name: Enable Local Manifest Installation With Winget
    reason: 'Enabling precursor: the AppInstaller/winget policy flip that turns on local-manifest installation, the setting an attacker sets before sideloading arbitrary custom manifests through the same DesktopAppInstaller component.'
  - id: 81a0ecb5-0a41-4ba1-b2ba-c944eb92bfa2
    name: Add Insecure Download Source To Winget
    reason: 'Config-tampering precursor on the same binary family: pointing winget at an attacker-controlled insecure (http) source so later package installs pull from attacker infrastructure, subverting the DesktopAppInstaller trust chain.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: The actual package download — AppInstaller.EXE network connection
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Delivery vector — ms-appinstaller protocol handler invoked or AppInstaller spawned by a browser/comms app
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Mm][Ss]-[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]:.*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/) OR (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*(\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]|\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]|\\[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]|\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]|\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee])/))
    pivot_on:
    - host
    window: 1h
  - name: Installed package executing — children of AppInstaller.EXE or Advanced-Installer AI_STUBS stub
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Pp][Uu][Pp][Ww][Rr][Aa][Pp][Pp][Ee][Rr]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Campaign spread — other hosts resolving or connecting to the same domain
    query: data_win_system_eventID:"22" OR data_win_system_eventID:"3"
    pivot_on:
    - domain
    window: 24h
  - name: Second-stage ingress-tool-transfer on this host (certutil/bitsadmin/curl/wget/PowerShell downloaders)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/) OR data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]).*/
    pivot_on:
    - host
    window: 2h
