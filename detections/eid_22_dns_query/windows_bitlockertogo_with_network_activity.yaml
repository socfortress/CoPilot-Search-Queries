name: Windows BitLockerToGo with Network Activity
id: 14e3a089-cc23-4f4d-a770-26e44a31fbac
version: 6
schema_version: 1
date: '2025-10-14'
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects BitLockerToGo.exe making DNS queries, indicating potential abuse by
  Lumma stealer malware. Lumma leverages this legitimate Windows utility to
  manipulate registry keys, harvest cryptocurrency wallets, steal browser
  credentials, and exfiltrate sensitive data via network activity. DNS queries
  originating from BitLockerToGo.exe are highly anomalous and not expected in
  normal operations. Associated with Lumma Stealer and Hellcat Ransomware campaigns.
  MITRE ATT&CK: T1218 (System Binary Proxy Execution).

data_source:
  - Sysmon EventID 22 (DNSEvent)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "22"
        - wildcard:
            data_win_eventdata_image: "*\\bitlockertogo.exe"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 22 (DNSEvent) flowing to the Wazuh Indexer.
  EventID 22 confirmed flowing on DESKTOP-AM0HLGE with 51 events/hour.
  Confirmed field names: data_win_eventdata_image (querying process),
  data_win_eventdata_queryName (DNS query). Field-validated — BitLockerToGo.exe
  binary not present on lab endpoint, simulation not possible. Binary is only
  available on Windows editions with BitLocker To Go feature enabled.

known_false_positives: >
  Legitimate DNS queries from BitLockerToGo.exe are extremely rare. In
  environments where the binary is not present or not used for removable
  drive management, any hit should be treated as high priority. If confirmed
  legitimate, filter on data_win_eventdata_queryName for known internal domains.

references:
  - https://any.run/report/5e9ba24639f70787e56f10a241271ae819ef9c573edb22b9eeade7cb40a2df2a/66f16c7b-2cfc-40c5-91cc-f1cbe9743fa3
  - https://securelist.com/fake-captcha-delivers-lumma-amadey/114312/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    BitLockerToGo.exe made a DNS query on $agent_name$.
    DNS query: $data_win_eventdata_queryName$.
    Process: $data_win_eventdata_image$.
    Possible Lumma stealer abuse for C2 communication or data exfiltration.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_queryName
      type: dns_query

tags:
  analytic_story:
    - Lumma Stealer
    - Hellcat Ransomware
    - Living Off The Land
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - bitlockertogo
    - lumma_stealer
    - dns
    - network_activity
    - infostealer
    - lolbas
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 68cbc9e9-2882-46f2-b636-3b5080589d58
    name: Windows BitLockerToGo Process Execution
    reason: 'Same binary, one event earlier: the EID 1 process-start of the very BitLockerToGo.exe that then issued this DNS query (EID 22). Fires on the same host within seconds and confirms the LOLBin actually launched rather than a stray DNS record.'
  - id: 19b3806e-46f2-4b4c-9337-e3d8653245ea
    name: Lummac Stealer Activity - Execution Of More.com And Vbc.exe
    reason: 'The Lumma loader stage that stands up this stealer: more.com injects the Lummac payload into vbc.exe. If the BitLockerToGo DNS is Lumma, this injection chain typically ran on the same host minutes earlier.'
  - id: d81d4d3d-76b5-4f21-ab51-b17d5164c106
    name: Windows PowerShell FakeCAPTCHA Clipboard Execution
    reason: The documented initial access for this exact chain - the fake-CAPTCHA/ClickFix clipboard one-liner (this rule cites the same Securelist Lumma campaign). It is the user-interaction step that precedes the Lumma infection.
  - id: d487ed4a-fd24-436d-a0b2-f4e95f7b2635
    name: Suspicious ClickFix/FileFix Execution Pattern
    reason: 'The other face of the same delivery: explorer-spawned Run-dialog/FileFix execution carrying CAPTCHA/verification lure strings. Catches the ClickFix loader when it is not the hidden-PowerShell variant above.'
  - id: b98d0db6-511d-45de-ad02-e82a98729620
    name: Remotely Hosted HTA File Executed Via Mshta.EXE
    reason: The loader-download step ClickFix campaigns use - mshta pulling a remote HTA over http(s) - which fetches and runs the Lumma payload before BitLockerToGo is abused for C2.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'The stealer''s actual objective: native copy tools (esentutl/xcopy/robocopy) lifting browser User Data / Login Data. This is the credential data the BitLockerToGo DNS beacon is exfiltrating, expected on the same host in the same window.'
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: The same browser-credential theft seen via PowerShell script-block (Copy-Item of Chrome/Edge/Firefox Login Data) - a second telemetry source confirming the loot-collection phase that co-occurs with the C2 DNS.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BitLockerToGo process execution and outbound connection on this host
    query: (data_win_system_eventID:"1" OR data_win_system_eventID:"3") AND data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr][Tt][Oo][Gg][Oo]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: 'ClickFix / fake-CAPTCHA delivery: browser or explorer spawning a script engine with clipboard/iex/hidden/mshta-http lures'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*-[Ww].*[Hh][Ii][Dd][Dd][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Hh][Tt][Aa].*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Pp][Tt][Cc][Hh][Aa].*/)
    pivot_on:
    - host
    window: 6h
  - name: Lumma loader injection chain (more.com spawning vbc.exe) on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Oo][Rr][Ee]\.[Cc][Oo][Mm]/ AND (data_win_eventdata_image:/.*\\[Vv][Bb][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Bb][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Infostealer loot: browser Login Data and crypto-wallet artifact access on this host'
    query: (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ww][Aa][Ll][Ll][Ee][Tt]\.[Dd][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Ww][Aa][Ll][Ll][Ee][Tt]\.[Dd][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Tt][Aa][Mm][Aa][Ss][Kk].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ll][Ee][Cc][Tt][Rr][Uu][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Oo][Dd][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Yy][Pp][Tt][Oo][Cc][Uu][Rr][Rr][Ee][Nn][Cc][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same C2 domain (campaign spread)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
