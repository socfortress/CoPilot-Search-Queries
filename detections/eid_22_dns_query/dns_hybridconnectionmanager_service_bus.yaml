name: DNS HybridConnectionManager Service Bus
id: 7bd3902d-8b8b-4dd4-838a-c6862d40150d
version: 1
schema_version: "1.0"
date: "2023-01-16"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7bd3902d-8b8b-4dd4-838a-c6862d40150d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Azure Hybrid Connection Manager services querying the Azure service
  bus service. MITRE ATT&CK: T1554.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_queryName:
              value: "*servicebus.windows.net*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*HybridConnectionManager*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*servicebus.windows.net*'; data_win_eventdata_image matches
  '*HybridConnectionManager*'.

known_false_positives: >
  Legitimate use of Azure Hybrid Connection Manager and the Azure Service Bus
  service. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/Cyb3rWard0g/status/1381642789369286662
  - https://attack.mitre.org/techniques/T1554/

response:
  message: >
    DNS HybridConnectionManager Service Bus detected on host $agent_name$.
    Matched data_win_eventdata_queryName: $data_win_eventdata_queryName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1554
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1554
  custom_tags:
    - hybridconnectionmanager
    - service
    - dns_query
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Bb][Uu][Ss]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Nn][Ee][Tt].*/ AND data_win_eventdata_image:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ac8866c7-ce44-46fd-8c17-b24acff96ca8
    name: HybridConnectionManager Service Installation - Registry
    reason: 'Direct precursor: writes the HKLM\...\Services\HybridConnectionManager keys / Listener.exe value that create the very service now resolving servicebus.windows.net - pins how and when the Azure Relay tunnel was planted on this host.'
  - id: 0ee4d8a5-4e67-4faf-acfa-62a78457d1f2
    name: HybridConnectionManager Service Installation
    reason: 'Direct precursor from the Security log (EID 4697): the HybridConnectionManager service install this DNS event is the runtime of, naming the account that registered the tunnel.'
  - id: 1cb0c6ce-3d00-44fc-ab9c-6d6d577bf20b
    name: DNS Query To Devtunnels Domain
    reason: 'Parallel covert cloud-relay tunnel: a Devtunnels DNS query on the same host corroborates the box is being used for outbound tunneling / reverse shell, not a single isolated Azure relay.'
  - id: a1d9eec5-33b2-4177-8d24-27fe754d0812
    name: Cloudflared Tunnels Related DNS Requests
    reason: Same Sysmon-22 surface, same tradecraft - an egress tunnel abused for reverse shell/persistence; a Cloudflared tunnel DNS on this host marks it a tunneling pivot alongside the HCM/Service Bus relay.
  - id: b3e6418f-7c7a-4fad-993a-93b65027a9f1
    name: DNS Query To Visual Studio Code Tunnels Domain
    reason: 'Parallel Microsoft-cloud tunnel: a VS Code Tunnels DNS query on the same host is the same relay-through-trusted-cloud technique as HCM hiding its C2 inside servicebus.windows.net.'
  - id: e043f529-8514-4205-8ab0-7f7d2927b400
    name: DNS Query To AzureWebsites.NET By Non-Browser Process
    reason: 'Adjacent Azure-PaaS abuse: a non-browser process resolving azurewebsites.net on the same host points at the same App Service / Hybrid-Connection infrastructure HCM rides for covert C2 and data egress.'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Live Azure Relay / Service Bus egress connection from this host (tunnel actually connected, not just resolved)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Bb][Uu][Ss]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_image:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 1h
  - name: HybridConnectionManager installer and service binary executed on this host (root cause - who/how it was planted)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 24h
  - name: HybridConnectionManager spawning child processes (remote code execution relayed through the tunnel)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn].*/
    pivot_on:
    - host
    window: 2h
  - name: Other covert egress tunnels / reverse proxies / remote-access tooling executed on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\\[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Ss]\.[Ee][Xx][Ee]|\\[Ii][Oo][Xx]\.[Ee][Xx][Ee]|\\[Ll][Oo][Cc][Aa][Ll][Tt][Oo][Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee]|\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|\\[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt].*\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ss][Hh]|[Pp][Ll][Ii][Nn][Kk]).* -[RrLlDd] [0-9].*/)
    pivot_on:
    - host
    window: 6h
  - name: New service or autostart persistence registered on this host (HCM is a service - look for its registration and siblings)
    query: ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)) OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4697"
    pivot_on:
    - host
    window: 4h
