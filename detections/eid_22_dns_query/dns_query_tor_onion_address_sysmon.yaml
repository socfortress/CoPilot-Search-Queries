type: TTP

description: >
  Detects DNS queries to an ".onion" address related to Tor routing networks.
  MITRE ATT&CK: T1090.003.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.hiddenservice.net"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.ca"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.cab"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.casa"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.city"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.direct"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.dog"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.glass"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.gq"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.ink"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.it"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.link"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.lt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.lu"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.nu"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.pet"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.onion.plus"
