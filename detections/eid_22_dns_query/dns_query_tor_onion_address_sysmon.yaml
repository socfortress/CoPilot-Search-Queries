graylog:
  query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*\.[Hh][Ii][Dd][Dd][Ee][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Cc][Aa]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Cc][Aa][Bb]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Cc][Aa][Ss][Aa]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Cc][Ii][Tt][Yy]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Dd][Ii][Rr][Ee][Cc][Tt]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Dd][Oo][Gg]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Gg][Ll][Aa][Ss][Ss]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Gg][Qq]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Ii][Nn][Kk]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Ii][Tt]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Ll][Ii][Nn][Kk]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Ll][Tt]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Ll][Uu]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Nn][Uu]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Pp][Ee][Tt]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Pp][Ll][Uu][Ss]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Rr][Ii][Pp]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Ss][Hh]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Tt][Oo]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[Tt][Oo][Pp]/ OR data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn]/ OR data_win_eventdata_queryName:/.*\.[Ss]1\.[Tt][Oo][Rr]-[Gg][Aa][Tt][Ee][Ww][Aa][Yy][Ss]\.[Dd][Ee]/ OR data_win_eventdata_queryName:/.*\.[Ss]2\.[Tt][Oo][Rr]-[Gg][Aa][Tt][Ee][Ww][Aa][Yy][Ss]\.[Dd][Ee]/ OR data_win_eventdata_queryName:/.*\.[Ss]3\.[Tt][Oo][Rr]-[Gg][Aa][Tt][Ee][Ww][Aa][Yy][Ss]\.[Dd][Ee]/ OR data_win_eventdata_queryName:/.*\.[Ss]4\.[Tt][Oo][Rr]-[Gg][Aa][Tt][Ee][Ww][Aa][Yy][Ss]\.[Dd][Ee]/ OR data_win_eventdata_queryName:/.*\.[Ss]5\.[Tt][Oo][Rr]-[Gg][Aa][Tt][Ee][Ww][Aa][Yy][Ss]\.[Dd][Ee]/ OR data_win_eventdata_queryName:/.*\.[Tt]2[Ww]\.[Pp][Ww]/ OR data_win_eventdata_queryName:/.*\.[Tt][Oo][Rr]2[Ww][Ee][Bb]\.[Aa][Ee]\.[Oo][Rr][Gg]/ OR data_win_eventdata_queryName:/.*\.[Tt][Oo][Rr]2[Ww][Ee][Bb]\.[Bb][Ll][Uu][Tt][Mm][Aa][Gg][Ii][Ee]\.[Dd][Ee]/ OR data_win_eventdata_queryName:/.*\.[Tt][Oo][Rr]2[Ww][Ee][Bb]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*\.[Tt][Oo][Rr]2[Ww][Ee][Bb]\.[Ff][Ii]/ OR data_win_eventdata_queryName:/.*\.[Tt][Oo][Rr]2[Ww][Ee][Bb]\.[Ii][Oo]/ OR data_win_eventdata_queryName:/.*\.[Tt][Oo][Rr]2[Ww][Ee][Bb]\.[Oo][Rr][Gg]/ OR data_win_eventdata_queryName:/.*\.[Tt][Oo][Rr]2[Ww][Ee][Bb]\.[Xx][Yy][Zz]/ OR data_win_eventdata_queryName:/.*\.[Tt][Oo][Rr][Ll][Ii][Nn][Kk]\.[Cc][Oo]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62f7c9bf-9135-49b2-8aeb-1e54a6ecc13c
    name: Tor Client/Browser Execution
    reason: Confirms a live Tor client is on the same host and is the most likely origin of, or companion to, the .onion resolution; because a native Tor client resolves onions internally, a system-level .onion DNS beside tor.exe/Tor Browser points to a SOCKS/DNS leak or a second tool riding the circuit.
  - id: e99375eb-3ee0-407a-9f90-79569cc6a01c
    name: Kalambur Backdoor Curl TOR SOCKS Proxy Execution
    reason: 'Malware branch of the exact same behaviour: a backdoor reaching a .onion C2 via curl through a Tor SOCKS proxy on this host; its command line carries the very .onion address this DNS rule resolves.'
  - id: 2c1486f5-02e8-4f86-9099-b97f2da4ed77
    name: Insecure Proxy/DOH Transfer Via Curl.EXE
    reason: 'Same covert-egress toolkit on the host: curl --proxy-insecure reaches a self-signed tor2web/onion gateway, and --doh-insecure is used to hide the very DNS resolution this rule caught.'
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: 'Co-occurring covert channel: iodine/dnscat2 stand up a DNS tunnel on the same host an actor is already using a Tor hidden-service drop for C2/exfil, expanding it into a multi-channel covert-egress incident.'
  - id: 4d16c9a6-4362-4863-9940-1dee35f1d70f
    name: DPRK Threat Actor - C2 Communication DNS Indicators
    reason: 'Converging DNS-based C2 on the same host and the same telemetry (Sysmon EID22): a known-bad C2 domain resolving alongside a Tor hidden-service address is a strong multi-channel C2 incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Live Tor client / SOCKS-proxy footprint on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Tt][Oo][Rr] [Bb][Rr][Oo][Ww][Ss][Ee][Rr]/ OR data_win_eventdata_product:/[Tt][Oo][Rr] [Bb][Rr][Oo][Ww][Ss][Ee][Rr]/)) OR (data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_destinationPort:"9050" OR data_win_eventdata_destinationPort:"9150" OR data_win_eventdata_destinationPort:"9001"))
    pivot_on:
    - host
    window: 2h
  - name: Hidden-service DNS resolved by script interpreters / LOLBins on this host
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: curl-over-SOCKS to .onion or tor2web gateway in a command line on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ss].*/ AND data_win_eventdata_commandLine:/.*\.[Oo][Nn][Ii][Oo][Nn].*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Oo][Nn][Ii][Oo][Nn]\.[A-Za-z].*/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Rr]2[Ww][Ee][Bb].*/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Rr]-[Gg][Aa][Tt][Ee][Ww][Aa][Yy][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Second-stage download / C2 beaconing egress on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/)
    pivot_on:
    - host
    window: 1h
  - name: Other hosts resolving or connecting to the same hidden-service / gateway domain (campaign)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
