              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.s1.tor-gateways.de"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.s2.tor-gateways.de"
                    case_insensitive: true
              - wildcard:
