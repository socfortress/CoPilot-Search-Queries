name: DNS Query To Devtunnels Domain
id: 1cb0c6ce-3d00-44fc-ab9c-6d6d577bf20b
version: 1
schema_version: "1.0"
date: "2023-11-20"
author: citron_ninja
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1cb0c6ce-3d00-44fc-ab9c-6d6d577bf20b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS query requests to Devtunnels domains. Attackers can abuse that
  feature to establish a reverse shell or persistence on a machine. MITRE
  ATT&CK: T1071.001, T1572.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_queryName:
              value: "*.devtunnels.ms"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*.devtunnels.ms'.

known_false_positives: >
  Legitimate use of Devtunnels will also trigger this. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://blueteamops.medium.com/detecting-dev-tunnels-16f0994dc3e2
  - https://learn.microsoft.com/en-us/azure/developer/dev-tunnels/security
  - https://cydefops.com/devtunnels-unleashed
  - https://attack.mitre.org/techniques/T1071/001/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    DNS Query To Devtunnels Domain detected on host $agent_name$. Matched
    data_win_eventdata_queryName: $data_win_eventdata_queryName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1071.001, T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.001
    - T1572
  custom_tags:
    - query
    - devtunnels
    - domain
    - dns_query
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*\.[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9501f8e6-8e3d-48fc-a8a6-1089dd5d7ef4
    name: Network Connection Initiated To DevTunnels Domain
    reason: 'Direct follow-on on the same host: the EID3 TCP connect to the very *.devtunnels.ms relay this DNS query just resolved, confirming the channel actually went live rather than a bare name lookup.'
  - id: 90d6bd71-dffb-4989-8d86-a827fedd6624
    name: Visual Studio Code Tunnel Execution
    reason: 'Identifies the process behind this resolution: `code.exe tunnel` / devtunnel CLI is what resolves *.devtunnels.ms, so its EID1 command line names the binary and args that generated this DNS query.'
  - id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
    name: Renamed Visual Studio Code Tunnel Execution
    reason: Same tunnel binary renamed to evade detection; firing alongside this devtunnels resolution upgrades the verdict from possible developer use to deliberate covert-channel setup.
  - id: 30bf1789-379d-4fdc-900f-55cd0a90a801
    name: Visual Studio Code Tunnel Service Installation
    reason: 'Follow-on persistence: `tunnel ... service internal-run` registers the tunnel as a Windows service so this remote-access channel re-resolves devtunnels and reconnects across reboot and logoff.'
  - id: f4a623c2-4ef5-4c33-b811-0642f702c9f1
    name: Visual Studio Code Tunnel Shell Execution
    reason: 'The payoff of the channel this query opened: a shell (powershell/cmd/bash/wsl) launched through the VS Code tunnel is hands-on-keyboard command execution over the devtunnels relay.'
  - id: b3e6418f-7c7a-4fad-993a-93b65027a9f1
    name: DNS Query To Visual Studio Code Tunnels Domain
    reason: 'Sibling channel of the same client: a single `code tunnel` session resolves both *.devtunnels.ms and *.tunnels.api.visualstudio.com, so this typically co-fires on the same host in the same window.'
  - id: a1d9eec5-33b2-4177-8d24-27fe754d0812
    name: Cloudflared Tunnels Related DNS Requests
    reason: 'Alternate relay on the same host: operators who open a devtunnel often also fall back to cloudflared, so a second tunneling-provider DNS resolution in the window signals deliberate covert tunnelling rather than incidental dev activity.'
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: 'What gets routed through the tunnel: an SSH utility forwarding RDP over a reverse tunnel on this host exposes an internal service out the same devtunnels egress, expanding the C2 channel into interactive remote access.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dev Tunnels / VS Code tunnel client process and arguments on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_image:/.*\\([Cc][Oo][Dd][Ee]-[Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee]|[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound connection to the Dev Tunnels / VS Code tunnel relay on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*\.[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm]/)
    pivot_on:
    - host
    window: 1h
  - name: Tunnel installed as a persistent service on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll] .*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll]-[Rr][Uu][Nn].*/
    pivot_on:
    - host
    window: 2h
  - name: Interactive shell spawned through a VS Code tunnel server on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ee][Rr][Ss]\\[Ss][Tt][Aa][Bb][Ll][Ee]-.*/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Ll]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same tunnel relay (campaign footprint)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
