name: DNS Query Request By Regsvr32.EXE
id: 36e037c4-c228-4866-b6a3-48eb292b9955
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Dmitriy Lifanov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36e037c4-c228-4866-b6a3-48eb292b9955
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries initiated by "Regsvr32.exe". MITRE ATT&CK: T1559.001,
  T1218.010.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\regsvr32.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_queryName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_image matches
  '*\regsvr32.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2017/05/11/applocker-bypass-regsvr32/
  - https://oddvar.moe/2017/12/13/applocker-case-study-how-insecure-is-it-really-part-1/
  - https://attack.mitre.org/techniques/T1559/001/
  - https://attack.mitre.org/techniques/T1218/010/

response:
  message: >
    DNS Query Request By Regsvr32.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_queryName: $data_win_eventdata_queryName$. MITRE ATT&CK:
    T1559.001, T1218.010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_queryName
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1559.001
    - T1218.010
  custom_tags:
    - query
    - request
    - regsvr32
    - dns_query
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c7e91a02-d771-4a6d-a700-42587e0b1095
    name: Network Connection Initiated By Regsvr32.EXE
    reason: 'The connect half of the resolve-then-connect pair this rule opens: the same regsvr32 process on the same host, moments later, egressing to the IP this DNS query just resolved. Confirms the lookup led to a real C2/download reach and gives the destinationIp to pivot on threat intel.'
  - id: 867356ee-9352-41c9-a8f2-1be690d78216
    name: Potentially Suspicious Regsvr32 HTTP/FTP Pattern
    reason: 'The EID 1 process-creation form of what drove this lookup: regsvr32 launched with /i and an http/ftp URL (Squiblydoo). EID 22 carries no command line, so this is where the full download URL and the parent that spawned regsvr32 are recovered.'
  - id: 2dd2c217-bf68-437a-b57c-fe9fd01d5de8
    name: Potentially Suspicious Regsvr32 HTTP IP Pattern
    reason: The same /i:http://<IP> download command but aimed at a bare IP with no DNS. If it also fired on this host, regsvr32 is reaching a second, DNS-less endpoint beside the domain this rule resolved - distinct attacker infrastructure.
  - id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
    name: Potential Regsvr32 Commandline Flag Anomaly
    reason: 'The /i: without /n Squiblydoo flag fingerprint on regsvr32''s command line - exactly the combination that makes regsvr32 fetch a remote scriptlet and therefore resolve this domain. Confirms the lookup is a deliberate remote-scriptlet pull, not benign DLL registration.'
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: regsvr32 loading scrobj.dll (Script Component Runtime), the engine that executes remote .sct scriptlets over HTTP. scrobj is what reaches out, so its presence on this host is the execution mechanism behind this DNS query - an AppLocker/WDAC bypass in progress.
  - id: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
    name: Scripting/CommandLine Process Spawned Regsvr32
    reason: 'The parent-chain precursor: a script host (powershell/wscript/cscript/cmd/mshta) spawning this regsvr32 - the macro/script-to-LOLBin hand-off that typically immediately precedes the remote-scriptlet download this lookup belongs to.'
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: 'The follow-on: regsvr32 normally spawns nothing, so a child (powershell/mshta/cmd/wscript/net/schtasks) on this host after the resolve-and-connect is the downloaded scriptlet executing its next stage - discovery, persistence, or a second payload.'
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: 'A delivery-chain precursor: a malicious .hta run by mshta.exe spawning this regsvr32 (the Squiblydoo/SquiblyTwo COM-scriptlet pattern of Trickbot/IcedID loaders). Explains how the host reached a network-bound regsvr32 and ties the lookup back to initial-access phishing.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Recover the regsvr32 Squiblydoo command line and parent for this lookup (EID 1)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Oo][Bb][Jj].*/ OR data_win_eventdata_commandLine:/.*\/[Ii]:.*/ OR data_win_eventdata_commandLine:/.*-[Ii]:.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: scrobj.dll (Script Component Runtime) image load on this host - confirms remote-scriptlet engine
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ss][Cc][Rr][Oo][Bb][Jj]\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connection by regsvr32 on this host (the connect behind this resolve)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Child process spawned by regsvr32 on this host (downloaded scriptlet executing next stage)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same domain (campaign spread)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
