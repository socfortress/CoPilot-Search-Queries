name: DNS Query Request By Regsvr32.EXE
id: 36e037c4-c228-4866-b6a3-48eb292b9955
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Dmitriy Lifanov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36e037c4-c228-4866-b6a3-48eb292b9955
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries initiated by "Regsvr32.exe". MITRE ATT&CK: T1559.001,
  T1218.010.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\regsvr32.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_queryName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_image matches
  '*\regsvr32.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2017/05/11/applocker-bypass-regsvr32/
  - https://oddvar.moe/2017/12/13/applocker-case-study-how-insecure-is-it-really-part-1/
  - https://attack.mitre.org/techniques/T1559/001/
  - https://attack.mitre.org/techniques/T1218/010/

response:
  message: >
    DNS Query Request By Regsvr32.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_queryName: $data_win_eventdata_queryName$. MITRE ATT&CK:
    T1559.001, T1218.010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_queryName
      type: domain

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1559.001
    - T1218.010
  custom_tags:
    - query
    - request
    - regsvr32
    - dns_query
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

