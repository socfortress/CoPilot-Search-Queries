name: DNS Query To MEGA Hosting Website
id: 613c03ba-0779-4a53-8a1f-47f914a4ded3
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Aaron Greetham (@beardofbinary) - NCC Group
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 613c03ba-0779-4a53-8a1f-47f914a4ded3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries for subdomains related to MEGA sharing website. MITRE
  ATT&CK: T1567.002.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_queryName:
              value: "*userstorage.mega.co.nz*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*userstorage.mega.co.nz*'.

known_false_positives: >
  Legitimate DNS queries and usage of Mega. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://research.nccgroup.com/2021/05/27/detecting-rclone-an-effective-tool-for-exfiltration/
  - https://attack.mitre.org/techniques/T1567/002/

response:
  message: >
    DNS Query To MEGA Hosting Website detected on host $agent_name$. Matched
    data_win_eventdata_queryName: $data_win_eventdata_queryName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1567.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567.002
  custom_tags:
    - query
    - hosting
    - website
    - dns_query
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Uu][Ss][Ee][Rr][Ss][Tt][Oo][Rr][Aa][Gg][Ee]\.[Mm][Ee][Gg][Aa]\.[Cc][Oo]\.[Nn][Zz].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
    name: Renamed MegaSync Execution
    reason: MEGAsync is MEGA's own desktop client and resolves userstorage.mega.co.nz for its uploads, so this DNS hit is frequently MEGAsync itself; a renamed copy is the operator hiding the exfil client that generated this very lookup.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: rclone is the canonical tool for pushing staged data to MEGA (this rule's own NCC reference is about rclone), and its command line literally names a 'mega' remote; its execution on the host is the process that drives this DNS resolution.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: 'rclone copy/sync to a mega: remote with --config/--transfers is the transfer that produces the userstorage.mega.co.nz lookup; seeing the copy command confirms this DNS is an active rclone exfil, not a browser visit.'
  - id: 6dca1124-b3ec-11eb-9328-acde48001122
    name: Detect Renamed RClone
    reason: operators routinely rename rclone to evade image-name detection before MEGA exfil; this originalFileName-based rule catches the same exfil binary when the image-path rules miss it, pairing with the DNS as cause-and-effect.
  - id: 34986307-b7f4-49be-92f3-e7a4d01ac5db
    name: Rclone Config File Creation
    reason: the rclone config (defining the MEGA remote and stored credentials) is written to disk immediately before the first copy, so this file-create is the direct setup step that precedes the upload triggering this DNS.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: data is collected into a password-protected 7-Zip archive as the staging step right before cloud egress; this is the collection half of the collection-then-exfiltrate sequence this MEGA DNS completes.
  - id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
    name: Compress Data and Lock With Password for Exfiltration With WINZIP
    reason: same password-protected archive staging via WinZip; a bundled, encrypted archive appearing on the host shortly before the MEGA lookup is the payload being prepared for this upload.
  - id: 065cceea-77ec-4030-9052-fc0affea7110
    name: DNS Query for Anonfiles.com Domain - Sysmon
    reason: sibling file-sharing exfil-DNS detection; operators commonly attempt several anonymous upload services on one host in a single operation, so an anonfiles lookup near this MEGA lookup signals the same exfil actor trying multiple channels.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound connection to MEGA from this host (upload confirmation)
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationHostname:/.*[Mm][Ee][Gg][Aa]\.[Cc][Oo]\.[Nn][Zz].*/
    pivot_on:
    - host
    window: 1h
  - name: Rclone / MEGAcmd / MEGAsync exfil tooling on this host (incl. renamed)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd][Ss][Ee][Rr][Vv][Ee][Rr]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Mm][Ee][Gg][Aa][Cc][Ll][Ii][Ee][Nn][Tt]|[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*([Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa][Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa]:.*/)
    pivot_on:
    - host
    window: 2h
  - name: Data staged into password-protected / large archives before egress
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Aa]|7[Zz][Rr]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Ww][Ii][Nn][Zz][Ii][Pp]|[Ww][Zz][Zz][Ii][Pp]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb])\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*(7[Zz]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Zz][Ii][Pp])\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(7[Zz]|[Rr][Aa][Rr]|[Zz][Ii][Pp]|[Tt][Aa][Rr]|[Gg][Zz]|001)/)
    pivot_on:
    - host
    window: 2h
  - name: Other cloud-storage / file-sharing exfil destinations resolved on this host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_queryName:/.*[Dd][Rr][Oo][Pp][Bb][Oo][Xx].*/ OR data_win_eventdata_queryName:/.*[Mm][Ee][Dd][Ii][Aa][Ff][Ii][Rr][Ee].*/ OR data_win_eventdata_queryName:/.*[Ww][Ee][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_queryName:/.*[Pp][Cc][Ll][Oo][Uu][Dd].*/ OR data_win_eventdata_queryName:/.*[Gg][Oo][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_queryName:/.*[Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_queryName:/.*[Ss][Ee][Nn][Dd][Ss][Pp][Aa][Cc][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: Other hosts resolving or connecting to MEGA (exfil blast radius)
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Mm][Ee][Gg][Aa]\.[Cc][Oo]\.[Nn][Zz].*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationHostname:/.*[Mm][Ee][Gg][Aa]\.[Cc][Oo]\.[Nn][Zz].*/)
    pivot_on:
    - domain
    window: 24h
