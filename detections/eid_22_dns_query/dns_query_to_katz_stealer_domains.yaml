name: DNS Query To Katz Stealer Domains
id: 9c3d6e32-f4c8-4d73-8b8f-95c3b383a13c
version: 1
schema_version: "1.0"
date: "2025-05-22"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9c3d6e32-f4c8-4d73-8b8f-95c3b383a13c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries to domains associated with Katz Stealer malware. Katz
  Stealer is a malware variant that is known to be used for stealing sensitive
  information from compromised systems. In Enterprise environments, DNS queries
  to these domains may indicate potential malicious activity or compromise.
  MITRE ATT&CK: T1071.004.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*katz-panel.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*katz-stealer.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*katzstealer.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*twist2katz.com*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*katz-panel.com*'; data_win_eventdata_queryName matches '*katz-stealer.com*';
  data_win_eventdata_queryName matches '*katzstealer.com*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1071/004/

response:
  message: >
    DNS Query To Katz Stealer Domains detected on host $agent_name$. Matched
    data_win_eventdata_queryName: $data_win_eventdata_queryName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1071.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.004
  custom_tags:
    - query
    - stealer
    - domains
    - dns_query
    - sysmon
    - command_and_control
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Kk][Aa][Tt][Zz]-[Pp][Aa][Nn][Ee][Ll]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Kk][Aa][Tt][Zz]-[Ss][Tt][Ee][Aa][Ll][Ee][Rr]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Kk][Aa][Tt][Zz][Ss][Tt][Ee][Aa][Ll][Ee][Rr]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Tt][Ww][Ii][Ss][Tt]2[Kk][Aa][Tt][Zz]\.[Cc][Oo][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e6c7ab7c-c79d-4b84-b913-b2ec3f8e8a98
    name: Katz Stealer DLL Loaded
    reason: 'Same malware family (same author/campaign): confirms the beaconing host is running Katz by catching its payload DLLs (katz_ontop.dll / Temp\received_dll.dll) being loaded. The DNS beacon and this image-load are the same infection seen from two sensors.'
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'Katz''s core objective in action: copying Chromium/Gecko browser credential stores (\User Data, Login Data) via esentutl/robocopy/copy. If this fires on the same host near the beacon it is the stolen data being collected before exfil.'
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: The same browser-credential theft via PowerShell reading \User Data\Default\Login Data. Confirms the stealer is harvesting saved passwords on the beaconing host (T1555.003).
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: 'Precursor loader stage: Katz is delivered by an obfuscated PowerShell loader that reflectively loads the .NET stealer into memory (T1620). Firing before the beacon reconstructs how the payload got resident.'
  - id: c3dbbc9f-ef1d-470a-a90a-d343448d5875
    name: Suspicious Non-Browser Network Communication With Telegram API
    reason: 'Parallel exfil channel: stealers routinely ship harvested credentials/tokens to a Telegram bot. A non-browser process talking to the Telegram API on the same host is the loot leaving alongside the panel beacon (T1567).'
  - id: 613c03ba-0779-4a53-8a1f-47f914a4ded3
    name: DNS Query To MEGA Hosting Website
    reason: 'Exfil-to-cloud destination (T1567.002): the stolen-data archive is commonly uploaded to MEGA. On the same host this is the follow-on exfil the panel beacon is coordinating.'
  - id: b55ca2a3-7cff-4dda-8bdd-c7bfa63bf544
    name: DNS Query Tor .Onion Address - Sysmon
    reason: 'Alternate/backup C2 path (T1090.003): an infected host also resolving a .onion address indicates the same implant falling back to Tor for command-and-control when the clearnet panel is unreachable.'
  - id: f8c1e80b-c73a-476a-ae24-6c72528b1521
    name: DNS Query To Common Malware Hosting and Shortener Services
    reason: 'Delivery/staging precursor: the dropper that installed Katz typically pulls its next stage through TryCloudflare/Workers/URL-shortener domains, and these are also used as C2 redirects for the same campaign (T1071.004).'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Infostealer collection: browser, crypto-wallet and messaging-app stores touched on this host'
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ww][Aa][Ll][Ll][Ee][Tt]\.[Dd][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\\[Ee][Xx][Oo][Dd][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ee][Vv][Ee][Ll][Dd][Bb].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Ww][Aa][Ll][Ll][Ee][Tt]\.[Dd][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Ee][Xx][Oo][Dd][Uu][Ss].*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Ee][Vv][Ee][Ll][Dd][Bb].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Outbound C2 / exfil connections by processes running from user-writable paths on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/)
    pivot_on:
    - host
    window: 1h
  - name: Autostart persistence written on this host (Run keys, scheduled task, Startup folder)
    query: ((data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].* [Aa][Dd][Dd].*[Rr][Uu][Nn].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: 'Loader chain: script-interpreter-spawned stage or encoded/reflective PowerShell on this host'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.* -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn].*/) OR (data_win_eventdata_parentImage:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Bb][Uu][Ii][Ll][Dd]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]|[Rr][Ee][Gg][Aa][Ss][Mm])\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 4h
  - name: 'Blast radius: other hosts resolving or connecting to this Katz C2 / panel domain'
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
