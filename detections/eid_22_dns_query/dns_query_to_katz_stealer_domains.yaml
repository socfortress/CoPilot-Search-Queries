name: DNS Query To Katz Stealer Domains
id: 9c3d6e32-f4c8-4d73-8b8f-95c3b383a13c
version: 1
schema_version: "1.0"
date: "2025-05-22"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9c3d6e32-f4c8-4d73-8b8f-95c3b383a13c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries to domains associated with Katz Stealer malware. Katz
  Stealer is a malware variant that is known to be used for stealing sensitive
  information from compromised systems. In Enterprise environments, DNS queries
  to these domains may indicate potential malicious activity or compromise.
  MITRE ATT&CK: T1071.004.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*katz-panel.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*katz-stealer.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*katzstealer.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*twist2katz.com*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*katz-panel.com*'; data_win_eventdata_queryName matches '*katz-stealer.com*';
  data_win_eventdata_queryName matches '*katzstealer.com*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1071/004/

response:
  message: >
    DNS Query To Katz Stealer Domains detected on host $agent_name$. Matched
    data_win_eventdata_queryName: $data_win_eventdata_queryName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1071.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.004
  custom_tags:
    - query
    - stealer
    - domains
    - dns_query
    - sysmon
    - command_and_control
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Kk][Aa][Tt][Zz]-[Pp][Aa][Nn][Ee][Ll]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Kk][Aa][Tt][Zz]-[Ss][Tt][Ee][Aa][Ll][Ee][Rr]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Kk][Aa][Tt][Zz][Ss][Tt][Ee][Aa][Ll][Ee][Rr]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Tt][Ww][Ii][Ss][Tt]2[Kk][Aa][Tt][Zz]\.[Cc][Oo][Mm].*/)

