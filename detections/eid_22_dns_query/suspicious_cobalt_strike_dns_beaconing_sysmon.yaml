name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
id: f356a9c4-effd-4608-bbf8-408afd5cd006
version: 1
schema_version: "1.0"
date: "2023-01-16"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f356a9c4-effd-4608-bbf8-408afd5cd006
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a program that invoked suspicious DNS queries known from Cobalt Strike
  beacons. MITRE ATT&CK: T1071.004.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "aaa.stage.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "post.1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.stage.123456.*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  'aaa.stage.*'; data_win_eventdata_queryName matches 'post.1*';
  data_win_eventdata_queryName matches '*.stage.123456.*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.icebrg.io/blog/footprints-of-fin7-tracking-actor-patterns
  - https://www.sekoia.io/en/hunting-and-detecting-cobalt-strike/
  - https://attack.mitre.org/techniques/T1071/004/

response:
  message: >
    Suspicious Cobalt Strike DNS Beaconing - Sysmon detected on host
    $agent_name$. Matched data_win_eventdata_queryName:
    $data_win_eventdata_queryName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1071.004
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.004
  custom_tags:
    - cobalt
    - strike
    - beaconing
    - dns_query
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/[Aa][Aa][Aa]\.[Ss][Tt][Aa][Gg][Ee]\..*/ OR data_win_eventdata_queryName:/[Pp][Oo][Ss][Tt]\.1.*/ OR data_win_eventdata_queryName:/.*\.[Ss][Tt][Aa][Gg][Ee]\.123456\..*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Same beacon, different channel: a CS implant beaconing over DNS also drops default named pipes (postex_, msagent_, status_) on the host. A hit here is independent confirmation the same host runs a live Cobalt Strike beacon.'
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: The DNS names this rule matches and these pipe names both originate in CS malleable-C2 profiles; a matching pipe on the same host corroborates one Cobalt Strike implant rather than two coincidences.
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'The loader step that stands the beacon up: CS injects its beacon shellcode via CreateRemoteThread. On the beaconing host this is how the DNS-C2 implant got into a process - the precursor to this alert.'
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Beacon delivery: rundll32 StartW loading the CS DLL is a frequent first-execution path for the implant now beaconing over DNS. Immediate precursor telemetry on the same host.'
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: CS default spawnto / child-process lineage the beacon exhibits while running. Co-occurring confirmation that the implant generating this DNS C2 is active on the host.
  - id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
    name: Potential CobaltStrike Service Installations - Registry
    reason: 'The operator''s next move through the beacon: CS getsystem / jump-psexec writes a malicious service. Appearing after DNS C2 is established, it signals privilege escalation or lateral movement from this beacon.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Classic post-beacon action: once C2 is live the operator runs mimikatz / logonpasswords, producing suspicious LSASS handle access on the same host. The expected credential-harvest follow-on.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'The CS-to-ransomware endgame: crews that land a Cobalt Strike beacon routinely delete volume shadow copies (vssadmin/wmic) right before encryption. On a beaconing host this is a high-urgency sign of imminent impact.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CobaltStrike named-pipe C2 / post-exploitation channel on this host
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/\\[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/\\[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/\\[Ss][Tt][Aa][Tt][Uu][Ss]_.*/ OR (data_win_eventdata_pipeName:/.*[Mm][Ss][Ss][Ee]-.*/ AND data_win_eventdata_pipeName:/.*-[Ss][Ee][Rr][Vv][Ee][Rr].*/) OR data_win_eventdata_pipeName:/\\[Mm][Yy][Pp][Ii][Pp][Ee]-[FfHh].*/ OR data_win_eventdata_pipeName:/\\[Ww][Ii][Nn]_[Ss][Vv][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential-dumping handle access on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/.*0[Xx]1010.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1038.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1410.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]143[Aa].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/)
    pivot_on:
    - host
    window: 4h
  - name: Beacon process injection (CreateRemoteThread) on this host
    query: data_win_system_eventID:"8" AND ((data_win_eventdata_startAddress:/.*0[Bb]80/ OR data_win_eventdata_startAddress:/.*0[Cc]7[Cc]/ OR data_win_eventdata_startAddress:/.*0[Cc]88/) OR data_win_eventdata_sourceImage:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: Interpreter / LOLBin outbound C2 connections on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same C2 domain (campaign spread)
    query: data_win_system_eventID:"22" OR data_win_system_eventID:"3"
    pivot_on:
    - domain
    window: 24h
