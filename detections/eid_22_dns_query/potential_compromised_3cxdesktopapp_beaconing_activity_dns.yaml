                    value: "*pbxcloudeservices.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*pbxphonenetwork.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*pbxsources.com*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
