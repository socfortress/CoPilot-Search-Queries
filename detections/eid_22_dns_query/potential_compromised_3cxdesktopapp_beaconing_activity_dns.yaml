98\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Ss][Bb][Mm][Ss][Aa]\.[Ww][Ii][Kk][Ii].*/ OR data_win_eventdata_queryName:/.*[Ss][Oo][Uu][Rr][Cc][Ee][Ss][Ll][Aa][Bb][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo][Ff][Aa][Cc][Tt][Oo][Rr][Yy]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Zz][Aa][Cc][Hh][Aa][Rr][Rr][Yy][Bb][Ll][Oo][Gg][Ss]\.[Cc][Oo][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d0b65ad3-e945-435e-a7a9-438e62dd48e9
    name: Malicious DLL Load By Compromised 3CXDesktopApp
    reason: 'Root-cause confirmation on the same host: trojanized 3CXDesktopApp.exe side-loads the malicious ffmpeg.dll / d3dcompiler_47.dll (matched by known-bad hash) that performs this very DNS beaconing. If both fire on one host, the C2 lookup is the real compromise, not a benign resolver hit.'
  - id: 51eecf75-d069-43c7-9ea2-63f75499edd4
    name: Potential Compromised 3CXDesktopApp Beaconing Activity - Netcon
    reason: 'Co-occurring twin of this detection: the same 3CX C2 domains seen as an outbound network connection (Sysmon EID 3) instead of a DNS query (EID 22). Confirms the resolved beacon domain was actually contacted, escalating a lookup into established C2.'
  - id: 93bbde78-dc86-4e73-9ffc-ff8a384ca89c
    name: Potential Compromised 3CXDesktopApp Execution
    reason: 'Identifies the process that owns this beacon: a known-compromised 3CXDesktopApp build executing on the host. Ties the DNS C2 lookup to the trojanized client rather than an unrelated application.'
  - id: e7581747-1e44-4d4b-85a6-0db0b4a00f2a
    name: Potential Compromised 3CXDesktopApp Update Activity
    reason: 'Delivery precursor: the 3CX updater downloading a known-compromised build is how the trojan reached this host via the poisoned official update channel (SmoothOperator). Explains why the beaconing software is present.'
  - id: 63f3605b-979f-48c2-b7cc-7f90523fed88
    name: Potential Suspicious Child Process Of 3CXDesktopApp
    reason: 'Follow-on second-stage execution: the trojan spawning unexpected children from 3CXDesktopApp.exe indicates the beacon succeeded and a downloaded payload is now running on the endpoint.'
  - id: 553d0429-1a1c-44bf-b3f5-a8513deb9ee5
    name: Hunting 3CXDesktopApp Software
    reason: 'Establishes the vulnerable-software footprint: any 3CXDesktopApp presence on the host, including the confirmed-compromised 18.12.407/18.12.416 builds. Scopes whether this endpoint runs an affected version worth prioritizing.'
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'Campaign objective / follow-on: the 3CX second stage (ICONIC infostealer) reads browser credential and history stores (T1555.003) from Chrome/Edge/Brave/Firefox. This is the expected next action once the beacon establishes C2.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 3CX trojan side-loaded DLLs (ffmpeg.dll / d3dcompiler_47.dll) loaded on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Ff][Ff][Mm][Pp][Ee][Gg]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Dd]3[Dd][Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]_47\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: 3CXDesktopApp resolving the GitHub ICO dead-drop (first-stage C2 config)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_queryName:/.*[Gg][Ii][Tt][Hh][Uu][Bb][Uu][Ss][Ee][Rr][Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm].*/)
    pivot_on:
    - host
    window: 6h
  - name: Second-stage shell / LOLBin children spawned by 3CXDesktopApp
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Browser credential-store / profile DB access (ICONIC infostealer objective)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr].[Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn].[Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ll][Aa][Cc][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Yy]4\.[Dd][Bb].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn].[Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Pp][Ll][Aa][Cc][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee].*/ OR data_win_eventdata_targetFilename:/.*[Kk][Ee][Yy]4\.[Dd][Bb].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn].*/))
    pivot_on:
    - host
    window: 4h
  - name: Other endpoints beaconing to the same 3CX C2 domain (campaign blast radius)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
