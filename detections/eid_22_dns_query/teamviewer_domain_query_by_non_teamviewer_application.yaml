name: TeamViewer Domain Query By Non-TeamViewer Application
id: 778ba9a8-45e4-4b80-8e3e-34a419f0b85e
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 778ba9a8-45e4-4b80-8e3e-34a419f0b85e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries to a TeamViewer domain only resolved by a TeamViewer
  client by an image that isn't named TeamViewer (sometimes used by threat
  actors for obfuscation). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_queryName:
                    value: "taf.teamviewer.com"
                    case_insensitive: true
              - term:
                  data_win_eventdata_queryName:
                    value: "udp.ping.teamviewer.com"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*TeamViewer*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName equals
  'taf.teamviewer.com'; data_win_eventdata_queryName equals
  'udp.ping.teamviewer.com'; data_win_eventdata_image matches '*TeamViewer*'.

known_false_positives: >
  Unknown binary names of TeamViewer. Depending on the environment the rule
  might require some initial tuning before usage to avoid FP with third party
  applications. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.teamviewer.com/en-us/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    TeamViewer Domain Query By Non-TeamViewer Application detected on host
    $agent_name$. Matched data_win_eventdata_queryName:
    $data_win_eventdata_queryName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - teamviewer
    - domain
    - query
    - dns_query
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/[Tt][Aa][Ff]\.[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/[Uu][Dd][Pp]\.[Pp][Ii][Nn][Gg]\.[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]\.[Cc][Oo][Mm]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: 'Generalised twin of this detection: the same disguised binary that resolved TeamViewer''s backend (taf/udp.ping.teamviewer.com) under a non-TeamViewer name will also resolve other RMM infrastructure (AnyDesk, ScreenConnect, LogMeIn, Splashtop) by an unexpected process. Fires on the identical T1219.002 behaviour with a wider domain net on the same host.'
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: 'Process-creation confirmation of what made the DNS query: matches a binary''s PE Product metadata against 194 remote-access/RMM signatures (TeamViewer included), so it identifies the renamed/disguised TeamViewer EXE by its embedded version info even though its filename is faked. This names the actual image, path, parent and command line behind the alert.'
  - id: 162ab1e4-6874-4564-853c-53ec3ab8be01
    name: TeamViewer Remote Session
    reason: 'Follow-on proof the remote-access channel actually went live: detects TeamViewer session log/print-DB artefacts (TVPrint.db) written on the host. DNS alone shows a handshake attempt; this confirms an interactive TeamViewer session was established on the same endpoint.'
  - id: 9711de76-5d4f-4c50-a94f-21e4e8f8384d
    name: Installation of TeamViewer Desktop
    reason: 'Decision-relevant context on the same host: TeamViewer_Desktop.exe creation shows a full TeamViewer client being installed around the same time, which either explains the query as a legitimate TeamViewer presence (FP triage) or shows the attacker deploying the real client alongside the disguised component.'
  - id: 9ef27c24-4903-4192-881a-3adde7ff92a5
    name: Renamed Remote Utilities RAT (RURAT) Execution
    reason: Same disguise-by-rename TTP (detects RURAT by PE Product header despite a renamed EXE). A host already running one remote-access tool under a false filename frequently runs more; this catches a renamed RuRAT sibling of the same RMM-abuse intrusion.
  - id: b471f462-eb0d-4832-be35-28d94bdb4780
    name: Remote Access Tool - Renamed MeshAgent Execution - Windows
    reason: Renamed-RMM sibling with the exact obfuscation behaviour this alert describes (MeshAgent run under an altered name to bypass name-based blocking). Co-occurs in intrusions that stage remote-access tooling under disguised binaries on the same host.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: AnyDesk is the remote-access tool most frequently stacked with TeamViewer by the same actor for redundant hands-on-keyboard access. Its execution on the same host within the window points to an RMM-abuse foothold rather than a one-off TeamViewer query.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Another RMM commonly co-deployed in the same intrusions as abused TeamViewer; ScreenConnect execution on the same host within the window corroborates deliberate remote-access tooling being planted rather than benign support activity.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote-access / RMM software executed on this host (incl. renamed)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_product:/.*([Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ww][Ii][Ss][Ee]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Rr][Ee][Mm][Oo][Tt][Ee] [Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss]|[Rr][Uu][Ss][Tt][Dd][Ee][Ss][Kk]|[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]|[Rr][Aa][Dd][Mm][Ii][Nn]|[Aa][Mm][Mm][Yy][Yy])/ OR data_win_eventdata_description:/.*([Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp])/ OR data_win_eventdata_image:/.*\\([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Rr][Uu][Tt][Ss][Ee][Rr][Vv]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Network session to remote-access infrastructure from this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5938" OR data_win_eventdata_destinationHostname:/.*([Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn])/ OR data_win_eventdata_image:/.*\\([Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Rr][Uu][Tt][Ss][Ee][Rr][Vv])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Delivery of the disguised binary: downloader LOLBin or archive extraction on this host'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Hh][Tt][Tt][Pp]|[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee])/) OR data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr])/ OR data_win_eventdata_image:/.*\\(7[Zz]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Rr][Aa][Rr]|[Pp][Ee][Aa][Zz][Ii][Pp]|7[Zz][Rr]|7[Zz][Gg])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: 'Persistence: remote-access tool wired to auto-start on this host'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn].[Rr][Uu][Nn])/ AND data_win_eventdata_commandLine:/.*([Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Rr][Uu][Tt][Ss][Ee][Rr][Vv]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp])/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn].*[Rr][Uu][Nn].*/ AND data_win_eventdata_details:/.*([Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt])/)
    pivot_on:
    - host
    window: 6h
  - name: 'Campaign: other hosts resolving this TeamViewer backend domain from a non-TeamViewer process'
    query: data_win_system_eventID:"22" AND _exists_:data_win_eventdata_image AND NOT data_win_eventdata_image:/.*[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr].*/
    pivot_on:
    - domain
    window: 24h
