correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: 'Same-host confirmation: this rule fires on the DNS lookup alone, while that one catches the RMM/remote-access binary itself executing (matched by PE Product metadata across the same vendor set). Both on one host proves a real tool ran, not a stray resolution, and names which tool.'
  - id: 778ba9a8-45e4-4b80-8e3e-34a419f0b85e
    name: TeamViewer Domain Query By Non-TeamViewer Application
    reason: 'Near-sibling on the same Sysmon EID 22 telemetry and T1219.002 masquerade pattern: a non-matching image resolving an RMM vendor (TeamViewer) domain. A masquerading binary querying a TeamViewer domain trips both; co-firing hardens the finding.'
  - id: 2db93a3f-3249-4f73-9e68-0e77a0f8ae7e
    name: Remote Access Tool - TacticalRMM Agent Registration to Potentially Attacker-Controlled Server
    reason: 'Likely cause of the phone-home: a TacticalRMM agent being registered to an attacker-controlled server (--api/--auth flags) generates exactly this kind of outbound RMM DNS lookup/beacon on the host.'
  - id: 0b9ad457-2554-44c1-82c2-d56a99c42377
    name: Anydesk Temporary Artefact
    reason: 'Fresh-install discriminator: AnyDesk writing its temp artefacts on the same host shows the queried tool (net.anydesk.com is in this rule) was just dropped or run, separating an attacker drop from a long-standing sanctioned agent.'
  - id: fec96f39-988b-4586-b746-b93d59fd1922
    name: ScreenConnect Temporary Installation Artefact
    reason: 'Fresh-install discriminator for ScreenConnect/ConnectWise (relay.screenconnect.com and control.connectwise.com are in this rule''s domain list): temporary install artefacts mean a freshly staged client rather than managed RMM.'
  - id: 37e8d358-6408-4853-82f4-98333fca7014
    name: Remote Access Tool - NetSupport Execution From Unusual Location
    reason: 'Malicious-vs-sanctioned signal: NetSupport (netsupportsoftware.com) client32.exe running from outside Program Files is the RAT-style deployment attackers use, confirming the queried domain is hostile rather than help-desk.'
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: 'Persistence follow-on: the queried RMM being registered as a Windows service (Service Control Manager, System log) is how attackers make the remote-access channel survive reboot.'
  - id: c8b00925-926c-47e3-beea-298fd563728e
    name: Remote Access Tool Services Have Been Installed - Security
    reason: Same persistence follow-on observed via the Security log (service-install 4697), covering hosts that forward Security but not System so the persistence step is still seen.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote-access / RMM binary executing on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ww][Ii][Ss][Ee]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Aa][Tt][Ee][Rr][Aa]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]|[Rr][Uu][Ss][Tt][Dd][Ee][Ss][Kk]|[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Zz][Oo][Hh][Oo]|\\[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]|\\[Rr][Ff][Uu][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt]|[Rr][Ee][Mm][Oo][Tt][Ee][Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss]|\\[Dd][Ww][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Tt][Aa][Ii][Ll][Ss][Cc][Aa][Ll][Ee]|[Gg][Ee][Tt][Ss][Cc][Rr][Ee][Ee][Nn]|[Rr][Ee][Mm][Oo][Tt][Ee][Pp][Cc]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: Outbound session from a remote-access / RMM binary on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ww][Ii][Ss][Ee]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Aa][Tt][Ee][Rr][Aa]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]|[Rr][Uu][Ss][Tt][Dd][Ee][Ss][Kk]|[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Zz][Oo][Hh][Oo]|\\[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]|\\[Rr][Ff][Uu][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt]|[Rr][Ee][Mm][Oo][Tt][Ee][Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss]|\\[Dd][Ww][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Tt][Aa][Ii][Ll][Ss][Cc][Aa][Ll][Ee]|[Gg][Ee][Tt][Ss][Cc][Rr][Ee][Ee][Nn]|[Rr][Ee][Mm][Oo][Tt][Ee][Pp][Cc]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: Remote-access tool freshly dropped or installed on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ww][Ii][Ss][Ee]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Aa][Tt][Ee][Rr][Aa]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]|[Rr][Uu][Ss][Tt][Dd][Ee][Ss][Kk]|[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Zz][Oo][Hh][Oo]|\\[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]|\\[Rr][Ff][Uu][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt]|[Rr][Ee][Mm][Oo][Tt][Ee][Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss]|\\[Dd][Ww][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Tt][Aa][Ii][Ll][Ss][Cc][Aa][Ll][Ee]|[Gg][Ee][Tt][Ss][Cc][Rr][Ee][Ee][Nn]|[Rr][Ee][Mm][Oo][Tt][Ee][Pp][Cc]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same remote-access domain (campaign)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
  - name: Remote-access tool launched by a suspicious parent (phishing / help-desk abuse)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]|\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]|\\[Qq][Uu][Ii][Cc][Kk][Aa][Ss][Ss][Ii][Ss][Tt]\.[Ee][Xx][Ee]).*/ AND (data_win_eventdata_image:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ww][Ii][Ss][Ee]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Aa][Tt][Ee][Rr][Aa]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]|[Rr][Uu][Ss][Tt][Dd][Ee][Ss][Kk]|[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Zz][Oo][Hh][Oo]|\\[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]|\\[Rr][Ff][Uu][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt]|[Rr][Ee][Mm][Oo][Tt][Ee][Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss]|\\[Dd][Ww][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Tt][Aa][Ii][Ll][Ss][Cc][Aa][Ll][Ee]|[Gg][Ee][Tt][Ss][Cc][Rr][Ee][Ee][Nn]|[Rr][Ee][Mm][Oo][Tt][Ee][Pp][Cc]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]).*/ OR data_win_eventdata_commandLine:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ww][Ii][Ss][Ee]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Aa][Tt][Ee][Rr][Aa]|[Ll][Oo][Gg][Mm][Ee][Ii][Nn]|\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]|[Rr][Uu][Ss][Tt][Dd][Ee][Ss][Kk]|[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Zz][Oo][Hh][Oo]|\\[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]|\\[Rr][Ff][Uu][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt]|[Rr][Ee][Mm][Oo][Tt][Ee][Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss]|\\[Dd][Ww][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Tt][Aa][Ii][Ll][Ss][Cc][Aa][Ll][Ee]|[Gg][Ee][Tt][Ss][Cc][Rr][Ee][Ee][Nn]|[Rr][Ee][Mm][Oo][Tt][Ee][Pp][Cc]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]).*/)
    pivot_on:
    - host
    window: 2h
