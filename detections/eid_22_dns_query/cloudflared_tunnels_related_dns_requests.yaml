name: Cloudflared Tunnels Related DNS Requests
id: a1d9eec5-33b2-4177-8d24-27fe754d0812
version: 1
schema_version: "1.0"
date: "2023-12-20"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a1d9eec5-33b2-4177-8d24-27fe754d0812
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS requests to Cloudflared tunnels domains. Attackers can abuse that
  feature to establish a reverse shell or persistence on a machine. MITRE
  ATT&CK: T1071.001, T1572.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*.v2.argotunnel.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*protocol-v2.argotunnel.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*trycloudflare.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_queryName:
                    value: "*update.argotunnel.com"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*.v2.argotunnel.com'; data_win_eventdata_queryName matches
  '*protocol-v2.argotunnel.com'; data_win_eventdata_queryName matches
  '*trycloudflare.com', among other conditions.

known_false_positives: >
  Legitimate use of cloudflare tunnels will also trigger this. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.guidepointsecurity.com/blog/tunnel-vision-cloudflared-abused-in-the-wild/
  - Internal Research
  - https://attack.mitre.org/techniques/T1071/001/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Cloudflared Tunnels Related DNS Requests detected on host $agent_name$.
    Matched data_win_eventdata_queryName: $data_win_eventdata_queryName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1071.001, T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.001
    - T1572
  custom_tags:
    - cloudflared
    - tunnels
    - related
    - dns_query
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*\.[Vv]2\.[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll]-[Vv]2\.[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Uu][Pp][Dd][Aa][Tt][Ee]\.[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
    name: Network Connection Initiated To Cloudflared Tunnels Domains
    reason: 'The very next event after this DNS lookup: the same argotunnel/trycloudflare host is resolved and then connected to on the wire (EID 3). Resolve-then-connect on one host confirms an active cloudflared tunnel, not a stray lookup.'
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: The `cloudflared ... tunnel run` process (with -token/-credentials-file/-config) is exactly what periodically resolves these argotunnel control-plane domains; it names the process and the specific tunnel generating this DNS.
  - id: 222129f7-f4dc-4568-b0d2-22440a9639ba
    name: Cloudflared Quick Tunnel Execution
    reason: A free TryCloudflare quick tunnel (`--url ... -no-autoupdate`) is what mints the random *.trycloudflare.com name this rule matched (Akira-observed); it explains the trycloudflare.com branch specifically.
  - id: e0c69ebd-b54f-4aed-8ae3-e3467843f3f0
    name: Renamed Cloudflared.EXE Execution
    reason: When the process behind this DNS query is not cloudflared.exe, a renamed binary is why; this DNS signature is the backstop that still fires. Both on one host means evasive cloudflared - high confidence.
  - id: fadb84f0-4e84-4f6d-a1ce-9ef2bffb6ccd
    name: Cloudflared Portable Execution
    reason: cloudflared.exe run from outside Program Files (a dropped/portable copy) is the usual staging for tunnel abuse; paired with this DNS it shows the tunnel binary was planted, not legitimately installed.
  - id: 7050bba1-1aed-454e-8f73-3f46f09ce56a
    name: Cloudflared Tunnel Connections Cleanup
    reason: A later `cloudflared tunnel cleanup` tears down and clears tunnel state - the anti-forensics bookend that marks the end of the session whose control-plane resolutions this rule caught.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: 'The payoff these tunnels are stood up for: a reverse tunnel forwarding :3389 for interactive access. Its presence shows the cloudflared tunnel is carrying hands-on-keyboard RDP, not just beaconing.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cloudflared tunnel process executed on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll] --[Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll] [Rr][Uu][Nn].*/))
    pivot_on:
    - host
    window: 2h
  - name: Cloudflared binary downloaded or dropped onto this host
    query: ((data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd].*\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd].*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]\/[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/) AND (data_win_eventdata_image:/.*\\([Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ii][Ww][Rr] ).*/)))
    pivot_on:
    - host
    window: 6h
  - name: Network connection to the Cloudflare tunnel edge (port 7844) from this host
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationPort:"7844"))
    pivot_on:
    - host
    window: 1h
  - name: Local RDP/SSH/SMB service exposed or forwarded through a tunnel on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*--[Uu][Rr][Ll].*(127\.0\.0\.1|[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|[Rr][Dd][Pp]:\/\/|[Ss][Ss][Hh]:\/\/|[Tt][Cc][Pp]:\/\/).*/ OR data_win_eventdata_commandLine:/.* -[LlRr] .*:(3389|445|5985|5986|139).*/ OR data_win_eventdata_commandLine:/.*(127\.0\.0\.1|[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]):(3389|445|5985|5986).*/))
    pivot_on:
    - host
    window: 2h
  - name: Cloudflared installed as a service or scheduled task for persistence on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee].*[Cc][Rr][Ee][Aa][Tt][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.* [Tt][Uu][Nn][Nn][Ee][Ll] .*/))
    pivot_on:
    - host
    window: 24h
