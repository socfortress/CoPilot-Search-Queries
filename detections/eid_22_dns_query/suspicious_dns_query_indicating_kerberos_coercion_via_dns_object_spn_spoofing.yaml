name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
version: 1
schema_version: "1.0"
date: "2025-06-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries containing patterns associated with Kerberos coercion
  attacks via DNS object spoofing. The pattern "1UWhRCAAAAA..BAAAA" is a
  base64-encoded signature that corresponds to a marshaled
  CREDENTIAL_TARGET_INFORMATION structure. Attackers can use this technique to
  coerce authentication from victim systems to attacker-controlled hosts. It is
  one of the strong indicators of a Kerberos coercion attack, where adversaries
  manipulate DNS records to spoof Service Principal Names (SPNs) and redirect
  authentication requests like CVE-2025-33073. MITRE ATT&CK: T1557.001, T1187.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_queryName:
              value: "*UWhRCA*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_queryName:
              value: "*BAAAA*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*UWhRCA*'; data_win_eventdata_queryName matches '*BAAAA*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025
  - https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html
  - https://attack.mitre.org/techniques/T1557/001/
  - https://attack.mitre.org/techniques/T1187/

response:
  message: >
    Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN
    Spoofing detected on host $agent_name$. Matched
    data_win_eventdata_queryName: $data_win_eventdata_queryName$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1557.001, T1187
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.001
    - T1187
  custom_tags:
    - query
    - indicating
    - kerberos
    - dns_query
    - sysmon
    - collection
    - credential_access
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_queryName:/.*[Bb][Aa][Aa][Aa][Aa].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
    name: Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation
    reason: 'Upstream root cause: the attacker plants this same marshaled CREDENTIAL_TARGET_INFORMATION blob as a dnsNode record in AD (Security 5136/5137); this DNS-query rule fires when the coerced victim later resolves that spoofed SPN name.'
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: 'Process-creation twin of this detection: the identical UWhRC..BAAAA signature in a command line (tool adding the spoofed SPN, or nslookup checking it) - if both fire on the host the coercion tooling ran locally.'
  - id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
    name: Possible PetitPotam Coerce Authentication Attempt
    reason: 'Coercion precursor: PetitPotam EFSRPC/lsarpc over IPC$ is how the victim is forced to authenticate to the spoofed SPN that this query resolves, completing the CVE-2025-33073 reflection.'
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: Alternate coercion vector (WebDAV/PrinterBug via davclnt DavSetCookie) that forces the victim's authentication which CVE-2025-33073 reflects off the spoofed DNS SPN resolved here.
  - id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
    name: HackTool - RemoteKrbRelay Execution
    reason: RemoteKrbRelay implements the DNS-SPN-spoofing Kerberos relay (CVE-2025-33073 family) that generates this crafted query name and relays the reflected authentication to the victim.
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: Sibling local-privesc tool built on the same Kerberos-relay primitive; its execution on the host means the coercion-and-reflection chain is being driven to local SYSTEM.
  - id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
    name: Potential Privilege Escalation via Local Kerberos Relay over LDAP
    reason: 'Reflection payoff on the same host: a localhost (127.0.0.1) Kerberos logon as the built-in local administrator - the elevated session the spoofed-SPN coercion is designed to yield.'
  - id: e97d9903-53b2-41fc-8cb9-889ed4093e80
    name: KrbRelayUp Service Installation
    reason: 'Cash-out/persistence follow-on: the KrbSCM service (System 7045) installed to run as SYSTEM once the Kerberos relay escalation that this DNS query is part of succeeds.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Inbound IPC$ coercion named-pipe authentication to this host
    query: data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*[Ii][Pp][Cc]\$/ AND (data_win_eventdata_relativeTargetName:/.*[Ll][Ss][Aa][Rr][Pp][Cc].*/ OR data_win_eventdata_relativeTargetName:/.*[Ee][Ff][Ss][Rr][Pp][Cc].*/ OR data_win_eventdata_relativeTargetName:/.*[Ee][Ff][Ss][Rr].*/ OR data_win_eventdata_relativeTargetName:/.*[Ss][Pp][Oo][Oo][Ll][Ss][Ss].*/ OR data_win_eventdata_relativeTargetName:/.*[Nn][Ee][Tt][Dd][Ff][Ss].*/ OR data_win_eventdata_relativeTargetName:/.*[Ss][Rr][Vv][Ss][Vv][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: Marshaled SPN signature or Kerberos-relay / ADIDNS tooling on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_commandLine:/.*[Bb][Aa][Aa][Aa][Aa].*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Mm][Oo][Tt][Ee][Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Dd][Nn][Ss][Uu][Pp][Dd][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Aa][Dd][Ii][Dd][Nn][Ss][Nn][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Nn][Ss][Tt][Oo][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Nn][Ss][Cc][Mm][Dd].*/))
    pivot_on:
    - host
    window: 1h
  - name: Localhost-reflected Kerberos network logon on this host
    query: data_win_system_eventID:"4624" AND data_win_eventdata_authenticationPackageName:/[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]/ AND data_win_eventdata_ipAddress:"127.0.0.1" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - host
    window: 1h
  - name: Privileged service installed on this host (relay cash-out)
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/.*[Kk][Rr][Bb][Ss][Cc][Mm].*/ OR data_win_eventdata_imagePath:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_imagePath:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_imagePath:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*/ OR data_win_eventdata_imagePath:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imagePath:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imagePath:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Same spoofed SPN name resolved by other hosts (campaign spread)
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_queryName:/.*[Bb][Aa][Aa][Aa][Aa].*/
    pivot_on:
    - domain
    window: 24h
