name: TanStack Supply-Chain Attack DNS Indicators
id: ac5a4e3f-7f9d-6abc-d8ea-3b4c5f6a7b8c
version: 1
schema_version: "1.0"
date: "2026-05-12"
author: Leonardo Gasparini
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ac5a4e3f-7f9d-6abc-d8ea-3b4c5f6a7b8c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries to attacker-controlled infrastructure used by the Mini
  Shai-Hulud campaign targeting TanStack npm packages along with other packages
  such as mistralai, uipath and so on. The domain git-tanstack.com (registered
  May 9, 2026) hosted secondary payloads including transformers.pyz. The
  filev2.getsession.org endpoint was used for credential exfiltration via the
  Session protocol. MITRE ATT&CK: T1071.001, T1048.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_queryName:
                    value: "git-tanstack.com"
                    case_insensitive: true
              - term:
                  data_win_eventdata_queryName:
                    value: "filev2.getsession.org"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName equals
  'git-tanstack.com'; data_win_eventdata_queryName equals
  'filev2.getsession.org'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://socket.dev/blog/tanstack-npm-packages-compromised-mini-shai-hulud-supply-chain-attack
  - https://socket.dev/supply-chain-attacks/mini-shai-hulud
  - https://safedep.io/mass-npm-supply-chain-attack-tanstack-mistral/
  - https://attack.mitre.org/techniques/T1071/001/
  - https://attack.mitre.org/techniques/T1048/

response:
  message: >
    TanStack Supply-Chain Attack DNS Indicators detected on host $agent_name$.
    Matched data_win_eventdata_queryName: $data_win_eventdata_queryName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1071.001, T1048
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.001
    - T1048
  custom_tags:
    - tanstack
    - supply
    - chain
    - dns_query
    - sysmon
    - command_and_control
    - exfiltration
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/[Gg][Ii][Tt]-[Tt][Aa][Nn][Ss][Tt][Aa][Cc][Kk]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/[Ff][Ii][Ll][Ee][Vv]2\.[Gg][Ee][Tt][Ss][Ee][Ss][Ss][Ii][Oo][Nn]\.[Oo][Rr][Gg]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9b4f3d2e-6e8c-5fab-c7d9-2a3b4e5f6a7b
    name: TanStack Supply-Chain Attack Execution Indicators - Windows
    reason: 'Same campaign, direct precursor: detects the bun.exe `run tanstack_runner.js` loader on the host - the very process chain that issues these DNS queries to git-tanstack.com / filev2.getsession.org. Both firing on one host confirms the live Mini Shai-Hulud chain rather than a stray IOC hit.'
  - id: 8a3f2c1e-5d7b-4e9a-b6c8-1f2a3d4e5f6a
    name: TanStack Supply-Chain Attack File Creation Indicators - Windows
    reason: 'Same campaign, co-occurring payload drop: router_init.js / tanstack_runner.js / .claude|.vscode\router_runtime.js are what the git-tanstack.com download writes and the loader runs, so a hit proves the DNS beacon actually delivered a payload to this host.'
  - id: 540703fb-a874-4385-a9d6-7cd1bfab268c
    name: Shai-Hulud Malware Indicators - Windows
    reason: 'Parent worm family: Mini Shai-Hulud is a variant, and the Shai-Hulud / SHA1HULUD command-line markers surface in the same intrusion - corroborates attribution and shows the worm''s own stage ran alongside the C2 DNS.'
  - id: 5299fadf-f228-4526-8274-251db1960be9
    name: Shai-Hulud Malicious Bun Execution
    reason: 'Same worm family''s payload execution: node.exe -> bun.exe running bun_environment.js (and pulling the GitHub Actions runner) is the Shai-Hulud self-propagation / CI-persistence stage riding the same supply-chain compromise that generates this DNS.'
  - id: 44030449-b0df-4c94-aae1-502359ab28ee
    name: PUA - TruffleHog Execution
    reason: 'The credential-harvest step this campaign exists for: TruffleHog is what Shai-Hulud runs to scrape npm/GitHub/cloud secrets before shipping them to filev2.getsession.org. Its execution between the two domains is the strongest confirmation of active credential theft.'
  - id: 0f60b28c-64dd-4e2c-9a63-5334d3e3a6e6
    name: Script Interpreter Spawning Credential Scanner - Windows
    reason: 'Same harvest step, parent-child precise: node/bun spawning trufflehog/gitleaks is exactly how this campaign enumerates secrets; a hit on the alerted host places the credential scan inside the loader''s own process tree.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mini Shai-Hulud loader execution on this host (bun/node running the campaign scripts)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt][Aa][Nn][Ss][Tt][Aa][Cc][Kk]_[Rr][Uu][Nn][Nn][Ee][Rr]\.[Jj][Ss].*/ OR data_win_eventdata_commandLine:/.*[Bb][Uu][Nn]_[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\.[Jj][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Oo][Uu][Tt][Ee][Rr]_[Ii][Nn][Ii][Tt]\.[Jj][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Uu][Pp]_[Bb][Uu][Nn]\.[Jj][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Oo][Uu][Tt][Ee][Rr]_[Rr][Uu][Nn][Tt][Ii][Mm][Ee]\.[Jj][Ss].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Secret-scanner / credential-harvest execution on this host (TruffleHog, gitleaks)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]|[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound C2 / exfil connections by package-manager interpreters on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]|\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]|\\[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]|\\[Pp][Yy][Tt][Hh][Oo][Nn]3\.[Ee][Xx][Ee]|\\[Pp][Yy][Tt][Hh][Oo][Nn][Ww]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Pp][Mm]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Secondary Python zipapp payload (transformers.pyz) executed on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]|\\[Pp][Yy][Tt][Hh][Oo][Nn]3\.[Ee][Xx][Ee]|\\[Pp][Yy][Tt][Hh][Oo][Nn][Ww]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*\.[Pp][Yy][Zz].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Oo][Rr][Mm][Ee][Rr][Ss]\.[Pp][Yy][Zz].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to the same campaign domain (spread)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
