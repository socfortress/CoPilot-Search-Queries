name: DNS Query for Anonfiles.com Domain - Sysmon
id: 065cceea-77ec-4030-9052-fc0affea7110
version: 1
schema_version: "1.0"
date: "2023-01-16"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 065cceea-77ec-4030-9052-fc0affea7110
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DNS queries for "anonfiles.com", which is an anonymous file upload
  platform often used for malicious purposes. MITRE ATT&CK: T1567.002.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_queryName:
              value: "*.anonfiles.com*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*.anonfiles.com*'.

known_false_positives: >
  Rare legitimate access to anonfiles.com. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.trendmicro.com/vinfo/us/security/news/ransomware-spotlight/ransomware-spotlight-blackbyte
  - https://attack.mitre.org/techniques/T1567/002/

response:
  message: >
    DNS Query for Anonfiles.com Domain - Sysmon detected on host $agent_name$.
    Matched data_win_eventdata_queryName: $data_win_eventdata_queryName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1567.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567.002
  custom_tags:
    - query
    - anonfiles
    - domain
    - dns_query
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*\.[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]\.[Cc][Oo][Mm].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e0f8ab85-0ac9-423b-a73a-81b3c7b1aa97
    name: Network Communication Initiated To File Sharing Domains From Process Located In Suspicious Folder
    reason: 'The exact next step in the same sequence: this EID 3 rule''s destination list literally includes *anonfiles.com, so the DNS lookup turning into a real outbound connect to anonfiles from a binary living in a Temp/Public/Recycle.bin folder confirms the resolution was exfil/ingress, not a stray query. Its own block already names this rule as its ''DNS precursor''.'
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: 'The process-creation view of the command that produced this lookup, download direction: its command-line list literally includes *anonfiles.com* paired with DownloadString/Invoke-WebRequest, so a PowerShell cradle pulling a payload from anonfiles is the exact action that emits the EID 22 query this rule caught.'
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'The collection step that immediately precedes upload to an anonymous share: a password-protected 7-Zip archive (7z a -p...) built on this host just before the anonfiles lookup is the stolen data being bundled for exfiltration.'
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: 'The upload-side counterpart via a different tool: a curl --upload-file/-F POST to a file-sharing domain is the same exfil-over-web-service action the anonfiles resolution is part of, seen in process creation rather than DNS.'
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: 'The canonical bulk ransomware-exfil tool (rclone copy to a cloud remote): rclone running on this host inside the window marks a large data-theft operation, of which touching anonfiles is one egress channel rather than the whole transfer.'
  - id: 42a5f1e7-9603-4f6d-97ae-3f37d130d794
    name: Suspicious File Downloaded From File-Sharing Website Via Certutil.EXE
    reason: 'The ingress reading of the same lookup via a LOLBin: anonfiles also hosts payloads, and certutil -urlcache fetching from a file-sharing site is the alternate way the next stage is staged on this host after the name resolves.'
  - id: 999e8307-a775-4d5f-addc-4855632335be
    name: Potential BlackByte Ransomware Activity
    reason: This detection's own reference is the TrendMicro BlackByte report, and BlackByte's playbook exfiltrates victim data to anonymous file hosts before encrypting; BlackByte's on-host command patterns firing on the same host turn this anonfiles lookup into the data-theft stage of a ransomware intrusion.
  - id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
    name: Renamed MegaSync Execution
    reason: A renamed MegaSync is a high-fidelity exfil indicator (defense evasion + cloud upload to Mega, anonfiles' anonymous-cloud sibling); seeing one on this host alongside the anonfiles lookup points to the same actor staging data out through whichever anonymous service is reachable.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound connection to anonymous-upload / file-sharing destinations on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationHostname:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Gg][Oo][Ff][Ii][Ll][Ee]\.[Ii][Oo]/ OR data_win_eventdata_destinationHostname:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]/ OR data_win_eventdata_destinationHostname:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh]/ OR data_win_eventdata_destinationHostname:/.*[Ff][Ii][Ll][Ee]\.[Ii][Oo]/ OR data_win_eventdata_destinationHostname:/.*0[Xx]0\.[Ss][Tt]/ OR data_win_eventdata_destinationHostname:/.*[Uu][Ff][Ii][Ll][Ee]\.[Ii][Oo]/ OR data_win_eventdata_destinationHostname:/.*[Bb][Aa][Ss][Hh][Uu][Pp][Ll][Oo][Aa][Dd]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Mm][Ee][Dd][Ii][Aa][Ff][Ii][Rr][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Ss][Ee][Nn][Dd][Ss][Pp][Aa][Cc][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Pp][Ii][Xx][Ee][Ll][Dd][Rr][Aa][Ii][Nn]\.[Cc][Oo][Mm]/ OR data_win_eventdata_destinationHostname:/.*[Xx]0\.[Aa][Tt]/)
    pivot_on:
    - host
    window: 1h
  - name: Exfiltration / cloud-upload tooling executed on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ee][Gg][Aa][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_commandLine:/.* --[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.* -[Ii][Nn][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Gg][Oo][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/))
    pivot_on:
    - host
    window: 2h
  - name: Data staged or archived for exfiltration on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.7[Zz]/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Aa][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Aa][Bb]/))
    pivot_on:
    - host
    window: 4h
  - name: File download from a file-sharing / anonymous-upload domain on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Gg][Oo][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Dd][Ii][Aa][Ff][Ii][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ii][Xx][Ee][Ll][Dd][Rr][Aa][Ii][Nn].*/) AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.* [Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr] \/[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Other hosts resolving or connecting to the same domain (campaign)
    query: data_win_system_eventID:"22" OR (data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/)
    pivot_on:
    - domain
    window: 24h
