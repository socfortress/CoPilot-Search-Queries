      pivot_on: [host]
      window: 1h
    - name: "Other executions of this tool-set on this host (any arguments)"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ff][Ii][Nn][Gg][Ee][Rr]\.[Ee][Xx][Ee])/'
