correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
    name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
    reason: 'The same behaviour one telemetry stage later: the EID 3 outbound session to *.azurewebsites.net that this DNS resolution sets up. A single beacon emits both within seconds, so this confirms the resolved Azure host was actually contacted, not just looked up.'
  - id: 7bd3902d-8b8b-4dd4-838a-c6862d40150d
    name: DNS HybridConnectionManager Service Bus
    reason: Another Azure-native covert channel on the host (Azure Relay / servicebus.windows.net). An actor tunnelling C2 through trusted Azure egress commonly abuses more than one Azure service alongside App Service.
  - id: b3e6418f-7c7a-4fad-993a-93b65027a9f1
    name: DNS Query To Visual Studio Code Tunnels Domain
    reason: 'Same core TTP: a non-interactive process hiding C2/exfil behind an allow-listed Microsoft cloud hostname. A second trusted-cloud reverse-tunnel on the same host hardens the C2 verdict for the App Service lookup.'
  - id: a1d9eec5-33b2-4177-8d24-27fe754d0812
    name: Cloudflared Tunnels Related DNS Requests
    reason: Co-occurring trusted-cloud reverse-tunnel (trycloudflare/argotunnel) serving the same reverse-shell/C2 goal as the App Service channel; attackers stack these interchangeable cloud egress options on one host.
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: Near-identical detection shape (non-browser process resolving an attacker SaaS domain); flags the hands-on-keyboard RMM/remote-access tool an operator pulls in for interactive control after the cloud beacon lands.
  - id: f356a9c4-effd-4608-bbf8-408afd5cd006
    name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
    reason: If the process calling *.azurewebsites.net is a Cobalt Strike beacon (a documented malleable-C2-over-cloud pattern), this co-fires on the same host and names the C2 framework behind the Azure lookups.
  - id: ec82e2a5-81ea-4211-a1f8-37a0286df2c2
    name: Suspicious DNS Query for IP Lookup Service APIs
    reason: A freshly landed implant resolves api.ipify.org/ifconfig.me to learn the victim's public IP; the same non-browser process making both that check-in recon and the App Service lookup is characteristic beacon activation.
  - id: f8c1e80b-c73a-476a-ae24-6c72528b1521
    name: DNS Query To Common Malware Hosting and Shortener Services
    reason: 'The delivery leg that typically precedes this: the implant now calling *.azurewebsites.net was staged minutes earlier from a hosting/shortener/Cloudflare-Workers domain resolved on the same host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound sessions and sustained DNS to Azure App Service / Azure cloud infrastructure on this host
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_destinationHostname:/.*[Aa][Zz][Uu][Rr][Ee][Ww][Ee][Bb][Ss][Ii][Tt][Ee][Ss]\.[Nn][Ee][Tt]/ OR data_win_eventdata_destinationHostname:/.*[Cc][Oo][Rr][Ee]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Nn][Ee][Tt]/ OR data_win_eventdata_destinationHostname:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Bb][Uu][Ss]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Nn][Ee][Tt]/ OR data_win_eventdata_destinationHostname:/.*[Aa][Zz][Uu][Rr][Ee][Ee][Dd][Gg][Ee]\.[Nn][Ee][Tt]/ OR data_win_eventdata_destinationHostname:/.*[Aa][Zz][Uu][Rr][Ee]-[Aa][Pp][Ii]\.[Nn][Ee][Tt]/)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Aa][Zz][Uu][Rr][Ee][Ww][Ee][Bb][Ss][Ii][Tt][Ee][Ss]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*[Cc][Oo][Rr][Ee]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Bb][Uu][Ss]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*[Aa][Zz][Uu][Rr][Ee][Ee][Dd][Gg][Ee]\.[Nn][Ee][Tt]/ OR data_win_eventdata_queryName:/.*[Aa][Zz][Uu][Rr][Ee]-[Aa][Pp][Ii]\.[Nn][Ee][Tt]/))
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting to this same Azure App Service subdomain (campaign scope)
    query: (data_win_system_eventID:"22" OR data_win_system_eventID:"3")
    pivot_on:
    - domain
    window: 24h
  - name: 'Carrier process: script interpreters / LOLBins or user-writable-path binaries issuing DNS on this host'
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Implant download / staging on this host (delivery precursor)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/)
    pivot_on:
    - host
    window: 2h
  - name: Collection and exfiltration tooling on this host (exfil leg to the cloud destination)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Mm][Ee][Gg][Aa][Cc][Mm][Dd]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.* -[Hh][Pp].*/ OR data_win_eventdata_commandLine:/.*-[Oo][Uu][Tt][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/)
    pivot_on:
    - host
    window: 4h
