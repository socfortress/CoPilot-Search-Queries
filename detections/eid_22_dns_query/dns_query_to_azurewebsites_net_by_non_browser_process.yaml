name: DNS Query To AzureWebsites.NET By Non-Browser Process
id: e043f529-8514-4205-8ab0-7f7d2927b400
version: 1
schema_version: "1.0"
date: "2024-06-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e043f529-8514-4205-8ab0-7f7d2927b400
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a DNS query by a non browser process on the system to
  "azurewebsites.net". The latter was often used by threat actors as a malware
  hosting and exfiltration site. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 22 - DNS Query

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        
        - wildcard:
            data_win_eventdata_queryName:
              value: "*azurewebsites.net"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Mozilla Firefox\\firefox.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Mozilla Firefox\\firefox.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Internet Explorer\\iexplore.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Internet Explorer\\iexplore.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeWebView\\\\Application\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WindowsApps\\\\MicrosoftEdge.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeCore\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Microsoft\\\\EdgeCore\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\msedge.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\msedgewebview2.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\safari.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\MsMpEng.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\MsSense.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\brave.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\BraveSoftware\\\\*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Maxthon\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\maxthon.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Programs\\\\Opera\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\opera.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\SeaMonkey\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\SeaMonkey\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\seamonkey.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Vivaldi\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\vivaldi.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Naver\\\\Naver Whale\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\Naver\\\\Naver Whale\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\whale.exe"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Tor Browser\\\\*"
                          case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Waterfox\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\Waterfox\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Waterfox.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Programs\\\\midori-ng\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Midori Next Generation.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\SlimBrowser\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\SlimBrowser\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\slimbrowser.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Flock\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Flock.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Phoebe\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Phoebe.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Falkon\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\Falkon\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\falkon.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\Avant Browser\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Avant Browser\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\avant.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 22 (DNS query) enabled in the Sysmon configuration and
  the Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent.
  The detection looks for events where data_win_eventdata_queryName matches
  '*azurewebsites.net'; data_win_eventdata_image equals 'C:\Program
  Files\Google\Chrome\Application\chrome.exe'; data_win_eventdata_image equals
  'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe', among other
  conditions.

known_false_positives: >
  Likely with other browser software. Apply additional filters for any other
  browsers you might use. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.sentinelone.com/labs/wip26-espionage-threat-actors-abuse-cloud-infrastructure-in-targeted-telco-attacks/
  - https://symantec-enterprise-blogs.security.com/threat-intelligence/harvester-new-apt-attacks-asia
  - https://www.ptsecurity.com/ww-en/analytics/pt-esc-threat-intelligence/higaisa-or-winnti-apt-41-backdoors-old-and-new/
  - https://intezer.com/blog/research/how-we-escaped-docker-in-azure-functions/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    DNS Query To AzureWebsites.NET By Non-Browser Process detected on host
    $agent_name$. Matched data_win_eventdata_queryName:
    $data_win_eventdata_queryName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_queryName
      type: domain
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - query
    - azurewebsites
    - browser
    - dns_query
    - sysmon
    - command_and_control
  product:
