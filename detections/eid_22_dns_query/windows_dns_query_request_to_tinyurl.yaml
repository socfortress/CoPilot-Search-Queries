name: Windows DNS Query Request To TinyUrl
id: Windows_DNS_Query_Request_To_TinyUrl
version: 1
schema_version: "1.0"
date: "2026-03-27"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects processes running from suspicious locations (AppData, Temp, ProgramData,
  Public, Tasks, Perflogs) making DNS queries to tinyurl.com. URL shorteners are
  frequently used by threat actors to obfuscate malicious destinations including
  phishing pages, malware distribution sites, or C2 endpoints. While tinyurl.com
  is a legitimate service, its use by non-browser processes running from suspicious
  paths is highly indicative of malicious activity such as malware downloading
  additional payloads or beaconing to C2 infrastructure.
data_source:
  - Sysmon EventID 22 (DNSEvent)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "22"
        - term:
            data_win_eventdata_queryName: "tinyurl.com"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\AppData\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\Perflogs\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\ProgramData\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\Temp\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\Users\\Public\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\Windows\\Tasks\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_queryName
    - data_win_eventdata_queryResults
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-27 23:59:59.999"

how_to_implement: >
  Requires Wazuh agents with Sysmon installed and configured to log DNS query
  events (EventID 22). VALIDATED — tinyurl.com DNS query from C:\Windows\Temp\update.exe
  confirmed via Sysmon EventID 22 with 1 hit.

known_false_positives: >
  Instant messaging or collaboration tools running from user AppData paths may
  legitimately query URL shorteners. Filter known legitimate applications if needed.

references:
  - https://attack.mitre.org/techniques/T1105/
  - https://x.com/Unit42_Intel/status/1919418143476199869

response:
  message: >
    Suspicious process $data_win_eventdata_image$ made a DNS query for tinyurl.com
    on $agent_name$ by $data_win_eventdata_user$.
    MITRE ATT&CK: T1105
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_queryName
      type: domain

tags:
  analytic_story:
    - Malicious Inno Setup Loader
    - Ingress Tool Transfer
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - tinyurl
    - url_shortener
    - dns
    - c2
    - suspicious_path
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:"tinyurl.com" AND (data_win_eventdata_image:/.*\\AppData\\.*/ OR data_win_eventdata_image:/.*\\Perflogs\\.*/ OR data_win_eventdata_image:/.*\\ProgramData\\.*/ OR data_win_eventdata_image:/.*\\Temp\\.*/ OR data_win_eventdata_image:/.*\\Users\\Public\\.*/ OR data_win_eventdata_image:/.*\\Windows\\Tasks\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f8c1e80b-c73a-476a-ae24-6c72528b1521
    name: DNS Query To Common Malware Hosting and Shortener Services
    reason: Superset shortener/malware-hosting DNS detection whose own domain list includes tinyurl.com alongside trycloudflare.com, workers.dev, lihi.cc and reurl.cc; a co-firing hit on this host shows the dropped process is resolving several evasion/redirect domains rather than a lone tinyurl lookup, and names the others it reached.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: 'The EID 3 follow-through to this EID 22 alert: the same suspicious-path process actually connecting out (to a non-file-sharing host) is the TCP session the tinyurl resolution was the precursor to, turning DNS intent into a confirmed outbound beacon/fetch.'
  - id: e0f8ab85-0ac9-423b-a73a-81b3c7b1aa97
    name: Network Communication Initiated To File Sharing Domains From Process Located In Suspicious Folder
    reason: tinyurl commonly redirects to file-sharing/paste hosts; this catches the same class of suspicious-folder process then connecting to one of those payload hosts, i.e. the download the shortener was concealing.
  - id: windows-curl-download-suspicious-path-001
    name: Windows Curl Download to Suspicious Path
    reason: 'The ingress-tool-transfer itself: curl fetching a file with -o/-O into AppData/ProgramData/Public/Temp/PerfLogs (the exact writable dirs this rule keys on) is the payload retrieval a tinyurl redirect leads to.'
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: 'Alternate LOLBin download vector on the same host: bitsadmin /transfer staging a payload into the same suspicious folders is a common second-stage fetch once a loader has resolved its download URL.'
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: If the dropped loader is PowerShell-based, this download-and-execute cradle (DownloadString/IWR piped to IEX) is it fetching and running the payload behind the shortener in one step, the 'download additional payloads' branch of this alert.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: The process-creation record for a binary launched from an uncommon folder, i.e. the loader behind the DNS query, carrying the parent process, command line and hashes the EID 22 DNS event itself does not.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: 'Expected follow-on persistence: once the second stage lands, malware writes a Run key pointing back at the Temp/AppData/Public/ProgramData/PerfLogs directory the loader runs from, pinning it across reboot.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound connection from a process in a user-writable / suspicious path on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: 'Ingress-tool-transfer: downloader LOLBins or PowerShell download cradles on this host'
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt] .*/)
    pivot_on:
    - host
    window: 1h
  - name: Executable or script dropped into a world-writable / suspicious folder on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa]/)
    pivot_on:
    - host
    window: 2h
  - name: Other hosts resolving or connecting out to the same shortener domain (campaign spread)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/) OR data_win_system_eventID:"22"
    pivot_on:
    - domain
    window: 24h
  - name: Follow-on autorun persistence on this host (Run key or scheduled-task creation)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
