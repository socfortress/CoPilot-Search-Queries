name: Potential JLI.dll Side-Loading
id: 7a3b6d1f-4a2b-4f8c-9d7e-e9f8cbf21a35
version: 1
schema_version: "1.0"
date: "2025-10-06"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7a3b6d1f-4a2b-4f8c-9d7e-e9f8cbf21a35
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL side-loading of jli.dll. JLI.dll has been observed being
  side-loaded by Java processes by various threat actors, including APT41,
  XWorm, and others in order to load malicious payloads in context of legitimate
  Java processes. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\jli.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - exists:
            field: "data_win_eventdata_description"
        - exists:
            field: "data_win_eventdata_originalFileName"
        - exists:
            field: "data_win_eventdata_product"
        - exists:
            field: "data_win_eventdata_signed"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files (x86)\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_description:
                          value: "OpenJDK Platform binary"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_originalFileName:
                          value: "jli.dll"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_product:
                          value: "OpenJDK Platform*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_signed:
                          value: "true"
                          case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\eclipse\\\\plugins\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_description
    - data_win_eventdata_originalFileName
    - data_win_eventdata_product
    - data_win_eventdata_signed
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\jli.dll'; data_win_eventdata_imageLoaded matches 'C:\Program Files\*';
  data_win_eventdata_imageLoaded matches 'C:\Program Files (x86)\*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/apt41-in-africa/116986/
  - https://lab52.io/blog/snake-keylogger-in-geopolitical-affairs-abuse-of-trusted-java-utilities-in-cybercrime-operations/
  - https://hijacklibs.net/entries/3rd_party/oracle/jli.html
  - https://www.proofpoint.com/us/blog/threat-insight/phish-china-aligned-espionage-actors-ramp-up-taiwan-semiconductor-targeting
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential JLI.dll Side-Loading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - loading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Jj][Ll][Ii]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND _exists_:data_win_eventdata_description AND _exists_:data_win_eventdata_originalFileName AND _exists_:data_win_eventdata_product AND _exists_:data_win_eventdata_signed AND NOT ((data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/) AND data_win_eventdata_description:/[Oo][Pp][Ee][Nn][Jj][Dd][Kk] [Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm] [Bb][Ii][Nn][Aa][Rr][Yy]/ AND data_win_eventdata_originalFileName:/[Jj][Ll][Ii]\.[Dd][Ll][Ll]/ AND data_win_eventdata_product:/[Oo][Pp][Ee][Nn][Jj][Dd][Kk] [Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm].*/ AND data_win_eventdata_signed:/[Tt][Rr][Uu][Ee]/) AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Ee][Cc][Ll][Ii][Pp][Ss][Ee]\\[Pp][Ll][Uu][Gg][Ii][Nn][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
    name: Shell Process Spawned by Java.EXE
    reason: 'Direct follow-on: the rogue jli.dll runs inside the signed Java launcher, so the first hands-on action is that same java.exe spawning cmd/powershell/bash. Same host process that loaded the malicious DLL.'
  - id: 0d34ed8b-1c12-4ff2-828c-16fc860b766d
    name: Suspicious Processes Spawned by Java.EXE
    reason: 'Direct follow-on: after the side-load, the hijacked java.exe spawns LOLBins (certutil, bitsadmin, rundll32, schtasks, wmic) to download next stages, recon or persist.'
  - id: 90fb5e62-ca1f-4e22-b42e-cc521874c938
    name: Suspicious Shells Spawn by Java Utility Keytool
    reason: 'Parallel Java-utility abuse: keytool.exe ships in the same JRE/JDK directory and resolves jli.dll by the same search order, so a shell from keytool is the same side-load incident via a sibling trusted Java binary.'
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: 'C2 follow-on: this rule fired precisely because the Java host sits outside Program Files (uncommon path); the payload''s outbound beacon (XWorm/Snake Keylogger C2) from that same uncommonly-located process surfaces here.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Co-occurring corroboration: SOCFortress hunt for any DLL loaded from a non-standard directory - it independently flags the jli.dll load itself and any sibling rogue DLL staged in the same drop folder.'
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: 'Injection follow-on: loaders delivered this way (XWorm, Snake Keylogger) inject their payload into another process via CreateRemoteThread, and java.exe is a highly uncommon remote-thread source image.'
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'End-objective follow-on: the rule''s own references tie jli.dll side-loading to Snake Keylogger and similar infostealers, whose goal is reading browser credential stores on the victim host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by the Java host on this endpoint
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa][Ww]\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa][Ww][Ss]\.[Ee][Xx][Ee]|\\[Jj][Pp]2[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee]|\\[Kk][Ee][Yy][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]|\\[Jj][Aa][Bb][Ss][Ww][Ii][Tt][Cc][Hh]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections initiated by a Java binary (payload C2 beacon)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa][Ww]\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa][Ww][Ss]\.[Ee][Xx][Ee]|\\[Jj][Pp]2[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: DNS queries made by a Java binary (C2 / exfil domain resolution)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*(\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa][Ww]\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa][Ww][Ss]\.[Ee][Xx][Ee]|\\[Jj][Pp]2[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Other unsigned DLLs loaded from user-writable staging paths (sibling side-load kit)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/) AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Executable / script / DLL artifacts dropped by a Java binary (staging & persistence)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*(\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa][Ww]\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa][Ww][Ss]\.[Ee][Xx][Ee]|\\[Jj][Pp]2[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee])/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Cc][Mm][Dd]|[Vv][Bb][Ss]|[Jj][Ss]|[Ss][Cc][Rr]|[Ll][Nn][Kk]|[Hh][Tt][Aa])/
    pivot_on:
    - host
    window: 4h
