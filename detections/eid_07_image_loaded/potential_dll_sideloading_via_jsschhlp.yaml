name: Potential DLL Sideloading Via JsSchHlp
id: 68654bf0-4412-43d5-bfe8-5eaa393cd939
version: 1
schema_version: "1.0"
date: "2022-12-14"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 68654bf0-4412-43d5-bfe8-5eaa393cd939
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading using JUSTSYSTEMS Japanese word processor.
  MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\JSESPR.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\Program Files\\\\Common Files\\\\Justsystem\\\\JsSchHlp\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\JSESPR.dll'; data_win_eventdata_imageLoaded matches 'C:\Program
  Files\Common Files\Justsystem\JsSchHlp\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.welivesecurity.com/2022/12/14/unmasking-mirrorface-operation-liberalface-targeting-japanese-political-entities/
  - http://www.windowexe.com/bbs/board.php?q=jsschhlp-exe-c-program-files-common-files-justsystem-jsschhlp-jsschhlp
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Via JsSchHlp detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - jsschhlp
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Jj][Ss][Ee][Ss][Pp][Rr]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Jj][Uu][Ss][Tt][Ss][Yy][Ss][Tt][Ee][Mm]\\[Jj][Ss][Ss][Cc][Hh][Hh][Ll][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 571498c8-908e-40b4-910b-d2369159a3da
    name: Password Protected ZIP File Opened (Email Attachment)
    reason: 'Delivery precursor: MirrorFace/Operation LiberalFace ships the legitimate jsschhlp.exe plus the malicious JSESPR.dll inside a password-protected archive attached to a spearphishing email; this flags that archive being opened from the Outlook attachment cache on the same host - the step that plants the sideload set.'
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'Staging precursor: before jsschhlp.exe can load JSESPR.dll (EID 7), the malicious DLL must be written to disk - this is the EID 11 file-create detection for a search-order-hijack DLL dropped into a user-writable path, the drop step this image-load completes.'
  - id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
    name: Third Party Software DLL Sideloading
    reason: 'Same technique, broader net: JsSchHlp is third-party (JustSystems) software, and this generic third-party-sideloading rule catches the identical signed-binary-loads-attacker-DLL pattern (T1574.001) - it corroborates this load and catches the actor sideloading via another third-party product on the host.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Co-occurring: JSESPR.dll is loaded from a non-standard path (the rule excludes the legit Justsystem install dir), exactly the abusable-DLL-from-suspicious-location pattern; it corroborates the sideload and flags sibling abusable-DLL loads from Temp/Public/Users on the same host.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Same T1574.001 technique: a broad EID 7 search-order-hijacking hunt that re-surfaces this JSESPR.dll load and any other hijacked-DLL loads on the host, widening a single-DLL hit into the full hijack picture.'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: 'Co-occurring staging tell: the sideloaded JSESPR.dll is loaded from outside Program Files; if the actor staged it (or sibling loader DLLs) in a temp directory, this EID 7 rule fires on the same host for the same behaviour.'
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'Objective follow-on: the JSESPR.dll loader deploys MirrorStealer, whose goal is browser-stored credentials; this flags copying of browser ''User Data''/''Login Data'' profile stores on the host after the foothold - the intrusion''s payoff.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: JsSchHlp execution and JSESPR.dll / jsschhlp.exe staging on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Jj][Ss][Ss][Cc][Hh][Hh][Ll][Pp]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Jj][Ss][Ee][Ss][Pp][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Jj][Ss][Ss][Cc][Hh][Hh][Ll][Pp]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: Outbound network and DNS from JsSchHlp (sideloaded-loader C2 beacon)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Jj][Ss][Ss][Cc][Hh][Hh][Ll][Pp]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Jj][Ss][Ss][Cc][Hh][Hh][Ll][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Child processes spawned by JsSchHlp (backdoor command execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Jj][Ss][Ss][Cc][Hh][Hh][Ll][Pp]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Browser-credential-store and Windows Vault access (MirrorStealer objective)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*/ AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*/ AND data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/))
    pivot_on:
    - host
    window: 6h
  - name: New auto-run or scheduled task naming JsSchHlp (sideload persistence)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND data_win_eventdata_details:/.*[Jj][Ss][Ss][Cc][Hh][Hh][Ll][Pp].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Jj][Ss][Ss][Cc][Hh][Hh][Ll][Pp].*/)
    pivot_on:
    - host
    window: 6h
