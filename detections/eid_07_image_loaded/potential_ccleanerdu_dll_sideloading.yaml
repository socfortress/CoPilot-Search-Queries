name: Potential CCleanerDU.DLL Sideloading
id: 1fbc0671-5596-4e17-8682-f020a0b995dc
version: 1
schema_version: "1.0"
date: "2023-07-13"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1fbc0671-5596-4e17-8682-f020a0b995dc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "CCleanerDU.dll". MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\CCleanerDU.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\CCleaner\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files (x86)\\\\CCleaner\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\CCleaner.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\CCleaner64.exe"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\CCleanerDU.dll'; data_win_eventdata_image matches 'C:\Program
  Files\CCleaner\*'; data_win_eventdata_image matches 'C:\Program Files
  (x86)\CCleaner\*', among other conditions.

known_false_positives: >
  False positives could occur from other custom installation paths. Apply
  additional filters accordingly. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://lab52.io/blog/2344-2/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential CCleanerDU.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - ccleanerdu
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr][Dd][Uu]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\\.*/) AND (data_win_eventdata_image:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]64\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3735d5ac-d770-4da0-99ff-156b180bc600
    name: Potential CCleanerReactivator.DLL Sideloading
    reason: 'Exact sibling: the signed CCleaner.exe sideloads BOTH CCleanerDU.dll and CCleanerReactivator.dll. A trojanized CCleaner package planted for sideloading can load either helper, so both detections firing on the same host within the window is the strongest confirmation the CCleaner payload is weaponised, not a stray non-standard install path.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Same concrete TTP on the same host: other well-known sideloadable DLLs (coreclr/libcef/ZIPDLL...) loaded from user-writable locations (Public, PerfLogs...). Actors who sideload CCleaner routinely plant more than one sideload kit, so a parallel hit here shows this is a sideloading campaign rather than a one-off.'
  - id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
    name: Third Party Software DLL Sideloading
    reason: 'The broader same-behaviour net: T1574.001 sideloading against a different curated third-party-software DLL set. A hit alongside CCleanerDU on the same host corroborates that signed-app DLL search-order hijacking is being abused across multiple applications on the box.'
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: 'Direct follow-on (the C2 step): this alert only fires because CCleaner.exe is running from a NON-standard path. When that sideloaded loader beacons out, its outbound connection is exactly a network connection from a process in an uncommon location, so this rule catches the command-and-control stage of the same chain.'
  - id: e0f8ab85-0ac9-423b-a73a-81b3c7b1aa97
    name: Network Communication Initiated To File Sharing Domains From Process Located In Suspicious Folder
    reason: 'Follow-on staging/exfil: the same suspicious-folder CCleaner.exe pulling a next-stage payload or exfiltrating via a file-sharing domain (Dropbox/MEGA...), a common loader pattern immediately after a successful sideload.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Staging of the CCleaner sideloading kit (host binary + helper DLLs dropped) on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr][Dd][Uu]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr][Rr][Ee][Aa][Cc][Tt][Ii][Vv][Aa][Tt][Oo][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]64\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: How the sideloaded CCleaner launched and what it spawned (parent + child processes)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]64\.[Ee][Xx][Ee])/ OR data_win_eventdata_parentImage:/.*(\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]64\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: C2 beacon / DNS lookups made by the sideloaded CCleaner process
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*(\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]64\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
  - name: Other DLL/module sideloads from user-writable paths on this host (broader campaign)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Follow-on shells / LOLBins spawned by a process running from a user-writable location
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|\\[Ss][Cc]\.[Ee][Xx][Ee])/) AND (data_win_eventdata_parentImage:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
