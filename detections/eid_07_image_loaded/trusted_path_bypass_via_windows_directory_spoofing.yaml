name: Trusted Path Bypass via Windows Directory Spoofing
id: 0cbe38c0-270c-41d9-ab79-6e5a9a669290
version: 1
schema_version: "1.0"
date: "2025-06-17"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0cbe38c0-270c-41d9-ab79-6e5a9a669290
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DLLs loading from a spoofed Windows directory path with an extra space
  (e.g "C:\Windows \System32") which can bypass Windows trusted path
  verification. This technique tricks Windows into treating the path as trusted,
  allowing malicious DLLs to load with high integrity privileges bypassing UAC.
  MITRE ATT&CK: T1574.007, T1548.002.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows \\\\System32\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows \\\\SysWOW64\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*:\Windows \System32\*'; data_win_eventdata_imageLoaded matches '*:\Windows
  \SysWOW64\*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://x.com/Wietze/status/1933495426952421843
  - https://attack.mitre.org/techniques/T1574/007/
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Trusted Path Bypass via Windows Directory Spoofing detected on host
    $agent_name$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.007, T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.007
    - T1548.002
  custom_tags:
    - trusted
    - bypass
    - directory
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4ac47ed3-44c2-4b1f-9d51-bf46e8914126
    name: TrustedPath UAC Bypass Pattern
    reason: 'Process-creation twin of this exact technique: it detects the binary EXECUTING from the same mocked ''C:\Windows \System32\''/''SysWOW64\'' (trailing-space) path. If it fires on this host it is the confirming process that sideloaded the DLL this image-load alert caught - assemble both into one incident.'
  - id: a5ea83a7-05a5-44c1-be2e-addccbbd8c03
    name: UAC Bypass With Fake DLL
    reason: 'Same primitive, different lure: an attacker-dropped fake dismcore.dll sideloaded by an auto-elevating DISM process to bypass UAC via image load - a parallel way the planted DLL here reaches high-integrity execution.'
  - id: 9ed5959a-c43c-4c59-84e3-d28628429456
    name: UAC Bypass Using Iscsicpl - ImageLoad
    reason: 'Same sideload-for-elevation vector via a different auto-elevating LOLBin: iscsicpl.exe DLL-search-order hijack loading a custom DLL from a user-writable path. The mocked-directory trick and the iscsicpl sideload are interchangeable UAC-bypass methods an operator runs on the same host.'
  - id: 4f6c43e2-f989-4ea5-bcd8-843b49a0317c
    name: UAC Bypass Using WOW64 Logger DLL Hijack
    reason: 'The SysWOW64-side analogue of this rule''s own SysWOW64 branch: planting wow64log.dll so a WOW64 process loads it elevated (UACMe 30). A wow64-logger hijack on this host is the 32-bit equivalent of the spoofed-SysWOW64 load.'
  - id: 7a01183d-71a2-46ad-ad5c-acd989ac1793
    name: UAC Bypass Abusing Winsat Path Parsing - Process
    reason: 'Sibling trusted-path defeat: winsat.exe path-parsing UAC bypass (UACMe 52) abuses path handling to beat the same trusted-directory check. A UACMe-style toolkit that mocks directories commonly also tries the winsat path trick in the same session.'
  - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
    name: FodHelper UAC Bypass
    reason: fodhelper.exe is the auto-elevating binary most often copied into the mocked directory. A fodhelper-based UAC bypass firing on the same host in the window indicates a second or alternate elevation attempt by the same actor.
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: 'Immediate post-elevation objective: once the DLL runs at high integrity the operator dumps LSASS via comsvcs MiniDump. A comsvcs LSASS dump on this host right after is the credential-theft follow-on that turns a UAC bypass into a full incident.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Spoofed 'C:\Windows ' (trailing-space) trusted path in process-creation and file-creation
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\.*/ OR data_win_eventdata_currentDirectory:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\.*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Auto-elevating / mockable UAC-bypass binaries executing or spawning children on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ss][Dd][Cc][Ll][Tt]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ss][Ll][Uu][Ii]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]|[Ww][Ii][Nn][Ss][Aa][Tt]|[Cc][Mm][Ss][Tt][Pp]|[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ss][Dd][Cc][Ll][Tt]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ss][Ll][Uu][Ii]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]|[Ww][Ii][Nn][Ss][Aa][Tt]|[Cc][Mm][Ss][Tt][Pp]|[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Sideloaded payload DLL: unsigned image loads or loads from user-writable staging dirs on this host'
    query: data_win_system_eventID:"7" AND (data_win_eventdata_signed:"false" OR data_win_eventdata_imageLoaded:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc])\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential access on this host (the elevated attacker's objective)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/)
    pivot_on:
    - host
    window: 1h
  - name: Defender / security-control tampering on this host (post-elevation defense evasion)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee]|[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]).*/)
    pivot_on:
    - host
    window: 2h
