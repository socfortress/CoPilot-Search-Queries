name: Potential DLL Sideloading Using Coregen.exe
id: 0fa66f66-e3f6-4a9c-93f8-4f2610b00171
version: 1
schema_version: "1.0"
date: "2022-12-31"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0fa66f66-e3f6-4a9c-93f8-4f2610b00171
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect usage of the "coregen.exe" (Microsoft CoreCLR Native Image Generator)
  binary to sideload arbitrary DLLs. MITRE ATT&CK: T1218, T1055.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\coregen.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\Microsoft Silverlight\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\Microsoft Silverlight\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\coregen.exe'; data_win_eventdata_imageLoaded matches 'C:\Program Files
  (x86)\Microsoft Silverlight\*'; data_win_eventdata_imageLoaded matches
  'C:\Program Files\Microsoft Silverlight\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Coregen/
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Potential DLL Sideloading Using Coregen.exe detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1218, T1055
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1055
  custom_tags:
    - sideloading
    - coregen
    - image_load
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Cc][Oo][Rr][Ee][Gg][Ee][Nn]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Ii][Ll][Vv][Ee][Rr][Ll][Ii][Gg][Hh][Tt]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Ii][Ll][Vv][Ee][Rr][Ll][Ii][Gg][Hh][Tt]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Co-occurring same-mechanism detection: it flags abusable DLLs (coreclr.dll among them - coregen.exe IS the CoreCLR native-image generator) loaded from Public/PerfLogs/Temp/user-profile dirs. A coregen sideload staged in one of those world-writable paths trips both on the same or an adjacent image-load.'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: Fires on the identical image-load whenever coregen.exe's non-standard DLL is loaded from a Temp path - the most common staging dir for a dropped sideload payload - so it directly confirms the loaded module is attacker-staged rather than a benign relocation.
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: 'Same abuse from the staging-dir angle: a trusted Windows process loading a DLL out of C:\Users\Public or C:\PerfLogs. If the coregen-loaded DLL sits in such a world-writable dir this corroborates it as attacker-planted, the exact precondition for sideloading.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: The generalized mechanism this detection is one instance of - DLL sideloading is search-order hijacking of a signed binary. Run it to see whether the same host shows the broader hijack pattern (other trusted binaries loading planted DLLs) i.e. a campaign, not a one-off.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: The generalized form of this exact abuse for the sibling Microsoft .NET LOLBins (installutil/regasm/regsvcs/regsvr32/rundll32) loading an unsigned DLL. coregen.exe clusters with these .NET build/deploy utilities; an operator proxying execution through several of them lights this up alongside the coregen load.
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: 'Follow-on migration out of the sideload host: once code runs inside the signed coregen process (or a sibling .NET LOLBin it spawns - installutil/msbuild/regsvr32 are in this rule''s source list) creating a remote thread into another process is the classic next step, which this flags as an uncommon injector.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL or coregen.exe dropped into a world-writable staging dir on this host (sideload setup)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Rr][Ee][Gg][Ee][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: coregen.exe process launch on this host (reveals parent and the /L-sideloaded DLL)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Oo][Rr][Ee][Gg][Ee][Nn]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Child process spawned by coregen.exe (code executing under the trusted host process)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Oo][Rr][Ee][Gg][Ee][Nn]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connection or DNS by coregen.exe (C2 from a binary that never networks)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Cc][Oo][Rr][Ee][Gg][Ee][Nn]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: coregen.exe creating a remote thread or accessing LSASS (migration / credential theft)
    query: (data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*\\[Cc][Oo][Rr][Ee][Gg][Ee][Nn]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*\\[Cc][Oo][Rr][Ee][Gg][Ee][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
