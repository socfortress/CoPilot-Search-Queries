name: Potential Iviewers.DLL Sideloading
id: 4c21b805-4dd7-469f-b47d-7383a8fcb437
version: 1
schema_version: "1.0"
date: "2023-03-21"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4c21b805-4dd7-469f-b47d-7383a8fcb437
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "iviewers.dll" (OLE/COM Object Interface
  Viewer). MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\iviewers.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\Windows Kits\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\Windows Kits\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\iviewers.dll'; data_win_eventdata_imageLoaded matches 'C:\Program Files
  (x86)\Windows Kits\*'; data_win_eventdata_imageLoaded matches 'C:\Program
  Files\Windows Kits\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.secureworks.com/research/shadowpad-malware-analysis
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Iviewers.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - iviewers
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ii][Vv][Ii][Ee][Ww][Ee][Rr][Ss]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Kk][Ii][Tt][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Kk][Ii][Tt][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: 'The EID 1 counterpart of this image load: it flags OleView.exe - the signed Microsoft OLE/COM viewer that imports and loads iviewers.dll - launched from a path outside Windows Kits/SDK. iviewers.dll loaded from a non-Kits path means a planted OleView.exe+iviewers.dll pair, so this rule firing on the same host pins the exact sideloading host process behind this alert.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Same EID 7 sideloading behaviour, for other commonly-abused DLLs (coreclr/libcef/ZIPDLL/facesdk) loaded from writable locations (Public, Perflogs, Windows\Temp). ShadowPad/PlugX operators rarely plant a single DLL, so a co-fire here surfaces the other sideloaded modules staged on the same host.
  - id: 3121461b-5aa0-4a41-b910-66d25524edbb
    name: Winnti Malware HK University Campaign
    reason: iviewers.dll sideloading is a ShadowPad hallmark (the rule's own Secureworks reference), and ShadowPad is the Winnti/APT41 backdoor. Winnti process characteristics on the same host corroborate that this load is a Winnti deployment rather than a benign dev-tool launch.
  - id: 73d70463-75c9-4258-92c6-17500fe972f2
    name: Winnti Pipemon Characteristics
    reason: A second, independent Winnti-toolset detection (Pipemon), also a T1574.001 sideloader. Firing alongside the iviewers load strengthens attribution to the same Winnti operator working this host.
  - id: 9aa01d62-7667-4d3b-acb8-8cb5103e2014
    name: APT27 - Emissary Panda Activity
    reason: Emissary Panda/APT27 is a ShadowPad operator that likewise plants its backdoors by DLL sideloading. Its known sideloading host binaries executing on the same host point at the same intrusion that produced the iviewers load.
  - id: 130c9e58-28ac-4f83-8574-0a4cc913b97e
    name: Potential Winnti Dropper Activity
    reason: 'The staging precursor: Winnti droppers write their loader DLLs (EID 11) before anything sideloads them. A drop on this host shortly before the iviewers load is plausibly the write that planted the malicious DLL beside its host binary.'
  - id: 5b175490-b652-4b02-b1de-5b5b4083c5f8
    name: RedMimicry Winnti Playbook Registry Manipulation
    reason: 'The follow-on: once the sideloaded backdoor runs, the Winnti playbook writes registry values for persistence and configuration. Registry manipulation on the same host after the load confirms the implant took hold rather than failing.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'C2 beacon: outbound network connections from OleView.exe (the iviewers.dll sideload host)'
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Oo][Ll][Ee][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Additional unsigned DLLs sideloaded from user-writable paths on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Staging of the sideload: iviewers.dll or a relocated OleView.exe written to disk'
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ii][Vv][Ii][Ee][Ww][Ee][Rr][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Oo][Ll][Ee][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Payload injection / process access by the sideload host OleView.exe
    query: (data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*\\[Oo][Ll][Ee][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*\\[Oo][Ll][Ee][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence pointing at the sideload (Run key / service referencing OleView or a writable path)
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/) AND (data_win_eventdata_details:/.*[Oo][Ll][Ee][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_details:/.*[Ii][Vv][Ii][Ee][Ww][Ee][Rr][Ss].*/ OR data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 6h
