name: WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load
id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
version: 1
schema_version: "1.0"
date: "2023-02-22"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects signs of the WMI script host process "scrcons.exe" loading scripting
  DLLs which could indicates WMI ActiveScriptEventConsumers EventConsumers
  activity. MITRE ATT&CK: T1546.003.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\scrcons.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\vbscript.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\wbemdisp.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\wshom.ocx"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\scrrun.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\scrcons.exe'; data_win_eventdata_imageLoaded matches '*\vbscript.dll';
  data_win_eventdata_imageLoaded matches '*\wbemdisp.dll', among other
  conditions.

known_false_positives: >
  Legitimate event consumers. Dell computers on some versions register an event
  consumer that is known to cause false positives when brightness is changed by
  the corresponding keyboard button. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/HunterPlaybook/status/1301207718355759107
  - https://www.mdsec.co.uk/2020/09/i-like-to-move-it-windows-lateral-movement-part-1-wmi-event-subscription/
  - https://threathunterplaybook.com/hunts/windows/200902-RemoteWMIActiveScriptEventConsumers/notebook.html
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. MITRE ATT&CK: T1546.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - activescripteventconsumers
    - scrcons
    - image_load
    - sysmon
    - lateral_movement
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Bb][Ee][Mm][Dd][Ii][Ss][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ss][Hh][Oo][Mm]\.[Oo][Cc][Xx]/ OR data_win_eventdata_imageLoaded:/.*\\[Ss][Cc][Rr][Rr][Uu][Nn]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: 'Precursor: wmic creating an ActiveScriptEventConsumer is how the subscription that later makes scrcons.exe load vbscript.dll gets planted.'
  - id: 0f06a3a5-6a09-413f-8743-e6cf35561297
    name: WMI Event Subscription
    reason: 'Precursor: Sysmon EID 19/20/21 shows the filter/consumer/binding registration whose trigger firing causes this scrcons scripting-DLL load.'
  - id: windows-wmi-permanent-event-subscription-001
    name: Windows WMI Permanent Event Subscription
    reason: 'Precursor: a permanent subscription persisted in the WMI repository is what spawns scrcons.exe on each trigger, giving repeat loads and persistence.'
  - id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
    name: Suspicious Scripting in a WMI Consumer
    reason: 'Co-occurring: reveals the VBScript/JScript payload inside the consumer that scrcons.exe is now executing.'
  - id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
    name: Suspicious Encoded Scripts in a WMI Consumer
    reason: 'Co-occurring: encoded script text in the consumer confirms the scrcons load is malicious payload execution rather than a benign vendor consumer.'
  - id: ec1d5e28-8f3b-4188-a6f8-6e8df81dc28e
    name: WMI Persistence - Script Event Consumer
    reason: 'Direct follow-on: scrcons.exe running its script consumer is the process-creation view of the same ActiveScript consumer execution.'
  - id: 33f41cdd-35ac-4ba8-814b-c6a4244a1ad4
    name: WMI Persistence - Script Event Consumer File Write
    reason: 'Follow-on: scrcons.exe dropping files is the common next step when the consumer script stages a payload or output.'
  - id: 05936ce2-ee05-4dae-9d03-9a391cf2d2c6
    name: WMI Persistence - Command Line Event Consumer
    reason: 'Sibling technique: attackers using the other WMI consumer type (wbemcons) on the same host indicate the same WMI persistence/lateral movement campaign.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by scrcons.exe (consumer script payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Network connections and DNS from scrcons.exe (C2 or payload download)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Files written by scrcons.exe (dropped payloads or staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: WMI subscription creation (filter, consumer, binding) on this host
    query: (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21") AND (data_win_eventdata_eventType:/.*[Cc]onsumer.*/ OR data_win_eventdata_type:/.*[Ss]cript.*/ OR data_win_eventdata_destination:/.*[Aa]ctive[Ss]cript.*/ OR data_win_eventdata_name:/.*/)
    pivot_on:
    - host
    window: 24h
  - name: Tooling used to register WMI consumers (wmic, mofcomp, PowerShell)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]ctive[Ss]cript[Ee]vent[Cc]onsumer.*/ OR data_win_eventdata_commandLine:/.*__[Ee]vent[Ff]ilter.*/ OR data_win_eventdata_commandLine:/.*[Ff]ilter[Tt]o[Cc]onsumer[Bb]inding.*/ OR data_win_eventdata_image:/.*\\[Mm][Oo][Ff][Cc][Oo][Mm][Pp]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Aa]ctive[Ss]cript[Ee]vent[Cc]onsumer|__[Ee]vent[Ff]ilter|[Ff]ilter[Tt]o[Cc]onsumer[Bb]inding).*/)
    pivot_on:
    - host
    window: 24h
