name: Remote DLL Load Via Rundll32.EXE
id: f40017b3-cb2e-4335-ab5d-3babf679c1de
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f40017b3-cb2e-4335-ab5d-3babf679c1de
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a remote DLL load event via "rundll32.exe". MITRE ATT&CK: T1204.002.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded: "\\\\\\\\*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_imageLoaded matches '\\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/gabe-k/themebleed
  - Internal Research
  - https://attack.mitre.org/techniques/T1204/002/

response:
  message: >
    Remote DLL Load Via Rundll32.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1204.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.002
  custom_tags:
    - rundll32
    - image_load
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/\\\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: 'The EID 1 process-creation twin of this image load: it catches rundll32 launched with the UNC/remote DLL path on its command line, the same action this rule sees as the resulting remote image load. They co-fire within seconds on the same host; pairing them recovers the parent, full command line and export called.'
  - id: 88a87a10-384b-4ad7-8871-2f9bf9259ce5
    name: Suspicious Regsvr32 Execution From Remote Share
    reason: Sibling signed-binary-proxy LOLBin running a DLL straight from a remote share. Same tradecraft as rundll32 proxy-loading a remote DLL; seeing both on one host points to a toolkit staging payloads on network shares instead of local disk.
  - id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
    name: WebDav Client Execution Via Rundll32.EXE
    reason: rundll32 davclnt.dll,DavSetCookie spins up the WebClient redirector that mounts remote WebDAV paths - a common precursor that makes a remote DLL reachable over HTTP(S) when SMB/445 egress is blocked, producing exactly this remote image load.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Names the payload: rundll32 <dll>,StartW is the canonical Cobalt Strike reflective-loader entry point, so this co-firing identifies the remote DLL as a CS beacon rather than a benign add-in.'
  - id: 8cde342c-ba48-4b74-b615-172c330f2e93
    name: Suspicious Renamed Comsvcs DLL Loaded By Rundll32
    reason: Follow-on credential access through the very same rundll32 image-load vector - a renamed comsvcs.dll MiniDump of LSASS. After a remote foothold, rundll32-based LSASS dumping is the classic next step.
  - id: a7e6b1f9-8d2c-4f1e-9a7d-63e4c8a2bf4c
    name: Kapeka Backdoor Loaded Via Rundll32.EXE
    reason: 'Co-occurring EID 7 rundll32 malicious-DLL load (a .wll backdoor from ProgramData/AppData): confirms rundll32 is being abused as a loader on this host and may be the locally-staged counterpart dropped alongside the remote payload.'
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Remotely-staged payloads are routinely disguised with non-.dll extensions; this flags rundll32 loading such a file - the command-line view of the same disguised remote DLL this rule catches at image load.
  - id: 1723e720-616d-4ddc-ab02-f7e3685a4713
    name: Rundll32 Spawned Via Explorer.EXE
    reason: 'Raspberry Robin delivery pattern: explorer spawns rundll32 to run a DLL off removable/network media - a user-initiated precursor that lands precisely as a remote DLL load.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 invoked with a remote/UNC path argument on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* \\\\.*/
    pivot_on:
    - host
    window: 1h
  - name: Rundll32 fetching the DLL over SMB or WebDAV (outbound to 445/139/80/443) on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:true AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"139" OR data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443")
    pivot_on:
    - host
    window: 1h
  - name: 'C2 callback: DNS query made by rundll32 on this host'
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Rundll32 creating a remote thread in another process (beacon injection) on this host
    query: data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other signed-binary LOLBins loading a DLL from a remote/UNC path on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Ee][Gg][Ss][Vv][Rr]32|\\[Mm][Ss][Hh][Tt][Aa]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]|\\[Rr][Ee][Gg][Aa][Ss][Mm]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* \\\\.*/
    pivot_on:
    - host
    window: 2h
