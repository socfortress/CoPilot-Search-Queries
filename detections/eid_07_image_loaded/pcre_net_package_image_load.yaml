name: PCRE.NET Package Image Load
id: 84b0a8f3-680b-4096-a45b-e9a89221727c
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 84b0a8f3-680b-4096-a45b-e9a89221727c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects processes loading modules related to PCRE.NET package. MITRE ATT&CK:
  T1059.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\ba9ea7344a4a5f591d6e5dc32a13494b\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/rbmaslen/status/1321859647091970051
  - https://twitter.com/tifkin_/status/1321916444557365248
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    PCRE.NET Package Image Load detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - package
    - image
    - image_load
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Bb][Aa]9[Ee][Aa]7344[Aa]4[Aa]5[Ff]591[Dd]6[Ee]5[Dd][Cc]32[Aa]13494[Bb]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6e90ae7a-7cd3-473f-a035-4ebb72d961da
    name: PCRE.NET Package Temp Files
    reason: 'Same technique, write half: this EID-11 rule fires on the module being WRITTEN into the identical PCRE.NET dir (...\AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\), which the image-load rule then catches being LOADED. Pairing the two confirms a genuine compile/extract-then-load and names the writing process.'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: Generalised form of the exact same behaviour (EID-7 DLL load from *\temp\*.dll). The PCRE.NET load IS a temp-dir DLL load; firing here around the alert reveals whether the same host/process is loading further unsigned modules out of temp beyond the PCRE.NET artifact.
  - id: e0b06658-7d1d-4cd3-bf15-03467507ff7c
    name: Suspicious DotNET CLR Usage Log Artifact
    reason: clr.dll writes a UsageLog named after each process that executes a .NET assembly for the first time. PCRE.NET's loading host is by definition a managed-code process, so a co-occurring UsageLog confirms in-process .NET execution on the same host and corroborates the load.
  - id: 4508a70e-97ef-4300-b62b-ff27992990ea
    name: DotNet CLR DLL Loaded By Scripting Applications
    reason: Unexpected CLR load into wscript/cscript is a common script-delivered route into .NET execution. As a precursor on the same host it points at how the managed-code context that reached PCRE.NET's codegen path was first spun up.
  - id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    reason: Sibling arbitrary-.NET-code-execution primitive. An operator abusing PCRE.NET to run code inside a trusted .NET host often also reaches for dotnet.exe DLL/csproj execution; seeing it on the same host widens one load into an execution pattern.
  - id: 850d55f9-6eeb-4492-ad69-a72338f65ba4
    name: C# IL Code Compilation Via Ilasm.EXE
    reason: Dynamic compile-to-assembly-then-load is the manual version of what PCRE.NET automates (it compiles a crafted pattern to a DLL and loads it). Ilasm compilation on the same host in the window is the same compile->load tradecraft surfacing explicitly.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Reflective assembly loading is the in-memory analog of the same dynamic-.NET-load tradecraft and a frequent co-technique (load/execute attacker .NET without a normal module reference). Co-occurrence on the host strengthens the case that the PCRE.NET load was offensive, not a benign app.
  - id: 38646daa-e78f-4ace-9de0-55547b2d30da
    name: PUA - Seatbelt Execution
    reason: Once in-process .NET execution is gained, GhostPack host/privilege reconnaissance (Seatbelt) is the canonical immediate follow-on from this very research lineage (tifkin_/SpecterOps). Its presence on the same host turns a single code-exec primitive into an active-intrusion timeline.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PCRE.NET module written into its deterministic temp dir on this host (identify the dropped file and writing process)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Bb][Aa]9[Ee][Aa]7344[Aa]4[Aa]5[Ff]591[Dd]6[Ee]5[Dd][Cc]32[Aa]13494[Bb]\\.*/
    pivot_on:
    - host
    window: 1h
  - name: .NET runtime and JIT modules (clr/clrjit/coreclr/mscoree) loaded on this host (confirm managed-code execution context)
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\([Cc][Ll][Rr]\.[Dd][Ll][Ll]|[Cc][Ll][Rr][Jj][Ii][Tt]\.[Dd][Ll][Ll]|[Cc][Oo][Rr][Ee][Cc][Ll][Rr]\.[Dd][Ll][Ll]|[Mm][Ss][Cc][Oo][Rr][Ee][Ee]([Ii])?\.[Dd][Ll][Ll])/
    pivot_on:
    - host
    window: 1h
  - name: On-the-fly .NET compilation and assembly-execution hosts launched on this host (csc/vbc/ilasm/dotnet/installutil/regasm/regsvcs/aspnet_compiler)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Ss][Cc]\.[Ee][Xx][Ee]|[Vv][Bb][Cc]\.[Ee][Xx][Ee]|[Cc][Vv][Tt][Rr][Ee][Ss]\.[Ee][Xx][Ee]|[Ii][Ll][Aa][Ss][Mm]\.[Ee][Xx][Ee]|[Dd][Oo][Tt][Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: LSASS process access / credential dumping on this host (classic follow-on once code execution is achieved)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Reflective / in-memory .NET assembly loading in PowerShell on this host (Reflection.Assembly, Reflection.Emit, Add-Type)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Ee][Mm][Ii][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Tt][Yy][Pp][Ee].*/)
    pivot_on:
    - host
    window: 2h
