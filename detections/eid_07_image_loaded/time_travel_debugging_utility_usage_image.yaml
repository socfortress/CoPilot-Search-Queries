name: Time Travel Debugging Utility Usage - Image
id: e76c8240-d68f-4773-8880-5c6f63595aaf
version: 1
schema_version: "1.0"
date: "2022-12-02"
author: Ensar Şamil, @sblmsrsn, @oscd_initiative
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e76c8240-d68f-4773-8880-5c6f63595aaf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of Time Travel Debugging Utility. Adversaries can execute
  malicious processes and dump processes, such as lsass.exe, via tttracer.exe.
  MITRE ATT&CK: T1218, T1003.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ttdrecord.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ttdwriter.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ttdloader.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\ttdrecord.dll'; data_win_eventdata_imageLoaded matches '*\ttdwriter.dll';
  data_win_eventdata_imageLoaded matches '*\ttdloader.dll'.

known_false_positives: >
  Legitimate usage by software developers/testers. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Tttracer/
  - https://twitter.com/mattifestation/status/1196390321783025666
  - https://twitter.com/oulusoyum/status/1191329746069655553
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Time Travel Debugging Utility Usage - Image detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1003.001
  custom_tags:
    - travel
    - debugging
    - utility
    - image_load
    - sysmon
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Tt][Tt][Dd][Rr][Ee][Cc][Oo][Rr][Dd]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Tt][Dd][Ww][Rr][Ii][Tt][Ee][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Tt][Dd][Ll][Oo][Aa][Dd][Ee][Rr]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0b4ae027-2a2d-4b93-8c7e-962caaba5b2a
    name: Time Travel Debugging Utility Usage
    reason: 'The EventID 1 sibling of this same binary: it fires on processes PARENTED by tttracer.exe, i.e. the payload TTD proxy-launched (T1218). When these TTD DLLs load, this reveals what was executed under the signed debugger with spoofed parentage.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: EventID 10 LSASS handle access with dump-shaped grantedAccess and dbgcore/dbghelp in the call trace -- the exact debugger DLLs TTD relies on. Confirms the /dumpFull -attach lsass credential-theft (T1003.001) use of this utility.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: A co-occurring LSASS memory-dump artifact landing on disk on the same host within the window corroborates that lsass credentials were harvested here, whether by TTD's trace or a parallel dumper.
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: The classic LOLBin LSASS-dump method operators try alongside or instead of TTD. Same objective on the same host in the window ties both into one credential-access incident.
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: cdb.exe ships in the same Debugging Tools for Windows / WinDbg package as tttracer and is abused with the identical 'run code or read memory via a signed Microsoft debugger' tradecraft -- its presence points at the same operator and toolset.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on collection: compressing the LSASS trace/dump into an archive to stage it for exfiltration after TTD captured the process memory.'
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: The canonical next step after LSASS credential theft -- reusing the harvested credentials to move laterally via PsExec from this host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Time Travel Debugging (tttracer) launch & proxy-spawned child on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Tt][Tt][Rr][Aa][Cc][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Tt][Tt][Tt][Rr][Aa][Cc][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Tt][Tt][Tt][Rr][Aa][Cc][Ee][Rr].*/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential-dump activity on this host (handle access, dump command line, or dump file)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp])\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: TTD trace, memory-dump output & archive staging on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Rr][Uu][Nn]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.7[Zz]/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Aa][Rr]/)
    pivot_on:
    - host
    window: 4h
  - name: Other Microsoft-debugger & signed-binary-proxy LOLBin abuse on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Dd][Bb]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Dd][Bb][Gg]\.[Ee][Xx][Ee]|\\[Nn][Tt][Ss][Dd]\.[Ee][Xx][Ee]|\\[Kk][Dd]\.[Ee][Xx][Ee]|\\[Dd][Bb][Gg][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: This account's remote/network logons across hosts (harvested-credential reuse)
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625") AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
