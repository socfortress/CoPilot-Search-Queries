name: Potential SmadHook.DLL Sideloading
id: 24b6cf51-6122-469e-861a-22974e9c1e5b
version: 1
schema_version: "1.0"
date: "2023-06-01"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 24b6cf51-6122-469e-861a-22974e9c1e5b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "SmadHook.dll", a DLL used by SmadAV
  antivirus. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\SmadHook32c.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\SmadHook64c.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Program Files (x86)\\SMADAV\\SmadavProtect32.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Program Files (x86)\\SMADAV\\SmadavProtect64.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Program Files\\SMADAV\\SmadavProtect32.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Program Files\\SMADAV\\SmadavProtect64.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files (x86)\\\\SMADAV\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files\\\\SMADAV\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\SmadHook32c.dll'; data_win_eventdata_imageLoaded matches
  '*\SmadHook64c.dll'; data_win_eventdata_image equals 'C:\Program Files
  (x86)\SMADAV\SmadavProtect32.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.checkpoint.com/2023/malware-spotlight-camaro-dragons-tinynote-backdoor/
  - https://www.qurium.org/alerts/targeted-malware-against-crph/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential SmadHook.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - smadhook
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Ss][Mm][Aa][Dd][Hh][Oo][Oo][Kk]32[Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ss][Mm][Aa][Dd][Hh][Oo][Oo][Kk]64[Cc]\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ss][Mm][Aa][Dd][Aa][Vv]\\[Ss][Mm][Aa][Dd][Aa][Vv][Pp][Rr][Oo][Tt][Ee][Cc][Tt]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ss][Mm][Aa][Dd][Aa][Vv]\\[Ss][Mm][Aa][Dd][Aa][Vv][Pp][Rr][Oo][Tt][Ee][Cc][Tt]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Mm][Aa][Dd][Aa][Vv]\\[Ss][Mm][Aa][Dd][Aa][Vv][Pp][Rr][Oo][Tt][Ee][Cc][Tt]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Mm][Aa][Dd][Aa][Vv]\\[Ss][Mm][Aa][Dd][Aa][Vv][Pp][Rr][Oo][Tt][Ee][Cc][Tt]64\.[Ee][Xx][Ee]/) AND (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ss][Mm][Aa][Dd][Aa][Vv]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Mm][Aa][Dd][Aa][Vv]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
    name: Potential Antivirus Software DLL Sideloading
    reason: SmadHook32c/64c.dll is a SmadAV antivirus library, so this is the same EID7 image-load abuse on the broader AV-DLL set; the nearest-neighbour detection that fires on the identical technique if the loader also sideloads other AV DLLs on the host.
  - id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
    name: Third Party Software DLL Sideloading
    reason: SmadAV is third-party endpoint software; this flags the same Sysmon EID7 sideloading pattern across other third-party DLLs the same dropped bundle may load, expanding scope on the same host.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Flags a known-abusable DLL loaded from a non-standard path, the exact mechanic here (SmadHook*.dll loaded outside Program Files\SMADAV); corroborates the sideload and catches companion abusable DLLs in the same bundle.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Broad EID7 hunt for DLLs loaded from outside system32/syswow64/winsxs; the SmadHook load from a user-writable directory surfaces here too and reveals any sibling hijacked libraries the same process loaded.
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: PlugX is the backdoor this actor cluster delivers via DLL sideloading; a PlugX sideload-loader run from an uncommon location on the same host within the window is the likely follow-on/co-occurring payload stage of the same intrusion.
  - id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
    name: Mustang Panda Dropper
    reason: SmadHook sideloading is a signature loader of the Camaro Dragon / Mustang Panda cluster (TinyNote backdoor); this dropper's process parameters, if seen on the host, are the delivery precursor that staged the sideload bundle on disk.
  - id: 7806bb49-f653-48d3-a915-5115c1a85234
    name: Potential APT Mustang Panda Activity Against Australian Gov
    reason: Same actor cluster's hands-on-keyboard command lines; co-occurring on the host they strongly corroborate that the SmadHook sideload is a Mustang Panda intrusion rather than a benign SmadAV update.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SmadHook / companion DLL written to a user-writable path on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ss][Mm][Aa][Dd][Hh][Oo][Oo][Kk].*\.[Dd][Ll][Ll]/ OR (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)))
    pivot_on:
    - host
    window: 2h
  - name: Sideload loader / staged payload executing from a non-standard location on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Backdoor C2 - network connections or DNS from processes in sideload-typical paths
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Autorun persistence established on this host (Run / Winlogon / IFEO / schtasks / sc)
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|\\[Ss][Cc]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: Host / AD / network discovery burst via recon LOLBins on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|\\[Aa][Rr][Pp]\.[Ee][Xx][Ee]|\\[Rr][Oo][Uu][Tt][Ee]\.[Ee][Xx][Ee]|\\[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee]|\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
