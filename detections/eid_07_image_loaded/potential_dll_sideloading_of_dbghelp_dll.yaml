name: Potential DLL Sideloading Of DBGHELP.DLL
id: 6414b5cd-b19d-447e-bb5e-9f03940b5784
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6414b5cd-b19d-447e-bb5e-9f03940b5784
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "dbghelp.dll". MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\dbghelp.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SoftwareDistribution\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SystemTemp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\Anaconda3\\\\Lib\\\\site-packages\\\\vtrace\\\\platforms\\\\windll\\\\amd64\\\\dbghelp.dll"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\Anaconda3\\\\Lib\\\\site-packages\\\\vtrace\\\\platforms\\\\windll\\\\i386\\\\dbghelp.dll"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\Epic Games\\\\Launcher\\\\Engine\\\\Binaries\\\\ThirdParty\\\\DbgHelp\\\\dbghelp.dll"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\Epic Games\\\\MagicLegends\\\\x86\\\\dbghelp.dll"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*opera\\\\Opera Installer Temp\\\\opera_package*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\assistant\\\\dbghelp.dll"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\dbghelp.dll'; data_win_eventdata_imageLoaded matches 'C:\Program Files
  (x86)\*'; data_win_eventdata_imageLoaded matches 'C:\Program Files\*', among
  other conditions.

known_false_positives: >
  Legitimate applications loading their own versions of the DLL mentioned in
  this rule. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://hijacklibs.net/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Of DBGHELP.DLL detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - dbghelp
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee][Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm][Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/) AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/.*\\[Aa][Nn][Aa][Cc][Oo][Nn][Dd][Aa]3\\[Ll][Ii][Bb]\\[Ss][Ii][Tt][Ee]-[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]\\[Vv][Tt][Rr][Aa][Cc][Ee]\\[Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm][Ss]\\[Ww][Ii][Nn][Dd][Ll][Ll]\\[Aa][Mm][Dd]64\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Nn][Aa][Cc][Oo][Nn][Dd][Aa]3\\[Ll][Ii][Bb]\\[Ss][Ii][Tt][Ee]-[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]\\[Vv][Tt][Rr][Aa][Cc][Ee]\\[Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm][Ss]\\[Ww][Ii][Nn][Dd][Ll][Ll]\\[Ii]386\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ee][Pp][Ii][Cc] [Gg][Aa][Mm][Ee][Ss]\\[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\\[Ee][Nn][Gg][Ii][Nn][Ee]\\[Bb][Ii][Nn][Aa][Rr][Ii][Ee][Ss]\\[Tt][Hh][Ii][Rr][Dd][Pp][Aa][Rr][Tt][Yy]\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ee][Pp][Ii][Cc] [Gg][Aa][Mm][Ee][Ss]\\[Mm][Aa][Gg][Ii][Cc][Ll][Ee][Gg][Ee][Nn][Dd][Ss]\\[Xx]86\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR (data_win_eventdata_imageLoaded:/.*[Oo][Pp][Ee][Rr][Aa]\\[Oo][Pp][Ee][Rr][Aa] [Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr] [Tt][Ee][Mm][Pp]\\[Oo][Pp][Ee][Rr][Aa]_[Pp][Aa][Cc][Kk][Aa][Gg][Ee].*/ AND data_win_eventdata_imageLoaded:/.*\\[Aa][Ss][Ss][Ii][Ss][Tt][Aa][Nn][Tt]\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 416bc4a2-7217-4519-8dc7-c3271817f1d5
    name: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location
    reason: Same debug-help DLL family (dbghelp/dbgcore) loaded from a user-writable path; typically co-fires on this very image-load event with a wider location net, confirming the abnormal load path is not a one-off quirk.
  - id: bdc64095-d59a-42a2-8588-71fd9c9d9abc
    name: Suspicious Unsigned Dbghelp/Dbgcore DLL Loaded
    reason: 'Signature-status companion on the same load: an attacker-planted dbghelp.dll is unsigned, so this firing proves the loaded DLL is adversary-supplied rather than a legitimately-copied Microsoft binary.'
  - id: 273a8dd8-3742-4302-bcc7-7df5a80fe425
    name: VMMap Unsigned Dbghelp.DLL Potential Sideloading
    reason: 'Concrete named vector for this exact DLL: Sysinternals VMMap loading an unsigned dbghelp.dll from C:\Debuggers is one specific instance of the generic sideload this rule detects.'
  - id: 9ca2bf31-0570-44d8-a543-534c47c33ed7
    name: Potential DLL Sideloading Of DBGCORE.DLL
    reason: 'Sister debug library: dbgcore.dll is shipped and abused alongside dbghelp.dll for the same MiniDumpWriteDump capability, so a matching dbgcore sideload on the host belongs to the same tooling.'
  - id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
    name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
    reason: 'Motive and immediate follow-on: dbghelp.dll exports MiniDumpWriteDump, and this rule catches that DLL being used to read LSASS memory - the credential-dumping step this sideload exists to enable.'
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'On-disk precursor: a DLL written by an unusual process into an application''s dependency folder to be loaded by search order - the write that creates the sideload condition this image-load fires on.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Generic form of the same technique - any known-abusable DLL loaded from a suspicious path; co-occurs on the host when dbghelp.dll is one of several planted DLLs in a sideloading campaign.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Output artefact of abusing dbghelp''s MiniDumpWriteDump: an LSASS memory dump (.dmp) written to disk; its appearance on the same host confirms the credential dump actually succeeded.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Debug-help DLL (dbghelp/dbgcore) planted on disk on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 6h
  - name: LSASS memory read via Dbghelp/Dbgcore call stack on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential-dump tooling and dump output on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp][0-9]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/)
    pivot_on:
    - host
    window: 2h
  - name: Other DLLs sideloaded from user-writable paths on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: Archive/dropper staging of a sideloading bundle on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\7[Zz].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Zz][Ii][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Aa][Nn][Dd]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Uu][Nn][Tt]-[Dd][Ii][Ss][Kk][Ii][Mm][Aa][Gg][Ee].*/)
    pivot_on:
    - host
    window: 6h
