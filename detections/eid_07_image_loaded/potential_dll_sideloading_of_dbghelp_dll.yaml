[Xx]86\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR (data_win_eventdata_imageLoaded:/.*[Oo][Pp][Ee][Rr][Aa]\\[Oo][Pp][Ee][Rr][Aa] [Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr] [Tt][Ee][Mm][Pp]\\[Oo][Pp][Ee][Rr][Aa]_[Pp][Aa][Cc][Kk][Aa][Gg][Ee].*/ AND data_win_eventdata_imageLoaded:/.*\\[Aa][Ss][Ss][Ii][Ss][Tt][Aa][Nn][Tt]\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/))

