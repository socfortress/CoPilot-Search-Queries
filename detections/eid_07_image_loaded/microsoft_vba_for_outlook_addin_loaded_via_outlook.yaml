name: Microsoft VBA For Outlook Addin Loaded Via Outlook
id: 9a0b8719-cd3c-4f0a-90de-765a4cb3f5ed
version: 1
schema_version: "1.0"
date: "2024-03-12"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9a0b8719-cd3c-4f0a-90de-765a4cb3f5ed
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects outlvba (Microsoft VBA for Outlook Addin) DLL being loaded by the
  outlook process. MITRE ATT&CK: T1204.002.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\outlook.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\outlvba.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\outlook.exe'; data_win_eventdata_imageLoaded matches '*\outlvba.dll'.

known_false_positives: >
  Legitimate macro usage. Add the appropriate filter according to your
  environment. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=58
  - https://attack.mitre.org/techniques/T1204/002/

response:
  message: >
    Microsoft VBA For Outlook Addin Loaded Via Outlook detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    MITRE ATT&CK: T1204.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.002
  custom_tags:
    - microsoft
    - outlook
    - addin
    - image_load
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Oo][Uu][Tt][Ll][Vv][Bb][Aa]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
    name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
    reason: 'Precursor and direct cause: setting Outlook\LoadMacroProviderOnBoot=1 is the exact registry switch that forces Outlook to load the VBA macro provider (outlvba.dll) on every start. If this fired recently on the host, it explains this very DLL load as attacker-planted persistence rather than an analyst using macros.'
  - id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
    name: New Outlook Macro Created
    reason: 'Precursor: VbaProject.OTM is the Outlook macro store that outlvba.dll compiles and runs. A write to it just before this load is the macro that the newly-initialized VBA engine is about to execute.'
  - id: 117d3d3a-755c-4a61-b23e-9171146d094c
    name: Suspicious Outlook Macro Created
    reason: 'Precursor, higher-fidelity: same VbaProject.OTM store, but written by a process other than outlook.exe - i.e. an external tool planted the macro that outlvba.dll then loads and runs. Strongly implicates a malicious macro behind this load.'
  - id: e3b50fa5-3c3f-444e-937b-0a99d33731cd
    name: Outlook Macro Execution Without Warning Setting Enabled
    reason: 'Precursor: Outlook\Security\Level=1 disables the macro-security prompt so the OTM macro runs silently the moment the VBA engine loads. Pairing this with the outlvba load means the macro executed without any user warning.'
  - id: c3cefdf4-6703-4e1c-bad8-bf422fc5015a
    name: Outlook Security Settings Updated - Registry
    reason: 'Precursor, broad safety-net: any tampering with Outlook security-registry values (macro trust, VBA warnings) that weakens Outlook so a loaded macro can run; catches enabling variants the narrow Security\Level rule misses.'
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: 'Follow-on, the payload: outlook.exe spawning a suspicious child (script interpreter / LOLBin) is what the VBA macro actually does after the engine loads. This is the execution step that turns a benign-looking DLL load into an incident.'
  - id: e212d415-0e93-435f-9e1a-f29005bb4723
    name: Suspicious Remote Child Process From Outlook
    reason: 'Follow-on: the VBA macro launching a child from an SMB/WebDAV remote path - a macro pulling and running a remotely-hosted stage-2 payload after the engine initializes.'
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: 'Co-occurring delivery: a program executed from Outlook''s attachment temp directory is the phishing attachment that commonly delivers the initial access which then weaponizes Outlook VBA. Ties this load back to the inbound email.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'VBA macro payload: Outlook spawning a script interpreter or LOLBin child'
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: 'VBA weaponization setup on this host: VbaProject.OTM written or Outlook macro-security registry enabled'
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Vv][Bb][Aa][Pp][Rr][Oo][Jj][Ee][Cc][Tt]\.[Oo][Tt][Mm]/) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ll][Oo][Aa][Dd][Mm][Aa][Cc][Rr][Oo][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Oo][Nn][Bb][Oo][Oo][Tt]/ OR data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Ll][Ee][Vv][Ee][Ll]/ OR data_win_eventdata_targetObject:/.*[Vv][Bb][Aa][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss]/))
    pivot_on:
    - host
    window: 6h
  - name: Outbound C2 / payload download by the VBA host (outlook.exe network and DNS)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: 'Phishing attachment staged: executable or script written to Outlook''s attachment temp directory'
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Oo][Ll][Kk][0-9A-Fa-f].*/) AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Cc][Rr]|[Jj][Ss]|[Vv][Bb][Ss]|[Vv][Bb][Ee]|[Ww][Ss][Ff]|[Hh][Tt][Aa]|[Pp][Ss]1|[Bb][Aa][Tt]|[Cc][Mm][Dd]|[Ll][Nn][Kk]|[Ii][Ss][Oo]|[Dd][Oo][Cc][Mm]|[Xx][Ll][Ss][Mm]|[Pp][Pp][Tt][Mm])/
    pivot_on:
    - host
    window: 6h
  - name: 'Persistence consolidation after the macro: Run-key or scheduled-task creation on this host'
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
