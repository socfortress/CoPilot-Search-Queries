name: Unsigned Mfdetours.DLL Sideloading
id: 948a0953-f287-4806-bbcb-3b2e396df89f
version: 1
schema_version: "1.0"
date: "2023-08-11"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 948a0953-f287-4806-bbcb-3b2e396df89f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DLL sideloading of unsigned "mfdetours.dll". Executing "mftrace.exe"
  can be abused to attach to an arbitrary process and force load any DLL named
  "mfdetours.dll" from the current directory of execution. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\mfdetours.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - exists:
            field: "data_win_eventdata_signatureStatus"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*:\\\\Program Files (x86)\\\\Windows Kits\\\\10\\\\bin\\\\*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_signatureStatus:
                          value: "Valid"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signatureStatus
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\mfdetours.dll'; data_win_eventdata_imageLoaded matches '*:\Program Files
  (x86)\Windows Kits\10\bin\*'; data_win_eventdata_signatureStatus equals
  'Valid'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Unsigned Mfdetours.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_signatureStatus: $data_win_eventdata_signatureStatus$.
    MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_signatureStatus
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - unsigned
    - mfdetours
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Mm][Ff][Dd][Ee][Tt][Oo][Uu][Rr][Ss]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND _exists_:data_win_eventdata_signatureStatus AND NOT (data_win_eventdata_imageLoaded:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Kk][Ii][Tt][Ss]\\10\\[Bb][Ii][Nn]\\.*/ AND data_win_eventdata_signatureStatus:/[Vv][Aa][Ll][Ii][Dd]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3d48c9d3-1aa6-418d-98d3-8fd3c01a564e
    name: Potential Mftrace.EXE Abuse
    reason: 'Process-execution side of this exact attack: Mftrace.exe is the signed LOLBIN that force-loads the unsigned mfdetours.dll. A child process spawned by mftrace.exe is the sideloaded code running under a trusted process - the strongest confirmation and the post-exploitation pivot.'
  - id: d2605a99-2218-4894-8fd3-2afb7946514d
    name: Potential Mfdetours.DLL Sideloading
    reason: 'Sibling detection for the same mfdetours.dll sideload: it is location-gated (anything outside the Windows Kits bin) while this rule is signature-gated (unsigned), so both fire on the same image-load event and corroborate it.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Same technique on the same host from a broader angle - an attacker-planted mfdetours.dll in a writable/suspicious directory is exactly an abusable DLL sideloaded from a suspicious location, surfacing the drop path and any sibling sideloads.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: 'Generalized form of this very event: a signed Windows utility (mftrace.exe) proxy-loading an unsigned/untrusted DLL. Confirms the sideload and catches the same trusted-binary-proxy trick with other LOLBIN/DLL pairs on the host.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Broad T1574.001 search-order-hijacking hunt over image loads; expands the single alert into any other DLL search-order hijacks occurring on the host during the same intrusion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mfdetours.DLL drop and Mftrace.EXE launch that set up this sideload
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Mm][Ff][Dd][Ee][Tt][Oo][Uu][Rr][Ss]\.[Dd][Ll][Ll]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: C2 beacon or DNS from the Mftrace.EXE sideload host process
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by Mftrace.EXE (sideloaded code executing)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other unsigned/untrusted DLLs loaded from user-writable paths on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/) AND _exists_:data_win_eventdata_signatureStatus AND NOT data_win_eventdata_signatureStatus:/[Vv][Aa][Ll][Ii][Dd]/
    pivot_on:
    - host
    window: 2h
  - name: Persistence established after the sideload (Run keys, scheduled tasks)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn].*/)))
    pivot_on:
    - host
    window: 2h
