name: Windows Known GraphicalProton Loaded Modules
id: windows-graphicalproton-loaded-modules-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects DLL modules associated with GraphicalProton backdoor implant used by 
  SVR (Russian Foreign Intelligence). Monitors for specific known malicious DLL 
  names via Sysmon EventID 7. Referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 7

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\AclNumsInvertHost.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ModeBitmapNumericAnimate.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\UnregisterAncestorAppendAuto.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\DeregisterSeekUsers.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ScrollbarHandleGet.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\PerformanceCaptionApi.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\WowIcmpRemoveReg.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\BlendMonitorStringBuild.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\HandleFrequencyAll.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\HardSwapColor.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\LengthInMemoryActivate.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ParametersNamesPopup.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ModeFolderSignMove.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ChildPaletteConnected.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\AddressResourcesSpec.dll"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (Image Loaded) configured and forwarding to Wazuh. 
  IOC-based detection — any match is highly suspicious.

known_false_positives: >
  Unknown. These DLL names are unique to GraphicalProton backdoor.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    GraphicalProton backdoor DLL detected on $agent_name$. 
    DLL: $data_win_eventdata_imageLoaded$. 
    Loading process: $data_win_eventdata_image$. 
    CISA AA23-347A. MITRE ATT&CK: T1574.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []

tags:
  analytic_story:
    - CISA AA23-347A
    - Hellcat Ransomware
    - Water Gamayun
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - graphicalproton
    - svr_backdoor
    - ioc_detection
    - dll_sideloading
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*AclNumsInvertHost\.dll/ OR data_win_eventdata_imageLoaded:/.*ModeBitmapNumericAnimate\.dll/ OR data_win_eventdata_imageLoaded:/.*UnregisterAncestorAppendAuto\.dll/ OR data_win_eventdata_imageLoaded:/.*DeregisterSeekUsers\.dll/ OR data_win_eventdata_imageLoaded:/.*ScrollbarHandleGet\.dll/ OR data_win_eventdata_imageLoaded:/.*PerformanceCaptionApi\.dll/ OR data_win_eventdata_imageLoaded:/.*WowIcmpRemoveReg\.dll/ OR data_win_eventdata_imageLoaded:/.*BlendMonitorStringBuild\.dll/ OR data_win_eventdata_imageLoaded:/.*HandleFrequencyAll\.dll/ OR data_win_eventdata_imageLoaded:/.*HardSwapColor\.dll/ OR data_win_eventdata_imageLoaded:/.*LengthInMemoryActivate\.dll/ OR data_win_eventdata_imageLoaded:/.*ParametersNamesPopup\.dll/ OR data_win_eventdata_imageLoaded:/.*ModeFolderSignMove\.dll/ OR data_win_eventdata_imageLoaded:/.*ChildPaletteConnected\.dll/ OR data_win_eventdata_imageLoaded:/.*AddressResourcesSpec\.dll/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: de7fcadc-04f3-11ec-a241-acde48001122
      name: "AdsiSearcher Account Discovery"
      reason: "same analytic story: CISA AA23-347A"
    - id: bc1dc6b8-c954-11eb-bade-acde48001122
      name: "Detect Empire with PowerShell Script Block Logging"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 8148c29c-c952-11eb-9255-acde48001122
      name: "Detect Mimikatz With PowerShell Script Block Logging"
      reason: "same analytic story: CISA AA23-347A"
    - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
      name: "Detect RClone Command-Line Usage"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 6dca1124-b3ec-11eb-9328-acde48001122
      name: "Detect Renamed RClone"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 236e7c8e-c9d9-11eb-a824-acde48001122
      name: "Disable Logs Using WevtUtil"
      reason: "same analytic story: CISA AA23-347A"
    - id: 114c6bfe-9406-11ec-bcce-acde48001122
      name: "Disabled Kerberos Pre-Authentication Discovery With Get-ADUser"
      reason: "same analytic story: CISA AA23-347A"
    - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
      name: "Domain Controller Discovery with Nltest"
      reason: "same analytic story: CISA AA23-347A"
    - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
      name: "Dump LSASS via comsvcs DLL"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 0b6ee3f4-04e3-11ec-a87d-acde48001122
      name: "Get ADUser with PowerShell"
      reason: "same analytic story: CISA AA23-347A"
    - id: 21432e40-04f4-11ec-b7e6-acde48001122
      name: "Get ADUser with PowerShell Script Block"
      reason: "same analytic story: CISA AA23-347A"
    - id: 8b5ef342-065a-11ec-b0fc-acde48001122
      name: "Get ADUserResultantPasswordPolicy with Powershell"
      reason: "same analytic story: CISA AA23-347A"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "DLL sideloading / execution from user-writable paths on this host"
      query: '(data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/) OR data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/))'
      pivot_on: [host]
      window: 2h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/ OR data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/) OR data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/)'
      pivot_on: [host]
      window: 1h
