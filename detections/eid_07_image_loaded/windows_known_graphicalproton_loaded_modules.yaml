name: Windows Known GraphicalProton Loaded Modules
id: windows-graphicalproton-loaded-modules-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects DLL modules associated with GraphicalProton backdoor implant used by 
  SVR (Russian Foreign Intelligence). Monitors for specific known malicious DLL 
  names via Sysmon EventID 7. Referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 7

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\AclNumsInvertHost.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ModeBitmapNumericAnimate.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\UnregisterAncestorAppendAuto.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\DeregisterSeekUsers.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ScrollbarHandleGet.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\PerformanceCaptionApi.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\WowIcmpRemoveReg.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\BlendMonitorStringBuild.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\HandleFrequencyAll.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\HardSwapColor.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\LengthInMemoryActivate.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ParametersNamesPopup.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ModeFolderSignMove.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\ChildPaletteConnected.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\\\AddressResourcesSpec.dll"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (Image Loaded) configured and forwarding to Wazuh. 
  IOC-based detection — any match is highly suspicious.

known_false_positives: >
  Unknown. These DLL names are unique to GraphicalProton backdoor.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    GraphicalProton backdoor DLL detected on $agent_name$. 
    DLL: $data_win_eventdata_imageLoaded$. 
    Loading process: $data_win_eventdata_image$. 
    CISA AA23-347A. MITRE ATT&CK: T1574.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []

tags:
  analytic_story:
    - CISA AA23-347A
    - Hellcat Ransomware
    - Water Gamayun
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - graphicalproton
    - svr_backdoor
    - ioc_detection
    - dll_sideloading
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*AclNumsInvertHost\.dll/ OR data_win_eventdata_imageLoaded:/.*ModeBitmapNumericAnimate\.dll/ OR data_win_eventdata_imageLoaded:/.*UnregisterAncestorAppendAuto\.dll/ OR data_win_eventdata_imageLoaded:/.*DeregisterSeekUsers\.dll/ OR data_win_eventdata_imageLoaded:/.*ScrollbarHandleGet\.dll/ OR data_win_eventdata_imageLoaded:/.*PerformanceCaptionApi\.dll/ OR data_win_eventdata_imageLoaded:/.*WowIcmpRemoveReg\.dll/ OR data_win_eventdata_imageLoaded:/.*BlendMonitorStringBuild\.dll/ OR data_win_eventdata_imageLoaded:/.*HandleFrequencyAll\.dll/ OR data_win_eventdata_imageLoaded:/.*HardSwapColor\.dll/ OR data_win_eventdata_imageLoaded:/.*LengthInMemoryActivate\.dll/ OR data_win_eventdata_imageLoaded:/.*ParametersNamesPopup\.dll/ OR data_win_eventdata_imageLoaded:/.*ModeFolderSignMove\.dll/ OR data_win_eventdata_imageLoaded:/.*ChildPaletteConnected\.dll/ OR data_win_eventdata_imageLoaded:/.*AddressResourcesSpec\.dll/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e64c8ef3-9f98-40c8-b71e-96110991cb4c
    name: DLL Names Used By SVR For GraphicalProton Backdoor
    reason: Sigma-style sibling keyed on the same GraphicalProton DLL names; co-fires on the same Sysmon EID 7 and confirms the hit across independent rule logic.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: GraphicalProton is loaded by sideloading from a writable path; other abusable DLLs loaded from such folders on the host reveal sibling loaders or further staged implants.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: The implant host binary is kept alive via a scheduled task pointing at the drop folder; this is the usual persistence follow-on.
  - id: windows-scheduled-task-created-public-path-001
    name: Windows Scheduled Task Created Within Public Path
    reason: Persistence task created from Public/ProgramData-style paths where the loader and DLL were staged.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: SVR operators in AA23-347A ran nltest domain/DC discovery from the foothold soon after the implant was running.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Credential theft with Mimikatz is documented in the AA23-347A intrusion chain after the backdoor is established.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dumping via living-off-the-land is the follow-on credential access step enabling lateral movement from the implanted host.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log clearing/disabling is used to hide the implant and subsequent activity (AA23-347A defense evasion).
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task / Run-key persistence created for the sideloading host binary
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/)
    pivot_on:
    - host
    window: 6h
  - name: DLL dropped into user-writable or ProgramData paths (loader staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_targetFilename:/.*\[Uu][Ss][Ee][Rr][Ss]\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/ OR data_win_eventdata_targetFilename:/.*\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_targetFilename:/.*\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Tt][Ee][Mm][Pp]\.*/)
    pivot_on:
    - host
    window: 6h
  - name: Cloud-service C2 lookups (OneDrive / Graph / Dropbox / Mega) from the host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*graph.microsoft.com* OR data_win_eventdata_queryName:*onedrive.live.com* OR data_win_eventdata_queryName:*api.onedrive.com* OR data_win_eventdata_queryName:*login.microsoftonline.com* OR data_win_eventdata_queryName:*dropboxapi.com* OR data_win_eventdata_queryName:*mega.nz* OR data_win_eventdata_queryName:*webhook.site*)
    pivot_on:
    - host
    window: 6h
  - name: Credential theft and domain recon following the implant (LSASS, NTDS, nltest, AD queries)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/))
    pivot_on:
    - host
    window: 6h
  - name: 'Defense evasion: event log clearing and Sysmon/EDR tampering'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* (cl|clear-log).*/) OR (data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Cc]\.?[Ee]?[Xx]?[Ee]? +(stop|delete|config).*[Ss][Yy][Ss][Mm][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/))
    pivot_on:
    - host
    window: 6h
