name: HackTool - SILENTTRINITY Stager DLL Load
id: 75c505b1-711d-4f68-a357-8c3fe37dbf2d
version: 1
schema_version: "1.0"
date: "2023-02-17"
author: Aleksey Potapov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 75c505b1-711d-4f68-a357-8c3fe37dbf2d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects SILENTTRINITY stager dll loading activity. MITRE ATT&CK: T1071.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_description:
              value: "*st2stager*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_description matches
  '*st2stager*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/byt3bl33d3r/SILENTTRINITY
  - https://attack.mitre.org/techniques/T1071/

response:
  message: >
    HackTool - SILENTTRINITY Stager DLL Load detected on host $agent_name$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1071
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071
  custom_tags:
    - hacktool
    - silenttrinity
    - stager
    - image_load
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_description:/.*[Ss][Tt]2[Ss][Tt][Aa][Gg][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 03552375-cc2c-4883-bbe4-7958d5a980be
    name: HackTool - SILENTTRINITY Stager Execution
    reason: 'Same tool and the same st2stager PE-description string, but on process creation (EID 1): this is the process whose module load raised the EID 7 alert. The pair describes one stager running, and the EID 1 hit names the host process, parent and command line that loaded the DLL.'
  - id: 50e54b8d-ad73-43f8-96a1-5191685b17a4
    name: Silenttrinity Stager Msbuild Activity
    reason: 'The C2 half of the same stager: MSBuild.exe (SILENTTRINITY''s flagship inline-task stager) initiating outbound connections on 80/443. Confirms the loaded stager is live and beaconing to its C2 (T1127.001 proxy exec feeding T1071).'
  - id: 213b3148-24ea-11ec-93a2-acde48001122
    name: MSBuild Suspicious Spawned By Script Process
    reason: 'The delivery vector: a wscript/cscript host launching MSBuild to run an attacker-supplied .csproj/.xml inline task is exactly how SILENTTRINITY''s Boo/.NET stager is dropped and compiled on the host moments before st2stager loads.'
  - id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
    name: Suspicious Msbuild Execution By Uncommon Parent Process
    reason: MSBuild spawned by an abnormal parent (not devenv/cmd/CI) is the trusted-developer-utility proxy execution that stands up the ST stager; a direct precursor to the st2stager DLL loading inside that MSBuild process.
  - id: 4508a70e-97ef-4300-b62b-ff27992990ea
    name: DotNet CLR DLL Loaded By Scripting Applications
    reason: 'Same EID 7 image-load family: a script host (wscript/cscript/mshta/wmic/regsvr32) loading clr.dll/mscoree is the generic form of a .NET payload being stood up by a scripting-engine stager, the co-occurring telemetry for SILENTTRINITY''s non-MSBuild (wmic-XSL, HTA) stager variants.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Hands-on-keyboard follow-on: once the IronPython agent is live the operator runs its credential-dump modules, opening LSASS with dump-grade access masks and call traces. This is the usual next objective after a C2 foothold.'
  - id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
    name: WMIC Remote Command Execution
    reason: 'Follow-on lateral movement: SILENTTRINITY''s WMI modules issue ''wmic /node:'' remote commands to pivot from the beachhead to other hosts once the agent is established.'
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: 'Follow-on process injection: the ST agent migrates into or injects code across processes, which surfaces as a CreateRemoteThread (EID 8) from an unusual source image on the same host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MSBuild / .NET trusted-compiler stager host on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: .NET CLR runtime DLL loaded into a process on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Cc][Ll][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Ll][Rr][Jj][Ii][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Ss][Cc][Oo][Rr][Ee][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Ss][Cc][Oo][Rr][Ll][Ii][Bb].*\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound HTTP/HTTPS C2 beacon by stager host / interpreters on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"8080" OR data_win_eventdata_destinationPort:"8443") AND (data_win_eventdata_image:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential access or remote-thread injection on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8")
    pivot_on:
    - host
    window: 2h
  - name: Persistence or lateral-movement launched post-foothold on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\/[Nn][Oo][Dd][Ee]:.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll] [Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR data_win_eventdata_commandLine:/.*[Aa][Cc][Tt][Ii][Vv][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on:
    - host
    window: 4h
