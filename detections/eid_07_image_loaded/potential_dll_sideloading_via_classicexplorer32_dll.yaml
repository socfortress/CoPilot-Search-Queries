name: Potential DLL Sideloading Via ClassicExplorer32.dll
id: caa02837-f659-466f-bca6-48bde2826ab4
version: 1
schema_version: "1.0"
date: "2022-12-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: caa02837-f659-466f-bca6-48bde2826ab4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading using ClassicExplorer32.dll from the Classic
  Shell software. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\ClassicExplorer32.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\Program Files\\\\Classic Shell\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\ClassicExplorer32.dll'; data_win_eventdata_imageLoaded matches 'C:\Program
  Files\Classic Shell\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.blackberry.com/en/2022/12/mustang-panda-uses-the-russian-ukrainian-war-to-attack-europe-and-asia-pacific-targets
  - https://app.any.run/tasks/6d8cabb0-dcda-44b6-8050-28d6ce281687/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Via ClassicExplorer32.dll detected on host
    $agent_name$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - classicexplorer32
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Cc][Ll][Aa][Ss][Ss][Ii][Cc][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]32\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Ll][Aa][Ss][Ss][Ii][Cc] [Ss][Hh][Ee][Ll][Ll]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
    name: Mustang Panda Dropper
    reason: 'Direct delivery precursor by the same actor: Mustang Panda''s dropper stages the signed Classic Shell binary plus the trojanized ClassicExplorer32.dll into Temp/Public and schedules it (wtask.exe /create, winwsh.exe). This image-load alert is that dropped set''s sideload firing, so a dropper hit on the same host in the window pins the origin.'
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: ClassicExplorer32 sideloading is Mustang Panda's PlugX loader; this rule flags PlugX's other sideload host-EXEs (hkcmd/CamMute/OleView/etc.) run from uncommon locations. Co-firing means the same T1574.001 PlugX payload is executing from a sibling loader on the host - the follow-on this alert leads to.
  - id: 7806bb49-f653-48d3-a915-5115c1a85234
    name: Potential APT Mustang Panda Activity Against Australian Gov
    reason: 'Same actor''s twin TTP: SolidPDFCreator.dll sideloaded from C:\Users\Public\Libraries plus a CurrentVersion\Run persistence pointing there. Its presence on the host corroborates a Mustang Panda intrusion and shows the Run-key persistence they plant right after the sideload.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Generic EID 7 hunt for DLLs loaded outside system32/syswow64/winsxs/wbem. ClassicExplorer32 loaded from a user-writable path independently trips it, so co-firing corroborates the search-order-hijack mechanism and surfaces any sibling hijacked libraries on the same host.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: The generic form of this very behaviour - a known-abusable DLL (coreclr/libcef/zipdll/...) sideloaded from Public/PerfLogs/Temp. If it fires on the same host, the attacker dropped a second sideloading DLL into the same user-writable staging folder, i.e. a broader toolset, not a one-off.
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: Mustang Panda/PlugX routinely stage the sideloading set in %TEMP%. A Temp-path DLL load on the host confirms where the ClassicExplorer32 set was dropped and reveals co-staged modules loaded from the same temp directory.
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: 'Upstream delivery vector: the signed-EXE + malicious-DLL sideloading set is commonly wrapped in an ISO inside an archive to defeat mark-of-the-web. An archiver spawning an ISO tool earlier on the host points to how the sideloaded payload arrived.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Drop of ClassicExplorer32.dll outside the Classic Shell install on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Cc][Ll][Aa][Ss][Ss][Ii][Cc][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]32\.[Dd][Ll][Ll]/ AND NOT data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Ll][Aa][Ss][Ss][Ii][Cc] [Ss][Hh][Ee][Ll][Ll]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: C2 beaconing (network + DNS) from processes running in user-writable paths on this host
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Autorun (Run/RunOnce) persistence pointing at a user-writable path on this host
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND (data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_details:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_details:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_details:/.*[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_details:/.*[Tt][Ee][Mm][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Other unsigned DLLs loaded from user-writable / non-standard paths on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/) AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/
    pivot_on:
    - host
    window: 2h
