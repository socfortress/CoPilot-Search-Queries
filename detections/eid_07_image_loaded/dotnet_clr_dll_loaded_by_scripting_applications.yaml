name: DotNet CLR DLL Loaded By Scripting Applications
id: 4508a70e-97ef-4300-b62b-ff27992990ea
version: 1
schema_version: "1.0"
date: "2023-02-23"
author: omkar72, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4508a70e-97ef-4300-b62b-ff27992990ea
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects .NET CLR DLLs being loaded by scripting applications such as wscript
  or cscript. This could be an indication of potential suspicious execution.
  MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmstp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msxsl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\clr.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\mscoree.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\mscorlib.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\cmstp.exe'; data_win_eventdata_image matches '*\cscript.exe';
  data_win_eventdata_image matches '*\mshta.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/tyranid/DotNetToJScript
  - https://thewover.github.io/Introducing-Donut/
  - https://web.archive.org/web/20230329154538/https://blog.menasec.net/2019/07/interesting-difr-traces-of-net-clr.html
  - https://web.archive.org/web/20221026202428/https://gist.github.com/code-scrap/d7f152ffcdb3e0b02f7f394f5187f008
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    DotNet CLR DLL Loaded By Scripting Applications detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - dotnet
    - scripting
    - applications
    - image_load
    - sysmon
    - execution
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Xx][Ss][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_imageLoaded:/.*\\[Cc][Ll][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Ss][Cc][Oo][Rr][Ee][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Ss][Cc][Oo][Rr][Ll][Ii][Bb]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Immediate precursor: this is the process-creation that launches the very wscript/cscript/mshta (from a user directory) which then loads clr.dll/mscoree.dll here; gives the loader''s command line and the dropped script path that this image-load lacks.'
  - id: 67f113fa-e23d-4271-befa-30113b3e08b1
    name: Suspicious JavaScript Execution Via Mshta.EXE
    reason: 'Precursor for the mshta path: DotNetToJScript/GadgetToJScript emit JScript that mshta runs, and that JScript is exactly what forces mshta.exe to load the CLR this rule flags.'
  - id: 8d63dadf-b91b-4187-87b6-34a1114577ea
    name: Potential Remote SquiblyTwo Technique Execution
    reason: 'Precursor for the wmic path: wmic /FORMAT fetching a remote XSL with embedded JScript/VBScript is what drives wmic.exe to load the CLR; fires at the process-creation this image-load follows.'
  - id: 06ce37c2-61ab-4f05-9ff5-b1a96d18ae32
    name: WMIC Loading Scripting Libraries
    reason: 'Sibling image-load on the same host: wmic.exe loading jscript.dll/vbscript.dll is the SquiblyTwo script-engine layer sitting directly beneath the CLR load, corroborating that wmic (one of this rule''s LOLBins) is executing attacker script in memory.'
  - id: e0b06658-7d1d-4cd3-bf15-03467507ff7c
    name: Suspicious DotNET CLR Usage Log Artifact
    reason: 'Confirming on-disk fingerprint: clr.dll writes \UsageLogs\<proc>.exe.log (cscript.exe.log, cmstp.exe.log, ...) once the assembly finishes; its presence on the same host proves the in-memory .NET actually executed in the script host rather than a benign image-load.'
  - id: d13c43f0-f66b-4279-8b2c-5912077c1780
    name: CLR DLL Loaded Via Office Applications
    reason: 'Likely root/sibling: a weaponized Office document loading the CLR itself, or its macro spawning the script host, is the common origin of this chain; the same in-memory .NET technique on the same host within the window points to a phishing-doc root cause.'
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Follow-on: after staging .NET in memory the script host spawns rundll32/regsvr32/PowerShell (Pikabot/Qakbot pattern) - the next stage launched by the process this rule flagged.'
  - id: c7e91a02-d771-4a6d-a700-42587e0b1095
    name: Network Connection Initiated By Regsvr32.EXE
    reason: 'Follow-on C2: regsvr32 (a LOLBin in this rule) beaconing out after loading the CLR is the download/command-and-control step that completes the loader chain on the same host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Launch of the .NET-loading script host / LOLBin (command line + parent)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Mm][Ii][Cc]|[Mm][Ss][Xx][Ss][Ll]|[Cc][Mm][Ss][Tt][Pp])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: CLR execution fingerprint on disk (UsageLogs\*.exe.log)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Aa][Gg][Ee][Ll][Oo][Gg][Ss]\\.*\.[Ee][Xx][Ee]\.[Ll][Oo][Gg]/
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by the script host / LOLBin
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Mm][Ii][Cc]|[Mm][Ss][Xx][Ss][Ll]|[Cc][Mm][Ss][Tt][Pp])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network or DNS by the script host / LOLBin (staging fetch or C2)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\([Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Mm][Ii][Cc]|[Mm][Ss][Xx][Ss][Ll]|[Cc][Mm][Ss][Tt][Pp])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: AMSI/ETW tamper or in-memory reflection assembly load on this host
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd]|[Aa][Mm][Ss][Ii][Ss][Cc][Aa][Nn][Bb][Uu][Ff][Ff][Ee][Rr]|[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss]|[Ee][Tt][Ww][Ee][Vv][Ee][Nn][Tt][Ww][Rr][Ii][Tt][Ee]|[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]).*/
    pivot_on:
    - host
    window: 2h
