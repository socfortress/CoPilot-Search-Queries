name: Potential Edputil.DLL Sideloading
id: e4903324-1a10-4ed3-981b-f6fe3be3a2c2
version: 1
schema_version: "1.0"
date: "2023-06-09"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e4903324-1a10-4ed3-981b-f6fe3be3a2c2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "edputil.dll". MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\edputil.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\edputil.dll'; data_win_eventdata_imageLoaded matches
  'C:\Windows\System32\*'; data_win_eventdata_imageLoaded matches
  'C:\Windows\SysWOW64\*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://alternativeto.net/news/2023/5/cybercriminals-use-wordpad-vulnerability-to-spread-qbot-malware/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Edputil.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - edputil
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ee][Dd][Pp][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 786cdae8-fefb-4eb2-9227-04e34060db01
    name: Suspicious Wordpad Outbound Connections
    reason: write.exe/WordPad is the exact signed binary that sideloads a planted edputil.dll in the QBot campaign; WordPad initiating outbound connections is the sideloaded payload beaconing to C2 - the strongest co-occurring confirmation on the same host.
  - id: 4fcac6eb-0287-4090-8eea-2602e4c20040
    name: Potential QBot Activity
    reason: Edputil.dll sideloading via WordPad is QBot/QakBot's documented loader; this rule catches QBot's post-foothold behaviour (archive-spawned scripts, the ping-and-type self-copy, regsvr32 from ProgramData) on the same host, confirming the family behind the sideload.
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Once the sideloaded edputil.dll loads the QBot core, QBot continues hands-on-keyboard via rundll32 spawned from cmd/cscript/curl - the immediate follow-on execution step after this image load.
  - id: 339ed3d6-5490-46d0-96a7-8abe33078f58
    name: Qakbot Rundll32 Exports Execution
    reason: QBot runs its copied payload DLL through rundll32 by export ordinal right after the edputil sideload stage; a direct downstream execution of the loader's payload on the same host.
  - id: 1c8e96cd-2bed-487d-9de0-b46c90cade56
    name: Potential Qakbot Registry Activity
    reason: QBot writes its distinctive randomized SOFTWARE registry keys for config/persistence once the edputil loader establishes the foothold - the persistence step that follows a successful sideload.
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'The EID 11 file-create precursor: a sideloadable DLL being planted next to a signed binary is exactly the setup this EID 7 rule then catches loading - the same search-order-hijack technique one step earlier on the same host.'
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: QBot delivers the write.exe + edputil.dll pair inside an ISO/ZIP; this rule flags execution out of a freshly-extracted archive, the delivery step that stages the sideloading pair just before this image load.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: The generic abusable-DLL image-load detection; it can co-fire on the very same edputil.dll loaded from a non-system path, corroborating this specific rule with the broader sideloading heuristic.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WordPad (write.exe) sideloading host beaconing or spawning children
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\([Ww][Rr][Ii][Tt][Ee]|[Ww][Oo][Rr][Dd][Pp][Aa][Dd])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Ww][Rr][Ii][Tt][Ee]|[Ww][Oo][Rr][Dd][Pp][Aa][Dd])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Rr][Ii][Tt][Ee]|[Ww][Oo][Rr][Dd][Pp][Aa][Dd])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: QBot payload execution via regsvr32/rundll32 from a user-writable staging path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]).*\.([Dd][Ll][Ll]|[Tt][Mm][Pp]|[Oo][Cc][Xx]|[Dd][Aa][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: Process injection into QBot's preferred host processes
    query: ((data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND data_win_eventdata_targetImage:/.*\\([Ww][Ee][Rr][Mm][Gg][Rr]|[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr]|[Mm][Oo][Bb][Ss][Yy][Nn][Cc]|[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee][Ss][Ee][Tt][Uu][Pp])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\([Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Dd][Ll][Ll][Hh][Oo][Ss][Tt]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: QBot-style host and domain reconnaissance burst
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]|[Aa][Rr][Pp]|[Rr][Oo][Uu][Tt][Ee]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Cc][Mm][Dd][Kk][Ee][Yy]|[Nn][Ee][Tt]1?|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Planting of the edputil.dll / copied WordPad sideloader on disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ee][Dd][Pp][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\([Ww][Rr][Ii][Tt][Ee]|[Ww][Oo][Rr][Dd][Pp][Aa][Dd])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
