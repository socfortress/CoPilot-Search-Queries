name: Kapeka Backdoor Loaded Via Rundll32.EXE
id: a7e6b1f9-8d2c-4f1e-9a7d-63e4c8a2bf4c
version: 1
schema_version: "1.0"
date: "2024-07-03"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a7e6b1f9-8d2c-4f1e-9a7d-63e4c8a2bf4c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the Kapeka Backdoor binary being loaded by rundll32.exe. The Kapeka
  loader drops a backdoor, which is a DLL with the '.wll' extension masquerading
  as a Microsoft Word Add-In. MITRE ATT&CK: T1204.002, T1218.011.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\ProgramData*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\AppData\\\\Local\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - regexp:
            data_win_eventdata_imageLoaded: ".*([a-zA-Z]{5,6}\\.wll).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_imageLoaded matches '*:\ProgramData*';
  data_win_eventdata_imageLoaded matches '*\AppData\Local\*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/kapeka
  - https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Kapeka Backdoor Loaded Via Rundll32.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1204.002, T1218.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.002
    - T1218.011
  custom_tags:
    - kapeka
    - backdoor
    - rundll32
    - image_load
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/) AND data_win_eventdata_imageLoaded:/.*([a-zA-Z]{5,6}\.wll).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 20228d05-dd68-435d-8b4e-e7e64938880c
    name: Potential Kapeka Decrypted Backdoor Indicator
    reason: 'Precursor: the EID 11 creation of this same 5-6 char .wll file under ProgramData/AppData\Local that rundll32 is now loading. Its presence proves the Kapeka dropper wrote the backdoor on this host moments before the load.'
  - id: e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
    name: Kapeka Backdoor Execution Via RunDLL32.EXE
    reason: 'Same execution from the process-creation angle: the rundll32 ''<path>\<name>.wll",#1 -d'' command line whose image-load this alert observes. Pairing them confirms a dropper-launched backdoor run, not a benign add-in load.'
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: 'Co-fires on the identical rundll32 command line: ''.wll'' is a non-standard (not .dll/.cpl/.inf) extension for rundll32, so this generic LOLBin rule corroborates the Kapeka execution independently of the Kapeka-named signatures.'
  - id: 64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
    name: Kapeka Backdoor Persistence Activity
    reason: 'Follow-on persistence by the same backdoor: schtasks/reg creating the ''Sens Api''/''OneDrive'' entry that relaunches ''rundll32 <path>\.wll,#1'' at startup. The dropper sets this in the same run that produced this load.'
  - id: 6c130acd-0adb-4545-bcc4-2e85d0883c9a
    name: Kapeka Backdoor Scheduled Task Creation
    reason: 'Follow-on persistence seen in the Security log (4698): the ''Sens Api''/''OneDrive'' scheduled task whose action is ''rundll32 <path>\.wll,#1''. This is the admin/SYSTEM persistence branch of the same intrusion.'
  - id: c0c67b21-eb8a-4c84-a395-40473ec3b482
    name: Kapeka Backdoor Autorun Persistence
    reason: 'Follow-on persistence, non-admin branch: the HKCU\...\CurrentVersion\Run ''Sens Api''/''OneDrive'' value pointing at ''rundll32 <path>\.wll #1''. Same backdoor relaunch, via registry autorun instead of a task.'
  - id: cbaa3ef3-07a9-4c8e-82d1-9e40578da7fd
    name: Kapeka Backdoor Configuration Persistence
    reason: 'Co-occurring install step: the backdoor stores its config as a ''Seed'' value under \Cryptography\Providers\{GUID} (a rogue SIP provider) during the same drop. Its presence pins this as Kapeka rather than a generic rundll32 hit.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kapeka dropper artifacts written on this host (.wll in ProgramData/AppData\Local, win32log.exe, crdss.exe)
    query: data_win_system_eventID:"11" AND (((data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/) AND data_win_eventdata_targetFilename:/.*\.[Ww][Ll][Ll]/) OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn]32[Ll][Oo][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Rr][Dd][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound C2 (network connection / DNS) initiated by rundll32.exe on this host
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: rundll32-to-.wll relaunch written as persistence (scheduled task or Run key) on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_commandLine:/.*\.[Ww][Ll][Ll].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND data_win_eventdata_details:/.*\.[Ww][Ll][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Hands-on-keyboard discovery spawned by the rundll32-hosted implant on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|\\[Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Aa][Rr][Pp]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
