name: GAC DLL Loaded Via Office Applications
id: 90217a70-13fc-48e4-b3db-0d836c5824ac
version: 1
schema_version: "1.0"
date: "2023-02-10"
author: Antonlovesdnb
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 90217a70-13fc-48e4-b3db-0d836c5824ac
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects any GAC DLL being loaded by an Office Product. MITRE ATT&CK:
  T1204.002.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\excel.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mspub.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\onenote.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\onenoteim.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\outlook.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powerpnt.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winword.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "C:\\\\Windows\\\\Microsoft.NET\\\\assembly\\\\GAC_MSIL*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\excel.exe'; data_win_eventdata_image matches '*\mspub.exe';
  data_win_eventdata_image matches '*\onenote.exe', among other conditions.

known_false_positives: >
  Legitimate macro usage. Add the appropriate filter according to your
  environment. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/threatpunter/detecting-adversary-tradecraft-with-image-load-event-logging-and-eql-8de93338c16
  - https://attack.mitre.org/techniques/T1204/002/

response:
  message: >
    GAC DLL Loaded Via Office Applications detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1204.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.002
  custom_tags:
    - office
    - applications
    - image_load
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee][Ii][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\\[Gg][Aa][Cc]_[Mm][Ss][Ii][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d13c43f0-f66b-4279-8b2c-5912077c1780
    name: CLR DLL Loaded Via Office Applications
    reason: 'Direct precursor mechanism: the .NET CLR must load into the Office process before any GAC_MSIL managed assembly can be resolved, so this fires in the same process moments before/with this alert and confirms managed code is actually executing inside Office.'
  - id: ff0f2b05-09db-4095-b96d-1b75ca24894a
    name: DotNET Assembly DLL Loaded Via Office Application
    reason: 'Same managed-execution event seen more broadly: a GAC_MSIL DLL is itself a .NET assembly, so this rule is the superset of this one; co-firing on the host rules out a benign one-off add-in and corroborates .NET-in-Office execution.'
  - id: e6ce8457-68b1-485b-9bdd-3c2b5d679aa9
    name: VBA DLL Loaded Via Office Application
    reason: 'Identifies the trigger: the VBA macro engine loading in the same Office process is what drives .NET interop from a document, so its presence marks this GAC load as macro-initiated rather than a signed VSTO add-in.'
  - id: bb2ba6fb-95d4-4a25-89fc-30bb736c021a
    name: PowerShell Core DLL Loaded Via Office Application
    reason: 'Severe escalation of the same behaviour: if System.Management.Automation.dll loads alongside the GAC assembly, the document is running fileless PowerShell in-process without ever spawning powershell.exe.'
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: 'Canonical next step and loudest confirmation: the macro/.NET code spawning cmd/powershell/wscript/mshta/rundll32 is the classic follow-on that turns this in-process load into visible LOLBin execution.'
  - id: Windows-Office-Product-Spawned-Child-Process-For-Download
    name: Windows Office Product Spawned Child Process For Download
    reason: 'Stage-2 retrieval: an Office child process carrying an HTTP/HTTPS URL is the payload download that typically follows document execution, expanding this alert into a delivery chain.'
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: 'Payload execution after the drop: Office launching an executable from a user-writable directory is the stage-2 run once the downloaded binary lands on disk.'
  - id: ab871450-37dc-4a3a-997f-6662aa8ae0f1
    name: Disable Macro Runtime Scan Scope
    reason: 'Enabling precursor: tampering with MacroRuntimeScanScope disables AMSI runtime scanning of macros, which is set right before a malicious macro runs and explains why this managed execution went unblocked.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office product spawning a shell / script host / exec-proxy LOLBin
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Mm][Ss][Pp][Uu][Bb]|[Oo][Nn][Ee][Nn][Oo][Tt][Ee]|[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss]|[Vv][Ii][Ss][Ii][Oo])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]|[Mm][Ss][Bb][Uu][Ii][Ll][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Remote payload-download cradle in a process command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]?:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Obfuscated or fileless PowerShell script-block content
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Executable or script payload dropped to disk by Office or a script host
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Oo][Nn][Ee][Nn][Oo][Tt][Ee]|[Mm][Ss][Pp][Uu][Bb]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Cc][Rr]|[Hh][Tt][Aa]|[Jj][Ss]|[Vv][Bb][Ss]|[Pp][Ss]1|[Bb][Aa][Tt]|[Cc][Mm][Dd]|[Ll][Nn][Kk])/
    pivot_on:
    - host
    window: 2h
  - name: Office macro / AMSI / Protected-View security control tampering
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Vv][Bb][Aa][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss]?.*/ OR data_win_eventdata_targetObject:/.*[Aa][Cc][Cc][Ee][Ss][Ss][Vv][Bb][Oo][Mm].*/ OR data_win_eventdata_targetObject:/.*[Mm][Aa][Cc][Rr][Oo][Rr][Uu][Nn][Tt][Ii][Mm][Ee][Ss][Cc][Aa][Nn][Ss][Cc][Oo][Pp][Ee].*/ OR data_win_eventdata_targetObject:/.*[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_targetObject:/.*[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn][Ss].*/)
    pivot_on:
    - host
    window: 4h
