name: Suspicious Renamed Comsvcs DLL Loaded By Rundll32
id: 8cde342c-ba48-4b74-b615-172c330f2e93
version: 1
schema_version: "1.0"
date: "2023-02-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8cde342c-ba48-4b74-b615-172c330f2e93
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects rundll32 loading a renamed comsvcs.dll to dump process memory. MITRE
  ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=eed93054cb555f3de70eaa9787f32ebb*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=5e0dbdec1fce52daae251a110b4f309d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=eadbccbb324829acb5f2bbe87e5549a8*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=407ca0f7b523319d758a40d7c0193699*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=281d618f4e6271e527e6386ea6f748de*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\comsvcs.dll"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_hashes matches
  '*IMPHASH=eed93054cb555f3de70eaa9787f32ebb*'; data_win_eventdata_hashes
  matches '*IMPHASH=5e0dbdec1fce52daae251a110b4f309d*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/sbousseaden/status/1555200155351228419
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Suspicious Renamed Comsvcs DLL Loaded By Rundll32 detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE
    ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - renamed
    - comsvcs
    - rundll32
    - image_load
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ee][Ee][Dd]93054[Cc][Bb]555[Ff]3[Dd][Ee]70[Ee][Aa][Aa]9787[Ff]32[Ee][Bb][Bb].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=5[Ee]0[Dd][Bb][Dd][Ee][Cc]1[Ff][Cc][Ee]52[Dd][Aa][Aa][Ee]251[Aa]110[Bb]4[Ff]309[Dd].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ee][Aa][Dd][Bb][Cc][Cc][Bb][Bb]324829[Aa][Cc][Bb]5[Ff]2[Bb][Bb][Ee]87[Ee]5549[Aa]8.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=407[Cc][Aa]0[Ff]7[Bb]523319[Dd]758[Aa]40[Dd]7[Cc]0193699.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=281[Dd]618[Ff]4[Ee]6271[Ee]527[Ee]6386[Ee][Aa]6[Ff]748[Dd][Ee].*/) AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/.*\\[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: Same comsvcs MiniDump attack seen as rundll32 opening a handle to lsass.exe with comsvcs.dll in the call trace; confirms LSASS memory was actually read, not merely that the DLL loaded.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: The command-line form of this exact technique; it stays silent because the DLL was renamed, so its absence while this fires confirms deliberate evasion, and its presence would mean the attacker also ran the un-renamed comsvcs call.
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: 'Likely the process-creation event that launched this rundll32: to evade the comsvcs.dll string, attackers load the renamed copy under a non-.dll extension, exactly what this rule flags.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: The on-disk product of the MiniDump call, the lsass .dmp/.dump file rundll32 writes out; its creation on this host proves the dump succeeded.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Immediate Collection follow-on: the attacker compresses the LSASS .dmp with 7-Zip to stage it for exfiltration before parsing it offline.'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'The payoff of the dump: NTLM hashes recovered from LSASS reused for network logons (type 3, NTLMSSP, zero key length), i.e. lateral movement with the stolen credentials.'
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Attackers routinely pair LSASS dumping with reg save of the SAM/SYSTEM/SECURITY hives in the same session to also capture local-account and cached secrets.
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: 'Escalation branch: if the dumped credentials included a domain-privileged account, DCSync replicates every domain hash, the jump from one host to domain-wide credential theft.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS dump file written or LSASS handle opened by rundll32 on this host
    query: ((data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ll][Ss][Aa][Ss][Ss]|[Dd][Uu][Mm][Pp]).*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp]|[Hh][Dd][Mm][Pp])/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 1h
  - name: Rundll32 MiniDump launch command on this host (renamed-DLL evasion)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\#24.*/))
    pivot_on:
    - host
    window: 1h
  - name: Parallel credential-dumping methods on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* [Ss][Aa][Vv][Ee] .*/ AND data_win_eventdata_commandLine:/.*\\([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/) OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/))
    pivot_on:
    - host
    window: 2h
  - name: This account's remote/network logons after the dump (credential reuse)
    query: ((data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 6h
  - name: Lateral-movement / remote-execution tooling on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))))
    pivot_on:
    - host
    window: 2h
