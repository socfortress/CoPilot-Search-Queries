name: Potential Mpclient.DLL Sideloading
id: 418dc89a-9808-4b87-b1d7-e5ae0cb6effc
version: 1
schema_version: "1.0"
date: "2023-08-04"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 418dc89a-9808-4b87-b1d7-e5ae0cb6effc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential sideloading of "mpclient.dll" by Windows Defender processes
  ("MpCmdRun" and "NisSrv") from their non-default directory. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\mpclient.dll"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\MpCmdRun.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\NisSrv.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\Windows Defender\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\Microsoft Security Client\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\Windows Defender\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\mpclient.dll'; data_win_eventdata_image matches '*\MpCmdRun.exe';
  data_win_eventdata_image matches '*\NisSrv.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Mpclient.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - mpclient
    - sideloading
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Mm][Pp][Cc][Ll][Ii][Ee][Nn][Tt]\.[Dd][Ll][Ll]/ AND (data_win_eventdata_image:/.*\\[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ii][Ss][Ss][Rr][Vv]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Cc][Ll][Ii][Ee][Nn][Tt]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
    name: Potential Mpclient.DLL Sideloading Via Defender Binaries
    reason: 'Same technique in process-creation telemetry: the launch of MpCmdRun.exe/NisSrv.exe from a non-default directory is the exact action that causes this mpclient.dll image-load. Firing together confirms a real sideload and supplies the parent process, command line and staging directory.'
  - id: 02b18447-ea83-4b1b-8805-714a8a34546a
    name: Potential Mpclient.DLL Sideloading Via OfflineScannerShell.EXE Execution
    reason: Alternate host binary for the SAME mpclient.dll sideload - OfflineScannerShell.exe loads any mpclient.dll from its working directory. Same DLL and campaign; on one host in the window it points at a single sideloading toolkit.
  - id: 5ba243e5-8165-4cf7-8c69-e1d3669654c1
    name: Potential DLL Sideloading Of MpSvc.DLL
    reason: Sibling 'living off Windows Defender' DLL (mpsvc.dll, the MsMpEng vector in the original LockBit campaign), typically co-staged with mpclient.dll in the same kit. Both loading from non-default paths on one host is strong corroboration of the same intrusion.
  - id: 46123129-1024-423e-9fae-43af4a0fa9a5
    name: File Download Via Windows Defender MpCmpRun.EXE
    reason: 'Same abused binary (MpCmdRun.exe) used as a LOLBin downloader. A genuine precursor: the actor often fetches the encrypted beacon and the planted mpclient.dll with MpCmdRun -DownloadFile before sideloading through that very binary.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: General EID 7 detector for known-abusable DLLs loaded from suspicious paths. It catches the same staging directory from another angle and any second sideloaded DLL dropped alongside mpclient.dll in the kit.
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'The documented payload of this exact technique (SentinelOne: LockBit sideloads Cobalt Strike through Defender). The malicious mpclient.dll decrypts and runs a CS beacon; its default named pipe on the same host confirms the sideload delivered its beacon.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Follow-on beacon behaviour: once the sideloaded DLL runs the CS beacon it spawns remote threads into other processes (EID 8). On the same host in the window it evidences live post-sideload execution rather than a benign load.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'The next hands-on-keyboard stage after the beacon lands in this playbook: LSASS credential access (Mimikatz/NanoDump/procdump) to enable lateral movement before LockBit ransomware deployment.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Launch of the sideload-host Defender binaries (parent, command line, staging dir)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]|[Nn][Ii][Ss][Ss][Rr][Vv]|[Oo][Ff][Ff][Ll][Ii][Nn][Ee][Ss][Cc][Aa][Nn][Nn][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Staging of the sideload kit (mpclient/mpsvc DLL and copied Defender EXEs written to disk)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Mm][Pp][Cc][Ll][Ii][Ee][Nn][Tt]\.[Dd][Ll][Ll]|[Mm][Pp][Ss][Vv][Cc]\.[Dd][Ll][Ll]|[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]|[Nn][Ii][Ss][Ss][Rr][Vv]\.[Ee][Xx][Ee]|[Oo][Ff][Ff][Ll][Ii][Nn][Ee][Ss][Cc][Aa][Nn][Nn][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from the Defender binaries (sideloaded beacon C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]|[Nn][Ii][Ss][Ss][Rr][Vv]|[Oo][Ff][Ff][Ll][Ii][Nn][Ee][Ss][Cc][Aa][Nn][Nn][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: DNS queries from the Defender binaries (sideloaded beacon resolving C2)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]|[Nn][Ii][Ss][Ss][Rr][Vv]|[Oo][Ff][Ff][Ll][Ii][Nn][Ee][Ss][Cc][Aa][Nn][Nn][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by the Defender binaries (post-sideload hands-on-keyboard)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]|[Nn][Ii][Ss][Ss][Rr][Vv]|[Oo][Ff][Ff][Ll][Ii][Nn][Ee][Ss][Cc][Aa][Nn][Nn][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
