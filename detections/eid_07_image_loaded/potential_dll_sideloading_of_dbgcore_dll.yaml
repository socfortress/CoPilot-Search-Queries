name: Potential DLL Sideloading Of DBGCORE.DLL
id: 9ca2bf31-0570-44d8-a543-534c47c33ed7
version: 1
schema_version: "1.0"
date: "2025-10-06"
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9ca2bf31-0570-44d8-a543-534c47c33ed7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DLL sideloading of "dbgcore.dll". MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\dbgcore.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SoftwareDistribution\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SystemTemp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\Steam\\\\bin\\\\cef\\\\cef.win7x64\\\\dbgcore.dll"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*opera\\\\Opera Installer Temp\\\\opera_package*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\assistant\\\\dbgcore.dll"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\dbgcore.dll'; data_win_eventdata_imageLoaded matches 'C:\Program Files
  (x86)\*'; data_win_eventdata_imageLoaded matches 'C:\Program Files\*', among
  other conditions.

known_false_positives: >
  Legitimate applications loading their own versions of the DLL mentioned in
  this rule. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://hijacklibs.net/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Of DBGCORE.DLL detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - dbgcore
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee][Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm][Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/) AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/.*\\[Ss][Tt][Ee][Aa][Mm]\\[Bb][Ii][Nn]\\[Cc][Ee][Ff]\\[Cc][Ee][Ff]\.[Ww][Ii][Nn]7[Xx]64\\[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll]/ OR (data_win_eventdata_imageLoaded:/.*[Oo][Pp][Ee][Rr][Aa]\\[Oo][Pp][Ee][Rr][Aa] [Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr] [Tt][Ee][Mm][Pp]\\[Oo][Pp][Ee][Rr][Aa]_[Pp][Aa][Cc][Kk][Aa][Gg][Ee].*/ AND data_win_eventdata_imageLoaded:/.*\\[Aa][Ss][Ss][Ii][Ss][Tt][Aa][Nn][Tt]\\[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 416bc4a2-7217-4519-8dc7-c3271817f1d5
    name: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location
    reason: 'Fires on the very same image-load from the complementary angle: it keys on the loading EXE''s uncommon location rather than the DLL path, so a hit corroborates that THIS dbgcore load is an uncommon-location sideload and (its own logic notes) a likely MiniDumpWriteDump abuse.'
  - id: bdc64095-d59a-42a2-8588-71fd9c9d9abc
    name: Suspicious Unsigned Dbghelp/Dbgcore DLL Loaded
    reason: Same dbgcore/dbghelp image-load keyed on signed=false, the malicious-vs-benign discriminator for this exact event; a match upgrades this 'potential' sideload to a near-certain malicious one (a legit app ships a signed copy).
  - id: 6414b5cd-b19d-447e-bb5e-9f03940b5784
    name: Potential DLL Sideloading Of DBGHELP.DLL
    reason: dbgcore.dll is a dependency of dbghelp.dll and the pair is almost always planted and loaded together in one drop; a matching dbghelp sideload on the same host confirms a debugger-engine bundle rather than a one-off.
  - id: fef394cd-f44d-4040-9b18-95d92fe278c0
    name: Potential DLL Sideloading Of DbgModel.DLL
    reason: DbgModel.dll is part of the same Windows Debugger Engine family (dbgeng/dbghelp/dbgcore/dbgmodel) that ships together in sideload kits; a parallel DbgModel sideload widens the same planted bundle on the host.
  - id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
    name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
    reason: 'The action this sideload enables: dbgcore/dbghelp export MiniDumpWriteDump, and this rule catches the follow-on handle open to lsass.exe with those DLLs in the call trace, i.e. the credential dump the loaded dbgcore was there to perform.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Generic abusable-DLL sideload-from-suspicious-location detection; surfaces the OTHER hijackable DLLs planted in the same campaign drop alongside dbgcore, revealing the full set of sideloaded libraries on the host.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: The T1574.001 search-order-hijack hunt this rule is one concrete instance of (both cross-reference hijacklibs.net); surfaces any other non-standard-path DLL loads on the host belonging to the same hijack.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: The host EXE that sideloaded dbgcore runs from an uncommon location; this flags its outbound C2/egress from that same uncommon-location process, the 'what next' when the sideload is a beaconing loader rather than a dumper.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Debugger-engine DLL family (dbgcore/dbghelp/dbgeng/dbgmodel/symsrv) written to disk on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Dd][Bb][Gg][Cc][Oo][Rr][Ee]|[Dd][Bb][Gg][Hh][Ee][Ll][Pp]|[Dd][Bb][Gg][Ee][Nn][Gg]|[Dd][Bb][Gg][Mm][Oo][Dd][Ee][Ll]|[Ss][Yy][Mm][Ss][Rr][Vv])\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: Unsigned DLLs loaded from user-writable locations on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS memory access, dump-file creation, or dump command lines on this host (MiniDumpWriteDump payoff)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee][Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections and DNS from processes in non-standard locations on this host
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Shells and LOLBins spawned by a binary running from a non-standard location on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/) AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa]|[Nn][Ee][Tt]1?|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Rr][Ee][Gg]|[Ss][Cc]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
