name: Windows Executable in Loaded Modules
id: 3e27af56-fcf0-4113-988d-24969b062be7
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic identifies instances where executable files (.exe) are loaded as modules,
  detected through 'ImageLoaded' events in Sysmon logs. This method leverages Sysmon EventCode 7
  to track unusual module loading behavior, which is significant as it deviates from the norm of
  loading .dll files. This activity is crucial for SOC monitoring because it can indicate the presence
  of malware like NjRAT, which uses this technique to load malicious modules. If confirmed malicious,
  this behavior could allow attackers to execute arbitrary code, maintain persistence, and further
  compromise the host system.

data_source:
  - Sysmon EventID 7

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        - wildcard:
            data_win_eventdata_imageLoaded: "*.exe"
        - term:
            data_win_eventdata_signed: "false"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed
    - data_win_eventdata_hashes
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with the process name and
  imageloaded executions from your endpoints. Sysmon EventID 7 captures DLL/module load events.
  Ensure that Sysmon is configured to log module loading events and that these logs are properly
  ingested into Elasticsearch with complete module path and signing information. The detection
  specifically looks for instances where .exe files (instead of normal .dll files) are being loaded
  as modules and are unsigned, which is highly suspicious and indicative of malware like NjRAT.

known_false_positives: >
  No false positives have been identified at this time. Loading executable files as modules is
  highly abnormal behavior and should be investigated immediately. Legitimate applications do not
  typically load .exe files as modules; they load .dll files instead.

references:
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.njrat

response:
  message: >
    An unsigned executable file $data_win_eventdata_imageLoaded$ was loaded as a module by process
    $data_win_eventdata_image$ on $agent_name$. This is highly suspicious behavior
    indicative of malware like NjRAT attempting to load malicious modules for code execution and
    persistence.
  risk_score: 80
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 80
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: file

tags:
  analytic_story:
    - NjRAT
    - Lokibot
    - Malware
  asset_type: Endpoint
  mitre_attack_id:
    - T1129
  custom_tags:
    - module_loading
    - executable_as_module
    - malware
    - code_execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\.exe$/ AND data_win_eventdata_signed:"false"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows_EXE_File_Created_in_Startup_Folder
    name: Windows EXE File Created in Startup Folder
    reason: NjRAT-style droppers copy themselves into Startup after loading the unsigned EXE module; confirms persistence on the same host
  - id: windows-modify-registry-md5-reg-key-name-001
    name: Windows Modify Registry With MD5 Reg Key Name
    reason: NjRAT stores its identifier/config under an MD5-named registry key; follow-on registry staging after the module load
  - id: Windows_Autoruns_Run_Key_Value_Set_By_Suspicious Process
    name: Windows Autoruns Run Key Value Set By Suspicious Process
    reason: Run key persistence written by the same unsigned binary that was loaded as a module
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Persistence pointing at the temp/appdata/public folder where the unsigned EXE module resides
  - id: 9a8f63a8-43ac-11ec-904c-acde48001122
    name: Firewall Allowed Program Enable
    reason: NjRAT runs netsh firewall add allowedprogram for its own EXE shortly after execution to permit C2 traffic
  - id: windows-modify-firewall-notable-process-path-001
    name: Windows Modify System Firewall with Notable Process Path
    reason: Firewall rule added for a binary in a user-writable path, the same unsigned executable now seen loading as a module
  - id: windows-disable-modify-tools-taskkill-001
    name: Windows Disable or Modify Tools Via Taskkill
    reason: NjRAT and Lokibot kill AV/analysis tools via taskkill after gaining execution
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: The loaded EXE or its loader beaconing to C2 from a user-writable path is the expected next stage
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Unsigned image loads from user-writable paths (module loading chain)
    query: data_win_system_eventID:"7" AND data_win_eventdata_signed:"false" AND (data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: EXE/DLL files dropped to user-writable paths or Startup
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/ AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Run key persistence registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/
    pivot_on:
    - host
    window: 2h
  - name: netsh firewall allowed-program / taskkill defense evasion
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Pp][Rr][Oo][Gg][Rr][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/)) OR (data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ff].*/))
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from non-standard executable paths (C2 beaconing)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 1h
