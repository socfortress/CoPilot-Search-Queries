name: Potential RjvPlatform.DLL Sideloading From Non-Default Location
id: 0e0bc253-07ed-43f1-816d-e1b220fe8971
version: 1
schema_version: "1.0"
date: "2023-06-09"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0e0bc253-07ed-43f1-816d-e1b220fe8971
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "RjvPlatform.dll" by
  "SystemResetPlatform.exe" located in a non-default location. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\RjvPlatform.dll"
              case_insensitive: true
        - term:
            data_win_eventdata_image:
              value: "\\SystemResetPlatform.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\System32\\\\SystemResetPlatform\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\RjvPlatform.dll'; data_win_eventdata_image equals
  '\SystemResetPlatform.exe'; data_win_eventdata_image matches
  'C:\Windows\System32\SystemResetPlatform\*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1666716511988330499
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential RjvPlatform.DLL Sideloading From Non-Default Location detected on
    host $agent_name$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - rjvplatform
    - sideloading
    - default
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Rr][Jj][Vv][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Dd][Ll][Ll]/ AND data_win_eventdata_image:/\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 259dda31-b7a3-444f-b7d8-17f96e8a7d0d
    name: Potential RjvPlatform.DLL Sideloading From Default Location
    reason: Direct sibling for the exact same binary pair (SystemResetPlatform.exe + RjvPlatform.dll) but matching the default C:\$SysReset\Framework\Stack layout the 0gtweet technique creates; the two rules cover both placements of this one sideload, so either firing on the host is the same RjvPlatform primitive and corroborates the other.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Detects other known-abused DLLs (coreclr, libcef, zipdll, facesdk, HPCustPartUI) sideloaded from writable paths; an actor who staged this signed-EXE/DLL bundle usually drops further sideload pairs, so a co-firing surfaces the rest of the loader set dropped alongside on the same host.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Broad EID 7 hunt for any DLL loaded from a non-standard directory (outside system32/syswow64/winsxs/wbem/Program Files) - the exact mechanism this alert is one narrow instance of - so it corroborates active search-order-hijack tradecraft on the host and catches sibling hijacks the RjvPlatform signature misses.
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: Fires on any DLL loaded from %TEMP%; when the non-default location this alert flags is a Temp folder it co-fires on the very same image-load, and it also surfaces other Temp-staged modules loaded during the same loader run.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: 'The signedness angle this rule also records (data_win_eventdata_signed): a trusted Windows utility loading an unsigned/untrusted DLL for proxy execution. It catches the follow-on sideloads into LOLBins (rundll32/regsvr32/installutil/regasm) that the planted RjvPlatform payload tends to perform next.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: Catches a genuine Windows-directory binary loading a DLL from permissive paths (C:\Users\Public, C:\PerfLogs) - the same trusted-binary-sideload tradecraft against a different host process - so it surfaces the other signed binaries this actor abuses for sideloading on the host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: On-disk staging of the RjvPlatform.dll / SystemResetPlatform.exe sideload pair on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Rr][Jj][Vv][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Launch of the relocated SystemResetPlatform.exe (reveals its parent/dropper and command line)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
  - name: Outbound network / DNS from the hijacked SystemResetPlatform.exe process
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by the hijacked SystemResetPlatform.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other modules sideloaded by the relocated SystemResetPlatform.exe from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
