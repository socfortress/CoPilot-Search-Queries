name: Lazarus APT DLL Sideloading Activity
id: 24007168-a26b-4049-90d0-ce138e13a5cf
version: 1
schema_version: "1.0"
date: "2023-10-18"
author: Thurein Oo, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 24007168-a26b-4049-90d0-ce138e13a5cf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects sideloading of trojanized DLLs used in Lazarus APT campaign in the
  case of a Spanish aerospace company. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\ProgramShared\\PresentationHost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_imageLoaded:
                          value: ":\\ProgramShared\\mscoree.dll"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\ProgramData\\Adobe\\colorcpl.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\ProgramData\\Adobe\\colorui.dll"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\ProgramData\\Oracle\\Java\\fixmapi.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\ProgramData\\Oracle\\Java\\mapistub.dll"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\ProgramData\\Adobe\\ARM\\tabcal.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\ProgramData\\Adobe\\ARM\\HID.dll"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals
  'C:\ProgramShared\PresentationHost.exe'; data_win_eventdata_imageLoaded equals
  ':\ProgramShared\mscoree.dll'; data_win_eventdata_image equals
  'C:\ProgramData\Adobe\colorcpl.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.welivesecurity.com/en/eset-research/lazarus-luring-employees-trojanized-coding-challenges-case-spanish-aerospace-company/
  - https://www.bleepingcomputer.com/news/security/lazarus-hackers-breach-aerospace-firm-with-new-lightlesscan-malware/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Lazarus APT DLL Sideloading Activity detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - lazarus
    - sideloading
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss][Hh][Aa][Rr][Ee][Dd]\\[Pp][Rr][Ee][Ss][Ee][Nn][Tt][Aa][Tt][Ii][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss][Hh][Aa][Rr][Ee][Dd]\\[Mm][Ss][Cc][Oo][Rr][Ee][Ee]\.[Dd][Ll][Ll]/) OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Cc][Oo][Ll][Oo][Rr][Cc][Pp][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Cc][Oo][Ll][Oo][Rr][Uu][Ii]\.[Dd][Ll][Ll]/) OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Oo][Rr][Aa][Cc][Ll][Ee]\\[Jj][Aa][Vv][Aa]\\[Ff][Ii][Xx][Mm][Aa][Pp][Ii]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Oo][Rr][Aa][Cc][Ll][Ee]\\[Jj][Aa][Vv][Aa]\\[Mm][Aa][Pp][Ii][Ss][Tt][Uu][Bb]\.[Dd][Ll][Ll]/) OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Aa][Rr][Mm]\\[Tt][Aa][Bb][Cc][Aa][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Aa][Rr][Mm]\\[Hh][Ii][Dd]\.[Dd][Ll][Ll]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Co-occurring on the same host and the same EID 7 event class: this hunt flags any DLL loaded from a non-standard path (outside System32/SysWOW64/WinSxS/Program Files). The Lazarus pairs load mscoree.dll / colorui.dll / mapistub.dll / HID.dll out of C:\ProgramData and C:\ProgramShared, so this hunt catches the very same load plus every other sideloaded module the implant pulls in on the host.'
  - id: d1b65d98-37d7-4ff6-b139-2d87c1af3042
    name: Diamond Sleet APT DLL Sideloading Indicators
    reason: Same North Korean actor nexus (Diamond Sleet is tracked under the Lazarus umbrella) running the identical mechanism - a legitimate binary relocated into C:\ProgramData sideloading a trojanized DLL (clip.exe->Version.dll, wsmprovhost.exe->DSROLE.dll). A hit on the same host points to a broader DPRK sideloading operation rather than an isolated pair.
  - id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
    name: Lazarus System Binary Masquerading
    reason: 'Same actor, the process-creation side of this exact tradecraft: Lazarus runs legit-named signed binaries (msdtc.exe, gpsvc.exe) from non-default directories. The PresentationHost/colorcpl/fixmapi/tabcal binaries this rule catches are the same move - signed system-style binaries planted in ProgramData/ProgramShared - so this rule can catch the launch of other masqueraded binaries dropped in the same intrusion.'
  - id: 24c4d154-05a4-4b99-b57d-9b977472443a
    name: Lazarus Group Activity
    reason: 'Same actor (Lazarus) hands-on-keyboard follow-on: matches the operator command-lines run after a foothold - SAM hive dump (reg save hklm\sam), password-protected archiving, and rundll32 loading payloads from C:\ProgramData, which is exactly where this rule''s DLLs live. Co-occurrence confirms an operator is driving the implant this sideload just launched.'
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'Precursor file-drop (EID 11) for a sideload: an unusual process writing a .dll into a user-writable application-dependency folder - the plant step that a sideload image-load follows. Fits the DreamJob lure, whose trojanized coding-challenge project executes inside the victim''s own dev tooling and stages the malicious DLL before the legitimate binary loads it.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Co-occurring sibling for the same behaviour class: a known-abusable DLL (coreclr, libcef, ZIPDLL, facesdk, HPCustPartUI) loaded from a suspicious location (Users\Public, Perflogs, Windows\Temp). Catches additional sideloads the same implant performs on the host that fall outside this rule''s four hard-coded Lazarus pairs.'
  - id: 8cde342c-ba48-4b74-b615-172c330f2e93
    name: Suspicious Renamed Comsvcs DLL Loaded By Rundll32
    reason: 'Credential-access follow-on matching the campaign''s espionage objective: rundll32 loading a renamed comsvcs.dll to minidump LSASS. Once the sideloaded loader (LightlessCan/BlindingCan) has its foothold, operators harvest credentials - a hit on the same host within the window is the next stage of this intrusion.'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sideload-host binaries beaconing out (C2 / DNS) on this host
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\([Pp][Rr][Ee][Ss][Ee][Nn][Tt][Aa][Tt][Ii][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|[Cc][Oo][Ll][Oo][Rr][Cc][Pp][Ll]\.[Ee][Xx][Ee]|[Ff][Ii][Xx][Mm][Aa][Pp][Ii]\.[Ee][Xx][Ee]|[Tt][Aa][Bb][Cc][Aa][Ll]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by the sideloaded host binaries on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp][Rr][Ee][Ss][Ee][Nn][Tt][Aa][Tt][Ii][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|[Cc][Oo][Ll][Oo][Rr][Cc][Pp][Ll]\.[Ee][Xx][Ee]|[Ff][Ii][Xx][Mm][Aa][Pp][Ii]\.[Ee][Xx][Ee]|[Tt][Aa][Bb][Cc][Aa][Ll]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Executable/DLL dropped into ProgramData or ProgramShared on this host (the stage)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss][Hh][Aa][Rr][Ee][Dd]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Credential theft follow-on (LSASS access, comsvcs minidump, SAM/NTDS) on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/))
    pivot_on:
    - host
    window: 4h
  - name: Internal reconnaissance burst on this host (LightlessCan native-command mimicry)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee]|[Rr][Oo][Uu][Tt][Ee]\.[Ee][Xx][Ee]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|[Nn][Bb][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
