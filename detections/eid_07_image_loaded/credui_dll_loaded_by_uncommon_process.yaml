name: CredUI.DLL Loaded By Uncommon Process
id: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects loading of "credui.dll" and related DLLs by an uncommon process.
  Attackers might leverage this DLL for potential use of
  "CredUIPromptForCredentials" or "CredUnPackAuthenticationBufferW". MITRE
  ATT&CK: T1056.002.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\credui.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\wincredui.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "credui.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wincredui.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SystemApps\\\\*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\explorer.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\regedit.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\opera_autoupdate.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp64a.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procexp.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\Teams\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Teams.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\OneDrive\\\\*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\credui.dll'; data_win_eventdata_imageLoaded matches '*\wincredui.dll';
  data_win_eventdata_originalFileName equals 'credui.dll', among other
  conditions.

known_false_positives: >
  Other legitimate processes loading those DLLs in your environment. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://securitydatasets.com/notebooks/atomic/windows/credential_access/SDWIN-201020013208.html
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.002/T1056.002.md#atomic-test-2---powershell---prompt-user-for-password
  - https://learn.microsoft.com/en-us/windows/win32/api/wincred/nf-wincred-creduipromptforcredentialsa
  - https://github.com/S12cybersecurity/RDPCredentialStealer
  - https://attack.mitre.org/techniques/T1056/002/

response:
  message: >
    CredUI.DLL Loaded By Uncommon Process detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1056.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1056.002
  custom_tags:
    - credui
    - uncommon
    - image_load
    - sysmon
    - credential_access
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Cc][Rr][Ee][Dd][Uu][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Cc][Rr][Ee][Dd][Uu][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_originalFileName:/[Cc][Rr][Ee][Dd][Uu][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Cc][Rr][Ee][Dd][Uu][Ii]\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm][Aa][Pp][Pp][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Mm][Mm][Ee][Rr][Ss][Ii][Vv][Ee][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Pp][Aa][Nn][Ee][Ll]\\[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]_[Aa][Uu][Tt][Oo][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64[Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ca8b77a9-d499-4095-b793-5d5f330d450e
    name: PowerShell Credential Prompt
    reason: 'Same action, scriptblock side: this rule''s own Atomic test (PowerShell PromptForCredential) is exactly what loads credui.dll to pop the credential box. If credui.dll was pulled in by a PS credential phish on this host, the 4104 scriptblock proves intent.'
  - id: windows-credentials-access-vaultcli-module-001
    name: Windows Credentials Access Via Vaultcli Module
    reason: 'Sibling EID 7 detection: an uncommon/suspicious-path process loading a credential-API DLL (vaultcli.dll) to read the Credential Manager vault. An actor phishing the interactive password frequently also loots the stored vault on the same host.'
  - id: 34f90d3c-c297-49e9-b26d-911b05a4866c
    name: Powershell Keylogging
    reason: Sibling Input Capture technique (keylogging) targeting the same asset the credui prompt is after -- the user's typed credentials. A GUI-phish actor commonly drops a keylogger too; co-occurrence on this host strongly corroborates credential theft.
  - id: 965e2db9-eddb-4cf6-a986-7a967df651e4
    name: Potential Keylogger Activity
    reason: Second keystroke-capture signature (distinct PS keylogger family). Same sibling Input Capture intent as the credui prompt -- harvesting typed credentials -- so a hit on this host within the window confirms a capture campaign rather than a benign DLL load.
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: 'Co-occurring credential harvest: looting browser-saved logins. Prompting for the live password and scraping stored browser creds are the two halves of the same credential-collection goal; seeing both on this host expands a single alert into an incident.'
  - id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
    name: Windows Credential Manager Access via VaultCmd
    reason: Co-occurring credential harvest via the native vaultcmd /listcreds. Reading stored vault creds is the companion move to a live credui prompt; both enumerate the same user's secrets, so it confirms scope on this host.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Heavyweight credential-access vector on the same host. If the actor is phishing credentials via credui, LSASS memory access (Mimikatz-class) within the window shows a broader credential-theft operation worth immediate escalation.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: 'Follow-on use of the captured password: a 4648 explicit-credential logon to a remote server is the natural next step after harvesting a credential via the prompt -- lateral movement with the freshly stolen secret.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential-prompt / Get-Credential PowerShell on this host (the phish, scriptblock side)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Pp][Rr][Oo][Mm][Pp][Tt][Ff][Oo][Rr][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Dd][Uu][Ii][Pp][Rr][Oo][Mm][Pp][Tt][Ff][Oo][Rr][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Dd][Uu][Nn][Pp][Aa][Cc][Kk][Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Bb][Uu][Ff][Ff][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other credential-API DLLs loaded by processes on this host (vault/SAM/keymgr/NGC)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Ll][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ss][Aa][Mm][Ll][Ii][Bb]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Kk][Ee][Yy][Mm][Gg][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Rr][Yy][Pp][Tt][Nn][Gg][Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Cc][Rr][Ee][Dd][Uu][Ii]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS memory access on this host (Mimikatz-class credential dumping)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Native LOLBin credential enumeration / hive dump on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ll][Ii][Ss][Tt][Cc][Rr][Ee][Dd][Ss].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ll][Ii][Ss][Tt].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Kk][Ee][Yy][Mm][Gg][Rr].*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Ll][Ii].*/))
    pivot_on:
    - host
    window: 4h
  - name: Explicit-credential remote logon by this user (follow-on use of the stolen secret)
    query: data_win_system_eventID:"4648" AND _exists_:data_win_eventdata_targetServerName AND _exists_:data_win_eventdata_targetUserName AND NOT data_win_eventdata_targetServerName:/[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]/
    pivot_on:
    - user
    window: 6h
