name: Potential Raspberry Robin Aclui Dll SideLoading
id: 0f3a9db2-c17a-480e-a723-d1f1c547ab6a
version: 1
schema_version: "1.0"
date: "2024-07-31"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f3a9db2-c17a-480e-a723-d1f1c547ab6a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential sideloading of malicious "aclui.dll" by OleView.This
  behavior was observed in Raspberry-Robin variants reported by chekpoint
  research on Feburary 2024. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\OleView.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\aclui.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_signed"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\Windows Kits\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\Microsoft SDKs\\\\*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_signed:
                          value: "true"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Windows Resource Kit\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\OleView.exe'; data_win_eventdata_imageLoaded matches '*\aclui.dll';
  data_win_eventdata_image matches 'C:\Program Files (x86)\Windows Kits\*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.checkpoint.com/2024/raspberry-robin-keeps-riding-the-wave-of-endless-1-days/
  - https://globetech.biz/index.php/2023/05/19/evading-edr-by-dll-sideloading-in-csharp/
  - https://decoded.avast.io/threatintel/apt-treasure-trove-avast-suspects-chinese-apt-group-mustang-panda-is-collecting-data-from-burmese-government-agencies-and-opposition-groups/
  - https://www.hexacorn.com/blog/2016/03/10/beyond-good-ol-run-key-part-36/
  - https://strontic.github.io/xcyclopedia/library/aclui.dll-F883E9CA757B622B032FDCA5BF33D0DF.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Raspberry Robin Aclui Dll SideLoading detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - raspberry
    - robin
    - aclui
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Oo][Ll][Ee][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Aa][Cc][Ll][Uu][Ii]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_signed AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Kk][Ii][Tt][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Dd][Kk][Ss]\\.*/ OR data_win_eventdata_signed:/[Tt][Rr][Uu][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee] [Kk][Ii][Tt]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c6bea3a-ef58-4f2e-a775-4928f6b7c58a
    name: Raspberry Robin Initial Execution From External Drive
    reason: 'Delivery precursor on the same host: the worm arrives on a USB .lnk/.bin launched by cmd.exe /r and pulls its payload with msiexec - the step that drops the OleView.exe + aclui.dll bundle this rule later catches loading.'
  - id: d52d2e87-eb03-4fac-961d-eb616da79788
    name: Raspberry Robin Subsequent Execution of Commands
    reason: 'Direct follow-on: once the sideload runs, Raspberry Robin escalates through a fodhelper.exe UAC bypass and executes its payload via rundll32/regsvr32 with odbcconf/shellexec_rundll - the next stage of the same intrusion.'
  - id: 92020b88-9caf-464f-bad8-cd0fb0aa2a81
    name: Potential Raspberry Robin CPL Execution Activity
    reason: 'Same-family parallel execution vector: Raspberry Robin also runs a .CPL from %AppData%\Local\Temp via control.exe/rundll32 Control_RunDLL; seeing it on this host confirms a Raspberry Robin intrusion rather than an isolated sideload.'
  - id: a35c97c8-d9c4-4c89-a3e7-533dc0bcb73a
    name: Potential Raspberry Robin Dot Ending File
    reason: 'Same-family hallmark: Raspberry Robin''s dot-terminated file arguments in command lines - a co-occurring obfuscation indicator that the sideloaded DLL belongs to this worm.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Same technique (EID 7 image-load sideload): surfaces any other abusable DLL loaded from a user-writable path (Public, PerfLogs, Temp) in the same intrusion - parallel sideloads beyond aclui.dll.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'General case of this exact sub-technique (T1574.001): flags the aclui.dll load from a non-standard directory plus any other search-order hijack on the host, widening a single-DLL hit into the full hijack picture.'
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: 'Raspberry Robin''s signature LOLBin: odbcconf registering a DLL from ProgramData/Temp/Public is how the worm loads its next-stage DLL after the sideload - a high-value follow-on on the same host.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Drop of the sideload bundle (aclui.dll / OleView.exe written to disk) on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Cc][Ll][Uu][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Oo][Ll][Ee][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: OleView.exe process start on this host (parent chain and launch path)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Oo][Ll][Ee][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Raspberry Robin LOLBin execution chain on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Mm][Ss][Ii][Ee][Xx][Ee][Cc]|[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Oo][Nn][Tt][Rr][Oo][Ll]|[Dd][Ll][Ll][Hh][Oo][Ss][Tt]|[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from the sideload host process or its LOLBin children
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Oo][Ll][Ee][Vv][Ii][Ee][Ww]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]|[Mm][Ss][Ii][Ee][Xx][Ee][Cc]|[Dd][Ll][Ll][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: UAC-bypass registry hijack (ms-settings / shell open command) on this host
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Ff][Oo][Ll][Dd][Ee][Rr]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*[Ee][Xx][Ee][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Rr][Uu][Nn][Aa][Ss].*/)
    pivot_on:
    - host
    window: 2h
