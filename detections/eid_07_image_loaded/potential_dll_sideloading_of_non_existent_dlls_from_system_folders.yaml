name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
version: 1
schema_version: "1.0"
date: "2026-01-24"
author: Nasreddine Bencherchali (Nextron Systems), SBousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects loading of specific system DLL files that are usually not present on
  the system (or at least not in system directories) but may be loaded by
  legitimate processes, potentially indicating phantom DLL hijacking attempts.
  Phantom DLL hijacking involves placing malicious DLLs with names of
  non-existent system binaries in locations where legitimate applications may
  search for them, leading to execution of the malicious DLLs. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\axeonoffhelper.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\cdpsgshims.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\oci.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\offdmpsvc.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\shellchromeapi.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\TSMSISrv.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\TSVIPSrv.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\wbem\\\\wbemcomn.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\WLBSCTRL.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\wow64log.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\System32\\\\WptsExtensions.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_signed"
        - exists:
            field: "data_win_eventdata_signatureStatus"
        - exists:
            field: "data_win_eventdata_signature"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_signed:
                          value: "true"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_signatureStatus:
                          value: "Valid"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_signature:
                          value: "Microsoft Windows"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed
    - data_win_eventdata_signatureStatus
    - data_win_eventdata_signature
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*:\Windows\System32\axeonoffhelper.dll'; data_win_eventdata_imageLoaded
  matches '*:\Windows\System32\cdpsgshims.dll'; data_win_eventdata_imageLoaded
  matches '*:\Windows\System32\oci.dll', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

