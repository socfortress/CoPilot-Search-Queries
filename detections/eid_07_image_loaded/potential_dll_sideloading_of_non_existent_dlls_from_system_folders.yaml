correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 614a7e17-5643-4d89-b6fe-f9df1a79641c
    name: Wmiprvse Wbemcomn DLL Hijack - File
    reason: 'Tightest precursor in the corpus: the `System` process writing wbemcomn.dll into C:\Windows\System32\wbem\ over SMB is the on-disk plant that this rule then catches at load time. wbem\wbemcomn.dll is one of this rule''s exact match targets, so a prior file-create fire on the host pins the drop that produced the unsigned load.'
  - id: 7707a579-e0d8-4886-a853-ce47e4575aaa
    name: Wmiprvse Wbemcomn DLL Hijack
    reason: 'Same phantom DLL, load angle: wbem\wbemcomn.dll loaded specifically by wmiprvse.exe - the remote-WMI variant of this hijack. A co-fire identifies the loader as the WMI provider and reframes the chain as inbound lateral movement (T1021.002), not a local-only sideload.'
  - id: ee4c5d06-3abc-48cc-8885-77f1c20f4451
    name: DLL Sideloading Of ShellChromeAPI.DLL
    reason: 'Same phantom DLL, dedicated detection: shellchromeapi.dll is in this rule''s list and is loaded via DeviceEnroller.exe''s PhoneDeepLink flag. A co-fire names DeviceEnroller as the sideloading LOLBIN and confirms exactly which of the eleven phantom DLLs was abused.'
  - id: 4f6c43e2-f989-4ea5-bcd8-843b49a0317c
    name: UAC Bypass Using WOW64 Logger DLL Hijack
    reason: 'The privilege-escalation payoff of one of these DLLs: wow64log.dll (in this rule''s list) is UACMe method 30. This rule catches the unsigned wow64log load (EID7); that rule catches the full-access 0x1fffff OpenProcess the elevated WoW64 process then issues (EID10). A host co-fire pins the exact wow64log UAC bypass - and that rule already cites this one as its precursor.'
  - id: 612e47e9-8a59-43a6-b404-f48683f45bd6
    name: ServiceDll Hijack
    reason: 'Alternate route to the same SYSTEM-service hijack: several of these phantom DLLs are service DLLs (WLBSCTRL->IKEEXT, cdpsgshims->CDPSvc, TSMSISrv/TSVIPSrv->TermService, WptsExtensions->Schedule). A registry ServiceDll repoint (EID13) is how an attacker makes a service load their DLL; seen with this load it shows the hijack was wired for reboot-persistent SYSTEM execution (T1543.003).'
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'Earlier-stage plant of the same technique (T1574.001): an unusual process dropping a .dll into a user app-dependency folder is how the foothold DLL often first lands, before privilege escalation enables the System32 phantom load this rule sees. Confirms the DLL-hijack tradecraft began at the user tier.'
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Credential-access follow-on once the hijacked DLL runs inside a SYSTEM service: the same EID7 unsigned-module sensor, now showing an unsigned image loaded into lsass.exe - the escalated code reaching into LSASS to steal credentials (T1003.001) right after the hijack grants SYSTEM.'
  - id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
    name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
    reason: 'Credential-dumping follow-on via a different sensor (EID10): a process opening lsass.exe with dbgcore/dbghelp (MiniDumpWriteDump) in its call trace. Dropping a dumper and reading LSASS is the canonical next move after this hijack yields SYSTEM; a host co-fire turns the escalation into an active credential-theft incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Phantom system DLL written to disk on this host (the plant)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Xx][Ee][Oo][Nn][Oo][Ff][Ff][Hh][Ee][Ll][Pp][Ee][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Dd][Pp][Ss][Gg][Ss][Hh][Ii][Mm][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Oo][Cc][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Oo][Ff][Ff][Dd][Mm][Pp][Ss][Vv][Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Hh][Ee][Ll][Ll][Cc][Hh][Rr][Oo][Mm][Ee][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ss][Mm][Ss][Ii][Ss][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ss][Vv][Ii][Pp][Ss][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ll][Bb][Ss][Cc][Tt][Rr][Ll]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Oo][Ww]64[Ll][Oo][Gg]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Pp][Tt][Ss][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: Known phantom-DLL loader LOLBINs executed on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ww][Pp][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Bb][Oo][Oo][Tt][Tt][Rr][Aa][Cc][Ee].*/) OR (data_win_eventdata_image:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Hh][Oo][Nn][Ee][Dd][Ee][Ee][Pp][Ll][Ii][Nn][Kk].*/) OR data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Service / SYSTEM host process spawning a shell or proxy binary on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Dd][Tt][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]|\\[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]\.[Ee][Xx][Ee]|\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]|\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]|\\[Ww][Pp][Rr]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential access or memory dump on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Mm][Dd][Mm][Pp])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp])\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 1h
  - name: Service persistence created or ServiceDll repointed on this host
    query: (data_win_system_eventID:"7045") OR ((data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/))
    pivot_on:
    - host
    window: 4h
