graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Xx][Ee][Oo][Nn][Oo][Ff][Ff][Hh][Ee][Ll][Pp][Ee][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Dd][Pp][Ss][Gg][Ss][Hh][Ii][Mm][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Oo][Cc][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Oo][Ff][Ff][Dd][Mm][Pp][Ss][Vv][Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Hh][Ee][Ll][Ll][Cc][Hh][Rr][Oo][Mm][Ee][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Ss][Mm][Ss][Ii][Ss][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Ss][Vv][Ii][Pp][Ss][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ww][Bb][Ee][Mm][Cc][Oo][Mm][Nn]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ll][Bb][Ss][Cc][Tt][Rr][Ll]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Oo][Ww]64[Ll][Oo][Gg]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Pp][Tt][Ss][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_signed AND _exists_:data_win_eventdata_signatureStatus AND _exists_:data_win_eventdata_signature AND NOT (data_win_eventdata_signed:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_signatureStatus:/[Vv][Aa][Ll][Ii][Dd]/ AND data_win_eventdata_signature: