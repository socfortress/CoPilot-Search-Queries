name: Potential RjvPlatform.DLL Sideloading From Default Location
id: 259dda31-b7a3-444f-b7d8-17f96e8a7d0d
version: 1
schema_version: "1.0"
date: "2023-06-09"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 259dda31-b7a3-444f-b7d8-17f96e8a7d0d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects loading of "RjvPlatform.dll" by the "SystemResetPlatform.exe" binary
  which can be abused as a method of DLL side loading since the "$SysReset"
  directory isn't created by default. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\Windows\\System32\\SystemResetPlatform\\SystemResetPlatform.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_imageLoaded:
              value: "C:\\$SysReset\\Framework\\Stack\\RjvPlatform.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals
  'C:\Windows\System32\SystemResetPlatform\SystemResetPlatform.exe';
  data_win_eventdata_imageLoaded equals
  'C:\$SysReset\Framework\Stack\RjvPlatform.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1666716511988330499
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential RjvPlatform.DLL Sideloading From Default Location detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    MITRE ATT&CK: T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - rjvplatform
    - sideloading
    - default
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\\$[Ss][Yy][Ss][Rr][Ee][Ss][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\[Ss][Tt][Aa][Cc][Kk]\\[Rr][Jj][Vv][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0e0bc253-07ed-43f1-816d-e1b220fe8971
    name: Potential RjvPlatform.DLL Sideloading From Non-Default Location
    reason: Exact companion detection - same SystemResetPlatform.exe loading the same RjvPlatform.dll, but staged outside C:\Windows\System32\SystemResetPlatform. If the actor runs the binary from a copied/non-default path this fires instead; together the pair confirms RjvPlatform side-loading regardless of where the EXE was staged.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Identical phantom-DLL-hijack trick - C:\$SysReset and RjvPlatform.dll do not exist by default, so loading them means the actor planted a phantom DLL. This rule catches the same trick against other normally-absent system DLLs; a same-host hit means they are probing multiple phantom-load targets.
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: Same signature, different writable path - a System32 binary loading a DLL from an attacker-writable location (Users\Public, PerfLogs). SystemResetPlatform.exe is exactly such a system binary, so a concurrent hit shows another trusted process was side-loaded on the host.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Co-occurring side-load of other known-abusable DLLs (coreclr, libcef, zipdll...) from writable paths. Actors seldom rely on one side-load target, so a hit on the same host inside the window widens a single RjvPlatform load into a side-loading campaign.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Broad same-host sweep for DLLs loaded outside system32/syswow64/winsxs/wbem. Run around this alert it surfaces every other non-standard-path DLL load on the host - the fastest way to find the rest of the hijacked/side-loaded modules in the same intrusion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL drop into $SysReset / RjvPlatform.dll write on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\\$[Ss][Yy][Ss][Rr][Ee][Ss][Ee][Tt]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Rr][Jj][Vv][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 6h
  - name: SystemResetPlatform.exe execution, its parent, and any child it spawns
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Network / DNS initiated by SystemResetPlatform.exe (C2 under the signed binary)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Ee][Tt][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other DLL loads from attacker-writable paths on this host (further side-loads)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\\$[Ss][Yy][Ss][Rr][Ee][Ss][Ee][Tt]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: LSASS access / credential-dump tooling on this host (post-execution objective)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss]\.[Dd][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
