name: DLL Sideloading Of ShellChromeAPI.DLL
id: ee4c5d06-3abc-48cc-8885-77f1c20f4451
version: 1
schema_version: "1.0"
date: "2022-12-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ee4c5d06-3abc-48cc-8885-77f1c20f4451
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects processes loading the non-existent DLL "ShellChromeAPI". One known
  example is the "DeviceEnroller" binary in combination with the "PhoneDeepLink"
  flag tries to load this DLL. Adversaries can drop their own renamed DLL and
  execute it via DeviceEnroller.exe using this parameter. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\ShellChromeAPI.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\ShellChromeAPI.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://mobile.twitter.com/0gtweet/status/1564131230941122561
  - https://strontic.github.io/xcyclopedia/library/DeviceEnroller.exe-24BEF0D6B0ECED36BB41831759FDE18D.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    DLL Sideloading Of ShellChromeAPI.DLL detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - shellchromeapi
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ss][Hh][Ee][Ll][Ll][Cc][Hh][Rr][Oo][Mm][Ee][Aa][Pp][Ii]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e173ad47-4388-4012-ae62-bd13f71c18a8
    name: Potential DLL Sideloading Via DeviceEnroller.EXE
    reason: 'Process-creation twin of this exact load: DeviceEnroller.exe launched with /PhoneDeepLink is the call that triggers LoadLibrary of the phantom ShellChromeAPI.dll. Fires within seconds on the same host and supplies the command line, parent process and user that this image-load event does not carry.'
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Targets the same phantom DLL — its query lists System32\ShellChromeAPI.dll by name — catching the variant where the attacker plants ShellChromeAPI.dll in System32 (with an unsigned / non-Microsoft gate) instead of a working directory. Same technique, confirms intent.
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: 'The structural signature of this attack: a signed system binary (DeviceEnroller.exe normally resolves from System32) loading a DLL from a world-writable path such as C:\Users\Public — surfaces this same sideload when the phantom DLL sits in a permissive directory.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Catches companion sideloaded DLLs (coreclr, libcef, zipdll, etc.) loaded from writable/suspicious paths on the same host; an actor sideloading ShellChromeAPI commonly stages several abusable DLLs in the same drop folder during one intrusion.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Broad image-load hunt for DLLs loaded from outside the system directories; widens the net to any other hijacked or sideloaded module the same actor loaded on the host within the window.
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'The file-write precursor class: an unusual process dropping a .dll into a user-writable application folder is how a sideload payload like ShellChromeAPI.dll gets staged before a load such as this one fires.'
  - id: b6f91281-20aa-446a-b986-38a92813a18f
    name: DLL Search Order Hijackig Via Additional Space in Path
    reason: A companion staging technique — creating spoofed 'C:\Windows \' (trailing-space) system folders to win the DLL search order — indicating the same actor is manipulating DLL resolution on this host.
  - id: 602a1f13-c640-4d73-b053-be9a2fa58b96
    name: HackTool - Powerup Write Hijack DLL
    reason: PowerUp's Write-Hijack-DLL privilege-escalation module running on the host points to an actor actively weaponizing DLL search-order hijacking (T1574.001) — the same abuse class this ShellChromeAPI phantom-DLL load is an instance of.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DeviceEnroller.exe execution / PhoneDeepLink sideload trigger on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*[Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Pp][Hh][Oo][Nn][Ee][Dd][Ee][Ee][Pp][Ll][Ii][Nn][Kk].*/)
    pivot_on:
    - host
    window: 1h
  - name: Staging of ShellChromeAPI.dll or any DLL written to a user-writable path on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*[Ss][Hh][Ee][Ll][Ll][Cc][Hh][Rr][Oo][Mm][Ee][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Network / DNS egress by DeviceEnroller.exe on this host (sideloaded payload beaconing)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by DeviceEnroller.exe on this host (payload executing)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Companion DLLs loaded from writable / suspicious paths on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
