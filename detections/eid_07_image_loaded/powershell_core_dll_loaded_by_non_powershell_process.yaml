correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6ec86d9e-912e-4726-91a2-209359b999b9
    name: Amsi.DLL Loaded Via LOLBIN Process
    reason: 'Tightest sibling: its own write-up calls this a ''PowerShell without PowerShell'' attack. Same Sysmon EID 7 image-load stream, same host - a LOLBIN hosting the covert PowerShell engine pulls amsi.dll into the same process it loads the automation DLL into. Co-firing pins down which process is the covert host.'
  - id: windows-powershell-load-module-in-meterpreter-001
    name: Powershell Load Module in Meterpreter
    reason: This detection's description names Meterpreter's 'load powershell' extension as the behaviour it detects; that extension is exactly what injects System.Management.Automation.dll into a non-PowerShell process. This 4104 rule catches the resulting MSF.Powershell module strings - two views of the same technique on the same host.
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'The mechanism: Cobalt Strike powerpick/psinject injects the automation DLL into a sacrificial or hijacked process via a remote thread - the exact way a non-PowerShell process comes to load this DLL. An EID 8 beacon-shaped remote thread on the host in the window is the likely source of this alert.'
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: A covert host patches AMSI inside its own process before running post-exploitation; because Script Block Logging is emitted by the automation DLL itself, that bypass script still surfaces in 4104. Seeing it on this host is the evasion step that typically immediately precedes the covert PowerShell execution.
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: The loaded DLL gives the process a full PowerShell engine, and reflective GetProcAddress/VirtualAlloc injection is the archetypal payload such a covert engine runs. It logs via 4104 from the same automation DLL, so a hit on this host corroborates that in-process PowerShell is doing offensive work, not benign .NET.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Credential theft is the common objective of covert PowerShell. Invoke-Mimikatz executed through the same automation engine is a high-value follow-on, and (unless the attacker also disabled logging) it is visible in 4104 on the same host/user the DLL loaded on.
  - id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
    name: PowerShell Loading DotNET into Memory via Reflection
    reason: Reflective in-memory .NET assembly loading is the same act, seen from the 4104 side, as loading System.Management.Automation.dll into a process; its own description ties it to Empire and Cobalt Strike. Co-occurrence confirms the host is being used to run managed post-ex tooling in memory.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Offensive PowerShell captured in Script Block Logging on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Pp][Rr][Oo][Cc][Aa][Dd][Dd][Rr][Ee][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Ff]\.[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote thread injection on this host (delivery of the covert engine)
    query: data_win_system_eventID:"8"
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential access on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from PowerShell-hosting LOLBINs on this host (C2 egress)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Post-execution discovery burst on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|\\[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
