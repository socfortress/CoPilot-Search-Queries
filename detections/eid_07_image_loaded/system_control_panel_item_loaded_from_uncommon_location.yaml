name: System Control Panel Item Loaded From Uncommon Location
id: 2b140a5c-dc02-4bb8-b6b1-8bdb45714cde
version: 1
schema_version: "1.0"
date: "2026-02-17"
author: Anish Bogati
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2b140a5c-dc02-4bb8-b6b1-8bdb45714cde
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects image load events of system control panel items (.cpl) from uncommon
  or non-system locations that may indicate DLL sideloading or other abuse
  techniques. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\appwiz.cpl"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\bthprops.cpl"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\hdwwiz.cpl"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\Prefetch\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\appwiz.cpl'; data_win_eventdata_imageLoaded matches '*\bthprops.cpl';
  data_win_eventdata_imageLoaded matches '*\hdwwiz.cpl', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hexacorn.com/blog/2024/01/06/1-little-known-secret-of-fondue-exe/
  - https://www.hexacorn.com/blog/2024/01/01/1-little-known-secret-of-hdwwiz-exe/
  - https://github.com/mhaskar/FsquirtCPLPoC
  - https://securelist.com/sidewinder-apt/114089/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    System Control Panel Item Loaded From Uncommon Location detected on host
    $agent_name$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - system
    - control
    - panel
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Ww][Ii][Zz]\.[Cc][Pp][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Bb][Tt][Hh][Pp][Rr][Oo][Pp][Ss]\.[Cc][Pp][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Hh][Dd][Ww][Ww][Ii][Zz]\.[Cc][Pp][Ll]/) AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Rr][Ee][Ff][Ee][Tt][Cc][Hh]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7eb979b-c2b5-4a6f-a3a7-c87ce6763819
    name: Suspicious Control Panel DLL Load
    reason: 'Direct precursor: System32\control.exe spawning rundll32 to invoke a control-panel item through an anomalous (non-shell32.dll) path is the process event that drives the uncommon .cpl image-load this rule catches.'
  - id: 0ba863e6-def5-4e50-9cea-4dd8c7dc46a4
    name: Control Panel Items
    reason: 'Process/registration view of the same abuse: a .cpl launched from a non-System32 path, or registered under the CurrentVersion\Control Panel\Cpls key — the same control-panel item this rule sees loaded as an image.'
  - id: f39ee679-3b1e-4f47-841c-5c3c580acda2
    name: Windows DLL Search Order Hijacking with iscsicpl
    reason: 'Same control-panel-host sideloading tradecraft (T1574.001): a malicious DLL planted beside the auto-elevating iscsicpl.exe applet; explains the privilege-escalation / UAC-bypass outcome of loading a .cpl from an attacker-writable path.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: The signed Windows binary that sideloads a .cpl (control.exe/fondue.exe/hdwwiz.exe/fsquirt.exe) is itself a C:\Windows process reaching into Users\Public or Perflogs — the exact loader-from-writable-path anomaly this flags, likely firing on the same host.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: A sideloaded .cpl is typically unsigned and is pulled in by a Windows utility proxying execution — corroborates the signature anomaly this rule projects (data_win_eventdata_signed) from the loader side.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Same EID-7 event and technique on a known-abusable module from a user-writable location — catches the helper DLLs commonly co-dropped alongside a malicious .cpl in the same directory.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: General image-load hijack hunt (any module loaded from a non-standard directory); a .cpl from an uncommon location is one instance, so this near-certainly co-fires and widens the search-order-hijack picture on the host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Malicious control panel item (.cpl) written to a non-system location on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Cc][Pp][Ll]/ AND NOT (data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: Control-panel sideload host binaries executing on this host (fondue/hdwwiz/fsquirt/iscsicpl, or control/rundll32 invoking a .cpl)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ff][Oo][Nn][Dd][Uu][Ee]\.[Ee][Xx][Ee]|\\[Hh][Dd][Ww][Ww][Ii][Zz]\.[Ee][Xx][Ee]|\\[Ff][Ss][Qq][Uu][Ii][Rr][Tt]\.[Ee][Xx][Ee]|\\[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]\.[Ee][Xx][Ee])/ OR ((data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\.[Cc][Pp][Ll].*/))
    pivot_on:
    - host
    window: 2h
  - name: Any control panel item (.cpl) image-loaded from a non-system path on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\.[Cc][Pp][Ll]/ AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Rr][Ee][Ff][Ee][Tt][Cc][Hh]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from control-panel hosts or processes in writable paths on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\.[Ee][Xx][Ee]|\\[Ff][Oo][Nn][Dd][Uu][Ee]\.[Ee][Xx][Ee]|\\[Hh][Dd][Ww][Ww][Ii][Zz]\.[Ee][Xx][Ee]|\\[Ff][Ss][Qq][Uu][Ii][Rr][Tt]\.[Ee][Xx][Ee]|\\[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Control panel item registered for auto-load / persistence on this host (Control Panel\Cpls or Run key referencing a .cpl)
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Cc][Pp][Ll][Ss].*/ OR (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND data_win_eventdata_details:/.*\.[Cc][Pp][Ll].*/))
    pivot_on:
    - host
    window: 4h
