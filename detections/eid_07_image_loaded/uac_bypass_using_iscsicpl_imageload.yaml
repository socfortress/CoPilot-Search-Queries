name: UAC Bypass Using Iscsicpl - ImageLoad
id: 9ed5959a-c43c-4c59-84e3-d28628429456
version: 1
schema_version: "1.0"
date: "2022-07-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9ed5959a-c43c-4c59-84e3-d28628429456
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the "iscsicpl.exe" UAC bypass technique that leverages a DLL Search
  Order hijacking technique to load a custom DLL's from temp or a any user
  controlled location in the users %PATH%. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\Windows\\SysWOW64\\iscsicpl.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\iscsiexe.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*C:\\\\Windows\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*iscsiexe.dll*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals
  'C:\Windows\SysWOW64\iscsicpl.exe'; data_win_eventdata_imageLoaded matches
  '*\iscsiexe.dll'; data_win_eventdata_imageLoaded matches '*C:\Windows\*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hackerhouse-opensource/iscsicpl_bypassUAC
  - https://twitter.com/wdormann/status/1547583317410607110
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using Iscsicpl - ImageLoad detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - iscsicpl
    - imageload
    - image_load
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Ii][Ss][Cc][Ss][Ii][Ee][Xx][Ee]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ AND data_win_eventdata_imageLoaded:/.*[Ii][Ss][Cc][Ss][Ii][Ee][Xx][Ee]\.[Dd][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f39ee679-3b1e-4f47-841c-5c3c580acda2
    name: Windows DLL Search Order Hijacking with iscsicpl
    reason: 'The process-creation twin of THIS exact attack: it fires when iscsicpl.exe spawns a cmd/powershell child after loading the hijacked DLL, i.e. the auto-elevated payload actually executing. Both firing on one host confirms the bypass succeeded rather than just that the DLL loaded.'
  - id: a5ea83a7-05a5-44c1-be2e-addccbbd8c03
    name: UAC Bypass With Fake DLL
    reason: Same Sysmon EID 7 image-load stream and the same drop-DLL-then-auto-elevate pattern (dismcore.dll). A near-identical fake-DLL UAC bypass the same operator may exercise alongside the iscsicpl variant.
  - id: 4f6c43e2-f989-4ea5-bcd8-843b49a0317c
    name: UAC Bypass Using WOW64 Logger DLL Hijack
    reason: Sibling WOW64 DLL-hijack UAC bypass (UACMe method 30). iscsicpl is itself the SysWOW64 (32-bit/WOW64) binary, so a WoW64-logger hijack on the host signals the same WOW64-DLL-hijack elevation family being used.
  - id: 0cbe38c0-270c-41d9-ab79-6e5a9a669290
    name: Trusted Path Bypass via Windows Directory Spoofing
    reason: Same EID 7 image-load lens and same end (loading a DLL at high integrity to defeat UAC) via a 'C:\Windows ' trusted-path spoof. An alternate auto-elevate abuse the operator falls back to when the iscsicpl path is blocked.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: The iscsicpl DLL-hijack bypass is a catalogued UACMe method; UACMe/Akagi running on the host means this image-load is likely one product of the toolkit and that other UACMe bypass methods were probably attempted too.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Highest-value follow-on: the purpose of the bypass is a high-integrity process, and comsvcs MiniDump of LSASS needs exactly that privilege. Firing shortly after on the same host means the elevation was spent on credential theft.'
  - id: 48437c39-9e5f-47fb-af95-3d663c3f2919
    name: UAC Disabled
    reason: 'Direct follow-on with the freshly gained privileges: setting EnableLUA=0 to turn UAC off wholesale, consolidating the one-shot bypass into a persistent config change.'
  - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
    name: FodHelper UAC Bypass
    reason: Alternate auto-elevating UAC bypass (registry-based, fodhelper) operators commonly pivot to in the same session when hedging elevation methods; co-occurrence on the host strongly raises confidence this is deliberate privilege escalation, not a false positive.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Elevated payload: child processes spawned by iscsicpl.exe'
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: 'Malicious DLL staging: iscsiexe.dll or a DLL dropped to a user-writable path'
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ii][Ss][Cc][Ss][Ii][Ee][Xx][Ee]\.[Dd][Ll][Ll]/ OR (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)))
    pivot_on:
    - host
    window: 2h
  - name: Other auto-elevating UAC-bypass binaries run on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ss][Dd][Cc][Ll][Tt]|[Ss][Ll][Uu][Ii]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Cc][Mm][Ss][Tt][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ss][Dd][Cc][Ll][Tt]|[Ss][Ll][Uu][Ii]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Cc][Mm][Ss][Tt][Pp])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Post-elevation credential theft: LSASS access or memory dump'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/))
    pivot_on:
    - host
    window: 1h
  - name: 'Post-elevation defense evasion: UAC or Defender neutered via registry'
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\([Ee][Nn][Aa][Bb][Ll][Ee][Ll][Uu][Aa]|[Cc][Oo][Nn][Ss][Ee][Nn][Tt][Pp][Rr][Oo][Mm][Pp][Tt][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Aa][Dd][Mm][Ii][Nn]|[Pp][Rr][Oo][Mm][Pp][Tt][Oo][Nn][Ss][Ee][Cc][Uu][Rr][Ee][Dd][Ee][Ss][Kk][Tt][Oo][Pp])/ OR data_win_eventdata_targetObject:/.*([Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]|[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn])/)
    pivot_on:
    - host
    window: 2h
