name: Aruba Network Service Potential DLL Sideloading
id: 90ae0469-0cee-4509-b67f-e5efcef040f7
version: 1
schema_version: "1.0"
date: "2023-03-15"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 90ae0469-0cee-4509-b67f-e5efcef040f7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading activity via the Aruba Networks Virtual
  Intranet Access "arubanetsvc.exe" process using DLL Search Order Hijacking.
  MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\arubanetsvc.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\wtsapi32.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\msvcr100.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\msvcp100.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\dbghelp.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\dbgcore.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\wininet.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\iphlpapi.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\version.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\cryptsp.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\cryptbase.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\wldp.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\profapi.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\sspicli.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\winsta.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\dpapi.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\arubanetsvc.exe'; data_win_eventdata_imageLoaded matches '*\wtsapi32.dll';
  data_win_eventdata_imageLoaded matches '*\msvcr100.dll', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/wdormann/status/1616581559892545537?t=XLCBO9BziGzD7Bmbt8oMEQ&s=09
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Aruba Network Service Potential DLL Sideloading detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - aruba
    - network
    - service
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Aa][Rr][Uu][Bb][Aa][Nn][Ee][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Ww][Tt][Ss][Aa][Pp][Ii]32\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Ss][Vv][Cc][Rr]100\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Ss][Vv][Cc][Pp]100\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Ii][Nn][Ee][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ii][Pp][Hh][Ll][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Vv][Ee][Rr][Ss][Ii][Oo][Nn]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Rr][Yy][Pp][Tt][Ss][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Rr][Yy][Pp][Tt][Bb][Aa][Ss][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ll][Dd][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Ff][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ss][Ss][Pp][Ii][Cc][Ll][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Ss][Tt][Aa]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Dd][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Generic sibling of this detection on the same Sysmon EID7 image-load event: it flags any known-abusable DLL loaded from a non-system location. This rule is the arubanetsvc.exe-specific instance, so both fire on the same hijacked load and together confirm the sideload is real rather than a one-off path quirk.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Host-wide hunt for the same T1574.001 image-load technique; shows whether the attacker sideloaded into other signed binaries on this host too, not just the VPN service, revealing the full extent of the DLL-hijack campaign.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Phantom-DLL variant of the same technique. This rule's 'NOT System32/SysWOW64/WinSxS' clause is exactly the non-system load path phantom hijacking relies on, so this hunt surfaces the attacker's other planted DLLs on the same host.
  - id: bdc64095-d59a-42a2-8588-71fd9c9d9abc
    name: Suspicious Unsigned Dbghelp/Dbgcore DLL Loaded
    reason: This rule's own sideload list includes dbghelp.dll and dbgcore.dll - the MiniDumpWriteDump DLLs. An unsigned dbghelp/dbgcore load is the malicious sideload seen from the DLL angle and points straight at the LSASS-dump-and-exfil endgame.
  - id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
    name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
    reason: 'Direct follow-on: once a malicious dbghelp/dbgcore is sideloaded into the SYSTEM-level VPN service, the natural next step is opening LSASS via those DLLs'' MiniDumpWriteDump to harvest credentials - this catches that LSASS access.'
  - id: 602a1f13-c640-4d73-b053-be9a2fa58b96
    name: HackTool - Powerup Write Hijack DLL
    reason: 'Precursor tooling: PowerUp enumerates services with writable/hijackable DLL paths and plants a hijack DLL to escalate. arubanetsvc runs as SYSTEM, making it a prime PowerUp target; its debug.bat drop is the setup step that leads to exactly this sideload.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hijackable DLL (this rule's set) dropped to disk outside system dirs on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Ww][Tt][Ss][Aa][Pp][Ii]32|[Mm][Ss][Vv][Cc][Rr]100|[Mm][Ss][Vv][Cc][Pp]100|[Dd][Bb][Gg][Hh][Ee][Ll][Pp]|[Dd][Bb][Gg][Cc][Oo][Rr][Ee]|[Ww][Ii][Nn][Ii][Nn][Ee][Tt]|[Ii][Pp][Hh][Ll][Pp][Aa][Pp][Ii]|[Vv][Ee][Rr][Ss][Ii][Oo][Nn]|[Cc][Rr][Yy][Pp][Tt][Ss][Pp]|[Cc][Rr][Yy][Pp][Tt][Bb][Aa][Ss][Ee]|[Ww][Ll][Dd][Pp]|[Pp][Rr][Oo][Ff][Aa][Pp][Ii]|[Ss][Ss][Pp][Ii][Cc][Ll][Ii]|[Ww][Ii][Nn][Ss][Tt][Aa]|[Dd][Pp][Aa][Pp][Ii])\.[Dd][Ll][Ll]/ AND NOT (data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: Network and DNS egress initiated by the arubanetsvc.exe VPN service (C2 masquerade)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Aa][Rr][Uu][Bb][Aa][Nn][Ee][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Aa][Rr][Uu][Bb][Aa][Nn][Ee][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS memory access or LSASS dump-file creation on this host (credential-dump endgame)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/)
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by the SYSTEM arubanetsvc.exe service (hands-on execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Rr][Uu][Bb][Aa][Nn][Ee][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: arubanetsvc.exe binary planted or executed from a user-writable location
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Rr][Uu][Bb][Aa][Nn][Ee][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Rr][Uu][Bb][Aa][Nn][Ee][Tt][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/))
    pivot_on:
    - host
    window: 6h
