name: VMMap Unsigned Dbghelp.DLL Potential Sideloading
id: 273a8dd8-3742-4302-bcc7-7df5a80fe425
version: 1
schema_version: "1.0"
date: "2023-09-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 273a8dd8-3742-4302-bcc7-7df5a80fe425
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of an unsigned dbghelp.dll by the
  Sysinternals VMMap. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*C:\\\\Debuggers\\\\dbghelp.dll*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\vmmap.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\vmmap64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_signed"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_signed:
                    value: "true"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*C:\Debuggers\dbghelp.dll*'; data_win_eventdata_image matches '*\vmmap.exe';
  data_win_eventdata_image matches '*\vmmap64.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://techcommunity.microsoft.com/t5/sysinternals-blog/zoomit-v7-1-procdump-2-0-for-linux-process-explorer-v17-05/ba-p/3884766
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    VMMap Unsigned Dbghelp.DLL Potential Sideloading detected on host
    $agent_name$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - vmmap
    - unsigned
    - dbghelp
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Cc]:\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr][Ss]\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*/ AND (data_win_eventdata_image:/.*\\[Vv][Mm][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Mm][Mm][Aa][Pp]64\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_signed AND NOT (data_win_eventdata_signed:/[Tt][Rr][Uu][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 98ffaed4-aec2-4e04-9b07-31492fe68b3d
    name: VMMap Signed Dbghelp.DLL Potential Sideloading
    reason: 'Sibling of this rule: same vmmap/C:\Debuggers dbghelp.dll load but with a validly signed DLL; both firing shows the planted-DLL path being exercised repeatedly or with a signed-DLL variant.'
  - id: 6414b5cd-b19d-447e-bb5e-9f03940b5784
    name: Potential DLL Sideloading Of DBGHELP.DLL
    reason: Generic dbghelp.dll sideload from a non-system path; confirms the same hijack technique against other host binaries beyond vmmap.
  - id: bdc64095-d59a-42a2-8588-71fd9c9d9abc
    name: Suspicious Unsigned Dbghelp/Dbgcore DLL Loaded
    reason: Same unsigned dbghelp.dll indicator regardless of host process; shows whether the rogue DLL is loaded by other binaries too.
  - id: 416bc4a2-7217-4519-8dc7-c3271817f1d5
    name: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location
    reason: Catches the planted dbghelp/dbgcore loaded from an unusual directory such as C:\Debuggers by any process.
  - id: 9ca2bf31-0570-44d8-a543-534c47c33ed7
    name: Potential DLL Sideloading Of DBGCORE.DLL
    reason: Companion debug-library hijack; attackers often plant dbgcore alongside dbghelp to get code execution in Sysinternals/debugger tools.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Broader sideload of commonly abused DLLs from user-writable paths; indicates the actor is using several hijack primitives on the host.
  - id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
    name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
    reason: 'Likely follow-on: a hijacked dbghelp/dbgcore in a debugger-class tool is a classic route to MiniDumpWriteDump against LSASS.'
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: Possible escalation of the unsigned-DLL abuse into credential-store injection or loading into LSASS.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: dbghelp.dll/dbgcore.dll written to disk outside system folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(dbghelp|dbgcore)\.dll/ AND NOT data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\(System32|SysWOW64|WinSxS).*/
    pivot_on:
    - host
    window: 6h
  - name: Unsigned dbghelp/dbgcore image loads by any process
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\(dbghelp|dbgcore)\.dll/ AND NOT data_win_eventdata_signed:"true"
    pivot_on:
    - host
    window: 6h
  - name: vmmap launched with its command line and parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Vv][Mm][Mm][Aa][Pp](64)?\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Network connections or DNS from vmmap (payload beaconing)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Vv][Mm][Mm][Aa][Pp](64)?\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: vmmap spawning children or injecting into other processes
    query: (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Vv][Mm][Mm][Aa][Pp](64)?\.[Ee][Xx][Ee]/) OR ((data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND data_win_eventdata_sourceImage:/.*\\[Vv][Mm][Mm][Aa][Pp](64)?\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
