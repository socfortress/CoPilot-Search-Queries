name: Potential AVKkid.DLL Sideloading
id: 952ed57c-8f99-453d-aee0-53a49c22f95d
version: 1
schema_version: "1.0"
date: "2023-08-03"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 952ed57c-8f99-453d-aee0-53a49c22f95d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "AVKkid.dll". MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\AVKkid.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*C:\\\\Program Files (x86)\\\\G DATA\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*C:\\\\Program Files\\\\G DATA\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AVKKid.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files (x86)\\\\G DATA\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files\\\\G DATA\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\AVKkid.dll'; data_win_eventdata_image matches '*C:\Program Files (x86)\G
  DATA\*'; data_win_eventdata_image matches '*C:\Program Files\G DATA\*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.checkpoint.com/2023/beyond-the-horizon-traveling-the-world-on-camaro-dragons-usb-flash-drives/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential AVKkid.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - avkkid
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Aa][Vv][Kk][Kk][Ii][Dd]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND NOT ((data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg] [Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg] [Dd][Aa][Tt][Aa]\\.*/) AND data_win_eventdata_image:/.*\\[Aa][Vv][Kk][Kk][Ii][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg] [Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg] [Dd][Aa][Tt][Aa]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
    name: Mustang Panda Dropper
    reason: 'Same actor cluster (Camaro Dragon = Mustang Panda): the dropper that stages the relocated signed EXE + planted DLL pair this sideload executes. Expect it running minutes before the load (Public\Libraries drop, wtask.exe scheduled-task creation).'
  - id: 7806bb49-f653-48d3-a915-5115c1a85234
    name: Potential APT Mustang Panda Activity Against Australian Gov
    reason: 'Same actor, identical TTP: a signed EXE sideloading a DLL out of C:\Users\Public\Libraries followed by a CurrentVersion\Run key - the structural twin of the AVKkid chain and strong corroboration the same campaign is on this host.'
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: 'PlugX is Mustang Panda''s payload: the sideloaded AVKkid loader''s purpose is to launch PlugX via another legit binary run from an uncommon location, so a sibling PlugX sideload host should appear on the same host.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Same behaviour, broader net: a known-abusable DLL loaded from a user-writable path (Users\Public, PerfLogs, Windows\Temp). A multi-stage chain''s next sideload stage trips this generic EID 7 rule too.'
  - id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
    name: Potential Antivirus Software DLL Sideloading
    reason: 'Direct sibling: AVKkid.dll is a G DATA (antivirus) component, and this rule catches the same trust-abuse against other AV vendors'' signed binaries (McAfee/Avast/AVG/ESET/Trend), so the actor''s other AV-sideload stages surface here.'
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: 'Follow-on persistence: after the loader runs, PlugX/Mustang Panda writes a CurrentVersion\Run value pointing into the dropped-payload folder (Users\Public, ProgramData, $Recycle.Bin) that holds the sideload pair.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AVKkid pair / companion DLL+EXE written into payload-staging folders (dropper)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Vv][Kk][Kk][Ii][Dd]\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ OR data_win_eventdata_targetFilename:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: Signed/legit-looking EXE launched from a user-writable staging dir (sideload host process)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Vv][Kk][Kk][Ii][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Run-key autorun persistence pointing into a dropped-payload folder
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND (data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound network/DNS from a process in a payload-staging directory (C2 beacon)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Vv][Kk][Kk][Ii][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
