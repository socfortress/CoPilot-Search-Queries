name: Potential AVKkid.DLL Sideloading
id: 952ed57c-8f99-453d-aee0-53a49c22f95d
version: 1
schema_version: "1.0"
date: "2023-08-03"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 952ed57c-8f99-453d-aee0-53a49c22f95d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "AVKkid.dll". MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\AVKkid.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*C:\\\\Program Files (x86)\\\\G DATA\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*C:\\\\Program Files\\\\G DATA\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AVKKid.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files (x86)\\\\G DATA\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files\\\\G DATA\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\AVKkid.dll'; data_win_eventdata_image matches '*C:\Program Files (x86)\G
  DATA\*'; data_win_eventdata_image matches '*C:\Program Files\G DATA\*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.checkpoint.com/2023/beyond-the-horizon-traveling-the-world-on-camaro-dragons-usb-flash-drives/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential AVKkid.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - avkkid
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Aa][Vv][Kk][Kk][Ii][Dd]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND NOT ((data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg] [Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg] [Dd][Aa][Tt][Aa]\\.*/) AND data_win_eventdata_image:/.*\\[Aa][Vv][Kk][Kk][Ii][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg] [Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg] [Dd][Aa][Tt][Aa]\\.*/))

