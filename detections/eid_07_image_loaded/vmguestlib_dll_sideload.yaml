name: VMGuestLib DLL Sideload
id: 70e8e9b4-6a93-4cb7-8cde-da69502e7aff
version: 1
schema_version: "1.0"
date: "2022-12-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 70e8e9b4-6a93-4cb7-8cde-da69502e7aff
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DLL sideloading of VMGuestLib.dll by the WmiApSrv service. MITRE
  ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\VMware\\\\VMware Tools\\\\vmStatsProvider\\\\win32*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\vmGuestLib.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Windows\\\\System32\\\\wbem\\\\WmiApSrv.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_signed"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_signed:
                    value: "true"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\VMware\VMware Tools\vmStatsProvider\win32*'; data_win_eventdata_imageLoaded
  matches '*\vmGuestLib.dll*'; data_win_eventdata_image matches
  '*\Windows\System32\wbem\WmiApSrv.exe', among other conditions.

known_false_positives: >
  FP could occur if the legitimate version of vmGuestLib already exists on the
  system. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://decoded.avast.io/martinchlumecky/png-steganography/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    VMGuestLib DLL Sideload detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - vmguestlib
    - sideload
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Vv][Mm][Ww][Aa][Rr][Ee]\\[Vv][Mm][Ww][Aa][Rr][Ee] [Tt][Oo][Oo][Ll][Ss]\\[Vv][Mm][Ss][Tt][Aa][Tt][Ss][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\\[Ww][Ii][Nn]32.*/ AND data_win_eventdata_imageLoaded:/.*\\[Vv][Mm][Gg][Uu][Ee][Ss][Tt][Ll][Ii][Bb]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ww][Mm][Ii][Aa][Pp][Ss][Rr][Vv]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_signed AND NOT (data_win_eventdata_signed:/[Tt][Rr][Uu][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9313dc13-d04c-46d8-af4a-a930cc55d93b
    name: Potential DLL Sideloading Via VMware Xfer
    reason: 'Same technique family: a fake VMware Tools DLL planted next to or in place of a trusted VMware binary; an actor using one VMware sideload often tries the others on the same host.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Generic co-occurring image-load signal: the staged sideload chain often loads other abusable DLLs from user-writable paths on the same host.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: WmiApSrv.exe is a System32 service host; the unsigned DLL is loaded by a system process from a non-standard path, which this rule also catches on the same pattern.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: VMGuestLib.dll does not exist on hosts without VMware Tools; this is the same phantom-DLL hijack primitive against System32 services.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: 'Follow-on persistence: after the loader runs under WmiApSrv, actors commonly add a scheduled task to re-trigger the chain or run the decoded payload.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: 'Follow-on persistence: Run-key writes by the dropper or loaded payload after the sideload succeeds.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL written into a VMware Tools stats-provider path or named vmGuestLib.dll
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Vv][Mm][Gg][Uu][Ee][Ss][Tt][Ll][Ii][Bb]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*[Vv][Mm][Ss][Tt][Aa][Tt][Ss][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 24h
  - name: WmiApSrv.exe started or triggered via service control
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*[Ww][Mm][Ii][Aa][Pp][Ss][Rr][Vv]* OR data_win_eventdata_image:/.*[Ww][Mm][Ii][Aa][Pp][Ss][Rr][Vv]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by WmiApSrv.exe (loader executing payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Aa][Pp][Ss][Rr][Vv]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Network connections or DNS lookups by WmiApSrv.exe (C2 from sideloaded DLL)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Aa][Pp][Ss][Rr][Vv]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Aa][Pp][Ss][Rr][Vv]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: PNG steganography decoding in PowerShell/.NET script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:*GetPixel* AND data_win_eventdata_scriptBlockText:*Drawing*
    pivot_on:
    - host
    window: 6h
