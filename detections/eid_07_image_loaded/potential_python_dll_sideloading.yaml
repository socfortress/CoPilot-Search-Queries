name: Potential Python DLL SideLoading
id: d36f7c12-14a3-4d48-b6b8-774b9c66f44d
version: 1
schema_version: "1.0"
date: "2025-08-18"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d36f7c12-14a3-4d48-b6b8-774b9c66f44d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of Python DLL files. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\python39.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\python310.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\python311.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\python312.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - exists:
            field: "data_win_eventdata_product"
        - exists:
            field: "data_win_eventdata_signed"
        - exists:
            field: "data_win_eventdata_description"
        - exists:
            field: "data_win_eventdata_company"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\Python3*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\Python3*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\AppData\\\\Local\\\\Programs\\\\Python\\\\Python3*"
                          case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_product:
                                value: "Python"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_signed:
                                value: "true"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_description:
                                value: "Python"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_company:
                                value: "Python Software Foundation"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\Microsoft Visual Studio\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\ProgramData\\\\Anaconda3\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\cpython\\\\externals\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\cpython\\\\PCbuild\\\\*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Users*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\_MEI*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_product
    - data_win_eventdata_signed
    - data_win_eventdata_description
    - data_win_eventdata_company
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\python39.dll'; data_win_eventdata_imageLoaded matches '*\python310.dll';
  data_win_eventdata_imageLoaded matches '*\python311.dll', among other
  conditions.

known_false_positives: >
  Legitimate software using Python DLLs. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.securonix.com/blog/seolurker-attack-campaign-uses-seo-poisoning-fake-google-ads-to-install-malware/
  - https://thedfirreport.com/2024/09/30/nitrogen-campaign-drops-sliver-and-ends-with-blackcat-ransomware/
  - https://github.com/wietze/HijackLibs/tree/dc9c9f2f94e6872051dab58fbafb043fdd8b4176/yml/3rd_party/python
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Python DLL SideLoading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - python
    - sideloading
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn]39\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn]310\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn]311\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn]312\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_imageLoaded AND _exists_:data_win_eventdata_product AND _exists_:data_win_eventdata_signed AND _exists_:data_win_eventdata_description AND _exists_:data_win_eventdata_company AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Pp][Yy][Tt][Hh][Oo][Nn]3.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Pp][Yy][Tt][Hh][Oo][Nn]3.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Pp][Yy][Tt][Hh][Oo][Nn]\\[Pp][Yy][Tt][Hh][Oo][Nn]3.*/ OR (data_win_eventdata_product:/[Pp][Yy][Tt][Hh][Oo][Nn]/ AND data_win_eventdata_signed:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_description:/[Pp][Yy][Tt][Hh][Oo][Nn]/ AND data_win_eventdata_company:/[Pp][Yy][Tt][Hh][Oo][Nn] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee] [Ff][Oo][Uu][Nn][Dd][Aa][Tt][Ii][Oo][Nn]/)) AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ii][Ss][Uu][Aa][Ll] [Ss][Tt][Uu][Dd][Ii][Oo]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Nn][Aa][Cc][Oo][Nn][Dd][Aa]3\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Pp][Yy][Tt][Hh][Oo][Nn]\\[Ee][Xx][Tt][Ee][Rr][Nn][Aa][Ll][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Pp][Yy][Tt][Hh][Oo][Nn]\\[Pp][Cc][Bb][Uu][Ii][Ll][Dd]\\.*/ OR (data_win_eventdata_imageLoaded:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss].*/ AND data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\_[Mm][Ee][Ii].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'Precursor (the file-creation half of this exact technique): a malicious DLL written into an application''s dependency folder to seed search-order hijacking. On the same host within the window it is the drop that stages the rogue python DLL this image-load alert then catches being loaded.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Same-technique generic hunt (T1574.001): flags any DLL loaded from a non-system directory, cross-referenced to hijacklibs.net. It re-surfaces this python DLL plus any companion DLL the same loader sideloads, confirming a hijacking pattern rather than a one-off load.'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: Loaders behind this technique (Nitrogen, Interlock) stage their DLL set in %TEMP%/user-writable dirs; a module loaded from Temp on the same host points at the same dropped payload directory the sideloaded python DLL was executed from.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Sibling sideload detection for other known-abusable DLLs (libcef, coreclr, ZIPDLL) from writable locations. Malvertising/SEO-poisoning droppers often ship several sideloadable DLLs in one package, so a co-hit on the same host widens this from one python DLL to a full sideloading toolkit.
  - id: 42333b2c-b425-441c-b70e-99404a17170f
    name: HackTool - Sliver C2 Implant Activity Pattern
    reason: 'Direct follow-on named in this rule''s own reference (DFIR Report Nitrogen campaign ends in Sliver): the sideloaded python DLL is a loader that decrypts and runs a Sliver implant; this catches the Sliver shell spawned on the same host minutes later.'
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: 'The other beacon this loader family delivers (SEO#LURKER/Nitrogen): Cobalt Strike. Catches the fork&run process tree (child from Temp, cmd echo to a named pipe, conhost 0xffffffff -ForceV1) that appears once the sideloaded DLL has executed the beacon.'
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Highest-confidence beacon confirmation: the in-memory Cobalt Strike payload the python DLL loads opens default post-ex named pipes (postex_*, msagent_*, MSSE-*-server) on the same host, proving the sideload established a live C2 implant rather than just a suspicious load.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: The sideloaded DLL reflectively loads the beacon, which then injects into a sacrificial process; this flags that CreateRemoteThread carrying Cobalt Strike's signature start-address suffixes on the same host, tying the load to active post-exploitation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Loader process that sideloaded the DLL - execution from user-writable paths on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: DLL files dropped into user-writable folders on this host (sideload staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Beacon C2 egress - network/DNS from the loader or sacrificial spawnto process on this host
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/))
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential access / dumping on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 4h
  - name: Autostart persistence written on this host (Run keys, services, IFEO, scheduled task)
    query: ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
