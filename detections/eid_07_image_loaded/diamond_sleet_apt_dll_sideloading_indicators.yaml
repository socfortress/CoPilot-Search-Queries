name: Diamond Sleet APT DLL Sideloading Indicators
id: d1b65d98-37d7-4ff6-b139-2d87c1af3042
version: 1
schema_version: "1.0"
date: "2023-10-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d1b65d98-37d7-4ff6-b139-2d87c1af3042
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DLL sideloading activity seen used by Diamond Sleet APT. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\ProgramData\\\\clip.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*:\\\\ProgramData\\\\Version.dll"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\ProgramData\\\\wsmprovhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*:\\\\ProgramData\\\\DSROLE.dll"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*:\ProgramData\clip.exe'; data_win_eventdata_imageLoaded matches
  '*:\ProgramData\Version.dll'; data_win_eventdata_image matches
  '*:\ProgramData\wsmprovhost.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/10/18/multiple-north-korean-threat-actors-exploiting-the-teamcity-cve-2023-42793-vulnerability/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Diamond Sleet APT DLL Sideloading Indicators detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - diamond
    - sleet
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND ((data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Cc][Ll][Ii][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Vv][Ee][Rr][Ss][Ii][Oo][Nn]\.[Dd][Ll][Ll]/) OR (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Dd][Ss][Rr][Oo][Ll][Ee]\.[Dd][Ll][Ll]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e1212b32-55ff-4dfb-a595-62b572248056
    name: Diamond Sleet APT File Creation Indicators
    reason: 'Direct precursor on this host: this rule fires when clip.exe / wsmprovhost.exe (relocated to C:\ProgramData) side-load Version.dll / DSROLE.dll, and the File Creation rule catches those exact files - plus Forest64.exe and the GUID marker - being dropped into C:\ProgramData, proving how the side-load binaries landed on disk before they were loaded.'
  - id: fba38e0f-4607-4344-bb8f-a4b50cdeef7f
    name: Diamond Sleet APT DNS Communication Indicators
    reason: 'Immediate follow-on: the DLL this rule just side-loaded runs the ForestTiger/Forest64 backdoor, which beacons to the actor''s C2 (3dkit.org, galerielamy.com, dersmarketim.com, olidhealth.com); a DNS hit on the same host confirms the loaded implant reached command-and-control.'
  - id: b5495d8d-24ad-4a44-8caf-ceae9a07a5c2
    name: Diamond Sleet APT Process Activity Indicators
    reason: 'Same-intrusion execution marker: the unique ''uTYNkfKxHiZrx3KJ'' command-line token appears when the operator drives the implant this side-load launched; co-occurrence on the host confirms hands-on-keyboard activity rather than an isolated DLL load.'
  - id: 9f9f92ba-5300-43a4-b435-87d1ee571688
    name: Diamond Sleet APT Scheduled Task Creation - Registry
    reason: 'Follow-on persistence: Diamond Sleet writes the ''Windows TeamCity Settings User Interface'' task into the TaskCache registry to relaunch the side-loaded implant across reboots - the durability step taken right after this load.'
  - id: 3b8e5084-4de9-449a-a40d-0e11014f2e2d
    name: Diamond Sleet APT Scheduled Task Creation
    reason: Same persistence task seen via the Windows Security log (4698, task content carries the uTYNkfKxHiZrx3KJ token) instead of Sysmon registry; check it to confirm durable re-execution of the side-loaded implant when Sysmon registry auditing is off.
  - id: 24007168-a26b-4049-90d0-ce138e13a5cf
    name: Lazarus APT DLL Sideloading Activity
    reason: 'Sibling TTP from the same actor umbrella (Diamond Sleet is tracked under Lazarus): the signature legit-EXE-in-a-writable-dir-loads-trojanized-DLL pattern via different pairs (colorcpl/colorui, fixmapi/mapistub, tabcal/HID); another way the same operator may have side-loaded a payload on this host.'
  - id: 4d16c9a6-4362-4863-9940-1dee35f1d70f
    name: DPRK Threat Actor - C2 Communication DNS Indicators
    reason: 'Attribution and infrastructure corroboration: once the side-loaded implant runs it beacons over DNS, so a hit on other known DPRK C2 domains on the same host strengthens DPRK attribution and may surface actor infrastructure beyond this campaign''s four domains.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Diamond Sleet staging binaries dropped or executed from ProgramData on this host
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\([Cc][Ll][Ii][Pp]\.[Ee][Xx][Ee]|[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|[Ff][Oo][Rr][Ee][Ss][Tt]64\.[Ee][Xx][Ee]|[Vv][Ee][Rr][Ss][Ii][Oo][Nn]\.[Dd][Ll][Ll]|[Dd][Ss][Rr][Oo][Ll][Ee]\.[Dd][Ll][Ll])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\([Cc][Ll][Ii][Pp]\.[Ee][Xx][Ee]|[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|[Ff][Oo][Rr][Ee][Ss][Tt]64\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound C2 from binaries running in ProgramData / user-writable staging dirs on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: 'Persistence: scheduled task, TaskCache, Run key or service created on this host'
    query: ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee]\\[Tt][Aa][Ss][Kk][Cc][Aa][Cc][Hh][Ee]\\[Tt][Rr][Ee][Ee]\\.*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/)) OR (data_win_system_eventID:"4698" OR data_win_system_eventID:"4702")
    pivot_on:
    - host
    window: 4h
  - name: TeamCity / web-server process spawning a command shell on this host (CVE-2023-42793 exploitation)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\([Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]|[Jj][Aa][Vv][Aa][Ww]\.[Ee][Xx][Ee]|[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]|[Tt][Oo][Mm][Cc][Aa][Tt].*\.[Ee][Xx][Ee]|[Tt][Ee][Aa][Mm][Cc][Ii][Tt][Yy].*\.[Ee][Xx][Ee])/) AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 6h
  - name: Other DLL side-loading or execution from ProgramData / user-writable paths on this host
    query: (data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/))
    pivot_on:
    - host
    window: 2h
