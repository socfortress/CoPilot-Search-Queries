name: Potential Mfdetours.DLL Sideloading
id: d2605a99-2218-4894-8fd3-2afb7946514d
version: 1
schema_version: "1.0"
date: "2023-08-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d2605a99-2218-4894-8fd3-2afb7946514d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "mfdetours.dll". While using
  "mftrace.exe" it can be abused to attach to an arbitrary process and force
  load any DLL named "mfdetours.dll" from the current directory of execution.
  MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\mfdetours.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Program Files (x86)\\\\Windows Kits\\\\10\\\\bin\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\mfdetours.dll'; data_win_eventdata_imageLoaded matches '*:\Program Files
  (x86)\Windows Kits\10\bin\*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Mfdetours.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - mfdetours
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Mm][Ff][Dd][Ee][Tt][Oo][Uu][Rr][Ss]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Kk][Ii][Tt][Ss]\\10\\[Bb][Ii][Nn]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3d48c9d3-1aa6-418d-98d3-8fd3c01a564e
    name: Potential Mftrace.EXE Abuse
    reason: 'The other observable half of this exact LOLBIN chain: mftrace.exe is the signed Media Foundation tool that force-loads mfdetours.dll, and this rule catches it spawning arbitrary child processes - i.e. the code the sideloaded DLL executes inside the trusted process. A near-simultaneous hit turns a ''potential'' load into an observed mftrace abuse.'
  - id: 948a0953-f287-4806-bbcb-3b2e396df89f
    name: Unsigned Mfdetours.DLL Sideloading
    reason: Fires on the identical *\mfdetours.dll image-load but keyed on signatureStatus/unsigned - the malicious-vs-benign discriminator for this very event. A match removes the one benign explanation (a signed Microsoft copy) and upgrades this to a near-certain planted-DLL sideload.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: The generic T1574.001 hunt for DLLs loaded from non-standard directories that this detection is one concrete instance of; a hit on the same host surfaces any OTHER hijacked/sideloaded libraries loaded from user-writable paths, showing whether mfdetours is isolated or part of a wider hijack.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Same image-load sideloading tradecraft keyed on a list of known-abusable DLLs loaded from suspicious locations; co-occurrence reveals the other hijackable DLLs planted in the same drop alongside mfdetours, i.e. the full set of sideloaded libraries in the campaign.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: This rule excludes the legit SDK bin path, so operators run mftrace.exe from a copied-in user-writable directory; this flags outbound egress from a process in such an uncommon location - the C2/beacon 'what next' when the sideloaded mfdetours is a loader rather than a one-shot.
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'The file-write/deposit half of the same T1574.001 technique: a DLL dropped by an unusual process into a hijackable app-dependency folder. A hit on the same host within the window indicates active DLL-planting tradecraft, the precursor phase to a load like this one.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mftrace.exe execution (as image or parent) and mfdetours.dll written to disk on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Mm][Ff][Dd][Ee][Tt][Oo][Uu][Rr][Ss]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: mftrace.exe injecting into or opening a handle to another process on this host (CreateRemoteThread / ProcessAccess)
    query: (data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by mftrace.exe on this host (executed payload / hands-on-keyboard)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections and DNS queries from mftrace.exe on this host (C2 from the signed host process)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Other DLLs loaded from user-writable paths on this host (sideload staging directory and additional planted DLLs)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
