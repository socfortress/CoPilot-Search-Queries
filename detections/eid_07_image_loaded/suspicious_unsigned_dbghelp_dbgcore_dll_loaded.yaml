name: Suspicious Unsigned Dbghelp/Dbgcore DLL Loaded
id: bdc64095-d59a-42a2-8588-71fd9c9d9abc
version: 1
schema_version: "1.0"
date: "2022-12-09"
author: Perez Diego (@darkquassar), oscd.community, Ecco
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bdc64095-d59a-42a2-8588-71fd9c9d9abc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the load of dbghelp/dbgcore DLL (used to make memory dumps) by
  suspicious processes. Tools like ProcessHacker and some attacker tradecract
  use MiniDumpWriteDump API found in dbghelp.dll or dbgcore.dll. As an example,
  SilentTrynity C2 Framework has a module that leverages this API to dump the
  contents of Lsass.exe and transfer it over the network back to the attacker's
  machine. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\dbghelp.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\dbgcore.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_signed:
              value: "false"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\dbghelp.dll'; data_win_eventdata_imageLoaded matches '*\dbgcore.dll';
  data_win_eventdata_signed equals 'false'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/win32/api/minidumpapiset/nf-minidumpapiset-minidumpwritedump
  - https://www.pinvoke.net/default.aspx/dbghelp/MiniDumpWriteDump.html
  - https://medium.com/@fsx30/bypass-edrs-memory-protection-introduction-to-hooking-2efb21acffd6
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Suspicious Unsigned Dbghelp/Dbgcore DLL Loaded detected on host
    $agent_name$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. Matched data_win_eventdata_signed:
    $data_win_eventdata_signed$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_signed
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - unsigned
    - dbghelp
    - dbgcore
    - image_load
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll]/) AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
    name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
    reason: 'Direct confirmation of the act: the same dbgcore/dbghelp DLLs that just loaded unsigned (EID 7) now appear in the call stack of a handle opened to lsass.exe (EID 10) - MiniDumpWriteDump executing against LSASS. The two fire on the same process within seconds.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'The output artifact: if the unsigned MiniDumpWriteDump DLL was weaponized, an lsass*.dmp / *.dmp file lands on disk (EID 11) moments later. Confirms the load produced a dump and gives the file to seize.'
  - id: 273a8dd8-3742-4302-bcc7-7df5a80fe425
    name: VMMap Unsigned Dbghelp.DLL Potential Sideloading
    reason: Closest sibling vector - the identical unsigned dbghelp.dll, here sideloaded into Sysinternals VMMap from C:\Debuggers\. Same bring-your-own-unsigned-MiniDumpWriteDump tradecraft delivered through a different host binary; one actor can trip both.
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: 'Alternative dump route often run in parallel: rundll32 comsvcs.dll MiniDump reaches MiniDumpWriteDump without bundling a DLL. Attackers fall back to it when the bring-your-own-dbghelp attempt is caught - check whether both fired on the host.'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: ProcDump consumes dbghelp's MiniDumpWriteDump; a renamed or modified ProcDump (or its bundled unsigned dbghelp copy) is a prime cause of this alert. Procdump -ma against lsass/samss/keyiso on the host is the same dump goal.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Sibling unsigned-DLL-plus-LSASS tradecraft: an unsigned module loaded by lsass.exe itself (injected SSP / credential-access module). The same actor targeting LSASS credentials with an unsigned DLL from a different angle.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Broad-net LSASS confirmation: catches the credential-access handle open even when the call trace did not resolve to the dbg DLLs, expanding a lone DLL load into a confirmed LSASS credential-dump incident on the host.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on exfil staging: after LSASS memory is dumped the attacker compresses the .dmp with 7-Zip to shrink and obscure it before transfer. On the same host it turns a prepared dump into an active exfiltration.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS memory access via dbgcore/dbghelp or dump-grade GrantedAccess on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1010.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1410.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]143[Aa].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/)
    pivot_on:
    - host
    window: 1h
  - name: Process-memory / LSASS dump files written on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Mm][Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Cc]_.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Dd][Uu][Mm][Pp].*\.[Bb][Ii][Nn]/)
    pivot_on:
    - host
    window: 2h
  - name: Memory-dump tooling and MiniDump LOLBin techniques executing on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ AND data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/) OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp][Ww][Rr][Ii][Tt][Ee][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Harvested-credential reuse: remote/new-credential logons and auth failures by this account'
    query: ((data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:/3/ OR data_win_eventdata_logonType:/9/ OR data_win_eventdata_logonType:/10/)) OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 6h
  - name: 'Dump exfil staging: compressing .dmp/lsass/dump files on this host'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[7][Zz].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 4h
