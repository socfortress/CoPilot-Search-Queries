name: Windows NetSupport RMM DLL Loaded By Uncommon Process
id: Windows-NetSupport-RMM-DLL-Loaded-By-Uncommon-Process
version: 1
schema_version: 1
date: '2025-11-20'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects loading of NetSupport Remote Manager DLLs (CryptPak.dll, HTCTL32.DLL,
  pcicapi.dll, pcichek.dll, PCICL32.DLL, TCCTL32.DLL) by processes running outside
  of the standard Program Files installation paths. Adversaries abuse the legitimate
  NetSupport RMM tool as a RAT by deploying it from non-standard directories such
  as Downloads, ProgramData, or user-specific folders. Associated with NetSupport
  RMM Tool Abuse, Evalusion campaign, and domain compromise intrusions.
  MITRE ATT&CK: T1036 (Masquerading).

data_source:
  - Sysmon EventID 7 (ImageLoad)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "7"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\CryptPak.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\HTCTL32.DLL"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\pcicapi.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\pcichek.dll"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\PCICL32.DLL"
              - wildcard:
                  data_win_eventdata_imageLoaded: "*\\TCCTL32.DLL"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"
      must_not:
        - wildcard:
            data_win_eventdata_image: "C:\\\\Program Files\\\\*"
        - wildcard:
            data_win_eventdata_image: "C:\\\\Program Files (x86)\\\\*"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 7 (ImageLoad) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_imageLoaded and data_win_eventdata_image are
  confirmed working (153+ events/2h observed in this environment).
  Field-validated based on established EventID 7 detection patterns.
  Note: Splunk's original detection also filters on DLL signature "NetSupport Ltd"
  which is not available in Wazuh EventID 7 telemetry — the DLL name list plus
  path exclusion provides equivalent coverage.

known_false_positives: >
  Legitimate NetSupport RMM installations outside of the standard Program Files
  directory will trigger this detection. Apply filters to exclude known approved
  installation paths.

references:
  - https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
  - https://www.esentire.com/blog/evalusion-campaign-delivers-amatera-stealer-and-netsupport-rat
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    NetSupport RMM DLL loaded from non-standard path on $agent_name$.
    DLL: $data_win_eventdata_imageLoaded$.
    Loaded by: $data_win_eventdata_image$.
    MITRE ATT&CK: T1036
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  analytic_story:
    - NetSupport RMM Tool Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - netsupport
    - rmm
    - rat
    - dll_load
    - masquerading
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 37e8d358-6408-4853-82f4-98333fca7014
    name: Remote Access Tool - NetSupport Execution From Unusual Location
    reason: Same client32.exe staged outside Program Files; process-creation view of the exact deployment whose DLLs this alert saw loading.
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: Launch of the NetSupport client that loads PCICL32/TCCTL32/HTCTL32; confirms the loaded DLLs belong to a running RAT session.
  - id: 0afbd410-de03-4078-8491-f132303cb67d
    name: Renamed NetSupport RAT Execution
    reason: Attackers rename client32.exe to evade name-based detection; the DLL load is the tell, this rule confirms the renamed host binary.
  - id: 2d510d8d-912b-45c5-b1df-36faa3d8c3f4
    name: NetSupport Manager Service Install
    reason: NetSupport installed as a service is the persistence step that follows the staged deployment.
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: Once loaded, the client contacts its gateway or geo-check domains from a non-browser process, showing the RAT beaconing.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: NetSupport droppers persist client32.exe via Run keys after staging in user-writable paths.
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: System log service install for a remote access tool, a co-occurring persistence artifact of the same RAT deployment.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NetSupport client process launched from non-standard path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*[Cc]lient32.exe OR data_win_eventdata_originalFileName:"client32.exe" OR data_win_eventdata_description:*NetSupport* OR data_win_eventdata_company:*NetSupport* OR data_win_eventdata_commandLine:*[Cc]lient32*)
    pivot_on:
    - host
    window: 2h
  - name: NetSupport persistence via Run key, startup or scheduled task
    query: ((data_win_system_eventID:("12" OR "13") AND (data_win_eventdata_targetObject:*CurrentVersion\Run* AND (data_win_eventdata_details:*[Cc]lient32* OR data_win_eventdata_details:*[Pp]cicl32*))) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:*schtasks.exe AND data_win_eventdata_commandLine:*[Cc]lient32*))
    pivot_on:
    - host
    window: 4h
  - name: NetSupport component files dropped to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*[Cc]lient32.exe OR data_win_eventdata_targetFilename:*NSM.lic OR data_win_eventdata_targetFilename:*client32.ini OR data_win_eventdata_targetFilename:*[Pp]cicl32.dll OR data_win_eventdata_targetFilename:*[Tt]cctl32.dll OR data_win_eventdata_targetFilename:*[Hh]tctl32.dll OR data_win_eventdata_targetFilename:*[Cc]ryptpak.dll)
    pivot_on:
    - host
    window: 4h
  - name: NetSupport C2 network connections and gateway DNS
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_image:*[Cc]lient32.exe OR data_win_eventdata_destinationPort:"5405")) OR (data_win_system_eventID:"22" AND (data_win_eventdata_image:*[Cc]lient32.exe OR data_win_eventdata_queryName:*geo.netsupportsoftware.com OR data_win_eventdata_queryName:*netsupportsoftware.com))
    pivot_on:
    - host
    window: 2h
  - name: Script or LOLBin staging that precedes NetSupport deployment
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:(*powershell.exe OR *wscript.exe OR *cscript.exe OR *mshta.exe OR *curl.exe OR *certutil.exe OR *bitsadmin.exe) AND (data_win_eventdata_commandLine:*http* OR data_win_eventdata_commandLine:*.zip* OR data_win_eventdata_commandLine:*[Cc]lient32*))
    pivot_on:
    - host
    window: 2h
