name: Potential DCOM InternetExplorer.Application DLL Hijack - Image Load
id: f354eba5-623b-450f-b073-0b5b2773b6aa
version: 1
schema_version: "1.0"
date: "2022-12-18"
author: Roberto Rodriguez @Cyb3rWard0g, Open Threat Research (OTR), wagga
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f354eba5-623b-450f-b073-0b5b2773b6aa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL hijack of "iertutil.dll" found in the DCOM
  InternetExplorer.Application Class. MITRE ATT&CK: T1021.002, T1021.003.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Internet Explorer\\\\iexplore.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\Internet Explorer\\\\iertutil.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches '*\Internet
  Explorer\iexplore.exe'; data_win_eventdata_imageLoaded matches '*\Internet
  Explorer\iertutil.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/201009-RemoteDCOMIErtUtilDLLHijack/notebook.html
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1021/003/

response:
  message: >
    Potential DCOM InternetExplorer.Application DLL Hijack - Image Load detected
    on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. MITRE ATT&CK: T1021.002, T1021.003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1021.003
  custom_tags:
    - internetexplorer
    - application
    - hijack
    - image_load
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f7979ae-f82b-45af-ac1d-2b10e93b0baa
    name: Potential DCOM InternetExplorer.Application DLL Hijack
    reason: 'Same technique, the drop side (Sysmon EID 11): ''System'' remotely writes iertutil.dll into the Internet Explorer application directory. That planted DLL is exactly what this image-load alert then catches iexplore.exe side-loading - the pair fires back-to-back on the same host, drop then load.'
  - id: c39f0c81-7348-4965-ab27-2fde35a1b641
    name: DCOM InternetExplorer.Application Iertutil DLL Hijack - Security
    reason: Same hijack seen via Security EID 5145 (network share write) as the attacker creates iertutil.dll in C:\Program Files\Internet Explorer\ over SMB. Corroborates the drop from the Security log and, unlike Sysmon, records the subjectUserName and source performing the remote write - it names the actor behind this hijack.
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: 'The DCOM activation that triggers this: PowerShell driving a DCOM object''s Document.Application.ShellExecute / ExecuteShellCommand to run a process on a remote host - the same remote-instantiation mechanism that spawns the hijacked iexplore.exe. Seen on the operator''s source host, or when this host is used to DCOM-pivot onward.'
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Sibling DCOM lateral-movement technique (MMC20.Application ExecuteShellCommand). An operator wielding the DCOM InternetExplorer hijack typically carries other DCOM LM methods; an MMC20 landing on this or an adjacent host points to the same hands-on lateral-movement campaign.
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: Another DCOM lateral-movement sibling (Excel.Application COM). Same remote-code-execution-over-DCOM family; its appearance around this alert indicates an operator probing multiple DCOM objects to move between hosts.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Expected follow-on once code runs on the freshly-landed host: the operator accesses LSASS to harvest credentials and pivot onward. LSASS access shortly after the hijack turns a single lateral-movement landing into a spreading incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Malicious iertutil.dll dropped into the Internet Explorer application directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Ii][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: iexplore.exe spawning shells / LOLBins (hijacked DLL executing code)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Inbound remote network logons to this host (lateral-movement origin)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on:
    - host
    window: 1h
  - name: Network connections by iexplore.exe (C2 / anomalous traffic from the hijacked process)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential-dumping tooling on this host (pivot-onward follow-on)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)
    pivot_on:
    - host
    window: 2h
