name: Potential Libvlc.DLL Sideloading
id: bf9808c4-d24f-44a2-8398-b65227d406b6
version: 1
schema_version: "1.0"
date: "2023-04-17"
author: X__Junior
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bf9808c4-d24f-44a2-8398-b65227d406b6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "libvlc.dll", a DLL that is legitimately
  used by "VLC.exe". MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\libvlc.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\VideoLAN\\\\VLC\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\VideoLAN\\\\VLC\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\libvlc.dll'; data_win_eventdata_imageLoaded matches 'C:\Program Files
  (x86)\VideoLAN\VLC\*'; data_win_eventdata_imageLoaded matches 'C:\Program
  Files\VideoLAN\VLC\*'.

known_false_positives: >
  False positives are expected if VLC is installed in non-default locations.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/23/c/earth-preta-updated-stealthy-strategies.html
  - https://hijacklibs.net/entries/3rd_party/vlc/libvlc.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Libvlc.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - libvlc
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ll][Ii][Bb][Vv][Ll][Cc]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Vv][Ii][Dd][Ee][Oo][Ll][Aa][Nn]\\[Vv][Ll][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Vv][Ii][Dd][Ee][Oo][Ll][Aa][Nn]\\[Vv][Ll][Cc]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
    name: Mustang Panda Dropper
    reason: 'Same actor and the stage that precedes this: Mustang Panda (aka Earth Preta) is the crew behind the VLC/libvlc sideload, and its dropper writes the signed VLC.exe + malicious libvlc.dll bundle into a user-writable path and registers a scheduled-task/wtask persistence. A hit on the same host inside the window is the delivery of this very sideload.'
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: 'This is the payload: Earth Preta sideloads libvlc.dll specifically to run a PlugX backdoor, and this rule catches a known PlugX sideload-host binary executing from an uncommon location. It is the follow-on execution the malicious libvlc.dll performs on the same host after this alert.'
  - id: 7806bb49-f653-48d3-a915-5115c1a85234
    name: Potential APT Mustang Panda Activity Against Australian Gov
    reason: 'Same actor''s hands-on-keyboard staging: it matches Mustang Panda copying a sideload DLL into C:\Users\Public\Libraries, the exact plant-DLL-next-to-a-signed-EXE move that this libvlc sideload is one instance of. Co-firing on the host confirms the same intrusion.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Same technique, broader net: it flags known-abused DLLs image-loaded from user-writable paths (PerfLogs, Users\Public, Windows\Temp). The Earth Preta bundle frequently sideloads more than libvlc, so a hit here surfaces the sibling sideloads dropped alongside it on the same host.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Same mechanism, generic hunt: it identifies DLL search-order hijack / sideload by image-load provenance. A co-fire on the host corroborates that the libvlc load is a genuine hijack rather than a mislocated VLC install, and surfaces any other hijacked DLL in the same burst.'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: 'Same drop location: Mustang Panda stages the VLC bundle under Temp / user-writable folders, so a DLL-module-loaded-from-Temp hit on the same host within the window is very likely a sibling of this libvlc sideload (the same bundle or a second-stage module).'
  - id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
    name: Third Party Software DLL Sideloading
    reason: 'Direct sibling class: a libvlc.dll sideload IS third-party-software DLL sideloading, and this rule catches the same abuse against other third-party DLLs. A co-fire means the host is running multiple sideloads, raising confidence the libvlc event is malicious rather than a tuning miss.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: VLC sideload bundle written to disk on this host (libvlc.dll / libvlccore.dll / vlc.exe drop)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ll][Ii][Bb][Vv][Ll][Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ll][Ii][Bb][Vv][Ll][Cc][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Vv][Ll][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: VLC.exe launched from a non-standard path (the sideloading host process) on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Vv][Ll][Cc]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss].*[Vv][Ii][Dd][Ee][Oo][Ll][Aa][Nn]\\[Vv][Ll][Cc]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: 'C2 beacon: network connection or DNS query initiated by VLC.exe on this host'
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Vv][Ll][Cc]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Vv][Ll][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence set after the sideload on this host (Run-key registry writes, schtasks / sc create)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other DLLs image-loaded from user-writable paths on this host (bundle siblings / second stage)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
