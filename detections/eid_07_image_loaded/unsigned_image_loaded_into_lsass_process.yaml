name: Unsigned Image Loaded Into LSASS Process
id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Teymur Kheirkhabarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Loading unsigned image (DLL, EXE) into LSASS process. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_signed:
              value: "false"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_signed
    - data_win_eventdata_imageLoaded

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\lsass.exe'; data_win_eventdata_signed equals 'false'.

known_false_positives: >
  Valid user connecting using RDP. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Unsigned Image Loaded Into LSASS Process detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_signed: $data_win_eventdata_signed$. MITRE ATT&CK:
    T1003.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_signed
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - unsigned
    - image
    - lsass
    - image_load
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: 'Enabling precondition on the same host: RunAsPPL/IsPplAutoEnabled is the LSASS Protected-Process-Light guard that blocks unsigned DLLs from loading into lsass.exe. This rule catches reg.exe/PowerShell flipping that value off - the step an attacker must take just before an unsigned module can map into LSASS, so hunt it immediately preceding this alert.'
  - id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
    name: Security Support Provider (SSP) Added to LSA Configuration
    reason: 'Root-cause precursor: writing an SSP DLL path into HKLM\...\Control\Lsa\Security Packages makes lsass.exe auto-load that DLL on reboot or AddSecurityPackage (Mimikatz misc::memssp / Empire Install-SSP). The unsigned image this rule sees inside LSASS is frequently that registered SSP; this EID 12/13 rule names the DLL and the writing process.'
  - id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
    name: Potential Persistence Via LSA Extensions
    reason: 'Root-cause precursor: the LsaExtensionConfig\LsaSrv\Extensions REG_MULTI_SZ lists DLLs lsass.exe auto-loads and calls InitializeLsaExtension() on. A custom DLL added there is loaded straight into LSASS, so this registry write is a direct cause of an unsigned-module-in-LSASS event on the same host.'
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: 'Sibling injection into the same process: EID 8 CreateRemoteThread into lsass.exe is the other principal way attacker code runs inside LSASS (WCE-style). Firing alongside this EID 7 unsigned-image load on the same host means the box is being actively injected for credential theft, not hitting a benign signed-module quirk.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Co-occurring access from the responsible process: the tool that maps a module into lsass (or reads its secrets) must open a handle to lsass.exe with inject/dump-grade GrantedAccess (e.g. 0x1010/0x1410/0x1fffff). This EID 10 rule catches that handle and names the sourceImage this image-load event cannot.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Most likely root cause on the same host: Mimikatz misc::memssp injects an unsigned SSP (mimilib) into lsass.exe - producing exactly this alert - while sekurlsa::* injects/reads LSASS to harvest credentials. A mimikatz process creation on this host within the window is the prime suspect for the unsigned module.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Follow-on artifact of the same objective: if the actor also persists LSASS memory to disk (lsass.dmp, nanodump, procdump output) for offline cracking/exfil rather than reading it live, this EID 11 rule catches the dump file written on the same host shortly after.'
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: 'Direct follow-on that consumes the stolen secrets: NTLM hashes / Kerberos keys harvested from LSASS are replayed via Mimikatz sekurlsa::pth, producing a logonType 9 (NewCredentials) seclogo logon on the same host. Hunt the host/account for it right after this alert.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Handle-open and remote-thread injection into LSASS on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS extensibility and PPL-protection registry tampering on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Nn][Oo][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ss][Aa][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Cc][Oo][Nn][Ff][Ii][Gg]\\[Ll][Ss][Aa][Ss][Rr][Vv]\\[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Credential-dumper execution and LSASS-dump command lines on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Aa][Nn][Dd][Ll][Ee][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Ss][Aa][Ff][Ee][Tt][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Mm][Ss][Ss][Pp].*/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ AND data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp].*/)))
    pivot_on:
    - host
    window: 2h
  - name: LSASS memory-dump and credential-dumper file artifacts written on this host
    query: data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/) OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Reuse of harvested credentials: overpass-the-hash and NTLM logons on this host'
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/[Ss][Ee][Cc][Ll][Oo][Gg][Oo]/) OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm].*/) OR (data_win_system_eventID:"4625" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm].*/)
    pivot_on:
    - host
    window: 6h
