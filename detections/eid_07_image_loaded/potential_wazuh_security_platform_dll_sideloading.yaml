name: Potential Wazuh Security Platform DLL Sideloading
id: db77ce78-7e28-4188-9337-cf30e2b3ba9f
version: 1
schema_version: "1.0"
date: "2023-05-12"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: db77ce78-7e28-4188-9337-cf30e2b3ba9f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL side loading of DLLs that are part of the Wazuh security
  platform. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\libwazuhshared.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\libwinpthread-1.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\AppData\\\\Local\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\ProgramData\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\mingw64\\\\bin\\\\libwinpthread-1.dll"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\libwazuhshared.dll'; data_win_eventdata_imageLoaded matches
  '*\libwinpthread-1.dll'; data_win_eventdata_imageLoaded matches 'C:\Program
  Files\*', among other conditions.

known_false_positives: >
  Many legitimate applications leverage this DLL. (Visual Studio, JetBrains,
  Ruby, Anaconda, GithubDesktop, etc.). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.trendmicro.com/en_us/research/23/c/iron-tiger-sysupdate-adds-linux-targeting.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Wazuh Security Platform DLL Sideloading detected on host
    $agent_name$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - wazuh
    - security
    - platform
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Ll][Ii][Bb][Ww][Aa][Zz][Uu][Hh][Ss][Hh][Aa][Rr][Ee][Dd]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ll][Ii][Bb][Ww][Ii][Nn][Pp][Tt][Hh][Rr][Ee][Aa][Dd]-1\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/) AND _exists_:data_win_eventdata_imageLoaded AND NOT ((data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/) AND data_win_eventdata_imageLoaded:/.*\\[Mm][Ii][Nn][Gg][Ww]64\\[Bb][Ii][Nn]\\[Ll][Ii][Bb][Ww][Ii][Nn][Pp][Tt][Hh][Rr][Ee][Aa][Dd]-1\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
    name: Potential Antivirus Software DLL Sideloading
    reason: 'Closest conceptual sibling: the same T1574.001 image-load sideload but of security-software DLLs (McAfee/Symantec/Bitdefender log.dll, etc.). Both rules catch an attacker abusing a trusted security-product binary to load an attacker-controlled DLL from a non-install path; a hit on either on the same host in the window points at one actor attacking the endpoint''s security stack.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Generic sibling of the exact technique: known-abused DLLs (coreclr/libcef/zipdll...) loaded from writable locations (Users\Public, PerfLogs, Windows\Temp, user profile). An operator staging this Wazuh/MinGW sideload typically drops a second abusable DLL beside it, so a co-hit surfaces the rest of the sideloaded module set and tips a verdict toward deliberate sideloading over this rule''s many benign libwinpthread-1 loads.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: 'Sibling for when the abused loader is a SYSTEM/trusted process - the Wazuh agent itself runs as SYSTEM: a C:\Windows\* process loading a DLL from C:\Users\Public or C:\PerfLogs. It catches sideloaded modules this rule''s two hard-coded DLL names miss and confirms an elevated process is being made to load from a world-writable path.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Broad hunt for the exact mechanism this alert is one narrow instance of - any DLL loaded from outside system32/syswow64/winsxs/wbem/Program Files. Correlating it enumerates every other search-order hijack or sideload on the host in the window, turning one DLL hit into the full campaign picture.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: 'The signature angle on the same event: a trusted Windows utility (rundll32/regsvr32/InstallUtil/RegAsm...) loading an unsigned DLL for proxy execution. This rule captures data_win_eventdata_signed precisely so the analyst can judge the load; if the sideloaded Wazuh/MinGW DLL is unsigned and pulled in by a LOLBin, this co-fires and confirms malicious proxy execution rather than a signed-vendor false positive.'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: 'Location-based sibling: a DLL loaded from %TEMP% (used by Interlock/Lokibot sideloading). This rule excludes only Program Files, so a libwazuhshared/libwinpthread-1 payload staged in Temp trips both - a co-hit confirms the module loaded from a throwaway staging dir, not an install path.'
  - id: 9aa01d62-7667-4d3b-acb8-8cb5103e2014
    name: APT27 - Emissary Panda Activity
    reason: Attribution per this rule's own reference (Trend Micro 'Iron Tiger'/SysUpdate = APT27/Emissary Panda), a crew that ships MinGW-compiled tooling and side-loads exactly these libwinpthread-1-class runtime DLLs. This EID 1 rule catches that actor's sllauncher->svchost and AppData\Roaming svchost -k launch, so a co-hit on the host attributes the sideload to an active APT27 intrusion rather than a benign MinGW app.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sideload DLL/EXE bundle dropped on this host (incl. libwazuhshared / libwinpthread-1)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ll][Ii][Bb][Ww][Aa][Zz][Uu][Hh][Ss][Hh][Aa][Rr][Ee][Dd]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ll][Ii][Bb][Ww][Ii][Nn][Pp][Tt][Hh][Rr][Ee][Aa][Dd]-1\.[Dd][Ll][Ll]/ OR (data_win_eventdata_targetFilename:/.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ AND data_win_eventdata_targetFilename:/.*\\([Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss])\\.*/))
    pivot_on:
    - host
    window: 4h
  - name: Abused host binary launched from a user-writable location on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss])\\.*/
    pivot_on:
    - host
    window: 2h
  - name: C2 beacon or DNS lookup from a process in a user-writable location on this host
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\([Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss])\\.*/
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential access or memory-dump tooling on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp])[A-Za-z0-9]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Ll][Ss][Aa][Ss][Ss]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Tampering with the Wazuh/OSSEC security agent on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Aa][Zz][Uu][Hh].*/ OR data_win_eventdata_commandLine:/.*[Oo][Ss][Ss][Ee][Cc].*/) AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/)
    pivot_on:
    - host
    window: 4h
