name: Potential RoboForm.DLL Sideloading
id: f64c9b2d-b0ad-481d-9d03-7fc75020892a
version: 1
schema_version: "1.0"
date: "2023-05-14"
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f64c9b2d-b0ad-481d-9d03-7fc75020892a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "roboform.dll", a DLL used by RoboForm
  Password Manager. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\roboform.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\roboform-x64.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: " C:\\\\Program Files (x86)\\\\Siber Systems\\\\AI RoboForm\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: " C:\\\\Program Files\\\\Siber Systems\\\\AI RoboForm\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\robotaskbaricon.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\robotaskbaricon-x64.exe"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\roboform.dll'; data_win_eventdata_imageLoaded matches '*\roboform-x64.dll';
  data_win_eventdata_image matches ' C:\Program Files (x86)\Siber Systems\AI
  RoboForm\*', among other conditions.

known_false_positives: >
  If installed on a per-user level, the path would be located in
  "AppData\Local". Add additional filters to reflect this mode of installation.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/StopMalvertisin/status/1648604148848549888
  - https://twitter.com/t3ft3lb/status/1656194831830401024
  - https://www.roboform.com/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential RoboForm.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - roboform
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Rr][Oo][Bb][Oo][Ff][Oo][Rr][Mm]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Rr][Oo][Bb][Oo][Ff][Oo][Rr][Mm]-[Xx]64\.[Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/ [Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ss][Ii][Bb][Ee][Rr] [Ss][Yy][Ss][Tt][Ee][Mm][Ss]\\[Aa][Ii] [Rr][Oo][Bb][Oo][Ff][Oo][Rr][Mm]\\.*/ OR data_win_eventdata_image:/ [Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Ii][Bb][Ee][Rr] [Ss][Yy][Ss][Tt][Ee][Mm][Ss]\\[Aa][Ii] [Rr][Oo][Bb][Oo][Ff][Oo][Rr][Mm]\\.*/) AND (data_win_eventdata_image:/.*\\[Rr][Oo][Bb][Oo][Tt][Aa][Ss][Kk][Bb][Aa][Rr][Ii][Cc][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Oo][Bb][Oo][Tt][Aa][Ss][Kk][Bb][Aa][Rr][Ii][Cc][Oo][Nn]-[Xx]64\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
    name: Third Party Software DLL Sideloading
    reason: 'Closest sibling detector: RoboForm is exactly the third-party software class this rule covers (Zoom/Discord/etc.). The malvertising kits that abuse roboform.dll rotate signed-app lures, so if a sibling third-party DLL was sideloaded on the same host it corroborates a real sideloading campaign rather than a RoboForm false positive.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Generic known-abusable-DLL sideload-from-suspicious-location detector for the same T1574.001 technique; fires on co-occurring abusable-DLL loads by the same dropper on this host, confirming the RoboForm load is part of a broader search-order-hijack campaign.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Broad hunt for DLLs loaded outside system directories; the sideloaded roboform.dll (loaded from a user-writable path, not the Siber Systems install dir) is exactly such a load, so this confirms the same event from a location angle and surfaces the vulnerable host binary's full path.
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: Malvertising RoboForm droppers commonly stage the signed EXE plus the malicious roboform.dll in %TEMP%; when they do, this fires on the same or a sibling DLL load and pinpoints the staging directory that the EID 7 alert alone does not name.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: 'Precursor: in a sideload, the signed RoboForm binary (robotaskbaricon.exe) that loads roboform.dll is launched from a non-standard, user-writable folder. This fires on that process creation and identifies the parent that spawned the sideload host and its command line.'
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: 'Follow-on: the malicious roboform.dll is a loader that beacons out; the sideloaded process running from its suspicious folder making an outbound connection trips this rule, marking the C2 / second-stage-download step of the same incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Launch provenance of the RoboForm sideload host (process creation)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Oo][Bb][Oo][Tt][Aa][Ss][Kk][Bb][Aa][Rr][Ii][Cc][Oo][Nn]\.[Ee][Xx][Ee]|\\[Rr][Oo][Bb][Oo][Tt][Aa][Ss][Kk][Bb][Aa][Rr][Ii][Cc][Oo][Nn]-[Xx]64\.[Ee][Xx][Ee]|\\[Rr][Oo][Bb][Oo][Ff][Oo][Rr][Mm]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Staging drop of roboform.dll and the signed RoboForm EXE (who wrote them)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Rr][Oo][Bb][Oo][Ff][Oo][Rr][Mm]\.[Dd][Ll][Ll]|\\[Rr][Oo][Bb][Oo][Ff][Oo][Rr][Mm]-[Xx]64\.[Dd][Ll][Ll]|\\[Rr][Oo][Bb][Oo][Tt][Aa][Ss][Kk][Bb][Aa][Rr][Ii][Cc][Oo][Nn]\.[Ee][Xx][Ee]|\\[Rr][Oo][Bb][Oo][Tt][Aa][Ss][Kk][Bb][Aa][Rr][Ii][Cc][Oo][Nn]-[Xx]64\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 6h
  - name: 'Loader C2: outbound connections and DNS from user-writable paths'
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/))
    pivot_on:
    - host
    window: 2h
  - name: 'Persistence from the loader: Run keys, Startup folder, scheduled task creation'
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn].*[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: 'Second-stage proxy execution: LOLBins/interpreters spawned from user-writable paths'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/) AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Rr][Ee][Gg][Ss][Vv][Cc][Ss]|[Rr][Ee][Gg][Aa][Ss][Mm]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
