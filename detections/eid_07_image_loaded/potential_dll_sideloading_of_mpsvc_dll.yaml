name: Potential DLL Sideloading Of MpSvc.DLL
id: 5ba243e5-8165-4cf7-8c69-e1d3669654c1
version: 1
schema_version: "1.0"
date: "2024-07-11"
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5ba243e5-8165-4cf7-8c69-e1d3669654c1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "MpSvc.dll". MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\MpSvc.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files\\\\Windows Defender\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\MpSvc.dll'; data_win_eventdata_imageLoaded matches 'C:\Program
  Files\Windows Defender\*'; data_win_eventdata_imageLoaded matches
  'C:\ProgramData\Microsoft\Windows Defender\Platform\*', among other
  conditions.

known_false_positives: >
  Legitimate applications loading their own versions of the DLL mentioned in
  this rule. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://hijacklibs.net/entries/microsoft/built-in/mpsvc.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Of MpSvc.DLL detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - mpsvc
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Mm][Pp][Ss][Vv][Cc]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 418dc89a-9808-4b87-b1d7-e5ae0cb6effc
    name: Potential Mpclient.DLL Sideloading
    reason: 'Co-occurring twin: mpclient.dll is the other sideloadable Defender DLL loaded by the same MpCmdRun/NisSrv binaries; LockBit/REvil drop it alongside MpSvc.dll, so this image-load often fires on the same host from the same staging folder.'
  - id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
    name: Potential Mpclient.DLL Sideloading Via Defender Binaries
    reason: 'Same action, process-creation view: names the signed Defender binary (MpCmdRun/NisSrv) launched from a non-default directory that performs the sideload - supplies the command line, parent process and user behind this image-load alert.'
  - id: 02b18447-ea83-4b1b-8805-714a8a34546a
    name: Potential Mpclient.DLL Sideloading Via OfflineScannerShell.EXE Execution
    reason: 'Sibling ''living off Windows Defender'' vector: OfflineScannerShell.exe run outside its Defender dir sideloads mpclient.dll the same way - a second Defender-binary sideload frequently seen in the same intrusion.'
  - id: 46123129-1024-423e-9fae-43af4a0fa9a5
    name: File Download Via Windows Defender MpCmpRun.EXE
    reason: 'Precursor: the same MpCmdRun.exe binary is abused with -DownloadFile to stage the malicious DLL/loader into a writable folder shortly before this sideload runs.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Co-occurring: catches a second abusable DLL sideloaded from the same user-writable staging directory (Public/Temp/Perflogs) used to drop the MpSvc.dll sideloading kit.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Follow-on payload: this technique is documented (SentinelOne/LockBit) to sideload Cobalt Strike, whose beacon then injects via a remote thread once the signed Defender process is hijacked.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Follow-on impact: REvil (Kaseya) and LockBit use this Defender-binary sideload to launch ransomware, which deletes volume shadow copies via vssadmin/wmic before encrypting.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Defender loader binaries executing from a non-standard path on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Mm][Ss][Mm][Pp][Ee][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Nn][Ii][Ss][Ss][Rr][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Oo][Ff][Ff][Ll][Ii][Nn][Ee][Ss][Cc][Aa][Nn][Nn][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\[Uu][Ss][Ee][Rr][Ss]\.*/ OR data_win_eventdata_image:/.*\[Tt][Ee][Mm][Pp]\.*/ OR data_win_eventdata_image:/.*\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_image:/.*\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/ OR data_win_eventdata_image:/.*\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\.*/ OR data_win_eventdata_image:/.*\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\.*/))
    pivot_on:
    - host
    window: 2h
  - name: Staging of the sideloading kit (MpSvc.dll / mpclient.dll / Defender loader EXE written to disk)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\[Mm][Pp][Ss][Vv][Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\[Mm][Pp][Cc][Ll][Ii][Ee][Nn][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\[Mm][Ss][Mm][Pp][Ee][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\[Nn][Ii][Ss][Ss][Rr][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\[Oo][Ff][Ff][Ll][Ii][Nn][Ee][Ss][Cc][Aa][Nn][Nn][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Cobalt Strike named-pipe beacons on this host
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/.*\[Mm][Ss][Ss][Ee]-.*/ OR data_win_eventdata_pipeName:/.*\[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/.*\[Ss][Tt][Aa][Tt][Uu][Ss]_.*/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS memory access / credential dumping on this host
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)))
    pivot_on:
    - host
    window: 2h
  - name: 'Ransomware endgame: shadow-copy / backup deletion and recovery tampering on this host'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_win_eventdata_image:/.*\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\[Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*[Nn][Oo].*/ OR data_win_eventdata_commandLine:/.*[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy].*[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss].*/)) OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*[Cc][Aa][Tt][Aa][Ll][Oo][Gg].*/))
    pivot_on:
    - host
    window: 6h
