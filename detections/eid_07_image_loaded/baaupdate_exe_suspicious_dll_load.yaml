name: BaaUpdate.exe Suspicious DLL Load
id: 6e8fe0a8-ba0b-4a93-8f9e-82657e7a5984
version: 1
schema_version: "1.0"
date: "2025-10-18"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6e8fe0a8-ba0b-4a93-8f9e-82657e7a5984
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects BitLocker Access Agent Update Utility (baaupdate.exe) loading DLLs
  from suspicious locations that are publicly writable which could indicate an
  attempt to lateral movement via BitLocker DCOM & COM Hijacking. This technique
  abuses COM Classes configured as INTERACTIVE USER to spawn processes in the
  context of the logged-on user's session. Specifically, it targets the
  BDEUILauncher Class (CLSID ab93b6f1-be76-4185-a488-a9001b105b94) which can
  launch BaaUpdate.exe, which is vulnerable to COM Hijacking when started with
  input parameters. This allows attackers to execute code in the user's context
  without needing to steal credentials or use additional techniques to
  compromise the account. MITRE ATT&CK: T1218, T1021.003.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\BaaUpdate.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*.dll"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Perflogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Users\\\\Default\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\Contacts\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\Favorites\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\Favourites\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\Links\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\Music\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\Pictures\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\Temporary Internet*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\Videos\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\BaaUpdate.exe'; data_win_eventdata_imageLoaded matches '*.dll';
  data_win_eventdata_imageLoaded matches '*:\Perflogs\*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/rtecCyberSec/BitlockMove
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1021/003/

response:
  message: >
    BaaUpdate.exe Suspicious DLL Load detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1218, T1021.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1021.003
  custom_tags:
    - baaupdate
    - image_load
    - sysmon
    - stealth
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Bb][Aa][Aa][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_imageLoaded:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\.*/ OR data_win_eventdata_imageLoaded:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Oo][Nn][Tt][Aa][Cc][Tt][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ff][Aa][Vv][Oo][Rr][Ii][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ff][Aa][Vv][Oo][Uu][Rr][Ii][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ll][Ii][Nn][Kk][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Uu][Ss][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ii][Cc][Tt][Uu][Rr][Ee][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt].*/ OR data_win_eventdata_imageLoaded:/.*\\[Vv][Ii][Dd][Ee][Oo][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f38c1db-e2ae-40bf-81d0-5b68f73fb512
    name: Suspicious BitLocker Access Agent Update Utility Execution
    reason: 'Same binary, process-creation half of this exact BitlockMove event: fires when BaaUpdate.exe spawns child processes. Confirms the hijacked DLL actually executed code (not merely loaded) and exposes the payload launched in the interactive user''s session on this host.'
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: 'Delivery precursor: remote DCOM process instantiation is exactly how BaaUpdate.exe is launched on this target during BitlockMove (BDEUILauncher class as INTERACTIVE USER). Catching the remote DCOM spawn identifies the source host that triggered this landing.'
  - id: windows-com-hijacking-inprocserver32-001
    name: Windows COM Hijacking InprocServer32 Modification
    reason: 'Hijack-mechanism precursor: BaaUpdate is COM-hijacked by repointing a CLSID''s InprocServer32 at an attacker DLL. This catches that registry repoint on the host - the change that makes BaaUpdate resolve and load the planted DLL this alert observed.'
  - id: 2f7979ae-f82b-45af-ac1d-2b10e93b0baa
    name: Potential DCOM InternetExplorer.Application DLL Hijack
    reason: 'Precursor of the same family: the over-the-network writable-path .dll plant a DCOM-triggered DLL hijack requires. BitlockMove stages its hijack DLL into a user-writable folder the same way before BaaUpdate loads it.'
  - id: f354eba5-623b-450f-b073-0b5b2773b6aa
    name: Potential DCOM InternetExplorer.Application DLL Hijack - Image Load
    reason: 'Closest sibling - identical detection shape: a DCOM-reachable COM host binary DLL-hijacked and caught at Sysmon EID7 image load. Co-occurrence points to the same DCOM-lateral-movement-via-DLL-hijack operator tradecraft / campaign.'
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Sibling DCOM lateral movement (T1021.003) sharing the svchost '-Embedding' COM-surrogate spawn signature BaaUpdate shows when invoked via DCOM; an operator wielding BitlockMove commonly carries other DCOM lateral-movement tools against the same hosts.
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: Sibling DCOM lateral movement via a COM object's anomalous child process - another branch of the same T1021.003 technique the same actor may use to reach this or neighbouring hosts in the window.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Likely follow-on: having landed as the interactive user, the operator dumps LSASS (comsvcs MiniDump) to harvest credentials and move onward. Expands this stealthy lateral-movement landing into a credential-access incident.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BaaUpdate.exe process tree on this host (COM-surrogate parent + spawned children)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Bb][Aa][Aa][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Bb][Aa][Aa][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Inbound network/remote-interactive logon (the DCOM lateral-movement source)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    window: 1h
  - name: Hijack DLL planted in a user/public-writable path on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\.*/ OR data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: COM CLSID hijack registry modification on this host (incl. BDEUILauncher CLSID)
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Ll][Ss][Ii][Dd].*\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_targetObject:/.*[Cc][Ll][Ss][Ii][Dd].*\\[Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_targetObject:/.*\\[Tt][Rr][Ee][Aa][Tt][Aa][Ss].*/ OR data_win_eventdata_targetObject:/.*[Aa][Bb]93[Bb]6[Ff]1-[Bb][Ee]76-4185-[Aa]488-[Aa]9001[Bb]105[Bb]94.*/)
    pivot_on:
    - host
    window: 2h
  - name: Anomalous C2 network/DNS from BaaUpdate.exe (a BitLocker utility that should never touch the network)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Bb][Aa][Aa][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Bb][Aa][Aa][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
