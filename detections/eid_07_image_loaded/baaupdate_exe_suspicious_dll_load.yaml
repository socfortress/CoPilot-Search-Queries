    BaaUpdate.exe Suspicious DLL Load detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1218, T1021.003
  risk_score: 75
  severity: high
  risk_objects:
