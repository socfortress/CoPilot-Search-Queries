name: Windows DLL Module Loaded in Temp Dir
id: windows-dll-loaded-temp-dir-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects DLL modules loaded from Temp directories via Sysmon EventID 7. 
  Loading DLLs from %TEMP% is uncommon for legitimate applications and often 
  indicates DLL side-loading, search order hijacking, or malicious payload 
  execution. Used by Interlock ransomware and Lokibot.

data_source:
  - Sysmon EventID 7

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        - wildcard:
            data_win_eventdata_imageLoaded: "*\\\\temp\\\\*.dll"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_imageLoaded: "C:\\\\Program Files*"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (Image Loaded) configured to include Temp directory 
  paths. Default Sysmon configs may exclude Temp paths due to noise. Ensure 
  Sysmon ImageLoad rules include Temp directory monitoring for DLL files.

known_false_positives: >
  Some legitimate applications may temporarily load DLLs from Temp during 
  installation or updates. Investigate the loading process and DLL signature.

references:
  - https://attack.mitre.org/techniques/T1105/
  - https://blog.sekoia.io/interlock-ransomware-evolving-under-the-radar/

response:
  message: >
    DLL loaded from Temp directory on $agent_name$. 
    DLL: $data_win_eventdata_imageLoaded$. 
    Loading process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1105
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Interlock Rat
    - Lokibot
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - dll_sideloading
    - temp_directory
    - image_loaded
    - hunting
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*temp.*\.dll/ AND NOT data_win_eventdata_imageLoaded:/.*Program Files.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
    name: Potential DLL File Download Via PowerShell Invoke-WebRequest
    reason: 'Precursor: a DLL pulled to disk via Invoke-WebRequest into a Temp path is the most direct way it ends up being loaded from Temp.'
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: 'Precursor: certutil -urlcache is a common way to stage a payload DLL in %TEMP% before a loader maps it.'
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: 'Likely launch vehicle: rundll32 executing a dropped Temp payload produces the same image load, often with a disguised extension.'
  - id: 50919691-7302-437f-8e10-1fe088afa145
    name: Regsvr32 DLL Execution With Uncommon Extension
    reason: 'Alternate launcher: regsvr32 loading a staged DLL from a user-writable path yields the Temp image-load event.'
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: 'Co-occurring: a script staged in Temp commonly drops and loads the Temp DLL (Interlock/Lokibot-style loaders).'
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: 'Follow-on: persistence for the Temp-resident payload via a scheduled task pointing at the same directory.'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Follow-on: Run-key persistence added after the payload DLL has executed from Temp.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Escalation: the rule cites Interlock ransomware; shadow copy deletion is the impact step after the loader gains execution.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files dropped into Temp as DLL/EXE before the load
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp].*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Tt][Mm][Pp])/
    pivot_on:
    - host
    window: 1h
  - name: Downloader activity that could have staged the DLL
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_image:/.*\\([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Rundll32/regsvr32 executing a DLL from Temp or user-writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/)
    pivot_on:
    - host
    window: 1h
  - name: Persistence set up pointing at Temp/AppData payload
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Rr][Ee][Gg])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND data_win_eventdata_details:/.*[Tt][Ee][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Ransomware impact: shadow copy / recovery tampering'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
