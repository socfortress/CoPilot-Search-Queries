status: experimental
type: TTP

description: >
  Detects DLL load activity of known compromised DLLs used in by the compromised
  3CXDesktopApp.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=7986BBAEE8940DA11CE089383521AB420C443AB7B15ED42AED91FD31CE833896*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=BF939C9C261D27EE7BB92325CC588624FCA75429*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=74BC2D0B6680FAA1A5A76B27E5479CBC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=11BE1803E2E307B647A8A7E02D128335C448FF741BF06BF52B332E0BBF423B03*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=20D554A80D759C50D6537DD7097FED84DD258B3E*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=82187AD3F0C6C225E2FBA0C867280CC9*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=F79C3B0ADB6EC7BCC8BC9AE955A1571AAED6755A28C8B17B1D7595EE86840952*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=894E7D4FFD764BB458809C7F0643694B036EAD30*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=11BC82A9BD8297BD0823BCE5D6202082*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=8AB3A5EAAF8C296080FADF56B265194681D7DA5DA7C02562953A4CB60E147423*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=3B3E778B647371262120A523EB873C20BB82BEAF*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=7FAEA2B01796B80D180399040BB69835*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_hashes
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_hashes matches
  '*SHA256=7986BBAEE8940DA11CE089383521AB420C443AB7B15ED42AED91FD31CE833896*';
  data_win_eventdata_hashes matches
  '*SHA1=BF939C9C261D27EE7BB92325CC588624FCA75429*'; data_win_eventdata_hashes
  matches '*MD5=74BC2D0B6680FAA1A5A76B27E5479CBC*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2021/09/27/foggyweb-targeted-nobelium-malware-leads-to-persistent-backdoor/

response:
  message: >
    Malicious DLL Load By Compromised 3CXDesktopApp detected on host
    $agent_name$. Matched data_win_eventdata_hashes:
    $data_win_eventdata_hashes$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_hashes
      type: file_hash
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - compromised
    - 3cxdesktopapp
    - image_load
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=7986[Bb][Bb][Aa][Ee][Ee]8940[Dd][Aa]11[Cc][Ee]089383521[Aa][Bb]420[Cc]443[Aa][Bb]7[Bb]15[Ee][Dd]42[Aa][Ee][Dd]91[Ff][Dd]31[Cc][Ee]833896.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=[Bb][Ff]939[Cc]9[Cc]261[Dd]27[Ee][Ee]7[Bb][Bb]92325[Cc][Cc]588624[Ff][Cc][Aa]75429.*/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=74[Bb][Cc]2[Dd]0[Bb]6680[Ff][Aa][Aa]1[Aa]5[Aa]76[Bb]27[Ee]5479[Cc][Bb][Cc].*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=11[Bb][Ee]1803[Ee]2[Ee]307[Bb]647[Aa]8[Aa]7[Ee]02[Dd]128335[Cc]448[Ff][Ff]741[Bb][Ff]06[Bb][Ff]52[Bb]332[Ee]0[Bb][Bb][Ff]423[Bb]03.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=20[Dd]554[Aa]80[Dd]759[Cc]50[Dd]6537[Dd][Dd]7097[Ff][Ee][Dd]84[Dd][Dd]258[Bb]3[Ee].*/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=82187[Aa][Dd]3[Ff]0[Cc]6[Cc]225[Ee]2[Ff][Bb][Aa]0[Cc]867280[Cc][Cc]9.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=[Ff]79[Cc]3[Bb]0[Aa][Dd][Bb]6[Ee][Cc]7[Bb][Cc][Cc]8[Bb][Cc]9[Aa][Ee]955[Aa]1571[Aa][Aa][Ee][Dd]6755[Aa]28[Cc]8[Bb]17[Bb]1[Dd]7595[Ee][Ee]86840952.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=894[Ee]7[Dd]4[Ff][Ff][Dd]764[Bb][Bb]458809[Cc]7[Ff]0643694[Bb]036[Ee][Aa][Dd]30.*/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=11[Bb][Cc]82[Aa]9[Bb][Dd]8297[Bb][Dd]0823[Bb][Cc][Ee]5[Dd]6202082.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=8[Aa][Bb]3[Aa]5[Ee][Aa][Aa][Ff]8[Cc]296080[Ff][Aa][Dd][Ff]56[Bb]265194681[Dd]7[Dd][Aa]5[Dd][Aa]7[Cc]02562953[Aa]4[Cc][Bb]60[Ee]147423.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=3[Bb]3[Ee]778[Bb]647371262120[Aa]523[Ee][Bb]873[Cc]20[Bb][Bb]82[Bb][Ee][Aa][Ff].*/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=7[Ff][Aa][Ee][Aa]2[Bb]01796[Bb]80[Dd]180399040[Bb][Bb]69835.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 93bbde78-dc86-4e73-9ffc-ff8a384ca89c
    name: Potential Compromised 3CXDesktopApp Execution
    reason: The process that loads this malicious DLL IS the trojanized 3CXDesktopApp.exe (build 18.12.x); this rule convicts that exact binary by hash/version on the same host, so a co-hit confirms the EID 7 image-load alert's parent is the compromised client rather than a benign hash collision.
  - id: 51eecf75-d069-43c7-9ea2-63f75499edd4
    name: Potential Compromised 3CXDesktopApp Beaconing Activity - Netcon
    reason: 'Direct follow-on: once the sideloaded DLL runs its embedded shellcode the client calls home. This rule catches 3CXDesktopApp.exe connecting to the campaign C2 domains (akamaicontainer.com, msstorageazure.com, pbxsources.com...) on the same host, escalating the DLL load into confirmed active command-and-control.'
  - id: bd03a0dc-5d93-49eb-b2e8-2dfd268600f8
    name: Potential Compromised 3CXDesktopApp Beaconing Activity - DNS
    reason: 'The DNS half of that same beaconing step: the host resolving the 3CX campaign C2 domains. It co-occurs with the netcon rule and is frequently the earliest network evidence that the loaded DLL has begun calling out, even before a TCP session is established.'
  - id: 63f3605b-979f-48c2-b7cc-7f90523fed88
    name: Potential Suspicious Child Process Of 3CXDesktopApp
    reason: 'Next stage after C2: the compromised 3CXDesktopApp.exe spawning cmd/powershell/rundll32/mshta on the same host. This is the hands-on-keyboard / second-stage execution that typically follows a successful malicious DLL load and beacon.'
  - id: e7581747-1e44-4d4b-85a6-0db0b4a00f2a
    name: Potential Compromised 3CXDesktopApp Update Activity
    reason: 'Precursor / delivery: the trojanized Update.exe pulling the compromised 18.12.x build that plants this very DLL. Seen on the same host (usually earlier in the window), it explains how the malicious DLL arrived and pins the compromise to the official update channel.'
  - id: 640dc51c-7713-4faa-8a0e-e7c0d9d4654c
    name: FoggyWeb Backdoor DLL Loading
    reason: 'Same detection class and this rule''s own cited reference (NOBELIUM FoggyWeb): a known-malicious DLL sideloaded into a trusted signed process via Sysmon EID 7. If the host was actually hit by FoggyWeb (AD FS version.dll) rather than 3CX, this companion rule fires - checking whether both or only one fired disambiguates which campaign is in play.'
  - id: 553d0429-1a1c-44bf-b3f5-a8513deb9ee5
    name: Hunting 3CXDesktopApp Software
    reason: 'Scoping context: confirms the 3CX client is installed/running on the alert host and lets the analyst enumerate every other endpoint running 3CXDesktopApp - the supply-chain blast radius that may load the same DLL and needs the same triage.'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Malicious payload DLL dropped into the 3CXDesktopApp directory (delivery)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ff][Ff][Mm][Pp][Ee][Gg]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Dd]3[Dd][Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]_47\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 24h
  - name: Child processes spawned by 3CXDesktopApp.exe (second-stage execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
  - name: Network connections and DNS queries made by the 3CXDesktopApp process (C2 beacon, incl. unknown infra)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 24h
  - name: Browser credential and history store access (3CX info-stealer second-stage objective)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*[Pp][Ll][Aa][Cc][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Pp][Ll][Aa][Cc][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee]/ OR data_win_eventdata_targetFilename:/.*[Cc][Oo][Oo][Kk][Ii][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee]/))
    pivot_on:
    - host
    window: 6h
