name: Malicious DLL Load By Compromised 3CXDesktopApp
id: d0b65ad3-e945-435e-a7a9-438e62dd48e9
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d0b65ad3-e945-435e-a7a9-438e62dd48e9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DLL load activity of known compromised DLLs used in by the compromised
  3CXDesktopApp.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=7986BBAEE8940DA11CE089383521AB420C443AB7B15ED42AED91FD31CE833896*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=BF939C9C261D27EE7BB92325CC588624FCA75429*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=74BC2D0B6680FAA1A5A76B27E5479CBC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=11BE1803E2E307B647A8A7E02D128335C448FF741BF06BF52B332E0BBF423B03*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=20D554A80D759C50D6537DD7097FED84DD258B3E*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=82187AD3F0C6C225E2FBA0C867280CC9*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=F79C3B0ADB6EC7BCC8BC9AE955A1571AAED6755A28C8B17B1D7595EE86840952*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=894E7D4FFD764BB458809C7F0643694B036EAD30*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=11BC82A9BD8297BD0823BCE5D6202082*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=8AB3A5EAAF8C296080FADF56B265194681D7DA5DA7C02562953A4CB60E147423*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=3B3E778B647371262120A523EB873C20BB82BEAF*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=7FAEA2B01796B80D180399040BB69835*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_hashes
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_hashes matches
  '*SHA256=7986BBAEE8940DA11CE089383521AB420C443AB7B15ED42AED91FD31CE833896*';
  data_win_eventdata_hashes matches
  '*SHA1=BF939C9C261D27EE7BB92325CC588624FCA75429*'; data_win_eventdata_hashes
  matches '*MD5=74BC2D0B6680FAA1A5A76B27E5479CBC*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2021/09/27/foggyweb-targeted-nobelium-malware-leads-to-persistent-backdoor/

response:
  message: >
    Malicious DLL Load By Compromised 3CXDesktopApp detected on host
    $agent_name$. Matched data_win_eventdata_hashes:
    $data_win_eventdata_hashes$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_hashes
      type: file_hash
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - compromised
    - 3cxdesktopapp
    - image_load
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

