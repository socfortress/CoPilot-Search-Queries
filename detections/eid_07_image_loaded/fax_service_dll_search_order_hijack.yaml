name: Fax Service DLL Search Order Hijack
id: 828af599-4c53-4ed2-ba4a-a9f835c434ea
version: 1
schema_version: "1.0"
date: "2022-06-02"
author: NVISO
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 828af599-4c53-4ed2-ba4a-a9f835c434ea
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The Fax service attempts to load ualapi.dll, which is non-existent. An
  attacker can then (side)load their own malicious DLL using this service. MITRE
  ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\fxssvc.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*ualapi.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\Windows\\\\WinSxS\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\fxssvc.exe'; data_win_eventdata_imageLoaded matches '*ualapi.dll';
  data_win_eventdata_imageLoaded matches 'C:\Windows\WinSxS\*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://windows-internals.com/faxing-your-way-to-system/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Fax Service DLL Search Order Hijack detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - service
    - search
    - order
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ff][Xx][Ss][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*[Uu][Aa][Ll][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: 'Same phantom-DLL technique generalized: a process loading a non-existent system DLL from a system folder. ualapi.dll is exactly this class, so a hit on the same host means the actor is systematically abusing missing-DLL loads, not only the Fax service.'
  - id: 9e3357ba-09d4-4fbd-a7c5-ad6386314513
    name: Change the Fax Dll
    reason: 'Same Fax service, sibling persistence: rewrites the Fax service''s DLL registry value so a chosen module loads on service restart - the registry-based twin of this phantom ualapi.dll sideload; either path yields the same SYSTEM execution.'
  - id: e3fdf743-f05b-4051-990a-b66919be1743
    name: Change User Account Associated with the FAX Service
    reason: 'Same Fax-service abuse chain: changing the Fax service''s logon account is the documented companion step (windows-internals.com ''Faxing your way to SYSTEM'') that makes this exact privilege-escalation reliable.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: 'Complementary sink for the same attack: catches a System32 process such as fxssvc.exe loading the planted DLL from a world-writable path (C:\Users\Public, C:\PerfLogs) when it was not dropped into System32 itself.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Broad EventID-7 hijack hunt on the same host: surfaces any other DLL loaded from a non-standard directory, expanding this single Fax hit into the full set of sideloads in the intrusion.'
  - id: 612e47e9-8a59-43a6-b404-f48683f45bd6
    name: ServiceDll Hijack
    reason: 'Same objective by another mechanism: rewriting a service''s ServiceDLL registry value to run attacker code as SYSTEM. Check whether the actor also hijacked other services'' DLLs for persistence alongside Fax.'
  - id: 602a1f13-c640-4d73-b053-be9a2fa58b96
    name: HackTool - Powerup Write Hijack DLL
    reason: PowerUp is the classic privilege-escalation tool that enumerates and weaponizes writable-path/service DLL hijacks; its debug.bat artifact on the same host would explain how the actor discovered and armed this Fax hijack.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Phantom service DLL planted into System32 (the precursor drop)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Uu][Aa][Ll][Aa][Pp][Ii]|[Ww][Ll][Bb][Ss][Cc][Tt][Rr][Ll]|[Tt][Ss][Mm][Ss][Ii][Ss][Rr][Vv]|[Tt][Ss][Vv][Ii][Pp][Ss][Rr][Vv]|[Ww][Pp][Tt][Ss][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss])\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 24h
  - name: Fax service spawning child processes (the implant executing as SYSTEM)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ff][Xx][Ss][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Network connections originating from the Fax service (C2 from SYSTEM)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ff][Xx][Ss][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: LSASS access / credential dumping after privesc to SYSTEM
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss]\.[Dd][Mm][Pp])/)
    pivot_on:
    - host
    window: 2h
  - name: Other phantom service DLLs loaded outside WinSxS (sibling service hijacks)
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*([Ww][Ll][Bb][Ss][Cc][Tt][Rr][Ll]|[Tt][Ss][Mm][Ss][Ii][Ss][Rr][Vv]|[Tt][Ss][Vv][Ii][Pp][Ss][Rr][Vv]|[Ww][Pp][Tt][Ss][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss])\.[Dd][Ll][Ll]/ AND NOT data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/
    pivot_on:
    - host
    window: 6h
