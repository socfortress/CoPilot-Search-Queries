name: DLL Names Used By SVR For GraphicalProton Backdoor
id: e64c8ef3-9f98-40c8-b71e-96110991cb4c
version: 1
schema_version: "1.0"
date: "2023-12-18"
author: CISA
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e64c8ef3-9f98-40c8-b71e-96110991cb4c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Hunts known SVR-specific DLL names. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\AclNumsInvertHost.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\AddressResourcesSpec.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\BlendMonitorStringBuild.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ChildPaletteConnected.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\DeregisterSeekUsers.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\HandleFrequencyAll.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\HardSwapColor.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\LengthInMemoryActivate.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ModeBitmapNumericAnimate.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ModeFolderSignMove.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ParametersNamesPopup.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\PerformanceCaptionApi.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\ScrollbarHandleGet.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\UnregisterAncestorAppendAuto.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\WowIcmpRemoveReg.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\AclNumsInvertHost.dll'; data_win_eventdata_imageLoaded matches
  '*\AddressResourcesSpec.dll'; data_win_eventdata_imageLoaded matches
  '*\BlendMonitorStringBuild.dll', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    DLL Names Used By SVR For GraphicalProton Backdoor detected on host
    $agent_name$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - names
    - graphicalproton
    - backdoor
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Aa][Cc][Ll][Nn][Uu][Mm][Ss][Ii][Nn][Vv][Ee][Rr][Tt][Hh][Oo][Ss][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Dd][Dd][Rr][Ee][Ss][Ss][Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Ss][Ss][Pp][Ee][Cc]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Bb][Ll][Ee][Nn][Dd][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ss][Tt][Rr][Ii][Nn][Gg][Bb][Uu][Ii][Ll][Dd]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Hh][Ii][Ll][Dd][Pp][Aa][Ll][Ee][Tt][Tt][Ee][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ee][Dd]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Dd][Ee][Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr][Ss][Ee][Ee][Kk][Uu][Ss][Ee][Rr][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Hh][Aa][Nn][Dd][Ll][Ee][Ff][Rr][Ee][Qq][Uu][Ee][Nn][Cc][Yy][Aa][Ll][Ll]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Hh][Aa][Rr][Dd][Ss][Ww][Aa][Pp][Cc][Oo][Ll][Oo][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ll][Ee][Nn][Gg][Tt][Hh][Ii][Nn][Mm][Ee][Mm][Oo][Rr][Yy][Aa][Cc][Tt][Ii][Vv][Aa][Tt][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Oo][Dd][Ee][Bb][Ii][Tt][Mm][Aa][Pp][Nn][Uu][Mm][Ee][Rr][Ii][Cc][Aa][Nn][Ii][Mm][Aa][Tt][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Mm][Oo][Dd][Ee][Ff][Oo][Ll][Dd][Ee][Rr][Ss][Ii][Gg][Nn][Mm][Oo][Vv][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss][Nn][Aa][Mm][Ee][Ss][Pp][Oo][Pp][Uu][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Oo][Rr][Mm][Aa][Nn][Cc][Ee][Cc][Aa][Pp][Tt][Ii][Oo][Nn][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ss][Cc][Rr][Oo][Ll][Ll][Bb][Aa][Rr][Hh][Aa][Nn][Dd][Ll][Ee][Gg][Ee][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Nn][Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr][Aa][Nn][Cc][Ee][Ss][Tt][Oo][Rr][Aa][Pp][Pp][Ee][Nn][Dd][Aa][Uu][Tt][Oo]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Oo][Ww][Ii][Cc][Mm][Pp][Rr][Ee][Mm][Oo][Vv][Ee][Rr][Ee][Gg]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-graphicalproton-loaded-modules-001
    name: Windows Known GraphicalProton Loaded Modules
    reason: Same GraphicalProton implant, additional known module names via Sysmon EID 7 (CISA AA23-347A). A second implant DLL loading on this host confirms a resident SVR backdoor rather than one stray name match.
  - id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
    name: Suspicious Dropbox API Usage
    reason: GraphicalProton's documented dead-drop C2 is the Dropbox API; a non-Dropbox process on this host reaching that API right after the load is live command-and-control from the implant.
  - id: 8fa65166-f463-4fd2-ad4f-1436133c52e1
    name: Scheduled Tasks Names Used By SVR For GraphicalProton Backdoor
    reason: The same SVR backdoor installs persistence under known scheduled-task names; a match on this host shows the implant secured reboot survival (follow-on persistence).
  - id: 2bfc1373-0220-4fbd-8b10-33ddafd2a142
    name: Scheduled Tasks Names Used By SVR For GraphicalProton Backdoor - Task Scheduler
    reason: Same SVR GraphicalProton task-name persistence read from the Task Scheduler Operational log — catches the install when Security 4698 task-creation auditing is off.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Generic form of GraphicalProton's own loading technique (T1574.001 side-load from a suspicious path); surfaces the signed host binary that loaded the implant DLL.
  - id: 1908fcc1-1b92-4272-8214-0fbaf2fa5163
    name: Malicious DLL File Dropped in the Teams or OneDrive Folder
    reason: The DLL drop that precedes a side-load; OneDrive/Teams folders are a GraphicalProton staging surface, so this can catch the implant being written moments before it loads (precursor).
  - id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
    name: ADFS Database Named Pipe Connection By Uncommon Tool
    reason: 'APT29''s signature objective after a foothold: reading the AD FS configuration database to steal the SAML token-signing key (Golden SAML). High-value next step on a domain-joined host.'
  - id: 0a1255c5-d732-4b62-ac02-b5152d34fb83
    name: ADExplorer Writing Complete AD Snapshot Into .dat File
    reason: APT29 uses ADExplorer to snapshot the whole directory for offline recon / BloodHound; a likely discovery-and-collection step once the implant is running on a domain host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cloud dead-drop C2 beaconing to Dropbox/OneDrive/Graph/pCloud (network + DNS)
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:/.*[Dd][Rr][Oo][Pp][Bb][Oo][Xx].*/ OR data_win_eventdata_destinationHostname:/.*[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee].*/ OR data_win_eventdata_destinationHostname:/.*1[Dd][Rr][Vv]\.[Mm][Ss].*/ OR data_win_eventdata_destinationHostname:/.*[Pp][Cc][Ll][Oo][Uu][Dd].*/ OR data_win_eventdata_destinationHostname:/.*[Gg][Rr][Aa][Pp][Hh]\.[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Cc][Oo][Mm].*/)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Dd][Rr][Oo][Pp][Bb][Oo][Xx].*/ OR data_win_eventdata_queryName:/.*[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee].*/ OR data_win_eventdata_queryName:/.*1[Dd][Rr][Vv]\.[Mm][Ss].*/ OR data_win_eventdata_queryName:/.*[Pp][Cc][Ll][Oo][Uu][Dd].*/ OR data_win_eventdata_queryName:/.*[Gg][Rr][Aa][Pp][Hh]\.[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Cc][Oo][Mm].*/))
    pivot_on:
    - host
    window: 4h
  - name: Backdoor DLL drop and side-load host execution from user-writable paths
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.[Dd][Ll][Ll]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: 'Credential access: LSASS dump, NTDS.dit and registry-hive theft'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Active Directory and domain reconnaissance via built-in / dual-use tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Dd][Ss][Gg][Ee][Tt]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee]|[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt].*[Gg][Rr][Oo][Uu][Pp].*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt].*[Uu][Ss][Ee][Rr].*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][DdUuGgCc].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: Lateral movement via remote-execution tooling (PsExec/WMI/WinRM)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Aa]?[Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee]:.*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Mm][Ii][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/)
    pivot_on:
    - host
    window: 6h
