name: Potential Rcdll.DLL Sideloading
id: 6e78b74f-c762-4800-82ad-f66787f10c8a
version: 1
schema_version: "1.0"
date: "2023-03-15"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6e78b74f-c762-4800-82ad-f66787f10c8a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of rcdll.dll. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\rcdll.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\Microsoft Visual Studio\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "C:\\\\Program Files (x86)\\\\Windows Kits\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\rcdll.dll'; data_win_eventdata_imageLoaded matches 'C:\Program Files
  (x86)\Microsoft Visual Studio\*'; data_win_eventdata_imageLoaded matches
  'C:\Program Files (x86)\Windows Kits\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/23/c/iron-tiger-sysupdate-adds-linux-targeting.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Rcdll.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - rcdll
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Rr][Cc][Dd][Ll][Ll]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ii][Ss][Uu][Aa][Ll] [Ss][Tt][Uu][Dd][Ii][Oo]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Kk][Ii][Tt][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Same EID 7 sensor but name-agnostic: it flags any DLL loaded from outside system32/syswow64/winsxs/wbem/Program Files. The malicious rcdll.dll here loads from the attacker''s writable staging directory, and this rule only whitelists the two legitimate Program Files (x86) build paths, so this generic hunt co-fires on the exact same image-load event and additionally surfaces any sibling hijacked DLLs that the rcdll-only signature misses.'
  - id: 9aa01d62-7667-4d3b-acb8-8cb5103e2014
    name: APT27 - Emissary Panda Activity
    reason: 'Same intrusion set: rcdll.dll side-loading is the loader stage of SysUpdate, a backdoor attributed to Iron Tiger / APT27 (Emissary Panda) in this rule''s own Trend Micro reference. This rule catches the same actor''s other hallmark sideload (sllauncher / AppData launching a masqueraded svchost -k). A co-fire on the host attributes this rcdll load to an active Emissary Panda operation rather than a stray resource-compiler invocation.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Sibling sideload from the same operator tradecraft: this EID 7 rule catches known-abused DLLs (coreclr/libcef/ZIPDLL/facesdk/HPCustPartUI) loaded specifically from user-writable paths (Public, Perflogs, Windows\Temp, user profile). rcdll is not in its five-name list so it is not the same event, but a second abusable module dropped beside rc.exe+rcdll.dll in the same staging directory would trip it, corroborating a multi-bundle sideload on the host.'
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Credential-access follow-on: once the SysUpdate loader executes, Iron Tiger''s objective turns to credential theft. An unsigned module loaded into lsass.exe (same EID 7 sensor) on this host within the window is the backdoor reaching into LSASS to harvest secrets after the sideload established code execution.'
  - id: 26481afe-db26-4228-b264-25a29fe6efc7
    name: Uncommon Service Installation Image Path
    reason: 'Persistence follow-on: SysUpdate commonly registers itself as a Windows service to survive reboot. This rule fires on a 7045 service install whose ImagePath points at a user-writable / uncommon location (Users\Public, Windows\Temp, encoded PowerShell). A service pointing back at the sideloaded loader''s staging directory is how this rcdll bundle is made persistent.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rcdll.dll / rc.exe sideload bundle written to disk (the plant)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Rr][Cc][Dd][Ll][Ll]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Rr][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Resource Compiler (rc.exe) executed from a user-writable or non-standard location
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: C2 network connection or DNS query from a process running out of a user-writable location
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Service, scheduled task, or Run-key persistence wired on this host
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|[Cc][Oo][Nn][Ff][Ii][Gg]|[Bb][Ii][Nn][Pp][Aa][Tt][Hh]).*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/))) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\([Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll]).*/))
    pivot_on:
    - host
    window: 6h
  - name: LSASS credential access or memory dump on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1[Ff][0-9A-Fa-f][Ff][Ff][Ff]/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]1010/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Mm][Dd][Mm][Pp])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 2h
