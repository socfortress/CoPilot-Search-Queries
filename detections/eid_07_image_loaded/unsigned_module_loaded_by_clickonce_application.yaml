name: Unsigned Module Loaded by ClickOnce Application
id: 060d5ad4-3153-47bb-8382-43e5e29eda92
version: 1
schema_version: "1.0"
date: "2023-06-08"
author: "@SerkinValery"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 060d5ad4-3153-47bb-8382-43e5e29eda92
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects unsigned module load by ClickOnce application. MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\AppData\\\\Local\\\\Apps\\\\2.0\\\\*"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_signed:
                    value: "false"
                    case_insensitive: true
              - term:
                  data_win_eventdata_signatureStatus:
                    value: "Expired"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_signed
    - data_win_eventdata_signatureStatus
    - data_win_eventdata_imageLoaded

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\AppData\Local\Apps\2.0\*'; data_win_eventdata_signed equals 'false';
  data_win_eventdata_signatureStatus equals 'Expired'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Unsigned Module Loaded by ClickOnce Application detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_signed: $data_win_eventdata_signed$. MITRE
    ATT&CK: T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_signed
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - unsigned
    - module
    - clickonce
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Aa][Pp][Pp][Ss]\\2\.0\\.*/ AND (data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/ OR data_win_eventdata_signatureStatus:/[Ee][Xx][Pp][Ii][Rr][Ee][Dd]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 67bc0e75-c0a9-4cfc-8754-84a505b63c04
    name: Potentially Suspicious Child Process Of ClickOnce Application
    reason: 'Direct follow-on: once the unsigned module from the ClickOnce cache (AppData\Local\Apps\2.0) executes, it typically spawns cmd/powershell/mshta/rundll32 from the same ClickOnce parent.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Same technique family: a trusted binary loading a planted DLL from a user-writable path; confirms DLL sideloading/hijack beyond the ClickOnce cache.'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: 'Co-occurring image-load anomaly: the payload or its loader may also inject/load modules into system processes from user-writable directories.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ClickOnce deployment host process (dfsvc/dfshim) launching or fetching an application
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ff][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Dd][Ff][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Dd][Ff][Ss][Hh][Ii][Mm]|\.[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]|\.[Aa][Pp][Pp][Rr][Ee][Ff]-[Mm][Ss]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Processes spawned from the ClickOnce app cache
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Aa][Pp][Pp][Ss]\\2\.0\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Network connections or DNS from ClickOnce-cached binaries
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Aa][Pp][Pp][Ss]\\2\.0\\.*/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Aa][Pp][Pp][Ss]\\2\.0\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Files and persistence written by ClickOnce-cached processes
    query: (data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Aa][Pp][Pp][Ss]\\2\.0\\.*/) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Aa][Pp][Pp][Ss]\\2\.0\\.*/)
    pivot_on:
    - host
    window: 4h
