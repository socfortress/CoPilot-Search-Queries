name: Potential DLL Sideloading Of KeyScramblerIE.DLL Via KeyScrambler.EXE
id: d2451be2-b582-4e15-8701-4196ac180260
version: 1
schema_version: "1.0"
date: "2024-04-15"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d2451be2-b582-4e15-8701-4196ac180260
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL side loading of "KeyScramblerIE.dll" by
  "KeyScrambler.exe". Various threat actors and malware have been found side
  loading a masqueraded "KeyScramblerIE.dll" through "KeyScrambler.exe". MITRE
  ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\KeyScrambler.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\KeyScramblerLogon.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\KeyScramblerIE.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - exists:
            field: "data_win_eventdata_signature"
        - exists:
            field: "data_win_eventdata_signatureStatus"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*C:\\\\Program Files (x86)\\\\KeyScrambler\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*C:\\\\Program Files\\\\KeyScrambler\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "*C:\\\\Program Files (x86)\\\\KeyScrambler\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "*C:\\\\Program Files\\\\KeyScrambler\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_signature:
                                value: "QFX Software Corporation"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_signatureStatus:
                                value: "Valid"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signature
    - data_win_eventdata_signatureStatus
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\KeyScrambler.exe'; data_win_eventdata_image matches
  '*\KeyScramblerLogon.exe'; data_win_eventdata_imageLoaded matches
  '*\KeyScramblerIE.dll', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thehackernews.com/2024/03/two-chinese-apt-groups-ramp-up-cyber.html
  - https://csirt-cti.net/2024/02/01/stately-taurus-continued-new-information-on-cyberespionage-attacks-against-myanmar-military-junta/
  - https://bazaar.abuse.ch/sample/5cb9876681f78d3ee8a01a5aaa5d38b05ec81edc48b09e3865b75c49a2187831/
  - https://twitter.com/Max_Mal_/status/1775222576639291859
  - https://twitter.com/DTCERT/status/1712785426895839339
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Of KeyScramblerIE.DLL Via KeyScrambler.EXE
    detected on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_imageLoaded:
    $data_win_eventdata_imageLoaded$. MITRE ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - keyscramblerie
    - keyscrambler
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_imageLoaded:/.*\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr][Ii][Ee]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND _exists_:data_win_eventdata_signature AND _exists_:data_win_eventdata_signatureStatus AND NOT (((data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\\.*/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\\.*/) AND (data_win_eventdata_imageLoaded:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\\.*/ OR data_win_eventdata_imageLoaded:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\\.*/)) OR (data_win_eventdata_signature:/[Qq][Ff][Xx] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee] [Cc][Oo][Rr][Pp][Oo][Rr][Aa][Tt][Ii][Oo][Nn]/ AND data_win_eventdata_signatureStatus:/[Vv][Aa][Ll][Ii][Dd]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: PlugX is the RAT this KeyScrambler loader delivers; it continues the same T1574.001 sideload-from-uncommon-location on the host using its own carrier (cammute.exe), so this firing shortly after is the payload stage of the same chain.
  - id: 9aa01d62-7667-4d3b-acb8-8cb5103e2014
    name: APT27 - Emissary Panda Activity
    reason: APT27/Emissary Panda is a documented abuser of KeyScrambler sideloading (this rule's own DTCERT reference); it detects the PlugX svchost.exe -k launched from AppData\Roaming or via sllauncher.exe that the sideloaded DLL leads to.
  - id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
    name: Mustang Panda Dropper
    reason: Mustang Panda / Stately Taurus is the actor behind this KeyScrambler campaign (the 2024 references); this catches its dropper's scheduled-task persistence (Temp\wtask.exe /create, env-var %windir:~% obfuscation) that accompanies the sideload on the same host.
  - id: 7806bb49-f653-48d3-a915-5115c1a85234
    name: Potential APT Mustang Panda Activity Against Australian Gov
    reason: Same actor staging a sibling DLL sideload (SolidPDFCreator.dll copied into C:\Users\Public\Libraries); the drop-to-public-path plus legit-EXE-and-malicious-DLL pattern is exactly what this KeyScrambler alert is one instance of.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Broad EID7 search-order-hijack hunt that fires on the very same event: KeyScramblerIE.dll loaded from a non-Program-Files, user-writable path (Users/AppData/ProgramData/Public/Temp) is precisely what it flags, corroborating the sideload from a second detector.'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: This campaign commonly extracts the legit EXE and malicious DLL to a Temp directory before running; if KeyScramblerIE.dll (or the payload's next DLL) loads from temp, this co-fires and pins the drop/staging location.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: KeyScrambler tool-set process launch (delivery vector & parent) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Drop of KeyScrambler EXE/DLL (who wrote it, from where) on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr][Ii][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Payload's next DLL sideload from user-writable paths on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\[Uu][Ss][Ee][Rr][Ss]\.*/ OR data_win_eventdata_imageLoaded:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_imageLoaded:/.*\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_imageLoaded:/.*\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/ OR data_win_eventdata_imageLoaded:/.*\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Tt][Ee][Mm][Pp]\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound C2 from the tool-set or binaries running from user-writable paths on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr].*/ OR data_win_eventdata_image:/.*\[Uu][Ss][Ee][Rr][Ss]\.*/ OR data_win_eventdata_image:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_image:/.*\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_image:/.*\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence written (Run/RunOnce/Services) on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.*/)
    pivot_on:
    - host
    window: 4h
