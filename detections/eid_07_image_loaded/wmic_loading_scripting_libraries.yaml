name: WMIC Loading Scripting Libraries
id: 06ce37c2-61ab-4f05-9ff5-b1a96d18ae32
version: 1
schema_version: "1.0"
date: "2022-10-13"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 06ce37c2-61ab-4f05-9ff5-b1a96d18ae32
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects threat actors proxy executing code and bypassing application controls
  by leveraging wmic and the `/FORMAT` argument switch to download and execute
  an XSL file (i.e js, vbs, etc). It could be an indicator of SquiblyTwo
  technique, which uses Windows Management Instrumentation (WMI) to execute
  malicious code. MITRE ATT&CK: T1220.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\wmic.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\jscript.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\vbscript.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\wmic.exe'; data_win_eventdata_imageLoaded matches '*\jscript.dll';
  data_win_eventdata_imageLoaded matches '*\vbscript.dll'.

known_false_positives: >
  The command wmic os get lastbootuptime loads vbscript.dll. The command wmic os
  get locale loads vbscript.dll. Since the ImageLoad event doesn't have enough
  information in this case. It's better to look at the recent process creation
  events that spawned the WMIC process and investigate the command line and
  parent/child processes to get more insights. The command `wmic ntevent` loads
  vbscript.dll. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securitydatasets.com/notebooks/atomic/windows/defense_evasion/SDWIN-201017061100.html
  - https://twitter.com/dez_/status/986614411711442944
  - https://lolbas-project.github.io/lolbas/Binaries/Wmic/
  - https://attack.mitre.org/techniques/T1220/

response:
  message: >
    WMIC Loading Scripting Libraries detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1220
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1220
  custom_tags:
    - loading
    - scripting
    - libraries
    - image_load
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Jj][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8d63dadf-b91b-4187-87b6-34a1114577ea
    name: Potential Remote SquiblyTwo Technique Execution
    reason: 'The process-creation view of the same SquiblyTwo trick: wmic /format pointing at a remote XSL is what makes wmic.exe load jscript.dll/vbscript.dll, so it supplies the URL and command line this image-load lacks.'
  - id: 526be59f-a573-4eea-b5f7-f0973207634d
    name: Process Creation Attempt via Wmic.EXE
    reason: wmic 'process call create' is the usual way a wmic-hosted script payload goes on to launch a child, and it co-occurs with the script engine load.
  - id: 3c89a1e8-0fba-449e-8f1b-8409d6267ec8
    name: Suspicious Process Created Via Wmic.EXE
    reason: If the XSL script payload spawns a suspicious child through wmic, this fires right after the script library load and confirms execution.
  - id: 75d0a94e-6252-448d-a7be-d953dff527bb
    name: Remote XSL Execution Via Msxsl.EXE
    reason: Sibling XSL script-proxy technique using the same jscript/vbscript-in-XSL payload; attackers swap between wmic /format and msxsl on the same host.
  - id: e1693bc8-7168-4eab-8718-cdcaa68a1738
    name: Suspicious WMIC Execution Via Office Process
    reason: 'Common precursor: a macro document spawns wmic /format to run the XSL payload, explaining why wmic loaded script engines.'
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: Also makes wmic load VBScript/JScript engines, and is the persistence follow-on when the operator turns scripted WMI execution into a durable event consumer.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Co-occurring script-host abuse: the same actor often chains wscript/cscript staging with wmic script execution.'
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: 'WMI-hosted execution follow-on: script payloads delivered via WMI frequently surface as unusual children of WmiPrvSE.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wmic.exe command line using /format with XSL or remote URL (SquiblyTwo)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*\/format* OR data_win_eventdata_commandLine:*\-format* OR data_win_eventdata_commandLine:*.xsl* OR data_win_eventdata_commandLine:*http\:* OR data_win_eventdata_commandLine:*https\:*)
    pivot_on:
    - host
    window: 1h
  - name: 'Parent of wmic.exe: Office, script host, or shell launching it'
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Network connections or DNS lookups made by wmic.exe (XSL fetch)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by wmic.exe after script load
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: XSL or script payload files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Xx][Ss][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ss][Ll][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ss][Ff]/)
    pivot_on:
    - host
    window: 4h
