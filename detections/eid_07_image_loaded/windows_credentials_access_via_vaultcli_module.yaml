name: Windows Credentials Access Via Vaultcli Module
id: windows-credentials-access-vaultcli-module-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects processes loading vaultcli.dll from suspicious locations such as
  Temp, Public, PerfLogs, or Windows fonts directories. Adversaries abuse the
  Windows Vault credential API by loading vaultcli.dll from non-standard paths
  to access stored credentials, including Windows credentials stored in the
  Credential Manager.

data_source:
  - Sysmon EventID 7

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        - wildcard:
            data_win_eventdata_imageLoaded: "*\\\\vaultcli.dll"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\Temp\\\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\\\Public\\\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\\\PerfLogs\\\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\\\windows\\\\temp\\\\*"
              - wildcard:
                  data_win_eventdata_image: "*\\\\windows\\\\fonts\\\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon
  installed and configured to log image load events (EventID 7). Ensure the
  Sysmon configuration includes monitoring of DLL loads for vaultcli.dll.

known_false_positives: >
  Legitimate software loaded from standard system paths will not trigger this
  detection. Loading vaultcli.dll from user-writable directories is highly
  suspicious.

references:
  - https://attack.mitre.org/techniques/T1555/004/

response:
  message: >
    vaultcli.dll loaded from suspicious path on $agent_name$.
    Image: $data_win_eventdata_image$.
    DLL: $data_win_eventdata_imageLoaded$.
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1555.004
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Windows Credential Access
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1555.004
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*vaultcli\.dll/ AND (data_win_eventdata_image:/.*Temp.*/ OR data_win_eventdata_image:/.*Public.*/ OR data_win_eventdata_image:/.*PerfLogs.*/ OR data_win_eventdata_image:/.*windows.*temp.*/ OR data_win_eventdata_image:/.*windows.*fonts.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Same staging pattern: a binary running from Temp/Public/PerfLogs loading system DLLs; a dropped implant in a user-writable path is the likely loader of vaultcli.dll'
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: Image-load telemetry from the same writable directories; confirms the process loading vaultcli.dll is a staged or masquerading binary
  - id: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
    name: CredUI.DLL Loaded By Uncommon Process
    reason: Sibling credential-API DLL (credui) loaded by a non-UI process; stealers commonly load credui and vaultcli together to harvest saved credentials
  - id: e6c7ab7c-c79d-4b84-b913-b2ec3f8e8a98
    name: Katz Stealer DLL Loaded
    reason: Infostealer family that harvests browser and Windows vault credentials; direct co-occurring stealer image-load
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: 'Precursor: attackers enumerate Credential Manager entries with cmdkey /list before or alongside reading the vault through vaultcli'
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: 'Follow-on: Vault/Credential Manager blobs are DPAPI-protected, and SharpDPAPI (credentials/vaults/masterkeys) is the common decryption tool'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz vault::list / vault::cred and sekurlsa expand vault access into full credential theft
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Escalation: after vault harvesting from a staged binary, the same actor typically moves to LSASS memory access for domain credentials'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other credential DLLs loaded by the same staged process
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*[Cc][Rr][Ee][Dd][Uu][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Dd][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Cc][Rr][Yy][Pp][Tt][Nn][Cc][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ww][Ii][Nn][Cc][Rr][Ee][Dd]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ss][Aa][Mm][Ll][Ii][Bb]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ss][Aa][Mm][Cc][Ll][Ii]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_image:/.*[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_image:/.*[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_image:/.*[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss].*/ OR data_win_eventdata_image:/.*[Ff][Oo][Nn][Tt][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Process creation of the loading binary and its parent chain
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Credential Manager / vault enumeration and DPAPI tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd][Kk][Ee][Yy].*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt]::.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks using Windows.Security.Credentials PasswordVault
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*PasswordVault* OR data_win_eventdata_scriptBlockText:*RetrievePassword* OR data_win_eventdata_scriptBlockText:*VaultEnumerateItems* OR data_win_eventdata_scriptBlockText:*vaultcli* OR data_win_eventdata_scriptBlockText:*CredEnumerate*)
    pivot_on:
    - host
    window: 2h
  - name: Staged binary network activity after vault access (exfil / C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
