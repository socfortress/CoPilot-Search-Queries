name: Suspicious Volume Shadow Copy Vssapi.dll Load
id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
version: 1
schema_version: "1.0"
date: "2026-05-18"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the image load of VSS DLL by uncommon executables. MITRE ATT&CK:
  T1490.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\vssapi.dll"
              case_insensitive: true
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\explorer.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\Temp\\\\{*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\$WinREAgent\\\\Scratch\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\ProgramData\\\\Package Cache\\\\*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\temp\\\\is-*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\avira_system_speedup.tmp*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\vssapi.dll'; data_win_eventdata_image equals 'C:\Windows\explorer.exe';
  data_win_eventdata_image equals
  'C:\Windows\ImmersiveControlPanel\SystemSettings.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/ORCx41/DeleteShadowCopies
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Suspicious Volume Shadow Copy Vssapi.dll Load detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1490
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - volume
    - shadow
    - vssapi
    - image_load
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Vv][Ss][Ss][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Mm][Mm][Ee][Rr][Ss][Ii][Vv][Ee][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Pp][Aa][Nn][Ee][Ll]\\[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\\{.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\\$[Ww][Ii][Nn][Rr][Ee][Aa][Gg][Ee][Nn][Tt]\\[Ss][Cc][Rr][Aa][Tt][Cc][Hh]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/ OR NOT _exists_:data_win_eventdata_image) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Pp][Aa][Cc][Kk][Aa][Gg][Ee] [Cc][Aa][Cc][Hh][Ee]\\.*/ OR (data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\[Ii][Ss]-.*/ AND data_win_eventdata_image:/.*\\[Aa][Vv][Ii][Rr][Aa]_[Ss][Yy][Ss][Tt][Ee][Mm]_[Ss][Pp][Ee][Ee][Dd][Uu][Pp]\.[Tt][Mm][Pp].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 48bfd177-7cf2-412b-ad77-baf923489e82
    name: Potentially Suspicious Volume Shadow Copy Vsstrace.dll Load
    reason: 'Same evasive operation: a tool deleting shadow copies through the VSS COM API (per the ORCx41/DeleteShadowCopies reference) pulls in vssapi.dll, vsstrace.dll and vss_ps.dll together, so this sibling EID 7 load fires from the same uncommon process within seconds.'
  - id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70
    name: Suspicious Volume Shadow Copy VSS_PS.dll Load
    reason: 'Co-occurring sibling image load: vss_ps.dll is the VSS COM proxy/stub loaded by the same programmatic shadow-copy manipulation, and seeing it beside vssapi.dll on the host confirms direct API abuse rather than a benign backup app.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: The vssadmin/wmic command-line variant of the exact same intent this API technique was built to evade; if it also fires on the host the actor is destroying shadow copies by more than one method.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Alternative shadow-copy deletion path (Get-WMIObject Win32_ShadowCopy.Delete, used by REvil/Sodinokibi) — a parallel attempt to inhibit recovery on the same host in the same burst.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: 'Classic follow-on: once shadow copies are gone, ransomware runs bcdedit to disable boot recovery/repair as the destructive step immediately before encryption.'
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: The other half of inhibit-system-recovery — wbadmin delete of Windows Backups/system-state so restores are impossible; expected minutes after shadow copies are destroyed.
  - id: db1c21e4-cd66-4b4e-85ca-590f0780529c
    name: Windows Recovery Environment Disabled Via Reagentc
    reason: Completes recovery inhibition by disabling the Windows Recovery Environment via reagentc /disable, a frequent companion to shadow-copy and backup destruction.
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Escalation to irreversible data destruction (cipher /w secure-wipes free space) — the Impact stage this shadow-copy deletion was preparing the host for.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Command-line shadow-copy & recovery-inhibition on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Ww][Bb][Aa][Dd][Mm][Ii][Nn]|[Bb][Cc][Dd][Ee][Dd][Ii][Tt]|[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]|[Cc][Ii][Pp][Hh][Ee][Rr]|[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/) OR data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]|[Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss]|[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd] [Nn][Oo]|[Dd][Ee][Ll][Ee][Tt][Ee] [Cc][Aa][Tt][Aa][Ll][Oo][Gg]).*/
    pivot_on:
    - host
    window: 2h
  - name: Full VSS COM-API DLL family loaded on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\([Vv][Ss][Ss][Aa][Pp][Ii]|[Vv][Ss][Ss][Tt][Rr][Aa][Cc][Ee]|[Vv][Ss][Ss]_[Pp][Ss]|[Ss][Ww][Pp][Rr][Vv])\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: Dropper / unusual binary executed from a user-writable path on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Ransom-note file creation on this host (pre-encryption prep confirmed)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][_ -]?[Mm][Ee]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Rr][Ee][Ss][Tt][Oo][Rr][Ee][_ -]?[Ff][Ii][Ll][Ee]|[Hh][Oo][Ww][_ -]?[Tt][Oo][_ -]?[Rr][Ee][Cc][Oo][Vv][Ee][Rr]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][_ -]?[Kk][Ee][Yy]|[Uu][Nn][Ll][Oo][Cc][Kk][_ -]?[Ff][Ii][Ll][Ee]).*\.([Tt][Xx][Tt]|[Hh][Tt][Mm][Ll]?)/
    pivot_on:
    - host
    window: 4h
  - name: Backup/VSS/security service stop or Defender disable on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Nn][Ee][Tt]1?|[Ss][Cc]|[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|[Dd][Ee][Ll][Ee][Tt][Ee]|\/[Ff]).*/ AND data_win_eventdata_commandLine:/.*([Vv][Ss][Ss]|[Bb][Aa][Cc][Kk][Uu][Pp]|[Ss][Qq][Ll]|[Vv][Ee][Ee][Aa][Mm]|[Dd][Ee][Ff][Ee][Nn][Dd]|[Ss][Ee][Nn][Ss][Ee]|[Ss][Oo][Pp][Hh][Oo][Ss]).*/) OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
