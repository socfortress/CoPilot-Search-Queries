name: Pingback Backdoor DLL Loading Activity
id: 35a7dc42-bc6f-46e0-9f83-81f8e56c8d4b
version: 1
schema_version: "1.0"
date: "2023-02-17"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 35a7dc42-bc6f-46e0-9f83-81f8e56c8d4b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Pingback backdoor that creates ICMP tunnel for C2 as
  described in the trustwave report. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\msdtc.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_imageLoaded:
              value: "C:\\Windows\\oci.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\msdtc.exe'; data_win_eventdata_imageLoaded equals 'C:\Windows\oci.dll'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/backdoor-at-the-end-of-the-icmp-tunnel
  - https://app.any.run/tasks/4a54c651-b70b-4b72-84d7-f34d301d6406
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Pingback Backdoor DLL Loading Activity detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - pingback
    - backdoor
    - loading
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Oo][Cc][Ii]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2bd63d53-84d4-4210-80ff-bf0658f1bf78
    name: Pingback Backdoor File Indicators
    reason: 'Direct precursor, same malware: Pingback''s updata.exe dropper writes C:\Windows\oci.dll - the exact DLL this alert catches MSDTC loading. Expect it on the same host shortly before.'
  - id: b2400ffb-7680-47c0-b08a-098a7de7e7a9
    name: Pingback Backdoor Activity
    reason: 'Direct precursor, same malware: updata.exe reconfiguring the MSDTC service to auto-start (config/msdtc/start/auto) - the persistence step that makes oci.dll load on each service start.'
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Same mechanism (phantom DLL hijack); its match list literally includes oci.dll, so it corroborates this load and surfaces sibling phantom-DLL hijacks (TSMSISrv, WLBSCTRL, wbemcomn) on the host.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Fires on this very event - oci.dll loads from the C:\Windows root, outside system32/syswow64/winsxs - and generalizes the hunt to any other search-order hijack on the host.
  - id: 828af599-4c53-4ed2-ba4a-a9f835c434ea
    name: Fax Service DLL Search Order Hijack
    reason: Same technique on another auto-start Windows service (fxssvc loading phantom ualapi.dll); worth checking whether the operator hijacked more than MSDTC on this host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Pingback oci.dll / mtxoci phantom DLL dropped on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Oo][Cc][Ii]\.[Dd][Ll][Ll]|[Ss][Qq][Ll][Ll][Ii][Bb]80\.[Dd][Ll][Ll])/
    pivot_on:
    - host
    window: 2h
  - name: MSDTC (msdtc.exe) spawning child processes on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ss][Dd][Tt][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: MSDTC service reconfigured to auto-start on this host
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Mm][Ss][Dd][Tt][Cc].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Mm][Ss][Dd][Tt][Cc].*/ AND data_win_eventdata_commandLine:/.*([Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Tt][Aa][Rr][Tt]|[Aa][Uu][Tt][Oo]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Unsigned or Windows-root DLL loaded by msdtc.exe on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[^\\]+\.[Dd][Ll][Ll]/ OR data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Hands-on-keyboard host/network discovery after the backdoor on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|[Rr][Oo][Uu][Tt][Ee]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
