name: Windows DLL Search Order Hijacking Hunt with Sysmon
id: 79c7d1fc-64c7-91be-a616-ccda752efe81
version: 11
schema_version: 1
date: '2025-05-26'
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects potential DLL search order hijacking or DLL sideloading by identifying
  DLLs loaded from non-standard directories (outside system32, syswow64, winsxs,
  wbem). Attackers place malicious DLLs with names matching legitimate Windows
  libraries in directories that take precedence in the DLL search order, causing
  vulnerable applications to load the malicious version instead. Associated with
  Qakbot, Malicious Inno Setup Loader, and general defense evasion tradecraft.
  Cross-reference imageLoaded values against hijacklibs.net for known hijackable
  libraries. MITRE ATT&CK: T1574.001 (DLL Search Order Hijacking).

data_source:
  - Sysmon EventID 7 (ImageLoad)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "7"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"
      must_not:
        - wildcard:
            data_win_eventdata_imageLoaded: "*\\\\system32\\\\*"
        - wildcard:
            data_win_eventdata_imageLoaded: "*\\\\syswow64\\\\*"
        - wildcard:
            data_win_eventdata_imageLoaded: "*\\\\winsxs\\\\*"
        - wildcard:
            data_win_eventdata_imageLoaded: "*\\\\wbem\\\\*"
        - wildcard:
            data_win_eventdata_imageLoaded: "*\\\\Program Files\\\\*"
        - wildcard:
            data_win_eventdata_imageLoaded: "*\\\\Program Files (x86)\\\\*"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 7 (ImageLoad) flowing to the Wazuh Indexer.
  EventID 7 confirmed flowing on DESKTOP-AM0HLGE with 153+ events per 2h.
  Confirmed field names: data_win_eventdata_image (loading process),
  data_win_eventdata_imageLoaded (full DLL path). Real-world example confirmed
  in lab: OneDrive.exe loading vcruntime140_1_app.dll and msvcp140_app.dll
  from AppData\Local\Microsoft\OneDrive — known hijackable DLL names loaded
  from non-standard paths. This detection is a hunting query — results should
  be triaged manually against the hijacklibs.net database of known hijackable
  Windows libraries. The must_not exclusions filter standard system paths to
  reduce noise; tune additional exclusions (e.g. OneDrive AppData paths) based
  on your environment baseline.

known_false_positives: >
  High false positive rate expected — many legitimate applications load DLLs
  from non-standard paths (e.g. OneDrive, Teams, browser components loading
  from AppData). This is a hunting detection intended for analyst triage.
  Build an allowlist of known-good imageLoaded paths in your environment.
  Focus on DLL names that match known Windows system DLL names (e.g.
  version.dll, winmm.dll, cryptbase.dll) loaded from user-writable directories
  such as AppData, Temp, Desktop, or application install directories.

references:
  - https://hijacklibs.net
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Possible DLL search order hijacking on $agent_name$.
    Process: $data_win_eventdata_image$.
    DLL loaded from non-standard path: $data_win_eventdata_imageLoaded$.
    Verify the DLL name against hijacklibs.net and confirm whether the
    loading process should be loading this library from this path.
    MITRE ATT&CK: T1574.001
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_imageLoaded
      type: file_name

tags:
  analytic_story:
    - Qakbot
    - Windows Defense Evasion Tactics
    - Living Off The Land
    - Malicious Inno Setup Loader
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - dll_hijacking
    - dll_sideloading
    - imageload
    - defense_evasion
    - hunting
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Same behaviour with a curated list of hijackable DLL names loaded from user-writable paths; a hit here converts this broad hunt into a high-confidence sideload.
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: System binaries (svchost, etc.) loading DLLs from user-writable paths is the strongest escalation of a generic non-system-path image load.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Phantom-DLL variant of search-order hijacking; same host showing both indicates deliberate planting of a DLL the loader looks for.
  - id: 418dc89a-9808-4b87-b1d7-e5ae0cb6effc
    name: Potential Mpclient.DLL Sideloading
    reason: Defender-binary sideload of a rogue mpclient.dll is a common Qakbot/ransomware-affiliate loader chain matching this rule's analytic stories.
  - id: d36f7c12-14a3-4d48-b6b8-774b9c66f44d
    name: Potential Python DLL SideLoading
    reason: Renamed python.exe loading a rogue python DLL from a writable dir is another sideloading carrier seen after initial-access droppers.
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Qakbot is a named story of this rule; the sideloaded or dropped DLL is typically then run via rundll32 with an export.
  - id: 9525dc73-0327-438c-8c04-13c0e037e9da
    name: Regsvr32 Execution From Potential Suspicious Location
    reason: Dropped DLL staged in user-writable path is often launched through regsvr32, linking the unusual image load to explicit execution.
  - id: 4f73421b-5a0b-4bbf-a892-5a7fb99bea66
    name: Mavinject Inject DLL Into Running Process
    reason: 'Follow-on defence-evasion: attacker already running a DLL from a writable path may inject it into a trusted process via Mavinject.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLLs written to user-writable paths (sideload staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Executable from user-writable path launched by script/Office/installer parent (carrier binary)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/) AND NOT data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Mm][Ss][Ii][Ee][Xx][Ee][Cc]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Rundll32/Regsvr32 invoked against DLL in user-writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence registry values pointing into user-writable paths
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ OR data_win_eventdata_targetObject:/.*[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/) AND (data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network connections from binaries in user-writable paths
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
