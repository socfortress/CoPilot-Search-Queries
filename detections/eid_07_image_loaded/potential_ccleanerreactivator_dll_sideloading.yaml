name: Potential CCleanerReactivator.DLL Sideloading
id: 3735d5ac-d770-4da0-99ff-156b180bc600
version: 1
schema_version: "1.0"
date: "2023-07-13"
author: X__Junior
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3735d5ac-d770-4da0-99ff-156b180bc600
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "CCleanerReactivator.dll". MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\CCleanerReactivator.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\CCleaner\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files (x86)\\\\CCleaner\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\CCleanerReactivator.exe"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\CCleanerReactivator.dll'; data_win_eventdata_image matches 'C:\Program
  Files\CCleaner\*'; data_win_eventdata_image matches 'C:\Program Files
  (x86)\CCleaner\*', among other conditions.

known_false_positives: >
  False positives could occur from other custom installation paths. Apply
  additional filters accordingly. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://lab52.io/blog/2344-2/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential CCleanerReactivator.DLL Sideloading detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - ccleanerreactivator
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr][Rr][Ee][Aa][Cc][Tt][Ii][Vv][Aa][Tt][Oo][Rr]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr]\\.*/) AND data_win_eventdata_image:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr][Rr][Ee][Aa][Cc][Tt][Ii][Vv][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1fbc0671-5596-4e17-8682-f020a0b995dc
    name: Potential CCleanerDU.DLL Sideloading
    reason: 'Sibling sideload from the same lab52-documented campaign: the attacker ships the same trojanized CCleaner package, so CCleanerDU.dll is very likely sideloaded on the same host within minutes of CCleanerReactivator.dll.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: Generic search-order-hijack hunt that flags any DLL loaded from outside system32/syswow64/winsxs/Program Files; CCleanerReactivator.dll loaded from the attacker's drop directory trips it on the very same EventID 7, confirming and widening the finding.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Same technique class (DLL sideloading of abusable DLLs from suspicious locations) by the same author; an actor sideloading CCleaner binaries commonly reuses other abusable DLLs (libcef/coreclr/ZIPDLL) on the same host, so a second hit confirms sideloading tradecraft.
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'Precursor: the EventID 11 file-write of a DLL into an application dependency folder by an unusual process is the staging step that sets up the search-order hijack this rule then observes being loaded.'
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: 'Follow-on C2: the sideloaded CCleanerReactivator.exe runs from a non-standard (attacker-controlled) directory, so the malicious DLL''s outbound beacon is initiated by a process in a suspicious location and fires this rule.'
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: 'Follow-on persistence: sideload pairs are routinely launched and persisted by a scheduled task pointing at the attacker''s payload folder, so a schtasks /create from a suspicious folder on the same host is the expected next step.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CCleanerReactivator sideload pair dropped to disk (staging / who planted it)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr][Rr][Ee][Aa][Cc][Tt][Ii][Vv][Aa][Tt][Oo][Rr]\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 6h
  - name: CCleanerReactivator.exe execution & parent process (the abused signed host binary)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr][Rr][Ee][Aa][Cc][Tt][Ii][Vv][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Outbound network & DNS from CCleanerReactivator.exe (C2 beacon by the sideloaded process)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Cc][Cc][Ll][Ee][Aa][Nn][Ee][Rr][Rr][Ee][Aa][Cc][Tt][Ii][Vv][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Autostart persistence established around the sideload (Run key / scheduled task / service)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Process injection & LSASS access from the trusted-process loader (post-sideload objective)
    query: (data_win_system_eventID:"8") OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 2h
