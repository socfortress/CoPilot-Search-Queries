    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1490
  risk_score: 75
  severity: high
  risk_objects:
