name: Suspicious Volume Shadow Copy VSS_PS.dll Load
id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70
version: 1
schema_version: "1.0"
date: "2025-07-11"
author: Markus Neis, @markus_neis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the image load of vss_ps.dll by uncommon executables. This DLL is used
  by the Volume Shadow Copy Service (VSS) to manage shadow copies of files and
  volumes. It is often abused by attackers to delete or manipulate shadow
  copies, which can hinder forensic investigations and data recovery efforts.
  The fact that it is loaded by processes that are not typically associated with
  VSS operations can indicate suspicious activity. MITRE ATT&CK: T1490.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\vss_ps.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Windows\\\\*"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\clussvc.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\dismhost.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\dllhost.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\inetsrv\\\\appcmd.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\inetsrv\\\\iissetup.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\msiexec.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\rundll32.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\searchindexer.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\srtasks.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\svchost.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\System32\\\\SystemPropertiesAdvanced.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\taskhostw.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\thor.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\thor64.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\tiworker.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\vssvc.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\vssadmin.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\WmiPrvSE.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\wsmprovhost.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "C:\\\\$WinREAgent\\\\Scratch\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\dismhost.exe {*"
                                case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\vss_ps.dll'; data_win_eventdata_image matches 'C:\Windows\*';
  data_win_eventdata_image matches '*\clussvc.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

