graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Vv][Ss][Ss]_[Pp][Ss]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_commandLine AND NOT ((data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ AND (data_win_eventdata_image:/.*\\[Cc][Ll][Uu][Ss][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Nn][Ee][Tt][Ss][Rr][Vv]\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Nn][Ee][Tt][Ss][Rr][Vv]\\[Ii][Ii][Ss][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ee][Aa][Rr][Cc][Hh][Ii][Nn][Dd][Ee][Xx][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Rr][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Yy][Ss][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Ii][Ee][Ss][Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ii][Ww][Oo][Rr][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)) OR (data_win_eventdata_commandLine:/[Cc]:\\\$[Ww][Ii][Nn][Rr][Ee][Aa][Gg][Ee][Nn][Tt]\\[Ss][Cc][Rr][Aa][Tt][Cc][Hh]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] \{.*/) OR NOT _exists_:data_win_eventdata_image) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 48bfd177-7cf2-412b-ad77-baf923489e82
    name: Potentially Suspicious Volume Shadow Copy Vsstrace.dll Load
    reason: 'Co-occurring, same action: identical EID-7 behaviour (a VSS DLL loaded by an uncommon, non-Windows executable) seen through vsstrace.dll. The same process loading vsstrace.dll alongside vss_ps.dll is near-proof it is driving the VSS COM API rather than a one-off import.'
  - id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
    name: Suspicious Volume Shadow Copy Vssapi.dll Load
    reason: 'Co-occurring sibling: vssapi.dll is the VSS API surface; an uncommon process loading it corroborates that this host is interacting with Volume Shadow Copy programmatically, the exact precondition this rule flags.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Dominant follow-on intent (T1490): the usual reason to touch VSS is to destroy it. The same actor that drove VSS via COM often also fires vssadmin/wmic ''delete shadows'' on the host minutes later.'
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: 'Follow-on via the programmatic path: WMI/PowerShell shadow deletion is the COM-driven alternative to vssadmin that loading vss_ps.dll enables, so this is the deletion most consistent with the observed DLL load.'
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: 'Credential-theft branch, co-occurring: after mounting/creating a shadow copy through the VSS COM API, attackers copy locked files (registry hives, ntds.dit) out of it. This rule catches that copy-out step on the same host.'
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: 'Credential-theft branch: accessing SAM/SECURITY hives or ntds.dit through a shadow copy is the exact payoff of programmatic VSS interaction; firing on the same host confirms the intent was data/credential extraction, not just recovery denial.'
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: 'Recovery-inhibition combo: bcdedit recoveryenabled/bootstatuspolicy tampering is the other half of the pre-ransomware ''destroy every recovery option'' playbook that pairs with shadow-copy destruction.'
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: 'Follow-on in the same destruction playbook: wbadmin backup/catalog deletion removes the file-level recovery path just as the VSS abuse removes the snapshot path; both together signal imminent ransomware impact.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow-copy / backup / boot-recovery destruction commands on this host
    query: data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*(([Dd][Ee][Ll][Ee][Tt][Ee])|([Rr][Ee][Ss][Ii][Zz][Ee])).*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*(([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd])|([Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy])).*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].*/
    pivot_on:
    - host
    window: 2h
  - name: Shadow-copy access for hive / NTDS.dit theft on this host
    query: data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ll][Oo][Bb][Aa][Ll][Rr][Oo][Oo][Tt].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*\/[Vv][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*[Ss][Hh][Aa][Dd][Oo][Ww].*((\\[Ss][Aa][Mm])|(\\[Ss][Yy][Ss][Tt][Ee][Mm])|(\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])).*/
    pivot_on:
    - host
    window: 2h
  - name: Other VSS COM/API DLLs loaded by non-Windows processes on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Vv][Ss][Ss]_[Pp][Ss]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Vv][Ss][Ss][Aa][Pp][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Vv][Ss][Ss][Tt][Rr][Aa][Cc][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ss][Ww][Pp][Rr][Vv]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Vv][Ss][Ss][Cc]\.[Dd][Ll][Ll]/) AND NOT data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on:
    - host
    window: 1h
  - name: Ransomware detonation fan-out on this host (ransom notes, recovery-service stop, cipher wipe)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(([Rr][Ee][Aa][Dd].?[Mm][Ee])|([Hh][Oo][Ww].?[Tt][Oo].?[Dd][Ee][Cc][Rr][Yy][Pp][Tt])|([Dd][Ee][Cc][Rr][Yy][Pp][Tt].?[Ii][Nn][Ss][Tt][Rr][Uu][Cc][Tt][Ii][Oo][Nn])|([Rr][Ee][Ss][Tt][Oo][Rr][Ee].?[Ff][Ii][Ll][Ee][Ss])).*\.([Tt][Xx][Tt]|[Hh][Tt][Mm][Ll]?)/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ii][Pp][Hh][Ee][Rr] \/[Ww].*/ OR data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]|[Ss][Cc]).*[Ss][Tt][Oo][Pp].*(([Vv][Ss][Ss])|([Bb][Aa][Cc][Kk][Uu][Pp])|([Ss][Qq][Ll])|([Vv][Ee][Ee][Aa][Mm])).*/))
    pivot_on:
    - host
    window: 4h
  - name: Execution context of the VSS-driving binary on this host (user-writable path or script/LOLBin parent)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc])\\.*/ OR data_win_eventdata_parentImage:/.*\\(([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])|([Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])|([Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])|([Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])|([Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])|([Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])|([Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]))/)
    pivot_on:
    - host
    window: 1h
