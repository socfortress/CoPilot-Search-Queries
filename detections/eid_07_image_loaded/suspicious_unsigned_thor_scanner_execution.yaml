name: Suspicious Unsigned Thor Scanner Execution
id: ea5c131b-380d-49f9-aeb3-920694da4d4b
version: 1
schema_version: "1.0"
date: "2023-10-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ea5c131b-380d-49f9-aeb3-920694da4d4b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects loading and execution of an unsigned thor scanner binary. MITRE
  ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\thor.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\thor64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\thor.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\thor64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_signed"
        - exists:
            field: "data_win_eventdata_signatureStatus"
        - exists:
            field: "data_win_eventdata_signature"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_signed:
                          value: "true"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_signatureStatus:
                          value: "valid"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_signature:
                          value: "Nextron Systems GmbH"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed
    - data_win_eventdata_signatureStatus
    - data_win_eventdata_signature

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\thor.exe'; data_win_eventdata_image matches '*\thor64.exe';
  data_win_eventdata_imageLoaded matches '*\thor.exe', among other conditions.

known_false_positives: >
  Other legitimate binaries named "thor.exe" that aren't published by Nextron
  Systems. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Suspicious Unsigned Thor Scanner Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - unsigned
    - scanner
    - image_load
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/) AND (data_win_eventdata_imageLoaded:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_signed AND _exists_:data_win_eventdata_signatureStatus AND _exists_:data_win_eventdata_signature AND NOT (data_win_eventdata_signed:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_signatureStatus:/[Vv][Aa][Ll][Ii][Dd]/ AND data_win_eventdata_signature:/[Nn][Ee][Xx][Tt][Rr][Oo][Nn] [Ss][Yy][Ss][Tt][Ee][Mm][Ss] [Gg][Mm][Bb][Hh]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: 'Same evasion class via Sysmon OriginalFileName: a process whose embedded original name is a known tool but whose on-disk name was changed. The unsigned thor.exe is the same trick (an untrusted binary wearing a trusted/allowlisted name); an actor who staged it typically runs other renamed LOLBins on the same host.'
  - id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    reason: Masquerade-by-rename of high-value execution/recon utilities (PsExec, PowerShell, certutil, rundll32, wmic, mshta). A THOR-impersonating implant commonly brings a renamed PsExec/PowerShell/rundll32 for its follow-on execution; this surfaces those on the same host.
  - id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd
    name: Suspicious Process Masquerading As SvcHost.EXE
    reason: Sibling masquerade using a trusted name (svchost.exe running from a non-System32 path or with a mismatched OriginalFileName). Same deception goal as labelling a binary thor.exe to blend in with an allowlisted scanner, so check whether the same actor is also impersonating core Windows processes on this host.
  - id: f0540f7e-2db3-4432-b9e0-3965486744bc
    name: Legitimate Application Dropped Executable
    reason: 'Delivery precursor: a trusted utility (certutil, certoc, mshta, acrord32, etc.) writing an .exe/.dll just before the image-load is a common way the unsigned thor.exe was staged on disk. Confirms how the masquerading binary arrived.'
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: Same EID7 unsigned-image trust anomaly, applied to signed-binary-proxy LOLBins (rundll32, regsvr32, installutil, regasm) loading unsigned code - the next-stage proxy execution a masquerading implant uses to run its payload under a trusted process.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Same EID7 signed:false logic pointed at lsass.exe: an unsigned module loaded into LSASS is credential dumping, the objective an implant masquerading as a compromise-assessment scanner is most likely pursuing next on this host.'
  - id: bdc64095-d59a-42a2-8588-71fd9c9d9abc
    name: Suspicious Unsigned Dbghelp/Dbgcore DLL Loaded
    reason: Same EID7 unsigned-module logic; an unsigned dbghelp.dll/dbgcore.dll load is the MiniDumpWriteDump path to LSASS memory - a likely credential-access follow-on performed by the same untrusted binary.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process-creation and file-drop of the thor.exe binary on this host (launch context and delivery)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 4h
  - name: Other unsigned modules loaded from user-writable paths on this host (broader untrusted-code footprint)
    query: data_win_system_eventID:"7" AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential-access activity on this host (direct access, unsigned dump modules, dumper command lines)
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"7" AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Network connections and DNS queries made by the flagged thor binary (possible C2/beaconing)
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence established on this host (Run-key / service registry writes, scheduled tasks, Startup drops)
    query: ((data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/))
    pivot_on:
    - host
    window: 2h
