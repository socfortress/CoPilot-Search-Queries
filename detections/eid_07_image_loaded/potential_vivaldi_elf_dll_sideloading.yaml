name: Potential Vivaldi_elf.DLL Sideloading
id: 2092cacb-d77b-4f98-ab0d-32b32f99a054
version: 1
schema_version: "1.0"
date: "2023-08-03"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2092cacb-d77b-4f98-ab0d-32b32f99a054
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "vivaldi_elf.dll". MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\vivaldi_elf.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Vivaldi\\\\Application\\\\vivaldi.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\Vivaldi\\\\Application\\\\*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\vivaldi_elf.dll'; data_win_eventdata_image matches
  '*\Vivaldi\Application\vivaldi.exe'; data_win_eventdata_imageLoaded matches
  '*\Vivaldi\Application\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.checkpoint.com/2023/beyond-the-horizon-traveling-the-world-on-camaro-dragons-usb-flash-drives/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Vivaldi_elf.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - vivaldi
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]_[Ee][Ll][Ff]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: 'Same DLL-sideloading technique and the exact malware this chain delivers: Camaro Dragon''s vivaldi_elf.dll sideload loads PlugX. A hit means another trusted binary (CamMute/chrome_frame_helper/etc.) is sideloading PlugX from an uncommon path on this host - the implant stage of the same intrusion.'
  - id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
    name: Mustang Panda Dropper
    reason: Camaro Dragon IS Mustang Panda; this catches that actor's dropper/persistence command lines (wtask.exe /create, the 'Security Script' scheduled task, winwsh.exe in Temp). Firing in the window places the drop or task-creation stage of the same actor on this host.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Sibling image-load sideload detector for a different set of abused DLLs (libcef/coreclr/etc.) loading from a suspicious path. A second abusable DLL sideloading on the same host corroborates deliberate sideloading over a one-off false positive.
  - id: 5ce0f04e-3efc-42af-839d-5b3a543b76c0
    name: Suspicious Process Execution From Fake Recycle.Bin Folder
    reason: This campaign hides the signed loader + vivaldi_elf.dll in a hidden RECYCLER.BIN folder on USB drives (Mandiant infected-USB TTP). A process executing from RECYCLER(S).BIN on this host is very likely the binary that performed this sideload.
  - id: 15b75071-74cc-47e0-b4c6-b43744a62a2b
    name: Suspicious Process Start Locations
    reason: Sideloading requires a trusted binary to run from an untrusted directory; this flags the loader process starting from RECYCLER\, SystemVolumeInformation\, Windows\Tasks and similar abnormal paths - i.e. the very process that loaded vivaldi_elf.dll, identified by its start location.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: 'The follow-on egress: once the sideloaded implant runs, the loader sitting in $Recycle.bin/Temp/Public beacons out. A network connection initiated by a process in those same uncommon paths on this host is the C2 stage of this chain.'
  - id: windows-wpdbusenum-registry-usb-device-001
    name: Windows WPDBusEnum Registry Key Modification - USB Device Detection
    reason: Camaro Dragon travels on USB flash drives (Check Point) and worms itself onto newly-inserted ones. A USB device insertion on this host in the window is the likely delivery vector and a propagation lead to pursue.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sideloading launcher executed from fake Recycle.Bin / removable / user-writable path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_image:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Companion Vivaldi/Chromium DLLs loaded on this host (full relocated browser payload)
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\([Cc][Hh][Rr][Oo][Mm][Ee]_[Ee][Ll][Ff]\.[Dd][Ll][Ll]|[Ll][Ii][Bb][Ee][Gg][Ll]\.[Dd][Ll][Ll]|[Ll][Ii][Bb][Gg][Ll][Ee][Ss][Vv]2\.[Dd][Ll][Ll]|[Vv][Kk]_[Ss][Ww][Ii][Ff][Tt][Ss][Hh][Aa][Dd][Ee][Rr]\.[Dd][Ll][Ll]|[Dd]3[Dd][Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]_47\.[Dd][Ll][Ll])/
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence created on this host (Run/RunOnce, Services, IFEO, schtasks /create)
    query: ((data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Vivaldi process spawning a shell or LOLBin on this host (post-sideload execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|[Rr][Ee][Gg]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: vivaldi_elf.dll dropped or files staged in a fake Recycle.Bin on this host (plant + USB propagation)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]_[Ee][Ll][Ff]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_targetFilename:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Cc][Rr])/)
    pivot_on:
    - host
    window: 6h
