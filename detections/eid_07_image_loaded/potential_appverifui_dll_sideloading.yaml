name: Potential appverifUI.DLL Sideloading
id: ee6cea48-c5b6-4304-a332-10fc6446f484
version: 1
schema_version: "1.0"
date: "2023-06-20"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ee6cea48-c5b6-4304-a332-10fc6446f484
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "appverifUI.dll". MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\appverifUI.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\SysWOW64\\appverif.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\System32\\appverif.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Windows\\\\System32\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Windows\\\\WinSxS\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\appverifUI.dll'; data_win_eventdata_image equals
  'C:\Windows\SysWOW64\appverif.exe'; data_win_eventdata_image equals
  'C:\Windows\System32\appverif.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20220519091349/https://fatrodzianko.com/2020/02/15/dll-side-loading-appverif-exe/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential appverifUI.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - appverifui
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Vv][Ee][Rr][Ii][Ff][Uu][Ii]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND NOT ((data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Aa][Pp][Pp][Vv][Ee][Rr][Ii][Ff]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Pp][Pp][Vv][Ee][Rr][Ii][Ff]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'The file-write precursor to this load: an unusual process dropping a .dll into a user-writable app-dependency folder to be sideloaded. Same staging step that plants a copy of appverif.exe + a malicious appverifUI.dll before it is executed.'
  - id: 602a1f13-c640-4d73-b053-be9a2fa58b96
    name: HackTool - Powerup Write Hijack DLL
    reason: Powerup's Write-HijackDll privilege-escalation primitive, which stages exactly this kind of DLL-hijack. Its presence on the host in the window indicates the appverif sideload is operator-driven privesc tradecraft, not a benign load.
  - id: b6f91281-20aa-446a-b986-38a92813a18f
    name: DLL Search Order Hijackig Via Additional Space in Path
    reason: 'Another file-write precursor: crafting spoofed ''C:\Windows \'' / ''Program Files \'' folders with a planted .dll to win the loader search order. Same plant-a-DLL-where-it-loads-first step that precedes this image-load sideload.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'The generalised form of this detection: any DLL loaded from outside system32/syswow64/winsxs/wbem. An appverifUI.dll loaded from a non-system directory also trips this hunt, confirming the search-order hijack and exposing sibling hijacked loads on the same host.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Same EID 7 image-load lens for known-abusable DLLs loaded from suspicious/user-writable paths (PerfLogs, Users\Public, Windows\Temp). If the malicious appverifUI.dll was planted in such a path it co-fires, and it surfaces any other abusable-DLL sideload in the same actor kit.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Sibling T1574.001 technique (phantom/search-order hijacking of unsigned, non-Microsoft DLLs) judged on the same signed/signatureStatus fields this rule exports. On a host running one sideload, check for phantom-DLL loads of the actor's other targets.
  - id: f39ee679-3b1e-4f47-841c-5c3c580acda2
    name: Windows DLL Search Order Hijacking with iscsicpl
    reason: 'Sibling trusted-binary DLL-hijack: the auto-elevating iscsicpl.exe loading a planted iscsi.dll to spawn a shell with UAC bypass. Same ''signed binary + planted DLL in its own directory'' pattern as the appverif sideload, and a likely privilege-escalation variant to look for on this host.'
  - id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
    name: Third Party Software DLL Sideloading
    reason: Sibling image-load sideload detection targeting third-party-application DLLs. Identical technique and telemetry; on a host with a confirmed sideload it surfaces additional third-party-software sideload targets in the actor's kit.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AppVerif sideload kit written to disk (appverifUI.dll / appverif.exe plant)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Vv][Ee][Rr][Ii][Ff][Uu][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Vv][Ee][Rr][Ii][Ff]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 24h
  - name: Child processes spawned by appverif.exe (sideloaded payload execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Vv][Ee][Rr][Ii][Ff]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections by appverif.exe (sideloaded DLL C2 beacon)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Vv][Ee][Rr][Ii][Ff]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other abusable-DLL loads from user-writable paths on this host (sideload kit)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/) AND NOT (data_win_eventdata_imageLoaded:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: Persistence established after the sideload (Run keys / scheduled tasks / services)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Tt]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)))
    pivot_on:
    - host
    window: 2h
