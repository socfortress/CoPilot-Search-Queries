name: Potential Waveedit.DLL Sideloading
id: 71b31e99-9ad0-47d4-aeb5-c0ca3928eeeb
version: 1
schema_version: "1.0"
date: "2023-06-14"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 71b31e99-9ad0-47d4-aeb5-c0ca3928eeeb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "waveedit.dll", which is part of the Nero
  WaveEditor audio editing software. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\waveedit.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Program Files (x86)\\Nero\\Nero Apps\\Nero WaveEditor\\waveedit.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Program Files\\Nero\\Nero Apps\\Nero WaveEditor\\waveedit.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files (x86)\\\\Nero\\\\Nero Apps\\\\Nero WaveEditor\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files\\\\Nero\\\\Nero Apps\\\\Nero WaveEditor\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\waveedit.dll'; data_win_eventdata_image equals 'C:\Program Files
  (x86)\Nero\Nero Apps\Nero WaveEditor\waveedit.exe'; data_win_eventdata_image
  equals 'C:\Program Files\Nero\Nero Apps\Nero WaveEditor\waveedit.exe', among
  other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/23/f/behind-the-scenes-unveiling-the-hidden-workings-of-earth-preta.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Waveedit.DLL Sideloading detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - waveedit
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Nn][Ee][Rr][Oo]\\[Nn][Ee][Rr][Oo] [Aa][Pp][Pp][Ss]\\[Nn][Ee][Rr][Oo] [Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt][Oo][Rr]\\[Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Nn][Ee][Rr][Oo]\\[Nn][Ee][Rr][Oo] [Aa][Pp][Pp][Ss]\\[Nn][Ee][Rr][Oo] [Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt][Oo][Rr]\\[Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Nn][Ee][Rr][Oo]\\[Nn][Ee][Rr][Oo] [Aa][Pp][Pp][Ss]\\[Nn][Ee][Rr][Oo] [Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt][Oo][Rr]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Nn][Ee][Rr][Oo]\\[Nn][Ee][Rr][Oo] [Aa][Pp][Pp][Ss]\\[Nn][Ee][Rr][Oo] [Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt][Oo][Rr]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'Precursor (EID 11): the malicious waveedit.dll being written to disk beside the signed loader EXE is exactly the staging step that this image-load fires on moments later; a DLL dropped into an app-dependency folder by an unusual process is the same T1574.001 drop.'
  - id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
    name: Mustang Panda Dropper
    reason: 'Actor precursor: the waveedit.exe/waveedit.dll sideload is Earth Preta / Mustang Panda tradecraft (the rule''s own Trend Micro reference); this catches the group''s dropper staging (Temp\wtask.exe /create scheduled-task persistence) that plants and launches the package on the same host.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Confirming sibling (EID 7, same author): fires on any other known-abused DLL sideloaded from a user-writable path during the same intrusion, widening a single waveedit load into the host''s full sideloading picture.'
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Confirming sibling (EID 7): generalized hunt for DLLs loaded from non-standard directories; corroborates the waveedit.dll load as search-order hijacking and surfaces companion hijacked DLLs the specific rule misses.'
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: 'Follow-on payload: PlugX is Mustang Panda''s RAT and is delivered by precisely this signed-EXE-plus-malicious-DLL technique (T1574.001); this catches the companion loader binary running from an uncommon location that the implant decrypts its .dat payload with.'
  - id: 02d1d718-dd13-41af-989d-ea85c7fab93f
    name: Rare Remote Thread Creation By Uncommon Source Image
    reason: 'Follow-on (EID 8): once waveedit.dll loads, the hijacked signed process injects the decrypted shellcode (TONESHELL/PlugX stage) into another process; waveedit.exe is a rare, uncommon source image for CreateRemoteThread.'
  - id: 7806bb49-f653-48d3-a915-5115c1a85234
    name: Potential APT Mustang Panda Activity Against Australian Gov
    reason: 'Follow-on actor activity: the same group''s hands-on-keyboard command-line execution that typically follows a successful loader on the compromised host, confirming attribution for the sideload.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Nero WaveEditor sideload package (waveedit.exe/.dll) dropped to disk on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt]\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
  - name: Hijacked waveedit.exe making network connections or DNS queries (C2 beacon)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Shellcode injection from the hijacked waveedit.exe loader (remote thread / process access)
    query: (data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*\\[Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*\\[Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Autorun persistence staged on this host (Run key or scheduled task)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww][Tt][Aa][Ss][Kk]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Aa][Dd][Dd].*[Rr][Uu][Nn].*/))
    pivot_on:
    - host
    window: 2h
  - name: Suspicious child processes spawned by the hijacked waveedit.exe (hands-on-keyboard)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Aa][Vv][Ee][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
