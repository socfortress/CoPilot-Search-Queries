name: MMC Loading Script Engines DLLs
id: a9c73e8b-3b2d-4c45-8ef2-5f9a9c9998ad
version: 1
schema_version: "1.0"
date: "2025-02-05"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a9c73e8b-3b2d-4c45-8ef2-5f9a9c9998ad
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the Microsoft Management Console (MMC) loads the DLL libraries
  like vbscript, jscript etc which might indicate an attempt to execute
  malicious scripts within a trusted system process for bypassing application
  whitelisting or defense evasion. MITRE ATT&CK: T1059.005, T1218.014.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\mmc.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\vbscript.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\jscript.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "*\\\\jscript9.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches '*\mmc.exe';
  data_win_eventdata_imageLoaded matches '*\vbscript.dll';
  data_win_eventdata_imageLoaded matches '*\jscript.dll', among other
  conditions.

known_false_positives: >
  Legitimate MMC operations or extensions loading these libraries. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://tria.ge/241015-l98snsyeje/behavioral2
  - https://www.elastic.co/security-labs/grimresource
  - https://attack.mitre.org/techniques/T1059/005/
  - https://attack.mitre.org/techniques/T1218/014/

response:
  message: >
    MMC Loading Script Engines DLLs detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1059.005, T1218.014
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.005
    - T1218.014
  custom_tags:
    - loading
    - engines
    - image_load
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Jj][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Jj][Ss][Cc][Rr][Ii][Pp][Tt]9\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
    name: MMC Executing Files with Reversed Extensions Using RTLO Abuse
    reason: 'Delivery/precursor: the same T1218.014 MMC-exec family — a malicious .msc disguised with an RTLO-reversed extension and opened by the user, which is exactly how GrimResource lands before mmc.exe runs its in-process script.'
  - id: 05a2ab7e-ce11-4b63-86db-ab32e763e11d
    name: MMC Spawning Windows Shell
    reason: 'Immediate follow-on: after the in-process script executes, mmc.exe spawns cmd/powershell/wscript/cscript — the canonical GrimResource hands-on-keyboard step this image-load alert precedes.'
  - id: windows-mmc-lolbas-execution-process-spawn-001
    name: Windows Mmc LOLBAS Execution Process Spawn
    reason: 'Immediate follow-on: mmc.exe spawning rundll32/regsvr32/mshta/dllhost as a LOLBAS proxy — the staging move the in-process script triggers right after loading the script engine.'
  - id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
    name: Dllhost.EXE Execution Anomaly
    reason: 'GrimResource''s signature injection target: PASTALOADER spawns a bare dllhost.exe with no CLSID to host the beacon; an anomalous dllhost on this host right after the MMC script engine load is the payload-staging step.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'The payload itself: GrimResource''s loader injects Cobalt Strike (T1055.001) into the spawned process; a CS-shaped remote thread on this host is the direct realisation of this execution primitive.'
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'C2 stand-up: the injected Cobalt Strike beacon creates its default named pipes; seeing one on this host confirms the MMC script-engine exec matured into an active C2 implant.'
  - id: 93a19907-d4f9-4deb-9f91-aac4692776a6
    name: UAC Bypass Using .NET Code Profiler on MMC
    reason: 'Co-occurring MMC abuse for escalation: a COR_PROFILER pe386.dll dropped to hijack MMC (UACMe 39, T1548.002); on a host already showing MMC code-exec it signals the actor is escalating through the same trusted process.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MMC spawning any child process on this host (GrimResource hands-on-keyboard)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Process injection from mmc.exe or into dllhost.exe on this host
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND (data_win_eventdata_sourceImage:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Script engine DLLs loaded by other signed-binary hosts on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Jj][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Jj][Ss][Cc][Rr][Ii][Pp][Tt]9\.[Dd][Ll][Ll]/) AND (data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ee][Rr][Cc][Ll][Ss][Ii][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Malicious .msc file dropped in a user-writable path on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Mm][Ss][Cc]/ AND (data_win_eventdata_targetFilename:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 24h
  - name: Outbound network connection from mmc.exe or dllhost.exe on this host (C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
