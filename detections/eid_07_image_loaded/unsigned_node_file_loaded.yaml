name: Unsigned .node File Loaded
id: e5f5c693-52d7-4de5-88ae-afbfbce85595
version: 1
schema_version: "1.0"
date: "2025-11-22"
author: Jonathan Beierle (@hullabrian)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e5f5c693-52d7-4de5-88ae-afbfbce85595
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the loading of unsigned .node files. Adversaries may abuse a lack of
  .node integrity checking to execute arbitrary code inside of trusted
  applications such as Slack. .node files are native add-ons for Electron-based
  applications, which are commonly used for desktop applications like Slack,
  Discord, and Visual Studio Code. This technique has been observed in the
  DripLoader malware, which uses unsigned .node files to load malicious native
  code into Electron applications. MITRE ATT&CK: T1129, T1574.001, T1036.005.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*.node"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_signed:
                    value: "false"
                    case_insensitive: true
              - term:
                  data_win_eventdata_signatureStatus:
                    value: "Unavailable"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Code.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*.vscode\\\\extensions\\\\ms-toolsai.jupyter-*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\electron.napi.node"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\node.napi.glibc.node"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed
    - data_win_eventdata_signatureStatus
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*.node'; data_win_eventdata_signed equals 'false';
  data_win_eventdata_signatureStatus equals 'Unavailable', among other
  conditions.

known_false_positives: >
  VsCode extensions or similar legitimate tools might use unsigned .node files.
  These should be investigated on a case-by-case basis, and whitelisted if
  determined to be benign. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.coreycburton.com/blog/driploader-case-study
  - https://github.com/CoreyCBurton/DripLoaderNG
  - https://www.electronjs.org/docs/latest/tutorial/native-code-and-electron
  - https://attack.mitre.org/techniques/T1129/
  - https://attack.mitre.org/techniques/T1574/001/
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    Unsigned .node File Loaded detected on host $agent_name$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. Matched
    data_win_eventdata_signed: $data_win_eventdata_signed$. MITRE ATT&CK: T1129,
    T1574.001, T1036.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_signed
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1129
    - T1574.001
    - T1036.005
  custom_tags:
    - unsigned
    - image_load
    - sysmon
    - execution
    - privilege_escalation
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\.[Nn][Oo][Dd][Ee]/ AND (data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/ OR data_win_eventdata_signatureStatus:/[Uu][Nn][Aa][Vv][Aa][Ii][Ll][Aa][Bb][Ll][Ee]/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_image:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\.[Vv][Ss][Cc][Oo][Dd][Ee]\\[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\\[Mm][Ss]-[Tt][Oo][Oo][Ll][Ss][Aa][Ii]\.[Jj][Uu][Pp][Yy][Tt][Ee][Rr]-.*/ AND (data_win_eventdata_imageLoaded:/.*\\[Ee][Ll][Ee][Cc][Tt][Rr][Oo][Nn]\.[Nn][Aa][Pp][Ii]\.[Nn][Oo][Dd][Ee]/ OR data_win_eventdata_imageLoaded:/.*\\[Nn][Oo][Dd][Ee]\.[Nn][Aa][Pp][Ii]\.[Gg][Ll][Ii][Bb][Cc]\.[Nn][Oo][Dd][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1908fcc1-1b92-4272-8214-0fbaf2fa5163
    name: Malicious DLL File Dropped in the Teams or OneDrive Folder
    reason: 'Precursor drop: the sideloadable native module is first written into a trusted Electron/MS app folder under %LOCALAPPDATA% so the signed app loads it (T1574.001) - the same drop-then-load chain that plants the unsigned .node before this fires.'
  - id: 060d5ad4-3153-47bb-8382-43e5e29eda92
    name: Unsigned Module Loaded by ClickOnce Application
    reason: 'Direct sibling: same EID7 signed=false integrity bypass - an unsigned native module loaded into a trusted application; both convict a trusted signed app executing unverified native code and often co-occur on a compromised host.'
  - id: f26eb764-fd89-464b-85e2-dc4a8e6e77b8
    name: Suspicious Electron Application Child Processes
    reason: 'Primary follow-on: once the unsigned .node runs attacker native code inside Slack/Discord/Teams, the trusted Electron parent spawns cmd/powershell/script hosts - the injected module acting; its own notes flag .asar tampering, the DripLoader class.'
  - id: 5a3164f2-b373-4152-93cf-090b13c12d27
    name: Potentially Suspicious Child Process Of VsCode
    reason: 'Follow-on for the VS Code case this rule explicitly names: a malicious .node loaded into Code.exe makes Code.exe spawn a suspicious child (IEX/rundll32/script host), i.e. the native payload executing from inside the trusted editor.'
  - id: 378a05d8-963c-46c9-bcce-13c7657eac99
    name: Potentially Suspicious Electron Application CommandLine
    reason: Co-occurring abuse of the identical trusted-app set (slack/discord/teams/code) - proxying execution through the signed Electron binary via --utility/--gpu-launcher args; an adjacent native-code-in-a-trusted-app vector the same actor may use.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Sibling in the same EID7 sideloading family: an abusable/unsigned module loaded from a user-writable/suspicious path; widens the host''s module-sideloading footprint around the .node and may reveal the staging directory used.'
  - id: 3e27af56-fcf0-4113-988d-24969b062be7
    name: Windows Executable in Loaded Modules
    reason: 'Structural twin: also EID7 signed=false flagging a non-standard file (a PE/.exe) mapped as a module; confirms whether other unsigned non-DLL modules were loaded on the same host as part of the same loader.'
  - id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
    name: Potential Arbitrary Code Execution Via Node.EXE
    reason: 'Co-occurring Node-runtime weaponization: node.exe spawning a reverse shell via child_process/net.socket - the same actor abusing the Node/Electron native stack for code execution and C2 alongside the unsigned .node load.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Trusted Electron/Chromium app spawning shell or LOLBin child (injected code executing)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Ll][Aa][Cc][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Kk][Ee][Yy][Bb][Aa][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Gg][Ii][Tt][Hh][Uu][Bb][Dd][Ee][Ss][Kk][Tt][Oo][Pp]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll][33][22]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr][33][22]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections from the Electron/Node host process (possible C2 via a trusted app)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ss][Ll][Aa][Cc][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Ll][Ee][Cc][Tt][Rr][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Kk][Ee][Yy][Bb][Aa][Ss][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Other unsigned / signature-unavailable modules loaded from user-writable paths on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/ OR data_win_eventdata_signatureStatus:/[Uu][Nn][Aa][Vv][Aa][Ii][Ll][Aa][Bb][Ll][Ee]/) AND (data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Native .node / app.asar / node_modules files written to disk on this host (the drop)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Nn][Oo][Dd][Ee]/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp]\.[Aa][Ss][Aa][Rr].*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Ss][Aa][Rr]\.[Uu][Nn][Pp][Aa][Cc][Kk][Ee][Dd]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Oo][Dd][Ee]_[Mm][Oo][Dd][Uu][Ll][Ee][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Remote-thread injection or LSASS access sourced from an Electron/Node host on this host
    query: (data_win_system_eventID:"8" AND (data_win_eventdata_sourceImage:/.*\\[Ss][Ll][Aa][Cc][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Ee][Ll][Ee][Cc][Tt][Rr][Oo][Nn]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_sourceImage:/.*\\[Ss][Ll][Aa][Cc][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Ee][Ll][Ee][Cc][Tt][Rr][Oo][Nn]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
