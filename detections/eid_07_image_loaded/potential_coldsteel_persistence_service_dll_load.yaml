name: Potential COLDSTEEL Persistence Service DLL Load
id: 1d7a57da-02e0-4f7f-92b1-c7b486ccfed5
version: 1
schema_version: "1.0"
date: "2023-05-02"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1d7a57da-02e0-4f7f-92b1-c7b486ccfed5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious DLL load by an "svchost" process based on location and
  name that might be related to ColdSteel RAT. This DLL location and name has
  been seen used by ColdSteel as the service DLL for its persistence mechanism.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\AppData\\\\Roaming\\\\newdev.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\svchost.exe'; data_win_eventdata_imageLoaded matches
  '*\AppData\Roaming\newdev.dll'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/cold-steel/NCSC-MAR-Cold-Steel.pdf

response:
  message: >
    Potential COLDSTEEL Persistence Service DLL Load detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - coldsteel
    - persistence
    - service
    - image_load
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Nn][Ee][Ww][Dd][Ee][Vv]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1fea93a2-1524-4a3c-9828-3aa0c2414e27
    name: Potential COLDSTEEL Persistence Service DLL Creation
    reason: 'Direct precursor: writes the exact payload this rule sees loaded (C:\Users\*\AppData\Roaming\newdev.dll). The EID 11 file-drop of newdev.dll must happen before svchost can image-load it.'
  - id: 3ced239c-7285-4b54-99c4-8525b69293f7
    name: COLDSTEEL Persistence Service Creation
    reason: 'Direct precursor: the SCM 7045 that registers the ColdSteel service (msupdate/msupdate2) with ImagePath svchost.exe. This service registration is what makes svchost host and load newdev.dll.'
  - id: 612e47e9-8a59-43a6-b404-f48683f45bd6
    name: ServiceDll Hijack
    reason: 'Direct precursor (mechanism): detects the Services\...\Parameters\ServiceDll registry value being set to a non-System32 DLL. ColdSteel sets ServiceDll to AppData\Roaming\newdev.dll, and svchost reads exactly that value to perform the load this rule observes.'
  - id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
    name: COLDSTEEL RAT Service Persistence Execution
    reason: 'Co-occurring (same instant, different telemetry): svchost.exe spawned with -k msupdate/msupdate2/alg is the very process instance that loads newdev.dll. This is the EID 1 process-creation view of the same load this EID 7 rule catches.'
  - id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
    name: COLDSTEEL RAT Cleanup Command Execution
    reason: 'Tight follow-on: rundll32 spawned by the same ColdSteel persistence svchost (-k msupdate/alg) calling newdev.dll''s own exports (ServiceMain / UpdateDriverForPlugAndPlayDevicesW / DiUninstallDevice) to run cleanup. Same loaded DLL, same hosting svchost.'
  - id: c708a93f-46b4-4674-a5b8-54aa6219c5fa
    name: Potential COLDSTEEL RAT File Indicators
    reason: 'Co-occurring: another ColdSteel on-disk artifact (dllhost.exe dropped in C:\Users\Public\Documents) staged during the same intrusion that planted newdev.dll.'
  - id: 95214813-4c7a-4a50-921b-ee5c538e1d16
    name: Potential COLDSTEEL RAT Windows User Creation
    reason: 'Follow-on: ColdSteel creating its hidden ANONYMOUS/_DOMAINUSER_ local profile (ProfileList registry) that the RAT then runs its payloads under once persistence is established.'
  - id: e01b6eb5-1eb4-4465-a165-85d40d874add
    name: COLDSTEEL RAT Anonymous User Process Execution
    reason: 'Follow-on: processes executed as the ANONYMOUS user (parent in System32/AppData) are the hands-on-keyboard phase after the implant is loaded and the hidden user exists.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: C2 egress from the persistence svchost (network + DNS)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Service registry pointed at a user-writable DLL/ImagePath on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/) AND (data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 6h
  - name: svchost loading any DLL from a user-writable path (ColdSteel variant coverage)
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: rundll32 spawned by svchost calling newdev.dll / ColdSteel exports
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Ww][Dd][Ee][Vv]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Aa][Tt][Ee][Dd][Rr][Ii][Vv][Ee][Rr][Ff][Oo][Rr][Pp][Ll][Uu][Gg][Aa][Nn][Dd][Pp][Ll][Aa][Yy][Dd][Ee][Vv][Ii][Cc][Ee][Ss][Ww].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Dd][Ee][Vv][Ii][Cc][Ee].*/)
    pivot_on:
    - host
    window: 2h
