name: Potential ShellDispatch.DLL Sideloading
id: 844f8eb2-610b-42c8-89a4-47596e089663
version: 1
schema_version: "1.0"
date: "2023-06-20"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 844f8eb2-610b-42c8-89a4-47596e089663
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "ShellDispatch.dll". MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\ShellDispatch.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*:\\\\Windows\\\\Temp\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\ShellDispatch.dll'; data_win_eventdata_imageLoaded matches '*:\Users\*';
  data_win_eventdata_imageLoaded matches '*\AppData\Local\Temp\*', among other
  conditions.

known_false_positives: >
  Some installers may trigger some false positives. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.hexacorn.com/blog/2023/06/07/this-lolbin-doesnt-exist/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential ShellDispatch.DLL Sideloading detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - shelldispatch
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ss][Hh][Ee][Ll][Ll][Dd][Ii][Ss][Pp][Aa][Tt][Cc][Hh]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_imageLoaded AND NOT ((data_win_eventdata_imageLoaded:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/) OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 82343930-652f-43f5-ab70-2ee9fdd6d5e9
    name: Potential ShellDispatch.DLL Functionality Abuse
    reason: The direct EID 1 payoff of this load. ShellDispatch.dll's sole offensive purpose is its RunDll_ShellExecuteW export, which rundll32 invokes to ShellExecute an arbitrary binary; this rule catches that rundll32 command line. A co-fire on the host means the DLL this alert saw being sideloaded was then used to proxy-launch a payload, and it supplies the command line, parent process and user that the image-load event does not carry.
  - id: ee4c5d06-3abc-48cc-8885-77f1c20f4451
    name: DLL Sideloading Of ShellChromeAPI.DLL
    reason: 'Closest sibling: another non-existent ''Shell*'' phantom DLL abused for sideloading, from the same 0gtweet/Hexacorn phantom-LOLBIN research lineage (T1574.001). An actor working through phantom-DLL LOLBINs rarely stops at one; a co-fire on the host shows systematic phantom-DLL hijacking rather than a one-off installer false positive.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Broad companion-sideload detector for other known-abusable DLLs (coreclr, libcef, zipdll, facesdk, HPCustPartUI) loaded from world-writable/staging paths. Intrusions that sideload one DLL usually stage several in the same drop folder, so a co-fire identifies the other sideloaded modules dropped alongside ShellDispatch in the same operation.
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: Same phantom-DLL-hijack class as this rule (its own target list even includes ShellChromeAPI.dll), catching the variant where a non-existent DLL is planted into System32 behind an unsigned / non-Microsoft gate. A co-fire confirms the host is being worked for phantom-DLL load primitives, corroborating this ShellDispatch load as deliberate abuse.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: The generic image-load hunt for any DLL loaded from outside the system directories - the exact mechanism this alert is one instance of. Running it on the host widens the net to any other hijacked or sideloaded module the same actor loaded in the window, catching siblings the single-DLL-name rules miss.
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'The file-write precursor class: an unusual process dropping a .dll into an application dependency folder is how the sideload payload - the planted ShellDispatch.dll beside its hijacked loader EXE - gets staged before this load fires. A prior fire on the host pins the drop that produced this load.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ShellDispatch proxy-execution via rundll32 (RunDll_ShellExecute) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]_[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc][Uu][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll][Dd][Ii][Ss][Pp][Aa][Tt][Cc][Hh]\.[Dd][Ll][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: ShellDispatch.dll payload written to disk on this host (the plant)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ss][Hh][Ee][Ll][Ll][Dd][Ii][Ss][Pp][Aa][Tt][Cc][Hh]\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 6h
  - name: Companion DLLs loaded from Public / ProgramData / Perflogs staging dirs on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: C2 beacon or DNS from a process in a staging dir or from rundll32 on this host
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence written on this host (Run keys, services, IFEO, Winlogon)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/)
    pivot_on:
    - host
    window: 4h
