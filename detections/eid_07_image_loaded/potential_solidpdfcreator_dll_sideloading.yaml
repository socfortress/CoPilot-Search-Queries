name: Potential SolidPDFCreator.DLL Sideloading
id: a2edbce1-95c8-4291-8676-0d45146862b3
version: 1
schema_version: "1.0"
date: "2023-05-07"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a2edbce1-95c8-4291-8676-0d45146862b3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "SolidPDFCreator.dll". MITRE ATT&CK:
  T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\SolidPDFCreator.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_imageLoaded"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\SolidPDFCreator.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files (x86)\\\\SolidDocuments\\\\SolidPDFCreator\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "C:\\\\Program Files\\\\SolidDocuments\\\\SolidPDFCreator\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\SolidPDFCreator.dll'; data_win_eventdata_image matches
  '*\SolidPDFCreator.exe'; data_win_eventdata_imageLoaded matches 'C:\Program
  Files (x86)\SolidDocuments\SolidPDFCreator\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lab52.io/blog/new-mustang-pandas-campaing-against-australia/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential SolidPDFCreator.DLL Sideloading detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - solidpdfcreator
    - sideloading
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff][Cc][Rr][Ee][Aa][Tt][Oo][Rr]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_imageLoaded AND NOT (data_win_eventdata_image:/.*\\[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff][Cc][Rr][Ee][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ss][Oo][Ll][Ii][Dd][Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]\\[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff][Cc][Rr][Ee][Aa][Tt][Oo][Rr]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Oo][Ll][Ii][Dd][Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]\\[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff][Cc][Rr][Ee][Aa][Tt][Oo][Rr]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7806bb49-f653-48d3-a915-5115c1a85234
    name: Potential APT Mustang Panda Activity Against Australian Gov
    reason: 'Same lab52 Australia campaign: the EID1 ''copy SolidPDFCreator.dll'' into C:\Users\Public\Libraries\PhotoTvRHD and the CurrentVersion\Run persistence it sets stage and launch the very DLL this image-load alert catches - the preceding process-creation stage of the identical chain.'
  - id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
    name: Mustang Panda Dropper
    reason: 'Same actor''s delivery stage: the dropper (Temp\wtask.exe /create, ''Security Script'' task, winwsh.exe, %windir%-obfuscated cmd) that writes and schedules the sideload payload before SolidPDFCreator.exe loads the DLL.'
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: PlugX is the backdoor Mustang Panda delivers through exactly this signed-EXE + malicious-DLL sideloading; a hit on the same host (CamMute.exe / chrome_frame_helper.exe run from an uncommon path) indicates the sideloaded DLL is a PlugX loader.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Same technique, broader DLL set, scoped to Users\Public and PerfLogs - the exact user-writable staging folder Mustang Panda drops into - so it surfaces any additional abusable DLL side-loaded from the same location on this host.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'General EID7 search-order-hijack hunt: the same non-standard-path image load that fired this alert also surfaces here, and it reveals the OTHER DLLs this host loaded from outside system32 / Program Files - the full sideloading footprint.'
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: The EID11 file-write precursor of the same technique - a hijack DLL dropped by an unusual parent - pivots to the moment the sideloaded DLL was written to disk shortly before this load.
  - id: b6188d2f-b3c4-4d2c-a17d-9706e0851af0
    name: Potential Goopdate.DLL Sideloading
    reason: Another signed-binary sideload vector (googleupdate.exe + goopdate.dll) in the same China-nexus / RedDelta tradecraft; APTs rarely sideload a single DLL, so confirm whether this host also runs the Goopdate chain.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sideloading host process (SolidPDFCreator.exe) and DLL staging on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff][Cc][Rr][Ee][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff][Cc][Rr][Ee][Aa][Tt][Oo][Rr]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Hh][Oo][Tt][Oo][Tt][Vv][Rr][Hh][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence (Run key / service / Winlogon) set on this host
    query: ((data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\.*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*([Rr][Uu][Nn]|[Pp][Hh][Oo][Tt][Oo][Tt][Vv][Rr][Hh][Dd]|[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff]).*/)
    pivot_on:
    - host
    window: 4h
  - name: PlugX C2 beacon / DNS by a process running from a user-writable path on this host
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff][Cc][Rr][Ee][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ss][Oo][Ll][Ii][Dd][Pp][Dd][Ff][Cc][Rr][Ee][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: Other abnormal DLL loads from user-writable paths on this host
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Archive / LNK delivery and dropper staging preceding the sideload on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz][A-Za-z]*|[Ww][Ii][Nn][Rr][Aa][Rr]|[Rr][Aa][Rr]|[Ee][Xx][Pp][Aa][Nn][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Tt][Aa][Ss][Kk]|[Ww][Ii][Nn][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(\.[Ll][Nn][Kk]|\\[Tt][Ee][Mm][Pp]\\[Ww][Tt][Aa][Ss][Kk]|[Pp][Hh][Oo][Tt][Oo][Tt][Vv][Rr][Hh][Dd]).*/)
    pivot_on:
    - host
    window: 4h
