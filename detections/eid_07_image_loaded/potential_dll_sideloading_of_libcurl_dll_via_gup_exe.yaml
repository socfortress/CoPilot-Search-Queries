name: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
version: 1
schema_version: "1.0"
date: "2023-05-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of "libcurl.dll" by the "gup.exe" process
  from an uncommon location. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\gup.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\libcurl.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Notepad++\\\\updater\\\\GUP.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches '*\gup.exe';
  data_win_eventdata_imageLoaded matches '*\libcurl.dll';
  data_win_eventdata_image matches '*\Notepad++\updater\GUP.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    MITRE ATT&CK: T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - libcurl
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Ll][Ii][Bb][Cc][Uu][Rr][Ll]\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Uu][Pp][Dd][Aa][Tt][Ee][Rr]\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Same EID 7 telemetry, generic view: this hunt flags any image load from a non-system path, so the malicious GUP.exe loading libcurl.dll from outside its Notepad++\updater directory surfaces here as well - an immediate confirm and a pivot to any other hijacked DLLs staged on the host.'
  - id: 976d6e6f-a04b-4900-9713-0134a353e38b
    name: Veeam Backup Servers Credential Dumping Script Execution
    reason: 'Same FIN7-on-Veeam playbook as this rule''s own reference: GUP.exe/libcurl.dll was FIN7''s signed-binary loader and dumping stored Veeam backup credentials via PowerShell was the objective on those compromised servers - both firing on the host reproduces the documented chain.'
  - id: b57ba453-b384-4ab9-9f40-1038086b4e53
    name: VeeamBackup Database Credentials Dump Via Sqlcmd.EXE
    reason: 'The other half of that credential-theft objective: sqlcmd reading [VeeamBackup].[dbo].[Credentials]. A stealth loader like this on a backup server is a precursor to stealing stored infrastructure credentials, typically to enable ransomware spread.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Credential access is the usual goal behind a stealth loader; LSASS access on the same host within the window escalates this sideload from a suspicious signed-binary load to hands-on-keyboard credential theft.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: 'Next-stage proxy execution: after the libcurl loader runs, actors commonly hand off through LOLBins (rundll32/regsvr32/installutil) loading an unsigned DLL - the same signed/unsigned-DLL tradecraft one stage on, on the same host.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Another abused-DLL sideload from a user-writable location on the same host. Intrusion toolkits (FIN7 included) stage multiple hijack pairs, so a second sideload-from-suspicious-path hit corroborates deliberate staging rather than a benign one-off.
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'The on-disk precursor: a delivery/LOLBin process writing a hijack .dll into an application dependency folder is how a sideload like this is staged before the load - the drop that precedes GUP.exe pulling libcurl.dll.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GUP.exe outbound network connections and DNS (libcurl loader C2)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: GUP.exe process lineage - unusual parent or spawned children
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Sideload pair staged on disk - libcurl.dll or GUP.exe written on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ll][Ii][Bb][Cc][Uu][Rr][Ll]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Credential theft - LSASS access and Veeam credential-store dumping
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*\[[Vv][Ee][Ee][Aa][Mm][Bb][Aa][Cc][Kk][Uu][Pp]\].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm]\.[Bb][Aa][Cc][Kk][Uu][Pp].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Next-stage download / signed-binary-proxy execution on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/))
    pivot_on:
    - host
    window: 2h
