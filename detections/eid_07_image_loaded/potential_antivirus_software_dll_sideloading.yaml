correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: 'Corroborates the SAME EID 7 load from a broader angle: it flags any DLL loaded from a non-standard directory (outside system32/syswow64/winsxs/wbem) and explicitly cross-references hijacklibs.net, the very source this rule cites. A co-hit on the same host/time confirms the AV DLL was loaded out-of-tree rather than from its real install path.'
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'The broad sibling of this rule over the same EID 7 image-load telemetry: it detects known-abusable DLLs loaded from suspicious locations. It will frequently fire on the very same anomalous load, raising confidence that this is real sideloading and not a benign AV path.'
  - id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
    name: Potential Initial Access via DLL Search Order Hijacking
    reason: 'Precursor on the write side: it catches a DLL being created in an application''s dependency folder by an unusual process - i.e. the attacker planting the sideload DLL on disk. A hit on this host just before the load is the staging step that set up this image-load.'
  - id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
    name: Third Party Software DLL Sideloading
    reason: The direct analog of this rule for non-AV named software (Zoom, Discord, etc.). A co-hit on the same host means the actor is abusing several vendors' trusted binaries for sideloading, evidence of a deliberate sideloading operation rather than a one-off false positive.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Follow-on credential access through the same EID 7 image-load lens: once code runs inside a trusted/signed AV process, loading an unsigned module into LSASS to harvest credentials is a classic next move. A co-hit escalates a sideload foothold into active credential theft.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Follow-on objective of the foothold: EID 10 process access to lsass.exe with dump-tool call traces and access masks (Mimikatz/NanoDump/Procdump). Seeing it on the same host shortly after the sideload is the credential-theft payoff the trusted execution was obtained for.'
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: 'Thematically tight defense-evasion follow-on: an actor already abusing AV-vendor binaries commonly moves to uninstall or terminate the real security product. A co-hit on this host signals the defenders are being actively torn down around the same sideload.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sideloaded AV-vendor DLL being written to disk on this host (the drop that staged this load)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Ll][Oo][Gg]|[Qq][Rr][Tt]|[Aa][Ss][Hh][Ll][Dd][Rr][Ee][Ss]|[Ll][Oo][Cc][Kk][Dd][Oo][Ww][Nn]|[Vv][Ss][Oo][Dd][Ss][Cc][Pp][Ll]|[Vv][Ff][Tt][Rr][Aa][Cc][Ee]|[Ww][Ss][Cc]|[Tt][Mm][Dd][Bb][Gg][Ll][Oo][Gg]|[Dd][Ll][Pp][Pp][Rr][Ee][Mm]32)\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connection from a process running out of a user-writable directory (sideload host-binary beaconing)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential theft against LSASS on this host (objective of the trusted foothold)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Real security product being disabled, uninstalled or killed on this host (defense-evasion follow-on)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|[Dd][Ee][Ll][Ee][Tt][Ee]|[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]|[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll]|[Rr][Ee][Mm][Oo][Vv][Ee]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]).*/ AND data_win_eventdata_commandLine:/.*([Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]|[Mm][Cc][Aa][Ff][Ee][Ee]|[Ss][Yy][Mm][Aa][Nn][Tt][Ee][Cc]|[Ss][Ee][Nn][Ss][Ee]|[Aa][Vv][Aa][Ss][Tt]|[Aa][Vv][Gg]|[Ee][Ss][Ee][Tt]|[Ss][Oo][Pp][Hh][Oo][Ss]|[Cc][Rr][Oo][Ww][Dd][Ss][Tt][Rr][Ii][Kk][Ee]|[Ff]-[Ss][Ee][Cc][Uu][Rr][Ee]|[Tt][Rr][Ee][Nn][Dd]|[Bb][Ii][Tt][Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]|[Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]).*/)
    pivot_on:
    - host
    window: 2h
