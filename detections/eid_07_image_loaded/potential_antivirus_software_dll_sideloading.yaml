name: Potential Antivirus Software DLL Sideloading
id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading of DLLs that are part of antivirus software
  suchas McAfee, Symantec...etc. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\log.dll"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_imageLoaded"
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files\\\\Bitdefender Antivirus Free\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files (x86)\\\\Bitdefender Antivirus Free\\\\*"
                                      case_insensitive: true
                                - bool:
                                    must:
                                      - term:
                                          data_win_eventdata_image:
                                            value: "C:\\Program Files\\Dell\\SARemediation\\audit\\TelemetryUtility.exe"
                                            case_insensitive: true
                                      - bool:
                                          should:
                                            - term:
                                                data_win_eventdata_imageLoaded:
                                                  value: "C:\\Program Files\\Dell\\SARemediation\\plugin\\log.dll"
                                                  case_insensitive: true
                                            - term:
                                                data_win_eventdata_imageLoaded:
                                                  value: "C:\\Program Files\\Dell\\SARemediation\\audit\\log.dll"
                                                  case_insensitive: true
                                          minimum_should_match: 1
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files\\\\Canon\\\\MyPrinter\\\\*"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\Program Files\\AVAST Software\\Avast\\log.dll"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\Program Files (x86)\\AVAST Software\\Avast\\log.dll"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\Program Files\\AVG\\Antivirus\\log.dll"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\Program Files (x86)\\AVG\\Antivirus\\log.dll"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\qrt.dll"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_imageLoaded"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files\\\\F-Secure\\\\Anti-Virus\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files (x86)\\\\F-Secure\\\\Anti-Virus\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\ashldres.dll"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\lockdown.dll"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_imageLoaded:
                                value: "*\\\\vsodscpl.dll"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_imageLoaded"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files\\\\McAfee\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files (x86)\\\\McAfee\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\vftrace.dll"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_imageLoaded"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files\\\\CyberArk\\\\Endpoint Privilege Manager\\\\Agent\\\\x32\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files (x86)\\\\CyberArk\\\\Endpoint Privilege Manager\\\\Agent\\\\x32\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\wsc.dll"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_imageLoaded"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\program Files\\\\AVAST Software\\\\Avast\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\program Files (x86)\\\\AVAST Software\\\\Avast\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files\\\\AVG\\\\Antivirus\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\Program Files (x86)\\\\AVG\\\\Antivirus\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\tmdbglog.dll"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_imageLoaded"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\program Files\\\\Trend Micro\\\\Titanium\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\program Files (x86)\\\\Trend Micro\\\\Titanium\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_imageLoaded:
                          value: "*\\\\DLPPREM32.dll"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_imageLoaded"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\program Files\\\\ESET*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_imageLoaded:
                                      value: "C:\\\\program Files (x86)\\\\ESET*"
                                      case_insensitive: true
                              minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  '*\log.dll'; data_win_eventdata_imageLoaded matches 'C:\Program
  Files\Bitdefender Antivirus Free\*'; data_win_eventdata_imageLoaded matches
  'C:\Program Files (x86)\Bitdefender Antivirus Free\*', among other conditions.

known_false_positives: >
  Applications that load the same dlls mentioned in the detection section.
  Investigate them and filter them out if a lot FPs are caused.. Dell
  SARemediation plugin folder (C:\Program
  Files\Dell\SARemediation\plugin\log.dll) is known to contain the 'log.dll'
  file.. The Canon MyPrinter folder 'C:\Program Files\Canon\MyPrinter\' is known
  to contain the 'log.dll' file. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://hijacklibs.net/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential Antivirus Software DLL Sideloading detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

