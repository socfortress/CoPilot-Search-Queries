name: Potential DLL Sideloading Via comctl32.dll
id: 6360757a-d460-456c-8b13-74cf0e60cceb
version: 1
schema_version: "1.0"
date: "2022-12-19"
author: Nasreddine Bencherchali (Nextron Systems), Subhash Popuri (@pbssubhash)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6360757a-d460-456c-8b13-74cf0e60cceb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL sideloading using comctl32.dll to obtain system
  privileges. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\Windows\\\\System32\\\\logonUI.exe.local\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\Windows\\\\System32\\\\werFault.exe.local\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\Windows\\\\System32\\\\consent.exe.local\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\Windows\\\\System32\\\\narrator.exe.local\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_imageLoaded:
                    value: "C:\\\\windows\\\\system32\\\\wermgr.exe.local\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\comctl32.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_image
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_imageLoaded matches
  'C:\Windows\System32\logonUI.exe.local\*'; data_win_eventdata_imageLoaded
  matches 'C:\Windows\System32\werFault.exe.local\*';
  data_win_eventdata_imageLoaded matches
  'C:\Windows\System32\consent.exe.local\*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/binderlabs/DirCreate2System
  - https://github.com/sailay1996/awesome_windows_logical_bugs/blob/60cbb23a801f4c3195deac1cc46df27c225c3d07/dir_create2system.txt
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Via comctl32.dll detected on host $agent_name$.
    Matched data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_imageLoaded
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - comctl32
    - image_load
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Oo][Gg][Oo][Nn][Uu][Ii]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll]\\.*/) AND data_win_eventdata_imageLoaded:/.*\\[Cc][Oo][Mm][Cc][Tt][Ll]32\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62ed5b55-f991-406a-85d9-e8e8fdf18789
    name: UAC Bypass Using Consent and Comctl32 - File
    reason: 'Direct precursor and the same UACMe #22 technique caught at its plant stage: the EID 11 creation of the malicious comctl32.dll inside the consent.exe DotLocal redirection folder. A co-fire on the same host shortly before this image load confirms the attacker planted the very DLL this rule caught being loaded.'
  - id: 1ca6bd18-0ba0-44ca-851c-92ed89a61085
    name: UAC Bypass Using Consent and Comctl32 - Process
    reason: 'The process-level outcome of the exact same consent.exe+comctl32 trick: consent.exe spawning a High/SYSTEM-integrity werfault.exe after loading the planted DLL. Firing alongside this image-load rule proves the sideload actually elevated, not merely loaded.'
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: Akagi is the UACMe binary that implements method 22 (Consent + Comctl32) used by this detection. Its EID 1 launch on the host identifies the operator and confirms the bypass is UACMe-driven rather than an incidental comctl32 load.
  - id: a5ea83a7-05a5-44c1-be2e-addccbbd8c03
    name: UAC Bypass With Fake DLL
    reason: 'Same class in the same EID 7 image-load surface: an auto-elevating binary (dism.exe) loading a dropped fake DLL (dismcore.dll). An operator cycling UACMe DLL-planting methods often tries several, so a co-fire shows which auto-elevate + planted-DLL paths were attempted on the host.'
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: 'Sibling phantom/sideload-DLL privilege-escalation in the same EID 7 surface: an unsigned, non-Microsoft DLL loaded for a System32 binary (including wermgr''s offdmpsvc.dll). Catches the same actor''s other System32 DLL-hijack primitives beyond the comctl32/.local one.'
  - id: 9ed5959a-c43c-4c59-84e3-d28628429456
    name: UAC Bypass Using Iscsicpl - ImageLoad
    reason: Another DLL-search-order-hijack UAC bypass through a trusted binary (iscsicpl.exe loading iscsiexe.dll from a user-controlled path), same EID 7 image-load class. A co-fire signals the operator is probing multiple auto-elevate DLL-hijack bypasses on this host.
  - id: 396f6630-f3ac-44e3-bfc8-1b161bc00c4e
    name: Suspicious Child Process Of Wermgr.EXE
    reason: 'Direct follow-on for the wermgr.exe variant: wermgr.exe is one of the five hijacked auto-elevators here, so an anomalous cmd/powershell/whoami child of it is the sideloaded comctl32 payload executing with the won SYSTEM integrity. It even shares the DirCreate2System reference with this rule.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'The canonical next action once SYSTEM is won: a high-rights (e.g. 0x1fffff) EID 10 process-access handle opened to lsass.exe for credential theft. On the host right after this escalation it marks the pivot from privilege escalation to credential access.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DotLocal (.exe.local) redirection folder populated or comctl32.dll planted under System32 on this host
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*\\[Cc][Oo][Mm][Cc][Tt][Ll]32\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt]\.[Ee][Xx][Ee]\.\@.*/))
    pivot_on:
    - host
    window: 2h
  - name: Child processes of the auto-elevated binaries abused by this sideload (payload executing as SYSTEM)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ll][Oo][Gg][Oo][Nn][Uu][Ii]\.[Ee][Xx][Ee]|[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]|[Cc][Oo][Nn][Ss][Ee][Nn][Tt]\.[Ee][Xx][Ee]|[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]|[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Any image loaded from a DotLocal (.exe.local) redirection folder on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\.[Ee][Xx][Ee]\.[Ll][Oo][Cc][Aa][Ll]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential access or memory dump on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1410.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]143[Aa].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1010.*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/))
    pivot_on:
    - host
    window: 1h
  - name: New service or scheduled-task persistence created on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/ OR (data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/))
    pivot_on:
    - host
    window: 4h
