name: WMI Persistence - Command Line Event Consumer
id: 05936ce2-ee05-4dae-9d03-9a391cf2d2c6
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 05936ce2-ee05-4dae-9d03-9a391cf2d2c6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects WMI command line event consumers. MITRE ATT&CK: T1546.003.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\Windows\\System32\\wbem\\WmiPrvSE.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\wbemcons.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image equals
  'C:\Windows\System32\wbem\WmiPrvSE.exe'; data_win_eventdata_imageLoaded
  matches '*\wbemcons.dll'.

known_false_positives: >
  Unknown (data set is too small; further testing needed). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    WMI Persistence - Command Line Event Consumer detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1546.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - persistence
    - consumer
    - image_load
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Ww][Bb][Ee][Mm][Cc][Oo][Nn][Ss]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ec1d5e28-8f3b-4188-a6f8-6e8df81dc28e
    name: WMI Persistence - Script Event Consumer
    reason: Sibling WMI permanent-subscription consumer type (ActiveScriptEventConsumer via scrcons.exe); attackers often deploy both consumer kinds from one MOF/script, so co-occurrence confirms a WMI backdoor.
  - id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
    name: WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load
    reason: Image-load counterpart for the script consumer (scrcons.exe loading scripting DLLs); same persistence mechanism, different consumer class.
  - id: 0f06a3a5-6a09-413f-8743-e6cf35561297
    name: WMI Event Subscription
    reason: Sysmon EID 19/20/21 records the filter/consumer/binding creation that precedes WmiPrvSE loading wbemcons.dll; direct precursor evidence of the subscription.
  - id: windows-wmi-permanent-event-subscription-001
    name: Windows WMI Permanent Event Subscription
    reason: Detects creation of the permanent EventFilter/Consumer/Binding that causes wbemcons.dll to load when the filter fires.
  - id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
    name: Suspicious Scripting in a WMI Consumer
    reason: Inspects the consumer payload itself for scripting/command content; confirms the subscription is malicious rather than benign management.
  - id: 1dd05363-104e-4b4a-b963-196a534b03a1
    name: Potential Suspicious Mofcomp Execution
    reason: mofcomp.exe compiling a MOF is the classic way to install the consumer registered just before this image load.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: When the consumer fires, the CommandLineEventConsumer payload runs as a child of WmiPrvSE.exe; this is the execution follow-on.
  - id: d21374ff-f574-44a7-9998-4a8c8bf33d7d
    name: WmiPrvSE Spawned A Process
    reason: Generic detection of the payload process launched by the consumer from WmiPrvSE.exe.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by WmiPrvSE (consumer payload execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: WMI subscription creation tooling (mofcomp, wmic, PowerShell CIM/WMI)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Oo][Ff][Cc][Oo][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc]ommand[Ll]ine[Ee]vent[Cc]onsumer|__[Ee]vent[Ff]ilter|__[Ff]ilter[Tt]o[Cc]onsumer[Bb]inding|[Ss]et-[Ww]mi[Ii]nstance|[Nn]ew-[Cc]im[Ii]nstance|[Aa]ctive[Ss]cript[Ee]vent[Cc]onsumer).*/)
    pivot_on:
    - host
    window: 2h
  - name: WMI event filter/consumer/binding records (Sysmon 19/20/21)
    query: (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21")
    pivot_on:
    - host
    window: 6h
  - name: MOF or script payload files dropped before subscription
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Mm][Oo][Ff]|[Pp][Ss]1|[Vv][Bb][Ss]|[Bb][Aa][Tt]|[Jj][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Network connections from WmiPrvSE or its payload (C2 / staging)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
