name: APT PRIVATELOG Image Load Pattern
id: 33a2d1dd-f3b0-40bd-8baf-7974468927cc
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 33a2d1dd-f3b0-40bd-8baf-7974468927cc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an image load pattern as seen when a tool named PRIVATELOG is used and
  rarely observed under legitimate circumstances. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 7 - Image Loaded

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "7"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_imageLoaded:
              value: "*\\\\clfsw32.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_imageLoaded
    - data_win_eventdata_signed

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 7 (image loaded) enabled in the Sysmon configuration
  (image load logging is high-volume and off in many baselines) and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches
  '*\svchost.exe'; data_win_eventdata_imageLoaded matches '*\clfsw32.dll'.

known_false_positives: >
  Rarely observed. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20210901184449/https://www.fireeye.com/blog/threat-research/2021/09/unknown-actor-using-clfs-log-files-for-stealth.html
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    APT PRIVATELOG Image Load Pattern detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_imageLoaded: $data_win_eventdata_imageLoaded$. MITRE
    ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_imageLoaded
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - privatelog
    - image
    - pattern
    - image_load
    - sysmon
    - privilege_escalation
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Cc][Ll][Ff][Ss][Ww]32\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fb4e2211-6d08-426b-8e6f-0d4a161e3b1d
    name: Clfs.SYS Loaded By Process Located In a Potential Suspicious Location
    reason: Both abuse the Common Log File System. This rule catches the clfs.sys kernel driver loaded by a process running from a user-writable path (CLFS LPE-exploit staging / payload interaction); PRIVATELOG hides its AES-encrypted second stage inside a CLFS .blf log and reads it via clfsw32.dll. A clfs.sys hit on the same host is the broader CLFS tradecraft sitting beside this svchost loader.
  - id: 79c7d1fc-64c7-91be-a616-ccda752efe81
    name: Windows DLL Search Order Hijacking Hunt with Sysmon
    reason: PRIVATELOG is an unregistered DLL delivered via DLL search-order hijacking into a trusted process. The malicious DLL that plants the loader into the svchost context surfaces here as an EID 7 load from a non-standard directory - the delivery step that precedes this svchost-loads-clfsw32.dll pattern.
  - id: 174afcfa-6e40-4ae9-af64-496546389294
    name: Credential Dumping Attempt Via Svchost
    reason: EID 10 handle opened against svchost.exe with injection-grade rights (0x143a) from a non-services.exe source. PRIVATELOG executes inside svchost; a tool opening svchost memory with VM_WRITE/CREATE_THREAD bits is the same service-host abuse - either the injection that seeds the loader or the actor's follow-on credential theft from the service host.
  - id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
    name: Suspicious Svchost Process Access
    reason: Full-access (0x1F3FFF) handle to svchost from an UNKNOWN (unbacked / manually-mapped) call stack. PRIVATELOG runs from injected, reflectively-loaded memory inside the service host; a sibling unbacked-memory handle to svchost corroborates in-memory code operating within svchost alongside this image-load pattern.
  - id: 16c37b52-b141-42a5-a3ea-bbe098444397
    name: Suspect Svchost Activity
    reason: svchost.exe spawned with no command-line arguments - the textbook sign that a malicious process created a sacrificial svchost purely to inject code into it (the rule itself cites T1055). If the actor stood up such a svchost to host the PRIVATELOG loader, it fires just before this clfsw32.dll load on the same host.
  - id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
    name: Uncommon Svchost Parent Process
    reason: svchost.exe whose parent is not services.exe - a provenance anomaly indicating an injected or masqueraded service host rather than a legitimately service-launched one. The abnormal svchost instance that hosts PRIVATELOG would trip this at process creation, pinpointing exactly which svchost to pull apart.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: svchost loading the CLFS API or DLLs from user-writable paths on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Cc][Ll][Ff][Ss][Ww]32\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Ll][Ff][Ss]\.[Ss][Yy][Ss]/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: svchost loading an unsigned image on this host
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_signed:/.*[Ff][Aa][Ll][Ss][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: Code injection into svchost on this host (remote thread or injection-grade handle)
    query: (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Bb]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]0[Cc]38/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff]3[Ff][Ff][Ff]/))
    pivot_on:
    - host
    window: 1h
  - name: CLFS .blf payload container created in an unusual location on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Bb][Ll][Ff]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on:
    - host
    window: 24h
  - name: Credential access against LSASS on this host (PRIVATELOG second-stage goal)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1[Ff][0-9A-Fa-f][Ff][Ff][Ff]/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]1010/)) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 2h
