name: Sysmon Configuration Change
id: 8ac03a65-6c84-4116-acad-dc1558ff7a77
version: 1
schema_version: "1.0"
date: "2022-01-12"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8ac03a65-6c84-4116-acad-dc1558ff7a77
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a Sysmon configuration change, which could be the result of a
  legitimate reconfiguration or someone trying manipulate the configuration.

data_source:
  - Sysmon Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "16"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon installed with a configuration that enables the relevant event
  type and the Microsoft-Windows-Sysmon/Operational channel collected by the
  Wazuh agent (eventchannel localfile entry in ossec.conf). The detection looks
  for events where data_win_system_eventID equals '16'.

known_false_positives: >
  Legitimate administrative action. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon

response:
  message: >
    Sysmon Configuration Change detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - sysmon
    - configuration
    - change
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"16"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: The EID 1 'sysmon -c' process that is the proximate CAUSE of this EID 16 - an attacker swapping in a bare-bones config to stop monitoring without stopping the service. Pairing the two confirms a deliberate reconfiguration rather than a benign push.
  - id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
    name: Uninstall Sysinternals Sysmon
    reason: Full removal of Sysmon is the escalated form of the same objective (kill the sensor). A live config change frequently precedes or accompanies tearing the sensor out entirely on the same host.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Unloading the SysmonDrv filter driver blinds Sysmon by a second mechanism; seen alongside config tampering in the same sensor-evasion sequence, often as the quicker alternative to reconfiguring.
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: A registry edit of the driver altitude makes Sysmon fail to load at the next boot - a persistent follow-on to a live config change that ensures the sensor stays blind after reboot.
  - id: 18beca67-ab3e-4ee3-ba7a-a46ca8d7d0cc
    name: Sysmon Channel Reference Deletion
    reason: Tampering with the Sysmon manifest / event-channel reference to disable it - a co-occurring anti-forensic step aimed at the exact same sensor whose config just changed.
  - id: d29ada0f-af45-4f27-8f32-f7b77c3dbc4e
    name: HackTool - SysmonEnte Execution
    reason: SysmonEnte is purpose-built to attack Sysmon's integrity; its EID 10 access to the Sysmon process on the same host corroborates that the config change is deliberate sabotage, not administration.
  - id: 37db85d1-b089-490a-a59a-c7b6f984f480
    name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
    reason: findstr for the default altitude '385201' is the recon that LOCATES Sysmon (even when renamed) before tampering - the likely precursor that, firing just before this EID 16, shows targeting of the sensor.
  - id: bf4fc428-dcc3-4bbd-99fe-2422aeee2544
    name: ETW Logging Disabled In .NET Processes - Sysmon Registry
    reason: Disabling ETW providers strips the upstream telemetry Sysmon and other sensors relay; the same 'blind the pipeline' intent reached via a parallel registry route, commonly bundled with Sysmon reconfiguration.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon sensor tampering process on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]6?4?\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/ OR (data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*/ AND data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|[Dd][Ee][Ll][Ee][Tt][Ee]|[Cc][Oo][Nn][Ff][Ii][Gg]|[Uu][Nn][Ll][Oo][Aa][Dd]|[Rr][Ee][Mm][Oo][Vv][Ee]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Security-tool, Defender and event-log tampering on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell ScriptBlock defense-evasion content on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Tt][Ww][Ee][Vv][Ee][Nn][Tt][Ww][Rr][Ii][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Follow-on LOLBin / signed-binary proxy execution on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Credential-dump tooling and LSASS process access on this host
    query: ((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))
    pivot_on:
    - host
    window: 1h
