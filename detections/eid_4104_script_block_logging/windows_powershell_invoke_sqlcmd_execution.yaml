name: Windows PowerShell Invoke-Sqlcmd Execution
id: 5eb76fe2-a869-4865-8c4c-8cff424b18a1
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects potentially suspicious usage of the Invoke-Sqlcmd PowerShell cmdlet
  combined with high-risk parameters or query patterns indicating unauthorized
  database access, data theft, or malicious database operations. Detection covers
  xp_cmdshell abuse, remote file input via URL, system principal enumeration,
  certificate validation bypass, dedicated administrator connections, and
  sp_configure abuse. Threat actors prefer PowerShell Invoke-Sqlcmd over sqlcmd.exe
  for its flexible programmatic interface and potential to evade detection.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-Sqlcmd*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*xp_cmdshell*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*sys.server_principals*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*TrustServerCertificate*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*DedicatedAdministratorConnection*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*sp_configure*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*sp_oacreate*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*openrowset*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*sp_addsrvrolemember*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*inputfile*http*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Database administrators and developers frequently use Invoke-Sqlcmd for
  legitimate database management tasks. Establish a whitelist of known
  administrator accounts and approved script paths. Baseline normal PowerShell
  database interaction patterns and tune thresholds accordingly.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1059/003/
  - https://learn.microsoft.com/en-us/powershell/module/sqlserver/invoke-sqlcmd

response:
  message: >
    Suspicious PowerShell Invoke-Sqlcmd execution detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001, T1059.003
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - SQL Server Abuse
    - GhostRedirector IIS Module and Rungan Backdoor
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1059.003
  custom_tags:
    - invoke_sqlcmd
    - sql_abuse
    - xp_cmdshell
    - database_attack
    - data_exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Invoke-Sqlcmd.*/ AND (data_win_eventdata_scriptBlockText:/.*xp_cmdshell.*/ OR data_win_eventdata_scriptBlockText:/.*sys\.server_principals.*/ OR data_win_eventdata_scriptBlockText:/.*TrustServerCertificate.*/ OR data_win_eventdata_scriptBlockText:/.*DedicatedAdministratorConnection.*/ OR data_win_eventdata_scriptBlockText:/.*inputfile.*https?:\/\/.*/ OR data_win_eventdata_scriptBlockText:/.*sp_configure.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: 'Server-side half of the same xp_cmdshell abuse: the Invoke-Sqlcmd script block is the client, this fires in the MSSQL application log when the command actually runs on the server.'
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: Invoke-Sqlcmd with sp_configure is how xp_cmdshell gets enabled; this confirms the option was actually flipped on the SQL instance.
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: 'Direct follow-on of xp_cmdshell/sp_oacreate: sqlservr.exe spawning cmd/powershell/certutil is the OS-command result of the SQL abuse.'
  - id: 08200f85-2678-463e-9c32-88dce2f073d1
    name: MSSQL Add Account To Sysadmin Role
    reason: sp_addsrvrolemember and sys.server_principals enumeration in the script block precede privilege escalation to sysadmin; this confirms it succeeded.
  - id: a746c9b8-a2fb-4ee5-a428-92bee9e99060
    name: SQL Client Tools PowerShell Session Detection
    reason: Process-level view of the same PowerShell session using SQL client modules/tools, tying the script block to the spawning process and parent.
  - id: c615d676-f655-46b9-b913-78729021e5d7
    name: Data Export From MSSQL Table Via BCP.EXE
    reason: Alternative bulk-export tooling attackers use alongside Invoke-Sqlcmd to stage database contents for theft.
  - id: 2f47f1fd-0901-466e-a770-3b7092834a1b
    name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
    reason: Same database-dump-via-SQL-client behaviour via sqlcmd.exe; ransomware operators swap tools to evade, so co-occurrence indicates data theft before encryption.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Invoke-Sqlcmd abuse is usually launched from a staged encoded PowerShell loader; this identifies the parent execution.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SQL Server spawning OS command interpreters (xp_cmdshell result)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|\\[Ww][Hh][Oo][Aa][Mm][Ii]|\\[Nn][Ee][Tt]1?)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other SQL tooling or SQL-module script blocks on this host
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*sp_configure* OR data_win_eventdata_scriptBlockText:*sp_oacreate* OR data_win_eventdata_scriptBlockText:*openrowset* OR data_win_eventdata_scriptBlockText:*sp_addsrvrolemember* OR data_win_eventdata_scriptBlockText:*System.Data.SqlClient*)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*sqlcmd* OR data_win_eventdata_commandLine:*bcp\ * OR data_win_eventdata_commandLine:*osql*))
    pivot_on:
    - host
    window: 2h
  - name: Staging and archiving of database exports
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Bb][Aa][Kk]|[Mm][Dd][Ff]|[Ss][Qq][Ll]|[Cc][Ss][Vv]|[Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr])/
    pivot_on:
    - host
    window: 2h
  - name: Outbound network from PowerShell or SQL processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]|\\[Ss][Qq][Ll][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
  - name: Remote SQL logons or lateral access to this host
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    - user
    window: 4h
