name: PowerShell Create Local User
id: 243de76f-4725-4f2e-8225-a8a69b15ad61
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: "@ROxPinTeddy"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 243de76f-4725-4f2e-8225-a8a69b15ad61
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a local user via PowerShell. MITRE ATT&CK: T1059.001,
  T1136.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-LocalUser*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-LocalUser*'.

known_false_positives: >
  Legitimate user creation. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1136.001/T1136.001.md
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1136/001/

response:
  message: >
    PowerShell Create Local User detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001, T1136.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1136.001
  custom_tags:
    - powershell
    - create
    - local
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: 'Same objective via net.exe: attackers often try both New-LocalUser and ''net user /add'' when creating a backdoor admin account.'
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Parallel or fallback account-creation method on the same host; confirms intent to create a persistent local account.
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: 'Direct follow-on: a newly created local user is typically added to Administrators (Add-LocalGroupMember or net localgroup) to be useful as a backdoor.'
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: 'Follow-on: the new account is granted RDP logon rights so the attacker can return interactively.'
  - id: 460479f3-80b7-42da-9c43-2cc1d54dbccd
    name: Creation of a Local Hidden User Account by Registry
    reason: Attackers hide the freshly created account from the logon screen/user lists via registry manipulation.
  - id: f8aebc67-a56d-4ec9-9fbe-7b0e8b7b4efd
    name: Hiding User Account Via SpecialAccounts Registry Key
    reason: SpecialAccounts UserList value set to 0 hides the account just created by New-LocalUser, a classic persistence-stealth pairing.
  - id: 2e891cbe-0426-11ec-9c9c-acde48001122
    name: Get-LocalUser with PowerShell Script Block
    reason: 'Typical precursor: the same script enumerates existing local users before creating a new one or to verify the result.'
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: Enabling RDP/changing its settings commonly accompanies creating a new local account for remote access.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: New local user added to Administrators / RDP groups via PowerShell script block
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp] [Uu][Ss][Ee][Rr][Ss].*/)
    pivot_on:
    - host
    window: 6h
  - name: Account creation and group-membership security events on host
    query: data_win_system_eventID:("4720" OR "4722" OR "4724" OR "4732" OR "4738" OR "4756")
    pivot_on:
    - host
    window: 6h
  - name: net.exe account creation / admin-group commands on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*(user|localgroup).*([Aa][Dd][Dd]|[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Registry changes hiding accounts or enabling RDP on host
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Ss][Pp][Ee][Cc][Ii][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr].*/)
    pivot_on:
    - host
    window: 6h
  - name: Logons by newly created account (RDP/network) on host
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"2")
    pivot_on:
    - host
    window: 6h
