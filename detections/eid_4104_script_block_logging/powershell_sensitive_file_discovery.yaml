name: Powershell Sensitive File Discovery
id: 7d416556-6502-45b2-9bad-9d2f05f38997
version: 1
schema_version: "1.0"
date: "2022-09-16"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7d416556-6502-45b2-9bad-9d2f05f38997
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect adversaries enumerate sensitive files. MITRE ATT&CK: T1083.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*ls*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*get-childitem*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*gci*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-recurse*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.pass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.kdbx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.kdb*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*ls*';
  data_win_eventdata_scriptBlockText matches '*get-childitem*';
  data_win_eventdata_scriptBlockText matches '*gci*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/malmoeb/status/1570814999370801158
  - https://attack.mitre.org/techniques/T1083/

response:
  message: >
    Powershell Sensitive File Discovery detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1083
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1083
  custom_tags:
    - powershell
    - sensitive
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Cc][Ii].*/) AND data_win_eventdata_scriptBlockText:/.*-[Rr][Ee][Cc][Uu][Rr][Ss][Ee].*/ AND (data_win_eventdata_scriptBlockText:/.*\.[Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Kk][Dd][Bb][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Kk][Dd][Bb].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 162e69a7-7981-4344-84a9-0f1c9a217a52
    name: Powershell Directory Enumeration
    reason: Sibling PowerShell 4104 file/directory enumeration; same operator sweeping the filesystem before or after the credential-file hunt
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Browser credential store access is the parallel secret-harvest step once password files are located
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: Broader scripted collection of files on the host, the staging phase that follows locating sensitive files
  - id: b7a3c9a3-09ea-4934-8864-6a32cacd98d9
    name: Zip A Folder With PowerShell For Staging In Temp - PowerShell Script
    reason: Compress-Archive of discovered folders into Temp is the typical staging step after finding .kdbx/password files
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: PowerShell archiving of collected data prepares the located password files for exfiltration
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: Credential Manager dumping complements file-based secret hunting for the same credential-theft objective
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: Invoke-RestMethod upload is the likely exfiltration of the located vault/password files
  - id: 77564cc2-7382-438b-a7f6-395c2ae53b9a
    name: Remote Thread Created In KeePass.EXE
    reason: Remote thread into KeePass.exe shows the attacker moving from finding .kdbx files to extracting their contents
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive/compress of collected files (staging)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Zz][Ii][Pp][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Ff][Rr][Oo][Mm][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm].[Ii][Oo].[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Password manager / credential file reads or copies
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Kk][Dd][Bb][Xx]?/ OR data_win_eventdata_targetFilename:/.*[Ll]ogin [Dd]ata.*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Kk][Dd][Bb][Xx]?.*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Ee][Pp][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Script-block upload or download of data (exfil/ingress)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt].[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound transfer tools launched after file hunt
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\(curl|rclone|megacmd|pscp|winscp|ftp)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(rclone|mega\.nz|transfer\.sh|anonfiles|pastebin).*/)
    pivot_on:
    - host
    window: 4h
  - name: Network connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\[Pp]ower[Ss]hell\.[Ee][Xx][Ee]|.*\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
