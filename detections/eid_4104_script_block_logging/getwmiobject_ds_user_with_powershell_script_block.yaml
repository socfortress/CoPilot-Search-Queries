name: Get-WmiObject Ds_User with PowerShell Script Block
id: fabd364e-04f3-11ec-b34b-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-WmiObject` cmdlet with the 
  `DS_User` class parameter via PowerShell Script Block Logging (EventID 4104). It 
  leverages logs to identify attempts to query all domain users using WMI. This activity 
  is significant as it may indicate an adversary or Red Team operation attempting to 
  enumerate domain users for situational awareness and Active Directory discovery. If 
  confirmed malicious, this behavior could lead to further reconnaissance, enabling 
  attackers to map out the network and identify potential targets for privilege 
  escalation or lateral movement.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*get-wmiobject*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*ds_user*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-namespace*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*root\\directory\\ldap*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  The following Hunting analytic requires PowerShell operational logs to be imported. 
  The Wazuh agent ossec.conf should include the Microsoft-Windows-PowerShell/Operational 
  event channel. This detection monitors for the Get-WmiObject cmdlet with DS_User class 
  targeting the LDAP namespace. Validate that data_win_eventdata_scriptBlockText field 
  is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this command for legitimate troubleshooting and 
  Active Directory user discovery. Filter based on user context and whether the action 
  was expected and authorized within your organization.

references:
  - https://www.blackhillsinfosec.com/red-blue-purple/
  - https://docs.microsoft.com/en-us/windows/win32/wmisdk/describing-the-ldap-namespace
  - https://attack.mitre.org/techniques/T1087/002/

response:
  message: >
    Get-WmiObject DS_User LDAP query detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain user enumeration via WMI LDAP namespace/reconnaissance activity. 
    MITRE ATT&CK: T1087.002
  risk_score: 48
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 48
    - field: data_win_eventdata_user
      type: user
      score: 48
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - User Discovery
    - Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - get_wmiobject
    - ds_user
    - ldap_namespace
    - user_enumeration
    - domain_users
    - wmi_query
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-WmiObject.*/ AND data_win_eventdata_scriptBlockText:/.*ds_user.*/ AND data_win_eventdata_scriptBlockText:/.*namespace.*/ AND data_win_eventdata_scriptBlockText:/.*root\\\\directory\\\\ldap.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 22d3b118-04df-11ec-8fa3-acde48001122
    name: GetWmiObject DS User with PowerShell
    reason: Same Get-WmiObject DS_User LDAP query seen as a Sysmon process-creation command line; confirms the script block ran from an actual powershell.exe and gives parent process
  - id: 7141122c-3bc2-4aaa-ab3b-7a85a0bbefc3
    name: GetWmiObject Ds Computer with PowerShell
    reason: Attackers who enumerate DS_User via WMI LDAP typically swap the class to DS_Computer next to map hosts for lateral movement
  - id: df275a44-4527-443b-b884-7600e066e3eb
    name: GetWmiObject Ds Group with PowerShell
    reason: Same WMI root\directory\ldap technique with DS_Group; follows user enumeration to find privileged group membership
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Alternate PowerShell native LDAP method for the same user/group discovery; operators often chain several enumeration methods in one session
  - id: 1114e048-b69c-4f41-bc20-657245ae6e3f
    name: User Discovery And Export Via Get-ADUser Cmdlet
    reason: Same goal (enumerate domain users) via the AD module and exporting results; indicates the enumeration is being harvested
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: PowerView is the common next step after raw WMI/LDAP user listing to find Domain Admins and privileged targets
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Wider automated AD graph collection is the escalation of manual DS_User enumeration
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Locating domain controllers is the sibling precursor/companion step before querying LDAP for users
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other WMI/LDAP and AD enumeration in PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Ss]_[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ss]_[Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: AD recon tools launched on this host (net/dsquery/nltest/adfind/csvde)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Vv][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/) AND (data_win_eventdata_commandLine:*user* OR data_win_eventdata_commandLine:*group* OR data_win_eventdata_commandLine:*dclist* OR data_win_eventdata_commandLine:*domain* OR data_win_eventdata_commandLine:*objectcategory* OR data_win_eventdata_commandLine:*-f* OR data_win_eventdata_commandLine:*-c*)
    pivot_on:
    - host
    window: 2h
  - name: Sysmon outbound LDAP/Kerberos/GC connections from the PowerShell host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"3269" OR data_win_eventdata_destinationPort:"88")
    pivot_on:
    - host
    window: 1h
  - name: Enumeration output staged to file or credential-targeting script blocks
    query: (data_win_system_eventID:"11" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]).*/ AND (data_win_eventdata_targetFilename:/.*\.([Tt][Xx][Tt]|[Cc][Ss][Vv]|[Zz][Ii][Pp]|[Jj][Ss][Oo][Nn]|[Xx][Mm][Ll])/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Cc][Ss][Vv].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/))
    pivot_on:
    - host
    window: 4h
