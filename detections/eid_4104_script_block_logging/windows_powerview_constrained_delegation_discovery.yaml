name: Windows PowerView Constrained Delegation Discovery
id: 86dc8176-6e6c-42d6-9684-5444c6557ab3
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of PowerView commandlets to discover Windows 
  endpoints with Kerberos Constrained Delegation. It leverages PowerShell Script Block 
  Logging (EventCode=4104) to identify specific commandlets like `Get-DomainComputer` 
  or `Get-NetComputer` with the `-TrustedToAuth` parameter. This activity is significant 
  as it indicates potential reconnaissance efforts by adversaries or Red Teams to map 
  out privileged delegation settings in Active Directory. If confirmed malicious, this 
  could allow attackers to identify high-value targets for further exploitation, 
  potentially leading to privilege escalation or lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-DomainComputer*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-NetComputer*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-TrustedToAuth*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of Get-DomainComputer or Get-NetComputer with the -TrustedToAuth 
  parameter to identify endpoints configured for Kerberos constrained delegation. 
  Validate that data_win_eventdata_scriptBlockText field is being populated in 
  Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may leverage PowerView for legitimate system 
  management or troubleshooting purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://adsecurity.org/?p=1667
  - https://docs.microsoft.com/en-us/defender-for-identity/cas-isp-unconstrained-kerberos
  - https://www.guidepointsecurity.com/blog/delegating-like-a-boss-abusing-kerberos-delegation-in-active-directory/
  - https://book.hacktricks.xyz/windows-hardening/active-directory-methodology/constrained-delegation
  - https://www.cyberark.com/resources/threat-research-blog/weakness-within-kerberos-delegation

response:
  message: >
    PowerView constrained delegation discovery detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is mapping constrained delegation settings in Active Directory to 
    identify privilege escalation targets. MITRE ATT&CK: T1018
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - CISA AA23-347A
    - Rhysida Ransomware
    - Active Directory Kerberos Attacks
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - powerview
    - constrained_delegation
    - kerberos_delegation
    - trustedtoauth
    - active_directory
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Get-DomainComputer.*/ OR data_win_eventdata_scriptBlockText:/.*Get-NetComputer.*/) AND data_win_eventdata_scriptBlockText:/.*-TrustedToAuth.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fbf9e47f-e531-4fea-942d-5c95af7ed4d6
    name: Windows PowerView Unconstrained Delegation Discovery
    reason: 'Sibling delegation hunt: attackers enumerate unconstrained and constrained delegation together to pick the easiest delegation abuse path.'
  - id: c8640777-469f-4638-ab44-c34a3233ffac
    name: Windows Get-AdComputer Unconstrained Delegation Discovery
    reason: Same delegation reconnaissance performed with the AD module instead of PowerView; a tool switch on the same host is the same operator.
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: SPN enumeration usually accompanies delegation discovery, since delegation targets are defined by the service SPNs in msDS-AllowedToDelegateTo and feed Kerberoasting.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Confirms a broader PowerView session (the module was loaded) beyond the single delegation query.
  - id: 39405650-c364-4e1e-a740-32a63ef042a6
    name: Windows PowerView AD Access Control List Enumeration
    reason: Operators mapping delegation also hunt for writable ACLs (e.g. msDS-AllowedToDelegateTo write rights), the other route to delegation abuse.
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: 'Direct follow-on: after identifying a delegation-enabled account, the attacker requests service tickets for its SPNs.'
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: Script-based TGS requests (Kerberoast / S4U ticket abuse) are the exploitation step of a discovered constrained-delegation account.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Command-line ticket requests (Rubeus-style asktgs/s4u) are the likely next action once a delegation target is known.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD delegation/SPN/ACL recon script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]rusted[Ff]or[Dd]elegation.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]llowed[Tt]o[Dd]elegate[Tt]o.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Oo]bject[Aa]cl.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ii]nteresting[Dd]omain[Aa]cl.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Cc]omputer.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Rubeus / S4U / Kerberos ticket abuse tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr]ubeus.*/ OR data_win_eventdata_commandLine:/.*[Rr]ubeus.*/ OR data_win_eventdata_commandLine:/.*[Ss]4[Uu]2[Pp]roxy.*/ OR data_win_eventdata_commandLine:/.*[Ss]4[Uu]2[Ss]elf.*/ OR data_win_eventdata_commandLine:/.*[Aa]sktgs.*/ OR data_win_eventdata_commandLine:/.*[Kk]erberoast.*/ OR data_win_eventdata_commandLine:/.*[Kk]erberos::.*/ OR data_win_eventdata_commandLine:/.*\/[Pp]tt.*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: AD collection tools (SharpHound / AdFind) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_image:/.*[Aa]d[Ff]ind.*/ OR data_win_eventdata_commandLine:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*[Bb]lood[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*[Cc]ollection[Mm]ethod.*/ OR data_win_eventdata_commandLine:/.*[Aa]d[Ff]ind.*/ OR data_win_eventdata_commandLine:/.*[Ss]etspn.*-[Qq].*/ OR data_win_eventdata_commandLine:/.*[Nn]ltest.*[Dd][Cc][Ll][Ii][Ss][Tt].*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: PowerShell connections to DC / lateral movement ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_destinationPort:("88" OR "389" OR "636" OR "3268" OR "445" OR "5985" OR "5986" OR "135")
    pivot_on:
    - host
    window: 2h
  - name: Remote execution after delegation recon (PsExec / WinRM / WMI)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_image:/.*[Ww]inrs\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Cc]ommand.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_commandLine:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*\/[Nn][Oo][Dd][Ee]:.*[Pp]rocess.*[Cc]all.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/)
    pivot_on:
    - host
    - user
    window: 4h
