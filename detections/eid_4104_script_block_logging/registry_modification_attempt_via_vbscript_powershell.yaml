name: Registry Modification Attempt Via VBScript - PowerShell
id: 2a0a169d-cc66-43ce-9ae2-6e678e54e46a
version: 1
schema_version: "1.0"
date: "2025-08-13"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2a0a169d-cc66-43ce-9ae2-6e678e54e46a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to modify the registry using VBScript's
  CreateObject("Wscript.shell") and RegWrite methods embedded within PowerShell
  scripts or commands. Threat actors commonly embed VBScript code within
  PowerShell to perform registry modifications, attempting to evade detection
  that monitors for direct registry access through traditional tools. This
  technique can be used for persistence, defense evasion, and privilege
  escalation by modifying registry keys without using regedit.exe, reg.exe, or
  PowerShell's native registry cmdlets. MITRE ATT&CK: T1112, T1059.005.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*CreateObject*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Wscript.shell*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.RegWrite*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*CreateObject*';
  data_win_eventdata_scriptBlockText matches '*Wscript.shell*';
  data_win_eventdata_scriptBlockText matches '*.RegWrite*'.

known_false_positives: >
  Some legitimate admin or install scripts may use these processes for registry
  modifications. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.linkedin.com/posts/mauricefielenbach_livingofftheland-redteam-persistence-activity-7344801774182051843-TE00/
  - https://www.nextron-systems.com/2025/07/29/detecting-the-most-popular-mitre-persistence-method-registry-run-keys-startup-folder/
  - https://detect.fyi/hunting-fileless-malware-in-the-windows-registry-1339ccde00ad
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1059/005/

response:
  message: >
    Registry Modification Attempt Via VBScript - PowerShell detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1112, T1059.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1059.005
  custom_tags:
    - registry
    - vbscript
    - powershell
    - persistence
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Rr][Ee][Gg][Ww][Rr][Ii][Tt][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 921aa10f-2e74-4cca-9498-98f9ca4d6fdf
    name: Registry Modification Attempt Via VBScript
    reason: Same RegWrite-via-Wscript.Shell technique seen at process-creation level (wscript/cscript); co-occurs when the registry write is also done from a standalone VBS rather than only inside a PowerShell block.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: RegWrite is most often aimed at Run/RunOnce keys; the resulting Sysmon 13 value set confirms the script block actually landed a persistence entry.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Confirms a RegWrite-created Run value points at a user-writable/temp payload path, i.e. persistence for a dropped payload.
  - id: 8d85cf08-bf97-4260-ba49-986a2a65129c
    name: Suspicious PowerShell In Registry Run Keys
    reason: 'Follow-on: the Wscript.Shell RegWrite stores a PowerShell launcher in a Run key so the script re-executes at logon.'
  - id: 46490193-1b22-4c29-bdd6-5bf63907216f
    name: VBScript Payload Stored in Registry
    reason: RegWrite can stash a VBScript/encoded payload in a registry value for fileless staging, the same primitive this alert shows.
  - id: 7dbbcac2-57a0-45ac-b306-ff30a8bd2981
    name: Windows AMSI Related Registry Tampering Via CommandLine
    reason: Registry writes from script are commonly used to weaken AMSI/defenses so later script stages evade scanning; related defense-evasion registry tampering.
  - id: 2c28c248-7f50-417a-9186-a85b223010ee
    name: Wscript Shell Run In CommandLine
    reason: Same Wscript.Shell COM object abused for Run/exec; indicates the script is also launching processes, not only writing the registry.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: A Run key set shortly after a download implies the RegWrite persisted a freshly downloaded payload.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Autorun and Winlogon registry values set on this host
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon\\([Ss]hell|[Uu]serinit).*/ OR data_win_eventdata_targetObject:/.*[Ii]mage [Ff]ile [Ee]xecution [Oo]ptions.*/ OR data_win_eventdata_targetObject:/.*[Ee]nvironment\\[Uu]ser[Ii]nit[Mm]pr[Ll]ogon[Ss]cript.*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry writes that disable security features
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Dd]isable[Aa]nti[Ss]pyware.*/ OR data_win_eventdata_targetObject:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender\\[Ee]xclusions.*/ OR data_win_eventdata_targetObject:/.*[Ee]nable[Ll][Uu][Aa].*/ OR data_win_eventdata_targetObject:/.*[Aa]msi.*[Pp]roviders.*/ OR data_win_eventdata_targetObject:/.*[Ss]cript[Bb]lock[Ll]ogging.*/)
    pivot_on:
    - host
    window: 2h
  - name: Script interpreter processes launched with RegWrite or Wscript.Shell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]eg[Ww]rite.*/ OR data_win_eventdata_commandLine:/.*[Ww]script\.[Ss]hell.*/ OR data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Script blocks with download, encoding or in-memory loading around the RegWrite
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload(String|File).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/)
    pivot_on:
    - host
    window: 1h
  - name: Executables or scripts dropped to user-writable paths by script hosts
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp]owershell|[Pp]wsh|[Ww]script|[Cc]script)\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Aa]pp[Dd]ata\\|\\[Pp]rogram[Dd]ata\\|\\[Pp]ublic\\).*\.(exe|dll|vbs|js|ps1|bat|hta)/
    pivot_on:
    - host
    window: 2h
