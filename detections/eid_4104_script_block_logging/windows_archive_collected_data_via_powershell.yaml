name: Windows Archive Collected Data via Powershell
id: Windows_Archive_Collected_Data_via_Powershell
version: 1
schema_version: "1.0"
date: "2026-03-27"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects use of PowerShell Compress-Archive cmdlet targeting the Temp directory,
  which may indicate an adversary collecting and compressing data for exfiltration.
  Malware families including APT37 tools like FadeStealer use this technique to
  stage compressed archives in temporary folders before exfiltrating sensitive data.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Compress-Archive*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Temp*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-27 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging. The Microsoft-Windows-PowerShell/Operational channel must be
  forwarded by the Wazuh agent. Confirmed flowing in this environment.
  VALIDATED — 15 hits confirmed for Compress-Archive targeting Temp directory.
  Important: The ES wildcard uses *Temp* rather than *\\Temp\\* because
  backslashes are stored escaped in the scriptBlockText field.

known_false_positives: >
  PowerShell may legitimately use Compress-Archive to archive data to temp
  folders for backup or deployment purposes. Review the source path being
  archived and the user context to determine if the activity is authorized.

references:
  - https://attack.mitre.org/techniques/T1560/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    PowerShell Compress-Archive to Temp directory detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1560
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - APT37 Rustonotto and FadeStealer
    - CISA AA23-347A
    - Data Exfiltration
  asset_type: Endpoint
  mitre_attack_id:
    - T1560
  custom_tags:
    - compress_archive
    - data_collection
    - exfiltration_staging
    - powershell
    - apt37
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Compress-Archive.*/ AND data_win_eventdata_scriptBlockText:/.*Temp.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: 'Precursor: scripted file-harvesting (Get-ChildItem/Copy-Item over documents) is what produces the data that Compress-Archive then packs into Temp.'
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: 'Precursor: hunting for sensitive files selects what gets staged; same script-block telemetry on the same host/user shortly before archiving.'
  - id: 2837e152-93c8-43d2-85ba-c3cd3c2ae614
    name: Powershell Local Email Collection
    reason: 'Precursor/co-occurring: PST/OST harvesting is a common payload that is then zipped into Temp for exfiltration.'
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: 'Co-occurring collection: stolen browser credential stores are frequently copied and archived in the same staging step (FadeStealer-style collectors).'
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Same Compress-Archive action seen from process-creation telemetry; confirms the command line, parent process and output path of the archive.
  - id: windows-archive-collected-data-via-rar-001
    name: Windows Archive Collected Data via Rar
    reason: Alternate archiver for the same staging objective; an attacker falling back from Compress-Archive to rar on the same host shows a persistent collection effort.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: 'Follow-on: staged archives are typically pushed to cloud storage with rclone as the exfiltration step.'
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: 'Follow-on: uploading the Temp archive to a file-sharing site via curl is the natural exfiltration step after staging.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: File collection and staging commands in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]hild[Ii]tem.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]opy-[Ii]tem.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]ontent.*/) AND (data_win_eventdata_scriptBlockText:/.*\.(docx|xlsx|pdf|pst|ost|kdbx|txt).*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ocuments.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]esktop.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownloads.*/)
    pivot_on:
    - host
    window: 2h
  - name: Archive file written to Temp (zip/rar/7z)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Tt]emp.*\.(zip|rar|7z|cab)/
    pivot_on:
    - host
    window: 2h
  - name: Other archiver tools executed (rar, 7z, tar, makecab)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(rar|7z|7za|winrar|makecab|tar)\.exe/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*[Mm]ake[Cc]ab.*/)
    pivot_on:
    - host
    window: 2h
  - name: Exfiltration tooling or web upload from PowerShell
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_scriptBlockText:/.*UploadFile.*/ OR data_win_eventdata_scriptBlockText:/.*UploadData.*/) AND (data_win_eventdata_scriptBlockText:/.*-([Mm]ethod|[Ii]n[Ff]ile).*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Oo][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(rclone|curl|winscp|pscp|megacmd)\.exe/)
    pivot_on:
    - host
    window: 4h
  - name: Network connections to cloud storage / file-sharing domains
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*mega.nz* OR data_win_eventdata_queryName:*mega.io* OR data_win_eventdata_queryName:*dropbox* OR data_win_eventdata_queryName:*anonfiles* OR data_win_eventdata_queryName:*transfer.sh* OR data_win_eventdata_queryName:*pastebin* OR data_win_eventdata_queryName:*file.io* OR data_win_eventdata_queryName:*gofile* OR data_win_eventdata_queryName:*drive.google* OR data_win_eventdata_queryName:*onedrive*)
    pivot_on:
    - host
    window: 4h
