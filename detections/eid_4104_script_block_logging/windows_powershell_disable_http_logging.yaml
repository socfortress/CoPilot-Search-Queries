name: Windows PowerShell Disable HTTP Logging
id: 27958de0-2857-43ca-9d4c-b255cf59dcab
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects use of get-WebConfigurationProperty or Set-ItemProperty commands
  in PowerShell to disable HTTP logging on Windows IIS servers by setting
  httpLogging or logfile.enabled to false or dontLog. Disabling HTTP logging
  is used by adversaries to cover their tracks and prevent forensic investigation
  of web-based attacks. This technique is documented in IcedApple post-exploitation
  framework and OilRig threat actor operations.
data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*get-WebConfigurationProperty*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Set-ItemProperty*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*httpLogging*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*logfile.enabled*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*dontLog*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*false*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators or scripts may legitimately disable HTTP logging for
  maintenance or performance reasons. Review the user context and whether
  the change is authorized before escalating.

references:
  - https://attack.mitre.org/techniques/T1505/004/
  - https://attack.mitre.org/techniques/T1562/002/
  - https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
  - https://www.crowdstrike.com/wp-content/uploads/2022/05/crowdstrike-iceapple-a-novel-internet-information-services-post-exploitation-framework-1.pdf

response:
  message: >
    PowerShell IIS HTTP logging disable detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1505.004, T1562.002
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - IIS Components
    - Windows Defense Evasion Tactics
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.004
    - T1562.002
  custom_tags:
    - iis
    - http_logging
    - log_tampering
    - defense_evasion
    - iceapple
    - oilrig
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*get-WebConfigurationProperty.*/ OR data_win_eventdata_scriptBlockText:/.*Set-ItemProperty.*/) AND (data_win_eventdata_scriptBlockText:/.*httpLogging.*/ OR data_win_eventdata_scriptBlockText:/.*logfile\.enabled.*/) AND (data_win_eventdata_scriptBlockText:/.*dontLog.*/ OR data_win_eventdata_scriptBlockText:/.*false.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
    name: Disable Windows IIS HTTP Logging
    reason: Same IIS log-blinding goal done via appcmd/process creation; the attacker may use either method on the same server.
  - id: windows-disable-http-logging-appcmd-001
    name: Windows Disable HTTP Logging via AppCmd
    reason: Alternate AppCmd path to turn off IIS HTTP logging; confirms deliberate log tampering when both fire.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: 'Follow-on anti-forensics: after disabling logging, existing IIS logs are deleted to erase prior web-attack evidence.'
  - id: 3eb8c339-a765-48cc-a150-4364c04652bf
    name: IIS WebServer Access Logs Deleted
    reason: File-level confirmation that IIS access logs were removed alongside logging being disabled.
  - id: 33fc9f6f-0ce7-4696-924e-a69ec61a3d57
    name: Windows PowerShell IIS Components WebGlobalModule Usage
    reason: 'IcedApple-style post-exploitation: malicious IIS modules registered via PowerShell, with logging turned off to hide their traffic.'
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: Rogue IIS module install is the usual persistence step that precedes or follows disabling HTTP logging.
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: w3wp spawning shells/tools is the likely initial foothold (webshell) that led to this IIS tampering.
  - id: 0f017df3-8f5a-414f-ad6b-24aff1128278
    name: Suspicious Eventlog Clear
    reason: 'Same log-tampering objective: attackers pair IIS logging disablement with Windows event log clearing.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Web server worker spawning shells or recon tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: IIS configuration changes via appcmd or WebAdministration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww]eb[Aa]dministration.*/) AND (data_win_eventdata_commandLine:/.*[Ll]og.*/ OR data_win_eventdata_commandLine:/.*[Mm]odule.*/ OR data_win_eventdata_commandLine:/.*[Ss]et.*/)
    pivot_on:
    - host
    window: 4h
  - name: IIS log files deleted or truncated
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd]el .*/ OR data_win_eventdata_commandLine:/.*[Rr]emove-[Ii]tem.*/))) AND (data_win_eventdata_targetFilename:/.*[Ll]og[Ff]iles.*/ OR data_win_eventdata_commandLine:/.*[Ll]og[Ff]iles.*/ OR data_win_eventdata_commandLine:/.*[Ii]net[Pp]ub.*/)
    pivot_on:
    - host
    window: 4h
  - name: New DLL or web script files dropped in IIS paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ii]net[Pp]ub.*/ OR data_win_eventdata_targetFilename:/.*[Ii]nteg.*/ OR data_win_eventdata_targetFilename:/.*[Ss]ystem32.[Ii]netsrv.*/ OR data_win_eventdata_targetFilename:/.*[Ii]netsrv.*/) AND (data_win_eventdata_targetFilename:/.*\.([Aa][Ss][Pp][Xx]?|[Dd][Ll][Ll]|[Pp][Hh][Pp]|[Aa][Ss][Hh][Xx])/)
    pivot_on:
    - host
    window: 6h
  - name: PowerShell script blocks registering IIS modules or clearing logs
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww]eb[Gg]lobal[Mm]odule.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Ww]eb[Gg]lobal[Mm]odule.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]lear-[Ee]vent[Ll]og.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nable-[Ww]eb[Gg]lobal[Mm]odule.*/)
    pivot_on:
    - host
    window: 4h
