name: Get-WMIObject Group Discovery with Script Block Logging
id: 69df7f7c-155d-11ec-a055-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-WMIObject Win32_Group` 
  command using PowerShell Script Block Logging (EventID 4104). This method captures 
  the full command sent to PowerShell, allowing for detailed analysis. Identifying group 
  information on an endpoint is not inherently malicious but can be suspicious based on 
  context such as time, endpoint, and user. This activity is significant as it may 
  indicate reconnaissance efforts by an attacker. If confirmed malicious, it could lead 
  to further enumeration and potential lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-WMIObject*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Win32_Group*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-WMIObject Win32_Group cmdlet combination, which is 
  used for group enumeration. Validate that data_win_eventdata_scriptBlockText field 
  is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  False positives may be present. Tune as needed based on organizational baseline. 
  System administrators may use this command for legitimate group management and auditing 
  purposes. Filter based on user context and whether the action was expected and 
  authorized within your organization.

references:
  - https://www.splunk.com/en_us/blog/security/powershell-detections-threat-research-release-august-2021.html
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1069.001/T1069.001.md
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://www.crowdstrike.com/blog/investigating-powershell-command-and-script-logging/
  - https://attack.mitre.org/techniques/T1069/001/

response:
  message: >
    Get-WMIObject Win32_Group execution detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates local/domain group enumeration/reconnaissance activity. 
    MITRE ATT&CK: T1069.001
  risk_score: 40
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Permission Groups Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.001
  custom_tags:
    - get_wmiobject
    - win32_group
    - group_discovery
    - permission_groups
    - local_groups
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-WMIObject.*/ AND data_win_eventdata_scriptBlockText:/.*Win32_Group.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5434f670-155d-11ec-8cca-acde48001122
    name: Get WMIObject Group Discovery
    reason: 'Process-creation twin of this 4104 detection: same Get-WMIObject Win32_Group enumeration seen on the powershell.exe command line, confirming execution and its parent process'
  - id: df275a44-4527-443b-b884-7600e066e3eb
    name: GetWmiObject Ds Group with PowerShell
    reason: Same WMI-based group discovery but against the directory (root\directory\ldap ds_group); typical escalation from local to domain group enumeration
  - id: b71adfcc-155b-11ec-9413-acde48001122
    name: PowerShell Get LocalGroup Discovery
    reason: Co-occurring local group enumeration via Get-LocalGroup; attackers commonly try several cmdlets for the same Permission Groups Discovery goal
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Follow-on domain group enumeration via [adsisearcher] from the same script block context after local groups are listed
  - id: a87736a6-95cd-4728-8689-3c64d5026b3e
    name: Domain Group Discovery With Wmic
    reason: WMIC equivalent of Win32_Group enumeration; the operator may switch tooling mid-recon
  - id: 3f6bbf22-093e-4cb4-9641-83f47b8444b6
    name: Elevated Group Discovery With Wmic
    reason: Targeted follow-up to find privileged groups (Administrators, Domain Admins) once groups are enumerated
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: PowerView-based privileged group hunting often follows a basic Win32_Group listing in scripted AD recon
  - id: b44f6ac6-0429-11ec-87e9-acde48001122
    name: GetWmiObject User Account with PowerShell
    reason: Account enumeration via the same Get-WmiObject cmdlet family (Win32_UserAccount), the usual companion to group enumeration
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other WMI/CIM account and group enumeration script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Uu]ser[Aa]ccount.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Gg]roup[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Ss]ystem[Aa]ccount.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]im[Ii]nstance.*[Ww]in32_[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Ll]ocal[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Ll]ocal[Uu]ser.*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Domain/AD enumeration script blocks (ADSI, AD module, PowerView)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]dsisearcher.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]irectory[Ss]earcher.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]omain [Aa]dmins.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Native recon binaries for groups and users (net, whoami, wmic, dsquery)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Nn]et1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(group|localgroup|user|accounts).*/) OR (data_win_eventdata_image:/.*\\[Ww]hoami\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\/groups|\/all|\/priv).*/) OR (data_win_eventdata_image:/.*\\[Ww]mic\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(group|useraccount|sysaccount).*/) OR data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Credential access or lateral movement tooling after group discovery
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss]ekurlsa|[Mm]imikatz|[Cc]omsvcs.*[Mm]ini[Dd]ump|[Ss]ecretsdump|[Rr]ubeus|[Ss]etspn).*/ OR (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_image:/.*\\[Ww]mic\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*([Nn]ode:|\/node|process call create|\\\\).*/))
    pivot_on:
    - host
    - user
    window: 4h
  - name: Script block loaders and remote WMI/remoting context
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Cc]im[Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/)
    pivot_on:
    - host
    - user
    window: 2h
