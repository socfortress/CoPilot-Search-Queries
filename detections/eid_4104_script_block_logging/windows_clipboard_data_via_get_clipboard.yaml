name: Windows ClipBoard Data via Get-ClipBoard
id: windows-clipboard-data-get-clipboard-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects execution of the PowerShell Get-Clipboard cmdlet via Script Block 
  Logging (EventID 4104). This native cmdlet retrieves clipboard contents and 
  is used by post-exploitation tools like WinPEAS to steal sensitive data such 
  as passwords, tokens, or other information copied to the clipboard.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-Clipboard*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_scriptBlockText
    - rule_id
    - rule_description

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventID 4104) enabled 
  on Windows endpoints and Wazuh custom rule 100610 deployed to detect 
  Get-Clipboard in script block text. Add rule to 
  /var/ossec/etc/rules/powershell_scriptblock_rules.xml and restart wazuh-manager.

known_false_positives: >
  Administrators or scripts may legitimately use Get-Clipboard for automation. 
  Correlate with other post-exploitation indicators on the same host.

references:
  - https://attack.mitre.org/techniques/T1115/
  - https://github.com/carlospolop/PEASS-ng/tree/master/winPEAS

response:
  message: >
    Get-Clipboard execution detected on $agent_name$. 
    Script: $data_win_eventdata_scriptBlockText$. 
    Possible clipboard data theft. MITRE ATT&CK: T1115
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Windows Post-Exploitation
    - Prestige Ransomware
  asset_type: Endpoint
  mitre_attack_id:
    - T1115
  custom_tags:
    - clipboard
    - data_theft
    - winpeas
    - powershell_4104
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_eventdata_scriptBlockText:/.*Get-Clipboard.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 98b53e78-ebaf-46f8-be06-421aafd176d9
    name: HackTool - winPEAS Execution
    reason: WinPEAS is the named tool that runs Get-Clipboard during its local enumeration sweep; process-level evidence of winPEAS confirms the 4104 hit is tooling rather than an admin script
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Same Get-Clipboard behaviour seen on the Sysmon process command line instead of script block text; co-occurring corroboration and reveals the parent process that launched it
  - id: 4cbd4f12-2e22-43e3-882f-bff3247ffb78
    name: PowerShell Get Clipboard
    reason: Module logging (4103) view of the same Get-Clipboard cmdlet invocation; confirms execution and captures bound parameters
  - id: 965e2db9-eddb-4cf6-a986-7a967df651e4
    name: Potential Keylogger Activity
    reason: Clipboard scraping is commonly paired with PowerShell keylogging (GetAsyncKeyState/SetWindowsHookEx) as parallel user-input capture on the same host
  - id: 34f90d3c-c297-49e9-b26d-911b05a4866c
    name: Powershell Keylogging
    reason: Another PowerShell input-capture collection technique that operators run alongside clipboard harvesting to catch typed and copied credentials
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Clipboard theft is a complement to browser credential store theft; both target secrets (password manager copies, saved logins) in the user session
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: 'Credential-access follow-on: once clipboard secrets are read, operators commonly dump Credential Manager in the same PowerShell session'
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: winPEAS-style enumeration also hunts for sensitive files; co-occurring discovery in the same script run points to automated post-exploitation collection
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other credential/collection actions in PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]lipboard.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Aa]sync[Kk]ey[Ss]tate.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Ww]indows[Hh]ook[Ee]x.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]red[Rr]ead.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]assword[Vv]ault.*/ OR data_win_eventdata_scriptBlockText:/.*[Ll]ogin [Dd]ata.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]opy[Ff]romScreen.*/)
    pivot_on:
    - host
    window: 1h
  - name: WinPEAS / enumeration tooling process or script on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ww]in[Pp][Ee][Aa][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww]in[Pp][Ee][Aa][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss]eatbelt.*/ OR data_win_eventdata_commandLine:/.*[Ll]a[Zz]agne.*/ OR data_win_eventdata_commandLine:/.*[Pp]ower[Uu][Pp].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww]in[Pp][Ee][Aa][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Aa]ll[Cc]hecks.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Pp]rivesc[Cc]heck.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]harp[Uu]p.*/))
    pivot_on:
    - host
    window: 2h
  - name: Browser credential store and password-manager file access
    query: (data_win_system_eventID:"11" OR data_win_system_eventID:"1") AND (data_win_eventdata_targetFilename:/.*([Ll]ogin [Dd]ata|[Ll]ogins\.json|[Kk]ey4\.db|[Ll]ocal [Ss]tate|[Cc]ookies|\.kdbx).*/ OR data_win_eventdata_commandLine:/.*([Ll]ogin [Dd]ata|[Ll]ogins\.json|[Kk]ey4\.db|\.kdbx|[Vv]ault[Cc]md|[Cc]mdkey).*/)
    pivot_on:
    - host
    window: 2h
  - name: Staging, archiving and exfiltration of collected data
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*([Rr]ar|7z|7za|[Zz]ip)(\.exe)? .*( a | -a ).*/ OR data_win_eventdata_commandLine:/.*([Cc]url|[Ww]get)(\.exe)? .*(-T|--upload-file|-F|--data|-d ).*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*-[Mm]ethod [Pp]ost.*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*[Pp]ost.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ss]tring.*/))
    pivot_on:
    - host
    window: 4h
  - name: Outbound DNS to paste, file-share or webhook exfil services
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*(pastebin|paste\.ee|hastebin|transfer\.sh|anonfiles|file\.io|discord(app)?\.com|api\.telegram\.org|webhook\.site|mega\.nz|ngrok).*/
    pivot_on:
    - host
    window: 2h
