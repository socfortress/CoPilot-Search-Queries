  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND ((data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ AND data_win_eventdata_scriptBlockText:/.*[Oo][Pp][Ee][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/) OR (data_win_eventdata_scriptBlockText:/.*[Oo][Pp][Ee][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Tt][Oo][Kk][Ee][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Oo][Kk][Uu][Pp][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Vv][Aa][Ll][Uu][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Jj][Uu][Ss][Tt][Tt][Oo][Kk][Ee][Nn][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Ss].*/) OR (data_win_eventdata_scriptBlockText:/.*[Oo][Pp][Ee][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Tt][Oo][Kk][Ee][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*[Dd][Uu][Pp][Ll][Ii][Cc][Aa][Tt][Ee][Tt][Oo][Kk][Ee][Nn][Ee][Xx].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Oo][Ss][Ee][Hh][Aa][Nn][Dd][Ll][Ee].*/) OR (data_win_eventdata_scriptBlockText:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ AND data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Aa][Dd][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ AND data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Ff][Rr][Ee][Ee].*/) OR (data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ff][Oo][Rr][Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn][Pp][Oo][Ii][Nn][Tt][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Aa][Rr][Ss][Hh][Aa][Ll]\.[Cc][Oo][Pp][Yy].*/))

