name: Potential WinAPI Calls Via PowerShell Scripts
id: 03d83090-8cba-44a0-b02f-0b756a050306
version: 1
schema_version: "1.0"
date: "2026-04-29"
author: Nasreddine Bencherchali (Nextron Systems), Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 03d83090-8cba-44a0-b02f-0b756a050306
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of WinAPI functions in PowerShell scripts. It may indicate
  attempts to perform actions such as process injection, token stealing, or
  other malicious activities that leverage Windows API calls. These techniques
  are commonly used to evade traditional file-based detections by loading and
  executing code directly in memory. MITRE ATT&CK: T1059.001, T1106, T1620.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*VirtualAlloc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*OpenProcess*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*WriteProcessMemory*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*CreateRemoteThread*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*OpenProcessToken*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*LookupPrivilegeValue*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*AdjustTokenPrivileges*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*OpenProcessToken*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*DuplicateTokenEx*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*CloseHandle*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*WriteProcessMemory*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*VirtualAlloc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*ReadProcessMemory*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*VirtualFree*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*VirtualAlloc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*GetDelegateForFunctionPointer*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Marshal.Copy*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*VirtualAlloc*';
  data_win_eventdata_scriptBlockText matches '*OpenProcess*';
  data_win_eventdata_scriptBlockText matches '*WriteProcessMemory*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
  - https://github.com/PowerShellMafia/PowerSploit/blob/1980f403ee78234eae4d93b50890d02f827a099f/CodeExecution/Invoke-Shellcode.ps1
  - https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1106/
  - https://attack.mitre.org/techniques/T1620/

response:
  message: >
    Potential WinAPI Calls Via PowerShell Scripts detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1059.001, T1106, T1620
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1106
    - T1620
  custom_tags:
    - winapi
    - calls
    - powershell
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND ((data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ AND data_win_eventdata_scriptBlockText:/.*[Oo][Pp][Ee][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/) OR (data_win_eventdata_scriptBlockText:/.*[Oo][Pp][Ee][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Tt][Oo][Kk][Ee][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Oo][Kk][Uu][Pp][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Vv][Aa][Ll][Uu][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Jj][Uu][Ss][Tt][Tt][Oo][Kk][Ee][Nn][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Ss].*/) OR (data_win_eventdata_scriptBlockText:/.*[Oo][Pp][Ee][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Tt][Oo][Kk][Ee][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*[Dd][Uu][Pp][Ll][Ii][Cc][Aa][Tt][Ee][Tt][Oo][Kk][Ee][Nn][Ee][Xx].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Oo][Ss][Ee][Hh][Aa][Nn][Dd][Ll][Ee].*/) OR (data_win_eventdata_scriptBlockText:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ AND data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Aa][Dd][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ AND data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Ff][Rr][Ee][Ee].*/) OR (data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ff][Oo][Rr][Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn][Pp][Oo][Ii][Nn][Tt][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Aa][Rr][Ss][Hh][Aa][Ll]\.[Cc][Oo][Pp][Yy].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: 'Same script-block telemetry: P/Invoke VirtualAlloc/WriteProcessMemory plus shellcode byte arrays confirms the WinAPI use is an in-memory payload loader, not benign interop.'
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: Resolving API pointers via GetProcAddress/GetDelegateForFunctionPointer is the dynamic-resolution variant of the same fileless injection tradecraft.
  - id: 99b97608-3e21-4bfe-8217-2a127c396a0e
    name: Remote Thread Creation Via PowerShell In Uncommon Target
    reason: 'Execution outcome of the CreateRemoteThread/WriteProcessMemory script: Sysmon EID 8 from powershell.exe into another process proves the injection ran.'
  - id: fb656378-f909-47c1-8747-278bf09f4f4f
    name: Potential Credential Dumping Attempt Via PowerShell Remote Thread
    reason: Follow-on when the injected thread targets lsass.exe, turning the WinAPI script into credential theft.
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Cobalt Strike stagers delivered via PowerShell inject beacon shellcode into other processes, the exact VirtualAlloc/WriteProcessMemory/CreateRemoteThread chain this rule matches.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Invoke-Mimikatz reflectively loads a PE using the same VirtualAlloc/token-API pattern, so both can fire from one script block.
  - id: windows-access-token-manipulation-sedebugprivilege-001
    name: Windows Access Token Manipulation SeDebugPrivilege
    reason: The OpenProcessToken/LookupPrivilegeValue/AdjustTokenPrivileges branch enables SeDebugPrivilege, which this Security-log rule records on the same host.
  - id: 02f7c9c1-1ae8-4c6a-8add-04693807f92f
    name: Potential Access Token Abuse
    reason: The OpenProcessToken/DuplicateTokenEx branch is token theft; this detects the resulting impersonation/token use.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote threads and process access launched from PowerShell
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND data_win_eventdata_sourceImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: LSASS or privileged-process access from PowerShell (credential theft)
    query: data_win_system_eventID:"10" AND (data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss].[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn].[Ee][Xx][Ee]/) AND data_win_eventdata_sourceImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 2h
  - name: Shellcode, reflective load and in-memory loader script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*GetProcAddress* OR data_win_eventdata_scriptBlockText:*GetModuleHandle* OR data_win_eventdata_scriptBlockText:*Invoke-Shellcode* OR data_win_eventdata_scriptBlockText:*Invoke-ReflectivePEInjection* OR data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*CreateThread* OR data_win_eventdata_scriptBlockText:*Add-Type* OR data_win_eventdata_scriptBlockText:*NtCreateThreadEx*)
    pivot_on:
    - host
    window: 1h
  - name: 'PowerShell staging: network connections and download or encoded launch before the WinAPI call'
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_commandLine:*-enc* OR data_win_eventdata_commandLine:*DownloadString* OR data_win_eventdata_commandLine:*FromBase64String* OR data_win_eventdata_commandLine:*IEX*))
    pivot_on:
    - host
    window: 2h
  - name: Token theft and privilege escalation logons on this host
    query: (data_win_system_eventID:"4672" OR data_win_system_eventID:"4703" OR data_win_system_eventID:"4624") AND (data_win_eventdata_privilegeList:*SeDebugPrivilege* OR data_win_eventdata_enabledPrivilegeList:*SeDebugPrivilege* OR data_win_eventdata_logonType:"9")
    pivot_on:
    - host
    window: 2h
