name: PowerShell Script Block With URL Chain
id: windows-powershell-script-block-with-url-chain-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Identifies suspicious PowerShell script execution via EventCode 4104 that contains 
  multiple URLs within a function or array. It leverages PowerShell Script Block 
  Logging to detect script blocks with embedded URLs, often indicative of obfuscated 
  scripts or those attempting to download secondary payloads. This activity is 
  significant as it may signal an attempt to execute malicious code or download 
  additional malware. If confirmed malicious, this could lead to code execution, 
  further system compromise, or data exfiltration.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*http:*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*https:*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  No false positives have been identified at this time. Scripts containing multiple 
  URLs within arrays are typically used for malicious purposes such as downloading 
  secondary payloads or establishing command and control communications.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/
  - https://www.mandiant.com/resources/blog/tracking-evolution-gootloader-operations
  - https://thedfirreport.com/2022/05/09/seo-poisoning-a-gootloader-story/

response:
  message: >
    URL chain detected in PowerShell script block on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001, T1105
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Malicious PowerShell
    - Hellcat Ransomware
    - Gootloader
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1105
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*http:.*/ OR data_win_eventdata_scriptBlockText:/.*https:.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Process-creation view of the same download cradle (IEX/DownloadString) whose URLs the 4104 block exposes; confirms the launching command line and parent.
  - id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
    name: PowerShell Download Pattern
    reason: Co-occurring command-line download primitives (WebClient/Invoke-WebRequest) for the URL list found in the script block.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Gootloader-style stagers launch hidden PowerShell that reaches out to the embedded URLs; the same process explains the script block.
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: URL-array stagers are often wrapped in encoded IEX; this is the obfuscated launch preceding the logged decoded block.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded command launch is the typical precursor that makes the decoded URL chain appear in 4104.
  - id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
    name: Potential DLL File Download Via PowerShell Invoke-WebRequest
    reason: 'Follow-on: the URL chain fetching a DLL payload to disk for rundll32/regsvr32 execution.'
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: AMSI scanning of the same malicious script content on the host corroborates the script block is hostile.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Gootloader delivers a JScript dropper via wscript that spawns this PowerShell; the precursor stage.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon network connections by PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 1h
  - name: DNS lookups from PowerShell processes
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/
    pivot_on:
    - host
    window: 1h
  - name: Files dropped by PowerShell or script hosts
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Ww]script|[Cc]script|[Mm]shta).*/ AND data_win_eventdata_targetFilename:/.*\.(dll|exe|js|jse|hta|ps1|bat|vbs|lnk|zip)/
    pivot_on:
    - host
    window: 2h
  - name: Script host or Office parent launching PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_parentImage:/.*(wscript|cscript|mshta|winword|excel|outlook|cmd)\.exe/
    pivot_on:
    - host
    window: 1h
  - name: Persistence set by script hosts or PowerShell
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|Winlogon).*/ AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Ww]script|[Cc]script).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/)
    pivot_on:
    - host
    window: 4h
