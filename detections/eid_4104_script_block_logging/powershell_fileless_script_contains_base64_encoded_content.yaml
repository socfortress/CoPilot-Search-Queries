name: Powershell Fileless Script Contains Base64 Encoded Content
id: windows-powershell-fileless-script-contains-base64-encoded-content-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of PowerShell scripts containing Base64 encoded content, 
  specifically identifying the use of FromBase64String. It leverages PowerShell 
  Script Block Logging (EventCode 4104) to capture and analyze the full command 
  sent to PowerShell. This activity is significant as Base64 encoding is often 
  used by attackers to obfuscate malicious payloads, making it harder to detect. 
  If confirmed malicious, this could lead to code execution, allowing attackers 
  to run arbitrary commands and potentially compromise the system.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*FromBase64String*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*frombase64string*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  False positives should be limited. Base64 decoding with FromBase64String in 
  PowerShell is often used for obfuscation. Filter based on script source and 
  user context, but investigate all matches.

references:
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html
  - https://thedfirreport.com/2023/05/22/icedid-macro-ends-in-nokoyawa-ransomware/

response:
  message: >
    Base64 encoded content detected in PowerShell script block on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Winter Vivern
    - Malicious PowerShell
    - Medusa Ransomware
    - Data Destruction
    - NjRAT
    - AsyncRAT
    - Hermetic Wiper
    - IcedID
    - XWorm
    - 0bj3ctivity Stealer
    - Hellcat Ransomware
    - NetSupport RMM Tool Abuse
    - MuddyWater
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*FromBase64String.*/ OR data_win_eventdata_scriptBlockText:/.*frombase64string.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: df69cb1d-b891-4cd9-90c7-d617d90100ce
    name: Suspicious FromBase64String Usage On Gzip Archive - Ps Script
    reason: Same decode primitive; Base64 followed by GZip decompression is the classic layered in-memory loader staging.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Decoded Base64 bytes are typically passed to Assembly.Load to run a .NET payload without touching disk.
  - id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
    name: PowerShell Loading DotNET into Memory via Reflection
    reason: Follow-on step where the decoded assembly is loaded into the PowerShell process memory.
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: Base64 blobs often carry shellcode that the script then injects via P/Invoke GetProcAddress/VirtualAlloc.
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Decoded Base64 is frequently raw shellcode copied to executable memory by the same script block.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: the encoded stage is often fetched by a download cradle in an earlier script block.'
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: Loaders disable AMSI right before decoding and running the payload to avoid content scanning.
  - id: 907ac95c-4dd9-11ec-ba2c-acde48001122
    name: PowerShell Windows Defender Exclusion Commands
    reason: Post-execution defense evasion commonly seen once the decoded payload runs in the same session.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reflection assembly load / in-memory .NET execution
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]eflection.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]ssembly.{1,3}[Ll]oad.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]ntry[Pp]oint.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke[Mm]ember.*/)
    pivot_on:
    - host
    window: 1h
  - name: Shellcode allocation and P/Invoke injection primitives
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*VirtualAlloc* OR data_win_eventdata_scriptBlockText:*GetProcAddress* OR data_win_eventdata_scriptBlockText:*CreateThread* OR data_win_eventdata_scriptBlockText:*WriteProcessMemory*)
    pivot_on:
    - host
    window: 1h
  - name: GZip/Deflate decompression of decoded payload and AMSI tampering
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*GzipStream* OR data_win_eventdata_scriptBlockText:*DeflateStream* OR data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*AmsiUtils*)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawned by Office/script host or run with encoded arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_parentImage:/.*(WINWORD|EXCEL|mshta|wscript|cscript|rundll32|wmiprvse).*/ OR data_win_eventdata_commandLine:/.*(-[Ee]nc|-[Ee]ncodedCommand|-[Ww]indow[Ss]tyle +[Hh]idden|[Ff]rom[Bb]ase64).*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell network connections after decode (C2 / payload fetch)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 1h
