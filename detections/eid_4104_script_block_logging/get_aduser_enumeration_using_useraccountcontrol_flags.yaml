name: Get-ADUser Enumeration Using UserAccountControl Flags
id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
version: 1
schema_version: "1.0"
date: "2022-03-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects AS-REP roasting is an attack that is often-overlooked. It is not very
  common as you have to explicitly set accounts that do not require
  pre-authentication. MITRE ATT&CK: T1033.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Get-ADUser*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Filter*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*useraccountcontrol*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-band*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText: "*4194304*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-ADUser*';
  data_win_eventdata_scriptBlockText matches '*-Filter*';
  data_win_eventdata_scriptBlockText matches '*useraccountcontrol*', among other
  conditions.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.002/T1069.002.md#atomic-test-11---get-aduser-enumeration-using-useraccountcontrol-flags-as-rep-roasting
  - https://shellgeek.com/useraccountcontrol-flags-to-manipulate-properties/
  - https://attack.mitre.org/techniques/T1033/

response:
  message: >
    Get-ADUser Enumeration Using UserAccountControl Flags detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1033
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - aduser
    - enumeration
    - useraccountcontrol
    - powershell
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*-[Ff][Ii][Ll][Tt][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*-[Bb][Aa][Nn][Dd].*/ AND data_win_eventdata_scriptBlockText:/.*4194304.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: Same AS-REP roasting target discovery via Get-ADUser using the DoesNotRequirePreAuth property instead of the UAC bitmask; attackers often try both forms in one session.
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: Alternate tooling for the same hunt for accounts without pre-auth; PowerView alongside Get-ADUser shows a broader AD recon toolkit.
  - id: 59b51620-94c9-11ec-b3d5-acde48001122
    name: Kerberos Pre-Authentication Flag Disabled with PowerShell
    reason: 'Precursor or persistence variant: an attacker with rights sets the 4194304 DONT_REQ_PREAUTH flag on an account to make it roastable, the same flag this rule searches for.'
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: 'Direct follow-on: after listing no-preauth accounts the attacker requests their AS-REP (4768 without pre-auth) to crack offline.'
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: Rubeus asreproast/asktgt loaded reflectively in PowerShell is the usual next step to harvest hashes of the enumerated accounts.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Compiled Rubeus run (asreproast) on disk after the enumeration step to extract roastable hashes.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: PowerView in the same session (Get-DomainUser -PreauthNotRequired) indicates wider AD reconnaissance around the same user hunt.
  - id: c2993223-6da8-4b1a-88ee-668b8bf315e9
    name: User Discovery And Export Via Get-ADUser Cmdlet - PowerShell
    reason: Bulk Get-ADUser enumeration and export on the same host expands account discovery into data collection.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD user, SPN and pre-auth enumeration script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ee][Ss][Nn][Oo][Tt][Rr][Ee][Qq][Uu][Ii][Rr][Ee][Pp][Rr][Ee][Aa][Uu][Tt][Hh].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Rr][Ee][Aa][Uu][Tt][Hh][Nn][Oo][Tt][Rr][Ee][Qq][Uu][Ii][Rr][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Rubeus / Kerberos roasting tooling executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Uu][Bb][Ee][Uu][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Aa][Ss][Kk][Tt][Gg][Tt]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Gg][Ee][Tt][Uu][Ss][Ee][Rr][Ss][Pp][Nn][Ss]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Offline hash cracking tools or roast hash files
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Hh][Aa][Ss][Hh][Cc][Aa][Tt]|[Jj][Oo][Hh][Nn])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Kk][Rr][Bb]5[Aa][Ss][Rr][Ee][Pp]|18200).*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa][Ss][Rr][Ee][Pp]|[Kk][Rr][Bb]5|[Hh][Aa][Ss][Hh][Ee][Ss]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Domain recon binaries and AD module loads on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell launched with encoded or download-cradle arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(-[Ee][Nn][Cc]|-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Ii][Ee][Xx]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]).*/
    pivot_on:
    - host
    window: 1h
