name: Powershell Fileless Process Injection via GetProcAddress
id: windows-powershell-fileless-process-injection-via-getprocaddress-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the use of GetProcAddress in PowerShell script blocks, leveraging PowerShell 
  Script Block Logging (EventCode 4104). This method captures the full command sent to 
  PowerShell, which is then logged in Windows event logs. The presence of GetProcAddress 
  is unusual for typical PowerShell scripts and often indicates malicious activity, as 
  many attack toolkits use it to achieve fileless code execution. If confirmed malicious, 
  this activity could allow an attacker to execute arbitrary code, potentially leading 
  to system compromise.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*GetProcAddress*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Limited false positives. GetProcAddress usage in PowerShell is highly unusual and 
  typically indicates malicious intent for process injection or fileless code execution. 
  Review the full script block context and parent process for confirmation.

references:
  - https://attack.mitre.org/techniques/T1055/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html

response:
  message: >
    Fileless process injection via GetProcAddress detected on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1055, T1059.001
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Hellcat Ransomware
    - Malicious PowerShell
    - Hermetic Wiper
    - Data Destruction
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*GetProcAddress.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: GetProcAddress resolves the Win32 APIs that a shellcode runner then uses; the same script block usually carries a byte array/shellcode loader, confirming the injection intent
  - id: 03d83090-8cba-44a0-b02f-0b756a050306
    name: Potential WinAPI Calls Via PowerShell Scripts
    reason: 'Same P/Invoke Add-Type pattern: VirtualAlloc/WriteProcessMemory/CreateThread declarations typically sit beside GetProcAddress in one loader'
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Fileless loaders pair native API resolution with Assembly.Load of an in-memory payload; co-occurrence on the host marks a staged in-memory implant
  - id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
    name: PowerShell Loading DotNET into Memory via Reflection
    reason: Reflective .NET loading is the alternative or companion fileless stage to native GetProcAddress injection
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Attackers patch AMSI via reflection/native APIs just before running injection code so the payload is not scanned; a precursor in the same session
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The injected shellcode or loader is usually pulled by a download cradle in an earlier script block, preceding the GetProcAddress stage
  - id: 99b97608-3e21-4bfe-8217-2a127c396a0e
    name: Remote Thread Creation Via PowerShell In Uncommon Target
    reason: Sysmon EID 8 is the runtime result of PowerShell injection (CreateRemoteThread) into another process, confirming the script actually injected
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Reflective injection (Invoke-ReflectivePEInjection) is the standard way Invoke-Mimikatz is loaded in memory, making credential theft the likely next step
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shellcode-runner API primitives in script blocks (VirtualAlloc/CreateThread/WriteProcessMemory)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]rite[Pp]rocess[Mm]emory.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Rr]emote[Tt]hread.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Tt]hread.*/ OR data_win_eventdata_scriptBlockText:/.*[Oo]pen[Pp]rocess.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Mm]odule[Hh]andle.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal.*[Gg]et[Dd]elegate.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Pp]rotect.*/)
    pivot_on:
    - host
    window: 1h
  - name: Sysmon remote thread creation and process access by PowerShell
    query: (data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*[Pp]ower[Ss]hell.*/) OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x1f3fff" OR data_win_eventdata_grantedAccess:"0x143a" OR data_win_eventdata_grantedAccess:"0x1410"))
    pivot_on:
    - host
    window: 1h
  - name: Download cradle, AMSI/ETW tampering and reflective loading in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*amsiInitFailed.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Ss]can[Bb]uffer.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]vent[Pp]rovider.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound network connections (staging or C2 callback after injection)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*)/
    pivot_on:
    - host
    window: 2h
  - name: Credential access following injection (LSASS access or Mimikatz keywords)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*sekurlsa.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflective[Pp][Ee][Ii]njection.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]ini[Dd]ump[Ww]rite[Dd]ump.*/))
    pivot_on:
    - host
    window: 4h
