name: Unloading AMSI via Reflection
id: a21e3484-c94d-11eb-b55b-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the tampering of AMSI (Antimalware Scan Interface) 
  via PowerShell reflection. It leverages PowerShell Script Block Logging (EventCode=4104) 
  to capture and analyze suspicious PowerShell commands, specifically those involving 
  `system.management.automation.amsi`. This activity is significant as it indicates 
  an attempt to bypass AMSI, a critical security feature that helps detect and block 
  malicious scripts. If confirmed malicious, this could allow an attacker to execute 
  harmful code undetected, leading to potential system compromise, data exfiltration, 
  and further malware deployment.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*system.management.automation.amsi*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for references to the System.Management.Automation.AmsiUtils class used to disable 
  AMSI scanning via reflection. Validate that data_win_eventdata_scriptBlockText 
  field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Potential for some third party applications to disable AMSI upon invocation. Filter 
  based on application context and whether the action was expected and authorized 
  within your organization.

references:
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://static1.squarespace.com/static/552092d5e4b0661088167e5c/t/59c1814829f18782e24f1fe2/1505853768977/Windows+PowerShell+Logging+Cheat+Sheet+ver+Sept+2017+v2.1.pdf
  - https://www.crowdstrike.com/blog/investigating-powershell-command-and-script-logging/

response:
  message: >
    AMSI tampering via reflection detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Attacker is attempting to bypass antimalware scanning to execute undetected code. 
    MITRE ATT&CK: T1059.001, T1562
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Malicious PowerShell
    - Hermetic Wiper
    - Data Destruction
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1562
  custom_tags:
    - amsi_bypass
    - reflection
    - defense_evasion
    - powershell
    - amsiutils
    - antimalware_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*system\.management\.automation\.amsi.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Sibling 4104 AMSI-bypass pattern (GetType on AmsiUtils); a second variant on the same host confirms a deliberate, iterated bypass attempt
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Process-creation view of the same reflection-based AMSI patch, showing the commandline of the PowerShell host that performed it
  - id: fa2559c8-1197-471d-9cdd-05a0273d4522
    name: Potential AMSI Bypass Script Using NULL Bits
    reason: Alternative AMSI-disable technique attackers rotate to when the reflection variant is blocked
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: AMSI bypass is typically paired with ETW patching in the same script prelude to blind telemetry before the payload runs
  - id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
    name: Tamper Windows Defender - ScriptBlockLogging
    reason: 'Defense-evasion follow-on: once AMSI is unloaded, actors disable Defender real-time protection via Set-MpPreference'
  - id: 907ac95c-4dd9-11ec-ba2c-acde48001122
    name: PowerShell Windows Defender Exclusion Commands
    reason: 'Follow-on evasion: adding Defender exclusion paths for the payload staged after AMSI is neutralised'
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: AMSI is unloaded so a download cradle can fetch and run a flagged payload; likely next script block
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: 'Post-bypass payload delivery: loading a .NET assembly in memory, which AMSI would otherwise scan'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradles in script blocks near AMSI bypass
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/)
    pivot_on:
    - host
    window: 1h
  - name: In-memory assembly loading and shellcode primitives
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Pp]roc[Aa]ddress.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal.*[Cc]opy.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Tt]hread.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/)
    pivot_on:
    - host
    window: 1h
  - name: Defender and ETW tampering script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]tw[Ee]vent[Ww]rite.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]sh[Aa]ttr.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell launches with hidden/encoded/bypass flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*-[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*-[Ww]indow[Ss]tyle.*[Hh]idden.*/ OR data_win_eventdata_commandLine:/.*-[Nn]op.*/ OR data_win_eventdata_commandLine:/.*-[Ee]xec.*[Bb]ypass.*/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections from PowerShell after bypass
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 1h
