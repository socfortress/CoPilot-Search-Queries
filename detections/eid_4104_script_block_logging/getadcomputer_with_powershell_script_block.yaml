name: Get-AdComputer with PowerShell Script Block
id: a9a1da02-8e27-4bf7-a348-f4389c9da487
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-AdComputer` PowerShell 
  cmdlet using PowerShell Script Block Logging (EventID 4104). This detection leverages 
  script block text to identify when this cmdlet is run. The `Get-AdComputer` cmdlet 
  is significant as it can be used by adversaries to enumerate all domain computers, 
  aiding in situational awareness and Active Directory discovery. If confirmed malicious, 
  this activity could allow attackers to map the network, identify targets, and plan 
  further attacks, potentially leading to unauthorized access and data exfiltration.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-AdComputer*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-AdComputer cmdlet, which is used for domain computer 
  enumeration. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell cmdlet for legitimate 
  troubleshooting and network discovery purposes. Filter based on user context and 
  whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/get-adcomputer?view=windowsserver2019-ps
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet

response:
  message: >
    Get-AdComputer execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain computer enumeration/network discovery/reconnaissance activity. 
    MITRE ATT&CK: T1018
  risk_score: 42
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 42
    - field: data_win_eventdata_user
      type: user
      score: 42
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - CISA AA22-320A
    - Medusa Ransomware
    - Gozi Malware
    - Network Mapping
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - get_adcomputer
    - active_directory
    - computer_enumeration
    - domain_computers
    - network_discovery
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-AdComputer.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: db885529-903f-4c5d-9864-28fe199e6370
    name: Computer Discovery And Export Via Get-ADComputer Cmdlet - PowerShell
    reason: 'Same cmdlet in script blocks but with Export-Csv/Out-File: the computer list is being staged to disk for target planning or exfil'
  - id: 435e10e4-992a-4281-96f3-38b11106adde
    name: Computer Discovery And Export Via Get-ADComputer Cmdlet
    reason: Process-creation view of the same Get-ADComputer enumeration with export, confirming the launching command line
  - id: 1114e048-b69c-4f41-bc20-657245ae6e3f
    name: User Discovery And Export Via Get-ADUser Cmdlet
    reason: Computer enumeration is typically paired with user enumeration through the same ActiveDirectory module to choose targets and accounts
  - id: de7fcadc-04f3-11ec-a241-acde48001122
    name: AdsiSearcher Account Discovery
    reason: Module-less AD enumeration often used in the same recon script alongside Get-ADComputer
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Group enumeration is the usual next recon step after mapping domain computers, to find admin groups and privileged targets
  - id: 4fa7f846-054a-11ec-a836-acde48001122
    name: Get-DomainTrust with PowerShell
    reason: Domain/trust discovery follows computer enumeration when mapping lateral movement paths
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Automated AD mapping is the escalation of manual Get-ADComputer enumeration
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is the common alternative AD enumeration tool used by ransomware crews such as Medusa in the same discovery phase
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Computer list exported or staged to disk from script block
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Cc]omputer.*/ AND (data_win_eventdata_scriptBlockText:/.*[Ee]xport-[Cc]sv.*/ OR data_win_eventdata_scriptBlockText:/.*[Oo]ut-[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Cc]ontent.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]onvert[Tt]o-[Cc]sv.*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Other AD object enumeration (users, groups, domain, trusts, PowerView, BloodHound) in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Dd]omain.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Ff]orest.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[A-Za-z]+.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss]earcher.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Native domain recon and AD tooling processes started
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Ll][Dd][Ii][Ff][Dd][Ee])\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:(*group* OR *domain* OR *view*)))
    pivot_on:
    - host
    window: 2h
  - name: Lateral movement toward discovered hosts (PsExec, WinRM, remote WMI, admin shares)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:(*Enter-PSSession* OR *Invoke-Command* OR *New-PSSession* OR *admin$* OR *c$\*))) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:("5985" OR "5986" OR "445" OR "135"))
    pivot_on:
    - host
    - user
    window: 4h
  - name: Payload staging and download cradles following recon
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*Start-BitsTransfer*))
    pivot_on:
    - host
    - user
    window: 4h
