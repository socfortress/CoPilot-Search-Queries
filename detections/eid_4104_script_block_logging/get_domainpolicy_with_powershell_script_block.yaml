name: Get DomainPolicy with PowerShell Script Block
id: a360d2b2-065a-11ec-b0bf-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainPolicy` cmdlet using 
  PowerShell Script Block Logging (EventID 4104). This command is used to obtain the 
  password policy in a Windows domain. This activity is significant as it indicates 
  potential reconnaissance efforts by adversaries or Red Teams to gather domain policy 
  information. If confirmed malicious, this behavior could lead to detailed knowledge of 
  domain security settings, aiding in privilege escalation or lateral movement within 
  the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainPolicy*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  Ensure PowerShell Script Block Logging (EventID 4104) is enabled on Windows endpoints. 
  Configure the Wazuh agent to forward PowerShell operational logs from 
  Microsoft-Windows-PowerShell/Operational channel. Validate that 
  data_win_eventdata_scriptBlockText field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use Get-DomainPolicy for legitimate domain administration, 
  troubleshooting, and compliance auditing purposes. Filter based on user context and 
  whether the action was expected and authorized within your organization.

references:
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainPolicy/
  - https://attack.mitre.org/techniques/T1201/
  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/get-domainpolicy

response:
  message: >
    Get-DomainPolicy execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain policy reconnaissance/enumeration activity. 
    MITRE ATT&CK: T1201
  risk_score: 45
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 45
    - field: data_win_eventdata_user
      type: user
      score: 45
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Password Policy Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1201
  custom_tags:
    - get_domainpolicy
    - active_directory
    - domain_policy
    - policy_discovery
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainPolicy.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-DomainPolicy is a PowerView/PowerSploit cmdlet; PowerView being loaded in the same session is the toolkit behind this recon
  - id: 1ff7ccc8-065a-11ec-91e4-acde48001122
    name: Get ADDefaultDomainPasswordPolicy with Powershell Script Block
    reason: Same password-policy objective via the native AD module; operators often try both when one is unavailable
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Knowing lockout/complexity policy precedes user enumeration to size a safe password-spray list
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: Follow-on PowerView group enumeration to find privileged targets after learning the policy
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: PowerView domain-structure recon (trusts) commonly run in the same burst as policy discovery
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: Escalation of AD recon to Kerberoasting target discovery within the same PowerView session
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: AS-REP roastable account hunting is a typical next PowerView step after policy recon
  - id: windows-powershell-domain-enumeration-001
    name: Windows PowerShell Domain Enumeration
    reason: Broader PowerShell domain enumeration co-occurring with the policy query
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerView / PowerSploit cmdlets and loading in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Pp]ower[Vv]iew.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]ower[Ss]ploit.*/ OR data_win_eventdata_scriptBlockText:/.*Get-Net(User|Computer|Group|Domain|Session|LoggedOn|Share).*/ OR data_win_eventdata_scriptBlockText:/.*Get-Domain(User|Computer|Group|Trust|Controller|SID|GPO|OU).*/ OR data_win_eventdata_scriptBlockText:/.*Find-(LocalAdminAccess|DomainShare|InterestingDomainAcl).*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-(ShareFinder|UserHunter|Kerberoast).*/)
    pivot_on:
    - host
    window: 2h
  - name: Password-spray / Kerberoast / AS-REP follow-on in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Invoke-(DomainPasswordSpray|Kerberoast|ASREPRoast).*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]ubeus.*/ OR data_win_eventdata_scriptBlockText:/.*DirectoryServices\.AccountManagement.*/ OR data_win_eventdata_scriptBlockText:/.*ValidateCredentials.*/ OR data_win_eventdata_scriptBlockText:/.*Get-SPNTicket.*/)
    pivot_on:
    - host
    window: 4h
  - name: net/nltest/dsquery/gpresult/setspn domain recon process creation
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Aa]ccounts|[Gg]roup|[Dd]omain|[Tt]rust).*/) OR data_win_eventdata_image:/.*\\([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Gg][Pp][Rr][Ee][Ss][Uu][Ll][Tt]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: SharpHound / BloodHound collection artifacts
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*([Ss]harp[Hh]ound|[Bb]lood[Hh]ound|-[Cc]ollection[Mm]ethod).*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*_(BloodHound|computers|users|groups|domains|gpos|ous|containers)\.json.*/)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell connections to domain controller LDAP/Kerberos/SMB ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"3268")
    pivot_on:
    - host
    window: 1h
