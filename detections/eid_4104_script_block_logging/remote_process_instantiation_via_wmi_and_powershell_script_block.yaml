name: Remote Process Instantiation via WMI and PowerShell Script Block
id: 2a048c14-4634-11ec-a618-3e22fbd008af
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Invoke-WmiMethod` commandlet 
  with parameters used to start a process on a remote endpoint via WMI, leveraging 
  PowerShell Script Block Logging (EventCode=4104). This method identifies specific 
  script block text patterns associated with remote process instantiation via the 
  Win32_Process class. This activity is significant as it may indicate lateral 
  movement or remote code execution attempts by adversaries. If confirmed malicious, 
  this could allow attackers to execute arbitrary code on remote systems, potentially 
  leading to further compromise and persistence within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-WmiMethod*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*-CN*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*-ComputerName*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-Class Win32_Process*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-Name create*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for Invoke-WmiMethod cmdlet targeting the Win32_Process class with the create method 
  on remote systems. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators may leverage WMI and Invoke-WmiMethod to start a process on remote 
  systems for system administration or automation use cases, but this activity is 
  usually limited to a small set of hosts or users. Validate that such activity is 
  authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1047/
  - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.management/invoke-wmimethod?view=powershell-5.1
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html

response:
  message: >
    WMI remote process instantiation detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates potential lateral movement via Invoke-WmiMethod and Win32_Process. 
    MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - wmi_lateral_movement
    - invoke_wmimethod
    - win32_process
    - remote_code_execution
    - powershell
    - create_method
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Invoke-WmiMethod.*/ AND (data_win_eventdata_scriptBlockText:/.*-CN.*/ OR data_win_eventdata_scriptBlockText:/.*-ComputerName.*/) AND data_win_eventdata_scriptBlockText:/.*-Class Win32_Process.*/ AND data_win_eventdata_scriptBlockText:/.*-Name create.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: 'Target-side counterpart: the remote Win32_Process.Create lands as WmiPrvSE.exe spawning powershell on the victim host, confirming the source-side Invoke-WmiMethod succeeded.'
  - id: d21374ff-f574-44a7-9998-4a8c8bf33d7d
    name: WmiPrvSE Spawned A Process
    reason: Any process spawned by WmiPrvSE.exe on the destination is the payload launched by the Win32_Process Create call this rule saw being issued.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: Flags WmiPrvSE children such as cmd/mshta/rundll32 on the target, the typical payload of a remote WMI create.
  - id: 24869767-8579-485d-9a4f-d9ddfd8f0cac
    name: Process Execution via WMI
    reason: Same WMI process-creation primitive observed at process-creation level, corroborating the script block with actual execution.
  - id: 526be59f-a573-4eea-b5f7-f0973207634d
    name: Process Creation Attempt via Wmic.EXE
    reason: Operators alternate between Invoke-WmiMethod and wmic /node process call create for the same remote execution; either on this host widens the lateral-movement picture.
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Impacket wmiexec uses the same Win32_Process.Create mechanism; seeing it on the target suggests a tooled intrusion rather than admin scripting.
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: Operator trying alternate remote-execution transports (DCOM) from the same PowerShell session when WMI is blocked or for redundancy.
  - id: 7d4c618e-4716-11ec-951c-3e22fbd008af
    name: Remote Process Instantiation via WinRM and PowerShell Script Block
    reason: Operator fanning out to further hosts via WinRM Invoke-Command from the same source host after WMI execution.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by WmiPrvSE (remote WMI payload on target)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Remote-exec cmdlets and credential use in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-WmiMethod* OR data_win_eventdata_scriptBlockText:*Invoke-CimMethod* OR data_win_eventdata_scriptBlockText:*New-CimSession* OR data_win_eventdata_scriptBlockText:*Invoke-Command* OR data_win_eventdata_scriptBlockText:*Enter-PSSession* OR data_win_eventdata_scriptBlockText:*Get-Credential* OR data_win_eventdata_scriptBlockText:*PSCredential*)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Network logons (type 3) and explicit-credential logons
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")) OR data_win_system_eventID:"4648"
    pivot_on:
    - host
    - user
    window: 2h
  - name: Download cradle or encoded payload in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*-EncodedCommand* OR data_win_eventdata_scriptBlockText:*Net.WebClient*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound SMB/RPC/WinRM connections from PowerShell (lateral fan-out)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 2h
