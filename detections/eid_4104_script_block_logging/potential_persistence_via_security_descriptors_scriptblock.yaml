name: Potential Persistence Via Security Descriptors - ScriptBlock
id: 2f77047c-e6e9-4c11-b088-a3de399524cd
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f77047c-e6e9-4c11-b088-a3de399524cd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of certain functions and keywords that are used to manipulate
  security descriptors in order to potentially set a backdoor. As seen used in
  the DAMP project.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*win32_Trustee*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*win32_Ace*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.AccessMask*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.AceType*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.SetSecurityDescriptor*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Lsa\\\\JD*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Lsa\\\\Skew1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Lsa\\\\Data*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Lsa\\\\GBG*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*win32_Trustee*';
  data_win_eventdata_scriptBlockText matches '*win32_Ace*';
  data_win_eventdata_scriptBlockText matches '*.AccessMask*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/HarmJ0y/DAMP

response:
  message: >
    Potential Persistence Via Security Descriptors - ScriptBlock detected on
    host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - security
    - descriptors
    - powershell
    - privilege_escalation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Tt][Rr][Uu][Ss][Tt][Ee][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Aa][Cc][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Aa][Cc][Cc][Ee][Ss][Ss][Mm][Aa][Ss][Kk].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Aa][Cc][Ee][Tt][Yy][Pp][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Ss][Ee][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr].*/ AND (data_win_eventdata_scriptBlockText:/.*\\[Ll][Ss][Aa]\\[Jj][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Ll][Ss][Aa]\\[Ss][Kk][Ee][Ww]1.*/ OR data_win_eventdata_scriptBlockText:/.*\\[Ll][Ss][Aa]\\[Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Ll][Ss][Aa]\\[Gg][Bb][Gg].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: The Lsa JD/Skew1/Data/GBG ACL change (DAMP remote-registry backdoor) exists so SAM/SYSTEM/SECURITY hives can be read or saved remotely without admin; reg save of those hives is the direct payoff.
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: Once the boot-key (Lsa JD/Skew1/Data/GBG) keys are readable, the SAM hive is exported to disk to recover local hashes.
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: Secretsdump-style remote registry hive dumping is the tool-driven follow-on that consumes the permissive descriptors on the Lsa keys.
  - id: 6c8fbee5-dee8-49bc-851d-c3142d02aa47
    name: Allow Service Access Using Security Descriptor Tampering Via Sc.EXE
    reason: Same tradecraft family (descriptor tampering for stealth backdoor access) applied to services; often co-occurs when an operator plants several ACL backdoors.
  - id: 991a9744-f2f0-44f2-bd33-9092eba17dc3
    name: Enable Windows Remote Management
    reason: DAMP also backdoors WMI/PSRemoting descriptors; enabling WinRM on the host is a typical preparatory step for remote access via the modified ACLs.
  - id: a0edd39f-a0c6-4c17-8141-261f958e8d8f
    name: PowerShell Remote Session Creation
    reason: Remote PowerShell sessions indicate use of the PSRemoting access the descriptor changes are meant to preserve.
  - id: 9e07f6e7-83aa-45c6-998e-0af26efd0a85
    name: Powershell WMI Persistence
    reason: Co-occurring WMI-based persistence from the same toolkit; confirms an operator deliberately building durable access.
  - id: 84c174ab-d3ef-481f-9c86-a50d0b8e3edb
    name: PowerShell Get-Process LSASS in ScriptBlock
    reason: Credential-theft intent in PowerShell on the same host; the ACL backdoor is a credential-access enabler so LSASS-targeting script blocks reinforce it.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive saves / SAM-SECURITY-SYSTEM export on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*(\\[Ss][Aa][Mm]|\\[Ss][Yy][Ss][Tt][Ee][Mm]|\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ss][Aa][Mm].[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm].[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].[Ss][Aa][Vv][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: Registry access to Lsa boot-key / SAM / LSA secrets keys
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Ll][Ss][Aa]\\([Jj][Dd]|[Ss][Kk][Ee][Ww]1|[Dd][Aa][Tt][Aa]|[Gg][Bb][Gg]).*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Aa][Mm]\\[Ss][Aa][Mm]\\[Dd][Oo][Mm][Aa][Ii][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Pp][Oo][Ll][Ii][Cc][Yy]\\[Ss][Ee][Cc][Rr][Ee][Tt][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Remote-access-enabling PowerShell: PSRemoting, WMI/session ACL edits'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Pp][Ss][Rr][Ee][Mm][Oo][Tt][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ww][Mm][Ii][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Aa][Cc][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Tt][Ee][Rr][Ee][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm] [Ww][Ss][Mm][Aa][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons to this host after the descriptor change
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on:
    - host
    window: 2h
  - name: Credential-dumping tools or LSASS access on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
