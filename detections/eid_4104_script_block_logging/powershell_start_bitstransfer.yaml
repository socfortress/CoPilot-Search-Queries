name: PowerShell Start-BitsTransfer
id: windows-powershell-start-bitstransfer-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of the PowerShell command Start-BitsTransfer, which can be 
  used for file transfers, including potential data exfiltration. It leverages data 
  from process creation events (Sysmon EventID 1) and PowerShell Script Block Logging 
  (EventID 4104) to identify command-line arguments containing Start-BitsTransfer. 
  This activity is significant because Start-BitsTransfer can be abused by adversaries 
  to upload sensitive files to remote locations, posing a risk of data loss. If 
  confirmed malicious, this could lead to unauthorized data exfiltration, compromising 
  sensitive information and potentially leading to further exploitation of the network.

data_source:
  - Sysmon EventID 1
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "1"
              - term:
                  data_win_system_eventID: "4104"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*"
              - wildcard:
                  data_win_eventdata_image: "*powershell_ise*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*start-bitstransfer*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*start-bitstransfer*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed (EventID 1) and PowerShell Script Block Logging (EventID 4104) enabled. 
  For Script Block Logging, enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The index pattern 
  should match your Wazuh index naming convention.

known_false_positives: >
  Limited false positives. It is possible administrators will utilize Start-BitsTransfer 
  for legitimate administrative tasks such as downloading updates or transferring files 
  within the organization. Filter based on parent process, user context, and source/destination 
  URLs to identify anomalies.

references:
  - https://attack.mitre.org/techniques/T1197/
  - https://isc.sans.edu/diary/Investigating+Microsoft+BITS+Activity/23281
  - https://docs.microsoft.com/en-us/windows/win32/bits/using-windows-powershell-to-create-bits-transfer-jobs

response:
  message: >
    BITS Transfer activity detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1197
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - BITS Jobs
    - Gozi Malware
    - Data Exfiltration
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1197
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" OR data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*powershell.*/ OR data_win_eventdata_image:/.*powershell_ise.*/) AND data_win_eventdata_commandLine:/.*Start-BitsTransfer.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b9cbbc17-d00d-4e3d-a827-b06d03d2380d
    name: Monitoring For Persistence Via BITS
    reason: BITS jobs with a notify command run a program after transfer completes; the persistence follow-on of the same BITS abuse
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Same BITS download channel via bitsadmin.exe; attackers swap between cmdlet and CLI on the same host
  - id: 99c840f2-2012-46fd-9141-c761987550ef
    name: Suspicious Download From Direct IP Via Bitsadmin
    reason: BITS download from a raw IP indicates a staging/C2 server, confirming a malicious transfer
  - id: 5b80a791-ad9b-4b75-bcc1-ad4e1e89c200
    name: File With Suspicious Extension Downloaded Via Bitsadmin
    reason: Payload type (exe/dll/script) fetched over BITS shows which stage was dropped
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell reaching the internet is the typical wrapper around BITS downloads
  - id: 09576804-7a05-458e-a817-eb718ca91f54
    name: Suspicious PowerShell IEX Execution Patterns
    reason: Downloaded payload is commonly executed immediately via IEX in the same PowerShell chain
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: When BITS is used in upload direction for exfiltration, rclone is the common companion exfil tool
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Data is staged and archived before upload with Start-BitsTransfer -TransferType Upload
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files dropped by PowerShell/BITS in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Bb]its[Aa]dmin|[Ss]vchost).*/ AND data_win_eventdata_targetFilename:/.*(\[Tt]emp\|\[Aa]pp[Dd]ata\|\[Pp]rogram[Dd]ata\|\[Pp]ublic\|\[Dd]ownloads\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Zz][Ii][Pp]|[Ii][Ss][Oo]|[Ll][Nn][Kk])/
    pivot_on:
    - host
    window: 1h
  - name: Execution of binaries from user-writable paths launched by script hosts
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\[Tt]emp\|\[Aa]pp[Dd]ata\|\[Pp]rogram[Dd]ata\|\[Pp]ublic\|\[Dd]ownloads\).*\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*(\[Pp]ower[Ss]hell|\[Cc]md|\[Ww]script|\[Cc]script|\[Mm]shta)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: BITS persistence and job setup commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Bb]its[Aa]dmin.*(\/[Tt]ransfer|\/[Ss]et[Nn]otify[Cc]md[Ll]ine|\/[Aa]dd[Ff]ile|\/[Rr]esume|\/[Cc]reate).*/ OR data_win_eventdata_commandLine:/.*([Aa]dd|[Ss]et|[Rr]esume|[Cc]omplete)-[Bb]its(Transfer|File|[Jj]ob).*/)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell outbound connections to external addresses
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true" AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*|172\.(1[6-9]|2[0-9]|3[01])\..*)/
    pivot_on:
    - host
    window: 1h
  - name: Data staging and archiving before upload
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_image:/.*\(7z|7za|[Rr]ar|[Ww]in[Rr][Aa][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Rr]clone|[Mm]ega[Cc][Mm][Dd]|[Ww]inscp).*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]|[Cc][Aa][Bb])/ AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on:
    - host
    window: 4h
