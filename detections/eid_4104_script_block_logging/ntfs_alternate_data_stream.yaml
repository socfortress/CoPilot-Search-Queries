name: NTFS Alternate Data Stream
id: 8c521530-5169-495d-a199-0a3a881ad24e
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Sami Ruohonen
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8c521530-5169-495d-a199-0a3a881ad24e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects writing data into NTFS alternate data streams from powershell. Needs
  Script Block Logging. MITRE ATT&CK: T1564.004, T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*set-content*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*add-content*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-stream*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*set-content*';
  data_win_eventdata_scriptBlockText matches '*add-content*';
  data_win_eventdata_scriptBlockText matches '*-stream*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20220614030603/http://www.powertheshell.com/ntfsstreams/
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.004/T1564.004.md
  - https://attack.mitre.org/techniques/T1564/004/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    NTFS Alternate Data Stream detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1564.004, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
    - T1059.001
  custom_tags:
    - alternate
    - stream
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/) AND data_win_eventdata_scriptBlockText:/.*-[Ss][Tt][Rr][Ee][Aa][Mm].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b69888d4-380c-45ce-9cf9-d9ce46e67821
    name: Hidden Executable In NTFS Alternate Data Stream
    reason: Sysmon EID15 stream-hash event is the file-level confirmation that the PowerShell -Stream write actually stored an executable payload in an ADS
  - id: 573df571-a223-43bc-846e-3f98da481eca
    name: Creation Of a Suspicious ADS File Outside a Browser Download
    reason: Non-browser creation of a named stream matches Set-Content/Add-Content -Stream writing a hidden stream
  - id: 45a594aa-1fbd-4972-a809-ff5a99dd81b8
    name: Run PowerShell Script from ADS
    reason: 'Direct follow-on: attacker stashes a script in a stream via -Stream, then executes it with powershell from the file:stream path'
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: Payload written to an ADS is later launched via cmd/wmic/forfiles from file:stream syntax
  - id: windows-alternate-datastream-process-execution-001
    name: Windows Alternate DataStream - Process Execution
    reason: Process-creation evidence that content hidden in a stream was executed after the write
  - id: 0d7a9363-af70-4e7b-a3b7-1a176b7fbe84
    name: Exports Registry Key To an Alternate Data Stream
    reason: Alternate stream-hiding technique for staging data (registry hive exports) on the same host, expands the stealth-storage story
  - id: 3109530e-ab47-4cc6-a953-cac5ebcc93ae
    name: ADS Zone.Identifier Deleted By Uncommon Application
    reason: 'Same ADS abuse family: removing Mark-of-the-Web streams to strip download origin before running a staged payload'
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: 'Companion concealment step: host file hiding often accompanies ADS stashing of a payload'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process execution from an alternate data stream path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[A-Za-z0-9_.\\-]+:[A-Za-z0-9_.-]+\.(ps1|exe|dll|vbs|js|bat|hta).*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*[Cc][Aa][Ll][Ll].*:.*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*-[Ss][Tt][Rr][Ee][Aa][Mm].*/)
    pivot_on:
    - host
    window: 1h
  - name: Named stream file creation (Sysmon EID 15) on this host
    query: data_win_system_eventID:"15" AND NOT data_win_eventdata_targetFilename:/.*[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr].*/
    pivot_on:
    - host
    window: 1h
  - name: Download cradles and encoded PowerShell script blocks preceding the stream write
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Zone.Identifier removal or file hiding alongside the stream write
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm].*[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Uu][Nn][Bb][Ll][Oo][Cc][Kk]-[Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Tt][Tt][Rr][Ii][Bb].*\+[HhSs].*/)) OR (data_win_system_eventID:"23" AND data_win_eventdata_targetFilename:/.*[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from script interpreters after the stream write
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
