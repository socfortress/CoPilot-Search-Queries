name: Computer Discovery And Export Via Get-ADComputer Cmdlet - PowerShell
id: db885529-903f-4c5d-9864-28fe199e6370
version: 1
schema_version: "1.0"
date: "2022-11-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: db885529-903f-4c5d-9864-28fe199e6370
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the Get-ADComputer cmdlet to collect computer information and
  output it to a file. MITRE ATT&CK: T1033.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Get-ADComputer *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "* -Filter \\**"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* | Select *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Out-File*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Set-Content*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Add-Content*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-ADComputer *';
  data_win_eventdata_scriptBlockText matches '* -Filter **';
  data_win_eventdata_scriptBlockText matches '* | Select *', among other
  conditions.

known_false_positives: >
  Legitimate admin scripts may use the same technique, it's better to exclude
  specific computers or users who execute these commands or scripts often.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
  - https://www.microsoft.com/en-us/security/blog/2022/10/18/defenders-beware-a-case-for-post-ransomware-investigations/
  - https://www.cisa.gov/uscert/sites/default/files/publications/aa22-320a_joint_csa_iranian_government-sponsored_apt_actors_compromise_federal%20network_deploy_crypto%20miner_credential_harvester.pdf
  - https://attack.mitre.org/techniques/T1033/

response:
  message: >
    Computer Discovery And Export Via Get-ADComputer Cmdlet - PowerShell
    detected on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1033
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - computer
    - export
    - adcomputer
    - powershell
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr] .*/ AND data_win_eventdata_scriptBlockText:/.* -[Ff][Ii][Ll][Tt][Ee][Rr] \*.*/ AND (data_win_eventdata_scriptBlockText:/.* \| [Ss][Ee][Ll][Ee][Cc][Tt] .*/ OR data_win_eventdata_scriptBlockText:/.*[Oo][Uu][Tt]-[Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 435e10e4-992a-4281-96f3-38b11106adde
    name: Computer Discovery And Export Via Get-ADComputer Cmdlet
    reason: Same Get-ADComputer -Filter * export seen at process creation (EID 1); confirms the script block actually launched from a powershell.exe command line and gives the parent process.
  - id: c2993223-6da8-4b1a-88ee-668b8bf315e9
    name: User Discovery And Export Via Get-ADUser Cmdlet - PowerShell
    reason: Operators enumerate computers and users together in the same AD-module session; a Get-ADUser export beside the computer export shows full directory harvesting.
  - id: e4c73d68-794b-468d-b4d0-dac1772bbae7
    name: Get-AdGroup with PowerShell Script Block
    reason: Group enumeration (Domain Admins, privileged groups) usually follows computer listing to choose which hosts and accounts to target.
  - id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
    name: Potential Unconstrained Delegation Discovery Via Get-ADComputer - ScriptBlock
    reason: Same cmdlet filtered on TrustedForDelegation to pick Kerberos relay/ticket-theft targets; a narrowing of the broad computer sweep.
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: Import/use of the ActiveDirectory module or DLL by an unusual host is the precondition for Get-ADComputer and signals RSAT dropped just for recon.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: Attackers pair PowerShell AD cmdlets with AdFind for the same host/user/trust inventory; co-occurring tooling confirms hands-on-keyboard discovery.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: The computer list is commonly used as input for SharpHound/BloodHound attack-path collection, the usual next recon step.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Exported computer lists written to disk are typically archived to be staged for exfiltration.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Active Directory PowerShell cmdlets and LDAP searchers in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][A-Za-z]+.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Native AD recon tools executed (nltest, dsquery, adfind, csvde, setspn, net group)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +(group|user|view|accounts).*[Dd][Oo][Mm][Aa][Ii][Nn].*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Recon output files written to disk by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Cc][Ss][Vv]|[Tt][Xx][Tt]|[Xx][Mm][Ll]|[Zz][Ii][Pp]|[Jj][Ss][Oo][Nn])/
    pivot_on:
    - host
    window: 1h
  - name: Staging archives and exfil tools after discovery
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Rr][Aa][Rr]|7[Zz]|7[Zz][Aa]|[Nn][Gg][Rr][Oo][Kk]|[Cc][Uu][Rr][Ll])\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]).*/))
    pivot_on:
    - host
    window: 4h
  - name: Remote logons and lateral movement tooling to discovered hosts
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:(3 OR 10)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss]|[Mm][Ss][Tt][Ss][Cc])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    - user
    window: 4h
