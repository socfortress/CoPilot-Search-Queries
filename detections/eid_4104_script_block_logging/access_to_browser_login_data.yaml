name: Access to Browser Login Data
id: fc028194-969d-4122-8abe-0470d5b8f12f
version: 1
schema_version: "1.0"
date: "2022-01-30"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fc028194-969d-4122-8abe-0470d5b8f12f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may acquire credentials from web browsers by reading files
  specific to the target browser. Web browsers commonly save credentials such as
  website usernames and passwords so that they do not need to be entered
  manually in the future. Web browsers typically store the credentials in an
  encrypted format within a credential store. MITRE ATT&CK: T1555.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Copy-Item*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Destination*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Opera Software\\\\Opera Stable\\\\Login Data*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Mozilla\\\\Firefox\\\\Profiles*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Microsoft\\\\Edge\\\\User Data\\\\Default*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Google\\\\Chrome\\\\User Data\\\\Default\\\\Login Data*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*\\\\Google\\\\Chrome\\\\User Data\\\\Default\\\\Login Data For Account*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Copy-Item*';
  data_win_eventdata_scriptBlockText matches '*-Destination*';
  data_win_eventdata_scriptBlockText matches '*\Opera Software\Opera
  Stable\Login Data*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.003/T1555.003.md
  - https://attack.mitre.org/techniques/T1555/003/

response:
  message: >
    Access to Browser Login Data detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1555.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555.003
  custom_tags:
    - browser
    - login
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn].*/ AND (data_win_eventdata_scriptBlockText:/.*\\[Oo][Pp][Ee][Rr][Aa] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Rr][Aa] [Ss][Tt][Aa][Bb][Ll][Ee]\\[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa] [Ff][Oo][Rr] [Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'Same objective via process creation: copying/reading browser Login Data/Cookies with cmd or tooling, the non-PowerShell variant of this script-block theft'
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Alternate way to copy locked browser credential stores (esentutl /y on Login Data) used when Copy-Item fails on a locked file
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: Attackers who stage a copy of Login Data often decrypt it offline or locally with BrowserPassView-style tools
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: Follow-on decryption of the copied browser credential database with a password-recovery utility
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: 'Co-occurring browser-secret theft: the same actor typically grabs cookies/session tokens alongside saved passwords'
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: Chromium Login Data and cookies are DPAPI/AES-protected; SharpDPAPI is the common next step to decrypt the master key and stolen blobs
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: Same PowerShell credential-harvesting session widening from browser stores to the Windows vault
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: Copy-Item into a staging destination is the collection step; scripted bulk collection of files often accompanies the stolen browser data
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser credential store files created/copied to a staging location
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Ww][Ee][Bb] [Dd][Aa][Tt][Aa]|[Cc][Oo][Oo][Kk][Ii][Ee][Ss]|[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn]|[Kk][Ee][Yy][34]\.[Dd][Bb]|[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Non-browser process touching browser profile paths on the command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]|[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]|[Mm][Oo][Zz][Ii][Ll][Ll][Aa]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Ss]|[Oo][Pp][Ee][Rr][Aa] [Ss][Tt][Aa][Bb][Ll][Ee]|[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]).*/ AND NOT data_win_eventdata_image:/.*\\(chrome|msedge|firefox|opera)\.exe/
    pivot_on:
    - host
    window: 1h
  - name: DPAPI / browser decryption and Chromium master-key access in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Dd][Aa][Tt][Aa]|[Uu][Nn][Pp][Rr][Oo][Tt][Ee][Cc][Tt]|[Cc][Rr][Yy][Pp][Tt][Uu][Nn][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Dd][Aa][Tt][Aa]|[Ss][Qq][Ll][Ii][Tt][Ee]|[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ee][Dd]_[Kk][Ee][Yy]|[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee]|[Aa][Ee][Ss][Gg][Cc][Mm]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Archive creation or exfil transfer of staged browser data
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]|[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ss][Ee][Nn][Dd]-[Mm][Aa][Ii][Ll][Mm][Ee][Ss][Ss][Aa][Gg][Ee]).*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Aa][Rr]|7[Zz]|[Zz][Ii][Pp]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Ff][Tt][Pp]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa]).*/ AND data_win_eventdata_commandLine:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Ss]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound DNS/network to paste, file-share and chat exfil services
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]|[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]|[Dd][Ii][Ss][Cc][Oo][Rr][Dd]|[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]|[Mm][Ee][Gg][Aa]\.[Nn][Zz]|[Gg][Oo][Ff][Ii][Ll][Ee]|[Ww][Ee][Bb][Hh][Oo][Oo][Kk]).*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true")
    pivot_on:
    - host
    window: 4h
