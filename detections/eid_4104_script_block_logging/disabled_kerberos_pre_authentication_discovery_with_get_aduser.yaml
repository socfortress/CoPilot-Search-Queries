name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
id: 114c6bfe-9406-11ec-bcce-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-ADUser` PowerShell cmdlet 
  with parameters indicating a search for domain accounts with Kerberos Pre-Authentication 
  disabled. It leverages PowerShell Script Block Logging (EventID 4104) to identify 
  this specific activity. This behavior is significant because discovering accounts 
  with Kerberos Pre-Authentication disabled (UserAccountControl flag 4194304) can 
  allow adversaries to perform AS-REP roasting attacks and offline password cracking. 
  If confirmed malicious, this activity could lead to unauthorized access to user 
  accounts, credential compromise, and potential privilege escalation within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-ADUser*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*4194304*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-ADUser cmdlet combined with the UserAccountControl 
  flag 4194304 (DONT_REQ_PREAUTH), which indicates accounts with Kerberos 
  Pre-Authentication disabled. These accounts are vulnerable to AS-REP roasting 
  attacks where attackers can request Kerberos authentication without providing valid 
  credentials and then perform offline password cracking.

known_false_positives: >
  Administrators or power users may search for accounts with Kerberos Pre-Authentication 
  disabled for legitimate purposes, such as system administration, auditing, or 
  troubleshooting. Filter based on user context and whether the action was expected 
  and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1558/004/
  - https://m0chan.github.io/2019/07/31/How-To-Attack-Kerberos-101.html
  - https://stealthbits.com/blog/cracking-active-directory-passwords-with-as-rep-roasting/
  - https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/useraccountcontrol-manipulated-ldap

response:
  message: >
    Disabled Kerberos Pre-Authentication Discovery With Get-ADUser detected on 
    $agent_name$ by user $data_win_eventdata_user$. 
    Script: $data_win_eventdata_scriptBlockText$. 
    This indicates reconnaissance for AS-REP roasting vulnerable accounts. 
    MITRE ATT&CK: T1558.004
  risk_score: 60
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 60
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - CISA AA23-347A
    - Active Directory Kerberos Attacks
    - BlackSuit Ransomware
    - Interlock Ransomware
    - Kerberos Attacks
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.004
  custom_tags:
    - get_aduser
    - kerberos
    - pre_authentication
    - asrep_roasting
    - useraccountcontrol
    - 4194304
    - active_directory
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-ADUser.*/ AND data_win_eventdata_scriptBlockText:/.*4194304.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: Same AS-REP-roastable account discovery done via PowerView; attacker often retries with a different toolkit on the same host
  - id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
    name: Get-ADUser Enumeration Using UserAccountControl Flags
    reason: Same Get-ADUser UAC-flag filtering technique, usually part of the same broader account-attribute enumeration (delegation, no-expiry, etc.)
  - id: 59b51620-94c9-11ec-b3d5-acde48001122
    name: Kerberos Pre-Authentication Flag Disabled with PowerShell
    reason: 'Follow-on: attacker who finds no roastable accounts may set DONT_REQ_PREAUTH themselves on a target account'
  - id: Windows_Account_Discovery_With_NetUser_PreauthNotRequire
    name: Windows Account Discovery With NetUser PreauthNotRequire
    reason: Alternate cmdlet (Get-NetUser -PreauthNotRequired) for the identical AS-REP roast target discovery
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: 'Direct follow-on: the discovered accounts get AS-REQ without pre-auth (4768 PreAuthType 0), the actual roast'
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: Next-step ticket-roasting via PowerShell (Rubeus-style/ KerberosRequestorSecurityToken) after AD user discovery
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Broader AD reconnaissance commonly run alongside targeted roastable-account discovery
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: AS-REP/Kerberoast tickets are requested with RC4 (0x17) to make offline cracking fast
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AS-REP requests without pre-authentication (RC4)
    query: data_win_system_eventID:"4768" AND data_win_eventdata_preAuthType:"0"
    pivot_on:
    - ip
    window: 6h
  - name: Roasting / Kerberos attack tooling executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*GetNPUsers.*/ OR data_win_eventdata_image:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Pre-auth flag tampering or further AD recon script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*DoesNotRequirePreAuth.*/ OR data_win_eventdata_scriptBlockText:/.*DONT_REQ_PREAUTH.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Aa][Dd][Aa]ccount[Cc]ontrol.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/)
    pivot_on:
    - host
    window: 2h
  - name: Cracking wordlists / hash files or ticket files written
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Hh]ashcat.*/ OR data_win_eventdata_targetFilename:/.*[Jj]ohn.*/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR data_win_eventdata_targetFilename:/.*[Aa][Ss][Rr][Ee][Pp].*/ OR data_win_eventdata_targetFilename:/.*[Hh]ashes.*\.txt/)
    pivot_on:
    - host
    window: 6h
  - name: LDAP/DC-bound network connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"3268")
    pivot_on:
    - host
    window: 1h
