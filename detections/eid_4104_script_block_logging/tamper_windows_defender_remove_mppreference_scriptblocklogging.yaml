name: Tamper Windows Defender Remove-MpPreference - ScriptBlockLogging
id: ae2bdd58-0681-48ac-be7f-58ab4e593458
version: 1
schema_version: "1.0"
date: "2022-08-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ae2bdd58-0681-48ac-be7f-58ab4e593458
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to remove Windows Defender configuration using the
  'MpPreference' cmdlet. MITRE ATT&CK: T1685.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Remove-MpPreference*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-ControlledFolderAccessProtectedFolders *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-AttackSurfaceReductionRules_Ids *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-AttackSurfaceReductionRules_Actions *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-CheckForSignaturesBeforeRunningScan *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Remove-MpPreference*';
  data_win_eventdata_scriptBlockText matches
  '*-ControlledFolderAccessProtectedFolders *';
  data_win_eventdata_scriptBlockText matches '*-AttackSurfaceReductionRules_Ids
  *', among other conditions.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://techcommunity.microsoft.com/t5/core-infrastructure-and-security/windows-10-controlled-folder-access-event-search/ba-p/2326088
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Tamper Windows Defender Remove-MpPreference - ScriptBlockLogging detected on
    host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - tamper
    - defender
    - remove
    - powershell
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ AND (data_win_eventdata_scriptBlockText:/.*-[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Dd][Ff][Oo][Ll][Dd][Ee][Rr][Aa][Cc][Cc][Ee][Ss][Ss][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Ff][Oo][Ll][Dd][Ee][Rr][Ss] .*/ OR data_win_eventdata_scriptBlockText:/.*-[Aa][Tt][Tt][Aa][Cc][Kk][Ss][Uu][Rr][Ff][Aa][Cc][Ee][Rr][Ee][Dd][Uu][Cc][Tt][Ii][Oo][Nn][Rr][Uu][Ll][Ee][Ss]_[Ii][Dd][Ss] .*/ OR data_win_eventdata_scriptBlockText:/.*-[Aa][Tt][Tt][Aa][Cc][Kk][Ss][Uu][Rr][Ff][Aa][Cc][Ee][Rr][Ee][Dd][Uu][Cc][Tt][Ii][Oo][Nn][Rr][Uu][Ll][Ee][Ss]_[Aa][Cc][Tt][Ii][Oo][Nn][Ss] .*/ OR data_win_eventdata_scriptBlockText:/.*-[Cc][Hh][Ee][Cc][Kk][Ff][Oo][Rr][Ss][Ii][Gg][Nn][Aa][Tt][Uu][Rr][Ee][Ss][Bb][Ee][Ff][Oo][Rr][Ee][Rr][Uu][Nn][Nn][Ii][Nn][Gg][Ss][Cc][Aa][Nn] .*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
