name: Windows PowerView AD Access Control List Enumeration
id: 39405650-c364-4e1e-a740-32a63ef042a6
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of PowerView PowerShell cmdlets 
  `Get-ObjectAcl` or `Get-DomainObjectAcl`, which are used to enumerate Access Control 
  List (ACL) permissions for Active Directory objects. It leverages Event ID 4104 from 
  PowerShell Script Block Logging to identify this activity. This behavior is 
  significant as it may indicate an attempt to discover weak permissions in Active 
  Directory, potentially leading to privilege escalation. If confirmed malicious, 
  attackers could exploit these permissions to gain unauthorized access or escalate 
  their privileges within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-ObjectAcl*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-DomainObjectAcl*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of Get-ObjectAcl or Get-DomainObjectAcl cmdlets to enumerate Active 
  Directory object permissions. Validate that data_win_eventdata_scriptBlockText 
  field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators may leverage PowerView for legitimate purposes such as Active 
  Directory auditing or troubleshooting. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1078/002/
  - https://medium.com/r3d-buck3t/enumerating-access-controls-in-active-directory-c06e2efa8b89
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/abusing-active-directory-acls-aces
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainObjectAcl/
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html

response:
  message: >
    PowerView ACL enumeration detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is discovering weak permissions in Active Directory for privilege 
    escalation and lateral movement. MITRE ATT&CK: T1078.002, T1069
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Active Directory Privilege Escalation
    - Rhysida Ransomware
  asset_type: Endpoint
  mitre_attack_id:
    - T1078.002
    - T1069
  custom_tags:
    - powerview
    - acl_enumeration
    - access_control_list
    - active_directory_permissions
    - privilege_escalation
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Get-ObjectAcl.*/ OR data_win_eventdata_scriptBlockText:/.*Get-DomainObjectAcl.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-ObjectAcl is one PowerView cmdlet; the same script block session normally loads/calls other PowerView cmdlets, confirming the toolkit is in use
  - id: e4a96dfd-667a-4487-b942-ccef5a1e81e8
    name: Windows Find Interesting ACL with FindInterestingDomainAcl
    reason: 'Direct follow-on of raw ACL enumeration: attacker filters the ACLs for exploitable misconfigurations'
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: Common companion recon in the same PowerView session, finding kerberoastable accounts alongside weak ACLs
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: 'Escalation path once SPNs are found: Get-DomainSPNTicket requests tickets for offline cracking'
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Identifies privileged group members whose objects the attacker then checks ACLs against
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: 'Exploitation step: a weak ACL found by Get-ObjectAcl is abused to grant DCSync rights to the attacker account'
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: BloodHound collection is the other main way to map AD ACL attack paths, frequently run alongside or instead of PowerView
  - id: cc316032-924a-11eb-91a2-acde48001122
    name: DSQuery Domain Discovery
    reason: Earlier-stage domain discovery that typically precedes targeted ACL enumeration
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / AD recon cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-DomainUser* OR data_win_eventdata_scriptBlockText:*Get-DomainGroupMember* OR data_win_eventdata_scriptBlockText:*Find-InterestingDomainAcl* OR data_win_eventdata_scriptBlockText:*Get-DomainComputer* OR data_win_eventdata_scriptBlockText:*Get-DomainSPNTicket* OR data_win_eventdata_scriptBlockText:*Invoke-ACLScanner* OR data_win_eventdata_scriptBlockText:*Get-DomainGPO* OR data_win_eventdata_scriptBlockText:*Invoke-ShareFinder*)
    pivot_on:
    - host
    - user
    window: 2h
  - name: 'ACL abuse: granting rights on AD objects'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Add-DomainObjectAcl* OR data_win_eventdata_scriptBlockText:*Add-ObjectAcl* OR data_win_eventdata_scriptBlockText:*Set-DomainObjectOwner* OR data_win_eventdata_scriptBlockText:*Set-DomainUserPassword* OR data_win_eventdata_scriptBlockText:*Add-DomainGroupMember* OR data_win_eventdata_scriptBlockText:*GenericAll* OR data_win_eventdata_scriptBlockText:*WriteDacl* OR data_win_eventdata_scriptBlockText:*DCSync*)
    pivot_on:
    - host
    - user
    window: 4h
  - name: PowerView / SharpHound download and load
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*PowerView* OR data_win_eventdata_scriptBlockText:*PowerSploit* OR data_win_eventdata_scriptBlockText:*Invoke-BloodHound* OR data_win_eventdata_scriptBlockText:*DownloadString*)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Pp]ower[Vv]iew.*/ OR data_win_eventdata_targetFilename:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_targetFilename:/.*_BloodHound\.zip/))
    pivot_on:
    - host
    window: 2h
  - name: AD recon and LDAP tooling process execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa]d[Ff]ind|[Ss]harp[Hh]ound|[Dd]squery|[Nn]ltest|[Dd]sacls|[Ll]difde)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*Invoke-BloodHound* OR data_win_eventdata_commandLine:*CollectionMethod*)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Kerberoasting and DCSync activity after ACL recon
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*Get-DomainSPNTicket* OR data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*lsadump* OR data_win_eventdata_scriptBlockText:*KerberosRequestorSecurityToken*)
    pivot_on:
    - host
    - user
    window: 6h
