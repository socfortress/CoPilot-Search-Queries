name: Potential Keylogger Activity
id: 965e2db9-eddb-4cf6-a986-7a967df651e4
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 965e2db9-eddb-4cf6-a986-7a967df651e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell scripts that contains reference to keystroke capturing
  functions. MITRE ATT&CK: T1056.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*[Windows.Input.Keyboard]::IsKeyDown([System.Windows.Input.Key]::*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches
  '*[Windows.Input.Keyboard]::IsKeyDown([System.Windows.Input.Key]::*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/ScumBots/status/1610626724257046529
  - https://www.virustotal.com/gui/file/d4486b63512755316625230e0c9c81655093be93876e0d80732e7eeaf7d83476/content
  - https://www.virustotal.com/gui/file/720a7ee9f2178c70501d7e3f4bcc28a4f456e200486dbd401b25af6da3b4da62/content
  - https://learn.microsoft.com/en-us/dotnet/api/system.windows.input.keyboard.iskeydown?view=windowsdesktop-7.0
  - https://attack.mitre.org/techniques/T1056/001/

response:
  message: >
    Potential Keylogger Activity detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1056.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1056.001
  custom_tags:
    - keylogger
    - powershell
    - collection
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\[[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ii][Nn][Pp][Uu][Tt]\.[Kk][Ee][Yy][Bb][Oo][Aa][Rr][Dd]\]::[Ii][Ss][Kk][Ee][Yy][Dd][Oo][Ww][Nn]\(\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ii][Nn][Pp][Uu][Tt]\.[Kk][Ee][Yy]\]::.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 34f90d3c-c297-49e9-b26d-911b05a4866c
    name: Powershell Keylogging
    reason: Sibling PowerShell keylogger detection using other capture APIs (GetAsyncKeyState/hooks); same script often matches both, confirming real input capture rather than a UI helper.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: keylogger PowerShell is usually pulled down by a download cradle before it runs and starts polling keys.'
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: 'Precursor: loader launching the keylogger script via -EncodedCommand to hide the IsKeyDown polling code.'
  - id: 4cbd4f12-2e22-43e3-882f-bff3247ffb78
    name: PowerShell Get Clipboard
    reason: 'Co-occurring collection: input-capture scripts commonly add clipboard scraping to catch pasted passwords alongside keystrokes.'
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: 'Co-occurring collection: command-line Get-Clipboard on the same host is the companion data-capture technique to keystroke logging.'
  - id: ca8b77a9-d499-4095-b793-5d5f330d450e
    name: PowerShell Credential Prompt
    reason: 'Co-occurring credential harvesting: a fake credential prompt plus key capture is a common way to steal typed passwords.'
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: 'Follow-on/parallel credential access: same operator toolkit often adds in-memory Mimikatz after or alongside the keylogger.'
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: 'Follow-on credential access: stored credentials are harvested via PowerShell on the same host to complement captured keystrokes.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerShell input-capture APIs in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*GetAsyncKeyState* OR data_win_eventdata_scriptBlockText:*SetWindowsHookEx* OR data_win_eventdata_scriptBlockText:*GetKeyboardState* OR data_win_eventdata_scriptBlockText:*GetForegroundWindow* OR data_win_eventdata_scriptBlockText:*GetKeyState* OR data_win_eventdata_scriptBlockText:*MapVirtualKey* OR data_win_eventdata_scriptBlockText:*WH_KEYBOARD_LL*)
    pivot_on:
    - host
    window: 1h
  - name: Script-block staging of captured data (clipboard, screenshots, log file, upload)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-Clipboard* OR data_win_eventdata_scriptBlockText:*Windows.Forms.Clipboard* OR data_win_eventdata_scriptBlockText:*CopyFromScreen* OR data_win_eventdata_scriptBlockText:*Out-File* OR data_win_eventdata_scriptBlockText:*Add-Content* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Invoke-RestMethod* OR data_win_eventdata_scriptBlockText:*Send-MailMessage* OR data_win_eventdata_scriptBlockText:*Net.WebClient*) AND (data_win_eventdata_scriptBlockText:*Key* OR data_win_eventdata_scriptBlockText:*Clipboard* OR data_win_eventdata_scriptBlockText:*Screen*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell launched hidden/encoded/download (loader of the keylogger)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*-enc* OR data_win_eventdata_commandLine:*-EncodedCommand* OR data_win_eventdata_commandLine:*-WindowStyle* OR data_win_eventdata_commandLine:*Hidden* OR data_win_eventdata_commandLine:*DownloadString* OR data_win_eventdata_commandLine:*IEX* OR data_win_eventdata_commandLine:*-NoP*)
    pivot_on:
    - host
    window: 1h
  - name: Persistence of the keylogger via Run key, scheduled task or Startup folder
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*CurrentVersion\\Run*) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:*schtasks.exe AND data_win_eventdata_commandLine:*\/create*) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:*Start\ Menu\\Programs\\Startup*)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections by PowerShell (exfiltration of captured keystrokes)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
