name: Windows Linked Policies In ADSI Discovery
id: 510ea428-4731-4d2f-8829-a28293e427aa
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects the use of the `[adsisearcher]` type accelerator in PowerShell to query Active Directory
  for domain organizational units. This detection leverages PowerShell Script Block Logging (EventID 4104) to identify script
  blocks containing the combination of `[adsisearcher]`, `objectcategory=organizationalunit`, and `findAll()`. This activity
  is significant as it indicates potential reconnaissance efforts by adversaries to gain situational awareness of the domain
  structure, including organizational hierarchy and policy-linked containers. The ADSI searcher is a powerful tool for
  querying Active Directory programmatically, and this specific pattern targets organizational units which are critical for
  understanding domain policy structure. If confirmed malicious, this reconnaissance could lead to further exploitation, such
  as identifying high-value targets for lateral movement, privilege escalation, or targeted policy manipulation attacks.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*adsisearcher*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*objectcategory=organizationalunit*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*findAll*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_user
    - agent_name
    - data_win_eventdata_processId
    - data_win_eventdata_engineVersion

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need PowerShell Script Block Logging (EventID 4104) enabled on your endpoints.
  PowerShell Script Block Logging captures the content of PowerShell script blocks as they are executed. Ensure that the
  appropriate Group Policy settings are configured to enable PowerShell logging. The detection monitors for the specific
  combination of three PowerShell constructs: the [adsisearcher] type accelerator which enables LDAP queries, the LDAP filter
  for organizational units (objectcategory=organizationalunit), and the findAll() method which returns all matching results.
  This combination is used for Active Directory reconnaissance to enumerate domain organizational units and policies.

known_false_positives: >
  Administrators or power users may legitimately use ADSI searcher for Active Directory troubleshooting, reporting, or
  management tasks. System administrators performing domain discovery or documentation may execute similar commands.
  Filter based on known legitimate administrative accounts and expected ADSI usage patterns in your environment.
  Review the full script block text to determine if the query represents legitimate administrative activity or
  reconnaissance by unauthorized users.

references:
  - https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/
  - https://medium.com/@pentesttas/discover-hidden-gpo-s-on-active-directory-using-ps-adsi-a284b6814c81
  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/

response:
  message: >
    ADSI organizational unit discovery detected on $agent_name$ by user $data_win_eventdata_user$.
    PowerShell Script: $data_win_eventdata_scriptBlockText$. This may indicate Active Directory reconnaissance activity.
  risk_score: 60
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Data Destruction
    - Industroyer2
    - Domain Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - adsisearcher
    - active_directory
    - organizational_unit
    - ldap_query
    - powershell
    - reconnaissance
    - domain_discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*adsisearcher.*/ AND data_win_eventdata_scriptBlockText:/.*objectcategory=organizationalunit.*/ AND data_win_eventdata_scriptBlockText:/.*findAll.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Same [adsisearcher] LDAP recon toolkit; OU enumeration is typically paired with group enumeration in one script to map privileged groups and policy containers.
  - id: de7fcadc-04f3-11ec-a241-acde48001122
    name: AdsiSearcher Account Discovery
    reason: Sibling adsisearcher query for user accounts, usually run in the same session right after or before the OU query to pick targets.
  - id: 70803451-0047-4e12-9d63-77fa7eb8649c
    name: Remote System Discovery with Adsisearcher
    reason: Computer-object enumeration via adsisearcher is the next recon step once OU structure is known, to choose lateral movement hosts.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Attackers who start with manual ADSI queries often escalate to PowerView (Get-DomainOU/Get-DomainGPO) for deeper policy and ACL mapping.
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: ADRecon bulk-dumps OUs, GPOs, users and ACLs; the same domain-structure reconnaissance goal at larger scale.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: SharpHound collects OU and GPO links for attack-path graphing; a follow-on or parallel collector to the manual OU query.
  - id: b7216a7d-687e-4c8d-82b1-3080b2ad961f
    name: Modify Group Policy Settings - ScriptBlockLogging
    reason: Linked-policy discovery targets GPO manipulation; actual GPO modification from PowerShell on the same host is the intended payoff (policy-based deployment, as in Industroyer2/ransomware).
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: 'Common next recon step after structure mapping: SPN enumeration to find Kerberoastable service accounts for privilege escalation.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other ADSI/LDAP directory enumeration in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Dd][Aa][Pp]:\/\/.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Oo][Uu].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Gg][Pp][Oo].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Oo][Rr][Gg][Aa][Nn][Ii][Zz][Aa][Tt][Ii][Oo][Nn][Aa][Ll][Uu][Nn][Ii][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: GPO / gPLink / SYSVOL access from scripts
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Pp][Ll][Ii][Nn][Kk].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Vv][Oo][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Rr][Oo][Uu][Pp]-?[Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Gg][Pp][Ll][Ii][Nn][Kk].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Gg][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Native AD recon tools spawned on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee]|[Gg][Pp][Rr][Ee][Ss][Uu][Ll][Tt]|[Nn][Ee][Tt]1?)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] +[Gg][Rr][Oo][Uu][Pp]|[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss]|[Dd][Cc][Ll][Ii][Ss][Tt]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos/AD attack tooling or SPN hunting in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*/)
    pivot_on:
    - host
    window: 4h
  - name: Script download/encoded execution staging the AD recon
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx] ?\(.*/)
    pivot_on:
    - host
    window: 1h
