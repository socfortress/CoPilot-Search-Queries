name: Windows Powershell Logoff User via Quser
id: 6d70780d-4cfe-4820-bafd-1b43941986b5
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects PowerShell scripts that combine quser and logoff commands to
  forcibly terminate user sessions. This technique is used by crypto stealers
  and other malware to revoke user access without proper authorization as part
  of account manipulation or session hijacking attacks. While quser and logoff
  are legitimate Windows utilities, their combination in a PowerShell script
  block warrants investigation.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*quser*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*logoff*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators or power users may legitimately use quser and logoff commands
  to manage user sessions. Review the user context and frequency to determine
  if the activity is authorized.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1531/
  - https://devblogs.microsoft.com/scripting/automating-quser-through-powershell/

response:
  message: >
    PowerShell quser/logoff session termination detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001, T1531
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Crypto Stealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1531
  custom_tags:
    - quser
    - logoff
    - session_termination
    - account_access_removal
    - crypto_stealer
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*quser.*/ AND data_win_eventdata_scriptBlockText:/.*logoff.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows_Account_Access_Removal_via_Logoff_Exec
    name: Windows Account Access Removal via Logoff Exec
    reason: 'Process-creation view of the same behaviour: the script block''s logoff call spawns logoff.exe, confirming the session kick actually executed rather than merely being logged.'
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Crypto-stealer loaders typically stage via encoded PowerShell; the quser/logoff script is often the decoded payload of that launch.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Precursor: the script containing quser/logoff was commonly fetched and run in memory by a download cradle.'
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'Follow-on: once the logged-in user is forced off, stealers harvest browser wallets and credentials without the victim watching.'
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Crypto stealers pair session control with clipboard access to swap or capture wallet addresses on the same host.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Follow-on persistence so the stealer survives after the interactive session was terminated.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defence evasion commonly done in the same intrusion before or alongside the session termination script.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: logoff.exe / quser / rwinsta process execution on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ll][Oo][Gg][Oo][Ff][Ff]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ss][Dd][Ii][Ss][Cc][Oo][Nn]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Session enumeration and user discovery commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Rr][Yy] +[Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Qq][Ww][Ii][Nn][Ss][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Crypto wallet and browser credential store file access
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*wallet* OR data_win_eventdata_targetFilename:*Login\ Data* OR data_win_eventdata_targetFilename:*Local\ State* OR data_win_eventdata_targetFilename:*\\Exodus* OR data_win_eventdata_targetFilename:*\\Electrum* OR data_win_eventdata_targetFilename:*MetaMask* OR data_win_eventdata_targetFilename:*key4.db* OR data_win_eventdata_targetFilename:*logins.json*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks with download, encoding or clipboard access
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Run-key and scheduled-task persistence after session kill
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*\\CurrentVersion\\Run*) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*\/create*)
    pivot_on:
    - host
    window: 2h
