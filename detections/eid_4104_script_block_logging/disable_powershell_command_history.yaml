name: Disable Powershell Command History
id: 602f5669-6927-4688-84db-0d4b7afb2150
version: 1
schema_version: "1.0"
date: "2022-08-21"
author: Ali Alwashali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 602f5669-6927-4688-84db-0d4b7afb2150
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects scripts or commands that disabled the Powershell command history by
  removing psreadline module. MITRE ATT&CK: T1070.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Remove-Module*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*psreadline*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Remove-Module*';
  data_win_eventdata_scriptBlockText matches '*psreadline*'.

known_false_positives: >
  Legitimate script that disables the command history. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/DissectMalware/status/1062879286749773824
  - https://attack.mitre.org/techniques/T1070/003/

response:
  message: >
    Disable Powershell Command History detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1070.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.003
  custom_tags:
    - disable
    - powershell
    - history
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Mm][Oo][Dd][Uu][Ll][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Pp][Ss][Rr][Ee][Aa][Dd][Ll][Ii][Nn][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 26b692dc-1722-49b2-b496-a8258aa6371d
    name: Clear PowerShell History - PowerShell
    reason: 'Sibling PSReadLine anti-forensics: operator first wipes history (Clear-History/ConsoleHost_history) then unloads PSReadLine so later commands are never recorded.'
  - id: f1369394-48e1-4327-bf6d-14377f4b8687
    name: Windows Powershell History File Deletion
    reason: Deleting ConsoleHost_history.txt is the retroactive half of the same history-erasure objective as removing PSReadLine.
  - id: ff301988-c231-4bd0-834c-ac9d73b86586
    name: PowerShell Console History Logs Deleted
    reason: Sysmon file-delete evidence of the history file being removed on the same host, confirming the cover-tracks sequence.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: 'Attackers blind PowerShell telemetry in layers: after dropping history, disabling ETW suppresses what script block logging still captures.'
  - id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
    name: PowerShell Logging Disabled Via Registry Key Tampering
    reason: Turning off ScriptBlock/Module logging via registry is the next anti-visibility step once PSReadLine is removed.
  - id: 0f017df3-8f5a-414f-ad6b-24aff1128278
    name: Suspicious Eventlog Clear
    reason: Script-driven Clear-EventLog/wevtutil clearing commonly follows history removal when the operator finishes cleanup before leaving.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Event 1102 on the host right after history suppression indicates full indicator-removal, upgrading this to a stealth-focused intrusion.
  - id: f4ff7323-b5fc-4323-8b52-6b9408e15788
    name: Potential PowerShell Console History Access Attempt via History File
    reason: 'Opposite use of the same artifact: reading history files to harvest credentials, seen from an intruder who knows its value.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell history file deletion or PSReadLine option tampering
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Hh][Oo][Ss][Tt]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Rr]-[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Pp][Ss][Rr][Ee][Aa][Dd][Ll][Ii][Nn][Ee][Oo][Pp][Tt][Ii][Oo][Nn].*[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Aa][Xx][Ii][Mm][Uu][Mm][Hh][Ii][Ss][Tt][Oo][Rr][Yy][Cc][Oo][Uu][Nn][Tt].*/)) OR (data_win_system_eventID:"23" AND data_win_eventdata_targetFilename:/.*[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Hh][Oo][Ss][Tt]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell logging / ETW / AMSI being disabled
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ee][Tt][Ww][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Gg][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering or exclusions from the same session
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn]|[Nn][Ee][Tt][Ss][Hh] +[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential access, discovery and persistence from PowerShell after history suppression
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)
    pivot_on:
    - host
    window: 4h
