name: Live Memory Dump Using Powershell
id: cd185561-4760-45d6-a63e-a51325112cae
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Max Altgelt (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd185561-4760-45d6-a63e-a51325112cae
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of a PowerShell command to dump the live memory of a Windows
  machine. MITRE ATT&CK: T1003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Get-StorageDiagnosticInfo*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-IncludeLiveDump*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-StorageDiagnosticInfo*';
  data_win_eventdata_scriptBlockText matches '*-IncludeLiveDump*'.

known_false_positives: >
  Diagnostics. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/storage/get-storagediagnosticinfo?view=windowsserver2022-ps
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Live Memory Dump Using Powershell detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - memory
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ss][Tt][Oo][Rr][Aa][Gg][Ee][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ii][Nn][Ff][Oo].*/ AND data_win_eventdata_scriptBlockText:/.*-[Ii][Nn][Cc][Ll][Uu][Dd][Ee][Ll][Ii][Vv][Ee][Dd][Uu][Mm][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 84c174ab-d3ef-481f-9c86-a50d0b8e3edb
    name: PowerShell Get-Process LSASS in ScriptBlock
    reason: 'Same PowerShell memory-acquisition tradecraft: attacker scripts that grab the LSASS handle/process object often run in the same session as, or right before, the live-dump cmdlet.'
  - id: b2815d0d-7481-4bf0-9b6c-a4c48a94b349
    name: PowerShell Get-Process LSASS
    reason: Process-creation view of PowerShell targeting lsass; corroborates credential-memory intent behind the live dump on the same host.
  - id: aba15bdd-657f-422a-bab3-ac2d2a0d6f1c
    name: Potentially Suspicious DMP/HDMP File Creation
    reason: Get-StorageDiagnosticInfo -IncludeLiveDump writes a kernel live-dump .dmp file; this is the file-creation artefact that proves the dump landed on disk.
  - id: 814ddeca-3d31-4265-8e07-8cc54fb44903
    name: LiveKD Kernel Memory Dump File Created
    reason: Alternative live kernel memory dump method; an attacker who finds the cmdlet blocked or noisy may fall back to LiveKD, producing similar dump artefacts.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Dump files holding credential material (lsass.dmp-style names) created on the host are the follow-on proof that memory was harvested for credentials.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Next step after a dump is produced: compress the large .dmp for staging and exfiltration.'
  - id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
    name: Winrar Compressing Dump Files
    reason: 'Same staging step as the 7Zip case using WinRAR: archiving the freshly created memory dump before exfiltration.'
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Dump files are commonly pulled off the host over SMB after creation; this catches the collection/exfil of the .dmp via cmd copy.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dump file creation (.dmp / LiveKernelReports) on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*LiveKernelReports* OR data_win_eventdata_targetFilename:*.dmp OR data_win_eventdata_targetFilename:*.hdmp OR data_win_eventdata_targetFilename:*StorageDiagnostic*)
    pivot_on:
    - host
    window: 1h
  - name: Other PowerShell script blocks touching LSASS or minidump APIs
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp][Ww][Rr][Ii][Tt][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Bb][Gg][Hh][Ee][Ll][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Oo][Uu][Tt]-[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: Archiving or copying dump files for staging/exfil
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*.dmp* OR data_win_eventdata_commandLine:*LiveKernelReports*) AND (data_win_eventdata_image:/.*(\\[7][Zz]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]|\\[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]|\\[Tt][Aa][Rr]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:*Compress-Archive*)
    pivot_on:
    - host
    window: 2h
  - name: Processes opening LSASS (GrantedAccess) on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound transfer of dump data (network connections from PowerShell/archivers)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|\\[Ss][Cc][Pp]\.[Ee][Xx][Ee])/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
