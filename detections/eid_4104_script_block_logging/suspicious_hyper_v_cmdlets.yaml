name: Suspicious Hyper-V Cmdlets
id: 42d36aa1-3240-4db0-8257-e0118dcdd9cd
version: 1
schema_version: "1.0"
date: "2022-04-09"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 42d36aa1-3240-4db0-8257-e0118dcdd9cd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may carry out malicious operations using a virtual instance to
  avoid detection. MITRE ATT&CK: T1564.006.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*New-VM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Set-VMFirmware*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Start-VM*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-VM*';
  data_win_eventdata_scriptBlockText matches '*Set-VMFirmware*';
  data_win_eventdata_scriptBlockText matches '*Start-VM*'.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/virtualization/hyper-v-on-windows/quick-start/enable-hyper-v
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.006/T1564.006.md#atomic-test-3---create-and-start-hyper-v-virtual-machine
  - https://attack.mitre.org/techniques/T1564/006/

response:
  message: >
    Suspicious Hyper-V Cmdlets detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1564.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.006
  custom_tags:
    - hyper
    - cmdlets
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Vv][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Vv][Mm][Ff][Ii][Rr][Mm][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Vv][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8468111a-ef07-4654-903b-b863a80bbc95
    name: VHD Image Download Via Browser
    reason: 'Precursor: attackers pull a prebuilt VHD/VHDX disk image to boot as a hidden VM; New-VM -VHDPath/Start-VM then runs it.'
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: 'Precursor/co-occurring: exclusions for the VHD, VM folder or vmwp.exe keep Defender from scanning the guest disk before the VM is started.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: 'Same PowerShell tradecraft: Add-MpPreference exclusions staged alongside New-VM so the hidden VM''s files are never scanned.'
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Operators disabling Defender monitoring via Set-MpPreference before running malware inside a VM that the host cannot see.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Host-level evasion that commonly accompanies running the real payload in a guest, confirming defence-evasion intent.
  - id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
    name: Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via CommandLine
    reason: Virtualization-stack tampering on the same host; HVCI/VBS changes often accompany enabling or abusing hypervisor features for evasion.
  - id: eca8ae39-5c3c-4321-b538-9e64fe25822e
    name: Installation of WSL Kali-Linux
    reason: 'Sibling T1564.006 technique: a hidden Linux environment on the host as an alternative to a Hyper-V guest; seen together when attackers set up an out-of-view execution environment.'
  - id: ed825c86-c009-4014-b413-b76003e33d35
    name: Windows Binary Executed From WSL
    reason: 'Follow-on in the WSL variant of the same hidden-environment evasion: host Windows binaries launched from the Linux subsystem to dodge EDR process lineage.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hyper-V enablement and VM/VHD plumbing cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ee]nable-[Ww]indows[Oo]ptional[Ff]eature.*[Hh]yper-?[Vv].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Vv][Hh][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Vv][Mm][Hh]ard[Dd]iskDrive.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Vv][Mm][Hh]ost.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Vv][Mm][Ss]witch.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Vv][Mm][Pp]rocessor.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nable-[Vv][Mm][Cc]onsole.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]ount-[Vv][Hh][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Hyper-V role or management tooling installed or launched
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm]icrosoft-[Hh]yper-[Vv].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Mm].*[Ee]nable-[Ff]eature.*[Hh]yper.*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Hh][Yy][Pp][Ee][Rr][Vv][Ii][Ss][Oo][Rr].*/ OR data_win_eventdata_image:/.*\\([Vv][Mm][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Vv][Mm][Ww][Pp]|[Vv][Mm][Mm][Ss]|[Vv][Mm][Cc][Oo][Mm][Pp][Uu][Tt][Ee])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: VHD/VHDX or ISO image files written or downloaded to the host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.([Vv][Hh][Dd][Xx]?|[Ii][Ss][Oo]|[Vv][Mm][Dd][Kk]|[Aa][Vv][Hh][Dd][Xx])/)
    pivot_on:
    - host
    window: 4h
  - name: Defender exclusions or tamper commands preceding VM start
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Mm]p[Pp]reference.*[Dd]isable.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa]dd|[Ss]et)-[Mm]p[Pp]reference.*/)
    pivot_on:
    - host
    window: 2h
  - name: Network or DNS activity from VM worker or PowerShell on host
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Vv][Mm][Ww][Pp]|[Pp]ower[Ss]hell|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true") OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Vv][Mm][Ww][Pp]|[Pp]ower[Ss]hell)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
