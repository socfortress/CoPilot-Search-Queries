name: PowerShell WMI Win32_Product Install MSI
id: 91109523-17f0-4248-a800-f81d9e7c081d
version: 1
schema_version: "1.0"
date: "2022-04-24"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 91109523-17f0-4248-a800-f81d9e7c081d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of an MSI file using PowerShell and the WMI
  Win32_Product class. MITRE ATT&CK: T1218.007.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Invoke-CimMethod *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-ClassName *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Win32_Product *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-MethodName *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.msi*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Invoke-CimMethod *';
  data_win_eventdata_scriptBlockText matches '*-ClassName *';
  data_win_eventdata_scriptBlockText matches '*Win32_Product *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
  - https://attack.mitre.org/techniques/T1218/007/

response:
  message: >
    PowerShell WMI Win32_Product Install MSI detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1218.007
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.007
  custom_tags:
    - powershell
    - win32
    - product
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Ii][Mm][Mm][Ee][Tt][Hh][Oo][Dd] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Cc][Ll][Aa][Ss][Ss][Nn][Aa][Mm][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Pp][Rr][Oo][Dd][Uu][Cc][Tt] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Mm][Ee][Tt][Hh][Oo][Dd][Nn][Aa][Mm][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*\.[Mm][Ss][Ii].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 222720a7-047f-4054-baa5-bab9be757db0
    name: PowerShell MSI Install via WindowsInstaller COM From Remote Location
    reason: Sibling PowerShell MSI-install technique (WindowsInstaller COM instead of Win32_Product); same operator intent, and a remote-location MSI confirms staged payload delivery.
  - id: 7b6a7418-3afc-11f0-aff4-000d3abf478c
    name: Obfuscated PowerShell MSI Install via WindowsInstaller COM
    reason: Alternate PowerShell MSI install path on the same host, obfuscated; shows an attacker iterating on MSI-based execution after or before the CIM method call.
  - id: 8150732a-0c9d-4a99-82b9-9efb9b90c40c
    name: Suspicious Msiexec Quiet Install From Remote Location
    reason: The Win32_Product Install method makes msiexec run the package; a quiet install from a URL/UNC path is the usual form of the delivered payload.
  - id: b0fd38c7-f71a-43a2-870e-f3ca06bcdd99
    name: Windows HTTP Network Communication From MSIExec
    reason: If the .msi in the script block is remote, msiexec fetches it over HTTP; this is the network-side confirmation of the same install.
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: Windows Installer application log records the install source; a web source on this host confirms the MSI came from the internet rather than local software deployment.
  - id: c7c8aa1c-5aff-408e-828b-998e3620b341
    name: MSI Installation From Suspicious Locations
    reason: Installer log entry showing the MSI sat in Temp/Downloads/Public, the staging path a script would drop it to before calling Win32_Product Install.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: 'Precursor: the same PowerShell session often downloads the MSI with a COM/WebClient cradle before invoking the install.'
  - id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
    name: Always Install Elevated MSI Spawned Cmd And Powershell
    reason: 'Follow-on: a malicious MSI executed via Windows Installer often launches cmd/powershell children, especially if run with elevation.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MSI file written to disk on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Mm][Ss][Ii]/
    pivot_on:
    - host
    window: 1h
  - name: msiexec execution and spawned children (WMI-driven install)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections by msiexec or PowerShell (remote MSI fetch)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Mm][Ss][Ii][Ee][Xx][Ee][Cc]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell script blocks fetching or staging installer payloads
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Start-BitsTransfer* OR data_win_eventdata_scriptBlockText:*WindowsInstaller.Installer* OR data_win_eventdata_scriptBlockText:*msiexec*)
    pivot_on:
    - host
    window: 2h
  - name: Persistence or shell activity after MSI install
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
