name: PowerShell Hotfix Enumeration
id: f5d1def8-1de0-4a0e-9794-1f6f27dd605c
version: 1
schema_version: "1.0"
date: "2022-06-21"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f5d1def8-1de0-4a0e-9794-1f6f27dd605c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects call to "Win32_QuickFixEngineering" in order to enumerate installed
  hotfixes often used in "enum" scripts by attackers.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Win32_QuickFixEngineering*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*HotFixID*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Win32_QuickFixEngineering*';
  data_win_eventdata_scriptBlockText matches '*HotFixID*'.

known_false_positives: >
  Legitimate administration scripts. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/411Hall/JAWS/blob/233f142fcb1488172aa74228a666f6b3c5c48f1d/jaws-enum.ps1

response:
  message: >
    PowerShell Hotfix Enumeration detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - powershell
    - hotfix
    - enumeration
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Qq][Uu][Ii][Cc][Kk][Ff][Ii][Xx][Ee][Nn][Gg][Ii][Nn][Ee][Ee][Rr][Ii][Nn][Gg].*/ AND data_win_eventdata_scriptBlockText:/.*[Hh][Oo][Tt][Ff][Ii][Xx][Ii][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dfd2fcb7-8bd5-4daa-b132-5adb61d6ad45
    name: Windows Hotfix Updates Reconnaissance Via Wmic.EXE
    reason: Same patch-level enumeration (QuickFixEngineering) done via wmic qfe instead of PowerShell; attackers fall back between the two when hunting missing KBs for a local privilege-escalation exploit.
  - id: 2650dd1a-eb2a-412d-ac36-83f06c4f2282
    name: Detected Windows Software Discovery - PowerShell
    reason: JAWS-style enum scripts inventory installed software alongside hotfixes; both feed the vulnerable-version/exploit-selection decision.
  - id: 80879283-c30f-44f7-8471-d1381f6d437a
    name: Get-CurrentUser with PowerShell Script Block
    reason: Enumeration scripts establish who they run as around the patch check, to judge whether privilege escalation is needed.
  - id: 2e891cbe-0426-11ec-9c9c-acde48001122
    name: Get-LocalUser with PowerShell Script Block
    reason: The same enumeration script typically lists local accounts after hotfixes, mapping targets for credential or privilege abuse.
  - id: 69df7f7c-155d-11ec-a055-acde48001122
    name: Get-WMIObject Group Discovery with Script Block Logging
    reason: Local group and admin membership discovery runs in the same all-in-one enum script (JAWS), showing the privesc survey is broader than patch checking.
  - id: 162e69a7-7981-4344-84a9-0f1c9a217a52
    name: Powershell Directory Enumeration
    reason: Enum scripts then walk directories for writable paths and sensitive files, the follow-on stage after the patch and user survey.
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: After identifying patch gaps, operators hunt for credential and config files in the same session.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Host/privesc survey commands spawned from scripting parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Nn][Ee][Tt]1?|[Ww][Mm][Ii][Cc]|[Ss][Cc]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg])\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other enumeration script blocks (services, tasks, accounts, privesc misconfig checks)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_([Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Gg][Rr][Oo][Uu][Pp]|[Pp][Rr][Oo][Dd][Uu][Cc][Tt]|[Ss][Tt][Aa][Rr][Tt][Uu][Pp][Cc][Oo][Mm][Mm][Aa][Nn][Dd]).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/ OR data_win_eventdata_scriptBlockText:*AlwaysInstallElevated* OR data_win_eventdata_scriptBlockText:*unattend* OR data_win_eventdata_scriptBlockText:*Winlogon*)
    pivot_on:
    - host
    window: 1h
  - name: Download cradle or encoded/in-memory PowerShell that delivered the enum script
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*Net.WebClient*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell staging tools to writable paths or making outbound connections
    query: (data_win_system_eventID:"11" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss])\\.*\.([Pp][Ss]1|[Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt])/) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true")
    pivot_on:
    - host
    window: 2h
