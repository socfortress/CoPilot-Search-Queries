name: Invoke-Obfuscation Via Use MSHTA - PowerShell
id: e55a5195-4724-480e-a77e-3ebe64bd3759
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e55a5195-4724-480e-a77e-3ebe64bd3759
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via use MSHTA in Scripts. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText: "*&&*"
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*mshta*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*vbscript:createobject*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.run*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*(window.close)*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*set*';
  data_win_eventdata_scriptBlockText matches '*&&*';
  data_win_eventdata_scriptBlockText matches '*mshta*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Use MSHTA - PowerShell detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - mshta
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*\&\&.*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Hh][Tt][Aa].*/ AND data_win_eventdata_scriptBlockText:/.*[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]:[Cc][Rr][Ee][Aa][Tt][Ee][Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Rr][Uu][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*\([Ww][Ii][Nn][Dd][Oo][Ww]\.[Cc][Ll][Oo][Ss][Ee]\).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ac20ae82-8758-4f38-958e-b44a3140ca88
    name: Invoke-Obfuscation Via Use MSHTA
    reason: 'Process-creation twin of this script block: the same cmd ''set ... && mshta vbscript:CreateObject(...Run...)(window.close)'' launcher seen as a real mshta/cmd command line confirms it executed.'
  - id: 07ad2ea8-6a55-4ac6-bf3e-91b8e59676eb
    name: Invoke-Obfuscation Via Use MSHTA - PowerShell Module
    reason: Same Invoke-Obfuscation MSHTA launcher captured via EID 4103 module logging; co-fires when the obfuscated string is actually passed through PowerShell.
  - id: e32f92d1-523e-49c3-9374-bdb13b46a3ba
    name: Suspicious Mshta.EXE Execution Patterns
    reason: The launcher's purpose is to start mshta.exe with inline vbscript; this detects the resulting mshta process with suspicious parent/arguments.
  - id: 03cc0c25-389f-4bf8-b48d-11878079f1ca
    name: Suspicious MSHTA Child Process
    reason: The vbscript CreateObject('WScript.Shell').Run payload makes mshta spawn cmd/powershell/other LOLBins; this is the direct next stage after the launcher runs.
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: 'A common follow-on from mshta-hosted VBScript: loading a DLL payload via rundll32/regsvr32 as the second stage.'
  - id: b98d0db6-511d-45de-ad02-e82a98729620
    name: Remotely Hosted HTA File Executed Via Mshta.EXE
    reason: 'Sibling mshta abuse: if the obfuscated launcher or its operator also pulls a remote HTA, it indicates payload staging from attacker infrastructure.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Co-occurring script-host dropper execution: the same delivery chain often uses wscript/cscript/mshta to run dropped script files.'
  - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
    name: Detect MSHTA Url in Command Line
    reason: mshta launched with a URL in its command line is the download-and-run variant of the same proxy-execution technique.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mshta.exe process launched with inline script or URL
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]:.*/ OR data_win_eventdata_commandLine:/.*[Jj][Aa][Vv][Aa][Ss][Cc][Rr][Ii][Pp][Tt]:.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Oo][Bb][Jj][Ee][Cc][Tt].*/)
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by mshta.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections made by mshta.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Files written by mshta.exe or script hosts
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Vv][Bb][Ss]|[Hh][Tt][Aa]|[Jj][Ss]|[Bb][Aa][Tt])/)
    pivot_on:
    - host
    window: 2h
  - name: Other obfuscated or encoded PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
