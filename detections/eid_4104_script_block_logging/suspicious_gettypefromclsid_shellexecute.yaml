name: Suspicious GetTypeFromCLSID ShellExecute
id: 8bc063d5-3a3a-4f01-a140-bc15e55e8437
version: 1
schema_version: "1.0"
date: "2022-04-02"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8bc063d5-3a3a-4f01-a140-bc15e55e8437
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious Powershell code that execute COM Objects. MITRE ATT&CK:
  T1546.015.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*::GetTypeFromCLSID(*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.ShellExecute(*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*::GetTypeFromCLSID(*';
  data_win_eventdata_scriptBlockText matches '*.ShellExecute(*'.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.015/T1546.015.md#atomic-test-2---powershell-execute-com-object
  - https://attack.mitre.org/techniques/T1546/015/

response:
  message: >
    Suspicious GetTypeFromCLSID ShellExecute detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1546.015
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.015
  custom_tags:
    - gettypefromclsid
    - shellexecute
    - powershell
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*::[Gg][Ee][Tt][Tt][Yy][Pp][Ee][Ff][Rr][Oo][Mm][Cc][Ll][Ss][Ii][Dd]\(.*/ AND data_win_eventdata_scriptBlockText:/.*\.[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc][Uu][Tt][Ee]\(.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-powershell-com-clsid-execution-001
    name: PowerShell Execute COM Object
    reason: Sibling 4104 detection of the same GetTypeFromCLSID/CreateInstance COM-instantiation technique; co-firing on the same script block confirms deliberate COM-based execution rather than a benign ShellExecute call.
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: GetTypeFromCLSID with a remote computer argument is the PowerShell DCOM lateral-movement pattern (MMC20/ShellWindows/ShellBrowserWindow); this tells whether the ShellExecute was local or aimed at another host.
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: MMC20.Application is a classic CLSID used with Document.ActiveView.ExecuteShellCommand; mmc.exe spawning a shell is the process-level result of the same DCOM abuse.
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: Another DCOM-activated execution path via Excel.Application; an attacker who has used one COM object for execution often tries alternatives when one is blocked.
  - id: windows-explorer-spawning-powershell-cmd-001
    name: Windows Explorer Spawning PowerShell or Cmd
    reason: ShellWindows/ShellBrowserWindow ShellExecute runs the child under explorer.exe, laundering the true PowerShell parent; this is the visible child-process result.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: COM objects (MSXML2/WinHttp) in PowerShell are used to fetch the payload that ShellExecute then launches; a precursor staging step in the same script session.
  - id: ea61e291-af05-4716-932a-67faddb6ae6f
    name: PowerShell COM Hijacking InProcServer32 Modification
    reason: 'The rule''s T1546.015 lineage: the same operator may persist via COM hijacking after using COM objects for execution.'
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Download cradle in a script block shortly before/after COM ShellExecute indicates the launched file was fetched remotely, not a local admin task.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell/Office/MMC parent spawning script or LOLBin children (ShellExecute result)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr].[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Mm][Mm][Cc].[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ee][Xx][Cc][Ee][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk].[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*[Cc][Mm][Dd].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: 'Remote DCOM activation: PowerShell to port 135 or mmc/excel spawning a shell'
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]/) AND data_win_eventdata_destinationPort:"135") OR (data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Mm][Mm][Cc].[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ee][Xx][Cc][Ee][Ll].[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*[Cc][Mm][Dd].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 2h
  - name: COM registration hijack (InprocServer32/LocalServer32/TreatAs) around the COM abuse
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Ll][Ss][Ii][Dd].*/) AND ((data_win_eventdata_targetObject:/.*[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_targetObject:/.*[Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_targetObject:/.*[Tt][Rr][Ee][Aa][Tt][Aa][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Ll][Ee][Tt][Uu][Rr][Ll].*/))
    pivot_on:
    - host
    window: 4h
  - name: Download / COM-HTTP / encoded staging in script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt] -[Cc][Oo][Mm][Oo][Bb][Jj][Ee][Cc][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Xx][Mm][Ll]2.[Xx][Mm][Ll][Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Hh][Tt][Tt][Pp].[Ww][Ii][Nn][Hh][Tt][Tt][Pp][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt].[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx] .*/)
    pivot_on:
    - host
    window: 1h
  - name: Executable or script payload dropped to user-writable paths by PowerShell/Explorer
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr].[Ee][Xx][Ee]/) AND ((data_win_eventdata_targetFilename:/.*.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*.[Pp][Ss]1.*/ OR data_win_eventdata_targetFilename:/.*.[Hh][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*.[Jj][Ss].*/ OR data_win_eventdata_targetFilename:/.*.[Vv][Bb][Ss].*/ OR data_win_eventdata_targetFilename:/.*.[Bb][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*.[Ss][Cc][Rr].*/ OR data_win_eventdata_targetFilename:/.*.[Ll][Nn][Kk].*/)) AND ((data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Uu][Ss][Ee][Rr][Ss]/[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_targetFilename:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/))
    pivot_on:
    - host
    window: 2h
