name: Interactive Session on Remote Endpoint with PowerShell
id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of the `Enter-PSSession` cmdlet to establish 
  an interactive session on a remote endpoint via the WinRM protocol. It leverages 
  PowerShell Script Block Logging (EventID 4104) to identify this activity by searching 
  for specific script block text patterns. This behavior is significant as it may indicate 
  lateral movement or remote code execution attempts by adversaries. If confirmed 
  malicious, this activity could allow attackers to execute commands remotely, potentially 
  leading to further compromise of the network and unauthorized access to sensitive 
  information.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Enter-PSSession*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-ComputerName*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Enter-PSSession cmdlet with -ComputerName parameter for 
  remote interactive sessions. Validate that data_win_eventdata_scriptBlockText field 
  is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators may leverage WinRM and `Enter-PSSession` for administrative and 
  troubleshooting tasks. This activity is usually limited to a small set of hosts or 
  users. In certain environments, tuning may not be possible. Filter based on user 
  context and whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1021/006/
  - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/enter-pssession?view=powershell-7.2
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1021.006/T1021.006.md

response:
  message: >
    Interactive PSSession detected from $agent_name$ by user $data_win_eventdata_user$. 
    Remote computer: Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates WinRM-based remote interactive session/lateral movement activity. 
    MITRE ATT&CK: T1021.006
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
    - field: data_win_eventdata_user
      type: user
      score: 65
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Lateral Movement
    - Lateral Movement
    - Remote Code Execution
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.006
  custom_tags:
    - enter_pssession
    - winrm
    - remote_session
    - lateral_movement
    - remote_code_execution
    - remote_execution
    - powershell
    - interactive_session
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Enter-PSSession.*/ AND data_win_eventdata_scriptBlockText:/.*-ComputerName.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: 'Sibling WinRM remoting from the same source host: Invoke-Command is the non-interactive twin of Enter-PSSession and is often used by the same operator for batch execution across targets.'
  - id: 991a9744-f2f0-44f2-bd33-9092eba17dc3
    name: Enable Windows Remote Management
    reason: 'Precursor: attackers enable/configure WinRM (Enable-PSRemoting, WSMan settings) on a host before pivoting into it with Enter-PSSession.'
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: 'Precursor: stolen credentials or hashes harvested via Invoke-Mimikatz are what authenticate the remote PSSession to the next host.'
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: 'Target-side mirror: the destination of Enter-PSSession spawns wsmprovhost.exe, confirming the session landed.'
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Follow-on: commands typed in the interactive session execute as children of the WinRM host process on the target.'
  - id: windows-winrm-spawning-process-001
    name: Windows WinRM Spawning a Process
    reason: 'Follow-on: process creation under WinRM on the remote endpoint is the hands-on-keyboard activity after the session opens.'
  - id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
    name: Potential Lateral Movement via Windows Remote Shell
    reason: Co-occurring WinRM lateral movement variant (winrs.exe) using the same transport; operators switch between the two.
  - id: 9fe55ea2-4cd6-4491-8a54-dd6871651b51
    name: HackTool - Evil-WinRm Execution - PowerShell Module
    reason: Offensive WinRM tooling indicator; its presence turns an admin-looking Enter-PSSession into attacker-driven remoting.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WinRM network connections (5985/5986) from this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 1h
  - name: Other PowerShell remoting and trusted-host/credential setup script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]redential.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Ss][Cc]redential.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]rusted[Hh]osts.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nable-[Pp][Ss][Rr]emoting.*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Credential theft precursors: LSASS access or credential-dumping script blocks'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 4h
  - name: Explicit-credential logons and network logons by this user
    query: data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3")
    pivot_on:
    - user
    window: 2h
  - name: Processes spawned under WinRM host (wsmprovhost) on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
