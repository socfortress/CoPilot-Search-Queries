name: AdsiSearcher Account Discovery
id: de7fcadc-04f3-11ec-a241-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of the `[adsisearcher]` type accelerator in 
  PowerShell to query Active Directory for domain users. It leverages PowerShell Script 
  Block Logging (EventID 4104) to identify script blocks containing `[adsisearcher]`, 
  `objectcategory=user`, and `.findAll()`. This activity is significant as it may 
  indicate an attempt by adversaries or Red Teams to enumerate domain users for 
  situational awareness and Active Directory discovery. If confirmed malicious, this 
  could lead to further reconnaissance, privilege escalation, or lateral movement 
  within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*adsisearcher*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*objectcategory=user*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*findAll*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventID 4104) to be enabled 
  on Windows endpoints. Enable PowerShell operational logs to be imported into the 
  Wazuh index. The Wazuh agent ossec.conf should include the 
  Microsoft-Windows-PowerShell/Operational event channel. The detection monitors for 
  the specific combination of three PowerShell constructs: the [adsisearcher] type 
  accelerator which enables LDAP queries, the LDAP filter for user objects 
  (objectcategory=user), and the findAll() method which returns all matching results.

known_false_positives: >
  Administrators or power users may use this command for legitimate Active Directory 
  troubleshooting and administration purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://www.blackhillsinfosec.com/red-blue-purple/
  - https://devblogs.microsoft.com/scripting/use-the-powershell-adsisearcher-type-accelerator-to-search-active-directory/

response:
  message: >
    ADSI user account discovery detected on $agent_name$ by user $data_win_eventdata_user$.
    PowerShell Script: $data_win_eventdata_scriptBlockText$. 
    This may indicate Active Directory reconnaissance activity.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Industroyer2
    - Active Directory Discovery
    - CISA AA23-347A
    - Data Destruction
    - Scattered Lapsus$ Hunters
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - adsisearcher
    - active_directory
    - user_enumeration
    - ldap_query
    - powershell
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*adsisearcher.*/ AND data_win_eventdata_scriptBlockText:/.*objectcategory=user.*/ AND data_win_eventdata_scriptBlockText:/.*findAll.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Same [adsisearcher] LDAP technique pointed at groups; operators enumerate users then groups in one pass to map privileged accounts
  - id: 1f6399cf-2c80-4924-ace1-6fcff3393480
    name: DirectorySearcher Powershell Exploitation
    reason: Alternative .NET DirectorySearcher route to the same LDAP queries; same enumeration done via a different PowerShell API
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: PowerView-style user enumeration on the same host indicates escalation from native ADSI to a recon toolkit
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: ADRecon is the automated full-AD dump that commonly follows manual user enumeration
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: After listing users, attackers look for Domain/Enterprise Admins membership to pick credential-theft targets
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: User enumeration feeds AS-REP roasting target discovery (DONT_REQ_PREAUTH accounts) in the same session
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: Enumerated accounts are the targets for Kerberoasting; SPN ticket requests are the likely next step
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Discovery precedes credential theft; Mimikatz in script blocks on the same host marks escalation from recon to credential access
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD/LDAP enumeration script blocks (PowerView, DirectorySearcher, Get-AD*)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]irectory[Ss]earcher.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Cc]omputer.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*LDAP://.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Aa][Dd][Rr]econ.*/)
    pivot_on:
    - host
    window: 2h
  - name: Native AD recon binaries launched (nltest, dsquery, adfind, setspn, net)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\([Nn]ltest|[Dd]squery|[Aa]dfind|[Ss]etspn|[Nn]et1?)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Dd]omain|[Gg]roup|[Tt]rust|[Dd]c_list|[Oo]bjectcategory|[Ss]pn).*/
    pivot_on:
    - host
    window: 1h
  - name: Kerberoast / AS-REP roast tooling or SPN ticket requests in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]ubeus.*/ OR data_win_eventdata_scriptBlockText:/.*[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*KerberosRequestorSecurityToken.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*servicePrincipalName.*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Credential dumping and LSASS access on the host after discovery
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*sekurlsa.*/ OR data_win_eventdata_scriptBlockText:/.*MiniDumpWriteDump.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]omsvcs.*/))
    pivot_on:
    - host
    window: 4h
  - name: PowerShell download cradles or result staging after discovery
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xport-[Cc]sv.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/)
    pivot_on:
    - host
    window: 2h
