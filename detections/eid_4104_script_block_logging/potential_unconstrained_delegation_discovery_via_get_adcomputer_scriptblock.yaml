name: Potential Unconstrained Delegation Discovery Via Get-ADComputer - ScriptBlock
id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
version: 1
schema_version: "1.0"
date: "2025-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the "Get-ADComputer" cmdlet in order to identify systems
  which are configured for unconstrained delegation. MITRE ATT&CK: T1018, T1558,
  T1589.002.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Properties*TrustedForDelegation*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Properties*TrustedToAuthForDelegation*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Properties*msDS-AllowedToDelegateTo*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Properties*PrincipalsAllowedToDelegateToAccount*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-LDAPFilter*(userAccountControl:1.2.840.113556.1.4.803:=524288)*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches
  '*-Properties*TrustedForDelegation*'; data_win_eventdata_scriptBlockText
  matches '*-Properties*TrustedToAuthForDelegation*';
  data_win_eventdata_scriptBlockText matches
  '*-Properties*msDS-AllowedToDelegateTo*', among other conditions.

known_false_positives: >
  Legitimate use of the library for administrative activity. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://pentestlab.blog/2022/03/21/unconstrained-delegation/
  - https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adcomputer?view=windowsserver2022-ps
  - https://attack.mitre.org/techniques/T1018/
  - https://attack.mitre.org/techniques/T1558/
  - https://attack.mitre.org/techniques/T1589/002/

response:
  message: >
    Potential Unconstrained Delegation Discovery Via Get-ADComputer -
    ScriptBlock detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1018, T1558, T1589.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
    - T1558
    - T1589.002
  custom_tags:
    - unconstrained
    - delegation
    - adcomputer
    - powershell
    - reconnaissance
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*-[Pp][Rr][Oo][Pp][Ee][Rr][Tt][Ii][Ee][Ss].*[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ff][Oo][Rr][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Rr][Oo][Pp][Ee][Rr][Tt][Ii][Ee][Ss].*[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Tt][Oo][Aa][Uu][Tt][Hh][Ff][Oo][Rr][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Rr][Oo][Pp][Ee][Rr][Tt][Ii][Ee][Ss].*[Mm][Ss][Dd][Ss]-[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Tt][Oo].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Rr][Oo][Pp][Ee][Rr][Tt][Ii][Ee][Ss].*[Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Ss][Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Tt][Oo][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*-[Ll][Dd][Aa][Pp][Ff][Ii][Ll][Tt][Ee][Rr].*\([Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll]:1\.2\.840\.113556\.1\.4\.803:=524288\).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: Same ActiveDirectory-module cmdlet abuse in script blocks; the delegation query is usually one step of a wider AD enumeration session.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: PowerView (Get-DomainComputer -Unconstrained) is the offensive equivalent of this query; attackers often switch between the AD module and PowerView.
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: Computer-object enumeration that co-occurs with delegation hunting to pick target hosts.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: 'Follow-on: once an unconstrained delegation host is found, Rubeus monitors/harvests TGTs (monitor, tgtdeleg, s4u) from it.'
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: 'Follow-on: Kerberos ticket requests from PowerShell after identifying delegation-enabled targets (Kerberoasting / S4U abuse).'
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: 'Follow-on: command-line ticket requests to exploit the discovered delegation configuration.'
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: 'Co-occurring Kerberos-focused discovery: SPN enumeration often accompanies delegation discovery when choosing Kerberos attack paths.'
  - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
    name: Detect SharpHound Command-Line Arguments
    reason: BloodHound collection maps delegation edges too; either tool alongside this indicates systematic attack-path mapping.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AD / delegation enumeration script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-ADComputer* OR data_win_eventdata_scriptBlockText:*Get-ADUser* OR data_win_eventdata_scriptBlockText:*Get-DomainComputer* OR data_win_eventdata_scriptBlockText:*Get-NetComputer* OR data_win_eventdata_scriptBlockText:*Find-DomainObjectPropertyOutlier* OR data_win_eventdata_scriptBlockText:*Get-DomainController* OR data_win_eventdata_scriptBlockText:*Invoke-ShareFinder* OR data_win_eventdata_scriptBlockText:*Get-ADTrust* OR data_win_eventdata_scriptBlockText:*Get-ADDomainController*)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos TGT/delegation abuse tooling (Rubeus, Kekeo, Mimikatz)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Rr]ubeus|[Kk]ekeo|[Tt][Gg][Tt][Dd][Ee][Ll][Ee][Gg]|[Ss]4[Uu]|kerberos::|sekurlsa::tickets|asktgt|asktgs).*/ OR data_win_eventdata_image:/.*(\\[Rr]ubeus|\\[Kk]ekeo|\\[Mm]imikatz)\\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos ticket file creation or ticket injection artifacts
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.kirbi OR data_win_eventdata_targetFilename:*.ccache)
    pivot_on:
    - host
    window: 4h
  - name: Print spooler / coercion tooling to force DC auth to delegation host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss]pooler[Ss]ample|[Ss]harp[Ss]pool[Hh]ound|[Pp]rinter[Bb]ug|[Pp]etit[Pp]otam|[Cc]oercer).*/ OR data_win_eventdata_image:/.*(\\[Ss]pooler[Ss]ample|\\[Ss]harp[Ss]pool[Hh]ound|\\[Pp]etit[Pp]otam)\\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: 'Credential access: LSASS access or ticket dumping after discovery'
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
