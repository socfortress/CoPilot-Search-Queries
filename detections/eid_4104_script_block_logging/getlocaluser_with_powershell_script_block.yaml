name: Get-LocalUser with PowerShell Script Block
id: 2e891cbe-0426-11ec-9c9c-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-LocalUser` PowerShell cmdlet 
  using PowerShell Script Block Logging (EventID 4104). This cmdlet lists all local 
  users on a system. The detection leverages script block text from PowerShell logs to 
  identify this activity. Monitoring this behavior is significant as adversaries and 
  Red Teams may use it to enumerate local users for situational awareness and Active 
  Directory discovery. If confirmed malicious, this activity could lead to further 
  reconnaissance, enabling attackers to identify potential targets for privilege 
  escalation or lateral movement.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-LocalUser*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-LocalUser cmdlet, which is used for local user 
  enumeration. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell cmdlet for legitimate 
  troubleshooting and user management purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1087/001/
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html
  - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.localaccounts/get-localuser

response:
  message: >
    Get-LocalUser execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates local user enumeration/reconnaissance activity for privilege escalation targeting. 
    MITRE ATT&CK: T1087.001, T1059.001
  risk_score: 35
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 35
    - field: data_win_eventdata_user
      type: user
      score: 35
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Malicious PowerShell
    - Local User Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.001
    - T1059.001
  custom_tags:
    - get_localuser
    - local_users
    - user_enumeration
    - local_accounts
    - privilege_escalation
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-LocalUser.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85fae8fa-0427-11ec-8b78-acde48001122
    name: GetLocalUser with PowerShell
    reason: Process-creation twin of the same Get-LocalUser enumeration; co-firing confirms the cmdlet was launched from a command line, adding parent process and user context the script block lacks
  - id: b71adfcc-155b-11ec-9413-acde48001122
    name: PowerShell Get LocalGroup Discovery
    reason: Local account listing is normally paired with local group enumeration (who is in Administrators) in the same PowerShell recon session
  - id: c8a180d6-47a3-4345-a609-53f9c3d834fc
    name: Suspicious Reconnaissance Activity Using Get-LocalGroupMember Cmdlet
    reason: 'Follow-on step: after listing users the operator resolves membership of privileged local groups to pick escalation targets'
  - id: 4902d7aa-0134-11ec-9d65-acde48001122
    name: Local Account Discovery With Wmic
    reason: Same local-account discovery goal via wmic useraccount; operators switch tools within one recon burst
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: net user / net localgroup is the classic companion to Get-LocalUser when mapping local and domain accounts
  - id: 5434f670-155d-11ec-8cca-acde48001122
    name: Get WMIObject Group Discovery
    reason: Get-WmiObject Win32_Group/UserAccount is the alternate PowerShell route for the same account and group discovery
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Self-context discovery (whoami /groups) usually precedes or follows listing local users to judge current privilege
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: Escalation of the same recon from local accounts to domain accounts via the AD PowerShell module when the host is domain-joined
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other account/group discovery cmdlets in script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-LocalGroup* OR data_win_eventdata_scriptBlockText:*Get-LocalGroupMember* OR data_win_eventdata_scriptBlockText:*Get-ADUser* OR data_win_eventdata_scriptBlockText:*Get-ADGroupMember* OR data_win_eventdata_scriptBlockText:*Win32_UserAccount* OR data_win_eventdata_scriptBlockText:*Win32_Group* OR data_win_eventdata_scriptBlockText:*DirectorySearcher* OR data_win_eventdata_scriptBlockText:*adsisearcher*)
    pivot_on:
    - host
    window: 2h
  - name: Command-line account enumeration processes on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(user|localgroup|group|accounts).*/) OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Gg][Rr][Oo][Uu][Pp]).*/) OR data_win_eventdata_image:/.*\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Account creation or privilege changes following enumeration
    query: data_win_system_eventID:("4720" OR "4722" OR "4724" OR "4728" OR "4732" OR "4738" OR "4756")
    pivot_on:
    - host
    window: 6h
  - name: Logons to this host that follow local account discovery
    query: data_win_system_eventID:("4624" OR "4625" OR "4648") AND data_win_eventdata_logonType:("2" OR "3" OR "10")
    pivot_on:
    - host
    window: 4h
  - name: Encoded, download or bypass script blocks near the enumeration
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*Invoke-Command*)
    pivot_on:
    - host
    window: 2h
