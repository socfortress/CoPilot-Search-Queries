name: Potential Suspicious PowerShell Keywords
id: 1f49f2ab-26bc-48b3-96cc-dcffbc93eadf
version: 1
schema_version: "1.0"
date: "2023-04-21"
author: Florian Roth (Nextron Systems), Perez Diego (@darkquassar), Tuan Le (NCSGroup)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1f49f2ab-26bc-48b3-96cc-dcffbc93eadf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potentially suspicious keywords that could indicate the use of a
  PowerShell exploitation framework. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*System.Reflection.Assembly.Load($*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*[System.Reflection.Assembly]::Load($*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*[Reflection.Assembly]::Load($*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*System.Reflection.AssemblyName*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Reflection.Emit.AssemblyBuilderAccess*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Reflection.Emit.CustomAttributeBuilder*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Runtime.InteropServices.UnmanagedType*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Runtime.InteropServices.DllImportAttribute*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*SuspendThread*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*rundll32*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches
  '*System.Reflection.Assembly.Load($*'; data_win_eventdata_scriptBlockText
  matches '*[System.Reflection.Assembly]::Load($*';
  data_win_eventdata_scriptBlockText matches '*[Reflection.Assembly]::Load($*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.specterops.io/entering-a-covenant-net-command-and-control-e11038bcf462
  - https://github.com/PowerShellMafia/PowerSploit/blob/d943001a7defb5e0d1657085a77a0e78609be58f/CodeExecution/Invoke-ReflectivePEInjection.ps1
  - https://github.com/hlldz/Phant0m/blob/30c2935d8cf4aafda17ee2fab7cd0c4aa9a607c2/old/Invoke-Phant0m.ps1
  - https://gist.github.com/MHaggis/0dbe00ad401daa7137c81c99c268cfb7
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Potential Suspicious PowerShell Keywords detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - keywords
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\.[Ll][Oo][Aa][Dd]\(\$.*/ OR data_win_eventdata_scriptBlockText:/.*\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\]::[Ll][Oo][Aa][Dd]\(\$.*/ OR data_win_eventdata_scriptBlockText:/.*\[[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\]::[Ll][Oo][Aa][Dd]\(\$.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Ee][Mm][Ii][Tt]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy][Bb][Uu][Ii][Ll][Dd][Ee][Rr][Aa][Cc][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Ee][Mm][Ii][Tt]\.[Cc][Uu][Ss][Tt][Oo][Mm][Aa][Tt][Tt][Rr][Ii][Bb][Uu][Tt][Ee][Bb][Uu][Ii][Ll][Dd][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Uu][Nn][Tt][Ii][Mm][Ee]\.[Ii][Nn][Tt][Ee][Rr][Oo][Pp][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Uu][Nn][Mm][Aa][Nn][Aa][Gg][Ee][Dd][Tt][Yy][Pp][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Uu][Nn][Tt][Ii][Mm][Ee]\.[Ii][Nn][Tt][Ee][Rr][Oo][Pp][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Dd][Ll][Ll][Ii][Mm][Pp][Oo][Rr][Tt][Aa][Tt][Tt][Rr][Ii][Bb][Uu][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Uu][Ss][Pp][Ee][Nn][Dd][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Same reflective Assembly.Load staging seen in script block logs; a sibling hit confirms in-memory .NET payload loading rather than benign keyword use
  - id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
    name: PowerShell Loading DotNET into Memory via Reflection
    reason: Co-occurring fileless .NET load via reflection from the same script, confirming the loader stage
  - id: 03d83090-8cba-44a0-b02f-0b756a050306
    name: Potential WinAPI Calls Via PowerShell Scripts
    reason: DllImport/UnmanagedType keywords usually pair with P/Invoke WinAPI calls (VirtualAlloc, CreateThread) in the same block
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: 'Follow-on step: P/Invoke interop is used to resolve APIs and inject shellcode into a process'
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Reflection/interop keywords commonly wrap shellcode byte arrays executed in-process
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Reflection-based frameworks typically disable AMSI via Assembly.GetType before loading payloads
  - id: 99b97608-3e21-4bfe-8217-2a127c396a0e
    name: Remote Thread Creation Via PowerShell In Uncommon Target
    reason: SuspendThread/interop in Phant0m and ReflectivePEInjection culminates in remote threads into other processes
  - id: 58cb02d5-78ce-4692-b3e1-dce850aae41a
    name: Alternate PowerShell Hosts Pipe
    reason: Covenant/Empire-style in-process PowerShell hosts expose a PSHost named pipe without powershell.exe
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script blocks with AMSI bypass, ETW tampering or encoded loaders
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*EtwEventWrite* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*VirtualAlloc* OR data_win_eventdata_scriptBlockText:*GetProcAddress* OR data_win_eventdata_scriptBlockText:*Invoke-ReflectivePEInjection*)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell-sourced remote threads and process access (injection)
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND data_win_eventdata_sourceImage:/.*\\(?:[Pp]owershell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Managed .NET runtime loads in non-PowerShell processes
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Cc]lr\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Cc]lrjit\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*System\.Management\.Automation.*/) AND NOT data_win_eventdata_image:/.*\\(?:[Pp]owershell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Network connections from PowerShell or rundll32 (staging or C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\(?:[Pp]owershell|[Pp]wsh|[Rr]undll32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Files dropped by PowerShell (payload DLL/EXE/script staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\(?:[Pp]owershell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:*.dll OR data_win_eventdata_targetFilename:*.exe OR data_win_eventdata_targetFilename:*.ps1 OR data_win_eventdata_targetFilename:*.bat)
    pivot_on:
    - host
    window: 2h
