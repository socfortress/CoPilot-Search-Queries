name: Powershell Install a DLL in System Directory
id: 63bf8794-9917-45bc-88dd-e1b5abc0ecfd
version: 1
schema_version: "1.0"
date: "2024-01-22"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 63bf8794-9917-45bc-88dd-e1b5abc0ecfd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Uses PowerShell to install/copy a file into a system directory such as
  "System32" or "SysWOW64". MITRE ATT&CK: T1556.002.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - regexp:
            data_win_eventdata_scriptBlockText: ".*((Copy-Item|cpi) .* -Destination .*\\\\Windows\\\\(System32|SysWOW64)).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches the regex /.*((Copy-Item|cpi) .*
  -Destination .*\\Windows\\(System32|SysWOW64)).*/.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1556.002/T1556.002.md#atomic-test-1---install-and-register-password-filter-dll
  - https://attack.mitre.org/techniques/T1556/002/

response:
  message: >
    Powershell Install a DLL in System Directory detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1556.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1556.002
  custom_tags:
    - powershell
    - install
    - system
    - persistence
    - credential_access
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*((Copy-Item|cpi) .* -Destination .*\\Windows\\(System32|SysWOW64)).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b7966f4a-b333-455b-8370-8ca53c229762
    name: Dropping Of Password Filter DLL
    reason: 'Same T1556.002 technique via process command line: password filter DLL copied into System32 then registered; confirms the Copy-Item targeted a password filter.'
  - id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
    name: Potential Persistence Via LSA Extensions
    reason: The DLL copied into System32 must be registered under the LSA key (Notification Packages/Security Packages) to load into lsass; this is the registration step.
  - id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
    name: Security Support Provider (SSP) Added to LSA Configuration
    reason: Dropped System32 DLL may be a malicious SSP registered in LSA config to be loaded by lsass and harvest credentials.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: After reboot/registration the planted unsigned DLL is loaded by lsass.exe, proving the copy became active credential interception.
  - id: b3503044-60ce-4bf4-bbcb-e3db98788823
    name: DLL Load via LSASS
    reason: Registry-driven DLL load into LSASS following the System32 drop is the activation of the password filter or auth package.
  - id: 92772523-d9c1-4c93-9547-b0ca500baba3
    name: Potential Persistence Via Mpnotify
    reason: Alternative winlogon notification-DLL persistence for a System32-planted DLL that captures logon credentials.
  - id: 851c506b-6b7c-4ce2-8802-c703009d03c0
    name: Winlogon Helper DLL
    reason: Same PowerShell script-block telemetry; a planted DLL is commonly wired in as Winlogon helper for persistence.
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: File-creation view of the same System32 DLL drop; shows the DLL name and writing process when 4104 only shows the script.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL file written into System32/SysWOW64
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\Windows\\(System32|SysWOW64)\\.*\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: LSA Notification/Security/Authentication Packages registry change
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND data_win_eventdata_targetObject:/.*\\Control\\Lsa\\.*(Notification Packages|Security Packages|Authentication Packages).*/
    pivot_on:
    - host
    window: 2h
  - name: Unsigned or non-Microsoft DLL loaded into lsass.exe
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_signed:"true"
    pivot_on:
    - host
    window: 6h
  - name: Script blocks registering DLL via LSA registry or regsvr32/rundll32
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]ontrol\\[Ll]sa.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]otification [Pp]ackages.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]egsvr32.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]undll32.*/)
    pivot_on:
    - host
    window: 2h
  - name: Sysmon process creation of powershell with DLL copy to System32
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc]opy-[Ii]tem|[Cc][Pp][Ii]|[Cc]opy).*\\Windows\\(System32|SysWOW64).*/
    pivot_on:
    - host
    window: 1h
