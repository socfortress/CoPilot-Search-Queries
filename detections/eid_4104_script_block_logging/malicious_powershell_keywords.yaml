[Aa][Tt][Ii][Oo][Nn]_[Cc][Ll][Aa][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Qq][Uu][Ee][Rr][Yy].*/)

