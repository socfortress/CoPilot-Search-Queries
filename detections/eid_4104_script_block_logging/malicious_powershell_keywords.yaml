name: Malicious PowerShell Keywords
id: f62176f3-8128-4faa-bf6c-83261322e5eb
version: 1
schema_version: "1.0"
date: "2023-06-20"
author: Sean Metcalf (source), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f62176f3-8128-4faa-bf6c-83261322e5eb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects keywords from well-known PowerShell exploitation frameworks. MITRE
  ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*AdjustTokenPrivileges*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*IMAGE_NT_OPTIONAL_HDR64_MAGIC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Metasploit*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Microsoft.Win32.UnsafeNativeMethods*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Mimikatz*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*MiniDumpWriteDump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*PAGE_EXECUTE_READ*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*ReadProcessMemory.Invoke*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*SE_PRIVILEGE_ENABLED*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*SECURITY_DELEGATION*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_ADJUST_PRIVILEGES*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_ALL_ACCESS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_ASSIGN_PRIMARY*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_DUPLICATE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_ELEVATION*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_IMPERSONATE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_INFORMATION_CLASS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_PRIVILEGES*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TOKEN_QUERY*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*AdjustTokenPrivileges*';
  data_win_eventdata_scriptBlockText matches '*IMAGE_NT_OPTIONAL_HDR64_MAGIC*';
  data_win_eventdata_scriptBlockText matches '*Metasploit*', among other
  conditions.

known_false_positives: >
  Depending on the scripts, this rule might require some initial tuning to fit
  the environment. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://adsecurity.org/?p=2921
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Malicious PowerShell Keywords detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - keywords
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Jj][Uu][Ss][Tt][Tt][Oo][Kk][Ee][Nn][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Mm][Aa][Gg][Ee]_[Nn][Tt]_[Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll]_[Hh][Dd][Rr]64_[Mm][Aa][Gg][Ii][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ee][Tt][Aa][Ss][Pp][Ll][Oo][Ii][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ww][Ii][Nn]32\.[Uu][Nn][Ss][Aa][Ff][Ee][Nn][Aa][Tt][Ii][Vv][Ee][Mm][Ee][Tt][Hh][Oo][Dd][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp][Ww][Rr][Ii][Tt][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Aa][Gg][Ee]_[Ee][Xx][Ee][Cc][Uu][Tt][Ee]_[Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Aa][Dd][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy]\.[Ii][Nn][Vv][Oo][Kk][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee]_[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]_[Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]_[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Aa][Dd][Jj][Uu][Ss][Tt]_[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Aa][Ll][Ll]_[Aa][Cc][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Aa][Ss][Ss][Ii][Gg][Nn]_[Pp][Rr][Ii][Mm][Aa][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Dd][Uu][Pp][Ll][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Ee][Ll][Ee][Vv][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Ii][Nn][Ff][Oo][Rr][Mm][Aa][Tt][Ii][Oo][Nn]_[Cc][Ll][Aa][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Kk][Ee][Nn]_[Qq][Uu][Ee][Rr][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Same 4104 telemetry; the Mimikatz keyword in this rule is often an Invoke-Mimikatz block, which this rule confirms by command-level content.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Token-privilege and PE-header keywords (SE_PRIVILEGE_ENABLED, IMAGE_NT_OPTIONAL_HDR64_MAGIC) are the in-memory loader pattern of Invoke-Mimikatz; this corroborates the framework.
  - id: 84c174ab-d3ef-481f-9c86-a50d0b8e3edb
    name: PowerShell Get-Process LSASS in ScriptBlock
    reason: 'Script locating the LSASS PID is the next step after MiniDumpWriteDump/ReadProcessMemory keywords: targeting credentials memory.'
  - id: cd185561-4760-45d6-a63e-a51325112cae
    name: Live Memory Dump Using Powershell
    reason: MiniDumpWriteDump via PowerShell is the dumping action behind the MiniDumpWriteDump keyword hit.
  - id: fb656378-f909-47c1-8747-278bf09f4f4f
    name: Potential Credential Dumping Attempt Via PowerShell Remote Thread
    reason: PowerShell injecting a remote thread into LSASS is the Sysmon-side follow-on of token/ReadProcessMemory frameworks.
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: PAGE_EXECUTE_READ and PE-magic keywords overlap with PowerShell shellcode/reflective loaders, such as Metasploit-generated stagers.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Offensive frameworks typically bypass AMSI in an earlier script block before the keyword-bearing payload runs.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: Operators add Defender exclusions in PowerShell before or after staging framework tooling, to keep it from being scanned.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access or dump-file creation on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/))
    pivot_on:
    - host
    window: 1h
  - name: PowerShell remote thread or process injection
    query: data_win_system_eventID:"8" AND (data_win_eventdata_sourceImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_sourceImage:/.*[Pp][Ww][Ss][Hh].*/)
    pivot_on:
    - host
    window: 1h
  - name: AMSI bypass or script-block tampering in PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell fetching remote payloads or in-memory loading
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound connections (C2 or staging)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
