response:
  message: >
    HackTool - WinPwn Execution - ScriptBlock detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1046, T1082, T1106, T1518, T1548.002, T1552.001, T1555, T1555.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
    - T1082
    - T1106
    - T1518
    - T1548.002
    - T1552.001
    - T1555
    - T1555.003
  custom_tags:
    - hacktool
    - winpwn
    - scriptblock
    - powershell
    - credential_access
    - discovery
    - execution
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Oo][Ff][Ff][Ll][Ii][Nn][Ee]_[Ww][Ii][Nn][Pp][Ww][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Pp][Ww][Nn] .*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Pp][Ww][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Pp][Ww][Nn]\.[Pp][Ss]1.*/)

