name: Powershell Detect Virtualization Environment
id: d93129cd-1ee0-479f-bc03-ca6f129882e3
version: 1
schema_version: "1.0"
date: "2022-03-03"
author: frack113, Duc.Le-GTSC
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d93129cd-1ee0-479f-bc03-ca6f129882e3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may employ various system checks to detect and avoid
  virtualization and analysis environments. This may include changing behaviors
  based on the results of checks for the presence of artifacts indicative of a
  virtual machine environment (VME) or sandbox. MITRE ATT&CK: T1497.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-WmiObject*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*gwmi*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*MSAcpi_ThermalZoneTemperature*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Win32_ComputerSystem*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-WmiObject*';
  data_win_eventdata_scriptBlockText matches '*gwmi*';
  data_win_eventdata_scriptBlockText matches '*MSAcpi_ThermalZoneTemperature*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1497.001/T1497.001.md
  - https://techgenix.com/malicious-powershell-scripts-evade-detection/
  - https://attack.mitre.org/techniques/T1497/001/

response:
  message: >
    Powershell Detect Virtualization Environment detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1497.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1497.001
  custom_tags:
    - powershell
    - detect
    - virtualization
    - discovery
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ww][Mm][Ii][Oo][Bb][Jj][Ee][Cc][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ww][Mm][Ii].*/) AND (data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Aa][Cc][Pp][Ii]_[Tt][Hh][Ee][Rr][Mm][Aa][Ll][Zz][Oo][Nn][Ee][Tt][Ee][Mm][Pp][Ee][Rr][Aa][Tt][Uu][Rr][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss][Yy][Ss][Tt][Ee][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 018c1972-ca07-11eb-9473-acde48001122
    name: Recon Using WMI Class
    reason: Same script typically batches other WMI class queries (BIOS, disk, CPU) for host fingerprinting alongside the VM/sandbox check
  - id: 28077620-c9f6-11eb-8785-acde48001122
    name: Recon AVProduct Through PowerShell or WMI
    reason: Malware pairing sandbox checks with AV product enumeration via WMI SecurityCenter2 to decide whether to proceed
  - id: 904e8e61-8edf-4350-b59c-b905fc8e810c
    name: Security Software Discovery Via Powershell Script
    reason: 'Environment-awareness stage: after ruling out a VM, the script profiles installed security tooling'
  - id: 3e3ceccd-6c06-48b8-b5ff-ab1d25db8c1d
    name: Hardware Model Reconnaissance Via Wmic.EXE
    reason: Wmic equivalent of Win32_ComputerSystem model/manufacturer checks used to spot VMware/VirtualBox/Hyper-V
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Evasive loaders disable AMSI in the same script that checks for analysis environments, before staging payload
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: If the host passes the VM check, the next step is payload download from the same script
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: Alternate download cradle used by loaders that gate payload retrieval on a clean environment check
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Post-check fileless payload execution that follows a sandbox-evasion gate
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other WMI/CIM hardware and VM fingerprinting script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_([Bb][Ii][Oo][Ss]|[Bb][Aa][Ss][Ee][Bb][Oo][Aa][Rr][Dd]|[Dd][Ii][Ss][Kk][Dd][Rr][Ii][Vv][Ee]|[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Oo][Rr]|[Vv][Ii][Dd][Ee][Oo][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr]|[Pp][Hh][Yy][Ss][Ii][Cc][Aa][Ll][Mm][Ee][Mm][Oo][Rr][Yy]).*/ OR data_win_eventdata_scriptBlockText:/.*([Vv][Mm][Ww][Aa][Rr][Ee]|[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Bb][Oo][Xx]|[Vv][Bb][Oo][Xx]|[Qq][Ee][Mm][Uu]|[Hh][Yy][Pp][Ee][Rr]-[Vv]|[Xx][Ee][Nn]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Download cradle, AMSI bypass or encoded execution in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell spawned by script/Office/WMI parent with encoded or hidden args
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(-[Ee][Nn][Cc]|-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd]|-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] +[Hh]|-[Nn][Oo][Pp]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections by PowerShell after environment check
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Executable or script dropped by PowerShell to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]).*/
    pivot_on:
    - host
    window: 4h
