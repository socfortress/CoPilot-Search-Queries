name: PowerShell ADRecon Execution
id: bf72941a-cba0-41ea-b18c-9aca3925690d
version: 1
schema_version: "1.0"
date: "2022-09-06"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bf72941a-cba0-41ea-b18c-9aca3925690d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of ADRecon.ps1 for AD reconnaissance which has been reported
  to be actively used by FIN7. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Function Get-ADRExcelComOb*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-ADRGPO*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-ADRDomainController*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*ADRecon-Report.xlsx*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Function Get-ADRExcelComOb*';
  data_win_eventdata_scriptBlockText matches '*Get-ADRGPO*';
  data_win_eventdata_scriptBlockText matches '*Get-ADRDomainController*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/sense-of-security/ADRecon/blob/11881a24e9c8b207f31b56846809ce1fb189bcc9/ADRecon.ps1
  - https://bi-zone.medium.com/from-pentest-to-apt-attack-cybercriminal-group-fin7-disguises-its-malware-as-an-ethical-hackers-c23c9a75e319
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    PowerShell ADRecon Execution detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - adrecon
    - discovery
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn] [Gg][Ee][Tt]-[Aa][Dd][Rr][Ee][Xx][Cc][Ee][Ll][Cc][Oo][Mm][Oo][Bb].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Rr][Gg][Pp][Oo].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Rr][Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Rr][Ee][Cc][Oo][Nn]-[Rr][Ee][Pp][Oo][Rr][Tt]\.[Xx][Ll][Ss][Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: ADRecon uses the same ActiveDirectory module/ADSI queries; an AD-module script block on the same host in the same session confirms bulk directory enumeration.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Operators commonly pair ADRecon with PowerView for targeted follow-up (trusts, ACLs, local admin hunting) from the same PowerShell session.
  - id: windows-powershell-domain-enumeration-001
    name: Windows PowerShell Domain Enumeration
    reason: Additional PowerShell domain/DC/group enumeration in script blocks corroborates ADRecon's broad recon and shows operator hands-on activity.
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: ADRecon dumps privileged group membership; the follow-up is typically focused discovery of Domain/Enterprise Admins to pick the next target account.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: 'Same actor tradecraft stage: after a flat ADRecon dump, attackers run SharpHound to compute attack paths to Domain Admin.'
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: FIN7 and ransomware crews combine ADRecon with AdFind as a parallel or fallback AD enumeration tool on the same host.
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: ADRecon exposes SPN/service accounts and Kerberoastable users; requesting service tickets from PowerShell is the natural credential-access next step.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: ADRecon writes an ADRecon-Report folder of CSV/XLSX; archiving it is the staging step before exfiltration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ADRecon report/output files written on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Aa][Dd][Rr][Ee][Cc][Oo][Nn].*/ OR data_win_eventdata_targetFilename:/.*[Aa][Dd][Rr][Ee][Cc][Oo][Nn]-[Rr][Ee][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr][Ss]\.[Cc][Ss][Vv]/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\.[Cc][Ss][Vv]/)
    pivot_on:
    - host
    window: 4h
  - name: Other AD enumeration script blocks (AD module, PowerView, Kerberoast, BloodHound ingestors)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Ii][Nn][Dd]-[Ll][Oo][Cc][Aa][Ll][Aa][Dd][Mm][Ii][Nn][Aa][Cc][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/)
    pivot_on:
    - host
    window: 4h
  - name: AD recon and discovery command-line tools run on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +([Gg][Rr][Oo][Uu][Pp]|[Uu][Ss][Ee][Rr]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt][Ss]).*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: Staging, archiving or exfil tooling of the recon output
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Rr][Aa][Rr]|7[Zz]|7[Zz][Aa]|[Cc][Uu][Rr][Ll]|[Ww][Ii][Nn][Ss][Cc][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-([Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]).*-[Mm][Ee][Tt][Hh][Oo][Dd] +[Pp][Oo][Ss][Tt].*/)
    pivot_on:
    - host
    window: 6h
  - name: PowerShell LDAP/Global Catalog/ADWS connections to domain controllers
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"3269" OR data_win_eventdata_destinationPort:"9389")
    pivot_on:
    - host
    window: 2h
