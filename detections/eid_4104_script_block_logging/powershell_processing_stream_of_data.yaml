name: Powershell Processing Stream Of Data
id: windows-powershell-processing-stream-of-data-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects suspicious PowerShell script execution involving compressed stream data 
  processing, identified via EventCode 4104. It leverages PowerShell Script Block 
  Logging to flag scripts using IO.Compression, IO.StreamReader, or decompression 
  methods. This activity is significant as it often indicates obfuscated PowerShell 
  or embedded .NET/binary execution, which are common tactics for evading detection. 
  If confirmed malicious, this behavior could allow attackers to execute hidden code, 
  escalate privileges, or maintain persistence within the environment.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*IO.Compression.*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*IO.StreamReader*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*]::Decompress*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  PowerShell may legitimately use this function to process compressed data. Filter 
  based on user context, source script path, and frequency of execution to identify 
  anomalies. Administrative scripts that handle compressed data should be reviewed.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://medium.com/@ahmedjouini99/deobfuscating-emotets-powershell-payload-e39fb116f7b9
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://www.crowdstrike.com/blog/investigating-powershell-command-and-script-logging/
  - https://thedfirreport.com/2023/05/22/icedid-macro-ends-in-nokoyawa-ransomware/

response:
  message: >
    Stream compression processing detected in PowerShell on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 60
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
  threat_objects: []

tags:
  analytic_story:
    - Hellcat Ransomware
    - Malicious PowerShell
    - Medusa Ransomware
    - PXA Stealer
    - Data Destruction
    - AsyncRAT
    - Hermetic Wiper
    - IcedID
    - XWorm
    - MuddyWater
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*IO\.Compression\..*/ OR data_win_eventdata_scriptBlockText:/.*IO\.StreamReader.*/ OR data_win_eventdata_scriptBlockText:/.*\]::Decompress.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 98767d61-b2e8-4d71-b661-e36783ee24c1
    name: Gzip Archive Decode Via PowerShell
    reason: Same GzipStream/IO.Compression decode primitive seen at process-creation level; confirms the script block is an inline decompress-and-run loader.
  - id: 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7
    name: Invoke-Obfuscation COMPRESS OBFUSCATION
    reason: Invoke-Obfuscation COMPRESS launcher builds DeflateStream+StreamReader chains, exactly the IO.Compression/StreamReader pattern in the 4104 block.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Compressed payloads are almost always Base64-wrapped (FromBase64String -> DeflateStream); the encoded launch is the precursor command line.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The -enc launcher that delivers the compressed stage; precedes the 4104 decompression block.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Loaders that decompress in-memory .NET assemblies typically patch AMSI first so the decoded stage is not scanned.
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Defender flagging the decompressed script/assembly via AMSI is direct corroboration that the stream held malicious content.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Follow-on defense evasion by the same PowerShell payload once it is running, to protect the dropped stage.
  - id: c260b6db-48ba-4b4a-a76f-2f67644e99d2
    name: HackTool - Covenant PowerShell Launcher
    reason: Covenant/Empire-style launchers deliver gzip-compressed stagers decoded via IO.Compression; co-occurring launcher indicates C2 framework stage.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradle, AMSI bypass or reflective load in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ee]xpression.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawned by Office, script host or LOLBin parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Executables or scripts dropped by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Ll][Nn][Kk])/
    pivot_on:
    - host
    window: 2h
  - name: Persistence or Defender tampering after PowerShell stage
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]).*/
    pivot_on:
    - host
    window: 2h
