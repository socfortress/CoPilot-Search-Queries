name: PowerShell COM Hijacking InProcServer32 Modification
id: ea61e291-af05-4716-932a-67faddb6ae6f
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects attempts to modify or add a Component Object Model 
  (COM) entry to the InProcServer32 path within the registry using PowerShell. It 
  leverages PowerShell ScriptBlock Logging (EventID 4104) to identify suspicious script 
  blocks that target the InProcServer32 registry path. This activity is significant 
  because modifying COM objects can be used for persistence or privilege escalation by 
  attackers. If confirmed malicious, this could allow an attacker to execute arbitrary 
  code or maintain persistent access to the compromised system, posing a severe security risk.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Software\\Classes\\CLSID\\*\\InProcServer32*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  The following analytic requires PowerShell operational logs to be imported. The Wazuh 
  agent ossec.conf should include the Microsoft-Windows-PowerShell/Operational event 
  channel. This detection monitors for PowerShell script blocks that target the 
  InProcServer32 registry path within Software\Classes\CLSID. Validate that 
  data_win_eventdata_scriptBlockText field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  False positives will be present if any scripts are adding to InProcServer32 for 
  legitimate purposes. Filter based on user context, registry paths being modified, 
  and whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1546/015/
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html
  - https://blog.cluster25.duskrise.com/2022/09/23/in-the-footsteps-of-the-fancy-bear-powerpoint-graphite/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1546.015/T1546.015.md

response:
  message: >
    PowerShell COM hijacking via InProcServer32 modification detected on $agent_name$ 
    by user $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates potential COM persistence/privilege escalation attempt. 
    MITRE ATT&CK: T1546.015, T1059.001
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
    - field: data_win_eventdata_user
      type: user
      score: 70
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Malicious PowerShell
    - Persistence Techniques
    - Privilege Escalation
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1546.015
  custom_tags:
    - com_hijacking
    - inprocserver32
    - registry_modification
    - persistence
    - privilege_escalation
    - powershell
    - clsid
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Software\\\\Classes\\\\CLSID\\\\.*\\\\InProcServer32.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-com-hijacking-inprocserver32-001
    name: Windows COM Hijacking InprocServer32 Modification
    reason: Same InprocServer32 COM hijack done via reg.exe/command line instead of PowerShell; confirms the same persistence by alternate tooling on the host
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: Sysmon registry-write view of the same HKCU Classes CLSID modification made by powershell.exe, giving the exact key and value set
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: Sibling HKCU Software Classes hijack (shell open command handlers); attackers often plant several user-hive hijacks together
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Attackers commonly stack Run-key persistence beside COM hijacking after a downloaded payload
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Redundant autorun persistence set alongside the COM hijack so removing one mechanism does not evict the attacker
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Precursor: the DLL pointed to by InprocServer32 is usually fetched by a PowerShell download cradle moments earlier'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: 'Follow-on: when the hijacked COM class is instantiated the planted DLL loads from a user-writable path into the host process'
  - id: f1edd233-30b5-4823-9e6a-c4171b24d316
    name: Rundll32 Registered COM Objects
    reason: 'Follow-on trigger: rundll32 can instantiate the hijacked CLSID on demand to execute the attacker DLL'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: InprocServer32 / TreatAs registry values set under CLSID
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Ll][Ss][Ii][Dd].*([Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32|[Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ee][Rr]32|[Tt][Rr][Ee][Aa][Tt][Aa][Ss]).*/
    pivot_on:
    - host
    window: 1h
  - name: DLL files dropped in user-writable paths (hijack payload staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]).*\.([Dd][Ll][Ll]|[Oo][Cc][Xx])/
    pivot_on:
    - host
    window: 1h
  - name: DLLs loaded from user-writable paths after the hijack
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]).*\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: Shells spawned by COM surrogate or rundll32/regsvr32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Dd][Ll][Ll][Hh][Oo][Ss][Tt]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Other script blocks writing HKCU Classes COM keys
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Tt][Rr][Ee][Aa][Tt][Aa][Ss]|[Ss][Cc][Rr][Ii][Pp][Tt][Ll][Ee][Tt][Uu][Rr][Ll]).*/
    pivot_on:
    - host
    window: 1h
