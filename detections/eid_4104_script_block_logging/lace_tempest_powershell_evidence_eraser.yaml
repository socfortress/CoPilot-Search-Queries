name: Lace Tempest PowerShell Evidence Eraser
id: b377ddab-502d-4519-9e8c-5590033d2d70
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b377ddab-502d-4519-9e8c-5590033d2d70
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a PowerShell script used by Lace Tempest APT to erase evidence from
  victim servers by exploiting CVE-2023-47246 as reported by SysAid Team. MITRE
  ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*cleanLL*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*usersfiles.war*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Remove-Item -Path \"$tomcat_dir*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*SysAidServer*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*sleep *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*while(1)*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*cleanLL*';
  data_win_eventdata_scriptBlockText matches '*usersfiles.war*';
  data_win_eventdata_scriptBlockText matches '*Remove-Item -Path "$tomcat_dir*',
  among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sysaid.com/blog/service-desk/on-premise-software-security-vulnerability-notification
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Lace Tempest PowerShell Evidence Eraser detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - tempest
    - powershell
    - evidence
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Nn][Ll][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Uu][Ss][Ee][Rr][Ss][Ff][Ii][Ll][Ee][Ss]\.[Ww][Aa][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm] -[Pp][Aa][Tt][Hh] \"\$[Tt][Oo][Mm][Cc][Aa][Tt]_[Dd][Ii][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Ll][Ee][Ee][Pp] .*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Hh][Ii][Ll][Ee]\(1\).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 60bfeac3-0d35-4302-8efb-1dd16f715bc6
    name: Suspicious SysAidServer Child
    reason: 'Precursor: CVE-2023-47246 exploitation makes the SysAid Tomcat process spawn shells/PowerShell; that child execution launches this eraser script'
  - id: 37dc5463-f7e3-4f61-ad76-ba59cd02a651
    name: Lace Tempest PowerShell Launcher
    reason: 'Same Lace Tempest SysAid chain: the PowerShell launcher script block runs just before the cleanup script erases the exploit traces'
  - id: 745ea50b-9673-4ba7-9426-cb45cf4a8e6d
    name: Lace Tempest Malware Loader Execution
    reason: 'Follow-on: after exploitation the actor runs the MeshAgent/GraceWire loader, and the eraser removes the webshell evidence behind it'
  - id: aa5b0a40-ed88-46aa-9fdc-0337b379ca9d
    name: Lace Tempest Cobalt Strike Download
    reason: 'Follow-on in the same campaign: PowerShell staging of Cobalt Strike for post-exploitation on the compromised SysAid server'
  - id: e94486ea-2650-4548-bf25-88cbd0bb32d7
    name: Lace Tempest File Indicators
    reason: 'Co-occurring: file artifacts the Lace Tempest chain drops (usersfiles.war, loader files) that the eraser then tries to remove'
  - id: 270185ff-5f50-4d6d-a27f-24c3b8c9fef8
    name: Tomcat WebServer Logs Deleted
    reason: 'Same anti-forensic goal: the eraser deletes Tomcat artifacts and logs on the SysAid server, so deleted Tomcat logs confirm cleanup'
  - id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
    name: Shell Process Spawned by Java.EXE
    reason: 'Precursor: Tomcat/Java spawning cmd or PowerShell is the webshell execution that preceded this script'
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: 'Co-occurring defense evasion: after removing app artifacts operators also clear Windows event logs to hide the intrusion'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Java/Tomcat (SysAid) spawning shells or PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]|.*[Tt][Oo][Mm][Cc][Aa][Tt].*/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Files created or dropped under SysAid/Tomcat webapps (war, jsp, exe, dll)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ss][Yy][Ss][Aa][Ii][Dd]|[Tt][Oo][Mm][Cc][Aa][Tt]).*\.([Ww][Aa][Rr]|[Jj][Ss][Pp]|[Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1)/
    pivot_on:
    - host
    window: 4h
  - name: Script blocks staging payloads or Cobalt Strike/MeshAgent loaders
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*VirtualAlloc* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*MeshAgent*)
    pivot_on:
    - host
    window: 2h
  - name: Deletion of Tomcat/SysAid files and Windows event logs
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND data_win_eventdata_targetFilename:/.*([Tt][Oo][Mm][Cc][Aa][Tt]|[Ss][Yy][Ss][Aa][Ii][Dd]|\.[Ee][Vv][Tt][Xx]|\.[Ww][Aa][Rr]).*/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from powershell or java on the SysAid host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Jj][Aa][Vv][Aa]|\\[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]?[^\\]*)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
