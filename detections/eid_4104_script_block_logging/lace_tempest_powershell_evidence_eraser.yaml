name: Lace Tempest PowerShell Evidence Eraser
id: b377ddab-502d-4519-9e8c-5590033d2d70
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b377ddab-502d-4519-9e8c-5590033d2d70
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a PowerShell script used by Lace Tempest APT to erase evidence from
  victim servers by exploiting CVE-2023-47246 as reported by SysAid Team. MITRE
  ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*cleanLL*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*usersfiles.war*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Remove-Item -Path \"$tomcat_dir*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*SysAidServer*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*sleep *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*while(1)*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*cleanLL*';
  data_win_eventdata_scriptBlockText matches '*usersfiles.war*';
  data_win_eventdata_scriptBlockText matches '*Remove-Item -Path "$tomcat_dir*',
  among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sysaid.com/blog/service-desk/on-premise-software-security-vulnerability-notification
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Lace Tempest PowerShell Evidence Eraser detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - tempest
    - powershell
    - evidence
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Nn][Ll][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Uu][Ss][Ee][Rr][Ss][Ff][Ii][Ll][Ee][Ss]\.[Ww][Aa][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm] -[Pp][Aa][Tt][Hh] \"\$[Tt][Oo][Mm][Cc][Aa][Tt]_[Dd][Ii][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Aa][Ii][Dd][Ss][Ee][Rr][Vv][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Ll][Ee][Ee][Pp] .*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Hh][Ii][Ll][Ee]\(1\).*/

