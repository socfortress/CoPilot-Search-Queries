graylog:
  query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*Invoke-DllInjection.*/ OR data_win_eventdata_commandLine:/.*Invoke-ReflectivePEInjection.*/ OR data_win_eventdata_commandLine:/.*Invoke-Shellcode.*/ OR data_win_eventdata_commandLine:/.*Invoke-WmiCommand.*/ OR data_win_eventdata_commandLine:/.*Add-Persistence.*/ OR data_win_eventdata_commandLine:/.*Install-SSP.*/ OR data_win_eventdata_commandLine:/.*Invoke-Mimikatz.*/ OR data_win_eventdata_commandLine:/.*Get-GPPPassword.*/ OR data_win_eventdata_commandLine:/.*Get-VaultCredential.*/ OR data_win_eventdata_commandLine:/.*Out-Minidump.*/ OR data_win_eventdata_commandLine:/.*Invoke-Kerberoast.*/ OR data_win_eventdata_commandLine:/.*sekurlsa::.*/ OR data_win_eventdata_commandLine:/.*lsadump::.*/ OR data_win_eventdata_commandLine:/.*Invoke-AmsiBypass.*/ OR data_win_eventdata_commandLine:/.*Invoke-PowerShellTcp.*/ OR data_win_eventdata_commandLine:/.*Add-Exfiltration.*/ OR data_win_eventdata_commandLine:/.*Invoke-SafetyKatz.*/ OR data_win_eventdata_commandLine:/.*Invoke-SharpBypassUAC.*/ OR data_win_eventdata_commandLine:/.*Invoke-SharpKatz.*/ OR data_win_eventdata_commandLine:/.*Invoke-SharpPrintNightmare.*/ OR data_win_eventdata_commandLine:/.*Invoke-SharpSploit.*/ OR data_win_eventdata_commandLine:/.*Invoke-SharpWSUS.*/ OR data_win_eventdata_commandLine:/.*Invoke-Snaffler.*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Invoke-DllInjection.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-ReflectivePEInjection.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Shellcode.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-WmiCommand.*/ OR data_win_eventdata_scriptBlockText:/.*Add-Persistence.*/ OR data_win_eventdata_scriptBlockText:/.*Install-SSP.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Mimikatz.*/ OR data_win_eventdata_scriptBlockText:/.*Get-GPPPassword.*/ OR data_win_eventdata_scriptBlockText:/.*Get-VaultCredential.*/ OR data_win_eventdata_scriptBlockText:/.*Out-Minidump.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Kerberoast.*/ OR data_win_eventdata_scriptBlockText:/.*sekurlsa::.*/ OR data_win_eventdata_scriptBlockText:/.*lsadump::.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-AmsiBypass.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-PowerShellTcp.*/ OR data_win_eventdata_scriptBlockText:/.*Add-Exfiltration.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-SafetyKatz.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-SharpBypassUAC.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-SharpKatz.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-SharpPrintNightmare.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-SharpSploit.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-SharpWSUS.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Snaffler.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: 'Co-occurring 4104 detection: Invoke-Mimikatz/sekurlsa:: strings in this rule''s lookup are the same in-memory credential theft, confirming the toolkit actually ran in a script block'
  - id: bc1dc6b8-c954-11eb-bade-acde48001122
    name: Detect Empire with PowerShell Script Block Logging
    reason: Same PowerSploit/Empire toolkit family; a second 4104 hit shows the framework stager/agent is running, not just a one-off string
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Follow-on or parallel: operator who loads Invoke-Mimikatz via PowerShell often also drops/runs mimikatz.exe for sekurlsa/lsadump'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Sysmon EID 10 LSASS access is the host-level effect of Invoke-Mimikatz, Out-Minidump and Invoke-SafetyKatz strings in this rule
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Alternative LSASS dump (rundll32 comsvcs MiniDump) used when Out-Minidump or Mimikatz is blocked after the PowerShell toolkit runs
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: 'Precursor: Invoke-AmsiBypass-style reflection patch is run first so the offensive PowerShell in this rule can load unblocked'
  - id: 56c217c3-2de2-479b-990f-5c109ba8458f
    name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
    reason: 'Follow-on persistence: Add-Persistence/Empire stagers commonly create a scheduled task to survive reboot'
  - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
    name: Detect SharpHound Command-Line Arguments
    reason: 'Common next stage after credential theft: AD reconnaissance (BloodHound/SharpHound) to plan lateral movement'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access or dump tooling after offensive PowerShell
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Download cradles, AMSI bypass and encoded loaders in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: Network connections from PowerShell (C2 or reverse shell)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Persistence or lateral movement spawned by PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*/)
    pivot_on:
    - host
    window: 4h
  - name: Credential and AD recon tool files dropped
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_targetFilename:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*_[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/)
    pivot_on:
    - host
    window: 4h
