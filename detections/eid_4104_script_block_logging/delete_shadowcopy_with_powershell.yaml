name: Delete ShadowCopy With PowerShell
id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of PowerShell to delete shadow copies via 
  the WMIC PowerShell module or WMI object manipulation. It leverages PowerShell 
  Script Block Logging (EventID 4104) and searches for specific keywords like 
  "ShadowCopy," "Delete," or "Remove" within the ScriptBlockText. This activity is 
  significant because deleting shadow copies is a common tactic used by ransomware, 
  such as DarkSide, DarkGate, and Cactus, to prevent data recovery and maximize 
  impact. If confirmed malicious, this action could lead to irreversible data loss 
  and hinder recovery efforts, significantly impacting business continuity and data 
  integrity.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*ShadowCopy*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Delete*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Remove*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting PowerShell Script 
  Block Logging (EventID 4104) from your Windows endpoints. Enable PowerShell 
  operational logs to be imported into the Wazuh index. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for PowerShell commands that interact with WMI objects to delete 
  shadow copies, which is a critical indicator of ransomware activity. Shadow copies 
  (Volume Shadow Copy Service snapshots) are crucial for system and data recovery.

known_false_positives: >
  No false positives have been identified at this time. Legitimate administrators 
  do not typically delete shadow copies via PowerShell. Any deletion of shadow copies 
  should be investigated immediately as it is a strong indicator of malicious activity 
  or ransomware infection.

references:
  - https://www.mandiant.com/resources/shining-a-light-on-darkside-ransomware-operations
  - https://www.techtarget.com/searchwindowsserver/tutorial/Set-up-PowerShell-script-block-logging-for-added-security
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    An attempt to delete ShadowCopy was performed using PowerShell on $agent_name$ 
    by user $data_win_eventdata_user$. Script: $data_win_eventdata_scriptBlockText$. 
    This is a strong indicator of ransomware activity. MITRE ATT&CK: T1490
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
    - field: data_win_eventdata_user
      type: user
      score: 90
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - DarkSide Ransomware
    - Ransomware
    - Revil Ransomware
    - DarkGate Malware
    - Cactus Ransomware
    - VanHelsing Ransomware
    - Data Destruction
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - shadowcopy
    - vss
    - ransomware
    - data_destruction
    - darkside
    - darkgate
    - cactus
    - wmi
    - volume_shadow_copy
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*ShadowCopy.*/ AND (data_win_eventdata_scriptBlockText:/.*Delete.*/ OR data_win_eventdata_scriptBlockText:/.*Remove.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware usually pairs the PowerShell/WMI shadow deletion with vssadmin/wmic/diskshadow in the same inhibit-recovery step; either confirms intent to destroy VSS snapshots.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Process-creation view of the same Win32_ShadowCopy delete; corroborates the script block with an actual powershell.exe command line and parent.
  - id: c1337eb8-921a-4b59-855b-4ba188ddcc42
    name: Deletion of Volume Shadow Copies via WMI with PowerShell - PS Script
    reason: Sibling 4104 detection of the Get-WmiObject Win32_Shadowcopy | Delete pattern; co-fires when the same script block matches both.
  - id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
    name: Windows Backup Deleted Via Wbadmin.EXE
    reason: Ransomware also removes Windows Server Backup archives right after shadow copies so no local restore point survives.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Disabling recovery/ignoring boot failures via bcdedit is the standard companion step to shadow copy deletion immediately before encryption.
  - id: db1c21e4-cd66-4b4e-85ca-590f0780529c
    name: Windows Recovery Environment Disabled Via Reagentc
    reason: Disabling WinRE is a further recovery-inhibition step in ransomware pre-encryption routines that follows shadow deletion.
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: wbadmin delete catalog (event log) is another recovery-destruction action executed in the same pre-encryption burst.
  - id: 9251299c-ea5b-11eb-a8de-acde48001122
    name: Detect Copy of ShadowCopy with Script Block Logging
    reason: Attacker may first copy NTDS/SAM from a shadow copy via PowerShell before destroying the snapshots; indicates theft preceding destruction.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other recovery-inhibition commands (vssadmin, wbadmin, bcdedit, reagentc, wmic shadowcopy)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy]).*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc].*\/[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Ransomware preparation: security tool and backup service stop/tamper'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Nn][Ee][Tt] [Ss][Tt][Oo][Pp]|[Ss][Cc]\.?[Ee]?[Xx]?[Ee]? [Ss][Tt][Oo][Pp]|[Ss][Cc]\.[Ee][Xx][Ee] [Cc][Oo][Nn][Ff][Ii][Gg]).*([Vv][Ss][Ss]|[Ss][Qq][Ll]|[Vv][Ee][Ee][Aa][Mm]|[Bb][Aa][Cc][Kk][Uu][Pp]|[Ss][Oo][Pp][Hh][Oo][Ss]|[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]|[Ss][Ee][Nn][Ss][Ee]).*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*\/[Ii][Mm].*([Ss][Qq][Ll]|[Oo][Ff][Ff][Ii][Cc][Ee]|[Vv][Ee][Ee][Aa][Mm]|[Ss][Ee][Rr][Vv][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Mass file rename/creation with ransom note or encrypted extensions
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Hh][Oo][Ww][_ -]?[Tt][Oo]|[Rr][Ee][Ss][Tt][Oo][Rr][Ee]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Rr][Aa][Nn][Ss][Oo][Mm]).*\.([Tt][Xx][Tt]|[Hh][Tt][Mm][Ll]?|[Hh][Tt][Aa])/ OR data_win_eventdata_targetFilename:/.*\.([Ll][Oo][Cc][Kk][Ee][Dd]|[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ee][Dd]|[Cc][Rr][Yy][Pp][Tt]|[Ll][Oo][Cc][Kk]|[Rr][Yy][Kk]|[Cc][Ii][Aa][Ll][Aa][Rr][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: 'Preceding PowerShell staging: download cradles, encoded commands, WMI/CIM abuse'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ww][Mm][Ii][Oo][Bb][Jj][Ee][Cc][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Ii][Mm][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Lateral movement / remote execution preceding encryption (PsExec, WMI, remote service)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Ss][Ee][Xx][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee] \\\\.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
