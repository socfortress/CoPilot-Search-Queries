name: Windows Root Domain linked policies Discovery
id: 80ffaede-1f12-49d5-a86e-b4b599b68b3c
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects the use of the `[Adsisearcher]` type accelerator in 
  PowerShell to query Active Directory for root domain linked policies. It leverages 
  PowerShell Script Block Logging (EventCode=4104) to identify this activity. This 
  behavior is significant as it may indicate an attempt by adversaries or Red Teams 
  to gain situational awareness and perform Active Directory Discovery. If confirmed 
  malicious, this activity could allow attackers to map out domain policies, 
  potentially aiding in further exploitation or lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*[adsisearcher]*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*SearchRoot*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*gplink*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of [adsisearcher] type accelerator with SearchRoot and gplink properties 
  to enumerate root domain linked Group Policy Objects. Validate that 
  data_win_eventdata_scriptBlockText field is being populated in Elasticsearch/Wazuh 
  Indexer.

known_false_positives: >
  Administrators or power users may use this command for legitimate troubleshooting 
  and Active Directory management purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/
  - https://medium.com/@pentesttas/discover-hidden-gpo-s-on-active-directory-using-ps-adsi-a284b6814c81

response:
  message: >
    ADSI searcher root domain policy discovery detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is enumerating root domain linked policies for situational awareness 
    and Active Directory discovery. MITRE ATT&CK: T1087.002
  risk_score: 20
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 20
    - field: data_win_eventdata_user
      type: user
      score: 20
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Data Destruction
    - Active Directory Discovery
    - Industroyer2
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - adsisearcher
    - adsi
    - root_domain
    - gpo_discovery
    - group_policy_objects
    - active_directory_discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\[adsisearcher\].*/ AND data_win_eventdata_scriptBlockText:/.*SearchRoot.*/ AND data_win_eventdata_scriptBlockText:/.*gplink.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 510ea428-4731-4d2f-8829-a28293e427aa
    name: Windows Linked Policies In ADSI Discovery
    reason: Sibling gPLink enumeration via ADSI on the same host; repeated GPO-link mapping by the same actor confirms deliberate GPO reconnaissance
  - id: 70803451-0047-4e12-9d63-77fa7eb8649c
    name: Remote System Discovery with Adsisearcher
    reason: Same [adsisearcher] tooling used to enumerate domain computers; typical companion step when mapping targets after learning which GPOs reach them
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Same operator commonly enumerates privileged groups with Adsisearcher in the same AD discovery session
  - id: de7fcadc-04f3-11ec-a241-acde48001122
    name: AdsiSearcher Account Discovery
    reason: Adsisearcher user enumeration in the same script/session widens GPO discovery into full AD situational awareness
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-DomainGPO/Get-DomainOU style PowerView calls are the toolkit equivalent of this manual gplink query, indicating an offensive AD framework
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: Trust discovery is a usual neighbouring AD recon step performed alongside policy mapping before lateral or cross-domain movement
  - id: b7216a7d-687e-4c8d-82b1-3080b2ad961f
    name: Modify Group Policy Settings - ScriptBlockLogging
    reason: 'Follow-on: after learning which policies are linked at the domain root, attacker edits GPOs (Industroyer2/wiper-style mass deployment or defense weakening)'
  - id: a8f29a7b-b137-4446-80a0-b804272f3da2
    name: Persistence and Execution at Scale via GPO Scheduled Task
    reason: 'Follow-on impact: linked-policy knowledge is used to push a malicious GPO scheduled task domain-wide for execution at scale'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other ADSI/LDAP directory queries in script blocks (accounts, groups, computers, OUs)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Gg][Pp][Oo].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Gg][Pp][Oo][Rr][Ee][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Gg][Pp][Ii][Nn][Hh][Ee][Rr][Ii][Tt][Aa][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Dd][Aa][Pp]:\/\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: GPO modification or SYSVOL/GPO folder access by process
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*[Gg][Pp][Rr][Ee][Ss][Uu][Ll][Tt]* OR data_win_eventdata_commandLine:*[Ss][Yy][Ss][Vv][Oo][Ll]* OR data_win_eventdata_commandLine:*[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]* OR data_win_eventdata_image:*[Gg][Pp][Mm][Ee]*)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:*[Ss][Yy][Ss][Vv][Oo][Ll]*[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]*)
    pivot_on:
    - host
    window: 4h
  - name: Domain controller, trust and domain-admin discovery commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*[Nn][Ll][Tt][Ee][Ss][Tt]* OR data_win_eventdata_commandLine:*[Dd][Ss][Qq][Uu][Ee][Rr][Yy]* OR data_win_eventdata_commandLine:*[Dd][Oo][Mm][Aa][Ii][Nn][_ ]*[Aa][Dd][Mm][Ii][Nn][Ss]* OR data_win_eventdata_commandLine:*[Nn][Ee][Tt]*[Gg][Rr][Oo][Uu][Pp]*[/]*[Dd][Oo][Mm][Aa][Ii][Nn]* OR data_win_eventdata_image:*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]* OR data_win_eventdata_image:*[Aa][Dd][Ff][Ii][Nn][Dd]*)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Network connections to LDAP/GC/SMB ports from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"3269" OR data_win_eventdata_destinationPort:"445")
    pivot_on:
    - host
    window: 2h
  - name: 'Wiper/impact precursors: shadow copy deletion, GPO-pushed tasks, service stop'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]*[Dd][Ee][Ll][Ee][Tt][Ee]* OR data_win_eventdata_commandLine:*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]*[/][Cc][Rr][Ee][Aa][Tt][Ee]* OR data_win_eventdata_commandLine:*[Bb][Cc][Dd][Ee][Dd][Ii][Tt]*)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ew][Ww]-[Gg][Pp][Ll][Ii][Nn][Kk].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Gg][Pp][Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy][Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/))
    pivot_on:
    - host
    window: 4h
