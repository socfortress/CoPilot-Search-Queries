name: Suspicious New-PSDrive to Admin Share
id: 1c563233-030e-4a07-af8c-ee0490a66d3a
version: 1
schema_version: "1.0"
date: "2022-08-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1c563233-030e-4a07-af8c-ee0490a66d3a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may use to interact with a remote network share using Server
  Message Block (SMB). The adversary may then perform actions as the logged-on
  user. MITRE ATT&CK: T1021.002.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-PSDrive*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-psprovider *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*filesystem*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-root *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText: "*\\\\\\\\*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*$*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-PSDrive*';
  data_win_eventdata_scriptBlockText matches '*-psprovider *';
  data_win_eventdata_scriptBlockText matches '*filesystem*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.002/T1021.002.md#atomic-test-2---map-admin-share-powershell
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/new-psdrive?view=powershell-7.2
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Suspicious New-PSDrive to Admin Share detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1021.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - psdrive
    - admin
    - share
    - powershell
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Pp][Ss][Dd][Rr][Ii][Vv][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*-[Pp][Ss][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr] .*/ AND data_win_eventdata_scriptBlockText:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Ss][Tt][Ee][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*-[Rr][Oo][Oo][Tt] .*/ AND data_win_eventdata_scriptBlockText:/.*\\\\.*/ AND data_win_eventdata_scriptBlockText:/.*\$.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a44c0be1-d7ab-41e4-92fd-aa9af4fe232c
    name: Windows File Share Discovery With Powerview
    reason: Share enumeration (Find-DomainShare/Invoke-ShareFinder) is the typical precursor to mapping a discovered C$/ADMIN$ share with New-PSDrive.
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: Same admin-share mount achieved with net use instead of New-PSDrive; attackers switch between the two on the same host.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Once the admin share is mapped, payloads or tools are copied to/from it; this is the staging step that follows the mount.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Admin share access (ADMIN$) is the prerequisite for PsExec service deployment; remote execution commonly follows the share mapping.
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Scripted PowerShell lateral movement often pairs the share mapping with Invoke-Command to run the copied payload on the target.
  - id: 2a048c14-4634-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via WMI and PowerShell Script Block
    reason: WMI Win32_Process.Create is a common way to execute the file just placed on the remote admin share, in the same script-block telemetry.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Remote service creation (sc/smbexec style) executes the payload dropped via the admin share, completing the lateral-movement chain.
  - id: 66a4d409-451b-4151-94f4-a55d559c49b0
    name: PowerShell Deleted Mounted Share
    reason: Removing the mapped PSDrive/share afterwards is attacker cleanup of the same mount, bookending the lateral-movement activity.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other share mapping or admin-share access in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn]et [Uu]se.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Mm][Bb][Mm][Aa][Pp][Pp][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]opy-[Ii]tem.*\\\\.*/ OR data_win_eventdata_scriptBlockText:/.*\\\\[^ ]+\\([Cc]|[Aa][Dd][Mm][Ii][Nn])\$.*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote execution tooling and commands launched after share mapping
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]6?4?|[Pp][Aa][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\\\\.*[Cc]reate.*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ss] .*/))
    pivot_on:
    - host
    window: 2h
  - name: Outbound SMB connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Executable or script files written to a remote share by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss])/
    pivot_on:
    - host
    window: 1h
  - name: Logons and explicit credential use around share access
    query: (data_win_system_eventID:"4648") OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9"))
    pivot_on:
    - host
    - user
    window: 1h
