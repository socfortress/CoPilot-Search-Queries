name: Get ADDefaultDomainPasswordPolicy with Powershell Script Block
id: 1ff7ccc8-065a-11ec-91e4-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-ADDefaultDomainPasswordPolicy` 
  PowerShell cmdlet, which is used to retrieve the password policy in a Windows domain. 
  This detection leverages PowerShell Script Block Logging (EventID 4104) to identify 
  the specific command execution. Monitoring this activity is significant as it can 
  indicate an attempt to gather domain policy information, which is often a precursor 
  to further malicious actions. If confirmed malicious, this activity could allow an 
  attacker to understand password policies, aiding in password attacks, credential 
  enumeration, or further domain reconnaissance.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-ADDefaultDomainPasswordPolicy*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-ADDefaultDomainPasswordPolicy cmdlet, which retrieves 
  the default password policy for the Active Directory domain including password 
  complexity requirements, lockout thresholds, and password expiration settings. 
  Attackers use this information to understand domain password policies and craft 
  more effective password attacks.

known_false_positives: >
  Administrators or power users may use this command for legitimate troubleshooting 
  and system administration purposes. Filter based on user context and whether the 
  action was expected and authorized within your organization.

references:
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet
  - https://attack.mitre.org/techniques/T1201/
  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/get-addefaultdomainpasswordpolicy?view=windowsserver2019-ps

response:
  message: >
    Get-ADDefaultDomainPasswordPolicy execution detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script: $data_win_eventdata_scriptBlockText$. 
    This indicates password policy enumeration/reconnaissance activity. 
    MITRE ATT&CK: T1201
  risk_score: 45
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 45
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Password Policy Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1201
  custom_tags:
    - get_addefaultdomainpasswordpolicy
    - active_directory
    - password_policy
    - policy_discovery
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-ADDefaultDomainPasswordPolicy.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 737e1eb0-065a-11ec-921a-acde48001122
    name: Get ADUserResultantPasswordPolicy with Powershell Script Block
    reason: Fine-grained password policy (PSO) lookup is the usual companion to the default domain policy query; together they give the attacker the exact lockout/complexity thresholds for password spraying.
  - id: a360d2b2-065a-11ec-b0bf-acde48001122
    name: Get DomainPolicy with PowerShell Script Block
    reason: PowerView's Get-DomainPolicy returns the same lockout/password settings via a different tool; seeing both means a PowerView-style recon session is under way.
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: ADRecon dumps password policy among its full AD inventory; a policy query may be a hand-run slice of the same recon, or the policy query may itself have come from ADRecon.
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: The password policy cmdlet comes from the ActiveDirectory module; AD-module enumeration in the same session shows the same operator mapping the domain.
  - id: 21432e40-04f4-11ec-b7e6-acde48001122
    name: Get ADUser with PowerShell Script Block
    reason: Policy lookup is typically followed by user enumeration to build the spray target list that the thresholds are tuned for.
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: PowerView user enumeration right after learning the lockout threshold is the classic prelude to a password spray.
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: Searching for accounts without Kerberos pre-auth is the next credential-access recon step after policy discovery (AS-REP roasting candidates).
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: Rubeus (spray/asktgt/kerberoast) is the likely follow-on credential attack once policy and user lists are known.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD enumeration cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(Get-ADUser|Get-ADGroup|Get-ADComputer|Get-ADDomain|Get-ADForest|Get-ADTrust|Get-DomainUser|Get-DomainGroup|Get-DomainController|Get-NetUser|Get-NetDomain|Invoke-ADRecon|Invoke-BloodHound|DirectorySearcher|adsisearcher).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Password spray / Kerberos credential attack tooling in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Ii]nvoke-[Dd]omain[Ss]pray|DomainPasswordSpray|[Ii]nvoke-[Ss]pray|[Ii]nvoke-[Kk]erberoast|[Rr]ubeus|[Aa]sk[Tt][Gg][Tt]|[Ii]nvoke-[Mm]imikatz|[Ss]et-[Cc]redential|ValidateCredentials|PrincipalContext).*/)
    pivot_on:
    - host
    - user
    window: 6h
  - name: Network password-policy / domain recon commands from process creation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn]et(1)?(\.exe)? +accounts|[Nn]et(1)?(\.exe)? +(user|group) .*\/domain|[Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Ee][Tt][Ss][Pp]).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Failed logons to many accounts (spray pattern) following recon
    query: (data_win_system_eventID:"4625" OR data_win_system_eventID:"4771" OR data_win_system_eventID:"4776" OR data_win_system_eventID:"4740")
    pivot_on:
    - ip
    - user
    window: 4h
  - name: PowerShell spawned via encoded or download-cradle command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*(-[Ee][Nn][Cc]|-[Ee]ncodedcommand|[Dd]ownload[Ss]tring|[Ii][Ee][Xx]|[Ii]nvoke-[Ww]eb[Rr]equest|-[Ww]indow[Ss]tyle +[Hh]idden).*/)
    pivot_on:
    - host
    window: 1h
