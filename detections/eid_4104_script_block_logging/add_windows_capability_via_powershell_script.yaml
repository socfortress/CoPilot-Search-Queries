name: Add Windows Capability Via PowerShell Script
id: 155c7fd5-47b4-49b2-bbeb-eb4fab335429
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 155c7fd5-47b4-49b2-bbeb-eb4fab335429
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Add-WindowsCapability" cmdlet to add Windows
  capabilities. Notable capabilities could be "OpenSSH" and others.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Add-WindowsCapability *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Name OpenSSH.*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Add-WindowsCapability *';
  data_win_eventdata_scriptBlockText matches '*-Name OpenSSH.*'.

known_false_positives: >
  Legitimate usage of the capabilities by administrators or users. Add
  additional filters accordingly. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_install_firstuse?tabs=powershell
  - https://www.virustotal.com/gui/file/af1c82237b6e5a3a7cdbad82cc498d298c67845d92971bada450023d1335e267/content

response:
  message: >
    Add Windows Capability Via PowerShell Script detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - capability
    - powershell
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Cc][Aa][Pp][Aa][Bb][Ii][Ll][Ii][Tt][Yy] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Nn][Aa][Mm][Ee] [Oo][Pp][Ee][Nn][Ss][Ss][Hh]\..*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b36d01a3-ddaf-4804-be18-18a6247adfcd
    name: Add Windows Capability Via PowerShell Cmdlet
    reason: Same Add-WindowsCapability OpenSSH install seen from process creation (command line) instead of script block; confirms the 4104 block actually launched from a powershell process.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: After installing OpenSSH server an attacker opens inbound TCP/22 on the host firewall so sshd is reachable.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: 'Alternative to a targeted rule: disabling the firewall entirely to expose the newly installed sshd.'
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Attackers pair a new SSH service with netsh portproxy to pivot traffic through the host.
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: 'Persistence follow-on: scheduled task launching ssh.exe reverse tunnels once OpenSSH is present.'
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: Newly available ssh.exe used for -L/-R/-D forwarding, the typical purpose of installing OpenSSH on a compromised box.
  - id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
    name: Program Executed Using Proxy/Local Command Via SSH.EXE
    reason: ssh.exe abused for ProxyCommand/LocalCommand execution after the OpenSSH capability is added.
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: Installed OpenSSH client used to tunnel RDP, bypassing network controls.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sshd service/server components started or SSH inbound on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Ss][Hh][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ss][Hh]-[Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss][Tt][Aa][Rr][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]).*[Ss][Ss][Hh][Dd].*/)
    pivot_on:
    - host
    window: 4h
  - name: Firewall rule opening port 22 or disabling firewall after OpenSSH install
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt][Ss][Hh]|[Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee]|[Ss][Ee][Tt]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]).*([Ll][Oo][Cc][Aa][Ll][Pp][Oo][Rr][Tt][ =:]*22|[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy]|[Ss][Tt][Aa][Tt][Ee]=[Oo][Ff][Ff]|[Ss][Ss][Hh]).*/
    pivot_on:
    - host
    window: 4h
  - name: Network connections by ssh.exe or sshd.exe on this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ss][Hh][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Account creation or authorized_keys / sshd_config writes following SSH enablement
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? [Uu][Ss][Ee][Rr].*[/][Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Ss][Ss][Hh][Dd]_[Cc][Oo][Nn][Ff][Ii][Gg].*/))
    pivot_on:
    - host
    window: 6h
  - name: Remote download or encoded PowerShell script blocks alongside the capability install
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*[Ss][Ss][Hh][Dd].*/)
    pivot_on:
    - host
    window: 2h
