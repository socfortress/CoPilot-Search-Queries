name: Suspicious PowerShell Mailbox Export to Share - PS
id: 4a241dea-235b-4a7e-8d76-50d817b146c4
version: 1
schema_version: "1.0"
date: "2022-10-26"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4a241dea-235b-4a7e-8d76-50d817b146c4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the powerShell New-MailboxExportRequest Cmdlet to exports a
  mailbox to a remote or local share, as used in ProxyShell exploitations.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-MailboxExportRequest*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "* -Mailbox *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "* -FilePath \\\\\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-MailboxExportRequest*';
  data_win_eventdata_scriptBlockText matches '* -Mailbox *';
  data_win_eventdata_scriptBlockText matches '* -FilePath \\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://youtu.be/5mqid-7zp8k?t=2481
  - https://blog.orange.tw/2021/08/proxylogon-a-new-attack-surface-on-ms-exchange-part-1.html
  - https://peterjson.medium.com/reproducing-the-proxyshell-pwn2own-exploit-49743a4ea9a1
  - https://m365internals.com/2022/10/07/hunting-in-on-premises-exchange-server-logs/

response:
  message: >
    Suspicious PowerShell Mailbox Export to Share - PS detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - powershell
    - mailbox
    - export
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ee][Xx][Pp][Oo][Rr][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ AND data_win_eventdata_scriptBlockText:/.* -[Mm][Aa][Ii][Ll][Bb][Oo][Xx] .*/ AND data_win_eventdata_scriptBlockText:/.* -[Ff][Ii][Ll][Ee][Pp][Aa][Tt][Hh] \\\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 889719ef-dd62-43df-86c3-768fb08dc7c0
    name: Suspicious PowerShell Mailbox Export to Share
    reason: Same New-MailboxExportRequest -FilePath UNC behaviour seen from process creation; confirms the script block actually executed via powershell/EMS rather than being logged only.
  - id: 2d10095e-05ae-11ec-8fdf-acde48001122
    name: Exchange PowerShell Module Usage
    reason: Attackers chain New-ManagementRoleAssignment (grant Mailbox Import Export role), New-MailboxSearch and Search-Mailbox around the export; precursor role grant is required before New-MailboxExportRequest works.
  - id: 25676e10-2121-446e-80a4-71ff8506af47
    name: Exchange PowerShell Snap-Ins Usage
    reason: Loading Microsoft.Exchange.Management.PowerShell snap-in from a non-EMS shell on the Exchange server is the usual way ProxyShell operators get the export cmdlet.
  - id: 7280c9f3-a5af-45d0-916a-bc01cb4151c9
    name: Suspicious MSExchangeMailboxReplication ASPX Write
    reason: 'ProxyShell''s export-to-.aspx trick: the PST export is written by MSExchangeMailboxReplication as a webshell in a web-accessible path.'
  - id: bd1212e5-78da-431e-95fa-c58e3237a8e6
    name: Suspicious ASPX File Drop by Exchange
    reason: Webshell dropped on the Exchange server by Exchange processes is the persistence/foothold that preceded or followed the mailbox export.
  - id: 6b269392-9eba-40b5-acb6-55c882b20ba6
    name: Suspicious File Drop by Exchange
    reason: Exchange worker processes writing scripts/executables corroborates the ProxyShell exploitation that led to the privileged export cmdlet.
  - id: a55349d8-9588-4c5a-8e3b-1925fe2a4ffe
    name: Exchange PowerShell Cmdlet History Deleted
    reason: Operators delete the Exchange cmdlet history file after running export/role cmdlets to hide the activity; follow-on anti-forensics.
  - id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
    name: HAFNIUM Exchange Exploitation Activity
    reason: Hidden aspx webshell attrib and Exchange post-exploitation process patterns that co-occur with mailbox theft on a compromised Exchange server.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Exchange role grant / mailbox search cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt][Rr][Oo][Ll][Ee][Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Aa][Rr][Cc][Hh]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ss][Ee][Aa][Rr][Cc][Hh].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Aa][Ii][Ll][Bb][Oo][Xx] [Ii][Mm][Pp][Oo][Rr][Tt] [Ee][Xx][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Pp][Ss][Ss][Nn][Aa][Pp][Ii][Nn].*[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: ASPX / script files written under Exchange web paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ii][Nn][Ee][Tt][Pp][Uu][Bb]|[Ff][Rr][Oo][Nn][Tt][Ee][Nn][Dd]|[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee] [Ss][Ee][Rr][Vv][Ee][Rr]).*\.([Aa][Ss][Pp][Xx]|[Aa][Ss][Pp]|[Aa][Ss][Hh][Xx]|[Pp][Ss]1|[Bb][Aa][Tt]|[Ee][Xx][Ee]|[Dd][Ll][Ll])/
    pivot_on:
    - host
    window: 4h
  - name: w3wp / Exchange worker spawning shells or recon tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ww]3[Ww][Pp]|[Uu][Mm][Ww][Oo][Rr][Kk][Ee][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss]|[Mm][Ss][Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee][Mm][Aa][Ii][Ll][Bb][Oo][Xx][Rr][Ee][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]).*\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]1?|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Cc][Uu][Rr][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Exported PST / archive files created or staged
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ss][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]/ OR data_win_eventdata_targetFilename:/.*\.7[Zz]/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Aa][Rr]/)
    pivot_on:
    - host
    window: 6h
  - name: Exchange cmdlet history / log tampering after export
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND (data_win_eventdata_targetFilename:/.*[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Hh][Oo][Ss][Tt]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee].*[Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/ OR data_win_eventdata_targetFilename:/.*[Ii][Ii][Ss].*[Ll][Oo][Gg][Ff][Ii][Ll][Ee][Ss].*/)
    pivot_on:
    - host
    window: 4h
