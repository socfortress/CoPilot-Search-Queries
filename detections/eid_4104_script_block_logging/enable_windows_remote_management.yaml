name: Enable Windows Remote Management
id: 991a9744-f2f0-44f2-bd33-9092eba17dc3
version: 1
schema_version: "1.0"
date: "2022-01-07"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 991a9744-f2f0-44f2-bd33-9092eba17dc3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may use Valid Accounts to interact with remote systems using
  Windows Remote Management (WinRM). The adversary may then perform actions as
  the logged-on user. MITRE ATT&CK: T1021.006.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Enable-PSRemoting *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Enable-PSRemoting *'.

known_false_positives: >
  Legitimate script. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.006/T1021.006.md#atomic-test-1---enable-windows-remote-management
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/enable-psremoting?view=powershell-7.2
  - https://attack.mitre.org/techniques/T1021/006/

response:
  message: >
    Enable Windows Remote Management detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1021.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.006
  custom_tags:
    - enable
    - management
    - powershell
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Pp][Ss][Rr][Ee][Mm][Oo][Tt][Ii][Nn][Gg] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-powershell-enable-powershell-remoting-001
    name: Windows PowerShell Enable PowerShell Remoting
    reason: Sibling detection of the same Enable-PSRemoting action via a different match; co-fires and corroborates that WinRM listeners were configured.
  - id: a5d85486-b89c-11eb-8267-acde48001122
    name: Allow Inbound Traffic In Firewall Rule
    reason: Enable-PSRemoting opens WinRM 5985/5986 in the firewall; an inbound allow rule from script blocks is the paired exposure step.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Attackers enabling WinRM for remote access often also add netsh inbound rules to ensure 5985/5986 reachability.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Firewall disabling accompanies WinRM enablement to make the host remotely reachable and evade host controls.
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: Once WinRM is enabled, inbound remote sessions appear as wsmprovhost.exe on this host; confirms the listener was used.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Direct follow-on: commands executed by a remote operator through the newly enabled WinRM service.'
  - id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
    name: Potential Lateral Movement via Windows Remote Shell
    reason: WinRM remote shell (winrshost) execution is the lateral-movement payoff of enabling remote management.
  - id: 9fe55ea2-4cd6-4491-8a54-dd6871651b51
    name: HackTool - Evil-WinRm Execution - PowerShell Module
    reason: Evil-WinRM is the common offensive client attackers use against a freshly enabled WinRM endpoint.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WinRM trusted hosts / listener / auth config changes in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww][Ss][Mm][Aa][Nn]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Hh][Oo][Ss][Tt][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ww][Ss][Mm][Aa][Nn][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Rr][Mm] .*[Qq][Uu][Ii][Cc][Kk][Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Kk][Ii][Pp][Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Ff][Ii][Ll][Ee][Cc][Hh][Ee][Cc][Kk].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Ll][Ll][Oo][Ww][Uu][Nn][Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ee][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Firewall opened for WinRM ports 5985/5986
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]).*(5985|5986).*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee]|[Ee][Nn][Aa][Bb][Ll][Ee]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee]).*(5985|5986|[Ww][Ii][Nn][Rr][Mm]).*/)
    pivot_on:
    - host
    window: 1h
  - name: WinRM service config and winrm.cmd / wsmprovhost activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Mm](\.[Cc][Mm][Dd]|\.[Vv][Bb][Ss])? .*([Qq][Uu][Ii][Cc][Kk][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Ee][Tt] [Ww][Ii][Nn][Rr][Mm]|[Ee][Nn][Uu][Mm][Ee][Rr][Aa][Tt][Ee]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Inbound connections to WinRM ports 5985/5986
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986") AND data_win_eventdata_initiated:"false"
    pivot_on:
    - host
    - ip
    window: 4h
  - name: Remote logons and added privileges after WinRM enablement
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:/.*\$/) OR (data_win_system_eventID:"4732" AND data_win_eventdata_targetUserName:/.*([Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]|[Rr][Ee][Mm][Oo][Tt][Ee] [Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt]).*/)
    pivot_on:
    - host
    - user
    window: 4h
