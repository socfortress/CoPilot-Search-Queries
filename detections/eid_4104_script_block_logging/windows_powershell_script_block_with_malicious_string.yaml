name: Windows PowerShell Script Block With Malicious String
id: 0f09cedd-10f1-4b9f-bdea-7a8b06ea575d
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution of known offensive PowerShell toolkit functions and commands
  via Script Block Logging. Covers well-known tools used for credential theft,
  lateral movement, and persistence including PowerSploit, PowerShell Empire,
  and PowerSharpPack. This is a simplified version of the original Splunk detection
  which used a lookup table of malicious strings — key offensive toolkit functions
  are hardcoded as detection patterns.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-Mimikatz*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-BloodHound*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-Kerberoast*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-DCSync*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-GPPPassword*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*PowerSploit*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-PowerDump*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-WCMDump*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-NinjaCopy*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-TokenManipulation*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-TimedScreenshot*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-CredentialInjection*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-DllInjection*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-ReflectivePEInjection*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Invoke-Shellcode*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*PowerShellEmpire*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*PowerSharpPack*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Possible usage by internal red team or authorized penetration testing.
  Some PowerShell commands may have overlap with legitimate tools.
  Filter known authorized red team activity as needed.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://github.com/PowerShellMafia/PowerSploit
  - https://github.com/PowerShellEmpire/
  - https://github.com/S3cur3Th1sSh1t/PowerSharpPack

response:
  message: >
    Known malicious PowerShell string detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Malicious PowerShell
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powersploit
    - empire
    - mimikatz
    - kerberoast
    - bloodhound
    - offensive_toolkit
    - credential_theft
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Invoke-Mimikatz.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-BloodHound.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Kerberoast.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-DCSync.*/ OR data_win_eventdata_scriptBlockText:/.*Get-GPPPassword.*/ OR data_win_eventdata_scriptBlockText:/.*PowerSploit.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-PowerDump.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-WCMDump.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-NinjaCopy.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-TokenManipulation.*/ OR data_win_eventdata_scriptBlockText:/.*Get-TimedScreenshot.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-CredentialInjection.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Mimikatz-in-PowerShell variant covering the same credential-theft toolkit; a second script block confirms in-memory credential dumping, not just a string mention
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: Invoke-Kerberoast/DCSync-style toolkit use is typically followed by SPN ticket requests from the same host to crack service account hashes
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: PowerSploit's PowerView Get-DomainSPNTicket is the Kerberoasting step of the same toolkit family
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Offensive toolkits are loaded after an AMSI bypass; this is the usual precursor in the same session
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Toolkits like PowerSploit/Empire are normally pulled via a download cradle just before their functions are invoked
  - id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
    name: Tamper Windows Defender - ScriptBlockLogging
    reason: Defender disabling often precedes or accompanies dropping offensive tooling
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Invoke-Mimikatz/PowerDump/Shellcode execution produces LSASS process access on the same host
  - id: 0f017df3-8f5a-414f-ad6b-24aff1128278
    name: Suspicious Eventlog Clear
    reason: Attackers clear logs after credential theft to hide script block evidence
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access (credential dumping) on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Kerberoasting / DCSync / AD recon script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss][Rr][Ee][Qq][Uu][Ee][Ss][Tt][Oo][Rr][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Rr][Ss][Uu][Aa][Pp][Ii].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ss][Hh][Aa][Rr][Ee][Ff][Ii][Nn][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download cradles, AMSI bypass and reflective loading before the toolkit
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt].[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn].[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Pp][Rr][Oo][Cc][Aa][Dd][Dd][Rr][Ee][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from PowerShell on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|\[Pp][Ww][Ss][Hh].[Ee][Xx][Ee])//
    pivot_on:
    - host
    window: 1h
  - name: Lateral movement or persistence spawned after toolkit use
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\[Pp][Ss][Ee][Xx][Ee][Cc].[Ee][Xx][Ee]|\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].[Ee][Xx][Ee]|\[Ww][Mm][Ii][Cc].[Ee][Xx][Ee]|\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].[Ee][Xx][Ee]|\[Ss][Cc].[Ee][Xx][Ee]|\[Rr][Ee][Gg].[Ee][Xx][Ee]|\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].[Ee][Xx][Ee])//
    pivot_on:
    - host
    window: 4h
