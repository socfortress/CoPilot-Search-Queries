name: Windows Forest Discovery with GetForestDomain
id: a14803b2-4bd9-4c08-8b57-c37980edebe8
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-ForestDomain` cmdlet, a component of the
  PowerView toolkit used for Windows domain enumeration. It leverages PowerShell Script Block Logging
  (EventCode=4104) to identify this activity. Detecting `Get-ForestDomain` is significant because
  adversaries and Red Teams use it to gather detailed information about Active Directory forest and
  domain configurations. If confirmed malicious, this activity could enable attackers to understand
  the domain structure, facilitating lateral movement or privilege escalation within the environment.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-ForestDomain*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_user
    - agent_name
    - data_win_eventdata_processId

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting PowerShell Script Block Logging
  events from your endpoints. PowerShell EventID 4104 captures script block execution. Ensure that
  PowerShell Script Block Logging is enabled on monitored endpoints and that these logs are properly
  ingested into Elasticsearch with complete script block text information. The detection specifically
  looks for the execution of the `Get-ForestDomain` cmdlet, which is part of the PowerView toolkit
  used for Active Directory reconnaissance and enumeration. This activity is typically indicative of
  adversaries or Red Teams performing domain discovery and lateral movement planning.

known_false_positives: >
  Administrators may leverage PowerSploit/PowerView tools for legitimate reasons, such as automated
  domain audits or authorized penetration testing. Filter as needed based on your organization's
  legitimate use of these tools. However, Get-ForestDomain execution outside of authorized security
  testing should be investigated immediately.

references:
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-ForestDomain/
  - https://attack.mitre.org/techniques/T1087/002/
  - https://book.hacktricks.xyz/windows-hardening/basic-powershell-for-pentesters/powerview

response:
  message: >
    Suspicious PowerShell Get-ForestDomain cmdlet was identified on endpoint $agent_name$
    by user $data_win_eventdata_user$. ScriptBlockText: $data_win_eventdata_scriptBlockText$.
    This activity is indicative of Active Directory forest enumeration, commonly used for lateral movement
    and privilege escalation planning.
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
    - field: data_win_eventdata_user
      type: user
      score: 70
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Domain Enumeration
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - powerview
    - get_forestdomain
    - domain_discovery
    - ad_enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-ForestDomain.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-ForestDomain is a PowerView cmdlet; the same PowerView module is almost always used for other cmdlets in the same session, confirming the tool is loaded rather than a one-off call
  - id: 70fac80e-0bf1-11ec-9ba0-acde48001122
    name: Get-ForestTrust with PowerShell Script Block
    reason: Forest enumeration is followed by mapping trust relationships between forests to find cross-forest paths
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: After listing the forest's domains the operator enumerates trusts between those domains to plan lateral movement
  - id: 676b600a-a94d-4951-b346-11329431e6c1
    name: Get-DomainController with PowerShell Script Block
    reason: 'Natural next step: identify the domain controllers of the domains just discovered as targets for LDAP, Kerberos and DCSync'
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Once the domain layout is known PowerView sessions move on to user enumeration to select accounts to target
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Privileged group enumeration (Domain/Enterprise Admins) is the typical follow-on in a PowerView recon sequence to identify escalation targets
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: SPN discovery after domain mapping signals preparation for Kerberoasting of service accounts
  - id: 86dc8176-6e6c-42d6-9684-5444c6557ab3
    name: Windows PowerView Constrained Delegation Discovery
    reason: Delegation hunting is a later-stage PowerView step that turns domain knowledge into a concrete privilege-escalation path
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / AD recon cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-Domain* OR data_win_eventdata_scriptBlockText:*Get-Net* OR data_win_eventdata_scriptBlockText:*Find-DomainShare* OR data_win_eventdata_scriptBlockText:*Invoke-ShareFinder* OR data_win_eventdata_scriptBlockText:*Get-ForestGlobalCatalog* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*Get-ObjectAcl* OR data_win_eventdata_scriptBlockText:*Invoke-UserHunter*)
    pivot_on:
    - host
    window: 2h
  - name: PowerView / PowerSploit module loading or download cradle
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*PowerView* OR data_win_eventdata_scriptBlockText:*PowerSploit* OR data_win_eventdata_scriptBlockText:*Import-Module* OR data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke-Expression* OR data_win_eventdata_scriptBlockText:*AmsiUtils*)
    pivot_on:
    - host
    window: 1h
  - name: Native AD discovery tools executed (nltest, dsquery, adfind, net group)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*"domain admins"* OR data_win_eventdata_commandLine:*"enterprise admins"* OR data_win_eventdata_commandLine:*trusted_domains* OR data_win_eventdata_commandLine:*dclist*)
    pivot_on:
    - host
    window: 2h
  - name: SharpHound/BloodHound collection artifacts
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*BloodHound* OR data_win_eventdata_targetFilename:*_BloodHound.zip OR data_win_eventdata_targetFilename:*computers.json OR data_win_eventdata_targetFilename:*domains.json)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:*SharpHound* OR data_win_eventdata_commandLine:*SharpHound* OR data_win_eventdata_commandLine:*Invoke-BloodHound*))
    pivot_on:
    - host
    window: 4h
  - name: Kerberos and LDAP directory traffic from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"445")
    pivot_on:
    - host
    window: 2h
