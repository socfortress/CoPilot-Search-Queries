name: Invoke-Obfuscation Via Use Rundll32 - PowerShell
id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via use Rundll32 in Scripts. MITRE ATT&CK:
  T1027, T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText: "*&&*"
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*rundll32*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*shell32.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*shellexec_rundll*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*value*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*invoke*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*comspec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*iex*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*&&*';
  data_win_eventdata_scriptBlockText matches '*rundll32*';
  data_win_eventdata_scriptBlockText matches '*shell32.dll*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Use Rundll32 - PowerShell detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - rundll32
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\&\&.*/ AND data_win_eventdata_scriptBlockText:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND (data_win_eventdata_scriptBlockText:/.*[Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e6cb92b4-b470-4eb8-8a9d-d63e8583aae0
    name: Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell
    reason: Sibling Invoke-Obfuscation rundll32 launcher in 4104 script blocks; the same obfuscated launcher often fires both rules, confirming the obfuscation toolkit.
  - id: 88a22f69-62f9-4b8a-aa00-6b0212f2f05a
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell Module
    reason: Same technique seen in module logging (4103); corroborates the obfuscated rundll32 launcher from a second PowerShell log channel.
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: Invoke-Obfuscation payloads usually end in an obfuscated IEX; a hit shows the same obfuscated chain executing the decoded payload.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Obfuscated launcher is typically a stager; a download cradle in script blocks on the same host is the likely next step fetching the real payload.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Attackers disable AMSI before or alongside obfuscated PowerShell to keep the decoded payload from being scanned.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: The script invokes rundll32 via shell32 ShellExec_RunDLL; the resulting rundll32 process creation with unusual arguments is the process-level evidence of this execution.
  - id: ac20ae82-8758-4f38-958e-b44a3140ca88
    name: Invoke-Obfuscation Via Use MSHTA
    reason: Operators using Invoke-Obfuscation launchers often try several LOLBin launcher variants (rundll32, mshta) on the same host in one intrusion.
  - id: 907ac95c-4dd9-11ec-ba2c-acde48001122
    name: PowerShell Windows Defender Exclusion Commands
    reason: After obfuscated execution succeeds, attackers commonly add Defender exclusions via PowerShell to protect follow-on payloads.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: rundll32 process spawned with shell32 ShellExec_RunDLL or script-launching arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*\/[Cc].*/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections from rundll32 or PowerShell (stager callback)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Other obfuscated or download-cradle script blocks (IEX, FromBase64String, WebClient)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Executable or script files dropped in user-writable paths by PowerShell or rundll32
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa])/)
    pivot_on:
    - host
    window: 2h
  - name: Defender exclusion or persistence registry writes after obfuscated execution
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Dd]efender.*[Ee]xclusions.*/ OR data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/)
    pivot_on:
    - host
    window: 4h
