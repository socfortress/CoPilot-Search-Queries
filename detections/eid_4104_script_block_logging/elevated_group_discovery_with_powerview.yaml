name: Elevated Group Discovery with PowerView
id: 10d62950-0de5-4199-a710-cff9ea79b413
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-DomainGroupMember` cmdlet 
  from PowerView, identified through PowerShell Script Block Logging (EventID 4104). 
  This cmdlet is used to enumerate members of elevated domain groups such as Domain 
  Admins, Enterprise Admins, Schema Admins, and other privileged groups. Monitoring 
  this activity is crucial as it indicates potential reconnaissance efforts by adversaries 
  to identify high-privileged users within the domain. If confirmed malicious, this 
  activity could lead to targeted attacks on privileged accounts, facilitating further 
  compromise and lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainGroupMember*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Domain Admins*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Enterprise Admins*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Schema Admins*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Account Operators*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Server Operators*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Protected Users*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Dns Admins*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-DomainGroupMember PowerView cmdlet combined with 
  elevated group names such as Domain Admins, Enterprise Admins, Schema Admins, and 
  other privileged groups. This combination indicates reconnaissance targeting high-privilege 
  accounts within the domain.

known_false_positives: >
  Administrators or power users may use this PowerView cmdlet for legitimate 
  troubleshooting and system administration purposes. Filter based on user context 
  and whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1069/002/
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainGroupMember/
  - https://docs.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-b--privileged-accounts-and-groups-in-active-directory
  - https://github.com/PowerShellMafia/PowerSploit/blob/master/Recon/PowerView.ps1

response:
  message: >
    Elevated group discovery with PowerView detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script: $data_win_eventdata_scriptBlockText$. 
    This indicates reconnaissance targeting privileged accounts. MITRE ATT&CK: T1069.002
  risk_score: 55
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 55
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Privileged Account Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.002
  custom_tags:
    - powerview
    - get_domaingroupmember
    - domain_admins
    - enterprise_admins
    - privileged_groups
    - active_directory
    - reconnaissance
    - powershell
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainGroupMember.*/ AND (data_win_eventdata_scriptBlockText:/.*Domain Admins.*/ OR data_win_eventdata_scriptBlockText:/.*Enterprise Admins.*/ OR data_win_eventdata_scriptBlockText:/.*Schema Admins.*/ OR data_win_eventdata_scriptBlockText:/.*Account Operators.*/ OR data_win_eventdata_scriptBlockText:/.*Server Operators.*/ OR data_win_eventdata_scriptBlockText:/.*Protected Users.*/ OR data_win_eventdata_scriptBlockText:/.*Dns Admins.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: 'Same PowerView toolkit: group enumeration usually precedes Get-DomainGroupMember on a privileged group, showing PowerView is loaded and being used interactively.'
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Once privileged group members are known, the operator typically enumerates those users' attributes (SPNs, adminCount, last logon) with PowerView in the same session.
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: Common PowerView follow-on that hunts AS-REP roastable accounts after identifying high-value targets.
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: PowerView host discovery follows privileged-account discovery to locate where admins log in or find servers to pivot to.
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: Alternative or parallel PowerShell AD reconnaissance framework that dumps privileged group membership and more; indicates broad domain mapping.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: Attackers pair PowerView group queries with SharpHound/BloodHound to map attack paths to Domain Admins from the same host.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Native net group 'Domain Admins' /domain is the command-line twin of this behaviour, often run before or after PowerView on the same host.
  - id: 3f6bbf22-093e-4cb4-9641-83f47b8444b6
    name: Elevated Group Discovery With Wmic
    reason: Same objective (enumerating elevated groups) via WMIC; operators switch tooling when one is blocked or logged.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView recon and hunting cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(Find-LocalAdminAccess|Invoke-UserHunter|Invoke-ShareFinder|Find-DomainShare|Get-NetSession|Get-DomainGPO|Get-DomainGPOLocalGroup|Get-DomainObjectAcl|Find-InterestingDomainAcl|Invoke-ACLScanner|Get-DomainOU|Invoke-EnumerateLocalAdmin|Get-NetLoggedon).*/ OR data_win_eventdata_scriptBlockText:/.*PowerView.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerView download and in-memory load cradle
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ii][Ee][Xx]|[Ii]nvoke-[Ee]xpression).*/ AND (data_win_eventdata_scriptBlockText:/.*([Nn]et\.[Ww]eb[Cc]lient|[Dd]ownload[Ss]tring|[Ii]nvoke-[Ww]eb[Rr]equest).*/ OR data_win_eventdata_scriptBlockText:/.*(PowerSploit|PowerView\.ps1|raw\.githubusercontent).*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential-access follow-on from privileged-target discovery (Kerberoast, Rubeus, Mimikatz)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(Invoke-Kerberoast|Get-DomainSPNTicket|Request-SPNTicket|Invoke-Mimikatz|sekurlsa|Invoke-Rubeus|Get-NetUser -SPN|Get-DomainUser -SPN|Find-LocalAdminAccess|Invoke-DCSync).*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: AD recon tooling and native group-enumeration processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Ss]harp[Hh]ound|[Aa]d[Ff]ind|[Dd]squery|[Nn]ltest|[Ss]etspn)\.exe/ OR (data_win_eventdata_image:/.*\\net1?\.exe/ AND data_win_eventdata_commandLine:/.*(group|localgroup).*(Domain Admins|Enterprise Admins|Administrators).*/) OR data_win_eventdata_commandLine:/.*([Cc]ollection[Mm]ethod|-c [Aa]ll|[Ss]harp[Hh]ound).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Lateral movement follow-on from the recon host (admin shares, WinRM, remote WMI)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|pwsh)\.exe/ AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"135")) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(Invoke-Command|Enter-PSSession|New-PSSession|Invoke-WmiMethod|Invoke-CimMethod).*/)
    pivot_on:
    - host
    window: 4h
