name: DMSA Service Account Created in Specific OUs - PowerShell
id: 02122374-b74e-495c-b285-9e4da973f3d6
version: 1
schema_version: "1.0"
date: "2025-05-24"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 02122374-b74e-495c-b285-9e4da973f3d6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a dMSA service account using the New-ADServiceAccount
  cmdlet in certain OUs. The fact that the cmdlet is used to create a dMSASvc
  account in a specific OU is highly suspicious. It is a pattern trying to
  exploit the BadSuccessor privilege escalation vulnerability in Windows Server
  2025. On top of that, if the user that is creating the dMSASvc account is not
  a legitimate administrator or does not have the necessary permissions, it is a
  strong signal of an attempted or successful abuse of the BaDSuccessor
  vulnerability for privilege escalation within the Windows Server 2025 Active
  Directory environment. MITRE ATT&CK: T1078.002, T1098.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-ADServiceAccount*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-CreateDelegatedServiceAccount*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-path*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-ADServiceAccount*';
  data_win_eventdata_scriptBlockText matches '*-CreateDelegatedServiceAccount*';
  data_win_eventdata_scriptBlockText matches '*-path*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.akamai.com/blog/security-research/abusing-bad-successor-for-privilege-escalation-in-active-directory
  - https://attack.mitre.org/techniques/T1078/002/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    DMSA Service Account Created in Specific OUs - PowerShell detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1078.002, T1098
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078.002
    - T1098
  custom_tags:
    - service
    - account
    - specific
    - powershell
    - privilege_escalation
    - initial_access
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Aa][Dd][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*-[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0ea8db81-2ff6-4525-9448-33bbe7effc13
    name: New DMSA Service Account Created in Specific OUs
    reason: Same BadSuccessor dMSA creation seen from process-creation telemetry (powershell/ADSI command line); both firing confirms the dMSA was really created, not just logged in a script block.
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: BadSuccessor requires finding an OU where the attacker holds CreateChild; AD-module enumeration of OUs/ACLs and existing accounts precedes dMSA creation.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: PowerView OU/ACL discovery is the usual precursor to locating a writable OU for dMSA creation and picking a high-value target account to inherit from.
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: After the dMSA is linked to a privileged account, the attacker requests Kerberos tickets with Rubeus (asktgt/asktgs) to obtain the inherited privileges.
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: BadSuccessor privilege use is a Kerberos TGT/TGS request as the dMSA; PowerShell-driven ticket requests on the same host are the exploitation step.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Inheriting Domain Admin-equivalent rights via the dMSA enables DCSync; replication by a non-DC account is the credential-harvesting follow-on.
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: Alternate AD privilege-escalation/persistence move (ACL edit granting replication rights) commonly paired with dMSA abuse by the same operator.
  - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
    name: Addition of SID History to Active Directory Object
    reason: Another AD object-level privilege inheritance backdoor; co-occurs when an attacker is manipulating AD objects to carry over privileged identity.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Directory object changes tied to dMSA (msDS-DelegatedManagedServiceAccount / predecessor link)
    query: (data_win_system_eventID:"5137" OR data_win_system_eventID:"5136" OR data_win_system_eventID:"4662") AND (*msDS\-DelegatedManagedServiceAccount* OR *msDS\-ManagedAccountPrecededByLink* OR *msDS\-DelegatedMSAState*)
    pivot_on:
    - host
    window: 2h
  - name: Script blocks setting dMSA predecessor link / state or enumerating OU ACLs
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Dd][Ss]-[Mm][Aa][Nn][Aa][Gg][Ee][Dd][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Pp][Rr][Ee][Cc][Ee][Dd][Ee][Dd][Bb][Yy][Ll][Ii][Nn][Kk].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Dd][Ss]-[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd][Mm][Ss][Aa][Ss][Tt][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Aa][Dd][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Cc][Ll].*[Aa][Dd]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Oo][Rr][Gg][Aa][Nn][Ii][Zz][Aa][Tt][Ii][Oo][Nn][Aa][Ll][Uu][Nn][Ii][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos tooling or ticket requests via command line (Rubeus / asktgt / dmsa)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Bb][Ee][Uu][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Dd][Mm][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss]4[Uu].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell connecting to domain controller Kerberos/LDAP ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"9389")
    pivot_on:
    - host
    window: 2h
  - name: 'Credential theft follow-on: DCSync / NTDS / LSASS dumping tools'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::.*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 4h
