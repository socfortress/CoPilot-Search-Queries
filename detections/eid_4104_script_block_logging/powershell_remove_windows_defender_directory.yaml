name: Powershell Remove Windows Defender Directory
id: windows-powershell-remove-windows-defender-directory-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects a suspicious PowerShell command attempting to delete the Windows Defender 
  directory. It leverages PowerShell Script Block Logging to identify commands 
  containing "rmdir" and targeting the Windows Defender path. This activity is 
  significant as it may indicate an attempt to disable or corrupt Windows Defender, 
  a key security component. If confirmed malicious, this action could allow an 
  attacker to bypass endpoint protection, facilitating further malicious activities 
  without detection.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*rmdir*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Windows Defender*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  No false positives have been identified at this time. Any attempt to delete the 
  Windows Defender directory should be treated as highly suspicious.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/

response:
  message: >
    Windows Defender directory deletion attempt detected on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.001
  risk_score: 95
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 95
  threat_objects: []

tags:
  analytic_story:
    - Data Destruction
    - WhisperGate
    - Endpoint Protection Bypass
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*rmdir.*/ AND data_win_eventdata_scriptBlockText:/.*Windows Defender.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
    name: Tamper Windows Defender Remove-MpPreference
    reason: 'Sibling Defender-evasion step: attackers who delete the Defender directory typically also strip MpPreference settings/exclusions via PowerShell in the same session.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: 'Quieter alternative or precursor: Add-MpPreference exclusions are used to blind Defender before (or when) outright directory deletion fails.'
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender operational log confirms exclusions were actually applied on the same host, corroborating the tampering attempt.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Direct effect of successful Defender corruption/removal: the engine reports real-time protection off, confirming the deletion had impact.'
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Tamper Protection blocking the rmdir/config change is the Defender-side evidence that the deletion attempt was stopped or partially succeeded.
  - id: 9719a8aa-401c-41af-8108-ced7ec9cd75c
    name: Windows Defender Definition Files Removed
    reason: 'File-level variant of the same objective: removing Defender definitions/files to cripple detection, often alongside directory deletion.'
  - id: c443012c-7928-43bf-ac20-7eda5efe61ad
    name: Suspicious Uninstall of Windows Defender Feature via PowerShell
    reason: Alternate PowerShell route to remove Defender entirely; seen when directory deletion is blocked by file protections.
  - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
    name: Delete ShadowCopy With PowerShell
    reason: 'Destructive follow-on: once protection is removed, wiper/ransomware operators (WhisperGate-style) delete shadow copies to prevent recovery.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender configuration, exclusion and service tampering via process creation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Rr]emove-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Uu]ninstall-[Ww]indows[Ff]eature.*[Dd]efender.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc].*(stop|config|delete).*(WinDefend|Sense|WdFilter|WdNisSvc).*/ OR data_win_eventdata_commandLine:/.*[Dd]ism.*[Dd]efender.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg.*[Ww]indows [Dd]efender.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other Defender-directory or Defender-binary file deletion and rename activity
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(rmdir|rd |del |[Rr]emove-[Ii]tem|takeown|icacls).*(Windows Defender|MsMpEng|WinDefend|Defender\\Platform).*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(Windows Defender|Windows\\Defender).*/ AND NOT data_win_eventdata_image:/.*(MsMpEng|MpCmdRun|TrustedInstaller|svchost|setup|MsSense).*/)
    pivot_on:
    - host
    window: 1h
  - name: 'Destructive follow-on: shadow copy, boot config and backup destruction'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*(recoveryenabled|bootstatuspolicy).*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ff]sutil.*usn.*deletejournal.*/ OR data_win_eventdata_commandLine:/.*[Cc]ipher.*\/[Ww].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Preceding PowerShell script blocks: download, encoded or privilege-taking stagers'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ii]nvoke-[Ww]eb[Rr]equest|[Ff]rom[Bb]ase64[Ss]tring|[Ii]nvoke-[Ee]xpression|[Aa]msi[Uu]tils|[Ss]tart-[Bb]its[Tt]ransfer).*/ OR data_win_eventdata_scriptBlockText:/.*(takeown|icacls|SeTakeOwnership|TrustedInstaller).*/ OR data_win_eventdata_scriptBlockText:/.*(Remove-Item|Stop-Service).*(Defender|WinDefend).*/)
    pivot_on:
    - host
    window: 1h
  - name: Wiper-style disk or MBR overwrite and mass file destruction after Defender removal
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\\\\\.\\PhysicalDrive|[Ff]ormat-[Vv]olume|[Cc]lear-[Dd]isk|[Dd]iskpart.*clean|[Ss]delete|[Rr]emove-[Ii]tem.*-[Rr]ecurse.*-[Ff]orce).*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\.locked|\.encrypted|\.crypt|README.*\.txt|HOW_TO.*)/)
    pivot_on:
    - host
    window: 4h
