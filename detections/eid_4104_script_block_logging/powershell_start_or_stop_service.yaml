name: PowerShell Start or Stop Service
id: windows-powershell-start-or-stop-service-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Identifies the use of PowerShell's Start-Service or Stop-Service cmdlets on an 
  endpoint. It leverages PowerShell Script Block Logging (EventCode 4104) to detect 
  these commands. This activity is significant because attackers can manipulate 
  services to disable or stop critical functions, causing system instability or 
  disrupting business operations. If confirmed malicious, this behavior could allow 
  attackers to disable security services, evade detection, or disrupt essential 
  services, leading to potential system downtime and compromised security.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*start-service*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*stop-service*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  This behavior may be noisy, as these cmdlets are commonly used by system 
  administrators or other legitimate users to manage services. Therefore, it is 
  recommended to use this detection as part of a broader set of security controls. 
  Filter based on user context, service names, and time of execution to identify 
  anomalies and reduce false positives.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn-powershell.net/2012/01/15/startingstopping-and-restarting-remote-services-with-powershell/
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/start-service?view=powershell-7.3

response:
  message: >
    Service manipulation detected in PowerShell on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Scattered Lapsus$ Hunters
    - Active Directory Lateral Movement
    - Service Manipulation
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Stop-Service.*/ OR data_win_eventdata_scriptBlockText:/.*Start-Service.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 953945c5-22fe-4a92-9f8a-a9edc1e522da
    name: Abuse of Service Permissions to Hide Services Via Set-Service - PS
    reason: Same service-control cmdlet family; Set-Service SDDL tampering to hide or lock a service is the stealth follow-on to Stop/Start-Service on a service the attacker wants to own
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Stop-Service on security agents is a common route to disabling monitoring; this catches the Set-MpPreference style variant used alongside it
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: If the stopped service was WinDefend/Sense, Defender logs real-time protection being disabled on the same host moments later, confirming defense evasion
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: Stopping logging or EventLog-related services is paired with ETW disabling to blind telemetry before the main payload runs
  - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
    name: Delete ShadowCopy With PowerShell
    reason: Ransomware playbooks stop VSS, backup and database services with Stop-Service and then delete shadow copies before encrypting
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: Start-Service on a planted service is often paired with scheduled task persistence in the same script session
  - id: 243de76f-4725-4f2e-8225-a8a69b15ad61
    name: PowerShell Create Local User
    reason: Post-compromise scripts that manipulate services frequently create a backdoor local account in the same PowerShell session
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Remote Start-Service/Stop-Service or PsExec service install are two ways to run code via the service control manager; co-occurrence suggests lateral movement
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service control commands in process creation (sc, net stop, Stop-Service)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee]\s+(stop|config|delete|create|failure).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?\s+[Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on:
    - host
    window: 1h
  - name: Security, backup or database service names targeted in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(WinDefend|Sense|MpsSvc|wscsvc|EventLog|Sysmon|wazuh|SentinelAgent|CSFalcon|CarbonBlack|VSS|vmms|MSSQL|SQLWriter|Veeam|BackupExec|wuauserv).*/
    pivot_on:
    - host
    window: 1h
  - name: Defender tampering or exclusions via PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 1h
  - name: New service installed or service binary path changed (registry)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*CurrentControlSet.Services.*(ImagePath|Start|ObjectName).*/
    pivot_on:
    - host
    window: 2h
  - name: 'Ransomware precursors: shadow copy or backup destruction'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
