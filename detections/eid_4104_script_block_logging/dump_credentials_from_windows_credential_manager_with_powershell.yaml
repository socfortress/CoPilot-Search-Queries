name: Dump Credentials from Windows Credential Manager With PowerShell
id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may search for common password storage locations to obtain user
  credentials. Passwords are stored in several places on a system, depending on
  the operating system or application holding the credentials. MITRE ATT&CK:
  T1555.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-PasswordVaultCredentials*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-CredManCreds*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*New-Object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Windows.Security.Credentials.PasswordVault*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*New-Object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Microsoft.CSharp.CSharpCodeProvider*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*[System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Collections.ArrayList*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*System.CodeDom.Compiler.CompilerParameters*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-PasswordVaultCredentials*';
  data_win_eventdata_scriptBlockText matches '*Get-CredManCreds*';
  data_win_eventdata_scriptBlockText matches '*New-Object*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555/T1555.md
  - https://attack.mitre.org/techniques/T1555/

response:
  message: >
    Dump Credentials from Windows Credential Manager With PowerShell detected on
    host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1555
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555
  custom_tags:
    - credentials
    - credential
    - manager
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Rr][Ee][Dd][Mm][Aa][Nn][Cc][Rr][Ee][Dd][Ss].*/ OR (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]\.[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt].*/) OR (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Cc][Ss][Hh][Aa][Rr][Pp]\.[Cc][Ss][Hh][Aa][Rr][Pp][Cc][Oo][Dd][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Rr][Uu][Nn][Tt][Ii][Mm][Ee]\.[Ii][Nn][Tt][Ee][Rr][Oo][Pp][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Rr][Uu][Nn][Tt][Ii][Mm][Ee][Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\]::[Gg][Ee][Tt][Rr][Uu][Nn][Tt][Ii][Mm][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy]\(\)\).*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn][Ss]\.[Aa][Rr][Rr][Aa][Yy][Ll][Ii][Ss][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Cc][Oo][Dd][Ee][Dd][Oo][Mm]\.[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr][Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 603c6630-5225-49c1-8047-26c964553e0e
    name: Enumerate Credentials from Windows Credential Manager With PowerShell
    reason: Same Credential Manager/PasswordVault tradecraft; enumeration (vaultcmd/cmdkey-style listing) typically precedes or accompanies the actual dump of stored secrets.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: cmdkey /list is the native-binary way to discover stored Credential Manager entries, commonly run just before or alongside the PowerShell vault dump.
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Operators harvesting Credential Manager in PowerShell usually also hit browser Login Data stores in the same sweep of password locations.
  - id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
    name: Registry Export of Third-Party Credentials
    reason: 'Same T1555 password-store sweep: exporting PuTTY/WinSCP/VNC registry-saved credentials is a sibling collection step on the same host.'
  - id: 84c174ab-d3ef-481f-9c86-a50d0b8e3edb
    name: PowerShell Get-Process LSASS in ScriptBlock
    reason: Escalation of credential theft from stored vault secrets to in-memory LSASS credentials from the same PowerShell session.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Credential-focused PowerShell toolkits (Invoke-Mimikatz, PowerShell Empire modules) often bundle vault dumping; co-occurrence confirms a credential-theft toolkit rather than a one-off script.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Follow-on in-memory credential dumping in script blocks when the operator moves beyond Credential Manager secrets.
  - id: bd5971a7-626d-46ab-8176-ed643f694f68
    name: Extracting Information with PowerShell
    reason: Script that dumps vault credentials often then writes/collects them to files for staging; this catches the post-harvest collection step.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential tooling and LSASS access on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp](64)?\.[Ee][Xx][Ee]|\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]|\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Cmdkey / vaultcmd stored-credential listing on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Cc][Mm][Dd][Kk][Ee][Yy]|\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc][Mm][Dd][Kk][Ee][Yy] */[Ll][Ii][Ss][Tt]|[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd] */[Ll][Ii][Ss][Tt]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Browser / DPAPI credential store file access on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn]|[Kk][Ee][Yy][34]\.[Dd][Bb]|[Pp][Rr][Oo][Tt][Ee][Cc][Tt]\\S-1-5|[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]\\|[Vv][Aa][Uu][Ll][Tt]\\).*/
    pivot_on:
    - host
    window: 2h
  - name: Staging and archiving of harvested credentials on this host
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]|[Tt][Xx][Tt]|[Dd][Aa][Tt]|[Kk][Dd][Bb][Xx])/ AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|7[Zz]a? .* a |[Rr][Aa][Rr] a ).*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound exfil or C2 from PowerShell on this host
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true") OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]|[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]).*/)
    pivot_on:
    - host
    window: 2h
