name: WMI Recon Running Process Or Services
id: b5cd5526-cce7-11eb-b3bd-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic identifies suspicious PowerShell script execution via 
  EventCode 4104, where WMI performs an event query to list running processes or 
  services. This detection leverages PowerShell Script Block Logging to capture and 
  analyze script block text for specific WMI queries. This activity is significant as 
  it is commonly used by malware and APT actors to map security applications or 
  services on a compromised machine. If confirmed malicious, this could allow 
  attackers to identify and potentially disable security defenses, facilitating 
  further compromise and persistence within the environment.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*SELECT*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_Process*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_Service*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for WMI SELECT queries targeting Win32_Process or Win32_Service classes to enumerate 
  running processes and services for security application discovery. Validate that 
  data_win_eventdata_scriptBlockText field is being populated in Elasticsearch/Wazuh 
  Indexer.

known_false_positives: >
  Network administrators may use this command for legitimate checking and 
  troubleshooting purposes. Filter based on user context and whether the action was 
  expected and authorized within your organization.

references:
  - https://news.sophos.com/en-us/2020/05/12/maze-ransomware-1-year-counting/
  - https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
  - https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/WMI-events.md
  - https://in.security/2019/04/03/an-intro-into-abusing-and-identifying-wmi-event-subscriptions-for-persistence/

response:
  message: >
    WMI process or service reconnaissance detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is enumerating running processes and services to identify security 
    applications for evasion or disabling. MITRE ATT&CK: T1592
  risk_score: 20
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 20
    - field: data_win_eventdata_user
      type: user
      score: 20
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Malicious PowerShell
    - Hermetic Wiper
    - Data Destruction
  asset_type: Endpoint
  mitre_attack_id:
    - T1592
  custom_tags:
    - wmi_recon
    - process_discovery
    - service_discovery
    - win32_process
    - win32_service
    - security_application_discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*SELECT.*/ AND (data_win_eventdata_scriptBlockText:/.*Win32_Process.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_Service.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: Same process enumeration via WMI performed through wmic.exe instead of PowerShell; operators often switch tooling mid-session.
  - id: 15434e33-5027-4914-88d5-3d4145ec25a9
    name: Potential Product Reconnaissance Via Wmic.EXE
    reason: Installed-product/AV inventory via WMI is the companion step to listing Win32_Process/Win32_Service when mapping security tooling.
  - id: 2650dd1a-eb2a-412d-ac36-83f06c4f2282
    name: Detected Windows Software Discovery - PowerShell
    reason: Script-block-logged software inventory on the same host extends the security-product mapping started by the WMI process/service query.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: 'Likely next step: once security services are identified via Win32_Service, the attacker uninstalls or disables them through WMI.'
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: Follow-on defense evasion targeting Defender after the running security services were enumerated.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Same PowerShell session commonly adds Defender exclusions after recon identifies Defender as the active AV.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: AMSI bypass in script blocks on the same host is a precursor or companion of recon scripts from loaders and post-exploitation frameworks.
  - id: c1337eb8-921a-4b59-855b-4ba188ddcc42
    name: Deletion of Volume Shadow Copies via WMI with PowerShell - PS Script
    reason: Destructive/ransomware impact stage that follows WMI recon in wiper and ransomware chains (HermeticWiper, Maze) once defenses are mapped.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Security product tampering or service stop commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Cc]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1)(\.[Ee][Xx][Ee])? +([Ss][Tt][Oo][Pp]|[Cc][Oo][Nn][Ff][Ii][Gg]).*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: WMI/WMIC process or product queries in command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww][Mm][Ii][Cc]|[Gg][Ee][Tt]-[Ww][Mm][Ii][Oo][Bb][Jj][Ee][Cc][Tt]|[Gg][Ee][Tt]-[Cc][Ii][Mm][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee]).*(Win32_Process|Win32_Service|AntiVirusProduct|SecurityCenter2|[Pp][Rr][Oo][Cc][Ee][Ss][Ss] +[Gg][Ee][Tt]|[Pp][Rr][Oo][Dd][Uu][Cc][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: Script blocks tampering with Defender or logging after recon
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Tt][Ww][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Shadow copy deletion and recovery inhibition (impact stage)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy]).*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: Child processes of PowerShell hosting the recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
