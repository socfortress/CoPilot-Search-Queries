name: Automated Collection Command PowerShell
id: c1dda054-d638-4c16-afc8-53e007f3fbc5
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c1dda054-d638-4c16-afc8-53e007f3fbc5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Once established within a system or network, an adversary may use automated
  techniques for collecting internal data. MITRE ATT&CK: T1119.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.doc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.docx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.xls*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.xlsx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.ppt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.pptx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.rtf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.pdf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.txt*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Get-ChildItem*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "* -Recurse *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "* -Include *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*.doc*';
  data_win_eventdata_scriptBlockText matches '*.docx*';
  data_win_eventdata_scriptBlockText matches '*.xls*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
  - https://attack.mitre.org/techniques/T1119/

response:
  message: >
    Automated Collection Command PowerShell detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1119
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1119
  custom_tags:
    - automated
    - collection
    - powershell
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*\.[Dd][Oo][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Dd][Oo][Cc][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Xx][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Xx][Ll][Ss][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Pp][Pp][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Pp][Pp][Tt][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Rr][Tt][Ff].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Pp][Dd][Ff].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Tt][Xx][Tt].*/) AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm].*/ AND data_win_eventdata_scriptBlockText:/.* -[Rr][Ee][Cc][Uu][Rr][Ss][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.* -[Ii][Nn][Cc][Ll][Uu][Dd][Ee] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f576a613-2392-4067-9d1a-9345fb58d8d1
    name: Automated Collection Command Prompt
    reason: Same T1119 sweep done via cmd (dir /s, copy, findstr); operators mix shells, so a hit on the same host confirms scripted document harvesting
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: 'Direct next step: harvested documents are compressed in script blocks (Compress-Archive/ZipFile) before exfil'
  - id: daf7eb81-35fd-410d-9d7a-657837e602bb
    name: Zip A Folder With PowerShell For Staging In Temp  - PowerShell Module
    reason: Staging of the collected files into a zip in Temp, the usual follow-on to a recursive document enumeration
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Compress-Archive writing the collected folder to a suspicious output path, confirming the harvested set was packaged
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Attackers packaging collected documents with a password-protected 7z to evade DLP before exfiltration
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Rclone is the common tool used to ship the collected documents to cloud storage after collection
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: Collected data posted to attacker infrastructure from PowerShell, the exfil stage of the same script chain
  - id: 59e8bf41-7472-412a-90d3-00f3afa452e9
    name: Windows Exfiltration Over C2 Via Powershell UploadString
    reason: WebClient UploadString exfil of the harvested content, follow-on to the collection script
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive creation of collected files via PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_scriptBlockText:/.*[Zz]ip[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Ff]rom[Dd]irectory.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Oo]\.[Cc]ompression.*/)
    pivot_on:
    - host
    window: 2h
  - name: Archiver or rclone execution staging collected data
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7z|7za|[Rr]ar|[Ww]in[Rr]ar|[Rr]clone|[Ww]inzip.*)\.exe/ OR data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive| a -[Pp]| a -hp| rclone | copy .*:).*/)
    pivot_on:
    - host
    window: 2h
  - name: Exfiltration upload calls in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Dd]ata.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]est[Mm]ethod.*[Pp]ost.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*-[Ii]n[Ff]ile.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound connections or DNS to file-sharing exfil sites
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:"true") OR (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*(mega\.nz|mega\.io|anonfiles|transfer\.sh|pastebin|file\.io|gofile|dropbox|temp\.sh|ngrok).*/)
    pivot_on:
    - host
    window: 2h
  - name: Reading of credential-bearing or sensitive document paths in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]opy-[Ii]tem.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]ontent.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]elect-[Ss]tring.*/) AND (data_win_eventdata_scriptBlockText:/.*([Pp]assword|[Cc]redential|[Ss]ecret|[Kk]ey[Pp]ass|\.kdbx|\.pem|\.pfx).*/)
    pivot_on:
    - host
    window: 4h
