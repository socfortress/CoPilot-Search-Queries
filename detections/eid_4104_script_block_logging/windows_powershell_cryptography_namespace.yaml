name: Windows PowerShell Cryptography Namespace
id: f8b482f4-6d62-49fa-a905-dfa15698317b
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects suspicious PowerShell script execution involving the cryptography
  namespace via EventCode 4104. It leverages PowerShell Script Block Logging
  to identify scripts using cryptographic functions, excluding common hashes
  like SHA and MD5. This activity is significant as it is often associated
  with malware that decrypts or decodes additional malicious payloads.
  If confirmed malicious, this could allow an attacker to execute further code,
  escalate privileges, or establish persistence within the environment.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*System.Security.Cryptography*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_scriptBlockText: "*SHA*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*MD5*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*DeriveBytes*"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-07 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-07 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrative scripts using cryptography for legitimate purposes may trigger
  this detection. Review script context, parent process, and user account to
  determine legitimacy.

references:
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.asyncrat
  - https://attack.mitre.org/techniques/T1059/001/
  - https://www.crowdstrike.com/blog/inside-xworm-xworm-malware-analysis/

response:
  message: >
    Suspicious PowerShell cryptography namespace execution detected on
    $agent_name$ by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001
  risk_score: 45
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 25
    - field: data_win_eventdata_user
      type: user
      score: 20
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - AsyncRAT
    - XWorm
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - cryptography
    - ransomware
    - payload_decryption
    - asyncrat
    - xworm
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*System\.Security\.Cryptography.*/ AND NOT (data_win_eventdata_scriptBlockText:/.*SHA.*/ OR data_win_eventdata_scriptBlockText:/.*MD5.*/ OR data_win_eventdata_scriptBlockText:/.*DeriveBytes.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-powershell-processing-stream-of-data-001
    name: Powershell Processing Stream Of Data
    reason: Crypto streams (CryptoStream/MemoryStream/GZipStream) decrypt-and-unpack an embedded payload; this fires on the same stream-processing in the same script block chain
  - id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
    name: PowerShell Loading DotNET into Memory via Reflection
    reason: Decrypted payload is typically a .NET assembly loaded with Assembly.Load straight after AES/RSA decryption (AsyncRAT/XWorm loader pattern)
  - id: windows-powershell-fileless-script-contains-base64-encoded-content-001
    name: Powershell Fileless Script Contains Base64 Encoded Content
    reason: Base64 blob is the usual encrypted payload carrier decoded and decrypted by the cryptography call in the same script
  - id: 434c08ba-8406-4d15-8b24-782cb071a691
    name: PowerShell Execution With Potential Decryption Capabilities
    reason: Process-creation view of the same decrypt-in-PowerShell command line (the launcher that produced this script block)
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Staged loaders download the encrypted blob first, then decrypt it with System.Security.Cryptography; download is the direct precursor
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Loaders patch AMSI before running the decrypted in-memory assembly so it is not scanned
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: Decrypted shellcode/payload is then injected into memory via P/Invoke GetProcAddress/VirtualAlloc, the follow-on stage
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded-command launch commonly delivers the crypto-decrypting script block that triggered this alert
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reflective assembly load / in-memory execution of decrypted payload
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]ssembly\]::[Ll]oad.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]ntry[Pp]oint.*[Ii]nvoke.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal.*[Gg]et[Dd]elegate[Ff]or[Ff]unction[Pp]ointer.*/)
    pivot_on:
    - host
    window: 1h
  - name: Base64 and stream decode/decompress chains in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Zz]ip[Ss]tream.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]eflate[Ss]tream.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]rypto[Ss]tream.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Dd]ecryptor.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawned from script hosts or Office (loader launch)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_parentImage:/.*(wscript|cscript|mshta|winword|excel|outlook|cmd|wmiprvse)\.exe/
    pivot_on:
    - host
    window: 1h
  - name: Persistence set by script interpreters (Run key or scheduled task)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|CurrentVersion\\RunOnce).*/ AND data_win_eventdata_image:/.*(powershell|pwsh|wscript|cscript|mshta|cmd)\.exe/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/)
    pivot_on:
    - host
    window: 4h
  - name: Executable or script dropped to user-writable paths by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:/.*(AppData|Temp|ProgramData|Public).*\.(exe|dll|ps1|vbs|js|bat)/
    pivot_on:
    - host
    window: 2h
