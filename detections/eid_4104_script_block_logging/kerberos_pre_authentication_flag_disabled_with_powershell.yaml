name: Kerberos Pre-Authentication Flag Disabled with PowerShell
id: 59b51620-94c9-11ec-b3d5-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of the `Set-ADAccountControl` PowerShell cmdlet 
  with parameters that disable Kerberos Pre-Authentication. It leverages PowerShell 
  Script Block Logging (EventID 4104) to identify this specific command execution. 
  Disabling Kerberos Pre-Authentication is significant because it allows adversaries to 
  perform offline brute force attacks against user passwords using the AS-REP Roasting 
  technique. If confirmed malicious, this activity could enable attackers to escalate 
  privileges or maintain persistence within an Active Directory environment, posing a 
  severe security risk.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Set-ADAccountControl*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*DoesNotRequirePreAuth:$true*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Set-ADAccountControl cmdlet with DoesNotRequirePreAuth:$true 
  parameter. Validate that data_win_eventdata_scriptBlockText field is being populated 
  in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Although unlikely, Administrators may need to set this flag for legitimate purposes. 
  Filter based on user context and whether the action was expected and authorized within 
  your organization.

references:
  - https://docs.microsoft.com/en-us/troubleshoot/windows-server/identity/useraccountcontrol-manipulate-account-properties
  - https://m0chan.github.io/2019/07/31/How-To-Attack-Kerberos-101.html
  - https://stealthbits.com/blog/cracking-active-directory-passwords-with-as-rep-roasting/
  - https://attack.mitre.org/techniques/T1558/004/

response:
  message: >
    Kerberos Pre-Authentication disabled on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates AS-REP Roasting preparation/privilege escalation activity. 
    MITRE ATT&CK: T1558.004
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
    - field: data_win_eventdata_user
      type: user
      score: 70
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Kerberos Attacks
    - Privilege Escalation
    - Credential Access
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.004
  custom_tags:
    - set_adaccountcontrol
    - kerberos_preauth
    - asrep_roasting
    - doesnotrequirepreauth
    - account_control
    - kerberos
    - privilege_escalation
    - powershell
    - active_directory
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Set-ADAccountControl.*/ AND data_win_eventdata_scriptBlockText:/.*DoesNotRequirePreAuth:\$true.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: 'Reconnaissance precursor: attacker (or auditor) enumerates accounts with DONT_REQ_PREAUTH to find AS-REP roastable targets; the same host running this rule then flipping the flag is the setup-then-exploit sequence.'
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: PowerView-based discovery of accounts without pre-auth is the offensive-tooling precursor to AS-REP roasting; precedes or accompanies the flag being set.
  - id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
    name: Get-ADUser Enumeration Using UserAccountControl Flags
    reason: Enumeration of users by UserAccountControl bits (incl. pre-auth disabled) is the lookup step used to choose which account to modify or roast.
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: Rubeus asreproast is the follow-on that requests AS-REP hashes for accounts whose pre-auth was just disabled.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Process-level Rubeus execution (asreproast) is the direct exploitation of the disabled pre-auth flag.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Command-line Kerberos ticket/AS-REP requests after the flag change indicate the roasting step is being carried out.
  - id: b29a93fb-087c-4b5b-a84d-ee3309e69d08
    name: Manipulation of User Computer or Group Security Principals Across AD
    reason: Set-ADAccountControl is an AD object modification; the same actor modifying other principals signals broader AD tampering/privilege abuse.
  - id: 39b31e81-5f5f-4898-9c0e-2160cfc0f9bf
    name: HackTool - Hashcat Password Cracker Execution
    reason: Offline cracking of captured AS-REP hashes (mode 18200) is the end goal of disabling pre-auth.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AS-REP requests without pre-authentication (4768)
    query: data_win_system_eventID:"4768" AND data_win_eventdata_preAuthType:"0"
    pivot_on:
    - user
    window: 24h
  - name: Rubeus / AS-REP roasting tooling in script blocks and command lines
    query: (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Rr]ubeus|[Aa]sreproast|[Gg]et-ASREPHash|[Ii]nvoke-ASREPRoast).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt]|[Rr]ubeus|[Hh]ashcat|[Jj]ohn).*/)
    pivot_on:
    - host
    window: 2h
  - name: Other AD account attribute changes and AD enumeration via PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(Set-ADAccountControl|Set-ADUser|Set-ADObject|DoesNotRequirePreAuth|UserAccountControl|Get-DomainUser|Get-ADUser).*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: AD user account changes (4738 UAC modified) and Kerberos TGT activity
    query: data_win_system_eventID:"4738" OR data_win_system_eventID:"4742" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"4723"
    pivot_on:
    - user
    window: 6h
  - name: Outbound Kerberos / LDAP connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268")
    pivot_on:
    - host
    window: 2h
