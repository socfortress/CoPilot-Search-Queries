name: Windows Screen Capture Via Powershell
id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of a PowerShell script designed to 
  capture screen images on a host. It leverages PowerShell Script Block Logging to 
  identify specific script block text patterns associated with screen capture activities. 
  This behavior is significant as it may indicate an attempt to exfiltrate sensitive 
  information by capturing desktop screenshots. If confirmed malicious, this activity 
  could allow an attacker to gather visual data from the compromised system, potentially 
  leading to data breaches or further exploitation.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*[Drawing.Graphics]::FromImage*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Drawing.Bitmap*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Graphics.FromImage*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText: "*.CopyFromScreen*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of GDI+ drawing APIs ([Drawing.Graphics], [Drawing.Bitmap], 
  Graphics.FromImage) combined with CopyFromScreen method to capture screen content. 
  Validate that data_win_eventdata_scriptBlockText field is being populated in 
  Elasticsearch/Wazuh Indexer.

known_false_positives: >
  No false positives have been identified at this time. Screen capture via PowerShell 
  GDI+ APIs is highly suspicious and rarely used in legitimate administrative 
  scenarios.

references:
  - https://twitter.com/_CERT_UA/status/1620781684257091584
  - https://cert.gov.ua/article/3761104

response:
  message: >
    PowerShell screen capture detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is capturing desktop screenshots for visual data exfiltration and 
    sensitive information theft. MITRE ATT&CK: T1113
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - APT37 Rustonotto and FadeStealer
    - Winter Vivern
    - Water Gamayun
    - BlankGrabber Stealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1113
  custom_tags:
    - screen_capture
    - gdi_plus
    - drawing_api
    - screenshot
    - data_exfiltration
    - infostealer
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*\[Drawing\.Graphics\]::FromImage.*/ OR data_win_eventdata_scriptBlockText:/.*Drawing\.Bitmap.*/ OR data_win_eventdata_scriptBlockText:/.*Graphics\.FromImage.*/) AND data_win_eventdata_scriptBlockText:/.*CopyFromScreen.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4a11f63-2390-411c-9adf-d791fd152830
    name: Windows Screen Capture with CopyFromScreen
    reason: Same CopyFromScreen GDI+ behaviour from another detection angle; co-fires on the same script block and confirms a screenshot-grabber rather than a one-off admin snippet
  - id: 34f90d3c-c297-49e9-b26d-911b05a4866c
    name: Powershell Keylogging
    reason: Infostealers such as FadeStealer and BlankGrabber pair screenshots with keystroke capture in the same PowerShell collection loop
  - id: windows-clipboard-data-get-clipboard-001
    name: Windows ClipBoard Data via Get-ClipBoard
    reason: Clipboard harvesting is the other passive user-surveillance collector bundled with screen capture in stealer scripts
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Stealers that screenshot the desktop also lift browser credential stores from the same session
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: Captured screenshots are typically zipped and staged by the same script before upload
  - id: b7a3c9a3-09ea-4934-8864-6a32cacd98d9
    name: Zip A Folder With PowerShell For Staging In Temp - PowerShell Script
    reason: Staging of the screenshot folder into a temp archive is the immediate precursor to exfiltration
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: Screenshots are commonly pushed to the C2 or bot API with Invoke-RestMethod right after capture
  - id: d6b0d627-d0bf-46b1-936f-c48284767d21
    name: Potential Telegram API Request Via CommandLine
    reason: Water Gamayun and similar stealers exfiltrate screenshots to Telegram bot endpoints as the follow-on step
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Screenshot file written to disk (image or archive in temp/user dirs)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Pp][Nn][Gg]|[Jj][Pp][Ee]?[Gg]|[Bb][Mm][Pp]|[Zz][Ii][Pp])/ AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].*/) AND data_win_eventdata_targetFilename:/.*([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]).*/
    pivot_on:
    - host
    window: 1h
  - name: 'Other PowerShell collection: clipboard, keylogging, browser data in script blocks'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]lipboard.*/ OR data_win_eventdata_scriptBlockText:/.*GetAsyncKeyState.*/ OR data_win_eventdata_scriptBlockText:/.*SetWindowsHookEx.*/ OR data_win_eventdata_scriptBlockText:/.*[Ll]ogin [Dd]ata.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_scriptBlockText:/.*ZipFile.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell upload of collected data (web client, REST, Telegram, Discord)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Uu]pload([Ss]tring|[Ff]ile|[Dd]ata).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*api\.telegram\.org.*/ OR data_win_eventdata_scriptBlockText:/.*discord(app)?\.com\/api\/webhooks.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]ultipart.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound DNS to exfil/bot services from PowerShell
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_queryName:*telegram* OR data_win_eventdata_queryName:*discord* OR data_win_eventdata_queryName:*pastebin* OR data_win_eventdata_queryName:*ngrok* OR data_win_eventdata_queryName:*transfer.sh* OR data_win_eventdata_queryName:*anonfiles*)
    pivot_on:
    - host
    window: 2h
  - name: Parent chain of the PowerShell that captured the screen (script/office/LOLBin launcher)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_parentImage:/.*([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Cc][Mm][Dd]).*/ OR data_win_eventdata_commandLine:/.*([Ee][Nn][Cc]|[Hh][Ii][Dd][Dd][Ee][Nn]|[Bb][Yy][Pp][Aa][Ss][Ss]).*/)
    pivot_on:
    - host
    window: 1h
