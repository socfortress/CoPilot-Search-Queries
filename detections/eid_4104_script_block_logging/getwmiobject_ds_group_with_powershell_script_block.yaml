name: Get-WmiObject Ds_Group with PowerShell Script Block
id: 67740bd3-1506-469c-b91d-effc322cc6e5
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-WmiObject` cmdlet with the 
  `DS_Group` parameter via PowerShell Script Block Logging (EventID 4104). This method 
  leverages WMI to query all domain groups. Monitoring this activity is crucial as 
  adversaries and Red Teams may use it for domain group enumeration, aiding in situational 
  awareness and Active Directory discovery. If confirmed malicious, this activity could 
  allow attackers to map out the domain structure, potentially leading to further 
  exploitation and privilege escalation within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-WmiObject*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*root\\directory\\ldap*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*ds_group*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-WmiObject cmdlet with DS_Group class targeting the 
  LDAP namespace. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell cmdlet for legitimate 
  troubleshooting and Active Directory group management. Filter based on user context 
  and whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1069/002/
  - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.management/get-wmiobject?view=powershell-5.1
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1069.002/T1069.002.md

response:
  message: >
    Get-WmiObject DS_Group LDAP query detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain group enumeration via WMI LDAP namespace/reconnaissance activity. 
    MITRE ATT&CK: T1069.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Permission Groups Discovery
    - Privilege Escalation
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.002
  custom_tags:
    - get_wmiobject
    - ds_group
    - ldap_namespace
    - group_enumeration
    - domain_groups
    - wmi_query
    - privilege_escalation
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-WmiObject.*/ AND data_win_eventdata_scriptBlockText:/.*root\\\\directory\\\\ldap.*/ AND data_win_eventdata_scriptBlockText:/.*ds_group.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 29b99201-723c-4118-847a-db2b3d3fb8ea
    name: Get-WmiObject Ds_Computer with PowerShell Script Block
    reason: Same WMI root directory ldap enumeration technique pointed at computers; operators typically enumerate groups, computers and users in one recon script
  - id: fabd364e-04f3-11ec-b34b-acde48001122
    name: Get-WmiObject Ds_User with PowerShell Script Block
    reason: Same WMI LDAP namespace query targeting DS_User; co-occurs when mapping accounts after domain groups
  - id: 69df7f7c-155d-11ec-a055-acde48001122
    name: Get-WMIObject Group Discovery with Script Block Logging
    reason: Overlapping Get-WmiObject group-discovery script block (Win32_Group) used as a local/domain group fallback by the same recon tooling
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Alternative PowerShell LDAP group enumeration (ADSISearcher) an operator switches to when the WMI path is blocked or for cross-checking
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: 'Natural follow-on: after listing all groups the attacker narrows to privileged groups (Domain Admins) via PowerView'
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: PowerView Get-DomainGroup performs the same group enumeration; indicates an offensive toolkit loaded in the same session
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Group enumeration is the precursor to or fallback for full AD graph collection with SharpHound
  - id: a87736a6-95cd-4728-8689-3c64d5026b3e
    name: Domain Group Discovery With Wmic
    reason: Same domain group discovery via WMI from the command line (wmic), the CLI twin of this PowerShell WMI query
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerShell AD/domain enumeration script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Ss]_[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ss]_[Cc]omputer.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain([Gg]roup|[Uu]ser|[Cc]omputer|[Cc]ontroller|[Tt]rust|[Gg]roup[Mm]ember).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd]([Gg]roup|[Uu]ser|[Cc]omputer|[Gg]roup[Mm]ember).*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]omain [Aa]dmins.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ystem\.[Dd]irectory[Ss]ervices.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: AD recon / graph collection tools executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ss]harp[Hh]ound|[Aa]d[Ff]ind|[Dd]squery|[Nn]ltest|[Ss]etspn|[Ll]difde|[Cc]svde)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss]harp[Hh]ound|[Bb]lood[Hh]ound|[Pp]ower[Vv]iew|[Aa]d[Ff]ind|[Nn]et1? group).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: PowerShell spawned with encoded/download-cradle commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload([Ss]tring|[Ff]ile).*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*-[Ww]indow[Ss]tyle [Hh]idden.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: LDAP/GC connections from scripting processes to domain controllers
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"3269") AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh|[Ww]mi[Pp]rv[Ss][Ee]|[Cc]md)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Follow-on credential access and lateral movement
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Kk]erberoast|[Ss]ekurlsa|[Mm]imikatz|[Pp]sexec|[Ee]nter-[Pp][Ss][Ss]ession|[Ii]nvoke-[Cc]ommand).*/ OR data_win_eventdata_image:/.*\\([Pp]s[Ee]xec|[Pp]rocdump)(64)?\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    - user
    window: 4h
