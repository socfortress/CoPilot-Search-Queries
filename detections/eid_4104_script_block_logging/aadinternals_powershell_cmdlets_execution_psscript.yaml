  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Nn][Vv][Ee][Rr][Tt][Tt][Oo]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Ii][Nn][Dd]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Rr][Aa][Nn][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Ii][Tt][Ii][Aa][Ll][Ii][Zz][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Jj][Oo][Ii][Nn]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Oo][Pp][Ee][Nn]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Aa][Dd]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ss][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ss][Oo][Ll][Vv][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ss][Tt][Oo][Rr][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Aa][Vv][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_even