correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c86500e9-a645-4680-98d7-f882c70c1ea3
    name: AADInternals PowerShell Cmdlets Execution - ProccessCreation
    reason: Same AADInternals cmdlets seen on a powershell.exe command line; confirms the module was invoked via -Command rather than only inside a script.
  - id: 846c7a87-8e14-4569-9d49-ecfd4276a01c
    name: DSInternals Suspicious PowerShell Cmdlets - ScriptBlock
    reason: DSInternals is the on-prem AD counterpart; operators pair AADInternals (cloud) with DSInternals (NTDS/hash extraction) to pivot from on-prem compromise to Entra ID.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: AADInternals is not preinstalled; a gallery install or download cradle fetching the module is the typical precursor.
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Browser credential and cookie theft supplies tokens/credentials later replayed with AADInternals token cmdlets.
  - id: 8a4519e8-e64a-40b6-ae85-ba8ad2177559
    name: Renamed BrowserCore.EXE Execution
    reason: BrowserCore.exe abuse extracts Entra Primary Refresh Token cookies, the same cloud identity-token theft AADInternals automates.
  - id: ff151c33-45fa-475d-af4f-c2f93571f4fe
    name: Azure AD Health Monitoring Agent Registry Keys Access
    reason: Reading Azure AD Connect Health agent registry keys is the on-host secret theft step abused alongside AADInternals sync-account attacks.
  - id: 5e38ded4-c964-41f4-8cb6-4a1a53c6929f
    name: Windows PowerShell Export Certificate
    reason: AADInternals relies on exporting device/user certificates and keys for PRT and device-cert forging; certificate export in the same session corroborates it.
  - id: 2d10095e-05ae-11ec-8fdf-acde48001122
    name: Exchange PowerShell Module Usage
    reason: AADInternals targets Office 365/Exchange Online; follow-on mailbox and tenant recon via Exchange modules extends the cloud intrusion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Module install / download cradle preceding AADInternals
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nstall-[Mm]odule.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]mport-[Mm]odule.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]owershell[Gg]allery.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell connections to Microsoft identity and Graph endpoints
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationHostname:*login.microsoftonline.com OR data_win_eventdata_destinationHostname:*graph.microsoft.com OR data_win_eventdata_destinationHostname:*graph.windows.net OR data_win_eventdata_destinationHostname:*enterpriseregistration.windows.net OR data_win_eventdata_destinationHostname:*outlook.office365.com)) OR (data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*login.microsoftonline.com OR data_win_eventdata_queryName:*graph.windows.net OR data_win_eventdata_queryName:*enterpriseregistration.windows.net))
    pivot_on:
    - host
    window: 2h
  - name: Certificate / key / token files written by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*([Pp]owershell|[Pp]wsh).*/ AND data_win_eventdata_targetFilename:/.*\.([Pp][Ff][Xx]|[Pp]12|[Cc][Ee][Rr]|[Pp][Ee][Mm]|[Kk][Ee][Yy]|[Jj][Ss][Oo][Nn]|[Cc][Ll][Ii][Xx][Mm][Ll])/
    pivot_on:
    - host
    window: 4h
  - name: Credential and token theft tooling or LSASS access
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Bb]rowser[Cc]ore|[Ss]harp[Dd][Pp][Aa][Pp][Ii]|[Mm]imikatz)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss]ekurlsa|[Pp]rt[Cc]ookie|[Ll]sadump|[Cc]omsvcs.*[Mm]ini[Dd]ump).*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll]sass\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Azure AD Connect / AAD registry access
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Aa]zure [Aa][Dd] [Cc]onnect|[Aa][Dd][Ss]ync|[Aa]zure[Aa][Dd]).*/
    pivot_on:
    - host
    window: 6h
