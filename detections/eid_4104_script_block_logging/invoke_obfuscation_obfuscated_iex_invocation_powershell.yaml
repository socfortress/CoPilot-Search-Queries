name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
version: 1
schema_version: "1.0"
date: "2022-12-31"
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the following code block \u2014. MITRE
  ATT&CK: T1027, T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - regexp:
                  data_win_eventdata_scriptBlockText: ".*(\\$PSHome\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$PSHome\\[).*"
              - regexp:
                  data_win_eventdata_scriptBlockText: ".*(\\$ShellId\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$ShellId\\[).*"
              - regexp:
                  data_win_eventdata_scriptBlockText: ".*(\\$env:Public\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$env:Public\\[).*"
              - regexp:
                  data_win_eventdata_scriptBlockText: ".*(\\$env:ComSpec\\[([ ]*[0-9]{1,3}[ ]*,){2}).*"
              - regexp:
                  data_win_eventdata_scriptBlockText: ".*(\\*mdr\\*[^A-Za-z0-9_][ ]*\\)\\.Name).*"
              - regexp:
                  data_win_eventdata_scriptBlockText: ".*(\\$VerbosePreference\\.ToString\\().*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches the regex /.*(\$PSHome\[[
  ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$PSHome\[).*/; data_win_eventdata_scriptBlockText
  matches the regex /.*(\$ShellId\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[
  ]*\$ShellId\[).*/; data_win_eventdata_scriptBlockText matches the regex
  /.*(\$env:Public\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$env:Public\[).*/, among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - obfuscated
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(\$PSHome\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$PSHome\[).*/ OR data_win_eventdata_scriptBlockText:/.*(\$ShellId\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$ShellId\[).*/ OR data_win_eventdata_scriptBlockText:/.*(\$env:Public\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$env:Public\[).*/ OR data_win_eventdata_scriptBlockText:/.*(\$env:ComSpec\[([ ]*[0-9]{1,3}[ ]*,){2}).*/ OR data_win_eventdata_scriptBlockText:/.*(\*mdr\*[^A-Za-z0-9_][ ]*\)\.Name).*/ OR data_win_eventdata_scriptBlockText:/.*(\$VerbosePreference\.ToString\().*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 20e5497e-331c-4cd5-8d36-935f6e2a9a07
    name: Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell
    reason: Same Invoke-Obfuscation framework; operators layer launchers (compress, IEX string reordering) in one payload, so a sibling variant on the host confirms toolkit use.
  - id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell
    reason: Another Invoke-Obfuscation launcher variant in script block logs; co-occurs when the obfuscated IEX is wrapped by a rundll32 launcher.
  - id: e55a5195-4724-480e-a77e-3ebe64bd3759
    name: Invoke-Obfuscation Via Use MSHTA - PowerShell
    reason: Invoke-Obfuscation MSHTA launcher variant; same obfuscated payload delivered through an alternate proxy-execution launcher.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Obfuscated IEX typically wraps a download cradle; the decoded layer logged as a separate script block reveals the payload being fetched.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: De-obfuscated IEX frequently runs a COM-object (MSXML/WinHttp) download cradle to stage the next stage.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Attackers disable AMSI around obfuscated IEX so the decoded payload is not scanned; same session indicates defence evasion.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: 'Common follow-on: the IEX-executed payload loads a .NET assembly in memory (fileless loader/implant).'
  - id: 907ac95c-4dd9-11ec-ba2c-acde48001122
    name: PowerShell Windows Defender Exclusion Commands
    reason: After script execution is obtained, attackers add Defender exclusions to protect dropped tooling.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradles and in-memory loaders in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/)
    pivot_on:
    - host
    window: 1h
  - name: AMSI bypass and script-logging tampering
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*amsiContext* OR data_win_eventdata_scriptBlockText:*ScriptBlockLogging* OR data_win_eventdata_scriptBlockText:*Set-MpPreference* OR data_win_eventdata_scriptBlockText:*Add-MpPreference*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell processes launched with encoded, hidden or bypass flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*[ ]-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww]indow[Ss]tyle[ ]+[Hh].*/ OR data_win_eventdata_commandLine:/.*[ ]-[Nn]o[Pp].*/ OR data_win_eventdata_commandLine:/.*[Bb]ypass.*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections initiated by PowerShell (payload staging / C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
  - name: Persistence and executable drops following script execution
    query: (data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_targetFilename:/.*\\[Ss]tartup\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt]asks\\.*/ OR data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|vbs|bat)/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/)
    pivot_on:
    - host
    window: 4h
