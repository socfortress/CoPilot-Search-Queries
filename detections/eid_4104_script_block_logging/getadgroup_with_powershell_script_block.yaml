name: Get-AdGroup with PowerShell Script Block
id: e4c73d68-794b-468d-b4d0-dac1772bbae7
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-AdGroup` PowerShell cmdlet 
  using PowerShell Script Block Logging (EventID 4104). This cmdlet is used to enumerate 
  all domain groups, which adversaries may exploit for situational awareness and Active 
  Directory discovery. Monitoring this activity is crucial as it can indicate 
  reconnaissance efforts within the network. If confirmed malicious, this behavior could 
  lead to further exploitation, such as privilege escalation or lateral movement, by 
  providing attackers with detailed information about the domain's group structure.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-ADGroup*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-ADGroup cmdlet, which is used for domain group 
  enumeration. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell cmdlet for legitimate 
  troubleshooting and group management purposes. Filter based on user context and 
  whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1069/002/
  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/get-adgroup?view=windowsserver2019-ps
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet

response:
  message: >
    Get-ADGroup execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain group enumeration/reconnaissance activity for privilege escalation planning. 
    MITRE ATT&CK: T1069.002
  risk_score: 45
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 45
    - field: data_win_eventdata_user
      type: user
      score: 45
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Scattered Lapsus$ Hunters
    - Active Directory Discovery
    - Permission Groups Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.002
  custom_tags:
    - get_adgroup
    - active_directory
    - group_enumeration
    - domain_groups
    - privilege_escalation
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-ADGroup.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: Same RSAT ActiveDirectory module being loaded/used in script blocks; Get-ADGroup is usually one of several AD-module cmdlets in the same recon session.
  - id: 21432e40-04f4-11ec-b7e6-acde48001122
    name: Get ADUser with PowerShell Script Block
    reason: 'Co-occurring user enumeration: operators typically run Get-ADGroup then Get-ADUser/Get-ADGroupMember to map who sits in each group.'
  - id: a9a1da02-8e27-4bf7-a348-f4389c9da487
    name: Get-AdComputer with PowerShell Script Block
    reason: Host-side companion in the same AD-module recon sweep; group and computer enumeration together indicate full domain mapping.
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: PowerView equivalent of Get-ADGroup; an attacker switching between native AD module and PowerView for group discovery points to offensive tooling rather than admin work.
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: 'Targeted follow-on: after listing all groups the attacker narrows to Domain Admins/Enterprise Admins to pick privilege escalation targets.'
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Same objective (domain group enumeration) via ADSI when the AD module is unavailable; indicates tooling fallback during the same recon.
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: ADRecon bulk-dumps groups, users, GPOs and trusts; a Get-ADGroup hit may be one slice of an automated full AD recon run.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: Escalation of group discovery into BloodHound attack-path collection, the usual next step toward privilege escalation and lateral movement.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD enumeration cmdlets in script blocks (users, computers, trusts, ACLs)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Gg]roup[Mm]ember.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Cc]omputer.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Tt]rust.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Oo]bject.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Dd]omain.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[A-Za-z]+.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss]earcher.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]irectory[Ss]earcher.*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Privileged group targeting (Domain/Enterprise Admins, AdminSDHolder)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]omain [Aa]dmins.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nterprise [Aa]dmins.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]chema [Aa]dmins.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dmin[Ss][Dd][Hh]older.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dmin[Cc]ount=1.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Aa][Dd][Gg]roup[Mm]ember.*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Discovery binaries and AD tooling process creation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Ee][Tt]1?|[Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Nn]et1? +group|[Nn]et1? +localgroup|[Dd]omain_trusts|[Dd]clist|[Bb]lood[Hh]ound|[Ss]harp[Hh]ound).*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: PowerShell download cradles, encoded commands or tool imports in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]mport-[Mm]odule.*([Pp]ower[Vv]iew|[Aa]d[Rr]econ|[Pp]ower[Ss]ploit).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu]tils.*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Follow-on Kerberos and lateral movement tooling (Rubeus, Mimikatz, Invoke-Command, remote exec)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]ubeus.*/ OR data_win_eventdata_scriptBlockText:/.*[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/)
    pivot_on:
    - host
    - user
    window: 6h
