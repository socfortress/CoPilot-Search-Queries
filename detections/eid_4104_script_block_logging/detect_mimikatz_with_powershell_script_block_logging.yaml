name: Detect Mimikatz With PowerShell Script Block Logging
id: 8148c29c-c952-11eb-9255-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of Mimikatz commands via PowerShell 
  by leveraging PowerShell Script Block Logging (EventID 4104). This method captures 
  and logs the full command sent to PowerShell, allowing for the identification of 
  suspicious activities such as Pass the Ticket, Pass the Hash, and credential dumping. 
  This activity is significant as Mimikatz is a well-known tool used for credential 
  theft and lateral movement. If confirmed malicious, this could lead to unauthorized 
  access, privilege escalation, and potential compromise of sensitive information 
  within the environment.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*mimikatz*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*sekurlsa::pth*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*kerberos::ptt*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*kerberos::golden*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for specific Mimikatz command patterns including sekurlsa::pth 
  (Pass the Hash), kerberos::ptt (Pass the Ticket), and kerberos::golden (Golden 
  Ticket generation). Mimikatz is a legitimate pen-testing tool but is frequently 
  abused by attackers for credential theft and lateral movement.

known_false_positives: >
  False positives should be limited as the commands being identified are quite specific 
  to EventID 4104 and Mimikatz. Filter as needed based on authorized red team exercises 
  or legitimate pen-testing activities.

references:
  - https://github.com/gentilkiwi/mimikatz
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    The following behavior was identified and typically related to Mimikatz being 
    loaded within the context of PowerShell on $agent_name$ by user $data_win_eventdata_user$. 
    Script: $data_win_eventdata_scriptBlockText$. 
    This indicates credential dumping or lateral movement activity. MITRE ATT&CK: T1003, T1059.001
  risk_score: 85
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 85
    - field: data_win_eventdata_user
      type: user
      score: 85
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Hellcat Ransomware
    - Malicious PowerShell
    - Hermetic Wiper
    - Sandworm Tools
    - CISA AA22-264A
    - CISA AA22-320A
    - CISA AA23-347A
    - Data Destruction
    - Scattered Spider
    - Credential Dumping
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
    - T1059.001
  custom_tags:
    - mimikatz
    - sekurlsa
    - kerberos
    - pass_the_hash
    - pass_the_ticket
    - golden_ticket
    - credential_dumping
    - lateral_movement
    - powershell
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*mimikatz.*/ OR data_win_eventdata_scriptBlockText:/.*sekurlsa::pth.*/ OR data_win_eventdata_scriptBlockText:/.*kerberos::ptt.*/ OR data_win_eventdata_scriptBlockText:/.*kerberos::golden.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Same in-memory PowerShell Mimikatz loader seen through different script-block markers (reflective PE load, Invoke-Mimikatz); co-fires on the same host and confirms the tool actually ran.
  - id: 84c174ab-d3ef-481f-9c86-a50d0b8e3edb
    name: PowerShell Get-Process LSASS in ScriptBlock
    reason: Attacker locating the lsass PID in PowerShell is the usual precursor to sekurlsa::logonpasswords / in-memory credential dumping.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Invoke-Mimikatz is normally pulled via a download cradle (IEX DownloadString) just before it is executed; this shows the staging step.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: AMSI must be patched before an in-memory Mimikatz script can run without being blocked, so a bypass block usually precedes this alert.
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: Fallback credential theft on the same host if the Mimikatz script is blocked, or parallel LSASS dumping for offline cracking.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Sysmon EID 10 LSASS access with dumping access masks is the host-level proof that the script's sekurlsa module read credentials.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Mimikatz run as a binary with the same module syntax (sekurlsa/kerberos) on the same host: attacker switching from script to exe or running both.'
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: kerberos::ptt/golden in the script block is the follow-on to ticket forging; command-line variant shows the ticket being injected for lateral movement.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access with credential-dump access masks
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1438" OR data_win_eventdata_grantedAccess:"0x143a" OR data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x40")
    pivot_on:
    - host
    window: 1h
  - name: Mimikatz module keywords in other script blocks (sekurlsa, lsadump, DCSync)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download cradle and AMSI bypass staging before the script ran
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/)
    pivot_on:
    - host
    window: 1h
  - name: Network logons and explicit-credential use by this account (pass-the-hash/ticket)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 6h
  - name: Remote execution and ticket-request tooling spawned on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Pp][Ss][Ee][Xx][Ee][Cc].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)
    pivot_on:
    - host
    window: 2h
