name: Potential Persistence Via PowerShell User Profile Using Add-Content
id: 05b3e303-faf0-4f4a-9b30-46cc13e69152
version: 1
schema_version: "1.0"
date: "2023-05-04"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 05b3e303-faf0-4f4a-9b30-46cc13e69152
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects calls to "Add-Content" cmdlet in order to modify the content of the
  user profile and potentially adding suspicious commands for persistence. MITRE
  ATT&CK: T1546.013.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Add-Content $profile*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Value \"IEX *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Value \"Invoke-Expression*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Value \"Invoke-WebRequest*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Value \"Start-Process*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Value 'IEX *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Value 'Invoke-Expression*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Value 'Invoke-WebRequest*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Value 'Start-Process*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Add-Content $profile*';
  data_win_eventdata_scriptBlockText matches '*-Value "IEX *';
  data_win_eventdata_scriptBlockText matches '*-Value "Invoke-Expression*',
  among other conditions.

known_false_positives: >
  Legitimate administration and tuning scripts that aim to add functionality to
  a user PowerShell session. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.013/T1546.013.md
  - https://attack.mitre.org/techniques/T1546/013/

response:
  message: >
    Potential Persistence Via PowerShell User Profile Using Add-Content detected
    on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1546.013
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.013
  custom_tags:
    - persistence
    - powershell
    - profile
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt] \$[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ AND (data_win_eventdata_scriptBlockText:/.*-[Vv][Aa][Ll][Uu][Ee] \"[Ii][Ee][Xx] .*/ OR data_win_eventdata_scriptBlockText:/.*-[Vv][Aa][Ll][Uu][Ee] \"[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*-[Vv][Aa][Ll][Uu][Ee] \"[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*-[Vv][Aa][Ll][Uu][Ee] \"[Ss][Tt][Aa][Rr][Tt]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Vv][Aa][Ll][Uu][Ee] '[Ii][Ee][Xx] .*/ OR data_win_eventdata_scriptBlockText:/.*-[Vv][Aa][Ll][Uu][Ee] '[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*-[Vv][Aa][Ll][Uu][Ee] '[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*-[Vv][Aa][Ll][Uu][Ee] '[Ss][Tt][Aa][Rr][Tt]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b5b78988-486d-4a80-b991-930eff3ff8bf
    name: PowerShell Profile Modification
    reason: 'Same persistence seen through the file system: the Add-Content write to $profile should land as a profile.ps1 file create/modify (Sysmon 11), confirming the write happened.'
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: The stager appended to the profile is an IEX/Invoke-Expression string; obfuscated IEX in script blocks shows the planted command is being concealed.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Profile payloads with Invoke-WebRequest/IEX are download cradles that fetch the next stage on every PowerShell start.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: Alternative download-cradle technique the planted profile command or later script blocks may use to fetch payloads.
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: Operators often add a scheduled task beside the profile hook so the implant survives profile cleanup.
  - id: 9e07f6e7-83aa-45c6-998e-0af26efd0a85
    name: Powershell WMI Persistence
    reason: Co-occurring PowerShell-based persistence (WMI subscription) set up by the same actor for redundancy.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: After planting persistence the actor often adds Defender exclusions so the profile-launched payload is not scanned.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: 'Defense-evasion follow-on: blinding PowerShell telemetry so later profile-triggered runs go unlogged.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell profile script file written or modified
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Ff][Ii][Ll][Ee]\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/)
    pivot_on:
    - host
    window: 1h
  - name: Other profile-write methods and profile path references in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Ll][Ll][Uu][Ss][Ee][Rr][Ss][Aa][Ll][Ll][Hh][Oo][Ss][Tt][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Uu][Ss][Ee][Rr][Aa][Ll][Ll][Hh][Oo][Ss][Tt][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*([Ss][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt]|[Oo][Uu][Tt]-[Ff][Ii][Ll][Ee]|[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm]) \$[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download cradles and encoded commands in PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt].[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell outbound network connections or DNS lookups (profile payload beaconing)
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: PowerShell security tampering (Defender exclusions, execution policy, history/ETW disable)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Ss][Ee][Tt][Ww].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/)
    pivot_on:
    - host
    window: 2h
