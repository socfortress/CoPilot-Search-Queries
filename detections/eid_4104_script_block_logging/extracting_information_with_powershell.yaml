name: Extracting Information with PowerShell
id: bd5971a7-626d-46ab-8176-ed643f694f68
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bd5971a7-626d-46ab-8176-ed643f694f68
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may search local file systems and remote file shares for files
  containing insecurely stored credentials. These can be files created by users
  to store their own credentials, shared credential stores for a group of
  individuals, configuration files containing passwords for a system or service,
  or source code/binary files containing embedded passwords. MITRE ATT&CK:
  T1552.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*ls*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "* -R*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*select-string *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Pattern *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*ls*';
  data_win_eventdata_scriptBlockText matches '* -R*';
  data_win_eventdata_scriptBlockText matches '*select-string *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.001/T1552.001.md
  - https://attack.mitre.org/techniques/T1552/001/

response:
  message: >
    Extracting Information with PowerShell detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1552.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.001
  custom_tags:
    - extracting
    - information
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ll][Ss].*/ AND data_win_eventdata_scriptBlockText:/.* -[Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Ll][Ee][Cc][Tt]-[Ss][Tt][Rr][Ii][Nn][Gg] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Tt][Ee][Rr][Nn] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: Same script-block hunting for sensitive files; the recursive Select-String credential grep usually follows or accompanies file discovery by PowerShell.
  - id: 603c6630-5225-49c1-8047-26c964553e0e
    name: Enumerate Credentials from Windows Credential Manager With PowerShell
    reason: 'Parallel T1552 credential harvesting: after grepping files for plaintext secrets, operators also enumerate the Credential Manager vault from PowerShell.'
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: Escalation from searching for stored passwords to dumping the vault; confirms credential-theft intent.
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Companion Atomic T1552 technique that searches the registry for passwords, run alongside the file-system credential search.
  - id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
    name: Findstr GPP Passwords
    reason: 'Same goal via findstr: recursive string search of SYSVOL/share files for cpassword/credentials; shows the attacker switching tools for the same hunt.'
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: a download cradle in script blocks that staged the PowerShell tooling later used to grep for secrets.'
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: 'Follow-on: files and secrets found by the search are compressed into an archive for staging before exfiltration.'
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: 'Follow-on: credential files or matched lines found by the search are posted out with Invoke-RestMethod.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential-file collection and staging in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]opy-[Ii]tem.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]ontent.*/) AND (data_win_eventdata_scriptBlockText:/.*[Pp]assw.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]redential.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ecret.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Kk][Ee][Yy][Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]nattend.*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential Manager, DPAPI and secure-string access from PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]red[Rr]ead.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]assword[Vv]ault.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]rotected[Dd]ata.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]onvert[Tt]o-[Ss]ecure[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]redential.*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential-store tools and recursive secret greps via process creation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff]indstr.*(\/[Ss]|\/[Ii]).*[Pp]assw.*/ OR data_win_eventdata_commandLine:/.*[Cc]md[Kk]ey.*/ OR data_win_eventdata_commandLine:/.*[Vv]ault[Cc]md.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg.*[Qq]uery.*\/[Ff].*[Pp]assw.*/ OR data_win_eventdata_commandLine:/.*[Ll]aZagne.*/ OR data_win_eventdata_commandLine:/.*[Ss]afety[Kk]atz.*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential-file or archive staging in temp/public paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Tt]emp\\.*\.([Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz]|[Tt][Xx][Tt]|[Cc][Ss][Vv])/ OR data_win_eventdata_targetFilename:/.*\\[Pp]ublic\\.*\.([Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz]|[Tt][Xx][Tt]|[Cc][Ss][Vv])/ OR data_win_eventdata_targetFilename:/.*[Pp]assw.*/ OR data_win_eventdata_targetFilename:/.*[Cc]red.*\.([Tt][Xx][Tt]|[Cc][Ss][Vv]|[Xx][Mm][Ll])/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell exfiltration of findings over the network
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]end-[Mm]ail[Mm]essage.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*-[Mm]ethod.*[Pp]ost.*/)) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.exe/)
    pivot_on:
    - host
    window: 1h
