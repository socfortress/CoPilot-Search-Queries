name: Windows Gather Victim Host Information Camera
id: e4df4676-ea41-4397-b160-3ee0140dc332
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects PowerShell scripts that enumerate camera devices on the targeted host
  using Win32_PnPEntity WMI queries filtering by PNPClass for Image or Camera
  devices. This activity is commonly observed in DCRat (Dark Crystal RAT) malware
  which collects camera data to send to its C2 server. Detecting this behavior
  may indicate an attempt to gather sensitive visual information from the host,
  potentially leading to privacy breaches or further exploitation.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Win32_PnPEntity*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*SELECT*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*WHERE*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*PNPClass*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Image*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Camera*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators may execute this PowerShell command to get hardware information
  related to cameras on endpoints for legitimate inventory or troubleshooting
  purposes. Review the user context and frequency to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1592/001/
  - https://cert.gov.ua/article/405538
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.dcrat
  - https://www.mandiant.com/resources/analyzing-dark-crystal-rat-backdoor

response:
  message: >
    PowerShell camera enumeration via Win32_PnPEntity detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1592.001
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
    - field: data_win_eventdata_user
      type: user
      score: 42
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - DarkCrystal RAT
  asset_type: Endpoint
  mitre_attack_id:
    - T1592.001
  custom_tags:
    - dcrat
    - camera_enumeration
    - wmi
    - win32_pnpentity
    - hardware_discovery
    - rat
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Win32_PnPEntity.*/ AND data_win_eventdata_scriptBlockText:/.*SELECT.*/ AND data_win_eventdata_scriptBlockText:/.*WHERE.*/ AND data_win_eventdata_scriptBlockText:/.*PNPClass.*/ AND (data_win_eventdata_scriptBlockText:/.*Image.*/ OR data_win_eventdata_scriptBlockText:/.*Camera.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: DCRat commonly launches its PowerShell host-recon stagers via -enc; this is the likely precursor process that produced the camera-enumeration script block
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: DCRat stager runs PowerShell with execution policy bypass before running its WMI hardware-discovery scripts
  - id: 76753bab-f116-4ea3-8fb9-89b638be58a9
    name: Windows Ingress Tool Transfer Using Explorer
    reason: DarkCrystal RAT delivery step that drops the payload which later runs the camera enumeration
  - id: 1816994b-42e1-4fb1-afd2-134d88184f71
    name: PowerShell Base64 Encoded WMI Classes
    reason: Win32_PnPEntity queries are WMI class lookups; an encoded variant indicates the same recon hidden from command-line logging
  - id: 932fb0d8-692b-4b0f-a26e-5643a50fe7d6
    name: Audio Capture via PowerShell
    reason: Camera discovery is the first step of surveillance collection; microphone capture is the sibling RAT capability following device enumeration
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: 'Visual data collection follow-on: after confirming camera/display hardware the operator captures screen content'
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Co-occurring DCRat input-collection capability run from PowerShell on the same host and user
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: RAT that finished host profiling typically establishes Run-key persistence next
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other WMI hardware/host inventory script blocks (DCRat host profiling)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Win32_(PnPEntity|VideoController|SoundDevice|ComputerSystem|BIOS|Processor|DiskDrive|OperatingSystem|NetworkAdapterConfiguration).*/ OR data_win_eventdata_scriptBlockText:/.*Get-(WmiObject|CimInstance|PnpDevice).*/)
    pivot_on:
    - host
    window: 1h
  - name: Media capture APIs in script blocks (webcam, audio, screen)
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(avicap32|capCreateCaptureWindow|winmm|mciSendString|CopyFromScreen|Get-Clipboard|GetAsyncKeyState|SetWindowsHookEx).*/
    pivot_on:
    - host
    - user
    window: 2h
  - name: PowerShell launched with encoded/hidden/bypass arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:/.*(-[Ee]nc|-[Ee]ncodedcommand|-[Ww]indowstyle hidden|-[Ww] hidden|-[Ee]xecutionpolicy bypass|-[Ee][Pp] bypass|-[Nn]o[Pp]).*/
    pivot_on:
    - host
    - user
    window: 1h
  - name: PowerShell or dropped binary beaconing outbound (RAT C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*\\(AppData|Temp|ProgramData|Public)\\.*/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Run-key or startup-folder persistence written by script host
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*CurrentVersion\\Run.*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*Start Menu\\Programs\\Startup.*/)
    pivot_on:
    - host
    window: 4h
