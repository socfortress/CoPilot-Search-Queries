name: Potential APT FIN7 POWERHOLD Execution
id: 71c432c4-e4da-4eab-ba49-e60ea9a81bca
version: 1
schema_version: "1.0"
date: "2023-05-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 71c432c4-e4da-4eab-ba49-e60ea9a81bca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the POWERHOLD script seen used by FIN7 as reported by
  WithSecureLabs. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*$env:APPDATA*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*function MainPayload*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*::WriteAllBytes*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*wscript.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*$env:APPDATA*';
  data_win_eventdata_scriptBlockText matches '*function MainPayload*';
  data_win_eventdata_scriptBlockText matches '*::WriteAllBytes*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Potential APT FIN7 POWERHOLD Execution detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powerhold
    - powershell
    - execution
    - g0046
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\$[Ee][Nn][Vv]:[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/ AND data_win_eventdata_scriptBlockText:/.*[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn] [Mm][Aa][Ii][Nn][Pp][Aa][Yy][Ll][Oo][Aa][Dd].*/ AND data_win_eventdata_scriptBlockText:/.*::[Ww][Rr][Ii][Tt][Ee][Aa][Ll][Ll][Bb][Yy][Tt][Ee][Ss].*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ac175779-025a-4f12-98b0-acdaeb77ea85
    name: PowerShell Script Run in AppData
    reason: POWERHOLD is a PowerShell stager staged from %APPDATA%; a process-creation view of the same script launch location
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: POWERHOLD writes a JScript payload with WriteAllBytes and runs it via wscript.exe; this catches that dropped-script launch
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: The dropped payload is run by wscript.exe and often carries a non-standard extension to evade script-type filtering
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The wscript-hosted payload typically spawns PowerShell/cmd/rundll32 as the next stage of the FIN7 chain
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: POWERHOLD persists the AppData-dropped script via a scheduled task, so a schtasks entry pointing at AppData is the expected follow-on
  - id: d55b793d-f847-4eea-b59a-5ab09908ac90
    name: Suspicious Child Process Of Veeam Dabatase
    reason: WithSecure reported this FIN7 tooling in intrusions on Veeam servers; shell children of the Veeam SQL database confirm that vector
  - id: b57ba453-b384-4ab9-9f40-1038086b4e53
    name: VeeamBackup Database Credentials Dump Via Sqlcmd.EXE
    reason: After foothold on a Veeam server FIN7 harvests stored backup credentials from the VeeamBackup database
  - id: 696bfb54-227e-4602-ac5b-30d9d2053312
    name: Veeam Backup Database Suspicious Query
    reason: Direct queries of Veeam's credential tables are the post-execution objective on the Veeam hosts FIN7 targeted
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wscript/cscript launching a script from AppData or Temp
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[WwCc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/)
    pivot_on:
    - host
    window: 1h
  - name: Script or executable files written to AppData by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*\.([Jj][Ss]|[Jj][Ss][Ee]|[Vv][Bb][Ss]|[Ww][Ss][Ff]|[Dd][Ll][Ll]|[Ee][Xx][Ee]|[Pp][Ss]1)/
    pivot_on:
    - host
    window: 2h
  - name: Scheduled task or Run key persistence pointing to AppData
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND data_win_eventdata_details:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from wscript/cscript (C2 beaconing)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[WwCc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Veeam database or service processes spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]|[Vv][Ee][Ee][Aa][Mm]).*/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
