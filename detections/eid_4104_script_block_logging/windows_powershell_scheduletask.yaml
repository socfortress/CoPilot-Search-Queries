name: Windows PowerShell ScheduleTask
id: ddf82fcb-e9ee-40e3-8712-a50b5bf323fc
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects potentially malicious use of PowerShell task scheduling cmdlets
  including New-ScheduledTask, New-ScheduledTaskAction, New-ScheduledTaskSettingsSet,
  New-ScheduledTaskTrigger, Register-ScheduledTask, Set-ScheduledTask,
  Start-ScheduledTask, and Enable-ScheduledTask. Attackers commonly use these
  cmdlets for persistence and remote execution of malicious code. This technique
  is used by Scattered Spider and other threat actors to maintain access, deliver
  additional payloads, or execute ransomware.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*New-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Register-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Set-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Start-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Enable-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Register-ClusteredScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Set-ClusteredScheduledTask*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Benign administrative tasks such as scheduled maintenance scripts and
  legitimate automation workflows may trigger this detection. Establish a
  baseline of normal scheduled task creation activity and tune accordingly.
  Review the task name, action, and user context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn.microsoft.com/en-us/powershell/module/scheduledtasks/
  - https://thedfirreport.com/2023/06/12/a-truly-graceful-wipe-out/

response:
  message: >
    PowerShell scheduled task cmdlet detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1053.005, T1059.001
  risk_score: 25
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 25
    - field: data_win_eventdata_user
      type: user
      score: 25
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Scheduled Tasks
    - Scattered Spider
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1059.001
  custom_tags:
    - scheduled_task
    - persistence
    - powershell
    - scattered_spider
    - register_scheduledtask
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*New-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Register-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Set-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Start-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Enable-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Register-ClusteredScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Set-ClusteredScheduledTask.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: Sibling 4104 detection for the same task-creation cmdlets; co-firing on the same script block confirms the task is being registered, not merely referenced.
  - id: windows-scheduled-task-created-spawn-shell-001
    name: Windows Scheduled Task Created to Spawn Shell
    reason: Reveals whether the registered task action launches cmd/powershell, i.e. the persistence payload the cmdlet just installed.
  - id: windows-scheduled-task-created-public-path-001
    name: Windows Scheduled Task Created Within Public Path
    reason: Task action pointing at a world-writable path such as C:\Users\Public indicates a dropped payload being persisted.
  - id: 47c69803-2c09-408b-b40a-063c064cbb16
    name: Windows PowerShell WMI Win32 ScheduledJob
    reason: Alternate PowerShell route to scheduled execution (Win32_ScheduledJob); attackers switch between ScheduledTasks cmdlets and WMI on the same host.
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Register-ScheduledTask writes the task XML to System32\Tasks; a file write by an unusual process confirms on-disk persistence.
  - id: 4720b7df-40c3-48fd-bbdf-fd4b3c464f0d
    name: Scheduled TaskCache Change by Uncommon Program
    reason: Registering a task populates the TaskCache registry; an uncommon writer corroborates the cmdlet registration.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: 'Common companion step: attacker excludes the payload path from Defender before scheduling it to run.'
  - id: fa2559c8-1197-471d-9cdd-05a0273d4522
    name: Potential AMSI Bypass Script Using NULL Bits
    reason: Scripts that register tasks from a malicious loader often first blind AMSI in the same PowerShell session.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task creation via schtasks/at or Security 4698/4702 on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\/[Cc][Rr][Ee][Aa][Tt][Ee]|\/[Cc][Hh][Aa][Nn][Gg][Ee]|\/[Rr][Uu][Nn]).*/) OR data_win_system_eventID:"4698" OR data_win_system_eventID:"4702"
    pivot_on:
    - host
    window: 4h
  - name: Task XML or payload files written to Tasks dirs and user-writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss])/ OR data_win_eventdata_targetFilename:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss])/)
    pivot_on:
    - host
    window: 4h
  - name: Script blocks with download cradles, encoded payloads or AMSI tampering on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Child processes launched by the PowerShell session or task host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]?\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa]|[Ww][Mm][Ii][Cc]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Nn][Ee][Tt]|[Ww][Hh][Oo][Aa][Mm][Ii])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Network connections from PowerShell or script interpreters
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
