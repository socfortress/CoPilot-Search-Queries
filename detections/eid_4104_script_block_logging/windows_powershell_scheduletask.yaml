name: Windows PowerShell ScheduleTask
id: ddf82fcb-e9ee-40e3-8712-a50b5bf323fc
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects potentially malicious use of PowerShell task scheduling cmdlets
  including New-ScheduledTask, New-ScheduledTaskAction, New-ScheduledTaskSettingsSet,
  New-ScheduledTaskTrigger, Register-ScheduledTask, Set-ScheduledTask,
  Start-ScheduledTask, and Enable-ScheduledTask. Attackers commonly use these
  cmdlets for persistence and remote execution of malicious code. This technique
  is used by Scattered Spider and other threat actors to maintain access, deliver
  additional payloads, or execute ransomware.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*New-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Register-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Set-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Start-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Enable-ScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Register-ClusteredScheduledTask*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Set-ClusteredScheduledTask*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Benign administrative tasks such as scheduled maintenance scripts and
  legitimate automation workflows may trigger this detection. Establish a
  baseline of normal scheduled task creation activity and tune accordingly.
  Review the task name, action, and user context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn.microsoft.com/en-us/powershell/module/scheduledtasks/
  - https://thedfirreport.com/2023/06/12/a-truly-graceful-wipe-out/

response:
  message: >
    PowerShell scheduled task cmdlet detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1053.005, T1059.001
  risk_score: 25
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 25
    - field: data_win_eventdata_user
      type: user
      score: 25
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Scheduled Tasks
    - Scattered Spider
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1059.001
  custom_tags:
    - scheduled_task
    - persistence
    - powershell
    - scattered_spider
    - register_scheduledtask
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*New-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Register-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Set-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Start-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Enable-ScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Register-ClusteredScheduledTask.*/ OR data_win_eventdata_scriptBlockText:/.*Set-ClusteredScheduledTask.*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 8148c29c-c952-11eb-9255-acde48001122
      name: "Detect Mimikatz With PowerShell Script Block Logging"
      reason: "same analytic story: Scattered Spider"
    - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
      name: "Detect Remote Access Software Usage FileInfo"
      reason: "same analytic story: Scattered Spider"
    - id: 2d10095e-05ae-11ec-8fdf-acde48001122
      name: "Exchange PowerShell Module Usage"
      reason: "same analytic story: Scattered Spider"
    - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
      name: "Malicious PowerShell Process - Encoded Command"
      reason: "same analytic story: Scattered Spider"
    - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
      name: "Possible Lateral Movement PowerShell Spawn"
      reason: "same analytic story: Scheduled Tasks"
    - id: 018c1972-ca07-11eb-9473-acde48001122
      name: "Recon Using WMI Class"
      reason: "same analytic story: Scattered Spider"
    - id: 12c80db8-ef62-4456-92df-b23e1b3219f6
      name: "Windows Enable Win32 ScheduledJob via Registry"
      reason: "same analytic story: Scheduled Tasks"
    - id: windows-mimikatz-binary-execution-001
      name: "Windows Mimikatz Binary Execution"
      reason: "same analytic story: Scattered Spider"
    - id: windows-powershell-4104-hunting-001
      name: "Windows PowerShell 4104 Hunting"
      reason: "same analytic story: Scattered Spider"
    - id: windows-scheduled-task-created-public-path-001
      name: "Windows Scheduled Task Created Within Public Path"
      reason: "same analytic story: Scheduled Tasks"
    - id: windows-scheduled-task-created-spawn-shell-001
      name: "Windows Scheduled Task Created to Spawn Shell"
      reason: "same analytic story: Scheduled Tasks"
    - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
      name: "7Zip Compressing Dump Files"
      reason: "next kill-chain tactic: Collection"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Download / AMSI-bypass / encoded script blocks on this host"
      query: 'data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/)'
      pivot_on: [host]
      window: 1h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Scheduled-task / service / account creation on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|\\[Ss][Cc]\.[Ee][Xx][Ee]|\\[Aa][Tt]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/)) OR (data_win_system_eventID:"4698" OR data_win_system_eventID:"7045")'
      pivot_on: [host]
      window: 4h
