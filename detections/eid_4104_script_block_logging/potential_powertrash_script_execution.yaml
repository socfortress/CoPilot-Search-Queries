name: Potential POWERTRASH Script Execution
id: 4e19528a-f081-40dd-be09-90c39352bd64
version: 1
schema_version: "1.0"
date: "2023-05-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4e19528a-f081-40dd-be09-90c39352bd64
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential execution of the PowerShell script POWERTRASH. MITRE ATT&CK:
  T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*IO.Compression.DeflateStream*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*IO.MemoryStream*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*::FromBase64String*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*GetDelegateForFunctionPointer*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.Invoke()*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*GlobalAssemblyCache*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*IO.Compression.DeflateStream*';
  data_win_eventdata_scriptBlockText matches '*IO.MemoryStream*';
  data_win_eventdata_scriptBlockText matches '*::FromBase64String*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Potential POWERTRASH Script Execution detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powertrash
    - powershell
    - execution
    - g0046
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ii][Oo]\.[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]\.[Dd][Ee][Ff][Ll][Aa][Tt][Ee][Ss][Tt][Rr][Ee][Aa][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*[Ii][Oo]\.[Mm][Ee][Mm][Oo][Rr][Yy][Ss][Tt][Rr][Ee][Aa][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*::[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ff][Oo][Rr][Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn][Pp][Oo][Ii][Nn][Tt][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Ii][Nn][Vv][Oo][Kk][Ee]\(\).*/ AND data_win_eventdata_scriptBlockText:/.*[Gg][Ll][Oo][Bb][Aa][Ll][Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy][Cc][Aa][Cc][Hh][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: 'Same in-memory loader tradecraft: base64-decoded .NET assembly reflectively loaded from PowerShell, as POWERTRASH does with FromBase64String + DeflateStream'
  - id: d55b793d-f847-4eea-b59a-5ab09908ac90
    name: Suspicious Child Process Of Veeam Dabatase
    reason: POWERTRASH was used by FIN7 against Veeam servers; a shell spawned by the Veeam SQL service is the likely precursor/delivery path
  - id: 696bfb54-227e-4602-ac5b-30d9d2053312
    name: Veeam Backup Database Suspicious Query
    reason: 'FIN7 Veeam-targeting chain: querying the Veeam DB for stored credentials around the time the loader runs'
  - id: b57ba453-b384-4ab9-9f40-1038086b4e53
    name: VeeamBackup Database Credentials Dump Via Sqlcmd.EXE
    reason: Veeam credential dumping is the objective of the FIN7 activity that drops POWERTRASH loaders
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Operators commonly add Defender exclusions before or after staging the in-memory payload the loader launches
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: AMSI scanning of the decompressed in-memory payload frequently surfaces a Defender detection alongside the script block
  - id: 99b97608-3e21-4bfe-8217-2a127c396a0e
    name: Remote Thread Creation Via PowerShell In Uncommon Target
    reason: GetDelegateForFunctionPointer shellcode execution is often followed by PowerShell injecting a remote thread into another process
  - id: 4508a70e-97ef-4300-b62b-ff27992990ea
    name: DotNet CLR DLL Loaded By Scripting Applications
    reason: The loader runs managed code in-process, so CLR image loads by the scripting host appear around the same time
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reflective assembly load / unmanaged delegate in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]ssembly\]::[Ll]oad.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal.*[Gg]et[Dd]elegate.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Tt]ype.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell injecting into or accessing other processes
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND (data_win_eventdata_sourceImage:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_sourceImage:/.*[Pp]wsh.*/)
    pivot_on:
    - host
    window: 1h
  - name: Shells spawned by Veeam / SQL Server services
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ss]ql[Ss]erv[Rr].*/ OR data_win_eventdata_parentImage:/.*[Vv]eeam.*/) AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ss]qlcmd.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound network connections (payload staging / C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
  - name: Defender tampering and credential tooling via PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Vv]eeam.*[Cc]redential.*/ OR data_win_eventdata_commandLine:/.*[Ss]qlcmd.*[Vv]eeam.*/)
    pivot_on:
    - host
    window: 4h
