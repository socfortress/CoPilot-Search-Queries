name: Powershell Timestomp
id: c6438007-e081-42ce-9483-b067fbef33c3
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c6438007-e081-42ce-9483-b067fbef33c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may modify file time attributes to hide new or changes to existing
  files. Timestomping is a technique that modifies the timestamps of a file (the
  modify, access, create, and change times), often to mimic files that are in
  the same folder. MITRE ATT&CK: T1070.006.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.CreationTime =*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.LastWriteTime =*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.LastAccessTime =*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*[IO.File]::SetCreationTime*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*[IO.File]::SetLastAccessTime*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*[IO.File]::SetLastWriteTime*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*.CreationTime =*';
  data_win_eventdata_scriptBlockText matches '*.LastWriteTime =*';
  data_win_eventdata_scriptBlockText matches '*.LastAccessTime =*', among other
  conditions.

known_false_positives: >
  Legitimate admin script. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.006/T1070.006.md
  - https://www.offensive-security.com/metasploit-unleashed/timestomp/
  - https://attack.mitre.org/techniques/T1070/006/

response:
  message: >
    Powershell Timestomp detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1070.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.006
  custom_tags:
    - powershell
    - timestomp
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*\.[Cc][Rr][Ee][Aa][Tt][Ii][Oo][Nn][Tt][Ii][Mm][Ee] =.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Ll][Aa][Ss][Tt][Ww][Rr][Ii][Tt][Ee][Tt][Ii][Mm][Ee] =.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Ll][Aa][Ss][Tt][Aa][Cc][Cc][Ee][Ss][Ss][Tt][Ii][Mm][Ee] =.*/ OR data_win_eventdata_scriptBlockText:/.*\[[Ii][Oo]\.[Ff][Ii][Ll][Ee]\]::[Ss][Ee][Tt][Cc][Rr][Ee][Aa][Tt][Ii][Oo][Nn][Tt][Ii][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*\[[Ii][Oo]\.[Ff][Ii][Ll][Ee]\]::[Ss][Ee][Tt][Ll][Aa][Ss][Tt][Aa][Cc][Cc][Ee][Ss][Ss][Tt][Ii][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*\[[Ii][Oo]\.[Ff][Ii][Ll][Ee]\]::[Ss][Ee][Tt][Ll][Aa][Ss][Tt][Ww][Rr][Ii][Tt][Ee][Tt][Ii][Mm][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f017df3-8f5a-414f-ad6b-24aff1128278
    name: Suspicious Eventlog Clear
    reason: Timestomping is anti-forensic cleanup; attackers pair it with clearing event logs on the same host to erase the trail of the file they just backdated.
  - id: 26b692dc-1722-49b2-b496-a8258aa6371d
    name: Clear PowerShell History - PowerShell
    reason: 'Same script-block cleanup phase: scripts that rewrite file timestamps often also wipe PSReadLine history to hide the commands run.'
  - id: f1369394-48e1-4327-bf6d-14377f4b8687
    name: Windows Powershell History File Deletion
    reason: Deleting ConsoleHost_history.txt alongside timestamp tampering shows deliberate PowerShell-level evidence removal.
  - id: 602f5669-6927-4688-84db-0d4b7afb2150
    name: Disable Powershell Command History
    reason: Disabling PSReadLine history is a companion defence-evasion step before or after altering file times in the same session.
  - id: b377ddab-502d-4519-9e8c-5590033d2d70
    name: Lace Tempest PowerShell Evidence Eraser
    reason: Known actor script that deletes artifacts and logs after intrusion, the same cleanup stage where timestamps of dropped files are forged.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Timestomped files are usually payloads just downloaded by PowerShell; the download is the precursor that created the file being backdated.
  - id: a699b30e-d010-46c8-bbd1-ee2e26765fe9
    name: Powershell Store File In Alternate Data Stream
    reason: Hiding payloads in ADS is another file-concealment technique commonly chained with timestamp manipulation to avoid timeline discovery.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: Excluding the payload path from Defender is a frequent sibling step when staging a hidden, backdated implant.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Log clearing and audit tampering on this host
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Files written to staging paths by PowerShell (the backdated file)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_targetFilename:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_targetFilename:/.*[Tt]emp.*/ OR data_win_eventdata_targetFilename:/.*[Pp]rogram[Dd]ata.*/ OR data_win_eventdata_targetFilename:/.*[Ss]ystem32.*/ OR data_win_eventdata_targetFilename:/.*[Pp]ublic.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell download cradles and encoded payload retrieval
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 1h
  - name: Persistence or Defender tampering for the dropped file
    query: ((data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss]).*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Execution or outbound connection by PowerShell after timestomp
    query: ((data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Rr][Ee][Gg][Ss][Vv][Rr]32|\\[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Tt]emp.*/)))
    pivot_on:
    - host
    window: 1h
