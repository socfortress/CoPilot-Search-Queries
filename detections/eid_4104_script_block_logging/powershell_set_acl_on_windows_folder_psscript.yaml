name: PowerShell Set-Acl On Windows Folder - PsScript
id: 3bf1d859-3a7e-44cb-8809-a99e066d3478
version: 1
schema_version: "1.0"
date: "2023-07-18"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3bf1d859-3a7e-44cb-8809-a99e066d3478
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell scripts to set the ACL to a file in the Windows folder.
  MITRE ATT&CK: T1222.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Set-Acl *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-AclObject *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path \"C:\\\\Windows*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path \"C:/Windows*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path 'C:\\\\Windows*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path 'C:/Windows*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path C:\\\\Windows*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path C:/Windows*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path $env:windir*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path \"$env:windir*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-Path '$env:windir*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*FullControl*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Allow*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Set-Acl *';
  data_win_eventdata_scriptBlockText matches '*-AclObject *';
  data_win_eventdata_scriptBlockText matches '*-Path "C:\Windows*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/74438b0237d141ee9c99747976447dc884cb1a39/atomics/T1505.005/T1505.005.md
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/set-acl?view=powershell-5.1
  - https://attack.mitre.org/techniques/T1222/

response:
  message: >
    PowerShell Set-Acl On Windows Folder - PsScript detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1222
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1222
  custom_tags:
    - powershell
    - folder
    - psscript
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Aa][Cc][Ll] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Aa][Cc][Ll][Oo][Bb][Jj][Ee][Cc][Tt] .*/ AND (data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] \"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] \"[Cc]:\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] '[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] '[Cc]:\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] [Cc]:\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] \$[Ee][Nn][Vv]:[Ww][Ii][Nn][Dd][Ii][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] \"\$[Ee][Nn][Vv]:[Ww][Ii][Nn][Dd][Ii][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] '\$[Ee][Nn][Vv]:[Ww][Ii][Nn][Dd][Ii][Rr].*/) AND (data_win_eventdata_scriptBlockText:/.*[Ff][Uu][Ll][Ll][Cc][Oo][Nn][Tt][Rr][Oo][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Ll][Ll][Oo][Ww].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0944e002-e3f6-4eb5-bf69-3a3067b53d73
    name: PowerShell Set-Acl On Windows Folder
    reason: Process-creation twin of this script-block detection; the same Set-Acl on C:\Windows seen via the powershell.exe command line confirms the parent process and user that ran it.
  - id: bdeb2cff-af74-4094-8426-724dc937f20a
    name: PowerShell Script Change Permission Via Set-Acl
    reason: Generic Set-Acl permission changes by PowerShell; co-occurs when the attacker loosens ACLs on additional paths beyond the Windows folder.
  - id: 554601fb-9b71-4bcc-abf4-21a611be4fde
    name: Suspicious Recursive Takeown
    reason: Taking ownership of protected Windows files is the usual precursor to Set-Acl granting FullControl so the attacker can overwrite or replace the file.
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: takeown.exe ownership grab on system files, the step before ACLs are rewritten to allow tampering.
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: Alternate native tool for the same goal of granting access on protected paths; attackers mix icacls and Set-Acl when opening up system files.
  - id: c76b796c-27e1-4520-91c4-4a58695c749e
    name: Windows Files and Dirs Access Rights Modification Via Icacls
    reason: icacls changing access rights on files and dirs, the co-occurring or fallback method for permission loosening on Windows binaries.
  - id: 2f77047c-e6e9-4c11-b088-a3de399524cd
    name: Potential Persistence Via Security Descriptors - ScriptBlock
    reason: Same script-block telemetry; DACL/security descriptor tampering grants a backdoor access to services or WMI endpoints, a persistence follow-on to permission changes.
  - id: 22d80745-6f2c-46da-826b-77adaededd74
    name: Suspicious Service DACL Modification Via Set-Service Cmdlet - PS
    reason: Permission tampering on services via PowerShell, the service-side counterpart to opening ACLs on the Windows folder, enabling hijackable service persistence.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: takeown / icacls / cacls ownership and permission changes on Windows paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Tt][Aa][Kk][Ee][Oo][Ww][Nn]|[Ii][Cc][Aa][Cc][Ll][Ss]|[Cc][Aa][Cc][Ll][Ss]|[Xx][Cc][Aa][Cc][Ll][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]-[Aa][Cc][Ll]|[Ii][Cc][Aa][Cc][Ll][Ss]|[Tt][Aa][Kk][Ee][Oo][Ww][Nn]).*[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Executables, DLLs and scripts written into the Windows directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Yy][Ss]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Script blocks replacing or deleting Windows files or tampering Defender preferences
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Cc][Oo][Pp][Yy]|[Mm][Oo][Vv][Ee]|[Rr][Ee][Mm][Oo][Vv][Ee])-[Ii][Tt][Ee][Mm].*([Ww][Ii][Nn][Dd][Oo][Ww][Ss]|[Ww][Ii][Nn][Dd][Ii][Rr]).*/ OR data_win_eventdata_scriptBlockText:/.*([Aa][Dd][Dd]|[Ss][Ee][Tt])-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Binary-replacement persistence: sethc/utilman IFEO, service and task creation'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Ee][Tt][Hh][Cc]|[Uu][Tt][Ii][Ll][Mm][Aa][Nn]|[Oo][Ss][Kk]|[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr])\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] +[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Network or DNS activity from the PowerShell host process
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true") OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
