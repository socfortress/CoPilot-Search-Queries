name: PowerShell PSAttack
id: b7ec41a4-042c-4f31-a5db-d0fcde9fa5c5
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Sean Metcalf (source), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b7ec41a4-042c-4f31-a5db-d0fcde9fa5c5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of PSAttack PowerShell hack tool. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*PS ATTACK!!!*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*PS ATTACK!!!*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://adsecurity.org/?p=2921
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    PowerShell PSAttack detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - psattack
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Pp][Ss] [Aa][Tt][Tt][Aa][Cc][Kk]!!!.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: PSAttack is a custom PowerShell console that bundles Mimikatz; the same host logging Invoke-Mimikatz/sekurlsa script blocks confirms credential theft from inside the PSAttack session.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Second script-block view of the bundled Mimikatz module being invoked inside the PSAttack runspace, the most common first action after launch.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Mimikatz run from PSAttack reads LSASS memory (Sysmon EID 10); this is the host-level proof the credential module actually executed.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: PSAttack builds are patched to evade AMSI/logging; an AMSI-bypass script block just before the PS ATTACK banner shows deliberate defence evasion preceding the tool launch.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: Attackers running PSAttack often blind ETW/script logging in the same session; ETW provider removal around the alert shows evasion that may hide further activity.
  - id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
    name: Tamper Windows Defender - ScriptBlockLogging
    reason: Operators disable Defender before loading hack-tool binaries like PSAttack's embedded modules; a Defender tamper block is the typical precursor.
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: PSAttack ships PowerView; enumerating Domain/Enterprise Admins from the same host is the expected AD reconnaissance follow-on.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: PSAttack is delivered via a PowerShell download cradle or fetches further tooling; a download script block on the host before the banner identifies the delivery stage.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Delivery: PowerShell download cradle or encoded launch before PSAttack'
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*DownloadString* OR data_win_eventdata_commandLine:*DownloadFile* OR data_win_eventdata_commandLine:*Invoke-WebRequest* OR data_win_eventdata_commandLine:*IEX* OR data_win_eventdata_commandLine:*-enc* OR data_win_eventdata_commandLine:*FromBase64String*)
    pivot_on:
    - host
    window: 2h
  - name: Bundled offensive modules run in script blocks (Mimikatz, PowerUp, PowerView, Kerberoast)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*sekurlsa* OR data_win_eventdata_scriptBlockText:*Invoke-AllChecks* OR data_win_eventdata_scriptBlockText:*Get-NetDomain* OR data_win_eventdata_scriptBlockText:*Get-DomainUser* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*Invoke-TokenManipulation*)
    pivot_on:
    - host
    window: 2h
  - name: LSASS handle access by PowerShell or unsigned tools
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_sourceImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*[Pp][Ss][Aa][Tt][Tt][Aa][Cc][Kk].*/)
    pivot_on:
    - host
    window: 2h
  - name: PSAttack binary dropped or executed (PSAttack.exe)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Ss][Aa][Tt][Tt][Aa][Cc][Kk].*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Pp][Ss][Aa][Tt][Tt][Aa][Cc][Kk].*/)
    pivot_on:
    - host
    window: 24h
  - name: Outbound network connections from PowerShell after PSAttack
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
