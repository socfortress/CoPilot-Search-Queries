name: Powershell Store File In Alternate Data Stream
id: a699b30e-d010-46c8-bbd1-ee2e26765fe9
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a699b30e-d010-46c8-bbd1-ee2e26765fe9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Storing files in Alternate Data Stream (ADS) similar to Astaroth malware.
  MITRE ATT&CK: T1564.004.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Start-Process*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-FilePath \"$env:comspec\" *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-ArgumentList *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText: "*>*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Start-Process*';
  data_win_eventdata_scriptBlockText matches '*-FilePath "$env:comspec" *';
  data_win_eventdata_scriptBlockText matches '*-ArgumentList *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.004/T1564.004.md
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Powershell Store File In Alternate Data Stream detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1564.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - powershell
    - store
    - alternate
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_win_eventdata_scriptBlockText:/.*-[Ff][Ii][Ll][Ee][Pp][Aa][Tt][Hh] \"\$[Ee][Nn][Vv]:[Cc][Oo][Mm][Ss][Pp][Ee][Cc]\" .*/ AND data_win_eventdata_scriptBlockText:/.*-[Aa][Rr][Gg][Uu][Mm][Ee][Nn][Tt][Ll][Ii][Ss][Tt] .*/ AND data_win_eventdata_scriptBlockText:/.*\>.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c521530-5169-495d-a199-0a3a881ad24e
    name: NTFS Alternate Data Stream
    reason: 'Same 4104 telemetry from another angle: PowerShell Add-Content/Get-Content -Stream usage confirms a script is writing or reading ADS payloads on this host.'
  - id: 573df571-a223-43bc-846e-3f98da481eca
    name: Creation Of a Suspicious ADS File Outside a Browser Download
    reason: Sysmon EID 15 is the file-system proof that the cmd redirection actually created a named stream that is not a Zone.Identifier.
  - id: b69888d4-380c-45ce-9cf9-d9ce46e67821
    name: Hidden Executable In NTFS Alternate Data Stream
    reason: 'Escalation: the data hidden in the stream has an executable (MZ) header, meaning a payload rather than text was stashed.'
  - id: 45a594aa-1fbd-4972-a809-ff5a99dd81b8
    name: Run PowerShell Script from ADS
    reason: 'Likely next step: the attacker runs the script they just hid in the stream via powershell reading file:stream.'
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: Follow-on execution of the stashed payload with cmd/wmic/rundll32/other binaries pointed at host:stream.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: the content written into the stream is commonly fetched by a PowerShell download in the same script block session.'
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: 'Co-occurring T1564 hiding: attackers who hide data in ADS often also hide staging files/folders with attrib +h/+s.'
  - id: 3109530e-ab47-4cc6-a953-cac5ebcc93ae
    name: ADS Zone.Identifier Deleted By Uncommon Application
    reason: 'Defence-evasion companion: stripping Mark-of-the-Web streams alongside storing payload streams indicates deliberate ADS manipulation.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon named-stream creation (EID 15) on this host
    query: data_win_system_eventID:"15" AND NOT data_win_eventdata_targetFilename:/.*[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr].*/
    pivot_on:
    - host
    window: 2h
  - name: Execution of code from an alternate data stream
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[A-Za-z0-9_\-\.]+:[A-Za-z0-9_\-\.]+\.([Ee][Xx][Ee]|[Pp][Ss]1|[Dd][Ll][Ll]|[Vv][Bb][Ss]|[Jj][Ss]|[Bb][Aa][Tt]|[Tt][Xx][Tt]).*/ AND data_win_eventdata_commandLine:/.*(\\|[Ff][Ii][Ll][Ee]:|[Ss][Tt][Aa][Rr][Tt]|[Ww][Mm][Ii][Cc]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]).*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*-[Ss][Tt][Rr][Ee][Aa][Mm].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell download cradles and encoded commands preceding stream write
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc].*/)
    pivot_on:
    - host
    window: 2h
  - name: Hiding and Mark-of-the-Web stripping around staged files
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Aa][Tt][Tt][Rr][Ii][Bb]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\+[HhSs].*/) OR (data_win_eventdata_commandLine:/.*[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr].*/) OR (data_win_eventdata_commandLine:/.*[Uu][Nn][Bb][Ll][Oo][Cc][Kk]-[Ff][Ii][Ll][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence or LOLBin launch from hidden-stream payload
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(\\[Rr][Uu][Nn]\\|\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]\\).*/ AND data_win_eventdata_details:/.*[A-Za-z0-9_\-\.]+:[A-Za-z0-9_\-\.]+.*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Mm][Ii][Cc]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
