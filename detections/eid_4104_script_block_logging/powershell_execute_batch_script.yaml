name: Powershell Execute Batch Script
id: b5522a23-82da-44e5-9c8b-e10ed8955f88
version: 1
schema_version: "1.0"
date: "2022-01-02"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b5522a23-82da-44e5-9c8b-e10ed8955f88
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may abuse the Windows command shell for execution. The Windows
  command shell ([cmd](https://attack.mitre.org/software/S0106)) is the primary
  command prompt on Windows systems. The Windows command prompt can be used to
  control almost any aspect of a system, with various permission levels required
  for different subsets of commands. Batch files (ex: .bat or .cmd) also provide
  the shell with a list of sequential commands to run, as well as normal
  scripting operations such as conditionals and loops. Common uses of batch
  files include long or repetitive tasks, or the need to run the same set of
  commands on multiple system. MITRE ATT&CK: T1059.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Start-Process*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.cmd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.bat*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Start-Process*';
  data_win_eventdata_scriptBlockText matches '*.cmd*';
  data_win_eventdata_scriptBlockText matches '*.bat*'.

known_false_positives: >
  Legitimate administration script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.003/T1059.003.md#atomic-test-1---create-and-execute-batch-script
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Powershell Execute Batch Script detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
  custom_tags:
    - powershell
    - execute
    - batch
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND (data_win_eventdata_scriptBlockText:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Bb][Aa][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Batch files launched by Start-Process are typically dropped in Temp/Public paths by the same PowerShell session; this is the staging precursor.
  - id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
    name: Execution of Powershell Script in Public Folder
    reason: 'Another dropper-staging path: PowerShell stages in the Public profile folder before spawning the .bat/.cmd.'
  - id: 61d0475c-173f-4844-86f7-f3eebae1c66b
    name: Change PowerShell Policies to an Insecure Level - PowerShell
    reason: Execution-policy weakening commonly precedes a PowerShell wrapper that launches batch payloads.
  - id: f62176f3-8128-4faa-bf6c-83261322e5eb
    name: Malicious PowerShell Keywords
    reason: The same script block (or neighbours) carrying known offensive keywords turns a benign-looking batch launch into a confirmed malicious loader.
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: Launched batch scripts often install themselves as scheduled tasks for persistence right after first run.
  - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
    name: Delete ShadowCopy With PowerShell
    reason: 'Ransomware pattern: a PowerShell-launched batch executes backup/shadow-copy destruction as the impact stage.'
  - id: ce058d6c-79f2-11ec-b476-acde48001122
    name: Ping Sleep Batch Command
    reason: Batch content using ping delays is a classic self-delete/sleep idiom in malware batch stagers started from PowerShell.
  - id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
    name: Potentially Suspicious CMD Shell Output Redirect
    reason: The cmd.exe child run from the batch redirecting output to files indicates recon output collection.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: cmd.exe spawned by PowerShell running a .bat/.cmd file
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Mm][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Batch/CMD script files created on disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Mm][Dd]/)
    pivot_on:
    - host
    window: 2h
  - name: Recon and defense-evasion commands spawned from cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\(whoami|net1?|nltest|systeminfo|ipconfig|tasklist|vssadmin|wmic|bcdedit|schtasks|reg|netsh|sc)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Persistence via scheduled task or service from cmd/PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.?[Ee]?[Xx]?[Ee]? +[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] +[Aa][Dd][Dd].*[Rr][Uu][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: Other PowerShell script blocks launching processes or downloading payloads
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Ee]xecution[Pp]olicy.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Cc]ontent.*\.[Bb][Aa][Tt].*/)
    pivot_on:
    - host
    window: 2h
