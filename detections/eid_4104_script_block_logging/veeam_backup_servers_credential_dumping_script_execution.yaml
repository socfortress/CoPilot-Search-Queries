name: Veeam Backup Servers Credential Dumping Script Execution
id: 976d6e6f-a04b-4900-9713-0134a353e38b
version: 1
schema_version: "1.0"
date: "2023-05-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 976d6e6f-a04b-4900-9713-0134a353e38b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of a PowerShell script that contains calls to the
  "Veeam.Backup" class, in order to dump stored credentials.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*[Credentials]*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*[Veeam.Backup.Common.ProtectedStorage]::GetLocalString*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Invoke-Sqlcmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Veeam Backup and Replication*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*[Credentials]*';
  data_win_eventdata_scriptBlockText matches
  '*[Veeam.Backup.Common.ProtectedStorage]::GetLocalString*';
  data_win_eventdata_scriptBlockText matches '*Invoke-Sqlcmd*', among other
  conditions.

known_false_positives: >
  Administrators backup scripts (must be investigated). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.pwndefend.com/2021/02/15/retrieving-passwords-from-veeam-backup-servers/
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers

response:
  message: >
    Veeam Backup Servers Credential Dumping Script Execution detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - veeam
    - backup
    - servers
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\[[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]\].*/ AND data_win_eventdata_scriptBlockText:/.*\[[Vv][Ee][Ee][Aa][Mm]\.[Bb][Aa][Cc][Kk][Uu][Pp]\.[Cc][Oo][Mm][Mm][Oo][Nn]\.[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Ss][Tt][Oo][Rr][Aa][Gg][Ee]\]::[Gg][Ee][Tt][Ll][Oo][Cc][Aa][Ll][Ss][Tt][Rr][Ii][Nn][Gg].*/ AND data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ss][Qq][Ll][Cc][Mm][Dd].*/ AND data_win_eventdata_scriptBlockText:/.*[Vv][Ee][Ee][Aa][Mm] [Bb][Aa][Cc][Kk][Uu][Pp] [Aa][Nn][Dd] [Rr][Ee][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b57ba453-b384-4ab9-9f40-1038086b4e53
    name: VeeamBackup Database Credentials Dump Via Sqlcmd.EXE
    reason: Same Veeam credential theft (VeeamBackup DB Credentials table) performed via sqlcmd.exe instead of Invoke-Sqlcmd; co-occurs as the process-level view of the same SQL query.
  - id: 696bfb54-227e-4602-ac5b-30d9d2053312
    name: Veeam Backup Database Suspicious Query
    reason: Direct queries against the Veeam config database are the data-extraction step the script performs before decrypting with ProtectedStorage.
  - id: d55b793d-f847-4eea-b59a-5ab09908ac90
    name: Suspicious Child Process Of Veeam Dabatase
    reason: Attackers exploiting or abusing the Veeam SQL instance spawn shells from it; confirms the Veeam server is being worked by an intruder, preceding or following credential dumping.
  - id: 2f47f1fd-0901-466e-a770-3b7092834a1b
    name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
    reason: Ransomware crews (Conti, FIN7-style) use sqlcmd database dumping on backup/SQL servers as the same credential-harvest-before-encryption stage.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Stolen Veeam credentials are commonly accompanied by in-memory Mimikatz/credential tooling in 4104 logs on the same backup server.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Recovered Veeam service/domain admin credentials are typically reused for lateral movement with PsExec to hosts the backup server manages.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Ransomware playbooks that dump Veeam credentials then destroy backups to block recovery before encryption.
  - id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
    name: Windows Backup Deleted Via Wbadmin.EXE
    reason: Backup destruction follow-on after the attacker gains control of the backup infrastructure.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sqlcmd/Veeam database access processes on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm][Bb][Aa][Cc][Kk][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm].[Bb][Aa][Cc][Kk][Uu][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other PowerShell script blocks touching Veeam, DPAPI or stored credentials
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Vv][Ee][Ee][Aa][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Cc][Uu][Rr][Ee][Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Lateral movement tools using harvested credentials
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]6?4?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] +[Uu][Ss][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Backup destruction and recovery inhibition
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] +[Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/)
    pivot_on:
    - host
    window: 6h
  - name: Exfiltration of harvested secrets and outbound transfer tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on:
    - host
    window: 4h
