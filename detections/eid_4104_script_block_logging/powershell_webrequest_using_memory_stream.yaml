name: PowerShell WebRequest Using Memory Stream
id: windows-powershell-webrequest-using-memory-stream-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the use of .NET classes in PowerShell to download a URL payload directly 
  into memory, a common fileless malware staging technique. It leverages PowerShell 
  Script Block Logging (EventCode 4104) to identify suspicious PowerShell commands 
  involving system.net.webclient, system.net.webrequest, and IO.MemoryStream. This 
  activity is significant as it indicates potential fileless malware execution, which 
  is harder to detect and can bypass traditional file-based defenses. If confirmed 
  malicious, this technique could allow attackers to execute code in memory, evade 
  detection, and maintain persistence in the environment.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*system.net.webclient*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*system.net.webrequest*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText: "*IO.MemoryStream*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  No false positives have been identified at this time. The combination of web 
  request functionality with in-memory stream operations is highly indicative of 
  fileless malware staging and should be treated as suspicious.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1027/011/
  - https://www.mandiant.com/resources/blog/tracking-evolution-gootloader-operations
  - https://thedfirreport.com/2022/05/09/seo-poisoning-a-gootloader-story/

response:
  message: >
    Fileless malware staging detected via web request to memory stream on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001, T1105, T1027.011
  risk_score: 85
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 85
  threat_objects: []

tags:
  analytic_story:
    - MoonPeak
    - Medusa Ransomware
    - Malicious PowerShell
    - Fileless Malware
    - Gootloader
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1105
    - T1027.011
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*System\.Net\.WebClient.*/ OR data_win_eventdata_scriptBlockText:/.*System\.Net\.WebRequest.*/) AND data_win_eventdata_scriptBlockText:/.*IO\.MemoryStream.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Same 4104 download-cradle behaviour seen from another angle (DownloadString/DownloadFile); co-occurs when the stager fetches more than one payload.
  - id: windows-powershell-using-memory-as-backing-store-001
    name: Powershell Using memory As Backing Store
    reason: 'Sibling MemoryStream abuse: the downloaded bytes are held in memory rather than written to disk, confirming fileless staging.'
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: 'Typical next step: the in-memory stream is passed to Assembly.Load to execute the downloaded .NET payload without touching disk.'
  - id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
    name: PowerShell Loading DotNET into Memory via Reflection
    reason: 'Follow-on execution of the memory-resident download: reflective load of a .NET assembly from the byte stream.'
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: 'Common precursor: loaders patch AMSI in the same script/session before pulling and running the in-memory payload.'
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: 'Follow-on when the downloaded payload is shellcode: PowerShell resolves WinAPI via GetProcAddress to allocate and run it in memory.'
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Downloaded bytes copied into allocated memory and executed as shellcode, the Cobalt Strike/Gootloader-style stage after the stream is filled.
  - id: windows-powershell-fileless-script-contains-base64-encoded-content-001
    name: Powershell Fileless Script Contains Base64 Encoded Content
    reason: Staged loaders often decode Base64/compressed content from the stream or wrap the cradle in encoded content, same fileless chain.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell reflective assembly load or Invoke-Expression of downloaded content
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]ssembly\]::[Ll]oad.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ee]xpression.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]ntry[Pp]oint\.[Ii]nvoke.*/)
    pivot_on:
    - host
    window: 1h
  - name: AMSI/ETW tampering and shellcode WinAPI use in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]msi[Ii]nit[Ff]ailed.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Pp]roc[Aa]ddress.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal\]::[Cc]opy.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Tt]hread.*/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from PowerShell (payload fetch / C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: DNS lookups by PowerShell for the download host
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell launched by script hosts or Office (initial access chain)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
