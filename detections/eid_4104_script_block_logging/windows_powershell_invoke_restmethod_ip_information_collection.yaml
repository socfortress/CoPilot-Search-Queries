name: Windows PowerShell Invoke-RestMethod IP Information Collection
id: 8db47e12-9c3e-4f5a-b0d6-e42a1895cd4f
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects use of PowerShell's Invoke-RestMethod cmdlet to collect geolocation
  data from ipinfo.io or external IP information from api.ipify.org. This
  behavior is commonly observed in malware and post-exploitation toolkits
  performing reconnaissance to determine the geographical location or network
  details of a compromised system. Water Gamayun threat actors use this technique
  as part of their initial reconnaissance phase.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-RestMethod*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*ipinfo.io*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*api.ipify.org*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging. Confirmed flowing in this environment.

known_false_positives: >
  Some legitimate applications or administrative scripts may use ipinfo.io
  or api.ipify.org for IP validation or geolocation purposes. Review the
  user context and surrounding activity to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1016/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://securityintelligence.com/posts/new-threat-actor-water-gamayun-targets-telecom-finance/

response:
  message: >
    PowerShell Invoke-RestMethod IP information collection detected on
    $agent_name$ by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1082, T1016, T1059.001
  risk_score: 45
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 45
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Water Gamayun
  asset_type: Endpoint
  mitre_attack_id:
    - T1082
    - T1016
    - T1059.001
  custom_tags:
    - invoke_restmethod
    - ip_geolocation
    - reconnaissance
    - ipinfo
    - water_gamayun
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Invoke-RestMethod.*/ AND (data_win_eventdata_scriptBlockText:/.*ipinfo\.io.*/ OR data_win_eventdata_scriptBlockText:/.*api\.ipify\.org.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ec82e2a5-81ea-4211-a1f8-37a0286df2c2
    name: Suspicious DNS Query for IP Lookup Service APIs
    reason: 'Network-layer twin of the same ipinfo/ipify lookup: the script block''s HTTP call must resolve the lookup domain, confirming the request actually left the host and which process made it.'
  - id: edf3485d-dac4-4d50-90e4-b0e5813f7e60
    name: Suspicious Network Connection to IP Lookup Service APIs
    reason: Sysmon EID 3 of the actual outbound connection to the IP lookup service; names the process (powershell.exe vs. an implant host) and proves the script executed rather than merely being logged.
  - id: a9723fcc-881c-424c-8709-fd61442ab3c3
    name: Recon Information for Export with PowerShell
    reason: Public-IP checks are one step of a host-fingerprint routine; the same script commonly gathers and stages system/user info for exfil in the same session.
  - id: 904e8e61-8edf-4350-b59c-b905fc8e810c
    name: Security Software Discovery Via Powershell Script
    reason: Malware that geolocates/identifies the victim then checks installed AV/EDR to decide whether to proceed; commonly runs in the same PowerShell session.
  - id: 28077620-c9f6-11eb-8785-acde48001122
    name: Recon AVProduct Through PowerShell or WMI
    reason: AV product enumeration via WMI SecurityCenter2 is a typical companion of victim-profiling stagers that also report external IP.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Stagers using Invoke-RestMethod for IP profiling then fetch the next-stage payload with download cradles from the same script host.
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: 'Direct follow-on: once the victim is profiled via Invoke-RestMethod, the same cmdlet is used to POST collected data to the actor''s C2 (Water Gamayun pattern).'
  - id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
    name: Windows Screen Capture Via Powershell
    reason: Water Gamayun-style PowerShell implants combine victim profiling with screenshot collection before sending to C2.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound connections to IP-lookup services
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationHostname:(*ipinfo.io* OR *ipify.org* OR *ifconfig.me* OR *icanhazip.com* OR *checkip.amazonaws.com* OR *ip-api.com* OR *myexternalip.com* OR *ipapi.co* OR *wtfismyip.com*)
    pivot_on:
    - host
    window: 1h
  - name: DNS queries for IP-lookup services
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:(*ipinfo.io* OR *ipify.org* OR *ifconfig.me* OR *icanhazip.com* OR *checkip.amazonaws.com* OR *ip-api.com* OR *myexternalip.com* OR *ipapi.co* OR *wtfismyip.com*)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell script blocks making web requests or downloading content
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:(/.*Invoke-WebRequest.*/ OR /.*Invoke-RestMethod.*/ OR /.*Net\.WebClient.*/ OR /.*DownloadString.*/ OR /.*DownloadFile.*/ OR /.*UploadString.*/ OR /.*Start-BitsTransfer.*/ OR /.*[Ii][Ee][Xx].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell host fingerprinting and security-product discovery
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:(/.*Get-WmiObject.*/ OR /.*Get-CimInstance.*/ OR /.*Win32_ComputerSystem.*/ OR /.*Win32_OperatingSystem.*/ OR /.*AntiVirusProduct.*/ OR /.*SecurityCenter2.*/ OR /.*Get-NetIPConfiguration.*/ OR /.*GetHostName.*/ OR /.*Get-MpComputerStatus.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell staging, screen capture and C2 data posting
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:(/.*CopyFromScreen.*/ OR /.*Compress-Archive.*/ OR /.*-Method [Pp]ost.*/ OR /.*Add-Type.*System\.Drawing.*/ OR /.*api\.telegram\.org.*/ OR /.*Get-Clipboard.*/)
    pivot_on:
    - host
    - user
    window: 2h
