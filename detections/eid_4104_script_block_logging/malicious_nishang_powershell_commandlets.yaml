correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Nishang's Invoke-AmsiBypass and loaders are normally preceded by an AMSI patch so the payload escapes Defender; same script-block channel, immediate precursor
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: Nishang is usually pulled into memory via a download cradle (Download-Execute-PS, IEX of a remote script); the cradle is the delivery step before the commandlet runs
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Nishang's Invoke-Mimikatz/DumpCreds/DumpHashes family is credential theft; co-occurs when the operator proceeds to harvest credentials
  - id: 9251299c-ea5b-11eb-a8de-acde48001122
    name: Detect Copy of ShadowCopy with Script Block Logging
    reason: Nishang Copy-VSS copies SAM/NTDS/SYSTEM from a shadow copy; this is the same behaviour seen from generic shadow-copy script blocks
  - id: d59d7842-9a21-4bc6-ba98-64bfe0091355
    name: Powershell DNSExfiltration
    reason: Nishang Do-Exfiltration-Dns/Out-DnsTxt/DNS_TXT_Pwnage perform DNS-based exfil and C2; direct follow-on of the same toolkit
  - id: 4c4af3cd-2115-479c-8193-6b8bfce9001c
    name: PowerShell ICMP Exfiltration
    reason: Nishang Invoke-PowerShellIcmp provides an ICMP shell/exfil channel; alternative covert channel from the same framework
  - id: 965e2db9-eddb-4cf6-a986-7a967df651e4
    name: Potential Keylogger Activity
    reason: Nishang Keylogger scripts (LoggedKeys, Parse_Keys) capture input after foothold; collection stage following execution
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: Nishang Add-Persistence/Execute-OnTime and Remove-Persistence imply scheduled-task or similar persistence set up to keep the implant alive
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradles and in-memory loaders staging Nishang
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell process launch with encoded or hidden arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Nn]on[Ii].*/ OR data_win_eventdata_commandLine:/.*[Ww]indow[Ss]tyle +[Hh]idden.*/ OR data_win_eventdata_commandLine:/.*[Bb]ypass.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload.*/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections from PowerShell (C2, download or exfil)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 2h
  - name: DNS queries from PowerShell (Nishang DNS TXT / exfil channels)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 2h
  - name: Credential and ntds/SAM access staging after Nishang execution
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Cc]onfig\\[Ss][Aa][Mm].*/ OR data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*[Hh]arddisk[Vv]olume[Ss]hadow[Cc]opy.*/))
    pivot_on:
    - host
    window: 4h
