name: Windows PowerSploit GPP Discovery
id: 0130a0df-83a1-4647-9011-841e950ff302
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the Get-GPPPassword PowerShell 
  cmdlet, which is used to search for unsecured credentials in Group Policy 
  Preferences (GPP). This detection leverages PowerShell Script Block Logging to 
  identify specific script block text associated with this cmdlet. Monitoring this 
  activity is crucial as it can indicate an attempt to retrieve and decrypt stored 
  credentials from SYSVOL, potentially leading to unauthorized access. If confirmed 
  malicious, this activity could allow an attacker to escalate privileges or move 
  laterally within the network by exploiting exposed credentials stored in Group 
  Policy Preferences.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-GPPPassword*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-CachedGPPPassword*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of Get-GPPPassword or Get-CachedGPPPassword cmdlets to extract Group 
  Policy Preferences credentials. Validate that data_win_eventdata_scriptBlockText 
  field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  No false positives have been identified at this time. Get-GPPPassword and 
  Get-CachedGPPPassword are specialized PowerShell cmdlets used specifically for 
  extracting credentials from Group Policy Preferences and are not typically used 
  in legitimate administrative activities.

references:
  - https://attack.mitre.org/techniques/T1552/006/
  - https://pentestlab.blog/2017/03/20/group-policy-preferences/
  - https://adsecurity.org/?p=2288
  - https://www.hackingarticles.in/credential-dumping-group-policy-preferences-gpp/
  - https://support.microsoft.com/en-us/topic/ms14-025-vulnerability-in-group-policy-preferences-could-allow-elevation-of-privilege-may-13-2014-60734e15-af79-26ca-ea53-8cd617073c30

response:
  message: >
    PowerSploit GPP credential discovery detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Attacker is attempting to extract unsecured credentials from Group Policy 
    Preferences for privilege escalation and lateral movement. 
    MITRE ATT&CK: T1552.006
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Privilege Escalation
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.006
  custom_tags:
    - gpp_discovery
    - group_policy_preferences
    - credential_dumping
    - powersploit
    - privilege_escalation
    - sysvol_exploitation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Get-GPPPassword.*/ OR data_win_eventdata_scriptBlockText:/.*Get-CachedGPPPassword.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
    name: Findstr GPP Passwords
    reason: 'Same goal via native tooling: attacker greps SYSVOL for cpassword instead of using Get-GPPPassword; co-occurs or substitutes when PowerSploit is blocked'
  - id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
    name: Suspicious SYSVOL Domain Group Policy Access
    reason: Command-line access to SYSVOL\Policies is the file-harvesting step that Get-GPPPassword automates; precedes or accompanies the script
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Copying Groups.xml/Services.xml out of SYSVOL to stage cpassword files for offline decryption
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: PowerView user enumeration from the same PowerSploit toolkit, used to find which accounts the recovered GPP password may belong to
  - id: a360d2b2-065a-11ec-b0bf-acde48001122
    name: Get DomainPolicy with PowerShell Script Block
    reason: PowerView domain/password policy recon in the same AD-reconnaissance session, precedes harvesting GPP credentials
  - id: 676b600a-a94d-4951-b346-11329431e6c1
    name: Get-DomainController with PowerShell Script Block
    reason: Locating the DC hosting SYSVOL is a prerequisite step for GPP credential discovery
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Same PowerSploit/in-memory toolkit family; attacker pairing GPP harvesting with Invoke-Mimikatz for further credential theft
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Recovered GPP local-admin credentials are typically used immediately for PowerShell remoting lateral movement
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerSploit/PowerView modules run in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(Invoke-Mimikatz|Get-DomainUser|Get-NetUser|Get-DomainComputer|Get-NetComputer|Invoke-Kerberoast|Find-LocalAdminAccess|Invoke-ShareFinder|Get-GPOReport|Get-DomainGPO|Get-NetGPO|Invoke-UserHunter|PowerView|PowerSploit|Get-Keystrokes|Invoke-TokenManipulation).*/)
    pivot_on:
    - host
    window: 2h
  - name: SYSVOL / Groups.xml / cpassword file access via command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Vv][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_win_eventdata_commandLine:/.*([Gg]roups|[Ss]ervices|[Ss]cheduledtasks|[Dd]atasources|[Pp]rinters|[Dd]rives)\.[Xx][Mm][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound connections to SMB/WinRM/LDAP after GPP discovery
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"135")
    pivot_on:
    - host
    window: 4h
  - name: Remote execution using recovered credentials (explicit-cred / network logon, WinRM)
    query: (data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")) OR (data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww]sm[Pp]rov[Hh]ost.*/ OR data_win_eventdata_commandLine:/.*([Ee]nter-[Pp][Ss][Ss]ession|[Ii]nvoke-[Cc]ommand|[Nn]ew-[Pp][Ss][Ss]ession|[Pp][Ss][Ee]xec|[Ww]inrs).*/)))
    pivot_on:
    - user
    window: 4h
  - name: Script blocks loading tools from disk/web or dumping credentials
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(DownloadString|Invoke-WebRequest|IEX|Invoke-Expression|FromBase64String|Add-Type|Import-Module).*/ AND data_win_eventdata_scriptBlockText:/.*(Get-GPPPassword|PowerSploit|PowerView|Exfiltration|Privesc|Recon).*/)
    pivot_on:
    - host
    window: 2h
