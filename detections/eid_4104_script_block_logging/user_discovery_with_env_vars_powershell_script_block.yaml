name: User Discovery With Env Vars PowerShell Script Block
id: 77f41d9e-b8be-47e3-ab35-5776f5ec1d20
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the use of PowerShell environment variables to 
  identify the current logged user by leveraging PowerShell Script Block Logging 
  (EventCode=4104). This method monitors script blocks containing `$env:UserName` 
  or `[System.Environment]::UserName`. Identifying this activity is significant as 
  adversaries and Red Teams may use it for situational awareness and Active Directory 
  discovery on compromised endpoints. If confirmed malicious, this activity could 
  allow attackers to gain insights into user context, aiding in further exploitation 
  and lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*$env:UserName*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*[System.Environment]::UserName*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of $env:UserName or [System.Environment]::UserName environment variables 
  to discover the current user context. Validate that data_win_eventdata_scriptBlockText 
  field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell environment variable for 
  legitimate troubleshooting or system administration purposes. Filter based on user 
  context and whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1033/
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html

response:
  message: >
    User discovery via environment variables detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is performing user context discovery for situational awareness and 
    potential lateral movement planning. MITRE ATT&CK: T1033
  risk_score: 20
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 20
    - field: data_win_eventdata_user
      type: user
      score: 20
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - user_discovery
    - environment_variables
    - system_owner_discovery
    - powershell
    - situational_awareness
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*\$env:UserName.*/ OR data_win_eventdata_scriptBlockText:/.*\[System\.Environment\]::UserName.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 80879283-c30f-44f7-8471-d1381f6d437a
    name: Get-CurrentUser with PowerShell Script Block
    reason: Same script-block user-context lookup via a different API (WindowsIdentity::GetCurrent); recon scripts typically chain several whoami-equivalents in one pass
  - id: a9723fcc-881c-424c-8709-fd61442ab3c3
    name: Recon Information for Export with PowerShell
    reason: Env-var user lookup is often one step of a host-profiling script whose output is collected and exported for staging/exfiltration
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: After learning the current user context, operators pivot to PowerView for domain enumeration in the same PowerShell session
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: ADRecon scripts read user/computer env vars at start and then dump full AD; escalates situational awareness into domain-wide recon
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: Follow-on domain enumeration via ActiveDirectory module cmdlets once user/domain context is known
  - id: 2e891cbe-0426-11ec-9c9c-acde48001122
    name: Get-LocalUser with PowerShell Script Block
    reason: 'Adjacent account discovery: after identifying the current user, attacker enumerates local accounts in script blocks'
  - id: 69df7f7c-155d-11ec-a055-acde48001122
    name: Get-WMIObject Group Discovery with Script Block Logging
    reason: 'Next recon step: determining group membership and privilege of the identified user'
  - id: 28077620-c9f6-11eb-8785-acde48001122
    name: Recon AVProduct Through PowerShell or WMI
    reason: 'Common companion in automated host triage scripts: user check then AV product discovery before payload staging'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Whoami and account/group enumeration processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(user|group|localgroup|accounts).*/))
    pivot_on:
    - host
    window: 1h
  - name: Domain/AD discovery script blocks in same session
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-ADUser* OR data_win_eventdata_scriptBlockText:*Get-ADComputer* OR data_win_eventdata_scriptBlockText:*Get-Domain* OR data_win_eventdata_scriptBlockText:*adsisearcher* OR data_win_eventdata_scriptBlockText:*DirectorySearcher* OR data_win_eventdata_scriptBlockText:*Get-NetUser* OR data_win_eventdata_scriptBlockText:*USERDNSDOMAIN*)
    pivot_on:
    - host
    window: 2h
  - name: Download cradle or encoded PowerShell launch
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:*-enc* OR data_win_eventdata_commandLine:*DownloadString* OR data_win_eventdata_commandLine:*Invoke-WebRequest* OR data_win_eventdata_commandLine:*IEX* OR data_win_eventdata_commandLine:*bypass*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Script or recon output files dropped by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:/.*\.(ps1|txt|zip|7z|csv|dll|exe|bat)/
    pivot_on:
    - host
    window: 2h
