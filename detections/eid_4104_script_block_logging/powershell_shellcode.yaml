name: PowerShell ShellCode
id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
version: 1
schema_version: "1.0"
date: "2024-01-25"
author: David Ledbetter (shellcode), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Base64 encoded Shellcode. MITRE ATT&CK: T1055, T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*OiCAAAAYInlM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*OiJAAAAYInlM*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*OiCAAAAYInlM*';
  data_win_eventdata_scriptBlockText matches '*OiJAAAAYInlM*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/cyb3rops/status/1063072865992523776
  - https://attack.mitre.org/techniques/T1055/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    PowerShell ShellCode detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1055, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
    - T1059.001
  custom_tags:
    - powershell
    - shellcode
    - privilege_escalation
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Oo][Ii][Cc][Aa][Aa][Aa][Aa][Yy][Ii][Nn][Ll][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Oo][Ii][Jj][Aa][Aa][Aa][Aa][Yy][Ii][Nn][Ll][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: 'Same script-block channel: the loader resolving VirtualAlloc/CreateThread via GetProcAddress is what runs the base64 shellcode this rule matched'
  - id: windows-powershell-load-module-in-meterpreter-001
    name: Powershell Load Module in Meterpreter
    reason: The matched blob is the classic x86 Metasploit/Cobalt stager prologue; a Meterpreter session loading PS modules is the direct follow-on
  - id: windows-powershell-webrequest-using-memory-stream-001
    name: PowerShell WebRequest Using Memory Stream
    reason: Staged shellcode is commonly fetched into a MemoryStream in the same script before being copied to executable memory
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Fileless in-memory loading often runs alongside or just before the shellcode runner in the same PowerShell session
  - id: 99b97608-3e21-4bfe-8217-2a127c396a0e
    name: Remote Thread Creation Via PowerShell In Uncommon Target
    reason: When the shellcode is injected into another process, Sysmon 8 shows powershell creating a remote thread in it
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: The OiCAAAAYInl prefix is the Cobalt Strike/Metasploit x86 stager; its injection into a host process is the next stage
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: Once beacon shellcode runs, default Cobalt Strike named pipes are created for SMB beacon/post-ex comms
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: The shellcode is usually delivered via an encoded PowerShell launcher whose process creation precedes this script block
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell shellcode-runner API usage (VirtualAlloc/CreateThread/Marshal)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*VirtualAlloc* OR data_win_eventdata_scriptBlockText:*CreateThread* OR data_win_eventdata_scriptBlockText:*GetProcAddress* OR data_win_eventdata_scriptBlockText:*Marshal*Copy* OR data_win_eventdata_scriptBlockText:*GetDelegateForFunctionPointer* OR data_win_eventdata_scriptBlockText:*WriteProcessMemory*)
    pivot_on:
    - host
    window: 1h
  - name: Remote thread creation sourced from PowerShell (injection)
    query: data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from PowerShell/rundll32/injection-host processes
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Rr]undll32\.exe/ OR data_win_eventdata_image:/.*[Ww]erfault\.exe/ OR data_win_eventdata_image:/.*[Ss]earch[Pp]rotocol[Hh]ost\.exe/)
    pivot_on:
    - host
    window: 2h
  - name: Cobalt Strike / Metasploit named pipes created
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:*msagent_* OR data_win_eventdata_pipeName:*MSSE-* OR data_win_eventdata_pipeName:*postex_* OR data_win_eventdata_pipeName:*status_*)
    pivot_on:
    - host
    window: 2h
  - name: Encoded PowerShell launcher process creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*[ ]-[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*FromBase64String.*/ OR data_win_eventdata_commandLine:/.*[Hh]idden.*/)
    pivot_on:
    - host
    window: 1h
