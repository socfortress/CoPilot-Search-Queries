name: Suspicious PowerShell Download - Powershell Script
id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
version: 1
schema_version: "1.0"
date: "2022-12-02"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious PowerShell download command. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*System.Net.WebClient*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.DownloadFile(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.DownloadFileAsync(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.DownloadString(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.DownloadStringAsync(*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*System.Net.WebClient*';
  data_win_eventdata_scriptBlockText matches '*.DownloadFile(*';
  data_win_eventdata_scriptBlockText matches '*.DownloadFileAsync(*', among
  other conditions.

known_false_positives: >
  PowerShell scripts that download content from the Internet. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/dotnet/api/system.net.webclient.downloadstring?view=net-8.0
  - https://learn.microsoft.com/en-us/dotnet/api/system.net.webclient.downloadfile?view=net-8.0
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious PowerShell Download - Powershell Script detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - download
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND (data_win_eventdata_scriptBlockText:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee][Aa][Ss][Yy][Nn][Cc]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg][Aa][Ss][Yy][Nn][Cc]\(.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Same WebClient/IEX cradle seen at process-creation level; confirms the download-and-run command line and its parent process that 4104 lacks.
  - id: 5e3cc4d8-3e68-43db-8656-eaaeefdec9cc
    name: Suspicious Invoke-WebRequest Execution
    reason: Alternate PowerShell download primitive (iwr/curl alias); attackers often retry with it when the WebClient fetch is blocked or to pull a second stage.
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: Payload hosting on paste/file-sharing sites is the typical destination of DownloadString/DownloadFile; names the staging infrastructure.
  - id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
    name: Potential DLL File Download Via PowerShell Invoke-WebRequest
    reason: DownloadFile often drops a DLL payload to disk for later rundll32/regsvr32 loading; this is that dropped-payload stage.
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Downloaded script content is scanned by AMSI at run time; a trigger right after the download means the fetched payload was recognized as malicious.
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: AV detection of the file written by DownloadFile or the second stage confirms the download delivered malware.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Operators frequently add Defender exclusions in the same PowerShell session just before or after fetching the payload to protect it.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: Downloaded executable run from Temp/Public/AppData then beacons out; the typical post-download execution and C2 step.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell outbound network connections (download source / C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell DNS lookups for payload host
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]).*/
    pivot_on:
    - host
    window: 1h
  - name: Executable or script files dropped by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ss][Cc][Rr])/
    pivot_on:
    - host
    window: 2h
  - name: Process launched from user-writable path after download
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\).*/
    pivot_on:
    - host
    window: 2h
  - name: Persistence and defense evasion by PowerShell after download
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]).*/
    pivot_on:
    - host
    window: 4h
