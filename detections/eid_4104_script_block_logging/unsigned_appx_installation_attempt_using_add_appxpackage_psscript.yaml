name: Unsigned AppX Installation Attempt Using Add-AppxPackage - PsScript
id: 975b2262-9a49-439d-92a6-0709cccdf0b2
version: 1
schema_version: "1.0"
date: "2023-01-31"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 975b2262-9a49-439d-92a6-0709cccdf0b2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Add-AppxPackage" or it's alias "Add-AppPackage" to
  install unsigned AppX packages.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Add-AppPackage *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Add-AppxPackage *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "* -AllowUnsigned*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Add-AppPackage *';
  data_win_eventdata_scriptBlockText matches '*Add-AppxPackage *';
  data_win_eventdata_scriptBlockText matches '* -AllowUnsigned*'.

known_false_positives: >
  Installation of unsigned packages for testing purposes. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/windows/msix/package/unsigned-package
  - https://twitter.com/WindowsDocs/status/1620078135080325122

response:
  message: >
    Unsigned AppX Installation Attempt Using Add-AppxPackage - PsScript detected
    on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - unsigned
    - installation
    - appxpackage
    - powershell
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Aa][Pp][Pp][Pp][Aa][Cc][Kk][Aa][Gg][Ee] .*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Aa][Pp][Pp][Xx][Pp][Aa][Cc][Kk][Aa][Gg][Ee] .*/) AND data_win_eventdata_scriptBlockText:/.* -[Aa][Ll][Ll][Oo][Ww][Uu][Nn][Ss][Ii][Gg][Nn][Ee][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
    name: Unsigned AppX Installation Attempt Using Add-AppxPackage
    reason: Same Add-AppxPackage -AllowUnsigned behaviour seen from the process-creation side (powershell.exe command line); confirms the script-block hit with the launching process and parent.
  - id: d2f77901-dbfa-42d9-8af7-dcd0f1a50a2f
    name: Windows PowerShell MSIX Package Installation
    reason: Companion 4104 detection for PowerShell-driven MSIX/AppX deployment; co-fires when the unsigned package is a sideloaded MSIX.
  - id: 180c7c5c-d64b-4a63-86e9-68910451bc8b
    name: Potential File Download Via MS-AppInstaller Protocol Handler
    reason: Alternative delivery path for the same malicious-package technique (ms-appinstaller:// fetch of an AppX/MSIX); precursor or sibling of a PowerShell sideload.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The unsigned package usually has to be downloaded first; a download cradle in an earlier script block is the staging step before Add-AppxPackage.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: COM-object based download cradle is another way the .appx/.msix payload is staged before the sideload.
  - id: d4488827-73af-4f8d-9244-7b7662ef046e
    name: Change User Agents with WebRequest
    reason: Custom user agent on a web request in the same script indicates scripted payload retrieval ahead of package install.
  - id: 61d0475c-173f-4844-86f7-f3eebae1c66b
    name: Change PowerShell Policies to an Insecure Level - PowerShell
    reason: Attackers relax execution policy before running staged install scripts, a common precursor in the same session.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: Defense evasion commonly accompanies installing an unsigned, unvetted package so the app is not scanned or removed.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Package download or staging of AppX/MSIX payload
    query: (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:(*Invoke-WebRequest* OR *DownloadFile* OR *DownloadString* OR *Start-BitsTransfer* OR *Net.WebClient* OR *iwr*) AND data_win_eventdata_scriptBlockText:(*.appx* OR *.msix* OR *.appxbundle* OR *.msixbundle*)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[.]([Aa][Pp][Pp][Xx]|[Mm][Ss][Ii][Xx])([Bb][Uu][Nn][Dd][Ll][Ee])?/)
    pivot_on:
    - host
    window: 2h
  - name: Package manager and sideloading policy changes
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*AllowAllTrustedApps* OR *AllowDevelopmentWithoutDevLicense* OR *Add-AppxProvisionedPackage* OR *DevelopmentMode* OR *Add-AppxPackage* OR *ms-appinstaller*)) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Xx]\[Aa][Ll][Ll][Oo][Ww].*/)
    pivot_on:
    - host
    window: 2h
  - name: Execution policy bypass and encoded PowerShell around install
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:(*-ExecutionPolicy* OR *-Exec* OR *-enc* OR *-EncodedCommand* OR *-NoProfile* OR *-WindowStyle*) )
    pivot_on:
    - host
    window: 1h
  - name: Network connections and DNS from PowerShell to package host
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Ss]vc[Hh]ost.*/ OR data_win_eventdata_image:/.*[Aa]pp[Xx].*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence set by newly installed app (Run keys, scheduled tasks)
    query: ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\[Rr]un.*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss][.][Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
