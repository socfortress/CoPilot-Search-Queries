name: Code Executed Via Office Add-in XLL File
id: 36fbec91-fa1b-4d5d-8df1-8d8edcb632ad
version: 1
schema_version: "1.0"
date: "2021-12-28"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36fbec91-fa1b-4d5d-8df1-8d8edcb632ad
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may abuse Microsoft Office add-ins to obtain persistence on a
  compromised system. Office add-ins can be used to add functionality to Office
  programs. MITRE ATT&CK: T1137.006.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*new-object *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-ComObject *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.application*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.RegisterXLL*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*new-object *';
  data_win_eventdata_scriptBlockText matches '*-ComObject *';
  data_win_eventdata_scriptBlockText matches '*.application*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1137.006/T1137.006.md
  - https://attack.mitre.org/techniques/T1137/006/

response:
  message: >
    Code Executed Via Office Add-in XLL File detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1137.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137.006
  custom_tags:
    - executed
    - office
    - powershell
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Cc][Oo][Mm][Oo][Bb][Jj][Ee][Cc][Tt] .*/ AND data_win_eventdata_scriptBlockText:/.*\.[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr][Xx][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
    name: Potential Persistence Via Microsoft Office Add-In
    reason: 'Same T1137.006 technique at file level: an .xll/.wll/.xlam dropped into Office STARTUP/AddIns folders is the staging that precedes or follows the PowerShell RegisterXLL call.'
  - id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
    name: Uncommon File Created In Office Startup Folder
    reason: A non-document payload written to an Office startup folder is the dropped add-in that XLL registration loads on every Excel launch.
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: Document/template files placed in Office startup folders give the same auto-load persistence as an XLL add-in and are often dropped by the same actor.
  - id: af4c4609-5755-42fe-8075-4effb49f5d44
    name: Microsoft Excel Add-In Loaded From Uncommon Location
    reason: Confirms Excel actually loaded the add-in DLL from Temp/Downloads/Public after RegisterXLL, i.e. the payload executed rather than merely being scripted.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Once the XLL runs inside Excel its shellcode commonly spawns cmd/powershell/rundll32 as a child of EXCEL.EXE - the next-stage execution.
  - id: 3d27f6dd-1c74-4687-b4fa-ca849d128d1c
    name: Office Application Startup - Office Test
    reason: Alternative Office persistence (Office Test Special Perf registry key) often deployed alongside add-in persistence for redundancy.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Add-in / XLL / WLL files dropped to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Aa][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Aa]/)
    pivot_on:
    - host
    window: 2h
  - name: Excel loading XLL/DLL from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\.[Xx][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Shells and LOLBins spawned by Excel/Word
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Office registry persistence (Excel Options, Office Test, add-ins)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*\\[Ee][Xx][Cc][Ee][Ll]\\[Oo][Pp][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Oo][Ff][Ff][Ii][Cc][Ee] [Tt][Ee][Ss][Tt]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ee][Xx][Cc][Ee][Ll]\\[Aa][Dd][Dd]-[Ii][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Tt][Rr][Uu][Ss][Tt] [Rr][Ee][Cc][Oo][Rr][Dd][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from Excel (add-in C2 callback)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
