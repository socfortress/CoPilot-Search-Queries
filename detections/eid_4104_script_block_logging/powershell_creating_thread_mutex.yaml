name: Powershell Creating Thread Mutex
id: 637557ec-ca08-11eb-bd0a-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-06"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects PowerShell scripts that create thread mutexes using System.Threading.Mutex.
  Malware commonly uses mutexes to ensure only one instance runs on a compromised
  machine at a time, preventing duplicate infections and avoiding detection from
  behavioral analysis tools. This technique is frequently observed in sophisticated
  malware families and persistence mechanisms associated with Water Gamayun and
  other threat actors.
  VALIDATED against DESKTOP-AM0HLGE — confirmed Threading.Mutex captured via
  PowerShell EventID 4104 (14 hits).
  MITRE ATT&CK: T1027.005 (Obfuscated Files or Information: Indicator Removal
  from Tools), T1059.001 (PowerShell).

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Threading.Mutex*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-06 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-06 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging. Confirmed flowing in this environment.
  VALIDATED — Threading.Mutex confirmed with 14 hits via PowerShell EventID 4104.

known_false_positives: >
  PowerShell developers may use Threading.Mutex in legitimate scripts for
  instance checking and synchronization purposes. Review the full script
  block context and user to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1027/005/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://isc.sans.edu/forums/diary/Some+Powershell+Malicious+Code/22988/

response:
  message: >
    PowerShell Thread Mutex creation detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1027.005, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Malicious PowerShell
    - Water Gamayun
  asset_type: Endpoint
  mitre_attack_id:
    - T1027.005
    - T1059.001
  custom_tags:
    - threading_mutex
    - mutex
    - malware
    - obfuscation
    - single_instance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Threading\.Mutex.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: A single-instance mutex in a script block usually belongs to a stager/implant that was just downloaded by a download cradle; the cradle script block is the precursor.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: Alternative cradle (COM objects) used to pull the payload whose mutex guard now appears in script block logging.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Fileless loaders that load a .NET assembly in memory commonly create a mutex to prevent double-loading; same script-block lineage.
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Mutex-guarded PowerShell implants frequently allocate and run shellcode (VirtualAlloc/CreateThread); co-occurring in the same session confirms a loader.
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: Loaders disable AMSI before running the main payload; an AMSI patch just before the mutex creation indicates deliberate evasion rather than a benign sync script.
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: Obfuscated IEX is the typical way the mutex-using payload is launched in memory from an encoded stage.
  - id: afd3df04-948d-46f6-ae44-25966c44b97f
    name: PSAsyncShell - Asynchronous TCP Reverse Shell
    reason: A mutex-guarded PowerShell backdoor commonly opens a TCP reverse shell next; the socket script block is the follow-on C2 stage.
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: Single-instance implants establish persistence (scheduled task re-launch) so the mutex check prevents duplicate runs on each trigger.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradle and encoded-stage script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload(String|File|Data).*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/)
    pivot_on:
    - host
    window: 1h
  - name: AMSI/ETW tampering or in-memory assembly loading in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*amsiInitFailed.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]ssembly\]::[Ll]oad.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Pp]roc[Aa]ddress.*/)
    pivot_on:
    - host
    window: 1h
  - name: Shellcode execution primitives in script blocks (VirtualAlloc/CreateThread)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Tt]hread.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal.*[Cc]opy.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]elegate[Ff]or[Ff]unction[Pp]ointer.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell outbound network connections (C2 after mutex)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Persistence created by script interpreters (scheduled task / Run key)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc]urrent[Vv]ersion\\[Rr]un.*/ AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
