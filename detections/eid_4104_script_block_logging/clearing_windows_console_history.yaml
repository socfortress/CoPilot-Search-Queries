name: Clearing Windows Console History
id: bde47d4b-9987-405c-94c7-b080410e8ea7
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bde47d4b-9987-405c-94c7-b080410e8ea7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Identifies when a user attempts to clear console history. An adversary may
  clear the command history of a compromised account to conceal the actions
  undertaken during an intrusion. MITRE ATT&CK: T1070, T1070.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Clear-History*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*Remove-Item*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*rm*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*ConsoleHost_history.txt*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*(Get-PSReadlineOption).HistorySavePath*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Clear-History*';
  data_win_eventdata_scriptBlockText matches '*Remove-Item*';
  data_win_eventdata_scriptBlockText matches '*rm*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://stefanos.cloud/blog/kb/how-to-clear-the-powershell-command-history/
  - https://www.shellhacks.com/clear-history-powershell/
  - https://community.sophos.com/sophos-labs/b/blog/posts/powershell-command-history-forensics
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1070/003/

response:
  message: >
    Clearing Windows Console History detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1070, T1070.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1070.003
  custom_tags:
    - clearing
    - console
    - history
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Rr]-[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR ((data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Mm].*/) AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Hh][Oo][Ss][Tt]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]\.[Tt][Xx][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*\([Gg][Ee][Tt]-[Pp][Ss][Rr][Ee][Aa][Dd][Ll][Ii][Nn][Ee][Oo][Pp][Tt][Ii][Oo][Nn]\)\.[Hh][Ii][Ss][Tt][Oo][Rr][Yy][Ss][Aa][Vv][Ee][Pp][Aa][Tt][Hh].*/)))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
