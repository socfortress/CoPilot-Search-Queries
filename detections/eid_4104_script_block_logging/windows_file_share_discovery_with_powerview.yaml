name: Windows File Share Discovery With Powerview
id: a44c0be1-d7ab-41e4-92fd-aa9af4fe232c
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution of the Invoke-ShareFinder PowerShell cmdlet from PowerView,
  used to enumerate network file shares across a domain. Network shares often
  contain sensitive information including backups, scripts, and credentials.
  This technique is commonly used by threat actors for lateral movement and
  privilege escalation. Invoke-ShareFinder is a well-known PowerView function
  documented in DFIR reports as a precursor to data theft and ransomware deployment.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-ShareFinder*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block

known_false_positives: >
  Security teams may leverage PowerView proactively to identify and remediate
  sensitive file shares. Filter known authorized security assessment activity
  as needed.

references:
  - https://attack.mitre.org/techniques/T1135/
  - https://github.com/PowerShellEmpire/PowerTools/blob/master/PowerView/powerview.ps1
  - https://thedfirreport.com/2023/01/23/sharefinder-how-threat-actors-discover-file-shares/

response:
  message: >
    Invoke-ShareFinder network share enumeration detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1135
  risk_score: 48
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 48
    - field: data_win_eventdata_user
      type: user
      score: 48
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Active Directory Privilege Escalation
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1135
  custom_tags:
    - powerview
    - invoke_sharefinder
    - network_share_discovery
    - lateral_movement
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Invoke-ShareFinder.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Invoke-ShareFinder ships inside PowerView; the same script block session usually loads and runs other PowerView cmdlets, confirming the toolkit was imported rather than a lone call.
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: Operators typically pair share hunting with SPN enumeration to pick Kerberoast and high-value server targets in the same PowerView session.
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Privileged group discovery with PowerView alongside ShareFinder shows a broader AD recon sweep deciding which accounts and servers to pivot to.
  - id: 39405650-c364-4e1e-a740-32a63ef042a6
    name: Windows PowerView AD Access Control List Enumeration
    reason: ACL enumeration is a co-occurring PowerView recon step that maps abusable permissions on the same domain the shares were found in.
  - id: 1c563233-030e-4a07-af8c-ee0490a66d3a
    name: Suspicious New-PSDrive to Admin Share
    reason: 'Direct follow-on: after ShareFinder lists reachable shares, attackers mount ADMIN$/C$ with New-PSDrive to access them.'
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: Net use against admin shares is the command-line equivalent of mounting a share found by ShareFinder, moving from discovery to access.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Copying files to or from admin shares after enumeration indicates data collection or staging of tools for lateral movement.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: SharpHound collection is a commonly co-occurring AD mapping step used with PowerView share discovery before lateral movement.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell script blocks reading or copying from remote UNC shares / PowerView file hunting
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Dd]rive.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Dd]omain[Ss]hare.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ii]nteresting[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ff]ile[Ff]inder.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et[Ss]hare.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Uu]ser[Hh]unter.*/ OR data_win_eventdata_scriptBlockText:/.*([Cc]opy-[Ii]tem|[Gg]et-[Cc]hild[Ii]tem|[Gg]et-[Cc]ontent).*\\\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: net.exe share enumeration and admin share mounts
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn]et1?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee] .*\\\\.*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound SMB connections to many file servers
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Data staging and archiving after share access
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7z|7za|[Rr]ar|[Ww]in[Rr]ar)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*[Tt]ar.* -[a-z]*c.*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(zip|7z|rar|cab)/)
    pivot_on:
    - host
    window: 4h
  - name: Exfiltration and ransomware precursors (rclone, mega, shadow copy deletion)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr]clone|[Mm]ega[Cc]md|[Ww]inscp)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*[Ss]hadows.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Rr]ecoveryenabled.*/ OR data_win_eventdata_commandLine:/.*[Rr]clone.*(copy|sync).*/)
    pivot_on:
    - host
    window: 6h
