name: Remove Account From Domain Admin Group
id: 48a45d45-8112-416b-8a67-46e03a4b2107
version: 1
schema_version: "1.0"
date: "2021-12-26"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 48a45d45-8112-416b-8a67-46e03a4b2107
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may interrupt availability of system and network resources by
  inhibiting access to accounts utilized by legitimate users. Accounts may be
  deleted, locked, or manipulated (ex: changed credentials) to remove access to
  accounts. MITRE ATT&CK: T1531.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Remove-ADGroupMember*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Identity *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Members *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Remove-ADGroupMember*';
  data_win_eventdata_scriptBlockText matches '*-Identity *';
  data_win_eventdata_scriptBlockText matches '*-Members *'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1531/T1531.md#atomic-test-3---remove-account-from-domain-admin-group
  - https://attack.mitre.org/techniques/T1531/

response:
  message: >
    Remove Account From Domain Admin Group detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1531
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1531
  custom_tags:
    - remove
    - account
    - domain
    - powershell
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*-[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Mm][Ee][Mm][Bb][Ee][Rr][Ss] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e4c73d68-794b-468d-b4d0-dac1772bbae7
    name: Get-AdGroup with PowerShell Script Block
    reason: 'Precursor: attacker enumerates AD groups and their members to learn who holds Domain Admins before removing accounts from it.'
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: 'Precursor: PowerView discovery of privileged groups identifies the admin accounts that are then targeted for removal.'
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: 'Co-occurring: the ActiveDirectory module loaded for enumeration is the same module providing Remove-ADGroupMember.'
  - id: b29a93fb-087c-4b5b-a84d-ee3309e69d08
    name: Manipulation of User Computer or Group Security Principals Across AD
    reason: 'Same behaviour class: other AD principal/group tampering by the same operator, often alongside membership removal as part of account lockout.'
  - id: 10fb649c-3600-4d37-b1e6-56ea90bb7e09
    name: User Added To Highly Privileged Group
    reason: 'Companion action: attacker removes legitimate admins while adding their own account to a privileged group to take over the domain.'
  - id: 4fdc44df-bfe9-4fcc-b041-68f5a2d3031c
    name: Powershell LocalAccount Manipulation
    reason: 'Parallel T1531 activity: disabling or changing local accounts via PowerShell to lock out defenders on the same host.'
  - id: 5b768e71-86f2-4879-b448-81061cbae951
    name: Suspicious Manipulation Of Default Accounts Via Net.EXE
    reason: Parallel account-access-removal via net.exe (administrator/guest tampering) in the same impact phase.
  - id: 6d70780d-4cfe-4820-bafd-1b43941986b5
    name: Windows Powershell Logoff User via Quser
    reason: 'Follow-on: after stripping admin rights, attacker logs off active admin sessions to complete the lockout.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD account/group tampering cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Aa][Dd][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Aa][Dd][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Cc][Kk][Oo][Uu][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Privileged group enumeration before membership removal
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Tt][Ee][Rr][Pp][Rr][Ii][Ss][Ee] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Net/dsmod command-line group and account changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +(group|user|localgroup).*(\/[Dd][Ee][Ll][Ee][Tt][Ee]|\/[Aa][Dd][Dd]|\/[Aa][Cc][Tt][Ii][Vv][Ee]:[Nn][Oo]).*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Mm][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Rr][Mm].*/)
    pivot_on:
    - host
    window: 2h
  - name: Session logoff or forced lockout after privilege removal
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ll][Oo][Gg][Oo][Ff][Ff]|[Qq][Uu][Ss][Ee][Rr]|[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ee][Tt] [Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote logons to this host preceding AD changes
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    window: 2h
