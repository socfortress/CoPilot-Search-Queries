name: Windows Get-AdComputer Unconstrained Delegation Discovery
id: c8640777-469f-4638-ab44-c34a3233ffac
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects use of the Get-ADComputer cmdlet with TrustedForDelegation parameter
  to identify Windows endpoints with Kerberos Unconstrained Delegation enabled.
  Unconstrained delegation allows a service to impersonate any user that
  authenticates to it, making these systems high-value targets for privilege
  escalation and lateral movement. Adversaries enumerate these systems to
  identify attack paths for domain compromise. Used by Medusa Ransomware and
  other threat actors.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-ADComputer*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*TrustedForDelegation*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators or power users may leverage Get-ADComputer with TrustedForDelegation
  for legitimate system management or security auditing. Review the user context
  and frequency to determine if the activity is authorized.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://adsecurity.org/?p=1667
  - https://docs.microsoft.com/en-us/defender-for-identity/cas-isp-unconstrained-kerberos
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/domain-compromise-via-unrestricted-kerberos-delegation

response:
  message: >
    Get-ADComputer TrustedForDelegation Kerberos unconstrained delegation
    discovery detected on $agent_name$ by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1018
  risk_score: 35
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 35
    - field: data_win_eventdata_user
      type: user
      score: 35
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Medusa Ransomware
    - Active Directory Kerberos Attacks
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - get_adcomputer
    - kerberos_delegation
    - unconstrained_delegation
    - active_directory
    - privilege_escalation
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-ADComputer.*/ AND data_win_eventdata_scriptBlockText:/.*TrustedForDelegation.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
    name: Potential Unconstrained Delegation Discovery Via Get-ADComputer - ScriptBlock
    reason: Near-duplicate script-block detection of the same unconstrained-delegation hunt; firing together confirms the enumeration and may show a variant command line.
  - id: 86dc8176-6e6c-42d6-9684-5444c6557ab3
    name: Windows PowerView Constrained Delegation Discovery
    reason: Attackers enumerate unconstrained then constrained delegation (msDS-AllowedToDelegateTo) in the same recon pass to map every Kerberos delegation path.
  - id: a9a1da02-8e27-4bf7-a348-f4389c9da487
    name: Get-AdComputer with PowerShell Script Block
    reason: Broader Get-ADComputer script-block activity from the same session; shows whether delegation discovery is part of wider computer enumeration.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: PowerView is the common alternative tool for finding unconstrained-delegation hosts (Get-DomainComputer -Unconstrained), indicating an offensive AD recon toolkit.
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: Get-ADComputer comes from the ActiveDirectory module; this shows broader AD module enumeration (users, groups, trusts) preceding or following the delegation query.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain controller/trust discovery with nltest typically precedes locating delegation targets and is the standard first step of domain recon.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Delegation hosts are mapped into attack graphs by BloodHound collection; co-occurrence indicates automated attack-path mapping.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Next step after finding an unconstrained-delegation host is ticket monitoring/harvesting (Rubeus monitor/tgtdeleg) or coercion to capture a DC TGT.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD delegation / SPN / privileged-object enumeration in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]llowed[Tt]o[Dd]elegate[Tt]o.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]rusted[Tt]o[Aa]uth[Ff]or[Dd]elegation.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ervice[Pp]rincipal[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Cc]omputer.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Gg]roup[Mm]ember.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Kerberos ticket tooling or delegation abuse commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]ubeus.*/ OR data_win_eventdata_commandLine:/.*[Tt]gtdeleg.*/ OR data_win_eventdata_commandLine:/.*[Mm]onitor \/interval.*/ OR data_win_eventdata_commandLine:/.*kerberos::.*/ OR data_win_eventdata_commandLine:/.*[Ss]ekurlsa.*/ OR data_win_eventdata_commandLine:/.*[Ss]etspn.*/ OR data_win_eventdata_commandLine:/.*[Kk]list.*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Printer-bug / coercion and remote RPC pipes toward a delegation host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]pool[Ss]ample.*/ OR data_win_eventdata_commandLine:/.*[Pp]etit[Pp]otam.*/ OR data_win_eventdata_commandLine:/.*[Pp]rinter[Bb]ug.*/ OR data_win_eventdata_commandLine:/.*[Cc]oerce.*/)) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135") AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh|[Rr]ubeus|[Ss]pool[Ss]ample).*/)
    pivot_on:
    - host
    window: 4h
  - name: Remote service or admin-share lateral movement following recon
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee]([Ss][Vv][Cc])?\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Cc]ommand.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*\/node.*[Pp]rocess.*[Cc]all.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.exe.*\\\\.*[Cc]reate.*/)
    pivot_on:
    - host
    - user
    window: 6h
  - name: Credential dumping or LSASS access on the host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm]ini[Dd]ump.*/ OR data_win_eventdata_commandLine:/.*[Pp]rocdump.*[Ll]sass.*/ OR data_win_eventdata_commandLine:/.*[Ss]ekurlsa.*/))
    pivot_on:
    - host
    window: 4h
