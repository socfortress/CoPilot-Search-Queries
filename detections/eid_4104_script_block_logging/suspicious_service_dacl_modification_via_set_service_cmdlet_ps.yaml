name: Suspicious Service DACL Modification Via Set-Service Cmdlet - PS
id: 22d80745-6f2c-46da-826b-77adaededd74
version: 1
schema_version: "1.0"
date: "2022-10-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 22d80745-6f2c-46da-826b-77adaededd74
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Set-Service" powershell cmdlet to configure a new
  SecurityDescriptor that allows a service to be hidden from other utilities
  such as "sc.exe", "Get-Service"...etc. (Works only in powershell 7). MITRE
  ATT&CK: T1574.011.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-SecurityDescriptorSddl *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-sd *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Set-Service *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*D;;*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*;;;IU*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*;;;SU*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*;;;BA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*;;;SY*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*;;;WD*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*-SecurityDescriptorSddl *';
  data_win_eventdata_scriptBlockText matches '*-sd *';
  data_win_eventdata_scriptBlockText matches '*Set-Service *', among other
  conditions.

known_false_positives: >
  Rare intended use of hidden services. Rare FP could occur due to the non
  linearity of the ScriptBlockText log. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/Alh4zr3d/status/1580925761996828672
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/set-service?view=powershell-7.2
  - https://attack.mitre.org/techniques/T1574/011/

response:
  message: >
    Suspicious Service DACL Modification Via Set-Service Cmdlet - PS detected on
    host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1574.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.011
  custom_tags:
    - service
    - cmdlet
    - powershell
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*-[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr][Ss][Dd][Dd][Ll] .*/ OR data_win_eventdata_scriptBlockText:/.*-[Ss][Dd] .*/) AND data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*[Dd];;.*/ AND (data_win_eventdata_scriptBlockText:/.*;;;[Ii][Uu].*/ OR data_win_eventdata_scriptBlockText:/.*;;;[Ss][Uu].*/ OR data_win_eventdata_scriptBlockText:/.*;;;[Bb][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*;;;[Ss][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*;;;[Ww][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 953945c5-22fe-4a92-9f8a-a9edc1e522da
    name: Abuse of Service Permissions to Hide Services Via Set-Service - PS
    reason: Sibling script-block variant of the same service-hiding SDDL technique; both firing confirms deliberate hiding rather than a parsing artifact.
  - id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
    name: Suspicious Service DACL Modification Via Set-Service Cmdlet
    reason: Process-creation view of the same Set-Service -SecurityDescriptorSddl command line; shows the parent process and user that ran it.
  - id: a537cfc3-4297-4789-92b5-345bfd845ad0
    name: Service DACL Abuse To Hide Services Via Sc.EXE
    reason: Attackers switch between Set-Service and sc.exe sdset to deny IU/SU/BA/WD access; either on the same host shows the same service-hiding intent.
  - id: 98c5aeef-32d5-492f-b174-64a691896d25
    name: Service Security Descriptor Tampering Via Sc.EXE
    reason: Generic service SDDL rewrite with sc.exe, the usual sibling or fallback when Set-Service is unavailable (it needs PowerShell 7).
  - id: 2f77047c-e6e9-4c11-b088-a3de399524cd
    name: Potential Persistence Via Security Descriptors - ScriptBlock
    reason: Security-descriptor manipulation from PowerShell used to keep persistence mechanisms hidden or reachable; same stealth-persistence objective.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The hidden service is usually one the attacker just created; a new service shortly before the DACL change is the persistence precursor.
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: Hidden services typically run from user-writable or odd directories; this identifies the payload being protected by the DACL.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: PowerShell is the delivery channel for the implant and the service-hiding script; a download cradle just before the DACL change is the staging step.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service creation or modification near the DACL change
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Dd][Ss][Ee][Tt]|[Cc][Oo][Nn][Ff][Ii][Gg]|[Bb][Ii][Nn][Pp][Aa][Tt][Hh]).*/) OR data_win_eventdata_commandLine:/.*([Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]).*/)) OR (data_win_system_eventID:"7045")
    pivot_on:
    - host
    window: 2h
  - name: Service registry key and ImagePath writes
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt].*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Executables dropped to disk from PowerShell or in service paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Yy][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks with download, encoding or Defender tampering
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload([Ss]tring|[Ff]ile).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Mm]p[Pp]reference.*/)
    pivot_on:
    - host
    window: 2h
  - name: Logons and privileged account activity on the host
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"2")
    pivot_on:
    - host
    - user
    window: 4h
