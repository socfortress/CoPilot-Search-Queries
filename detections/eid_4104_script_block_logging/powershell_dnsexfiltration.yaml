name: Powershell DNSExfiltration
id: d59d7842-9a21-4bc6-ba98-64bfe0091355
version: 1
schema_version: "1.0"
date: "2022-01-07"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d59d7842-9a21-4bc6-ba98-64bfe0091355
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  DNSExfiltrator allows for transferring (exfiltrate) a file over a DNS request
  covert channel. MITRE ATT&CK: T1048.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Invoke-DNSExfiltrator*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "* -i *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "* -d *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "* -p *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "* -doh *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "* -t *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Invoke-DNSExfiltrator*';
  data_win_eventdata_scriptBlockText matches '* -i *';
  data_win_eventdata_scriptBlockText matches '* -d *', among other conditions.

known_false_positives: >
  Legitimate script. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1048/T1048.md#atomic-test-3---dnsexfiltration-doh
  - https://github.com/Arno0x/DNSExfiltrator
  - https://attack.mitre.org/techniques/T1048/

response:
  message: >
    Powershell DNSExfiltration detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1048
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048
  custom_tags:
    - powershell
    - dnsexfiltration
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Dd][Nn][Ss][Ee][Xx][Ff][Ii][Ll][Tt][Rr][Aa][Tt][Oo][Rr].*/ OR (data_win_eventdata_scriptBlockText:/.* -[Ii] .*/ AND data_win_eventdata_scriptBlockText:/.* -[Dd] .*/ AND data_win_eventdata_scriptBlockText:/.* -[Pp] .*/ AND data_win_eventdata_scriptBlockText:/.* -[Dd][Oo][Hh] .*/ AND data_win_eventdata_scriptBlockText:/.* -[Tt] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: Invoke-DNSExfiltrator.ps1 is typically pulled down by a PowerShell download cradle before it is run'
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: 'Precursor: scripted file sweeps pick the data that DNSExfiltrator then encodes and sends out over DNS'
  - id: b7a3c9a3-09ea-4934-8864-6a32cacd98d9
    name: Zip A Folder With PowerShell For Staging In Temp - PowerShell Script
    reason: 'Precursor: data is zipped and staged first; DNSExfiltrator takes a single file (-f) and chunks it into DNS labels'
  - id: 2452e632-9e0d-11eb-bacd-acde48001122
    name: DNS Exfiltration Using Nslookup App
    reason: 'Co-occurring: same covert DNS channel seen from the process side when exfiltration falls back to nslookup'
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: 'Co-occurring: process-creation view of DNS tunnelling tools (dnscat, iodine, DNSExfiltrator) on the same host'
  - id: f356a9c4-effd-4608-bbf8-408afd5cd006
    name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
    reason: 'Co-occurring: DNS-based C2 on the same host suggests the DNS channel is a general tunnel, not just a one-off exfil'
  - id: 4c4af3cd-2115-479c-8193-6b8bfce9001c
    name: PowerShell ICMP Exfiltration
    reason: 'Co-occurring: operators who script DNS exfiltration often script an alternate covert channel (ICMP) via PowerShell in the same session'
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: 'Follow-on: if the DNS channel is blocked or slow, the operator pivots to HTTP exfiltration with Invoke-RestMethod from PowerShell'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell DNS queries with long or encoded-looking names
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]).*/ AND data_win_eventdata_queryName:/.{50,}/
    pivot_on:
    - host
    window: 1h
  - name: DNS tooling and DoH resolution from scripts or CLI
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Oo][Ll][Vv][Ee]-[Dd][Nn][Ss][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp].*-[Tt][Yy][Pp][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Nn][Ss][Ee][Xx][Ff][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*dns\.google.*/ OR data_win_eventdata_commandLine:/.*cloudflare-dns\.com.*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ss][Oo][Ll][Vv][Ee]-[Dd][Nn][Ss][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*dns\.google.*/ OR data_win_eventdata_scriptBlockText:/.*cloudflare-dns\.com.*/))
    pivot_on:
    - host
    window: 1h
  - name: PowerShell network connections to DNS or DoH endpoints
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"53" OR data_win_eventdata_destinationPort:"853" OR data_win_eventdata_destinationHostname:*dns.google* OR data_win_eventdata_destinationHostname:*cloudflare-dns*)
    pivot_on:
    - host
    window: 1h
  - name: File read, base64 and archive staging in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Zz][Ii][Pp][Ff][Ii][Ll][Ee].*/ OR (data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Aa][Dd][Aa][Ll][Ll][Bb][Yy][Tt][Ee][Ss].*/ AND data_win_eventdata_scriptBlockText:/.*[Tt][Oo][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/))
    pivot_on:
    - host
    - user
    window: 2h
  - name: Exfil tool dropped to disk or launched by name
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Dd][Nn][Ss][Ee][Xx][Ff][Ii][Ll]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Dd][Nn][Ss]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Dd][Nn][Ss][Ee][Xx][Ff][Ii][Ll][Tt][Rr][Aa][Tt][Oo][Rr].*/)
    pivot_on:
    - host
    window: 6h
