name: Windows PowerShell Add Module to Global Assembly Cache
id: 3fc16961-97e5-4a5b-a079-e4ab0d9763eb
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the addition of a DLL to the Windows Global Assembly Cache (GAC)
  using PowerShell via System.EnterpriseServices.Internal.Publish. Adding a
  DLL to the GAC allows it to be shared across multiple applications system-wide,
  enabling an adversary to execute malicious code persistently. This technique
  is used in IIS-based web shell persistence and backdoor installation as
  documented by Microsoft's security research.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*EnterpriseServices*Internal*Publish*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  False positives may be present based on developers or third party utilities
  adding items to the GAC for legitimate application deployment. Review the
  DLL being installed and the user context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1505/004/
  - https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
  - https://www.microsoft.com/en-us/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/

response:
  message: >
    PowerShell GAC module installation via EnterpriseServices.Internal.Publish
    detected on $agent_name$ by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1505.004
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - IIS Components
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.004
  custom_tags:
    - gac
    - global_assembly_cache
    - iis
    - persistence
    - web_shell
    - enterprise_services
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*EnterpriseServices.*Internal.*Publish.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 33fc9f6f-0ce7-4696-924e-a69ec61a3d57
    name: Windows PowerShell IIS Components WebGlobalModule Usage
    reason: GAC-registered managed module is then loaded into IIS via New-WebGlobalModule/Enable-WebGlobalModule; the activation step of the same IIS backdoor chain
  - id: windows-iis-components-add-new-module-001
    name: Windows IIS Components Add New Module
    reason: appcmd install module registers the GAC-installed assembly as an IIS module, the follow-on that makes the backdoor execute
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: suspicious IIS module registration right after GAC publish indicates a malicious managed IIS module being activated
  - id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
    name: IIS Native-Code Module Command Line Installation
    reason: alternate IIS module install path used by the same actor class for persistent IIS backdoors
  - id: windows-disable-http-logging-appcmd-001
    name: Windows Disable HTTP Logging via AppCmd
    reason: attackers disable IIS logging after installing the module to hide backdoor traffic
  - id: 27958de0-2857-43ca-9d4c-b255cf59dcab
    name: Windows PowerShell Disable HTTP Logging
    reason: PowerShell variant of IIS log suppression following module persistence
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: web shell command execution on the IIS server is the typical precursor/companion of IIS backdoor persistence
  - id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
    name: Potential Webshell Creation On Static Website
    reason: web shell file drop into the web root is a common initial foothold before GAC/IIS module persistence
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GAC / IIS module install tooling (gacutil, appcmd, New-WebGlobalModule)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Gg][Aa][Cc][Uu][Tt][Ii][Ll]|[Aa][Pp][Pp][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ii]nstall [Mm][Oo][Dd][Uu][Ll][Ee]|[Gg][Aa][Cc][Uu][Tt][Ii][Ll]).*/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Nn]ew-[Ww]eb[Gg]lobal[Mm]odule|[Ee]nable-[Ww]eb[Gg]lobal[Mm]odule).*/)
    pivot_on:
    - host
    window: 2h
  - name: DLL/ASPX file writes in GAC, inetsrv or web root
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa]ssembly\[Gg][Aa][Cc].*|[Ii]netsrv.*|[Ii]netpub\[Ww]ww[Rr]oot.*|[Tt]emporary [Aa][Ss][Pp]\.[Nn][Ee][Tt] [Ff]iles.*)\.([Dd][Ll][Ll]|[Aa][Ss][Pp][Xx]|[Aa][Ss][Hh][Xx])/
    pivot_on:
    - host
    window: 2h
  - name: Shell and LOLBin children of the IIS worker process
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\([Cc][Mm][Dd]|[Pp]ower[Ss]hell|[Pp][Ww][Ss][Hh]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn]et|[Nn]et1|[Cc]url|[Cc]ertutil|[Cc]sc)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: PowerShell script blocks loading assemblies or downloading payloads
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Rr]eflection\.[Aa]ssembly|[Ll]oad[Ff]rom|[Aa]dd-[Tt]ype|[Ff]rom[Bb]ase64[Ss]tring|[Dd]ownload[Ff]ile|[Dd]ownload[Ss]tring|[Ii]nvoke-[Ww]eb[Rr]equest).*/
    pivot_on:
    - host
    - user
    window: 2h
  - name: IIS logging tamper via command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa]ppcmd.*([Ll]og|[Hh]ttp[Ll]ogging)|[Rr]emove-[Ii]tem.*[Ll]og[Ff]iles).*/
    pivot_on:
    - host
    window: 4h
