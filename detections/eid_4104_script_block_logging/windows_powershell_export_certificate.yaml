name: Windows PowerShell Export Certificate
id: 5e38ded4-c964-41f4-8cb6-4a1a53c6929f
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects use of the PowerShell cmdlet export-certificate to export certificates
  from the local Windows Certificate Store. Adversaries may export certificates
  to exfiltrate private keys for use in impersonating users, decrypting sensitive
  communications, or forging authentication certificates. Stolen certificates
  can facilitate further attacks including lateral movement and data decryption.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*export-certificate*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators or scripts may legitimately export certificates for backup,
  migration, or deployment purposes. Review the certificate being exported,
  destination path, and user context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1552/004/
  - https://attack.mitre.org/techniques/T1649/
  - https://dev.to/iamthecarisma/managing-windows-pfx-certificates-through-powershell-3pj
  - https://learn.microsoft.com/en-us/powershell/module/pki/export-certificate

response:
  message: >
    PowerShell export-certificate detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1552.004, T1649
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Windows Certificate Services
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.004
    - T1649
  custom_tags:
    - export_certificate
    - certificate_theft
    - credential_access
    - pki
    - windows_certificate_store
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*export-certificate.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ed06725f-6da6-439f-9dcc-ab30e891297c
    name: Windows PowerShell Export PfxCertificate
    reason: Sibling cmdlet that exports the private key as PFX; the same actor often chains Export-Certificate (public cert) with Export-PfxCertificate (key theft).
  - id: aa7a3fce-bef5-4311-9cc1-5f04bb8c308c
    name: Certificate Exported Via PowerShell - ScriptBlock
    reason: Broader script-block variant of certificate export; confirms the same export behavior in other cmdlet forms on the host.
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Process-creation view of the same export (powershell command line), corroborating the script block with the launching parent and arguments.
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Alternate LOLBin route to export certificates/keys; attackers switch tools if one is blocked or monitored.
  - id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
    name: Private Keys Reconnaissance Via CommandLine Tools
    reason: 'Typical precursor: hunting for .pfx/.p12/.key files before or after exporting certs from the store.'
  - id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
    name: DPAPI Backup Keys And Certificate Export Activity IOC
    reason: Exported cert/key files landing on disk (.pfx/.pvk/.cer) and DPAPI key material are the file-level artifact of the export.
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: SharpDPAPI extracts DPAPI-protected certificates and private keys; common companion to cert theft for non-exportable keys.
  - id: 762f2482-ff21-4970-8939-0aa317a886bb
    name: HackTool - Certify Execution
    reason: Stolen certs are used for AD CS abuse; Certify enumerates and requests certificates for impersonation, the likely follow-on.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certificate/key files created on disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.([Pp][Ff][Xx]|[Pp]12|[Cc][Ee][Rr]|[Pp][Vv][Kk]|[Kk][Ee][Yy]|[Pp][Ee][Mm])/)
    pivot_on:
    - host
    window: 2h
  - name: Other certificate export or private-key handling script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Export-PfxCertificate* OR data_win_eventdata_scriptBlockText:*Cert\:* OR data_win_eventdata_scriptBlockText:*X509Certificate2* OR data_win_eventdata_scriptBlockText:*ExportPkcs12* OR data_win_eventdata_scriptBlockText:*Get-ChildItem*Cert*)
    pivot_on:
    - host
    window: 2h
  - name: 'Cert tooling: certutil, certreq, certmgr, mimikatz crypto, SharpDPAPI'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*certutil*-exportPFX* OR data_win_eventdata_commandLine:*certutil*-p* OR data_win_eventdata_commandLine:*crypto\:\:* OR data_win_eventdata_commandLine:*SharpDPAPI* OR data_win_eventdata_commandLine:*certificates* OR data_win_eventdata_commandLine:*Certify* OR data_win_eventdata_commandLine:*certreq*)
    pivot_on:
    - host
    window: 2h
  - name: Staging and compression of exported cert files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Compress-Archive* OR data_win_eventdata_commandLine:/.*([Rr]ar|7z|[Zz]ip)(\.exe)?.*/) AND (data_win_eventdata_commandLine:*.pfx* OR data_win_eventdata_commandLine:*.cer* OR data_win_eventdata_commandLine:*.p12* OR data_win_eventdata_commandLine:*cert*)
    pivot_on:
    - host
    window: 4h
  - name: Outbound transfer after export (web upload, SMB copy, net use)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Invoke-WebRequest* OR data_win_eventdata_commandLine:*Invoke-RestMethod* OR data_win_eventdata_commandLine:*curl* OR data_win_eventdata_commandLine:*Start-BitsTransfer* OR data_win_eventdata_commandLine:*net*use* OR data_win_eventdata_commandLine:*scp*) AND (data_win_eventdata_commandLine:*.pfx* OR data_win_eventdata_commandLine:*.cer* OR data_win_eventdata_commandLine:*.p12* OR data_win_eventdata_commandLine:*cert*)
    pivot_on:
    - host
    window: 4h
