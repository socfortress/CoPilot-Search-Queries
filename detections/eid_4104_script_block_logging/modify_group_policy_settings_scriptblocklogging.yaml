name: Modify Group Policy Settings - ScriptBlockLogging
id: b7216a7d-687e-4c8d-82b1-3080b2ad961f
version: 1
schema_version: "1.0"
date: "2022-08-19"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b7216a7d-687e-4c8d-82b1-3080b2ad961f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect malicious GPO modifications can be used to implement many other
  malicious behaviors. MITRE ATT&CK: T1484.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*GroupPolicyRefreshTimeDC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*GroupPolicyRefreshTimeOffsetDC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*GroupPolicyRefreshTime*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*GroupPolicyRefreshTimeOffset*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*EnableSmartScreen*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*ShellSmartScreenLevel*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches
  '*\SOFTWARE\Policies\Microsoft\Windows\System*';
  data_win_eventdata_scriptBlockText matches '*GroupPolicyRefreshTimeDC*';
  data_win_eventdata_scriptBlockText matches '*GroupPolicyRefreshTimeOffsetDC*',
  among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md
  - https://attack.mitre.org/techniques/T1484/001/

response:
  message: >
    Modify Group Policy Settings - ScriptBlockLogging detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1484.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1484.001
  custom_tags:
    - modify
    - group
    - policy
    - powershell
    - privilege_escalation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND (data_win_eventdata_scriptBlockText:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Ii][Mm][Ee][Dd][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Ii][Mm][Ee][Oo][Ff][Ff][Ss][Ee][Tt][Dd][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Ii][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Ii][Mm][Ee][Oo][Ff][Ff][Ss][Ee][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Ss][Mm][Aa][Rr][Tt][Ss][Cc][Rr][Ee][Ee][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Ee][Ll][Ll][Ss][Mm][Aa][Rr][Tt][Ss][Cc][Rr][Ee][Ee][Nn][Ll][Ee][Vv][Ee][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ada4b0c4-758b-46ac-9033-9004613a150d
    name: Modify Group Policy Settings
    reason: Same GroupPolicyRefreshTime change seen as a process command line (reg/powershell) - confirms the same tampering from process telemetry.
  - id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
    name: PowerShell Logging Disabled Via Registry Key Tampering
    reason: Attackers who touch policy registry keys from PowerShell often also switch off script block logging to blind this very detection.
  - id: fad91067-08c5-4d1a-8d8c-d96a21b37814
    name: Potential PowerShell Execution Policy Tampering
    reason: Co-occurring PowerShell policy-registry tampering in the same session, prepping the host for script execution.
  - id: e5ac86dd-2da1-454b-be74-05d26c769d7d
    name: Windows Default Domain GPO Modification
    reason: Refresh-interval changes are used to make a malicious GPO edit apply faster; a default domain GPO change is the payload step.
  - id: a8f29a7b-b137-4446-80a0-b804272f3da2
    name: Persistence and Execution at Scale via GPO Scheduled Task
    reason: Shortened GP refresh accelerates deployment of a GPO-pushed scheduled task across the domain, typical ransomware staging.
  - id: 123e4e6d-b123-48f8-b261-7214938acaf0
    name: Startup/Logon Script Added to Group Policy Object
    reason: A GPO startup/logon script is a likely follow-on payload distribution mechanism after refresh timing is tuned.
  - id: 1c480e10-7ee1-46d4-8ed2-85f9789e3ce4
    name: Group Policy Abuse for Privilege Addition
    reason: GPO abuse to grant privileges is a common companion to GPO timing changes on a DC.
  - id: dcff7e85-d01f-4eb5-badd-84e2e6be8294
    name: Windows Default Domain GPO Modification via GPME
    reason: Interactive editing of the default domain GPO via GPME on the same host is the manual counterpart of this scripted change.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GPO/SYSVOL file writes (scripts, GptTmpl, ScheduledTasks.xml)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*\\SYSVOL\\* OR data_win_eventdata_targetFilename:*\\Policies\\{* OR data_win_eventdata_targetFilename:*ScheduledTasks.xml OR data_win_eventdata_targetFilename:*GptTmpl.inf)
    pivot_on:
    - host
    window: 4h
  - name: Registry writes under Policies/Microsoft/Windows/System or PowerShell policy keys
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:*Policies\\Microsoft\\Windows\\System* OR data_win_eventdata_targetObject:*Policies\\Microsoft\\Windows\\PowerShell*)
    pivot_on:
    - host
    window: 2h
  - name: gpupdate / gpedit / GroupPolicy cmdlet execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:*gpupdate* OR data_win_eventdata_commandLine:*New-GPO* OR data_win_eventdata_commandLine:*Set-GPRegistryValue* OR data_win_eventdata_commandLine:*New-GPLink*)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Other script blocks touching GPO or security-policy registry
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Set-GPRegistryValue* OR data_win_eventdata_scriptBlockText:*EnableScriptBlockLogging* OR data_win_eventdata_scriptBlockText:*Set-MpPreference* OR data_win_eventdata_scriptBlockText:*\\Policies\\Microsoft\\Windows*)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Remote lateral execution from the host after policy tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:*\\wmiprvse.exe OR data_win_eventdata_parentImage:*\\services.exe OR data_win_eventdata_image:*\\psexesvc.exe OR data_win_eventdata_commandLine:*schtasks*create*)
    pivot_on:
    - host
    window: 6h
