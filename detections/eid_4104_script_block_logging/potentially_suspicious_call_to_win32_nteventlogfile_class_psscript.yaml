name: Potentially Suspicious Call To Win32_NTEventlogFile Class - PSScript
id: e2812b49-bae0-4b21-b366-7c142eafcde2
version: 1
schema_version: "1.0"
date: "2023-07-13"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e2812b49-bae0-4b21-b366-7c142eafcde2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the WMI class "Win32_NTEventlogFile" in a potentially
  suspicious way (delete, backup, change permissions, etc.) from a PowerShell
  script.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Win32_NTEventlogFile*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.BackupEventlog(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.ChangeSecurityPermissions(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.ChangeSecurityPermissionsEx(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.ClearEventLog(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.Delete(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.DeleteEx(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.Rename(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.TakeOwnerShip(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*.TakeOwnerShipEx(*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Win32_NTEventlogFile*';
  data_win_eventdata_scriptBlockText matches '*.BackupEventlog(*';
  data_win_eventdata_scriptBlockText matches '*.ChangeSecurityPermissions(*',
  among other conditions.

known_false_positives: >
  Legitimate administration and backup scripts. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/desktop/legacy/aa394225(v=vs.85)

response:
  message: >
    Potentially Suspicious Call To Win32_NTEventlogFile Class - PSScript
    detected on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - win32
    - nteventlogfile
    - class
    - powershell
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Nn][Tt][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg][Ff][Ii][Ll][Ee].*/ AND (data_win_eventdata_scriptBlockText:/.*\.[Bb][Aa][Cc][Kk][Uu][Pp][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Cc][Hh][Aa][Nn][Gg][Ee][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Ss]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Cc][Hh][Aa][Nn][Gg][Ee][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Ss][Ee][Xx]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Cc][Ll][Ee][Aa][Rr][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Dd][Ee][Ll][Ee][Tt][Ee]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Dd][Ee][Ll][Ee][Tt][Ee][Ee][Xx]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Rr][Ee][Nn][Aa][Mm][Ee]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Tt][Aa][Kk][Ee][Oo][Ww][Nn][Ee][Rr][Ss][Hh][Ii][Pp]\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.[Tt][Aa][Kk][Ee][Oo][Ww][Nn][Ee][Rr][Ss][Hh][Ii][Pp][Ee][Xx]\(.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: caf201a9-c2ce-4a26-9c3a-2b9525413711
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    reason: Same WMI event-log abuse seen from the process command line rather than script block; confirms the launching PowerShell/wmic process.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Co-occurring log-clearing path via wevtutil/Clear-EventLog; attackers often try several methods to wipe the same logs.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Alternative LOLBin used to clear event logs; paired with WMI ClearEventLog it shows deliberate anti-forensic log wiping.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: Same script-block channel; ETW tampering is a sibling defense-impairment step done before or alongside log clearing.
  - id: 602f5669-6927-4688-84db-0d4b7afb2150
    name: Disable Powershell Command History
    reason: PowerShell-side anti-forensics; same operator hiding script activity that preceded the event-log manipulation.
  - id: 26b692dc-1722-49b2-b496-a8258aa6371d
    name: Clear PowerShell History - PowerShell
    reason: Cleaning PowerShell history around the log wipe indicates a cover-your-tracks phase after malicious scripting.
  - id: 907ac95c-4dd9-11ec-ba2c-acde48001122
    name: PowerShell Windows Defender Exclusion Commands
    reason: 'Common precursor defense impairment: AV exclusions added before running tooling whose traces are then erased.'
  - id: c1337eb8-921a-4b59-855b-4ba188ddcc42
    name: Deletion of Volume Shadow Copies via WMI with PowerShell - PS Script
    reason: WMI-driven destructive PowerShell; shadow-copy deletion plus log clearing is a classic ransomware/destruction pairing.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other event-log clearing/audit tampering on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ AND data_win_eventdata_commandLine:/.*([Cc][Ll]|[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg]|[Ss][Ll]|[Ss][Ee][Tt]-[Ll][Oo][Gg]).*/) OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\.[Cc][Ll][Ee][Aa][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Ee][Vv][Ee][Nn][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: WMI/CIM invocation and the parent process driving it
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Gg]et|[Ii]nvoke)-([Ww]mi[Oo]bject|[Cc]im[Mm]ethod|[Ww]mi[Mm]ethod).*/) AND data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/
    pivot_on:
    - host
    window: 1h
  - name: 'Defense impairment preceding log wipe: Defender exclusions, AMSI, ETW tamper'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Tt][Ww][Ee][Vv][Ee][Nn][Tt][Ss][Oo][Uu][Rr][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Destructive/impact follow-on: shadow copy and backup deletion'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Privileged logon context for the acting account
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"2")
    pivot_on:
    - host
    - user
    window: 2h
