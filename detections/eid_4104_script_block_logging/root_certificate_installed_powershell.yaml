name: Root Certificate Installed - PowerShell
id: 42821614-9264-4761-acfc-5772c3286f76
version: 1
schema_version: "1.0"
date: "2022-12-02"
author: oscd.community, @redcanary, Zach Stanford @svch0st
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 42821614-9264-4761-acfc-5772c3286f76
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may install a root certificate on a compromised system to avoid
  warnings when connecting to adversary controlled web servers. MITRE ATT&CK:
  T1553.004.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Move-Item*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Cert:\\\\LocalMachine\\\\Root*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Import-Certificate*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Cert:\\\\LocalMachine\\\\Root*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Move-Item*';
  data_win_eventdata_scriptBlockText matches '*Cert:\LocalMachine\Root*';
  data_win_eventdata_scriptBlockText matches '*Import-Certificate*', among other
  conditions.

known_false_positives: >
  Help Desk or IT may need to manually add a corporate Root CA on occasion. Need
  to test if GPO push doesn't trigger FP. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1553.004/T1553.004.md
  - https://attack.mitre.org/techniques/T1553/004/

response:
  message: >
    Root Certificate Installed - PowerShell detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1553.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.004
  custom_tags:
    - certificate
    - installed
    - powershell
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND ((data_win_eventdata_scriptBlockText:/.*[Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Ee][Rr][Tt]:\\[Ll][Oo][Cc][Aa][Ll][Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Rr][Oo][Oo][Tt].*/) OR (data_win_eventdata_scriptBlockText:/.*[Ii][Mm][Pp][Oo][Rr][Tt]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Ee][Rr][Tt]:\\[Ll][Oo][Cc][Aa][Ll][Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Rr][Oo][Oo][Tt].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d223b46b-5621-4037-88fe-fda32eead684
    name: New Root or CA or AuthRoot Certificate to Store
    reason: Registry-level (Sysmon 13) view of the same LocalMachine Root store write; confirms the PowerShell import actually landed in the trust store.
  - id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
    name: New Root Certificate Installed Via Certutil.EXE
    reason: Same root-trust tampering via certutil -addstore; attackers often fall back to it if the PowerShell path is blocked.
  - id: ff992eac-6449-4c60-8c1d-91c9722a1d48
    name: New Root Certificate Installed Via CertMgr.EXE
    reason: Alternative native tool for installing an attacker CA, same objective of trusting adversary-controlled TLS.
  - id: 5f6a601c-2ecb-498b-9c33-660362323afa
    name: Root Certificate Installed From Susp Locations
    reason: Root cert installed from temp/user-writable paths shows the CA file was dropped by the attacker just before import.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: the attacker''s script usually downloads the .cer/.crt (or payload) via PowerShell before importing it.'
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: Download-cradle precursor that stages the rogue CA or follow-on tooling in the same script session.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: 'Co-occurring defense impairment: actors installing a rogue root typically also blind AV before staging tooling.'
  - id: 5e38ded4-c964-41f4-8cb6-4a1a53c6929f
    name: Windows PowerShell Export Certificate
    reason: Certificate-store manipulation from the same PowerShell session; export of certs/keys is a sibling action on the store.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry write to machine Root/AuthRoot/CA certificate store
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]\\([Rr][Oo][Oo][Tt]|[Aa][Uu][Tt][Hh][Rr][Oo][Oo][Tt]|[Cc][Aa]|[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ee][Rr])\\[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss].*/
    pivot_on:
    - host
    window: 1h
  - name: Certificate files dropped on disk (.cer/.crt/.pfx/.p7b)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Cc][Ee][Rr]|[Cc][Rr][Tt]|[Pp][Ff][Xx]|[Pp]7[Bb]|[Dd][Ee][Rr])/
    pivot_on:
    - host
    window: 2h
  - name: Certificate tooling and proxy/trust configuration processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*-([Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee]|[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]).*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Mm][Gg][Rr].*-[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Ww][Ii][Nn][Hh][Tt][Tt][Pp].*[Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss].*[Pp][Rr][Oo][Xx][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell network connections or DNS to uncommon destinations after cert install
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download cradle / Defender tampering script blocks in same session
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/)
    pivot_on:
    - host
    window: 2h
