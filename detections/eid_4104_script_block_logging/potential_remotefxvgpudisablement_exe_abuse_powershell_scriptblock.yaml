name: Potential RemoteFXvGPUDisablement.EXE Abuse - PowerShell ScriptBlock
id: cacef8fc-9d3d-41f7-956d-455c6e881bc5
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cacef8fc-9d3d-41f7-956d-455c6e881bc5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell module creation where the module Contents are set to
  "function Get-VMRemoteFXPhysicalVideoAdapter". This could be a sign of
  potential abuse of the "RemoteFXvGPUDisablement.exe" binary which is known to
  be vulnerable to module load-order hijacking. MITRE ATT&CK: T1218.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "function Get-VMRemoteFXPhysicalVideoAdapter {*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches 'function
  Get-VMRemoteFXPhysicalVideoAdapter {*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218/T1218.md
  - https://github.com/redcanaryco/AtomicTestHarnesses/blob/7e1e4da116801e3d6fcc6bedb207064577e40572/TestHarnesses/T1218_SignedBinaryProxyExecution/InvokeRemoteFXvGPUDisablementCommand.ps1
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential RemoteFXvGPUDisablement.EXE Abuse - PowerShell ScriptBlock
    detected on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - remotefxvgpudisablement
    - abuse
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn] [Gg][Ee][Tt]-[Vv][Mm][Rr][Ee][Mm][Oo][Tt][Ee][Ff][Xx][Pp][Hh][Yy][Ss][Ii][Cc][Aa][Ll][Vv][Ii][Dd][Ee][Oo][Aa][Dd][Aa][Pp][Tt][Ee][Rr] \{.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a6fc3c46-23b8-4996-9ea2-573f4c4d88c5
    name: RemoteFXvGPUDisablement Abuse Via AtomicTestHarnesses
    reason: 'Process-creation view of the same abuse: RemoteFXvGPUDisablement.exe launched with a hijacked module path; confirms the script block was actually executed by the signed binary.'
  - id: 38a7625e-b2cb-485d-b83d-aff137d859f4
    name: Potential RemoteFXvGPUDisablement.EXE Abuse - PowerShell Module
    reason: Same Get-VMRemoteFXPhysicalVideoAdapter fake-module load seen through module logging (4103); co-occurs with the 4104 block when the hijacked module is imported.
  - id: e3845023-ca9a-4024-b2b2-5422156d5527
    name: PowerShell Module File Created By Non-PowerShell Process
    reason: The hijack requires a rogue .psm1/.psd1 dropped in a module search path by a non-PowerShell process before RemoteFXvGPUDisablement.exe loads it; direct precursor.
  - id: e8a52bbd-bced-459f-bd93-64db45ce7657
    name: Potential Suspicious PowerShell Module File Created
    reason: Planting a module file in a writable PSModulePath directory is the staging step of module load-order hijacking, immediately preceding this script block.
  - id: c31364f7-8be6-4b77-8483-dd2b5a7b69a3
    name: Import PowerShell Modules From Suspicious Directories - ProcCreation
    reason: Attacker-controlled module directory passed to the signed binary or PowerShell is the delivery mechanism of the hijack; same module-load abuse path.
  - id: b66474aa-bd92-4333-a16c-298155b120df
    name: Potential Persistence Via Powershell Search Order Hijacking - Task
    reason: Same PowerShell module search-order hijacking class; if present the signed-binary proxy execution is being used for persistence rather than one-off execution.
  - id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
    name: Suspicious PowerShell Encoded Command Patterns
    reason: The hijacked module payload commonly runs an encoded PowerShell stage next, as the first follow-on action after proxy execution.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Likely next step once code runs under a trusted signed binary: pull a second-stage payload via a download cradle.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RemoteFXvGPUDisablement.exe launch and its child processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr]emote[Ff][Xx]v[Gg][Pp][Uu][Dd]isablement\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Rr]emote[Ff][Xx]v[Gg][Pp][Uu][Dd]isablement\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*RemoteFXvGPUDisablement*)
    pivot_on:
    - host
    window: 1h
  - name: Rogue PowerShell module file dropped (psm1/psd1) in module path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(*.psm1 OR *.psd1)
    pivot_on:
    - host
    window: 2h
  - name: Hyper-V RemoteFX module name used in other script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get\-VMRemoteFXPhysicalVideoAdapter* OR data_win_eventdata_scriptBlockText:*Disable\-VMRemoteFXPhysicalVideoAdapter*)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell spawned by signed-binary proxy with download/encoded payload
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell(_ise)?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*\-enc* OR data_win_eventdata_commandLine:*DownloadString* OR data_win_eventdata_commandLine:*Invoke\-WebRequest* OR data_win_eventdata_commandLine:*IEX*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections from PowerShell or the RemoteFX binary
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr]emote[Ff][Xx]v[Gg][Pp][Uu][Dd]isablement\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
