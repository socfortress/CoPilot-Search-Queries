name: Get-DomainUser with PowerShell Script Block
id: 61994268-04f4-11ec-865c-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainUser` cmdlet using 
  PowerShell Script Block Logging (EventID 4104). This cmdlet is part of PowerView, 
  a tool often used for domain enumeration. The detection leverages PowerShell 
  operational logs to identify instances where this command is executed. Monitoring 
  this activity is crucial as it may indicate an adversary's attempt to gather 
  information about domain users, which is a common step in Active Directory Discovery. 
  If confirmed malicious, this activity could lead to further reconnaissance and 
  potential exploitation of domain resources.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainUser*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  The following Hunting analytic requires PowerShell operational logs to be imported. 
  The Wazuh agent ossec.conf should include the Microsoft-Windows-PowerShell/Operational 
  event channel. This detection monitors for the Get-DomainUser cmdlet, which is used 
  for domain user enumeration. Validate that data_win_eventdata_scriptBlockText field 
  is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this command for legitimate troubleshooting 
  and system administration purposes. Filter based on user context and whether the 
  action was expected and authorized within your organization.

references:
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainUser/
  - https://attack.mitre.org/techniques/T1087/002/
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet

response:
  message: >
    Get-DomainUser execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain user enumeration/reconnaissance activity for targeting. 
    MITRE ATT&CK: T1087.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - CISA AA23-347A
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - get_domainuser
    - active_directory
    - user_enumeration
    - domain_users
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainUser.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: 'Same PowerView session: after enumerating users, operators typically enumerate groups to find privileged memberships.'
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Follow-on PowerView hunt for Domain/Enterprise Admins members to pick high-value targets from the user list.
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: Co-occurring PowerView recon mapping the machines users log onto, extending user enumeration into host targeting.
  - id: 676b600a-a94d-4951-b346-11329431e6c1
    name: Get-DomainController with PowerShell Script Block
    reason: PowerView DC discovery usually precedes or accompanies Get-DomainUser, as the LDAP target for the queries.
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: Same PowerView toolkit; trust enumeration widens the user recon to other domains in the forest.
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: Get-DomainUser -PreauthNotRequired/-SPN is the standard way to find AS-REP roastable and Kerberoastable accounts, a direct next step.
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: Accounts found by Get-DomainUser (SPN / no-preauth) are then attacked with Rubeus roasting or ticket operations.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Credential theft in the same PowerShell session commonly follows recon once target users are identified.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / AD recon cmdlets in script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain([Gg]roupMember|[Gg]roup|[Cc]omputer|[Oo][Uu]|[Gg][Pp][Oo]|[Ff]ileServer|[Ss][Ii][Tt][Ee]|[Ss][Ii][Dd]).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocalAdminAccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-([Uu]ser[Hh]unter|[Ss]hare[Ff]inder|[Aa]CL[Ss]canner).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell loading PowerView / PowerSploit from remote or staged source
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Pp]ower[Vv]iew|[Pp]ower[Ss]ploit).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]mport-[Mm]odule.*[Pp]ower[Vv]iew.*/ OR data_win_eventdata_scriptBlockText:/.*(DownloadString|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii][Ww][Rr]).*([Pp]ower[Vv]iew|[Rr]econ).*/)
    pivot_on:
    - host
    window: 4h
  - name: Kerberoast / AS-REP roast and ticket tooling on this host
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]ubeus.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]equest-[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*KerberosRequestorSecurityToken.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Kk]erberoast|[Aa]sktgs|[Aa]sreproast|[Rr]ubeus).*/)
    pivot_on:
    - host
    window: 6h
  - name: SharpHound / AD enumeration binaries and LDAP-heavy tooling executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Ss]harp[Hh]ound|[Aa]d[Ff]ind|[Aa]d[Ee]xplorer|[Ss]etspn|[Nn]ltest|[Dd]squery)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss]harp[Hh]ound|-[Cc]ollection[Mm]ethod|[Ll]dap[Ss]earch).*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Credential access following enumeration: LSASS access or dump'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]ekurlsa|[Cc]omsvcs.*[Mm]ini[Dd]ump|[Pp]rocdump.*[Ll]sass).*/)
    pivot_on:
    - host
    window: 4h
