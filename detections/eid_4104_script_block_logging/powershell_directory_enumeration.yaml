name: Powershell Directory Enumeration
id: 162e69a7-7981-4344-84a9-0f1c9a217a52
version: 1
schema_version: "1.0"
date: "2022-03-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 162e69a7-7981-4344-84a9-0f1c9a217a52
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects technique used by MAZE ransomware to enumerate directories using
  Powershell. MITRE ATT&CK: T1083.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*foreach*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Get-ChildItem*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Path *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-ErrorAction *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*SilentlyContinue*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Out-File *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-append*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*foreach*';
  data_win_eventdata_scriptBlockText matches '*Get-ChildItem*';
  data_win_eventdata_scriptBlockText matches '*-Path *', among other conditions.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1083/T1083.md
  - https://www.mandiant.com/resources/tactics-techniques-procedures-associated-with-maze-ransomware-incidents
  - https://attack.mitre.org/techniques/T1083/

response:
  message: >
    Powershell Directory Enumeration detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1083
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1083
  custom_tags:
    - powershell
    - directory
    - enumeration
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ff][Oo][Rr][Ee][Aa][Cc][Hh].*/ AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Tt][Hh] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Ee][Rr][Rr][Oo][Rr][Aa][Cc][Tt][Ii][Oo][Nn] .*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Ll][Yy][Cc][Oo][Nn][Tt][Ii][Nn][Uu][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Oo][Uu][Tt]-[Ff][Ii][Ll][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Aa][Pp][Pp][Ee][Nn][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: Same PowerShell file-hunting behaviour narrowed to sensitive file types; confirms the directory sweep is targeting valuable data rather than routine admin scripting.
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: Recursive enumeration written to a file is the staging step of automated collection; this catches the script that then gathers the listed files.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: 'Follow-on staging: enumerated folders are zipped with Compress-Archive ahead of exfiltration, as in Maze intrusions.'
  - id: 29fd07fc-9cfd-4331-b7fd-cc18dfa21052
    name: Potential Maze Ransomware Activity
    reason: The enumeration technique comes from Maze ransomware reporting; this catches the Maze execution chain on the same host.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware operators enumerate files then delete shadow copies before encrypting; causal follow-on if the listing was ransomware recon.
  - id: c1337eb8-921a-4b59-855b-4ba188ddcc42
    name: Deletion of Volume Shadow Copies via WMI with PowerShell - PS Script
    reason: Script-block-level shadow copy deletion in the same PowerShell session after file discovery is a strong pre-encryption signal.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Maze-style actors exfiltrate the enumerated data with rclone; links discovery to cloud exfiltration.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Command-line exfiltration of data staged after the directory listing.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive and staging tools run on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Rr][Aa][Rr]|7[Zz]|7[Zz][Aa]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Ww][Ii][Nn][Zz][Ii][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*[Ss]ystem\.[Ii][Oo]\.[Cc]ompression.*/)
    pivot_on:
    - host
    window: 2h
  - name: Exfiltration tooling or cloud-sync binaries on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*[Pp][Oo][Ss][Tt].*/)
    pivot_on:
    - host
    window: 4h
  - name: Shadow copy deletion and backup or boot tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]hadows.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Dd]elete +[Ss]hadows.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*([Rr]ecoveryenabled|[Bb]ootstatuspolicy).*/ OR data_win_eventdata_commandLine:/.*[Ww]in32_[Ss]hadowcopy.*/)
    pivot_on:
    - host
    window: 4h
  - name: Archive or enumeration output files written by PowerShell
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].*/) AND (data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz])/ OR data_win_eventdata_targetFilename:/.*([Ff]iles|[Ll]ist|[Dd]ir|[Ee]num|[Ii]nventory).*\.([Tt][Xx][Tt]|[Cc][Ss][Vv]|[Ll][Oo][Gg])/)
    pivot_on:
    - host
    window: 2h
  - name: Other PowerShell file-hunting or collection script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]hild[Ii]tem.*-[Rr]ecurse.*([Pp]assword|\.[Pp][Ff][Xx]|\.[Kk][Ee][Yy]|\.[Kk][Dd][Bb][Xx]|\.[Dd][Oo][Cc]|\.[Xx][Ll][Ss]).*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]opy-[Ii]tem.*-[Rr]ecurse.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]elect-[Ss]tring.*-[Pp]attern.*[Pp]assw.*/)
    pivot_on:
    - host
    window: 2h
