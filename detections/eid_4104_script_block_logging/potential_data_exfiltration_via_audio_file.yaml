name: Potential Data Exfiltration Via Audio File
id: e4f93c99-396f-47c8-bb0f-201b1fa69034
version: 1
schema_version: "1.0"
date: "2023-01-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e4f93c99-396f-47c8-bb0f-201b1fa69034
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential exfiltration attempt via audio file using PowerShell.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*[System.Math]::*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*[IO.FileMode]::*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*BinaryWriter*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*0x52*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*0x49*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*0x46*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*0x57*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*0x41*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*0x56*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*0x45*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*0xAC*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*[System.Math]::*';
  data_win_eventdata_scriptBlockText matches '*[IO.FileMode]::*';
  data_win_eventdata_scriptBlockText matches '*BinaryWriter*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/gtworek/PSBits/blob/e97cbbb173b31cbc4d37244d3412de0a114dacfb/NoDLP/bin2wav.ps1

response:
  message: >
    Potential Data Exfiltration Via Audio File detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - exfiltration
    - audio
    - powershell
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Mm][Aa][Tt][Hh]\]::.*/ AND data_win_eventdata_scriptBlockText:/.*\[[Ii][Oo]\.[Ff][Ii][Ll][Ee][Mm][Oo][Dd][Ee]\]::.*/ AND data_win_eventdata_scriptBlockText:/.*[Bb][Ii][Nn][Aa][Rr][Yy][Ww][Rr][Ii][Tt][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx]52.*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx]49.*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx]46.*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx]57.*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx]41.*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx]56.*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx]45.*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx][Aa][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: Data is usually collected and archived by PowerShell before being encoded into a WAV (bin2wav); this is the staging precursor on the same host.
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: After the data is disguised as audio, the .wav is typically sent out over HTTP(S) from PowerShell; this is the direct follow-on transfer.
  - id: 59e8bf41-7472-412a-90d3-00f3afa452e9
    name: Windows Exfiltration Over C2 Via Powershell UploadString
    reason: Alternative PowerShell WebClient upload channel for shipping the encoded WAV payload out.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: The generated audio file can be uploaded with curl to a file-sharing site, the non-PowerShell exfil path for the same artifact.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Command-line tools used to move the staged WAV off-host are the likely next step after DLP-evading encoding.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Operators often archive and password-protect collected data before or alongside the WAV encoding; same exfil-prep chain.
  - id: d59d7842-9a21-4bc6-ba98-64bfe0091355
    name: Powershell DNSExfiltration
    reason: Co-occurring PowerShell exfil channel; an actor with a DLP-evasion encoder may fall back to DNS exfiltration of the same data.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WAV/audio files written by PowerShell or script hosts
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ww][Aa][Vv]/ AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]).*/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell file collection and archiving before encoding
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Zz][Ii][Pp][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Aa][Dd][Aa][Ll][Ll][Bb][Yy][Tt][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm].*-[Rr][Ee][Cc][Uu][Rr][Ss][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound upload of data after encoding
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*-[Mm][Ee][Tt][Hh][Oo][Dd].*[Pp][Oo][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*-[Ii][Nn][Ff][Ii][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound transfer tools launched from PowerShell or shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Pp][Ss][Cc][Pp]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: PowerShell network connections to external hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]).*/ AND data_win_eventdata_initiated:"true" AND NOT data_win_eventdata_destinationIsIpv6:"true"
    pivot_on:
    - host
    window: 2h
