name: Windows Screen Capture with CopyFromScreen
id: d4a11f63-2390-411c-9adf-d791fd152830
version: 1
schema_version: "1.0"
date: "2022-07-07"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d4a11f63-2390-411c-9adf-d791fd152830
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may attempt to take screen captures of the desktop to gather
  information over the course of an operation. Screen capturing functionality
  may be included as a feature of a remote access tool used in post-compromise
  operations. MITRE ATT&CK: T1113.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.CopyFromScreen*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*.CopyFromScreen*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1113/T1113.md#atomic-test-6---windows-screen-capture-copyfromscreen
  - https://attack.mitre.org/techniques/T1113/

response:
  message: >
    Windows Screen Capture with CopyFromScreen detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1113
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1113
  custom_tags:
    - screen
    - capture
    - copyfromscreen
    - powershell
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\.[Cc][Oo][Pp][Yy][Ff][Rr][Oo][Mm][Ss][Cc][Rr][Ee][Ee][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
    name: Windows Screen Capture Via Powershell
    reason: Sibling screen-capture detection in the same 4104 channel; Graphics.CopyFromScreen is usually paired with other System.Drawing/Bitmap capture calls in the same script, confirming the capture loop.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: Alternate native screen-capture method (Problem Steps Recorder); operators often fall back to psr.exe when the PowerShell route is blocked or logged.
  - id: 965e2db9-eddb-4cf6-a986-7a967df651e4
    name: Potential Keylogger Activity
    reason: Screen grabbing is routinely bundled with keystroke capture (GetAsyncKeyState/hooks) in PowerShell spyware modules such as Empire/PowerSploit Get-Keystrokes and Get-TimedScreenshot.
  - id: 34f90d3c-c297-49e9-b26d-911b05a4866c
    name: Powershell Keylogging
    reason: Co-occurring input-capture script block on the same host indicates a full user-surveillance implant rather than a one-off screenshot.
  - id: windows-clipboard-data-get-clipboard-001
    name: Windows ClipBoard Data via Get-ClipBoard
    reason: Clipboard scraping is the third leg of PowerShell user-surveillance collection (screen, keys, clipboard) executed from the same script.
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: Captured screenshots are saved to disk and typically compressed into an archive before exfiltration - the staging step that follows capture.
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: Screenshots are commonly POSTed straight to the C2 or a webhook with Invoke-RestMethod; this is the exfil step of the capture.
  - id: 59e8bf41-7472-412a-90d3-00f3afa452e9
    name: Windows Exfiltration Over C2 Via Powershell UploadString
    reason: WebClient UploadString/UploadFile is the other common PowerShell channel for sending captured images (often base64) out.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerShell user-surveillance primitives (keylog, clipboard, window title, audio, hooks)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Aa][Ss][Yy][Nn][Cc][Kk][Ee][Yy][Ss][Tt][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt][Ww][Ii][Nn][Dd][Oo][Ww][Ss][Hh][Oo][Oo][Kk][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Ff][Oo][Rr][Ee][Gg][Rr][Oo][Uu][Nn][Dd][Ww][Ii][Nn][Dd][Oo][Ww].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Cc][Ii][Ss][Ee][Nn][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ff][Oo][Rr][Mm][Ss]\.[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Screenshot image files written by PowerShell (png/jpg/bmp in user-writable paths)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_targetFilename:/.*\.([Pp][Nn][Gg]|[Jj][Pp][Ee]?[Gg]|[Bb][Mm][Pp]|[Gg][Ii][Ff])/ AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Pp][Ii][Cc][Tt][Uu][Rr][Ee][Ss]\\|\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\).*/
    pivot_on:
    - host
    window: 1h
  - name: Staging of captured images into archives (Compress-Archive, ZipFile, 7z/rar)
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Zz][Ii][Pp][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Ff][Rr][Oo][Mm][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\7[Zz]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell upload / exfil of captured data to web endpoints (script blocks)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*[Pp][Oo][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Nn][Dd]-[Mm][Aa][Ii][Ll][Mm][Ee][Ss][Ss][Aa][Gg][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*(discord(app)?\.com/api/webhooks|api\.telegram\.org/bot).*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups to common screenshot-exfil services from the host
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*(discord(app)?\.com|api\.telegram\.org|pastebin\.com|transfer\.sh|anonfiles|file\.io|mega\.nz|gofile\.io|webhook\.site|ngrok).*/
    pivot_on:
    - host
    window: 2h
