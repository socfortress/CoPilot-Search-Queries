name: Windows Enable PowerShell Web Access
id: 175bb2de-6227-416b-9678-9b61999cd21f
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the enabling of PowerShell Web Access via PowerShell commands including
  Install-WindowsFeature WindowsPowerShellWebAccess, Install-PswaWebApplication,
  or Add-PswaAuthorizationRule. PowerShell Web Access provides a web-based
  PowerShell console that allows remote execution of PowerShell commands through
  a browser. Threat actors may enable this feature to establish persistent remote
  access to compromised systems, bypassing traditional remote access controls.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Install-WindowsFeature*WindowsPowerShellWebAccess*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Install-PswaWebApplication*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Add-PswaAuthorizationRule*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Legitimate scripts or network administrators may enable PowerShell Web Access
  for authorized remote management purposes. Monitor and escalate as needed,
  verifying the user context and business justification.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
  - https://gist.github.com/MHaggis/7e67b659af9148fa593cf2402edebb41

response:
  message: >
    PowerShell Web Access enabled on $agent_name$ by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - CISA AA24-241A
    - Malicious PowerShell
    - Persistence
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell_web_access
    - pswa
    - remote_access
    - persistence
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Install-WindowsFeature.*WindowsPowerShellWebAccess.*/ OR data_win_eventdata_scriptBlockText:/.*Install-PswaWebApplication.*/ OR data_win_eventdata_scriptBlockText:/.*Add-PswaAuthorizationRule.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5f9c7f1a-7c21-4c39-b2f3-8d8006e0e51f
    name: PowerShell Web Access Installation - PsScript
    reason: Sibling script-block detection of the same PSWA install; confirms the install and may catch variants this rule's patterns miss
  - id: 7e8f2d3b-9c1a-4f67-b9e8-8d9006e0e51f
    name: PowerShell Web Access Feature Enabled Via DISM
    reason: Alternate way to install the same PSWA feature (dism.exe); the attacker may have used DISM before or after the PowerShell cmdlets
  - id: windows-dism-install-pswa-001
    name: Windows DISM Install PowerShell Web Access
    reason: Process-creation view of the DISM-based PSWA install, corroborating the feature was enabled on this host
  - id: 991a9744-f2f0-44f2-bd33-9092eba17dc3
    name: Enable Windows Remote Management
    reason: PSWA needs a working WinRM/remoting endpoint; enabling WinRM just before or after is a causal precursor of web-based remote shell
  - id: a5d85486-b89c-11eb-8267-acde48001122
    name: Allow Inbound Traffic In Firewall Rule
    reason: PSWA is served over IIS on 443; the attacker must open inbound access, so a new allow-inbound rule is the follow-on that makes the web console reachable
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Netsh variant of opening the inbound port needed to expose the PSWA gateway externally
  - id: 488b44e7-3781-4a71-888d-c95abfacf44d
    name: Windows Firewall Profile Disabled
    reason: Disabling the firewall profile is a blunt way to make the new PSWA web endpoint reachable and hide the exposure
  - id: 42821614-9264-4761-acfc-5772c3286f76
    name: Root Certificate Installed - PowerShell
    reason: Install-PswaWebApplication -UseTestCertificate creates and trusts a self-signed cert; a rogue root/cert install alongside PSWA setup indicates scripted gateway deployment
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PSWA gateway setup cmdlets and test certificate in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Uu][Ss][Ee][Tt][Ee][Ss][Tt][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Pp][Ss][Ww][Aa][Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn][Rr][Uu][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Pp][Ss][Rr][Ee][Mm][Oo][Tt][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ss][Ee][Ll][Ff][Ss][Ii][Gg][Nn][Ee][Dd][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][Ww][Ee][Bb][Aa][Cc][Cc][Ee][Ss][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Firewall rules or profile changes opening inbound access (netsh / process)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Aa][Dd][Dd].*[Rr][Uu][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Ss][Ee][Tt].*[Oo][Ff][Ff].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Oo][Pp][Ee][Nn][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: DISM / IIS tooling used to install or configure web components
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Ff][Ee][Aa][Tt][Uu][Rr][Ee].*/) OR (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*\\[Ii][Ii][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*\\[Pp][Aa][Ss][Ss][Ii][Nn][Gg].*/ AND data_win_eventdata_commandLine:/.*[Ii][Ii][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: Inbound HTTPS connections to the new PSWA gateway (w3wp / IIS)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"false" AND data_win_eventdata_destinationPort:"443" AND (data_win_eventdata_image:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Ii][Ss][Ee][Xx][Pp][Rr][Ee][Ss][Ss].*/)
    pivot_on:
    - host
    window: 24h
  - name: Processes spawned by IIS worker or wsmprovhost (PSWA remote shell activity)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 24h
