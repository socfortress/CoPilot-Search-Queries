name: Potential Active Directory Enumeration Using AD Module - PsScript
id: 9e620995-f2d8-4630-8430-4afd89f77604
version: 1
schema_version: "1.0"
date: "2023-01-22"
author: frack113, Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e620995-f2d8-4630-8430-4afd89f77604
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Import-Module" cmdlet to load the
  "Microsoft.ActiveDirectory.Management.dl" DLL. Which is often used by
  attackers to perform AD enumeration.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Import-Module *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Microsoft.ActiveDirectory.Management.dll*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*ipmo Microsoft.ActiveDirectory.Management.dll*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Import-Module *';
  data_win_eventdata_scriptBlockText matches
  '*Microsoft.ActiveDirectory.Management.dll*';
  data_win_eventdata_scriptBlockText matches '*ipmo
  Microsoft.ActiveDirectory.Management.dll*'.

known_false_positives: >
  Legitimate use of the library for administrative activity. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/samratashok/ADModule
  - https://twitter.com/cyb3rops/status/1617108657166061568?s=20
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/active-directory-enumeration-with-ad-module-without-rsat-or-admin-privileges

response:
  message: >
    Potential Active Directory Enumeration Using AD Module - PsScript detected
    on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - active
    - directory
    - enumeration
    - powershell
    - reconnaissance
    - discovery
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND ((data_win_eventdata_scriptBlockText:/.*[Ii][Mm][Pp][Oo][Rr][Tt]-[Mm][Oo][Dd][Uu][Ll][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy]\.[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt]\.[Dd][Ll][Ll].*/) OR data_win_eventdata_scriptBlockText:/.*[Ii][Pp][Mm][Oo] [Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy]\.[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt]\.[Dd][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 74176142-4684-4d8a-8b0a-713257e7df8e
    name: Potential Active Directory Enumeration Using AD Module - PsModule
    reason: Same Import-Module of Microsoft.ActiveDirectory.Management.dll seen via module logging (4103); corroborates the script block with a second log source.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: Process-creation view of the same AD-module load (command line); confirms the PowerShell process that ran it.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Operators using the dependency-free AD module often also run PowerView cmdlets for deeper AD recon in the same session.
  - id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
    name: Get-ADUser Enumeration Using UserAccountControl Flags
    reason: Once the AD module is loaded, Get-ADUser with UAC filters (roastable/no-preauth accounts) is the typical next query.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN discovery for Kerberoasting commonly follows AD enumeration on the same host.
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: Enumeration of service accounts leads to service-ticket requests (Kerberoasting) as the follow-on credential attack.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Parallel or subsequent graph-based AD collection by the same operator on the same host.
  - id: 02773bed-83bf-469f-b7ff-e676e7d78bab
    name: BloodHound Collection Files
    reason: File artefacts (zip/json) written by AD collectors indicate the enumeration output was staged.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD enumeration cmdlets in script blocks (Get-AD*, PowerView)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd](User|Computer|Group|GroupMember|Domain|DomainController|Forest|Trust|ObjectAcl|Object).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain(User|Computer|Controller|Trust|Group|SPNTicket).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/)
    pivot_on:
    - host
    window: 2h
  - name: AD recon tooling and LDAP/SPN discovery processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa]d[Ff]ind|[Ss]harp[Hh]ound|[Ss]etspn|[Dd]squery|[Nn]ltest|[Ll]difde|[Cc]svde)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Nn]et1? (group|user|accounts) .*\/domain|[Nn]ltest.*\/dclist|[Nn]ltest.*\/domain_trusts).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberoasting / delegation abuse after AD enumeration
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]equest-[Ss][Pp][Nn]([Tt]icket).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*KerberosRequestorSecurityToken.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ervicePrincipalName.*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: AD collection output staged or AD module DLL dropped/loaded
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Bb]lood[Hh]ound.*/ OR data_win_eventdata_targetFilename:/.*_BloodHound\.zip/ OR data_win_eventdata_targetFilename:/.*[Mm]icrosoft\.[Aa]ctive[Dd]irectory\.[Mm]anagement\.[Dd][Ll][Ll]/)) OR (data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Mm]icrosoft\.[Aa]ctive[Dd]irectory\.[Mm]anagement.*/)
    pivot_on:
    - host
    window: 2h
  - name: Network connections to domain controller LDAP/Kerberos ports from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"9389")
    pivot_on:
    - host
    window: 1h
