name: Malicious ShellIntel PowerShell Commandlets
id: 402e1e1d-ad59-47b6-bf80-1ee44985b3a7
version: 1
schema_version: "1.0"
date: "2023-01-02"
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 402e1e1d-ad59-47b6-bf80-1ee44985b3a7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Commandlet names from ShellIntel exploitation scripts. MITRE ATT&CK:
  T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Invoke-SMBAutoBrute*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Invoke-GPOLinks*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Invoke-Potato*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Invoke-SMBAutoBrute*';
  data_win_eventdata_scriptBlockText matches '*Invoke-GPOLinks*';
  data_win_eventdata_scriptBlockText matches '*Invoke-Potato*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Shellntel/scripts/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Malicious ShellIntel PowerShell Commandlets detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - shellintel
    - powershell
    - commandlets
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ss][Mm][Bb][Aa][Uu][Tt][Oo][Bb][Rr][Uu][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Gg][Pp][Oo][Ll][Ii][Nn][Kk][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Pp][Oo][Tt][Aa][Tt][Oo].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Invoke-GPOLinks is an AD/GPO reconnaissance cmdlet; PowerView script blocks on the same host show the broader domain enumeration the ShellIntel toolkit is part of
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: Co-occurring Active Directory recon in script blocks, the discovery phase that precedes SMB brute force and privilege escalation
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: ShellIntel scripts are typically pulled from GitHub/web via a download cradle just before their cmdlets run (precursor)
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Process-level view of the IEX/WebClient cradle that loads the ShellIntel script into memory
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Download-and-execute pattern that delivers the offensive script before Invoke-Potato/SMBAutoBrute run
  - id: 1c563233-030e-4a07-af8c-ee0490a66d3a
    name: Suspicious New-PSDrive to Admin Share
    reason: Invoke-SMBAutoBrute success leads to authenticated admin share access for lateral movement (follow-on)
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: AD mapping tool commonly used alongside GPO-link recon to find escalation paths after local compromise
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Operators often obfuscate or encode the launcher carrying these offensive scripts
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradles and in-memory loaders in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*raw.githubusercontent.com* OR data_win_eventdata_scriptBlockText:*Invoke-Expression*)
    pivot_on:
    - host
    window: 2h
  - name: Sustained outbound SMB connections from PowerShell (brute force / spreading)
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 2h
  - name: Failed network logons from this host (SMB brute force result)
    query: data_win_system_eventID:"4625" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"2")
    pivot_on:
    - ip
    window: 2h
  - name: Potato-style SYSTEM child processes and service/pipe abuse
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*(SYSTEM|System).*/ AND (data_win_eventdata_parentImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_parentImage:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: GPO and SYSVOL access, plus new local admin or account creation
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*SYSVOL* OR data_win_eventdata_commandLine:*gpresult* OR data_win_eventdata_commandLine:*"net localgroup administrators"* OR data_win_eventdata_commandLine:*"net user"*)) OR data_win_system_eventID:"4720" OR data_win_system_eventID:"4732"
    pivot_on:
    - host
    window: 4h
