name: Get-DomainController with PowerShell Script Block
id: 676b600a-a94d-4951-b346-11329431e6c1
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainController` cmdlet using 
  PowerShell Script Block Logging (EventID 4104). This cmdlet is part of PowerView, a 
  tool often used for domain enumeration. The detection leverages script block text to 
  identify this specific activity. Monitoring this behavior is crucial as it may indicate 
  an adversary or Red Team performing reconnaissance to map out domain controllers. If 
  confirmed malicious, this activity could lead to further domain enumeration, potentially 
  exposing sensitive information and aiding in lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainController*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-DomainController cmdlet from PowerView, which is used 
  for domain controller enumeration. Validate that data_win_eventdata_scriptBlockText 
  field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell cmdlet for legitimate 
  troubleshooting and infrastructure discovery purposes. Filter based on user context 
  and whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainController/
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet

response:
  message: >
    Get-DomainController execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain controller enumeration/reconnaissance activity for lateral movement planning. 
    MITRE ATT&CK: T1018
  risk_score: 55
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 55
    - field: data_win_eventdata_user
      type: user
      score: 55
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Remote System Discovery
    - Domain Controller Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - get_domaincontroller
    - powerview
    - domain_controller_enumeration
    - domain_controllers
    - infrastructure_discovery
    - lateral_movement
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainController.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 868ee0e4-52ab-484a-833a-6d85b7c028d0
    name: GetDomainController with PowerShell
    reason: Same PowerView Get-DomainController call seen as a powershell.exe command line (Sysmon 1); confirms the script block came from an interactive/launched session and gives parent process
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: PowerView is typically loaded once then used for several Get-Domain* calls; domain computer enumeration follows DC discovery to find lateral movement targets
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Co-occurring PowerView enumeration of domain users after locating DCs, to pick accounts to target
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: 'Next PowerView step: enumerating domain groups to find privileged membership'
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Follow-on PowerView query for Domain Admins and other privileged groups once DCs are known
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: PowerView trust mapping complements DC discovery when planning cross-domain/forest movement
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Same objective (locate DCs) via a native binary; attackers fall back to or combine nltest /dclist with PowerView
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: Broader AD graph collection (BloodHound) is the usual escalation from PowerView DC enumeration
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView domain enumeration script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Get-Domain(Computer|User|Group|Trust|Policy|GPO|OU|Controller|SID).*/ OR data_win_eventdata_scriptBlockText:/.*Get-NetDomain.*/ OR data_win_eventdata_scriptBlockText:/.*Get-NetComputer.*/ OR data_win_eventdata_scriptBlockText:/.*Find-LocalAdminAccess.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-ShareFinder.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-UserHunter.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Kerberoast.*/ OR data_win_eventdata_scriptBlockText:/.*PowerView.*/)
    pivot_on:
    - host
    window: 2h
  - name: Native DC and domain discovery binaries
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*(dclist|dsgetdc|domain_trusts).*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? (group|user|view).*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerView loading, download cradle or AMSI bypass in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]mport-[Mm]odule.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell process launch with parent and script/enc arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*[Bb]ypass.*/ OR data_win_eventdata_commandLine:/.*[Hh]idden.*/ OR data_win_eventdata_commandLine:/.*\.ps1.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload.*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Credential access and lateral movement after DC discovery
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc]\.?[Ee]?[Xx]?[Ee]? .*\\\\.*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/))
    pivot_on:
    - host
    window: 4h
