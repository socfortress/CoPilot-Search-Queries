name: Windows PowerShell Enable PowerShell Remoting
id: windows-powershell-enable-powershell-remoting-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the use of Enable-PSRemoting cmdlet which allows PowerShell remoting on 
  a local or remote computer. This could indicate an attacker enabling remote command 
  execution capabilities on a compromised system for lateral movement. Searches both 
  Sysmon process creation (EventID 1) command lines and PowerShell Script Block 
  Logging (EventID 4104).

data_source:
  - Sysmon EventID 1
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "1"
                    - wildcard:
                        data_win_eventdata_commandLine: "*Enable-PSRemoting*"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4104"
                    - wildcard:
                        data_win_eventdata_scriptBlockText: "*Enable-PSRemoting*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Optionally enable PowerShell Script Block Logging 
  (EventCode 4104) for additional coverage. The Wazuh agent ossec.conf should 
  include the Microsoft-Windows-PowerShell/Operational event channel. The index 
  pattern should match your Wazuh index naming convention.

known_false_positives: >
  System administrators may legitimately use Enable-PSRemoting for remote management. 
  Filter based on user context and whether the action was expected.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/enable-psremoting

response:
  message: >
    PowerShell Remoting was enabled on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Malicious PowerShell
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*Enable-PSRemoting.*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Enable-PSRemoting.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 991a9744-f2f0-44f2-bd33-9092eba17dc3
    name: Enable Windows Remote Management
    reason: Sibling WinRM-enablement detection (winrm quickconfig / WSMan service config); both firing means the host was deliberately prepared to accept remote shells.
  - id: a5d85486-b89c-11eb-8267-acde48001122
    name: Allow Inbound Traffic In Firewall Rule
    reason: Enable-PSRemoting opens TCP 5985/5986 in the firewall; an explicit inbound-allow rule right before or after shows the attacker widening exposure of the new remoting listener.
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Remoting enabled on this host is the precondition for Invoke-Command lateral movement; this shows the host (or its peers) actually driving remote commands.
  - id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
    name: Interactive Session on Remote Endpoint with PowerShell
    reason: Enter-PSSession/New-PSSession is the interactive follow-on that consumes the remoting endpoint just enabled.
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: wsmprovhost.exe appearing after remoting was enabled proves an inbound remote PowerShell session was actually established.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: Child processes of the WinRM host (cmd, powershell, net, whoami) are the operator's hands-on-keyboard activity over the newly opened channel.
  - id: c539afac-c12a-46ed-b1bd-5a5567c9f045
    name: Potential Remote PowerShell Session Initiated
    reason: Network connections to 5985/5986 from or to this host confirm remoting is in use for lateral movement rather than only configured.
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: Attackers enabling remoting for persistent access commonly pair it with a new local admin account to authenticate over WinRM.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WinRM/PSRemoting port 5985-5986 network connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_sourcePort:"5985" OR data_win_eventdata_sourcePort:"5986")
    pivot_on:
    - host
    window: 1h
  - name: Processes spawned by WinRM host (wsmprovhost)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Remoting config changes: winrm, TrustedHosts, firewall, LocalAccountTokenFilterPolicy'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Mm].*([Qq][Uu][Ii][Cc][Kk][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Ee][Tt]|[Cc][Rr][Ee][Aa][Tt][Ee]).*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Hh][Oo][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Tt][Oo][Kk][Ee][Nn][Ff][Ii][Ll][Tt][Ee][Rr].*/ OR (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*(5985|5986|[Ww][Ii][Nn][Rr][Mm]).*/))
    pivot_on:
    - host
    window: 1h
  - name: PowerShell remoting cmdlets in script blocks (Invoke-Command, PSSession, WSMan)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ww][Ss][Mm][Aa][Nn][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Local account creation or admin group addition
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?.*[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/)
    pivot_on:
    - host
    window: 4h
