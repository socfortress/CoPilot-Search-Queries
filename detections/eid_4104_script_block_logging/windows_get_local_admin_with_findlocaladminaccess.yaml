name: Windows Get Local Admin with FindLocalAdminAccess
id: d2988160-3ce9-4310-b59d-905334920cdd
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution of the Find-LocalAdminAccess cmdlet from the PowerView
  toolkit, used to identify machines where the current user has local
  administrator access. Attackers use this to find lateral movement targets
  where they can execute code with elevated privileges. This is a common
  post-exploitation recon step preceding lateral movement or privilege escalation
  in Active Directory environments.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Find-LocalAdminAccess*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators may leverage PowerSploit tools for legitimate AD security
  auditing and system management. Filter known authorized security assessment
  activity as needed.

references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://powersploit.readthedocs.io/en/latest/Recon/Find-LocalAdminAccess/
  - https://book.hacktricks.xyz/windows-hardening/basic-powershell-for-pentesters/powerview

response:
  message: >
    PowerView Find-LocalAdminAccess local admin discovery detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1087.002
  risk_score: 25
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 25
    - field: data_win_eventdata_user
      type: user
      score: 25
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - powerview
    - find_localadminaccess
    - lateral_movement
    - active_directory
    - privilege_escalation
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Find-LocalAdminAccess.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Find-LocalAdminAccess is a PowerView function; the same toolkit was loaded in-session and usually runs other PowerView cmdlets alongside it
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Attacker maps privileged groups/members with PowerView right before hunting hosts where they hold local admin
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: Find-LocalAdminAccess enumerates domain computers first; Get-DomainComputer builds the target list it then probes
  - id: 676b600a-a94d-4951-b346-11329431e6c1
    name: Get-DomainController with PowerShell Script Block
    reason: Domain recon precursor in the same PowerView session that scopes the AD environment before admin-access sweeps
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: 'Typical next step: use the discovered admin-access hosts to run code remotely over WinRM'
  - id: a0edd39f-a0c6-4c17-8141-261f958e8d8f
    name: PowerShell Remote Session Creation
    reason: New-PSSession/Enter-PSSession to a host found by Find-LocalAdminAccess is the direct lateral-movement follow-on
  - id: windows-powershell-invoke-wmiexec-usage-001
    name: PowerShell Invoke WmiExec Usage
    reason: Alternative lateral movement to the admin-accessible hosts via WMI execution
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: After finding admin access on other machines, attackers dump credentials in memory to continue spreading
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView/PowerSploit recon functions in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-NetComputer* OR data_win_eventdata_scriptBlockText:*Get-DomainComputer* OR data_win_eventdata_scriptBlockText:*Invoke-ShareFinder* OR data_win_eventdata_scriptBlockText:*Invoke-UserHunter* OR data_win_eventdata_scriptBlockText:*Get-NetLocalGroup* OR data_win_eventdata_scriptBlockText:*Invoke-EnumerateLocalAdmin* OR data_win_eventdata_scriptBlockText:*Test-AdminAccess* OR data_win_eventdata_scriptBlockText:*Get-NetSession* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast*)
    pivot_on:
    - host
    window: 2h
  - name: PowerView/PowerSploit download or in-memory load cradle
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*PowerView* OR data_win_eventdata_scriptBlockText:*PowerSploit* OR data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell remoting or WMI lateral execution by this user
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-Command* OR data_win_eventdata_scriptBlockText:*New-PSSession* OR data_win_eventdata_scriptBlockText:*Enter-PSSession* OR data_win_eventdata_scriptBlockText:*Invoke-WmiMethod* OR data_win_eventdata_scriptBlockText:*Invoke-CimMethod* OR data_win_eventdata_scriptBlockText:*Invoke-WmiExec* OR data_win_eventdata_scriptBlockText:*New-CimSession*)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Outbound SMB/RPC/WinRM fan-out from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping or LSASS access following recon
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss][.][Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*sekurlsa* OR data_win_eventdata_scriptBlockText:*MiniDumpWriteDump*))
    pivot_on:
    - host
    window: 4h
