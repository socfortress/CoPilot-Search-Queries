name: Windows PowerShell WMI Win32 ScheduledJob
id: 47c69803-2c09-408b-b40a-063c064cbb16
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects use of the Win32_ScheduledJob WMI class via PowerShell to create
  scheduled tasks. This WMI class is disabled by default due to security concerns
  and must be explicitly enabled through registry modifications. Its use may
  indicate malicious intent, particularly if the class was enabled by an attacker
  as a prerequisite. Attackers use Win32_ScheduledJob for persistence and remote
  execution via DCOM/RPC infrastructure, which can bypass traditional scheduled
  task monitoring.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Win32_ScheduledJob*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  False positives may be present based on legacy applications or utilities that
  use Win32_ScheduledJob for legitimate scheduling. The RPC service must be
  running on both local and remote computers for this to work. Review the task
  being created and user context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://securityonline.info/wmiexec-regout-get-outputdata-response-from-registry/
  - https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-scheduledjob

response:
  message: >
    PowerShell Win32_ScheduledJob WMI task creation detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Active Directory Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - win32_scheduledjob
    - wmi
    - scheduled_task
    - lateral_movement
    - persistence
    - dcom
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Win32_ScheduledJob.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2a048c14-4634-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via WMI and PowerShell Script Block
    reason: Sibling WMI remote-execution primitive (Win32_Process.Create) in script blocks; attackers who use Win32_ScheduledJob for remote execution often fall back to or alternate with Win32_Process on the same host
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: Win32_ScheduledJob rides DCOM/RPC; DCOM-based remote instantiation from the same PowerShell session is an alternate lateral-movement channel by the same operator
  - id: windows-powershell-invoke-cimmethod-cimsession-001
    name: PowerShell Invoke CIMMethod CIMSession
    reason: Win32_ScheduledJob.Create is invoked remotely via Invoke-CimMethod/CimSession; this confirms the remote-target execution path of the same script
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Operator driving remote hosts from PowerShell remoting alongside WMI job creation indicates scripted multi-host lateral movement
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: On the target host, a WMI-created job/process surfaces as WmiPrvSE-spawned PowerShell; this is the receiving-side view of the same lateral movement
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: Payload launched through WMI provider host after job creation shows what the scheduled job actually executed
  - id: 24869767-8579-485d-9a4f-d9ddfd8f0cac
    name: Process Execution via WMI
    reason: Process creation through WMI on the host is the execution outcome of a Win32_ScheduledJob/WMI abuse chain
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Impacket wmiexec is the common offensive tooling for WMI/DCOM remote execution and its command lines co-occur with Win32_ScheduledJob abuse
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Payloads spawned by WMI provider host or Task Scheduler engine
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Tt][Aa][Ss][Kk][Ee][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Mm][Ss][Hh][Tt][Aa]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other WMI and scheduled-task creation via script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Win32_Process* OR data_win_eventdata_scriptBlockText:*Register-ScheduledTask* OR data_win_eventdata_scriptBlockText:*New-ScheduledTask* OR data_win_eventdata_scriptBlockText:*Invoke-CimMethod* OR data_win_eventdata_scriptBlockText:*Invoke-WmiMethod* OR data_win_eventdata_scriptBlockText:*Win32_ScheduledJob*)
    pivot_on:
    - host
    window: 4h
  - name: Registry changes enabling Win32_ScheduledJob (EnableAt) or task persistence
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:*Schedule\\Configuration* OR data_win_eventdata_targetObject:*EnableAt* OR data_win_eventdata_targetObject:*\\Schedule\\TaskCache\\*)
    pivot_on:
    - host
    window: 24h
  - name: Remote logon and RPC/DCOM inbound activity preceding job creation
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985"))
    pivot_on:
    - host
    - user
    window: 2h
  - name: Suspicious executable or script drops in staging paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Pp]rogram[Dd]ata\\|\\[Pp]ublic\\|\\[Ww]indows\\[Tt]asks\\|\\[Aa]pp[Dd]ata\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on:
    - host
    window: 2h
