name: Powershell Local Email Collection
id: 2837e152-93c8-43d2-85ba-c3cd3c2ae614
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2837e152-93c8-43d2-85ba-c3cd3c2ae614
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may target user email on local systems to collect sensitive
  information. Files containing email data can be acquired from a users local
  system, such as Outlook storage or cache files. MITRE ATT&CK: T1114.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-Inbox.ps1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Microsoft.Office.Interop.Outlook*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Microsoft.Office.Interop.Outlook.olDefaultFolders*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-comobject outlook.application*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-Inbox.ps1*';
  data_win_eventdata_scriptBlockText matches
  '*Microsoft.Office.Interop.Outlook*'; data_win_eventdata_scriptBlockText
  matches '*Microsoft.Office.Interop.Outlook.olDefaultFolders*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1114.001/T1114.001.md
  - https://attack.mitre.org/techniques/T1114/001/

response:
  message: >
    Powershell Local Email Collection detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1114.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1114.001
  custom_tags:
    - powershell
    - local
    - email
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx]\.[Pp][Ss]1.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Oo][Ff][Ff][Ii][Cc][Ee]\.[Ii][Nn][Tt][Ee][Rr][Oo][Pp]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Oo][Ff][Ff][Ii][Cc][Ee]\.[Ii][Nn][Tt][Ee][Rr][Oo][Pp]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Oo][Ll][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ff][Oo][Ll][Dd][Ee][Rr][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Cc][Oo][Mm][Oo][Bb][Jj][Ee][Cc][Tt] [Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 312d0384-401c-4b8b-abdf-685ffba9a332
    name: Email Exifiltration Via Powershell
    reason: 'Direct follow-on: PowerShell that harvested Outlook mail via COM then sends it out over SMTP from the same host'
  - id: 889719ef-dd62-43df-86c3-768fb08dc7c0
    name: Suspicious PowerShell Mailbox Export to Share
    reason: 'Co-occurring email collection variant: mailbox export cmdlets writing PST content to a share, same collection objective as the Outlook COM harvest'
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Harvested mail is typically staged into a password-protected archive before leaving the host
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Same PowerShell actor packaging the dumped mail folders with Compress-Archive for staging
  - id: windows-archive-collected-data-via-rar-001
    name: Windows Archive Collected Data via Rar
    reason: Rar staging of collected data is the usual step between email collection and exfiltration
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Command-line upload/transfer of the staged mail archive following collection
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Rclone is a common bulk exfil tool used to ship collected mail data to cloud storage
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Outlook spawning shells is a common precursor (phish delivery) to a PowerShell script then harvesting the same user's mailbox
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mailbox export, PST/OST access and MAPI folder walking in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ee][Xx][Pp][Oo][Rr][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Pp][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Oo][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Oo][Ll][Ff][Oo][Ll][Dd][Ee][Rr][Ii][Nn][Bb][Oo][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*\.[Ss][Aa][Vv][Ee][Aa][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outlook data files (pst/ost/msg/eml) created or copied by non-Outlook processes
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Pp][Ss][Tt]|[Oo][Ss][Tt]|[Mm][Ss][Gg]|[Ee][Mm][Ll]|[Nn][Ss][Ff])/ AND NOT data_win_eventdata_image:/.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Archive/compression staging of collected mail
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Script-driven exfiltration: SMTP send, web upload, BITS or rclone'
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Nn][Dd]-[Mm][Aa][Ii][Ll][Mm][Ee][Ss][Ss][Aa][Gg][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Mm][Tt][Pp][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*-[Mm][Ee][Tt][Hh][Oo][Dd] [Pp][Oo][Ss][Tt].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*(-[Tt]|--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee]).*/))
    pivot_on:
    - host
    window: 4h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
