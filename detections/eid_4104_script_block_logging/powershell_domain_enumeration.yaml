name: Windows PowerShell Domain Enumeration
id: windows-powershell-domain-enumeration-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects PowerShell commands used for Active Directory domain enumeration including 
  get-netdomaintrust, get-netforesttrust, get-addomain, get-adgroupmember, and 
  get-domainuser. This activity often indicates reconnaissance efforts to map domain 
  structure and identify key users and groups. Searches both Sysmon process creation 
  (EventID 1) command lines and PowerShell Script Block Logging (EventID 4104).

data_source:
  - Sysmon EventID 1
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "1"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine: "*get-netdomaintrust*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*get-netforesttrust*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*get-addomain*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*get-adgroupmember*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*get-domainuser*"
                        minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4104"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_scriptBlockText: "*get-netdomaintrust*"
                          - wildcard:
                              data_win_eventdata_scriptBlockText: "*get-netforesttrust*"
                          - wildcard:
                              data_win_eventdata_scriptBlockText: "*get-addomain*"
                          - wildcard:
                              data_win_eventdata_scriptBlockText: "*get-adgroupmember*"
                          - wildcard:
                              data_win_eventdata_scriptBlockText: "*get-domainuser*"
                        minimum_should_match: 1
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Optionally enable PowerShell Script Block Logging 
  (EventCode 4104) for additional coverage. The Wazuh agent ossec.conf should 
  include the Microsoft-Windows-PowerShell/Operational event channel. The index 
  pattern should match your Wazuh index naming convention.

known_false_positives: >
  Legitimate AD administration scripts may use these cmdlets. Filter based on 
  user context and frequency. Multiple enumeration commands in a short window 
  increases confidence of malicious activity.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html

response:
  message: >
    PowerShell domain enumeration detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
  threat_objects: []

tags:
  analytic_story:
    - Hermetic Wiper
    - Malicious PowerShell
    - Data Destruction
    - Interlock Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*get-netdomaintrust.*/ OR data_win_eventdata_commandLine:/.*get-netforesttrust.*/ OR data_win_eventdata_commandLine:/.*get-addomain.*/ OR data_win_eventdata_commandLine:/.*get-adgroupmember.*/ OR data_win_eventdata_commandLine:/.*get-domainuser.*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*get-netdomaintrust.*/ OR data_win_eventdata_scriptBlockText:/.*get-netforesttrust.*/ OR data_win_eventdata_scriptBlockText:/.*get-addomain.*/ OR data_win_eventdata_scriptBlockText:/.*get-adgroupmember.*/ OR data_win_eventdata_scriptBlockText:/.*get-domainuser.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-DomainUser/Get-NetDomainTrust are PowerView cmdlets; a loaded PowerView module in the same session confirms offensive tooling rather than admin scripting
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: Trust mapping (get-netdomaintrust/forest trust) is the same recon pass, used to find lateral-movement paths across domains
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Sibling user-enumeration cmdlet in the same PowerView recon sweep; several enumeration blocks close together raise confidence
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: After listing domain users, attackers hunt accounts without pre-auth to AS-REP roast
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: 'Typical next step: enumerated users/SPNs are Kerberoasted via ticket requests from PowerShell'
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Manual AD enumeration is often followed or accompanied by SharpHound collection to graph attack paths
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Having mapped groups and privileged members, the attacker pivots to targets via PowerShell remoting
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Credential theft commonly follows domain recon, to obtain the privileged identities just enumerated
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerView / AD recon cmdlets in script blocks (beyond the five in the rule)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et(User|Group|Computer|GPO|Session|LoggedOn|Share|Subnet|OU).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain(Computer|Group|Controller|Policy|GPO|OU|SID|Trust).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocalAdminAccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-(ShareFinder|UserHunter|ACLScanner).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd](User|Computer|Group|Forest|Trust|DefaultDomainPasswordPolicy).*/)
    pivot_on:
    - host
    window: 2h
  - name: Native AD discovery tools in process creation (nltest, dsquery, net group, setspn, adfind, sharphound)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*(dclist|domain_trusts|trusted_domains).*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +group.*domain.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ss][Pp][Nn].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Kerberoast / AS-REP roast and credential theft in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*KerberosRequestorSecurityToken.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Rr][Ee][Pp][Ll][Aa]ccount.*/ OR data_win_eventdata_scriptBlockText:/.*DoesNotRequirePreAuth.*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: LDAP/Kerberos network connections from script interpreters (389/636/3268/88)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"88") AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh|[Cc]md|[Ww]script|[Cc]script|[Rr]undll32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: 'Lateral movement after recon: remoting, PsExec, WMI exec'
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]im[Mm]ethod.*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]6?4?\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww]mi[Pp]rv[Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww]sm[Pp]rovhost\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    - user
    window: 4h
