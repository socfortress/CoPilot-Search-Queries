name: Suspicious PowerShell WindowStyle Option
id: 313fbb0a-a341-4682-848d-6d6f8c4fab7c
version: 1
schema_version: "1.0"
date: "2023-01-03"
author: frack113, Tim Shelton (fp AWS)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 313fbb0a-a341-4682-848d-6d6f8c4fab7c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may use hidden windows to conceal malicious activity from the
  plain sight of users. In some cases, windows that would typically be displayed
  when an application carries out an operation can be hidden. MITRE ATT&CK:
  T1564.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*powershell*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*WindowStyle*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Hidden*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_scriptBlockText"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*:\\\\Program Files\\\\Amazon\\\\WorkSpacesConfig\\\\Scripts\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*$PSScriptRoot\\\\Module\\\\WorkspaceScriptModule\\\\WorkspaceScriptModule*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*powershell*';
  data_win_eventdata_scriptBlockText matches '*WindowStyle*';
  data_win_eventdata_scriptBlockText matches '*Hidden*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.003/T1564.003.md
  - https://attack.mitre.org/techniques/T1564/003/

response:
  message: >
    Suspicious PowerShell WindowStyle Option detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1564.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.003
  custom_tags:
    - powershell
    - windowstyle
    - option
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND _exists_:data_win_eventdata_scriptBlockText AND NOT (data_win_eventdata_scriptBlockText:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Mm][Aa][Zz][Oo][Nn]\\[Ww][Oo][Rr][Kk][Ss][Pp][Aa][Cc][Ee][Ss][Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\\.*/ AND data_win_eventdata_scriptBlockText:/.*\$[Pp][Ss][Ss][Cc][Rr][Ii][Pp][Tt][Rr][Oo][Oo][Tt]\\[Mm][Oo][Dd][Uu][Ll][Ee]\\[Ww][Oo][Rr][Kk][Ss][Pp][Aa][Cc][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Mm][Oo][Dd][Uu][Ll][Ee]\\[Ww][Oo][Rr][Kk][Ss][Pp][Aa][Cc][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Mm][Oo][Dd][Uu][Ll][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: 'Process-creation twin of this 4104 hidden-window block: a hidden powershell.exe reaching a URL is the download stage the WindowStyle Hidden launcher exists to conceal.'
  - id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
    name: Hidden Powershell in Link File Pattern
    reason: A .lnk launching powershell -WindowStyle Hidden is a common phishing delivery vector that precedes this script block.
  - id: 5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d
    name: Cmd Launched with Hidden Start Flags to Suspicious Targets
    reason: cmd wrapper using hidden start flags is the sibling chain that spawns the hidden powershell stage from a macro or script.
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Hidden window launchers are typically paired with -EncodedCommand payloads; same invocation seen at process creation.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: The hidden script's typical payload is a download cradle via COM/WebClient objects, logged in later 4104 blocks.
  - id: fa2559c8-1197-471d-9cdd-05a0273d4522
    name: Potential AMSI Bypass Script Using NULL Bits
    reason: Stealth-minded PowerShell stagers disable AMSI before running the downloaded payload, appearing as adjacent script blocks.
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: Hidden PowerShell is frequently used to install a scheduled task for persistence right after the initial stage.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: A hidden PowerShell stager that persists writes a Run key pointing to a dropped payload in a user-writable folder.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hidden-window PowerShell launched with encoded/bypass/download arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[pP][wW][sS][hH]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[hH][iI][dD][dD][eE][nN].*/ AND (data_win_eventdata_commandLine:/.*\-[eE][nN][cC].*/ OR data_win_eventdata_commandLine:/.*[bB][yY][pP][aA][sS][sS].*/ OR data_win_eventdata_commandLine:/.*[iI][eE][xX].*/ OR data_win_eventdata_commandLine:/.*[dD][oO][wW][nN][lL][oO][aA][dD][sS][tT][rR][iI][nN][gG].*/ OR data_win_eventdata_commandLine:/.*\-[nN][oO][pP].*/ OR data_win_eventdata_commandLine:/.*[hH][tT][tT][pP].*/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections made by PowerShell (payload/C2 fetch)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[pP][wW][sS][hH]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: DNS lookups issued by PowerShell (staging domain)
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[pP][wW][sS][hH]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell dropping files into startup/temp/public paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[pP][wW][sS][hH]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\\[sS][tT][aA][rR][tT]\ [mM][eE][nN][uU]\\[pP][rR][oO][gG][rR][aA][mM][sS]\\[sS][tT][aA][rR][tT][uU][pP].*/ OR data_win_eventdata_targetFilename:/.*\\[aA][pP][pP][dD][aA][tT][aA]\\[lL][oO][cC][aA][lL]\\[tT][eE][mM][pP].*/ OR data_win_eventdata_targetFilename:/.*\\[pP][rR][oO][gG][rR][aA][mM][dD][aA][tT][aA].*/ OR data_win_eventdata_targetFilename:/.*\\[uU][sS][eE][rR][sS]\\[pP][uU][bB][lL][iI][cC].*/ OR data_win_eventdata_targetFilename:/.*\\[aA][pP][pP][dD][aA][tT][aA]\\[rR][oO][aA][mM][iI][nN][gG].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'PowerShell persistence: Run key write or schtasks /create'
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_image:/.*\\[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[pP][wW][sS][hH]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetObject:/.*[cC][uU][rR][rR][eE][nN][tT][vV][eE][rR][sS][iI][oO][nN]\\[rR][uU][nN].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[sS][cC][hH][tT][aA][sS][kK][sS].*/ AND data_win_eventdata_commandLine:/.*\/[cC][rR][eE][aA][tT][eE].*/)
    pivot_on:
    - host
    window: 4h
