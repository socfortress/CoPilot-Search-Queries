name: Powershell Load Module in Meterpreter
id: windows-powershell-load-module-in-meterpreter-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of suspicious PowerShell commands associated with Meterpreter 
  modules, such as "MSF.Powershell" and "MSF.Powershell.Meterpreter". It leverages 
  PowerShell Script Block Logging (EventCode 4104) to capture and analyze the full 
  command sent to PowerShell. This activity is significant as it indicates potential 
  post-exploitation actions, including credential dumping and persistence mechanisms. 
  If confirmed malicious, an attacker could gain extensive control over the compromised 
  system, escalate privileges, and maintain long-term access, posing a severe threat 
  to the environment.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*MSF.Powershell*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*MSF.Powershell.Meterpreter*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*MSF.Powershell.Meterpreter.Kiwi*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*MSF.Powershell.Meterpreter.Transport*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  False positives should be very limited as this is strict to MetaSploit behavior. 
  Monitor for any legitimate use cases and adjust filters accordingly.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://github.com/OJ/metasploit-payloads/blob/master/powershell/MSF.Powershell/Scripts.cs
  - https://www.splunk.com/en_us/blog/security/powershell-detections-threat-research-release-august-2021.html

response:
  message: >
    Meterpreter PowerShell module detected on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 85
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 85
  threat_objects: []

tags:
  analytic_story:
    - MetaSploit
    - Post-Exploitation
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*MSF\.Powershell.*/ OR data_win_eventdata_scriptBlockText:/.*MSF\.Powershell\.Meterpreter.*/ OR data_win_eventdata_scriptBlockText:/.*MSF\.Powershell\.Meterpreter\.Kiwi.*/ OR data_win_eventdata_scriptBlockText:/.*MSF\.Powershell\.Meterpreter\.Transport.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: 'Process-creation view of the same Meterpreter session: the staging/service-style process patterns that usually precede the PowerShell extension being loaded in-session.'
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Meterpreter delivers its PowerShell module and payload via shellcode/VirtualAlloc loaders in script blocks; the loader is the likely precursor of the MSF.Powershell module load.
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: Same 4104 telemetry; reflective GetProcAddress/injection primitives are how Metasploit PowerShell payloads migrate into or stage inside processes.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: MSF.Powershell.Meterpreter.Kiwi is the Mimikatz/Kiwi wrapper; credential dumping is the most common follow-on action once the module is loaded.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: 'Complements the Kiwi module hit: a Mimikatz script block on the same host confirms credential theft following Meterpreter post-exploitation.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Kiwi/Mimikatz run through Meterpreter opens lsass with dump-capable access rights; this is the process-access evidence of the credential dumping the module enables.
  - id: fb656378-f909-47c1-8747-278bf09f4f4f
    name: Potential Credential Dumping Attempt Via PowerShell Remote Thread
    reason: PowerShell-originated remote thread creation into lsass matches in-memory credential theft from a Meterpreter PowerShell session.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Attackers disable AMSI before loading Metasploit PowerShell modules so the script is not blocked; an AMSI bypass shortly before is a direct precursor.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access from non-system processes (Kiwi credential dumping)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Reflective loading, shellcode and Mimikatz primitives in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Pp]roc[Aa]ddress.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Tt]hread.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ekurlsa.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Ii]nit[Ff]ailed.*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote thread injection into system or user processes (Meterpreter migrate)
    query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\([Ll][Ss][Aa][Ss][Ss]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ss][Pp][Oo][Oo][Ll][Ss][Vv])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell outbound connections to common Metasploit handler ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_destinationPort:(4444 OR 4443 OR 8443 OR 1337 OR 31337 OR 5555)
    pivot_on:
    - host
    window: 2h
  - name: Persistence and privilege escalation commands after Meterpreter session
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Aa][Dd][Dd].*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] +[Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee].*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on:
    - host
    - user
    window: 4h
