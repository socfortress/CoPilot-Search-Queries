name: Detect Empire with PowerShell Script Block Logging
id: bc1dc6b8-c954-11eb-bade-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects suspicious PowerShell execution indicative of 
  PowerShell-Empire activity. It leverages PowerShell Script Block Logging (EventID 4104) 
  to capture and analyze commands sent to PowerShell, specifically looking for patterns 
  involving `system.net.webclient` and `DownloadString`. This behavior is significant 
  as it often represents initial stagers used by PowerShell-Empire, a known 
  post-exploitation framework. If confirmed malicious, this activity could allow 
  attackers to download and execute additional payloads, leading to potential code 
  execution, data exfiltration, or further compromise of the affected system.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*system.net.webclient*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*DownloadString*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the combination of System.Net.WebClient and DownloadString 
  methods, which are commonly used in PowerShell-Empire stagers to download and 
  execute remote code. PowerShell-Empire is a post-exploitation framework that 
  allows attackers to maintain persistence and execute arbitrary commands on 
  compromised systems.

known_false_positives: >
  False positives may pertain to it not being related to Empire, but another 
  framework or legitimate PowerShell scripts that use similar patterns. Filter as 
  needed if any legitimate applications use the same pattern within your organization.

references:
  - https://github.com/BC-SECURITY/Empire
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    The following behavior was identified and typically related to PowerShell-Empire 
    on $agent_name$ by user $data_win_eventdata_user$. 
    Script: $data_win_eventdata_scriptBlockText$. 
    This indicates potential post-exploitation activity. MITRE ATT&CK: T1059.001
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
    - field: data_win_eventdata_user
      type: user
      score: 70
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Hellcat Ransomware
    - Malicious PowerShell
    - Hermetic Wiper
    - Data Destruction
    - Post-Exploitation
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - empire
    - powershell_empire
    - system_net_webclient
    - downloadstring
    - post_exploitation
    - command_execution
    - powershell
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*system.net.webclient.*/ AND data_win_eventdata_scriptBlockText:/.*DownloadString.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79f4ede3-402e-41c8-bc3e-ebbf5f162581
    name: HackTool - Empire PowerShell Launch Parameters
    reason: 'Process-creation view of the same Empire stager: the -NoP -sta -w 1 -enc launch line that precedes the WebClient.DownloadString script block'
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Same download-cradle behaviour seen in other script blocks (DownloadFile/WebClient variants) on the host, showing the stager fetching further payloads
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: Operators switch cradle style (COM/XMLHTTP) when WebClient is blocked or tuned; co-occurring cradle on same host confirms staging activity
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: Empire stagers typically bypass AMSI immediately before downloading and executing the next stage; precursor in the same script session
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: After DownloadString the Empire agent loads .NET assemblies in memory; follow-on fileless execution
  - id: 56c217c3-2de2-479b-990f-5c109ba8458f
    name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
    reason: Empire's default persistence module creates a scheduled task launching the stager; likely next step after initial staging
  - id: 3268b746-88d8-4cd3-bffc-30077d02c787
    name: HackTool - Empire PowerShell UAC Bypass
    reason: Empire's bypassuac modules are a common privilege-escalation follow-on once the agent is established
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Empire's credential module Invoke-Mimikatz is loaded reflectively once the agent checks in; credential theft follow-on
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell outbound network connections (stager callback)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: DNS lookups made by PowerShell (payload host resolution)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: Empire-style encoded launcher and stager command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_commandLine:(*-[Ee][Nn][Cc]* OR *-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd]* OR *-[Nn][Oo][Pp]* OR *-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee]* OR *[Hh][Ii][Dd][Dd][Ee][Nn]* OR *[Ii][Ee][Xx]* OR *[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]*)
    pivot_on:
    - host
    window: 1h
  - name: AMSI bypass, reflection loading and credential tooling in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:(*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss]* OR *[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd]* OR *[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn].[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]* OR *[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]* OR *[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc]* OR *[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]*)
    pivot_on:
    - host
    window: 2h
  - name: Persistence set up by PowerShell (scheduled task, Run key, WMI)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]).*/ AND data_win_eventdata_commandLine:(*/[Cc][Rr][Ee][Aa][Tt][Ee]* OR *[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk]* OR *[Cc][Vv]-[Rr][Uu][Nn]* OR *[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]* OR *[Ee][Vv][Ee][Nn][Tt][Ss][Uu][Bb][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn]*)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]*)
    pivot_on:
    - host
    window: 4h
