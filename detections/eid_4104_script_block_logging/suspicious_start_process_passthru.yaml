name: Suspicious Start-Process PassThru
id: 0718cd72-f316-4aa2-988f-838ea8533277
version: 1
schema_version: "1.0"
date: "2026-05-18"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0718cd72-f316-4aa2-988f-838ea8533277
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Powershell use PassThru option to start in background. MITRE ATT&CK:
  T1036.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Start-Process *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*saps *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-PassThru *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-FilePath *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Start-Process *';
  data_win_eventdata_scriptBlockText matches '*saps *';
  data_win_eventdata_scriptBlockText matches '*-PassThru *', among other
  conditions.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1036.003/T1036.003.md
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/start-process?view=powershell-7.6
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Suspicious Start-Process PassThru detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1036.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
  custom_tags:
    - start
    - passthru
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss] .*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Aa][Pp][Ss] .*/) AND data_win_eventdata_scriptBlockText:/.*-[Pp][Aa][Ss][Ss][Tt][Hh][Rr][Uu] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Ff][Ii][Ll][Ee][Pp][Aa][Tt][Hh] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Start-Process -PassThru -FilePath is typically the launch step for a payload the same script just downloaded; this is the staging precursor in the same 4104 stream.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: Alternative download cradle (COM objects) that fetches the binary subsequently launched and tracked via -PassThru.
  - id: windows-powershell-start-bitstransfer-001
    name: PowerShell Start-BitsTransfer
    reason: BITS transfer is a common way a script pulls the executable that Start-Process -PassThru then runs in the background.
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: Obfuscated loader scripts that wrap stage launching in IEX often precede or contain the PassThru launch, indicating a malicious rather than admin script.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Attackers disable AMSI in the same script before launching the payload process, so a hit confirms evasion around the process start.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: Defender exclusions are commonly added just before launching the dropped binary so it survives AV scanning; a close follow-on or co-occurring step.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Reflection-loaded .NET payloads are the in-memory alternative to launching a disk binary; co-occurrence shows layered loader tradecraft.
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: After the backgrounded process is started, the script commonly establishes scheduled-task persistence for the same payload.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes launched from user-writable paths (what PassThru started)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Uu][Ss][Ee][Rr][Ss]\.*/ OR data_win_eventdata_image:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_image:/.*\[Tt][Ee][Mm][Pp]\.*/ OR data_win_eventdata_image:/.*\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/) AND data_win_eventdata_parentImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: Files dropped by PowerShell before the launch
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_targetFilename:*.exe OR data_win_eventdata_targetFilename:*.dll OR data_win_eventdata_targetFilename:*.bat OR data_win_eventdata_targetFilename:*.scr OR data_win_eventdata_targetFilename:*.ps1)
    pivot_on:
    - host
    window: 1h
  - name: Download cradles and AMSI/encoded loaders in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Start-BitsTransfer* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*FromBase64String*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections and DNS from PowerShell or its children
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*\(AppData|Temp|ProgramData|Users\Public)\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence and Defender tampering after the launch
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*CurrentVersion\Run*) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*schtasks* OR data_win_eventdata_commandLine:*Add-MpPreference* OR data_win_eventdata_commandLine:*Set-MpPreference* OR data_win_eventdata_commandLine:*DisableRealtimeMonitoring*))
    pivot_on:
    - host
    window: 2h
