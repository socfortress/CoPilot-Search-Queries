name: Winlogon Helper DLL
id: 851c506b-6b7c-4ce2-8802-c703009d03c0
version: 1
schema_version: "1.0"
date: "2022-07-07"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 851c506b-6b7c-4ce2-8802-c703009d03c0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Winlogon.exe is a Windows component responsible for actions at logon/logoff as
  well as the secure attention sequence (SAS) triggered by Ctrl-Alt-Delete.
  Registry entries in HKLM\Software[Wow6432Node]Microsoft\Windows
  NT\CurrentVersion\Winlogon\ and HKCU\Software\Microsoft\Windows
  NT\CurrentVersion\Winlogon\ are used to manage additional helper programs and
  functionalities that support Winlogon. Malicious modifications to these
  Registry keys may cause Winlogon to load and execute malicious DLLs and/or
  executables. MITRE ATT&CK: T1547.004.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*CurrentVersion\\\\Winlogon*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Set-ItemProperty*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*New-Item*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*CurrentVersion\Winlogon*';
  data_win_eventdata_scriptBlockText matches '*Set-ItemProperty*';
  data_win_eventdata_scriptBlockText matches '*New-Item*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.004/T1547.004.md
  - https://attack.mitre.org/techniques/T1547/004/

response:
  message: >
    Winlogon Helper DLL detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1547.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.004
  custom_tags:
    - winlogon
    - helper
    - powershell
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn].*/ AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c9b86500-1ec2-4de6-9120-d744c8fb5caf
    name: Potential KamiKakaBot Activity - Winlogon Shell Persistence
    reason: Same Winlogon Shell value tampering seen at the registry layer (Sysmon 13); confirms the script block actually wrote the key
  - id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
    name: Winlogon Notify Key Logon Persistence
    reason: Winlogon Notify subkey DLL registration is the classic variant of this helper-DLL persistence; registry-side confirmation of the PowerShell write
  - id: cbf93e5d-ca6c-4722-8bea-e9119007c248
    name: CurrentVersion NT Autorun Keys Modification
    reason: Winlogon Shell/Userinit live under CurrentVersion Winlogon in the NT autorun key set; Sysmon 13 write of the value the script block set
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Attackers who touch Winlogon via PowerShell commonly also add Run-RunOnce entries for redundant persistence on the same host
  - id: 0a98a10c-685d-4ab0-bddc-b6bdd1d48458
    name: Uncommon Userinit Child Process
    reason: Modified Userinit/Shell executes at next logon as a child of userinit.exe; this is the execution proof of the persistence
  - id: b655a06a-31c0-477a-95c2-3726b83d649d
    name: Suspicious Userinit Child Process
    reason: Malicious Userinit value launches an unexpected binary at logon as child of userinit.exe, the payoff of the Winlogon modification
  - id: windows-winlogon-public-network-connection-001
    name: Windows WinLogon With Public Network Connection
    reason: A hijacked Winlogon helper DLL loaded into winlogon.exe may beacon out; winlogon.exe should never talk to public IPs
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The payload DLL/EXE referenced by the Winlogon value is often fetched by a PowerShell download cradle just before the registry write
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Winlogon Shell/Userinit/Notify registry value set
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\([Ss][Hh][Ee][Ll][Ll]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]|[Nn][Oo][Tt][Ii][Ff][Yy]).*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Tt][Aa][Ss][Kk][Mm][Gg][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Process or DLL created in a user-writable path (candidate Winlogon payload)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 1h
  - name: Unexpected child of userinit.exe or winlogon.exe
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/) AND NOT (data_win_eventdata_image:/.*\\([Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]|[Dd][Ww][Mm]|[Ff][Oo][Nn][Tt][Dd][Rr][Vv][Hh][Oo][Ss][Tt]|[Ll][Oo][Gg][Oo][Nn][Uu][Ii]|[Cc][Ss][Rr][Ss][Ss]|[Ww][Ii][Nn][Ii][Nn][Ii][Tt]|[Ll][Ss][Aa][Ss][Ss]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Ss][Mm][Ss][Ss]|[Ss][Cc][Ee][Dd][Ii][Tt]|[Pp][Rr][Ee][Ll][Oo][Aa][Dd]|[Aa][Uu][Tt][Oo][Cc][Hh][Kk]).*\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell registry persistence writes in other script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Hh][Kk][Ll][Mm]:.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Winlogon image load of non-system DLL
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.*/
    pivot_on:
    - host
    window: 6h
