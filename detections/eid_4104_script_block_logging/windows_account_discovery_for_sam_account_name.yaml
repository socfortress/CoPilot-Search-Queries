name: Windows Account Discovery for Sam Account Name
id: Windows_Account_Discovery_For_Sam_Account_Name
version: 1
schema_version: "1.0"
date: "2026-03-27"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects execution of the PowerView PowerShell cmdlet Get-NetUser specifically
  querying for samaccountname or pwdlastset attributes. This is a common
  reconnaissance technique used by attackers to enumerate Active Directory user
  accounts and password information, typically as a precursor to lateral movement
  or privilege escalation attacks.
data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-NetUser*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*samaccountname*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*pwdlastset*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-27 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging. The Microsoft-Windows-PowerShell/Operational channel must be
  forwarded by the Wazuh agent. Confirmed flowing in this environment.
  VALIDATED — 3 hits confirmed for Get-NetUser with samaccountname/pwdlastset.

known_false_positives: >
  Administrators may use PowerView or similar tools for legitimate AD
  enumeration and auditing purposes. Review context and user account to
  determine if the activity is authorized.

references:
  - https://attack.mitre.org/techniques/T1087/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    PowerView Get-NetUser with samaccountname/pwdlastset enumeration detected
    on $agent_name$ by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1087
  risk_score: 15
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 15
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - CISA AA23-347A
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1087
  custom_tags:
    - powerview
    - active_directory
    - account_discovery
    - samaccountname
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-NetUser.*/ AND (data_win_eventdata_scriptBlockText:/.*samaccountname.*/ OR data_win_eventdata_scriptBlockText:/.*pwdlastset.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-NetUser is a PowerView cmdlet; the same PowerView module being loaded and used for other cmdlets in script blocks shows a full recon toolkit session, not a one-off query.
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Get-DomainUser is the PowerView alias/successor of Get-NetUser; the same user enumeration run under the newer cmdlet name on the same host.
  - id: eddbf5ba-b89e-47ca-995e-2d259804e55e
    name: Windows Account Discovery for None Disable User Account
    reason: Sibling Get-NetUser filter (disabled-account/UAC attributes); operators typically iterate attribute filters to hunt stale or privileged accounts after listing samaccountname/pwdlastset.
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: After listing users and password ages, attackers map group membership to find privileged accounts to target.
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: Account enumeration is paired with computer enumeration to pick lateral-movement targets where privileged users are active.
  - id: 13243068-2d38-11ec-8908-acde48001122
    name: ServicePrincipalNames Discovery with PowerShell
    reason: Account recon with samaccountname commonly precedes SPN discovery to choose Kerberoasting targets.
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: Using PowerView to find accounts without Kerberos pre-auth is the AS-REP roasting follow-on to the same user enumeration.
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Targeting Domain/Enterprise Admins via PowerView after user listing indicates privilege-escalation scoping.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / AD recon cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(Get-Net(Group|GroupMember|Computer|LocalGroup|Session|Loggedon|Share|GPO|OU|Domain|DomainController)|Get-Domain(User|Group|Computer|Controller|Trust|GPO|SID|Policy)|Find-(LocalAdminAccess|DomainShare|DomainUserLocation|GPOLocation)|Invoke-(ShareFinder|UserHunter|EnumerateLocalAdmin|ACLScanner|MapDomainTrust)|Get-ObjectAcl).*/
    pivot_on:
    - host
    window: 2h
  - name: Kerberoast / AS-REP roast tooling in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ii]nvoke-[Kk]erberoast|[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket|[Rr]equest-[Ss][Pp][Nn][Tt]icket|[Kk]erberosRequestorSecurityToken|[Rr]ubeus|[Ii]nvoke-[Aa][Ss][Rr][Ee][Pp][Rr]oast|[Gg]et-[Aa]sreproast).*/
    pivot_on:
    - host
    window: 4h
  - name: PowerView / PowerSploit loaded or downloaded into memory
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Pp]ower[Vv]iew|[Pp]ower[Ss]ploit|[Dd]ownload[Ss]tring|[Ii]nvoke-[Ww]eb[Rr]equest|[Nn]et\.[Ww]eb[Cc]lient|[Ff]rom[Bb]ase64[Ss]tring).*/ AND data_win_eventdata_scriptBlockText:/.*([Gg]et-[Nn]et|[Gg]et-[Dd]omain|[Ii]mport-[Mm]odule|[Ii][Ee][Xx]|[Ii]nvoke-[Ee]xpression).*/
    pivot_on:
    - host
    window: 2h
  - name: PowerShell launched with evasion flags or PowerView references
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Pp]ower[Vv]iew|[Pp]ower[Ss]ploit|-[Ee]xecution[Pp]olicy.*[Bb]ypass|-[Ee]p +[Bb]ypass|-[Ee]nc|-[Ee]ncodedcommand|-[Ww]indow[Ss]tyle +[Hh]idden|-[Nn]o[Pp]rofile).*/
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound to SMB/WinRM/RDP/LDAP (lateral movement follow-on)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636")
    pivot_on:
    - host
    window: 4h
