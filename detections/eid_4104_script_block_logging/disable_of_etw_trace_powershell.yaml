name: Disable of ETW Trace - Powershell
id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
version: 1
schema_version: "1.0"
date: "2022-11-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of powershell cmdlets to disable or remove ETW trace sessions.
  MITRE ATT&CK: T1070, T1685.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Remove-EtwTraceProvider *"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Set-EtwTraceProvider *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*0x11*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Remove-EtwTraceProvider *';
  data_win_eventdata_scriptBlockText matches '*Set-EtwTraceProvider *';
  data_win_eventdata_scriptBlockText matches '*0x11*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/palantir/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Disable of ETW Trace - Powershell detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1070, T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1685
  custom_tags:
    - disable
    - trace
    - powershell
    - stealth
    - defense_impairment
    - car_2016_04_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ee][Tt][Ww][Tt][Rr][Aa][Cc][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr] .*/ OR (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ee][Tt][Ww][Tt][Rr][Aa][Cc][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr] .*/ AND data_win_eventdata_scriptBlockText:/.*0[Xx]11.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: Command-line side of the same ETW-blinding behaviour (logman/wevtutil/registry); shows the attacker mixing PowerShell and native tools to silence tracing.
  - id: cd1f961e-0b96-436b-b7c6-38da4583ec00
    name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
    reason: Alternative way to stop or delete ETW sessions; co-occurs when the operator falls back from cmdlets to logman.
  - id: 41421f44-58f9-455d-838a-c398859841d4
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    reason: Disabling .NET ETW (COMPlus_ETWEnabled) is the companion step to blind CLR telemetry before loading managed tooling.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: AMSI bypass is usually paired with ETW removal in the same PowerShell prologue so payloads run unscanned and unlogged.
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: 'Same defence-impairment prologue: ETW provider removed and AMSI disabled just before the real payload executes.'
  - id: 602f5669-6927-4688-84db-0d4b7afb2150
    name: Disable Powershell Command History
    reason: Another PowerShell anti-forensics step (PSReadLine history off) that typically sits beside ETW tampering in a stealth preamble.
  - id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
    name: Tamper Windows Defender - ScriptBlockLogging
    reason: 'Defender tampering in the same session: attacker is blinding both the EDR/AV and event tracing before staging.'
  - id: 0f017df3-8f5a-414f-ad6b-24aff1128278
    name: Suspicious Eventlog Clear
    reason: 'Follow-on clean-up: after disabling trace providers the operator often wipes the event logs to remove residual evidence.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AMSI bypass or CLR/ETW patching in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*amsiContext* OR data_win_eventdata_scriptBlockText:*EtwEventWrite* OR data_win_eventdata_scriptBlockText:*VirtualProtect* OR data_win_eventdata_scriptBlockText:*SetValue*)
    pivot_on:
    - host
    window: 1h
  - name: Logman/wevtutil/registry ETW and log tampering commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Mm][Aa][Nn] (stop|delete|update).*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* (cl|clear-log|sl).*/ OR data_win_eventdata_commandLine:*ETWEnabled* OR data_win_eventdata_commandLine:*Autologger* OR data_win_eventdata_commandLine:*Clear-EventLog*)
    pivot_on:
    - host
    window: 2h
  - name: Download cradles and encoded PowerShell staged around ETW tampering
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*Reflection.Assembly* OR data_win_eventdata_scriptBlockText:*Net.WebClient*)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawned processes and network connections after blinding
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/)
    pivot_on:
    - host
    window: 1h
  - name: Defender tampering and credential-access follow-on
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Set-MpPreference* OR data_win_eventdata_commandLine:*Add-MpPreference* OR data_win_eventdata_commandLine:*DisableRealtimeMonitoring*)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.exe/)
    pivot_on:
    - host
    window: 2h
