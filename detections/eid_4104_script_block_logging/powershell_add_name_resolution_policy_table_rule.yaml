name: Powershell Add Name Resolution Policy Table Rule
id: 4368354e-1797-463c-bc39-a309effbe8d7
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Borna Talebi
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4368354e-1797-463c-bc39-a309effbe8d7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects powershell scripts that adds a Name Resolution Policy Table (NRPT)
  rule for the specified namespace. This will bypass the default DNS server and
  uses a specified server for answering the query. MITRE ATT&CK: T1565.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Add-DnsClientNrptRule*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Namesp*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-NameSe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Add-DnsClientNrptRule*';
  data_win_eventdata_scriptBlockText matches '*-Namesp*';
  data_win_eventdata_scriptBlockText matches '*-NameSe*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/NathanMcNulty/status/1569497348841287681
  - https://learn.microsoft.com/en-us/powershell/module/dnsclient/add-dnsclientnrptrule?view=windowsserver2022-ps
  - https://attack.mitre.org/techniques/T1565/

response:
  message: >
    Powershell Add Name Resolution Policy Table Rule detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1565
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1565
  custom_tags:
    - powershell
    - resolution
    - policy
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Dd][Nn][Ss][Cc][Ll][Ii][Ee][Nn][Tt][Nn][Rr][Pp][Tt][Rr][Uu][Ll][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*-[Nn][Aa][Mm][Ee][Ss][Pp].*/ AND data_win_eventdata_scriptBlockText:/.*-[Nn][Aa][Mm][Ee][Ss][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 42821614-9264-4761-acfc-5772c3286f76
    name: Root Certificate Installed - PowerShell
    reason: NRPT redirection to an attacker DNS/proxy is typically paired with a rogue root CA so the redirected TLS traffic is intercepted without certificate errors
  - id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
    name: New Root Certificate Installed Via Certutil.EXE
    reason: 'Same adversary-in-the-middle setup as the NRPT rule: a trusted rogue root installed via certutil to decrypt traffic whose DNS was just redirected'
  - id: d223b46b-5621-4037-88fe-fda32eead684
    name: New Root or CA or AuthRoot Certificate to Store
    reason: Registry-level confirmation that a rogue CA was added to the trust store alongside the DNS policy change
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The NRPT rule is usually pushed by a PowerShell stage fetched via a download cradle; this is the likely precursor delivering the script
  - id: a54f842a-3713-4b45-8c84-5f136fdebd3c
    name: New PortProxy Registry Entry Added
    reason: Companion traffic-redirection technique (netsh portproxy) used with NRPT to relay redirected connections to attacker infrastructure
  - id: windows-powershell-remote-services-add-trustedhost-001
    name: Powershell Remote Services Add TrustedHost
    reason: Same PowerShell session may weaken WinRM trust to attacker-named hosts that the NRPT now resolves through the rogue DNS server
  - id: ca8b77a9-d499-4095-b793-5d5f330d450e
    name: PowerShell Credential Prompt
    reason: Redirected namespaces (SSO/login hosts) enable credential harvesting; a scripted credential prompt on the same host is a follow-on harvesting step
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other DNS client / resolver tampering in PowerShell or CLI
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Dd][Nn][Ss][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Dd][Nn][Ss][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Nn][Ss][Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Hh][Oo][Ss][Tt][Ss].*[Aa][Dd][Dd]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt][Ss][Hh].*[Dd][Nn][Ss]|[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Ee][Tt][Cc]\\[Hh][Oo][Ss][Tt][Ss]|[Ss][Ee][Tt]-[Dd][Nn][Ss]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Rogue root CA or certificate trust changes on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*-[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee]|[Cc][Ee][Rr][Tt][Mm][Gg][Rr].*-[Aa][Dd][Dd]|[Ii][Mm][Pp][Oo][Rr][Tt]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee]).*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]\\([Rr][Oo][Oo][Tt]|[Aa][Uu][Tt][Hh][Rr][Oo][Oo][Tt]|[Cc][Aa]).*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell download cradles or remote script fetch preceding the policy change
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound DNS to non-corporate resolvers (port 53 / DoT / DoH) from this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"53" OR data_win_eventdata_destinationPort:"853") AND NOT data_win_eventdata_destinationIp:/(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.).*/
    pivot_on:
    - host
    window: 4h
  - name: Traffic relay or tunnelling set up on this host after redirection
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt][Ss][Hh].*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy]|[Nn][Gg][Rr][Oo][Kk]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]|[Pp][Ll][Ii][Nn][Kk]).*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/)
    pivot_on:
    - host
    window: 4h
