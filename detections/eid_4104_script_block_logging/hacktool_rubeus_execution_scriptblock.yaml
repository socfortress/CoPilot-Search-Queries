name: HackTool - Rubeus Execution - ScriptBlock
id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
version: 1
schema_version: "1.0"
date: "2023-04-27"
author: Christian Burkard (Nextron Systems), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the hacktool Rubeus using specific command line
  flags. MITRE ATT&CK: T1003, T1558.003, T1550.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*asreproast *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*dump /service:krbtgt *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*dump /luid:0x*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*kerberoast *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*createnetonly /program:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*ptt /ticket:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*/impersonateuser:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*renew /ticket:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*asktgt /user:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*harvest /interval:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*s4u /user:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*s4u /ticket:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*hash /password:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*golden /aes256:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*silver /user:*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*asreproast *';
  data_win_eventdata_scriptBlockText matches '*dump /service:krbtgt *';
  data_win_eventdata_scriptBlockText matches '*dump /luid:0x*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.harmj0y.net/redteaming/from-kekeo-to-rubeus
  - https://m0chan.github.io/2019/07/31/How-To-Attack-Kerberos-101.html
  - https://github.com/GhostPack/Rubeus
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1558/003/
  - https://attack.mitre.org/techniques/T1550/003/

response:
  message: >
    HackTool - Rubeus Execution - ScriptBlock detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1003, T1558.003, T1550.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
    - T1558.003
    - T1550.003
  custom_tags:
    - hacktool
    - rubeus
    - scriptblock
    - powershell
    - credential_access
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt] .*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Uu][Mm][Pp] \/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]:[Kk][Rr][Bb][Tt][Gg][Tt] .*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Uu][Mm][Pp] \/[Ll][Uu][Ii][Dd]:0[Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt] .*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Nn][Ee][Tt][Oo][Nn][Ll][Yy] \/[Pp][Rr][Oo][Gg][Rr][Aa][Mm]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Tt][Tt] \/[Tt][Ii][Cc][Kk][Ee][Tt]:.*/ OR data_win_eventdata_scriptBlockText:/.*\/[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ee][Uu][Ss][Ee][Rr]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Nn][Ee][Ww] \/[Tt][Ii][Cc][Kk][Ee][Tt]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Ss][Kk][Tt][Gg][Tt] \/[Uu][Ss][Ee][Rr]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Hh][Aa][Rr][Vv][Ee][Ss][Tt] \/[Ii][Nn][Tt][Ee][Rr][Vv][Aa][Ll]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]4[Uu] \/[Uu][Ss][Ee][Rr]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]4[Uu] \/[Tt][Ii][Cc][Kk][Ee][Tt]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Hh][Aa][Ss][Hh] \/[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Oo][Ll][Dd][Ee][Nn] \/[Aa][Ee][Ss]256:.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ii][Ll][Vv][Ee][Rr] \/[Uu][Ss][Ee][Rr]:.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Same tool seen as a process (Sysmon EID 1) - confirms Rubeus ran as a binary or reflectively loaded on this host, not just text in a script block
  - id: 12e6d621-194f-4f59-90cc-1959e21e69f7
    name: Register new Logon Process by Rubeus
    reason: Rubeus ticket operations (ptt, asktgt, harvest) register a logon process with LSA, logged as 4611 - runtime proof the Kerberos commands actually executed
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: In-memory PowerShell Kerberoasting tooling (Invoke-Kerberoast, KerberosRequestorSecurityToken) is the same TTP, often run alongside or instead of Rubeus kerberoast
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: Rubeus asreproast issues TGT requests without pre-auth, producing 4768 events with RC4 on the DC for the targeted accounts
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: Rubeus kerberoast/asktgt /rc4 force downgraded RC4 (0x17) ticket encryption, visible in 4769 on the domain controller
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: Rubeus asktgt /user with a hash or AES key followed by ptt/createnetonly is overpass-the-hash, yielding a logon type 9 session with the stolen credential
  - id: 9e099d99-44c2-42b6-a6d8-54c3545cab29
    name: HackTool - Mimikatz Kirbi File Creation
    reason: Rubeus dump/harvest output and base64 tickets are saved as .kirbi files for later pass-the-ticket, an exfil/staging step after ticket theft
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Command-line variant of the ticket request/roasting tradecraft, commonly paired with Rubeus when an operator pivots between in-memory and on-disk tooling
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rubeus binary, loader or Kerberos-abuse command lines on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*([Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt]|[Aa][Ss][Kk][Tt][Gg][Tt]|[Aa][Ss][Kk][Tt][Ss][Tt]|[Pp][Tt][Tt] \/[Tt][Ii][Cc][Kk][Ee][Tt]|[Ss]4[Uu] \/|[Cc][Rr][Ee][Aa][Tt][Ee][Nn][Ee][Tt][Oo][Nn][Ll][Yy]|[Hh][Aa][Rr][Vv][Ee][Ss][Tt] \/|[Ee][Xx][Ee][Cc][Uu][Tt][Ee]-[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos ticket files (.kirbi/.ccache) or base64 ticket dumps written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.kirbi OR data_win_eventdata_targetFilename:*.ccache OR data_win_eventdata_targetFilename:/.*([Tt][Ii][Cc][Kk][Ee][Tt]|[Tt][Gg][Tt]|[Kk][Rr][Bb]5).*\.([Tt][Xx][Tt]|[Bb]64|[Dd][Aa][Tt]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Direct Kerberos (port 88) connections from non-system processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88" AND NOT data_win_eventdata_image:/.*\\([Ll][Ss][Aa][Ss][Ss]|[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Ss][Aa][Ss][Ss])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: 'Roastable Kerberos requests: RC4 service tickets and TGTs without pre-auth for this account'
    query: ((data_win_system_eventID:"4769" AND data_win_eventdata_ticketEncryptionType:"0x17") OR (data_win_system_eventID:"4768" AND (data_win_eventdata_preAuthType:"0" OR data_win_eventdata_ticketEncryptionType:"0x17")) OR data_win_system_eventID:"4771")
    pivot_on:
    - user
    window: 6h
  - name: 'Ticket-based logons: NewCredentials (type 9), explicit credentials and logon-process registration'
    query: ((data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9") OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4611")
    pivot_on:
    - host
    - user
    window: 4h
