name: PowerShell Deleted Mounted Share
id: 66a4d409-451b-4151-94f4-a55d559c49b0
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: oscd.community, @redcanary, Zach Stanford @svch0st
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 66a4d409-451b-4151-94f4-a55d559c49b0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when when a mounted share is removed. Adversaries may remove share
  connections that are no longer useful in order to clean up traces of their
  operation. MITRE ATT&CK: T1070.005.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Remove-SmbShare*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Remove-FileShare*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_scriptBlockText"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*FileShare.cdxml*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Microsoft.PowerShell.Core\\\\Export-ModuleMember*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*ROOT/Microsoft/Windows/Storage/MSFT_FileShare*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*ObjectModelWrapper*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Cmdletization.MethodParameter*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Remove-SmbShare*';
  data_win_eventdata_scriptBlockText matches '*Remove-FileShare*';
  data_win_eventdata_scriptBlockText matches '*FileShare.cdxml*', among other
  conditions.

known_false_positives: >
  Administrators or Power users may remove their shares via cmd line. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.005/T1070.005.md
  - https://attack.mitre.org/techniques/T1070/005/

response:
  message: >
    PowerShell Deleted Mounted Share detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1070.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.005
  custom_tags:
    - powershell
    - deleted
    - mounted
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ss][Mm][Bb][Ss][Hh][Aa][Rr][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ff][Ii][Ll][Ee][Ss][Hh][Aa][Rr][Ee].*/) AND _exists_:data_win_eventdata_scriptBlockText AND NOT (data_win_eventdata_scriptBlockText:/.*[Ff][Ii][Ll][Ee][Ss][Hh][Aa][Rr][Ee]\.[Cc][Dd][Xx][Mm][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Cc][Oo][Rr][Ee]\\[Ee][Xx][Pp][Oo][Rr][Tt]-[Mm][Oo][Dd][Uu][Ll][Ee][Mm][Ee][Mm][Bb][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Rr][Oo][Oo][Tt]\/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\/[Ss][Tt][Oo][Rr][Aa][Gg][Ee]\/[Mm][Ss][Ff][Tt]_[Ff][Ii][Ll][Ee][Ss][Hh][Aa][Rr][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Oo][Bb][Jj][Ee][Cc][Tt][Mm][Oo][Dd][Ee][Ll][Ww][Rr][Aa][Pp][Pp][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Mm][Dd][Ll][Ee][Tt][Ii][Zz][Aa][Tt][Ii][Oo][Nn]\.[Mm][Ee][Tt][Hh][Oo][Dd][Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1c563233-030e-4a07-af8c-ee0490a66d3a
    name: Suspicious New-PSDrive to Admin Share
    reason: Mapping an admin share via New-PSDrive is the mount whose removal this rule sees; precursor in the same PowerShell session
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: net use mount of C$/ADMIN$ is the cmd-based precursor to the share connection being cleaned up
  - id: a44c0be1-d7ab-41e4-92fd-aa9af4fe232c
    name: Windows File Share Discovery With Powerview
    reason: Share enumeration precedes choosing and mounting a share for staging or lateral movement
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Tool/payload copy over the mounted admin share, typically between mount and unmount
  - id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
    name: Writing Local Admin Share
    reason: 'File written to an admin share while mounted: payload staging or exfil before the connection is removed'
  - id: b210394c-ba12-4f89-9117-44a2464b9511
    name: SMB Create Remote File Admin Share
    reason: Remote file creation over admin share confirms the mounted share was used to drop files
  - id: 26b692dc-1722-49b2-b496-a8258aa6371d
    name: Clear PowerShell History - PowerShell
    reason: 'Same anti-forensic cleanup stage: attackers remove the share and wipe PS history together'
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Log clearing is the usual companion of T1070 indicator removal after share-based operations
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Admin share / drive mapping commands (net use, New-PSDrive) on host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?[ ]+[Uu][Ss][Ee].*/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Pp][Ss][Dd][Rr][Ii][Vv][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ss][Mm][Bb][Mm][Aa][Pp][Pp][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Ll][Oo][Gg][Ii][Cc][Aa][Ll][Dd][Ii][Ss][Kk].*/))
    pivot_on:
    - host
    window: 2h
  - name: Files copied or staged to network shares (Copy-Item, robocopy, xcopy, UNC paths)
    query: (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm]|[Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy]).*/ AND data_win_eventdata_scriptBlockText:/.*\\\\.*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\\\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Share disconnect and other cleanup (net use /delete, Remove-PSDrive, history clearing)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?[ ]+[Uu][Ss][Ee].*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Pp][Ss][Dd][Rr][Ii][Vv][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ss][Mm][Bb][Mm][Aa][Pp][Pp][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ee][Aa][Rr]-[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Hh][Oo][Ss][Tt]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/))
    pivot_on:
    - host
    window: 2h
  - name: Log clearing and file/artifact deletion by wevtutil, wmic or fsutil
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*([Cc][Ll]|[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg]).*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll].*[Uu][Ss][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound SMB connections from the host (lateral movement / share use)
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445" AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
