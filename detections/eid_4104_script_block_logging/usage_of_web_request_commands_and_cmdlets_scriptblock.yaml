name: Usage Of Web Request Commands And Cmdlets - ScriptBlock
id: 1139d2e2-84b1-4226-b445-354492eba8ba
version: 1
schema_version: "1.0"
date: "2025-10-20"
author: James Pemberton / @4A616D6573
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1139d2e2-84b1-4226-b445-354492eba8ba
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of various web request commands with commandline tools and
  Windows PowerShell cmdlets (including aliases) via PowerShell scriptblock
  logs. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*[System.Net.WebRequest]::create*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*curl *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Invoke-RestMethod*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Invoke-WebRequest*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* irm *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*iwr *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Resume-BitsTransfer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Start-BitsTransfer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*wget *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*WinHttp.WinHttpRequest*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_path"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_path:
                    value: "C:\\\\Packages\\\\Plugins\\\\Microsoft.GuestConfiguration.ConfigurationforWindows\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches
  '*[System.Net.WebRequest]::create*'; data_win_eventdata_scriptBlockText
  matches '*curl *'; data_win_eventdata_scriptBlockText matches
  '*Invoke-RestMethod*', among other conditions.

known_false_positives: >
  Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and
  Start-BitsTransfer. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://4sysops.com/archives/use-powershell-to-download-a-file-with-http-https-and-ftp/
  - https://blog.jourdant.me/post/3-ways-to-download-files-with-powershell
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Usage Of Web Request Commands And Cmdlets - ScriptBlock detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched data_win_eventdata_path:
    $data_win_eventdata_path$. MITRE ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_path
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - request
    - cmdlets
    - scriptblock
    - powershell
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]\]::[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Uu][Rr][Ll] .*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.* [Ii][Rr][Mm] .*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ss][Uu][Mm][Ee]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Gg][Ee][Tt] .*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Hh][Tt][Tt][Pp]\.[Ww][Ii][Nn][Hh][Tt][Tt][Pp][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/) AND _exists_:data_win_eventdata_path AND NOT (data_win_eventdata_path:/[Cc]:\\[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]\\[Pp][Ll][Uu][Gg][Ii][Nn][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Gg][Uu][Ee][Ss][Tt][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn]\.[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn][Ff][Oo][Rr][Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Process-creation view of the same behaviour: the web request in the script block is the download half of a cradle (IEX + WebClient/IWR) that this rule shows executing'
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Download-then-execute chained on one command line confirms the web request fetched a payload that was run, not just a benign API call
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: Same PowerShell download fetching from paste/file-sharing hosts commonly used to stage payloads; names the source of the web request
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Loaders hide the Invoke-WebRequest/DownloadString in -EncodedCommand; the 4104 block is the decoded layer of this launch
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Attackers patch AMSI via reflection right before pulling a payload over HTTP so the downloaded script is not scanned
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: AMSI inspects the script block that performed the web request; a trigger means the downloaded or invoked content was flagged as malicious
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: Defender detection on the file or script fetched by the web request confirms the download was a malicious payload
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Common follow-on: a payload downloaded by the script is registered under a Run key for persistence'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Script block download cradle: execute, encode or load downloaded content'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\]::[Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Executable or script dropped to disk by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Mm][Ss][Ii]|[Ss][Cc][Rr])/
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: DNS lookups by PowerShell for paste, tunnel and file-sharing hosts
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_queryName:(*pastebin* OR *githubusercontent* OR *ngrok* OR *transfer.sh* OR *discordapp* OR *anonfiles* OR *mega.nz* OR *dropbox* OR *trycloudflare*)
    pivot_on:
    - host
    window: 2h
  - name: Child processes launched from PowerShell after the download
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Ww][Mm][Ii][Cc]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Rr][Ee][Gg]|[Nn][Ee][Tt]1?)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
