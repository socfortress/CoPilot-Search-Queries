name: Windows Find Domain Organizational Units with GetDomainOU
id: 0ada2f82-b7af-40cc-b1d7-1e5985afcb4e
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution of the Get-DomainOU cmdlet from the PowerView toolkit,
  used to enumerate organizational units within Active Directory. Attackers
  use this information to map domain structure, identify privileged OUs, and
  facilitate lateral movement or privilege escalation. Get-DomainOU is part
  of the PowerSploit/PowerView recon toolkit commonly used in post-exploitation
  scenarios.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainOU*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators may leverage PowerSploit tools for legitimate AD management
  and auditing purposes. Filter known authorized security assessment activity
  as needed.

references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainOU/
  - https://book.hacktricks.xyz/windows-hardening/basic-powershell-for-pentesters/powerview

response:
  message: >
    PowerView Get-DomainOU AD enumeration detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1087.002
  risk_score: 25
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 25
    - field: data_win_eventdata_user
      type: user
      score: 25
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - powerview
    - get_domainou
    - active_directory
    - ou_enumeration
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainOU.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-DomainOU is a PowerView cmdlet; broader PowerView cmdlet use in the same session confirms the toolkit was loaded, not a one-off admin call
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Same PowerView session typically follows OU mapping with user enumeration to pick targets inside the privileged OUs
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: Group enumeration is the usual companion to OU mapping when identifying privileged principals
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: OU structure is used to locate server/DC computer objects; computer enumeration follows to pick lateral movement targets
  - id: 80ffaede-1f12-49d5-a86e-b4b599b68b3c
    name: Windows Root Domain linked policies Discovery
    reason: OUs carry linked GPOs; attacker mapping OUs commonly also reads linked policies to find GPO abuse or weak policy scopes
  - id: 39405650-c364-4e1e-a740-32a63ef042a6
    name: Windows PowerView AD Access Control List Enumeration
    reason: After identifying interesting OUs, attackers enumerate ACLs on them for delegated write/GenericAll rights to abuse
  - id: e4a96dfd-667a-4487-b942-ccef5a1e81e8
    name: Windows Find Interesting ACL with FindInterestingDomainAcl
    reason: 'Direct follow-on to OU mapping: hunting misconfigured ACLs on OUs and objects for privilege escalation'
  - id: d2988160-3ce9-4310-b59d-905334920cdd
    name: Windows Get Local Admin with FindLocalAdminAccess
    reason: 'PowerView lateral-movement staging: once computers/OUs are mapped, finds hosts where the current user is local admin'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView/AD-recon cmdlets in script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get\-Domain* OR data_win_eventdata_scriptBlockText:*Get\-Net* OR data_win_eventdata_scriptBlockText:*Find\-DomainShare* OR data_win_eventdata_scriptBlockText:*Find\-LocalAdminAccess* OR data_win_eventdata_scriptBlockText:*Get\-ObjectAcl* OR data_win_eventdata_scriptBlockText:*Invoke\-ShareFinder* OR data_win_eventdata_scriptBlockText:*Invoke\-UserHunter* OR data_win_eventdata_scriptBlockText:*Invoke\-Kerberoast*)
    pivot_on:
    - host
    window: 2h
  - name: PowerView/PowerSploit download or in-memory load preceding the recon
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*PowerView* OR data_win_eventdata_scriptBlockText:*PowerSploit* OR data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke\-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*FromBase64String*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell launched with encoded/hidden/bypass arguments on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*\-[Ee]nc* OR data_win_eventdata_commandLine:*[Bb]ypass* OR data_win_eventdata_commandLine:*IEX* OR data_win_eventdata_commandLine:*DownloadString*)
    pivot_on:
    - host
    window: 2h
  - name: LDAP/Kerberos connections from PowerShell or script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\([Pp]ower[Ss]hell|[Pp]wsh|[Ww]script|[Cc]script)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"88")
    pivot_on:
    - host
    window: 1h
  - name: Follow-on remote execution / share mounting after AD mapping
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\[Pp][Ss][Ee][Xx][Ee][Cc]6?4?\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*node*) OR (data_win_eventdata_image:/.*\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*use*))
    pivot_on:
    - host
    window: 4h
