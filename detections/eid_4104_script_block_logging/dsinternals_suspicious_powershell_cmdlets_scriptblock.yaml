status: experimental
type: TTP

description: >
  Detects execution and usage of the DSInternals PowerShell module. Which can be
  used to perform what might be considered as suspicious activity such as
  dumping DPAPI backup keys or manipulating NTDS.DIT files. The DSInternals
  PowerShell Module exposes several internal features of Active Directory and
  Azure Active Directory. These include FIDO2 and NGC key auditing, offline
  ntds.dit file manipulation, password auditing, DC recovery from IFM backups
  and password hash calculation. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Add-ADDBSidHistory*"
