correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 43d91656-a9b2-4541-b7e2-6a9bd3a13f4e
    name: DSInternals Suspicious PowerShell Cmdlets
    reason: Same DSInternals cmdlets seen on the command line (Sysmon EID 1) instead of script block; confirms the module was run interactively or via powershell -c on this host.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Offline ntds.dit cmdlets (Get-ADDBAccount, Get-BootKey) need an IFM/ntdsutil copy of the database; ntdsutil ifm is the usual precursor that produces the file DSInternals then parses.
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: The ntds.dit copy that Get-ADDBAccount/Get-ADDBBackupKey operate on must be written to disk first; a non-standard writer is the staging step before the DSInternals parse.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Staging and copying of ntds.dit plus SYSTEM hive for offline extraction, the data-gathering step feeding DSInternals hash extraction.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Get-BootKey/Get-SysKey need the SYSTEM hive; reg save of SYSTEM/SAM/SECURITY is the companion step that supplies the boot key for decrypting ntds.dit secrets.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Get-ADReplAccount and Get-ADReplBackupKey perform DCSync-style DRSUAPI replication; this fires on the same replication request from a DC's security log.
  - id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
    name: DPAPI Backup Keys And Certificate Export Activity IOC
    reason: Get-ADDBBackupKey/Get-LsaBackupKey/Save-DPAPIBlob export the domain DPAPI backup key; this file-creation rule catches the resulting .pvk/.pfx key artifacts.
  - id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
    name: Addition of SID History to Active Directory Object
    reason: Add-ADDBSidHistory and Set-ADAccountPasswordHash are DSInternals write cmdlets; SID history injection or password hash set on a live DC is the persistence/privilege-escalation payoff.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ntds.dit / SYSTEM hive / DPAPI key files written on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*[Nn][Tt][Dd][Ss].[Dd][Ii][Tt]* OR data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.(hiv|save|bak).*/ OR data_win_eventdata_targetFilename:/.*\.(pvk|pfx)/ OR data_win_eventdata_targetFilename:*[Ii][Ff][Mm]* OR data_win_eventdata_targetFilename:*[Ee][Dd][Bb].[Ll][Oo][Gg]*)
    pivot_on:
    - host
    window: 4h
  - name: ntdsutil / vssadmin / reg save used to stage AD database and hives
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].[Ee][Xx][Ee] AND data_win_eventdata_commandLine:(*[Ii][Ff][Mm]* OR *[Ii][Nn][Ss][Tt][Aa][Ll][Ll]* OR *[Aa][Cc][Tt][Ii][Vv][Aa][Tt][Ee]*)) OR (data_win_eventdata_image:*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee] AND data_win_eventdata_commandLine:*[Cc][Rr][Ee][Aa][Tt][Ee]*[Ss][Hh][Aa][Dd][Oo][Ww]*) OR (data_win_eventdata_image:*[Rr][Ee][Gg].[Ee][Xx][Ee] AND data_win_eventdata_commandLine:*[Ss][Aa][Vv][Ee]* AND data_win_eventdata_commandLine:(*[Ss][Yy][Ss][Tt][Ee][Mm]* OR *[Ss][Aa][Mm]* OR *[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]*)))
    pivot_on:
    - host
    window: 4h
  - name: Credential-theft tooling in script blocks alongside DSInternals
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]* OR data_win_eventdata_scriptBlockText:*[Dd][Cc][Ss][Yy][Nn][Cc]* OR data_win_eventdata_scriptBlockText:*[Ii][Mm][Pp][Oo][Rr][Tt]-[Mm][Oo][Dd][Uu][Ll][Ee]*[Dd][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss]* OR data_win_eventdata_scriptBlockText:*[Ss][Aa][Mm][Ee]-[Hh][Aa][Ss][Hh]* OR data_win_eventdata_scriptBlockText:*[Ll][Ss][Aa][Ss][Ss]* OR data_win_eventdata_scriptBlockText:*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]*)
    pivot_on:
    - host
    window: 2h
  - name: Archive or outbound transfer of extracted hashes and key files
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*[Cc]ompress-[Aa]rchive* OR *[Rr]ar*[Aa]* OR *7z*[Aa]* OR *[Cc]url*-[Tt]* OR *[Ss]cp* OR *[Tt]ransfer*)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(zip|rar|7z)/)
    pivot_on:
    - host
    window: 2h
  - name: Follow-on network logons by the account (pass-the-hash / lateral use)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on:
    - user
    window: 6h
