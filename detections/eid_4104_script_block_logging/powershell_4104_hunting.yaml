graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Net.WebClient.*/ OR data_win_eventdata_scriptBlockText:/.*downloadstring.*/ OR data_win_eventdata_scriptBlockText:/.*downloadfile.*/ OR data_win_eventdata_scriptBlockText:/.*bitstransfer.*/ OR data_win_eventdata_scriptBlockText:/.*internetexplorer.application.*/ OR data_win_eventdata_scriptBlockText:/.*xmlhttp.*/ OR data_win_eventdata_scriptBlockText:/.*socket.*/ OR data_win_eventdata_scriptBlockText:/.*http:\/\/127.0.0.1.*/ OR data_win_eventdata_scriptBlockText:/.*IEX.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Expression.*/ OR data_win_eventdata_scriptBlockText:/.*frombase64string.*/ OR data_win_eventdata_scriptBlockText:/.*\$doit.*/ OR data_win_eventdata_scriptBlockText:/.*\-version\s+2.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Command.*/ OR data_win_eventdata_scriptBlockText:/.*mimikatz.*/ OR data_win_eventdata_scriptBlockText:/.*SEKURLSA.*/ OR data_win_eventdata_scriptBlockText:/.*kerberos::ptt.*/ OR data_win_eventdata_scriptBlockText:/.*kerberos::golden.*/ OR data_win_eventdata_scriptBlockText:/.*\-dumpcr.*/ OR data_win_eventdata_scriptBlockText:/.*LSASecret.*/ OR data_win_eventdata_scriptBlockText:/.*Get-PassHash.*/ OR data_win_eventdata_scriptBlockText:/.*Get-GPPPassword.*/ OR data_win_eventdata_scriptBlockText:/.*Get-VaultCredential.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Shellcode.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-ReflectivePEInjection.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-DllInjection.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-DCSync.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-PSInject.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-BypassUAC.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-PsExec.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-CredentialInjection.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Mimikittenz.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-PortScan.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-PowerDump.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-UserHunter.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-AllChecks.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Inveigh.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-SMBScanner.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-ARPScan.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-BackdoorLNK.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-PowerShellTCP.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-WScriptBypassUAC.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-ShellCommand.*/ OR data_win_eventdata_scriptBlockText:/.*Get-ChromeDump.*/ OR data_win_eventdata_scriptBlockText:/.*Get-FoxDump.*/ OR data_win_eventdata_scriptBlockText:/.*Get-Keystrokes.*/ OR data_win_eventdata_scriptBlockText:/.*Get-Screenshot.*/ OR data_win_eventdata_scriptBlockText:/.*Get-TimedScreenshot.*/ OR data_win_eventdata_scriptBlockText:/.*Get-ClipboardContents.*/ OR data_win_eventdata_scriptBlockText:/.*PowerView.*/ OR data_win_eventdata_scriptBlockText:/.*PowerUp.*/ OR data_win_eventdata_scriptBlockText:/.*PowerBreach.*/ OR data_win_eventdata_scriptBlockText:/.*nishang.*/ OR data_win_eventdata_scriptBlockText:/.*AmsiBypass.*/ OR data_win_eventdata_scriptBlockText:/.*VolumeShadowCopyTools.*/ OR data_win_eventdata_scriptBlockText:/.*copy-vss.*/ OR data_win_eventdata_scriptBlockText:/.*GZipStream.*/ OR data_win_eventdata_scriptBlockText:/.*::Decompress.*/ OR data_win_eventdata_scriptBlockText:/.*IO.Compression.*/ OR data_win_eventdata_scriptBlockText:/.*Reflection.Assembly.*/ OR data_win_eventdata_scriptBlockText:/.*AssemblyBuilderAccess.*/ OR data_win_eventdata_scriptBlockText:/.*shellcode.*/ OR data_win_eventdata_scriptBlockText:/.*injection.*/ OR data_win_eventdata_scriptBlockText:/.*backdoor.*/ OR data_win_eventdata_scriptBlockText:/.*DisableRealtimeMonitoring.*/ OR data_win_eventdata_scriptBlockText:/.*rundll32.*/ OR data_win_eventdata_scriptBlockText:/.*lsass.