correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Process-creation view of the same download-cradle behaviour (Net.WebClient/DownloadString/IEX) the 4104 block exposes; confirms the launch command line and parent.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Encoded -enc launch is the usual precursor to the decoded script block logged in 4104 (FromBase64String/IEX).
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Reflection.Assembly keyword in the 4104 block maps to in-memory .NET loading launched from a base64 command line.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: AMSI bypass is run first to blind scanning before the payload script block (AmsiBypass/Reflection) executes.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: DisableRealtimeMonitoring in the script block pairs with Set-MpPreference process execution that disables Defender before payload staging.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusion is a common defense-evasion step right before dropping tooling that this hunt then flags.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: The comsvcs/lsass/rundll32 keywords in the script block lead to MiniDump of LSASS via comsvcs.dll, the credential-theft follow-on.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Mimikatz/SEKURLSA/Invoke-Mimikatz script blocks are confirmed when a non-system process opens LSASS with dump-capable access rights on the same host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell spawned network connections (C2/staging)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell DNS lookups (download/C2 domains)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND NOT data_win_eventdata_queryName:/.*(microsoft|windows|windowsupdate|msftconnecttest|office)\..*/
    pivot_on:
    - host
    window: 1h
  - name: Process access to LSASS (credential theft follow-on)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.exe/
    pivot_on:
    - host
    window: 2h
  - name: Files dropped by PowerShell (staged payloads/dumps)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:/.*\.(exe|dll|dmp|ps1|bat|vbs|zip|7z|rar).*/
    pivot_on:
    - host
    window: 2h
  - name: Defender tamper or persistence commands from PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Set-MpPreference* OR data_win_eventdata_commandLine:*Add-MpPreference* OR data_win_eventdata_commandLine:*DisableRealtimeMonitoring* OR data_win_eventdata_commandLine:*schtasks*\/create* OR data_win_eventdata_commandLine:*CurrentVersion\\Run* OR data_win_eventdata_commandLine:*New-Service* OR data_win_eventdata_commandLine:*vssadmin*delete*)
    pivot_on:
    - host
    window: 4h
