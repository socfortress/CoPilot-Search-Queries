name: Get-NetTcpconnection with PowerShell Script Block
id: 091712ff-b02a-4d43-82ed-34765515d95d
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-NetTcpconnection` PowerShell 
  cmdlet using PowerShell Script Block Logging (EventID 4104). This cmdlet lists network 
  connections on a system, which adversaries may use for situational awareness and Active 
  Directory discovery. Monitoring this activity is crucial as it can indicate reconnaissance 
  efforts by an attacker. If confirmed malicious, this behavior could allow an attacker to 
  map the network, identify critical systems, and plan further attacks, potentially leading 
  to data exfiltration or lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-NetTcpconnection*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-NetTcpconnection cmdlet, which is used for network 
  connection enumeration. Validate that data_win_eventdata_scriptBlockText field is 
  being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell cmdlet for legitimate 
  troubleshooting and network diagnostics purposes. Filter based on user context and 
  whether the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1049/
  - https://docs.microsoft.com/en-us/powershell/module/nettcpip/get-nettcpconnection?view=windowsserver2019-ps
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1049/T1049.md

response:
  message: >
    Get-NetTcpconnection execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates network connection enumeration/reconnaissance activity for network mapping. 
    MITRE ATT&CK: T1049
  risk_score: 40
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - System Network Connections Discovery
    - Network Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1049
  custom_tags:
    - get_nettcpconnection
    - network_connections
    - connection_enumeration
    - network_discovery
    - network_mapping
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-NetTcpconnection.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e02af35c-1de5-4afe-b4be-f45aba57272b
    name: GetNetTcpconnection with PowerShell
    reason: Same cmdlet seen at process-creation level (Sysmon 1); confirms the command line and parent process that ran the enumeration.
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: Same T1049 connection enumeration via netstat; attackers often run both cmdlet and binary variants in one recon burst.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Connection listing is often one step in a PowerView/offensive PS toolkit session mapping hosts and domain.
  - id: 70803451-0047-4e12-9d63-77fa7eb8649c
    name: Remote System Discovery with Adsisearcher
    reason: 'Follow-on target selection: after seeing which peers the host talks to, attackers enumerate remote systems in AD.'
  - id: 018c1972-ca07-11eb-9473-acde48001122
    name: Recon Using WMI Class
    reason: Co-occurring PowerShell host recon (WMI classes) in the same script session as connection listing.
  - id: a0edd39f-a0c6-4c17-8141-261f958e8d8f
    name: PowerShell Remote Session Creation
    reason: 'Likely next step: pivoting to discovered hosts through New-PSSession/WinRM.'
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Lateral movement follow-on against hosts identified from the connection listing.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: recon scripts are frequently delivered by a PowerShell download cradle in the same session.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound network connections initiated by PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
  - name: Other host and network recon commands (netstat, arp, net, nltest, ipconfig)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(netstat|arp|net|net1|nltest|ipconfig|route|nbtstat|tasklist|systeminfo|whoami)\.exe/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell script blocks doing further discovery or remote execution
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Test-NetConnection* OR data_win_eventdata_scriptBlockText:*Get-NetNeighbor* OR data_win_eventdata_scriptBlockText:*New-PSSession* OR data_win_eventdata_scriptBlockText:*Invoke-Command* OR data_win_eventdata_scriptBlockText:*Enter-PSSession* OR data_win_eventdata_scriptBlockText:*Get-NetIPConfiguration* OR data_win_eventdata_scriptBlockText:*Get-NetRoute*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell spawned by unusual parents (Office, script hosts, WMI, cmd)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell\.exe/ AND data_win_eventdata_parentImage:/.*\\(winword|excel|outlook|wscript|cscript|mshta|wmiprvse|cmd|rundll32)\.exe/
    pivot_on:
    - host
    window: 2h
  - name: Network or remote-interactive logons by this user after recon
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 4h
