name: Windows Find Interesting ACL with FindInterestingDomainAcl
id: e4a96dfd-667a-4487-b942-ccef5a1e81e8
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution of the Find-InterestingDomainAcl cmdlet from the PowerView
  toolkit, used to identify misconfigured or unusual Access Control Lists within
  Active Directory. Attackers use this to find privilege escalation opportunities
  such as WriteDACL, GenericAll, or GenericWrite permissions on domain objects
  that could be abused for unauthorized access or further exploitation.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Find-InterestingDomainAcl*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators may leverage PowerSploit tools for legitimate AD security
  auditing purposes. Filter known authorized security assessment activity
  as needed.

references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://powersploit.readthedocs.io/en/latest/Recon/Find-InterestingDomainAcl/
  - https://book.hacktricks.xyz/windows-hardening/basic-powershell-for-pentesters/powerview

response:
  message: >
    PowerView Find-InterestingDomainAcl ACL enumeration detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1087.002
  risk_score: 25
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 25
    - field: data_win_eventdata_user
      type: user
      score: 25
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - powerview
    - find_interesting_acl
    - active_directory
    - acl_enumeration
    - privilege_escalation
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Find-InterestingDomainAcl.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: PowerView is already loaded in the same session; privileged-group enumeration is the usual companion to ACL hunting for finding the high-value targets whose ACLs matter
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: PowerView user enumeration (Get-DomainUser) runs in the same recon pass, identifying the principals whose ACLs Find-InterestingDomainAcl then evaluates
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: PowerView computer enumeration in the same script session; maps hosts for follow-on lateral movement once abusable ACL rights are found
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: PowerView group enumeration precedes ACL analysis, since GenericAll/WriteDACL on groups is the key abuse path being sought
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: Domain trust mapping by the same PowerView toolkit signals broader forest-wide recon beyond a single domain's ACLs
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: 'Common follow-on: after finding writable ACLs/weak accounts, attackers look for AS-REP-roastable users with PowerView'
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: 'Likely next step: abusing discovered rights via Kerberos attacks (kerberoast/AS-REP roast/ticket requests) with Rubeus'
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Escalation after ACL discovery typically involves credential theft or DCSync-style abuse via in-memory Mimikatz
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / PowerSploit AD recon cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-DomainObjectAcl* OR data_win_eventdata_scriptBlockText:*Get-ObjectAcl* OR data_win_eventdata_scriptBlockText:*Invoke-ACLScanner* OR data_win_eventdata_scriptBlockText:*Get-DomainUser* OR data_win_eventdata_scriptBlockText:*Get-DomainGroupMember* OR data_win_eventdata_scriptBlockText:*Find-LocalAdminAccess* OR data_win_eventdata_scriptBlockText:*Invoke-ShareFinder* OR data_win_eventdata_scriptBlockText:*Get-NetUser* OR data_win_eventdata_scriptBlockText:*Invoke-UserHunter* OR data_win_eventdata_scriptBlockText:*Get-DomainGPO*)
    pivot_on:
    - host
    window: 2h
  - name: 'ACL abuse: DACL/object permission modification cmdlets'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Add-DomainObjectAcl* OR data_win_eventdata_scriptBlockText:*Add-ObjectAcl* OR data_win_eventdata_scriptBlockText:*Set-DomainObject* OR data_win_eventdata_scriptBlockText:*Set-DomainUserPassword* OR data_win_eventdata_scriptBlockText:*Add-DomainGroupMember* OR data_win_eventdata_scriptBlockText:*Set-ADACL* OR data_win_eventdata_scriptBlockText:*Set-Acl* OR data_win_eventdata_scriptBlockText:*GenericAll* OR data_win_eventdata_scriptBlockText:*WriteDacl* OR data_win_eventdata_scriptBlockText:*DCSync*)
    pivot_on:
    - host
    window: 4h
  - name: PowerView / PowerSploit module download or load
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*PowerView* OR data_win_eventdata_scriptBlockText:*PowerSploit* OR data_win_eventdata_scriptBlockText:*Import-Module* OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload(String|File).*/) AND (data_win_eventdata_scriptBlockText:*PowerView* OR data_win_eventdata_scriptBlockText:*PowerSploit* OR data_win_eventdata_scriptBlockText:*Recon*)
    pivot_on:
    - host
    window: 2h
  - name: Credential theft and Kerberos attack tooling following AD recon
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr]ubeus.*/ OR data_win_eventdata_image:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*([Kk]erberoast|[Aa]sktgt|[Aa]sktgs|[Ss]ekurlsa|[Ll]sadump|[Dd]csync).*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.exe/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from PowerShell to LDAP/SMB/WinRM and external hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"88")
    pivot_on:
    - host
    window: 2h
