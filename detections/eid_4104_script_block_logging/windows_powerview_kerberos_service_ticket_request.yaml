name: Windows PowerView Kerberos Service Ticket Request
id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainSPNTicket` commandlet, 
  part of the PowerView tool, by leveraging PowerShell Script Block Logging 
  (EventCode=4104). This commandlet requests Kerberos service tickets for specified 
  service principal names (SPNs). Monitoring this activity is crucial as it can 
  indicate attempts to perform Kerberoasting, a technique used to extract SPN account 
  passwords via cracking tools like hashcat. If confirmed malicious, this activity 
  could allow attackers to gain unauthorized access to sensitive accounts, potentially 
  leading to privilege escalation and further network compromise.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainSPNTicket*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of Get-DomainSPNTicket to extract Kerberos service tickets for offline 
  cracking and password theft. Validate that data_win_eventdata_scriptBlockText 
  field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  False positives may include Administrators using PowerView for legitimate 
  troubleshooting and management purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainSPNTicket/
  - https://book.hacktricks.xyz/windows-hardening/active-directory-methodology/kerberoast
  - https://github.com/PowerShellMafia/PowerSploit/blob/master/Recon/PowerView.ps1
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/t1208-kerberoasting
  - https://attack.mitre.org/techniques/T1558/003

response:
  message: >
    PowerView Kerberos ticket request detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is extracting SPN service tickets for Kerberoasting and offline password 
    cracking. MITRE ATT&CK: T1558.003
  risk_score: 55
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 55
    - field: data_win_eventdata_user
      type: user
      score: 55
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Kerberos Attacks
    - Rhysida Ransomware
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - powerview
    - get_domainspnticket
    - kerberoasting
    - spn_ticket_extraction
    - credential_theft
    - kerberos_abuse
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainSPNTicket.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 13243068-2d38-11ec-8908-acde48001122
    name: ServicePrincipalNames Discovery with PowerShell
    reason: 'Precursor: attacker enumerates kerberoastable SPN accounts via PowerShell before requesting their service tickets with Get-DomainSPNTicket.'
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: 'Precursor: setspn.exe -Q/-T is the native-binary way to find the same SPN targets that Get-DomainSPNTicket then requests tickets for.'
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: 'Co-occurring PowerView recon: Get-DomainUser -SPN selects service accounts, usually in the same session right before the ticket request.'
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: 'Sibling Kerberos roasting path: same PowerView session often hunts AS-REP roastable accounts alongside Kerberoasting.'
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: Alternate/parallel kerberoasting tooling (Rubeus kerberoast) run by the same operator in memory via PowerShell.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Process-level Rubeus execution (kerberoast, asktgs, ptt) is the likely compiled-tool follow-on or parallel to the PowerView ticket request.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Command-line tooling requesting service tickets for SPNs is the same kerberoasting action done outside PowerShell script blocks.
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: 'Follow-on: once a service account is cracked or tickets are obtained, tickets are injected/reused via kerberos::ptt for lateral movement.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / AD recon cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:(/.*[Gg]et-[Dd]omain([Uu]ser|[Cc]omputer|[Gg]roup|[Tt]rust|[Cc]ontroller|[Ff]ile[Ss]erver|[Gg][Pp][Oo]).*/ OR /.*[Ii]nvoke-[Kk]erberoast.*/ OR /.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR /.*[Ii]nvoke-[Uu]ser[Hh]unter.*/ OR /.*[Gg]et-[Nn]et[Ss][Pp][Nn].*/ OR /.*[Pp]ower[Vv]iew.*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberoasting / hash cracking tooling executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr]ubeus|[Hh]ashcat|[Jj]ohn|[Ss]etspn|[Mm]imikatz|[Kk]erberoast).*/ OR data_win_eventdata_commandLine:/.*([Kk]erberoast|[Aa]sktgs|[Kk]erberos::ptt|[Kk]erberos::list|[Hh]ashcat|[Gg]et[Uu]ser[Ss][Pp][Nn]s|-[Tt]\s+[Hh]ashcat).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kirbi / ticket / hash output files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR /.*[Kk]erberoast.*/ OR /.*[Tt][Gg][Ss]_?[Hh]ash.*/ OR /.*[Ss][Pp][Nn]_?[Hh]ashes?.*/ OR /.*[Hh]ashcat.*/ OR /.*\.[Cc][Cc][Aa][Cc][Hh][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Script blocks exporting or staging ticket hashes
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:(/.*[Hh]ashcat.*/ OR /.*\$krb5tgs\$.*/ OR /.*[Ee]xport-[Cc]sv.*[Hh]ash.*/ OR /.*[Ii]nvoke-[Kk]erberoast.*/ OR /.*[Oo]ut-[Ff]ile.*[Hh]ash.*/ OR /.*-[Ff]ormat\s+[Hh]ashcat.*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: Lateral movement or remote execution after ticket theft
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.?[Ee]?[Xx]?[Ee]?/
    pivot_on:
    - host
    window: 4h
