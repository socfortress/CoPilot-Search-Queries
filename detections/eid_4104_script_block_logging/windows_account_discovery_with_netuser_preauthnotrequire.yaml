name: Windows Account Discovery With NetUser PreauthNotRequire
id: Windows_Account_Discovery_With_NetUser_PreauthNotRequire
version: 1
schema_version: "1.0"
date: "2026-03-27"
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects execution of the PowerView PowerShell cmdlet Get-NetUser with the
  -PreauthNotRequire parameter, used to enumerate Active Directory user accounts
  that do not require Kerberos preauthentication. These accounts are vulnerable
  to AS-REP Roasting attacks where an attacker can request an AS-REP ticket and
  crack it offline to obtain the user's password hash. This is a common
  reconnaissance step preceding Kerberos-based attacks.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-NetUser*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-PreauthNotRequire*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-27 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging. The Microsoft-Windows-PowerShell/Operational channel must be
  forwarded by the Wazuh agent. Confirmed flowing in this environment.
  VALIDATED — 5 hits confirmed for Get-NetUser -PreauthNotRequire.

known_false_positives: >
  Administrators may use PowerView or similar tools for legitimate AD
  enumeration and auditing purposes. Review context and user account to
  determine if the activity is authorized.

references:
  - https://attack.mitre.org/techniques/T1087/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    PowerView Get-NetUser -PreauthNotRequire enumeration detected on
    $agent_name$ by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1087
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - CISA AA23-347A
    - AS-REP Roasting
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1087
  custom_tags:
    - powerview
    - active_directory
    - account_discovery
    - asrep_roasting
    - kerberos
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-NetUser.*/ AND data_win_eventdata_scriptBlockText:/.*-PreauthNotRequire.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: Same AS-REP-roastable account enumeration via PowerView (Get-DomainUser -PreauthNotRequired); a second hit on the same host shows the operator iterating on the same target list.
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: Alternate way to find DONT_REQ_PREAUTH accounts; attackers switch from PowerView to the AD module when one is blocked.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-NetUser is a PowerView cmdlet; this shows the wider PowerView session (and the load of the tool) that this call belongs to.
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Broader PowerView domain user enumeration typically run right before or after the preauth-not-required filter.
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: 'Roasting recon pair: after finding AS-REP roastable users, operators enumerate SPN accounts for Kerberoasting from the same session.'
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: 'Follow-on credential access: requesting service tickets (Kerberoast) after the roasting-target recon.'
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: Actual Kerberos ticket/AS-REP request from PowerShell, the exploitation step that follows identifying roastable accounts.
  - id: 59b51620-94c9-11ec-b3d5-acde48001122
    name: Kerberos Pre-Authentication Flag Disabled with PowerShell
    reason: 'Related enablement: an attacker with rights sets DONT_REQ_PREAUTH on a chosen account to make it roastable.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / AD recon script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et(User|Group|Computer|GPO|Domain|Session|Share).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain(User|Group|Computer|Controller|Trust|Policy|SID).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Uu]ser[Hh]unter.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/)
    pivot_on:
    - host
    window: 2h
  - name: AS-REP roast / Kerberoast tooling and ticket requests in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Ss][Rr][Ee][Pp][Hh]ash.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Aa][Ss][Rr][Ee][Pp][Rr]oast.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]ubeus.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Kk]erberos[Rr]equestor[Ss]ecurity[Tt]oken.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]sreproast.*/ OR data_win_eventdata_scriptBlockText:/.*[Hh]ashcat.*/)
    pivot_on:
    - host
    window: 4h
  - name: Roasting/recon binaries executed on this host (Rubeus, SharpHound, setspn, AdFind)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr]ubeus|[Ss]harp[Hh]ound|[Ss]etspn|[Aa]d[Ff]ind|[Kk]erbrute|[Cc]ertify)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Aa]sreproast|[Kk]erberoast|[Pp]reauth|[Ss]harp[Hh]ound).*/)
    pivot_on:
    - host
    window: 4h
  - name: Credential dumping or LSASS access following recon
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]ekurlsa|[Ll]sadump|[Cc]omsvcs.*[Mm]ini[Dd]ump|[Nn]tds\.dit|[Dd][Cc][Ss]ync).*/)
    pivot_on:
    - host
    window: 6h
  - name: PowerShell connections to LDAP/Kerberos/SMB ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_destinationPort:(88 OR 389 OR 636 OR 3268 OR 3269 OR 445)
    pivot_on:
    - host
    window: 2h
