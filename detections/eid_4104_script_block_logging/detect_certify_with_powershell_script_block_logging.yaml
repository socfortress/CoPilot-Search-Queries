name: Detect Certify With PowerShell Script Block Logging
id: f533ca6c-9440-4686-80cb-7f294c07812a
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of the Certify tool via an in-memory 
  PowerShell function to enumerate Active Directory Certificate Services (AD CS) 
  environments. It leverages PowerShell Script Block Logging (EventID 4104) to 
  identify specific command patterns associated with Certify's enumeration and 
  exploitation functions. This activity is significant as it indicates potential 
  reconnaissance or exploitation attempts against AD CS, which could lead to 
  unauthorized certificate issuance and privilege escalation. If confirmed malicious, 
  attackers could leverage this to escalate privileges, persist in the environment, 
  or access sensitive information by abusing AD CS vulnerabilities such as ESC1-ESC8.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Certify*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*find*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*vulnerable*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Certify tool, which is a C# tool for enumerating and 
  abusing Active Directory Certificate Services. Certify can identify misconfigurations 
  in AD CS that allow privilege escalation. The detection specifically looks for the 
  "find /vulnerable" pattern which enumerates vulnerable certificate templates.

known_false_positives: >
  No false positives have been identified at this time. Certify is a specialized 
  attack tool not typically used in legitimate administrative tasks.

references:
  - https://github.com/GhostPack/Certify
  - https://specterops.io/wp-content/uploads/sites/3/2022/06/Certified_Pre-Owned.pdf
  - https://attack.mitre.org/techniques/T1649/

response:
  message: >
    Certify tool execution detected via PowerShell on $agent_name$ by user 
    $data_win_eventdata_user$. Script: $data_win_eventdata_scriptBlockText$. 
    This indicates AD CS reconnaissance or exploitation. MITRE ATT&CK: T1649
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
    - field: data_win_eventdata_user
      type: user
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Windows Certificate Services
    - Malicious PowerShell
    - AD CS Exploitation
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1649
  custom_tags:
    - certify
    - ad_cs
    - certificate_services
    - privilege_escalation
    - reconnaissance
    - powershell
    - esc1
    - esc8
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Certify.*/ AND data_win_eventdata_scriptBlockText:/.*find.*/ AND data_win_eventdata_scriptBlockText:/.*vulnerable.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 762f2482-ff21-4970-8939-0aa317a886bb
    name: HackTool - Certify Execution
    reason: Same tool delivered as a dropped Certify.exe instead of in-memory PowerShell; either form confirms AD CS enumeration on the host.
  - id: bfbd3291-de87-4b7c-88a2-d6a5deb28668
    name: ADCS Certificate Template Configuration Vulnerability with Risky EKU
    reason: 'The vulnerable template Certify finds (ESC1-type: client-auth EKU plus enrollee-supplied subject) is what gets created/modified on the CA; seeing it ties recon to the exploitable misconfiguration.'
  - id: cd8c163e-a19b-402e-bdd5-419ff5859f12
    name: HackTool - ADCSPwn Execution
    reason: ADCSPwn is an alternate AD CS relay/abuse tool used after template recon (ESC8-style) to obtain certificates.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Issued certificates are converted to TGTs with Rubeus asktgt /certificate (PKINIT) as the next step after a Certify request.
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: In-memory Rubeus in the same PowerShell session is the likely follow-on to turn a forged cert into a ticket.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Operators typically pair AD CS recon with PowerView domain enumeration in the same in-memory PowerShell session to pick targets.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Domain-wide graph collection commonly precedes or accompanies AD CS template hunting while mapping a path to domain admin.
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Exporting an issued or forged certificate/PFX with its private key from PowerShell is a direct follow-on to certificate enrollment.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certify / Certipy / AD CS abuse command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]ertify.*/ OR data_win_eventdata_commandLine:/.*[Cc]ertipy.*/ OR data_win_eventdata_commandLine:/.*[Ee]nrollee[Ss]uppliesSubject.*/ OR data_win_eventdata_commandLine:/.*[Aa]lt[Nn]ame.*/ OR data_win_eventdata_commandLine:/.*[Cc]ertificate[Tt]emplate.*/)
    pivot_on:
    - host
    window: 2h
  - name: Script blocks requesting or exporting certificates (altname, pfx, PKINIT)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]lt[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nrollee[Ss]uppl.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xport-[Pp]fx[Cc]ertificate.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]ertificate[Tt]emplate.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Kk][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]sktgt.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: PFX/KIRBI/CCACHE credential files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR data_win_eventdata_targetFilename:/.*\.[Pp]12/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Cc][Aa][Cc][Hh][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos ticket forging and AD recon follow-on (Rubeus, PowerView, SharpHound)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]sktgt.*/ OR data_win_eventdata_commandLine:/.*[Aa]sktgs.*/ OR data_win_eventdata_commandLine:/.*\/[Cc]ertificate:.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Dd]omain.*/ OR data_win_eventdata_commandLine:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*[Dd]cync.*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: PowerShell connections to CA / DC service ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"445")
    pivot_on:
    - host
    window: 1h
