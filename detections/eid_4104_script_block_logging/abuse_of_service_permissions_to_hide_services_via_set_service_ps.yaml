name: Abuse of Service Permissions to Hide Services Via Set-Service - PS
id: 953945c5-22fe-4a92-9f8a-a9edc1e522da
version: 1
schema_version: "1.0"
date: "2022-10-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 953945c5-22fe-4a92-9f8a-a9edc1e522da
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Set-Service" powershell cmdlet to configure a new
  SecurityDescriptor that allows a service to be hidden from other utilities
  such as "sc.exe", "Get-Service"...etc. (Works only in powershell 7). MITRE
  ATT&CK: T1574.011.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Set-Service *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*DCLCWPDTSD*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-SecurityDescriptorSddl *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*-sd *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Set-Service *';
  data_win_eventdata_scriptBlockText matches '*DCLCWPDTSD*';
  data_win_eventdata_scriptBlockText matches '*-SecurityDescriptorSddl *', among
  other conditions.

known_false_positives: >
  Rare intended use of hidden services. Rare FP could occur due to the non
  linearity of the ScriptBlockText log. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/Alh4zr3d/status/1580925761996828672
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/set-service?view=powershell-7.2
  - https://attack.mitre.org/techniques/T1574/011/

response:
  message: >
    Abuse of Service Permissions to Hide Services Via Set-Service - PS detected
    on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1574.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.011
  custom_tags:
    - abuse
    - service
    - permissions
    - powershell
    - persistence
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*[Dd][Cc][Ll][Cc][Ww][Pp][Dd][Tt][Ss][Dd].*/ AND (data_win_eventdata_scriptBlockText:/.*-[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr][Ss][Dd][Dd][Ll] .*/ OR data_win_eventdata_scriptBlockText:/.*-[Ss][Dd] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
    name: Suspicious Service DACL Modification Via Set-Service Cmdlet
    reason: Process-creation view of the same Set-Service -SecurityDescriptorSddl abuse; confirms the script block actually executed as a pwsh command line.
  - id: 514e4c3a-c77d-4cde-a00f-046425e2301e
    name: Abuse of Service Permissions to Hide Services Via Set-Service
    reason: Sibling detection of the identical hidden-service SDDL (DCLCWPDTSD) technique on process-creation telemetry; co-fires when the command line is logged.
  - id: a537cfc3-4297-4789-92b5-345bfd845ad0
    name: Service DACL Abuse To Hide Services Via Sc.EXE
    reason: Same hiding goal via sc.exe sdset; attackers often fall back to sc.exe when Set-Service (PowerShell 7 only) is unavailable.
  - id: 98c5aeef-32d5-492f-b174-64a691896d25
    name: Service Security Descriptor Tampering Via Sc.EXE
    reason: Generic sc.exe sdset tampering of a service ACL, the same service-permission manipulation used to conceal or protect a malicious service.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: A hidden service must first be created; this is the likely precursor that put the persistence service in place before its DACL was hidden.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Follow-on or alternate persistence by modifying an existing service's binary path or failure command, commonly paired with hiding it.
  - id: 62b20d44-1546-4e61-afce-8e175eb9473c
    name: Service StartupType Change Via PowerShell Set-Service
    reason: Same Set-Service cmdlet used to set a service to auto-start, completing the persistence setup around the hiding step.
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: Service-permission abuse in the same family; shows whether the actor is also exploiting weak service ACLs for privilege escalation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service ACL tampering via sc.exe sdset/sdshow around the alert
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Dd][Ss][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Dd][Ss][Hh][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ll][Cc][Ww][Pp][Dd][Tt][Ss][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Service creation or binary path change (the service being hidden)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +(create|config|failure).*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/))
    pivot_on:
    - host
    window: 4h
  - name: Registry writes to service ImagePath, Parameters or Security keys
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc]urrent[Cc]ontrol[Ss]et.*[Ss]ervices.*/ AND (data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_targetObject:/.*[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss].*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell 7 (pwsh) execution and payload staging preceding the hide
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/))
    pivot_on:
    - host
    window: 2h
  - name: Security-tool tampering and service stops after service hiding
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +(stop|delete).*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? +stop.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/))
    pivot_on:
    - host
    window: 2h
