name: PowerShell Loading DotNET into Memory via Reflection
id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the use of PowerShell scripts to load .NET assemblies into memory via 
  reflection, a technique often used in malicious activities such as those by Empire 
  and Cobalt Strike. It leverages PowerShell Script Block Logging (EventCode 4104) 
  to capture and analyze the full command executed. This behavior is significant as 
  it can indicate advanced attack techniques aiming to execute code in memory, 
  bypassing traditional defenses. If confirmed malicious, this activity could lead 
  to unauthorized code execution, privilege escalation, and persistent access 
  within the environment.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Reflection.Assembly]::Load*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Reflection.Assembly.Load*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*UnsafeLoadFrom*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*.LoadFrom(*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*.LoadModule(*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*.LoadWithPartialName*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*ReflectionOnlyLoad*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  False positives should be limited as day-to-day scripts do not typically use 
  reflection-based assembly loading. Monitor for legitimate third-party applications 
  that may use this technique and adjust filters accordingly.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://docs.microsoft.com/en-us/dotnet/api/system.reflection.assembly?view=net-5.0
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://www.crowdstrike.com/blog/investigating-powershell-command-and-script-logging/

response:
  message: >
    Reflective .NET assembly loading detected in PowerShell on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
  threat_objects: []

tags:
  analytic_story:
    - Winter Vivern
    - AgentTesla
    - AsyncRAT
    - Hermetic Wiper
    - Malicious PowerShell
    - Data Destruction
    - Hellcat Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Reflection\.Assembly\]::Load.*/ OR data_win_eventdata_scriptBlockText:/.*Reflection\.Assembly\.Load.*/ OR data_win_eventdata_scriptBlockText:/.*UnsafeLoadFrom.*/ OR data_win_eventdata_scriptBlockText:/.*\.LoadFrom\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.LoadModule\(.*/ OR data_win_eventdata_scriptBlockText:/.*\.LoadWithPartialName.*/ OR data_win_eventdata_scriptBlockText:/.*ReflectionOnlyLoad.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Reflective loaders typically patch AMSI via Assembly.GetType/amsiInitFailed first so the in-memory .NET payload is not scanned; a precursor in the same script session.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: Loaders that run assemblies in memory often blind ETW/script logging beforehand; ETW tampering in the same host window confirms evasion intent.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Sibling detection of the same Assembly.Load behaviour with different patterns; co-firing shows a repeated or multi-stage in-memory load.
  - id: 03d83090-8cba-44a0-b02f-0b756a050306
    name: Potential WinAPI Calls Via PowerShell Scripts
    reason: After loading a managed payload, Add-Type/P/Invoke WinAPI use (VirtualAlloc, CreateThread) is the typical next step for shellcode or injection.
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: Reflective assembly load is commonly paired with GetProcAddress-based injection into other processes in the same fileless chain.
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: The assembly bytes are usually fetched by a download cradle just before Load(); the cradle is the delivery precursor.
  - id: bc1dc6b8-c954-11eb-bade-acde48001122
    name: Detect Empire with PowerShell Script Block Logging
    reason: The rule cites Empire as a user of reflective loading; Empire stager/agent script blocks on the same host confirm the C2 framework.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Invoke-Mimikatz and similar tooling is delivered via reflective in-memory load; credential theft is a likely follow-on.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script blocks with download cradle or Base64 decode feeding the load
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Dd]ata.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ee]xpression.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]emory[Ss]tream.*/)
    pivot_on:
    - host
    window: 1h
  - name: AMSI/ETW tampering and WinAPI/shellcode primitives in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]msi[Ii]nit[Ff]ailed.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Pp]roc[Aa]ddress.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Tt]hread.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal.*[Cc]opy.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]ventProvider.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell outbound network connections (payload fetch / C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawned by Office/script hosts or launched with encoded/hidden flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]).*/ OR data_win_eventdata_commandLine:/.*( -[Ee][Nn][Cc]| -[Ee]ncodedcommand| -[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] +[Hh]idden| -[Nn][Oo][Pp]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Remote thread / LSASS access following in-memory load
    query: (data_win_system_eventID:"8" OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 1h
