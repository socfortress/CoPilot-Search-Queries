name: Windows Exfiltration Over C2 Via Powershell UploadString
id: 59e8bf41-7472-412a-90d3-00f3afa452e9
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects potential data exfiltration using PowerShell's Net.webclient with
  the UploadString method to transfer data to an external URI. This technique
  is used by malware families including Winter Vivern and APT37/FadeStealer to
  upload sensitive data such as desktop screenshots, credentials, or files to
  attacker-controlled infrastructure. The combination of Net.webclient and
  UploadString in a script block is a strong indicator of malicious exfiltration
  activity.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Net.webclient*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*.UploadString*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block

known_false_positives: >
  False positives should be limited. Legitimate use of Net.webclient
  UploadString for API integrations or automation may occur in some
  environments. Review the destination URI and data being uploaded.

references:
  - https://attack.mitre.org/techniques/T1041/
  - https://twitter.com/_CERT_UA/status/1620781684257091584
  - https://cert.gov.ua/article/3761104

response:
  message: >
    PowerShell Net.webclient UploadString exfiltration detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1041
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - APT37 Rustonotto and FadeStealer
    - Winter Vivern
  asset_type: Endpoint
  mitre_attack_id:
    - T1041
  custom_tags:
    - net_webclient
    - uploadstring
    - exfiltration
    - c2
    - powershell
    - winter_vivern
    - apt37
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Net\.webclient.*/ AND data_win_eventdata_scriptBlockText:/.*\.UploadString.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-powershell-script-block-with-url-chain-001
    name: PowerShell Script Block With URL Chain
    reason: Same Net.webclient script chain usually carries the attacker URL; a staged download cradle precedes the UploadString upload to the same C2 infrastructure
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Net.webclient download of the next-stage payload precedes the upload; same WebClient object is reused for DownloadString then UploadString C2 tasking
  - id: 1139d2e2-84b1-4226-b445-354492eba8ba
    name: Usage Of Web Request Commands And Cmdlets - ScriptBlock
    reason: Other web request cmdlets in the same session indicate the C2 channel being used alongside UploadString
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: Sibling exfil over HTTP in PowerShell; attackers fall back between UploadString and Invoke-RestMethod to the same C2 within one stager
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: Compress-Archive staging of collected files directly precedes uploading the archive via UploadString
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: Scripted file harvesting (Get-ChildItem for documents) that feeds the data later uploaded to C2
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: Hunting for sensitive files is the collection step whose output is exfiltrated by UploadString
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Browser credential theft (FadeStealer/Winter Vivern style) yields the credentials that are uploaded to the attacker server
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WebClient download cradles and web requests in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Dd]ata.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/)
    pivot_on:
    - host
    window: 2h
  - name: Data collection and archiving in script blocks (screenshots, credentials, documents)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ystem\.[Dd]rawing.*/ OR data_win_eventdata_scriptBlockText:/.*CopyFromScreen.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]lipboard.*/ OR data_win_eventdata_scriptBlockText:/.*[Ll]ogin [Dd]ata.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]hild[Ii]tem.*(\.docx|\.xlsx|\.pdf|\.pst).*/ OR data_win_eventdata_scriptBlockText:/.*ToBase64String.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell outbound network connections to external hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:"true" AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*|172\.(1[6-9]|2[0-9]|3[01])\..*)/
    pivot_on:
    - host
    window: 1h
  - name: Staged archives or exfil files dropped by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:/.*(\.zip|\.rar|\.7z|\.png|\.jpg|\.bmp|\.txt|\.dat|\.tmp)/
    pivot_on:
    - host
    window: 2h
  - name: Script-launching parents spawning PowerShell (initial access chain)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*(\\[Mm][Ss][Hh][Tt][Aa]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|\\[Ee][Xx][Cc][Ee][Ll]|\\[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
