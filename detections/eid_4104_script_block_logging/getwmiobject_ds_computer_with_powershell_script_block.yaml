name: Get-WmiObject Ds_Computer with PowerShell Script Block
id: 29b99201-723c-4118-847a-db2b3d3fb8ea
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-WmiObject` cmdlet with the 
  `DS_Computer` class parameter via PowerShell Script Block Logging (EventID 4104). This 
  detection leverages script block text to identify queries targeting domain computers 
  using WMI. Monitoring this activity is crucial as adversaries and Red Teams may use it 
  for Active Directory Discovery and situational awareness. If confirmed malicious, this 
  behavior could allow attackers to map out domain computers, facilitating further attacks 
  such as lateral movement or privilege escalation.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-WmiObject*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*root\\directory\\ldap*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*ds_computer*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-WmiObject cmdlet with DS_Computer class targeting the 
  LDAP namespace. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell cmdlet for legitimate 
  troubleshooting and Active Directory queries. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.management/get-wmiobject?view=powershell-5.1
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1018/T1018.md

response:
  message: >
    Get-WmiObject DS_Computer LDAP query detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain computer enumeration via WMI LDAP namespace/reconnaissance activity. 
    MITRE ATT&CK: T1018
  risk_score: 55
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 55
    - field: data_win_eventdata_user
      type: user
      score: 55
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Remote System Discovery
    - Domain Computer Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - get_wmiobject
    - ds_computer
    - ldap_namespace
    - computer_enumeration
    - domain_computers
    - wmi_query
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-WmiObject.*/ AND data_win_eventdata_scriptBlockText:/.*root\\\\directory\\\\ldap.*/ AND data_win_eventdata_scriptBlockText:/.*ds_computer.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7141122c-3bc2-4aaa-ab3b-7a85a0bbefc3
    name: GetWmiObject Ds Computer with PowerShell
    reason: Same Get-WmiObject DS_Computer LDAP query seen as a process-creation command line; confirms a launched powershell.exe and gives the parent process
  - id: 22d3b118-04df-11ec-8fa3-acde48001122
    name: GetWmiObject DS User with PowerShell
    reason: Same WMI LDAP-namespace technique against DS_User; operators typically enumerate computers, users and groups in one session
  - id: df275a44-4527-443b-b884-7600e066e3eb
    name: GetWmiObject Ds Group with PowerShell
    reason: Sibling DS_Group WMI LDAP query; group enumeration follows computer discovery when scoping privileged targets
  - id: ed550c19-712e-43f6-bd19-6f58f61b3a5e
    name: GetDomainComputer with PowerShell
    reason: PowerView Get-DomainComputer is the common alternate way to list domain computers; attackers switch methods within the same discovery phase
  - id: 435e10e4-992a-4281-96f3-38b11106adde
    name: Computer Discovery And Export Via Get-ADComputer Cmdlet
    reason: Same goal (list domain computers) via the AD module, often exported to a file as a target list
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Locating DCs is a typical precursor and companion to LDAP/WMI directory queries
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: Computer enumeration over LDAP is a core SharpHound step; escalation from manual WMI enumeration to full AD graphing
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Discovered computers become WMI lateral movement targets; the next step once the target list exists
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD/LDAP enumeration script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Ss]_[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ss]_[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Cc]omputer.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[A-Za-z]+.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]irectory[Ss]earcher.*/)
    pivot_on:
    - host
    window: 2h
  - name: AD recon tooling process creation on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?\s+(group|view|computers).*\/domain.*/)
    pivot_on:
    - host
    window: 2h
  - name: WMI remote execution and lateral movement from this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Cc]im[Mm]ethod.*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Pp]rocess.*/))
    pivot_on:
    - host
    window: 4h
  - name: Network logons from this user after enumeration
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:(3 OR 9 OR 10)
    pivot_on:
    - user
    window: 4h
  - name: Download cradle or encoded PowerShell script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/)
    pivot_on:
    - host
    window: 2h
