name: Service Registry Permissions Weakness Check
id: 95afc12e-3cbb-40c3-9340-84a032e596a3
version: 1
schema_version: "1.0"
date: "2021-12-30"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 95afc12e-3cbb-40c3-9340-84a032e596a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may execute their own malicious payloads by hijacking the Registry
  entries used by services. Adversaries may use flaws in the permissions for
  registry to redirect from the originally specified executable to one that they
  control, in order to launch their own code at Service start. Windows stores
  local service configuration information in the Registry under
  HKLM\SYSTEM\CurrentControlSet\Services. MITRE ATT&CK: T1574.011.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*get-acl*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*REGISTRY::HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*get-acl*';
  data_win_eventdata_scriptBlockText matches
  '*REGISTRY::HKLM\SYSTEM\CurrentControlSet\Services\*'.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.011/T1574.011.md#atomic-test-1---service-registry-permissions-weakness
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/get-acl?view=powershell-7.4
  - https://attack.mitre.org/techniques/T1574/011/

response:
  message: >
    Service Registry Permissions Weakness Check detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1574.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.011
  custom_tags:
    - service
    - registry
    - permissions
    - powershell
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Cc][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]::[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
    name: Potential Privilege Escalation via Service Permissions Weakness
    reason: Same T1574.011 technique via process creation (sc/cmd) - co-occurring view of the same service-permission recon/abuse
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: 'Exploitation step: attacker rewrites a service binPath after the Get-Acl check finds writable service config'
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: 'Direct follow-on: hijacking the Services registry key ImagePath that Get-Acl just showed to be writable'
  - id: 8470d755-0c13-45b3-bd63-387a373c10cf
    name: Reg exe Manipulating Windows Services Registry Keys
    reason: Follow-on edit of HKLM\SYSTEM\CurrentControlSet\Services values using reg.exe to redirect the service executable
  - id: 138d3531-8793-4f50-a2cd-f291b2863d78
    name: Suspicious Service Path Modification
    reason: 'Weaponization: service path changed to attacker payload (e.g. cmd/powershell) after permission weakness discovery'
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Hijacking an existing service for persistence/SYSTEM execution is the intended outcome of the weakness check
  - id: c484e533-ee16-4a93-b6ac-f0ea4868b2f1
    name: HackTool - SharpUp PrivEsc Tool Execution
    reason: Same hunt for modifiable service registry/config performed by automated privesc tooling, often precedes or replaces manual Get-Acl
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Alternative service-based privesc/persistence path an attacker takes when existing services are not modifiable
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service ImagePath/FailureCommand registry value written
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND (data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ OR data_win_eventdata_targetObject:/.*[Ff][Aa][Ii][Ll][Uu][Rr][Ee][Cc][Oo][Mm][Mm][Aa][Nn][Dd]/ OR data_win_eventdata_targetObject:/.*[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 1h
  - name: Service binPath reconfiguration or service restart via sc/reg/PowerShell
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Tt][Aa][Rr][Tt]|[Ss][Tt][Oo][Pp]).*/ AND data_win_eventdata_commandLine:/.*([Bb][Ii][Nn][Pp][Aa][Tt][Hh]|[Ss][Tt][Aa][Rr][Tt]).*/) OR (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*([Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]|[Aa][Dd][Dd]).*/))
    pivot_on:
    - host
    window: 1h
  - name: PowerShell service registry modification or privesc enumeration script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*([Aa][Dd][Dd]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ii][Nn][Ff][Oo]|[Gg][Ee][Tt]-[Mm][Oo][Dd][Ii][Ff][Ii][Aa][Bb][Ll][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Aa][Ll][Ll][Cc][Hh][Ee][Cc][Kk][Ss]|[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Pp][Oo][Ww][Ee][Rr][Uu][Pp]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Service process or payload launched from user-writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Local admin/account creation or privileged group add after service hijack
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*\/[Aa][Dd][Dd]).*/
    pivot_on:
    - host
    window: 4h
