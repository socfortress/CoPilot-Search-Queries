name: Powershell Remote Services Add TrustedHost
id: windows-powershell-remote-services-add-trustedhost-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of a PowerShell script that modifies the 'TrustedHosts' 
  configuration via EventCode 4104. It leverages PowerShell Script Block Logging 
  to identify commands targeting WSMan settings, specifically those altering or 
  concatenating trusted hosts. This activity is significant as it can indicate 
  attempts to manipulate remote connection settings, potentially allowing 
  unauthorized remote access. If confirmed malicious, this could enable attackers 
  to establish persistent remote connections, bypass security protocols, and gain 
  unauthorized access to sensitive systems and data.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*WSMan*TrustedHosts*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  User and network administrators may legitimately use this function to add trusted 
  hosts for remote management purposes. Filter based on user context and approved 
  administrative activities to reduce false positives.

references:
  - https://attack.mitre.org/techniques/T1021/006/
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.darkgate

response:
  message: >
    WSMan TrustedHosts modification detected on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1021.006
  risk_score: 58
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 58
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - Lateral Movement
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*WSMan.*TrustedHosts.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d4c618e-4716-11ec-951c-3e22fbd008af
    name: Remote Process Instantiation via WinRM and PowerShell Script Block
    reason: 'Follow-on: once TrustedHosts lets the WinRM client talk to the target, the actor drives remote process creation via script blocks.'
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: 'Follow-on: wsmprovhost.exe appears when the PS remoting session enabled by the TrustedHosts change is established.'
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Follow-on: shells and tools spawned under WinRM show what the attacker ran through the newly trusted remote channel.'
  - id: windows-winrm-spawning-process-001
    name: Windows WinRM Spawning a Process
    reason: 'Follow-on: child processes of the WinRM host confirm payload execution over the remoting channel.'
  - id: 9fe55ea2-4cd6-4491-8a54-dd6871651b51
    name: HackTool - Evil-WinRm Execution - PowerShell Module
    reason: 'Co-occurring: Evil-WinRM is the common offensive WinRM client, pairing with a TrustedHosts change when attacker-driven remoting begins.'
  - id: a5d85486-b89c-11eb-8267-acde48001122
    name: Allow Inbound Traffic In Firewall Rule
    reason: 'Co-occurring prep: opening inbound firewall rules for WinRM ports (5985/5986) is the other half of enabling remoting reachability.'
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: 'Co-occurring prep: netsh firewall rule creation allowing WinRM/RDP ports accompanies remoting setup on the same host.'
  - id: 13acf386-b8c6-4fe0-9a6e-c4756b974698
    name: Remote PowerShell Sessions Network Connections (WinRM)
    reason: 'Follow-on: network connections to 5985/5986 show the remoting session actually opened to the newly trusted host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WinRM/PS remoting setup commands (Enable-PSRemoting, winrm quickconfig, WSMan config)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ee]nable-[Pp][Ss][Rr]emoting.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Ww][Ss][Mm]an[Ii]nstance.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Ww][Ss][Mm]an[Qq]uick[Cc]onfig.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ss][Mm]an:.*[Ll]ocalhost.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]llow[Uu]nencrypted.*/)
    pivot_on:
    - host
    window: 2h
  - name: winrm.cmd / winrm.exe / netsh used to configure remoting or ports
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]inrm.*(set|quickconfig|qc).*/ OR (data_win_eventdata_commandLine:/.*[Nn]etsh.*/ AND data_win_eventdata_commandLine:/.*(5985|5986|[Ww]inrm).*/) OR data_win_eventdata_commandLine:/.*[Tt]rusted[Hh]osts.*/)
    pivot_on:
    - host
    window: 2h
  - name: Remote PowerShell cmdlets (Invoke-Command, New-PSSession, Enter-PSSession) in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound WinRM connections (TCP 5985/5986) from this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 4h
  - name: Network logons (type 3) on this host/user after TrustedHosts change
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on:
    - host
    - user
    window: 4h
