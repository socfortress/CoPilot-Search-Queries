name: Powershell Get LocalGroup Discovery with Script Block Logging
id: windows-powershell-get-localgroup-discovery-with-script-block-logging-001
version: 1
schema_version: "1.0"
date: "2026-02-25"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects the execution of the PowerShell cmdlet Get-LocalGroup using PowerShell 
  Script Block Logging (EventCode 4104). This method captures the full command sent 
  to PowerShell, providing detailed visibility into script execution. Monitoring this 
  activity is significant as it can indicate an attempt to enumerate local groups, 
  which may be a precursor to privilege escalation or lateral movement. If confirmed 
  malicious, an attacker could gain insights into group memberships, potentially 
  leading to unauthorized access or privilege abuse.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*get-localgroup*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-25 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-25 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  False positives may be present from legitimate administrative scripts that enumerate 
  local groups. Filter based on user context, source script path, and frequency of 
  execution to identify anomalies.

references:
  - https://attack.mitre.org/techniques/T1069/001/
  - https://www.splunk.com/en_us/blog/security/powershell-detections-threat-research-release-august-2021.html
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1069.001/T1069.001.md
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html

response:
  message: >
    Local group enumeration detected via PowerShell on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1069.001
  risk_score: 30
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects: []

tags:
  analytic_story:
    - Active Directory Discovery
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-LocalGroup.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2e891cbe-0426-11ec-9c9c-acde48001122
    name: Get-LocalUser with PowerShell Script Block
    reason: Sibling local account enumeration cmdlet; scripted recon typically lists local users and groups together to map who is privileged on this host.
  - id: c8a180d6-47a3-4345-a609-53f9c3d834fc
    name: Suspicious Reconnaissance Activity Using Get-LocalGroupMember Cmdlet
    reason: 'Next step after Get-LocalGroup: pull the members of Administrators to identify privileged local accounts.'
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Same group/account discovery done via net.exe localgroup/user/group, often run in the same recon burst as the PowerShell cmdlet.
  - id: b71adfcc-155b-11ec-9413-acde48001122
    name: PowerShell Get LocalGroup Discovery
    reason: Process-creation view of the same Get-LocalGroup command line; corroborates the script block with parent process and command line.
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: 'Escalation of the same intent from local to domain: PowerView hunting for Domain Admins/privileged groups after local group mapping.'
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: Attacker who enumerated local groups on a domain-joined host commonly pivots to domain group enumeration via PowerView.
  - id: e4c73d68-794b-468d-b4d0-dac1772bbae7
    name: Get-AdGroup with PowerShell Script Block
    reason: Domain-side group enumeration with the AD module, a natural continuation of local group discovery.
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: 'Likely payoff of group discovery: adding an account to local Administrators for privilege escalation or persistence.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Local account and group membership enumeration (net/whoami/cmdlets)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +(localgroup|user|group|accounts).*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii] +\/(groups|all|priv).*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ll][Oo][Cc][Aa][Ll]([Gg][Rr][Oo][Uu][Pp]|[Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]|[Uu][Ss][Ee][Rr]).*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ll][Oo][Cc][Aa][Ll]([Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]|[Uu][Ss][Ee][Rr]).*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Nn][Tt]:.*/))
    pivot_on:
    - host
    window: 2h
  - name: Domain/AD group and privileged-account discovery from this host
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-([Aa][Dd]|[Dd][Oo][Mm][Aa][Ii][Nn])([Gg][Rr][Oo][Uu][Pp]|[Uu][Ss][Ee][Rr]|[Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]).*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Ii][Nn][Dd]-[Ll][Oo][Cc][Aa][Ll][Aa][Dd][Mm][Ii][Nn][Aa][Cc][Cc][Ee][Ss][Ss].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +group +.*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/))
    pivot_on:
    - host
    window: 4h
  - name: 'Privilege change: account created or added to Administrators'
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]1? +(user .* \/[Aa][Dd][Dd]|localgroup +[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss] .* \/[Aa][Dd][Dd])|[Aa][Dd][Dd]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]|[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr]).*/) OR data_win_system_eventID:("4720" OR "4732" OR "4728" OR "4738")
    pivot_on:
    - host
    window: 4h
  - name: Credential access and token abuse following discovery
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Cc][Oo][Mm][Svv][Ss][Vv][Cc][Ss]|[Ll][Ss][Aa][Ss][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Rr][Ee][Gg] +[Ss][Aa][Vv][Ee] +[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]).*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Dd][Uu][Mm][Pp][Cc][Rr][Ee][Dd][Ss]|[Gg][Ee][Tt]-[Pp][Ss][Aa][Dd][Rr][Ee][Dd]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Remote execution or new network sessions after local recon
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ee][Nn][Tt][Ee][Rr]|[Nn][Ee][Ww])-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/)) OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "9"))
    pivot_on:
    - host
    - user
    window: 4h
