name: Manipulation of User Computer or Group Security Principals Across AD
id: b29a93fb-087c-4b5b-a84d-ee3309e69d08
version: 1
schema_version: "1.0"
date: "2021-12-28"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b29a93fb-087c-4b5b-a84d-ee3309e69d08
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may create a domain account to maintain access to victim systems.
  Domain accounts are those managed by Active Directory Domain Services where
  access and permissions are configured across systems and services that are
  part of that domain.. MITRE ATT&CK: T1136.002.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*System.DirectoryServices.AccountManagement*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches
  '*System.DirectoryServices.AccountManagement*'.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1136.002/T1136.002.md#atomic-test-3---create-a-new-domain-account-using-powershell
  - https://learn.microsoft.com/en-us/dotnet/api/system.directoryservices.accountmanagement?view=net-8.0
  - https://attack.mitre.org/techniques/T1136/002/

response:
  message: >
    Manipulation of User Computer or Group Security Principals Across AD
    detected on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1136.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.002
  custom_tags:
    - manipulation
    - computer
    - group
    - powershell
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Aa][Cc][Cc][Oo][Uu][Nn][Tt][Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Same account-creation goal via net.exe instead of the .NET AccountManagement API; attackers fall back to it when the PowerShell route is blocked or to create a second persistence account.
  - id: 3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb
    name: Windows Create Local Account
    reason: Security 4720 on the same host is the audit-log confirmation that the PrincipalContext/UserPrincipal script actually created an account.
  - id: 10fb649c-3600-4d37-b1e6-56ea90bb7e09
    name: User Added To Highly Privileged Group
    reason: 'Natural next step after creating a principal: add it to Domain/Enterprise Admins or similar to make the persistence account useful.'
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: AccountManagement GroupPrincipal.Members.Add often follows account creation to grant local admin rights on the host.
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: Security-log (4732) evidence of the group membership change that the script block performed.
  - id: 48a45d45-8112-416b-8a67-46e03a4b2107
    name: Remove Account From Domain Admin Group
    reason: 'Same 4104 telemetry family: scripted AD group membership manipulation, including cleanup or admin lockout by an intruder.'
  - id: f48a5557-be06-4b96-b8e8-be563e387620
    name: Windows ESX Admins Group Creation via PowerShell
    reason: Scripted creation of a privileged AD group (CVE-2024-37085 abuse) is a sibling use of directory principal manipulation from PowerShell.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: AD reconnaissance via PowerShell typically precedes the creation or modification of directory principals.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Account creation or group membership change events
    query: data_win_system_eventID:("4720" OR "4722" OR "4724" OR "4728" OR "4732" OR "4756" OR "4738")
    pivot_on:
    - host
    - user
    window: 2h
  - name: net.exe / dsadd / New-ADUser account and group commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]et1?(\.[Ee][Xx][Ee])? +(user|localgroup|group) .*(\/add|\/domain).*/ OR data_win_eventdata_commandLine:/.*([Nn]ew-[Aa][Dd][Uu][Ss][Ee][Rr]|[Aa]dd-[Aa][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]|[Dd][Ss][Aa][Dd][Dd]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Other script blocks touching AD or account APIs
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*New-ADUser* OR data_win_eventdata_scriptBlockText:*Add-ADGroupMember* OR data_win_eventdata_scriptBlockText:*DirectorySearcher* OR data_win_eventdata_scriptBlockText:*PrincipalContext* OR data_win_eventdata_scriptBlockText:*ADSI* OR data_win_eventdata_scriptBlockText:*Set-ADAccountPassword* OR data_win_eventdata_scriptBlockText:*Enable-ADAccount*)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Network logon of newly created or privileged account
    query: data_win_system_eventID:("4624" OR "4672") AND NOT data_win_eventdata_targetUserName:*$
    pivot_on:
    - host
    - user
    window: 6h
  - name: Outbound LDAP/SMB/RPC connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_destinationPort:("389" OR "636" OR "445" OR "135" OR "3268")
    pivot_on:
    - host
    window: 2h
