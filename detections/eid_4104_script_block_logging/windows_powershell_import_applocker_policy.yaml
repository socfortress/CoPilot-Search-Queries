name: Windows Powershell Import Applocker Policy
id: 102af98d-0ca3-4aa4-98d6-7ab2b98b955a
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects use of PowerShell to import and apply AppLocker policies via
  Import-Module Applocker combined with Set-AppLockerPolicy and -XMLPolicy
  parameter. Malware such as Azorult uses this technique to enforce restrictive
  AppLocker policies that disable antivirus products and security tools,
  bypassing security controls and enabling further system compromise. This
  specific combination of cmdlets is rarely used legitimately in enterprise
  environments.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Import-Module Applocker*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Set-AppLockerPolicy*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-XMLPolicy*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators may legitimately use these cmdlets to deploy or update
  AppLocker policies across endpoints. Review the XML policy content and
  user context to determine if the activity is authorized.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1562/001/
  - https://app.any.run/tasks/a6f2ffe2-e6e2-4396-ae2e-04ea0143f2d8/

response:
  message: >
    PowerShell AppLocker policy import detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001, T1562.001
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
    - field: data_win_eventdata_user
      type: user
      score: 49
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Azorult
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1562.001
  custom_tags:
    - applocker
    - import_policy
    - defense_evasion
    - azorult
    - antivirus_bypass
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Import-Module Applocker.*/ AND data_win_eventdata_scriptBlockText:/.*Set-AppLockerPolicy.*/ AND data_win_eventdata_scriptBlockText:/.*-XMLPolicy.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 467ed9d9-8035-470e-ad5e-ae5189283033
    name: Windows Impair Defense Add Xml Applocker Rules
    reason: Same AppLocker XML-policy push seen from process-creation telemetry; confirms the Set-AppLockerPolicy command line that the script block shows.
  - id: b4c8da4a-1c12-46b0-8a2b-0a8521d03442
    name: Restricted Software Access By SRP
    reason: A malicious AppLocker/SRP policy that denies AV and security tools surfaces as software-restriction blocks of those binaries right after the import.
  - id: 1d2de8a6-4803-4fde-b85b-f58f3aa7a705
    name: Potentially Suspicious WDAC Policy File Creation
    reason: 'Sibling application-control tampering: attacker-staged policy files (WDAC) used to block EDR drivers and tools alongside the AppLocker XML.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Attacker blinding Defender with AppLocker deny rules typically also adds Defender exclusions via Add-MpPreference in the same session.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Set-MpPreference real-time/behaviour monitoring disablement is the usual companion defense-evasion step to the policy import.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender-side confirmation of exclusions added around the time AppLocker was used to cripple security tooling.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: 'Launcher precursor: the PowerShell session running Import-Module Applocker is often started with -ExecutionPolicy Bypass by the dropper.'
  - id: windows-powershell-script-block-with-url-chain-001
    name: PowerShell Script Block With URL Chain
    reason: Azorult-style loaders download the stager in PowerShell before or after neutralising defenses; same script-block telemetry source.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender tampering script blocks (MpPreference, exclusions, realtime off)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xclusion[Pp]ath.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other AppLocker/SRP/WDAC policy manipulation on the host
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]pp[Ll]ocker.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Cc][Ii][Pp]olicy.*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]pp[Ll]ocker.*/ OR data_win_eventdata_commandLine:/.*[Ss]afer[Cc]odeidentifiers.*/ OR data_win_eventdata_commandLine:/.*[Ss]ip[Oo]licy.*/))
    pivot_on:
    - host
    window: 2h
  - name: Registry changes to AppLocker/SRP/Defender policy keys
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ss]rp[Vv]2.*/ OR data_win_eventdata_targetObject:/.*[Ss]afer.*[Cc]ode[Ii]dentifiers.*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies.*[Mm]icrosoft.*[Ww]indows [Dd]efender.*/ OR data_win_eventdata_targetObject:/.*[Dd]isable[Aa]nti[Ss]pyware.*/)
    pivot_on:
    - host
    window: 2h
  - name: Security-tool stop or kill attempts via sc/net/taskkill
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]c(\.exe)? +(stop|config|delete).*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? +stop.*/ OR data_win_eventdata_commandLine:/.*[Tt]askkill.*/ OR data_win_eventdata_commandLine:/.*[Ss]top-[Ss]ervice.*/)
    pivot_on:
    - host
    window: 1h
  - name: Stager download and execution by PowerShell on host (post-defense-evasion)
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload(String|File).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/)) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on:
    - host
    window: 1h
