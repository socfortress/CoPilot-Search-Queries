name: PowerShell Windows Defender Exclusion Commands
id: 907ac95c-4dd9-11ec-ba2c-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of PowerShell commands to add or set Windows 
  Defender exclusions. It leverages EventCode 4104 to identify suspicious `Add-MpPreference` 
  or `Set-MpPreference` commands with exclusion parameters. This activity is significant 
  because adversaries often use it to bypass Windows Defender, allowing malicious code to 
  execute without detection. If confirmed malicious, this behavior could enable attackers 
  to evade antivirus defenses, maintain persistence, and execute further malicious 
  activities undetected.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Add-MpPreference*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Set-MpPreference*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-exclusion*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this search you need to be ingesting information on 
  processes that include the name of the process responsible for the changes from 
  your endpoints. The Wazuh agent ossec.conf should include the Microsoft-Windows-PowerShell/Operational 
  event channel. This detection monitors for Add-MpPreference or Set-MpPreference 
  cmdlets with exclusion parameters. Validate that data_win_eventdata_scriptBlockText 
  field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or users may choose to use this Windows feature for legitimate purposes. 
  Filter based on user context and whether the action was expected and authorized within 
  your organization.

references:
  - https://tccontre.blogspot.com/2020/01/remcos-rat-evading-windows-defender-av.html
  - https://app.any.run/tasks/cf1245de-06a7-4366-8209-8e3006f2bfe5/
  - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/
  - https://attack.mitre.org/techniques/T1562/001/

response:
  message: >
    Windows Defender exclusion command detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates antivirus evasion/defense impairment attempt. 
    MITRE ATT&CK: T1562.001
  risk_score: 80
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
    - field: data_win_eventdata_user
      type: user
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - CISA AA22-320A
    - AgentTesla
    - Remcos
    - Windows Defense Evasion Tactics
    - Data Destruction
    - WhisperGate
    - Warzone RAT
    - NetSupport RMM Tool Abuse
    - BlankGrabber Stealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - add_mppreference
    - set_mppreference
    - windows_defender
    - exclusion
    - defense_evasion
    - antivirus_bypass
    - powershell
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]et-[Mm]p[Pp]reference.*/) AND data_win_eventdata_scriptBlockText:/.*[Ee]xclusion.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Same exclusion command seen at process creation (Sysmon 1) instead of script block; confirms the cmdlet actually executed and gives parent process
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender's own operational log (5007) confirms the exclusion was applied, turning an attempt into verified AV blind spot
  - id: c6fb44c6-71f5-49e6-9462-1425d328aee3
    name: Powershell Base64 Encoded MpPreference Cmdlet
    reason: Same Add/Set-MpPreference tampering delivered via -EncodedCommand, common loader trick to hide the exclusion path
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Exclusions are typically set alongside other Defender setting changes; this shows the wider config tampering
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Escalation of the same defense-evasion step: after excluding paths attackers often turn real-time protection off entirely'
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Companion Defender-disable commands (DisableRealtimeMonitoring etc.) issued in the same tampering burst
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Staged PowerShell loaders that add the exclusion first usually run encoded payloads right after
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Persistence for the payload now protected by the exclusion is commonly a Run key write
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender tampering commands in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]isable[Ii][Oo][Aa][Vv][Pp]rotection.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]isable[Bb]ehavior[Mm]onitoring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]isable[Ss]cript[Ss]canning.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ubmit[Ss]amples[Cc]onsent.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]APS[Rr]eporting.*/)
    pivot_on:
    - host
    window: 2h
  - name: Defender exclusion or protection registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*/ AND (data_win_eventdata_targetObject:/.*[Ee]xclusions.*/ OR data_win_eventdata_targetObject:/.*[Dd]isable[Aa]nti[Ss]pyware.*/ OR data_win_eventdata_targetObject:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_targetObject:/.*[Tt]amper[Pp]rotection.*/)
    pivot_on:
    - host
    window: 2h
  - name: Download cradles and encoded loaders in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ee]xpression.*/)
    pivot_on:
    - host
    window: 2h
  - name: Executables or scripts dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\(Users\.*\(AppData|Downloads|Desktop)|ProgramData|Windows\Temp)\.*\.(exe|dll|ps1|bat|vbs|js|scr)/
    pivot_on:
    - host
    window: 2h
  - name: Persistence created via schtasks or Run keys
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss]chtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*CurrentVersion\Run.*/)
    pivot_on:
    - host
    window: 4h
