name: Get-DomainComputer with PowerShell Script Block
id: f64da023-b988-4775-8d57-38e512beb56e
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainComputer` cmdlet using 
  PowerShell Script Block Logging (EventID 4104). This cmdlet is part of PowerView, a 
  tool often used for enumerating domain computers within Windows environments. The 
  detection leverages script block text analysis to identify this specific command. 
  Monitoring this activity is crucial as it can indicate an adversary's attempt to gather 
  information about domain computers, which is a common step in Active Directory 
  reconnaissance. If confirmed malicious, this activity could lead to further network 
  enumeration and potential lateral movement within the domain.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainComputer*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-DomainComputer cmdlet from PowerView, which is used 
  for domain computer enumeration. Validate that data_win_eventdata_scriptBlockText 
  field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use PowerView for legitimate troubleshooting and 
  network discovery purposes. Filter based on user context and whether the action was 
  expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainComputer/
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet

response:
  message: >
    Get-DomainComputer execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain computer enumeration/network discovery/reconnaissance activity for lateral movement planning. 
    MITRE ATT&CK: T1018
  risk_score: 52
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 52
    - field: data_win_eventdata_user
      type: user
      score: 52
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Remote System Discovery
    - Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - get_domaincomputer
    - powerview
    - computer_enumeration
    - domain_computers
    - network_discovery
    - lateral_movement
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainComputer.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-DomainComputer is a PowerView cmdlet; any other PowerView cmdlet in script blocks on the same host confirms the toolkit was loaded, not a one-off admin command
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Computer enumeration is typically paired with user enumeration in the same PowerView session to pick targets and accounts
  - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
    name: Get-DomainGroup with PowerShell Script Block
    reason: 'Next recon step: find privileged groups (Domain Admins) to map who can log on to the enumerated computers'
  - id: 676b600a-a94d-4951-b346-11329431e6c1
    name: Get-DomainController with PowerShell Script Block
    reason: Co-occurring PowerView step locating domain controllers, the high-value targets among the enumerated computers
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: Domain-wide PowerView recon often extends to trust mapping to plan cross-domain lateral movement
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Follow-on privileged-group discovery that tells the attacker which hosts and accounts to hit
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: PowerView AD recon commonly progresses to AS-REP roastable account hunting for credential access
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: 'Likely lateral-movement follow-on: Invoke-Command run against the computers just enumerated'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView/AD recon cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain([Uu]ser|[Gg]roup|[Cc]ontroller|[Tt]rust|[Pp]olicy|[Gg][Pp][Oo]).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocalAdminAccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Dd]omainShare.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et(Session|LoggedOn|LocalGroup|Share).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Uu]ser[Hh]unter.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ss]hare[Ff]inder.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/)
    pivot_on:
    - host
    - user
    window: 1h
  - name: 'PowerView loading: download cradles, AMSI bypass, PowerSploit modules'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Pp]ower[Vv]iew.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]ower[Ss]ploit.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]mport-[Mm]odule.*/)
    pivot_on:
    - host
    window: 1h
  - name: Kerberoasting / SPN and credential-access script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ervicePrincipalName.*/ OR data_win_eventdata_scriptBlockText:/.*[Kk]erberos[Rr]equestor[Ss]ecurity[Tt]oken.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Remote execution against enumerated computers (Invoke-Command, PSSession, WMI)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]im[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_Process.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: PowerShell network connections to LDAP, SMB and WinRM
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 1h
