name: Zip A Folder With PowerShell For Staging In Temp - PowerShell Script
id: b7a3c9a3-09ea-4934-8864-6a32cacd98d9
version: 1
schema_version: "1.0"
date: "2023-12-18"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b7a3c9a3-09ea-4934-8864-6a32cacd98d9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell scripts that make use of the "Compress-Archive" Cmdlet in
  order to compress folders and files where the output is stored in a
  potentially suspicious location that is used often by malware for
  exfiltration. An adversary might compress data (e.g., sensitive documents)
  that is collected prior to exfiltration in order to make it portable and
  minimize the amount of data sent over the network. MITRE ATT&CK: T1074.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Compress-Archive -Path*-DestinationPath $env:TEMP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Compress-Archive -Path*-DestinationPath*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Compress-Archive -Path*-DestinationPath*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Compress-Archive
  -Path*-DestinationPath $env:TEMP*'; data_win_eventdata_scriptBlockText matches
  '*Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\*';
  data_win_eventdata_scriptBlockText matches '*Compress-Archive
  -Path*-DestinationPath*:\Windows\Temp\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1074.001/T1074.001.md
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1074/001/

response:
  message: >
    Zip A Folder With PowerShell For Staging In Temp - PowerShell Script
    detected on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1074.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1074.001
  custom_tags:
    - folder
    - powershell
    - staging
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh] \$[Ee][Nn][Vv]:[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Same Compress-Archive-to-Temp staging seen as a powershell.exe process command line; confirms the script block actually executed.
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: 'Precursor: scripted file gathering that feeds the folder later zipped for staging.'
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: 'Precursor: discovery of sensitive files that determines which folders get compressed.'
  - id: 2837e152-93c8-43d2-85ba-c3cd3c2ae614
    name: Powershell Local Email Collection
    reason: Co-occurring collection of mailbox data (PST/OST) that is commonly archived before exfiltration.
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: Broader Compress-Archive collection behaviour in the same script session; overlapping staging evidence.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Alternate/follow-on staging: attacker re-packs the data with a password-protected 7z archive to evade inspection.'
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: 'Follow-on: staged archive in Temp is pushed to cloud storage with rclone.'
  - id: 59e8bf41-7472-412a-90d3-00f3afa452e9
    name: Windows Exfiltration Over C2 Via Powershell UploadString
    reason: 'Follow-on: the staged zip is uploaded over HTTP from PowerShell, completing staging to exfiltration.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive files created in Temp directories
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp]\\.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]|[Cc][Aa][Bb])/
    pivot_on:
    - host
    window: 2h
  - name: Exfil upload tooling or web uploads from PowerShell/cmd
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|[Uu][Pp][Ll][Oo][Aa][Dd]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Rclone, MEGA, WinSCP, curl or 7z/rar archiver process launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Cc][Uu][Rr][Ll]|[Pp][Ss][Cc][Pp]|7[Zz]|7[Zz][Aa]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Outbound DNS to file-sharing and paste/cloud storage domains
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:(*mega.nz* OR *mega.io* OR *anonfiles* OR *transfer.sh* OR *file.io* OR *pastebin.com* OR *dropbox* OR *gofile.io* OR *temp.sh* OR *wetransfer* OR *discord*)
    pivot_on:
    - host
    window: 4h
  - name: Sensitive file enumeration and bulk collection scripting
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm]|[Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm]).*(\.[Pp][Ss][Tt]|\.[Kk][Ee][Yy][Dd][Bb]|\.[Pp][Ff][Xx]|\.[Pp][Ee][Mm]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]).*/
    pivot_on:
    - host
    window: 2h
