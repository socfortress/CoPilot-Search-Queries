name: Get-CurrentUser with PowerShell Script Block
id: 80879283-c30f-44f7-8471-d1381f6d437a
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `GetCurrent` method from the 
  WindowsIdentity .NET class using PowerShell Script Block Logging (EventID 4104). 
  This method identifies the current Windows user. The detection leverages PowerShell 
  script block logs to identify when this method is called. This activity is significant 
  because adversaries and Red Teams may use it to gain situational awareness and perform 
  Active Directory discovery on compromised endpoints. If confirmed malicious, this could 
  allow attackers to map out user accounts and potentially escalate privileges or move 
  laterally within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*System.Security.Principal.WindowsIdentity*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*GetCurrent*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the System.Security.Principal.WindowsIdentity::GetCurrent() 
  .NET method call. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell method for legitimate 
  troubleshooting and user discovery purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1033/
  - https://docs.microsoft.com/en-us/dotnet/api/system.security.principal.windowsidentity.getcurrent?view=net-6.0
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet

response:
  message: >
    Get-CurrentUser (WindowsIdentity::GetCurrent) execution detected on $agent_name$ 
    by user $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates current user enumeration/situational awareness activity. 
    MITRE ATT&CK: T1033
  risk_score: 30
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 30
    - field: data_win_eventdata_user
      type: user
      score: 30
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - System Owner Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - getcurrent_user
    - windowsidentity
    - current_user_discovery
    - system_owner_discovery
    - situational_awareness
    - reconnaissance
    - powershell
    - net_method
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*System.Security.Principal.WindowsIdentity.*/ AND data_win_eventdata_scriptBlockText:/.*GetCurrent.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: WindowsIdentity::GetCurrent is a standard first step in PowerView/AD recon toolkits; PowerView cmdlets in the same session confirm the user check was tooling-driven AD discovery
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: 'Natural next step after learning the current identity: enumerating domain users from the same PowerShell session'
  - id: 676b600a-a94d-4951-b346-11329431e6c1
    name: Get-DomainController with PowerShell Script Block
    reason: 'Follow-on AD mapping once the attacker knows who they are: locating domain controllers to target'
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: Same script-block recon surface; trust enumeration extends identity awareness to forest/domain lateral paths
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: After identifying the current user, attackers check privileged group membership to judge escalation needs
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Same system-owner discovery goal via process creation (whoami /all); co-occurs when the operator mixes native binaries and .NET calls
  - id: 7eb9c3d5-c98c-4088-acc5-8240bad15379
    name: GetCurrent User with PowerShell
    reason: Same WindowsIdentity.GetCurrent behaviour seen at process-creation level (command line), corroborating the script block with the launching process
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: GetCurrent often sits in post-exploitation scripts that load .NET assemblies in memory; reflection loading marks an implant rather than admin troubleshooting
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: A download cradle shortly before the identity check suggests a staged remote script performing the situational awareness
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WindowsIdentity / privilege checks and token manipulation in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Ss][Ii][Nn][Rr][Oo][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Dd][Ee][Bb][Uu][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Uu][Pp][Ll][Ii][Cc][Aa][Tt][Ee][Tt][Oo][Kk][Ee][Nn].*/)
    pivot_on:
    - host
    window: 1h
  - name: AD / domain enumeration script blocks (PowerView, ADSI, AD module)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download cradles, reflection loading and AMSI tampering in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 1h
  - name: whoami and net/nltest discovery processes launched from PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]|\\[Nn][Ee][Tt]1?|\\[Nn][Ll][Tt][Ee][Ss][Tt]|\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|\\[Kk][Ll][Ii][Ss][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections and DNS from PowerShell
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_initiated:"true") OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
