name: Certificate Exported Via PowerShell - ScriptBlock
id: aa7a3fce-bef5-4311-9cc1-5f04bb8c308c
version: 1
schema_version: "1.0"
date: "2023-05-18"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa7a3fce-bef5-4311-9cc1-5f04bb8c308c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects calls to cmdlets inside of PowerShell scripts that are used to export
  certificates from the local certificate store. Threat actors were seen abusing
  this to steal private keys from compromised machines. MITRE ATT&CK: T1552.004.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Export-PfxCertificate*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Export-Certificate*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_scriptBlockText"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*CmdletsToExport = @(*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Export-PfxCertificate*';
  data_win_eventdata_scriptBlockText matches '*Export-Certificate*';
  data_win_eventdata_scriptBlockText matches '*CmdletsToExport = @(*'.

known_false_positives: >
  Legitimate certificate exports by administrators. Additional filters might be
  required. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://us-cert.cisa.gov/ncas/analysis-reports/ar21-112a
  - https://learn.microsoft.com/en-us/powershell/module/pki/export-pfxcertificate?view=windowsserver2022-ps
  - https://www.splunk.com/en_us/blog/security/breaking-the-chain-defending-against-certificate-services-abuse.html
  - https://attack.mitre.org/techniques/T1552/004/

response:
  message: >
    Certificate Exported Via PowerShell - ScriptBlock detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1552.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.004
  custom_tags:
    - certificate
    - exported
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Pp][Ff][Xx][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/) AND _exists_:data_win_eventdata_scriptBlockText AND NOT (data_win_eventdata_scriptBlockText:/.*[Cc][Mm][Dd][Ll][Ee][Tt][Ss][Tt][Oo][Ee][Xx][Pp][Oo][Rr][Tt] = \@\(.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Same Export-PfxCertificate/Export-Certificate activity seen at process-creation level; confirms the script-block hit came from a real powershell.exe command line and shows the parent and user.
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Attackers who fail or are blocked exporting a key via PowerShell commonly retry with certutil -exportPFX; co-occurring alternative path to the same private-key theft.
  - id: f533ca6c-9440-4686-80cb-7f294c07812a
    name: Detect Certify With PowerShell Script Block Logging
    reason: 'Certify/ADCS abuse tooling often precedes or follows cert export: template enumeration and enrollment of certs, then export of the resulting PFX for impersonation.'
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: SharpDPAPI extracts DPAPI-protected machine/user certificate private keys; a parallel route to the same stolen-key objective on the same host.
  - id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
    name: Private Keys Reconnaissance Via CommandLine Tools
    reason: Searching the disk for .pfx/.key/.pem files is the hunt for key material that precedes or accompanies exporting the store's certificates.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: Mimikatz crypto::certificates /export and non-exportable key patching is a common way to dump keys; same script-block surface and credential-theft intent.
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: Exported PFX files are typically zipped with other loot before leaving the host; follow-on staging.
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: Exfiltration of the exported .pfx via Invoke-RestMethod from the same PowerShell session is the likely final step.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certificate store enumeration and key export in PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Ee][Rr][Tt]:.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]hild[Ii]tem.*[Cc]ert.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xportable.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xport[Pp]fx.*/ OR data_win_eventdata_scriptBlockText:/.*X509.*[Ss]tore.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xport[Pp]kcs12.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]onvertTo-[Ss]ecure[Ss]tring.*/)
    pivot_on:
    - host
    window: 2h
  - name: Certutil or Mimikatz certificate/key export processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee]xport[Pp][Ff][Xx].*/ OR data_win_eventdata_commandLine:/.*crypto::certificates.*/ OR data_win_eventdata_commandLine:/.*crypto::capi.*/ OR data_win_eventdata_commandLine:/.*crypto::cng.*/ OR data_win_eventdata_commandLine:/.*[Ss]harp[Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Cc]ertify.*/ OR data_win_eventdata_commandLine:/.*[Rr]ubeus.*/)
    pivot_on:
    - host
    window: 2h
  - name: Certificate/key files created on disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Pp]12/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ee][Mm]/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ee][Yy]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Ee][Rr]/)
    pivot_on:
    - host
    window: 2h
  - name: Archiving and outbound transfer of staged files from PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*[Pp][Oo][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]o[Bb]ase64[Ss]tring.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from PowerShell after export
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]owershell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
