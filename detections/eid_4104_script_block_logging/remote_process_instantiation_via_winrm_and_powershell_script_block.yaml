name: Remote Process Instantiation via WinRM and PowerShell Script Block
id: 7d4c618e-4716-11ec-951c-3e22fbd008af
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of PowerShell commands that use the 
  `Invoke-Command` cmdlet to start a process on a remote endpoint via the WinRM 
  protocol. It leverages PowerShell Script Block Logging (EventCode=4104) to identify 
  such activities. This behavior is significant as it may indicate lateral movement 
  or remote code execution attempts by adversaries. If confirmed malicious, this 
  activity could allow attackers to execute arbitrary code on remote systems, 
  potentially leading to further compromise and persistence within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-Command*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-ComputerName*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for Invoke-Command cmdlet with -ComputerName parameter for WinRM-based lateral 
  movement. Validate that data_win_eventdata_scriptBlockText field is being populated 
  in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators may leverage WinRM and `Invoke-Command` to start a process on remote 
  systems for system administration or automation use cases. This activity is usually 
  limited to a small set of hosts or users. In certain environments, tuning may not 
  be possible. Validate that such activity is authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1021/006/
  - https://pentestlab.blog/2018/05/15/lateral-movement-winrm/
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html

response:
  message: >
    WinRM remote process instantiation detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates potential lateral movement via Invoke-Command and WinRM. 
    MITRE ATT&CK: T1021.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.006
  custom_tags:
    - winrm_lateral_movement
    - invoke_command
    - remote_code_execution
    - powershell
    - scriptblock
    - computername
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Invoke-Command.*/ AND data_win_eventdata_scriptBlockText:/.*-ComputerName.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Co-occurring 4104 view of the same Invoke-Command remote execution; confirms the operator is fanning out to multiple targets from this source host.
  - id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
    name: Interactive Session on Remote Endpoint with PowerShell
    reason: Alternate PSRemoting path (Enter-PSSession/New-PSSession) the operator often switches to after non-interactive Invoke-Command succeeds.
  - id: windows-powershell-remote-services-add-trustedhost-001
    name: Powershell Remote Services Add TrustedHost
    reason: 'Precursor: attackers add targets to WinRM TrustedHosts on the source before Invoke-Command to non-domain or IP-addressed hosts.'
  - id: c539afac-c12a-46ed-b1bd-5a5567c9f045
    name: Potential Remote PowerShell Session Initiated
    reason: Sysmon EID 3 outbound connection to TCP 5985/5986 from the source host is the network-side proof the Invoke-Command actually reached a target.
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: 'Destination-side effect: wsmprovhost.exe spawns on the target when this source-side Invoke-Command lands; correlate across hosts via time and user.'
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Destination-side payload stage: what the remote command actually launched under WinRM (cmd, powershell, rundll32 etc.).'
  - id: aa35a627-33fb-4d04-a165-d33b4afca3e8
    name: Remote LSASS Process Access Through Windows Remote Management
    reason: 'Likely follow-on objective: credential theft from LSASS via WinRM session to pivot further.'
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: Offensive WinRM tooling used for the same lateral movement; its presence turns an admin-looking Invoke-Command into hostile activity.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound WinRM connections (5985/5986) from this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 1h
  - name: PSRemoting session setup and trusted-host changes in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]rusted[Hh]osts.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Cc]im[Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Oo]bject.*[Pp][Ss][Cc]redential.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]redential.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Remote payload staging and execution in script blocks (Invoke-Command -ScriptBlock content)
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*/ AND (data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Pp]rocess.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]ncoded[Cc]ommand.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]opy-[Ii]tem.*/ OR data_win_eventdata_scriptBlockText:/.*\\.*\$.*/)
    pivot_on:
    - host
    window: 1h
  - name: Network logons (type 3) and explicit-credential logons by this user
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 2h
  - name: Credential access and LSASS access following remote execution
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]omsvcs.*[Mm]ini[Dd]ump.*/ OR data_win_eventdata_commandLine:/.*[Pp]rocdump.*[Ll]sass.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg.*[Ss]ave.*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss]ekurlsa.*/))
    pivot_on:
    - host
    window: 2h
