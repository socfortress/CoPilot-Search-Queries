name: Powershell MsXml COM Object
id: 78aa1347-1517-4454-9982-b338d6df8343
version: 1
schema_version: "1.0"
date: "2022-05-19"
author: frack113, MatilJ
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 78aa1347-1517-4454-9982-b338d6df8343
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may abuse PowerShell commands and scripts for execution.
  PowerShell is a powerful interactive command-line interface and scripting
  environment included in the Windows operating system. (Citation: TechNet
  PowerShell) Adversaries can use PowerShell to perform a number of actions,
  including discovery of information and execution of code. MITRE ATT&CK:
  T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-Object*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-ComObject*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*MsXml2.*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*XmlHttp*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-Object*';
  data_win_eventdata_scriptBlockText matches '*-ComObject*';
  data_win_eventdata_scriptBlockText matches '*MsXml2.*', among other
  conditions.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.001/T1059.001.md#atomic-test-7---powershell-msxml-com-object---with-prompt
  - https://learn.microsoft.com/en-us/previous-versions/windows/desktop/ms766431(v=vs.85)
  - https://www.trendmicro.com/en_id/research/22/e/uncovering-a-kingminer-botnet-attack-using-trend-micro-managed-x.html
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Powershell MsXml COM Object detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - msxml
    - object
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*-[Cc][Oo][Mm][Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Xx][Mm][Ll]2\..*/ AND data_win_eventdata_scriptBlockText:/.*[Xx][Mm][Ll][Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: 'Same technique family: COM-object (MsXml2/WinHttp/InternetExplorer) HTTP download cradle in script block; co-fires when the XmlHttp fetch is the payload stager.'
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The XMLHTTP COM object is an alternative to Net.WebClient; the same script block often also uses DownloadString/Invoke-WebRequest as fallback download paths.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: 'Process-creation view of the same stager: powershell.exe command line that downloads and executes remote content, the launching side of the MsXml2 fetch.'
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: Downloaded XmlHttp responseText is typically piped into IEX/Invoke-Expression, often obfuscated; this is the execute step of the cradle.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Droppers using MsXml2 cradles (KingMiner style) frequently patch AMSI first so the fetched payload is not scanned.
  - id: windows-powershell-fileless-script-contains-base64-encoded-content-001
    name: Powershell Fileless Script Contains Base64 Encoded Content
    reason: Staged content retrieved over XmlHttp is commonly base64-encoded and decoded in memory (fileless follow-on).
  - id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
    name: Powershell Create Scheduled Task
    reason: Botnet droppers (KingMiner) persist via scheduled task after the first download stage; typical next action on the same host.
  - id: 8d85cf08-bf97-4260-ba49-986a2a65129c
    name: Suspicious PowerShell In Registry Run Keys
    reason: 'Alternative persistence for the PowerShell stager: a Run key re-launching the download cradle at logon.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other download cradles in script blocks (WebClient, IWR, BITS, WinHttp)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload([Ss]tring|[Ff]ile).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in[Hh]ttp[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nternet[Ee]xplorer\.[Aa]pplication.*/)
    pivot_on:
    - host
    window: 1h
  - name: Execution of fetched content (IEX / encoded / in-memory assembly load)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Ii][Ee][Xx]|[Ii]nvoke-[Ee]xpression).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell network connections to external hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
  - name: Files dropped by PowerShell (scripts, executables, miners)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Tt][Mm][Pp])/
    pivot_on:
    - host
    window: 2h
  - name: Persistence after PowerShell stager (scheduled task / schtasks / Run key)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/)
    pivot_on:
    - host
    window: 4h
