name: Registry-Free Process Scope COR_PROFILER
id: 23590215-4702-4a70-8805-8dc9e58314a2
version: 1
schema_version: "1.0"
date: "2021-12-30"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 23590215-4702-4a70-8805-8dc9e58314a2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may leverage the COR_PROFILER environment variable to hijack the
  execution flow of programs that load the .NET CLR. The COR_PROFILER is a .NET
  Framework feature which allows developers to specify an unmanaged (or external
  of .NET) profiling DLL to be loaded into each .NET process that loads the
  Common Language Runtime (CLR). These profiliers are designed to monitor,
  troubleshoot, and debug managed code executed by the .NET CLR. (Citation:
  Microsoft Profiling Mar 2017) (Citation: Microsoft COR_PROFILER Feb 2013).
  MITRE ATT&CK: T1574.012.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*$env:COR_ENABLE_PROFILING*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*$env:COR_PROFILER*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*$env:COR_PROFILER_PATH*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*$env:COR_ENABLE_PROFILING*';
  data_win_eventdata_scriptBlockText matches '*$env:COR_PROFILER*';
  data_win_eventdata_scriptBlockText matches '*$env:COR_PROFILER_PATH*'.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.012/T1574.012.md#atomic-test-3---registry-free-process-scope-cor_profiler
  - https://attack.mitre.org/techniques/T1574/012/

response:
  message: >
    Registry-Free Process Scope COR_PROFILER detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1574.012
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.012
  custom_tags:
    - registry
    - scope
    - profiler
    - powershell
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\$[Ee][Nn][Vv]:[Cc][Oo][Rr]_[Ee][Nn][Aa][Bb][Ll][Ee]_[Pp][Rr][Oo][Ff][Ii][Ll][Ii][Nn][Gg].*/ AND data_win_eventdata_scriptBlockText:/.*\$[Ee][Nn][Vv]:[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*\$[Ee][Nn][Vv]:[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr]_[Pp][Aa][Tt][Hh].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ad89044a-8f49-4673-9a55-cbd88a1b374f
    name: Enabling COR Profiler Environment Variables
    reason: Persistent registry-based variant of the same COR_PROFILER hijack (HKCU/HKLM Environment); an attacker who fails or finishes the process-scoped test often sets it machine/user-wide.
  - id: c3198a27-23a0-4c2c-af19-e5328d49680e
    name: Blue Mockingbird
    reason: Blue Mockingbird campaign uses wmic with COR_PROFILER to load a profiler DLL for persistence/execution, the same CLR-hijack primitive.
  - id: 92b0b372-a939-44ed-a11b-5136cf680e27
    name: Blue Mockingbird - Registry
    reason: Registry-side footprint of the same campaign tradecraft (COR_PROFILER / COM hijack persistence) that follows or accompanies in-memory profiler staging.
  - id: ea61e291-af05-4716-932a-67faddb6ae6f
    name: PowerShell COM Hijacking InProcServer32 Modification
    reason: Sibling .NET/COM in-process hijack done from the same PowerShell script-block telemetry; attackers chain profiler and COM hijacks for persistence.
  - id: bf4fc428-dcc3-4bbd-99fe-2422aeee2544
    name: ETW Logging Disabled In .NET Processes - Sysmon Registry
    reason: Profiler-loaded DLLs commonly blind .NET ETW telemetry afterwards; registry ETWEnabled=0 is a defence-evasion follow-on.
  - id: 41421f44-58f9-455d-838a-c398859841d4
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    reason: Command-line form of disabling .NET ETW, a follow-on step once code runs inside every CLR process.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: Same script-block log source; evasion by disabling ETW traces frequently accompanies profiler injection.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: A profiler DLL in the CLR gives the attacker a stage to neutralise AMSI; reflection-based AMSI bypass is a typical companion in the same PowerShell session.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: COR_PROFILER / CORECLR profiling variables set via registry or command line
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\([Cc][Oo][Rr]|[Cc][Oo][Rr][Ee][Cc][Ll][Rr])_.*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Rr]_[Ee][Nn][Aa][Bb][Ll][Ee]_[Pp][Rr][Oo][Ff][Ii][Ll][Ii][Nn][Gg]|[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr]|[Cc][Oo][Rr][Ee][Cc][Ll][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell dropping a DLL (candidate profiler payload)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawning CLR-loading host that inherits the profiler (mmc, eventvwr, etc.)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\([Mm][Mm][Cc]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Cc][Oo][Mm][Pp][Mm][Gg][Mm][Tt][Ll][Aa][Uu][Nn][Cc][Hh]|[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Dd][Ii][Ss][Kk][Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Dd][Oo][Tt][Nn][Ee][Tt]|[Mm][Ss][Bb][Uu][Ii][Ll][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Unsigned-looking DLL loaded from user-writable path into CLR hosts
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*(\[Uu][Ss][Ee][Rr][Ss]\|\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\|\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Tt][Ee][Mm][Pp]\|\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\|\[Pp][Uu][Bb][Ll][Ii][Cc]\).*\.[Dd][Ll][Ll]/ AND data_win_eventdata_image:/.*\([Mm][Mm][Cc]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Mm][Ss][Bb][Uu][Ii][Ll][Dd]|[Dd][Oo][Tt][Nn][Ee][Tt]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: AMSI / ETW tampering in script blocks following profiler setup
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss]|[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd]|[Ee][Tt][Ww][Ee][Vv][Ee][Nn][Tt][Ww][Rr][Ii][Tt][Ee]|[Ee][Tt][Ww][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]|[Pp][Ss][Ee][Tt][Ww][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]).*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Ll][Uu][Ss]_[Ee][Tt][Ww].*/)
    pivot_on:
    - host
    window: 2h
