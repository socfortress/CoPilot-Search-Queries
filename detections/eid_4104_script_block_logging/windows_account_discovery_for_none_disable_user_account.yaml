name: Windows Account Discovery for None Disable User Account
id: eddbf5ba-b89e-47ca-995e-2d259804e55e
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the PowerView PowerShell cmdlet 
  Get-NetUser with the UACFilter parameter set to NOT_ACCOUNTDISABLE, indicating an 
  attempt to enumerate Active Directory user accounts that are not disabled. This 
  detection leverages PowerShell Script Block Logging (EventCode 4104) to identify 
  the specific script block text. Monitoring this activity is significant as it may 
  indicate reconnaissance efforts by an attacker to identify active user accounts for 
  further exploitation. If confirmed malicious, this activity could lead to 
  unauthorized access, privilege escalation, or lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-NetUser*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*NOT_ACCOUNTDISABLE*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-UACFilter*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of Get-NetUser with the -UACFilter parameter set to NOT_ACCOUNTDISABLE 
  to enumerate active user accounts in Active Directory. Validate that 
  data_win_eventdata_scriptBlockText field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators may leverage PowerView for legitimate purposes such as Active Directory 
  auditing or troubleshooting. Filter based on user context and whether the action was 
  expected and authorized within your organization.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://powersploit.readthedocs.io/en/stable/Recon/README/
  - https://book.hacktricks.xyz/windows-hardening/basic-powershell-for-pentesters/powerview
  - https://atomicredteam.io/discovery/T1087.001/
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html

response:
  message: >
    PowerView user discovery with NOT_ACCOUNTDISABLE filter detected on $agent_name$ 
    by user $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is enumerating active user accounts for exploitation and lateral movement 
    planning. MITRE ATT&CK: T1087.001
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - CISA AA23-347A
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.001
  custom_tags:
    - powerview
    - get_netuser
    - account_discovery
    - uacfilter
    - active_directory_enumeration
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-NetUser.*/ AND data_win_eventdata_scriptBlockText:/.*NOT_ACCOUNTDISABLE.*/ AND data_win_eventdata_scriptBlockText:/.*-UACFilter.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Same PowerView user-enumeration family (Get-DomainUser vs Get-NetUser); operators commonly run both aliases in one session, confirming PowerView is loaded on the host.
  - id: 21432e40-04f4-11ec-b7e6-acde48001122
    name: Get ADUser with PowerShell Script Block
    reason: Same 4104 telemetry; attacker enumerating enabled AD users often switches between PowerView and the RSAT Get-ADUser cmdlet.
  - id: de7fcadc-04f3-11ec-a241-acde48001122
    name: AdsiSearcher Account Discovery
    reason: Alternate LDAP-based account enumeration without modules; co-occurs when the operator tries multiple ways to list domain accounts.
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: 'Natural next step: after listing active accounts, attackers look for AS-REP roastable users to crack offline.'
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Companion account/group recon via native net.exe on the same host, typically preceding or following PowerView enumeration.
  - id: b1a8ce04-04c2-11ec-bea7-acde48001122
    name: Domain Account Discovery with Dsquery
    reason: Another living-off-the-land domain account enumeration method used alongside PowerView in the same discovery phase.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Domain/DC discovery typically precedes PowerView queries, establishing the target domain before user enumeration.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: 'Likely follow-on: enumerated active accounts are targeted for credential theft via in-memory Mimikatz/Invoke-Mimikatz.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView/AD enumeration cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et(Computer|Group|GroupMember|LocalGroup|Session|Loggedon|Share|Domain|DomainController|OU|GPO).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain(User|Computer|Group|Controller|Trust|GPO|OU|SPNTicket).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Uu]ser[Hh]unter.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ss]hare[Ff]inder.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerView/PowerSploit/SharpHound loaded or downloaded to host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Pp]ower[Vv]iew.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]ower[Ss]ploit.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*[Nn]et\.[Ww]eb[Cc]lient.*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Credential access follow-on: Kerberoast, AS-REP roast, LSASS or Mimikatz'
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]ubeus.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ont[Rr]eq[Pp]reauth.*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Native account/group recon commands run on the host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(user|group|accounts|localgroup).*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/) OR data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(dclist|dsgetdc|domain_trusts).*/))
    pivot_on:
    - host
    window: 2h
  - name: 'Lateral movement after discovery: remote logons and admin-share/remote exec'
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:(3 OR 10)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/))
    pivot_on:
    - host
    - user
    window: 4h
