name: PowerShell Invoke WmiExec Usage
id: windows-powershell-invoke-wmiexec-usage-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of the Invoke-WmiExec utility within PowerShell Script Block 
  Logging (EventCode 4104). This detection leverages PowerShell script block logs to 
  identify instances where the Invoke-WmiExec command is used. Monitoring this activity 
  is crucial as it indicates potential lateral movement using WMI commands with NTLMv2 
  pass-the-hash authentication. If confirmed malicious, this activity could allow an 
  attacker to execute commands remotely on target systems, potentially leading to further 
  compromise and lateral spread within the network.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*invoke-wmiexec*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  False positives should be limited as this analytic is designed to detect a specific 
  utility (Invoke-WmiExec). It is recommended to apply appropriate filters as needed 
  to minimize the number of false positives, particularly filtering by user context 
  and source.

references:
  - https://attack.mitre.org/techniques/T1047/
  - https://github.com/Kevin-Robertson/Invoke-TheHash/blob/master/Invoke-WMIExec.ps1
  - https://www.splunk.com/en_us/blog/security/powershell-detections-threat-research-release-august-2021.html

response:
  message: >
    Invoke-WmiExec lateral movement detected on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1047
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Scattered Lapsus$ Hunters
    - Suspicious WMI Use
    - Lateral Movement
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Invoke-WmiExec.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Invoke-WMIExec authenticates with an NTLM hash, so LSASS dumping is the typical precursor that supplied the hash.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: 'Target-side effect of WMI remote execution: WmiPrvSE spawning powershell on a victim host, confirming the pass-the-hash WMI command landed.'
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: Invoke-WMIExec runs commands via Win32_Process.Create, which surfaces as unusual children of WmiPrvSE.exe on the remote target.
  - id: 24869767-8579-485d-9a4f-d9ddfd8f0cac
    name: Process Execution via WMI
    reason: Same WMI Win32_Process creation primitive that Invoke-WMIExec uses; corroborates remote command execution on source or target.
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Sibling WMIExec tooling (Impacket wmiexec); attacker may switch between PowerShell and Impacket variants during the same lateral campaign.
  - id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
    name: HackTool - Wmiexec Default Powershell Command
    reason: Default command-line artifact of wmiexec-style tools on the target, indicating the WMI shell executed commands.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: PowerShell spawned by remote-execution parents (WMI/WinRM/DCOM) on a victim, the follow-on stage of lateral movement.
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Alternate remote-execution technique (DCOM) attackers pivot to when WMI is blocked or after WMI succeeds on additional hosts.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network (NTLM) logons from this host/user around Invoke-WMIExec
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:"NTLM") OR data_win_system_eventID:"4648"
    pivot_on:
    - host
    - user
    window: 2h
  - name: WmiPrvSE spawning shells or child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Mm][Ss][Hh][Tt][Aa]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Credential theft tooling (LSASS access, Mimikatz, Invoke-TheHash) before WMI exec
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*Invoke-TheHash* OR data_win_eventdata_scriptBlockText:*Invoke-SMBExec* OR data_win_eventdata_scriptBlockText:*sekurlsa*))
    pivot_on:
    - host
    window: 6h
  - name: Outbound SMB/WMI/RPC connections from PowerShell to other hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985")
    pivot_on:
    - host
    window: 2h
  - name: Invoke-TheHash family and pass-the-hash script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-SMBClient* OR data_win_eventdata_scriptBlockText:*Invoke-SMBEnum* OR data_win_eventdata_scriptBlockText:*Invoke-TheHash* OR data_win_eventdata_scriptBlockText:*Invoke-SMBExec* OR data_win_eventdata_scriptBlockText:*Invoke-WMIExec*)
    pivot_on:
    - host
    - user
    window: 4h
