name: Get-DomainTrust with PowerShell Script Block
id: 89275e7e-0548-11ec-bf75-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainTrust` cmdlet from 
  PowerView using PowerShell Script Block Logging (EventID 4104). This method captures 
  the full command sent to PowerShell, allowing for detailed inspection. Identifying this 
  activity is significant because it may indicate an attempt to gather domain trust 
  information, which is often a precursor to lateral movement or privilege escalation. 
  If confirmed malicious, this activity could enable an attacker to map trust 
  relationships within the domain, potentially leading to further exploitation and 
  compromise of additional systems.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainTrust*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-DomainTrust cmdlet, which is used to gather domain 
  trust information. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  It is possible certain system management frameworks utilize this command to gather 
  trust information. Filter based on user context and whether the action was expected 
  and authorized within your organization.

references:
  - https://blog.harmj0y.net/redteaming/a-guide-to-attacking-domain-trusts/
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://static1.squarespace.com/static/552092d5e4b0661088167e5c/t/59c1814829f18782e24f1fe2/1505853768977/Windows+PowerShell+Logging+Cheat+Sheet+ver+Sept+2017+v2.1.pdf
  - https://www.crowdstrike.com/blog/investigating-powershell-command-and-script-logging/

response:
  message: >
    Get-DomainTrust execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain trust reconnaissance/enumeration activity for lateral movement planning. 
    MITRE ATT&CK: T1482
  risk_score: 55
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 55
    - field: data_win_eventdata_user
      type: user
      score: 55
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1482
  custom_tags:
    - get_domaintrust
    - active_directory
    - domain_trust
    - trust_discovery
    - lateral_movement
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainTrust.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 70fac80e-0bf1-11ec-9ba0-acde48001122
    name: Get-ForestTrust with PowerShell Script Block
    reason: Sibling PowerView trust enumeration (forest-level) in the same script block; operators typically run Get-DomainTrust and Get-ForestTrust together to map the whole trust topology.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-DomainTrust is a PowerView cmdlet; this fires on the same PowerView module being loaded or other cmdlets running in the same session.
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: After mapping trusts, PowerView operators enumerate privileged groups (Domain/Enterprise Admins) to pick targets across the trust.
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: 'Follow-on PowerView step: SPN enumeration to find kerberoastable accounts in the domains discovered via trusts.'
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: 'Escalation of the same toolkit session: requesting service tickets (Kerberoasting) after trust and SPN reconnaissance.'
  - id: 3bad990e-4848-4a78-9530-b427d854aac0
    name: Domain Trust Discovery Via Dsquery
    reason: Same objective (domain trust enumeration) through a different tool; actors fall back to dsquery when PowerShell is constrained, or run both.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: nltest /domain_trusts is the native-binary equivalent of Get-DomainTrust and commonly appears in the same recon burst.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: SharpHound collection is the typical heavier AD mapping step that includes trusts; co-occurs with PowerView trust recon on the same host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerView / AD recon cmdlets in script blocks (non-trust)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(Get-Domain(User|Computer|Controller|Group|GPO|Policy|SID)|Get-NetDomain|Get-NetForest|Get-NetUser|Get-NetComputer|Get-ForestDomain|Find-DomainShare|Invoke-ShareFinder|Invoke-UserHunter|Get-DomainForeignGroupMember|Get-DomainForeignUser|Invoke-MapDomainTrust|Get-NetDomainTrust).*/ OR data_win_eventdata_scriptBlockText:/.*(PowerView|Invoke-BloodHound|SharpHound).*/)
    pivot_on:
    - host
    window: 2h
  - name: Native trust/AD discovery tooling spawned on host (nltest, dsquery, adfind, SharpHound)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn][Ll][Tt][Ee][Ss][Tt].*(domain_trusts|dclist|trusted_domains)|[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*trustedDomain|[Aa][Dd][Ff][Ii][Nn][Dd].*(trustdmp|objectclass=trusteddomain)|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Gg]et-[Aa][Dd][Tt]rust|[Gg]et-[Aa][Dd][Ff]orest).*/ OR data_win_eventdata_image:/.*(\\[Aa][Dd][Ff][Ii][Nn][Dd]|\\[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|\\[Nn][Ll][Tt][Ee][Ss][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell launched with download cradle or encoded command (PowerView staging)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(-[Ee]nc|-[Ee]ncodedcommand|[Dd]ownload[Ss]tring|[Ii][Ee][Xx]|[Ii]nvoke-[Ww]eb[Rr]equest|[Nn]et\.[Ww]eb[Cc]lient|[Ii]mport-[Mm]odule.*([Pp]ower[Vv]iew|\.ps1)).*/
    pivot_on:
    - host
    window: 1h
  - name: PowerView script dropped to disk or network to DC LDAP/Kerberos after trust recon
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Pp]ower[Vv]iew|[Pp]ower[Ss]ploit|[Ss]harp[Hh]ound|[Bb]lood[Hh]ound|[Aa]d[Rr]econ).*(\.ps1|\.psm1|\.zip|\.json)/) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"88"))
    pivot_on:
    - host
    window: 2h
