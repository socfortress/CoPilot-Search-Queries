name: Windows Exfiltration Over C2 Via Invoke RestMethod
id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects potential data exfiltration using PowerShell's Invoke-RestMethod
  with HTTP POST and -InFile parameters, indicating an attempt to upload files
  to an external command and control server. This technique is used by threat
  actors including APT37, Winter Vivern, and Hellcat Ransomware to exfiltrate
  sensitive data such as desktop screenshots or documents to attacker-controlled
  infrastructure. Immediate investigation is recommended to determine the intent
  and scope of the activity.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-RestMethod*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-Uri*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-Method*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Post*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-InFile*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging. Confirmed flowing in this environment.

known_false_positives: >
  False positives should be limited. Legitimate use of Invoke-RestMethod
  with POST and -InFile for API integrations or automation scripts may occur.
  Review the URI destination and file being uploaded to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1041/
  - https://twitter.com/_CERT_UA/status/1620781684257091584
  - https://cert.gov.ua/article/3761104

response:
  message: >
    PowerShell Invoke-RestMethod POST file upload detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1041
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Microsoft WSUS CVE-2025-59287
    - Hellcat Ransomware
    - APT37 Rustonotto and FadeStealer
    - Winter Vivern
    - Water Gamayun
  asset_type: Endpoint
  mitre_attack_id:
    - T1041
  custom_tags:
    - invoke_restmethod
    - exfiltration
    - c2
    - powershell
    - apt37
    - winter_vivern
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Invoke-RestMethod.*/ AND data_win_eventdata_scriptBlockText:/.*-Uri.*/ AND data_win_eventdata_scriptBlockText:/.*-Method.*/ AND data_win_eventdata_scriptBlockText:/.*Post.*/ AND data_win_eventdata_scriptBlockText:/.*-InFile.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
    name: Windows Screen Capture Via Powershell
    reason: APT37/Winter Vivern upload desktop screenshots with Invoke-RestMethod -InFile; a PowerShell screen grab just before is the staged file being exfiltrated
  - id: d4a11f63-2390-411c-9adf-d791fd152830
    name: Windows Screen Capture with CopyFromScreen
    reason: CopyFromScreen produces the image that is then POSTed via -InFile; direct precursor in the same script chain
  - id: Windows_Archive_Collected_Data_via_Powershell
    name: Windows Archive Collected Data via Powershell
    reason: Documents are compressed into an archive first and then uploaded with -InFile; archive creation is the staging step
  - id: b7a3c9a3-09ea-4934-8864-6a32cacd98d9
    name: Zip A Folder With PowerShell For Staging In Temp - PowerShell Script
    reason: Zipping a folder into Temp is the staging of the payload the POST uploads
  - id: 59e8bf41-7472-412a-90d3-00f3afa452e9
    name: Windows Exfiltration Over C2 Via Powershell UploadString
    reason: Sibling PowerShell HTTP exfil method; actors often fall back between WebClient and Invoke-RestMethod uploads from the same implant
  - id: windows-clipboard-data-get-clipboard-001
    name: Windows ClipBoard Data via Get-ClipBoard
    reason: Clipboard harvesting is a collection step of the same stealer scripts that then POST data to C2
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Hellcat-style operators exfiltrate bulk data with rclone as an alternative or follow-on channel to script-based uploads
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The uploading script is typically delivered via an encoded PowerShell launch (WSUS CVE-2025-59287 / APT37 chains), the likely initial execution
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell DNS lookups (C2 / file-sharing destinations)
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].*/)
    pivot_on:
    - host
    window: 1h
  - name: Archives and screenshots created by PowerShell (staging)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].*/) AND data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]|[Pp][Nn][Gg]|[Jj][Pp][Ee]?[Gg]|[Bb][Mm][Pp]|[Tt][Mm][Pp]|[Dd][Aa][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: Script blocks collecting data before upload
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Pp][Yy][Ff][Rr][Oo][Mm][Ss][Cc][Rr][Ee][Ee][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm].*-[Rr][Ee][Cc][Uu][Rr][Ss][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*[Uu][Pp][Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Archive and exfil-tool process launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Cc][Uu][Rr][Ll]|7[Zz]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Ww][Ii][Nn][Ss][Cc][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on:
    - host
    window: 2h
