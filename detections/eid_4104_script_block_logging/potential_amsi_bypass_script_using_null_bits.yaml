name: Potential AMSI Bypass Script Using NULL Bits
id: fa2559c8-1197-471d-9cdd-05a0273d4522
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fa2559c8-1197-471d-9cdd-05a0273d4522
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of special strings/null bits in order to potentially bypass AMSI
  functionalities. MITRE ATT&CK: T1685.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*if(0){{{0}}}' -f $(0 -as [char]) +*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*#<NULL>*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*if(0){{{0}}}' -f $(0 -as [char])
  +*'; data_win_eventdata_scriptBlockText matches '*#<NULL>*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/r00t-3xp10it/hacking-material-books/blob/43cb1e1932c16ff1f58b755bc9ab6b096046853f/obfuscation/simple_obfuscation.md#amsi-bypass-using-null-bits-satoshi
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Potential AMSI Bypass Script Using NULL Bits detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - bypass
    - powershell
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Ff]\(0\)\{\{\{0\}\}\}' -[Ff] \$\(0 -[Aa][Ss] \[[Cc][Hh][Aa][Rr]\]\) \+.*/ OR data_win_eventdata_scriptBlockText:/.*\#\<[Nn][Uu][Ll][Ll]\>.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Same 4104 channel; the common alternative/companion AMSI bypass (reflection to AmsiUtils) that attackers chain with or fall back to when the NULL-bit string trick is caught
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: Reflective amsiInitFailed/AmsiUtils tampering in the same script block stream; confirms deliberate AMSI neutralization rather than a stray string
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Defender flagging the same script via AMSI shows the bypass failed or an earlier obfuscated stage was caught just before the bypass was applied
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: 'Defense-impairment pair: attackers blind AMSI and ETW in the same prologue before running the real payload'
  - id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
    name: Tamper Windows Defender - ScriptBlockLogging
    reason: After AMSI is bypassed the script commonly disables Defender real-time protection to persist the payload
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: 'Follow-on step: add path/process exclusions so dropped payloads survive scanning'
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The bypass exists to let the next stage download a flagged payload via DownloadString/DownloadFile without AMSI scanning
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: 'Typical post-bypass action: load a .NET assembly in memory (Rubeus, SharpHound, Cobalt Strike loaders)'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradle or remote script fetch in script blocks after AMSI bypass
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload([Ss]tring|[Ff]ile|[Dd]ata).*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ee]xpression.*/)
    pivot_on:
    - host
    window: 1h
  - name: Other AMSI/ETW tampering and in-memory .NET loading in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*amsiInitFailed.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Cc]ontext.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Ss]can[Bb]uffer.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Pp]rotect.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]tw[Ee]vent[Ww]rite.*/)
    pivot_on:
    - host
    window: 1h
  - name: Defender tampering or exclusions via PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xclusion[Pp]ath.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell process launch with encoded or hidden arguments and its parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*-[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*-[Ww]indow[Ss]tyle +[Hh]idden.*/ OR data_win_eventdata_commandLine:/.*-[Nn]o[Pp].*/ OR data_win_eventdata_commandLine:/.*[Ff]rom[Bb]ase64[Ss]tring.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections from PowerShell after the bypass
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 1h
