name: Potential Suspicious Windows Feature Enabled
id: 55c925c1-7195-426b-a136-a9396800e29b
version: 1
schema_version: "1.0"
date: "2022-12-29"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 55c925c1-7195-426b-a136-a9396800e29b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the built-in PowerShell cmdlet
  "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and
  Management tool. Similar to DISM.exe, this cmdlet is used to enumerate,
  install, uninstall, configure, and update features and packages in Windows
  images.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Enable-WindowsOptionalFeature*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Online*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-FeatureName*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TelnetServer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Internet-Explorer-Optional-amd64*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*TFTP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*SMB1Protocol*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Client-ProjFS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Microsoft-Windows-Subsystem-Linux*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Enable-WindowsOptionalFeature*';
  data_win_eventdata_scriptBlockText matches '*-Online*';
  data_win_eventdata_scriptBlockText matches '*-FeatureName*', among other
  conditions.

known_false_positives: >
  Legitimate usage of the features listed in the rule. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
  - https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
  - https://learn.microsoft.com/en-us/windows/wsl/install-on-server

response:
  message: >
    Potential Suspicious Windows Feature Enabled detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - feature
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll][Ff][Ee][Aa][Tt][Uu][Rr][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*-[Oo][Nn][Ll][Ii][Nn][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*-[Ff][Ee][Aa][Tt][Uu][Rr][Ee][Nn][Aa][Mm][Ee].*/ AND (data_win_eventdata_scriptBlockText:/.*[Tt][Ee][Ll][Nn][Ee][Tt][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt]-[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]-[Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll]-[Aa][Mm][Dd]64.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Ff][Tt][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Mm][Bb]1[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ii][Ee][Nn][Tt]-[Pp][Rr][Oo][Jj][Ff][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ss][Uu][Bb][Ss][Yy][Ss][Tt][Ee][Mm]-[Ll][Ii][Nn][Uu][Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
    name: Potential Suspicious Windows Feature Enabled - ProcCreation
    reason: Same feature-enable behaviour seen as process creation (dism.exe/powershell command line); confirms the script block executed and shows the parent process.
  - id: windows-powershell-enable-smb1protocol-feature-001
    name: Windows PowerShell Enable SMB1Protocol Feature
    reason: SMB1Protocol is one of the features this rule matches; enabling legacy SMBv1 re-opens EternalBlue-class lateral movement and relay paths.
  - id: 155c7fd5-47b4-49b2-bbeb-eb4fab335429
    name: Add Windows Capability Via PowerShell Script
    reason: Sibling Windows component-install technique (Add-WindowsCapability) often used in the same script to add tooling such as OpenSSH or RSAT.
  - id: eca8ae39-5c3c-4321-b538-9e64fe25822e
    name: Installation of WSL Kali-Linux
    reason: Enabling Microsoft-Windows-Subsystem-Linux is the prerequisite for installing a WSL attack distro to run tooling outside EDR visibility.
  - id: a5d85486-b89c-11eb-8267-acde48001122
    name: Allow Inbound Traffic In Firewall Rule
    reason: After enabling TelnetServer or TFTP the attacker must open the firewall to make the service reachable.
  - id: 488b44e7-3781-4a71-888d-c95abfacf44d
    name: Windows Firewall Profile Disabled
    reason: Defence evasion commonly paired with enabling remote-access features so the new listener is reachable.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: Same operator typically stages Defender exclusions in the same session before dropping tooling on the newly enabled component.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: TFTP and client features are enabled to pull payloads; a download cradle in the same host's script blocks is the likely precursor or follow-on.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other optional-feature / DISM / capability changes on this host
    query: (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ee][Nn][Aa][Bb][Ll][Ee]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll][Ff][Ee][Aa][Tt][Uu][Rr][Ee]|[Aa][Dd][Dd]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Cc][Aa][Pp][Aa][Bb][Ii][Ll][Ii][Tt][Yy]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Ff][Ee][Aa][Tt][Uu][Rr][Ee]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\([Dd][Ii][Ss][Mm]|[Pp][Kk][Gg][Mm][Gg][Rr]|[Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll][Ff][Ee][Aa][Tt][Uu][Rr][Ee][Ss])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Firewall opened or disabled for newly enabled service
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt][Ss][Hh].*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]|[Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee]|[Ss][Ee][Tt]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Pp][Rr][Oo][Ff][Ii][Ll][Ee]).*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee]|[Ss][Ee][Tt]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Pp][Rr][Oo][Ff][Ii][Ll][Ee]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Telnet/TFTP/SMB client or server activity after enablement
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\([Tt][Ff][Tt][Pp]|[Tt][Ee][Ll][Nn][Ee][Tt]|[Tt][Ll][Nn][Tt][Ss][Vv][Rr])\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"23" OR data_win_eventdata_destinationPort:"69" OR data_win_eventdata_destinationPort:"445") AND data_win_eventdata_initiated:"true")
    pivot_on:
    - host
    window: 4h
  - name: WSL launch and Linux tooling execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Ww][Ss][Ll]|[Bb][Aa][Ss][Hh]|[Ww][Ss][Ll][Hh][Oo][Ss][Tt]|[Ww][Ss][Ll][Cc][Oo][Nn][Ff][Ii][Gg])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww][Ss][Ll].*(--[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|--[Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Payload download or Defender tampering in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]).*/
    pivot_on:
    - host
    window: 2h
