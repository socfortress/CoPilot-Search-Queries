name: PowerShell Script With File Hostname Resolving Capabilities
id: fbc5e92f-3044-4e73-a5c6-1c4359b539de
version: 1
schema_version: "1.0"
date: "2023-05-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fbc5e92f-3044-4e73-a5c6-1c4359b539de
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell scripts that have capabilities to read files, loop through
  them and resolve DNS host entries. MITRE ATT&CK: T1020.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Get-content *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*foreach*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*[System.Net.Dns]::GetHostEntry*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Out-File*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-content *';
  data_win_eventdata_scriptBlockText matches '*foreach*';
  data_win_eventdata_scriptBlockText matches '*[System.Net.Dns]::GetHostEntry*',
  among other conditions.

known_false_positives: >
  The same functionality can be implemented by admin scripts, correlate with
  name and creator. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.fortypoundhead.com/showcontent.asp?artid=24022
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers
  - https://attack.mitre.org/techniques/T1020/

response:
  message: >
    PowerShell Script With File Hostname Resolving Capabilities detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1020
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1020
  custom_tags:
    - powershell
    - hostname
    - resolving
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt] .*/ AND data_win_eventdata_scriptBlockText:/.*[Ff][Oo][Rr][Ee][Aa][Cc][Hh].*/ AND data_win_eventdata_scriptBlockText:/.*\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Dd][Nn][Ss]\]::[Gg][Ee][Tt][Hh][Oo][Ss][Tt][Ee][Nn][Tt][Rr][Yy].*/ AND data_win_eventdata_scriptBlockText:/.*[Oo][Uu][Tt]-[Ff][Ii][Ll][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 70803451-0047-4e12-9d63-77fa7eb8649c
    name: Remote System Discovery with Adsisearcher
    reason: Host lists resolved by this script are often harvested from AD; ADSI computer enumeration is the typical precursor that produces the input file
  - id: db885529-903f-4c5d-9864-28fe199e6370
    name: Computer Discovery And Export Via Get-ADComputer Cmdlet - PowerShell
    reason: Get-ADComputer export to file creates the hostname list that this Get-Content/foreach/GetHostEntry loop then resolves
  - id: a9723fcc-881c-424c-8709-fd61442ab3c3
    name: Recon Information for Export with PowerShell
    reason: Same pattern of recon output written to file with Out-File, typically a stage before packaging for exfiltration
  - id: d59d7842-9a21-4bc6-ba98-64bfe0091355
    name: Powershell DNSExfiltration
    reason: Scripts looping file contents through DNS lookups can be DNS exfiltration; confirms data leaving via resolved names
  - id: 2452e632-9e0d-11eb-bacd-acde48001122
    name: DNS Exfiltration Using Nslookup App
    reason: Alternate DNS-based channel from the same host if the PowerShell resolver loop is exfiltration or tunnelling
  - id: 162e69a7-7981-4344-84a9-0f1c9a217a52
    name: Powershell Directory Enumeration
    reason: File and directory reconnaissance preceding the file-reading loop, selecting what is read and processed
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: Bulk file reading may follow targeted discovery of sensitive files whose contents are then encoded or sent
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Script-block download cradle is the common delivery step of the toolkit script carrying this resolver loop
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DNS queries from PowerShell (resolver loop traffic)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 1h
  - name: Script blocks building or probing host/IP lists (AD, ADSI, ping sweep, port probe)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Cc]omputer.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss]earcher.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]est-[Cc]onnection.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]end[Pp]ing.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]cp[Cc]lient.*/)
    pivot_on:
    - host
    window: 2h
  - name: Data files written by PowerShell (txt/csv/log/zip/7z/rar)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:/.*\.(txt|csv|log|zip|7z|rar|xml)/
    pivot_on:
    - host
    window: 2h
  - name: Archiving or outbound transfer after resolution script
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\(7z|7za|[Rr]ar|[Ww]in[Rr]ar|[Rr]clone|[Cc]url|[Ww]get|[Ww]in[Ss]cp|[Pp]scp)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod|[Ss]tart-[Bb]its[Tt]ransfer).*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network connections by PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
