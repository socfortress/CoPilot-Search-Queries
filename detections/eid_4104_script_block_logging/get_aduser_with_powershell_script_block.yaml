name: Get ADUser with PowerShell Script Block
id: 21432e40-04f4-11ec-b7e6-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-AdUser` PowerShell cmdlet 
  with a filter parameter, which is used to enumerate domain users. It leverages 
  PowerShell Script Block Logging (EventID 4104) to identify instances where this 
  command is executed with a filter. This activity is significant as it may indicate 
  an attempt by adversaries or Red Teams to gather information about domain users 
  for situational awareness and Active Directory discovery. If confirmed malicious, 
  this behavior could lead to further reconnaissance and potential exploitation of 
  user accounts within the domain.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-AdUser*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Filter*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-AdUser cmdlet combined with the -Filter parameter, 
  which is used to query Active Directory for user objects. Attackers use this to 
  enumerate domain users, identify privileged accounts, or search for specific user 
  patterns as part of reconnaissance and lateral movement planning.

known_false_positives: >
  Administrators or power users may use this command for legitimate troubleshooting 
  and system administration purposes. Filter based on user context and whether the 
  action was expected and authorized within your organization.

references:
  - https://www.blackhillsinfosec.com/red-blue-purple/
  - https://attack.mitre.org/techniques/T1087/002/
  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/get-aduser?view=windowsserver2019-ps

response:
  message: >
    Get-AdUser with -Filter parameter detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script: $data_win_eventdata_scriptBlockText$. 
    This indicates domain user enumeration/reconnaissance activity. 
    MITRE ATT&CK: T1087.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - CISA AA23-347A
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - get_aduser
    - active_directory
    - user_enumeration
    - filter_parameter
    - reconnaissance
    - powershell
    - account_discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-AdUser.*/ AND data_win_eventdata_scriptBlockText:/.*Filter.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c2993223-6da8-4b1a-88ee-668b8bf315e9
    name: User Discovery And Export Via Get-ADUser Cmdlet - PowerShell
    reason: Same Get-ADUser enumeration, escalated to piping/exporting the user list to file - the staging step once the Filter query returns useful accounts.
  - id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
    name: Get-ADUser Enumeration Using UserAccountControl Flags
    reason: 'Targeted refinement of the same cmdlet: filtering on UAC flags to find accounts with weak settings (no preauth, no password required) rather than a broad user dump.'
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: Get-ADUser -Filter used to find DoNotRequirePreAuth accounts - direct precursor to AS-REP roasting.
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: 'Likely follow-on: after enumerating users, attacker requests TGTs for preauth-disabled accounts to crack offline.'
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: 'Next recon step after user enumeration: finding service-principal accounts to target for Kerberoasting.'
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-ADUser is often interleaved with PowerView (Get-DomainUser etc.) in the same session when the RSAT module is unavailable; confirms offensive AD tooling.
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: Automated whole-domain enumeration (users, groups, GPOs) that subsumes a Get-ADUser query; escalates a one-off lookup into full AD reconnaissance.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Graph-based AD collection commonly follows or accompanies manual user enumeration to map paths to Domain Admin.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD cmdlet enumeration in script blocks (groups, computers, trusts, ACLs, SPNs)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd](Group|GroupMember|Computer|Domain|Trust|DefaultDomainPasswordPolicy|ObjectAcl|Forest|OrganizationalUnit).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain(User|Group|Computer|Controller|Trust|SPNTicket).*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dsi[Ss]earcher.*/ OR data_win_eventdata_scriptBlockText:/.*DirectorySearcher.*/)
    pivot_on:
    - host
    window: 1h
  - name: Command-line AD discovery tools (net, nltest, dsquery, adfind, setspn)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn]et1?(\.exe)? +(user|group|accounts|localgroup).*\/domain).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*(dclist|domain_trusts|dsgetdc).*/ OR data_win_eventdata_image:/.*\\([Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Ee][Tt][Ss][Pp][Nn])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: AD recon tool execution and BloodHound output files
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*([Ss]harp[Hh]ound|[Aa]d[Rr]econ|[Ii]nvoke-[Bb]lood[Hh]ound|-[Cc]ollection[Mm]ethod).*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(BloodHound|_users\.json|_groups\.json|_computers\.json|_domains\.json|ADRecon).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos ticket abuse (AS-REP / Kerberoast) following user enumeration
    query: (data_win_system_eventID:"4768" AND data_win_eventdata_preAuthType:"0") OR (data_win_system_eventID:"4769" AND data_win_eventdata_ticketEncryptionType:"0x17") OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(Rubeus|Invoke-Kerberoast|Request-SPNTicket|GetUserSPNs|KerberosRequestorSecurityToken).*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Credential access or remote execution after AD enumeration
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(Invoke-Mimikatz|DumpCreds|Invoke-Command|Enter-PSSession|New-PSSession|Invoke-WmiMethod).*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    - user
    window: 4h
