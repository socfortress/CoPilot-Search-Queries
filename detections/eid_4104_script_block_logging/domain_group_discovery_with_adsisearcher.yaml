name: Domain Group Discovery with Adsisearcher
id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of the `[adsisearcher]` type accelerator 
  in PowerShell to query Active Directory for domain groups. It leverages PowerShell 
  Script Block Logging (EventID 4104) to identify specific script blocks containing 
  `[adsisearcher]` and group-related queries (`objectcategory=group` and `findAll()`). 
  This activity is significant as it may indicate an attempt by adversaries or Red 
  Teams to enumerate domain groups for situational awareness and Active Directory 
  discovery. If confirmed malicious, this behavior could lead to further reconnaissance, 
  privilege escalation, or lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*adsisearcher*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*objectcategory=group*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*findAll*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the [adsisearcher] type accelerator combined with LDAP 
  filters for group objects (objectcategory=group) and the findAll() method. 
  This combination is used to enumerate domain groups, which is a common reconnaissance 
  activity in the early stages of an attack.

known_false_positives: >
  Administrators or power users may use Adsisearcher for legitimate troubleshooting 
  and system administration purposes. Filter based on user context and whether the 
  action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1069/002/
  - https://devblogs.microsoft.com/scripting/use-the-powershell-adsisearcher-type-accelerator-to-search-active-directory/
  - https://learn.microsoft.com/en-us/windows/win32/adsi/ldap-syntaxes

response:
  message: >
    Domain group discovery enumeration using PowerShell on $agent_name$ by user 
    $data_win_eventdata_user$. Script: $data_win_eventdata_scriptBlockText$. 
    This indicates Active Directory reconnaissance activity. MITRE ATT&CK: T1069.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Scattered Lapsus$ Hunters
    - Active Directory Discovery
    - Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.002
  custom_tags:
    - adsisearcher
    - active_directory
    - group_enumeration
    - ldap_query
    - powershell
    - reconnaissance
    - objectcategory
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*adsisearcher.*/ AND data_win_eventdata_scriptBlockText:/.*objectcategory=group.*/ AND data_win_eventdata_scriptBlockText:/.*findAll.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de7fcadc-04f3-11ec-a241-acde48001122
    name: AdsiSearcher Account Discovery
    reason: Same [adsisearcher] LDAP technique used for user enumeration; group and account discovery are normally run back-to-back in one recon script.
  - id: 70803451-0047-4e12-9d63-77fa7eb8649c
    name: Remote System Discovery with Adsisearcher
    reason: Same adsisearcher tooling pivoting from groups to computer/DC enumeration, the next recon step for lateral-movement targets.
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: 'Escalation of the same goal: after listing groups, attacker narrows to privileged groups (Domain Admins) with PowerView.'
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Attackers who start with built-in adsisearcher often load PowerView next for richer AD enumeration in the same PowerShell session.
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: SPN enumeration is the typical follow-on to group discovery, identifying Kerberoastable service accounts.
  - id: 93c94be3-bead-4a60-860f-77ca3fe59903
    name: GetDomainGroup with PowerShell
    reason: Same group enumeration objective via PowerView-style commands, confirming broad AD group recon on the host.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Automated AD graph collection is the usual escalation from manual PowerShell group queries to full attack-path mapping.
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: LDAP-based hunt for AS-REP roastable accounts, a credential-access follow-on to directory recon.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other adsisearcher / DirectorySearcher LDAP queries in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*adsisearcher* OR data_win_eventdata_scriptBlockText:*DirectorySearcher* OR data_win_eventdata_scriptBlockText:*System.DirectoryServices*) AND (data_win_eventdata_scriptBlockText:*objectcategory* OR data_win_eventdata_scriptBlockText:*objectclass* OR data_win_eventdata_scriptBlockText:*serviceprincipalname* OR data_win_eventdata_scriptBlockText:*samaccountname* OR data_win_eventdata_scriptBlockText:*admincount*)
    pivot_on:
    - host
    window: 2h
  - name: 'AD recon tooling loaded: PowerView, SharpHound, AD module'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-DomainGroup* OR data_win_eventdata_scriptBlockText:*Get-NetGroup* OR data_win_eventdata_scriptBlockText:*Get-DomainUser* OR data_win_eventdata_scriptBlockText:*Invoke-BloodHound* OR data_win_eventdata_scriptBlockText:*SharpHound* OR data_win_eventdata_scriptBlockText:*Get-ADGroupMember* OR data_win_eventdata_scriptBlockText:*Get-ADUser* OR data_win_eventdata_scriptBlockText:*PowerView*)
    pivot_on:
    - host
    window: 2h
  - name: 'Native AD recon binaries: net group, dsquery, nltest, setspn'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(group|user|accounts).*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/) OR data_win_eventdata_image:/.*([Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: LDAP/AD enumeration output staged to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*_BloodHound\.zip/ OR data_win_eventdata_targetFilename:/.*[Bb]lood[Hh]ound.*\.(zip|json)/ OR data_win_eventdata_targetFilename:/.*(groups|domain_?users|adusers|adgroups|ldap).*\.(txt|csv|json|xml)/)
    pivot_on:
    - host
    window: 2h
  - name: Follow-on credential access and lateral movement after recon
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Invoke-Kerberoast* OR data_win_eventdata_commandLine:*Rubeus* OR data_win_eventdata_commandLine:*mimikatz* OR data_win_eventdata_commandLine:*Enter-PSSession* OR data_win_eventdata_commandLine:*Invoke-Command* OR data_win_eventdata_commandLine:*psexec*))
    pivot_on:
    - host
    window: 4h
