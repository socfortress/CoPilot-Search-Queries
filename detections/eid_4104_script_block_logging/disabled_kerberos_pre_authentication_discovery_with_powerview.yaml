name: Disabled Kerberos Pre-Authentication Discovery With PowerView
id: b0b34e2c-90de-11ec-baeb-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainUser` commandlet 
  with the `-PreauthNotRequired` parameter using PowerShell Script Block Logging 
  (EventID 4104). This command is part of PowerView, a tool used for enumerating 
  Windows Active Directory networks. Identifying domain accounts with Kerberos 
  Pre-Authentication disabled is significant because adversaries can leverage this 
  information to attempt AS-REP roasting attacks and offline password cracking. 
  If confirmed malicious, this activity could lead to unauthorized access to domain 
  accounts, credential compromise, and potential privilege escalation within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainUser*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*PreauthNotRequired*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-DomainUser PowerView cmdlet combined with the 
  -PreauthNotRequired parameter, which identifies domain accounts with Kerberos 
  Pre-Authentication disabled. These accounts are vulnerable to AS-REP roasting attacks 
  where attackers can request Kerberos authentication without providing valid credentials 
  and then perform offline password cracking.

known_false_positives: >
  Administrators or power users may use PowerView for legitimate troubleshooting, 
  auditing, or system administration purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1558/004/
  - https://m0chan.github.io/2019/07/31/How-To-Attack-Kerberos-101.html
  - https://stealthbits.com/blog/cracking-active-directory-passwords-with-as-rep-roasting/
  - https://github.com/PowerShellMafia/PowerSploit/blob/master/Recon/PowerView.ps1

response:
  message: >
    Disabled Kerberos Pre-Authentication Discovery With PowerView detected on 
    $agent_name$ by user $data_win_eventdata_user$. 
    Script: $data_win_eventdata_scriptBlockText$. 
    This indicates reconnaissance for AS-REP roasting vulnerable accounts. 
    MITRE ATT&CK: T1558.004
  risk_score: 60
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 60
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Kerberos Attacks
    - Interlock Ransomware
    - Kerberos Attacks
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.004
  custom_tags:
    - powerview
    - get_domainuser
    - preauthnotrequired
    - kerberos
    - asrep_roasting
    - active_directory
    - reconnaissance
    - powershell
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainUser.*/ AND data_win_eventdata_scriptBlockText:/.*PreauthNotRequired.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: Same AS-REP-roastable account hunt done with the AD module instead of PowerView; attackers swap tooling, so either firing on the host confirms the recon.
  - id: 59b51620-94c9-11ec-b3d5-acde48001122
    name: Kerberos Pre-Authentication Flag Disabled with PowerShell
    reason: 'Escalation of the same theme: after discovering accounts, an attacker with write rights can set DONT_REQ_PREAUTH on a chosen account to make it roastable.'
  - id: 3e2f1b2c-4d5e-11ee-be56-0242ac120002
    name: Potential AS-REP Roasting via Kerberos TGT Requests
    reason: 'Direct follow-on: the discovered pre-auth-disabled accounts are exploited by requesting AS-REPs (4768) for offline cracking.'
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Rubeus-style asreproast/asktgt command lines are the usual tool that consumes the PowerView output.
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: AS-REP roast and Kerberoast responses are requested as RC4 (0x17) for cracking, so RC4 tickets after this recon corroborate the roast.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: 'Same PowerView session: the attacker normally runs other PowerView cmdlets around Get-DomainUser during AD recon.'
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: 'Companion roasting recon: SPN discovery finds Kerberoastable accounts alongside the AS-REP candidates in the same PowerView session.'
  - id: windows-powershell-domain-enumeration-001
    name: Windows PowerShell Domain Enumeration
    reason: Broader AD enumeration from PowerShell on the same host that precedes or accompanies the targeted pre-auth query.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / AD recon script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain(User|Computer|Group|Controller|Trust|GPO|SPNTicket).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et(User|Computer|Group|Session).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ss]hare[Ff]inder.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerView loaded or downloaded in memory
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Pp]ower[Vv]iew.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]ower[Ss]ploit.*/) AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]mport-[Mm]odule.*/)
    pivot_on:
    - host
    window: 1h
  - name: Rubeus / AS-REP roast tooling execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr]ubeus.*/ OR data_win_eventdata_commandLine:/.*[Aa]sreproast.*/ OR data_win_eventdata_commandLine:/.*[Aa]sktgt.*/ OR data_win_eventdata_commandLine:/.*[Kk]erberoast.*/ OR data_win_eventdata_commandLine:/.*[Rr]ubeus.*/ OR data_win_eventdata_commandLine:/.*[Hh]ashcat.*/ OR data_win_eventdata_commandLine:/.*[Gg]et[Nn]pusers.*/)
    pivot_on:
    - host
    window: 4h
  - name: AS-REP requests without pre-authentication for this account
    query: data_win_system_eventID:"4768" AND (data_win_eventdata_preAuthType:"0" OR data_win_eventdata_ticketEncryptionType:"0x17")
    pivot_on:
    - user
    window: 6h
  - name: PowerShell connections to Kerberos or LDAP
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268")
    pivot_on:
    - host
    window: 2h
