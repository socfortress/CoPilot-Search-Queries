name: Troubleshooting Pack Cmdlet Execution
id: 03409c93-a7c7-49ba-9a4c-a00badf2a153
version: 1
schema_version: "1.0"
date: "2022-06-21"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 03409c93-a7c7-49ba-9a4c-a00badf2a153
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "TroubleshootingPack" cmdlets to leverage CVE-2022-30190
  or action similar to "msdt" lolbin (as described in LOLBAS). MITRE ATT&CK:
  T1202.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Invoke-TroubleshootingPack*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*C:\\\\Windows\\\\Diagnostics\\\\System\\\\PCW*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-AnswerFile*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Unattended*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Invoke-TroubleshootingPack*';
  data_win_eventdata_scriptBlockText matches
  '*C:\Windows\Diagnostics\System\PCW*'; data_win_eventdata_scriptBlockText
  matches '*-AnswerFile*', among other conditions.

known_false_positives: >
  Legitimate usage of "TroubleshootingPack" cmdlet for troubleshooting purposes.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/nas_bench/status/1537919885031772161
  - https://lolbas-project.github.io/lolbas/Binaries/Msdt/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Troubleshooting Pack Cmdlet Execution detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - troubleshooting
    - cmdlet
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Tt][Rr][Oo][Uu][Bb][Ll][Ee][Ss][Hh][Oo][Oo][Tt][Ii][Nn][Gg][Pp][Aa][Cc][Kk].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Pp][Cc][Ww].*/ AND data_win_eventdata_scriptBlockText:/.*-[Aa][Nn][Ss][Ww][Ee][Rr][Ff][Ii][Ll][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*-[Uu][Nn][Aa][Tt][Tt][Ee][Nn][Dd][Ee][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9c8c7000-3065-44a8-a555-79bcba5d9955
    name: MSDT Execution Via Answer File
    reason: Invoke-TroubleshootingPack -AnswerFile -Unattended is the PowerShell route to the same msdt answer-file abuse; the process-creation form of that behaviour confirms the diagnostic engine ran.
  - id: 6004abd0-afa4-4557-ba90-49d172e0a299
    name: Execute Pcwrun.EXE To Leverage Follina
    reason: The rule targets the PCW diagnostic path; pcwrun.exe is the sibling launcher of the same Follina/PCW diagnostic abuse.
  - id: f3d39c45-de1a-4486-a687-ab126124f744
    name: Sdiagnhost Calling Suspicious Child Process
    reason: The troubleshooting pack runs through sdiagnhost.exe; a suspicious child of it is the payload execution this cmdlet is used to trigger.
  - id: 2d9403d5-7927-46b7-8216-37ab7c9ec5e3
    name: Suspicious Set Value of MSDT in Registry (CVE-2022-30190)
    reason: Follina-style CVE-2022-30190 abuse of the ms-msdt handler is the same diagnostic-tool execution technique; registry changes to MSDT precede or accompany it.
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: Msdt.exe with PCW diagnostic arguments is the direct binary equivalent of this cmdlet's LOLBAS msdt behaviour.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sdiagnhost / msdt / pcwrun spawning child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:(*\sdiagnhost.exe OR *\msdt.exe OR *\pcwrun.exe) AND data_win_eventdata_image:(*\cmd.exe OR *\powershell.exe OR *\pwsh.exe OR *\wscript.exe OR *\cscript.exe OR *\mshta.exe OR *\rundll32.exe OR *\regsvr32.exe OR *\certutil.exe OR *\bitsadmin.exe)
    pivot_on:
    - host
    window: 1h
  - name: Answer file or diagnostic-pack file written before execution
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:(*.diagcab OR *.diagpkg OR *answer*.xml OR *\PCW*) OR data_win_eventdata_targetFilename:*\Windows\Diagnostics\*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell cradle or encoded script blocks around the pack run
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*Start-BitsTransfer*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connection by msdt or sdiagnhost
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:(*\msdt.exe OR *\sdiagnhost.exe OR *\pcwrun.exe)
    pivot_on:
    - host
    window: 2h
  - name: Office or script host launching PowerShell with troubleshooting pack
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*TroubleshootingPack* OR *msdt* OR *PCWDiagnostic* OR *ms-msdt*)
    pivot_on:
    - host
    window: 4h
