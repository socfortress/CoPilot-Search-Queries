name: PowerShell Write-EventLog Usage
id: 35f41cd7-c98e-469f-8a02-ec4ba0cc7a7e
version: 1
schema_version: "1.0"
date: "2022-08-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 35f41cd7-c98e-469f-8a02-ec4ba0cc7a7e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Write-EventLog" cmdlet with 'RawData' flag. The cmdlet
  can be levreage to write malicious payloads to the EventLog and then retrieve
  them later for later use.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Write-EventLog*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-RawData *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Write-EventLog*';
  data_win_eventdata_scriptBlockText matches '*-RawData *'.

known_false_positives: >
  Legitimate applications writing events via this cmdlet. Investigate alerts to
  determine if the action is benign. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.blackhillsinfosec.com/windows-event-logs-for-red-teams/

response:
  message: >
    PowerShell Write-EventLog Usage detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - powershell
    - write
    - eventlog
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ww][Rr][Ii][Tt][Ee]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ AND data_win_eventdata_scriptBlockText:/.*-[Rr][Aa][Ww][Dd][Aa][Tt][Aa] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Write-EventLog -RawData stashes binary (often shellcode) in the event log; a later script block that allocates memory and runs it is the direct follow-on.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Payload read back from the event log is typically loaded in memory via reflection rather than written to disk.
  - id: 0f017df3-8f5a-414f-ad6b-24aff1128278
    name: Suspicious Eventlog Clear
    reason: Attackers who plant payloads in event logs often clear or tamper with logs afterwards to hide the staging records.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Wevtutil log clearing is the common cleanup after event-log payload staging and execution.
  - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
    name: Eventlog Cleared
    reason: A log-cleared event near the Write-EventLog activity shows the staging evidence was removed.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: 'Same defense-impairment tradecraft: ETW/logging tampering accompanies event-log abuse to blind telemetry.'
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: Loaders executing event-log-stored payloads commonly disable AMSI first so the decoded payload is not scanned.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The stager that delivers the writer script often uses a download cradle, a precursor to the Write-EventLog step.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shellcode execution primitives in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*VirtualAlloc* OR data_win_eventdata_scriptBlockText:*CreateThread* OR data_win_eventdata_scriptBlockText:*Marshal*Copy* OR data_win_eventdata_scriptBlockText:*GetDelegateForFunctionPointer* OR data_win_eventdata_scriptBlockText:*RtlMoveMemory* OR data_win_eventdata_scriptBlockText:*WriteProcessMemory*)
    pivot_on:
    - host
    window: 2h
  - name: Reading event log entries back (payload retrieval)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-EventLog* OR data_win_eventdata_scriptBlockText:*Get-WinEvent* OR data_win_eventdata_scriptBlockText:*EventLog*Entries*) AND (data_win_eventdata_scriptBlockText:*Data* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*byte*)
    pivot_on:
    - host
    window: 2h
  - name: Event log source registration or log clearing commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*New-EventLog* OR data_win_eventdata_commandLine:*Clear-EventLog* OR data_win_eventdata_commandLine:*Remove-EventLog* OR data_win_eventdata_commandLine:*eventcreate* OR data_win_eventdata_commandLine:*wevtutil*)
    pivot_on:
    - host
    window: 2h
  - name: Remote thread creation or PowerShell process access
    query: data_win_system_eventID:"8" OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*([Pp]ower[Ss]hell|pwsh).*/ AND (data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x1f3fff" OR data_win_eventdata_grantedAccess:"0x143a"))
    pivot_on:
    - host
    window: 2h
  - name: Outbound network or DNS from PowerShell processes
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|pwsh).*/
    pivot_on:
    - host
    window: 2h
