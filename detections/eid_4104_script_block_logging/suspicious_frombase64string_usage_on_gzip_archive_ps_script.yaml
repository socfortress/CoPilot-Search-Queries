name: Suspicious FromBase64String Usage On Gzip Archive - Ps Script
id: df69cb1d-b891-4cd9-90c7-d617d90100ce
version: 1
schema_version: "1.0"
date: "2022-12-23"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: df69cb1d-b891-4cd9-90c7-d617d90100ce
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts of decoding a base64 Gzip archive in a PowerShell script.
  This technique is often used as a method to load malicious content into memory
  afterward. MITRE ATT&CK: T1132.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*FromBase64String*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*MemoryStream*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*H4sI*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*FromBase64String*';
  data_win_eventdata_scriptBlockText matches '*MemoryStream*';
  data_win_eventdata_scriptBlockText matches '*H4sI*'.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=43
  - https://attack.mitre.org/techniques/T1132/001/

response:
  message: >
    Suspicious FromBase64String Usage On Gzip Archive - Ps Script detected on
    host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1132.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1132.001
  custom_tags:
    - frombase64string
    - archive
    - powershell
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ AND data_win_eventdata_scriptBlockText:/.*[Mm][Ee][Mm][Oo][Rr][Yy][Ss][Tt][Rr][Ee][Aa][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*[Hh]4[Ss][Ii].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 98767d61-b2e8-4d71-b661-e36783ee24c1
    name: Gzip Archive Decode Via PowerShell
    reason: Same gzip+base64 (H4sI) decode technique seen at process-creation level; the command-line twin of this script-block detection, confirming the loader ran from a powershell.exe command line.
  - id: 20e5497e-331c-4cd5-8d36-935f6e2a9a07
    name: Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell
    reason: Invoke-Obfuscation COMPRESS wraps payloads in DeflateStream/MemoryStream over base64 - the same decompress-in-memory loader pattern, indicating a tooled obfuscation wrapper.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Decompressed gzip bytes are commonly a .NET assembly loaded via Assembly.Load; this is the typical next stage after the decode.
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: Decoded payload may be shellcode that the same script injects via GetProcAddress/VirtualAlloc P/Invoke - fileless execution follow-on.
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Decompressed blob executed as raw shellcode via VirtualAlloc/CreateThread in the same script block family.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The base64 gzip stage is usually fetched by a download cradle first (precursor) or chained to a second-stage download afterwards.
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: Loaders that decode packed payloads in memory often disable AMSI first so the decoded script is not scanned; co-occurring defense evasion.
  - id: 0a99eb3e-1617-41bd-b095-13dc767f3def
    name: HackTool - Jlaive In-Memory Assembly Execution
    reason: Jlaive packers decode a compressed/encrypted .NET payload and run it in memory from a stub, the same gzip-decode-then-execute behaviour.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: In-memory .NET assembly / shellcode loading in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]ssembly\]::[Ll]oad.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Pp]roc[Aa]ddress.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Tt]hread.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal.*[Cc]opy.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ee]xpression.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]eflate[Ss]tream.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Zz]ip[Ss]tream.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell download cradle or AMSI tampering around the decode
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Dd]ata.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Ii]nit[Ff]ailed.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawn with encoded or hidden command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell(_ise)?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ee]ncoded[Cc]ommand.*/ OR data_win_eventdata_commandLine:/.*[Hh]4[Ss][Ii].*/ OR data_win_eventdata_commandLine:/.*[Ww]indow[Ss]tyle +[Hh]idden.*/ OR data_win_eventdata_commandLine:/.* -[Nn]o[Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections or DNS from powershell
    query: ((data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell(_ise)?\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell(_ise)?\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 1h
  - name: Process injection or access into other processes by powershell
    query: ((data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*\\[Pp]ower[Ss]hell(_ise)?\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*\\[Pp]ower[Ss]hell(_ise)?\.[Ee][Xx][Ee]/ AND data_win_eventdata_grantedAccess:("0x1fffff" OR "0x1f3fff" OR "0x143a")) OR (data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell(_ise)?\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*(clrjit|\\[Cc]lr)\.[Dd][Ll][Ll]/))
    pivot_on:
    - host
    window: 1h
