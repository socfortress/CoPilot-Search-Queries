name: Windows PowerShell Get CIMInstance Remote Computer
id: d8c972eb-ed84-431a-8869-ca4bd83257d1
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects use of the Get-CimInstance cmdlet with the -ComputerName parameter,
  indicating an attempt to retrieve WMI/CIM information from a remote computer.
  Adversaries use this technique for lateral movement reconnaissance to gather
  information about remote systems including OS details, running processes,
  installed software, and network configuration. This is a low-risk anomaly
  detection intended for hunting and risk-based alerting.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-CimInstance*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*ComputerName*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators may legitimately use Get-CimInstance with -ComputerName for
  remote system management and monitoring. This is intended as a low-risk
  hunting analytic. Review the remote computer name and user context to
  determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn.microsoft.com/en-us/powershell/module/cimcmdlets/get-ciminstance

response:
  message: >
    PowerShell Get-CimInstance remote computer query detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001
  risk_score: 15
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 15
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Active Directory Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - get_ciminstance
    - wmi
    - remote_access
    - lateral_movement
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-CimInstance.*/ AND data_win_eventdata_scriptBlockText:/.*ComputerName.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-powershell-invoke-cimmethod-cimsession-001
    name: PowerShell Invoke CIMMethod CIMSession
    reason: 'Natural escalation: Get-CimInstance -ComputerName is remote WMI recon, Invoke-CimMethod over a CIMSession (e.g. Win32_Process Create) uses the same WMI channel to execute code on the target.'
  - id: 2a048c14-4634-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via WMI and PowerShell Script Block
    reason: 'Follow-on: after querying a remote host over WMI/CIM the operator spawns a process there via Win32_Process.Create from PowerShell.'
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: Alternate remote-execution path if WMI is filtered; DCOM (MMC20/ShellWindows) from the same PowerShell session that already scouted the target.
  - id: 7d4c618e-4716-11ec-951c-3e22fbd008af
    name: Remote Process Instantiation via WinRM and PowerShell Script Block
    reason: 'Follow-on: operator pivots from CIM queries to WinRM (Invoke-Command/New-PSSession) against the same remote computers.'
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Remote execution via Invoke-Command -ComputerName is the typical next step after enumerating remote hosts with -ComputerName CIM queries.
  - id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
    name: Interactive Session on Remote Endpoint with PowerShell
    reason: Enter-PSSession on the remote computer is the interactive escalation of the same remote-targeted PowerShell activity.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: 'Precursor: PowerView host enumeration (Get-NetComputer) commonly produces the target list later iterated with Get-CimInstance -ComputerName.'
  - id: Windows_Domain_Account_Discovery_Via_Get-NetComputer
    name: Windows Domain Account Discovery Via Get-NetComputer
    reason: 'Precursor: AD computer enumeration supplies the remote hostnames subsequently queried over CIM.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote execution script blocks (Win32_Process, Invoke-Command, PSSession, CimSession, MMC20)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]im[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Pp]rocess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Cc]im[Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Mm][Cc]20.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Sibling remote WMI/CIM and AD host enumeration script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Ww]mi[Oo]bject.*[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]im[Ii]nstance.*[Cc]im[Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et[Cc]omputer.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Cc]omputer.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_([Oo]perating[Ss]ystem|[Cc]omputer[Ss]ystem|[Ss]ervice|[Ll]ogical[Dd]isk|[Nn]etwork[Aa]dapter[Cc]onfiguration).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: PowerShell outbound RPC/WinRM/SMB connections (135, 5985, 5986, 445)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"445")
    pivot_on:
    - host
    window: 2h
  - name: WmiPrvSE / wsmprovhost spawned children (inbound remote execution)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww]mi[Pp]rv[Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ww]sm[Pp]rov[Hh]ost\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Network logons and failed/explicit-credential logons by the acting account
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 4h
