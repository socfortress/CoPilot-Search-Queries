name: MailSniper Invoke Functions
id: a36972c8-b894-11eb-9f78-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of known MailSniper PowerShell functions 
  on a machine. It leverages PowerShell logs (EventID 4104) to identify specific script 
  block text associated with MailSniper activities. This behavior is significant as 
  MailSniper is often used by attackers to harvest sensitive emails from compromised 
  Exchange servers. If confirmed malicious, this activity could lead to unauthorized 
  access to sensitive email data, credential theft, and further compromise of the email 
  infrastructure.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      should:
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-GlobalO365MailSearch*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-GlobalMailSearch*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-SelfSearch*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-PasswordSprayOWA*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-PasswordSprayEWS*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-DomainHarvestOWA*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-UsernameHarvestOWA*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-OpenInboxFinder*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-InjectGEventAPI*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-InjectGEvent*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-SearchGmail*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-MonitorCredSniper*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-AddGmailRule*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-PasswordSprayEAS*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Invoke-UsernameHarvestEAS*"
      minimum_should_match: 1
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with the 
  PowerShell logs from your endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection 
  monitors for 15 known MailSniper function invocations. Validate that 
  data_win_eventdata_scriptBlockText field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  No false positives have been identified at this time. MailSniper functions are 
  specifically designed for malicious email harvesting and should not appear in 
  legitimate PowerShell scripts.

references:
  - https://www.blackhillsinfosec.com/introducing-mailsniper-a-tool-for-searching-every-users-email-for-sensitive-data/
  - https://github.com/dafthack/MailSniper
  - https://attack.mitre.org/techniques/T1114/001/

response:
  message: >
    MailSniper function execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Function: $data_win_eventdata_scriptBlockText$. 
    This indicates email harvesting/credential spraying via MailSniper tool. 
    MITRE ATT&CK: T1114.001
  risk_score: 85
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 85
    - field: data_win_eventdata_user
      type: user
      score: 85
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Data Exfiltration
    - Email Harvesting
    - Credential Theft
  asset_type: Endpoint
  mitre_attack_id:
    - T1114.001
  custom_tags:
    - mailsniper
    - email_harvesting
    - invoke_functions
    - data_exfiltration
    - credential_spraying
    - exchange_exploitation
    - powershell
    - offensive_tool
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Invoke-(GlobalO365MailSearch|GlobalMailSearch|SelfSearch|PasswordSprayOWA|PasswordSprayEWS|DomainHarvestOWA|UsernameHarvestOWA|OpenInboxFinder|InjectGEventAPI|InjectGEvent|SearchGmail|MonitorCredSniper|AddGmailRule|PasswordSprayEAS|UsernameHarvestEAS).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: 'Precursor: MailSniper.ps1 is normally pulled into memory via a download cradle (IEX/COM object) before its Invoke-* functions run.'
  - id: windows-powershell-script-block-with-url-chain-001
    name: PowerShell Script Block With URL Chain
    reason: 'Precursor: a script block chaining URLs shows the tool being fetched from GitHub or a staging host before execution.'
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: 'Precursor: attackers typically blind AMSI in the same PowerShell session before loading offensive modules like MailSniper.'
  - id: 2d10095e-05ae-11ec-8fdf-acde48001122
    name: Exchange PowerShell Module Usage
    reason: 'Co-occurring: MailSniper''s Exchange/mailbox searching is often combined with native Exchange cmdlets for mailbox enumeration and permission changes.'
  - id: 2837e152-93c8-43d2-85ba-c3cd3c2ae614
    name: Powershell Local Email Collection
    reason: 'Follow-on: after global/self mailbox searches the actor collects mail items (Outlook COM or mailbox files) on the same host.'
  - id: 4a241dea-235b-4a7e-8d76-50d817b146c4
    name: Suspicious PowerShell Mailbox Export to Share - PS
    reason: 'Follow-on: harvested mail is staged by exporting mailboxes (New-MailboxExportRequest) to a share, the bulk-theft step after MailSniper discovery.'
  - id: 312d0384-401c-4b8b-abdf-685ffba9a332
    name: Email Exifiltration Via Powershell
    reason: 'Follow-on: harvested mail or results exfiltrated by PowerShell sending email (Send-MailMessage/SMTP) from the same host.'
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: 'Co-occurring: PasswordSpray/GlobalMailSearch need credentials; the actor often dumps credentials with Invoke-Mimikatz in the same session to obtain them.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MailSniper tool retrieval or load (download cradle, ps1 name, Import-Module)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Mm][Aa][Ii][Ll][Ss][Nn][Ii][Pp][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Aa][Ff][Tt][Hh][Aa][Cc][Kk].*/ OR (data_win_eventdata_scriptBlockText:/.*([Ii][Ee][Xx]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]).*/ AND data_win_eventdata_scriptBlockText:/.*([Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Mailbox access, Exchange cmdlets and mail export/permission changes in PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Nn]ew-[Mm]ailbox[Ee]xport[Rr]equest|[Ss]earch-[Mm]ailbox|[Gg]et-[Mm]ailbox|[Aa]dd-[Mm]ailbox[Pp]ermission|[Nn]ew-[Mm]anagement[Rr]ole[Aa]ssignment|[Nn]ew-[Ii]nbox[Rr]ule|[Ss]et-[Mm]ailbox|[Gg]et-[Gg]lobal[Aa]ddress[Ll]ist|[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee][Ww][Ee][Bb][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Mm]icrosoft\.[Ee]xchange\.[Ww]eb[Ss]ervices).*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Outbound connections from PowerShell to mail/auth endpoints (OWA, EWS, EAS, O365, Gmail)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_destinationPort:("443" OR "80" OR "587" OR "25" OR "993" OR "143") AND NOT data_win_eventdata_destinationIp:/(10|127)\..*/)
    pivot_on:
    - host
    window: 1h
  - name: DNS lookups for mail, autodiscover and O365/Google endpoints from the host
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*([Aa]utodiscover|[Oo]utlook\.[Oo]ffice365|[Oo]utlook\.[Oo]ffice|[Ll]ogin\.[Mm]icrosoftonline|[Ll]ogin\.[Mm]icrosoft|[Ee]xchange|[Oo]wa|[Ee]ws|[Ee]as|[Mm]ail\.[Gg]oogle|[Gg]mail|[Gg]oogleapis).*/)
    pivot_on:
    - host
    window: 2h
  - name: Staging and exfil of harvested mail (archives, mail files, bulk uploads)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\.[Pp][Ss][Tt]|\.[Oo][Ss][Tt]|\.[Ee][Mm][Ll]|\.[Mm][Ss][Gg]|\.[Zz][Ii][Pp]|\.7[Zz]|\.[Rr][Aa][Rr]|[Mm][Aa][Ii][Ll].*\.[Tt][Xx][Tt]|[Ss][Ee][Aa][Rr][Cc][Hh].*\.[Cc][Ss][Vv]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr]clone\.[Ee]xe|\\7[Zz]\.[Ee]xe|\\[Ww]in[Rr][Aa][Rr]\.[Ee]xe|\\[Cc]url\.[Ee]xe)/)
    pivot_on:
    - host
    window: 4h
