name: Suspicious X509Enrollment - Ps Script
id: 504d63cb-0dba-4d02-8531-e72981aace2c
version: 1
schema_version: "1.0"
date: "2022-12-23"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 504d63cb-0dba-4d02-8531-e72981aace2c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of X509Enrollment. MITRE ATT&CK: T1553.004.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*X509Enrollment.CBinaryConverter*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*884e2002-217d-11da-b2a4-000e7bbb2b09*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches
  '*X509Enrollment.CBinaryConverter*'; data_win_eventdata_scriptBlockText
  matches '*884e2002-217d-11da-b2a4-000e7bbb2b09*'.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=42
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=41
  - https://learn.microsoft.com/en-us/dotnet/api/microsoft.hpc.scheduler.store.cx509enrollmentwebclassfactoryclass?view=hpc-sdk-5.1.6115
  - https://attack.mitre.org/techniques/T1553/004/

response:
  message: >
    Suspicious X509Enrollment - Ps Script detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1553.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.004
  custom_tags:
    - x509enrollment
    - powershell
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Xx]509[Ee][Nn][Rr][Oo][Ll][Ll][Mm][Ee][Nn][Tt]\.[Cc][Bb][Ii][Nn][Aa][Rr][Yy][Cc][Oo][Nn][Vv][Ee][Rr][Tt][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*884[Ee]2002-217[Dd]-11[Dd][Aa]-[Bb]2[Aa]4-000[Ee]7[Bb][Bb][Bb]2[Bb]09.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: aa7a3fce-bef5-4311-9cc1-5f04bb8c308c
    name: Certificate Exported Via PowerShell - ScriptBlock
    reason: X509Enrollment COM objects are used to build/export certificates; the same script block logging catches the export of the cert/private key that the enrollment produced or targeted.
  - id: ed06725f-6da6-439f-9dcc-ab30e891297c
    name: Windows PowerShell Export PfxCertificate
    reason: 'Follow-on step: after enrolling or locating a cert, the actor exports it with its private key as a PFX for reuse off-host.'
  - id: 5e38ded4-c964-41f4-8cb6-4a1a53c6929f
    name: Windows PowerShell Export Certificate
    reason: Co-occurring cert-handling script activity; export of certificate material in the same session as the X509Enrollment call.
  - id: 42821614-9264-4761-acfc-5772c3286f76
    name: Root Certificate Installed - PowerShell
    reason: X509Enrollment CBinaryConverter is commonly used to decode a base64 blob into a certificate that is then installed in a trusted root store (T1553.004 subversion of trust).
  - id: d223b46b-5621-4037-88fe-fda32eead684
    name: New Root or CA or AuthRoot Certificate to Store
    reason: Registry-level confirmation that the script actually wrote a new certificate into the Root/CA/AuthRoot store on the host.
  - id: f533ca6c-9440-4686-80cb-7f294c07812a
    name: Detect Certify With PowerShell Script Block Logging
    reason: Certificate enrollment via COM is the same primitive used by ADCS abuse tooling (Certify/Certipy-style requests); co-firing indicates AD CS abuse for credential or persistence.
  - id: f8b482f4-6d62-49fa-a905-dfa15698317b
    name: Windows PowerShell Cryptography Namespace
    reason: Scripts using System.Security.Cryptography alongside X509Enrollment indicate certificate/key generation or decoding in the same script.
  - id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
    name: DPAPI Backup Keys And Certificate Export Activity IOC
    reason: File-level evidence of certificate or key material (pfx/p12/pvk) being written, the likely output of enrollment/export scripting.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certificate export / PFX / root-store install in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ee]xport-[Pp]fx[Cc]ertificate.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xport-[Cc]ertificate.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]ert:.*[Rr]oot.*/ OR data_win_eventdata_scriptBlockText:/.*[Xx]509[Ss]tore.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]mport-[Pp]fx[Cc]ertificate.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xport[Pp]rivate[Kk]ey.*/)
    pivot_on:
    - host
    window: 1h
  - name: Certificate / key files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.([Pp][Ff][Xx]|[Pp]12|[Pp][Vv][Kk]|[Cc][Ee][Rr]|[Cc][Rr][Tt]|[Pp][Ee][Mm]|[Kk][Ee][Yy])/)
    pivot_on:
    - host
    window: 1h
  - name: Root/CA/AuthRoot certificate store registry modification
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ss][Ys][Ss][Tt][Ee][Mm][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]\\([Rr][Oo][Oo][Tt]|[Cc][Aa]|[Aa][Uu][Tt][Hh][Rr][Oo][Oo][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: certutil / certmgr / certreq / Certify process activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Cc][Ee][Rr][Tt][Mm][Gg][Rr]|[Cc][Ee][Rr][Tt][Rr][Ee][Qq]|[Cc][Ee][Rr][Tt][Ii][Ff][Yy])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Aa]dd[Ss]tore|-[Ee]xport[Pp][Ff][Xx]|-[Dd]ecode|-[Uu]rl[Cc]ache|[Cc]ertify).*/)
    pivot_on:
    - host
    window: 2h
