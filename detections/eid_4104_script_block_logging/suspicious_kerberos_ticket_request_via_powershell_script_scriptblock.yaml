name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
id: a861d835-af37-4930-bcd6-5b178bfb54df
version: 1
schema_version: "1.0"
date: "2025-11-18"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a861d835-af37-4930-bcd6-5b178bfb54df
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell scripts that utilize native PowerShell Identity modules to
  request Kerberos tickets. This behavior is typically seen during a Kerberos or
  silver ticket attack. A successful execution will output the SPNs for the
  endpoint in question. MITRE ATT&CK: T1558.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*System.IdentityModel.Tokens.KerberosRequestorSecurityToken*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.GetRequest()*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches
  '*System.IdentityModel.Tokens.KerberosRequestorSecurityToken*';
  data_win_eventdata_scriptBlockText matches '*.GetRequest()*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1558.003/T1558.003.md#atomic-test-4---request-a-single-ticket-via-powershell
  - https://learn.microsoft.com/en-us/dotnet/api/system.identitymodel.tokens.kerberosrequestorsecuritytoken?view=netframework-4.8.1
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    detected on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1558.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - kerberos
    - ticket
    - request
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy][Mm][Oo][Dd][Ee][Ll]\.[Tt][Oo][Kk][Ee][Nn][Ss]\.[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss][Rr][Ee][Qq][Uu][Ee][Ss][Tt][Oo][Rr][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Tt][Oo][Kk][Ee][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Gg][Ee][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt]\(\).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Same Kerberoasting TGS-request behaviour via command line instead of script block; shows the same operator using another tooling path on the host
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration is the precursor that selects which service accounts get a KerberosRequestorSecurityToken requested
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD reconnaissance that identifies Kerberoastable accounts and attack paths before tickets are requested
  - id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
    name: Uncommon Outbound Kerberos Connection
    reason: Non-system process talking to a KDC on port 88 is the network footprint of the PowerShell TGS request
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Same 4104 telemetry; Invoke-Mimikatz kerberos::list/export commonly follows to extract the requested tickets from memory
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: In-memory Mimikatz loaded via PowerShell is the usual way requested service tickets are exported for offline cracking or reuse
  - id: 9e099d99-44c2-42b6-a6d8-54c3545cab29
    name: HackTool - Mimikatz Kirbi File Creation
    reason: .kirbi files are exported Kerberos tickets, the direct artifact of ticket extraction after the request
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: Pass-the-ticket is the follow-on use of stolen/forged Kerberos tickets for lateral movement
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell SPN/AD enumeration script blocks (Kerberoast precursor)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Uu][Ss][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: setspn / ticket tooling process launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Rr][Uu][Bb][Ee][Uu][Ss]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::|[Kk][Ll][Ii][Ss][Tt]|[Gg][Ee][Tt][Uu][Ss][Ee][Rr][Ss][Pp][Nn][Ss]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberos port 88 connections from non-system processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88" AND NOT data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Kerberos ticket export / Kirbi or ccache file writes
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Cc][Aa][Cc][Hh][Ee]/ OR data_win_eventdata_targetFilename:/.*([Hh][Aa][Ss][Hh][Cc][Aa][Tt]|[Kk][Ee][Rr][Bb][Rr][Oo][Aa][Ss][Tt]|[Tt][Gg][Ss]_[Hh][Aa][Ss][Hh]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Mimikatz-style kerberos commands in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Aa][Ss][Ss]-[Tt][Hh][Ee]-[Tt][Ii][Cc][Kk][Ee][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)
    pivot_on:
    - host
    window: 4h
