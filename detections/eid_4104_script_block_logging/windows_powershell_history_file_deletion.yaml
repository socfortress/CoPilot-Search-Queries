name: Windows Powershell History File Deletion
id: f1369394-48e1-4327-bf6d-14377f4b8687
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects PowerShell commands that delete the PowerShell command history file
  using Remove-Item targeting .HistorySavePath. PowerShell stores command history
  in ConsoleHost_history.txt under the user's profile directory. Adversaries
  delete this file to remove evidence of executed commands, hindering forensic
  investigation and incident response. This technique is used by Medusa Ransomware
  and other threat actors for post-exploitation cleanup.
  
data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Remove-Item*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*.HistorySavePath*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators may occasionally clear PowerShell history for privacy or
  maintenance purposes. Frequent or automated deletions should be investigated
  for potential defense evasion activity.

references:
  - https://attack.mitre.org/techniques/T1059/003/
  - https://attack.mitre.org/techniques/T1070/003/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-071a

response:
  message: >
    PowerShell history file deletion detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.003, T1070.003
  risk_score: 20
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 20
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Medusa Ransomware
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
    - T1070.003
  custom_tags:
    - history_deletion
    - anti_forensics
    - defense_evasion
    - powershell_history
    - medusa_ransomware
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Remove-Item.*/ AND data_win_eventdata_scriptBlockText:/.*\.HistorySavePath.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f4ff7323-b5fc-4323-8b52-6b9408e15788
    name: Potential PowerShell Console History Access Attempt via History File
    reason: Attacker reads ConsoleHost_history.txt to harvest credentials/commands before deleting it; read-then-delete of the same file on the same host
  - id: windows-eventlog-cleared-wevtutil-001
    name: Windows Eventlog Cleared Via Wevtutil
    reason: History deletion is one step of post-exploitation anti-forensic cleanup; event log clearing is the usual companion on the same host
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Co-occurring log tampering confirms deliberate evidence removal rather than admin privacy cleanup
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Medusa-style ransomware cleans history then deletes shadow copies to block recovery just before encryption
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Recovery-inhibit step that follows cleanup in the ransomware pre-encryption sequence
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: Backup destruction alongside history wiping indicates ransomware impact preparation on the host
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Defense impairment by the same operator in the same PowerShell session before or after hiding command history
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: PsExec-driven remote PowerShell is how operators reach hosts where they then delete history; lateral movement precursor
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerShell history file access or deletion commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc]onsole[Hh]ost_[Hh]istory|PSReadLine|[Hh]istory[Ss]ave[Pp]ath).*/
    pivot_on:
    - host
    window: 2h
  - name: ConsoleHost_history.txt file deletion events
    query: data_win_system_eventID:"23" AND data_win_eventdata_targetFilename:/.*[Cc]onsole[Hh]ost_[Hh]istory\.txt/
    pivot_on:
    - host
    window: 2h
  - name: Event log clearing and recovery inhibition commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*( cl | clear-log).*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd]elete.*[Ss]hadows.*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Rr]ecovery[Ee]nabled|[Ii]gnoreallfailures).*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell script blocks disabling Defender or bypassing AMSI
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss]et-[Mm]p[Pp]reference.*[Dd]isable.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Mm]p[Pp]reference.*[Ee]xclusion.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Ii]nit[Ff]ailed.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/)
    pivot_on:
    - host
    window: 2h
  - name: PsExec or remote service execution preceding cleanup
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Ss][Ee][Xx][Ee][Cc].*\.exe/ OR data_win_eventdata_parentImage:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.exe/ OR data_win_eventdata_commandLine:/.*[Aa]ccepteula.*/)
    pivot_on:
    - host
    window: 6h
