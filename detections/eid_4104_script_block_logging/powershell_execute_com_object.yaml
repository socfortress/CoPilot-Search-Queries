name: PowerShell Execute COM Object
id: windows-powershell-com-clsid-execution-001
version: 1
schema_version: "1.0"
date: "2026-04-06"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of a COM CLSID through PowerShell via Script Block Logging 
  (EventCode 4104). This technique uses [type]::GetTypeFromCLSID to instantiate COM 
  objects and is commonly employed by adversaries and malware such as Conti ransomware 
  for command execution, privilege escalation, and User Account Control (UAC) bypass. 
  If confirmed malicious, this could allow attackers to gain elevated privileges or 
  persist within the environment.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*CreateInstance*CLSID*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel 
  configured as an eventchannel source.

known_false_positives: >
  Legitimate automation frameworks or administrative tools may use COM object 
  instantiation. Filter based on user context, source script path, and specific 
  COM CLSIDs being invoked. Focus on high-risk CLSIDs commonly associated with 
  credential theft or system execution.

references:
  - https://attack.mitre.org/techniques/T1546/015/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html

response:
  message: >
    PowerShell COM CLSID execution detected on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_system_user$. 
    MITRE ATT&CK: T1546.015, T1059.001
  risk_score: 85
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 85
  threat_objects: []

tags:
  analytic_story:
    - Data Destruction
    - Ransomware
    - WhisperGate
    - Malicious PowerShell
    - Hermetic Wiper
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.015
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*GetTypeFromCLSID.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 49f2f17b-b4c8-4172-a68b-d5bf95d05130
    name: UAC Bypass via ICMLuaUtil
    reason: GetTypeFromCLSID + CreateInstance is the canonical way PowerShell instantiates the elevated ICMLuaUtil COM moniker (Conti-style UAC bypass); this process-creation rule confirms an elevated child spawned via the auto-elevated COM object
  - id: 4b60e6f2-bf39-47b4-b4ea-398e33cfe253
    name: CMSTP UAC Bypass via COM Object Access
    reason: Alternate COM-based UAC bypass (CMSTP Lua COM interface); an attacker who fails or chains after CLSID instantiation in PowerShell may use this to obtain elevation
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: 'Same 4104 telemetry: COM objects (MsXml2/WinHttp) used from the same script to pull a payload, a common next stage after COM object instantiation'
  - id: 78aa1347-1517-4454-9982-b338d6df8343
    name: Powershell MsXml COM Object
    reason: 'Co-occurring COM-object abuse in script blocks: MSXML COM used for fileless download/execution within the same PowerShell session'
  - id: ea61e291-af05-4716-932a-67faddb6ae6f
    name: PowerShell COM Hijacking InProcServer32 Modification
    reason: 'Persistence follow-on: after proving COM CLSID abuse, the actor may hijack a CLSID InProcServer32 to load a DLL on every COM activation'
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: Lateral movement via DCOM objects (MMC20/ShellWindows) instantiated from PowerShell; same CLSID/ProgID instantiation primitive used to pivot to other hosts
  - id: 907ac95c-4dd9-11ec-ba2c-acde48001122
    name: PowerShell Windows Defender Exclusion Commands
    reason: 'Post-elevation defense evasion: once UAC bypass yields admin, ransomware operators (Conti) typically add Defender exclusions in PowerShell'
  - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
    name: Delete ShadowCopy With PowerShell
    reason: 'Impact stage of the Conti/ransomware chain this rule is cited for: elevated PowerShell deleting shadow copies shortly after privilege escalation'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Elevated process spawned by auto-elevated COM host (dllhost/cmstplua) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Cc][Mm][Ss][Tt][Pp][Ll][Uu][Aa].*/ OR data_win_eventdata_parentCommandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{.*/) AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: COM-based UAC bypass elevation moniker / auto-elevate strings in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ee][Ll][Ee][Vv][Aa][Tt][Ii][Oo][Nn]:[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr]!new:.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Cc][Mm][Ll][Uu][Aa][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*3[Ee]5[Ff][Cc]7[Ff]9-9[Aa]51-4367-9063-[Aa]120244[Ff][Bb][Ee][Cc]7.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*[Cc][Mm][Ss][Tt][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc][Uu][Tt][Ee].*[Rr][Uu][Nn][Aa][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Defender tampering and shadow copy destruction following elevation
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: COM CLSID registry hijack or persistence written on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Ll][Ss][Ii][Dd]\\.*(\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32|\\[Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ee][Rr]32|\\[Tt][Rr][Ee][Aa][Tt][Aa][Ss]).*/
    pivot_on:
    - host
    window: 2h
  - name: Encoded, download-cradle or reflective-load script blocks in same session
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Xx][Mm][Ll]2\.[Xx][Mm][Ll][Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Hh][Tt][Tt][Pp][Rr][Ee][Qq].*/)
    pivot_on:
    - host
    window: 1h
