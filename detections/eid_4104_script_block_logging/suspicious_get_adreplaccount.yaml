name: Suspicious Get-ADReplAccount
id: 060c3ef1-fd0a-4091-bf46-e7d625f60b73
version: 1
schema_version: "1.0"
date: "2022-02-06"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 060c3ef1-fd0a-4091-bf46-e7d625f60b73
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The DSInternals PowerShell Module exposes several internal features of Active
  Directory and Azure Active Directory. These include FIDO2 and NGC key
  auditing, offline ntds.dit file manipulation, password auditing, DC recovery
  from IFM backups and password hash calculation. MITRE ATT&CK: T1003.006.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Get-ADReplAccount*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-All *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-Server *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-ADReplAccount*';
  data_win_eventdata_scriptBlockText matches '*-All *';
  data_win_eventdata_scriptBlockText matches '*-Server *'.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://www.powershellgallery.com/packages/DSInternals
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.006/T1003.006.md#atomic-test-2---run-dsinternals-get-adreplaccount
  - https://attack.mitre.org/techniques/T1003/006/

response:
  message: >
    Suspicious Get-ADReplAccount detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1003.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.006
  custom_tags:
    - adreplaccount
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Rr][Ee][Pp][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*-[Aa][Ll][Ll] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Ss][Ee][Rr][Vv][Ee][Rr] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c99737c-585d-4431-b61a-c911d86ff32f
    name: Powerview Add-DomainObjectAcl DCSync AD Extend Right
    reason: Get-ADReplAccount is a DCSync via DRSUAPI; granting DS-Replication-Get-Changes rights to an account is the usual precursor that makes this replication call permitted
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: AD reconnaissance (finding DCs, privileged accounts) via PowerView in script blocks typically precedes targeted domain replication of credentials
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: Same objective (replicating secrets from a DC); 4662 replication-rights access on the DC confirms the DSInternals call actually reached the domain controller
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Attackers often alternate DSInternals with Invoke-Mimikatz lsadump::dcsync in the same PowerShell session for the same credential-theft goal
  - id: 6f535e01-ca1f-40be-ab8d-45b19c0c8b7f
    name: Import LDAP Data Interchange Format File Via Ldifde.EXE
    reason: Alternate living-off-the-land AD data extraction used alongside replication-based credential dumping
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Offline alternative for the same ntds.dit hashes; DSInternals is also used to read an ntds.dit/IFM copy, so both on one DC are a single dumping chain
  - id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
    name: NTDS.DIT Creation By Uncommon Parent Process
    reason: ntds.dit copy created for offline parsing with DSInternals Get-ADDBAccount, the file-based sibling of Get-ADReplAccount
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: 'Follow-on credential abuse: harvested krbtgt/service account hashes feed ticket forging and roasting activity against the domain'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NTDS.dit / IFM / shadow-copy extraction on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ff][Mm].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other DSInternals / DCSync tooling in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Dd][Bb][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Rr][Ee][Pp][Ll][Bb][Aa][Cc][Kk][Uu][Pp][Kk][Ee][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Nn][Vv][Ee][Rr][Tt][Tt][Oo]-[Nn][Tt][Hh][Aa][Ss][Hh].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)
    pivot_on:
    - host
    window: 2h
  - name: Hash staging, archiving and exfil after replication dump
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\7[Zz]\.[Ee][Xx][Ee]|\\7[Zz][Aa]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(([Oo][Uu][Tt]-[Ff][Ii][Ll][Ee])|([Ee][Xx][Pp][Oo][Rr][Tt]-[Cc][Ss][Vv])|([Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt])).*([Nn][Tt][Hh][Aa][Ss][Hh]|[Hh][Aa][Ss][Hh]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Pass-the-hash / network logons by the account that ran the dump
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
  - name: Credential-access tools and LSASS access on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
