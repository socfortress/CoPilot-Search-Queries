name: Silence.EDA Detection
id: 3ceb2083-a27f-449a-be33-14ec1b7cc973
version: 1
schema_version: "1.0"
date: "2023-04-03"
author: Alina Stepchenkova, Group-IB, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ceb2083-a27f-449a-be33-14ec1b7cc973
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Silence EmpireDNSAgent as described in the Group-IP report. MITRE
  ATT&CK: T1059.001, T1071.004, T1572, T1529.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*System.Diagnostics.Process*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Stop-Computer*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Restart-Computer*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Exception in execution*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*$cmdargs*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Close-Dnscat2Tunnel*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*set type=$LookupType`nserver*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*$Command | nslookup 2>&1 | Out-String*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-RandomDNSField*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*[Convert]::ToString($SYNOptions, 16)*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*$Session.Dead = $True*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*$Session[\"Driver\"] -eq*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*System.Diagnostics.Process*';
  data_win_eventdata_scriptBlockText matches '*Stop-Computer*';
  data_win_eventdata_scriptBlockText matches '*Restart-Computer*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.group-ib.com/resources/threat-research/silence_2.0.going_global.pdf
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1071/004/
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1529/

response:
  message: >
    Silence.EDA Detection detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001, T1071.004,
    T1572, T1529
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1071.004
    - T1572
    - T1529
  custom_tags:
    - silence
    - powershell
    - execution
    - command_and_control
    - impact
    - g0091
    - s0363
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Oo][Pp]-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ss][Tt][Aa][Rr][Tt]-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Ee][Xx][Cc][Ee][Pp][Tt][Ii][Oo][Nn] [Ii][Nn] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*\$[Cc][Mm][Dd][Aa][Rr][Gg][Ss].*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Oo][Ss][Ee]-[Dd][Nn][Ss][Cc][Aa][Tt]2[Tt][Uu][Nn][Nn][Ee][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt] [Tt][Yy][Pp][Ee]=\$[Ll][Oo][Oo][Kk][Uu][Pp][Tt][Yy][Pp][Ee]`[Nn][Ss][Ee][Rr][Vv][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*\$[Cc][Oo][Mm][Mm][Aa][Nn][Dd] \| [Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp] 2\>\&1 \| [Oo][Uu][Tt]-[Ss][Tt][Rr][Ii][Nn][Gg].*/ AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Rr][Aa][Nn][Dd][Oo][Mm][Dd][Nn][Ss][Ff][Ii][Ee][Ll][Dd].*/ AND data_win_eventdata_scriptBlockText:/.*\[[Cc][Oo][Nn][Vv][Ee][Rr][Tt]\]::[Tt][Oo][Ss][Tt][Rr][Ii][Nn][Gg]\(\$[Ss][Yy][Nn][Oo][Pp][Tt][Ii][Oo][Nn][Ss], 16\).*/ AND data_win_eventdata_scriptBlockText:/.*\$[Ss][Ee][Ss][Ss][Ii][Oo][Nn]\.[Dd][Ee][Aa][Dd] = \$[Tt][Rr][Uu][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*\$[Ss][Ee][Ss][Ss][Ii][Oo][Nn]\[\"[Dd][Rr][Ii][Vv][Ee][Rr]\"\] -[Ee][Qq].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d59d7842-9a21-4bc6-ba98-64bfe0091355
    name: Powershell DNSExfiltration
    reason: EmpireDNSAgent/dnscat2 tunnels data over DNS from PowerShell; same script-block channel and same DNS C2 mechanism, often co-fires
  - id: 2452e632-9e0d-11eb-bacd-acde48001122
    name: DNS Exfiltration Using Nslookup App
    reason: The agent pipes commands to nslookup.exe to carry its DNS tunnel; process-level view of the same nslookup-based C2 traffic
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: dnscat2-style DNS tunneling tooling launched alongside or after the PowerShell agent confirms a DNS C2 channel
  - id: 1b3b01c7-84e9-4072-86e5-fc285a41ff23
    name: Nslookup PowerShell Download Cradle - ProcessCreation
    reason: nslookup used by PowerShell to fetch staged payload content via DNS TXT, the loader/stager step preceding or accompanying the agent
  - id: bc1dc6b8-c954-11eb-bade-acde48001122
    name: Detect Empire with PowerShell Script Block Logging
    reason: The Silence agent is an Empire-derived PowerShell implant; Empire stager/module script blocks on the same host corroborate the framework
  - id: 79f4ede3-402e-41c8-bc3e-ebbf5f162581
    name: HackTool - Empire PowerShell Launch Parameters
    reason: Empire-style powershell.exe launch flags are the typical way the implant is started, a direct precursor to the 4104 agent script block
  - id: 56c217c3-2de2-479b-990f-5c109ba8458f
    name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
    reason: Empire persistence via scheduled task so the DNS agent survives reboot, follow-on to agent deployment
  - id: 34ebb878-1b15-4895-b352-ca2eeb99b274
    name: Suspicious Execution of Shutdown
    reason: The agent embeds Stop-Computer/Restart-Computer operator commands (impact, T1529); shutdown/reboot activity on the host is the destructive follow-on
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: nslookup spawned by PowerShell or script host (DNS tunnel transport)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]).*/
    pivot_on:
    - host
    window: 2h
  - name: Other PowerShell script blocks with DNS tunnel or Empire agent markers
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*nslookup* OR data_win_eventdata_scriptBlockText:*Resolve-DnsName* OR data_win_eventdata_scriptBlockText:*dnscat* OR data_win_eventdata_scriptBlockText:*EmpireDNS* OR data_win_eventdata_scriptBlockText:*DnsClient* OR data_win_eventdata_scriptBlockText:*GetHostEntry*)
    pivot_on:
    - host
    window: 4h
  - name: Host shutdown or restart executed (impact stage)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\/[SsRrPp]|-[SsRrPp]).*/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Stop-Computer* OR data_win_eventdata_scriptBlockText:*Restart-Computer*))
    pivot_on:
    - host
    window: 2h
  - name: Persistence created by PowerShell for the agent (scheduled task, run key, WMI)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*\/[Cc][Rr][Ee][Aa][Tt][Ee]*) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*\CurrentVersion\Run*) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Register-ScheduledTask* OR data_win_eventdata_scriptBlockText:*New-ScheduledTask* OR data_win_eventdata_scriptBlockText:*__EventFilter*))
    pivot_on:
    - host
    window: 4h
  - name: Suspicious PowerShell launch flags or encoded stager that started the agent
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*-[Ee][Nn][Cc]* OR data_win_eventdata_commandLine:*-[Nn][Oo][Pp]* OR data_win_eventdata_commandLine:*[Hh][Ii][Dd][Dd][Ee][Nn]* OR data_win_eventdata_commandLine:*[Bb][Yy][Pp][Aa][Ss][Ss]*)
    pivot_on:
    - host
    window: 2h
