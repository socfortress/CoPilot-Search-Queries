name: Get-WmiObject Win32_UserAccount with PowerShell Script Block
id: 640b0eda-0429-11ec-accd-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  The following analytic detects the execution of the `Get-WmiObject` cmdlet with the 
  `Win32_UserAccount` parameter via PowerShell Script Block Logging (EventID 4104). This 
  method leverages script block text to identify when a list of all local users is being 
  enumerated. This activity is significant as it may indicate an adversary or Red Team 
  operation attempting to gather user information for situational awareness and Active 
  Directory discovery. If confirmed malicious, this could lead to further reconnaissance, 
  privilege escalation, or lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-WmiObject*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Win32_UserAccount*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-WmiObject cmdlet with Win32_UserAccount WMI class. 
  Validate that data_win_eventdata_scriptBlockText field is being populated in 
  Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerShell cmdlet for legitimate 
  troubleshooting and user enumeration purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1087/001/
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html
  - https://docs.microsoft.com/en-us/windows/win32/cimwin32prov/win32-useraccount

response:
  message: >
    Get-WmiObject Win32_UserAccount query detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates local user account enumeration/reconnaissance activity. 
    MITRE ATT&CK: T1087.001, T1059.001
  risk_score: 38
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 38
    - field: data_win_eventdata_user
      type: user
      score: 38
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Winter Vivern
    - Active Directory Discovery
    - Malicious PowerShell
    - User Account Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.001
    - T1059.001
  custom_tags:
    - get_wmiobject
    - win32_useraccount
    - user_account_enumeration
    - local_users
    - wmi_query
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-WmiObject.*/ AND data_win_eventdata_scriptBlockText:/.*Win32_UserAccount.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b44f6ac6-0429-11ec-87e9-acde48001122
    name: GetWmiObject User Account with PowerShell
    reason: Same Win32_UserAccount enumeration seen as a Sysmon process-creation command line; confirms the script block was launched from a visible powershell.exe and gives parent process.
  - id: 2e891cbe-0426-11ec-9c9c-acde48001122
    name: Get-LocalUser with PowerShell Script Block
    reason: Attackers commonly run several local-user enumeration cmdlets back to back (Get-LocalUser alongside WMI) when building a target list.
  - id: fabd364e-04f3-11ec-b34b-acde48001122
    name: Get-WmiObject Ds_User with PowerShell Script Block
    reason: Escalation of the same WMI technique from local accounts (Win32_UserAccount) to domain users (ds_user).
  - id: 69df7f7c-155d-11ec-a055-acde48001122
    name: Get-WMIObject Group Discovery with Script Block Logging
    reason: 'Follow-on step: after listing accounts the operator maps group membership (admins) with the same WMI cmdlet.'
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: PowerView-style domain user discovery commonly follows local account enumeration as recon widens to AD.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Net.exe user/group commands are the co-occurring native-tool recon that accompanies scripted account discovery.
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Account enumeration is a prelude to lateral movement; remote PowerShell execution on other hosts is the likely next action.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Identified accounts feed credential theft; in-memory Mimikatz/Invoke-Mimikatz via PowerShell is a typical subsequent step.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other account/group/domain enumeration cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Ll]ocal[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Ll]ocal[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Aa][Dd][Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss]earcher.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Ll]ogged[Oo]n[Ss]ession.*/)
    pivot_on:
    - host
    window: 1h
  - name: Native recon binaries (net/whoami/wmic/quser) on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn]et1?|[Ww]hoami|[Ww]mic|[Qq]user|[Nn]ltest|[Dd]squery)\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:*user* OR data_win_eventdata_commandLine:*group* OR data_win_eventdata_commandLine:*useraccount* OR data_win_eventdata_commandLine:*\/all* OR data_win_eventdata_commandLine:*\/priv* OR data_win_eventdata_commandLine:*domain_trusts*)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawned by unusual parent or with encoded/hidden arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*\\([Ww]mi[Pp]rv[Ss][Ee]|[Ww]inword|[Ee]xcel|[Mm]shta|[Ww]script|[Cc]script|[Rr]egsvr32|[Rr]undll32|[Ww]inrm)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*-enc* OR data_win_eventdata_commandLine:*-EncodedCommand* OR data_win_eventdata_commandLine:*-w*hidden* OR data_win_eventdata_commandLine:*-nop*)
    pivot_on:
    - host
    window: 2h
  - name: Credential access or remote execution follow-on in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ekurlsa.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]mi[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]iniDumpWriteDump.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Ss][Pp][Nn]/ OR data_win_eventdata_scriptBlockText:/.*[Kk]erberoast.*/)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell/WMI process outbound network and DNS activity
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh|[Ww]mic)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true") OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
