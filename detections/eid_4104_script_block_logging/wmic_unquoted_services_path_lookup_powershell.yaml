name: WMIC Unquoted Services Path Lookup - PowerShell
id: 09658312-bc27-4a3b-91c5-e49ab9046d1b
version: 1
schema_version: "1.0"
date: "2022-11-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 09658312-bc27-4a3b-91c5-e49ab9046d1b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects known WMI recon method to look for unquoted service paths, often used
  by pentest inside of powershell scripts attackers enum scripts. MITRE ATT&CK:
  T1047.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-WmiObject *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*gwmi *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "* Win32_Service *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Name*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*DisplayName*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*PathName*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*StartMode*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-WmiObject *';
  data_win_eventdata_scriptBlockText matches '*gwmi *';
  data_win_eventdata_scriptBlockText matches '* Win32_Service *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/nccgroup/redsnarf/blob/35949b30106ae543dc6f2bc3f1be10c6d9a8d40e/redsnarf.py
  - https://github.com/S3cur3Th1sSh1t/Creds/blob/eac23d67f7f90c7fc8e3130587d86158c22aa398/PowershellScripts/jaws-enum.ps1
  - https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    WMIC Unquoted Services Path Lookup - PowerShell detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - unquoted
    - services
    - lookup
    - powershell
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ww][Mm][Ii][Oo][Bb][Jj][Ee][Cc][Tt] .*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ww][Mm][Ii] .*/) AND data_win_eventdata_scriptBlockText:/.* [Ww][Ii][Nn]32_[Ss][Ee][Rr][Vv][Ii][Cc][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*[Nn][Aa][Mm][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Pp][Ll][Aa][Yy][Nn][Aa][Mm][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Pp][Aa][Tt][Hh][Nn][Aa][Mm][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt][Mm][Oo][Dd][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 68bcd73b-37ef-49cb-95fc-edc809730be6
    name: Potential Unquoted Service Path Reconnaissance Via Wmic.EXE
    reason: Same unquoted-service-path hunt done via wmic.exe instead of PowerShell; the same enumeration attempted through a second tool on the host
  - id: 95afc12e-3cbb-40c3-9340-84a032e596a3
    name: Service Registry Permissions Weakness Check
    reason: 'Companion check in privesc enum scripts (jaws-enum, PowerUp style): after listing service paths, scripts test service registry key ACLs for writability'
  - id: c484e533-ee16-4a93-b6ac-f0ea4868b2f1
    name: HackTool - SharpUp PrivEsc Tool Execution
    reason: SharpUp is the compiled equivalent of this enumeration (unquoted paths, modifiable services); co-occurs when the operator moves from scripts to a tool
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: 'Follow-on exploitation: sc config of a service found weak during enumeration to point at an attacker binary'
  - id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
    name: Potential Privilege Escalation via Service Permissions Weakness
    reason: Follow-on exploitation of weak service permissions identified by the same recon
  - id: 138d3531-8793-4f50-a2cd-f291b2863d78
    name: Suspicious Service Path Modification
    reason: Attacker rewrites a service ImagePath/binPath discovered in the PathName listing to hijack it for privilege escalation
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: 'Result of service hijack: a service whose binary resides in a user-writable or odd directory, planted after finding an unquoted path'
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: 'Alternative escalation/persistence step after service enumeration: attacker registers a new service as SYSTEM'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service binPath / ImagePath tampering via sc.exe or reg.exe
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:*\\sc.exe AND (data_win_eventdata_commandLine:*config* OR data_win_eventdata_commandLine:*create*) AND data_win_eventdata_commandLine:*binpath*) OR (data_win_eventdata_image:*\\reg.exe AND data_win_eventdata_commandLine:*ImagePath* AND data_win_eventdata_commandLine:*Services*))
    pivot_on:
    - host
    window: 4h
  - name: Service ImagePath registry value written
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:*CurrentControlSet\\Services\\*\\ImagePath
    pivot_on:
    - host
    window: 4h
  - name: Executable dropped at unquoted-path hijack locations
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/C:\\Program\.exe/ OR data_win_eventdata_targetFilename:/C:\\Program Files\\[^\\]+\.exe/ OR data_win_eventdata_targetFilename:/C:\\Program Files \(x86\)\\[^\\]+\.exe/)
    pivot_on:
    - host
    window: 4h
  - name: Other privesc enumeration script blocks (PowerUp, service ACLs, AlwaysInstallElevated)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-ServiceUnquoted* OR data_win_eventdata_scriptBlockText:*Get-ModifiableService* OR data_win_eventdata_scriptBlockText:*Invoke-AllChecks* OR data_win_eventdata_scriptBlockText:*Invoke-ServiceAbuse* OR data_win_eventdata_scriptBlockText:*PowerUp* OR data_win_eventdata_scriptBlockText:*AlwaysInstallElevated* OR data_win_eventdata_scriptBlockText:*Get-ServiceAcl*)
    pivot_on:
    - host
    window: 2h
  - name: Service control and new service installs after enumeration
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") OR (data_win_system_eventID:"1" AND data_win_eventdata_image:*\\sc.exe AND (data_win_eventdata_commandLine:* start *OR data_win_eventdata_commandLine:* stop *))
    pivot_on:
    - host
    window: 2h
