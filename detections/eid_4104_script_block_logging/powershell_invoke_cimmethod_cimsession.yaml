name: PowerShell Invoke CIMMethod CIMSession
id: windows-powershell-invoke-cimmethod-cimsession-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the creation of a New-CIMSession cmdlet followed by the use of the 
  Invoke-CIMMethod cmdlet within PowerShell. It leverages PowerShell Script Block 
  Logging (EventCode 4104) to identify these specific cmdlets in the ScriptBlockText 
  field. This activity is significant because it mirrors the behavior of the 
  Invoke-WMIMethod cmdlet, often used for remote code execution via NTLMv2 
  pass-the-hash authentication. If confirmed malicious, this could allow an attacker 
  to execute commands remotely, potentially leading to unauthorized access and control 
  over targeted systems.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*invoke-CIMMethod*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*New-CimSession*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  False positives may be present based on third-party applications or administrators 
  using CIM for legitimate remote administration. It is recommended to apply 
  appropriate filters based on user context and target systems to minimize false 
  positives.

references:
  - https://attack.mitre.org/techniques/T1047/
  - https://learn.microsoft.com/en-us/powershell/module/cimcmdlets/invoke-cimmethod
  - https://www.splunk.com/en_us/blog/security/powershell-detections-threat-research-release-august-2021.html

response:
  message: >
    PowerShell CIM method invocation detected on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Scattered Lapsus$ Hunters
    - Malicious PowerShell
    - Active Directory Lateral Movement
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Invoke-CimMethod.*/ OR data_win_eventdata_scriptBlockText:/.*New-CimSession.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Invoke-CimMethod Win32_Process Create run over a CIM session lands on the target as WmiPrvSE.exe spawning a shell; this is the receiving-side proof of the same remote execution
  - id: 24869767-8579-485d-9a4f-d9ddfd8f0cac
    name: Process Execution via WMI
    reason: Invoke-CimMethod is the WMI-equivalent of Win32_Process.Create; this catches the resulting process creation through WMI
  - id: 526be59f-a573-4eea-b5f7-f0973207634d
    name: Process Creation Attempt via Wmic.EXE
    reason: Same Win32_Process Create primitive via wmic; attackers alternate between CIM cmdlets and wmic on the same host
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: wmiexec-style WMI remote execution with stolen NTLM hash is the same pass-the-hash use case the CIM session cmdlets replicate
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: New-CimSession defaults to WSMan/WinRM; wsmprovhost.exe on the target indicates the remote session being established
  - id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
    name: Potential Lateral Movement via Windows Remote Shell
    reason: Alternative WinRM remote-shell lateral movement the operator may pivot to when CIM execution is used on the same hosts
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Pass-the-hash CIM sessions require NTLM material usually harvested by credential dumping on this host just beforehand
  - id: 0f06a3a5-6a09-413f-8743-e6cf35561297
    name: WMI Event Subscription
    reason: CIM methods can create permanent WMI event consumers for persistence after remote execution
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WmiPrvSE or wsmprovhost spawning shells (remote CIM execution landing)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Other WMI/CIM/remoting cmdlets in script blocks (session reuse, Win32_Process create)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Win32_Process.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-WmiMethod.*/ OR data_win_eventdata_scriptBlockText:/.*CimSessionOption.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Command.*/ OR data_win_eventdata_scriptBlockText:/.*Enter-PSSession.*/ OR data_win_eventdata_scriptBlockText:/.*New-PSSession.*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential material access preceding NTLM-based remote CIM use
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*sekurlsa.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]redential.*/))
    pivot_on:
    - host
    window: 4h
  - name: Outbound WinRM/WMI/DCOM connections from PowerShell (remote targets)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"445")
    pivot_on:
    - host
    window: 2h
  - name: Post-exploitation persistence or payload staging via WMI/services on host
    query: data_win_system_eventID:"7045" OR data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21" OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on:
    - host
    window: 4h
