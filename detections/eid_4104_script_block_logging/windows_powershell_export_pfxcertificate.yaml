name: Windows PowerShell Export PfxCertificate
id: ed06725f-6da6-439f-9dcc-ab30e891297c
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects use of the PowerShell cmdlet export-pfxcertificate to export PFX
  certificates including private keys from the Windows Certificate Store.
  PFX certificates contain both the certificate and private key, making them
  highly valuable for attackers to impersonate users, decrypt communications,
  or forge authentication certificates. This technique is used by threat actors
  including Scattered Spider (Lapsus$) and Water Gamayun.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*export-pfxcertificate*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators or scripts may legitimately export PFX certificates for backup,
  migration, or deployment purposes. Review the certificate being exported,
  destination path, and user context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1552/004/
  - https://attack.mitre.org/techniques/T1649/
  - https://dev.to/iamthecarisma/managing-windows-pfx-certificates-through-powershell-3pj
  - https://learn.microsoft.com/en-us/powershell/module/pki/export-pfxcertificate

response:
  message: >
    PowerShell export-pfxcertificate detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1552.004, T1649
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Scattered Lapsus$ Hunters
    - Windows Certificate Services
    - Water Gamayun
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.004
    - T1649
  custom_tags:
    - export_pfxcertificate
    - certificate_theft
    - private_key
    - credential_access
    - pki
    - scattered_spider
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*export-pfxcertificate.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5e38ded4-c964-41f4-8cb6-4a1a53c6929f
    name: Windows PowerShell Export Certificate
    reason: 'Sibling cmdlet in the same script-block tell: Export-Certificate dumps the public cert, so both firing in one session means the actor is sweeping the certificate store.'
  - id: aa7a3fce-bef5-4311-9cc1-5f04bb8c308c
    name: Certificate Exported Via PowerShell - ScriptBlock
    reason: Same certificate-export behaviour via other cmdlets or .NET Export(Pfx); a hit shows a second or alternate export path in the same script.
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Process-creation view of the same export (powershell.exe command line); confirms how it was launched and reveals the parent process.
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Attackers fall back to certutil -exportPFX when PowerShell export is blocked or noisy, giving a second route to the same private-key theft.
  - id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
    name: DPAPI Backup Keys And Certificate Export Activity IOC
    reason: Exported .pfx/.key/.cer lands as a file; cert and key file writes confirm the export succeeded and where it was staged.
  - id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
    name: Private Keys Reconnaissance Via CommandLine Tools
    reason: 'Precursor: searching the host for .pfx/.key/.pem files precedes choosing which certificate to export.'
  - id: f533ca6c-9440-4686-80cb-7f294c07812a
    name: Detect Certify With PowerShell Script Block Logging
    reason: Stolen PFX is typically used for AD CS abuse; Certify enumeration or requests in script blocks are the follow-on or precursor on the same host.
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: SharpDPAPI certificates/machinetriage extracts DPAPI-protected private keys, a parallel way to steal the same certificate material.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certificate/private-key files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Pp][Ff][Xx]|[Pp]12|[Pp][Ee][Mm]|[Kk][Ee][Yy]|[Pp][Vv][Kk]|[Cc][Ee][Rr])/
    pivot_on:
    - host
    window: 1h
  - name: Certificate store access and PFX tooling in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]ert:\.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xport-[Cc]ertificate.*/ OR data_win_eventdata_scriptBlockText:/.*[Xx]509[Cc]ertificate.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]xportable.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]onvert[Tt]o-[Ss]ecure[Ss]tring.*/)
    pivot_on:
    - host
    window: 1h
  - name: Certutil, Certify, Certipy, SharpDPAPI or Rubeus cert-abuse tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]ertutil.*(-[Ee]xport[Pp][Ff][Xx]|-[Ss]tore|-[Rr]equest).*/ OR data_win_eventdata_image:/.*\([Cc]ertify|[Cc]ertipy|[Ss]harp[Dd][Pp][Aa][Pp][Ii]|[Rr]ubeus)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Pp]kinit|[Aa]sktgt.*\/certificate|[Cc]ertificates \/machine).*/)
    pivot_on:
    - host
    window: 2h
  - name: Archive or staging of certificate material
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|[Rr]ar|7z|[Cc]opy|[Xx]copy).*([Pp][Ff][Xx]|\.[Pp][Ee][Mm]|\.[Kk][Ee][Yy]).*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Tt]o[Bb]ase64[Ss]tring|[Rr]ead[Aa]ll[Bb]ytes).*([Pp][Ff][Xx]|[Cc]ert).*/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound transfer or upload shortly after export
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr]clone|[Cc]url|[Ss]cp).*([Pp][Ff][Xx]|http).*/)
    pivot_on:
    - host
    window: 2h
