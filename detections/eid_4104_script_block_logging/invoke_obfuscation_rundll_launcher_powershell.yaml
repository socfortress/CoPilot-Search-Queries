name: Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell
id: e6cb92b4-b470-4eb8-8a9d-d63e8583aae0
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e6cb92b4-b470-4eb8-8a9d-d63e8583aae0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via RUNDLL LAUNCHER. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*rundll32.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*shell32.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*shellexec_rundll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*powershell*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*rundll32.exe*';
  data_win_eventdata_scriptBlockText matches '*shell32.dll*';
  data_win_eventdata_scriptBlockText matches '*shellexec_rundll*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell detected on host
    $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1027, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - rundll
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND data_win_eventdata_scriptBlockText:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell
    reason: Sibling Invoke-Obfuscation launcher variant using rundll32 in script blocks; the same obfuscation framework run with a different wrapper confirms deliberate tooling.
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: Layered Invoke-Obfuscation payloads usually combine launcher and obfuscated IEX stages in successive script blocks.
  - id: 20e5497e-331c-4cd5-8d36-935f6e2a9a07
    name: Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell
    reason: Compression-wrapped Invoke-Obfuscation output typically decodes into the inner payload that the rundll launcher then executes.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Obfuscated launcher is typically the delivery wrapper for a download cradle fetching the next-stage payload.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Attackers who obfuscate to evade static scanning often also patch AMSI in the same session before running the real payload.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: 'Likely follow-on: the decoded payload is loaded as a .NET assembly directly in memory without touching disk.'
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Obfuscated PowerShell that reaches rundll32/shell32 often ends in shellcode allocation and execution from the PowerShell process.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Process-creation counterpart: rundll32 launched by the script loading a beacon DLL is the common end result of rundll-based launchers.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 spawned by PowerShell or script hosts
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*([Pp]ower[Ss]hell|[Pp]wsh|[Cc]md|[Ww]script|[Cc]script|[Mm]shta)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Rundll32 commandline with Shell32 ShellExec_RunDLL or inline PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections from rundll32 or powershell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Rr]undll32|[Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Download cradle or reflective load in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Reflection.Assembly* OR data_win_eventdata_scriptBlockText:*VirtualAlloc*)
    pivot_on:
    - host
    window: 2h
  - name: Executables or DLLs dropped to user-writable paths by PowerShell or rundll32
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh|[Rr]undll32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss])/ AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Aa]pp[Dd]ata|[Pp]rogram[Dd]ata|[Pp]ublic).*/
    pivot_on:
    - host
    window: 4h
