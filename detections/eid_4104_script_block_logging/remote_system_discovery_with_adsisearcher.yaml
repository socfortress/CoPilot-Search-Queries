name: Remote System Discovery with Adsisearcher
id: 70803451-0047-4e12-9d63-77fa7eb8649c
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of the `[Adsisearcher]` type accelerator in 
  PowerShell scripts to query Active Directory for domain computers. It leverages 
  PowerShell Script Block Logging (EventCode=4104) to identify specific script blocks 
  containing `adsisearcher` and `objectcategory=computer` with methods like `findAll()` 
  or `findOne()`. This activity is significant as it may indicate an attempt by 
  adversaries or Red Teams to perform Active Directory discovery and gain situational 
  awareness of the network infrastructure. If confirmed malicious, this could lead to 
  further reconnaissance and potential lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*adsisearcher*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*objectcategory=computer*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*findAll()*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*findOne()*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for ADSI searcher queries targeting computer objects using findAll() or findOne() 
  methods. Validate that data_win_eventdata_scriptBlockText field is being populated 
  in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use Adsisearcher for legitimate Active Directory 
  troubleshooting or discovery operations. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://devblogs.microsoft.com/scripting/use-the-powershell-adsisearcher-type-accelerator-to-search-active-directory/
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html

response:
  message: >
    Active Directory system discovery with adsisearcher detected on $agent_name$ by 
    user $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is performing AD reconnaissance for situational awareness and potential 
    lateral movement planning. MITRE ATT&CK: T1018
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - active_directory_discovery
    - adsisearcher
    - objectcategory_computer
    - powershell
    - adsi
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh].*/ AND data_win_eventdata_scriptBlockText:/.*[Oo][Bb][Jj][Ee][Cc][Tt][Cc][Aa][Tt][Ee][Gg][Oo][Rr][Yy]=computer.*/ AND (data_win_eventdata_scriptBlockText:/.*[Ff]ind[Aa]ll\(\).*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind[Oo]ne\(\).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: Same [adsisearcher] LDAP-from-PowerShell technique targeting groups; operators typically enumerate computers then privileged groups in the same script session
  - id: de7fcadc-04f3-11ec-a241-acde48001122
    name: AdsiSearcher Account Discovery
    reason: Same adsisearcher technique used to enumerate user accounts; co-occurs with computer enumeration in AD recon scripts
  - id: windows-powershell-domain-enumeration-001
    name: Windows PowerShell Domain Enumeration
    reason: Generic PowerShell AD enumeration in script-block logs; confirms the adsisearcher query is part of broader domain mapping
  - id: a9a1da02-8e27-4bf7-a348-f4389c9da487
    name: Get-AdComputer with PowerShell Script Block
    reason: Alternate cmdlet route to the same computer-object enumeration; attackers switch tooling when one is blocked or after RSAT is available
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: PowerView is the common next-stage offensive AD recon toolkit loaded after or alongside raw adsisearcher queries
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Automated AD graph collection is the escalation of manual computer discovery to full attack-path mapping
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: nltest domain/DC discovery is a typical companion step to enumerating domain computers
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Finding domain controllers usually precedes or accompanies LDAP computer enumeration from the same host
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell AD enumeration beyond computers (users, groups, SPNs, trusts, DCs)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Oo]bject[Cc]ategory=(person|user|group).*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ervice[Pp]rincipal[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain(User|Group|Controller|Trust|Computer).*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-AD(User|Group|Computer).*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]irectory[Ss]ervices\.[Aa]ctive[Dd]irectory.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dmin[Cc]ount=1.*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Domain recon binaries and offensive AD tooling executed on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn]ltest|[Dd]squery|[Nn]et|[Nn]et1|[Ss]harp[Hh]ound|[Aa]d[Ff]ind|[Ss]etspn)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Dd]omain_trusts|[Dd]clist|[Gg]roup \/domain|[Vv]iew \/domain|[Ss]harp[Hh]ound|[Bb]lood[Hh]ound|[Ss]etspn -[Qq]).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: PowerShell spawned download cradle or encoded command before/after discovery
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell(_ise)?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(-[Ee]nc|-[Ee]ncodedcommand|[Ii][Ee][Xx]|[Dd]ownload(String|File)|[Ii]nvoke-[Ww]eb[Rr]equest|-[Ww]indow[Ss]tyle [Hh]idden|-[Nn]o[Pp]rofile).*/
    pivot_on:
    - host
    - user
    window: 2h
  - name: Outbound SMB/WinRM/RDP/RPC from PowerShell toward discovered hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986" OR data_win_eventdata_destinationPort:"3389")
    pivot_on:
    - host
    window: 4h
  - name: Recon output staged to file by PowerShell (computer lists, csv/txt)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.(txt|csv|xml|json|zip)/
    pivot_on:
    - host
    - user
    window: 2h
