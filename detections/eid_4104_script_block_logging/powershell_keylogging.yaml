name: Powershell Keylogging
id: 34f90d3c-c297-49e9-b26d-911b05a4866c
version: 1
schema_version: "1.0"
date: "2022-07-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 34f90d3c-c297-49e9-b26d-911b05a4866c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may log user keystrokes to intercept credentials as the user types
  them. MITRE ATT&CK: T1056.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-Keystrokes*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Get-ProcAddress user32.dll GetAsyncKeyState*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Get-ProcAddress user32.dll GetForegroundWindow*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-Keystrokes*';
  data_win_eventdata_scriptBlockText matches '*Get-ProcAddress user32.dll
  GetAsyncKeyState*'; data_win_eventdata_scriptBlockText matches
  '*Get-ProcAddress user32.dll GetForegroundWindow*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218/T1218.md
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.001/src/Get-Keystrokes.ps1
  - https://attack.mitre.org/techniques/T1056/001/

response:
  message: >
    Powershell Keylogging detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1056.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1056.001
  custom_tags:
    - powershell
    - keylogging
    - credential_access
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Kk][Ee][Yy][Ss][Tt][Rr][Oo][Kk][Ee][Ss].*/ OR (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Pp][Rr][Oo][Cc][Aa][Dd][Dd][Rr][Ee][Ss][Ss] [Uu][Ss][Ee][Rr]32\.[Dd][Ll][Ll] [Gg][Ee][Tt][Aa][Ss][Yy][Nn][Cc][Kk][Ee][Yy][Ss][Tt][Aa][Tt][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Pp][Rr][Oo][Cc][Aa][Dd][Dd][Rr][Ee][Ss][Ss] [Uu][Ss][Ee][Rr]32\.[Dd][Ll][Ll] [Gg][Ee][Tt][Ff][Oo][Rr][Ee][Gg][Rr][Oo][Uu][Nn][Dd][Ww][Ii][Nn][Dd][Oo][Ww].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-clipboard-data-get-clipboard-001
    name: Windows ClipBoard Data via Get-ClipBoard
    reason: 'Sibling PowerShell input-capture technique: operators who deploy a keylogger commonly also harvest clipboard contents (copied passwords) in the same session.'
  - id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
    name: Windows Screen Capture Via Powershell
    reason: Keyloggers like Get-Keystrokes are typically bundled with screenshot capture (Get-TimedScreenshot in PowerSploit); co-occurring user-surveillance collection on the same host.
  - id: d4a11f63-2390-411c-9adf-d791fd152830
    name: Windows Screen Capture with CopyFromScreen
    reason: 'Same user-surveillance family: CopyFromScreen screenshotting alongside keystroke logging confirms a PowerShell spyware toolkit rather than a one-off test.'
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: the Get-Keystrokes script is usually pulled from a remote host via a download cradle immediately before it is executed in memory.'
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: 'Precursor: attackers disable AMSI before running known offensive PowerShell like Get-Keystrokes so the script block is not blocked by AV.'
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: Shares the Get-ProcAddress/user32 P/Invoke reflection pattern of the keylogger; the same in-memory PowerShell tradecraft is used for injection payloads in the same session.
  - id: ca8b77a9-d499-4095-b793-5d5f330d450e
    name: PowerShell Credential Prompt
    reason: 'Parallel credential-theft path: spoofed credential prompts complement passive keystroke capture to obtain the user''s password.'
  - id: 59e8bf41-7472-412a-90d3-00f3afa452e9
    name: Windows Exfiltration Over C2 Via Powershell UploadString
    reason: 'Follow-on: captured keystroke logs are sent out by PowerShell, commonly via UploadString/web upload.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell keylogger/hooking APIs and screen/clipboard capture in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*GetAsyncKeyState* OR data_win_eventdata_scriptBlockText:*SetWindowsHookEx* OR data_win_eventdata_scriptBlockText:*GetKeyboardState* OR data_win_eventdata_scriptBlockText:*GetForegroundWindow* OR data_win_eventdata_scriptBlockText:*Get-TimedScreenshot* OR data_win_eventdata_scriptBlockText:*CopyFromScreen* OR data_win_eventdata_scriptBlockText:*Get-Clipboard*)
    pivot_on:
    - host
    window: 4h
  - name: Download cradle or AMSI/logging bypass delivering the script
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*Add-Type*)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell/script host process spawned with encoded or hidden command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*\.exe/ AND (data_win_eventdata_commandLine:*-enc* OR data_win_eventdata_commandLine:*-w*hidden* OR data_win_eventdata_commandLine:*-nop* OR data_win_eventdata_commandLine:*IEX*)
    pivot_on:
    - host
    window: 2h
  - name: Keystroke log file written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*keylog* OR data_win_eventdata_targetFilename:*keystroke* OR data_win_eventdata_targetFilename:*.log OR data_win_eventdata_targetFilename:*.txt) AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*\.exe/
    pivot_on:
    - host
    window: 4h
  - name: PowerShell outbound connection or exfil of captured data
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*\.exe/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*UploadString* OR data_win_eventdata_scriptBlockText:*UploadFile* OR data_win_eventdata_scriptBlockText:*Invoke-RestMethod* OR data_win_eventdata_scriptBlockText:*Send-MailMessage*))
    pivot_on:
    - host
    window: 6h
