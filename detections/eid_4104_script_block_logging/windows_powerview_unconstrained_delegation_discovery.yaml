name: Windows PowerView Unconstrained Delegation Discovery
id: fbf9e47f-e531-4fea-942d-5c95af7ed4d6
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of PowerView commandlets to discover Windows 
  endpoints with Kerberos Unconstrained Delegation. It leverages PowerShell Script Block 
  Logging (EventCode=4104) to identify specific commands like `Get-DomainComputer` or 
  `Get-NetComputer` with the `-Unconstrained` parameter. This activity is significant 
  as it indicates potential reconnaissance efforts by adversaries or Red Teams to map 
  out privileged delegation settings in Active Directory. If confirmed malicious, this 
  could allow attackers to identify high-value targets for further exploitation, 
  potentially leading to privilege escalation or lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-DomainComputer*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-NetComputer*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-Unconstrained*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of Get-DomainComputer or Get-NetComputer with the -Unconstrained 
  parameter to identify endpoints configured for Kerberos unconstrained delegation. 
  Validate that data_win_eventdata_scriptBlockText field is being populated in 
  Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may leverage PowerView for legitimate system 
  management or troubleshooting purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://adsecurity.org/?p=1667
  - https://docs.microsoft.com/en-us/defender-for-identity/cas-isp-unconstrained-kerberos
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/domain-compromise-via-unrestricted-kerberos-delegation
  - https://www.cyberark.com/resources/threat-research-blog/weakness-within-kerberos-delegation

response:
  message: >
    PowerView unconstrained delegation discovery detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is mapping unconstrained delegation settings in Active Directory to 
    identify privilege escalation targets. MITRE ATT&CK: T1018
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - CISA AA23-347A
    - Rhysida Ransomware
    - Active Directory Kerberos Attacks
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - powerview
    - unconstrained_delegation
    - kerberos_delegation
    - active_directory
    - privilege_escalation
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Get-DomainComputer.*/ OR data_win_eventdata_scriptBlockText:/.*Get-NetComputer.*/) AND data_win_eventdata_scriptBlockText:/.*-Unconstrained.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: PowerView was loaded into the session; the generic cmdlet detection shows the surrounding recon beyond the single -Unconstrained query
  - id: c8640777-469f-4638-ab44-c34a3233ffac
    name: Windows Get-AdComputer Unconstrained Delegation Discovery
    reason: Same objective via the AD module instead of PowerView; attackers swap tooling when one is blocked
  - id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
    name: Potential Unconstrained Delegation Discovery Via Get-ADComputer - ScriptBlock
    reason: Alternate (TrustedForDelegation/LDAP filter) method to enumerate unconstrained delegation hosts on the same session
  - id: 86dc8176-6e6c-42d6-9684-5444c6557ab3
    name: Windows PowerView Constrained Delegation Discovery
    reason: Delegation mapping usually covers both unconstrained and constrained targets in one PowerView run
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: SPN enumeration is the companion step when hunting delegation and roastable service accounts
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: 'Follow-on: after mapping delegation targets attackers request service tickets via PowerView'
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Co-occurring PowerView recon identifying privileged groups whose tickets could be harvested from the unconstrained host
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: Broader Get-DomainComputer enumeration from which the -Unconstrained filter is typically derived
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ticket-coercion and delegation abuse tooling (Rubeus, SpoolSample, PetitPotam)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]ubeus.*/ OR data_win_eventdata_commandLine:/.*[Ss]pool[Ss]ample.*/ OR data_win_eventdata_commandLine:/.*[Pp]etit[Pp]otam.*/ OR data_win_eventdata_commandLine:/.*[Tt]gtdeleg.*/ OR data_win_eventdata_commandLine:/.*sekurlsa::tickets.*/ OR data_win_eventdata_commandLine:/.*kerberos::ptt.*/ OR data_win_eventdata_commandLine:/.*[Mm]onitor.*\/interval.*/)
    pivot_on:
    - host
    window: 4h
  - name: Delegation, SPN and Kerberos ticket abuse in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]equest-[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]sds-[Aa]llowedtodelegateto.*/ OR data_win_eventdata_scriptBlockText:/.*-[Tt]rusted[Tt]o[Aa]uth.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Rr]ubeus.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]rustedForDelegation.*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Wider PowerView / BloodHound AD reconnaissance in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Cc]ontroller.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Tt]rust.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Gg]roup[Mm]ember.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ss]hare[Ff]inder.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Uu]ser[Hh]unter.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Gg][Pp][Oo].*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: PowerShell staging PowerView (download cradle, bypass, encoded) and ticket file drops
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*[Pp]ower[Vv]iew.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_commandLine:/.*-[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*-[Ee]xecution[Pp]olicy.*[Bb]ypass.*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/ OR data_win_eventdata_targetFilename:/.*[Pp]ower[Vv]iew.*/))
    pivot_on:
    - host
    window: 2h
  - name: PowerShell network connections to LDAP/Kerberos/SMB services
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"445")
    pivot_on:
    - host
    window: 2h
