name: Detect Copy of ShadowCopy with Script Block Logging
id: 9251299c-ea5b-11eb-a8de-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the use of PowerShell commands to copy the SAM, 
  SYSTEM, or SECURITY registry hives, which are critical for credential theft. It 
  leverages PowerShell Script Block Logging (EventID 4104) to capture and analyze 
  the full command executed. This activity is significant as it indicates an attempt 
  to exfiltrate sensitive registry hives for offline password cracking and credential 
  dumping. This technique is associated with HiveNightmare (CVE-2021-36934) which 
  allows unprivileged users to copy sensitive registry hives. If confirmed malicious, 
  this could lead to unauthorized access to credentials, enabling further compromise 
  of the system and potential lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Copy-Item*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*[System.IO.File]::Copy*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*System32\\config\\SAM*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*System32\\config\\SYSTEM*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*System32\\config\\SECURITY*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for PowerShell Copy-Item cmdlet or System.IO.File::Copy method 
  being used to copy critical registry hives (SAM, SYSTEM, SECURITY) which contain 
  Windows authentication credentials and system configuration. SAM (Security Accounts 
  Manager) contains local user password hashes, SYSTEM contains encryption keys, and 
  SECURITY contains cached credentials. This is a common tactic for credential dumping 
  and offline password cracking.

known_false_positives: >
  Limited false positives as the scope is limited to SAM, SYSTEM and SECURITY hives. 
  Legitimate administrators do not typically copy these critical hives. Any attempt 
  to copy these registry hives should be investigated immediately.

references:
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-36934
  - https://github.com/GossiTheDog/HiveNightmare
  - https://github.com/JumpsecLabs/Guidance-Advice/tree/main/SAM_Permissions
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    PowerShell was identified running a script to capture a registry hive on 
    $agent_name$ by user $data_win_eventdata_user$. 
    Script: $data_win_eventdata_scriptBlockText$. 
    This indicates credential dumping activity. MITRE ATT&CK: T1003.002
  risk_score: 85
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 85
    - field: data_win_eventdata_user
      type: user
      score: 85
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Credential Dumping
    - VanHelsing Ransomware
    - Credential Access
  asset_type: Endpoint
  cve:
    - CVE-2021-36934
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - sam_hive
    - registry_hive
    - credential_dumping
    - hivenightmare
    - cve_2021_36934
    - credential_access
    - powershell
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Copy-Item.*/ OR data_win_eventdata_scriptBlockText:/.*System.IO.File::Copy.*/) AND (data_win_eventdata_scriptBlockText:/.*System32.*config.*SAM.*/ OR data_win_eventdata_scriptBlockText:/.*System32.*config.*SYSTEM.*/ OR data_win_eventdata_scriptBlockText:/.*System32.*config.*SECURITY.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Same hive copy seen as a process command line (HiveNightmare VSS path) rather than a script block; confirms the 4104 block actually executed
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: File-creation evidence that the copied SAM/SYSTEM/SECURITY hive landed on disk as a staged export
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: Sysmon EID 11 of a dumped SAM file, the artifact produced by this copy
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Alternate living-off-the-land way to pull locked hives out of a shadow copy, often tried alongside or after the PowerShell copy
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Reads of SAM/NTDS through a VSS path, the HiveNightmare/VSS route to bypass file locks
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Different tool achieving the same hive theft; attackers rotate when one method is blocked
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Stolen hives or live LSASS credentials are typically parsed/used with in-memory Mimikatz in the same PowerShell session
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Operators harvesting SAM hashes usually also dump LSASS on the same host for domain credentials
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive saved or dumped via reg/esentutl/VSS
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*(HKLM|HKEY_LOCAL_MACHINE).*(SAM|SYSTEM|SECURITY).*/) OR (data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/ AND data_win_eventdata_commandLine:/.*config.*(SAM|SYSTEM|SECURITY).*/) OR data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/)
    pivot_on:
    - host
    window: 1h
  - name: Hive dump files staged on disk (sam/system/security copies)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])([-_.][^\]*)?/ OR data_win_eventdata_targetFilename:/.*[Ss][Aa][Mm]-?[Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*[Hh][Ii][Vv][Ee].*\.(save|bak|tmp|dmp|zip|7z)/)
    pivot_on:
    - host
    window: 2h
  - name: 'Credential tooling: secretsdump, mimikatz, LSASS dump on host'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]).*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Exfil / staging of hive dumps (archive, SMB copy, upload)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|7z|[Rr]ar|[Tt]ar |[Cc]url|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod|[Ss]cp |[Nn]et [Uu]se).*(sam|system|security|hive).*/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(UploadFile|UploadData|Invoke-WebRequest|Invoke-RestMethod|Compress-Archive|WriteAllBytes|ToBase64String).*(SAM|SYSTEM|SECURITY).*/)
    pivot_on:
    - host
    window: 4h
  - name: Logons with the affected account (pass-the-hash / reuse of dumped hashes)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND data_win_eventdata_authenticationPackageName:"NTLM") OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4672"
    pivot_on:
    - user
    window: 24h
