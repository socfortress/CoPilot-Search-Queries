name: Remote Process Instantiation via DCOM and PowerShell Script Block
id: fa1c3040-4680-11ec-a618-3e22fbd008af
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of PowerShell commands that initiate 
  a process on a remote endpoint via the DCOM protocol. It leverages PowerShell Script 
  Block Logging (EventCode=4104) to identify the use of ShellExecute and ExecuteShellCommand 
  methods on Document objects. This activity is significant as it may indicate lateral 
  movement or remote code execution attempts by adversaries. If confirmed malicious, 
  this behavior could allow attackers to execute arbitrary code on remote systems, 
  potentially leading to further compromise and persistence within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Document.Application.ShellExecute*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Document.ActiveView.ExecuteShellCommand*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for DCOM ShellExecute and ExecuteShellCommand methods targeting Document objects. 
  Validate that data_win_eventdata_scriptBlockText field is being populated in 
  Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators may leverage DCOM to start a process on remote systems, but this 
  activity is usually limited to a small set of hosts or users. Validate that such 
  activity is authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1021/003/
  - https://www.cybereason.com/blog/dcom-lateral-movement-techniques
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html

response:
  message: >
    DCOM remote process instantiation detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates potential lateral movement via DCOM ShellExecute. 
    MITRE ATT&CK: T1021.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.003
  custom_tags:
    - dcom_lateral_movement
    - shellexecute
    - remote_code_execution
    - powershell
    - activex
    - document_object
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Document\.Application\.ShellExecute.*/ OR data_win_eventdata_scriptBlockText:/.*Document\.ActiveView\.ExecuteShellCommand.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Same MMC20.Application DCOM technique (Document.ActiveView.ExecuteShellCommand); the target-side view shows mmc.exe spawning the payload.
  - id: 05a2ab7e-ce11-4b63-86db-ab32e763e11d
    name: MMC Spawning Windows Shell
    reason: On the DCOM target, ExecuteShellCommand makes mmc.exe spawn cmd/powershell, confirming the remote call landed.
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: Sibling DCOM lateral movement variant using a different COM object; operators rotate between them if one is blocked.
  - id: 2a048c14-4634-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via WMI and PowerShell Script Block
    reason: Same 4104 remote-instantiation family; attackers fall back from DCOM to WMI on the same source host.
  - id: 7d4c618e-4716-11ec-951c-3e22fbd008af
    name: Remote Process Instantiation via WinRM and PowerShell Script Block
    reason: Same 4104 remote-instantiation family; WinRM is the other common fallback from the same operator session.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Target-side lateral movement signal for the alternate WMI channel to the same remote hosts.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: Remote-spawned PowerShell child on the target is the expected outcome of a successful DCOM launch.
  - id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
    name: Impacket Lateral Movement Commandline Parameters
    reason: Impacket dcomexec.py performs the same DCOM ShellExecute/MMC20 execution from a tooling host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell/script children spawned by mmc.exe, excel.exe or explorer via DCOM
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Mm][Mm][Cc]|\\[Ee][Xx][Cc][Ee][Ll]|\\[Ss][Hh][Ee][Ll][Ll][Bb][Rr][Ww][Ss][Ee][Rr]|\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Mm][Ss][Hh][Tt][Aa]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other remote-instantiation COM/WMI/WinRM script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Cc][Tt][Ii][Vv][Aa][Tt][Oo][Rr]\]::[Cc][Rr][Ee][Aa][Tt][Ee][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Mm][Cc]20\.[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Ee][Ll][Ll]\.[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Hh][Ee][Ll][Ll][Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ww][Mm][Ii][Oo][Bb][Jj][Ee][Cc][Tt].*[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Ii][Mm][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound RPC/DCOM and SMB connections from PowerShell or mmc
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Mm][Mm][Cc])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 1h
  - name: Logons and credential material use preceding remote execution
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND NOT data_win_eventdata_targetUserName:/.*\$/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: Payload staging and remote-tool drops after DCOM execution
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]).*\.(([Ee][Xx][Ee])|([Dd][Ll][Ll])|([Pp][Ss]1)|([Bb][Aa][Tt])|([Vv][Bb][Ss])|([Jj][Ss]))/
    pivot_on:
    - host
    window: 2h
