name: PowerShell Web Access Installation - PsScript
id: 5f9c7f1a-7c21-4c39-b2f3-8d8006e0e51f
version: 1
schema_version: "1.0"
date: "2024-09-03"
author: Michael Haag
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5f9c7f1a-7c21-4c39-b2f3-8d8006e0e51f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the installation and configuration of PowerShell Web Access, which
  could be used for remote access and potential abuse. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Install-WindowsFeature WindowsPowerShellWebAccess*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Install-PswaWebApplication*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Add-PswaAuthorizationRule*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*-UserName *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*-ComputerName *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Install-WindowsFeature
  WindowsPowerShellWebAccess*'; data_win_eventdata_scriptBlockText matches
  '*Install-PswaWebApplication*'; data_win_eventdata_scriptBlockText matches
  '*Add-PswaAuthorizationRule*', among other conditions.

known_false_positives: >
  Legitimate PowerShell Web Access installations by administrators. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://docs.microsoft.com/en-us/powershell/module/powershellwebaccess/install-pswawebapplication
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
  - https://gist.github.com/MHaggis/7e67b659af9148fa593cf2402edebb41
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    PowerShell Web Access Installation - PsScript detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - installation
    - psscript
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Ff][Ee][Aa][Tt][Uu][Rr][Ee] [Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][Ww][Ee][Bb][Aa][Cc][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Pp][Ss][Ww][Aa][Ww][Ee][Bb][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Pp][Ss][Ww][Aa][Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn][Rr][Uu][Ll][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*-[Uu][Ss][Ee][Rr][Nn][Aa][Mm][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7e8f2d3b-9c1a-4f67-b9e8-8d9006e0e51f
    name: PowerShell Web Access Feature Enabled Via DISM
    reason: Same PSWA feature install done via dism.exe instead of Install-WindowsFeature; co-occurring or alternate path to the same web-based PowerShell backdoor.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: PSWA runs over IIS HTTPS (443); attackers open an inbound firewall rule to make the gateway reachable from outside.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Add-PswaAuthorizationRule grants a user access; a freshly created local account is the typical identity authorized for the gateway.
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: Attacker pairing a new/authorized PSWA user with local admin rights to make the web shell fully privileged.
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: Alternative/complementary external exposure of the PSWA IIS site on an otherwise non-internet-facing host via a tunnel.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Ngrok tunnelling exposes the internal PSWA endpoint publicly, a common pairing for web-based remote PowerShell access.
  - id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
    name: IIS Native-Code Module Command Line Installation
    reason: PSWA installs onto IIS; attackers abusing IIS on the same host often add malicious modules as additional persistence.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PSWA install via DISM/ServerManager/IIS tooling processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][Ww][Ee][Bb][Aa][Cc][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ss][Ww][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ii][Ss]-[Ww][Ee][Bb][Ss][Ee][Rr][Vv][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Inbound firewall rule opened for web gateway (443/80)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt][Ss][Hh]|[Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee]).*([Aa][Dd][Dd] [Rr][Uu][Ll][Ee]|[Dd][Ii][Rr][Ee][Cc][Tt][Ii][Oo][Nn]).*/
    pivot_on:
    - host
    window: 2h
  - name: Local account creation or admin group changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Uu][Ss][Ee][Rr] .*/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] +[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*([Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr]|[Aa][Dd][Dd]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Other PSWA cmdlets or IIS gateway config script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Pp][Ss][Ww][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Ss][Ee][Ll][Ff][Ss][Ii][Gg][Nn][Ee][Dd][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ee][Bb][Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: Remote logons to host after gateway setup
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"8" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    window: 4h
