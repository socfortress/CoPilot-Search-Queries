name: WMImplant Hack Tool
id: 8028c2c3-e25a-46e3-827f-bbb5abf181d7
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: NVISO
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8028c2c3-e25a-46e3-827f-bbb5abf181d7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects parameters used by WMImplant. MITRE ATT&CK: T1047, T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*WMImplant*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* change_user *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* gen_cli *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* command_exec *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* disable_wdigest *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* disable_winrm *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* enable_wdigest *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* enable_winrm *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* registry_mod *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* remote_posh *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* sched_job *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* service_mod *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* process_kill *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* active_users *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* basic_info *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* power_off *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* vacant_system *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "* logon_events *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*WMImplant*';
  data_win_eventdata_scriptBlockText matches '* change_user *';
  data_win_eventdata_scriptBlockText matches '* gen_cli *', among other
  conditions.

known_false_positives: >
  Administrative scripts that use the same keywords. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/FortyNorthSecurity/WMImplant
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    WMImplant Hack Tool detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1047, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1059.001
  custom_tags:
    - wmimplant
    - powershell
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww][Mm][Ii][Mm][Pp][Ll][Aa][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.* [Cc][Hh][Aa][Nn][Gg][Ee]_[Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_scriptBlockText:/.* [Gg][Ee][Nn]_[Cc][Ll][Ii] .*/ OR data_win_eventdata_scriptBlockText:/.* [Cc][Oo][Mm][Mm][Aa][Nn][Dd]_[Ee][Xx][Ee][Cc] .*/ OR data_win_eventdata_scriptBlockText:/.* [Dd][Ii][Ss][Aa][Bb][Ll][Ee]_[Ww][Dd][Ii][Gg][Ee][Ss][Tt] .*/ OR data_win_eventdata_scriptBlockText:/.* [Dd][Ii][Ss][Aa][Bb][Ll][Ee]_[Ww][Ii][Nn][Rr][Mm] .*/ OR data_win_eventdata_scriptBlockText:/.* [Ee][Nn][Aa][Bb][Ll][Ee]_[Ww][Dd][Ii][Gg][Ee][Ss][Tt] .*/ OR data_win_eventdata_scriptBlockText:/.* [Ee][Nn][Aa][Bb][Ll][Ee]_[Ww][Ii][Nn][Rr][Mm] .*/ OR data_win_eventdata_scriptBlockText:/.* [Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]_[Mm][Oo][Dd] .*/ OR data_win_eventdata_scriptBlockText:/.* [Rr][Ee][Mm][Oo][Tt][Ee]_[Pp][Oo][Ss][Hh] .*/ OR data_win_eventdata_scriptBlockText:/.* [Ss][Cc][Hh][Ee][Dd]_[Jj][Oo][Bb] .*/ OR data_win_eventdata_scriptBlockText:/.* [Ss][Ee][Rr][Vv][Ii][Cc][Ee]_[Mm][Oo][Dd] .*/ OR data_win_eventdata_scriptBlockText:/.* [Pp][Rr][Oo][Cc][Ee][Ss][Ss]_[Kk][Ii][Ll][Ll] .*/ OR data_win_eventdata_scriptBlockText:/.* [Aa][Cc][Tt][Ii][Vv][Ee]_[Uu][Ss][Ee][Rr][Ss] .*/ OR data_win_eventdata_scriptBlockText:/.* [Bb][Aa][Ss][Ii][Cc]_[Ii][Nn][Ff][Oo] .*/ OR data_win_eventdata_scriptBlockText:/.* [Pp][Oo][Ww][Ee][Rr]_[Oo][Ff][Ff] .*/ OR data_win_eventdata_scriptBlockText:/.* [Vv][Aa][Cc][Aa][Nn][Tt]_[Ss][Yy][Ss][Tt][Ee][Mm] .*/ OR data_win_eventdata_scriptBlockText:/.* [Ll][Oo][Gg][Oo][Nn]_[Ee][Vv][Ee][Nn][Tt][Ss] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: WMImplant's command_exec/remote_posh run via WMI on targets; the remote end shows as WmiPrvSE.exe spawning powershell.exe, the receiving-side view of the same tool.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: WMImplant remote command execution (Win32_Process.Create) surfaces as unusual children of WmiPrvSE.exe on the target host.
  - id: 24869767-8579-485d-9a4f-d9ddfd8f0cac
    name: Process Execution via WMI
    reason: WMImplant's command_exec/gen_cli spawn processes through WMI; this catches the process-creation side of the same action.
  - id: 526be59f-a573-4eea-b5f7-f0973207634d
    name: Process Creation Attempt via Wmic.EXE
    reason: Operators often mix WMImplant with wmic 'process call create' for the same WMI-based remote execution.
  - id: c453ab7a-1f5c-4716-a3b4-dea8135fb43a
    name: Registry Manipulation via WMI Stdregprov
    reason: WMImplant registry_mod, disable_wdigest and enable_wdigest write the registry through StdRegProv over WMI.
  - id: c80e66d8-1780-48a9-b412-46663fd21ac0
    name: Suspicious Autorun Registry Modified via WMI
    reason: WMImplant registry_mod used to plant Run-key persistence is the follow-on persistence step.
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: WMImplant enable_winrm/remote_posh prepare and use WinRM remoting as a secondary execution channel.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: WMImplant process_kill and service_mod are used to kill or disable AV/EDR processes and services via WMI, same defence-evasion goal.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WmiPrvSE spawning shells or script interpreters
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: WDigest / credential-exposure registry changes (disable_wdigest, enable_wdigest)
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/
    pivot_on:
    - host
    window: 4h
  - name: WinRM enablement and remoting activity (enable_winrm, remote_posh)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Pp][Ss][Rr][Ee][Mm][Oo][Tt][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Mm] [Qq][Uu][Ii][Cc][Kk][Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ss][Mm][Aa][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)) OR (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986"))
    pivot_on:
    - host
    window: 2h
  - name: Scheduled job, service and process-kill actions via WMI (sched_job, service_mod, process_kill)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Jj][Oo][Bb].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Oo][Pp][Ee][Rr][Aa][Tt][Ii][Nn][Gg][Ss][Yy][Ss][Tt][Ee][Mm].*[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Remote logon attempts and NTLM/network logons (logon_events recon, lateral use)
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648"
    pivot_on:
    - host
    window: 2h
