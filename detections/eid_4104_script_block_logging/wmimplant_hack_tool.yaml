name: WMImplant Hack Tool
id: 8028c2c3-e25a-46e3-827f-bbb5abf181d7
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: NVISO
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8028c2c3-e25a-46e3-827f-bbb5abf181d7
  commit: release-20260810
  license: DRL-1.1
