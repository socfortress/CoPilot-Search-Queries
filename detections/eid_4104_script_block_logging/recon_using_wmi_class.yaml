name: Recon Using WMI Class
id: 018c1972-ca07-11eb-9473-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects suspicious PowerShell activity via EventCode 4104, 
  where WMI performs event queries to gather information on running processes or 
  services. This detection leverages PowerShell Script Block Logging to identify 
  specific WMI queries targeting system information classes like Win32_Bios, 
  Win32_OperatingSystem, Win32_Processor, Win32_ComputerSystem, Win32_PnPEntity, 
  Win32_ShadowCopy, Win32_DiskDrive, Win32_PhysicalMemory, Win32_BaseBoard, and 
  Win32_DisplayConfiguration. This activity is significant as it often indicates 
  reconnaissance efforts by an adversary to profile the compromised machine. If 
  confirmed malicious, the attacker could gain detailed system information, aiding 
  in further exploitation or lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*SELECT*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-WmiObject*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_Bios*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_OperatingSystem*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_Processor*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_ComputerSystem*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_PnPEntity*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_ShadowCopy*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_DiskDrive*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_PhysicalMemory*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_BaseBoard*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Win32_DisplayConfiguration*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for SELECT or Get-WmiObject commands querying system information classes. Validate 
  that data_win_eventdata_scriptBlockText field is being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  System administrators or legitimate scripts may query WMI for system information 
  during diagnostics, inventory management, or compliance checks. Filter based on 
  user context and whether the action was expected and authorized within your organization.

references:
  - https://news.sophos.com/en-us/2020/05/12/maze-ransomware-1-year-counting/
  - https://help.splunk.com/en/security-offerings/splunk-user-behavior-analytics/get-data-in/5.4.1/add-other-data-to-splunk-uba/configure-powershell-logging-to-see-powershell-anomalies-in-splunk-uba.html
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://static1.squarespace.com/static/552092d5e4b0661088167e5c/t/59c1814829f18782e24f1fe2/1505853768977/Windows+PowerShell+Logging+Cheat+Sheet+ver+Sept+2017+v2.1.pdf
  - https://www.crowdstrike.com/blog/investigating-powershell-command-and-script-logging/
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html
  - https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/
  - https://blogs.vmware.com/security/2022/10/lockbit-3-0-also-known-as-lockbit-black.html

response:
  message: >
    WMI system reconnaissance detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script block: $data_win_eventdata_scriptBlockText$. 
    Adversary is profiling the compromised system for exploitation or lateral movement. 
    MITRE ATT&CK: T1592, T1059.001
  risk_score: 20
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 20
    - field: data_win_eventdata_user
      type: user
      score: 20
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Hermetic Wiper
    - Quasar RAT
    - Malicious PowerShell
    - Data Destruction
    - AsyncRAT
    - MoonPeak
    - LockBit Ransomware
    - Malicious Inno Setup Loader
    - Qakbot
    - Industroyer2
    - Scattered Spider
    - BlankGrabber Stealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1592
    - T1059.001
  custom_tags:
    - wmi_reconnaissance
    - system_profiling
    - win32_classes
    - powershell
    - shadow_copy_enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*SELECT.*/ OR data_win_eventdata_scriptBlockText:/.*Get-WmiObject.*/) AND (data_win_eventdata_scriptBlockText:/.*Win32_Bios.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_OperatingSystem.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_Processor.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_ComputerSystem.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_PnPEntity.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_ShadowCopy.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_DiskDrive.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_PhysicalMemory.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_BaseBoard.*/ OR data_win_eventdata_scriptBlockText:/.*Win32_DisplayConfiguration.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 904e8e61-8edf-4350-b59c-b905fc8e810c
    name: Security Software Discovery Via Powershell Script
    reason: 'Same PowerShell host-profiling phase: after Win32_* hardware/OS profiling, malware (Qakbot, LockBit, AsyncRAT) enumerates AV/EDR via SecurityCenter2 WMI to decide whether to proceed or evade.'
  - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
    name: Delete ShadowCopy With PowerShell
    reason: The rule matches Win32_ShadowCopy; recon of shadow copies is the direct precursor to Get-WmiObject Win32_ShadowCopy | Delete in ransomware/wiper chains (LockBit, HermeticWiper).
  - id: 9251299c-ea5b-11eb-a8de-acde48001122
    name: Detect Copy of ShadowCopy with Script Block Logging
    reason: Shadow copy enumeration via WMI can precede copying SAM/NTDS from a shadow copy for credential theft.
  - id: 640b0eda-0429-11ec-accd-acde48001122
    name: Get-WmiObject Win32_UserAccount with PowerShell Script Block
    reason: 'Same Get-WmiObject script-block surface: system profiling is typically followed by local account discovery from the same script/session.'
  - id: 69df7f7c-155d-11ec-a055-acde48001122
    name: Get-WMIObject Group Discovery with Script Block Logging
    reason: 'Co-occurring WMI discovery in one recon script: group membership enumeration alongside Win32_ComputerSystem/OS profiling.'
  - id: f5d1def8-1de0-4a0e-9794-1f6f27dd605c
    name: PowerShell Hotfix Enumeration
    reason: Patch-level enumeration is the common companion of Win32_OperatingSystem profiling, used to select a local privilege escalation exploit.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Loader-stage follow-on: after the stager profiles the victim it downloads the next-stage payload through the same PowerShell script-block channel.'
  - id: 47c69803-2c09-408b-b40a-063c064cbb16
    name: Windows PowerShell WMI Win32 ScheduledJob
    reason: Escalation of WMI use from read-only Win32 class queries to creating Win32_ScheduledJob for execution/persistence.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI/CIM discovery of security products, accounts and hotfixes in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss]ecurity[Cc]enter2.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]nti[Vv]irus[Pp]roduct.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Qq]uick[Ff]ix[Ee]ngineering.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Uu]ser[Aa]ccount.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Gg]roup.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Nn]etwork[Aa]dapter[Cc]onfiguration.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Ss]ervice.*/ OR data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Pp]rocess.*/)
    pivot_on:
    - host
    window: 1h
  - name: Shadow copy deletion or resizing following WMI recon
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*([Rr]ecoveryenabled|[Bb]ootstatuspolicy).*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Rr]esize [Ss]hadow[Ss]torage.*/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ww]in32_[Ss]hadow[Cc]opy.*[Dd]elete.*/)
    pivot_on:
    - host
    window: 2h
  - name: Stager download or in-memory execution in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ee]xpression.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell or WMI spawned process followed by outbound network connection
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh|[Ww]mic|[Ww]mi[Pp]rv[Ss][Ee]).*/ AND data_win_eventdata_initiated:"true" AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*|172\.(1[6-9]|2[0-9]|3[01])\..*)/
    pivot_on:
    - host
    window: 1h
  - name: Persistence or remote execution via WMI subscription, scheduled task or service after recon
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]chtasks.*\/[Cc]reate.*/ OR data_win_eventdata_commandLine:/.*[Ss]c(\.exe)? +create.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*\/node.*[Pp]rocess.*[Cc]all.*[Cc]reate.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg(\.exe)? +add.*[Cc]urrent[Vv]ersion\\[Rr]un.*/)) OR data_win_system_eventID:("19" OR "20" OR "21")
    pivot_on:
    - host
    window: 2h
