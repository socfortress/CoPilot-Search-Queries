name: Windows PowerView SPN Discovery
id: a7093c28-796c-4ebb-9997-e2c18b870837
version: 1
schema_version: "1.0"
date: "2026-04-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainUser` or `Get-NetUser` 
  PowerShell cmdlets with the `-SPN` parameter, indicating the use of PowerView for SPN 
  discovery. It leverages PowerShell Script Block Logging (EventCode=4104) to identify 
  these specific commands. This activity is significant as it suggests an attempt to 
  enumerate domain accounts associated with Service Principal Names (SPNs), a common 
  precursor to Kerberoasting attacks. If confirmed malicious, this could allow an 
  attacker to identify and target accounts for credential theft, potentially leading 
  to unauthorized access and privilege escalation within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-NetUser*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Get-DomainUser*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-SPN*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-10 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging on some or all endpoints. The Wazuh agent ossec.conf should include 
  the Microsoft-Windows-PowerShell/Operational event channel. This detection monitors 
  for the use of Get-DomainUser or Get-NetUser with the -SPN parameter to enumerate 
  accounts with Service Principal Names for Kerberoasting. Validate that 
  data_win_eventdata_scriptBlockText field is being populated in Elasticsearch/Wazuh 
  Indexer.

known_false_positives: >
  False positives may include Administrators using PowerView for legitimate 
  troubleshooting and management purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://book.hacktricks.xyz/windows-hardening/active-directory-methodology/kerberoast
  - https://github.com/PowerShellMafia/PowerSploit/blob/master/Recon/PowerView.ps1
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/t1208-kerberoasting
  - https://attack.mitre.org/techniques/T1558/003

response:
  message: >
    PowerView SPN discovery detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. Adversary is enumerating SPN 
    accounts for Kerberoasting and credential theft. MITRE ATT&CK: T1558.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - CISA AA23-347A
    - Rhysida Ransomware
    - Active Directory Kerberos Attacks
    - Interlock Ransomware
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - powerview
    - spn_discovery
    - get_domainuser
    - get_netuser
    - kerberoasting
    - spn_enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Get-NetUser.*/ OR data_win_eventdata_scriptBlockText:/.*Get-DomainUser.*/) AND data_win_eventdata_scriptBlockText:/.*-SPN.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
    name: Windows PowerView Kerberos Service Ticket Request
    reason: 'Direct follow-on: after listing SPN accounts, PowerView requests TGS tickets (Get-DomainSPNTicket) for those accounts to crack offline.'
  - id: a861d835-af37-4930-bcd6-5b178bfb54df
    name: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock
    reason: Kerberoast step two in script blocks (KerberosRequestorSecurityToken) on the same host after SPN enumeration.
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: DC-side 4769 RC4 service-ticket requests confirm the enumerated SPNs were actually roasted.
  - id: 496a0e47-0a33-4dca-b009-9e6ca3591f39
    name: Suspicious Kerberos RC4 Ticket Encryption
    reason: RC4 TGS requests with kerberoast ticket options are the network-visible result of the SPN targeting.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: Same SPN enumeration goal via a native binary; attackers alternate or fall back between PowerView and setspn.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: PowerView was loaded in this session; other PowerView cmdlets indicate broader AD recon by the same operator.
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: Sibling Kerberos-targeting PowerView recon (AS-REP roasting candidates) commonly run in the same session.
  - id: 86dc8176-6e6c-42d6-9684-5444c6557ab3
    name: Windows PowerView Constrained Delegation Discovery
    reason: Attackers pair SPN discovery with delegation discovery to choose privilege-escalation paths through service accounts.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberos TGS requests with RC4 encryption (kerberoast roasting)
    query: data_win_system_eventID:"4769" AND (data_win_eventdata_ticketEncryptionType:"0x17" OR data_win_eventdata_ticketEncryptionType:"0x1" OR data_win_eventdata_ticketEncryptionType:"0x3") AND NOT data_win_eventdata_serviceName:/.*\$/
    pivot_on:
    - user
    window: 4h
  - name: PowerView ticket roasting and other PowerView cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Get-DomainSPNTicket.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-Kerberoast.*/ OR data_win_eventdata_scriptBlockText:/.*KerberosRequestorSecurityToken.*/ OR data_win_eventdata_scriptBlockText:/.*Get-DomainComputer.*/ OR data_win_eventdata_scriptBlockText:/.*Get-DomainGroupMember.*/ OR data_win_eventdata_scriptBlockText:/.*Invoke-ACLScanner.*/ OR data_win_eventdata_scriptBlockText:/.*Find-LocalAdminAccess.*/)
    pivot_on:
    - host
    window: 2h
  - name: Kerberoasting and SPN tooling process execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]ubeus.*/ OR data_win_eventdata_commandLine:/.*[Kk]erberoast.*/ OR data_win_eventdata_commandLine:/.*[Ss]etspn.*/ OR data_win_eventdata_commandLine:/.*GetUserSPNs.*/ OR data_win_eventdata_commandLine:/.*[Aa]sktgs.*/ OR data_win_eventdata_image:/.*[Ss]harp[Hh]ound.*/)
    pivot_on:
    - host
    window: 2h
  - name: Exported Kerberos tickets and hash files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.kirbi OR data_win_eventdata_targetFilename:*.ccache OR data_win_eventdata_targetFilename:*kerberoast* OR data_win_eventdata_targetFilename:*hashes.txt OR data_win_eventdata_targetFilename:*tgs*)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell cradle or encoded loading of PowerView/recon tooling
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_scriptBlockText:/.*PowerSploit.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]msi[Uu]tils.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]rom[Bb]ase64[Ss]tring.*/)
    pivot_on:
    - host
    window: 1h
