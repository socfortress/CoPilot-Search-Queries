name: PowerShell Credential Prompt
id: ca8b77a9-d499-4095-b793-5d5f330d450e
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: John Lambert (idea), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ca8b77a9-d499-4095-b793-5d5f330d450e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell calling a credential prompt. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*PromptForCredential*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*PromptForCredential*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/JohnLaTwC/status/850381440629981184
  - https://t.co/ezOTGy1a1G
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    PowerShell Credential Prompt detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - credential
    - prompt
    - credential_access
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Pp][Rr][Oo][Mm][Pp][Tt][Ff][Oo][Rr][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 965e2db9-eddb-4cf6-a986-7a967df651e4
    name: Potential Keylogger Activity
    reason: Prompt spoofing and keylogging are the two PowerShell input-capture techniques; a keylogger script block on the same host suggests layered credential capture.
  - id: 34f90d3c-c297-49e9-b26d-911b05a4866c
    name: Powershell Keylogging
    reason: Co-occurring PowerShell input capture (GetAsyncKeyState/hooks) alongside a fake credential dialog points to a credential-stealing implant.
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: 'Follow-on: after harvesting a typed password the actor commonly also dumps stored Credential Manager secrets.'
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Same script-block credential-theft family; browser Login Data access is the typical companion to a credential prompt in infostealer scripts.
  - id: windows-clipboard-data-get-clipboard-001
    name: Windows ClipBoard Data via Get-ClipBoard
    reason: Clipboard scraping is commonly bundled with credential prompts in PowerShell stealers to capture copied passwords.
  - id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
    name: Windows Screen Capture Via Powershell
    reason: Screen capture in the same session indicates user-surveillance collection accompanying the credential phish.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: the prompt script is usually delivered by a download cradle, and stolen creds are posted back over the same web methods.'
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: 'Escalation: operators who phish creds in-session often proceed to in-memory Mimikatz for further credential access.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Plaintext password extraction from credential prompt result
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Nn][Ee][Tt][Ww][Oo][Rr][Kk][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Cc][Uu][Rr][Ee][Ss][Tt][Rr][Ii][Nn][Gg][Tt][Oo][Bb][Ss][Tt][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Tt][Rr][Tt][Oo][Ss][Tt][Rr][Ii][Nn][Gg][Aa][Uu][Tt][Oo].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Tt][Rr][Tt][Oo][Ss][Tt][Rr][Ii][Nn][Gg][Bb][Ss][Tt][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Nn][Vv][Ee][Rr][Tt][Ff][Rr][Oo][Mm]\-[Ss][Ee][Cc][Uu][Rr][Ee][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Nn][Ss][Ee][Cc][Uu][Rr][Ee][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/)
    pivot_on:
    - host
    window: 1h
  - name: Captured credentials validated against AD or local logon
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Vv][Aa][Ll][Ii][Dd][Aa][Tt][Ee][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Aa][Cc][Cc][Oo][Uu][Nn][Tt][Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Cc][Oo][Nn][Tt][Ee][Xx][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy][Ee][Nn][Tt][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Gg][Oo][Nn][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]\-[Pp][Rr][Oo][Cc][Ee][Ss][Ss]\ \-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]\-[Pp][Ss][Dd][Rr][Ii][Vv][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Script-block web upload or webhook exfiltration of harvested credentials
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Cc][Oo][Mm]\/[Aa][Pp][Ii]\/[Ww][Ee][Bb][Hh][Oo][Oo][Kk][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Pp][Ii]\.[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\.[Oo][Rr][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Nn][Dd]\-[Mm][Aa][Ii][Ll][Mm][Ee][Ss][Ss][Aa][Gg][Ee].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell outbound network connections after prompt
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: 'Companion credential theft: clipboard, keylog, vault, Mimikatz'
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]\-[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Pp][Yy][Ff][Rr][Oo][Mm][Ss][Cc][Rr][Ee][Ee][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Aa][Ss][Yy][Nn][Cc][Kk][Ee][Yy][Ss][Tt][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt][Ww][Ii][Nn][Dd][Oo][Ww][Ss][Hh][Oo][Oo][Kk][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Gg][Ii][Nn]\ [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]\.[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Dd][Ee][Nn][Uu][Mm][Ee][Rr][Aa][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd][Kk][Ee][Yy]\ \/[Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/))
    pivot_on:
    - host
    window: 4h
