name: Get-DomainGroup with PowerShell Script Block
id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-DomainGroup` cmdlet using 
  PowerShell Script Block Logging (EventID 4104). This cmdlet, part of the PowerView 
  tool, is used to enumerate domain groups within a Windows domain. The detection 
  leverages script block text to identify this specific command. Monitoring this activity 
  is crucial as it may indicate an adversary or Red Team performing reconnaissance to 
  gain situational awareness and map out Active Directory structures. If confirmed 
  malicious, this activity could lead to further exploitation, including privilege 
  escalation and lateral movement within the network.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-DomainGroup*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-DomainGroup cmdlet from PowerView, which is used for 
  domain group enumeration. Validate that data_win_eventdata_scriptBlockText field is 
  being populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  Administrators or power users may use this PowerView function for legitimate 
  troubleshooting and group management purposes. Filter based on user context and whether 
  the action was expected and authorized within your organization.

references:
  - https://attack.mitre.org/techniques/T1069/002/
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainGroup/
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet

response:
  message: >
    Get-DomainGroup execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates domain group enumeration/reconnaissance activity for privilege escalation planning. 
    MITRE ATT&CK: T1069.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Permission Groups Discovery
    - Privilege Escalation
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.002
  custom_tags:
    - get_domaingroup
    - powerview
    - group_enumeration
    - domain_groups
    - privilege_escalation
    - lateral_movement
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-DomainGroup.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-DomainGroup is a PowerView cmdlet; other PowerView cmdlets in the same session mean a full toolkit is loaded, not a one-off admin query
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: 'Typical next step: narrowing group enumeration to Domain Admins / Enterprise Admins to pick escalation targets'
  - id: 61994268-04f4-11ec-865c-acde48001122
    name: Get-DomainUser with PowerShell Script Block
    reason: Group enumeration is usually paired with user enumeration (members of the groups just found) in the same PowerView recon pass
  - id: f64da023-b988-4775-8d57-38e512beb56e
    name: Get-DomainComputer with PowerShell Script Block
    reason: 'Co-occurring PowerView recon: mapping hosts after groups to choose lateral movement targets'
  - id: 676b600a-a94d-4951-b346-11329431e6c1
    name: Get-DomainController with PowerShell Script Block
    reason: Co-occurring PowerView recon locating DCs, the targets for group and credential abuse
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: 'Follow-on recon: after groups, attacker maps domain trusts to expand scope'
  - id: 93c94be3-bead-4a60-860f-77ca3fe59903
    name: GetDomainGroup with PowerShell
    reason: Same behaviour seen via Sysmon process command line; confirms Get-DomainGroup ran from a powershell.exe invocation, not only script block content
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Group enumeration often accompanies or precedes BloodHound collection for AD attack-path mapping
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView / AD recon cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*(Get-Domain(User|Computer|Controller|Trust|Policy|GPO|OU)|Get-NetGroup|Get-NetUser|Get-NetComputer|Find-LocalAdminAccess|Invoke-ShareFinder|Invoke-UserHunter|Get-ObjectAcl|Invoke-Kerberoast|Invoke-ACLScanner).*/ OR data_win_eventdata_scriptBlockText:/.*([Pp]ower[Vv]iew\.ps1|Import-Module.*[Pp]ower[Vv]iew).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: PowerView download or in-memory load
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(PowerSploit|[Pp]ower[Vv]iew).*/ AND data_win_eventdata_scriptBlockText:/.*(DownloadString|Invoke-WebRequest|Net\.WebClient|IEX|Invoke-Expression|FromBase64String).*/
    pivot_on:
    - host
    window: 2h
  - name: AD recon binaries and net group commands on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa]d[Ff]ind|[Ss]harp[Hh]ound|[Dd]squery|[Nn]ltest|[Cc]svde|[Ll]difde)\.exe/ OR data_win_eventdata_commandLine:/.*net1? +(group|localgroup).*/ OR data_win_eventdata_commandLine:/.*([Dd]omain [Aa]dmins|[Ee]nterprise [Aa]dmins).*/)
    pivot_on:
    - host
    - user
    window: 2h
  - name: BloodHound collection output files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(BloodHound.*\.(zip|json)|(computers|groups|users|domains|gpos|ous)\.json).*/
    pivot_on:
    - host
    window: 4h
  - name: LSASS access or credential theft after recon
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\lsass\.exe/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(Invoke-Mimikatz|Invoke-Kerberoast|sekurlsa|Get-GPPPassword).*/)
    pivot_on:
    - host
    window: 4h
