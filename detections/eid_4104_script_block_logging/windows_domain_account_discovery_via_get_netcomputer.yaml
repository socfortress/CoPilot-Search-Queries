name: Windows Domain Account Discovery Via Get-NetComputer
id: Windows_Domain_Account_Discovery_Via_Get-NetComputer
version: 1
schema_version: "1.0"
date: "2026-03-27"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects execution of the PowerView PowerShell cmdlet Get-NetComputer with
  AD attribute parameters including samaccountname, accountexpires, lastlogon,
  lastlogoff, pwdlastset, or logoncount. This is a common reconnaissance
  technique used by attackers to enumerate Active Directory computer accounts
  and gather information for lateral movement or privilege escalation.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-NetComputer*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*samaccountname*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*accountexpires*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*lastlogon*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*lastlogoff*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*pwdlastset*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*logoncount*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-27 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging. Confirmed flowing in this environment.
  VALIDATED — 6 hits confirmed for Get-NetComputer with AD attribute parameters.

known_false_positives: >
  Administrators may use PowerView or similar tools for legitimate AD
  enumeration and auditing purposes. Review context and user account to
  determine if the activity is authorized.

references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    PowerView Get-NetComputer AD enumeration detected on $agent_name$ by
    $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1087.002
  risk_score: 15
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 15
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - CISA AA23-347A
    - Active Directory Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - powerview
    - active_directory
    - domain_discovery
    - get_netcomputer
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-NetComputer.*/ AND (data_win_eventdata_scriptBlockText:/.*samaccountname.*/ OR data_win_eventdata_scriptBlockText:/.*accountexpires.*/ OR data_win_eventdata_scriptBlockText:/.*lastlogon.*/ OR data_win_eventdata_scriptBlockText:/.*lastlogoff.*/ OR data_win_eventdata_scriptBlockText:/.*pwdlastset.*/ OR data_win_eventdata_scriptBlockText:/.*logoncount.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de7fcadc-04f3-11ec-a241-acde48001122
    name: AdsiSearcher Account Discovery
    reason: 'Same script-block telemetry: operators often run PowerView and raw [adsisearcher] LDAP queries back to back to enumerate AD accounts.'
  - id: ed550c19-712e-43f6-bd19-6f58f61b3a5e
    name: GetDomainComputer with PowerShell
    reason: Sibling PowerView computer enumeration (Get-DomainComputer) launched from the command line; same objective, different cmdlet name.
  - id: 9a5a41d6-04e7-11ec-923c-acde48001122
    name: Get DomainUser with PowerShell
    reason: 'Natural next PowerView step: after listing computers the operator enumerates domain users and their attributes.'
  - id: 4fa7f846-054a-11ec-a836-acde48001122
    name: Get-DomainTrust with PowerShell
    reason: PowerView trust enumeration follows computer discovery as the attacker maps other domains and forests to pivot into.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: Alternative AD enumeration via the ActiveDirectory module on the same host, indicating a broader AD recon session.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: PowerView recon is routinely paired with SharpHound collection to build BloodHound attack-path graphs from the same foothold.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Confirms escalation from targeted PowerView queries to full automated AD graph collection.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Credential theft in the same PowerShell session is the usual follow-on once target computers and accounts have been identified.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView AD enumeration cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-Net* OR data_win_eventdata_scriptBlockText:*Get-Domain* OR data_win_eventdata_scriptBlockText:*Invoke-ShareFinder* OR data_win_eventdata_scriptBlockText:*Find-LocalAdminAccess* OR data_win_eventdata_scriptBlockText:*Invoke-UserHunter* OR data_win_eventdata_scriptBlockText:*Get-ADComputer* OR data_win_eventdata_scriptBlockText:*Get-ADUser*)
    pivot_on:
    - host
    window: 2h
  - name: PowerView or recon tooling loaded or downloaded into PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*PowerView* OR data_win_eventdata_scriptBlockText:*PowerSploit* OR data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*AmsiUtils*)
    pivot_on:
    - host
    window: 1h
  - name: LDAP and domain controller network connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"445")
    pivot_on:
    - host
    window: 1h
  - name: Lateral movement tooling and remote execution follow-on
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*Invoke-Command* OR data_win_eventdata_commandLine:*Enter-PSSession* OR data_win_eventdata_commandLine:*Invoke-WmiMethod* OR data_win_eventdata_commandLine:*New-PSSession* OR data_win_eventdata_commandLine:*winrs*)
    pivot_on:
    - host
    window: 4h
  - name: Credential dumping and LSASS access after discovery
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*sekurlsa* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*MiniDump*))
    pivot_on:
    - host
    window: 4h
