name: Windows PowerShell MSIX Package Installation
id: d2f77901-dbfa-42d9-8af7-dcd0f1a50a2f
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects PowerShell commands that install unsigned AppX/MSIX packages using
  Add-AppxPackage or Add-AppPackage cmdlets with the -AllowUnsigned flag.
  Adversaries may use unsigned MSIX packages to install malicious applications,
  bypass application signing requirements, or establish persistence. The
  -AllowUnsigned flag is only available on Windows 11 and later, making this
  a targeted technique for modern systems.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Add-AppxPackage*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Add-AppPackage*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-AllowUnsigned*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Developers and system administrators may legitimately install unsigned MSIX
  packages for testing or internal application deployment purposes. Review the
  package path, user context, and whether the activity is part of an approved
  development or testing workflow.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1547/001/
  - https://learn.microsoft.com/en-us/windows/msix/package/unsigned-package
  - https://learn.microsoft.com/en-us/powershell/module/appx/add-appxpackage

response:
  message: >
    PowerShell unsigned MSIX package installation detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1059.001, T1547.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - Malicious PowerShell
    - MSIX Package Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1547.001
  custom_tags:
    - msix
    - appxpackage
    - unsigned_package
    - persistence
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*Add-AppxPackage.*/ OR data_win_eventdata_scriptBlockText:/.*Add-AppPackage.*/) AND data_win_eventdata_scriptBlockText:/.*-AllowUnsigned.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 313d6012-51a0-4d93-8dfc-de8553239e25
    name: Install New Package Via Winget Local Manifest
    reason: Sibling package-manager route for sideloading attacker-controlled packages outside the Store; same actor may try both installers
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The Add-AppxPackage -AllowUnsigned call is often delivered inside an encoded PowerShell stager that precedes it
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Loader PowerShell typically launched with -ExecutionPolicy Bypass before sideloading the unsigned package
  - id: 87e3c4e8-a6a8-4ad9-bb4f-46e7ff99a180
    name: Change PowerShell Policies to an Insecure Level
    reason: Weakening execution policy is a common preparatory step for the same PowerShell session that installs the unsigned MSIX
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell fetching the .msix payload from the internet immediately precedes installation
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Attackers exclude the package path or install directory from Defender before or after the sideloaded app is registered
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender tampering alongside an unsigned-package install indicates deliberate defense evasion for the dropped app
  - id: b36d01a3-ddaf-4804-be18-18a6247adfcd
    name: Add Windows Capability Via PowerShell Cmdlet
    reason: Another PowerShell-driven system feature install used to add attacker tooling on the same host
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download of .msix/.appx/.appinstaller payload via PowerShell or LOLBin
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*.msix* OR *.appx* OR *.msixbundle* OR *.appinstaller*) AND (data_win_eventdata_commandLine:(*Invoke-WebRequest* OR *iwr* OR *DownloadFile* OR *Start-BitsTransfer* OR *curl* OR *bitsadmin* OR *certutil*))
    pivot_on:
    - host
    window: 2h
  - name: MSIX/AppX package file written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.msix OR data_win_eventdata_targetFilename:*.appx OR data_win_eventdata_targetFilename:*.msixbundle OR data_win_eventdata_targetFilename:*.appinstaller)
    pivot_on:
    - host
    window: 2h
  - name: Developer Mode / sideloading / code-integrity policy enabled
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:*AppModelUnlock* OR data_win_eventdata_targetObject:*AllowAllTrustedApps* OR data_win_eventdata_targetObject:*AllowDevelopmentWithoutDevLicense*)
    pivot_on:
    - host
    window: 4h
  - name: Processes launched from WindowsApps package directory
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*\WindowsApps\* OR data_win_eventdata_parentImage:*\WindowsApps\*) AND NOT data_win_eventdata_image:*\Microsoft.*
    pivot_on:
    - host
    window: 4h
  - name: Network connections from unsigned-package app processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:*\WindowsApps\* AND NOT data_win_eventdata_image:*\Microsoft.*
    pivot_on:
    - host
    window: 6h
