      name: "Detect Certify With PowerShell Script Block Logging"
      reason: "same analytic story: Malicious PowerShell"
    - id: bc1dc6b8-c954-11eb-bade-acde48001122
      name: "Detect Empire with PowerShell Script Block Logging"
      reason: "same analytic story: Malicious PowerShell"
