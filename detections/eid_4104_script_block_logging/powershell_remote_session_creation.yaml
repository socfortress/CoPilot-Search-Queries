name: PowerShell Remote Session Creation
id: a0edd39f-a0c6-4c17-8141-261f958e8d8f
version: 1
schema_version: "1.0"
date: "2023-01-02"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a0edd39f-a0c6-4c17-8141-261f958e8d8f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may abuse PowerShell commands and scripts for execution.
  PowerShell is a powerful interactive command-line interface and scripting
  environment included in the Windows operating system. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-PSSession*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-ComputerName *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-PSSession*';
  data_win_eventdata_scriptBlockText matches '*-ComputerName *'.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.001/T1059.001.md#atomic-test-10---powershell-invoke-downloadcradle
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/new-pssession?view=powershell-7.4
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    PowerShell Remote Session Creation detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - session
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
    name: Interactive Session on Remote Endpoint with PowerShell
    reason: Enter-PSSession/New-PSSession with -ComputerName is the same remote-shell lateral movement; interactive variant confirms the session was used hands-on.
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Invoke-Command -ComputerName on the same session/host is the usual payload delivery step right after New-PSSession.
  - id: 7d4c618e-4716-11ec-951c-3e22fbd008af
    name: Remote Process Instantiation via WinRM and PowerShell Script Block
    reason: Remote process creation over WinRM is the direct follow-on once a remote PSSession exists.
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: wsmprovhost.exe on the target is the receiving-side artifact of the remote session this alert creates on the source.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: Child processes spawned under WinRM show what the remote session was used to run.
  - id: c539afac-c12a-46ed-b1bd-5a5567c9f045
    name: Potential Remote PowerShell Session Initiated
    reason: Network connection to WinRM ports 5985/5986 from PowerShell corroborates the session creation at the network layer.
  - id: 991a9744-f2f0-44f2-bd33-9092eba17dc3
    name: Enable Windows Remote Management
    reason: Attackers enable WinRM/PSRemoting (Enable-PSRemoting) on a target as a precursor to creating remote sessions.
  - id: windows-powershell-remote-services-add-trustedhost-001
    name: Powershell Remote Services Add TrustedHost
    reason: Adding TrustedHosts is a common preparation step to allow New-PSSession to non-domain or IP targets.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote command execution via Invoke-Command / Enter-PSSession in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]ommand.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Cc]im[Mm]ethod.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]eceive-[Pp][Ss][Ss]ession.*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell network connections to WinRM ports 5985/5986
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 2h
  - name: WinRM host process wsmprovhost spawning children
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Network logons (type 3/10) and explicit-credential logons by the user
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4648"
    pivot_on:
    - user
    window: 4h
  - name: Credential access or tool staging scripts near remote session
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ekurlsa.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]opy-[Ii]tem.*-[Tt]o[Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]redential.*/)
    pivot_on:
    - host
    window: 2h
