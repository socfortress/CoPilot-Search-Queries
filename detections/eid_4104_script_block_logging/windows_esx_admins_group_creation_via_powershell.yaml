name: Windows ESX Admins Group Creation via PowerShell
id: f48a5557-be06-4b96-b8e8-be563e387620
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects attempts to create an "ESX Admins" group using PowerShell commands
  including New-ADGroup or New-LocalGroup. This activity may indicate an attempt
  to exploit the VMware ESXi Active Directory Integration Authentication Bypass
  vulnerability (CVE-2024-37085). Attackers recreate the 'ESX Admins' group
  after its deletion from Active Directory to gain full administrative access
  to ESXi hosts. This technique has been used by ransomware operators for
  mass encryption of ESXi hypervisors.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*ESX Admins*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*New-ADGroup*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*New-LocalGroup*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Legitimate administrators might create an "ESX Admins" group for valid
  reasons. Verify that the group creation is authorized and part of normal
  administrative tasks. Consider the context of the action, such as the user
  performing it and any related activities.

references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://attack.mitre.org/techniques/T1136/002/
  - https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/24505
  - https://www.microsoft.com/en-us/security/blog/2024/07/29/ransomware-operators-exploit-esxi-hypervisor-vulnerability-for-mass-encryption/

response:
  message: >
    PowerShell command to create ESX Admins group detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1136.001, T1136.002
  risk_score: 56
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 56
    - field: data_win_eventdata_user
      type: user
      score: 56
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - VMware ESXi AD Integration Authentication Bypass CVE-2024-37085
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
    - T1136.002
  custom_tags:
    - esx_admins
    - vmware_esxi
    - cve_2024_37085
    - group_creation
    - ransomware
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*ESX Admins.*/ AND (data_win_eventdata_scriptBlockText:/.*New-ADGroup.*/ OR data_win_eventdata_scriptBlockText:/.*New-LocalGroup.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c408acfe-2870-41df-8d2f-9f4daa4555ed
    name: Potential Exploitation of CVE-2024-37085 - Suspicious Creation Of ESX Admins Group
    reason: Same CVE-2024-37085 group creation seen from process creation (powershell/net command line); corroborates the script block with the executed process and parent
  - id: windows-esx-admins-group-creation-net-001
    name: Windows ESX Admins Group Creation via Net
    reason: Alternate way to create the same 'ESX Admins' group (net group /add); attackers retry with another tool if one is blocked
  - id: b29a93fb-087c-4b5b-a84d-ee3309e69d08
    name: Manipulation of User Computer or Group Security Principals Across AD
    reason: 'Same script-block telemetry: AD principal/group manipulation cmdlets used to create the group and add members alongside it'
  - id: 10fb649c-3600-4d37-b1e6-56ea90bb7e09
    name: User Added To Highly Privileged Group
    reason: After the ESX Admins group exists, the attacker adds their own or a compromised account to it (or Domain Admins) to inherit ESXi admin rights
  - id: e4c73d68-794b-468d-b4d0-dac1772bbae7
    name: Get-AdGroup with PowerShell Script Block
    reason: 'Precursor: attacker enumerates AD groups to confirm ''ESX Admins'' was deleted or absent before recreating it'
  - id: 089c862f-5f83-49b5-b1c8-7e4ff66560c7
    name: Domain Group Discovery with Adsisearcher
    reason: 'Precursor: ADSI-based group discovery in script blocks used to check for the ESX Admins group and privileged groups'
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: 'Precursor: domain privileged group/user enumeration on the DC by the same actor ahead of the privilege manipulation'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Members added to groups on this host (4728/4732/4756 or net/Add-ADGroupMember)
    query: data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/))
    pivot_on:
    - host
    window: 1h
  - name: Any reference to ESX Admins or ESXi/vSphere admin groups in script blocks or command lines
    query: (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ee][Ss][Xx] [Aa][Dd][Mm][Ii][Nn][Ss].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Ss][Xx] [Aa][Dd][Mm][Ii][Nn][Ss].*/)
    pivot_on:
    - host
    - user
    window: 24h
  - name: AD group and privileged-account enumeration in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Ss][Ii][Ss][Ee][Aa][Rr][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp].*/)
    pivot_on:
    - host
    - user
    window: 4h
  - name: Outbound connections to ESXi/vCenter management ports or ESXi SSH/API tooling
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"22" OR data_win_eventdata_destinationPort:"902") AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ll][Ii][Nn][Kk].*/ OR data_win_eventdata_image:/.*[Pp][Uu][Tt][Tt][Yy].*/ OR data_win_eventdata_image:/.*[Ss][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt]-[Vv][Ii][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Xx][Cc][Ll][Ii].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ll][Ii][Nn][Kk].*/))
    pivot_on:
    - host
    window: 6h
  - name: 'Ransomware staging on this host: shadow copy deletion, backup tampering, mass encryption tooling'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)
    pivot_on:
    - host
    window: 6h
