name: Create Volume Shadow Copy with Powershell
id: afd12fed-b0ec-45c9-a13d-aa86625dac81
version: 1
schema_version: "1.0"
date: "2022-01-12"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: afd12fed-b0ec-45c9-a13d-aa86625dac81
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may attempt to access or create a copy of the Active Directory
  domain database in order to steal credential information. MITRE ATT&CK:
  T1003.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Win32_ShadowCopy*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*).Create(*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*ClientAccessible*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Win32_ShadowCopy*';
  data_win_eventdata_scriptBlockText matches '*).Create(*';
  data_win_eventdata_scriptBlockText matches '*ClientAccessible*'.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/get-wmiobject?view=powershell-5.1&viewFallbackFrom=powershell-7
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Create Volume Shadow Copy with Powershell detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1003.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.003
  custom_tags:
    - create
    - volume
    - shadow
    - powershell
    - credential_access
    - ds0005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ AND data_win_eventdata_scriptBlockText:/.*\)\.[Cc][Rr][Ee][Aa][Tt][Ee]\(.*/ AND data_win_eventdata_scriptBlockText:/.*[Cc][Ll][Ii][Ee][Nn][Tt][Aa][Cc][Cc][Ee][Ss][Ss][Ii][Bb][Ll][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9251299c-ea5b-11eb-a8de-acde48001122
    name: Detect Copy of ShadowCopy with Script Block Logging
    reason: 'Direct follow-on: after Win32_ShadowCopy.Create the attacker copies locked files (NTDS.dit, SAM, SYSTEM) out of the new HarddiskVolumeShadowCopy path in PowerShell.'
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Same snapshot-then-copy chain executed via cmd copy from \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopyN, the usual way the new shadow is read.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: The shadow copy is created to read locked credential stores (ntds.dit, SAM, SYSTEM hives); this fires when the shadow path is used to reach them.
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: 'Co-occurring: the same snapshot may be created or repeated via vssadmin/wmic/diskshadow, showing deliberate shadow-copy staging on this host.'
  - id: 40b19fa6-d835-400c-b301-41f3a2baacaf
    name: VolumeShadowCopy Symlink Creation Via Mklink
    reason: 'Alternative access to the freshly created shadow: mklink /d to the shadow device path to browse and copy its contents.'
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: 'Outcome: ntds.dit copied from the shadow lands on disk, written by a non-standard process.'
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: 'Outcome on non-DC hosts: SAM/SYSTEM/SECURITY hive copies extracted from the shadow copy for offline hash cracking.'
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: 'Staging step: extracted ntds.dit/SYSTEM hive is renamed or archived before exfiltration.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files copied out of a HarddiskVolumeShadowCopy path (process creation)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/
    pivot_on:
    - host
    window: 1h
  - name: NTDS.dit / SAM / SYSTEM hive files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*ntds.dit* OR data_win_eventdata_targetFilename:*\\config\\SAM* OR data_win_eventdata_targetFilename:*\\config\\SYSTEM* OR data_win_eventdata_targetFilename:*\\config\\SECURITY* OR data_win_eventdata_targetFilename:*.hiv)
    pivot_on:
    - host
    window: 2h
  - name: Other shadow-copy / ntdsutil / reg save tooling (vssadmin, diskshadow, wmic, ntdsutil)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Ww][Mm][Ii][Cc]|[Rr][Ee][Gg])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*shadow* OR data_win_eventdata_commandLine:*ntds* OR data_win_eventdata_commandLine:*"save"* OR data_win_eventdata_commandLine:*hklm\\sam* OR data_win_eventdata_commandLine:*hklm\\system*))
    pivot_on:
    - host
    window: 2h
  - name: Archive / staging / exfil-style tooling after credential-store copy
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|7[Zz]|7[Zz][Aa]|[Cc][Uu][Rr][Ll]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*Compress-Archive*)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network connections by PowerShell on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
