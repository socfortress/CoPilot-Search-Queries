name: Windows PowerShell Enable SMB1Protocol Feature
id: windows-powershell-enable-smb1protocol-feature-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the enabling of the SMB1 protocol via PowerShell using 
  Enable-WindowsOptionalFeature with SMB1Protocol. Enabling SMB1 can facilitate 
  lateral movement and file encryption by ransomware such as RedDot and Hermetic 
  Wiper. Searches both Sysmon process creation (EventID 1) command lines and 
  PowerShell Script Block Logging (EventID 4104).

data_source:
  - Sysmon EventID 1
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "1"
                    - wildcard:
                        data_win_eventdata_commandLine: "*Enable-WindowsOptionalFeature*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*SMB1Protocol*"
              - bool:
                  must:
                    - term:
                        data_win_system_eventID: "4104"
                    - wildcard:
                        data_win_eventdata_scriptBlockText: "*Enable-WindowsOptionalFeature*"
                    - wildcard:
                        data_win_eventdata_scriptBlockText: "*SMB1Protocol*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Additionally enable PowerShell Script Block Logging 
  (EventCode 4104) for reliable coverage of script-based execution. The Wazuh 
  agent ossec.conf should include the Microsoft-Windows-PowerShell/Operational 
  event channel. Note: 4104 is the primary and most reliable data source for this 
  detection as the command may be executed within an existing PowerShell session 
  without spawning a new process.

known_false_positives: >
  Network operators may legitimately enable or disable SMB1. Filter based on user 
  context. Enabling SMB1 should be rare and investigated in modern environments.

references:
  - https://attack.mitre.org/techniques/T1027/005/
  - https://app.any.run/tasks/c0f98850-af65-4352-9746-fbebadee4f05/

response:
  message: >
    SMB1Protocol feature enabled via PowerShell on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1027.005
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Ransomware
    - Malicious PowerShell
    - Hermetic Wiper
    - Data Destruction
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1027.005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*Enable-WindowsOptionalFeature.*/ AND data_win_eventdata_commandLine:/.*SMB1Protocol.*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Enable-WindowsOptionalFeature.*/ AND data_win_eventdata_scriptBlockText:/.*SMB1Protocol.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
    name: Delete ShadowCopy With PowerShell
    reason: Ransomware prep pairs re-enabling legacy SMB1 (worm-style spread) with destroying shadow copies to block recovery before encryption.
  - id: c1337eb8-921a-4b59-855b-4ba188ddcc42
    name: Deletion of Volume Shadow Copies via WMI with PowerShell - PS Script
    reason: WMI-based VSS deletion in script blocks is the alternate recovery-inhibition step ransomware runs alongside SMB1 enablement.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Operators typically blind Defender (Set-MpPreference) before weakening SMB and deploying the payload in the same PowerShell session.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Adding Defender exclusions precedes dropping wiper/ransomware binaries that will spread over the newly enabled SMB1.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Disabling the host firewall alongside SMB1 opens inbound SMB so the host can be reached and used for lateral spread.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Disabling recovery via bcdedit is a destructive-stage step of the same wiper/ransomware playbooks (Hermetic Wiper, RedDot) that enable SMB1.
  - id: 7b836d7f-179c-4ba4-90a7-a7e60afb48e6
    name: Execute Invoke-command on Remote Host
    reason: Attackers using PowerShell remoting to push the SMB1 change to many hosts show up as Invoke-Command in script blocks.
  - id: 991a9744-f2f0-44f2-bd33-9092eba17dc3
    name: Enable Windows Remote Management
    reason: Enabling WinRM is another host-exposure change made when preparing a machine for remote administration and lateral movement.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy / backup / recovery destruction after SMB1 enablement
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy]).*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/))
    pivot_on:
    - host
    window: 2h
  - name: Defender disabling or exclusions via PowerShell around SMB1 enablement
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/)
    pivot_on:
    - host
    window: 1h
  - name: Firewall disabled or SMB rules opened via netsh / PowerShell
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]|[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]).*/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ss][Mm][Bb][Ss][Ee][Rr][Vv][Ee][Rr][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn].*/))
    pivot_on:
    - host
    window: 1h
  - name: Outbound SMB (445) connections to many peers from this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"139") AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Remote execution tooling and service creation for lateral spread
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Ww][Mm][Ii][Cc]|[Ss][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn]|[Nn][Ee][Tt] +[Uu][Ss][Ee]).*/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Mm][Ii][Mm][Ee][Tt][Hh][Oo][Dd]).*/)
    pivot_on:
    - host
    window: 2h
