name: Get-ForestTrust with PowerShell Script Block
id: 70fac80e-0bf1-11ec-9ba0-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-ForestTrust` cmdlet from 
  PowerSploit using PowerShell Script Block Logging (EventID 4104). This method captures 
  the full command sent to PowerShell, providing detailed visibility into potentially 
  suspicious activities. Monitoring this behavior is crucial as it can indicate an attempt 
  to gather domain trust information, which is often a precursor to lateral movement or 
  privilege escalation. If confirmed malicious, this activity could allow an attacker to 
  map trust relationships within the domain, facilitating further exploitation and access 
  to sensitive resources.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-ForestTrust*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-ForestTrust cmdlet, which is used for forest trust 
  enumeration. Validate that data_win_eventdata_scriptBlockText field is being 
  populated in Elasticsearch/Wazuh Indexer.

known_false_positives: >
  False positives may be present. Tune as needed based on organizational baseline 
  and whether the action was expected and authorized within your organization.

references:
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-ForestTrust/
  - https://www.splunk.com/en_us/blog/security/hunting-for-malicious-powershell-using-script-block-logging.html
  - https://attack.mitre.org/techniques/T1482/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Get-ForestTrust execution detected on $agent_name$ by user $data_win_eventdata_user$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    This indicates forest trust enumeration/reconnaissance activity for lateral movement planning. 
    MITRE ATT&CK: T1482, T1059.001
  risk_score: 55
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 55
    - field: data_win_eventdata_user
      type: user
      score: 55
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1482
    - T1059.001
  custom_tags:
    - get_foresttrust
    - active_directory
    - forest_trust
    - trust_discovery
    - lateral_movement
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-ForestTrust.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 89275e7e-0548-11ec-bf75-acde48001122
    name: Get-DomainTrust with PowerShell Script Block
    reason: PowerView sibling that enumerates domain-level trusts; operators run Get-DomainTrust and Get-ForestTrust back to back to map every trust edge.
  - id: a14803b2-4bd9-4c08-8b57-c37980edebe8
    name: Windows Forest Discovery with GetForestDomain
    reason: Get-ForestDomain lists the domains inside the forest, the natural next step once Get-ForestTrust has revealed the forest boundaries.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-ForestTrust is a PowerSploit/PowerView cmdlet; a broader PowerView import on the same host shows the recon toolkit being loaded, not a one-off admin command.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: nltest /domain_trusts is the native-binary alternative for the same trust enumeration, often used by the same operator before or after the PowerShell attempt.
  - id: 3bad990e-4848-4a78-9530-b427d854aac0
    name: Domain Trust Discovery Via Dsquery
    reason: dsquery * -filter trustedDomain is another LOLBin route to trust mapping that co-occurs when an operator tries multiple methods.
  - id: 676b600a-a94d-4951-b346-11329431e6c1
    name: Get-DomainController with PowerShell Script Block
    reason: After trusts are mapped, attackers enumerate domain controllers of the target domains to pick lateral movement and credential-theft targets.
  - id: bf72941a-cba0-41ea-b18c-9aca3925690d
    name: PowerShell ADRecon Execution
    reason: ADRecon dumps trusts, users, groups and GPOs in one run; trust enumeration is one module of full AD reconnaissance.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: SharpHound collects trust relationships for BloodHound graphing; PowerView trust enumeration commonly accompanies or precedes SharpHound collection in the same intrusion.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView/AD recon cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Tt]rust.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Ff]orest[Dd]omain.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Cc]ontroller.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et[Dd]omain.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Uu]ser.*/ OR data_win_eventdata_scriptBlockText:/.*[Ff]ind-[Ll]ocal[Aa]dmin[Aa]ccess.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Uu]ser[Hh]unter.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Bb]lood[Hh]ound.*/)
    pivot_on:
    - host
    window: 2h
  - name: Native trust and domain discovery binaries
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*[Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\s+[Gg][Rr][Oo][Uu][Pp].*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: LDAP/DC network connections from script interpreters
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"3269" OR data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"445")
    pivot_on:
    - host
    window: 1h
  - name: Kerberoasting and delegation follow-on in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Kk]erberoast.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]equest-[Ss][Pp][Nn][Tt]icket.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Mm]imikatz.*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Cc][Ss]ync.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ii][Dd][Hh]istory.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]rust[Aa]ttributes.*/)
    pivot_on:
    - host
    window: 4h
  - name: Remote execution or sessions toward other trusted domains
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Cc]ommand.*-[Cc]omputer[Nn]ame.*/ OR data_win_eventdata_commandLine:/.*[Nn]ew-[Pp][Ss][Ss]ession.*/ OR data_win_eventdata_commandLine:/.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee].*[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*[Cc][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee]\s+\\\\.*/)
    pivot_on:
    - host
    window: 4h
