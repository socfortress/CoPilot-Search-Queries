name: Tamper Windows Defender - ScriptBlockLogging
id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
version: 1
schema_version: "1.0"
date: "2024-01-02"
author: frack113, elhoim, Tim Shelton (fps, alias support), Swachchhanda Shrawan Poudel, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell scripts attempting to disable scheduled scanning and other
  parts of Windows Defender ATP or set default actions to allow. MITRE ATT&CK:
  T1685.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_scriptBlockText:
                          value: "*Set-MpPreference*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-dbaf $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-dbaf 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-dbm $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-dbm 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-dips $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-dips 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableArchiveScanning $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableArchiveScanning 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableBehaviorMonitoring $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableBehaviorMonitoring 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableBlockAtFirstSeen $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableBlockAtFirstSeen 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableCatchupFullScan $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableCatchupFullScan 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableCatchupQuickScan $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableCatchupQuickScan 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableIntrusionPreventionSystem $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableIntrusionPreventionSystem 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableIOAVProtection $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableIOAVProtection 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableRealtimeMonitoring $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableRealtimeMonitoring 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableRemovableDriveScanning $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableRemovableDriveScanning 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableScanningMappedNetworkDrivesForFullScan $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableScanningMappedNetworkDrivesForFullScan 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableScanningNetworkFiles $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableScanningNetworkFiles 1*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableScriptScanning $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_scriptBlockText:
                                value: "*-DisableScriptScanning 1*"
                                case_insensitive: true
