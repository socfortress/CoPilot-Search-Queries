name: Get ADUserResultantPasswordPolicy with Powershell Script Block
id: 737e1eb0-065a-11ec-921a-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-09"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects the execution of the `Get-ADUserResultantPasswordPolicy` 
  PowerShell cmdlet, which is used to obtain the password policy in a Windows domain. 
  It leverages PowerShell Script Block Logging (EventID 4104) to identify this activity. 
  Monitoring this behavior is significant as it may indicate an attempt to enumerate 
  domain policies, a common tactic used by adversaries for situational awareness and 
  Active Directory discovery. If confirmed malicious, this activity could allow attackers 
  to understand password policies, aiding in further attacks such as password guessing 
  or policy exploitation.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Get-ADUserResultantPasswordPolicy*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-09 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-09 23:59:59.999"

how_to_implement: >
  To successfully implement this analytic, you will need to enable PowerShell Script 
  Block Logging (EventID 4104) on some or all endpoints. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the Get-ADUserResultantPasswordPolicy cmdlet, which retrieves 
  the resultant password policy for a specific user account in the domain. This includes 
  fine-grained password policy settings that may apply to the user based on their group 
  memberships. Attackers use this information to understand password policies for 
  targeted accounts and craft more effective password attacks.

known_false_positives: >
  Administrators or power users may use this command for legitimate troubleshooting 
  and system administration purposes. Filter based on user context and whether the 
  action was expected and authorized within your organization.

references:
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet
  - https://attack.mitre.org/techniques/T1201/
  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/get-aduserresultantpasswordpolicy?view=windowsserver2019-ps

response:
  message: >
    Get-ADUserResultantPasswordPolicy execution detected on $agent_name$ by user 
    $data_win_eventdata_user$. Script: $data_win_eventdata_scriptBlockText$. 
    This indicates user-specific password policy enumeration/reconnaissance activity. 
    MITRE ATT&CK: T1201
  risk_score: 48
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 48
    - field: data_win_eventdata_user
      type: user
      score: 48
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Active Directory Discovery
    - CISA AA23-347A
  asset_type: Endpoint
  mitre_attack_id:
    - T1201
  custom_tags:
    - get_aduserresultantpasswordpolicy
    - active_directory
    - password_policy
    - fine_grained_policy
    - policy_discovery
    - reconnaissance
    - powershell
    - enumeration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*Get-ADUserResultantPasswordPolicy.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1ff7ccc8-065a-11ec-91e4-acde48001122
    name: Get ADDefaultDomainPasswordPolicy with Powershell Script Block
    reason: 'Sibling password-policy recon: the domain-wide default policy query usually accompanies the per-user fine-grained policy query to size a password-spray budget'
  - id: 21432e40-04f4-11ec-b7e6-acde48001122
    name: Get ADUser with PowerShell Script Block
    reason: 'Account enumeration is the usual precursor: attacker lists users then checks the resultant policy for chosen targets'
  - id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
    name: Get-ADUser Enumeration Using UserAccountControl Flags
    reason: Targeted user hunting (no preauth, no password required) that picks which accounts to look up policies for
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Same script session often loads PowerView for wider AD recon alongside the policy query
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: Follow-on target selection for AS-REP roasting once policy and accounts are known
  - id: 12ba6a38-adb3-4d6b-91ba-a7fb248e3199
    name: Password Policy Enumerated
    reason: Domain-controller-side security event for the same policy enumeration, confirming the query reached AD
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: Credential-access escalation after recon in the same intrusion chain
  - id: c2993223-6da8-4b1a-88ee-668b8bf315e9
    name: User Discovery And Export Via Get-ADUser Cmdlet - PowerShell
    reason: Bulk user list export feeding a password-guessing wordlist
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD enumeration cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-ADUser* OR data_win_eventdata_scriptBlockText:*Get-ADDefaultDomainPasswordPolicy* OR data_win_eventdata_scriptBlockText:*Get-ADGroupMember* OR data_win_eventdata_scriptBlockText:*Get-ADComputer* OR data_win_eventdata_scriptBlockText:*Get-DomainUser* OR data_win_eventdata_scriptBlockText:*Get-ADFineGrainedPasswordPolicy*)
    pivot_on:
    - host
    window: 2h
  - name: Password spraying logon failures by user
    query: (data_win_system_eventID:"4625" OR data_win_system_eventID:"4771" OR data_win_system_eventID:"4776")
    pivot_on:
    - user
    window: 4h
  - name: Net.exe and dsquery password-policy or domain recon
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*accounts* OR data_win_eventdata_commandLine:*dsquery* OR data_win_eventdata_commandLine:*nltest* OR data_win_eventdata_commandLine:*"group /domain"*)
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping tooling and LSASS access
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:*lsass.exe*) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Invoke-Mimikatz* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*Invoke-DomainPasswordSpray*))
    pivot_on:
    - host
    window: 6h
  - name: Download cradles or encoded PowerShell before recon
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*Invoke-Expression*)
    pivot_on:
    - host
    window: 2h
