name: Suspicious IO.FileStream
id: 70ad982f-67c8-40e0-a955-b920c2fa05cb
version: 1
schema_version: "1.0"
date: "2022-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 70ad982f-67c8-40e0-a955-b920c2fa05cb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Open a handle on the drive volume via the \\.\ DOS device path specifier and
  perform direct access read of the first few bytes of the volume. MITRE ATT&CK:
  T1070.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-Object*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*IO.FileStream*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText: "*\\\\\\\\.\\\\*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-Object*';
  data_win_eventdata_scriptBlockText matches '*IO.FileStream*';
  data_win_eventdata_scriptBlockText matches '*\\.\*'.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1006/T1006.md
  - https://attack.mitre.org/techniques/T1070/003/

response:
  message: >
    Suspicious IO.FileStream detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1070.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.003
  custom_tags:
    - filestream
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Ii][Oo]\.[Ff][Ii][Ll][Ee][Ss][Tt][Rr][Ee][Aa][Mm].*/ AND data_win_eventdata_scriptBlockText:/.*\\\\\.\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: 'Same goal from the PowerShell side: raw \\.\ volume reads via FileStream are a way to copy locked SAM/SYSTEM hives, and this rule catches the CLI-style copy of those hives.'
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: 'Alternative lock-bypass for the same target: esentutl /y /vss copies the locked SAM; an attacker may try one method after the other on the same host.'
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: Direct volume read of the disk is followed by writing the extracted SAM/SYSTEM/SECURITY hive to a staging file; this file-create event is the output of that step.
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: On a domain controller, raw volume access is used to lift the locked ntds.dit; the dropped copy of ntds.dit by a non-standard process confirms that outcome.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: 'Co-occurring alternative to raw disk reads: reading SAM/NTDS/SYSTEM from a shadow copy path to get around file locks.'
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: Another route to exporting SAM/SYSTEM/SECURITY hive copies; the same hives that raw disk access would extract.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Anti-forensic or ransomware follow-on, since the rule is tagged T1070.003 and direct volume access often precedes shadow-copy and artefact removal.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Raw-disk copy tooling such as Invoke-NinjaCopy is typically loaded in memory in PowerShell via reflection, so this precedes or accompanies the FileStream block.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential hive / NTDS extraction targets touched on this host
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm](\.[Ss][Aa][Vv][Ee])?$/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm](\.[Ss][Aa][Vv][Ee])?$/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Ss][Aa][Vv][Ee].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*(hklm|HKLM)\\([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Shadow copy, ntdsutil or esentutl lock-bypass tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*(\/[Vv][Ss][Ss]|\/[Yy]).*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*[Ii][Ff][Mm].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ll][Oo][Bb][Aa][Ll][Rr][Oo][Oo][Tt]\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Raw disk / PowerSploit-style script blocks (NinjaCopy, CreateFile, DeviceIoControl, MBR/volume reads)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Nn][Ii][Nn][Jj][Aa][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ee][Vv][Ii][Cc][Ee][Ii][Oo][Cc][Oo][Nn][Tt][Rr][Oo][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Hh][Yy][Ss][Ii][Cc][Aa][Ll][Dd][Rr][Ii][Vv][Ee][0-9].*/ OR data_win_eventdata_scriptBlockText:/.*[Kk][Ee][Rr][Nn][Ee][Ll]32.*[Cc][Rr][Ee][Aa][Tt][Ee][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*[Bb][Yy][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Oo]\.[Ff][Ii][Ll][Ee]\]::[Ww][Rr][Ii][Tt][Ee][Aa][Ll][Ll][Bb][Yy][Tt][Ee][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Archive / encode / exfil of staged credential data after raw read
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|[Cc]ertutil.*-encode|[Rr]ar.* a |7z.* a |[Tt]ar .*-[Cc]).*/ OR data_win_eventdata_commandLine:/.*([Cc]url|[Ss]cp|[Ff]tp|[Bb]itsadmin).*(http|ftp|@).*/)) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_initiated:"true")
    pivot_on:
    - host
    window: 4h
  - name: Event-log clearing and shadow-copy removal after raw access
    query: data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll].*[Uu][Ss][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/))
    pivot_on:
    - host
    window: 4h
