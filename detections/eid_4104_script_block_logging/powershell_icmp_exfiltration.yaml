name: PowerShell ICMP Exfiltration
id: 4c4af3cd-2115-479c-8193-6b8bfce9001c
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Bartlomiej Czyz @bczyz1, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4c4af3cd-2115-479c-8193-6b8bfce9001c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Exfiltration Over Alternative Protocol - ICMP. Adversaries may steal
  data by exfiltrating it over an un-encrypted network protocol other than that
  of the existing command and control channel. MITRE ATT&CK: T1048.003.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*New-Object*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*System.Net.NetworkInformation.Ping*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.Send(*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*New-Object*';
  data_win_eventdata_scriptBlockText matches
  '*System.Net.NetworkInformation.Ping*'; data_win_eventdata_scriptBlockText
  matches '*.Send(*'.

known_false_positives: >
  Legitimate usage of System.Net.NetworkInformation.Ping class. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1048.003/T1048.003.md#atomic-test-2---exfiltration-over-alternative-protocol---icmp
  - https://attack.mitre.org/techniques/T1048/003/

response:
  message: >
    PowerShell ICMP Exfiltration detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1048.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048.003
  custom_tags:
    - powershell
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Ii][Nn][Ff][Oo][Rr][Mm][Aa][Tt][Ii][Oo][Nn]\.[Pp][Ii][Nn][Gg].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Ss][Ee][Nn][Dd]\(.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d416556-6502-45b2-9bad-9d2f05f38997
    name: Powershell Sensitive File Discovery
    reason: 'Precursor: script hunts sensitive files to collect the data later pushed out in ICMP payloads'
  - id: b7a3c9a3-09ea-4934-8864-6a32cacd98d9
    name: Zip A Folder With PowerShell For Staging In Temp - PowerShell Script
    reason: 'Precursor: data is archived and staged in Temp before being chunked into ping payloads'
  - id: d59d7842-9a21-4bc6-ba98-64bfe0091355
    name: Powershell DNSExfiltration
    reason: Same operator often tries alternative covert exfil channels (DNS) from PowerShell on the same host
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: 'Parallel exfil channel: HTTP upload via Invoke-RestMethod from the same host if ICMP is throttled'
  - id: 59e8bf41-7472-412a-90d3-00f3afa452e9
    name: Windows Exfiltration Over C2 Via Powershell UploadString
    reason: 'Parallel exfil channel: WebClient.UploadString by the same script host'
  - id: df69cb1d-b891-4cd9-90c7-d617d90100ce
    name: Suspicious FromBase64String Usage On Gzip Archive - Ps Script
    reason: Staged payload decoding/compression typical of loaders that also encode data for covert transport
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: the exfil script itself is commonly delivered by a PowerShell download cradle'
  - id: bd33d2aa-497e-4651-9893-5c5364646595
    name: Suspicious TCP Tunnel Via PowerShell Script
    reason: 'Co-occurring covert channel: PowerShell tunnel/relay tooling on the same host alongside ICMP exfil'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell reading files and encoding bytes (collection for ICMP payload)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-[Cc]ontent.*/ OR data_win_eventdata_scriptBlockText:/.*ReadAllBytes.*/) AND (data_win_eventdata_scriptBlockText:/.*[Tt]o[Bb]ase64[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*GetBytes.*/ OR data_win_eventdata_scriptBlockText:/.*[Bb]yte\[[\]].*/)
    pivot_on:
    - host
    window: 1h
  - name: Ping options / reply handling in script blocks (payload buffer, send loops)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*PingOptions.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]est-[Cc]onnection.*-[Bb]uffer[Ss]ize.*/ OR data_win_eventdata_scriptBlockText:/.*[Pp]ingReply.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]endPingAsync.*/)
    pivot_on:
    - host
    window: 2h
  - name: Archive/staging of data via Compress-Archive, ZipFile or 7z/rar
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_scriptBlockText:/.*ZipFile.*/ OR data_win_eventdata_scriptBlockText:/.*GZipStream.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7z|7za|[Rr]ar|[Ww]in[Rr]ar)\.exe/)
    pivot_on:
    - host
    window: 4h
  - name: Native ping.exe spawned by PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/
    pivot_on:
    - host
    window: 2h
  - name: Other exfil channels from PowerShell (HTTP upload, DNS, raw sockets)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ss]tring.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Rr]esolve-[Dd]ns[Nn]ame.*/ OR data_win_eventdata_scriptBlockText:/.*Net\.Sockets\.(TcpClient|UdpClient).*/)
    pivot_on:
    - host
    window: 4h
