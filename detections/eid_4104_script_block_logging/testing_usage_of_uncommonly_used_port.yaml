name: Testing Usage of Uncommonly Used Port
id: adf876b3-f1f8-4aa9-a4e4-a64106feec06
version: 1
schema_version: "1.0"
date: "2022-01-23"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: adf876b3-f1f8-4aa9-a4e4-a64106feec06
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may communicate using a protocol and port paring that are
  typically not associated. For example, HTTPS over port 8088(Citation: Symantec
  Elfin Mar 2019) or port 587(Citation: Fortinet Agent Tesla April 2018) as
  opposed to the traditional port 443. MITRE ATT&CK: T1571.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Test-NetConnection*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-ComputerName *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-port *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_scriptBlockText"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_scriptBlockText: "* 443 *"
                    - wildcard:
                        data_win_eventdata_scriptBlockText: "* 80 *"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Test-NetConnection*';
  data_win_eventdata_scriptBlockText matches '*-ComputerName *';
  data_win_eventdata_scriptBlockText matches '*-port *', among other conditions.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1571/T1571.md#atomic-test-1---testing-usage-of-uncommonly-used-port-with-powershell
  - https://learn.microsoft.com/en-us/powershell/module/nettcpip/test-netconnection?view=windowsserver2022-ps
  - https://attack.mitre.org/techniques/T1571/

response:
  message: >
    Testing Usage of Uncommonly Used Port detected on host $agent_name$. Matched
    data_win_eventdata_scriptBlockText: $data_win_eventdata_scriptBlockText$.
    Matched data_win_eventdata_scriptBlockId:
    $data_win_eventdata_scriptBlockId$. MITRE ATT&CK: T1571
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1571
  custom_tags:
    - testing
    - uncommonly
    - powershell
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Tt][Ee][Ss][Tt]-[Nn][Ee][Tt][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_scriptBlockText:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Pp][Oo][Rr][Tt] .*/ AND _exists_:data_win_eventdata_scriptBlockText AND NOT (data_win_eventdata_scriptBlockText:/.* 443 .*/ OR data_win_eventdata_scriptBlockText:/.* 80 .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 091712ff-b02a-4d43-82ed-34765515d95d
    name: Get-NetTcpconnection with PowerShell Script Block
    reason: 'Same PowerShell network-recon family: operator enumerating local TCP connections while probing which outbound ports are open for C2.'
  - id: edc2f8ae-2412-4dfd-b9d5-0c57727e70be
    name: Potential Powershell ReverseShell Connection
    reason: 'Likely follow-on: once Test-NetConnection shows an unusual port is open egress, the actor opens a TCP reverse shell over it.'
  - id: afd3df04-948d-46f6-ae44-25966c44b97f
    name: PSAsyncShell - Asynchronous TCP Reverse Shell
    reason: 'Script-block-level follow-on: a PowerShell TCP reverse shell uses the very non-standard port that was just validated.'
  - id: f772cee9-b7c2-4cb2-8f07-49870adc02e0
    name: Malicious Nishang PowerShell Commandlets
    reason: Nishang TCP/one-liner shells are a typical payload deployed after confirming egress on an unusual port.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor or follow-on: the stager/tooling download (cradle) that accompanies port-reachability testing for C2 setup.'
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: Egress validated on a nonstandard port is often followed by data exfiltration over the same channel via PowerShell web cmdlets.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: 'Co-occurring tunnelling/pivoting: attacker building port proxies on the host after testing which ports can leave or enter.'
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: Same host scanning ports internally or externally; Test-NetConnection on odd ports is the scripted equivalent of port scanning.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network connections to non-standard ports from PowerShell or script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp]ower[Ss]hell\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ AND NOT (data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"53")
    pivot_on:
    - host
    window: 1h
  - name: PowerShell TCP socket / reverse-shell constructs in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss]ystem\.[Nn]et\.[Ss]ockets\.[Tt][Cc][Pp][Cc]lient.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Cc][Pp][Ll]istener.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]ockets\.[Ss]ocket.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Ss]tream\(\).*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Oo][Ww][Ee][Rr][Cc][Aa][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Other PowerShell port-probing or reachability sweeps
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Tt]est-[Nn]et[Cc]onnection.*/ OR data_win_eventdata_scriptBlockText:/.*[Tt]est-[Cc]onnection.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Pp]ort[Ss]can.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Pp]ort[Ss]weep.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]onnect[Aa]sync.*/ OR data_win_eventdata_scriptBlockText:/.*1\.\.1024.*/)
    pivot_on:
    - host
    window: 4h
  - name: Tunnelling and port-forward tooling executed on the host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|\\[Nn][Cc]\.[Ee][Xx][Ee]|\\[Nn][Cc][Aa][Tt]\.[Ee][Xx][Ee]|\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|\\[Ff][Rr][Pp][Cc]?\.[Ee][Xx][Ee]|\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\\[Ss][Oo][Cc][Aa][Tt]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/))
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups for dynamic-DNS, tunnel and paste domains
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*ngrok* OR data_win_eventdata_queryName:*duckdns* OR data_win_eventdata_queryName:*no-ip* OR data_win_eventdata_queryName:*serveo* OR data_win_eventdata_queryName:*trycloudflare* OR data_win_eventdata_queryName:*pastebin*)
    pivot_on:
    - host
    window: 2h
