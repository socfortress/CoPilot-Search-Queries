name: Powershell Using memory As Backing Store
id: windows-powershell-using-memory-as-backing-store-001
version: 1
schema_version: "1.0"
date: "2026-03-10"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects suspicious PowerShell script execution using memory streams as a backing 
  store, identified via EventCode 4104. It leverages PowerShell Script Block Logging 
  to capture scripts that create new objects with memory streams, often used to 
  decompress and execute payloads in memory. This activity is significant as it 
  indicates potential in-memory execution of malicious code, bypassing traditional 
  file-based detection. If confirmed malicious, this technique could allow attackers 
  to execute arbitrary code, maintain persistence, or escalate privileges without 
  leaving a trace on the disk.

data_source:
  - PowerShell Script Block Logging 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*New-Object*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*IO.MemoryStream*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - agent_name
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-10 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-10 23:59:59.999"

how_to_implement: >
  This detection requires PowerShell Script Block Logging (EventCode 4104) enabled 
  on Windows endpoints. Enable via registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\
  PowerShell\ScriptBlockLogging\EnableScriptBlockLogging = 1. The Wazuh agent 
  ossec.conf must include the Microsoft-Windows-PowerShell/Operational event channel. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  PowerShell may use this function to store objects into memory for legitimate 
  purposes. However, the combination of New-Object and IO.MemoryStream is often 
  indicative of in-memory payload execution. Filter based on script source and 
  user context to identify anomalies.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://web.archive.org/web/20201112031711/https://www.carbonblack.com/blog/decoding-malicious-powershell-streams/
  - https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://www.crowdstrike.com/blog/investigating-powershell-command-and-script-logging/
  - https://thedfirreport.com/2023/05/22/icedid-macro-ends-in-nokoyawa-ransomware/

response:
  message: >
    Memory stream in-memory execution detected in PowerShell on $agent_name$. 
    Script block: $data_win_eventdata_scriptBlockText$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects: []

tags:
  analytic_story:
    - Data Destruction
    - MoonPeak
    - Medusa Ransomware
    - Hermetic Wiper
    - IcedID
    - Malicious PowerShell
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*New-Object.*/ AND data_win_eventdata_scriptBlockText:/.*IO\.MemoryStream.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: df69cb1d-b891-4cd9-90c7-d617d90100ce
    name: Suspicious FromBase64String Usage On Gzip Archive - Ps Script
    reason: 'Classic MemoryStream companion: base64 blob -> MemoryStream -> GZipStream decompress; same staged in-memory payload unpacking, often in the same or adjacent script block.'
  - id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
    name: PowerShell Loading DotNET into Memory via Reflection
    reason: Decompressed bytes from the MemoryStream are typically handed to Assembly.Load; this is the execution step following the in-memory staging.
  - id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
    name: Potential In-Memory Execution Using Reflection.Assembly
    reason: Reflective assembly loading of the buffer the MemoryStream held; confirms payload was executed, not just decoded.
  - id: windows-powershell-webrequest-using-memory-stream-001
    name: PowerShell WebRequest Using Memory Stream
    reason: Download directly into a MemoryStream is the fileless fetch variant of the same technique, the precursor that supplies the in-memory payload.
  - id: windows-powershell-fileless-script-contains-base64-encoded-content-001
    name: Powershell Fileless Script Contains Base64 Encoded Content
    reason: Embedded base64 payload decoded into the MemoryStream; same fileless loader family and typically the same script block.
  - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
    name: Powershell Fileless Process Injection via GetProcAddress
    reason: Unpacked shellcode in memory is then resolved/injected via Win32 APIs; escalation from staging to injection.
  - id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
    name: PowerShell ShellCode
    reason: Shellcode byte arrays loaded through memory buffers and executed from PowerShell; follow-on to in-memory unpacking.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Loaders disable AMSI before decompressing and running the in-memory payload; precursor evasion step.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Gzip/Deflate decompress and base64 decode in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Zz][Ii][Pp][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ee][Ff][Ll][Aa][Tt][Ee][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 1h
  - name: Reflective assembly load or Win32 memory API use in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]ssembly\]::[Ll]oad.*/ OR data_win_eventdata_scriptBlockText:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et[Pp]roc[Aa]ddress.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]reate[Tt]hread.*/ OR data_win_eventdata_scriptBlockText:/.*[Mm]arshal\]::[Cc]opy.*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell network connections (payload fetch or C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Process injection or remote thread from PowerShell
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND (data_win_eventdata_sourceImage:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on:
    - host
    window: 1h
  - name: Suspicious parent chain launching PowerShell (Office, script hosts, LOLBins)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
