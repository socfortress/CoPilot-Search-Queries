name: Windows PowerShell IIS Components WebGlobalModule Usage
id: 33fc9f6f-0ce7-4696-924e-a69ec61a3d57
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects use of PowerShell cmdlets New-WebGlobalModule, Enable-WebGlobalModule,
  or Set-WebGlobalModule to create, enable, or modify IIS Global Modules.
  Adversaries may use these lesser-known cmdlets to install malicious IIS modules
  for persistence, web shell deployment, or traffic interception. This technique
  is used by threat actors including GhostRedirector, OilRig, and IcedApple
  post-exploitation framework to bypass traditional defenses and maintain
  persistent access to IIS web servers.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*New-WebGlobalModule*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Enable-WebGlobalModule*"
              - wildcard:
                  data_win_eventdata_scriptBlockText: "*Set-WebGlobalModule*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_path
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging enabled on endpoints.
  Enable via Group Policy: Computer Configuration → Administrative Templates
  → Windows Components → Windows PowerShell → Turn on PowerShell Script Block
  Logging.

known_false_positives: >
  Administrators or scripts may legitimately use these cmdlets to manage IIS
  modules for web application deployment. Review the module name, image path,
  and user context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1505/004/
  - https://learn.microsoft.com/en-us/powershell/module/webadministration/new-webglobalmodule
  - https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
  - https://www.crowdstrike.com/wp-content/uploads/2022/05/crowdstrike-iceapple-a-novel-internet-information-services-post-exploitation-framework-1.pdf

response:
  message: >
    PowerShell IIS WebGlobalModule manipulation detected on $agent_name$
    by $data_win_eventdata_user$.
    Script: $data_win_eventdata_scriptBlockText$.
    MITRE ATT&CK: T1505.004
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: script_block

tags:
  analytic_story:
    - GhostRedirector IIS Module and Rungan Backdoor
    - IIS Components
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.004
  custom_tags:
    - iis
    - webglobalmodule
    - persistence
    - web_shell
    - ghostredirector
    - oilrig
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*New-WebGlobalModule.*/ OR data_win_eventdata_scriptBlockText:/.*Enable-WebGlobalModule.*/ OR data_win_eventdata_scriptBlockText:/.*Set-WebGlobalModule.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-iis-components-add-new-module-001
    name: Windows IIS Components Add New Module
    reason: 'Same goal via appcmd.exe: registering a native IIS module; the alternative or companion installer path to the PowerShell WebGlobalModule cmdlets'
  - id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
    name: IIS Native-Code Module Command Line Installation
    reason: Command-line install of a native-code module, the same persistence outcome, often used alongside or instead of New-WebGlobalModule
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: Module registered from an unusual path or name; confirms the DLL enabled via the cmdlet is malicious
  - id: 3fc16961-97e5-4a5b-a079-e4ab0d9763eb
    name: Windows PowerShell Add Module to Global Assembly Cache
    reason: Managed IIS modules must be placed in the GAC before being enabled, so this is a direct precursor in the same script
  - id: 27958de0-2857-43ca-9d4c-b255cf59dcab
    name: Windows PowerShell Disable HTTP Logging
    reason: After installing the module, operators blind IIS logging via PowerShell to hide module-driven traffic
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: 'Anti-forensics follow-on: deleting IIS logs to remove traces of the module drop and its first requests'
  - id: 3eb8c339-a765-48cc-a150-4364c04652bf
    name: IIS WebServer Access Logs Deleted
    reason: File-level evidence that IIS access logs were removed after the module was installed
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: A malicious IIS module executes commands inside w3wp.exe, so child processes of the web server confirm active use
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL or web content dropped into IIS/GAC/inetsrv paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ii][Nn][Ee][Tt][Ss][Rr][Vv].*/ OR data_win_eventdata_targetFilename:/.*[Ii][Nn][Ee][Tt][Pp][Uu][Bb].*/ OR data_win_eventdata_targetFilename:/.*[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\\[Gg][Aa][Cc].*/ OR data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Aa][Ss][Pp]\.[Nn][Ee][Tt] [Ff][Ii][Ll][Ee][Ss].*/) AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Ss][Hh][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Oo][Nn][Ff][Ii][Gg]/)
    pivot_on:
    - host
    window: 2h
  - name: appcmd, iisreset and IIS module config changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Ii][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] [Mm][Oo][Dd][Uu][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ii][Ss]:[Ii][Mm][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Hh][Oo][Ss][Tt]\.[Cc][Oo][Nn][Ff][Ii][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Commands spawned by IIS worker or cmd/PowerShell under w3wp
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: IIS tampering script blocks (GAC, logging, module cmdlets, assembly load)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ys][Ss][Tt][Ee][Mm]\.[Ee][Nn][Tt][Ee][Rr][Pp][Rr][Ii][Ss][Ee][Ss]\.[Pp][Uu][Bb][Ll][Ii][Ss][Hh].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ww][Ee][Bb][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Gg][Ff][Ii][Ll][Ee].*[Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ww][Ee][Bb][Gg][Ll][Oo][Bb][Aa][Ll][Mm][Oo][Dd][Uu][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*[Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Web server host making outbound connections after module install
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Ii][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
