name: Suspicious TCP Tunnel Via PowerShell Script
id: bd33d2aa-497e-4651-9893-5c5364646595
version: 1
schema_version: "1.0"
date: "2022-07-08"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bd33d2aa-497e-4651-9893-5c5364646595
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects powershell scripts that creates sockets/listeners which could be
  indicative of tunneling activity. MITRE ATT&CK: T1090.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*[System.Net.HttpWebRequest]*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*System.Net.Sockets.TcpListener*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*AcceptTcpClient*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*[System.Net.HttpWebRequest]*';
  data_win_eventdata_scriptBlockText matches '*System.Net.Sockets.TcpListener*';
  data_win_eventdata_scriptBlockText matches '*AcceptTcpClient*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Arno0x/PowerShellScripts/blob/a6b7d5490fbf0b20f91195838f3a11156724b4f7/proxyTunnel.ps1
  - https://attack.mitre.org/techniques/T1090/

response:
  message: >
    Suspicious TCP Tunnel Via PowerShell Script detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1090
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
  custom_tags:
    - tunnel
    - powershell
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Hh][Tt][Tt][Pp][Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]\].*/ AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt][Ss]\.[Tt][Cc][Pp][Ll][Ii][Ss][Tt][Ee][Nn][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Aa][Cc][Cc][Ee][Pp][Tt][Tt][Cc][Pp][Cc][Ll][Ii][Ee][Nn][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Tunnel scripts such as proxyTunnel.ps1 are often loaded in-memory after AMSI is neutralised in the same PowerShell session; a precursor that explains how the script ran unblocked.
  - id: a5d85486-b89c-11eb-8267-acde48001122
    name: Allow Inbound Traffic In Firewall Rule
    reason: A TcpListener only helps the attacker if the host firewall allows inbound connections to its port; this opens that port from PowerShell.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: 'Companion step: a netsh rule permitting the listener port so the relay accepts inbound clients.'
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Native alternative or companion to the scripted TCP relay (netsh portproxy); same pivot/proxy objective on the same host.
  - id: edc2f8ae-2412-4dfd-b9d5-0c57727e70be
    name: Potential Powershell ReverseShell Connection
    reason: PowerShell raw-socket reverse shell via TcpClient is the co-occurring C2 channel that the tunnel script would carry or replace.
  - id: 48a61b29-389f-4032-b317-b30de6b95314
    name: Suspicious Plink Port Forwarding
    reason: Attackers who tunnel with a PowerShell relay often chain it to plink/SSH forwarding to reach the internal target or exit the network.
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Alternative or follow-on dedicated tunneling tool dropped when the scripted relay is insufficient; same pivoting goal.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Public tunneling service often used to expose the local listener externally, completing the inbound C2 / pivot path.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerShell socket/listener script blocks on host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Tt][Cc][Pp][Ll][Ii][Ss][Tt][Ee][Nn][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Tt][Cc][Pp][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt][Ss]\.[Ss][Oo][Cc][Kk][Ee][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Rr][Ee][Aa][Mm][Rr][Ee][Aa][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Firewall / portproxy changes opening the relay port
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Aa][Dd][Dd].*[Rr][Uu][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee].*/)
    pivot_on:
    - host
    window: 1h
  - name: Inbound network connections accepted by PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_initiated:"false"
    pivot_on:
    - host
    window: 1h
  - name: Dedicated tunneling tools executed on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ll][Ii][Nn][Kk]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Nn][Gg][Rr][Oo][Kk]|[Ff][Rr][Pp][Cc]|[Ff][Rr][Pp][Ss]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt]|[Ii][Oo][Xx])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Script-block download or encoded staging preceding the tunnel
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 4h
