name: Suspicious Invoke-Item From Mount-DiskImage
id: 902cedee-0398-4e3a-8183-6f3a89773a96
version: 1
schema_version: "1.0"
date: "2022-02-01"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 902cedee-0398-4e3a-8183-6f3a89773a96
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may abuse container files such as disk image (.iso, .vhd) file
  formats to deliver malicious payloads that may not be tagged with MOTW. MITRE
  ATT&CK: T1553.005.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Mount-DiskImage *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*-ImagePath *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Get-Volume*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*.DriveLetter*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*invoke-item *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText: "*):\\\\*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Mount-DiskImage *';
  data_win_eventdata_scriptBlockText matches '*-ImagePath *';
  data_win_eventdata_scriptBlockText matches '*Get-Volume*', among other
  conditions.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1553.005/T1553.005.md#atomic-test-2---mount-an-iso-image-and-run-executable-from-the-iso
  - https://learn.microsoft.com/en-us/powershell/module/storage/mount-diskimage?view=windowsserver2022-ps
  - https://attack.mitre.org/techniques/T1553/005/

response:
  message: >
    Suspicious Invoke-Item From Mount-DiskImage detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1553.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.005
  custom_tags:
    - invoke
    - mount
    - diskimage
    - powershell
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Mm][Oo][Uu][Nn][Tt]-[Dd][Ii][Ss][Kk][Ii][Mm][Aa][Gg][Ee] .*/ AND data_win_eventdata_scriptBlockText:/.*-[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh] .*/ AND data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Vv][Oo][Ll][Uu][Mm][Ee].*/ AND data_win_eventdata_scriptBlockText:/.*\.[Dd][Rr][Ii][Vv][Ee][Ll][Ee][Tt][Tt][Ee][Rr].*/ AND data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ii][Tt][Ee][Mm] .*/ AND data_win_eventdata_scriptBlockText:/.*\):\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0248a7bc-8a9a-4cd8-a57e-3ae8e073a073
    name: ISO Image Mounted
    reason: Same mount action seen from the Security log (object access on the virtual disk); confirms the image was actually mounted by this script.
  - id: 4358e5a5-7542-4dcb-b9f3-87667371839b
    name: ISO or Image Mount Indicator in Recent Files
    reason: Mounting an image and opening its content leaves Recent-file artifacts; corroborates that the user/script opened items from the mounted volume.
  - id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
    name: ISO File Created Within Temp Folders
    reason: 'Precursor: the ISO/VHD is typically dropped to a temp/download folder just before Mount-DiskImage is run on it.'
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: 'Common delivery chain: a phishing archive carries the ISO that is then mounted to evade MOTW, which this script does.'
  - id: 3109530e-ab47-4cc6-a953-cac5ebcc93ae
    name: ADS Zone.Identifier Deleted By Uncommon Application
    reason: Same goal of defeating Mark-of-the-Web on the delivered payload; stripping Zone.Identifier often accompanies or follows container-based delivery.
  - id: 1723e720-616d-4ddc-ab02-f7e3685a4713
    name: Rundll32 Spawned Via Explorer.EXE
    reason: Invoke-Item on a mounted LNK/DLL launcher commonly results in explorer-parented rundll32 executing the payload from the new drive.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Mounted ISOs frequently hold JS/VBS launchers; Invoke-Item runs them via wscript, which then spawns the real payload.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Process execution from a non-C: drive (mounted image content)'
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/[D-Zd-z]:\\.*/ AND NOT data_win_eventdata_image:/[Cc]:\\.*/
    pivot_on:
    - host
    window: 1h
  - name: Script host / LOLBin launched with arguments pointing at another drive
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[ "][D-Zd-z]:\\.*/
    pivot_on:
    - host
    window: 1h
  - name: Disk image or LNK/script container files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ii][Ss][Oo]|[Ii][Mm][Gg]|[Vv][Hh][Dd][Xx]?|[Ll][Nn][Kk]|[Jj][Ss][Ee]?|[Vv][Bb][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: 'Outbound connections or DNS from binaries on a non-C: drive'
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/[D-Zd-z]:\\.*/ AND NOT data_win_eventdata_image:/[Cc]:\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Run-key or startup persistence set after image mount
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(\\[Cc]urrent[Vv]ersion\\[Rr]un|\\[Ss]tartup).*/
    pivot_on:
    - host
    window: 4h
