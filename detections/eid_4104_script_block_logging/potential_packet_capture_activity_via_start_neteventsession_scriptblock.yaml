name: Potential Packet Capture Activity Via Start-NetEventSession - ScriptBlock
id: da34e323-1e65-42db-83be-a6725ac2caa3
version: 1
schema_version: "1.0"
date: "2024-05-12"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: da34e323-1e65-42db-83be-a6725ac2caa3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of powershell scripts with calls to the
  "Start-NetEventSession" cmdlet. Which allows an attacker to start event and
  packet capture for a network event session. Adversaries may attempt to capture
  network to gather information over the course of an operation. Data captured
  via this technique may include user credentials, especially those sent over an
  insecure, unencrypted protocol. MITRE ATT&CK: T1040.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*Start-NetEventSession*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Start-NetEventSession*'.

known_false_positives: >
  Legitimate network diagnostic scripts. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/5f866ca4517e837c4ea576e7309d0891e78080a8/atomics/T1040/T1040.md#atomic-test-16---powershell-network-sniffing
  - https://github.com/0xsyr0/Awesome-Cybersecurity-Handbooks/blob/7b8935fe4c82cb64d61343de1a8b2e38dd968534/handbooks/10_post_exploitation.md
  - https://github.com/forgottentq/powershell/blob/9e616363d497143dc955c4fdce68e5c18d28a6cb/captureWindows-Endpoint.ps1#L13
  - https://attack.mitre.org/techniques/T1040/

response:
  message: >
    Potential Packet Capture Activity Via Start-NetEventSession - ScriptBlock
    detected on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1040
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1040
  custom_tags:
    - packet
    - capture
    - start
    - powershell
    - credential_access
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Nn][Ee][Tt][Ee][Vv][Ee][Nn][Tt][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d3c3861d-c504-4c77-ba55-224ba82d0118
    name: New Network Trace Capture Started Via Netsh.EXE
    reason: Same capture goal via a different native tool (netsh trace start); operators often try several built-in sniffers on one host, so a hit confirms deliberate packet capture.
  - id: f956c7c1-0f60-4bc5-b7d7-b39ab3c08908
    name: PktMon.EXE Execution
    reason: Third built-in Windows packet capture utility (pktmon); co-occurs with Start-NetEventSession when an attacker iterates over native sniffing options.
  - id: ba1f7802-adc7-48b4-9ecb-81e227fddfd5
    name: Potential Network Sniffing Activity Using Network Tools
    reason: Third-party sniffers (tshark/windump/wireshark) used as fallback or companion to the native ETW capture session.
  - id: 7b687634-ab20-11ea-bb37-0242ac130002
    name: Windows Pcap Drivers
    reason: Npcap/WinPcap driver installation is the precursor that enables raw capture by sniffing tools; seen shortly before or after native capture attempts.
  - id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
    name: HackTool - Inveigh Execution
    reason: Inveigh is the PowerShell LLMNR/NBNS spoofer and sniffer; both are PowerShell-based on-wire credential capture, so co-occurrence indicates a credential-harvesting objective.
  - id: 93671f99-04eb-4ab4-a161-70d446a84003
    name: Capture Credentials with Rpcping.exe
    reason: Another network-level credential capture technique (forcing NTLM auth to an attacker listener) that pairs with sniffing for NTLM hashes.
  - id: cd1f961e-0b96-436b-b7c6-38da4583ec00
    name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
    reason: NetEventSession is built on ETW; logman manipulation of trace sessions on the same host shows the actor controlling or hiding trace sessions.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: 'Follow-on staging: the resulting .etl capture or harvested data is archived before exfiltration.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other NetEventSession cmdlets configuring/starting capture
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn]ew-[Nn]et[Ee]vent[Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Nn]et[Ee]vent[Pp]acket[Cc]apture[Pp]rovider.*/ OR data_win_eventdata_scriptBlockText:/.*[Aa]dd-[Nn]et[Ee]vent[Pp]rovider.*/ OR data_win_eventdata_scriptBlockText:/.*[Ss]top-[Nn]et[Ee]vent[Ss]ession.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn]et[Ee]vent[Vv][Mm][Ss]witch.*/)
    pivot_on:
    - host
    window: 1h
  - name: Capture tooling and trace file creation (etl/pcap)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp]ktmon|[Tt]shark|[Dd]umpcap|[Ww]ire[Ss]hark|[Ww]in[Dd]ump|[Nn]etsh)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*[Tt]race.*[Ss]tart.*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.([Ee][Tt][Ll]|[Pp][Cc][Aa][Pp]|[Pp][Cc][Aa][Pp][Nn][Gg])/))
    pivot_on:
    - host
    window: 2h
  - name: Capture driver/library loads and Npcap service activity
    query: (data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*([Ww][Pp][Cc][Aa][Pp]|[Pp][Aa][Cc][Kk][Ee][Tt]|[Nn][Pp][Cc][Aa][Pp]).*\.[Dd][Ll][Ll]/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Pp][Cc][Aa][Pp]|[Ww][Ii][Nn][Pp][Cc][Aa][Pp]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Credential-hunting or LLMNR/NBNS spoofing script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ii]nveigh.*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Ll][Mm][Nn][Rr].*[Ss]poof.*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Tt][Ll][Mm][Vv]2.*/ OR data_win_eventdata_scriptBlockText:/.*[Gg]et-[Nn]et[Tt][Cc][Pp][Cc]onnection.*/ OR data_win_eventdata_scriptBlockText:/.*[Ee]nable-[Pp][Ss][Rr]emoting.*/)
    pivot_on:
    - host
    window: 2h
  - name: Staging and exfiltration of capture output
    query: (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*[-][Mm]ethod.*[Pp]ost.*/ OR data_win_eventdata_scriptBlockText:/.*[Uu]pload[Ff]ile.*/ OR data_win_eventdata_scriptBlockText:/.*[Cc]opy-[Ii]tem.*\\\\.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr]ar|7z|[Ww]in[Rr]ar|[Cc]url)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
