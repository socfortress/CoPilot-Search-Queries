name: Allow Inbound Traffic In Firewall Rule
id: a5d85486-b89c-11eb-8267-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects a suspicious PowerShell command that allows inbound 
  traffic to a specific local port within the public profile. It leverages PowerShell 
  Script Block Logging (EventID 4104) to identify commands containing keywords like 
  "New-NetFirewallRule," "Inbound," "Allow," and "-LocalPort." This activity is 
  significant because it may indicate an attacker attempting to establish remote access 
  by modifying firewall rules to expose services. If confirmed malicious, this could 
  allow unauthorized access to the machine, potentially leading to further exploitation, 
  lateral movement, and data exfiltration.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*New-NetFirewallRule*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Inbound*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*Allow*"
        - wildcard:
            data_win_eventdata_scriptBlockText: "*-LocalPort*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting PowerShell Script 
  Block Logging (EventID 4104) from your Windows endpoints. Enable PowerShell 
  operational logs to be imported into the Wazuh index. The Wazuh agent ossec.conf 
  should include the Microsoft-Windows-PowerShell/Operational event channel. This 
  detection monitors for the New-NetFirewallRule PowerShell cmdlet combined with 
  keywords indicating inbound traffic allowance on specific local ports. The detection 
  specifically looks for firewall rules that allow inbound connections, which is 
  commonly used by attackers for remote access establishment.

known_false_positives: >
  Administrators may legitimately allow inbound traffic for legitimate network or 
  machine administration purposes. Filter based on user context and whether the action 
  was expected and authorized within your organization. Legitimate administrative 
  scripts and system management tools may also trigger this detection.

references:
  - https://docs.microsoft.com/en-us/powershell/module/netsecurity/new-netfirewallrule?view=windowsserver2019-ps
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    Suspicious firewall modification detected on endpoint $agent_name$ by user $data_win_eventdata_user$.
    PowerShell Script: $data_win_eventdata_scriptBlockText$. 
    This may indicate an attempt to establish remote access. MITRE ATT&CK: T1021.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script

tags:
  analytic_story:
    - Prohibited Traffic Allowed or Protocol Mismatch
    - NetSupport RMM Tool Abuse
    - Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.001
  custom_tags:
    - firewall_rule
    - new_netfirewallrule
    - inbound_allow
    - remote_access
    - powershell
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*New-NetFirewallRule.*/ AND data_win_eventdata_scriptBlockText:/.*Inbound.*/ AND data_win_eventdata_scriptBlockText:/.*Allow.*/ AND data_win_eventdata_scriptBlockText:/.*LocalPort.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 907ac95c-4dd9-11ec-ba2c-acde48001122
    name: PowerShell Windows Defender Exclusion Commands
    reason: Attackers weaken Defender before or right after opening an inbound port so the exposed listener/implant survives; same script-block session
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Disabling real-time protection/monitoring is a common co-occurring defense-evasion step alongside exposing a service through the firewall
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: 'Same goal via netsh: opening inbound RDP (3389) after the PowerShell rule allows a remote-access port'
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Alternate/parallel method of adding inbound allow rules; attacker tooling often tries both cmdlet and netsh
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Portproxy forwarding commonly accompanies an opened inbound port to pivot traffic to internal hosts
  - id: 3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb
    name: Windows Create Local Account
    reason: A new local account is the typical credential created to log in over the newly exposed RDP/SMB/WinRM port
  - id: windows-powershell-remote-services-add-trustedhost-001
    name: Powershell Remote Services Add TrustedHost
    reason: WinRM TrustedHosts changes pair with an inbound firewall allow when staging remote PowerShell access
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: 'The rule''s analytic story: RMM tool (NetSupport) needs inbound allowance and its execution is the follow-on payload'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Netsh/firewall tampering and RDP enablement on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Remote-access enablement: RDP registry, WinRM, SSH, RMM tools'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Pp][Ss][Rr][Ee][Mm][Oo][Tt][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Mm].*[Qq][Uu][Ii][Cc][Kk][Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_image:/.*(\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]|\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering and encoded PowerShell in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 1h
  - name: New local account or admin-group change preceding remote logon
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?\.?[Ee]?[Xx]?[Ee]? +[Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1?\.?[Ee]?[Xx]?[Ee]? +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Inbound remote logons (network/RDP) on this host
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10") AND NOT data_win_eventdata_ipAddress:("-" OR "127.0.0.1" OR "::1")
    pivot_on:
    - host
    window: 4h
