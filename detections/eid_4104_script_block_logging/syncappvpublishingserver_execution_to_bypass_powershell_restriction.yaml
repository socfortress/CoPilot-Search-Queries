name: SyncAppvPublishingServer Execution to Bypass Powershell Restriction
id: dddfebae-c46f-439c-af7a-fdb6bde90218
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Ensar Şamil, @sblmsrsn, OSCD Community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dddfebae-c46f-439c-af7a-fdb6bde90218
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects SyncAppvPublishingServer process execution which usually utilized by
  adversaries to bypass PowerShell execution restrictions. MITRE ATT&CK: T1218.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*SyncAppvPublishingServer.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*SyncAppvPublishingServer.exe*'.

known_false_positives: >
  App-V clients. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Syncappvpublishingserver/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    SyncAppvPublishingServer Execution to Bypass Powershell Restriction detected
    on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - syncappvpublishingserver
    - bypass
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fbd7c32d-db2a-4418-b92c-566eb8911133
    name: SyncAppvPublishingServer Execute Arbitrary PowerShell Code
    reason: Same LOLBin seen at process creation (EID 1); the process-level view of the same SyncAppvPublishingServer.exe launch, confirming parent and command line.
  - id: 36475a7d-0f6d-4dce-9b01-6aeb473bbaf1
    name: SyncAppvPublishingServer VBS Execute Arbitrary PowerShell Code
    reason: VBS variant of the same SyncAppvPublishingServer proxy path for running arbitrary PowerShell, an alternate delivery of the same bypass.
  - id: fe5ce7eb-dad8-467c-84a9-31ec23bd644a
    name: SyncAppvPublishingServer Bypass Powershell Restriction - PS Module
    reason: Module-logging (4103) twin of this 4104 alert; co-occurs for the same execution and shows the invoked pipeline parameters.
  - id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
    name: Uncommon Child Process Of Appvlp.EXE
    reason: Appvlp.exe is the sibling App-V LOLBin used for the same proxy-execution trick; attackers switch between the two.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Both are PowerShell restriction-bypass techniques; an attacker blocked on one often tries the other.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: The proxied PowerShell payload is typically a download cradle; this is the likely next-step script block on the same host.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: After escaping PowerShell restrictions, attackers commonly disable AMSI before running payloads in memory.
  - id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
    name: Tamper Windows Defender - ScriptBlockLogging
    reason: 'Defense-evasion follow-on: restriction bypass is often followed by disabling Defender from the same session.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SyncAppvPublishingServer / Appvlp process launches with PowerShell child
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:*SyncAppvPublishingServer* OR data_win_eventdata_parentImage:/.*[Aa][Pp][Pp][Vv][Ll][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Aa][Pp][Pp][Vv][Ll][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell download cradles and in-memory loaders in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*Start-BitsTransfer* OR data_win_eventdata_scriptBlockText:*Reflection.Assembly* OR data_win_eventdata_scriptBlockText:*FromBase64String*)
    pivot_on:
    - host
    window: 1h
  - name: AMSI bypass and Defender tampering from PowerShell
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*Set-MpPreference* OR data_win_eventdata_scriptBlockText:*Add-MpPreference* OR data_win_eventdata_scriptBlockText:*DisableRealtimeMonitoring*)
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections and DNS from PowerShell / App-V binaries
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr].*/ OR data_win_eventdata_image:/.*[Aa][Pp][Pp][Vv][Ll][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: Payload or persistence files dropped by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND (data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Bb][Aa][Tt]|[Ll][Nn][Kk])/ OR data_win_eventdata_targetFilename:*Startup*)
    pivot_on:
    - host
    window: 2h
