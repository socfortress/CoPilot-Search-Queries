name: Recon Information for Export with PowerShell
id: a9723fcc-881c-424c-8709-fd61442ab3c3
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a9723fcc-881c-424c-8709-fd61442ab3c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Once established within a system or network, an adversary may use automated
  techniques for collecting internal data. MITRE ATT&CK: T1119.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-Service *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-ChildItem *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Get-Process *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*> $env:TEMP\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*Get-Service *';
  data_win_eventdata_scriptBlockText matches '*Get-ChildItem *';
  data_win_eventdata_scriptBlockText matches '*Get-Process *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
  - https://attack.mitre.org/techniques/T1119/

response:
  message: >
    Recon Information for Export with PowerShell detected on host $agent_name$.
    Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1119
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1119
  custom_tags:
    - recon
    - information
    - export
    - powershell
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee] .*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm] .*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss] .*/) AND data_win_eventdata_scriptBlockText:/.*\> \$[Ee][Nn][Vv]:[Tt][Ee][Mm][Pp]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b7a3c9a3-09ea-4934-8864-6a32cacd98d9
    name: Zip A Folder With PowerShell For Staging In Temp - PowerShell Script
    reason: 'Same TEMP staging area: recon output redirected to $env:TEMP is typically archived next by a script block zipping it for exfil.'
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Process-creation view of Compress-Archive packaging the recon files dropped in TEMP.
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: 'Same T1119 automated collection stage: PowerShell sweeping for document files after host recon is written out.'
  - id: bd5971a7-626d-46ab-8176-ed643f694f68
    name: Extracting Information with PowerShell
    reason: Co-occurring PowerShell data harvesting (ls -r | Select-String patterns) by the same operator after enumerating processes/services/files.
  - id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
    name: Windows Exfiltration Over C2 Via Invoke RestMethod
    reason: 'Likely next step: the staged recon file is posted out with Invoke-RestMethod.'
  - id: 59e8bf41-7472-412a-90d3-00f3afa452e9
    name: Windows Exfiltration Over C2 Via Powershell UploadString
    reason: Alternative exfil of the collected recon output via WebClient UploadString.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: 'Precursor: the recon script is often delivered by a PowerShell download cradle on the same host.'
  - id: 26b692dc-1722-49b2-b496-a8258aa6371d
    name: Clear PowerShell History - PowerShell
    reason: 'Follow-on cleanup: operators wipe PowerShell history and artifacts after collecting and exfiltrating recon data.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files created in TEMP by PowerShell (recon output files)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Archiving of collected data (Compress-Archive, ZipFile, System.IO.Compression)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Zz][Ii][Pp][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound transfer of collected data from PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Other recon commands spawned from PowerShell/cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(whoami|systeminfo|tasklist|ipconfig|netstat|nltest|net|net1)\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]).*/
    pivot_on:
    - host
    window: 2h
