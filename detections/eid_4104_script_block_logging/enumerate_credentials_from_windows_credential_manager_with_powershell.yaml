name: Enumerate Credentials from Windows Credential Manager With PowerShell
id: 603c6630-5225-49c1-8047-26c964553e0e
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 603c6630-5225-49c1-8047-26c964553e0e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may search for common password storage locations to obtain user
  credentials. Passwords are stored in several places on a system, depending on
  the operating system or application holding the credentials. MITRE ATT&CK:
  T1555.

data_source:
  - PowerShell Script Block Logging EventID 4104

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4104"
        
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*vaultcmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_scriptBlockText:
              value: "*/listcreds:*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Windows Credentials*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_scriptBlockText:
                    value: "*Web Credentials*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_scriptBlockText
    - data_win_eventdata_scriptBlockId
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Script Block Logging (EventID 4104) enabled via GPO (Turn
  on PowerShell Script Block Logging) and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where
  data_win_eventdata_scriptBlockText matches '*vaultcmd*';
  data_win_eventdata_scriptBlockText matches '*/listcreds:*';
  data_win_eventdata_scriptBlockText matches '*Windows Credentials*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555/T1555.md
  - https://attack.mitre.org/techniques/T1555/

response:
  message: >
    Enumerate Credentials from Windows Credential Manager With PowerShell
    detected on host $agent_name$. Matched data_win_eventdata_scriptBlockText:
    $data_win_eventdata_scriptBlockText$. Matched
    data_win_eventdata_scriptBlockId: $data_win_eventdata_scriptBlockId$. MITRE
    ATT&CK: T1555
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_scriptBlockText
      type: powershell_script
    - field: data_win_eventdata_scriptBlockId
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555
  custom_tags:
    - enumerate
    - credentials
    - credential
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd].*/ AND data_win_eventdata_scriptBlockText:/.*\/[Ll][Ii][Ss][Tt][Cc][Rr][Ee][Dd][Ss]:.*/ AND (data_win_eventdata_scriptBlockText:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ee][Bb] [Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: 'Natural escalation: after listing vaults with vaultcmd /listcreds, the actor reads the secrets via CredentialManager/Vault APIs from script blocks on the same host.'
  - id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
    name: Windows Credential Manager Access via VaultCmd
    reason: Same vaultcmd /listcreds behaviour seen at process creation; confirms the enumeration from the process side and shows the parent that launched it.
  - id: windows-credentials-access-vaultcli-module-001
    name: Windows Credentials Access Via Vaultcli Module
    reason: Loading vaultcli.dll into a non-standard process is the API-level credential vault read that follows or replaces vaultcmd enumeration.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: cmdkey /list is the sibling Credential Manager enumeration technique; both used together indicate a stored-credential harvesting sweep.
  - id: b1ec66c6-f4d1-4b5c-96dd-af28ccae7727
    name: New Generic Credentials Added Via Cmdkey.EXE
    reason: Attackers who harvested stored creds may add generic credentials via cmdkey to pivot to remote targets they discovered.
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Web Credentials vault is often harvested alongside browser saved logins from PowerShell; same credential-store sweep in the same session.
  - id: 189e3b02-82b2-4b90-9662-411eb64486d4
    name: Potential Invoke-Mimikatz PowerShell Script
    reason: 'Same script-block channel: a broader PowerShell credential toolkit (Mimikatz) commonly runs after vault enumeration finds high-value stored creds.'
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: 'Co-occurring credential-hunting discovery phase: registry credential searches are run in the same sweep as Credential Manager listing.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential Manager dumping APIs in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Dd][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Pp][Ww][Vv][Aa][Uu][Ll][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Ll][Ii].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Ss][Tt][Oo][Rr][Ee][Dd][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Tt][Rr][Ii][Ee][Vv][Ee][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: vaultcmd/cmdkey process execution and parent
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ll][Ii][Ss][Tt][Cc][Rr][Ee][Dd][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Other credential store theft: LSASS access, SAM hive, browser data, DPAPI'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].* [Ss][Aa][Vv][Ee].*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]\\[Pp][Rr][Oo][Tt][Ee][Cc][Tt].*/))
    pivot_on:
    - host
    window: 2h
  - name: Staging and exfiltration of harvested credentials
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*[Uu][Pp][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*[Pp][Oo][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Uu][Pp][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Cc][Ss][Vv].*/))
    pivot_on:
    - host
    window: 4h
  - name: Lateral movement using harvested credentials (network logon / remote exec)
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "9")) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] [Uu][Ss][Ee]|[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Ii][Nn][Rr][Mm]).*/)
    pivot_on:
    - user
    - host
    window: 4h
