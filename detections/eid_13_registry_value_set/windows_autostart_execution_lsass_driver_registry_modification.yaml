name: Windows Autostart Execution LSASS Driver Registry Modification
id: Windows-Autostart-Execution-LSASS-Driver-Registry-Modification
version: 7
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects modifications to undocumented registry keys that instruct LSASS to load
  an extension DLL — specifically DirectoryServiceExtPt and LsaDbExtPt under
  HKLM\SYSTEM\CurrentControlSet\Services\NTDS. These keys are abused by attackers
  to inject malicious DLLs into lsass.exe for credential harvesting (e.g., Mimikatz,
  custom credential stealers). Associated with MITRE T1547.008 (LSASS Drivers) and
  observed in APT campaigns targeting Active Directory environments.

data_source:
  - Sysmon EventID 13 (RegistryEvent - Value Set)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "13"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Services\\NTDS\\DirectoryServiceExtPt"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Services\\NTDS\\LsaDbExtPt"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 (RegistryEvent - Value Set) flowing to the Wazuh
  Indexer. The NTDS registry path must be monitored in your Sysmon configuration.
  Validated on DESKTOP-AM0HLGE with reg.exe writing a DLL path to
  HKLM\SYSTEM\CurrentControlSet\Services\NTDS\DirectoryServiceExtPt. Field names
  confirmed: data_win_eventdata_targetObject, data_win_eventdata_details,
  data_win_eventdata_image.

known_false_positives: >
  Legitimate domain controller software or Microsoft identity components may
  occasionally write to these keys. Rare on standard workstations. Filter by
  data_win_eventdata_image if noise is observed — unsigned or non-system process
  paths are high confidence. Value data pointing to non-standard DLL paths
  (temp, appdata, user-writable dirs) should be treated as high priority.

references:
  - https://blog.xpnsec.com/exploring-mimikatz-part-1/
  - https://github.com/oxfemale/LogonCredentialsSteal/tree/master/lsass_lib
  - https://attack.mitre.org/techniques/T1547/008/

response:
  message: >
    LSASS driver registry key modified on $agent_name$. Registry path:
    $data_win_eventdata_targetObject$. DLL path written:
    $data_win_eventdata_details$. Modified by: $data_win_eventdata_image$.
    This may indicate an attempt to load a malicious DLL into lsass.exe
    for credential theft. MITRE ATT&CK: T1547.008
  risk_score: 49
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []
tags:
  analytic_story:
    - Windows Registry Abuse
    - Credential Access
    - Persistence via LSASS
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.008
  custom_tags:
    - lsass
    - credential_theft
    - registry_persistence
    - ntds
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b3503044-60ce-4bf4-bbcb-e3db98788823
    name: DLL Load via LSASS
    reason: If the written DLL has loaded into lsass (after restart/reboot), the extension is active.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: An unsigned module in lsass is the payoff of the DirectoryServiceExtPt/LsaDbExtPt plant.
  - id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
    name: Potential Persistence Via LSA Extensions
    reason: Sibling LSA extension persistence (Authentication/Notification/Security Packages) often planted together.
  - id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
    name: Security Support Provider (SSP) Added to LSA Configuration
    reason: SSP injection is the alternate route to a credential-stealing DLL in LSASS.
  - id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
    name: Potential Credential Dumping Attempt Using New NetworkProvider - REG
    reason: Another registry-planted credential-harvesting DLL loaded by logon components.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The tool most commonly paired with these LSASS-loaded DLLs for credential theft.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Direct LSASS access is the concurrent or fallback credential theft technique.
  - id: e6e88853-5f20-4c4a-8d26-cd469fd8d31f
    name: Ntdsutil Abuse
    reason: Both target AD credential material on domain controllers; ntdsutil dumping often accompanies this.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Image loads into lsass.exe
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*lsass\.exe/ AND NOT data_win_eventdata_signed:"true"
    pivot_on: host
    window: 24h
  - name: Process access to LSASS by unusual sources
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*lsass\.exe/ AND NOT data_win_eventdata_sourceImage:/.*(MsMpEng|csrss|wininit|services|svchost|WmiPrvSE)\.exe/
    pivot_on: host
    window: 4h
  - name: Commands writing the NTDS extension keys
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*DirectoryServiceExtPt.*/ OR data_win_eventdata_commandLine:/.*LsaDbExtPt.*/)
    pivot_on: host
    window: 2h
  - name: DLL files created outside system paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.dll/ AND NOT data_win_eventdata_targetFilename:/.*(Windows.System32|Windows.WinSxS|Program Files).*/
    pivot_on: host
    window: 2h
  - name: Mimikatz or credential tool command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*sekurlsa.*/ OR data_win_eventdata_commandLine:/.*lsadump.*/ OR data_win_eventdata_commandLine:/.*privilege::debug.*/ OR data_win_eventdata_commandLine:/.*comsvcs.*MiniDump.*/ OR data_win_eventdata_commandLine:/.*procdump.*lsass.*/)
    pivot_on: host
    window: 6h
