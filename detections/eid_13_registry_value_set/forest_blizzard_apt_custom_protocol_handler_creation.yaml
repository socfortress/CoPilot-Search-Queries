name: Forest Blizzard APT - Custom Protocol Handler Creation
id: 5cdeb555-65de-4767-99fe-e26807465148
version: 1
schema_version: "1.0"
date: "2024-04-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5cdeb555-65de-4767-99fe-e26807465148
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the setting of a custom protocol handler with the name "rogue". Seen
  being created by Forest Blizzard APT as reported by MSFT. MITRE ATT&CK:
  T1547.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\PROTOCOLS\\\\Handler\\\\rogue\\\\CLSID*"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "{026CC6D7-34B2-33D5-B551-CA31EB6CE345}"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\PROTOCOLS\Handler\rogue\CLSID*'; data_win_eventdata_details equals
  '{026CC6D7-34B2-33D5-B551-CA31EB6CE345}'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    Forest Blizzard APT - Custom Protocol Handler Creation detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1547.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - forest
    - blizzard
    - custom
    - registry
    - sysmon
    - privilege_escalation
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Ss]\\[Hh][Aa][Nn][Dd][Ll][Ee][Rr]\\[Rr][Oo][Gg][Uu][Ee]\\[Cc][Ll][Ss][Ii][Dd].*/ AND data_win_eventdata_details:/\{026[Cc][Cc]6[Dd]7-34[Bb]2-33[Dd]5-[Bb]551-[Cc][Aa]31[Ee][Bb]6[Cc][Ee]345\}/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d807056b-0e00-4cec-b7f8-b8b7518e382b
    name: Forest Blizzard APT - Custom Protocol Handler DLL Registry Set
    reason: 'Companion step: the CLSID Server value maps the rogue handler to the malicious DLL'
  - id: 07db928c-8632-488e-ac7d-3db847489175
    name: Forest Blizzard APT - Process Creation Activity
    reason: Forest Blizzard GooseEgg process activity runs around the handler registration
  - id: b92d1d19-f5c9-4ed6-bbd5-7476709dc389
    name: Forest Blizzard APT - File Creation Activity
    reason: Forest Blizzard file creation drops the DLL and batch files the handler relies on
  - id: ec7c4e9b-9bc9-47c7-a32f-b53b598da642
    name: Forest Blizzard APT - JavaScript Constrained File Creation
    reason: JavaScript constrained file written by the same toolkit
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CLSID server registration of the handler DLL
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\{026[Cc][Cc]6[Dd]7-34[Bb]2-33[Dd]5-[Bb]551-[Cc][Aa]31[Ee][Bb]6[Cc][Ee]345\}.*/
    pivot_on: host
    window: 24h
  - name: GooseEgg-style batch and tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Tt][Aa][Ss][Kk]\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc][Uu][Tt][Ee]\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ii][Tt]\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Aa][Yy][Zz][Gg][Oo][Oo][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Oo][Oo][Ss][Ee][Ee][Gg][Gg].*/)
    pivot_on: host
    window: 24h
  - name: DLL or batch files dropped in ProgramData / spool paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt].*/)
    pivot_on: host
    window: 24h
  - name: Credential dumping commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/)
    pivot_on: host
    window: 24h
  - name: Processes spawned by the print spooler
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 24h
