name: Potential Credential Dumping Attempt Using New NetworkProvider - REG
id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker tries to add a new network provider in order to dump
  clear text credentials, similar to how the NPPSpy tool does it. MITRE ATT&CK:
  T1003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\System\\\\CurrentControlSet\\\\Services\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\NetworkProvider*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\System\\\\CurrentControlSet\\\\Services\\\\WebClient\\\\NetworkProvider*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\System\\\\CurrentControlSet\\\\Services\\\\LanmanWorkstation\\\\NetworkProvider*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\System\\\\CurrentControlSet\\\\Services\\\\RDPNP\\\\NetworkProvider*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\poqexec.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\System\CurrentControlSet\Services\*'; data_win_eventdata_targetObject
  matches '*\NetworkProvider*'; data_win_eventdata_targetObject matches
  '*\System\CurrentControlSet\Services\WebClient\NetworkProvider*', among other
  conditions.

known_false_positives: >
  Other legitimate network providers used and not filtred in this rule. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://learn.microsoft.com/en-us/troubleshoot/windows-client/setup-upgrade-and-drivers/network-provider-settings-removed-in-place-upgrade
  - https://github.com/gtworek/PSBits/tree/master/PasswordStealing/NPPSpy
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Potential Credential Dumping Attempt Using New NetworkProvider - REG
    detected on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - credential
    - dumping
    - networkprovider
    - registry
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]\\[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ll][Aa][Nn][Mm][Aa][Nn][Ww][Oo][Rr][Kk][Ss][Tt][Aa][Tt][Ii][Oo][Nn]\\[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Rr][Dd][Pp][Nn][Pp]\\[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Pp][Oo][Qq][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: baef1ec6-2ca9-47a3-97cc-4cf2bda10b77
    name: Potential Credential Dumping Attempt Using New NetworkProvider - CLI
    reason: Same NPPSpy registration seen from the command line; same activity from the process side.
  - id: cad1fe90-2406-44dc-bd03-59d0b58fe722
    name: HackTool - NPPSpy Hacktool Usage
    reason: NPPSpy writes captured passwords to a file; confirms the provider is harvesting.
  - id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
    name: Security Support Provider (SSP) Added to LSA Configuration
    reason: Sibling LSA credential-interception persistence, often installed alongside.
  - id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
    name: Potential Persistence Via LSA Extensions
    reason: Related LSA extension persistence used to capture credentials.
  - id: b7966f4a-b333-455b-8370-8ca53c229762
    name: Dropping Of Password Filter DLL
    reason: Another credential-capturing DLL planted by the same kind of operator.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: Cleartext credential enablement often accompanies provider-based harvesting.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NetworkProvider and LSA registry changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Nn][Oo][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Provider DLL and credential log file creation
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Pp][Pp][Ss][Pp][Yy].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Unsigned DLLs loaded into winlogon, lsass or mpnotify
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Pp][Nn][Oo][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee].*/) AND data_win_eventdata_signed:"false"
    pivot_on:
    - host
    window: 4h
  - name: Registry tooling with provider arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]\-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Interactive and remote logons that feed the provider
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"2" OR data_win_eventdata_logonType:"7" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    window: 24h
