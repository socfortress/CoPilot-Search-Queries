name: Windows Enable Win32 ScheduledJob via Registry
id: 12c80db8-ef62-4456-92df-b23e1b3219f6
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects the creation of a new DWORD value named "EnableAt" in the registry
  path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\Configuration". This modification
  enables the use of the at.exe or wmi Win32_ScheduledJob commands to add scheduled tasks on a Windows
  endpoint. The detection leverages Sysmon EventID 13 registry event data. This activity is significant
  because it may indicate that an attacker is enabling the ability to schedule tasks, potentially to
  execute malicious code at specific times or intervals. If confirmed malicious, this could allow
  persistent code execution on the system.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*Schedule\\Configuration*EnableAt"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search you need to be ingesting information on process that include
  the name of the process responsible for the changes from your endpoints into the Endpoint datamodel
  in the Registry node. Sysmon EventID 13 captures registry modifications (SetValue operations).
  Ensure that Sysmon is configured to log registry operations and that these logs are properly ingested
  into Elasticsearch with complete registry path and value information. The detection specifically looks
  for modifications to the EnableAt registry value being set to 0x00000001 in the Schedule Configuration
  path, which enables Windows scheduled task execution via at.exe and WMI Win32_ScheduledJob.

known_false_positives: >
  In some cases, an automated script or system may enable this setting continuously, leading to false
  positives. To avoid such situations, it is recommended to monitor the frequency and context of the
  registry modification and modify or filter the detection rules as needed. This can help reduce false
  positives and ensure that only genuine threats are identified. Additionally, investigate any detected
  instances of this modification and analyze them in the broader context of the system and network to
  determine if further action is necessary.

references:
  - https://securityonline.info/wmiexec-regout-get-outputdata-response-from-registry/
  - https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-scheduledjob

response:
  message: >
    Registry modification detected on $agent_name$. Process $data_win_eventdata_image$
    by user $data_win_eventdata_user$ modified EnableAt registry key to value $data_win_eventdata_details$.
    This may indicate an attempt to enable scheduled task execution via at.exe or WMI Win32_ScheduledJob
    for persistent code execution.
  risk_score: 65
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 65
    - field: data_win_eventdata_user
      type: user
      score: 65
  threat_objects:
    - field: data_win_eventdata_image
      type: process

tags:
  analytic_story:
    - Active Directory Lateral Movement
    - Scheduled Tasks
    - Persistence
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - registry_modification
    - scheduled_tasks
    - persistence
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Schedule\\\\Configuration\\\\EnableAt"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4720b7df-40c3-48fd-bbdf-fd4b3c464f0d
    name: Scheduled TaskCache Change by Uncommon Program
    reason: TaskCache changes by an uncommon program show the task actually being registered after EnableAt is turned on.
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Task XML written under System32\Tasks is the artifact of the job the attacker then schedules.
  - id: 5b16df71-8615-4f7f-ac9b-6c43c0509e61
    name: Hide Schedule Task Via Index Value Tamper
    reason: Hiding a scheduled task via Index value tamper is a common follow-up to make the new job stealthy.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Scheduled task created or modified to run as SYSTEM is the likely execution payload once job scheduling is enabled.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Task creation from env variable or temp paths indicates the scheduled payload location.
  - id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
    name: Suspicious Modification Of Scheduled Tasks
    reason: Modification of existing scheduled tasks is the sibling persistence technique on the same host.
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Suspicious command patterns inside task creation reveal what the job runs.
  - id: 9f9f92ba-5300-43a4-b435-87d1ee571688
    name: Diamond Sleet APT Scheduled Task Creation - Registry
    reason: Registry-level scheduled task creation (Diamond Sleet) is a related stealth persistence path.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: at.exe usage
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Aa][Tt]\.exe/ OR data_win_eventdata_commandLine:/.*[Aa][Tt]\.exe +[0-9\\].*/)
    pivot_on: host
    window: 4h
  - name: WMI Win32_ScheduledJob creation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww]in32_[Ss]cheduled[Jj]ob.*/
    pivot_on: host
    window: 4h
  - name: schtasks create or change
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ss]chtasks.*\/([Cc]reate|[Cc]hange).*/
    pivot_on: host
    window: 4h
  - name: Task files written to System32 Tasks
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\[Ww]indows\\([Ss]ystem32|[Ss]ys[Ww][Oo][Ww]64)\\[Tt]asks\\.*/
    pivot_on: host
    window: 4h
  - name: Scheduled task registry cache changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ss]chedule\\[Tt]ask[Cc]ache\\.*/
    pivot_on: host
    window: 4h
