name: Trust Access Disable For VBApplications
id: 1a5c46e9-f32f-42f7-b2bc-6e9084db7fbf
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Trent Liffick (@tliffick), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1a5c46e9-f32f-42f7-b2bc-6e9084db7fbf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry changes to Microsoft Office "AccessVBOM" to a value of "1"
  which disables trust access for VBA on the victim machine and lets attackers
  execute malicious macros without any Microsoft Office warnings. MITRE ATT&CK:
  T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Security\\\\AccessVBOM"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Security\AccessVBOM'; data_win_eventdata_details equals 'DWORD
  (0x00000001)'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/inversecos/status/1494174785621819397
  - https://www.mcafee.com/blogs/other-blogs/mcafee-labs/zloader-with-a-new-infection-technique/
  - https://securelist.com/scarcruft-surveilling-north-korean-defectors-and-human-rights-activists/105074/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Trust Access Disable For VBApplications detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - trust
    - disable
    - vbapplications
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Aa][Cc][Cc][Ee][Ss][Ss][Vv][Bb][Oo][Mm]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 91239011-fe3c-4b54-9f24-15c86bb65913
    name: Office Macros Warning Disabled
    reason: Macro-security downgrade usually set together with AccessVBOM so malicious VBA runs silently.
  - id: a5c7a43f-6009-4a8c-80c5-32abf1c53ecc
    name: Microsoft Office Protected View Disabled
    reason: Same Office hardening bypass preceding macro execution.
  - id: a166f74e-bf44-409d-b9ba-ea4b2dd8b3cd
    name: Macro Enabled In A Potentially Suspicious Document
    reason: Trust-record change for the document that carries the macro.
  - id: ab871450-37dc-4a3a-997f-6662aa8ae0f1
    name: Disable Macro Runtime Scan Scope
    reason: Disables AMSI scanning of macros, paired with AccessVBOM in loader chains.
  - id: baecf8fb-edbf-429f-9ade-31fc3f22b970
    name: Office Autorun Keys Modification
    reason: Persistence in Office registry keys that commonly follows.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: 'Execution payoff: Office spawning shells or script hosts.'
  - id: e6ce8457-68b1-485b-9bdd-3c2b5d679aa9
    name: VBA DLL Loaded Via Office Application
    reason: Shows VBA actually ran in the Office process.
  - id: b1c50487-1967-4315-a026-6491686d860e
    name: Office Macro File Creation From Suspicious Process
    reason: Dropper creating macro-enabled files, a precursor to the Office hardening change.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Office security registry changes on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Vv][Bb][Aa][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Aa][Cc][Cc][Ee][Ss][Ss][Vv][Bb][Oo][Mm].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Tt][Rr][Uu][Ss][Tt][Ee][Dd] [Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Tt][Rr][Uu][Ss][Tt][Ee][Dd] [Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Ll][Ee][Vv][Ee][Ll].*/)
    pivot_on: host
    window: 4h
  - name: Office applications spawning script hosts or shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]|\\[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss]\.[Ee][Xx][Ee]).*/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Macro-enabled files written on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\.[Xx][Ll][Ss][Mm]|\.[Dd][Oo][Cc][Mm]|\.[Pp][Pp][Tt][Mm]|\.[Xx][Ll][Aa][Mm]|\.[Xx][Ll][Ss][Bb]|\.[Dd][Oo][Tt][Mm]).*/
    pivot_on: host
    window: 4h
  - name: Network connections from Office processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
