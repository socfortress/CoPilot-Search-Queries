name: System Scripts Autorun Keys Modification
id: e7a2fd40-3ae1-4a85-bf80-15cf624fb1b1
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e7a2fd40-3ae1-4a85-bf80-15cf624fb1b1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modification of autostart extensibility point (ASEP) in registry.
  MITRE ATT&CK: T1547.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Startup*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Shutdown*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Logon*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Logoff*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "(Empty)"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Policies\Microsoft\Windows\System\Scripts*';
  data_win_eventdata_targetObject matches '*\Startup*';
  data_win_eventdata_targetObject matches '*\Shutdown*', among other conditions.

known_false_positives: >
  Legitimate software automatically (mostly, during installation) sets up
  autorun keys for legitimate reason. Legitimate administrator sets up autorun
  keys for legitimate reason. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
  - https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
  - https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    System Scripts Autorun Keys Modification detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1547.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - system
    - autorun
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss].*/ AND (data_win_eventdata_targetObject:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ll][Oo][Gg][Oo][Ff][Ff].*/) AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9ace0707-b560-49b8-b6ca-5148b42f39fb
    name: Potential Persistence Via Logon Scripts - Registry
    reason: Registry-based logon script persistence, same ASEP family
  - id: 21d856f9-9281-4ded-9377-51a1a6e2a432
    name: Potential Persistence Via Logon Scripts - CommandLine
    reason: Command-line creation of logon script persistence
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Common autorun key modifications often paired with script persistence
  - id: f674e36a-4b91-431e-8aef-f8a96c2aca35
    name: CurrentControlSet Autorun Keys Modification
    reason: CurrentControlSet autorun changes in the same persistence phase
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Direct autorun key modification via process telemetry
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Startup folder write, parallel persistence mechanism
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run key persistence via reg.exe by the same actor
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script and binary files written to GPO script folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Gg]roup[Pp]olicy\\.*\\[Ss]cripts|[Ss]cripts\\[Ss]tartup|[Ss]cripts\\[Ll]ogon).*/
    pivot_on:
    - host
    window: 4h
  - name: Other persistence registry writes (Run, Winlogon, Services)
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon\\(Userinit|Shell).*/ OR data_win_eventdata_targetObject:/.*[Cc]ontrol[Ss]et\\[Ss]ervices\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Commands touching scripts policy or forcing policy refresh
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]|[Ss]ystem\\[Ss]cripts|[Pp][Ss][Ss][Cc][Rr][Ii][Pp][Tt][Ss]\.[Ii][Nn][Ii]|[Ss][Cc][Rr][Ii][Pp][Tt][Ss]\.[Ii][Nn][Ii]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt][Mm][Pp][Rr]).*/
    pivot_on:
    - host
    window: 4h
  - name: Scheduled task or service created for persistence
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"7045" OR data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Cc]\.[Ee][Xx][Ee].*[Cc][Rr][Ee][Aa][Tt][Ee]).*/)
    pivot_on:
    - host
    window: 4h
