name: Windows Chrome Auto-Update Disabled via Registry
id: windows-chrome-auto-update-disabled-registry-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects registry modifications that disable Google Chrome auto-updates by 
  setting values like AutoUpdateCheckPeriodMinutes, UpdateDefault, or 
  DisableAutoUpdateChecksCheckboxValue under the Google Update policy key. 
  This prevents Chrome from receiving security updates and may indicate 
  browser hijacking, malware persistence, or unauthorized extension maintenance.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*Google\\\\Update*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*AutoUpdateCheckPeriodMinutes*"
              - wildcard:
                  data_win_eventdata_targetObject: "*UpdateDefault*"
              - wildcard:
                  data_win_eventdata_targetObject: "*DisableAutoUpdateChecksCheckboxValue*"
              - wildcard:
                  data_win_eventdata_targetObject: "*Update{8A69D345-D564-463C-AFF1-A69D9E530F96}*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log registry value set events (EventID 13). The 
  Sysmon config must include monitoring of the Google Update policy registry 
  path (HKLM\SOFTWARE\Policies\Google\Update). Add this path to the Sysmon 
  RegistryEvent include rules if not already present.

known_false_positives: >
  IT administrators may intentionally disable Chrome auto-updates in managed 
  environments for testing or compatibility purposes. Filter by approved GPO 
  changes and authorized admin accounts.

references:
  - https://attack.mitre.org/techniques/T1185/
  - https://www.gdatasoftware.com/blog/2025/11/38298-learning-about-browser-hijacking

response:
  message: >
    Chrome auto-update disabled via registry on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1185
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Browser Hijacking
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1185
  custom_tags:
    - chrome
    - browser
    - auto_update
    - registry_modification
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Google\\\\Update.*/ AND (data_win_eventdata_targetObject:/.*AutoUpdateCheckPeriodMinutes.*/ OR data_win_eventdata_targetObject:/.*UpdateDefault.*/ OR data_win_eventdata_targetObject:/.*DisableAutoUpdateChecksCheckboxValue.*/ OR data_win_eventdata_targetObject:/.*Update\{8A69D345-D564-463C-AFF1-A69D9E530F96\}.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2846089a-ffe9-4881-a2a2-43f3be2b8cc7
    name: Windows Chrome Extension Allowed Registry Modification
    reason: Disabling updates is commonly paired with allow-listing a rogue extension through Chrome policy keys.
  - id: da355155-1d23-48f9-bf95-e534ae273ab0
    name: Windows Chrome Enable Extension Loading via Command-Line
    reason: Forced extension loading after policy weakening.
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: Browser launched with an attacker extension follows the policy tampering.
  - id: 0a74c5a9-1b71-4475-9af2-7829d320d5c2
    name: ChromeLoader Malware Execution
    reason: ChromeLoader hijacker installs extensions and freezes browser state; classic user of this policy abuse.
  - id: 841e2abc-0442-4e7f-b445-b22680632a08
    name: Windows Browser Process Launched with Unusual Flags
    reason: Unusual browser flags indicate hijacking or credential theft after hardening was removed.
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: Identifies whether the policy write came from a suspicious process rather than IT tooling.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Chrome and Google Update policy registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*Policies.Google.Chrome.*/ OR data_win_eventdata_targetObject:/.*Google.Update.*/)
    pivot_on: host
    window: 6h
  - name: Browser launched with extension or hijack flags
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*chrome\.exe/ OR data_win_eventdata_image:/.*msedge\.exe/) AND (data_win_eventdata_commandLine:/.*--load-extension.*/ OR data_win_eventdata_commandLine:/.*--disable-extensions-except.*/ OR data_win_eventdata_commandLine:/.*--remote-debugging-port.*/ OR data_win_eventdata_commandLine:/.*--no-sandbox.*/)
    pivot_on: host
    window: 6h
  - name: Extension packages dropped by non-browser processes
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.crx/ OR data_win_eventdata_targetFilename:/.*Extensions.*manifest\.json/) AND NOT data_win_eventdata_image:/.*(chrome|GoogleUpdate|msedge)\.exe/
    pivot_on: host
    window: 6h
  - name: Google Update service or task tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*gupdate.*/ OR data_win_eventdata_commandLine:/.*GoogleUpdate.*/) AND (data_win_eventdata_commandLine:/.*(stop|disable|delete|config).*/)
    pivot_on: host
    window: 4h
  - name: Writers of Google policy keys via reg.exe or PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*Policies.*Google.*/ AND (data_win_eventdata_image:/.*[Rr]eg\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 2h
