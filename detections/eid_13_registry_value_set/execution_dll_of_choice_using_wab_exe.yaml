name: Execution DLL of Choice Using WAB.EXE
id: fc014922-5def-4da9-a0fc-28c973f41bfb
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: oscd.community, Natalia Shornikova
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fc014922-5def-4da9-a0fc-28c973f41bfb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This rule detects that the path to the DLL written in the registry is
  different from the default one. Launched WAB.exe tries to load the DLL from
  Registry. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\WAB\\\\DLLPath"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "%CommonProgramFiles%\\System\\wab32.dll"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\WAB\DLLPath'; data_win_eventdata_details equals
  '%CommonProgramFiles%\System\wab32.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/LOLBAS-Project/LOLBAS/blob/8283d8d91552213ded165fd36deb6cb9534cb443/yml/OSBinaries/Wab.yml
  - https://twitter.com/Hexacorn/status/991447379864932352
  - http://www.hexacorn.com/blog/2018/05/01/wab-exe-as-a-lolbin/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Execution DLL of Choice Using WAB.EXE detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - choice
    - registry
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Aa][Bb]\\[Dd][Ll][Ll][Pp][Aa][Tt][Hh]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/%[Cc][Oo][Mm][Mm][Oo][Nn][Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ff][Ii][Ll][Ee][Ss]%\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ww][Aa][Bb]32\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 395907ee-96e5-4666-af2e-2ca91688e151
    name: Wab Execution From Non Default Location
    reason: WAB launched from a non-default path is how an attacker stages a copy of wab.exe so the redirected DLLPath is honoured
  - id: 63d1ccc0-2a43-4f4b-9289-361b308991ff
    name: Wab/Wabmig Unusual Parent Or Child Processes
    reason: After the DLLPath change, wab.exe/wabmig.exe with an unusual parent or child shows the planted DLL actually executing
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WAB / wabmig process launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Non-default DLL loaded by WAB
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee].*/) AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\.*/
    pivot_on: host
    window: 2h
  - name: DLL files written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 4h
  - name: Child processes spawned by wab.exe
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Network connections made by wab.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
