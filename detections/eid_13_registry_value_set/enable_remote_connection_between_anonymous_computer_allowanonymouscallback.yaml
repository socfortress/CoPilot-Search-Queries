name: Enable Remote Connection Between Anonymous Computer - AllowAnonymousCallback
id: 4d431012-2ab5-4db7-a84e-b29809da2172
version: 1
schema_version: "1.0"
date: "2023-11-03"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4d431012-2ab5-4db7-a84e-b29809da2172
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects enabling of the "AllowAnonymousCallback" registry value, which allows
  a remote connection between computers that do not have a trust relationship.
  MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\WBEM\\\\CIMOM\\\\AllowAnonymousCallback*"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\WBEM\CIMOM\AllowAnonymousCallback*'; data_win_eventdata_details
  equals 'DWORD (0x00000001)'.

known_false_positives: >
  Administrative activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/win32/wmisdk/connecting-to-wmi-remotely-starting-with-vista
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Enable Remote Connection Between Anonymous Computer - AllowAnonymousCallback
    detected on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - enable
    - connection
    - between
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Bb][Ee][Mm]\\[Cc][Ii][Mm][Oo][Mm]\\[Aa][Ll][Ll][Oo][Ww][Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Cc][Aa][Ll][Ll][Bb][Aa][Cc][Kk].*/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f06a3a5-6a09-413f-8743-e6cf35561297
    name: WMI Event Subscription
    reason: WMI event subscription often uses relaxed CIMOM callbacks for remote persistence
  - id: ec1d5e28-8f3b-4188-a6f8-6e8df81dc28e
    name: WMI Persistence - Script Event Consumer
    reason: WMI script event consumer persistence is the likely follow-on
  - id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
    name: Suspicious Scripting in a WMI Consumer
    reason: Suspicious scripting in a WMI consumer confirms malicious WMI use
  - id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
    name: WMIC Remote Command Execution
    reason: Remote WMIC command execution that this setting enables across untrusted hosts
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: WMIC tampering with security products often accompanies WMI abuse
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI remote execution tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ww]mic.*\/node|[Ww]mic.*process.*call.*create|Invoke-WmiMethod|Invoke-CimMethod).*/
    pivot_on: host
    window: 4h
  - name: WmiPrvSE spawning children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]mi[Pp]rv[Ss][Ee].*/
    pivot_on: host
    window: 2h
  - name: WMI event subscription creation
    query: (data_win_system_eventID:19 OR data_win_system_eventID:20 OR data_win_system_eventID:21)
    pivot_on: host
    window: 6h
  - name: Inbound DCOM/WMI RPC connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ss]vchost.*/ AND data_win_eventdata_destinationPort:135
    pivot_on: host
    window: 2h
