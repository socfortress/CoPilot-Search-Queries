name: Potential Persistence Via TypedPaths
id: 086ae989-9ca6-4fe7-895a-759c5544f247
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 086ae989-9ca6-4fe7-895a-759c5544f247
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modification addition to the 'TypedPaths' key in the user or admin
  registry from a non standard application. Which might indicate persistence
  attempt.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\TypedPaths\\\\*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\explorer.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\SysWOW64\\explorer.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\*';
  data_win_eventdata_image equals 'C:\Windows\explorer.exe';
  data_win_eventdata_image equals 'C:\Windows\SysWOW64\explorer.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/dez_/status/1560101453150257154
  - https://forensafe.com/blogs/typedpaths.html

response:
  message: >
    Potential Persistence Via TypedPaths detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - typedpaths
    - registry
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Tt][Yy][Pp][Ee][Dd][Pp][Aa][Tt][Hh][Ss]\\.*/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
