name: New BgInfo.EXE Custom DB Path Registry Configuration
id: 53330955-dc52-487f-a3a2-da24dcff99b5
version: 1
schema_version: "1.0"
date: "2023-08-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 53330955-dc52-487f-a3a2-da24dcff99b5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects setting of a new registry database value related to BgInfo
  configuration. Attackers can for example set this value to save the results of
  the commands executed by BgInfo in order to exfiltrate information. MITRE
  ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Winternals\\\\BGInfo\\\\Database"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Winternals\BGInfo\Database'.

known_false_positives: >
  Legitimate use of external DB to save the results. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    New BgInfo.EXE Custom DB Path Registry Configuration detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - bginfo
    - custom
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss]\\[Bb][Gg][Ii][Nn][Ff][Oo]\\[Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 992dd79f-dde8-4bb0-9085-6350ba97cfb3
    name: New BgInfo.EXE Custom VBScript Registry Configuration
    reason: Sibling BgInfo registry config abuse (custom VBScript); attacker may set several BgInfo values together.
  - id: cd277474-5c52-4423-a52b-ac2d7969902f
    name: New BgInfo.EXE Custom WMI Query Registry Configuration
    reason: Sibling BgInfo registry config abuse (custom WMI query) planted alongside the DB path.
  - id: 811f459f-9231-45d4-959a-0266c6311987
    name: Suspicious Child Process Of BgInfo.EXE
    reason: BgInfo spawning a suspicious child is the execution step that follows this configuration being planted.
  - id: aaf46cdc-934e-4284-b329-34aa701e3771
    name: Uncommon Child Process Of BgInfo.EXE
    reason: Uncommon child of BgInfo.exe confirms the VBScript/WMI/DB config was actually run.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BgInfo.exe process execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Bb][Gg][Ii][Nn][Ff][Oo](64)?\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Child processes spawned by BgInfo
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Bb][Gg][Ii][Nn][Ff][Oo](64)?\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Other BgInfo registry configuration changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss]\\[Bb][Gg][Ii][Nn][Ff][Oo].*/
    pivot_on: host
    window: 6h
  - name: BgInfo-written or bgi files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Bb][Gg][Ii][Nn][Ff][Oo](64)?\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Gg][Ii]/)
    pivot_on: host
    window: 6h
