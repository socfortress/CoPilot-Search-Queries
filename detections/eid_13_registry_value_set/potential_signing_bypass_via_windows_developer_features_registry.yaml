name: Potential Signing Bypass Via Windows Developer Features - Registry
id: b110ebaf-697f-4da1-afd5-b536fa27a2c1
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b110ebaf-697f-4da1-afd5-b536fa27a2c1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the enablement of developer features such as "Developer Mode" or
  "Application Sideloading". Which allows the user to install untrusted
  packages.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\AppModelUnlock*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Policies\\\\Microsoft\\\\Windows\\\\Appx\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\AllowAllTrustedApps"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\AllowDevelopmentWithoutDevLicense"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\CurrentVersion\AppModelUnlock*';
  data_win_eventdata_targetObject matches '*\Policies\Microsoft\Windows\Appx\*';
  data_win_eventdata_targetObject matches '*\AllowAllTrustedApps', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/malmoeb/status/1560536653709598721
  - https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/

response:
  message: >
    Potential Signing Bypass Via Windows Developer Features - Registry detected
    on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - signing
    - bypass
    - developer
    - registry
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Pp][Pp][Mm][Oo][Dd][Ee][Ll][Uu][Nn][Ll][Oo][Cc][Kk].*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Xx]\\.*/) AND (data_win_eventdata_targetObject:/.*\\[Aa][Ll][Ll][Oo][Ww][Aa][Ll][Ll][Tt][Rr][Uu][Ss][Tt][Ee][Dd][Aa][Pp][Pp][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Aa][Ll][Ll][Oo][Ww][Dd][Ee][Vv][Ee][Ll][Oo][Pp][Mm][Ee][Nn][Tt][Ww][Ii][Tt][Hh][Oo][Uu][Tt][Dd][Ee][Vv][Ll][Ii][Cc][Ee][Nn][Ss][Ee]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a383dec4-deec-4e6e-913b-ed9249670848
    name: Potential Signing Bypass Via Windows Developer Features
    reason: Command-line view of the same enablement (reg add / PowerShell) that writes this value.
  - id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
    name: Unsigned AppX Installation Attempt Using Add-AppxPackage
    reason: 'Direct follow-on: sideloading an unsigned package once developer features are enabled.'
  - id: 8b7273a4-ba5d-4d8a-b04f-11f2900d043a
    name: Windows Hypervisor Enforced Code Integrity Disabled
    reason: Parallel code-integrity weakening used to run untrusted code.
  - id: ac9159cc-c364-4304-8f0a-d63fc1a0aabb
    name: ClickOnce Trust Prompt Tampering
    reason: Sibling trust-prompt bypass for installing untrusted packages.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Defense evasion commonly paired with enabling unsigned package install.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Unsigned or sideloaded package installation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Aa][Pp][Pp][Xx][Pp][Aa][Cc][Kk][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Aa][Pp][Pp][Pp][Aa][Cc][Kk][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Aa][Ll][Ll][Oo][Ww][Uu][Nn][Ss][Ii][Gg][Nn][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*-[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss]-[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Aa][Pp][Pp][Xx].*/)
    pivot_on: host
    window: 6h
  - name: Developer-feature registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Mm][Oo][Dd][Ee][Ll][Uu][Nn][Ll][Oo][Cc][Kk].*/ OR data_win_eventdata_targetObject:/.*[Aa][Ll][Ll][Oo][Ww][Aa][Ll][Ll][Tt][Rr][Uu][Ss][Tt][Ee][Dd][Aa][Pp][Pp][Ss].*/ OR data_win_eventdata_targetObject:/.*[Aa][Ll][Ll][Oo][Ww][Dd][Ee][Vv][Ee][Ll][Oo][Pp][Mm][Ee][Nn][Tt][Ww][Ii][Tt][Hh][Oo][Uu][Tt][Dd][Ee][Vv][Ll][Ii][Cc][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Xx].*/)
    pivot_on: host
    window: 6h
  - name: AppX or MSIX package files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Aa][Pp][Pp][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Mm][Ss][Ii][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Pp][Pp][Xx][Bb][Uu][Nn][Dd][Ll][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Mm][Ss][Ii][Xx][Bb][Uu][Nn][Dd][Ll][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Packaged app spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\.*/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 6h
