name: Potential Persistence Via AutodialDLL
id: e6fe26ee-d063-4f5b-b007-39e90aaf50e3
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e6fe26ee-d063-4f5b-b007-39e90aaf50e3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects change the the "AutodialDLL" key which could be used as a persistence
  method to load custom DLL via the "ws2_32" library.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\WinSock2\\\\Parameters\\\\AutodialDLL*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\WinSock2\Parameters\AutodialDLL*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hexacorn.com/blog/2015/01/13/beyond-good-ol-run-key-part-24/
  - https://persistence-info.github.io/Data/autodialdll.html

response:
  message: >
    Potential Persistence Via AutodialDLL detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - autodialdll
    - registry
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ww][Ii][Nn][Ss][Oo][Cc][Kk]2\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Aa][Uu][Tt][Oo][Dd][Ii][Aa][Ll][Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d6c2ce7e-afb5-4337-9ca4-4b5254ed0565
    name: WinSock2 Autorun Keys Modification
    reason: WinSock2 autorun keys are the same Winsock provider hijack surface; AutodialDLL is loaded by ws2_32 so both give network-stack DLL persistence.
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: Creation of a non-existent system DLL is how the attacker stages a DLL that the registry value then points to.
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: A system-named DLL dropped in an unexpected path is often the payload AutodialDLL is set to load.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: After the key is set, a Windows utility loading an unsigned DLL shows the hijack firing.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: reg.exe is a typical way of setting the value and signals scripted persistence setup.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL files created in system or writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.dll/ AND data_win_eventdata_targetFilename:/.*(Windows.System32|Temp|ProgramData|Users.Public|AppData).*/
    pivot_on: host
    window: 6h
  - name: Winsock and network provider registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(WinSock2|Winsock|NetworkProvider|AutodialDLL).*/
    pivot_on: host
    window: 6h
  - name: Unsigned DLL loads from writable paths
    query: data_win_system_eventID:7 AND data_win_eventdata_signed:false AND data_win_eventdata_imageLoaded:/.*\.dll/ AND data_win_eventdata_imageLoaded:/.*(Temp|ProgramData|AppData|Public).*/
    pivot_on: host
    window: 6h
  - name: Command lines touching WinSock2 parameters
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(WinSock2|AutodialDLL).*/
    pivot_on: host
    window: 6h
  - name: Outbound connections initiated
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
