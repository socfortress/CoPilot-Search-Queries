name: Potential Persistence Via GlobalFlags
id: 36803969-5421-41ec-b92f-8500f79c23b0
version: 1
schema_version: "1.0"
date: "2023-06-05"
author: Karneades, Jonhnathan Ribeiro, Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36803969-5421-41ec-b92f-8500f79c23b0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry persistence technique using the GlobalFlags and
  SilentProcessExit keys. MITRE ATT&CK: T1546.012.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Image File Execution Options\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\GlobalFlag*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SilentProcessExit\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\ReportingMode*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\MonitorProcess*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows NT\CurrentVersion\*'; data_win_eventdata_targetObject
  matches '*\Image File Execution Options\*'; data_win_eventdata_targetObject
  matches '*\GlobalFlag*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://oddvar.moe/2018/04/10/persistence-using-globalflags-in-image-file-execution-options-hidden-from-autoruns-exe/
  - https://www.deepinstinct.com/2021/02/16/lsass-memory-dumps-are-stealthier-than-ever-before-part-2/
  - https://attack.mitre.org/techniques/T1546/012/

response:
  message: >
    Potential Persistence Via GlobalFlags detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.012
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.012
  custom_tags:
    - persistence
    - globalflags
    - registry
    - sysmon
    - privilege_escalation
    - car_2013_01_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Gg][Ll][Oo][Bb][Aa][Ll][Ff][Ll][Aa][Gg].*/) OR (data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ss][Ii][Ll][Ee][Nn][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Xx][Ii][Tt]\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg][Mm][Oo][Dd][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 55e29995-75e7-451a-bef0-6225e2f13597
    name: Potential Credential Dumping Via LSASS SilentProcessExit Technique
    reason: SilentProcessExit key is also the LSASS-dump technique; the same registry setup is persistence or credential theft.
  - id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
    name: Credential Dumping Attempt Via WerFault
    reason: 'Follow-on: SilentProcessExit monitoring runs WerFault to dump the monitored process.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Dump file produced if the GlobalFlag/SilentProcessExit config targeted lsass.
  - id: 092af964-4233-4373-b4ba-d86ea2890288
    name: Add Debugger Entry To AeDebug For Persistence
    reason: Sibling process-event debugger-hook persistence.
  - id: df4dc653-1029-47ba-8231-3c44238cc0ae
    name: Potential Persistence Using DebugPath
    reason: Another IFEO-adjacent hook that actors stack with GlobalFlag.
  - id: 9827ae57-3802-418f-994b-d5ecf5cd974b
    name: Potential Registry Persistence Attempt Via DbgManagedDebugger
    reason: Debugger-key persistence from the same family.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: IFEO / SilentProcessExit registry values
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(*Image\ File\ Execution\ Options* OR *SilentProcessExit*)
    pivot_on: host
    window: 24h
  - name: Reg.exe or PowerShell editing IFEO and SilentProcessExit
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*GlobalFlag* OR *SilentProcessExit* OR *MonitorProcess* OR *ReportingMode*)
    pivot_on: host
    window: 6h
  - name: WerFault spawning from silent exit monitoring
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]er[Ff]ault\.exe/
    pivot_on: host
    window: 4h
  - name: Access to LSASS memory
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.exe/
    pivot_on: host
    window: 4h
