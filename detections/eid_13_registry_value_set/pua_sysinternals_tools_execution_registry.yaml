name: PUA - Sysinternals Tools Execution - Registry
id: c7da8edc-49ae-45a2-9e61-9fd860e4e73d
version: 1
schema_version: "1.0"
date: "2025-10-26"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c7da8edc-49ae-45a2-9e61-9fd860e4e73d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of some potentially unwanted tools such as PsExec,
  Procdump, etc. (part of the Sysinternals suite) via the creation of the
  "accepteula" registry key. MITRE ATT&CK: T1588.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Active Directory Explorer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Handle*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\LiveKd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Process Explorer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\ProcDump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\PsExec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\PsLoglist*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\PsPasswd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SDelete*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Sysinternals*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\EulaAccepted"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Active Directory Explorer*'; data_win_eventdata_targetObject matches
  '*\Handle*'; data_win_eventdata_targetObject matches '*\LiveKd*', among other
  conditions.

known_false_positives: >
  Legitimate use of SysInternals tools. Filter the legitimate paths used in your
  environment. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/Moti_B/status/1008587936735035392
  - https://attack.mitre.org/techniques/T1588/002/

response:
  message: >
    PUA - Sysinternals Tools Execution - Registry detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1588.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1588.002
  custom_tags:
    - sysinternals
    - tools
    - registry
    - sysmon
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Aa][Cc][Tt][Ii][Vv][Ee] [Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*\\[Hh][Aa][Nn][Dd][Ll][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ll][Ii][Vv][Ee][Kk][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Ss][Ll][Oo][Gg][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Ss][Pp][Aa][Ss][Ss][Ww][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/) AND data_win_eventdata_targetObject:/.*\\[Ee][Uu][Ll][Aa][Aa][Cc][Cc][Ee][Pp][Tt][Ee][Dd]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: Command-line twin of the EULA registry write when PsExec runs with -accepteula
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: If PsExec was used, the PSEXESVC service appears on the target
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Confirms remote execution via PsExec rather than local admin use
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: ProcDump EULA key is set the first time it is run, often for LSASS credential theft
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Direct execution of ProcDump on the host
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Renamed tools still write the EULA key under the original tool name
  - id: 18da1007-3f26-470f-875d-f77faf1cab31
    name: Ps.exe Renamed SysInternals Tool
    reason: Renamed Sysinternals tool use is evasion that this registry key unmasks
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysinternals tool processes
    query: data_win_system_eventID:1 AND data_win_eventdata_originalFileName:(/.*[Pp]s[Ee]xec.*/ OR /.*[Pp]rocdump.*/ OR /.*[Pp]rocexp.*/ OR /.*[Hh]andle.*/ OR /.*[Aa]dexplorer.*/ OR /.*[Ll]ivekd.*/)
    pivot_on: host
    window: 2h
  - name: accepteula flag on command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*accepteula.*/
    pivot_on: host
    window: 2h
  - name: LSASS access or dump file creation
    query: (data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*lsass\.exe/) OR (data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.dmp/ OR /.*lsass.*/))
    pivot_on: host
    window: 2h
  - name: PsExec service install / named pipes
    query: (data_win_system_eventID:7045 AND data_win_eventdata_serviceName:/.*PSEXESVC.*/) OR (data_win_system_eventID:17 AND data_win_eventdata_pipeName:/.*[Pp]s[Ee]xe.*/)
    pivot_on: host
    window: 4h
  - name: Sysinternals EULA registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*Sysinternals.*EulaAccepted/
    pivot_on: host
    window: 24h
