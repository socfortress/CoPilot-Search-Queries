name: Service Binary in Suspicious Folder
id: a07f0359-4c90-4dc4-a681-8ffea40b4f47
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: Florian Roth (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a07f0359-4c90-4dc4-a681-8ffea40b4f47
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect the creation of a service with a service binary located in a suspicious
  directory. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "HKLM\\\\System\\\\CurrentControlSet\\\\Services\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Start"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Users\\\\Public\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Perflogs\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\ADMIN$\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Temp\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000000)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000001)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000002)"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "HKLM\\\\System\\\\CurrentControlSet\\\\Services\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\ImagePath"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Users\\\\Public\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Perflogs\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\ADMIN$\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Temp\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Common Files\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Temp\\\\*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\CurrentControlSet\\\\Services\\\\MBAMInstallerService\\\\ImagePath"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\MBAMInstallerService.exe\""
                                case_insensitive: true
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\system32\\services.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  'HKLM\System\CurrentControlSet\Services\*'; data_win_eventdata_targetObject
  matches '*\Start'; data_win_eventdata_image matches '*\Users\Public\*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Service Binary in Suspicious Folder detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - service
    - binary
    - folder
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ss][Tt][Aa][Rr][Tt]/ AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Mm][Ii][Nn]\$\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/) AND (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000002\)/)) OR (data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ AND (data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Aa][Dd][Mm][Ii][Nn]\$\\.*/ OR data_win_eventdata_details:/.*\\[Tt][Ee][Mm][Pp]\\.*/))) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_details AND NOT ((data_win_eventdata_image:/.*\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/) OR (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Mm][Bb][Aa][Mm][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ AND data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Mm][Bb][Aa][Mm][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]\"/ AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Same Services registry write seen as a generic suspicious service install; confirms the new service entry.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Process-level view of the same service creation (sc.exe create) that wrote the Start/ImagePath values.
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: Service creation pointing at a suspicious binary directory, the command-line twin of this registry write.
  - id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
    name: Potential CobaltStrike Service Installations - Registry
    reason: Cobalt Strike service install (jump psexec) writes the same ImagePath registry values.
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: Reg.exe rewriting an existing service ImagePath to hijack a legitimate service.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PsExec drops a service binary and registers it; lateral movement variant of this service creation.
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: Service binary file dropped just before the registry entry.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: sc.exe installing a kernel driver service; same service persistence step, driver flavour.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service created via sc.exe or PowerShell
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ss]c\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/) AND data_win_eventdata_commandLine:(/.*[Cc]reate.*[Bb]in[Pp]ath.*/ OR /.*[Nn]ew-[Ss]ervice.*/)
    pivot_on: host
    window: 2h
  - name: Executable dropped in Temp/Public/PerfLogs
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\Users\\Public\\.*\.(exe|dll|sys)/ OR /.*\\[Pp]erf[Ll]ogs\\.*\.(exe|dll|sys)/ OR /.*\\[Tt]emp\\.*\.(exe|dll|sys)/)
    pivot_on: host
    window: 2h
  - name: Process started by services.exe from staging folder
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\Users\\Public\\.*/ OR /.*\\[Pp]erf[Ll]ogs\\.*/ OR /.*\\[Tt]emp\\.*/) AND data_win_eventdata_parentImage:/.*services\.exe/
    pivot_on: host
    window: 4h
  - name: Other service registry modifications
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*\\Services\\.*\\ImagePath/ OR /.*\\Services\\.*\\Start/ OR /.*\\Services\\.*\\ServiceDll/)
    pivot_on: host
    window: 6h
  - name: Outbound network from the staged binary
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\Users\\Public\\.*/ OR /.*\\[Pp]erf[Ll]ogs\\.*/ OR /.*\\[Tt]emp\\.*/)
    pivot_on: host
    window: 4h
