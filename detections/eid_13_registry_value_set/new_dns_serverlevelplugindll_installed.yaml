name: New DNS ServerLevelPluginDll Installed
id: e61e8a88-59a9-451c-874e-70fcc9740d67
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e61e8a88-59a9-451c-874e-70fcc9740d67
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the installation of a DNS plugin DLL via ServerLevelPluginDll
  parameter in registry, which can be used to execute code in context of the DNS
  server (restart required). MITRE ATT&CK: T1574.001, T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\services\\\\DNS\\\\Parameters\\\\ServerLevelPluginDll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\services\DNS\Parameters\ServerLevelPluginDll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/@esnesenon/feature-not-bug-dnsadmin-to-dc-compromise-in-one-line-a0f779b8dc83
  - https://blog.3or.de/hunting-dns-server-level-plugin-dll-injection.html
  - https://attack.mitre.org/techniques/T1574/001/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    New DNS ServerLevelPluginDll Installed detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
    - T1112
  custom_tags:
    - serverlevelplugindll
    - installed
    - registry
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Dd][Nn][Ss]\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Ss][Ee][Rr][Vv][Ee][Rr][Ll][Ee][Vv][Ee][Ll][Pp][Ll][Uu][Gg][Ii][Nn][Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
    name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
    reason: Dnscmd /config /serverlevelplugindll is the usual command that sets this registry value.
  - id: b6457d63-d2a2-4e29-859d-4e7affc153d1
    name: Potential Discovery Activity Via Dnscmd.EXE
    reason: Dnscmd discovery commonly precedes installing the plugin DLL.
  - id: a4e3d776-f12e-42c2-8510-9e6ed1f43ec3
    name: Unusual Child Process of dns.exe
    reason: Unusual child of dns.exe shows the plugin DLL executing code after restart.
  - id: 8f0b1fb1-9bd4-4e74-8cdf-a8de4d2adfd0
    name: Unusual File Deletion by Dns.exe
    reason: Unusual file deletion by dns.exe can follow plugin payload cleanup.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dnscmd execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Dd][Nn][Ss][Cc][Mm][Dd]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Child processes of dns.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Nn][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: DLLs created outside system paths (plugin staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND NOT data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\([Ss][Yy][Ss][Tt][Ee][Mm]32|[Ww][Ii][Nn][Ss][Xx][Ss]).*/
    pivot_on: host
    window: 24h
  - name: DNS service stop/start events
    query: data_win_system_eventID:"7036" AND data_win_eventdata_param1:/.*[Dd][Nn][Ss].*/
    pivot_on: host
    window: 24h
