name: Potential Persistence Via MyComputer Registry Keys
id: 8fbe98a8-8f9d-44f8-aa71-8c572e29ef06
version: 1
schema_version: "1.0"
date: "2024-01-11"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8fbe98a8-8f9d-44f8-aa71-8c572e29ef06
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modification to the "Default" value of the "MyComputer" key and
  subkeys to point to a custom binary that will be launched whenever the
  associated action is executed (see reference section for example).

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\MyComputer*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*(Default)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\CurrentVersion\Explorer\MyComputer*';
  data_win_eventdata_targetObject matches '*(Default)'.

known_false_positives: >
  Unlikely but if you experience FPs add specific processes and locations you
  would like to monitor for. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.hexacorn.com/blog/2017/01/18/beyond-good-ol-run-key-part-55/

response:
  message: >
    Potential Persistence Via MyComputer Registry Keys detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - mycomputer
    - registry
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Mm][Yy][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ AND data_win_eventdata_targetObject:/.*\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 790317c0-0a36-4a6a-a105-6e576bf99a14
    name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
    reason: 'Same pattern: overwriting a Default value so Explorer/COM launches an attacker binary on a user action.'
  - id: 9b0f8a61-91b2-464f-aceb-0527e0a45020
    name: Potential COM Object Hijacking Via TreatAs Subkey - Registry
    reason: Sibling user-hive hijack that executes on shell/COM activation; used together for redundancy.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Actors modifying Explorer shell-launch keys often also write Run keys.
  - id: 9df5f547-c86a-433e-b533-f2794357e242
    name: Classes Autorun Keys Modification
    reason: Classes shell-handler hijacks are the same user-triggered execution family.
  - id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
    name: Suspicious Shell Open Command Registry Modification
    reason: Shell open-command hijack executing on a user verb; same trigger concept.
  - id: 086ae989-9ca6-4fe7-895a-759c5544f247
    name: Potential Persistence Via TypedPaths
    reason: Another Explorer-bound user-triggered persistence key in HKCU.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: The payload referenced by the hijack is frequently also registered in a Run key from a suspicious folder.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Explorer shell and COM hijack key writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Mm][Yy][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Cc][Ll][Ss][Ii][Dd]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)
    pivot_on: host
    window: 4h
  - name: Autorun key persistence on host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Nn][Oo][Tt][Ii][Ff][Yy].*/)
    pivot_on: host
    window: 4h
  - name: LOLBins run by explorer (triggered payload)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/)
    pivot_on: user
    window: 24h
  - name: Binary dropped in user-writable path
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr].*/) AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 4h
  - name: reg.exe or PowerShell editing MyComputer verbs
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Yy][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/)
    pivot_on: host
    window: 4h
