name: Potential SentinelOne Shell Context Menu Scan Command Tampering
id: 6c304b02-06e6-402d-8be4-d5833cdf8198
version: 1
schema_version: "1.0"
date: "2024-03-06"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6c304b02-06e6-402d-8be4-d5833cdf8198
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potentially suspicious changes to the SentinelOne context menu scan
  command by a process other than SentinelOne.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\shell\\\\SentinelOneScan\\\\command\\\\*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_details:
                                      value: "C:\\\\Program Files\\\\SentinelOne\\\\Sentinel Agent*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_details:
                                      value: "C:\\\\Program Files (x86)\\\\SentinelOne\\\\Sentinel Agent*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\SentinelScanFromContextMenu.exe*"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*C:\\\\Program Files\\\\SentinelOne\\\\"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*C:\\\\Program Files (x86)\\\\SentinelOne\\\\"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\shell\SentinelOneScan\command\*'; data_win_eventdata_details matches
  'C:\Program Files\SentinelOne\Sentinel Agent*'; data_win_eventdata_details
  matches 'C:\Program Files (x86)\SentinelOne\Sentinel Agent*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://mrd0x.com/sentinelone-persistence-via-menu-context/

response:
  message: >
    Potential SentinelOne Shell Context Menu Scan Command Tampering detected on
    host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - sentinelone
    - shell
    - context
    - registry
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Hh][Ee][Ll][Ll]\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Oo][Nn][Ee][Ss][Cc][Aa][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\.*/ AND _exists_:data_win_eventdata_details AND _exists_:data_win_eventdata_image AND NOT (((data_win_eventdata_details:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Oo][Nn][Ee]\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll] [Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_details:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Oo][Nn][Ee]\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll] [Aa][Gg][Ee][Nn][Tt].*/) AND data_win_eventdata_details:/.*\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Ss][Cc][Aa][Nn][Ff][Rr][Oo][Mm][Cc][Oo][Nn][Tt][Ee][Xx][Tt][Mm][Ee][Nn][Uu]\.[Ee][Xx][Ee].*/) OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Oo][Nn][Ee][\\]/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Oo][Nn][Ee][\\]/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
