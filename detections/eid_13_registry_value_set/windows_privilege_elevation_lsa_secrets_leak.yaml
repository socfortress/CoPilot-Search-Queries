name: Windows Privilege Elevation - LSA Secrets Leak
id: Windows_Privilege_Elevation_LSA Secrets_Leak
version: 1
schema_version: "1.0"
date: "2026-03-16"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects registry activity targeting HKLM\SECURITY\Policy\Secrets or
  HKLM\SECURITY\Policy\__GT__Decrypt paths, which are indicators of LSA
  secrets dumping. Attackers and credential dumping tools (Mimikatz, Impacket
  secretsdump) access these registry paths to extract cached credentials,
  service account passwords, and other sensitive secrets stored by the
  Local Security Authority. Any access to these paths outside of normal
  system activity is highly suspicious.
  MITRE ATT&CK: T1003.004 (OS Credential Dumping: LSA Secrets).

data_source:
  - Sysmon EventID 13 (RegistryEvent Value Set)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*SECURITY*Policy*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*Secrets*"
              - wildcard:
                  data_win_eventdata_targetObject: "*__GT__Decrypt*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-16 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-16 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon
  installed and configured to log registry value set events (EventID 13).
  Field data_win_eventdata_targetObject is confirmed working across all EventID 13
  detections in this environment. Field-validated — safe simulation of LSA secrets
  dumping is not possible without actual credential dumping tools. Any hit on this
  detection should be treated as critical and investigated immediately.

known_false_positives: >
  Legitimate system processes may occasionally access LSA policy paths during
  normal Windows operation. Review the process image and context to distinguish
  legitimate system activity from malicious credential dumping.

references:
  - https://attack.mitre.org/techniques/T1003/004/
  - https://www.thehacker.recipes/ad/movement/credentials/dumping/lsa-secrets

response:
  message: >
    LSA Secrets registry path accessed on $agent_name$ by $data_win_eventdata_user$.
    Process: $data_win_eventdata_image$.
    Registry path: $data_win_eventdata_targetObject$.
    MITRE ATT&CK: T1003.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
    - field: data_win_eventdata_user
      type: user
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_targetObject
      type: registry_path

tags:
  analytic_story:
    - Credential Dumping
    - Windows Privilege Escalation
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.004
  custom_tags:
    - lsa_secrets
    - credential_dumping
    - mimikatz
    - secretsdump
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*SECURITY.*Policy.*/ AND (data_win_eventdata_targetObject:/.*Secrets.*/ OR data_win_eventdata_targetObject:/.*__GT__Decrypt.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: reg save of SECURITY/SAM/SYSTEM is the offline route to LSA secrets; often the direct cause of this registry access
  - id: 55e29995-75e7-451a-bef0-6225e2f13597
    name: Potential Credential Dumping Via LSASS SilentProcessExit Technique
    reason: Parallel credential theft against LSASS in the same intrusion phase
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: Attackers enable WDigest to harvest plaintext creds alongside LSA secrets
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: Impacket secretsdump is the named tool for LSA secret extraction
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz lsadump::secrets reads these exact registry paths
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Hive/credential file copying is the sibling collection step
  - id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
    name: Security Support Provider (SSP) Added to LSA Configuration
    reason: After stealing secrets, LSA persistence via SSP is a common follow-on
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Stolen service-account secrets are reused for lateral movement via PsExec
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive dumping commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*([Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]).*([Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Aa][Mm]).*/
    pivot_on: host
    window: 4h
  - name: Credential dumping tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]).*/ OR data_win_eventdata_originalFileName:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)
    pivot_on: host
    window: 4h
  - name: Process access to LSASS
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Hive or dump files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\.[Hh][Ii][Vv][Ee]|\.[Dd][Mm][Pp]|[Ss][Aa][Mm]\.[Ss][Aa][Vv]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Ss][Aa][Vv]).*/
    pivot_on: host
    window: 4h
  - name: Service install or admin share use after secrets access
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"5145" AND data_win_eventdata_shareName:/.*(ADMIN|C)\$.*/)
    pivot_on: host
    window: 6h
