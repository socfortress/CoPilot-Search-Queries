name: Antivirus Filter Driver Disallowed On Dev Drive - Registry
id: 31e124fb-5dc4-42a0-83b3-44a69c77b271
version: 1
schema_version: "1.0"
date: "2024-08-16"
author: "@kostastsale, Nasreddine Bencherchali (Nextron Systems)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 31e124fb-5dc4-42a0-83b3-44a69c77b271
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects activity that indicates a user disabling the ability for Antivirus
  mini filter to inspect a "Dev Drive". MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\FilterManager\\\\FltmgrDevDriveAllowAntivirusFilter"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\FilterManager\FltmgrDevDriveAllowAntivirusFilter';
  data_win_eventdata_details equals 'DWORD (0x00000000)'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1720419490519752955
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Antivirus Filter Driver Disallowed On Dev Drive - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - antivirus
    - filter
    - driver
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ff][Ii][Ll][Tt][Ee][Rr][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Ff][Ll][Tt][Mm][Gg][Rr][Dd][Ee][Vv][Dd][Rr][Ii][Vv][Ee][Aa][Ll][Ll][Oo][Ww][Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss][Ff][Ii][Ll][Tt][Ee][Rr]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Disabling Defender via registry; same intent to reduce AV coverage.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Exclusions added through registry, another way to create AV blind spots.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection disabled is the usual precondition for AV registry changes.
  - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
    name: Windows Defender Service Disabled - Registry
    reason: Defender service disabled in registry, escalation of the same evasion.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender exclusions logged by Defender confirm effective changes.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: PowerShell exclusions are the scripted version of creating unscanned areas.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender related registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Windows Defender|FilterManager|WinDefend).*/
    pivot_on: host
    window: 2h
  - name: Dev Drive creation or format commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Dd]ev[Dd]rive|[Dd]evdrv|[Nn]ew-[Vv]olume).*/
    pivot_on: host
    window: 4h
  - name: Executables created on non-C volumes
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1)/ AND NOT data_win_eventdata_targetFilename:/[Cc]:.*/
    pivot_on: host
    window: 4h
  - name: Processes running from non-C drives
    query: data_win_system_eventID:1 AND NOT data_win_eventdata_image:/[Cc]:.*/
    pivot_on: host
    window: 4h
