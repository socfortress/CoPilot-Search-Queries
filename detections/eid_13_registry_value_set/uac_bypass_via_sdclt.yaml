name: UAC Bypass via Sdclt
id: 5b872a46-3b90-45c1-8419-f675db8053aa
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Omer Yampel, Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5b872a46-3b90-45c1-8419-f675db8053aa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using registry key manipulation of sdclt.exe
  (e.g. UACMe 53). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*Software\\\\Classes\\\\exefile\\\\shell\\\\runas\\\\command\\\\isolatedCommand"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*Software\\\\Classes\\\\Folder\\\\shell\\\\open\\\\command\\\\SymbolicLinkValue"
                          case_insensitive: true
                    - regexp:
                        data_win_eventdata_details: ".*(-1[0-9]{3}\\\\Software\\\\Classes\\\\).*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Software\Classes\exefile\shell\runas\command\isolatedCommand';
  data_win_eventdata_targetObject matches
  '*Software\Classes\Folder\shell\open\command\SymbolicLinkValue';
  data_win_eventdata_details matches the regex
  /.*(-1[0-9]{3}\\Software\\Classes\\).*/.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://enigma0x3.net/2017/03/17/fileless-uac-bypass-using-sdclt-exe/
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass via Sdclt detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - sdclt
    - registry
    - sysmon
    - privilege_escalation
    - car_2019_04_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Ee][Xx][Ee][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Rr][Uu][Nn][Aa][Ss]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Ii][Ss][Oo][Ll][Aa][Tt][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd]/ OR (data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Ff][Oo][Ll][Dd][Ee][Rr]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Ss][Yy][Mm][Bb][Oo][Ll][Ii][Cc][Ll][Ii][Nn][Kk][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_details:/.*(-1[0-9]{3}\\Software\\Classes\\).*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 40f9af16-589d-4984-b78d-8c2aec023197
    name: Potential UAC Bypass Via Sdclt.EXE
    reason: 'Process-creation view of the same sdclt bypass: the hijacked key is consumed when sdclt.exe launches.'
  - id: da2738f2-fadb-4394-afa7-0a0674885afa
    name: Sdclt Child Processes
    reason: The payload planted in the key runs as an sdclt.exe child, now elevated.
  - id: 07743f65-7ec9-404a-a519-913db7118a8d
    name: COM Hijack via Sdclt
    reason: Alternative sdclt registry hijack variant, often tried alongside.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe method 53 is the origin of this pattern; Akagi may be the tool.
  - id: 48437c39-9e5f-47fb-af95-3d663c3f2919
    name: UAC Disabled
    reason: EnableLUA=0 is the blunt way to kill UAC; attackers often pair it with other UAC-weakening values.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Once privileged, attackers commonly turn off Defender via registry.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Persistence commonly follows once elevation/UAC weakening is achieved.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sdclt execution
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]dclt\.exe/
    pivot_on: host
    window: 2h
  - name: Children of sdclt
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ss]dclt\.exe/
    pivot_on: host
    window: 2h
  - name: Hijack key writes (exefile runas / Folder shell open)
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Cc]lasses.*([Ee]xefile.*[Rr]unas|[Ff]older.*[Ss]hell.*[Oo]pen).*/
    pivot_on: host
    window: 2h
  - name: Classes shell command key delete (cleanup)
    query: data_win_system_eventID:(12 OR 14) AND data_win_eventdata_targetObject:/.*[Cc]lasses.*[Ss]hell.*[Cc]ommand.*/
    pivot_on: host
    window: 2h
  - name: Run-key / Winlogon persistence writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(CurrentVersion.Run|[Ww]inlogon).*/
    pivot_on: host
    window: 4h
