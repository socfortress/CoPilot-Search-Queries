name: Windows Modify Registry NoChangingWallPaper
id: windows-modify-registry-nochangingwallpaper-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of NoChangingWallPaper registry value to 1, preventing 
  users from changing their desktop wallpaper. Rhysida ransomware enforces a 
  malicious wallpaper displaying the ransom note by locking this setting, 
  limiting user control over system appearance.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\ActiveDesktop\\NoChangingWallPaper"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  ActiveDesktop registry paths. Add ActiveDesktop to Sysmon EventID 13 
  TargetObject rules. HKCU paths appear as HKU\<SID> in logs.

known_false_positives: >
  Corporate environments may lock wallpaper via Group Policy. Uncommon 
  outside managed environments. Investigate process context.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-319a
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Wallpaper changes locked on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Possible Rhysida ransomware. MITRE ATT&CK: T1112
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Rhysida Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - wallpaper_lock
    - active_desktop
    - rhysida
    - ransomware_indicator
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*ActiveDesktop.*NoChangingWallPaper/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8b9606c9-28be-4a38-b146-0e313cc232c1
    name: Potential Ransomware Activity Using LegalNotice Message
    reason: Ransomware shows notices via registry (LegalNotice); same impact stage as locking the wallpaper
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware deletes shadow copies shortly before encryption and note display
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery inhibition that precedes encryption in the same intrusion
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling that follows policy tampering when the actor is blinding the host
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: PsExec is the typical lateral hop for deploying payloads to further hosts
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Renamed PsExec evades plain PsExec detection during mass deployment of the encryptor
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defense impairment by the same actor right before or after policy-key tampering
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Defender exclusions are the usual companion of implant staging; shows the payload being shielded
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ransom note and encrypted-file artefacts created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Cc]ritical[Bb]reach[Dd]etected.*/ OR data_win_eventdata_targetFilename:/.*[Rr]ead[Mm]e.*[.](txt|html|hta).*/ OR data_win_eventdata_targetFilename:/.*[Dd]ecrypt.*/ OR data_win_eventdata_targetFilename:/.*[Rr]estore.*[Ff]iles.*/ OR data_win_eventdata_targetFilename:/.*[Hh]ow.[Tt]o.*[Rr]ecover.*/)
    pivot_on:
    - host
    window: 2h
  - name: Recovery inhibition and log clearing
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Rr]ecoveryenabled.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Ii]gnoreallfailures.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]evtutil.* [Cc][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on:
    - host
    window: 4h
  - name: PsExec or remote execution of the encryptor
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_image:/.*[Pp]sexesvc.*/ OR data_win_eventdata_commandLine:/.*[Aa]ccepteula.*/ OR data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/)
    pivot_on:
    - host
    window: 4h
  - name: Wallpaper, desktop and legal-notice registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww]all[Pp]aper.*/ OR data_win_eventdata_targetObject:/.*[Ll]egal[Nn]otice.*/ OR data_win_eventdata_targetObject:/.*[Aa]ctive[Dd]esktop.*/)
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Aa]nti[Ss]pyware.*/)
    pivot_on:
    - host
    window: 4h
