name: Windows Modify Registry Auto Minor Updates
id: windows-modify-registry-auto-minor-updates-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of AutoInstallMinorUpdates registry value under 
  Windows Update policy to disable automatic minor updates. Adversaries 
  tamper with Windows Update settings to prevent security patches from 
  being installed, maintaining persistence and avoiding detection. Used 
  by RedLine Stealer.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\WindowsUpdate\\AU\\AutoInstallMinorUpdates"
        - term:
            data_win_eventdata_details: "DWORD (0x00000000)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  the WindowsUpdate policy registry path. Ensure Sysmon config includes 
  Policies\Microsoft\Windows\WindowsUpdate in EventID 13 TargetObject rules.

known_false_positives: >
  Group Policy may legitimately configure Windows Update settings. 
  Investigate process making the change and user context.

references:
  - https://attack.mitre.org/techniques/T1112/
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.redline_stealer

response:
  message: >
    Windows Update auto minor updates disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Windows Defense Evasion Tactics
    - RedLine Stealer
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - registry_modification
    - windows_update
    - defense_evasion
    - update_tampering
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*WindowsUpdate.*AU.*AutoInstallMinorUpdates/ AND data_win_eventdata_details:"DWORD (0x00000000)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-no-auto-update-001
    name: Windows Modify Registry No Auto Update
    reason: Same WindowsUpdate AU policy key; NoAutoUpdate is typically set in the same tampering burst.
  - id: 4d1409df-40c7-4b11-aec4-bd0e709dfc12
    name: Windows Modify Registry Auto Update Notif
    reason: AUOptions change on the same key, used by RedLine Stealer for the same purpose.
  - id: windows-modify-registry-donotconnect-wsus-001
    name: Windows Modify Registry DoNotConnectToWindowsUpdateInternetLocations
    reason: Further update-blocking policy change from the same malware playbook.
  - id: windows-modify-registry-updateserviceurlalternate-001
    name: Windows Modify Registry UpdateServiceUrlAlternate
    reason: Redirecting the update source accompanies disabling updates.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Stealers that block patching usually also disable Defender.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Common companion defence-evasion step before payload execution.
  - id: b7916c2a-fa2f-4795-9477-32b731f70f11
    name: Registry Persistence via Explorer Run Key
    reason: Run key persistence typically accompanies the RedLine install.
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: Hides the resulting update warnings from the user.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Update policy registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:*\\WindowsUpdate\\*
    pivot_on: host
    window: 6h
  - name: Update service stop or disable
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(wuauserv|UsoSvc|WaaSMedicSvc).*(stop|disabled|config).*/
    pivot_on: host
    window: 6h
  - name: Command-line edits to WindowsUpdate AU keys
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww]indows[Uu]pdate.*(AU|[Nn]o[Aa]uto).*/
    pivot_on: host
    window: 4h
  - name: Executables launched from user-writable paths
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\AppData\\* OR data_win_eventdata_image:*\\Temp\\* OR data_win_eventdata_image:*\\Users\\Public\\*)
    pivot_on: host
    window: 4h
