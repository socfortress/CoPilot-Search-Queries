name: Windows Hide Notification Features Through Registry
id: cafa4bce-9f06-11ec-a7b2-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects suspicious registry modifications aimed at hiding common Windows
  notification features on a compromised host. It leverages Sysmon EventID 13 to monitor specific
  registry paths and values related to notification hiding. This activity is significant as it is
  often used by ransomware to obscure visual indicators, increasing the impact of the attack. If
  confirmed malicious, this could prevent users from noticing critical system alerts, thereby aiding
  the attacker in maintaining persistence and furthering their malicious activities undetected.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Policies\\Explorer\\HideClock"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Policies\\Explorer\\HideSCAHealth"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Policies\\Explorer\\HideSCANetwork"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Policies\\Explorer\\HideSCAPower"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Policies\\Explorer\\HideSCAVolume"
            minimum_should_match: 1
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_targetObject
    - data_win_eventdata_valueName
    - data_win_eventdata_details
    - data_win_eventdata_image
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with registry modification
  data from your endpoints. Sysmon EventID 13 captures registry value set events. Ensure that
  Sysmon is configured to monitor the registry paths related to Windows notification hiding
  (HideClock, HideSCAHealth, HideSCANetwork, HideSCAPower, HideSCAVolume) and that these logs are
  properly ingested into Elasticsearch. The detection specifically looks for DWORD value changes
  to 0x00000001 in the Policies\Explorer registry path, which enables notification hiding.

known_false_positives: >
  No false positives have been identified at this time. Registry modifications to hide Windows
  notification features are typically associated with malicious activity such as ransomware or
  other defensive evasion tactics. Legitimate administrative tasks do not typically involve hiding
  system notification features.

references:
  - https://www.trendmicro.com/vinfo/us/threat-encyclopedia/malware/Ransom.Win32.ONALOCKER.A/

response:
  message: >
    Registry modification to hide Windows notification on $agent_name$ detected.
    TargetObject: $data_win_eventdata_targetObject$ Details: $data_win_eventdata_details$.
    This is indicative of ransomware or defense evasion activity attempting to obscure system alerts.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_path

tags:
  analytic_story:
    - Ransomware
    - Windows Defense Evasion Tactics
    - Windows Registry Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - notification_hiding
    - registry_modification
    - ransomware
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCAVolume"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: Suppressing Security Center notifications hides the same visible warnings; ransomware sets both.
  - id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
    name: Disable Windows Security Center Notifications
    reason: Disabling Windows Security Center notifications is a sibling to hiding tray indicators.
  - id: 1c3121ed-041b-4d97-a075-07f54f20fb4a
    name: Registry Explorer Policy Modification
    reason: Explorer policy modifications are written by the same loader to lock down the user experience.
  - id: 8b9606c9-28be-4a38-b146-0e313cc232c1
    name: Potential Ransomware Activity Using LegalNotice Message
    reason: LegalNotice ransom message set is the ransom-note stage of the same ransomware registry sweep.
  - id: 83314318-052a-4c90-a1ad-660ece38d276
    name: Blackbyte Ransomware Registry
    reason: BlackByte registry changes are the same family of pre-encryption registry prep.
  - id: 5de03871-5d46-4539-a82d-3aa992a69a83
    name: Registry Disable System Restore
    reason: Disabling System Restore removes recovery options in the same ransomware prep.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion is the destructive step following UI-suppression prep.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: bcdedit recovery tampering accompanies the same impact preparation.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Explorer and System policy values set to 1
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\[Pp]olicies\\([Ee]xplorer|[Ss]ystem).*/ AND data_win_eventdata_details:"DWORD (0x00000001)"
    pivot_on: host
    window: 2h
  - name: Security Center notification suppression
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*([Nn]otifications\\[Ss]ettings|[Ss]ecurity[Cc]enter|Security Center\\Notifications).*/
    pivot_on: host
    window: 2h
  - name: Ransom note / legal notice registry
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ll]egal[Nn]otice(caption|text).*/
    pivot_on: host
    window: 4h
  - name: Shadow copy, backup and recovery destruction
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*vssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*wmic.*shadowcopy.*delete.*/ OR data_win_eventdata_commandLine:/.*bcdedit.*(recoveryenabled|bootstatuspolicy).*/)
    pivot_on: host
    window: 4h
  - name: Ransom note and encrypted-extension file creation
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.(locked|encrypted|crypt|lock)/ OR data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]).*\.txt/)
    pivot_on: host
    window: 4h
