name: Windows Modify Registry With MD5 Reg Key Name
id: windows-modify-registry-md5-reg-key-name-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects registry entries under SOFTWARE with 32-character hexadecimal 
  value names (MD5-like) containing binary data. NjRAT uses this technique 
  for fileless storage of keylogs and DLL plugins in the registry. The 
  MD5-like naming pattern is a strong indicator of NjRAT activity.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\SOFTWARE\\*"
        - term:
            data_win_eventdata_details: "Binary Data"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    required: false
    default: "now-24h"
  END_TIME:
    type: datetime
    required: false
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 monitoring SOFTWARE registry paths. 
  Post-processing required: extract registry value name from targetObject 
  and validate 32-char hex pattern (MD5). Elasticsearch does not support 
  inline regex — implement pattern matching in CoPilot backend.

known_false_positives: >
  Unknown. MD5-named binary registry values under SOFTWARE are rare.

references:
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.njrat
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    MD5-named binary registry entry on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    Possible NjRAT fileless storage. MITRE ATT&CK: T1112
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - NjRAT
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - njrat
    - md5_registry
    - fileless_malware
    - binary_data
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*SOFTWARE.*/ AND data_win_eventdata_details:"Binary Data"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-valleyrat-c2-config-001
    name: Windows Modify Registry ValleyRAT C2 Config
    reason: Another RAT using the registry as configuration store; confirms a RAT family if both appear.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: njRAT persists via Run keys while hiding keylogs/plugins in registry blobs.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Autorun writes alongside binary registry blobs show the persistence half of the njRAT install.
  - id: b7916c2a-fa2f-4795-9477-32b731f70f11
    name: Registry Persistence via Explorer Run Key
    reason: Explorer Run key persistence is another common njRAT footprint.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Binary Data registry values under SOFTWARE
    query: data_win_system_eventID:"13" AND data_win_eventdata_details:"Binary Data" AND data_win_eventdata_targetObject:/.*SOFTWARE\\[0-9a-fA-F]{32}.*/
    pivot_on: host
    window: 24h
  - name: Run key persistence writes
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon\\[Ss]hell.*/ OR data_win_eventdata_targetObject:/.*[Ss]tartup.*/))
    pivot_on: host
    window: 4h
  - name: Binaries dropped in AppData/Temp/Startup
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic).*\.(exe|dll|bat|ps1|vbs|js|scr|lnk)/
    pivot_on: host
    window: 4h
  - name: Outbound connections from user-writable binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_image:/.*[Tt]emp.*/ OR data_win_eventdata_image:/.*[Pp]ublic.*/ OR data_win_eventdata_image:/.*[Pp]rogram[Dd]ata.*/)
    pivot_on: host
    window: 2h
  - name: Firewall exception added via netsh
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn]etsh.*[Ff]irewall.*[Aa]dd.*/
    pivot_on: host
    window: 2h
