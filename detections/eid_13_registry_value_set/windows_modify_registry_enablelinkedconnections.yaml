name: Windows Modify Registry EnableLinkedConnections
id: windows-modify-registry-enable-linked-connections-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of EnableLinkedConnections registry value to 1, which 
  links elevated and non-elevated user sessions for network drive access. 
  Ransomware operators enable this to access mapped network drives from 
  elevated processes, maximizing encryption impact across network shares. 
  Used by multiple ransomware families including ShrinkLocker.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Policies\\System\\EnableLinkedConnections"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Policies\System registry paths. This path is typically included in 
  default Sysmon configurations.

known_false_positives: >
  Some organizations enable linked connections for legitimate administrative 
  convenience. Investigate process making the change and whether it aligns 
  with approved configuration management.

references:
  - https://www.bleepingcomputer.com/news/security/new-shrinklocker-ransomware-uses-bitlocker-to-encrypt-your-files/
  - https://learn.microsoft.com/en-us/troubleshoot/windows-client/networking/mapped-drives-not-available-from-elevated-command
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    EnableLinkedConnections enabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Possible ransomware prep. MITRE ATT&CK: T1112
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - ShrinkLocker
    - Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - linked_connections
    - network_drives
    - ransomware_prep
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Policies.*System.*EnableLinkedConnections/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-longpathsenabled-001
    name: Windows Modify Registry LongPathsEnabled
    reason: BlackByte pairs this value with EnableLinkedConnections; seeing both strongly indicates ransomware staging.
  - id: c7dcacd0-cc59-4004-b0a4-1d6cdebe6f3e
    name: Disable Administrative Share Creation at Startup
    reason: Admin-share configuration changes sit alongside reaching network shares for encryption.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Copying to or from admin shares shows the elevated process actually reaching network shares.
  - id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
    name: Disabled Volume Snapshots
    reason: Ransomware disables snapshots before encrypting the shares it can now reach.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup deletion via wbadmin is a classic precursor to mass encryption.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: bcdedit recovery tampering accompanies ShrinkLocker-style and other ransomware prep.
  - id: 965fff6c-1d7e-4e25-91fd-cdccd75f7d2c
    name: DarkSide Ransomware Pattern
    reason: Known ransomware command patterns confirm the progression to encryption.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Vv]ssadmin.*/ OR /.*[Ww]badmin.*[Dd]elete.*/ OR /.*[Ss]hadowcopy.*[Dd]elete.*/ OR /.*[Bb]cdedit.*[Rr]ecovery.*/)
    pivot_on: host
    window: 6h
  - name: BitLocker abuse (ShrinkLocker)
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Mm]anage-bde.*/ OR /.*[Ee]nable-[Bb]it[Ll]ocker.*/)
    pivot_on: host
    window: 6h
  - name: Network share and mapped drive use
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]et1? +use.*/ OR /.*[Nn]et1? +view.*/ OR /.*[Nn]et1? +share.*/)
    pivot_on: host
    window: 6h
  - name: Ransom note creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*readme* OR *decrypt* OR *restore* OR *recover*)
    pivot_on: host
    window: 6h
  - name: Other policy System registry sets
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:*\\Policies\\System\\*
    pivot_on: host
    window: 6h
