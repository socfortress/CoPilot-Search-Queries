name: Potential Persistence Via AppCompat RegisterAppRestart Layer
id: b86852fb-4c77-48f9-8519-eb1b2c308b59
version: 1
schema_version: "1.0"
date: "2024-01-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b86852fb-4c77-48f9-8519-eb1b2c308b59
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the setting of the REGISTERAPPRESTART compatibility layer on an
  application. This compatibility layer allows an application to register for
  restart using the "RegisterApplicationRestart" API. This can be potentially
  abused as a persistence mechanism. MITRE ATT&CK: T1546.011.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\AppCompatFlags\\\\Layers\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*REGISTERAPPRESTART*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\*';
  data_win_eventdata_details matches '*REGISTERAPPRESTART*'.

known_false_positives: >
  Legitimate applications making use of this feature for compatibility reasons.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://github.com/nasbench/Misc-Research/blob/d114d6a5e0a437d3818e492ef9864367152543e7/Other/Persistence-Via-RegisterAppRestart-Shim.md
  - https://attack.mitre.org/techniques/T1546/011/

response:
  message: >
    Potential Persistence Via AppCompat RegisterAppRestart Layer detected on
    host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1546.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.011
  custom_tags:
    - persistence
    - appcompat
    - registerapprestart
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Ll][Aa][Yy][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_details:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr][Aa][Pp][Pp][Rr][Ee][Ss][Tt][Aa][Rr][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dfb5b4e8-91d0-4291-b40a-e3b0d3942c45
    name: Potential Persistence Via Shim Database Modification
    reason: 'Same AppCompat family: custom shim DB registration under AppCompatFlags is the sibling persistence technique an operator may combine or try instead.'
  - id: ee63c85c-6d51-4d12-ad09-04e25877a947
    name: New Custom Shim Database Created
    reason: A .sdb file written to disk just before this layer was set points to a broader AppCompat abuse chain.
  - id: 517490a7-115a-48c6-8862-1a481504d5a8
    name: Potential Shim Database Persistence via Sdbinst.EXE
    reason: sdbinst.exe is the usual process that writes AppCompatFlags keys; its command line reveals the installer of the layer.
  - id: b7916c2a-fa2f-4795-9477-32b731f70f11
    name: Registry Persistence via Explorer Run Key
    reason: Registry persistence via Explorer Run key often accompanies layer-based persistence as a redundant foothold.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: reg.exe adding Run keys is the command-line path to the same registry write and a common companion persistence.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AppCompat Layers key writes on host
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*AppCompatFlags.*(Layers|Custom|InstalledSDB).*/
    pivot_on: host
    window: 6h
  - name: sdbinst or shim installer execution
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ss]dbinst\.exe/ OR data_win_eventdata_commandLine:/.*[Ss]dbinst.*/)
    pivot_on: host
    window: 6h
  - name: Shim database files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.sdb/
    pivot_on: host
    window: 6h
  - name: Registry modification by reg.exe or PowerShell
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]eg(\.exe)? +add.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Ii]tem[Pp]roperty.*/)
    pivot_on: host
    window: 2h
  - name: Persistence key writes by any process
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(CurrentVersion.Run|Winlogon|Image File Execution Options|AppCompatFlags).*/
    pivot_on: host
    window: 6h
