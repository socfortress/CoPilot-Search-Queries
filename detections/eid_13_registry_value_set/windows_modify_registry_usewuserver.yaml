name: Windows Modify Registry UseWUServer
id: windows-modify-registry-usewuserver-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects modification of UseWUServer registry value to 1 under Windows Update 
  AU policy. Enabling this forces clients to use a WSUS server instead of 
  Microsoft Update. Adversaries set this to redirect updates to attacker-controlled 
  servers or block legitimate updates. Used by RedLine Stealer.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\WindowsUpdate\\AU\\UseWUServer"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    required: false
    default: "now-24h"
  END_TIME:
    type: datetime
    required: false
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 monitoring WindowsUpdate\AU policy paths.

known_false_positives: >
  WSUS environments commonly set this via Group Policy. High FP in managed environments.

references:
  - https://learn.microsoft.com/de-de/security-updates/windowsupdateservices/18127499
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    UseWUServer enabled on $agent_name$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 9
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 9
  threat_objects: []

tags:
  analytic_story:
    - RedLine Stealer
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_update
    - wsus_server
    - update_tampering
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*WindowsUpdate.*AU.*UseWUServer/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-wuserver-001
    name: Windows Modify Registry WuServer
    reason: UseWUServer=1 only matters with a WuServer value; shows which server is forced.
  - id: windows-modify-registry-wustatusserver-001
    name: Windows Modify Registry WUStatusServer
    reason: Status server redirection is set together with the update server.
  - id: windows-modify-registry-updateserviceurlalternate-001
    name: Windows Modify Registry UpdateServiceUrlAlternate
    reason: Alternate update URL is set alongside to redirect updates.
  - id: windows-modify-registry-no-auto-update-001
    name: Windows Modify Registry No Auto Update
    reason: Disabled auto-update completes the update-blocking effect.
  - id: windows-modify-registry-auto-minor-updates-001
    name: Windows Modify Registry Auto Minor Updates
    reason: Minor update policy changes accompany update policy manipulation.
  - id: windows-modify-registry-donotconnect-wsus-001
    name: Windows Modify Registry DoNotConnectToWindowsUpdateInternetLocations
    reason: Blocks fallback to Microsoft Update so the redirect is the only source.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All WindowsUpdate policy registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\Policies\\Microsoft\\Windows\\WindowsUpdate.*/
    pivot_on: host
    window: 6h
  - name: Update policy changes via command line
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(WUServer|UseWUServer|NoAutoUpdate).*/
    pivot_on: host
    window: 4h
  - name: Windows Update service stopped or reconfigured
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(wuauserv|UsoSvc).*(stop|disabled|config).*/
    pivot_on: host
    window: 4h
  - name: Update processes connecting to non-Microsoft hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(wuauclt|UsoClient)\.exe/ AND data_win_eventdata_initiated:true AND NOT data_win_eventdata_destinationHostname:/.*(microsoft|windowsupdate)\.com/
    pivot_on: host
    window: 4h
