name: Windows Disable Change Password Through Registry
id: 0df33e1a-9ef6-11ec-a1ad-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects a suspicious registry modification that disables the Change Password
  feature on a Windows host. It identifies changes to the registry path
  "*\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableChangePassword" with a value
  of "0x00000001". This activity is significant as it can prevent users from changing their passwords,
  a tactic often used by ransomware to maintain control over compromised systems. If confirmed malicious,
  this could hinder user response to an attack, allowing the attacker to persist and potentially escalate
  their access within the network.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*DisableChangePassword"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with the registry value name,
  registry path, and registry value data from your endpoints. Sysmon EventID 13 captures registry
  modifications (SetValue operations). Ensure that Sysmon is configured to log registry operations
  and that these logs are properly ingested into Elasticsearch with complete registry path and value
  information. The detection specifically looks for modifications to the DisableChangePassword registry
  value being set to 0x00000001 (enabled/true), which blocks users from changing their passwords.

known_false_positives: >
  This Windows feature may be legitimately implemented by administrators to prevent normal users from
  changing passwords on critical hosts or servers. In such scenarios, a filter is necessary to minimize
  false positives. Organizations using Group Policy to enforce password policies may also trigger this
  detection when policies are applied. Whitelist administrative accounts and approved management tools
  that legitimately modify this registry setting.

references:
  - https://www.trendmicro.com/vinfo/us/threat-encyclopedia/malware/ransom_heartbleed.thdobah

response:
  message: >
    Registry modification detected on $agent_name$. Process $data_win_eventdata_image$
    by user $data_win_eventdata_user$ modified DisableChangePassword registry key to value
    $data_win_eventdata_details$. This may indicate ransomware or malicious activity attempting to
    prevent password changes.
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process

tags:
  analytic_story:
    - Ransomware
    - Defense Evasion
    - Windows Policy Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - registry_modification
    - ransomware
    - defense_evasion
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\DisableChangePassword

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c82adbc6-9f00-11ec-a81f-acde48001122
    name: Windows Disable Lock Workstation Feature Through Registry
    reason: Sibling Policies\System tweak set by the same malware to keep users locked out of control.
  - id: b2fb6830-9ed1-11ec-9fcb-acde48001122
    name: Windows Disable LogOff Button Through Registry
    reason: Sibling policy tweak denying users session control.
  - id: Windows_Disable_Shutdown_Button_Through_Registry
    name: Windows Disable Shutdown Button Through Registry
    reason: Another user-lockout policy tweak commonly bundled in the same script.
  - id: Windows_Disable_Windows_Group_Policy_Features_Through_Registry
    name: Windows Disable Windows Group Policy Features Through Registry
    reason: Disables admin tooling so victims cannot undo changes.
  - id: e2482f8d-3443-4237-b906-cc145d87a076
    name: Disable Internal Tools or Feature in Registry
    reason: Disabling Task Manager/regedit class policy edits from the same malware.
  - id: 8b9606c9-28be-4a38-b146-0e313cc232c1
    name: Potential Ransomware Activity Using LegalNotice Message
    reason: Ransom-note style logon banner set in the same Policies\System area.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Ransomware precursor: recovery removed in the same window.'
  - id: 5de03871-5d46-4539-a82d-3aa992a69a83
    name: Registry Disable System Restore
    reason: Ransomware also disables System Restore to prevent recovery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Policies lockout and UI restriction registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Policies.System|Policies.Explorer).*(DisableChangePassword|DisableLockWorkstation|DisableTaskMgr|DisableRegistryTools|NoLogoff|DisableCMD|legalnotice|NoClose|shutdownwithoutlogon).*/
    pivot_on: host
    window: 4h
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|wmic.*shadowcopy.*delete|wbadmin.*delete|bcdedit.*(recoveryenabled|bootstatuspolicy)|resize\s+shadowstorage).*/
    pivot_on: host
    window: 4h
  - name: Ransom note creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(README|DECRYPT|RECOVER|HOW[_-]TO|RESTORE).*\.(txt|html|hta)/
    pivot_on: host
    window: 4h
  - name: Password and account changes
    query: data_win_system_eventID:(4723 OR 4724 OR 4738 OR 4720 OR 4732)
    pivot_on: user
    window: 4h
  - name: Stopping of backup, database and security services
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net|sc)(\.exe)?\s+(stop|config).*(sql|veeam|backup|vss|sophos|defend|mysql|exchange).*/
    pivot_on: host
    window: 4h
