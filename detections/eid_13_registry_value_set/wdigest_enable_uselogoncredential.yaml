name: Wdigest Enable UseLogonCredential
id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential malicious modification of the property value of
  UseLogonCredential from
  HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest to enable
  clear-text credentials. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*WDigest\\\\UseLogonCredential"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*WDigest\UseLogonCredential'; data_win_eventdata_details equals 'DWORD
  (0x00000001)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190510-RegModWDigestDowngrade/notebook.html
  - https://support.microsoft.com/en-us/topic/microsoft-security-advisory-update-to-improve-credentials-protection-and-management-may-13-2014-93434251-04ac-b7f3-52aa-9f951c14b649
  - https://github.com/redcanaryco/atomic-red-team/blob/73fcfa1d4863f6a4e17f90e54401de6e30a312bb/atomics/T1112/T1112.md#atomic-test-3---modify-registry-to-store-logon-credentials
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Wdigest Enable UseLogonCredential detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - wdigest
    - enable
    - uselogoncredential
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1a2d6c47-75b0-45bd-b133-2c0be75349fd
    name: Wdigest CredGuard Registry Modification
    reason: Adjacent WDigest/Credential Guard registry tampering aimed at the same plaintext-credential goal.
  - id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
    name: Windows Credential Guard Disabled - Registry
    reason: Disabling Credential Guard is the companion step that lets LSASS hold dumpable secrets.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Follow-on: Mimikatz sekurlsa::wdigest harvests the plaintext passwords after the next logon.'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Alternate harvesting path after WDigest caching is enabled.
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: Living-off-the-land LSASS dump that follows WDigest enablement.
  - id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
    name: Lsass Full Dump Request Via DumpType Registry Settings
    reason: Another LSASS-dump preparation via registry on the same host.
  - id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    reason: Direct evidence of LSASS being read by a dumping tool.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 24h
  - name: LSASS dump files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Ll]sass.*/ OR /.*\.[Dd][Mm][Pp]/)
    pivot_on: host
    window: 24h
  - name: Credential dumping tool command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*sekurlsa.*/ OR /.*[Ll]ogonpasswords.*/ OR /.*[Mm]ini[Dd]ump.*/ OR /.*[Pp]rocdump.*/ OR /.*comsvcs.*/)
    pivot_on: host
    window: 24h
  - name: Interactive and RDP logons after the change
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(2 OR 10 OR 11)
    pivot_on: host
    window: 24h
  - name: Commands touching WDigest
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww][Dd]igest.*/
    pivot_on: host
    window: 4h
