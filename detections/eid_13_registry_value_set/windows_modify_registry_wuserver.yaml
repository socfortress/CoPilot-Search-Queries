name: Windows Modify Registry WuServer
id: windows-modify-registry-wuserver-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects modification of WUServer registry value under Windows Update policy. 
  Adversaries redirect Windows Update to malicious WSUS servers for weaponized 
  update delivery. Used by RedLine Stealer.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\WindowsUpdate\\WUServer"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
  CUSTOMER_CODE:
    type: string
    required: true
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 monitoring WindowsUpdate policy paths.

known_false_positives: >
  WSUS environments commonly set this via Group Policy.

references:
  - https://learn.microsoft.com/de-de/security-updates/windowsupdateservices/18127499

response:
  message: >
    WUServer modified on $agent_name$. Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25

tags:
  analytic_story:
    - RedLine Stealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_update
    - wsus_redirect
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*WindowsUpdate.*WUServer/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-usewuserver-001
    name: Windows Modify Registry UseWUServer
    reason: UseWUServer=1 is required for WUServer to take effect; both together means Windows Update is truly redirected.
  - id: windows-modify-registry-updateserviceurlalternate-001
    name: Windows Modify Registry UpdateServiceUrlAlternate
    reason: Alternate update-service URL is set with WUServer to complete the redirect.
  - id: windows-modify-registry-no-auto-update-001
    name: Windows Modify Registry No Auto Update
    reason: Disabling automatic updates frequently accompanies update-source tampering.
  - id: windows-modify-registry-donotconnect-wsus-001
    name: Windows Modify Registry DoNotConnectToWindowsUpdateInternetLocations
    reason: Blocks fallback to Microsoft Update so only the rogue server is used.
  - id: windows-modify-registry-proxyserver-001
    name: Windows Modify Registry ProxyServer
    reason: Traffic-redirection tampering via proxy is often used in the same intercept setup.
  - id: b0ce780f-10bd-496d-9067-066d23dc3aa5
    name: HackTool - SharpWSUS/WSUSpendu Execution
    reason: Tooling that abuses WSUS for malicious update delivery or lateral movement.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Update policy registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww]indows[Uu]pdate.*/
    pivot_on: host
    window: 4h
  - name: Update client activity after redirect
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Uu]soclient.*/ OR data_win_eventdata_commandLine:/.*[Ww]uauclt.*/ OR data_win_eventdata_commandLine:/.*[Pp][Ss][Ee]xec.*/)
    pivot_on: host
    window: 4h
  - name: Update agent processes spawning shells or LOLBins
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ww]uauserv.*/ OR data_win_eventdata_parentImage:/.*[Uu]pdate[Ss]ession[Oo]rchestrator.*/ OR data_win_eventdata_parentImage:/.*[Ww]sus[Pp]ool.*/) AND data_win_eventdata_image:/.*(cmd|powershell|rundll32|mshta)\.exe/
    pivot_on: host
    window: 4h
  - name: Outbound connections on WSUS ports
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"8530" OR data_win_eventdata_destinationPort:"8531")
    pivot_on: host
    window: 4h
  - name: Proxy settings changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*ProxyServer.*/ OR data_win_eventdata_targetObject:/.*ProxyEnable.*/)
    pivot_on: host
    window: 4h
