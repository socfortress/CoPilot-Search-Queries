name: Windows Mshta Execution In Registry
id: windows-mshta-execution-in-registry-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects registry entries containing mshta, javascript, vbscript, or 
  WScript.Shell in their values. Kovter and other fileless malware store 
  encoded scripts in registry values that execute via mshta.exe, enabling 
  persistence without files on disk.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details: "*mshta*"
              - wildcard:
                  data_win_eventdata_details: "*javascript:*"
              - wildcard:
                  data_win_eventdata_details: "*vbscript:*"
              - wildcard:
                  data_win_eventdata_details: "*WScript.Shell*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
  CUSTOMER_CODE:
    type: string
    required: true
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 with broad registry monitoring. Searches 
  registry value data (details field) for script execution indicators.

known_false_positives: >
  Unknown. Registry values containing mshta or script references are rare 
  in legitimate use.

references:
  - https://redcanary.com/threat-detection-report/techniques/mshta/
  - https://learn.microsoft.com/en-us/microsoft-365/security/intelligence/fileless-threats

response:
  message: >
    Mshta/script execution in registry on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. 
    Fileless malware indicator. MITRE ATT&CK: T1218.005
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72

tags:
  analytic_story:
    - Suspicious Windows Registry Activities
    - Windows Persistence Techniques
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.005
  custom_tags:
    - mshta
    - fileless_malware
    - kovter
    - registry_persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_details:/.*mshta.*/ OR data_win_eventdata_details:/.*javascript:.*/ OR data_win_eventdata_details:/.*vbscript:.*/ OR data_win_eventdata_details:/.*WScript\.Shell.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32f92d1-523e-49c3-9374-bdb13b46a3ba
    name: Suspicious Mshta.EXE Execution Patterns
    reason: The registry-stored mshta command will be executed later; this catches the actual run.
  - id: a0873b32-5b68-11eb-ae93-0242ac130002
    name: Detect mshta inline hta execution
    reason: Inline javascript/vbscript passed to mshta is exactly what such registry values contain.
  - id: 03cc0c25-389f-4bf8-b48d-11878079f1ca
    name: Suspicious MSHTA Child Process
    reason: 'Follow-on: mshta launching PowerShell/cmd to stage the payload.'
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: Fileless loaders chain mshta into rundll32/regsvr32.
  - id: Windows_Autoruns_Run_Key_Value_Set_By_Suspicious Process
    name: Windows Autoruns Run Key Value Set By Suspicious Process
    reason: The script is usually triggered via a Run key; shows the persistence hook.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Generic autorun writes on the same host that may reference the stored value.
  - id: 7530b96f-ad8e-431d-a04d-ac85cc461fdc
    name: Custom File Open Handler Executes PowerShell
    reason: Alternate fileless trigger via file open handlers used by similar malware.
  - id: 921aa10f-2e74-4cca-9498-98f9ca4d6fdf
    name: Registry Modification Attempt Via VBScript
    reason: VBScript writing registry values is how the encoded payload is planted.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mshta process executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Mm]shta\.exe/
    pivot_on: host
    window: 24h
  - name: Mshta child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Mm]shta\.exe/
    pivot_on: host
    window: 6h
  - name: Mshta or script host network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Mm]shta|[Ww]script|[Cc]script|[Pp]ower[Ss]hell)\.exe/
    pivot_on: host
    window: 6h
  - name: Registry values containing script content
    query: data_win_system_eventID:13 AND data_win_eventdata_details:(*mshta* OR *javascript\:* OR *vbscript\:* OR *GetObject* OR *WScript.Shell*)
    pivot_on: host
    window: 24h
  - name: Scheduled tasks or run keys invoking script hosts
    query: data_win_system_eventID:(1 OR 13) AND (data_win_eventdata_commandLine:/.*[Ss]chtasks.*(mshta|wscript|powershell).*/ OR data_win_eventdata_targetObject:/.*CurrentVersion.[Rr]un.*/)
    pivot_on: host
    window: 6h
