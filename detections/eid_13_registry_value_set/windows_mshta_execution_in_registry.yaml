name: Windows Mshta Execution In Registry
id: windows-mshta-execution-in-registry-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects registry entries containing mshta, javascript, vbscript, or 
  WScript.Shell in their values. Kovter and other fileless malware store 
  encoded scripts in registry values that execute via mshta.exe, enabling 
  persistence without files on disk.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details: "*mshta*"
              - wildcard:
                  data_win_eventdata_details: "*javascript:*"
              - wildcard:
                  data_win_eventdata_details: "*vbscript:*"
              - wildcard:
                  data_win_eventdata_details: "*WScript.Shell*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
  CUSTOMER_CODE:
    type: string
    required: true
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 with broad registry monitoring. Searches 
  registry value data (details field) for script execution indicators.

known_false_positives: >
  Unknown. Registry values containing mshta or script references are rare 
  in legitimate use.

references:
  - https://redcanary.com/threat-detection-report/techniques/mshta/
  - https://learn.microsoft.com/en-us/microsoft-365/security/intelligence/fileless-threats

response:
  message: >
    Mshta/script execution in registry on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. 
    Fileless malware indicator. MITRE ATT&CK: T1218.005
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72

tags:
  analytic_story:
    - Suspicious Windows Registry Activities
    - Windows Persistence Techniques
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.005
  custom_tags:
    - mshta
    - fileless_malware
    - kovter
    - registry_persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_details:/.*mshta.*/ OR data_win_eventdata_details:/.*javascript:.*/ OR data_win_eventdata_details:/.*vbscript:.*/ OR data_win_eventdata_details:/.*WScript\.Shell.*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: cbef820c-e1ff-407f-887f-0a9240a2d477
      name: "Detect Path Interception By Creation Of program exe"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
      name: "Hiding Files And Directories With Attrib exe"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: 8470d755-0c13-45b3-bd63-387a373c10cf
      name: "Reg exe Manipulating Windows Services Registry Keys"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: Windows_Autoruns_Run_Key_Value_Set_By_Suspicious Process
      name: "Windows Autoruns Run Key Value Set By Suspicious Process"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: windows-compattelrunner-suspicious-child-001
      name: "Windows Compatibility Telemetry Suspicious Child Process"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: windows-compattelrunner-registry-tampering-001
      name: "Windows Compatibility Telemetry Tampering Through Registry"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: Windows_EXE_File_Created_in_Startup_Folder
      name: "Windows EXE File Created in Startup Folder"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: windows-monitor-registry-keys-for-print-monitors-001
      name: "Windows Monitor Registry Keys for Print Monitors"
      reason: "same analytic story: Suspicious Windows Registry Activities"
    - id: windows-print-processor-registry-autostart-001
      name: "Windows Print Processor Registry Autostart"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: windows-scheduled-task-created-public-path-001
      name: "Windows Scheduled Task Created Within Public Path"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: windows-scheduled-task-created-spawn-shell-001
      name: "Windows Scheduled Task Created to Spawn Shell"
      reason: "same analytic story: Windows Persistence Techniques"
    - id: Windows_User_Account_Created
      name: "Windows User Account Created"
      reason: "same analytic story: Windows Persistence Techniques"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Autostart persistence written on this host"
      query: '(data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ll][Oo][Aa][Dd].*/)'
      pivot_on: [host]
      window: 2h
    - name: "Execution following autostart on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 2h
    - name: "Defender / security-setting tampering on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/)'
      pivot_on: [host]
      window: 2h
