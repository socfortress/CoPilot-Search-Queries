name: Windows New Custom Security Descriptor Set On EventLog Channel
id: Windows-New-Custom-Security-Descriptor-Set-On-EventLog-Channel
version: 4
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects suspicious modifications to the EventLog security descriptor registry
  value (CustomSD) under HKLM\System\CurrentControlSet\Services\Eventlog\<Channel>.
  Attackers modify this legacy registry value to restrict access permissions on
  event log channels, blinding security products and preventing log ingestion.
  This technique has near-zero legitimate use cases and is associated with
  LockBit Ransomware and SDDL Tampering defense evasion tradecraft.
  MITRE ATT&CK: T1562.002 (Impair Defenses: Disable Windows Event Logging).

data_source:
  - Sysmon EventID 13 (RegistryEvent Value Set)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Services\\Eventlog\\*"
        - wildcard:
            data_win_eventdata_targetObject: "*CustomSD*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 (RegistryEvent Value Set) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_targetObject and data_win_eventdata_details are
  confirmed working across all EventID 13 detections in this environment.
  Field-validated based on established EventID 13 detection patterns.
  Setting the CustomSD value is considered a legacy option with no common
  legitimate use — any hit should be treated as high priority.

known_false_positives: >
  None identified. Setting the CustomSD value on EventLog channels is a legacy
  option and is not expected in normal operations.

references:
  - https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/set-event-log-security-locally-or-via-group-policy
  - https://attack.mitre.org/techniques/T1562/002/

response:
  message: >
    EventLog channel security descriptor (CustomSD) modified on $agent_name$ by $data_win_eventdata_user$.
    Registry path: $data_win_eventdata_targetObject$.
    Value set: $data_win_eventdata_details$.
    MITRE ATT&CK: T1562.002
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
    - field: data_win_eventdata_user
      type: user
      score: 64
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_path

tags:
  analytic_story:
    - LockBit Ransomware
    - Defense Evasion or Unauthorized Access Via SDDL Tampering
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.002
  custom_tags:
    - eventlog_tampering
    - customsd
    - sddl
    - defense_evasion
    - registry
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Another registry route to blind logging; commonly combined with CustomSD changes.
  - id: 0cb8d736-995d-4ce7-a31e-1e8d452a1459
    name: Potential EventLog File Location Tampering
    reason: Relocating log files is a sibling tamper on the same Eventlog service key.
  - id: windows-eventlog-cleared-wevtutil-001
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Attackers clear logs once collection is blinded or after tampering.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disabling channels with wevtutil is the command-line twin of this tamper.
  - id: 63c779ba-f638-40a0-a593-ddd45e8b1ddc
    name: EventLog EVTX File Deleted
    reason: Direct deletion of evtx files follows log-blinding to remove evidence.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Audit policy changes are often done in the same defence evasion step.
  - id: Windows_Audit_Policy_Auditing_Option_Modified_-_Registry
    name: Windows Audit Policy Auditing Option Modified - Registry
    reason: Registry-level audit weakening alongside restricted log ACLs.
  - id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
    name: Disabled Windows Defender Eventlog
    reason: Defender's own log channel being disabled completes the blinding of security tooling.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Eventlog service key registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*Services.[Ee]ventlog.*/
    pivot_on: host
    window: 24h
  - name: Log clearing and channel disabling commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(wevtutil.*(cl|clear-log|sl|set-log).*|[Cc]lear-[Ee]vent[Ll]og|[Rr]emove-[Ee]vent[Ll]og).*/
    pivot_on: host
    window: 6h
  - name: Security log cleared / audit policy changed
    query: data_win_system_eventID:(1102 OR 104 OR 4719)
    pivot_on: host
    window: 6h
  - name: 'Ransomware precursors: shadow copy deletion and boot recovery changes'
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Vv]ssadmin.*delete|[Bb]cdedit.*(ignoreallfailures|recoveryenabled)|[Ww]mic.*shadowcopy.*delete).*/
    pivot_on: host
    window: 4h
  - name: Access-control changes on log services
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sdset|[Ss]et-[Aa]cl|icacls).*[Ee]vent[Ll]og.*/
    pivot_on: host
    window: 4h
