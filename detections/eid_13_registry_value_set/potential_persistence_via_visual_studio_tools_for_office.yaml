correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 961e33d1-4f86-4fcf-80ab-930a708b2f82
    name: Potential Persistence Via Excel Add-in - Registry
    reason: Sibling Office add-in registry persistence; actors register several add-in types.
  - id: baecf8fb-edbf-429f-9ade-31fc3f22b970
    name: Office Autorun Keys Modification
    reason: Other Office autoload keys modified for persistence in the same intrusion.
  - id: af4c4609-5755-42fe-8075-4effb49f5d44
    name: Microsoft Excel Add-In Loaded From Uncommon Location
    reason: Confirms a planted add-in was actually loaded by Excel.
  - id: 90217a70-13fc-48e4-b3db-0d836c5824ac
    name: GAC DLL Loaded Via Office Applications
    reason: Managed add-in assemblies loaded by Office after VSTO registration.
  - id: ff0f2b05-09db-4095-b96d-1b75ca24894a
    name: DotNET Assembly DLL Loaded Via Office Application
    reason: VSTO add-ins are .NET assemblies; fires when the Office host loads one.
  - id: d13c43f0-f66b-4279-8b2c-5912077c1780
    name: CLR DLL Loaded Via Office Applications
    reason: CLR loading into Office is the runtime signature of a VSTO add-in executing.
  - id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
    name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
    reason: Alternate Outlook persistence frequently paired with add-ins.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office add-in registry registrations
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo]ffice\\.*\\[Aa]ddins\\.*/
    pivot_on: host
    window: 24h
  - name: Office hosts loading the .NET runtime or user-path DLLs
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Ee][Xx][Cc][Ee][Ll]|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*([Cc][Ll][Rr]|[Mm][Ss][Cc][Oo][Rr][Ee][Ee]|\\[Aa]pp[Dd]ata\\).*/
