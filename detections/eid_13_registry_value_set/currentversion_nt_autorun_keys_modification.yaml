correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
    name: Winlogon Notify Key Logon Persistence
    reason: Winlogon Notify subkey is the sibling Winlogon persistence path; attackers often set several Winlogon values together.
  - id: c9b86500-1ec2-4de6-9120-d744c8fb5caf
    name: Potential KamiKakaBot Activity - Winlogon Shell Persistence
    reason: Winlogon Shell hijack is a concrete real-world instance (KamiKakaBot) of the Shell value this rule watches.
  - id: 4f84b697-c9ed-4420-8ab5-e09af5b2345d
    name: New DLL Added to AppInit_DLLs Registry Key
    reason: AppInit_DLLs addition is another ASEP under the same CurrentVersion tree; DLL injected into every GUI process.
  - id: 480421f9-417f-4d3b-9552-fd2728443ec8
    name: Wow6432Node Windows NT CurrentVersion Autorun Keys Modification
    reason: 'Same ASEP written under Wow6432Node: 32-bit mirror used when malware is 32-bit or to cover both hives.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: 'Process-creation view of the same change: reg.exe/command line writing the autorun key identifies the actor.'
  - id: c80e66d8-1780-48a9-b412-46663fd21ac0
    name: Suspicious Autorun Registry Modified via WMI
    reason: Autorun key set through WMI StdRegProv indicates remote or script-driven persistence.
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: 'Registry tampering by suspicious processes: the writer of the autorun value is often flagged here.'
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Run/RunOnce persistence is the usual companion when an actor plants redundant autoruns.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other autorun/ASEP registry writes
    query: data_win_system_eventID:13 AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion.[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon.*/ OR data_win_eventdata_targetObject:/.*[Ii]mage [Ff]ile [Ee]xecution.*/ OR data_win_eventdata_targetObject:/.*[Ss]ession [Mm]anager.*/)
    pivot_on: host
    window: 4h
  - name: Binaries dropped to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa]pp[Dd]ata.*/ OR /.*[Pp]ublic.*/ OR /.*[Tt]emp.*/ OR /.*[Pp]rogram[Dd]ata.*/) AND data_win_eventdata_targetFilename:(/.*\.dll/ OR /.*\.exe/ OR /.*\.scr/)
    pivot_on: host
    window: 2h
  - name: Registry tools touching autorun keys
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Rr]eg\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Ww]mic\.exe/ OR /.*[Rr]egedit\.exe/) AND data_win_eventdata_commandLine:(/.*[Ww]inlogon.*/ OR /.*[Cc]urrent[Vv]ersion.*/ OR /.*[Aa]ppinit.*/)
    pivot_on: host
    window: 2h
  - name: Unexpected Winlogon/Userinit children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww]inlogon\.exe/ OR /.*[Uu]serinit\.exe/) AND NOT data_win_eventdata_image:(/.*[Ee]xplorer\.exe/ OR /.*[Uu]serinit\.exe/ OR /.*[Dd]wm\.exe/ OR /.*[Ll]ogon[Uu][Ii]\.exe/)
    pivot_on: host
    window: 6h
