name: Disable Administrative Share Creation at Startup
id: c7dcacd0-cc59-4004-b0a4-1d6cdebe6f3e
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c7dcacd0-cc59-4004-b0a4-1d6cdebe6f3e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Administrative shares are hidden network shares created by Microsoft Windows
  NT operating systems that grant system administrators remote access to every
  disk volume on a network-connected system. MITRE ATT&CK: T1070.005.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\LanmanServer\\\\Parameters\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\AutoShareWks"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\AutoShareServer"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\LanmanServer\Parameters\*'; data_win_eventdata_targetObject
  matches '*\AutoShareWks'; data_win_eventdata_targetObject matches
  '*\AutoShareServer', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.005/T1070.005.md#atomic-test-4---disable-administrative-share-creation-at-startup
  - https://attack.mitre.org/techniques/T1070/005/

response:
  message: >
    Disable Administrative Share Creation at Startup detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1070.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.005
  custom_tags:
    - disable
    - administrative
    - share
    - registry
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ll][Aa][Nn][Mm][Aa][Nn][Ss][Ee][Rr][Vv][Ee][Rr]\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Aa][Uu][Tt][Oo][Ss][Hh][Aa][Rr][Ee][Ww][Kk][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Aa][Uu][Tt][Oo][Ss][Hh][Aa][Rr][Ee][Ss][Ee][Rr][Vv][Ee][Rr]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: 'Hardening-reversal pair: actors holding a host often weaken SMB exposure and the firewall together.'
  - id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
    name: Disabled Volume Snapshots
    reason: Ransomware prep commonly stacked with defense evasion like this.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Defense-evasion step often performed by the same actor in the same session.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Net share deletion or LanmanServer changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]et1?(\.exe)?\s+share.*\/[Dd]elete.*/ OR /.*AutoShare.*/ OR /.*LanmanServer.*/)
    pivot_on: host
    window: 4h
  - name: Tools writing the LanmanServer Parameters key
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*LanmanServer.*[Pp]arameters.*/
    pivot_on: host
    window: 4h
  - name: Shadow copy or backup tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*vssadmin.*[Dd]elete.*/ OR /.*wbadmin.*[Dd]elete.*/ OR /.*bcdedit.*recoveryenabled.*/)
    pivot_on: host
    window: 4h
  - name: Admin share access
    query: data_win_system_eventID:5140 AND data_win_eventdata_shareName:(/.*ADMIN.*/ OR /.*C\$.*/)
    pivot_on: host
    window: 6h
