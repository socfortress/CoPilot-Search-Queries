tails:/.*\<\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Mm][Ss][Hh][Tt][Mm][Ll],[Cc][Uu][Ll][Tt][Uu][Rr][Ee]=.*/)))

