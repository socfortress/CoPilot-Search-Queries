name: Persistence Via Disk Cleanup Handler - Autorun
id: d4e2745c-f0c6-4bde-a3ab-b553b3f693cc
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d4e2745c-f0c6-4bde-a3ab-b553b3f693cc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker modifies values of the Disk Cleanup Handler in the
  registry to achieve persistence via autorun. The disk cleanup manager is part
  of the operating system. It displays the dialog box […] The user has the
  option of enabling or disabling individual handlers by selecting or clearing
  their check box in the disk cleanup manager's UI. Although Windows comes with
  a number of disk cleanup handlers, they aren't designed to handle files
  produced by other applications. Instead, the disk cleanup manager is designed
  to be flexible and extensible by enabling any developer to implement and
  register their own disk cleanup handler. Any developer can extend the
  available disk cleanup services by implementing and registering a disk cleanup
  handler.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\VolumeCaches\\\\*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Autorun*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\CleanupString*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\PreCleanupString*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*cmd*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*powershell*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*rundll32*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*mshta*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*cscript*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*wscript*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*wsl*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Users\\\\Public\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Windows\\\\TEMP\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\*';
  data_win_eventdata_targetObject matches '*\Autorun*';
  data_win_eventdata_details equals 'DWORD (0x00000001)', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://persistence-info.github.io/Data/diskcleanuphandler.html
  - https://www.hexacorn.com/blog/2018/09/02/beyond-good-ol-run-key-part-86/

response:
  message: >
    Persistence Via Disk Cleanup Handler - Autorun detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - cleanup
    - handler
    - registry
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Vv][Oo][Ll][Uu][Mm][Ee][Cc][Aa][Cc][Hh][Ee][Ss]\\.*/ AND ((data_win_eventdata_targetObject:/.*\\[Aa][Uu][Tt][Oo][Rr][Uu][Nn].*/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/) OR ((data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ee][Aa][Nn][Uu][Pp][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Rr][Ee][Cc][Ll][Ee][Aa][Nn][Uu][Pp][Ss][Tt][Rr][Ii][Nn][Gg].*/) AND (data_win_eventdata_details:/.*[Cc][Mm][Dd].*/ OR data_win_eventdata_details:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_details:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_details:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_details:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_details:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_details:/.*[Ww][Ss][Ll].*/ OR data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4f4e0be-cf12-439f-9e25-4e2cdcf7df5a
    name: Potential Persistence Via Disk Cleanup Handler - Registry
    reason: 'Same technique seen from key creation: a new VolumeCaches handler key is usually created just before its Autorun/CleanupString values are set.'
  - id: b697e69c-746f-4a86-9f59-7bfff8eab881
    name: UAC Bypass Using Disk Cleanup
    reason: Cleanup-handler abuse pairs with the cleanmgr/SilentCleanup path to run the payload elevated.
  - id: 724ea201-6514-4f38-9739-e5973c34f49a
    name: Bypass UAC Using SilentCleanup Task
    reason: The SilentCleanup scheduled task launches cleanmgr, which executes the poisoned handler.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Attackers planting a cleanup handler commonly also drop a conventional Run key as redundant persistence.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: If the handler was set via reg.exe the same operator typically adds Run-key persistence the same way.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: cleanmgr launched (autoclean/sageset/sagerun)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]\.[Ee][Xx][Ee]).*/ OR data_win_eventdata_commandLine:/.*([Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]|[Ss][Aa][Gg][Ee][Ss][Ee][Tt]|[Ss][Aa][Gg][Ee][Rr][Uu][Nn]|[Aa][Uu][Tt][Oo][Cc][Ll][Ee][Aa][Nn]).*/)
    pivot_on: host
    window: 24h
  - name: Children spawned by cleanmgr
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]\.[Ee][Xx][Ee]).*/ AND NOT data_win_eventdata_image:/.*(\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 24h
  - name: VolumeCaches key edited from command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv][Oo][Ll][Uu][Mm][Ee][Cc][Aa][Cc][Hh][Ee][Ss]).*/ AND data_win_eventdata_image:/.*(\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 24h
  - name: Payload staged in writable locations
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\).*/ AND data_win_eventdata_targetFilename:/.*(\.[Ee][Xx][Ee]|\.[Dd][Ll][Ll]|\.[Bb][Aa][Tt]|\.[Pp][Ss]1|\.[Vv][Bb][Ss]|\.[Hh][Tt][Aa]).*/
    pivot_on: host
    window: 6h
