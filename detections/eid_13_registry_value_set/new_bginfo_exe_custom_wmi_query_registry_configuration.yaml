name: New BgInfo.EXE Custom WMI Query Registry Configuration
id: cd277474-5c52-4423-a52b-ac2d7969902f
version: 1
schema_version: "1.0"
date: "2023-08-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd277474-5c52-4423-a52b-ac2d7969902f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects setting of a new registry value related to BgInfo configuration, which
  can be abused to execute custom WMI query via "BgInfo.exe". MITRE ATT&CK:
  T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Winternals\\\\BGInfo\\\\UserFields\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details: "6*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Winternals\BGInfo\UserFields\*'; data_win_eventdata_details
  matches '6*'.

known_false_positives: >
  Legitimate WMI query. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    New BgInfo.EXE Custom WMI Query Registry Configuration detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - bginfo
    - custom
    - query
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss]\\[Bb][Gg][Ii][Nn][Ff][Oo]\\[Uu][Ss][Ee][Rr][Ff][Ii][Ee][Ll][Dd][Ss]\\.*/ AND data_win_eventdata_details:/6.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 53330955-dc52-487f-a3a2-da24dcff99b5
    name: New BgInfo.EXE Custom DB Path Registry Configuration
    reason: Sibling BgInfo config value (custom DB path).
  - id: 992dd79f-dde8-4bb0-9085-6350ba97cfb3
    name: New BgInfo.EXE Custom VBScript Registry Configuration
    reason: Sibling BgInfo custom VBScript config.
  - id: 811f459f-9231-45d4-959a-0266c6311987
    name: Suspicious Child Process Of BgInfo.EXE
    reason: BgInfo spawning a suspicious child is the execution step that follows this configuration being planted.
  - id: aaf46cdc-934e-4284-b329-34aa701e3771
    name: Uncommon Child Process Of BgInfo.EXE
    reason: Uncommon child of BgInfo.exe confirms the VBScript/WMI/DB config was actually run.
  - id: 24869767-8579-485d-9a4f-d9ddfd8f0cac
    name: Process Execution via WMI
    reason: Process execution via WMI is the likely consequence of a malicious WMI query being run.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: Suspicious WmiPrvSE children reveal what the WMI query launched.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BgInfo.exe process execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Bb][Gg][Ii][Nn][Ff][Oo](64)?\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Child processes spawned by BgInfo
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Bb][Gg][Ii][Nn][Ff][Oo](64)?\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Other BgInfo registry configuration changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss]\\[Bb][Gg][Ii][Nn][Ff][Oo].*/
    pivot_on: host
    window: 6h
  - name: WmiPrvSE spawned processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
