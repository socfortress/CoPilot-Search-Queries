name: Suspicious Service Installed
id: f2485272-a156-4773-82d7-1d178bc4905b
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: xknow (@xknow_infosec), xorxes (@xor_xes)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f2485272-a156-4773-82d7-1d178bc4905b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects installation of NalDrv or PROCEXP152 services via registry-keys to
  non-system32 folders. Both services are used in the tool Ghost-In-The-Logs
  (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU
  (https://github.com/hfiref0x/KDU). MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_targetObject:
                    value: "HKLM\\System\\CurrentControlSet\\Services\\NalDrv\\ImagePath"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetObject:
                    value: "HKLM\\System\\CurrentControlSet\\Services\\PROCEXP152\\ImagePath"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\procexp64.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\procexp64a.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\procexp.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\procmon64.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\procmon64a.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\procmon.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\handle.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\handle64.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\handle64a.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*\\\\WINDOWS\\\\system32\\\\Drivers\\\\PROCEXP152.SYS*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject equals
  'HKLM\System\CurrentControlSet\Services\NalDrv\ImagePath';
  data_win_eventdata_targetObject equals
  'HKLM\System\CurrentControlSet\Services\PROCEXP152\ImagePath';
  data_win_eventdata_image matches '*\procexp64.exe', among other conditions.

known_false_positives: >
  Other legimate tools using this service names and drivers. Note - clever
  attackers may easily bypass this detection by just renaming the services.
  Therefore just Medium-level and don't rely on it. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://web.archive.org/web/20200419024230/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Suspicious Service Installed detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - service
    - installed
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Nn][Aa][Ll][Dd][Rr][Vv]\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/ OR data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]152\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_details AND NOT ((data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]64[Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]64[Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Aa][Nn][Dd][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Aa][Nn][Dd][Ll][Ee]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Aa][Nn][Dd][Ll][Ee]64[Aa]\.[Ee][Xx][Ee]/) AND data_win_eventdata_details:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Pp][Rr][Oo][Cc][Ee][Xx][Pp]152\.[Ss][Yy][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: KDU is the loader Ghost-In-The-Logs uses to map the vulnerable driver; its execution is the direct precursor.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Driver service creation via sc.exe is the alternative way the same kernel driver is registered.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Suspicious service creation commands around the same time indicate the service was installed by hand.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: The driver binary is typically loaded from a temp or user directory after the service key is set.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: Load of a known malicious or vulnerable driver name is the next step after the service key.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Ghost-In-The-Logs aims at blinding Sysmon; a Sysmon filter driver unload follows once kernel access is gained.
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: Pointing an existing service ImagePath at an attacker binary is the closely related service-registry tampering.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel drivers loaded from outside System32
    query: data_win_system_eventID:"6" AND NOT data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/
    pivot_on:
    - host
    window: 6h
  - name: Sysmon unload or configuration tampering
    query: (data_win_system_eventID:"16" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*-[Cc].*/)))
    pivot_on:
    - host
    window: 6h
  - name: Service registration commands with binary path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*.*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*.*/)
    pivot_on:
    - host
    window: 6h
  - name: Service ImagePath values written on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/)
    pivot_on:
    - host
    window: 6h
  - name: Event log clearing or ETW tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*.*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ee][Tt][Ww][Tt][Rr][Aa][Cc][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*.*/)
    pivot_on:
    - host
    window: 6h
