name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the modification of Outlook setting "LoadMacroProviderOnBoot" which if
  enabled allows the automatic loading of any configured VBA project/module.
  MITRE ATT&CK: T1137, T1008, T1546.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Outlook\\\\LoadMacroProviderOnBoot"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*0x00000001*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Outlook\LoadMacroProviderOnBoot'; data_win_eventdata_details matches
  '*0x00000001*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=53
  - https://www.linkedin.com/pulse/outlook-backdoor-using-vba-samir-b-/
  - https://attack.mitre.org/techniques/T1137/
  - https://attack.mitre.org/techniques/T1008/
  - https://attack.mitre.org/techniques/T1546/

response:
  message: >
    Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting detected
    on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1137, T1008, T1546
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137
    - T1008
    - T1546
  custom_tags:
    - persistence
    - outlook
    - loadmacroprovideronboot
    - registry
    - sysmon
    - privilege_escalation
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ll][Oo][Aa][Dd][Mm][Aa][Cc][Rr][Oo][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Oo][Nn][Bb][Oo][Oo][Tt]/ AND data_win_eventdata_details:/.*0[Xx]00000001.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e3b50fa5-3c3f-444e-937b-0a99d33731cd
    name: Outlook Macro Execution Without Warning Setting Enabled
    reason: Attackers weaken Outlook macro warnings alongside enabling VBA load at boot so the payload runs silently.
  - id: c3cefdf4-6703-4e1c-bad8-bf422fc5015a
    name: Outlook Security Settings Updated - Registry
    reason: Same Outlook Security hive tampering, part of preparing Outlook for macro persistence.
  - id: 117d3d3a-755c-4a61-b23e-9171146d094c
    name: Suspicious Outlook Macro Created
    reason: VbaProject.OTM is the macro this setting auto-loads; its creation is the payload drop.
  - id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
    name: New Outlook Macro Created
    reason: Creation of the Outlook VBA project file that this setting makes load automatically.
  - id: 9a0b8719-cd3c-4f0a-90de-765a4cb3f5ed
    name: Microsoft VBA For Outlook Addin Loaded Via Outlook
    reason: 'Follow-on: Outlook loads the VBA addin DLL at start, confirming the macro provider is active.'
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: 'Execution stage: the persisted macro spawns shells or script hosts from outlook.exe.'
  - id: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08
    name: Outlook EnableUnsafeClientMailRules Setting Enabled - Registry
    reason: Companion Outlook abuse setting often set by the same tooling.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outlook VBA macro project file writes
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Vv]ba[Pp]roject\.[Oo][Tt][Mm].*/
    pivot_on: host
    window: 6h
  - name: Outlook Security registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Oo]utlook\\[Ss]ecurity.*/
    pivot_on: host
    window: 6h
  - name: Process children of Outlook
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: VBA DLL loaded by Outlook
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*[Vv][Bb][Ee].*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 24h
  - name: Outlook hive registry edits by user
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\[Oo]utlook\\.*/
    pivot_on: user
    window: 4h
