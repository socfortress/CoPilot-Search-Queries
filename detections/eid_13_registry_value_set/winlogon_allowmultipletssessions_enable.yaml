name: Winlogon AllowMultipleTSSessions Enable
id: f7997770-92c3-4ec9-b112-774c4ef96f96
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f7997770-92c3-4ec9-b112-774c4ef96f96
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the 'AllowMultipleTSSessions' value is enabled. Which allows for
  multiple Remote Desktop connection sessions to be opened at once. This is
  often used by attacker as a way to connect to an RDP session without
  disconnecting the other users. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\AllowMultipleTSSessions"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows NT\CurrentVersion\Winlogon\AllowMultipleTSSessions';
  data_win_eventdata_details matches '*DWORD (0x00000001)'.

known_false_positives: >
  Legitimate use of the multi session functionality. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Winlogon AllowMultipleTSSessions Enable detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - winlogon
    - allowmultipletssessions
    - enable
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Aa][Ll][Ll][Oo][Ww][Mm][Uu][Ll][Tt][Ii][Pp][Ll][Ee][Tt][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn][Ss]/ AND data_win_eventdata_details:/.*[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: Sibling RDP registry tampering (fDenyTSConnections, port, security layer) usually set by the same operator while enabling RDP access
  - id: a2863fbc-d5cb-48d5-83fb-d976d4b1743b
    name: RDP Sensitive Settings Changed to Zero
    reason: Enabling RDP by zeroing fDenyTSConnections is the typical precursor to allowing concurrent sessions
  - id: 509e84b9-a71a-40e0-834f-05470369bd1e
    name: Default RDP Port Changed to Non Standard Port
    reason: Moving RDP off 3389 alongside multi-session enablement indicates a prepared hidden RDP channel
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Command-line reg.exe origin of RDP registry changes, giving the parent process and user
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall opening for RDP typically accompanies the registry change to make the host reachable
  - id: 37b437cf-3fc5-4c8e-9c94-1d7c9aff842b
    name: Allow RDP Remote Assistance Feature
    reason: Another registry-based loosening of remote access settings on the same host
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: Attackers add a local admin account to use for the extra RDP session
  - id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
    name: Potential RDP Session Hijacking Activity
    reason: Follow-on abuse of RDP sessions (tscon) once multiple sessions are possible
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other RDP/Terminal Services registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*([Tt]erminal [Ss]erver|[Tt]ermService|[Ww]inStations).*/
    pivot_on: host
    window: 6h
  - name: Local account creation or group add
    query: data_win_system_eventID:(4720 OR 4732 OR 4728)
    pivot_on: host
    window: 6h
  - name: RDP logons and session reconnects
    query: data_win_system_eventID:(4624 OR 4778 OR 4779) AND data_win_eventdata_logonType:(10 OR 7)
    pivot_on: host
    window: 6h
  - name: Firewall or netsh changes for port 3389
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Nn]etsh.*(3389|[Rr]emote [Dd]esktop).*/
    pivot_on: host
    window: 4h
  - name: tscon, mstsc or session enumeration tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\tscon\.exe/ OR /.*\\mstsc\.exe/ OR /.*\\quser\.exe/ OR /.*\\qwinsta\.exe/)
    pivot_on: host
    window: 4h
