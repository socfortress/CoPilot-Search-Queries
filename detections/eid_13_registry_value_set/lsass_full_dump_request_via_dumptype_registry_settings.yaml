name: Lsass Full Dump Request Via DumpType Registry Settings
id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: "@pbssubhash"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the setting of the "DumpType" registry value to "2" which stands for a
  "Full Dump". Technique such as LSASS Shtinkering requires this value to be "2"
  in order to dump LSASS. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\Windows Error Reporting\\\\LocalDumps\\\\DumpType*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\Windows Error Reporting\\\\LocalDumps\\\\lsass.exe\\\\DumpType*"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000002)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\DumpType*';
  data_win_eventdata_targetObject matches '*\SOFTWARE\Microsoft\Windows\Windows
  Error Reporting\LocalDumps\lsass.exe\DumpType*'; data_win_eventdata_details
  equals 'DWORD (0x00000002)'.

known_false_positives: >
  Legitimate application that needs to do a full dump of their process. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/deepinstinct/Lsass-Shtinkering
  - https://learn.microsoft.com/en-us/windows/win32/wer/collecting-user-mode-dumps
  - https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Lsass Full Dump Request Via DumpType Registry Settings detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - request
    - dumptype
    - registry
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Ll][Oo][Cc][Aa][Ll][Dd][Uu][Mm][Pp][Ss]\\[Dd][Uu][Mm][Pp][Tt][Yy][Pp][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Ll][Oo][Cc][Aa][Ll][Dd][Uu][Mm][Pp][Ss]\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]\\[Dd][Uu][Mm][Pp][Tt][Yy][Pp][Ee].*/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000002\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3e76af5-4ce0-4a14-9c9a-25ceb8fda182
    name: WerFault LSASS Process Memory Dump
    reason: 'Next step of LSASS Shtinkering: WerFault writes the full lsass dump the DumpType value requested.'
  - id: 1f0b4cac-9c81-41f4-95d0-8475ff46b3e2
    name: PPL Tampering Via WerFaultSecure
    reason: WerFaultSecure abuse dumps protected lsass alongside WER configuration tampering.
  - id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
    name: Potential Credential Dumping Via WER
    reason: WER-based dumping technique that depends on the same registry configuration.
  - id: 6902955a-01b7-432c-b32a-6f5f81d8f625
    name: LSASS Process Dump Artefact In CrashDumps Folder
    reason: Dump file appearing in CrashDumps confirms the requested full dump was produced.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Generic dump file creation confirms credential material was written to disk.
  - id: a18e0862-127b-43ca-be12-1a542c75c7c5
    name: LSASS Process Crashed - Application
    reason: Shtinkering forces an lsass WER crash; this is the crash event.
  - id: 55e29995-75e7-451a-bef0-6225e2f13597
    name: Potential Credential Dumping Via LSASS SilentProcessExit Technique
    reason: Sibling registry-based lsass dump technique; attackers try several.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WER LocalDumps registry configuration
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ee]rror [Rr]eporting\\[Ll]ocal[Dd]umps.*/
    pivot_on: host
    window: 4h
  - name: Dump files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll]sass.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Cc]rash[Dd]umps\\.*/)
    pivot_on: host
    window: 4h
  - name: WerFault and WerFaultSecure executions
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww]er[Ff]ault\.exe/ OR data_win_eventdata_image:/.*\\[Ww]er[Ff]ault[Ss]ecure\.exe/)
    pivot_on: host
    window: 4h
  - name: Process access to lsass
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll]sass\.exe/
    pivot_on: host
    window: 4h
  - name: Copy or archive of dump files
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ AND (data_win_eventdata_commandLine:/.*[Cc]opy.*/ OR data_win_eventdata_commandLine:/.*7z.*/ OR data_win_eventdata_commandLine:/.*[Cc]url.*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress.*/)
    pivot_on: host
    window: 6h
