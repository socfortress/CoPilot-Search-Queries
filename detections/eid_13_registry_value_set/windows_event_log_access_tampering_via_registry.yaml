name: Windows Event Log Access Tampering Via Registry
id: ba226dcf-d390-4642-b9af-b534872f1156
version: 1
schema_version: "1.0"
date: "2025-08-16"
author: X__Junior
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ba226dcf-d390-4642-b9af-b534872f1156
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the Windows EventLog channel permission values. It focuses
  on changes to the Security Descriptor Definition Language (SDDL) string, as
  modifications to these values can restrict access to specific users or groups,
  potentially aiding in defense evasion by controlling who can view or modify a
  event log channel. Upon execution, the user shouldn't be able to access the
  event log channel via the event viewer or via utilities such as "Get-EventLog"
  or "wevtutil". MITRE ATT&CK: T1547.001, T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\EventLog\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\CustomSD"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Policies\\\\Microsoft\\\\Windows\\\\EventLog\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\ChannelAccess"
                          case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*D:(D;*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*D:(*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*)(D;*"
                          case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\servicing\\TrustedInstaller.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Windows\\\\WinSxS\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\TiWorker.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image: ""
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SYSTEM\CurrentControlSet\Services\EventLog\*';
  data_win_eventdata_targetObject matches '*\CustomSD';
  data_win_eventdata_targetObject matches
  '*\Policies\Microsoft\Windows\EventLog\*', among other conditions.

known_false_positives: >
  Administrative activity, still unlikely. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.atomicredteam.io/atomic-red-team/atomics/T1562.002#atomic-test-8---modify-event-log-channel-access-permissions-via-registry---powershell
  - https://www.youtube.com/watch?v=uSYvHUVU8xY
  - https://learn.microsoft.com/en-us/windows/win32/secauthz/security-descriptor-definition-language
  - https://attack.mitre.org/techniques/T1547/001/
  - https://attack.mitre.org/techniques/T1112/

