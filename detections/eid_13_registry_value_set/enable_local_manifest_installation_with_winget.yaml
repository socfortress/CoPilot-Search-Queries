name: Enable Local Manifest Installation With Winget
id: fa277e82-9b78-42dd-b05c-05555c7b6015
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fa277e82-9b78-42dd-b05c-05555c7b6015
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the AppInstaller (winget) policy. Specifically the
  activation of the local manifest installation, which allows a user to install
  new packages via custom manifests.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\AppInstaller\\\\EnableLocalManifestFiles"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\AppInstaller\EnableLocalManifestFiles'; data_win_eventdata_details equals
  'DWORD (0x00000001)'.

known_false_positives: >
  Administrators or developers might enable this for testing purposes or to
  install custom private packages. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget

response:
  message: >
    Enable Local Manifest Installation With Winget detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - enable
    - local
    - manifest
    - registry
    - sysmon
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\[Ee][Nn][Aa][Bb][Ll][Ee][Ll][Oo][Cc][Aa][Ll][Mm][Aa][Nn][Ii][Ff][Ee][Ss][Tt][Ff][Ii][Ll][Ee][Ss]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 313d6012-51a0-4d93-8dfc-de8553239e25
    name: Install New Package Via Winget Local Manifest
    reason: The policy flip exists to allow winget install --manifest; this is the payoff execution
  - id: 05ebafc8-7aa2-4bcd-a269-2aec93f9e842
    name: Add New Download Source To Winget
    reason: Attacker may add a rogue winget source as an alternative to local manifests
  - id: 81a0ecb5-0a41-4ba1-b2ba-c944eb92bfa2
    name: Add Insecure Download Source To Winget
    reason: Insecure (http) winget source is a sibling way to deliver attacker packages
  - id: c15a46a0-07d4-4c87-b4b6-89207835a83b
    name: Add Potential Suspicious New Download Source To Winget
    reason: Suspicious source URL added to winget, same package-delivery abuse
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Winget local manifest install
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww]inget.*[Ii]nstall.*(\-\-manifest|\-m ).*/
    pivot_on: host
    window: 2h
  - name: Winget source changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww]inget.*[Ss]ource.*(add|reset|remove).*/
    pivot_on: host
    window: 4h
  - name: Winget settings / AppInstaller policy edits via CLI
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ww]inget.*[Ss]ettings.*/ OR data_win_eventdata_commandLine:/.*AppInstaller.*EnableLocalManifestFiles.*/)
    pivot_on: host
    window: 2h
  - name: Processes spawned by winget/AppInstaller
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Ww]inget|[Aa]pp[Ii]nstaller).*/
    pivot_on: host
    window: 2h
