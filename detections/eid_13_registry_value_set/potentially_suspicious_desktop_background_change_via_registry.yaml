name: Potentially Suspicious Desktop Background Change Via Registry
id: 85b88e05-dadc-430b-8a9e-53ff1cd30aae
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Nasreddine Bencherchali (Nextron Systems), Stephen Lincoln @slincoln-aiq (AttackIQ)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 85b88e05-dadc-430b-8a9e-53ff1cd30aae
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry value settings that would replace the user's desktop
  background. This is a common technique used by malware to change the desktop
  background to a ransom note or other image. MITRE ATT&CK: T1112, T1491.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*Control Panel\\\\Desktop*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*CurrentVersion\\\\Policies\\\\ActiveDesktop*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*CurrentVersion\\\\Policies\\\\System*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*NoChangingWallpaper"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Wallpaper"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\WallpaperStyle"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details: "2"
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\svchost.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Control Panel\\\\Desktop\\\\Wallpaper"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "(Empty)"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*C:\\\\Windows\\\\Explorer.EXE"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Program Files\\Amazon\\EC2Launch\\EC2Launch.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Program Files (x86)\\Amazon\\EC2Launch\\EC2Launch.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Control Panel\\\\Desktop\\\\Wallpaper"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Control Panel\Desktop*'; data_win_eventdata_targetObject matches
  '*CurrentVersion\Policies\ActiveDesktop*'; data_win_eventdata_targetObject
  matches '*CurrentVersion\Policies\System*', among other conditions.

known_false_positives: >
  Administrative scripts that change the desktop background to a company logo or
  other image. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.attackiq.com/2023/09/20/emulating-rhysida/
  - https://research.checkpoint.com/2023/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/
  - https://www.trendmicro.com/en_us/research/23/h/an-overview-of-the-new-rhysida-ransomware.html
  - https://www.virustotal.com/gui/file/a864282fea5a536510ae86c77ce46f7827687783628e4f2ceb5bf2c41b8cd3c6/behavior
  - https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.WindowsDesktop::Wallpaper
  - https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.ControlPanelDisplay::CPL_Personalization_NoDesktopBackgroundUI
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1491/001/

response:
  message: >
    Potentially Suspicious Desktop Background Change Via Registry detected on
    host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1112, T1491.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1491.001
  custom_tags:
    - desktop
    - background
    - change
    - registry
    - sysmon
    - persistence
    - impact
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/) AND ((data_win_eventdata_targetObject:/.*[Nn][Oo][Cc][Hh][Aa][Nn][Gg][Ii][Nn][Gg][Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/) OR data_win_eventdata_targetObject:/.*\\[Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr]/ OR (data_win_eventdata_targetObject:/.*\\[Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr][Ss][Tt][Yy][Ll][Ee]/ AND data_win_eventdata_details:"2")) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr]/ AND data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/) OR data_win_eventdata_image:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Mm][Aa][Zz][Oo][Nn]\\[Ee][Cc]2[Ll][Aa][Uu][Nn][Cc][Hh]\\[Ee][Cc]2[Ll][Aa][Uu][Nn][Cc][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Aa][Mm][Aa][Zz][Oo][Nn]\\[Ee][Cc]2[Ll][Aa][Uu][Nn][Cc][Hh]\\[Ee][Cc]2[Ll][Aa][Uu][Nn][Cc][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8b9606c9-28be-4a38-b146-0e313cc232c1
    name: Potential Ransomware Activity Using LegalNotice Message
    reason: Legal notice ransom message set via registry, often in the same ransomware run as the wallpaper
  - id: 83314318-052a-4c90-a1ad-660ece38d276
    name: Blackbyte Ransomware Registry
    reason: BlackByte ransomware registry changes accompany the ransom wallpaper
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware deletes shadow copies shortly before/after defacement
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: bcdedit recovery tampering is a standard ransomware pre-encryption step
  - id: 8cbc9475-8d05-4e27-9c32-df960716c701
    name: Potentially Suspicious Desktop Background Change Using Reg.EXE
    reason: Same wallpaper change performed via reg.exe commandline
  - id: 2c76a22b-702d-48fd-8fa9-e41e2fe203b3
    name: FunkLocker Ransomware File Creation
    reason: Ransomware file creation (ransom notes) around the wallpaper change
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy / backup destruction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd] [Nn][Oo].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Ransom note file creation
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Rr][Ee][Aa][Dd][Mm][Ee].*/ OR data_win_eventdata_targetFilename:/.*[Dd][Ee][Cc][Rr][Yy][Pp][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Hh][Oo][Ww]_[Tt][Oo].*/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Ss][Tt][Oo][Rr][Ee]_[Ff][Ii][Ll][Ee][Ss].*/)
    pivot_on: host
    window: 4h
  - name: Ransom legal notice registry edits
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ll][Ee][Gg][Aa][Ll][Nn][Oo][Tt][Ii][Cc][Ee][Tt][Ee][Xx][Tt].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ee][Gg][Aa][Ll][Nn][Oo][Tt][Ii][Cc][Ee][Cc][Aa][Pp][Tt][Ii][Oo][Nn].*/)
    pivot_on: host
    window: 4h
  - name: Services and security tools stopped
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/) AND (data_win_eventdata_commandLine:/.*[Ss][Qq][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp].*/)
    pivot_on: host
    window: 4h
  - name: Wallpaper registry writers
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr].*/
    pivot_on: host
    window: 4h
