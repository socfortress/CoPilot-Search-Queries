name: Custom File Open Handler Executes PowerShell
id: 7530b96f-ad8e-431d-a04d-ac85cc461fdc
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: CD_R0M_
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7530b96f-ad8e-431d-a04d-ac85cc461fdc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the abuse of custom file open handler, executing powershell. MITRE
  ATT&CK: T1202.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*shell\\\\open\\\\command\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*powershell*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*-command*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*shell\open\command\*'; data_win_eventdata_details matches '*powershell*';
  data_win_eventdata_details matches '*-command*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://news.sophos.com/en-us/2022/02/01/solarmarker-campaign-used-novel-registry-changes-to-establish-persistence/?cmp=30728
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Custom File Open Handler Executes PowerShell detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1202
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - custom
    - handler
    - executes
    - registry
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\.*/ AND data_win_eventdata_details:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_details:/.*-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: Shell Open key manipulation is the broader form of the same handler hijack.
  - id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
    name: Suspicious Shell Open Command Registry Modification
    reason: Suspicious shell open command value; overlapping detection with different command heuristics.
  - id: 44a22d59-b175-4f13-8c16-cbaef5b581ff
    name: New File Association Using Exefile
    reason: Pointing a file type at exefile turns any opened document into code execution.
  - id: ae6f14e6-14de-45b0-9f44-c0986f50dc89
    name: Change Default File Association To Executable Via Assoc
    reason: assoc.exe changing default association to an executable is the process-side route to the same hijack.
  - id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
    name: Registry Modification of MS-settings Protocol Handler
    reason: ms-settings protocol handler change is the UAC-bypass variant of handler hijacking.
  - id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
    name: Potential Persistence Via Custom Protocol Handler
    reason: 'Custom protocol handler persistence: same registry primitive, URL scheme trigger instead of file extension.'
  - id: 5cdeb555-65de-4767-99fe-e26807465148
    name: Forest Blizzard APT - Custom Protocol Handler Creation
    reason: Forest Blizzard created custom protocol handlers to run code; a known actor use of this technique.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell launched from document/explorer parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:/.*-[Cc]ommand.*/ AND data_win_eventdata_parentImage:(/.*[Ee]xplorer\.exe/ OR /.*[Ww]inword\.exe/ OR /.*[Aa]crord.*/ OR /.*[Ee]xcel\.exe/)
    pivot_on: host
    window: 2h
  - name: Other shell open or association writes
    query: data_win_system_eventID:13 AND (data_win_eventdata_targetObject:/.*[Ss]hell.[Oo]pen.[Cc]ommand.*/ OR data_win_eventdata_targetObject:/.*[Ff]ile[Ee]xts.*/ OR data_win_eventdata_targetObject:/.*[Cc]lasses.*[Dd]efault.*/)
    pivot_on: host
    window: 4h
  - name: Encoded or download-cradle PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:(/.*-[Ee]nc.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload[Ss]tring.*/ OR /.*[Ii][Ee][Xx].*/ OR /.*-[Ww]indow[Ss]tyle.*[Hh]idden.*/)
    pivot_on: host
    window: 4h
  - name: Script files dropped by the registry writer
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.ps1/ OR /.*\.bat/ OR /.*\.vbs/ OR /.*\.hta/ OR /.*\.cmd/)
    pivot_on: host
    window: 2h
