name: Office Autorun Keys Modification
id: baecf8fb-edbf-429f-9ade-31fc3f22b970
version: 1
schema_version: "1.0"
date: "2026-01-09"
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: baecf8fb-edbf-429f-9ade-31fc3f22b970
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modification of autostart extensibility point (ASEP) in registry.
  Adversaries may modify these keys to execute malicious code when Office files
  are opened. There are various legitimate add-ins that also use these keys and
  this filter list might not be exhaustive. Thus, it is recommended to review
  and tune filters for your environment to reduce false positives before
  deploying to production. MITRE ATT&CK: T1547.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Software\\\\Wow6432Node\\\\Microsoft\\\\Office*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Software\\\\Microsoft\\\\Office*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Word\\\\Addins*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\PowerPoint\\\\Addins*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Outlook\\\\Addins*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Onenote\\\\Addins*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Excel\\\\Addins*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Access\\\\Addins*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*test\\\\Special\\\\Perf*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details:
                          value: "(Empty)"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_details"
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Microsoft Office\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\Microsoft Office\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\PROGRA~2\\\\MICROS~2\\\\Office*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Windows\\\\System32\\\\msiexec.exe*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Windows\\\\SysWOW64\\\\msiexec.exe*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Windows\\\\System32\\\\regsvr32.exe*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Windows\\\\SysWOW64\\\\regsvr32.exe *"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Excel\\\\Addins\\\\AdHocReportingExcelClientLib.AdHocReportingExcelClientAddIn.1\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Excel\\\\Addins\\\\ExcelPlugInShell.PowerMapConnect\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Excel\\\\Addins\\\\NativeShim\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Excel\\\\Addins\\\\NativeShim.InquireConnector.1\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Excel\\\\Addins\\\\PowerPivotExcelClientAddIn.NativeEntry.1\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\AddIns\\\\AccessAddin.DC\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\AddIns\\\\ColleagueImport.ColleagueImportAddin\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\AddIns\\\\EvernoteCC.EvernoteContactConnector\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\AddIns\\\\EvernoteOLRD.Connect\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\OneNote.OutlookAddin*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\DriveFSExtensionLib.Connect\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\GoogleAppsSync.Connect\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\Microsoft.VbaAddinForOutlook.1\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\OcOffice.OcForms\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\OscAddin.Connect\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\OutlookChangeNotifier.Connect\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\UCAddin.LyncAddin.1*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\UCAddin.UCAddin.1*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Outlook\\\\Addins\\\\UmOutlookAddin.FormRegionAddin\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*AddinTakeNotesService\\\\FriendlyName*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\Updates\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\OfficeClickToRun.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\VSTO\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "C:\\\\Program Files (x86)\\\\Microsoft Shared\\\\VSTO\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\VSTOInstaller.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_image:
                                      value: "C:\\Program Files\\AVG\\Antivirus\\RegSvr.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_image:
                                      value: "C:\\Program Files\\AVG\\Antivirus\\x86\\RegSvr.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Microsoft\\\\Office\\\\Outlook\\\\Addins\\\\Antivirus.AsOutExt\\\\*"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_image:
                                      value: "C:\\Program Files\\Avast Software\\Avast\\RegSvr.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_image:
                                      value: "C:\\Program Files\\Avast Software\\Avast\\x86\\RegSvr.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Microsoft\\\\Office\\\\Outlook\\\\Addins\\\\Avast.AsOutExt\\\\*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Wow6432Node\Microsoft\Office*'; data_win_eventdata_targetObject
  matches '*\Software\Microsoft\Office*'; data_win_eventdata_targetObject
  matches '*\Word\Addins*', among other conditions.

known_false_positives: >
  Legitimate software or add-in installations and administrative configurations.
  Automatic registry modifications during legitimate software installations.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
  - https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
  - https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    Office Autorun Keys Modification detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1547.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - office
    - autorun
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
