correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 961e33d1-4f86-4fcf-80ab-930a708b2f82
    name: Potential Persistence Via Excel Add-in - Registry
    reason: Specific Excel add-in registration; if both fire the add-in is the persistence vehicle.
  - id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
    name: Potential Persistence Via Microsoft Office Add-In
    reason: Add-in file dropped to an Office add-in location, the file counterpart to this registry write.
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: Office startup folder is the sibling persistence location frequently used with add-in keys.
  - id: 3d27f6dd-1c74-4687-b4fa-ca849d128d1c
    name: Office Application Startup - Office Test
    reason: Office Test\Special\Perf key is another Office autostart the same actor might set.
  - id: 9d15044a-7cfe-4d23-8085-6ebc11df7685
    name: Potential Persistence Via Visual Studio Tools for Office
    reason: VSTO registration is another Office add-in persistence route in the same Office key tree.
  - id: 91239011-fe3c-4b54-9f24-15c86bb65913
    name: Office Macros Warning Disabled
    reason: Macro warnings being disabled around the same time means the actor lowered Office defences.
  - id: af4c4609-5755-42fe-8075-4effb49f5d44
    name: Microsoft Excel Add-In Loaded From Uncommon Location
    reason: 'The follow-on: Excel actually loading the registered add-in from an odd path.'
  - id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
    name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
    reason: Outlook macro persistence in the same registry tree.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office add-in and startup files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(xll|xlam|xla|wll|dotm|ppam|vsto|dll)/ AND (data_win_eventdata_targetFilename:*[Aa]dd[Ii]ns* OR data_win_eventdata_targetFilename:*XLSTART* OR data_win_eventdata_targetFilename:*STARTUP*)
    pivot_on: host
    window: 6h
  - name: Office apps loading add-in DLLs
    query: data_win_system_eventID:7 AND data_win_eventdata_image:(*EXCEL.EXE OR *WINWORD.EXE OR *OUTLOOK.EXE OR *POWERPNT.EXE) AND data_win_eventdata_imageLoaded:/.*\.(dll|xll)/ AND NOT data_win_eventdata_imageLoaded:*Windows*
    pivot_on: host
    window: 24h
  - name: Office spawning scripting children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(*EXCEL.EXE OR *WINWORD.EXE OR *OUTLOOK.EXE OR *POWERPNT.EXE) AND data_win_eventdata_image:(*cmd.exe OR *[Pp]ower[Ss]hell* OR *wscript.exe OR *cscript.exe OR *mshta.exe OR *rundll32.exe OR *regsvr32.exe)
    pivot_on: host
    window: 6h
  - name: Office security setting changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(*VBAWarnings* OR *AccessVBOM* OR *ProtectedView* OR *[Tt]rusted[Ll]ocations*)
    pivot_on: host
    window: 6h
