name: Uncommon Extension In Keyboard Layout IME File Registry Value
id: b888e3f2-224d-4435-b00b-9dd66e9ea1f1
version: 1
schema_version: "1.0"
date: "2023-11-21"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b888e3f2-224d-4435-b00b-9dd66e9ea1f1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of Windows Input Method Editor (IME) keyboard layout feature,
  which allows an attacker to load a DLL into the process after sending the
  WM_INPUTLANGCHANGEREQUEST message. Before doing this, the client needs to
  register the DLL in a special registry key that is assumed to implement this
  keyboard layout. This registry key should store a value named "Ime File" with
  a DLL path. IMEs are essential for languages that have more characters than
  can be represented on a standard keyboard, such as Chinese, Japanese, and
  Korean. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Control\\\\Keyboard Layouts\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Ime File*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.ime"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\Keyboard Layouts\*'; data_win_eventdata_targetObject matches '*Ime
  File*'; data_win_eventdata_details matches '*.ime'.

known_false_positives: >
  IMEs are essential for languages that have more characters than can be
  represented on a standard keyboard, such as Chinese, Japanese, and Korean.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.linkedin.com/pulse/guntior-story-advanced-bootkit-doesnt-rely-windows-disk-baranov-wue8e/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Uncommon Extension In Keyboard Layout IME File Registry Value detected on
    host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - uncommon
    - extension
    - keyboard
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Kk][Ee][Yy][Bb][Oo][Aa][Rr][Dd] [Ll][Aa][Yy][Oo][Uu][Tt][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*[Ii][Mm][Ee] [Ff][Ii][Ll][Ee].*/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*\.[Ii][Mm][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9d8f9bb8-01af-4e15-a3a2-349071530530
    name: Suspicious Path In Keyboard Layout IME File Registry Value
    reason: Same Ime File value flagged by path rather than extension; both point to a rogue DLL.
  - id: 34aa0252-6039-40ff-951f-939fd6ce47d8
    name: Suspicious Keyboard Layout Load
    reason: The layout load step that triggers the planted IME DLL.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Persistence commonly follows once elevation/UAC weakening is achieved.
  - id: e88a6ddc-74f7-463b-9b26-f69fc0d2ce85
    name: New TimeProviders Registered With Uncommon DLL Name
    reason: Another registry-registered DLL loading technique with similar triage.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Keyboard Layouts registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Kk]eyboard [Ll]ayouts.*/
    pivot_on: host
    window: 4h
  - name: DLL dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(Temp|ProgramData|Users.Public|AppData).*\.(dll|ime)/
    pivot_on: host
    window: 4h
  - name: Unsigned DLL loaded into ctfmon/explorer/winlogon
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*(ctfmon|explorer|winlogon)\.exe/ AND data_win_eventdata_signed:false
    pivot_on: host
    window: 4h
  - name: Keyboard layout API scripting
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(LoadKeyboardLayout|ActivateKeyboardLayout|[Kk]eyboard [Ll]ayouts).*/
    pivot_on: host
    window: 4h
