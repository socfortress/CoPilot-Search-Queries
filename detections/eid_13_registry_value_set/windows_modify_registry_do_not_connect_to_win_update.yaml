name: Windows Modify Registry DoNotConnectToWindowsUpdateInternetLocations
id: windows-modify-registry-donotconnect-wsus-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of DoNotConnectToWindowsUpdateInternetLocations registry 
  value to 1, preventing Windows from connecting to Windows Update servers. 
  Adversaries disable Windows Update connectivity to prevent security patches 
  from being downloaded, maintaining vulnerabilities for exploitation. Used by 
  ransomware operators and referenced in CISA advisories.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\WindowsUpdate\\DoNotConnectToWindowsUpdateInternetLocations"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  WindowsUpdate policy registry paths. Ensure Sysmon config includes 
  Policies\Microsoft\Windows\WindowsUpdate in EventID 13 TargetObject rules.

known_false_positives: >
  WSUS environments may configure this via Group Policy to force internal 
  update servers. Investigate process and user context.

references:
  - https://attack.mitre.org/techniques/T1112/
  - https://learn.microsoft.com/en-us/windows/deployment/update/waas-wu-settings

response:
  message: >
    Windows Update internet connectivity disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Windows Defense Evasion Tactics
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_update
    - update_tampering
    - defense_evasion
    - wsus_bypass
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*WindowsUpdate.*DoNotConnectToWindowsUpdateInternetLocations/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-no-auto-update-001
    name: Windows Modify Registry No Auto Update
    reason: Same goal of stopping patching; actors usually set several Windows Update policy values in one burst.
  - id: windows-modify-registry-usewuserver-001
    name: Windows Modify Registry UseWUServer
    reason: Redirecting Windows Update to a rogue WSUS server is the alternate way to control patching and delivery.
  - id: windows-modify-registry-wuserver-001
    name: Windows Modify Registry WuServer
    reason: A changed WUServer value points update traffic at attacker-chosen infrastructure alongside blocking public update locations.
  - id: windows-modify-registry-auto-minor-updates-001
    name: Windows Modify Registry Auto Minor Updates
    reason: Another Windows Update policy value commonly changed in the same tampering sequence.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Blocking Windows Update is usually part of a wider push to weaken host defenses including Defender.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Disabling Tamper Protection lets the actor persist further security-control changes after patching is blocked.
  - id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
    name: Disable Windows Firewall by Registry
    reason: Firewall disablement by registry is a common companion hardening-removal step.
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Event logging disablement follows to reduce visibility once patching and AV updates are blocked.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Update policy/service registry tampering
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(*\\WindowsUpdate\\* OR *\\wuauserv\\* OR *\\UsoSvc\\* OR *\\WaaSMedicSvc\\*)
    pivot_on: host
    window: 6h
  - name: Update service stop or disable commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww][Uu][Aa][Uu][Ss][Ee][Rr][Vv].*/ OR /.*[Uu][Ss][Oo][Ss][Vv][Cc].*/ OR /.*[Ww][Aa][Aa][Ss][Mm][Ee][Dd][Ii][Cc].*/)
    pivot_on: host
    window: 6h
  - name: Defender and firewall disabling commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Aa]dvfirewall.*[Oo]ff.*/ OR /.*[Dd]isable[Rr]ealtime.*/)
    pivot_on: host
    window: 6h
  - name: Recovery inhibition commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Vv]ssadmin.*[Dd]elete.*/ OR /.*[Bb]cdedit.*/ OR /.*[Ww]badmin.*[Dd]elete.*/)
    pivot_on: host
    window: 6h
