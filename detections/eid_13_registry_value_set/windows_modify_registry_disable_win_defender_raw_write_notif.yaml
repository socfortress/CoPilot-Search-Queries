name: Windows Modify Registry Disable Win Defender Raw Write Notif
id: windows-modify-registry-disable-defender-raw-write-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of DisableRawWriteNotification registry value to 1 under 
  Windows Defender Real-Time Protection settings. Disabling raw write notifications 
  allows malware to bypass Defender's behavior monitoring for disk write operations. 
  Used by Azorult malware and referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Windows Defender\\Real-Time Protection\\DisableRawWriteNotification"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Windows Defender registry paths. The Windows Defender path is typically 
  included in default Sysmon configurations. Note: Tamper Protection 
  prevents manual testing — any modification bypassing Tamper Protection 
  is highly suspicious.

known_false_positives: >
  Administrators may configure this via Group Policy. Any direct registry 
  modification bypassing Group Policy is suspicious. Tamper Protection 
  should prevent unauthorized changes.

references:
  - https://admx.help/?Category=SystemCenterEndpointProtection&Policy=Microsoft.Policies.Antimalware::real-time_protection_disablerawwritenotification
  - https://app.any.run/tasks/a6f2ffe2-e6e2-4396-ae2e-04ea0143f2d8/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    Windows Defender raw write notification disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Defender evasion. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Azorult
    - CISA AA23-347A
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_defender
    - raw_write_notification
    - defender_evasion
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Windows Defender.*Real-Time Protection.*DisableRawWriteNotification/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows_DisableAntiSpyware_Registry
    name: Windows DisableAntiSpyware Registry
    reason: Same Defender policy hive; malware commonly sets DisableAntiSpyware alongside DisableRawWriteNotification as one tamper batch.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Bulk Defender feature disable via registry keys on the same host is the broader tamper this value belongs to.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Exclusions added via registry are the usual companion step to blind Defender before payload staging.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection must be off for policy-key writes like this to stick; its disable is a direct precursor.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: PowerShell Defender exclusion commands frequently run from the same dropper that writes this value.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender's own log reporting realtime protection disabled confirms the registry change took effect.
  - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
    name: Windows Defender Service Disabled - Registry
    reason: Defender service disabled via registry is the next escalation after weakening behaviour monitoring.
  - id: f7f9ab88-7557-4a69-b30e-0a8f91b3a0e7
    name: Registry Entries For Azorult Malware
    reason: The description ties this value to Azorult, so its other registry artefacts confirm the family.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender real-time protection value changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Real-Time Protection.*(Disable|Monitoring|Scan|Behavior).*/
    pivot_on: host
    window: 2h
  - name: Defender exclusions or preference tampering by command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|[Rr]emove-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime|[Ee]xclusion[Pp]ath).*/
    pivot_on: host
    window: 2h
  - name: Process that wrote the value then spawned tamper tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\(powershell|cmd|wscript|cscript|mshta|rundll32)\.exe/ AND data_win_eventdata_image:/.*\\(reg|powershell|sc|net|netsh)\.exe/
    pivot_on: host
    window: 1h
  - name: Executables dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(AppData|Temp|ProgramData|Public)\\.*\.(exe|dll|scr|ps1|bat|vbs)/
    pivot_on: host
    window: 2h
  - name: Outbound connections from user-writable executables
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\(AppData|Temp|ProgramData|Public)\\.*/ AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 4h
