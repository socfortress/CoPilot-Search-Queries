name: Disable Windows Event Logging Via Registry
id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects tampering with the "Enabled" registry key in order to disable Windows
  logging of a Windows event channel. MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Enabled"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\system32\\wevtutil.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Windows\\\\winsxs\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\TiWorker.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\System32\\svchost.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\Microsoft-Windows-FileInfoMinifilter*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\Microsoft-Windows-ASN1\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\Microsoft-Windows-Kernel-AppCompat\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\Microsoft-Windows-Runtime\\\\Error\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetObject:
                                      value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\Microsoft-Windows-CAPI2/Operational\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\servicing\\TrustedInstaller.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\Microsoft-Windows-Compat-Appraiser*"
                                case_insensitive: true
                  minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image: ""
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\CurrentVersion\WINEVT\Channels\*';
  data_win_eventdata_targetObject matches '*\Enabled';
  data_win_eventdata_details equals 'DWORD (0x00000000)', among other
  conditions.

known_false_positives: >
  Rare falsepositives may occur from legitimate administrators disabling
  specific event log for troubleshooting. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/WhichbufferArda/status/1543900539280293889
  - https://github.com/DebugPrivilege/CPP/blob/c39d365617dbfbcb01fffad200d52b6239b2918c/Windows%20Defender/RestoreDefenderConfig.cpp
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Disable Windows Event Logging Via Registry detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - disable
    - logging
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Tt][Ii][Ww][Oo][Rr][Kk][Ee][Rr]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ff][Ii][Ll][Ee][Ii][Nn][Ff][Oo][Mm][Ii][Nn][Ii][Ff][Ii][Ll][Tt][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Aa][Ss][Nn]1\\.*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Kk][Ee][Rr][Nn][Ee][Ll]-[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Rr][Uu][Nn][Tt][Ii][Mm][Ee]\\[Ee][Rr][Rr][Oo][Rr]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Cc][Aa][Pp][Ii]2\/[Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn][Aa][Ll]\\.*/)) OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ii][Nn][Gg]\\[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Cc][Oo][Mm][Pp][Aa][Tt]-[Aa][Pp][Pp][Rr][Aa][Ii][Ss][Ee][Rr].*/)) AND NOT (data_win_eventdata_image:"" OR NOT _exists_:data_win_eventdata_image)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8839e550-52d7-4958-9f2f-e13c1e736838
    name: Security Event Logging Disabled via MiniNt Registry Key - Registry Set
    reason: Alternate registry trick to silence Security logging, used for the same goal.
  - id: f37b4bce-49d0-4087-9f5b-58bffda77316
    name: Potential AutoLogger Sessions Tampering
    reason: AutoLogger/ETW session tampering is the sibling log-blinding technique.
  - id: 0cb8d736-995d-4ce7-a31e-1e8d452a1459
    name: Potential EventLog File Location Tampering
    reason: Redirecting eventlog files is another way of hiding activity from the collector.
  - id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
    name: PowerShell Logging Disabled Via Registry Key Tampering
    reason: PowerShell logging is disabled alongside channel logging before running tooling.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Command-line equivalent (wevtutil sl /e:false) producing the same registry change.
  - id: 100ef69e-3327-481c-8e5c-6d80d9507556
    name: Important Windows Eventlog Cleared
    reason: Disabling future logging is commonly paired with clearing logs already written.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Security log wipe following the logging disablement.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Audit policy changes complete the blinding of the host.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Channel disablement commands (wevtutil / PowerShell / auditpol)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]evtutil.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Ww]in[Ee]vent[Ll]og.*/ OR data_win_eventdata_commandLine:/.*[Ll]ogman.*/ OR data_win_eventdata_commandLine:/.*[Aa]uditpol.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other writes to Eventlog, WINEVT and AutoLogger keys
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ee][Vv][Tt].[Cc]hannels.*/ OR data_win_eventdata_targetObject:/.*[Ee]vent[Ll]og.*/ OR data_win_eventdata_targetObject:/.*[Aa]uto[Ll]ogger.*/ OR data_win_eventdata_targetObject:/.*[Mm]ini[Nn]t.*/ OR data_win_eventdata_targetObject:/.*[Ss]cript[Bb]lock[Ll]ogging.*/)
    pivot_on:
    - host
    window: 6h
  - name: Log cleared or audit policy change events
    query: data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR data_win_system_eventID:"4719" OR data_win_system_eventID:"4906"
    pivot_on:
    - host
    window: 6h
  - name: Defender or security-product tampering in the same window
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Tt]amper[Pp]rotection.*/ OR data_win_eventdata_commandLine:/.*[Mm]p[Cc]md[Rr]un.*/ OR data_win_eventdata_commandLine:/.*[Ww]indows [Dd]efender.*[Dd]isable.*/)
    pivot_on:
    - host
    window: 4h
  - name: Credential dumping or discovery tooling during the blind window
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll]sass.[Ee]xe/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm]inidump.*/ OR data_win_eventdata_commandLine:/.*[Pp]rocdump.*/ OR data_win_eventdata_commandLine:/.*[Ss]ekurlsa.*/ OR data_win_eventdata_commandLine:/.*[Nn]tdsutil.*/))
    pivot_on:
    - host
    window: 6h
