name: Potential Persistence Via DLLPathOverride
id: a1b1fd53-9c4a-444c-bae0-34a330fc7aa8
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a1b1fd53-9c4a-444c-bae0-34a330fc7aa8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker adds a new "DLLPathOverride" value to the "Natural
  Language" key in order to achieve persistence which will get invoked by
  "SearchIndexer.exe" process.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\ContentIndex\\\\Language\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\StemmerDLLPathOverride*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\WBDLLPathOverride*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\StemmerClass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\WBreakerClass*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SYSTEM\CurrentControlSet\Control\ContentIndex\Language\*';
  data_win_eventdata_targetObject matches '*\StemmerDLLPathOverride*';
  data_win_eventdata_targetObject matches '*\WBDLLPathOverride*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://persistence-info.github.io/Data/naturallanguage6.html
  - https://www.hexacorn.com/blog/2018/12/30/beyond-good-ol-run-key-part-98/

response:
  message: >
    Potential Persistence Via DLLPathOverride detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - dllpathoverride
    - registry
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Cc][Oo][Nn][Tt][Ee][Nn][Tt][Ii][Nn][Dd][Ee][Xx]\\[Ll][Aa][Nn][Gg][Uu][Aa][Gg][Ee]\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Ss][Tt][Ee][Mm][Mm][Ee][Rr][Dd][Ll][Ll][Pp][Aa][Tt][Hh][Oo][Vv][Ee][Rr][Rr][Ii][Dd][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Bb][Dd][Ll][Ll][Pp][Aa][Tt][Hh][Oo][Vv][Ee][Rr][Rr][Ii][Dd][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Tt][Ee][Mm][Mm][Ee][Rr][Cc][Ll][Aa][Ss][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Bb][Rr][Ee][Aa][Kk][Ee][Rr][Cc][Ll][Aa][Ss][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b23818c7-e575-4d13-8012-332075ec0a2b
    name: Register New IFiltre For Persistence
    reason: IFilter registration is the other Windows Search extension point abused to get code into SearchIndexer.
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: Creation of a non-existent system DLL stages the stemmer/word-breaker DLL the override points to.
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: A system-named DLL in an unexpected folder is a likely payload name for the override.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: Unsigned DLL loaded by a Windows binary captures SearchIndexer loading the planted DLL.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: reg.exe scripted registry writes commonly set the override value.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Search indexer DLL loads from non-system paths
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*(SearchIndexer|SearchProtocolHost|SearchFilterHost)\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*(Windows.(System32|SysWOW64|WinSxS)|Program Files).*/
    pivot_on: host
    window: 24h
  - name: Children spawned by Search indexer
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(SearchIndexer|SearchProtocolHost|SearchFilterHost)\.exe/
    pivot_on: host
    window: 24h
  - name: ContentIndex and Windows Search registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(ContentIndex|Windows Search|PersistentHandlers).*/
    pivot_on: host
    window: 6h
  - name: DLL files dropped in writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.dll/ AND data_win_eventdata_targetFilename:/.*(Temp|ProgramData|AppData|Public|Windows.System32).*/
    pivot_on: host
    window: 6h
  - name: Outbound connections from indexer processes
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*Search(Indexer|ProtocolHost)\.exe/
    pivot_on: host
    window: 24h
