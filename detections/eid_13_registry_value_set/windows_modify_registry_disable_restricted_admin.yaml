name: Windows Modify Registry Disable Restricted Admin
id: windows-modify-registry-disable-restricted-admin-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of DisableRestrictedAdmin registry value to 0, which 
  enables Restricted Admin mode bypass. This weakens credential protection 
  during remote connections, allowing pass-the-hash attacks via RDP. Used by 
  Medusa ransomware and referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Control\\Lsa\\DisableRestrictedAdmin"
        - term:
            data_win_eventdata_details: "DWORD (0x00000000)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  the LSA registry path. The Control\Lsa path is typically included in 
  default Sysmon configurations.

known_false_positives: >
  Administrators may change this setting for legitimate remote access 
  configuration. Investigate process and user context.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Restricted Admin mode disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Enables pass-the-hash via RDP. MITRE ATT&CK: T1112
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - CISA AA23-347A
    - Medusa Ransomware
    - GhostRedirector IIS Module and Rungan Backdoor
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - restricted_admin
    - lsa_registry
    - rdp_security
    - credential_exposure
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Control.*Lsa.*DisableRestrictedAdmin/ AND data_win_eventdata_details:"DWORD (0x00000000)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d6ce7ebd-260b-4323-9768-a9631c8d4db2
    name: RestrictedAdminMode Registry Value Tampering
    reason: Broader registry detection of the same DisableRestrictedAdmin value
  - id: 28ac00d6-22d9-4a3c-927f-bbd770104573
    name: RestrictedAdminMode Registry Value Tampering - ProcCreation
    reason: Command-line side of the same change, shows the actor process
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: The goal of this change is RDP pass-the-hash; logon events confirm exploitation
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: Credential-exposure weakening is often stacked with this change
  - id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
    name: Windows Credential Guard Disabled - Registry
    reason: Same credential-protection weakening objective
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz sekurlsa::pth supplies the hash used for restricted-admin RDP
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: mstsc /restrictedadmin is the next step after enabling the mode
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: RDP configuration changes frequently grouped with this one
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mstsc restricted admin usage
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm]stsc\.exe/ AND data_win_eventdata_commandLine:/.*[Rr]estricted[Aa]dmin.*/
    pivot_on: host
    window: 4h
  - name: Credential dumping and pass-the-hash tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*sekurlsa.*/ OR data_win_eventdata_commandLine:/.*[Mm]imikatz.*/ OR data_win_eventdata_commandLine:/.*[Pp]rocdump.*lsass.*/ OR data_win_eventdata_commandLine:/.*comsvcs.*MiniDump.*/)
    pivot_on: host
    window: 4h
  - name: LSASS process access
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 4h
  - name: LSA and WDigest registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*Control.*Lsa.*/ OR data_win_eventdata_targetObject:/.*WDigest.*/)
    pivot_on: host
    window: 24h
  - name: Network NTLM logons by the user
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10") AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on: user
    window: 6h
