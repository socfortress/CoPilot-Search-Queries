name: Default RDP Port Changed to Non Standard Port
id: 509e84b9-a71a-40e0-834f-05470369bd1e
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 509e84b9-a71a-40e0-834f-05470369bd1e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the default RDP port. Remote desktop is a common feature in
  operating systems. It allows a user to log into a remote system using an
  interactive session with a graphical user interface. Microsoft refers to its
  implementation of the Remote Desktop Protocol (RDP) as Remote Desktop Services
  (RDS). MITRE ATT&CK: T1547.010.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Control\\\\Terminal Server\\\\WinStations\\\\RDP-Tcp\\\\PortNumber"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "DWORD (0x00000d3d)"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\Terminal Server\WinStations\RDP-Tcp\PortNumber';
  data_win_eventdata_details equals 'DWORD (0x00000d3d)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.001/T1021.001.md
  - https://attack.mitre.org/techniques/T1547/010/

response:
  message: >
    Default RDP Port Changed to Non Standard Port detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1547.010
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.010
  custom_tags:
    - default
    - changed
    - standard
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr]\\[Ww][Ii][Nn][Ss][Tt][Aa][Tt][Ii][Oo][Nn][Ss]\\[Rr][Dd][Pp]-[Tt][Cc][Pp]\\[Pp][Oo][Rr][Tt][Nn][Uu][Mm][Bb][Ee][Rr]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000[Dd]3[Dd]\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: 'Other RDP sensitive settings changed in registry: attacker enabling RDP usually touches several.'
  - id: a2863fbc-d5cb-48d5-83fb-d976d4b1743b
    name: RDP Sensitive Settings Changed to Zero
    reason: RDP settings set to zero e.g. fDenyTSConnections=0, enabling RDP prior to the port change.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: 'reg.exe tampering with RDP keys: the command-line view of the port change.'
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: netsh opening a firewall rule for RDP so the new port is reachable.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: 'netsh port forwarding for RDP: alternate way to expose RDP on a non-standard port.'
  - id: a54f842a-3713-4b45-8c84-5f136fdebd3c
    name: New PortProxy Registry Entry Added
    reason: 'PortProxy registry entry: persistent port-forward often paired with RDP tunneling.'
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: 'New firewall rule added via netsh: needed to allow inbound to the custom RDP port.'
  - id: f7997770-92c3-4ec9-b112-774c4ef96f96
    name: Winlogon AllowMultipleTSSessions Enable
    reason: 'AllowMultipleTSSessions enabled: concurrent RDP sessions for hidden attacker access.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Firewall rules or portproxy for the new port
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Nn]etsh\.exe/ OR /.*[Pp]ower[Ss]hell.*/) AND data_win_eventdata_commandLine:(/.*[Ff]irewall.*[Aa]dd.*/ OR /.*[Nn]et-[Ff]ire[Ww]all[Rr]ule.*/ OR /.*[Pp]ort[Pp]roxy.*/)
    pivot_on: host
    window: 4h
  - name: Terminal Services registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*[Tt]erminal [Ss]erver.*/ OR /.*[Tt]erm[Ss]ervice.*/)
    pivot_on: host
    window: 6h
  - name: TermService stop/start/restart
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Tt]erm[Ss]ervice.*/ OR /.*[Ss]top.*[Tt]erm.*/)
    pivot_on: host
    window: 2h
  - name: RDP-type logons and session reconnects
    query: data_win_system_eventID:(4624 OR 4778 OR 4779) AND data_win_eventdata_logonType:(10 OR 7)
    pivot_on: host
    window: 6h
  - name: New accounts or admin group changes
    query: data_win_system_eventID:(4720 OR 4728 OR 4732)
    pivot_on: host
    window: 6h
