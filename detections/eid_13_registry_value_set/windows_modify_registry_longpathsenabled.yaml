name: Windows Modify Registry LongPathsEnabled
id: windows-modify-registry-longpathsenabled-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of LongPathsEnabled registry value to 1, allowing file 
  paths longer than 260 characters. BlackByte ransomware exploits this setting 
  to bypass file path limitations, enabling execution of payloads with deeply 
  nested or long directory paths as an evasion technique.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Control\\FileSystem\\LongPathsEnabled"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  FileSystem registry paths. This path is typically included in default 
  Sysmon configurations under CurrentControlSet\Control.

known_false_positives: >
  Administrators may enable long paths for development or application 
  compatibility. Investigate process and user context.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/07/06/the-five-day-job-a-blackbyte-ransomware-intrusion-case-study/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Long paths enabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Possible BlackByte ransomware. MITRE ATT&CK: T1112
  risk_score: 16
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 16
  threat_objects: []

tags:
  analytic_story:
    - BlackByte Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - longpaths
    - filesystem
    - blackbyte
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Control.*FileSystem.*LongPathsEnabled/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-enable-linked-connections-001
    name: Windows Modify Registry EnableLinkedConnections
    reason: BlackByte sets this together with LongPathsEnabled to reach mapped network drives from elevated processes.
  - id: 83314318-052a-4c90-a1ad-660ece38d276
    name: Blackbyte Ransomware Registry
    reason: BlackByte ransomware registry set bundles LongPathsEnabled with EnableLinkedConnections; this rule is its sibling.
  - id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
    name: Disabled Volume Snapshots
    reason: BlackByte-style ransomware disables snapshots after these registry tweaks.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup deletion typically follows within the same intrusion.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Boot recovery tampering is part of the same ransomware prep.
  - id: c7dcacd0-cc59-4004-b0a4-1d6cdebe6f3e
    name: Disable Administrative Share Creation at Startup
    reason: Admin share changes support spread to network shares.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BlackByte-related registry sets
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(*\\Policies\\System\\EnableLinkedConnections OR *\\Policies\\System\\LocalAccountTokenFilterPolicy OR *\\Control\\FileSystem\\LongPathsEnabled)
    pivot_on: host
    window: 4h
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Vv]ssadmin.*/ OR /.*[Ww]badmin.*[Dd]elete.*/ OR /.*[Bb]cdedit.*/)
    pivot_on: host
    window: 4h
  - name: Very long image paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.{200,}/
    pivot_on: host
    window: 4h
  - name: Security tooling and service stops
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]et +stop.*/ OR /.*[Ss]c +(stop|config).*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*/)
    pivot_on: host
    window: 4h
