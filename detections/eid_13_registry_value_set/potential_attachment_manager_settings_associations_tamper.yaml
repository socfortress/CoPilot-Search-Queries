name: Potential Attachment Manager Settings Associations Tamper
id: a9b6c011-ab69-4ddb-bc0a-c4f21c80ec47
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a9b6c011-ab69-4ddb-bc0a-c4f21c80ec47
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects tampering with attachment manager settings policies associations to
  lower the default file type risks (See reference for more information).

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Associations\\\\*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\DefaultFileTypeRisk"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00006152)"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\LowRiskFileTypes"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.zip;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.rar;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.exe;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.bat;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.com;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.cmd;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.reg;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.msi;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.htm;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*.html;*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\*';
  data_win_eventdata_targetObject matches '*\DefaultFileTypeRisk';
  data_win_eventdata_details equals 'DWORD (0x00006152)', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://support.microsoft.com/en-us/topic/information-about-the-attachment-manager-in-microsoft-windows-c48a4dcd-8de5-2af5-ee9b-cd795ae42738
  - https://www.virustotal.com/gui/file/2bcd5702a7565952c44075ac6fb946c7780526640d1264f692c7664c02c68465

response:
  message: >
    Potential Attachment Manager Settings Associations Tamper detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - attachment
    - manager
    - settings
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Aa][Ss][Ss][Oo][Cc][Ii][Aa][Tt][Ii][Oo][Nn][Ss]\\.*/ AND ((data_win_eventdata_targetObject:/.*\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ff][Ii][Ll][Ee][Tt][Yy][Pp][Ee][Rr][Ii][Ss][Kk]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00006152\)/) OR (data_win_eventdata_targetObject:/.*\\[Ll][Oo][Ww][Rr][Ii][Ss][Kk][Ff][Ii][Ll][Ee][Tt][Yy][Pp][Ee][Ss]/ AND (data_win_eventdata_details:/.*\.[Zz][Ii][Pp];.*/ OR data_win_eventdata_details:/.*\.[Rr][Aa][Rr];.*/ OR data_win_eventdata_details:/.*\.[Ee][Xx][Ee];.*/ OR data_win_eventdata_details:/.*\.[Bb][Aa][Tt];.*/ OR data_win_eventdata_details:/.*\.[Cc][Oo][Mm];.*/ OR data_win_eventdata_details:/.*\.[Cc][Mm][Dd];.*/ OR data_win_eventdata_details:/.*\.[Rr][Ee][Gg];.*/ OR data_win_eventdata_details:/.*\.[Mm][Ss][Ii];.*/ OR data_win_eventdata_details:/.*\.[Hh][Tt][Mm];.*/ OR data_win_eventdata_details:/.*\.[Hh][Tt][Mm][Ll];.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ee77a5db-b0f3-4be2-bfd4-b58be1c6b15a
    name: Potential Attachment Manager Settings Attachments Tamper
    reason: Same Attachment Manager policy family; actors usually weaken both Associations and Attachments (MotW/AV scan) together.
  - id: a5c7a43f-6009-4a8c-80c5-32abf1c53ecc
    name: Microsoft Office Protected View Disabled
    reason: Disabling Protected View is the sibling Office-side control weakening to let downloaded files run unwarned.
  - id: 91239011-fe3c-4b54-9f24-15c86bb65913
    name: Office Macros Warning Disabled
    reason: Macro warnings disabled is the common companion step lowering document-execution friction.
  - id: 3fd4c8d7-8362-4557-a8e6-83b29cc0d724
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols
    reason: IE ZoneMap downgrade is another zone-trust weakening to bypass download warnings.
  - id: 8d85cf08-bf97-4260-ba49-986a2a65129c
    name: Suspicious PowerShell In Registry Run Keys
    reason: Run key persistence commonly follows once risky file types no longer prompt.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Autorun key modification is the persistence step after payload execution without warnings.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Run keys and policy tampering on host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies\\(Attachments|Associations|System).*/)
    pivot_on: host
    window: 4h
  - name: Defender tamper commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/)
    pivot_on: host
    window: 4h
  - name: Office/script-launched shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(winword|excel|outlook|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|rundll32|regsvr32)\.exe/
    pivot_on: host
    window: 4h
  - name: Executables created in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(Downloads|AppData|Temp|Public)\\.*\.(exe|bat|cmd|msi|js|vbs|hta|scr|lnk)/
    pivot_on: host
    window: 4h
