name: Potential Ransomware Activity Using LegalNotice Message
id: 8b9606c9-28be-4a38-b146-0e313cc232c1
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8b9606c9-28be-4a38-b146-0e313cc232c1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect changes to the "LegalNoticeCaption" or "LegalNoticeText" registry
  values where the message set contains keywords often used in ransomware ransom
  messages. MITRE ATT&CK: T1491.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\LegalNoticeCaption*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\LegalNoticeText*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*encrypted*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*Unlock-Password*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*paying*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeCaption*';
  data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeText*';
  data_win_eventdata_details matches '*encrypted*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/5c1e6f1b4fafd01c8d1ece85f510160fc1275fbf/atomics/T1491.001/T1491.001.md
  - https://attack.mitre.org/techniques/T1491/001/

response:
  message: >
    Potential Ransomware Activity Using LegalNotice Message detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1491.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1491.001
  custom_tags:
    - ransomware
    - legalnotice
    - message
    - registry
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ll][Ee][Gg][Aa][Ll][Nn][Oo][Tt][Ii][Cc][Ee][Cc][Aa][Pp][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ll][Ee][Gg][Aa][Ll][Nn][Oo][Tt][Ii][Cc][Ee][Tt][Ee][Xx][Tt].*/) AND (data_win_eventdata_details:/.*[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ee][Dd].*/ OR data_win_eventdata_details:/.*[Uu][Nn][Ll][Oo][Cc][Kk]-[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_win_eventdata_details:/.*[Pp][Aa][Yy][Ii][Nn][Gg].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware wipes shadow copies shortly before or after announcing itself; confirms an encryption-stage intrusion on the same host.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup catalog destruction is a standard pre-encryption step that precedes the logon-banner ransom message.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Disabling recovery via bcdedit is paired with ransom messaging to block victim restore.
  - id: 83314318-052a-4c90-a1ad-660ece38d276
    name: Blackbyte Ransomware Registry
    reason: Ransomware registry-stage tampering on the same host; co-occurs in the impact phase.
  - id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
    name: Disabled Volume Snapshots
    reason: Turning off snapshots precedes encryption so files cannot be restored.
  - id: 919f2ef0-be2d-4a7a-b635-eb2b41fde044
    name: Disable Security Events Logging Adding Reg Key MiniNt
    reason: Operators blind logging before impact; precursor or follow-on on the same host.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defender is typically disabled before the payload runs; defense evasion preceding the ransom message.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy, backup and recovery destruction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Ransom note file creation
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Rr][Ee][Aa][Dd][Mm][Ee].*/ OR data_win_eventdata_targetFilename:/.*[Dd][Ee][Cc][Rr][Yy][Pp][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Ss][Tt][Oo][Rr][Ee]-[Mm][Yy]-[Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Hh][Oo][Ww]_[Tt][Oo]_[Rr][Ee][Cc][Oo][Vv][Ee][Rr].*/ OR data_win_eventdata_targetFilename:/.*[Rr][Aa][Nn][Ss][Oo][Mm].*/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr]-[Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Ll][Oo][Cc][Kk][Ee][Dd].*/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ee][Dd].*/)
    pivot_on: host
    window: 2h
  - name: Other logon-banner or wallpaper policy changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ll][Ee][Gg][Aa][Ll][Nn][Oo][Tt][Ii][Cc][Ee][Cc][Aa][Pp][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ee][Gg][Aa][Ll][Nn][Oo][Tt][Ii][Cc][Ee][Tt][Ee][Xx][Tt].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Nn][Oo][Cc][Hh][Aa][Nn][Gg][Ii][Nn][Gg][Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Security tooling stopped or Defender disabled
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Autorun or service persistence of the ransomware binary
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/)
    pivot_on: host
    window: 24h
