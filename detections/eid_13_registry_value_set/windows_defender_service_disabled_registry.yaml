name: Windows Defender Service Disabled - Registry
id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: Ján Trenčanský, frack113, AlertIQ, Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker or tool disables the Windows Defender service
  (WinDefend) via the registry. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\WinDefend\\\\Start"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000004)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\WinDefend\Start'; data_win_eventdata_details equals 'DWORD
  (0x00000004)'.

known_false_positives: >
  Administrator actions. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
  - https://gist.github.com/anadr/7465a9fde63d41341136949f14c21105
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Service Disabled - Registry detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - service
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]\\[Ss][Tt][Aa][Rr][Tt]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000004\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Same actor typically disables further Defender features via registry.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection must be defeated before the WinDefend Start value can be changed.
  - id: Windows_DisableAntiSpyware_Registry
    name: Windows DisableAntiSpyware Registry
    reason: Companion policy key set to switch Defender off wholesale.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Operational-log confirmation that protection stopped.
  - id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
    name: Disabled Windows Defender Eventlog
    reason: Attackers also silence Defender logging to hide the disablement.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: 'Parallel evasion: exclusions added alongside disabling the service.'
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Command-line disablement from the same intrusion.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Ransomware pattern: defences off, then backups destroyed before encryption.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender disable via service control / cmdline
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sc(\.exe)?\s+(config|stop)\s+(WinDefend|Sense|WdFilter|WdBoot|WdNisSvc)|Set-MpPreference|DisableRealtimeMonitoring|net\s+stop\s+WinDefend).*/
    pivot_on: host
    window: 6h
  - name: Defender and security-service registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Services.(WinDefend|WdFilter|WdBoot|Sense|WdNisSvc|SecurityHealthService)|Windows Defender|Windows Advanced Threat Protection).*/
    pivot_on: host
    window: 6h
  - name: Defender and Security Center disabled events
    query: data_win_system_eventID:(5001 OR 5010 OR 5012 OR 7036 OR 7040)
    pivot_on: host
    window: 6h
  - name: Backup and recovery inhibition
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|wbadmin.*delete|bcdedit.*(recoveryenabled|ignoreallfailures)|wmic.*shadowcopy.*delete).*/
    pivot_on: host
    window: 6h
  - name: Safe-mode boot or forced restart
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(bcdedit.*safeboot|shutdown(\.exe)?\s+.*\/r).*/
    pivot_on: host
    window: 6h
