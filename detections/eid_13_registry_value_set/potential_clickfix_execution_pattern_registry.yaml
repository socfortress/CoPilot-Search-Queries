description: >
  Detects potential ClickFix malware execution patterns by monitoring registry
  modifications in RunMRU keys containing HTTP/HTTPS links. ClickFix is known to
  be distributed through phishing campaigns and uses techniques like clipboard
  hijacking and fake CAPTCHA pages. Through the fakecaptcha pages, the adversary
  tricks users into opening the Run dialog box and pasting clipboard-hijacked
  content, such as one-liners that execute remotely hosted malicious files or
  scripts. MITRE ATT&CK: T1204.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\RunMRU\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*http://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*https://*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
