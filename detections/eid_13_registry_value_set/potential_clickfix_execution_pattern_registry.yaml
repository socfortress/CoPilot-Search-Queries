graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn][Mm][Rr][Uu]\\.*/ AND (data_win_eventdata_details:/.*[Hh][Tt][Tt][Pp]:\/\/.*/ OR data_win_eventdata_details:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/.*/) AND (data_win_eventdata_details:/.*[Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_details:/.*[Aa][Nn][Tt][Ii]-[Bb][Oo][Tt].*/ OR data_win_eventdata_details:/.*[Bb][Oo][Tt][Cc][Hh][Ee][Cc][Kk].*/ OR data_win_eventdata_details:/.*[Cc][Aa][Pp][Tt][Cc][Hh][Aa].*/ OR data_win_eventdata_details:/.*[Cc][Hh][Aa][Ll][Ll][Ee][Nn][Gg][Ee].*/ OR data_win_eventdata_details:/.*[Cc][Oo][Nn][Ff][Ii][Rr][Mm][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_details:/.*[Ff][Rr][Aa][Uu][Dd].*/ OR data_win_eventdata_details:/.*[Hh][Uu][Mm][Aa][Nn].*/ OR data_win_eventdata_details:/.*[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_details:/.*[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Oo][Rr].*/ OR data_win_eventdata_details:/.*[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy].*/ OR data_win_eventdata_details:/.*[Rr][Oo][Bb][Oo][Tt].*/ OR data_win_eventdata_details:/.*[Vv][Aa][Ll][Ii][Dd][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_details:/.*[Vv][Ee][Rr][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_details:/.*[Vv][Ee][Rr][Ii][Ff][Yy].*/ OR data_win_eventdata_details:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/ OR data_win_eventdata_details:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_details:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_details:/.*[Cc][Mm][Dd].*/ OR data_win_eventdata_details:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_details:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_details:/.*[Ff][Ii][Nn][Gg][Ee][Rr].*/ OR data_win_eventdata_details:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_details:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_details:/.*[Pp][Ww][Ss][Hh].*/ OR data_win_eventdata_details:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR data_win_eventdata_details:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_details:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_details:/.*[Ww][Gg][Ee][Tt].*/ OR data_win_eventdata_details:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d487ed4a-fd24-436d-a0b2-f4e95f7b2635
    name: Suspicious ClickFix/FileFix Execution Pattern
    reason: Process-creation view of the same ClickFix/FileFix paste-and-run; shows what the pasted command launched.
  - id: d81d4d3d-76b5-4f21-ab51-b17d5164c106
    name: Windows PowerShell FakeCAPTCHA Clipboard Execution
    reason: FakeCAPTCHA clipboard PowerShell execution is the direct follow-on of the RunMRU paste.
  - id: 7a1b4c5e-8f3d-4b9a-7c2e-1f4a5b8c6d9e
    name: Suspicious Space Characters in RunMRU Registry Path - ClickFix
    reason: Whitespace-padded RunMRU entry is a ClickFix variant hiding the command in the Run dialog.
  - id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
    name: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
    reason: Whitespace-padded explorer launch is the FileFix address-bar variant of the same lure.
  - id: c11aecef-9c37-45a6-9c07-bc0782f963fd
    name: RunMRU Registry Key Deletion
    reason: RunMRU deletion is the attacker cleanup of this exact artifact after execution.
  - id: af491bca-e752-4b44-9c86-df5680533dbc
    name: Finger.EXE Execution
    reason: finger.exe fetching payloads is a ClickFix command currently abused.
  - id: a0873b32-5b68-11eb-ae93-0242ac130002
    name: Detect mshta inline hta execution
    reason: Inline mshta execution is a common ClickFix payload launcher.
  - id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
    name: PowerShell Download Pattern
    reason: PowerShell download pattern is the typical stage-two fetch after the pasted command.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Run-dialog launched processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\explorer\.exe/ AND data_win_eventdata_image:/.*(powershell|pwsh|cmd|mshta|rundll32|regsvr32|curl|wscript|cscript|msiexec|bitsadmin|certutil)\.exe/
    pivot_on: host
    window: 2h
  - name: Download-and-execute command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*(iwr|irm|Invoke-WebRequest|Invoke-RestMethod|DownloadString|DownloadFile).*/ OR data_win_eventdata_commandLine:/.*(curl|bitsadmin|certutil).*(http|urlcache).*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(powershell|pwsh|mshta|wscript|cscript|rundll32|msiexec)\.exe/
    pivot_on: host
    window: 2h
  - name: DNS lookups by script hosts
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*(powershell|pwsh|mshta|curl|wscript|cscript)\.exe/
    pivot_on: host
    window: 2h
  - name: Persistence after paste
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ss]ervices\\.*/)
    pivot_on: host
    window: 2h
