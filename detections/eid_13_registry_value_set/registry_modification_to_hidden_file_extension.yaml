name: Registry Modification to Hidden File Extension
id: 5df86130-4e95-4a54-90f7-26541b40aec2
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5df86130-4e95-4a54-90f7-26541b40aec2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Hides the file extension through modification of the registry. MITRE ATT&CK:
  T1137.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\HideFileExt"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\Hidden"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000002)"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\HideFileExt';
  data_win_eventdata_details equals 'DWORD (0x00000001)';
  data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden', among
  other conditions.

known_false_positives: >
  Administrative scripts. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-1---modify-registry-of-current-user-profile---cmd
  - https://unit42.paloaltonetworks.com/ransomware-families/
  - https://www.microsoft.com/en-us/wdsi/threats/malware-encyclopedia-description?name=TrojanSpy%3aMSIL%2fHakey.A
  - https://attack.mitre.org/techniques/T1137/

response:
  message: >
    Registry Modification to Hidden File Extension detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1137
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137
  custom_tags:
    - registry
    - hidden
    - extension
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]\\[Hh][Ii][Dd][Ee][Ff][Ii][Ll][Ee][Ee][Xx][Tt]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/) OR (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]\\[Hh][Ii][Dd][Dd][Ee][Nn]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000002\)/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5a5152f1-463f-436b-b2f5-8eceb3964b42
    name: Displaying Hidden Files Feature Disabled
    reason: Disabling hidden-file display is the usual paired Explorer tweak that hides payloads along with extensions.
  - id: b4926b47-a9d7-434c-b3a0-adc3fa0bd13e
    name: Suspicious Double Extension Files
    reason: 'Hiding extensions makes double-extension lures (invoice.pdf.exe) deceptive: the file-creation side.'
  - id: 1cdd9a09-06c9-4769-99ff-626e2b3991b8
    name: Suspicious Double Extension File Execution
    reason: Execution of a double-extension file is the likely follow-on once extensions are hidden.
  - id: 5e6a80c8-2d45-4633-9ef4-fa2671a39c5c
    name: Suspicious Parent Double Extension File Execution
    reason: Double-extension parent processes confirm the lure being launched.
  - id: 3215aa19-f060-4332-86d5-5602511f3ca8
    name: Suspicious LNK Double Extension File Created
    reason: Double-extension LNK files are a common delivery paired with hidden extensions.
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: attrib.exe hiding files is the command-line counterpart of this concealment.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Run-key persistence often follows trojan/ransomware stealth tweaks.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Double-extension files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Dd][Ff]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Xx]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Pp][Gg]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Tt][Xx][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Dd][Ff]\.[Ss][Cc][Rr].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Dd][Ff]\.[Ll][Nn][Kk].*/)
    pivot_on: host
    window: 6h
  - name: Explorer Advanced view settings changed
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]\\.*/
    pivot_on: host
    window: 4h
  - name: attrib hiding files with hidden/system flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Aa][Tt][Tt][Rr][Ii][Bb]\.[Ee][Xx][Ee].*/ AND (data_win_eventdata_commandLine:/.* \+[Hh].*/ OR data_win_eventdata_commandLine:/.* \+[Ss].*/)
    pivot_on: host
    window: 4h
  - name: Command line writing HideFileExt
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Hh][Ii][Dd][Ee][Ff][Ii][Ll][Ee][Ee][Xx][Tt].*/
    pivot_on: host
    window: 2h
  - name: Executables launched from download or temp paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on: host
    window: 4h
