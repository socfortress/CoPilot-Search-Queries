name: Displaying Hidden Files Feature Disabled
id: 5a5152f1-463f-436b-b2f5-8eceb3964b42
version: 1
schema_version: "1.0"
date: "2024-03-26"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5a5152f1-463f-436b-b2f5-8eceb3964b42
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modifications to the "Hidden" and "ShowSuperHidden" explorer registry
  values in order to disable showing of hidden files and system files. This
  technique is abused by several malware families to hide their files from
  normal users. MITRE ATT&CK: T1564.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\ShowSuperHidden"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\Hidden"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowSuperHidden';
  data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden';
  data_win_eventdata_details equals 'DWORD (0x00000000)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.001/T1564.001.md#atomic-test-8---hide-files-through-registry
  - https://attack.mitre.org/techniques/T1564/001/

response:
  message: >
    Displaying Hidden Files Feature Disabled detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1564.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.001
  custom_tags:
    - displaying
    - hidden
    - feature
    - registry
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]\\[Ss][Hh][Oo][Ww][Ss][Uu][Pp][Ee][Rr][Hh][Ii][Dd][Dd][Ee][Nn]/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]\\[Hh][Ii][Dd][Dd][Ee][Nn]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5df86130-4e95-4a54-90f7-26541b40aec2
    name: Registry Modification to Hidden File Extension
    reason: Companion Explorer-setting tamper (HideFileExt) used by the same malware to disguise dropped files.
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: Attrib +h/+s hides the payload; this registry change ensures users cannot see it in Explorer.
  - id: 4281cb20-2994-4580-aa63-c8b86d019934
    name: Hiding Files with Attrib.exe
    reason: Same file-hiding behaviour at process level, often executed just before or after this setting.
  - id: efec536f-72e8-4656-8960-5e85d091345b
    name: Set Suspicious Files as System Files Using Attrib.EXE
    reason: Marking dropped files as system so ShowSuperHidden=0 conceals them.
  - id: b7916c2a-fa2f-4795-9477-32b731f70f11
    name: Registry Persistence via Explorer Run Key
    reason: Malware that hides its files also needs persistence; Explorer Run key is a common place.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Persistence pointing at the folder being hidden from the user.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Attrib used to hide files or folders
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Tt][Tt][Rr][Ii][Bb]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\+[HhSs].*/
    pivot_on:
    - host
    window: 2h
  - name: Autorun and Run key persistence writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(CurrentVersion\\[Rr]un|Winlogon\\[Ss]hell).*/
    pivot_on:
    - host
    window: 2h
  - name: Executables and scripts dropped to user-writable locations
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(AppData|ProgramData|Users\\Public|Temp).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Cc][Rr]|[Bb][Aa][Tt]|[Pp][Ss]1)/
    pivot_on:
    - host
    window: 2h
  - name: Explorer view and file-extension setting changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Explorer\\Advanced\\(HideFileExt|Hidden|ShowSuperHidden|SuperHidden).*/
    pivot_on:
    - host
    window: 2h
