name: Suspicious Space Characters in TypedPaths Registry Path - FileFix
id: 8f2a5c3d-9e4b-4a7c-8d1f-2e5a6b9c3d7e
version: 1
schema_version: "1.0"
date: "2025-11-04"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8f2a5c3d-9e4b-4a7c-8d1f-2e5a6b9c3d7e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the occurrence of numerous space characters in TypedPaths registry
  paths, which may indicate execution via phishing lures using file-fix
  techniques to hide malicious commands. MITRE ATT&CK: T1204.004, T1027.010.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\TypedPaths\\\\url1"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details: "*#*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
              - wildcard:
                  data_win_eventdata_details: "*            *"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\url1';
  data_win_eventdata_details matches '*#*'; data_win_eventdata_details matches
  '* *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://expel.com/blog/cache-smuggling-when-a-picture-isnt-a-thousand-words/
  - https://mrd0x.com/filefix-clickfix-alternative/
  - https://attack.mitre.org/techniques/T1204/004/
  - https://attack.mitre.org/techniques/T1027/010/

response:
  message: >
    Suspicious Space Characters in TypedPaths Registry Path - FileFix detected
    on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1204.004, T1027.010
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.004
    - T1027.010
  custom_tags:
    - space
    - characters
    - typedpaths
    - registry
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Tt][Yy][Pp][Ee][Dd][Pp][Aa][Tt][Hh][Ss]\\[Uu][Rr][Ll]1/ AND data_win_eventdata_details:/.*\#.*/ AND (data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/ OR data_win_eventdata_details:/.*            .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4fee3d51-8069-4a4c-a0f7-924fcaff2c70
    name: FileFix - Command Evidence in TypedPaths
    reason: Same FileFix TypedPaths key carrying command evidence
  - id: 086ae989-9ca6-4fe7-895a-759c5544f247
    name: Potential Persistence Via TypedPaths
    reason: Generic TypedPaths abuse of the same registry key
  - id: ec88289a-7e1a-4cc3-8d18-bd1f60e4b9ba
    name: Persistence Via TypedPaths - CommandLine
    reason: Command-line evidence of TypedPaths persistence/abuse
  - id: b5b29e4e-31fa-4fdf-b058-296e7a1aa0c2
    name: Suspicious FileFix Execution Pattern
    reason: Process-level FileFix execution following the registry write
  - id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
    name: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
    reason: Whitespace-padded Explorer process, ClickFix/FileFix execution trick
  - id: d487ed4a-fd24-436d-a0b2-f4e95f7b2635
    name: Suspicious ClickFix/FileFix Execution Pattern
    reason: ClickFix/FileFix execution pattern in process telemetry
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Explorer-launched interpreter or LOLBin (Run dialog / address bar execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Download cradle or encoded payload in command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ii][Ee][Xx]|[Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ss]tring|-[Ee]nc|[Ff]rom[Bb]ase64|[Cc]url.*http|[Mm]shta.*http|[Bb]itsadmin.*transfer).*/
    pivot_on:
    - host
    window: 1h
  - name: Outbound connection by script host or LOLBin
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Payload files dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\).*\.(exe|dll|ps1|hta|js|vbs|bat)/
    pivot_on:
    - host
    window: 1h
