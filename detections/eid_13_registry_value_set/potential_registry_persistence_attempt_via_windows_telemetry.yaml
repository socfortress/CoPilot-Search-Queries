name: Potential Registry Persistence Attempt Via Windows Telemetry
id: 73a883d0-0348-4be4-a8d8-51031c2564f8
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Lednyov Alexey, oscd.community, Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 73a883d0-0348-4be4-a8d8-51031c2564f8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential persistence behavior using the windows telemetry registry
  key. Windows telemetry makes use of the binary CompatTelRunner.exe to run a
  variety of commands and perform the actual telemetry collections. This binary
  was created to be easily extensible, and to that end, it relies on the
  registry to instruct on which commands to run. The problem is, it will run any
  arbitrary command without restriction of location or type. MITRE ATT&CK:
  T1053.005.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\AppCompatFlags\\\\TelemetryController\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Command"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.bat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.bin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.cmd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.dat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.hta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.jar*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.js*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.msi*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.ps*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.sh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*.vb*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*\\\\system32\\\\CompatTelRunner.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*\\\\system32\\\\DeviceCensus.exe*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows
  NT\CurrentVersion\AppCompatFlags\TelemetryController\*';
  data_win_eventdata_targetObject matches '*\Command';
  data_win_eventdata_details matches '*.bat*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trustedsec.com/blog/abusing-windows-telemetry-for-persistence/
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Potential Registry Persistence Attempt Via Windows Telemetry detected on
    host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - registry
    - persistence
    - telemetry
    - sysmon
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Tt][Ee][Ll][Ee][Mm][Ee][Tt][Rr][Yy][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]/ AND (data_win_eventdata_details:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_details:/.*\.[Bb][Ii][Nn].*/ OR data_win_eventdata_details:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_details:/.*\.[Dd][Aa][Tt].*/ OR data_win_eventdata_details:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_details:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_details:/.*\.[Hh][Tt][Aa].*/ OR data_win_eventdata_details:/.*\.[Jj][Aa][Rr].*/ OR data_win_eventdata_details:/.*\.[Jj][Ss].*/ OR data_win_eventdata_details:/.*\.[Mm][Ss][Ii].*/ OR data_win_eventdata_details:/.*\.[Pp][Ss].*/ OR data_win_eventdata_details:/.*\.[Ss][Hh].*/ OR data_win_eventdata_details:/.*\.[Vv][Bb].*/) AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Mm][Pp][Aa][Tt][Tt][Ee][Ll][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_details:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ee][Vv][Ii][Cc][Ee][Cc][Ee][Nn][Ss][Uu][Ss]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f548a603-c9f2-4c89-b511-b089f7e94549
    name: Potential Persistence Via Microsoft Compatibility Appraiser
    reason: 'Process-creation view of the same abuse: CompatTelRunner launching the planted command.'
  - id: windows-compattelrunner-suspicious-child-001
    name: Windows Compatibility Telemetry Suspicious Child Process
    reason: 'Follow-on: the telemetry runner spawns the attacker command once the registry value fires.'
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Operators typically plant more than one persistence mechanism.
  - id: b86852fb-4c77-48f9-8519-eb1b2c308b59
    name: Potential Persistence Via AppCompat RegisterAppRestart Layer
    reason: Neighbouring AppCompat-based persistence abuse by similar tradecraft.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Same reg.exe registry write mechanism for a second persistence location.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CompatTelRunner executing and its children
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Oo][Mm][Pp][Aa][Tt][Tt][Ee][Ll][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Mm][Pp][Aa][Tt][Tt][Ee][Ll][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 24h
  - name: TelemetryController registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Tt][Ee][Ll][Ee][Mm][Ee][Tt][Rr][Yy][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr].*/
    pivot_on: host
    window: 24h
  - name: Payload dropped in user-writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 6h
  - name: Reg.exe or PowerShell setting TelemetryController
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/) AND (data_win_eventdata_commandLine:/.*[Tt][Ee][Ll][Ee][Mm][Ee][Tt][Rr][Yy][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss].*/)
    pivot_on: host
    window: 6h
