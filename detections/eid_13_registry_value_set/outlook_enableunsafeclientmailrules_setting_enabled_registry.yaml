name: Outlook EnableUnsafeClientMailRules Setting Enabled - Registry
id: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an attacker trying to enable the outlook security setting
  "EnableUnsafeClientMailRules" which allows outlook to run applications or
  execute macros. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Outlook\\\\Security\\\\EnableUnsafeClientMailRules"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Outlook\Security\EnableUnsafeClientMailRules'; data_win_eventdata_details
  equals 'DWORD (0x00000001)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://support.microsoft.com/en-us/topic/how-to-control-the-rule-actions-to-start-an-application-or-run-a-macro-in-outlook-2016-and-outlook-2013-e4964b72-173c-959d-5d7b-ead562979048
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=44
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Outlook EnableUnsafeClientMailRules Setting Enabled - Registry detected on
    host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - outlook
    - enableunsafeclientmailrules
    - setting
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Ee][Nn][Aa][Bb][Ll][Ee][Uu][Nn][Ss][Aa][Ff][Ee][Cc][Ll][Ii][Ee][Nn][Tt][Mm][Aa][Ii][Ll][Rr][Uu][Ll][Ee][Ss]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 55f0a3a1-846e-40eb-8273-677371b8d912
    name: Outlook EnableUnsafeClientMailRules Setting Enabled
    reason: Process-creation variant of the same change (reg.exe/PowerShell); confirms the command used.
  - id: c3cefdf4-6703-4e1c-bad8-bf422fc5015a
    name: Outlook Security Settings Updated - Registry
    reason: Broader Outlook security-key tampering often set together with this value.
  - id: e3b50fa5-3c3f-444e-937b-0a99d33731cd
    name: Outlook Macro Execution Without Warning Setting Enabled
    reason: Companion Outlook downgrade enabling unprompted macros.
  - id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
    name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
    reason: Outlook VBA persistence in the same macro and mail-rule abuse chain.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Unsafe client rules let Outlook launch programs; a firing rule shows as Outlook spawning children.
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: Payload execution from the attachment cache following mail-rule abuse.
  - id: ddd171b5-2cc6-4975-9e78-f0eccd08cc76
    name: Potential Persistence Via Outlook Home Page
    reason: Another Outlook persistence mechanism used with rule abuse.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outlook spawning child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Other Outlook registry configuration changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\.*/
    pivot_on: host
    window: 4h
  - name: Outlook rule, macro and form files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Rr][Ww][Zz]|[Ss][Rr][Ss]|[Oo][Tt][Mm]|[Oo][Ff][Tt])/
    pivot_on: host
    window: 6h
  - name: Outlook outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
