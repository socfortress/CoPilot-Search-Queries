name: DNS-over-HTTPS Enabled by Registry
id: 04b45a8a-d11d-49e4-9acc-4a1b524407a5
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Austin Songer
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 04b45a8a-d11d-49e4-9acc-4a1b524407a5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a user enables DNS-over-HTTPS. This can be used to hide internet
  activity or be used to hide the process of exfiltrating data. With this
  enabled organization will lose visibility into data such as query type,
  response and originating IP that are used to determine bad actors. MITRE
  ATT&CK: T1140, T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Edge\\\\BuiltInDnsClientEnabled"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Google\\\\Chrome\\\\DnsOverHttpsMode"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "secure"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Policies\\\\Mozilla\\\\Firefox\\\\DNSOverHTTPS\\\\Enabled"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Policies\Microsoft\Edge\BuiltInDnsClientEnabled';
  data_win_eventdata_details equals 'DWORD (0x00000001)';
  data_win_eventdata_targetObject matches
  '*\SOFTWARE\Google\Chrome\DnsOverHttpsMode', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.tenforums.com/tutorials/151318-how-enable-disable-dns-over-https-doh-microsoft-edge.html
  - https://github.com/elastic/detection-rules/issues/1371
  - https://chromeenterprise.google/policies/?policy=DnsOverHttpsMode
  - https://admx.help/HKLM/Software/Policies/Mozilla/Firefox/DNSOverHTTPS
  - https://attack.mitre.org/techniques/T1140/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    DNS-over-HTTPS Enabled by Registry detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1140, T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1140
    - T1112
  custom_tags:
    - https
    - registry
    - sysmon
    - persistence
    - stealth
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Bb][Uu][Ii][Ll][Tt][Ii][Nn][Dd][Nn][Ss][Cc][Ll][Ii][Ee][Nn][Tt][Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/) OR (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Dd][Nn][Ss][Oo][Vv][Ee][Rr][Hh][Tt][Tt][Pp][Ss][Mm][Oo][Dd][Ee]/ AND data_win_eventdata_details:/[Ss][Ee][Cc][Uu][Rr][Ee]/) OR (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Dd][Nn][Ss][Oo][Vv][Ee][Rr][Hh][Tt][Tt][Pp][Ss]\\[Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c1486f5-02e8-4f86-9099-b97f2da4ed77
    name: Insecure Proxy/DOH Transfer Via Curl.EXE
    reason: 'Same DoH evasion at process level: curl with a DoH URL to hide C2 or exfil name resolution.'
  - id: a54f842a-3713-4b45-8c84-5f136fdebd3c
    name: New PortProxy Registry Entry Added
    reason: Another network-visibility evasion/tunnelling step often paired with DNS hiding.
  - id: 32410e29-5f94-4568-b6a3-d91a8adad863
    name: PUA - Fast Reverse Proxy (FRP) Execution
    reason: Tunnelling tool whose traffic is further masked once DNS lookups bypass the resolver.
  - id: Windows-Ngrok-Reverse-Proxy-Usage
    name: Windows Ngrok Reverse Proxy Usage
    reason: Reverse tunnel use that benefits from DoH hiding the tunnel domain.
  - id: e61e8a88-59a9-451c-874e-70fcc9740d67
    name: New DNS ServerLevelPluginDll Installed
    reason: Different DNS-layer tampering technique; confirms deliberate manipulation of name resolution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser and curl DoH configuration at process level
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd]ns[Oo]ver[Hh]ttps|[Dd]oh-url|[Bb]uilt[Ii]n[Dd]ns[Cc]lient|network\.trr|[Dd]ns-over-https).*/
    pivot_on:
    - host
    window: 4h
  - name: DNS lookups of public DoH resolvers
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*(dns\.google|cloudflare-dns|one\.one\.one\.one|dns\.quad9|dns\.nextdns).*/
    pivot_on:
    - host
    window: 4h
  - name: Tunnelling and proxy tools executed
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Nn]grok|[Ff]rpc|[Cc]hisel|[Pp]link|[Ss]tunnel|[Cc]loudflared).*/
    pivot_on:
    - host
    window: 4h
  - name: Netsh portproxy or WinHTTP proxy configuration changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn]etsh.*([Pp]ortproxy|[Ww]inhttp).*/
    pivot_on:
    - host
    window: 4h
