name: Internet Explorer DisableFirstRunCustomize Enabled
id: ab567429-1dfb-4674-b6d2-979fd2f9d125
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ab567429-1dfb-4674-b6d2-979fd2f9d125
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the Internet Explorer "DisableFirstRunCustomize" value,
  which prevents Internet Explorer from running the first run wizard the first
  time a user starts the browser after installing Internet Explorer or Windows.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Internet Explorer\\\\Main\\\\DisableFirstRunCustomize"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_details:
                    value: "DWORD (0x00000001)"
                    case_insensitive: true
              - term:
                  data_win_eventdata_details:
                    value: "DWORD (0x00000002)"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\explorer.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\ie4uinit.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Temp\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\.cr\\\\avira_*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*DWORD (0x00000001)*"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_image:
                                      value: "C:\\Program Files (x86)\\Foxit Software\\Foxit PDF Reader\\FoxitPDFReader.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_image:
                                      value: "C:\\Program Files\\Foxit Software\\Foxit PDF Reader\\FoxitPDFReader.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*DWORD (0x00000001)*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Internet Explorer\Main\DisableFirstRunCustomize';
  data_win_eventdata_details equals 'DWORD (0x00000001)';
  data_win_eventdata_details equals 'DWORD (0x00000002)', among other
  conditions.

known_false_positives: >
  As this is controlled by group policy as well as user settings. Some false
  positives may occur. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/devil-bait/NCSC-MAR-Devil-Bait.pdf
  - https://unit42.paloaltonetworks.com/operation-ke3chang-resurfaces-with-new-tidepool-malware/
  - https://admx.help/?Category=InternetExplorer&Policy=Microsoft.Policies.InternetExplorer::NoFirstRunCustomise

response:
  message: >
    Internet Explorer DisableFirstRunCustomize Enabled detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - internet
    - explorer
    - disablefirstruncustomize
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Mm][Aa][Ii][Nn]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ff][Ii][Rr][Ss][Tt][Rr][Uu][Nn][Cc][Uu][Ss][Tt][Oo][Mm][Ii][Zz][Ee]/ AND (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000002\)/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ii][Ee]4[Uu][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_details AND NOT ((data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_image:/.*\\\.[Cc][Rr]\\[Aa][Vv][Ii][Rr][Aa]_.*/ AND data_win_eventdata_details:/.*[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\).*/) OR ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ff][Oo][Xx][Ii][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ff][Oo][Xx][Ii][Tt] [Pp][Dd][Ff] [Rr][Ee][Aa][Dd][Ee][Rr]\\[Ff][Oo][Xx][Ii][Tt][Pp][Dd][Ff][Rr][Ee][Aa][Dd][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ff][Oo][Xx][Ii][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ff][Oo][Xx][Ii][Tt] [Pp][Dd][Ff] [Rr][Ee][Aa][Dd][Ee][Rr]\\[Ff][Oo][Xx][Ii][Tt][Pp][Dd][Ff][Rr][Ee][Aa][Dd][Ee][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_details:/.*[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\).*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fb50eb7a-5ab1-43ae-bcc9-091818cb8424
    name: Disabled IE Security Features
    reason: 'Same IE hardening-tamper family: command-line changes to IE security settings by the same process often accompany the DisableFirstRunCustomize flip.'
  - id: 10344bb3-7f65-46c2-b915-2d00d47be5b0
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols Via CLI
    reason: Another IE configuration weakening via CLI; together they suggest a script silently preparing IE for payload delivery.
  - id: windows-disable-ie-addons-extoff-001
    name: Windows Disable Internet Explorer Addons
    reason: IE launched with extensions off is a co-occurring IE-prep step in the same dropper chains.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Droppers that tweak IE first-run behaviour commonly also set persistence; confirms a malicious download source.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes under IE keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ii]nternet [Ee]xplorer\\.*/
    pivot_on: host
    window: 2h
  - name: CLI edits of IE settings
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ii]nternet [Ee]xplorer.*/ AND (data_win_eventdata_commandLine:/.*[Rr]eg.*[Aa]dd.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Ii]tem[Pp]roperty.*/)
    pivot_on: host
    window: 2h
  - name: Network connections from script hosts
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.exe/ OR data_win_eventdata_image:/.*\\[Ww][Ss]cript\.exe/ OR data_win_eventdata_image:/.*\\[Cc][Ss]cript\.exe/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.exe/)
    pivot_on: host
    window: 2h
  - name: Run-key persistence set on host
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/
    pivot_on: host
    window: 4h
