name: Suspicious Shim Database Patching Activity
id: bf344fea-d947-4ef4-9192-34d008315d3a
version: 1
schema_version: "1.0"
date: "2023-12-06"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bf344fea-d947-4ef4-9192-34d008315d3a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects installation of new shim databases that try to patch sections of known
  processes for potential process injection or persistence. MITRE ATT&CK:
  T1546.011.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\AppCompatFlags\\\\Custom\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\csrss.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\dllhost.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\explorer.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\RuntimeBroker.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\services.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\sihost.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\svchost.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\taskhostw.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\winlogon.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\WmiPrvSe.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\*';
  data_win_eventdata_targetObject matches '*\csrss.exe';
  data_win_eventdata_targetObject matches '*\dllhost.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/pillowmint-fin7s-monkey-thief/
  - https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html
  - https://attack.mitre.org/techniques/T1546/011/

response:
  message: >
    Suspicious Shim Database Patching Activity detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.011
  custom_tags:
    - database
    - patching
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Cc][Uu][Ss][Tt][Oo][Mm]\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Rr][Uu][Nn][Tt][Ii][Mm][Ee][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ii][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetObject:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 517490a7-115a-48c6-8862-1a481504d5a8
    name: Potential Shim Database Persistence via Sdbinst.EXE
    reason: sdbinst.exe is how a shim database gets registered; this is the usual precursor to the registry write.
  - id: 18ee686c-38a3-4f65-9f44-48a077141f42
    name: Uncommon Extension Shim Database Installation Via Sdbinst.EXE
    reason: sdbinst with an unusual database extension indicates disguised shim installation.
  - id: ee63c85c-6d51-4d12-ad09-04e25877a947
    name: New Custom Shim Database Created
    reason: The .sdb file created on disk just before registration.
  - id: 6b6976a3-b0e6-4723-ac24-ae38a737af41
    name: Potential Persistence Via Shim Database In Uncommon Location
    reason: Shim database registered from an uncommon path, same persistence mechanism.
  - id: dfb5b4e8-91d0-4291-b40a-e3b0d3942c45
    name: Potential Persistence Via Shim Database Modification
    reason: Broader shim database registry modification that this rule's targeted-process variant refines.
  - id: b86852fb-4c77-48f9-8519-eb1b2c308b59
    name: Potential Persistence Via AppCompat RegisterAppRestart Layer
    reason: Same AppCompatFlags\Custom key abused with a RegisterAppRestart layer for persistence.
  - id: b0524451-19af-4efa-a46f-562a977f792e
    name: ShimCache Flush
    reason: ShimCache flush hides execution traces and often accompanies shim use.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sdbinst shim database installation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: .sdb shim database files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Dd][Bb]/
    pivot_on:
    - host
    window: 6h
  - name: AppCompatFlags Custom and InstalledSDB registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Cc][Uu][Ss][Tt][Oo][Mm].*/ OR data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Dd][Ss][Dd][Bb].*/)
    pivot_on:
    - host
    window: 6h
  - name: Unsigned DLLs loaded into patched system processes
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Tt][Ii][Mm][Ee][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ii][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_signed:"false"
    pivot_on:
    - host
    window: 6h
  - name: Remote thread injection into system processes
    query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
