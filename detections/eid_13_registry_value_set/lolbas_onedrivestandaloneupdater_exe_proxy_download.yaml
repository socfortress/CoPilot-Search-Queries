name: Lolbas OneDriveStandaloneUpdater.exe Proxy Download
id: 3aff0be0-7802-4a7e-a4fa-c60c74bc5e1d
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3aff0be0-7802-4a7e-a4fa-c60c74bc5e1d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects setting a custom URL for OneDriveStandaloneUpdater.exe to download a
  file from the Internet without executing any anomalous executables with
  suspicious arguments. The downloaded file will be in
  C:\Users\redacted\AppData\Local\Microsoft\OneDrive\StandaloneUpdaterreSignInSettingsConfig.json.
  MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\OneDrive\\\\UpdateOfficeConfig\\\\UpdateRingSettingURLFromOC*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\OneDrive\UpdateOfficeConfig\UpdateRingSettingURLFromOC*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/OneDriveStandaloneUpdater/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Lolbas OneDriveStandaloneUpdater.exe Proxy Download detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - lolbas
    - onedrivestandaloneupdater
    - proxy
    - registry
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\\[Uu][Pp][Dd][Aa][Tt][Ee][Oo][Ff][Ff][Ii][Cc][Ee][Cc][Oo][Nn][Ff][Ii][Gg]\\[Uu][Pp][Dd][Aa][Tt][Ee][Rr][Ii][Nn][Gg][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Uu][Rr][Ll][Ff][Rr][Oo][Mm][Oo][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1908fcc1-1b92-4272-8214-0fbaf2fa5163
    name: Malicious DLL File Dropped in the Teams or OneDrive Folder
    reason: Downloaded content or side-loaded DLLs landing in the OneDrive folder is a likely follow-on.
  - id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
    name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
    reason: The updater fetches the attacker URL; cloud-hosted staging from a non-browser is a typical match.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: OneDriveStandaloneUpdater process activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Oo]ne[Dd]rive[Ss]tandalone[Uu]pdater\.exe/
    pivot_on: host
    window: 4h
  - name: OneDrive updater network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Oo]ne[Dd]rive[Ss]tandalone[Uu]pdater\.exe/
    pivot_on: host
    window: 4h
  - name: Files written in OneDrive AppData by non-OneDrive
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Mm]icrosoft\\[Oo]ne[Dd]rive\\.*/ AND NOT data_win_eventdata_image:/.*[Oo]ne[Dd]rive\.exe/
    pivot_on: host
    window: 4h
  - name: OneDrive UpdateOfficeConfig registry changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Oo]ne[Dd]rive\\[Uu]pdate[Oo]ffice[Cc]onfig.*/
    pivot_on: host
    window: 4h
