name: Bypass UAC Using DelegateExecute
id: 46dd5308-4572-4d12-aa43-8938f0184d4f
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 46dd5308-4572-4d12-aa43-8938f0184d4f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Bypasses User Account Control using a fileless method. MITRE ATT&CK:
  T1548.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\open\\\\command\\\\DelegateExecute"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "(Empty)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\open\command\DelegateExecute'; data_win_eventdata_details equals '(Empty)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/win32/api/shobjidl_core/nn-shobjidl_core-iexecutecommand
  - https://devblogs.microsoft.com/oldnewthing/20100312-01/?p=14623
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1548.002/T1548.002.md#atomic-test-7---bypass-uac-using-sdclt-delegateexecute
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Bypass UAC Using DelegateExecute detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - delegateexecute
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ee][Xx][Ee][Cc][Uu][Tt][Ee]/ AND data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Fodhelper is the auto-elevated binary that consumes the ms-settings DelegateExecute key; its child is the elevated payload.
  - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
    name: FodHelper UAC Bypass
    reason: Second fodhelper UAC-bypass detection on the execution side of the same registry hijack.
  - id: 3c05e90d-7eba-4324-9972-5d7f711a60a8
    name: UAC Bypass Tools Using ComputerDefaults
    reason: ComputerDefaults reads the same ms-settings handler key, the other common trigger.
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: Shell open command manipulation is the broader registry pattern this key belongs to.
  - id: 9df5f547-c86a-433e-b533-f2794357e242
    name: Classes Autorun Keys Modification
    reason: Classes autorun key modification covers the HKCU Software Classes hijack surface.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe/Akagi implements this and other bypass methods; its execution shows tooling.
  - id: 3268b746-88d8-4cd3-bffc-30077d02c787
    name: HackTool - Empire PowerShell UAC Bypass
    reason: Empire PowerShell UAC bypass writes this key from PowerShell.
  - id: d797268e-28a9-49a7-b9a8-2f5039011c5c
    name: Bypass UAC via WSReset.exe
    reason: WSReset is an alternative auto-elevated trigger for the same class of hijack.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Auto-elevating binaries spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ss][Dd][Cc][Ll][Tt]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ss][Ll][Uu][Ii]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]|[Cc][Mm][Ss][Tt][Pp]|[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Ii][Ee][Xx][Ee][Cc])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Other UAC-hijack handler keys written
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*_[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\([Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]|[Mm][Ss][Cc][Ff][Ii][Ll][Ee]|[Ee][Xx][Ee][Ff][Ii][Ll][Ee]|[Ff][Oo][Ll][Dd][Ee][Rr]|[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss])\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/
    pivot_on: host
    window: 1h
  - name: High-integrity process from user-writable parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_integrityLevel:"High" AND (data_win_eventdata_parentImage:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 2h
  - name: Post-elevation Defender tamper, persistence and account creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee]).*/
    pivot_on: host
    window: 4h
  - name: UAC policy weakened in registry
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Ll][Uu][Aa]/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt][Pp][Rr][Oo][Mm][Pp][Tt][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Aa][Dd][Mm][Ii][Nn]/ OR data_win_eventdata_targetObject:/.*[Ll][Oo][Cc][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Tt][Oo][Kk][Ee][Nn][Ff][Ii][Ll][Tt][Ee][Rr][Pp][Oo][Ll][Ii][Cc][Yy]/)
    pivot_on: host
    window: 4h
