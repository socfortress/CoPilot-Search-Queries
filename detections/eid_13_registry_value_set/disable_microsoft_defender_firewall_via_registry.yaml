name: Disable Microsoft Defender Firewall via Registry
id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may disable or modify system firewalls in order to bypass controls
  limiting network usage. MITRE ATT&CK: T1686.003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\SharedAccess\\\\Parameters\\\\FirewallPolicy\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\EnableFirewall"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\SharedAccess\Parameters\FirewallPolicy\*';
  data_win_eventdata_targetObject matches '*\EnableFirewall';
  data_win_eventdata_details equals 'DWORD (0x00000000)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.004/T1562.004.md#atomic-test-2---disable-microsoft-defender-firewall-via-registry
  - https://attack.mitre.org/techniques/T1686/003/

response:
  message: >
    Disable Microsoft Defender Firewall via Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1686.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1686.003
  custom_tags:
    - disable
    - microsoft
    - defender
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ss][Hh][Aa][Rr][Ee][Dd][Aa][Cc][Cc][Ee][Ss][Ss]\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Pp][Oo][Ll][Ii][Cc][Yy]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ee][Nn][Aa][Bb][Ll][Ee][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
    name: Disable Windows Firewall by Registry
    reason: Another registry-based firewall disable; shows whether other profiles or paths were switched off too.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: 'Disabling firewall with netsh: the command-line route to the same outcome, often run in parallel.'
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Netsh firewall disable confirms the actor used built-in tooling.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: 'Defender features disabled via registry: firewall off typically pairs with AV off in one defence-evasion script.'
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection disabled is the prerequisite for Defender-managed registry edits to stick.
  - id: windows-modify-registry-delete-firewall-rules-001
    name: Windows Modify Registry Delete Firewall Rules
    reason: Deleted firewall rules is the sibling way to open the host without disabling the profile.
  - id: 37b437cf-3fc5-4c8e-9c94-1d7c9aff842b
    name: Allow RDP Remote Assistance Feature
    reason: RDP/Remote Assistance enabled is the usual reason to open the firewall, giving the actor a way in.
  - id: a35f5a72-f347-4e36-8895-9869b0d5fc6d
    name: Suspicious Program Location Whitelisted In Firewall Via Netsh.EXE
    reason: 'Program whitelisted in the firewall from a suspicious location: the targeted-bypass alternative for an implant.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: netsh firewall changes and firewall service stops
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt][Ss][Hh].*([Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]|[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll])|[Ss][Tt][Oo][Pp].*[Mm][Pp][Ss][Ss][Vv][Cc]|[Ss][Cc].*[Cc][Oo][Nn][Ff][Ii][Gg].*[Mm][Pp][Ss][Ss][Vv][Cc]).*/
    pivot_on: host
    window: 2h
  - name: Remote access enabled in registry (RDP, remote assistance, token filter)
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(fDenyTSConnections|fAllowToGetHelp|UserAuthentication|LocalAccountTokenFilterPolicy|AllowUnencrypted).*/
    pivot_on: host
    window: 4h
  - name: Defender operational configuration changes
    query: data_win_system_eventID:(5001 OR 5007 OR 5010 OR 5012 OR 5013)
    pivot_on: host
    window: 4h
  - name: 'Lateral tooling: PsExec, remote WMIC, remote sc, admin shares'
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee]|[Nn][Ee][Tt] [Uu][Ss][Ee] .*[\$]).*/
    pivot_on: host
    window: 6h
  - name: Tools and scripts dropped after protection is down
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Jj][Ss]|[Vv][Bb][Ss])/
    pivot_on: host
    window: 4h
