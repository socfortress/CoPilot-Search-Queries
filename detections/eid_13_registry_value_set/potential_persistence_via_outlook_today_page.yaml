name: Potential Persistence Via Outlook Today Page
id: 487bb375-12ef-41f6-baae-c6a1572b4dd1
version: 1
schema_version: "1.0"
date: "2024-08-07"
author: Tobias Michalski (Nextron Systems), David Bertho (@dbertho) & Eirik Sveen (@0xSV1), Storebrand
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 487bb375-12ef-41f6-baae-c6a1572b4dd1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential persistence activity via outlook today page. An attacker can
  set a custom page to execute arbitrary code and link to it via the registry
  values "URL" and "UserDefinedUrl". MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Software\\\\Microsoft\\\\Office\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Outlook\\\\Today\\\\*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Stamp"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\URL"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\UserDefinedUrl"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\Updates\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\OfficeClickToRun.exe"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Software\Microsoft\Office\*'; data_win_eventdata_targetObject matches
  '*\Outlook\Today\*'; data_win_eventdata_targetObject matches '*\Stamp', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=74
  - https://trustedsec.com/blog/specula-turning-outlook-into-a-c2-with-one-registry-change
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Potential Persistence Via Outlook Today Page detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - persistence
    - outlook
    - today
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Tt][Oo][Dd][Aa][Yy]\\.*/ AND ((data_win_eventdata_targetObject:/.*\\[Ss][Tt][Aa][Mm][Pp]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/) OR data_win_eventdata_targetObject:/.*\\[Uu][Rr][Ll]/ OR data_win_eventdata_targetObject:/.*\\[Uu][Ss][Ee][Rr][Dd][Ee][Ff][Ii][Nn][Ee][Dd][Uu][Rr][Ll]/) AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Cc][Ll][Ii][Cc][Kk][Tt][Oo][Rr][Uu][Nn]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Cc][Ll][Ii][Cc][Kk][Tt][Oo][Rr][Uu][Nn]\\[Uu][Pp][Dd][Aa][Tt][Ee][Ss]\\.*/) AND data_win_eventdata_image:/.*\\[Oo][Ff][Ff][Ii][Cc][Ee][Cc][Ll][Ii][Cc][Kk][Tt][Oo][Rr][Uu][Nn]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ddd171b5-2cc6-4975-9e78-f0eccd08cc76
    name: Potential Persistence Via Outlook Home Page
    reason: Sibling Outlook persistence via folder home page URL, same technique family and often co-deployed.
  - id: c3edc6a5-d9d4-48d8-930e-aab518390917
    name: Potential Persistence Via Outlook Form
    reason: Another Outlook-hosted code execution persistence an attacker may plant together with Today page.
  - id: fedb49c4-4bd7-4d42-8fd9-f8c8538c73c4
    name: Windows InProcServer32 New Outlook Form
    reason: Custom Outlook form registration, an alternate persistence in the same profile.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: 'Execution result: the Today page script runs in Outlook and may spawn script hosts.'
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: Payload staging/execution from Outlook temp content following a malicious page.
  - id: e212d415-0e93-435f-9e1a-f29005bb4723
    name: Suspicious Remote Child Process From Outlook
    reason: Outlook launching remote content, as the custom Today page URL often points remotely.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outlook Today registry values
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Oo]utlook\\[Tt]oday.*/
    pivot_on: host
    window: 24h
  - name: Outlook child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Outlook outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
  - name: HTML/HTA files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.([Hh][Tt][Mm][Ll]?|[Hh][Tt][Aa])/
    pivot_on: host
    window: 6h
