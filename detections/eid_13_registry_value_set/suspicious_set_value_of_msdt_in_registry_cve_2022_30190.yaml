name: Suspicious Set Value of MSDT in Registry (CVE-2022-30190)
id: 2d9403d5-7927-46b7-8216-37ab7c9ec5e3
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Sittikorn S
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2d9403d5-7927-46b7-8216-37ab7c9ec5e3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects set value ms-msdt MSProtocol URI scheme in Registry that could be an
  attempt to exploit CVE-2022-30190. MITRE ATT&CK: T1221.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "HKCR\\\\ms-msdt\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  'HKCR\ms-msdt\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2022-30190
  - https://msrc-blog.microsoft.com/2022/05/30/guidance-for-cve-2022-30190-microsoft-support-diagnostic-tool-vulnerability/
  - https://attack.mitre.org/techniques/T1221/

response:
  message: >
    Suspicious Set Value of MSDT in Registry (CVE-2022-30190) detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1221
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1221
  custom_tags:
    - value
    - registry
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/[Hh][Kk][Cc][Rr]\\[Mm][Ss]-[Mm][Ss][Dd][Tt]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Follina starts from an Office document; Office spawning msdt or shells is the exploit execution.
  - id: 7a74da6b-ea76-47db-92cc-874ad90df734
    name: Suspicious MSDT Parent Process
    reason: msdt.exe launched by an unusual parent such as Office or a browser is the Follina trigger itself.
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: msdt.exe launched with an arbitrary command or IT_BrowseForFile argument is the code-execution step.
  - id: e1d5145f-38fe-42b9-a5d5-457796715f97
    name: Windows Execute Arbitrary Commands with MSDT
    reason: Another view of msdt being abused to run commands, confirms exploitation rather than handler fiddling.
  - id: 6004abd0-afa4-4557-ba90-49d172e0a299
    name: Execute Pcwrun.EXE To Leverage Follina
    reason: Pcwrun.exe is the other Follina launcher variant that leads to the same msdt diagnostic payload.
  - id: 318557a5-150c-4c8d-b70e-a9910e199857
    name: File Creation In Suspicious Directory By Msdt.EXE
    reason: Payload files dropped by msdt in suspicious directories follow successful exploitation.
  - id: ec8c4047-fad9-416a-8c81-0f479353d7f6
    name: Diagnostic Library Sdiageng.DLL Loaded By Msdt.EXE
    reason: sdiageng.dll loaded by msdt shows the diagnostic engine actually ran the attacker script.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office and browser processes spawning msdt or script hosts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Cc][Ww][Rr][Uu][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: sdiagnhost or msdt spawning children (Follina payload execution)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: msdt invoked with script-bearing arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Pp][Cc][Ww][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ii][Tt]_[Bb][Rr][Oo][Ww][Ss][Ee][Ff][Oo][Rr][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Tt]_[Rr][Ee][Bb][Rr][Oo][Ww][Ss][Ee][Ff][Oo][Rr][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss]-[Mm][Ss][Dd][Tt]:.*/)
    pivot_on:
    - host
    window: 2h
  - name: Office or msdt initiating network connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Other protocol handler and file association registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Hh][Kk][Cc][Rr]\\.*\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*[Hh][Kk][Cc][Rr]\\[Uu][Rr][Ll]\\.*.*/)
    pivot_on:
    - host
    window: 2h
