name: Windows Modify Registry DisableRemoteDesktopAntiAlias
id: windows-modify-registry-disable-rdp-antialias-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of DisableRemoteDesktopAntiAlias registry value to 1 
  under Terminal Server settings. DarkGate malware alters this setting to 
  enhance its remote desktop capabilities by disabling font smoothing during 
  RDP sessions, reducing bandwidth and improving performance for the attacker.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Terminal Server\\DisableRemoteDesktopAntiAlias"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Terminal Server registry paths. Add Control\Terminal Server\Disable to 
  Sysmon EventID 13 TargetObject rules if not already present.

known_false_positives: >
  Administrators may configure RDP settings for performance optimization. 
  Uncommon setting — investigate process and user context.

references:
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.darkgate
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    RDP anti-aliasing disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Possible DarkGate malware. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - terminal_server
    - rdp_antialias
    - darkgate
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Terminal Server.*DisableRemoteDesktopAntiAlias/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: DarkGate creates a user via net.exe, typically around when remote access is tuned.
  - id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
    name: DarkGate - Autoit3.EXE Execution Parameters
    reason: DarkGate AutoIt3 execution is the loader stage preceding this tuning.
  - id: 1a433e1d-03d2-47a6-8063-ece992cf4e73
    name: DarkGate - Autoit3.EXE File Creation By Uncommon Process
    reason: Autoit3.exe dropped by an uncommon process marks DarkGate staging on the host.
  - id: df49c691-8026-48dd-94d3-4ba6a79102a8
    name: DarkGate - Drop DarkGate Loader In C:\Temp Directory
    reason: DarkGate loader dropped in C:\Temp is an earlier-stage artefact.
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: RDP sensitive setting changes are the same operator preparing RDP for hands-on use.
  - id: a2863fbc-d5cb-48d5-83fb-d976d4b1743b
    name: RDP Sensitive Settings Changed to Zero
    reason: RDP setting set to zero, such as fDenyTSConnections, enables inbound RDP in the same session.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: reg.exe edits of RDP keys show the command-line route to the same change.
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: A new local admin account is what the attacker then logs in with over RDP.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Terminal Server and RDP registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(Terminal Server|TermService|WinStations).*/
    pivot_on: host
    window: 6h
  - name: Local account creation or admin group add
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*net1?(\.exe)? +(user|localgroup).*\/add.*/
    pivot_on: host
    window: 6h
  - name: RDP firewall opening and port forwarding
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*netsh.*(portproxy|3389|Remote Desktop|portopening).*/
    pivot_on: host
    window: 6h
  - name: AutoIt and script loader execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Aa]utoit3.*\.exe/ OR data_win_eventdata_commandLine:/.*\.au3.*/)
    pivot_on: host
    window: 6h
  - name: Inbound RDP network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389" AND data_win_eventdata_initiated:"false"
    pivot_on: host
    window: 6h
