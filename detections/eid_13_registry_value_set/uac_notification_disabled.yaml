name: UAC Notification Disabled
id: c5f6a85d-b647-40f7-bbad-c10b66bab038
version: 1
schema_version: "1.0"
date: "2024-05-10"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c5f6a85d-b647-40f7-bbad-c10b66bab038
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker tries to disable User Account Control (UAC)
  notification by tampering with the "UACDisableNotify" value. UAC is a critical
  security feature in Windows that prevents unauthorized changes to the
  operating system. It prompts the user for permission or an administrator
  password before allowing actions that could affect the system's operation or
  change settings that affect other users. When "UACDisableNotify" is set to 1,
  UAC prompts are suppressed. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Security Center\\\\UACDisableNotify*"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Security Center\UACDisableNotify*'; data_win_eventdata_details
  equals 'DWORD (0x00000001)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/7e11e9b79583545f208a6dc3fa062f2ed443d999/atomics/T1548.002/T1548.002.md
  - https://securityintelligence.com/x-force/x-force-hive0129-targeting-financial-institutions-latam-banking-trojan/
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Notification Disabled detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1548.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - notification
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Cc][Ee][Nn][Tt][Ee][Rr]\\[Uu][Aa][Cc][Dd][Ii][Ss][Aa][Bb][Ll][Ee][Nn][Oo][Tt][Ii][Ff][Yy].*/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 48437c39-9e5f-47fb-af95-3d663c3f2919
    name: UAC Disabled
    reason: EnableLUA=0 is the blunt way to kill UAC; attackers often pair it with other UAC-weakening values.
  - id: 0d7ceeef-3539-4392-8953-3dc664912714
    name: UAC Secure Desktop Prompt Disabled
    reason: Sibling UAC-weakening change; PromptOnSecureDesktop=0 exposes prompts to the user desktop.
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: 'Follow-on defense evasion: silencing Security Center warnings after weakening protections.'
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Once privileged, attackers commonly turn off Defender via registry.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Elevated actors disable Tamper Protection before modifying Defender.
  - id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
    name: Disable Windows Firewall by Registry
    reason: Further defense impairment typically following privilege elevation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Security Center notify registry
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*([Ss]ecurity [Cc]enter|UACDisableNotify|AntiVirusDisableNotify|FirewallDisableNotify|UpdatesDisableNotify).*/
    pivot_on: host
    window: 4h
  - name: Policies\System UAC values
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*Policies.System.*(EnableLUA|ConsentPromptBehavior|PromptOnSecureDesktop).*/
    pivot_on: host
    window: 4h
  - name: Command lines touching notify/UAC values
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(UACDisableNotify|DisableNotify|EnableLUA).*/
    pivot_on: host
    window: 4h
  - name: Defender disable via PowerShell/registry
    query: data_win_system_eventID:(1 OR 13) AND (data_win_eventdata_commandLine:/.*(Set-MpPreference|DisableRealtimeMonitoring).*/ OR data_win_eventdata_targetObject:/.*(DisableAntiSpyware|DisableRealtimeMonitoring).*/)
    pivot_on: host
    window: 4h
