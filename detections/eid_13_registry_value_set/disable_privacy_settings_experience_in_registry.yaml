name: Disable Privacy Settings Experience in Registry
id: 0372e1f9-0fd2-40f7-be1b-a7b2b848fa7b
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0372e1f9-0fd2-40f7-be1b-a7b2b848fa7b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry modifications that disable Privacy Settings Experience. MITRE
  ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\OOBE\\\\DisablePrivacyExperience"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Policies\Microsoft\Windows\OOBE\DisablePrivacyExperience';
  data_win_eventdata_details equals 'DWORD (0x00000000)'.

known_false_positives: >
  Legitimate admin script. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/9e5b12c4912c07562aec7500447b11fa3e17e254/atomics/T1562.001/T1562.001.md
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Disable Privacy Settings Experience in Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - disable
    - privacy
    - settings
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Oo][Oo][Bb][Ee]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Pp][Rr][Ii][Vv][Aa][Cc][Yy][Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
    name: Disable Windows Security Center Notifications
    reason: Security Center notification disabling is the other quiet-the-user tweak seen in the same post-compromise or debloat scripts.
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: Suppression of Security Center notifications shares the same intent of hiding prompts from the user.
  - id: e2482f8d-3443-4237-b906-cc145d87a076
    name: Disable Internal Tools or Feature in Registry
    reason: 'Internal tools disabled via registry: the same Policies-hive tampering family, more harmful.'
  - id: 1c3121ed-041b-4d97-a075-07f54f20fb4a
    name: Registry Explorer Policy Modification
    reason: Explorer policy modification is the same Policies-hive editing pattern.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: If the same script disables Defender, this elevates a benign-looking tweak to defence evasion.
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: Registry tampering by suspicious writer processes helps tell admin scripts from malware.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Policies-hive writes under Microsoft
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\.*/
    pivot_on: host
    window: 4h
  - name: reg.exe adding policy or security values
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*(Windows Defender|Policies|FirewallPolicy|Security).*/
    pivot_on: host
    window: 2h
  - name: Defender, firewall or Security Center values set to 0 or 1
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(Windows Defender|Windows Advanced Threat Protection|SharedAccess\\Parameters\\FirewallPolicy|Security Center).*/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]0000000[01]\)/
    pivot_on: host
    window: 4h
  - name: Script hosts running from user-writable paths or encoded
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|-[Ee][Nn][Cc]).*/
    pivot_on: host
    window: 2h
  - name: Persistence Run keys set on the host
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]([Oo][Nn][Cc][Ee])?\\.*/
    pivot_on: host
    window: 4h
