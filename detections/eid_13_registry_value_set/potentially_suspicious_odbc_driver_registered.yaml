name: Potentially Suspicious ODBC Driver Registered
id: e4d22291-f3d5-4b78-9a0c-a1fbaf32a6a4
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e4d22291-f3d5-4b78-9a0c-a1fbaf32a6a4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the registration of a new ODBC driver where the driver is located in a
  potentially suspicious location. MITRE ATT&CK: T1003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\ODBC\\\\ODBCINST.INI\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Driver"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Setup"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\Registration\\\\CRMLog*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\System32\\\\com\\\\dmp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\System32\\\\FxsTmp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\System32\\\\Microsoft\\\\Crypto\\\\RSA\\\\MachineKeys\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\System32\\\\spool\\\\drivers\\\\color\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\System32\\\\spool\\\\PRINTERS\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\System32\\\\spool\\\\SERVERS\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\System32\\\\Tasks_Migrated\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\System32\\\\Tasks\\\\Microsoft\\\\Windows\\\\SyncCenter\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\SysWOW64\\\\com\\\\dmp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\SysWOW64\\\\FxsTmp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\SysWOW64\\\\Tasks\\\\Microsoft\\\\Windows\\\\PLA\\\\System\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\SysWOW64\\\\Tasks\\\\Microsoft\\\\Windows\\\\SyncCenter\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\Tasks\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\Tracing\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\ODBC\ODBCINST.INI\*'; data_win_eventdata_targetObject matches
  '*\Driver'; data_win_eventdata_targetObject matches '*\Setup', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Potentially Suspicious ODBC Driver Registered detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - driver
    - registered
    - registry
    - sysmon
    - credential_access
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Dd][Bb][Cc]\\[Oo][Dd][Bb][Cc][Ii][Nn][Ss][Tt]\.[Ii][Nn][Ii]\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Dd][Rr][Ii][Vv][Ee][Rr]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Tt][Uu][Pp]/) AND (data_win_eventdata_details:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_details:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Aa][Tt][Ii][Oo][Nn]\\[Cc][Rr][Mm][Ll][Oo][Gg].*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Mm]\\[Dd][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ff][Xx][Ss][Tt][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Cc][Rr][Yy][Pp][Tt][Oo]\\[Rr][Ss][Aa]\\[Mm][Aa][Cc][Hh][Ii][Nn][Ee][Kk][Ee][Yy][Ss]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Cc][Oo][Ll][Oo][Rr]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll]\\[Ss][Ee][Rr][Vv][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]_[Mm][Ii][Gg][Rr][Aa][Tt][Ee][Dd]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Nn][Cc][Cc][Ee][Nn][Tt][Ee][Rr]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Cc][Oo][Mm]\\[Dd][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ff][Xx][Ss][Tt][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Tt][Aa][Ss][Kk][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ll][Aa]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Tt][Aa][Ss][Kk][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Nn][Cc][Cc][Ee][Nn][Tt][Ee][Rr]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Rr][Aa][Cc][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3f5491e2-8db8-496b-9e95-1029fce852d4
    name: Driver/DLL Installation Via Odbcconf.EXE
    reason: odbcconf.exe /A {INSTALLDRIVER} is the usual way the driver key is written
  - id: 9f0a8bf3-a65b-440a-8c1e-5cb1547c8e70
    name: New DLL Registered Via Odbcconf.EXE
    reason: odbcconf REGSVR registers a new DLL, a closely related LOLBin route
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: odbcconf pointed at a DLL in a suspicious location matches the registry paths
  - id: cb0fe7c5-f3a3-484d-aa25-d350a7912729
    name: Suspicious Driver/DLL Installation Via Odbcconf.EXE
    reason: Suspicious driver/DLL install via odbcconf is the process-side twin
  - id: 2d32dd6f-3196-4093-b9eb-1ad8ab088ca5
    name: Suspicious Response File Execution Via Odbcconf.EXE
    reason: odbcconf response file execution is another way to load attacker DLLs
  - id: 8e3c7994-131e-4ba5-b6ea-804d49113a26
    name: Uncommon Child Process Spawned By Odbcconf.EXE
    reason: Uncommon children of odbcconf show post-load execution
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: odbcconf usage
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff].[Ee][Xx][Ee].*/ OR data_win_eventdata_originalFileName:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff].[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 2h
  - name: DLL created in staging dirs
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_targetFilename:/.*[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss].*/) AND data_win_eventdata_targetFilename:/.*.[Dd][Ll][Ll].*/
    pivot_on: host
    window: 2h
  - name: DLL loaded from staging dirs
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_imageLoaded:/.*[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_imageLoaded:/.*[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss].*/) AND data_win_eventdata_imageLoaded:/.*.[Dd][Ll][Ll].*/
    pivot_on: host
    window: 2h
  - name: rundll32/regsvr32 on staged DLLs
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/)
    pivot_on: host
    window: 2h
  - name: Other ODBC key writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Oo][Dd][Bb][Cc]\\[Oo][Dd][Bb][Cc][Ii][Nn][Ss][Tt].[Ii][Nn][Ii].*/
    pivot_on: host
    window: 24h
