name: Windows Modify Registry Suppress Win Defender Notif
id: windows-modify-registry-suppress-defender-notif-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of Notification_Suppress registry value to 1 under 
  Windows Defender UX Configuration. Suppressing Defender notifications 
  prevents users from seeing security alerts about detected threats. 
  Used by Azorult malware and referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Windows Defender\\UX Configuration\\Notification_Suppress"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Windows Defender registry paths. Tamper Protection prevents manual 
  simulation — any successful modification is highly suspicious.

known_false_positives: >
  Administrators may configure Defender notifications via Group Policy. 
  Any direct registry modification bypassing GPO is suspicious.

references:
  - https://app.any.run/tasks/a6f2ffe2-e6e2-4396-ae2e-04ea0143f2d8/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Windows Defender notification suppressed on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Defender evasion. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Azorult
    - CISA AA23-347A
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_defender
    - notification_suppress
    - defender_evasion
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Windows Defender.*UX Configuration.*Notification_Suppress/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-disable-windefender-notifications-001
    name: Windows Modify Registry Disable WinDefender Notifications
    reason: Sibling Defender notification-disable value; often set in the same batch to blind the user.
  - id: windows-modify-registry-disable-security-center-notif-001
    name: Windows Modify Registry Disable Windows Security Center Notif
    reason: Security Center notification suppression is usually part of the same tampering batch.
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: Another Security Center notification suppression technique on the same host.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Disabling Defender functions via registry accompanies silencing alerts.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Exclusions added after silencing alerts let the payload run unseen.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection disable is the prerequisite for these Defender setting changes.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Real-time protection disabled confirms the defense-evasion goal was reached.
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Defender operational log records configuration changes made in the same window.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender preference tampering via PowerShell/MpCmdRun
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Aa]dd-[Mm]p[Pp]reference.*/ OR /.*[Mm]p[Cc]md[Rr]un.*[Dd]isable.*/)
    pivot_on: host
    window: 2h
  - name: Defender policy registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\Windows Defender.*/
    pivot_on: host
    window: 4h
  - name: Defender/security services stopped or disabled
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(WinDefend|WdNisSvc|SecurityHealthService).*(stop|disabled|delete).*/
    pivot_on: host
    window: 4h
  - name: Notification and toast suppression values
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Notification_Suppress|SecurityCenter|Toast).*/
    pivot_on: host
    window: 2h
  - name: reg.exe/regedit touching Defender or Security Center
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(reg|regedit)\.exe/ AND data_win_eventdata_commandLine:/.*([Dd]efender|[Ss]ecurity[Cc]enter).*/
    pivot_on: host
    window: 2h
