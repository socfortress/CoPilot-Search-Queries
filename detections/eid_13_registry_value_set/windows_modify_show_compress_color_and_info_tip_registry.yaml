name: Windows Modify Show Compress Color And Info Tip Registry
id: windows-modify-registry-showcompcolor-infotip-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modifications to ShowCompColor and ShowInfoTip registry values under 
  Explorer\Advanced path. Hermetic Wiper malware modifies these to alter file 
  compression color display and information tips, manipulating file visibility 
  and deceiving users during destructive operations.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Explorer\\Advanced*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*ShowCompColor*"
              - wildcard:
                  data_win_eventdata_targetObject: "*ShowInfoTip*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
  CUSTOMER_CODE:
    type: string
    required: true
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 monitoring Explorer\Advanced registry paths.

known_false_positives: >
  Unknown. These settings are rarely modified manually.

references:
  - https://blog.talosintelligence.com/2022/02/threat-advisory-hermeticwiper.html

response:
  message: >
    ShowCompColor/ShowInfoTip modified on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    Possible Hermetic Wiper. MITRE ATT&CK: T1112
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25

tags:
  analytic_story:
    - Hermetic Wiper
    - Data Destruction
    - Windows Registry Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - hermetic_wiper
    - explorer_advanced
    - file_visibility
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Explorer.*Advanced.*/ AND (data_win_eventdata_targetObject:/.*ShowCompColor.*/ OR data_win_eventdata_targetObject:/.*ShowInfoTip.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f974656-6d83-4059-bbdf-68ac5403422f
    name: Hermetic Wiper TG Process Patterns
    reason: HermeticWiper's process-level behaviour; confirms the explorer tweaks are part of the wiper run and not user customisation.
  - id: Windows_Disable_Memory_Crash_Dump
    name: Windows Disable Memory Crash Dump
    reason: HermeticWiper disables crash dumps just before destruction, alongside these Explorer values.
  - id: 5a5152f1-463f-436b-b2f5-8eceb3964b42
    name: Displaying Hidden Files Feature Disabled
    reason: Same Explorer\Advanced key; hiding files is a related user-deception tweak.
  - id: 5df86130-4e95-4a54-90f7-26541b40aec2
    name: Registry Modification to Hidden File Extension
    reason: Another Explorer\Advanced visibility change used to mask malicious files.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Wipers tamper with boot config before corrupting the MBR.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Recovery inhibition commonly precedes destructive payloads.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defence impairment typically accompanies the wiper's preparation phase.
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Destructive actors blind logging before wiping.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Explorer Advanced registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*Explorer.Advanced.*/
    pivot_on: host
    window: 24h
  - name: Wiper driver and service installation
    query: data_win_system_eventID:(6 OR 11 OR 13) AND (data_win_eventdata_targetFilename:/.*[Dd]rivers.*\.sys/ OR data_win_eventdata_targetObject:/.*[Ss]ervices.*(epmntdrv|empntdrv|cmdrv).*/)
    pivot_on: host
    window: 6h
  - name: Boot, crash dump and recovery inhibition commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Bb]cdedit|[Vv]ssadmin.*delete|[Ww]badmin.*delete|[Cc]rash[Dd]ump[Ee]nabled).*/
    pivot_on: host
    window: 6h
  - name: Raw disk access and mass document deletion
    query: data_win_system_eventID:(9 OR 23 OR 26) AND (data_win_eventdata_device:*PhysicalDrive* OR data_win_eventdata_targetFilename:(*.doc* OR *.xls* OR *.pdf))
    pivot_on: host
    window: 4h
  - name: Writer process of the registry change
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]how[Cc]omp[Cc]olor|[Ss]how[Ii]nfo[Tt]ip).*/
    pivot_on: host
    window: 2h
