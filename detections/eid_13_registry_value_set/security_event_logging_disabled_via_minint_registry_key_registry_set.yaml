name: Security Event Logging Disabled via MiniNt Registry Key - Registry Set
id: 8839e550-52d7-4958-9f2f-e13c1e736838
version: 1
schema_version: "1.0"
date: "2025-04-09"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8839e550-52d7-4958-9f2f-e13c1e736838
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the addition of the 'MiniNt' key to the registry. Upon a reboot,
  Windows Event Log service will stop writing events. Windows Event Log is a
  service that collects and stores event logs from the operating system and
  applications. It is an important component of Windows security and auditing.
  Adversary may want to disable this service to disable logging of security
  events which could be used to detect their activities. MITRE ATT&CK:
  T1685.001, T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - term:
            data_win_eventdata_targetObject:
              value: "HKLM\\System\\CurrentControlSet\\Control\\MiniNt\\(Default)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject equals
  'HKLM\System\CurrentControlSet\Control\MiniNt\(Default)'.

known_false_positives: >
  Highly Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hackingarticles.in/defense-evasion-windows-event-logging-t1562-002/
  - https://attack.mitre.org/techniques/T1685/001/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Security Event Logging Disabled via MiniNt Registry Key - Registry Set
    detected on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1685.001, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
    - T1112
  custom_tags:
    - security
    - logging
    - minint
    - registry
    - sysmon
    - persistence
    - defense_impairment
    - car_2022_03_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Mm][Ii][Nn][Ii][Nn][Tt]\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Another registry route to the same goal, blinding Windows event logging.
  - id: 7d9263bd-dc47-4a58-bc92-5474abab390c
    name: Change Winevt Channel Access Permission Via Registry
    reason: Channel ACL tampering to stop log writing/reading, commonly combined.
  - id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
    name: Disabled Windows Defender Eventlog
    reason: Defender log suppression alongside event log disabling.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Command-line log disabling used in the same defense-evasion phase.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Cleared logs often precede or follow the MiniNt trick to erase evidence.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Security log clearing on the same host confirms anti-forensics.
  - id: ab4561b1-6c7e-48a7-ad08-087cfb9ce8f1
    name: Important Windows Event Auditing Disabled
    reason: Audit policy disabling that removes security events before the reboot takes effect.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Auditpol use to reduce auditing in tandem with MiniNt.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Audit policy and event log service tampering commands
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[aA][uU][dD][iI][tT][pP][oO][lL].*/ OR data_win_eventdata_commandLine:/.*[wW][eE][vV][tT][uU][tT][iI][lL].*/ OR data_win_eventdata_commandLine:/.*[mM][iI][nN][iI][nN][tT].*/ OR data_win_eventdata_commandLine:/.*[sS][cC] [cC][oO][nN][fF][iI][gG] [eE][vV][eE][nN][tT][lL][oO][gG].*/ OR data_win_eventdata_commandLine:/.*[sS][cC] [sS][tT][oO][pP] [eE][vV][eE][nN][tT][lL][oO][gG].*/ OR data_win_eventdata_commandLine:/.*[sS][tT][oO][pP]-[sS][eE][rR][vV][iI][cC][eE] [eE][vV][eE][nN][tT][lL][oO][gG].*/ OR data_win_eventdata_commandLine:/.*[cC][lL][eE][aA][rR]-[eE][vV][eE][nN][tT][lL][oO][gG].*/ OR data_win_eventdata_commandLine:/.*[rR][eE][mM][oO][vV][eE]-[eE][vV][eE][nN][tT][lL][oO][gG].*/))
    pivot_on: host
    window: 6h
  - name: Event log cleared events
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104")
    pivot_on: host
    window: 6h
  - name: Event log, audit and ETW registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[sS][eE][rR][vV][iI][cC][eE][sS]\\[eE][vV][eE][nN][tT][lL][oO][gG]\\.*/ OR data_win_eventdata_targetObject:/.*\\[wW][iI][nN][eE][vV][tT]\\[cC][hH][aA][nN][nN][eE][lL][sS]\\.*/ OR data_win_eventdata_targetObject:/.*\\[cC][oO][nN][tT][rR][oO][lL]\\[mM][iI][nN][iI][nN][tT].*/ OR data_win_eventdata_targetObject:/.*\\[cC][oO][nN][tT][rR][oO][lL]\\[wW][mM][iI]\\[aA][uU][tT][oO][lL][oO][gG][gG][eE][rR]\\.*/)
    pivot_on: host
    window: 6h
  - name: Reboot or shutdown following the change
    query: (data_win_system_eventID:"1074" OR data_win_system_eventID:"6006" OR data_win_system_eventID:"6008" OR data_win_system_eventID:"41") OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[sS][hH][uU][tT][dD][oO][wW][nN]\.[eE][xX][eE])/ AND (data_win_eventdata_commandLine:/.*\/[rR].*/ OR data_win_eventdata_commandLine:/.*\/[sS].*/)))
    pivot_on: host
    window: 6h
  - name: Credential access and lateral tooling before the logging blackout
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[sS][eE][kK][uU][rR][lL][sS][aA].*/ OR data_win_eventdata_commandLine:/.*[lL][sS][aA][sS][sS].*/ OR data_win_eventdata_commandLine:/.*[pP][rR][oO][cC][dD][uU][mM][pP].*/ OR data_win_eventdata_commandLine:/.*[pP][sS][eE][xX][eE][cC].*/ OR data_win_eventdata_commandLine:/.*[wW][mM][iI][cC] \/[nN][oO][dD][eE].*/ OR data_win_eventdata_commandLine:/.*[iI][nN][vV][oO][kK][eE]-[mM][iI][mM][iI][kK][aA][tT][zZ].*/ OR data_win_eventdata_commandLine:/.*[nN][tT][dD][sS][uU][tT][iI][lL].*/))
    pivot_on: host
    window: 6h
