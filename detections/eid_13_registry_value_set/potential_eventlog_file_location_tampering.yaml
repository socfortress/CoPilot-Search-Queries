name: Potential EventLog File Location Tampering
id: 0cb8d736-995d-4ce7-a31e-1e8d452a1459
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: D3F7A5105
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0cb8d736-995d-4ce7-a31e-1e8d452a1459
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects tampering with EventLog service "file" key. In order to change the
  default location of an Evtx file. This technique is used to tamper with log
  collection and alerting. MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\EventLog\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\File"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\System32\\\\Winevt\\\\Logs\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SYSTEM\CurrentControlSet\Services\EventLog\*';
  data_win_eventdata_targetObject matches '*\File'; data_win_eventdata_details
  matches '*\System32\Winevt\Logs\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/win32/eventlog/eventlog-key
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Potential EventLog File Location Tampering detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - eventlog
    - location
    - tampering
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ff][Ii][Ll][Ee]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Ll][Oo][Gg][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Another registry-level way to blind the EventLog service; operators stack file relocation with disabling channels.
  - id: 7d9263bd-dc47-4a58-bc92-5474abab390c
    name: Change Winevt Channel Access Permission Via Registry
    reason: Channel ACL tampering is a sibling log-evasion step on the same host, often in the same session.
  - id: 8839e550-52d7-4958-9f2f-e13c1e736838
    name: Security Event Logging Disabled via MiniNt Registry Key - Registry Set
    reason: MiniNt key stops Security log writes; co-occurs with redirecting evtx paths.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: wevtutil sl /e:false is the CLI counterpart used alongside registry log tampering.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Log clearing or config change typically follows relocating the evtx file, to destroy evidence.
  - id: f37b4bce-49d0-4087-9f5b-58bffda77316
    name: Potential AutoLogger Sessions Tampering
    reason: Disabling ETW AutoLogger sessions is a parallel telemetry-blinding step.
  - id: 8470d755-0c13-45b3-bd63-387a373c10cf
    name: Reg exe Manipulating Windows Services Registry Keys
    reason: The EventLog key is a Services key; reg.exe edits are the likely writer process.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Audit policy weakening completes the defense-evasion bundle around log relocation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry edits to EventLog service keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\\.*/
    pivot_on: host
    window: 2h
  - name: Eventlog tampering via wevtutil or auditpol
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Cc][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]\-[Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.* [Ss][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]\-[Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Ee][Tt].*/)
    pivot_on: host
    window: 4h
  - name: Evtx files created outside Winevt Logs
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ee][Vv][Tt][Xx]/ AND NOT data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Ll][Oo][Gg][Ss]\\.*/
    pivot_on: host
    window: 6h
  - name: Registry tools referencing EventLog
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/
    pivot_on: host
    window: 2h
