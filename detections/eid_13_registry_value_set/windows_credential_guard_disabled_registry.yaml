name: Windows Credential Guard Disabled - Registry
id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
version: 1
schema_version: "1.0"
date: "2025-12-26"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to disable Windows Credential Guard by setting registry
  values to 0. Credential Guard uses virtualization-based security to isolate
  secrets so that only privileged system software can access them. Adversaries
  may disable Credential Guard to gain access to sensitive credentials stored in
  the system, such as NTLM hashes and Kerberos tickets, which can be used for
  lateral movement and privilege escalation. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\DeviceGuard\\\\EnableVirtualizationBasedSecurity"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\DeviceGuard\\\\LsaCfgFlags"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Lsa\\\\LsaCfgFlags"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\DeviceGuard\EnableVirtualizationBasedSecurity';
  data_win_eventdata_targetObject matches '*\DeviceGuard\LsaCfgFlags';
  data_win_eventdata_targetObject matches '*\Lsa\LsaCfgFlags', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://woshub.com/disable-credential-guard-windows/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Credential Guard Disabled - Registry detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - credential
    - guard
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd]\\[Ee][Nn][Aa][Bb][Ll][Ee][Vv][Ii][Rr][Tt][Uu][Aa][Ll][Ii][Zz][Aa][Tt][Ii][Oo][Nn][Bb][Aa][Ss][Ee][Dd][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]/ OR data_win_eventdata_targetObject:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd]\\[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Ll][Ss][Aa]\\[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d645ef86-2396-48a1-a2b6-b629ca3f57ff
    name: Windows Credential Guard Related Registry Value Deleted - Registry
    reason: Alternate way to disable Credential Guard (value deletion instead of zeroing); attackers often try both on the same host.
  - id: 8b7273a4-ba5d-4d8a-b04f-11f2900d043a
    name: Windows Hypervisor Enforced Code Integrity Disabled
    reason: HVCI/VBS is turned off alongside Credential Guard to remove virtualization-based protections before credential theft.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Follow-on: once LSA protections are down, WDigest is re-enabled so plaintext passwords land in LSASS memory.'
  - id: 1a2d6c47-75b0-45bd-b133-2c0be75349fd
    name: Wdigest CredGuard Registry Modification
    reason: WDigest/CredGuard registry tampering is the same credential-exposure preparation step.
  - id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
    name: Lsass Full Dump Request Via DumpType Registry Settings
    reason: 'Next step: LSASS is made fully dumpable to harvest hashes and tickets.'
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: Disabling LSA PPL is the companion protection removal, usually done in the same tampering session.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Typical credential dump executed once credential protections are weakened.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Expected consumer of the weakened protection: Mimikatz extracting NTLM hashes and Kerberos tickets.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other LSA / VBS protection registry changes
    query: data_win_system_eventID:13 AND (data_win_eventdata_targetObject:/.*[Ll]sa.*(RunAsPPL|LsaCfgFlags|DisableRestrictedAdmin).*/ OR data_win_eventdata_targetObject:/.*[Dd]eviceGuard.*/ OR data_win_eventdata_targetObject:/.*[Ww][Dd]igest.*UseLogonCredential.*/)
    pivot_on: host
    window: 6h
  - name: LSASS access or dump tooling
    query: (data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/) OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Mm]imikatz|sekurlsa|comsvcs.*MiniDump|procdump.*[Ll]sass|lsadump).*/)
    pivot_on: host
    window: 6h
  - name: Credential store hive dumping
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(reg(\.exe)?\s+save\s+.*(sam|security|system)|ntdsutil|vssadmin.*create.*shadow).*/
    pivot_on: host
    window: 6h
  - name: Boot configuration / VBS tampering via bcdedit
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Bb]cdedit\.exe/ AND data_win_eventdata_commandLine:/.*(hypervisorlaunchtype|loadoptions|nointegritychecks).*/
    pivot_on: host
    window: 24h
  - name: Remote logons following protection removal
    query: data_win_system_eventID:(4624 OR 4648) AND data_win_eventdata_logonType:(3 OR 9 OR 10)
    pivot_on: user
    window: 6h
