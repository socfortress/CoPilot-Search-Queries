name: Windows Modify Registry No Auto Update
id: windows-modify-registry-no-auto-update-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of NoAutoUpdate registry value to 1 under Windows Update 
  AU policy. Disabling automatic updates leaves the system vulnerable to known 
  exploits and prevents security patches from being applied. Used by RedLine 
  Stealer and referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\WindowsUpdate\\AU\\NoAutoUpdate"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  WindowsUpdate policy registry paths.

known_false_positives: >
  WSUS environments may disable auto-update via Group Policy. Investigate 
  process and user context.

references:
  - https://learn.microsoft.com/de-de/security-updates/windowsupdateservices/18127499
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Automatic Windows Updates disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - CISA AA23-347A
    - RedLine Stealer
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_update
    - auto_update_disable
    - update_tampering
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*WindowsUpdate.*AU.*NoAutoUpdate/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-no-auto-reboot-logon-user-001
    name: Windows Modify Registry No Auto Reboot With Logon User
    reason: Companion AU policy write that keeps the host running after patches; together indicate deliberate update suppression
  - id: windows-modify-registry-donotconnect-wsus-001
    name: Windows Modify Registry DoNotConnectToWindowsUpdateInternetLocations
    reason: Cuts the host off from update sources; usually set alongside NoAutoUpdate
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defense impairment by the same actor right before or after policy-key tampering
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper protection must be off for most Defender registry changes to stick; precursor to wider tampering
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Defender exclusions are the usual companion of implant staging; shows the payload being shielded
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling that follows policy tampering when the actor is blinding the host
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Update and policy registry writes on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww]indows[Uu]pdate.[Aa][Uu].*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies.[Mm]icrosoft.[Ww]indows [Dd]efender.*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies.[Ss]ystem.*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies.[Ee]xplorer.*/)
    pivot_on:
    - host
    window: 2h
  - name: Update service stop or disable commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(wuauserv|[Uu]so[Ss]vc|[Ww]aa[Ss][Mm]edic).*/ AND (data_win_eventdata_commandLine:/.*[Ss]top.*/ OR data_win_eventdata_commandLine:/.*[Dd]isabled.*/)
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Aa]nti[Ss]pyware.*/)
    pivot_on:
    - host
    window: 2h
  - name: Defender policy registry tampering
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*[Dd]isable.*/ OR data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*[Ee]xclusions.*/ OR data_win_eventdata_targetObject:/.*[Tt]amper[Pp]rotection.*/)
    pivot_on:
    - host
    window: 2h
  - name: Downloader or staging tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Nn]et.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_commandLine:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_commandLine:/.*[Cc]ertutil.*[Uu]rl[Cc]ache.*/ OR data_win_eventdata_commandLine:/.*[Bb]itsadmin.*transfer.*/)
    pivot_on:
    - host
    window: 2h
