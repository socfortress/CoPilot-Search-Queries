name: Periodic Backup For System Registry Hives Enabled
id: 973ef012-8f1a-4c40-93b4-7e659a5cd17f
version: 1
schema_version: "1.0"
date: "2024-07-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 973ef012-8f1a-4c40-93b4-7e659a5cd17f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the enabling of the "EnablePeriodicBackup" registry value. Once
  enabled, The OS will backup System registry hives on restarts to the
  "C:\Windows\System32\config\RegBack" folder. Windows creates a "RegIdleBackup"
  task to manage subsequent backups. Registry backup was a default behavior on
  Windows and was disabled as of "Windows 10, version 1803". MITRE ATT&CK:
  T1113.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Control\\\\Session Manager\\\\Configuration Manager\\\\EnablePeriodicBackup"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\Session Manager\Configuration Manager\EnablePeriodicBackup';
  data_win_eventdata_details equals 'DWORD (0x00000001)'.

known_false_positives: >
  Legitimate need for RegBack feature by administrators. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/system-registry-no-backed-up-regback-folder
  - https://attack.mitre.org/techniques/T1113/

response:
  message: >
    Periodic Backup For System Registry Hives Enabled detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1113
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1113
  custom_tags:
    - periodic
    - backup
    - system
    - registry
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Ee][Nn][Aa][Bb][Ll][Ee][Pp][Ee][Rr][Ii][Oo][Dd][Ii][Cc][Bb][Aa][Cc][Kk][Uu][Pp]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: 'Direct follow-on: reg save/export of SAM, SYSTEM or SECURITY is the usual way the hive material is actually harvested after backups are switched on.'
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Alternative hive-copy path (esentutl /vss) used when the attacker wants SAM/SYSTEM without reg.exe; same credential-harvest goal.
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Scripted copy of SAM/SYSTEM/SECURITY or RegBack copies right after enabling backups.
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: File-creation evidence of exported hive copies confirming readable SAM files were produced.
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: Dropped SAM hive copies in staging locations are the next artefact once a RegBack/hive copy is taken.
  - id: f8748f2c-89dc-4d95-afb0-5a2dfdbad332
    name: SAM Registry Hive Handle Request
    reason: Security-log handle request on the SAM hive from a non-system process shows the hive being read for offline cracking.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Shadow-copy access to config\SAM/SYSTEM is the sibling technique to RegBack reads; operators often try both.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Copying hives out of a shadow copy is the fallback if the RegBack folder is empty or locked.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hive save/export commands (SAM/SYSTEM/SECURITY)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg]).*/ AND data_win_eventdata_commandLine:/.*( [Ss][Aa][Vv][Ee] | [Ee][Xx][Pp][Oo][Rr][Tt] ).*/ AND data_win_eventdata_commandLine:/.*([Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm]|[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]|[Hh][Kk][Ll][Mm]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Aa][Mm]|[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Yy][Ss][Tt][Ee][Mm]|[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/
    pivot_on: host
    window: 24h
  - name: RegBack folder and RegIdleBackup task use
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg][Bb][Aa][Cc][Kk]|[Rr][Ee][Gg][Ii][Dd][Ll][Ee][Bb][Aa][Cc][Kk][Uu][Pp]).*/
    pivot_on: host
    window: 24h
  - name: Hive copies written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Rr][Ee][Gg][Bb][Aa][Cc][Kk]\\|\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Aa][Mm]|\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Yy][Ss][Tt][Ee][Mm]|\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Aa][Mm]\.[Ss][Aa][Vv][Ee]|[Ss][Aa][Mm]\.[Hh][Ii][Vv][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ss][Aa][Vv][Ee]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Ss][Aa][Vv][Ee]).*/
    pivot_on: host
    window: 24h
  - name: Offline credential extraction tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Ss][Aa][Mm][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]|[Cc][Rr][Ee][Dd][Dd][Uu][Mm][Pp]).*/
    pivot_on: host
    window: 24h
  - name: Shadow copy creation or access around hive theft
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]|[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]|[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]).*/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|\\[Vv][Ss][Ss]|[Gg][Ll][Oo][Bb][Aa][Ll][Rr][Oo][Oo][Tt]|[Ll][Ii][Ss][Tt]).*/
    pivot_on: host
    window: 6h
