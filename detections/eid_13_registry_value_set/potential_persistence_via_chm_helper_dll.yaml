name: Potential Persistence Via CHM Helper DLL
id: 976dd1f2-a484-45ec-aa1d-0e87e882262b
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 976dd1f2-a484-45ec-aa1d-0e87e882262b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker modifies the registry key "HtmlHelp Author" to
  achieve persistence.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Software\\\\Microsoft\\\\HtmlHelp Author\\\\Location*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\HtmlHelp Author\\\\Location*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\HtmlHelp Author\Location*';
  data_win_eventdata_targetObject matches
  '*\Software\WOW6432Node\Microsoft\HtmlHelp Author\Location*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://persistence-info.github.io/Data/htmlhelpauthor.html
  - https://www.hexacorn.com/blog/2018/04/22/beyond-good-ol-run-key-part-76/

response:
  message: >
    Potential Persistence Via CHM Helper DLL detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - helper
    - registry
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Hh][Tt][Mm][Ll][Hh][Ee][Ll][Pp] [Aa][Uu][Tt][Hh][Oo][Rr]\\[Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Hh][Tt][Mm][Ll][Hh][Ee][Ll][Pp] [Aa][Uu][Tt][Hh][Oo][Rr]\\[Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f10ed525-97fe-4fed-be7c-2feecca941b1
    name: Persistence Via Hhctrl.ocx
    reason: Hhctrl.ocx persistence is the sibling HTML Help abuse; the same operator may plant both for hh.exe-triggered loading.
  - id: e8a95b5e-c891-46e2-b33a-93937d3abc31
    name: Suspicious HH.EXE Execution
    reason: hh.exe execution is what triggers the HtmlHelp Author DLL to load, so this is the likely follow-on.
  - id: 52cad028-0ff0-4854-8f67-d25dfcbc78b4
    name: HTML Help HH.EXE Suspicious Child Process
    reason: Suspicious child process of hh.exe would be the payload running after the helper DLL loads.
  - id: f57c58b3-ee69-4ef5-9041-455bf39aaa89
    name: Remote CHM File Download/Execution Via HH.EXE
    reason: Remote CHM download/execution is a delivery path that precedes helper DLL persistence.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: Unsigned DLL loaded by a Windows utility captures the actual helper DLL load.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: hh.exe executions and CHM opens
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Hh]h\.exe/ OR data_win_eventdata_commandLine:/.*\.chm.*/)
    pivot_on: host
    window: 6h
  - name: DLL loads into hh.exe from non-system paths
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Hh]h\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*Windows.(System32|SysWOW64|WinSxS).*/
    pivot_on: host
    window: 24h
  - name: CHM or DLL files created in writable paths
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.chm/ OR data_win_eventdata_targetFilename:/.*\.dll/) AND data_win_eventdata_targetFilename:/.*(Temp|Downloads|AppData|ProgramData|Public).*/
    pivot_on: host
    window: 6h
  - name: Children spawned by hh.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Hh]h\.exe/
    pivot_on: host
    window: 24h
  - name: HtmlHelp Author key activity
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*HtmlHelp Author.*/
    pivot_on: host
    window: 24h
