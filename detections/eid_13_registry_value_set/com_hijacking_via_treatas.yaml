name: COM Hijacking via TreatAs
id: dc5c24af-6995-49b2-86eb-a9ff62199e82
version: 1
schema_version: "1.0"
date: "2025-07-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dc5c24af-6995-49b2-86eb-a9ff62199e82
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect modification of TreatAs key to enable "rundll32.exe -sta" command.
  MITRE ATT&CK: T1546.015.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*TreatAs\\\\(Default)"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\OfficeClickToRun.exe"
                                case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Microsoft Office\\root\\integration\\integrator.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\integrator.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\system32\\svchost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\system32\\msiexec.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\SysWOW64\\msiexec.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*TreatAs\(Default)'; data_win_eventdata_image matches 'C:\Program
  Files\Common Files\Microsoft Shared\ClickToRun\*'; data_win_eventdata_image
  matches '*\OfficeClickToRun.exe', among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1546.015/T1546.015.md
  - https://www.youtube.com/watch?v=3gz1QmiMhss&t=1251s
  - https://attack.mitre.org/techniques/T1546/015/

response:
  message: >
    COM Hijacking via TreatAs detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.015
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.015
  custom_tags:
    - hijacking
    - treatas
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Tt][Rr][Ee][Aa][Tt][Aa][Ss]\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/ AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Cc][Ll][Ii][Cc][Kk][Tt][Oo][Rr][Uu][Nn]\\.*/ AND data_win_eventdata_image:/.*\\[Oo][Ff][Ff][Ii][Cc][Ee][Cc][Ll][Ii][Cc][Kk][Tt][Oo][Rr][Uu][Nn]\.[Ee][Xx][Ee]/) OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee]\\[Rr][Oo][Oo][Tt]\\[Ii][Nn][Tt][Ee][Gg][Rr][Aa][Tt][Ii][Oo][Nn]\\[Ii][Nn][Tt][Ee][Gg][Rr][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee]\\[Rr][Oo][Oo][Tt]\\[Ii][Nn][Tt][Ee][Gg][Rr][Aa][Tt][Ii][Oo][Nn]\\[Ii][Nn][Tt][Ee][Gg][Rr][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9b0f8a61-91b2-464f-aceb-0527e0a45020
    name: Potential COM Object Hijacking Via TreatAs Subkey - Registry
    reason: Same TreatAs subkey abuse seen from the registry-key angle; confirms which CLSID was redirected and by which process.
  - id: 790317c0-0a36-4a6a-a105-6e576bf99a14
    name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
    reason: Attackers pair TreatAs redirection with direct InprocServer32/LocalServer32 overwrite of a hijackable system CLSID.
  - id: f1edd233-30b5-4823-9e6a-c4171b24d316
    name: Rundll32 Registered COM Objects
    reason: TreatAs hijack is activated through rundll32 -sta {CLSID}; this fires when the registered COM object is executed.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Rundll32 abuse that follows the registry change when the hijacked COM object is triggered.
  - id: 96f697b0-b499-4e5d-9908-a67bec11cdb6
    name: Removal of Potential COM Hijacking Registry Keys
    reason: Attacker deleting the hijack keys afterwards to clean up the COM persistence.
  - id: 160d2780-31f7-4922-8b3a-efce30e63e96
    name: Potential AMSI COM Server Hijacking
    reason: Another COM server hijack (AMSI) commonly chained to blind defenses.
  - id: dc64d064-d346-11eb-8588-acde48001122
    name: Execute Javascript With Jscript COM CLSID
    reason: Scripting-engine CLSID abuse is the typical payload executed through a redirected COM class.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 -sta COM activation
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND (data_win_eventdata_commandLine:/.*-[Ss][Tt][Aa] .*/ OR data_win_eventdata_commandLine:/.*/[Ss][Tt][Aa] .*/)
    pivot_on: host
    window: 4h
  - name: Registry writes to CLSID server, TreatAs or ScriptletURL values
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ee][Rr]32\\.*/ OR data_win_eventdata_targetObject:/.*\\[Tt][Rr][Ee][Aa][Tt][Aa][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Ll][Ee][Tt][Uu][Rr][Ll].*/)
    pivot_on: host
    window: 4h
  - name: reg.exe, powershell or regedit touching Classes CLSID keys
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*\\[Cc][Ll][Ss][Ii][Dd]\\.*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Ee][Aa][Tt][Aa][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\.*/)
    pivot_on: host
    window: 2h
  - name: DLL from user-writable path loaded by COM hosts
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on: host
    window: 4h
