name: Scripted Diagnostics Turn Off Check Enabled - Registry
id: 7d995e63-ec83-4aa3-89d5-8a17b5c87c86
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Christopher Peacock @securepeacock, SCYTHE @scythe_io
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7d995e63-ec83-4aa3-89d5-8a17b5c87c86
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects enabling TurnOffCheck which can be used to bypass defense of MSDT
  Follina vulnerability. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Policies\\\\Microsoft\\\\Windows\\\\ScriptedDiagnostics\\\\TurnOffCheck"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Policies\Microsoft\Windows\ScriptedDiagnostics\TurnOffCheck';
  data_win_eventdata_details equals 'DWORD (0x00000001)'.

known_false_positives: >
  Administrator actions. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://twitter.com/wdormann/status/1537075968568877057?s=20&t=0lr18OAnmAGoGpma6grLUw
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Scripted Diagnostics Turn Off Check Enabled - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - scripted
    - diagnostics
    - check
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Cc][Rr][Ii][Pp][Tt][Ee][Dd][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\\[Tt][Uu][Rr][Nn][Oo][Ff][Ff][Cc][Hh][Ee][Cc][Kk]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: Follina exploitation executes via msdt.exe; TurnOffCheck disables the guard that would stop it.
  - id: 6004abd0-afa4-4557-ba90-49d172e0a299
    name: Execute Pcwrun.EXE To Leverage Follina
    reason: Pcwrun is an alternate Follina trigger relying on the same scripted-diagnostics path.
  - id: 9c8c7000-3065-44a8-a555-79bcba5d9955
    name: MSDT Execution Via Answer File
    reason: MSDT launch using answer files, a sibling abuse of the troubleshooting wizard.
  - id: bd1c6866-65fc-44b2-be51-5588fcff82b9
    name: Renamed Msdt.EXE Execution
    reason: Masqueraded msdt.exe used for payload execution after the check is switched off.
  - id: e2482f8d-3443-4237-b906-cc145d87a076
    name: Disable Internal Tools or Feature in Registry
    reason: Same family of policy tampering to weaken built-in protections.
  - id: a5c7a43f-6009-4a8c-80c5-32abf1c53ecc
    name: Microsoft Office Protected View Disabled
    reason: Office-borne Follina delivery is often accompanied by Office protection downgrades.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: msdt.exe and pcwrun launches with ms-msdt URI
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[mM][sS][dD][tT]\.[eE][xX][eE]|\\[pP][cC][wW][rR][uU][nN]\.[eE][xX][eE]|\\[sS][dD][iI][aA][gG][nN][hH][oO][sS][tT]\.[eE][xX][eE])/ OR (data_win_eventdata_commandLine:/.*[mM][sS]-[mM][sS][dD][tT]:.*/ OR data_win_eventdata_commandLine:/.*[iI][tT]_[bB][rR][oO][wW][sS][eE][fF][oO][rR][fF][iI][lL][eE].*/ OR data_win_eventdata_commandLine:/.*[iI][tT]_[rR][eE][bB][rR][oO][wW][sS][eE][fF][oO][rR][fF][iI][lL][eE].*/ OR data_win_eventdata_commandLine:/.*[pP][cC][wW][dD][iI][aA][gG][nN][oO][sS][tT][iI][cC].*/))
    pivot_on: host
    window: 2h
  - name: Office or browser parents spawning msdt and script hosts
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_parentImage:/.*\\[wW][iI][nN][wW][oO][rR][dD]\.[eE][xX][eE].*/ OR data_win_eventdata_parentImage:/.*\\[eE][xX][cC][eE][lL]\.[eE][xX][eE].*/ OR data_win_eventdata_parentImage:/.*\\[pP][oO][wW][eE][rR][pP][nN][tT]\.[eE][xX][eE].*/ OR data_win_eventdata_parentImage:/.*\\[oO][uU][tT][lL][oO][oO][kK]\.[eE][xX][eE].*/ OR data_win_eventdata_parentImage:/.*\\[mM][sS][eE][dD][gG][eE]\.[eE][xX][eE].*/) AND data_win_eventdata_image:/.*(\\[mM][sS][dD][tT]\.[eE][xX][eE]|\\[sS][dD][iI][aA][gG][nN][hH][oO][sS][tT]\.[eE][xX][eE]|\\[cC][mM][dD]\.[eE][xX][eE]|\\[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[eE][xX][eE]|\\[mM][sS][hH][tT][aA]\.[eE][xX][eE])/)
    pivot_on: host
    window: 2h
  - name: sdiagnhost spawning children
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[sS][dD][iI][aA][gG][nN][hH][oO][sS][tT]\.[eE][xX][eE].*/)
    pivot_on: host
    window: 2h
  - name: Office security settings downgraded
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[sS][eE][cC][uU][rR][iI][tT][yY]\\[pP][rR][oO][tT][eE][cC][tT][eE][dD][vV][iI][eE][wW]\\.*/ OR data_win_eventdata_targetObject:/.*\\[sS][eE][cC][uU][rR][iI][tT][yY]\\[vV][bB][aA][wW][aA][rR][nN][iI][nN][gG][sS].*/ OR data_win_eventdata_targetObject:/.*\\[sS][eE][cC][uU][rR][iI][tT][yY]\\[tT][rR][uU][sS][tT][eE][dD] [dD][oO][cC][uU][mM][eE][nN][tT][sS]\\.*/)
    pivot_on: user
    window: 4h
  - name: Document files dropped by mail client or browser
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[dD][oO][cC][xX].*/ OR data_win_eventdata_targetFilename:/.*\.[dD][oO][cC].*/ OR data_win_eventdata_targetFilename:/.*\.[rR][tT][fF].*/ OR data_win_eventdata_targetFilename:/.*\.[hH][tT][mM][lL].*/ OR data_win_eventdata_targetFilename:/.*\.[dD][oO][cC][mM].*/) AND (data_win_eventdata_image:/.*\\[oO][uU][tT][lL][oO][oO][kK]\.[eE][xX][eE].*/ OR data_win_eventdata_image:/.*\\[cC][hH][rR][oO][mM][eE]\.[eE][xX][eE].*/ OR data_win_eventdata_image:/.*\\[mM][sS][eE][dD][gG][eE]\.[eE][xX][eE].*/ OR data_win_eventdata_image:/.*\\[fF][iI][rR][eE][fF][oO][xX]\.[eE][xX][eE].*/)
    pivot_on: host
    window: 4h
