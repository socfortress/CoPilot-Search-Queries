  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of user-specific or system-wide environment variables via
  the registry. Which contains suspicious commands and strings.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Environment\\\\*"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_details:
                    value: "powershell"
                    case_insensitive: true
              - term:
                  data_win_eventdata_details:
                    value: "pwsh"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*C:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
