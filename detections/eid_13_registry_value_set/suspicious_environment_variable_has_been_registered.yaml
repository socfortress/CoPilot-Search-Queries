parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Environment\*'; data_win_eventdata_details equals 'powershell';
  data_win_eventdata_details equals 'pwsh', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://infosec.exchange/@sbousseaden/109542254124022664

response:
  message: >
    Suspicious Environment Variable Has Been Registered detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - environment
    - variable
    - registered
    - registry
    - sysmon
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\\.*/ AND (data_win_eventdata_details:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]/ OR data_win_eventdata_details:/[Pp][Ww][Ss][Hh]/ OR data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*[Tt][Vv][Qq][Qq][Aa][Aa][Mm][Aa][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa].*/ OR data_win_eventdata_details:/.*[Tt][Vv][Pp][Qq][Aa][Aa][Ii][Aa][Aa][Aa][Aa][Ee][Aa][Aa]8[Aa].*/ OR data_win_eventdata_details:/.*[Tt][Vv][Qq][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa][Ee][Aa][Bb][Aa][Aa].*/ OR data_win_eventdata_details:/.*[Tt][Vv][Oo][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa].*/ OR data_win_eventdata_details:/.*[Tt][Vv][Pp][Tt][Aa][Qq][Ee][Aa][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa].*/ OR data_win_eventdata_details:/.*[Ss][Ww]52[Bb]2[Tt][Ll][Ll].*/ OR data_win_eventdata_details:/.*[Ll][Uu][Dd][Mm]9[Rr][Zz][Ss].*/ OR data_win_eventdata_details:/.*[Jj][Bb][Nn][Zz][Vv][Aa]2[Uu][Tt].*/ OR data_win_eventdata_details:/.*[Ss][Qq][Bb][Uu][Aa][Hh][Yy][Aa][Bb][Ww][Bb][Rr][Aa][Gg][Uu][Aa][Ll][Qq].*/ OR data_win_eventdata_details:/.*[Kk][Aa][Bb][Gg][Bb]2[Aa][Gg]8[Aa][Aa][Ww][Bb][Ll][Aa][Cc]0[Aa].*/ OR data_win_eventdata_details:/.*[Jj][Aa][Gg]4[Aa][Dd][Gg][Bb][Vv][Aa][Gg][Ss][Aa][Zz][Qq][Aa][Tt][Aa].*/ OR data_win_eventdata_details:/[Ss][Uu][Vv][Yy].*/ OR data_win_eventdata_details:/[Ss][Qq][Bb][Ff][Aa][Ff].*/ OR data_win_eventdata_details:/[Ss][Qq][Bb][Uu][Aa][Hh].*/ OR data_win_eventdata_details:/[Cc][Ww][Bb][Hh][Aa].*/ OR data_win_eventdata_details:/[Aa][Ww][Vv]4.*/ OR data_win_eventdata_details:/[Aa][Qq][Bb][Ll][Aa].*/ OR data_win_eventdata_details:/[Rr]2[Vv]0.*/ OR data_win_eventdata_details:/[Dd][Mm][Ff][Yy].*/ OR data_win_eventdata_details:/[Dd][Gg][Bb][Hh][Aa].*/ OR data_win_eventdata_details:/[Dd][Xx][Nn][Pp][Bb][Mm].*/ OR data_win_eventdata_details:/[Hh]4[Ss][Ii][Aa].*/ OR data_win_eventdata_details:/[Yy]21[Kk].*/ OR data_win_eventdata_details:/[Cc][Aa][Bb][Hh][Aa][Hh].*/ OR data_win_eventdata_details:/[Qq][Zz][Pp][Cc].*/ OR data_win_eventdata_details:/[Yy][Zz][Pp][Cc].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Autostart persistence written on this host"
      query: '(data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ll][Oo][Aa][Dd].*/)'
