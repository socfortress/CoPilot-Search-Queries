name: Suspicious Environment Variable Has Been Registered
id: 966315ef-c5e1-4767-ba25-fce9c8de3660
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
