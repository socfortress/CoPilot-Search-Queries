  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\\.*/ AND (data_win_eventdata_details:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]/ OR data_win_eventdata_details:/[Pp][Ww][Ss][Hh]/ OR data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*[Tt][Vv][Qq][Qq][Aa][Aa][Mm][Aa][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa].*/ OR data_win_eventdata_details:/.*[Tt][Vv][Pp][Qq][Aa][Aa][Ii][Aa][Aa][Aa][Aa][Ee][Aa][Aa]8[Aa].*/ OR data_win_eventdata_details:/.*[Tt][Vv][Qq][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa][Ee][Aa][Bb][Aa][Aa].*/ OR data_win_eventdata_details:/.*[Tt][Vv][Oo][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa].*/ OR data_win_eventdata_details:/.*[Tt][Vv][Pp][Tt][Aa][Qq][Ee][Aa][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa].*/ OR data_win_eventdata_details:/.*[Ss][Ww]52[Bb]2[Tt][Ll][Ll].*/ OR data_win_eventdata_details:/.*[Ll][Uu][Dd][Mm]9[Rr][Zz][Ss].*/ OR data_win_eventdata_details:/.*[Jj][Bb][Nn][Zz][Vv][Aa]2[Uu][Tt].*/ OR data_win_eventdata_details:/.*[Ss][Qq][Bb][Uu][Aa][Hh][Yy][Aa][Bb][Ww][Bb][Rr][Aa][Gg][Uu][Aa][Ll][Qq].*/ OR data_win_eventdata_details:/.*[Kk][Aa][Bb][Gg][Bb]2[Aa][Gg]8[Aa][Aa][Ww][Bb][Ll][Aa][Cc]0[Aa].*/ OR data_win_eventdata_details:/.*[Jj][Aa][Gg]4[Aa][Dd][Gg][Bb][Vv][Aa][Gg][Ss][Aa][Zz][Qq][Aa][Tt][Aa].*/ OR data_win_eventdata_details:/[Ss][Uu][Vv][Yy].*/ OR data_win_eventdata_details:/[Ss][Qq][Bb][Ff][Aa][Ff].*/ OR data_win_eventdata_details:/[Ss][Qq][Bb][Uu][Aa][Hh].*/ OR data_win_eventdata_details:/[Cc][Ww][Bb][Hh][Aa].*/ OR data_win_eventdata_details:/[Aa][Ww][Vv]4.*/ OR data_win_eventdata_details:/[Aa][Qq][Bb][Ll][Aa].*/ OR data_win_eventdata_details:/[Rr]2[Vv]0.*/ OR data_win_eventdata_details:/[Dd][Mm][Ff][Yy].*/ OR data_win_eventdata_details:/[Dd][Gg][Bb][Hh][Aa].*/ OR data_win_eventdata_details:/[Dd][Xx][Nn][Pp][Bb][Mm].*/ OR data_win_eventdata_details:/[Hh]4[Ss][Ii][Aa].*/ OR data_win_eventdata_details:/[Yy]21[Kk].*/ OR data_win_eventdata_details:/[Cc][Aa][Bb][Hh][Aa][Hh].*/ OR data_win_eventdata_details:/[Qq][Zz][Pp][Cc].*/ OR data_win_eventdata_details:/[Yy][Zz][Pp][Cc].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ad89044a-8f49-4673-9a55-cbd88a1b374f
    name: Enabling COR Profiler Environment Variables
    reason: Persistent environment variables are a known way to hijack .NET profiling (COR_PROFILER); same registry Environment key abuse, confirms code-injection persistence.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Attackers who plant a PowerShell/Temp/Public-pointing environment variable commonly add a Run key to the same staging folder for persistence.
  - id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
    name: Execution of Powershell Script in Public Folder
    reason: The variable value referencing C:\Users\Public suggests the staged script runs from there next.
  - id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
    name: Suspicious Binaries and Scripts in Public Folder
    reason: 'Precursor: payload dropped into Public/Temp before its path was registered in an environment variable.'
  - id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
    name: Suspicious PowerShell Encoded Command Patterns
    reason: Environment variables holding PowerShell are often consumed by encoded PowerShell execution afterwards.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Staging follow-on: the powershell invoked via the variable usually downloads the next stage.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All registry value sets under Environment keys on host
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ee]nvironment.*/
    pivot_on: host
    window: 4h
  - name: PowerShell processes launched with encoded/hidden/bypass flags
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_commandLine:/.*(-[Ee]nc|-[Ee]ncodedcommand|-[Ww]indowstyle +[Hh]idden|-[Nn]op|-[Bb]ypass).*/
    pivot_on: host
    window: 2h
  - name: Files created in Temp or Public folders
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Aa]pp[Dd]ata.[Ll]ocal.[Tt]emp|[Uu]sers.[Pp]ublic).*/
    pivot_on: host
    window: 2h
  - name: Outbound network connections by PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/
    pivot_on: host
    window: 2h
  - name: Autorun/Run key writes on host
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion.[Rr]un.*/
    pivot_on: host
    window: 4h
