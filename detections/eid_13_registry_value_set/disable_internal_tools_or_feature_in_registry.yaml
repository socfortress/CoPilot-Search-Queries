o][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt][Pp][Rr][Oo][Mm][Pp][Tt][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Aa][Dd][Mm][Ii][Nn]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ii][Nn][Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy][Tt][Ii][Mm][Ee][Oo][Uu][Tt][Ss][Ee][Cc][Ss]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn][Ww][Ii][Tt][Hh][Oo][Uu][Tt][Ll][Oo][Gg][Oo][Nn]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Uu][Ss][Hh][Nn][Oo][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss]\\[Tt][Oo][Aa][Ss][Tt][Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ OR data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Tt][Oo][Rr][Aa][Gg][Ee]\\[Ww][Rr][Ii][Tt][Ee] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]/ OR data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Tt][Oo][Rr][Aa][Gg][Ee][Dd][Ee][Vv][Ii][Cc][Ee][Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Tt][Ee][Cc][Tt]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 275641a5-a492-45e2-a817-7c81e9d9d3e9
    name: Add DisallowRun Execution to Registry
    reason: DisallowRun blocks specific tools (security/admin utilities) and is commonly set in the same lockdown routine as DisableTaskmgr/DisableRegistryTools.
  - id: 1c3121ed-041b-4d97-a075-07f54f20fb4a
    name: Registry Explorer Policy Modification
    reason: Explorer policy edits are the sibling mechanism for hiding Run/ControlPanel/Start menu that this rule also covers; they co-occur in the same script.
  - id: 5de03871-5d46-4539-a82d-3aa992a69a83
    name: Registry Disable System Restore
    reason: Disabling System Restore is part of the same victim-lockdown bundle used by RATs like Agent Tesla and ransomware.
  - id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
    name: Disable Windows Security Center Notifications
    reason: Muting Security Center notifications hides the effects of the same tampering from the user.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defender feature disabling frequently accompanies removal of Task Manager/regedit so the user cannot spot or undo it.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Run key written by a downloaded binary: the persistence step of the same malware that restricts admin tools.'
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: New Run key pointing to a suspicious folder confirms the implant that made the policy change is persistent.
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: Registry tampering by suspicious processes identifies whether the writer is a dropped binary rather than admin tooling.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Persistence Run keys set on the host
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]([Oo][Nn][Cc][Ee])?\\.*/
    pivot_on: host
    window: 4h
  - name: reg.exe / PowerShell writing Explorer or System policy values
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*(Policies\\Explorer|Policies\\System|DisableTaskmgr|DisableRegistryTools|DisableCMD).*/
    pivot_on: host
    window: 2h
  - name: Executables and scripts dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Jj][Ss]|[Vv][Bb][Ss])/
    pivot_on: host
    window: 4h
  - name: Defender or firewall registry tampering by the same actor
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(Windows Defender|Windows Advanced Threat Protection|SharedAccess\\Parameters\\FirewallPolicy|Security Center).*/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]0000000[01]\)/
    pivot_on: host
    window: 4h
  - name: Obfuscated or encoded PowerShell and Defender preference changes
