name: Registry Modification for OCI DLL Redirection
id: c0e0bdec-3e3d-47aa-9974-05539c999c89
version: 1
schema_version: "1.0"
date: "2026-01-24"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c0e0bdec-3e3d-47aa-9974-05539c999c89
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry modifications related to 'OracleOciLib' and
  'OracleOciLibPath' under 'MSDTC' settings. Threat actors may modify these
  registry keys to redirect the loading of 'oci.dll' to a malicious DLL,
  facilitating phantom DLL hijacking via the MSDTC service. MITRE ATT&CK: T1112,
  T1574.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Microsoft\\\\MSDTC\\\\MTxOCI\\\\OracleOciLib"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_details"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*oci.dll*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Microsoft\\\\MSDTC\\\\MTxOCI\\\\OracleOciLibPath"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_details"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*%SystemRoot%\\\\System32\\\\*"
                                case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLib'; data_win_eventdata_details
  matches '*oci.dll*'; data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLibPath', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Registry Modification for OCI DLL Redirection detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1112, T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1574.001
  custom_tags:
    - registry
    - redirection
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Mm][Ss][Dd][Tt][Cc]\\[Mm][Tt][Xx][Oo][Cc][Ii]\\[Oo][Rr][Aa][Cc][Ll][Ee][Oo][Cc][Ii][Ll][Ii][Bb]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*[Oo][Cc][Ii]\.[Dd][Ll][Ll].*/)) OR (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Mm][Ss][Dd][Tt][Cc]\\[Mm][Tt][Xx][Oo][Cc][Ii]\\[Oo][Rr][Aa][Cc][Ll][Ee][Oo][Cc][Ii][Ll][Ii][Bb][Pp][Aa][Tt][Hh]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a1b1fd53-9c4a-444c-bae0-34a330fc7aa8
    name: Potential Persistence Via DLLPathOverride
    reason: DLLPathOverride persistence is another registry-based DLL redirect used by the same hijack tradecraft.
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: A malicious oci.dll must be written to disk; non-existent system DLL creation is the staging step.
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: System-named DLL (oci.dll) dropped outside System32 supplies the payload the registry key points to.
  - id: 612e47e9-8a59-43a6-b404-f48683f45bd6
    name: ServiceDll Hijack
    reason: ServiceDll hijack is the sibling registry DLL-redirect technique into a service host.
  - id: e6fe26ee-d063-4f5b-b007-39e90aaf50e3
    name: Potential Persistence Via AutodialDLL
    reason: AutodialDLL is a comparable registry-pointed DLL load persistence mechanism.
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: 'Once redirected, a system process loads the DLL from a suspicious location: confirming image-load.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: oci.dll created outside System32
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Oo][Cc][Ii]\.[Dd][Ll][Ll].*/ AND NOT data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/
    pivot_on: host
    window: 6h
  - name: MSDTC service registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ss][Dd][Tt][Cc]\\.*/
    pivot_on: host
    window: 6h
  - name: oci.dll loaded from a non-System32 path
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Oo][Cc][Ii]\.[Dd][Ll][Ll].*/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/
    pivot_on: host
    window: 6h
  - name: MSDTC install or service restart commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Mm][Ss][Dd][Tt][Cc].*/ AND (data_win_eventdata_commandLine:/.*-[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ss][Tt][Aa][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] .*/)
    pivot_on: host
    window: 4h
  - name: Reg.exe writes to the MSDTC key
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*/ AND data_win_eventdata_commandLine:/.*[Mm][Ss][Dd][Tt][Cc]\\[Mm][Tt][Xx][Oo][Cc][Ii].*/
    pivot_on: host
    window: 2h
