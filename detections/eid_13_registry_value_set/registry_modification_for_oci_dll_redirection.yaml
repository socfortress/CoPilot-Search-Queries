name: Registry Modification for OCI DLL Redirection
id: c0e0bdec-3e3d-47aa-9974-05539c999c89
version: 1
schema_version: "1.0"
date: "2026-01-24"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c0e0bdec-3e3d-47aa-9974-05539c999c89
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry modifications related to 'OracleOciLib' and
  'OracleOciLibPath' under 'MSDTC' settings. Threat actors may modify these
  registry keys to redirect the loading of 'oci.dll' to a malicious DLL,
  facilitating phantom DLL hijacking via the MSDTC service. MITRE ATT&CK: T1112,
  T1574.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Microsoft\\\\MSDTC\\\\MTxOCI\\\\OracleOciLib"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_details"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*oci.dll*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SOFTWARE\\\\Microsoft\\\\MSDTC\\\\MTxOCI\\\\OracleOciLibPath"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_details"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*%SystemRoot%\\\\System32\\\\*"
                                case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLib'; data_win_eventdata_details
  matches '*oci.dll*'; data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLibPath', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Registry Modification for OCI DLL Redirection detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1112, T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1574.001
  custom_tags:
    - registry
    - redirection
    - sysmon
    - persistence
    - privilege_escalation
    - execution
    - stealth
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Mm][Ss][Dd][Tt][Cc]\\[Mm][Tt][Xx][Oo][Cc][Ii]\\[Oo][Rr][Aa][Cc][Ll][Ee][Oo][Cc][Ii][Ll][Ii][Bb]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*[Oo][Cc][Ii]\.[Dd][Ll][Ll].*/)) OR (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Mm][Ss][Dd][Tt][Cc]\\[Mm][Tt][Xx][Oo][Cc][Ii]\\[Oo][Rr][Aa][Cc][Ll][Ee][Oo][Cc][Ii][Ll][Ii][Bb][Pp][Aa][Tt][Hh]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/)))

