name: Windows Modify Registry MaxConnectionPerServer
id: windows-modify-registry-maxconnectionperserver-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of MaxConnectionsPerServer or MaxConnectionsPer1_0Server 
  registry values to 0x0000000a (10), increasing concurrent connections to remote 
  servers. Warzone RAT (Ave Maria) modifies this to facilitate more effective C2 
  communication and lateral movement.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Internet Settings\\MaxConnectionsPerServer"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Internet Settings\\MaxConnectionsPer1_0Server"
            minimum_should_match: 1
        - term:
            data_win_eventdata_details: "DWORD (0x0000000a)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Internet Settings registry paths. Add Internet Settings to Sysmon 
  EventID 13 TargetObject rules. HKCU paths appear as HKU\<SID> in logs.

known_false_positives: >
  Some applications may modify connection limits. Investigate process context.

references:
  - https://asec.ahnlab.com/en/17692/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Max connections per server increased on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Possible Warzone RAT. MITRE ATT&CK: T1112
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Warzone RAT
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - internet_settings
    - max_connections
    - warzone_rat
    - c2_communication
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*Internet Settings.*MaxConnectionsPerServer/ OR data_win_eventdata_targetObject:/.*Internet Settings.*MaxConnectionsPer1_0Server/) AND data_win_eventdata_details:"DWORD (0x0000000a)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-proxyenable-001
    name: Windows Modify Registry ProxyEnable
    reason: Same Internet Settings hive; implants like Warzone RAT also toggle proxy settings to shape C2 traffic
  - id: windows-modify-registry-proxyserver-001
    name: Windows Modify Registry ProxyServer
    reason: A proxy pointed at attacker infrastructure typically accompanies a raised connection limit
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Defender exclusions are the usual companion of implant staging; shows the payload being shielded
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defense impairment by the same actor right before or after policy-key tampering
  - id: a54f842a-3713-4b45-8c84-5f136fdebd3c
    name: New PortProxy Registry Entry Added
    reason: Portproxy is a common C2 relay and lateral-movement follow-on once the implant is tuned
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: PsExec is the typical lateral hop for deploying payloads to further hosts
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes to Internet Settings (proxy and connection limits)
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ii]nternet [Ss]ettings.*[Pp]roxy.*/ OR data_win_eventdata_targetObject:/.*[Ii]nternet [Ss]ettings.*[Zz]one[Mm]ap.*/ OR data_win_eventdata_targetObject:/.*[Ii]nternet [Ss]ettings.*[Mm]ax[Cc]onnections.*/)
    pivot_on:
    - host
    window: 2h
  - name: Implant autostart persistence written on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion.[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon.[Ss]hell.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon.[Uu]serinit.*/ OR data_win_eventdata_targetObject:/.*[Ii]mage [Ff]ile [Ee]xecution [Oo]ptions.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from user-writable paths
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(AppData|Temp|ProgramData|Users.Public).*/
    pivot_on:
    - host
    window: 1h
  - name: Downloader or staging tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Nn]et.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_commandLine:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_commandLine:/.*[Cc]ertutil.*[Uu]rl[Cc]ache.*/ OR data_win_eventdata_commandLine:/.*[Bb]itsadmin.*transfer.*/)
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Aa]nti[Ss]pyware.*/)
    pivot_on:
    - host
    window: 2h
