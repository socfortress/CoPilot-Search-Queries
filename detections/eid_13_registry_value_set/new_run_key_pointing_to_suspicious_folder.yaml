name: New RUN Key Pointing to Suspicious Folder
id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
version: 1
schema_version: "1.0"
date: "2025-10-06"
author: Florian Roth (Nextron Systems), Markus Neis, Sander Wiebing, Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious new RUN key element pointing to an executable in a
  suspicious folder. MITRE ATT&CK: T1547.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Perflogs*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\ProgramData'*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Windows\\\\Temp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Temp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\AppData\\\\Local\\\\Temp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\AppData\\\\Roaming*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\$Recycle.bin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Users\\\\Default*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*:\\\\Users\\\\public*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%temp%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%tmp%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%Public%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%AppData%*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*:\\\\Users\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Favorites*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Favourites*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Contacts*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Music*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Pictures*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Documents*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Photos*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\RunOnce\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SoftwareDistribution\\\\Download\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*rundll32.exe *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*C:\\\\WINDOWS\\\\system32\\\\advpack.dll,DelNodeRunDLL32*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*C:\\\\Windows\\\\Temp\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*C:\\\\Program Files\\\\Spotify\\\\Spotify.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*C:\\\\Program Files (x86)\\\\Spotify\\\\Spotify.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Roaming\\\\Spotify\\\\Spotify.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\Spotify"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*Spotify.exe --autostart --minimized"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\Run*';
  data_win_eventdata_targetObject matches
  '*\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run*';
  data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run*', among
  other conditions.

known_false_positives: >
  Software using weird folders for updates. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.fireeye.com/blog/threat-research/2018/08/fin7-pursuing-an-enigmatic-and-evasive-global-criminal-operation.html
  - https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    New RUN Key Pointing to Suspicious Folder detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1547.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - pointing
    - folder
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
