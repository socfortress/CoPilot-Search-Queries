Ee][Ss].*/ OR data_win_eventdata_details:/.*\\[Cc][Oo][Nn][Tt][Aa][Cc][Tt][Ss].*/ OR data_win_eventdata_details:/.*\\[Mm][Uu][Ss][Ii][Cc].*/ OR data_win_eventdata_details:/.*\\[Pp][Ii][Cc][Tt][Uu][Rr][Ee][Ss].*/ OR data_win_eventdata_details:/.*\\[Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss].*/ OR data_win_eventdata_details:/.*\\[Pp][Hh][Oo][Tt][Oo][Ss].*/))) AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]\\.*/ AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee][Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]\\.*/ AND data_win_eventdata_details:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee] .*/ AND data_win_eventdata_details:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Dd][Vv][Pp][Aa][Cc][Kk]\.[Dd][Ll][Ll],[Dd][Ee][Ll][Nn][Oo][Dd][Ee][Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND (data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_details AND NOT ((data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]/ AND data_win_eventdata_details:/.*[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee] --[Aa][Uu][Tt][Oo][Ss][Tt][Aa][Rr][Tt] --[Mm][Ii][Nn][Ii][Mm][Ii][Zz][Ee][Dd]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Command-line path for writing the same Run value; identifies the parent and full command.
  - id: 8d85cf08-bf97-4260-ba49-986a2a65129c
    name: Suspicious PowerShell In Registry Run Keys
    reason: Same Run key but with a PowerShell payload instead of a dropped binary; co-occurs in fileless variants.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Run key set by a process from a download location, a strong indicator that the payload came from the user's browser or mail.
  - id: b7916c2a-fa2f-4795-9477-32b731f70f11
    name: Registry Persistence via Explorer Run Key
    reason: Sibling Run-key persistence path under Explorer policies; actors often set several autostarts.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Broader ASEP modification on the same host that may show additional persistence by the same process.
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Attackers commonly add a Startup folder copy alongside a Run key for redundancy.
  - id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
    name: Suspicious Binaries and Scripts in Public Folder
    reason: The Run key target in Public/temp paths is the binary dropped here just before.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executables dropped in staging folders
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(exe|dll|scr|bat|ps1|vbs|js|hta)/ AND (data_win_eventdata_targetFilename:*[Aa]pp[Dd]ata* OR data_win_eventdata_targetFilename:*[Pp]ublic* OR data_win_eventdata_targetFilename:*[Pp]erflogs* OR data_win_eventdata_targetFilename:*[Tt]emp*)
    pivot_on: host
    window: 6h
  - name: Reg.exe or script writing Run keys
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Cc]urrent[Vv]ersion.*[Rr]un.*/ AND (data_win_eventdata_commandLine:*reg*add* OR data_win_eventdata_commandLine:*Set-ItemProperty* OR data_win_eventdata_commandLine:*New-ItemProperty*)
    pivot_on: host
    window: 4h
  - name: Processes started from staging folders
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*[Aa]pp[Dd]ata* OR data_win_eventdata_image:*[Pp]ublic* OR data_win_eventdata_image:*[Pp]erflogs* OR data_win_eventdata_image:*[Tt]emp*)
    pivot_on: host
    window: 6h
  - name: Scheduled task persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:*create*
    pivot_on: host
    window: 6h
  - name: Outbound connections from staging folders
    query: data_win_system_eventID:3 AND (data_win_eventdata_image:*[Aa]pp[Dd]ata* OR data_win_eventdata_image:*[Pp]ublic* OR data_win_eventdata_image:*[Pp]erflogs* OR data_win_eventdata_image:*[Tt]emp*)
    pivot_on: host
    window: 6h
