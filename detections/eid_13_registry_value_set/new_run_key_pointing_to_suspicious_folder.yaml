_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]\\[Ss][Pp][Oo][Tt][Ii][Ff][Yy]/ AND data_win_eventdata_details:/.*[Ss][Pp][Oo][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee] --[Aa][Uu][Tt][Oo][Ss][Tt][Aa][Rr][Tt] --[Mm][Ii][Nn][Ii][Mm][Ii][Zz][Ee][Dd]/)

