u][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\\[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\\[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\.[Ee][Xx][Ee]/)

