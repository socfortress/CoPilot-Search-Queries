\\[Oo][Ff][Ff][Ii][Cc][Ee][Cc]2[Rr][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee]\\[Tt][Aa][Ss][Kk][Cc][Aa][Cc][Hh][Ee]\\[Tt][Rr][Ee][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ll][Aa]\\[Ss][Ee][Rr][Vv][Ee][Rr] [Mm][Aa][Nn][Aa][Gg][Ee][Rr] [Pp][Ee][Rr][Ff][Oo][Rr][Mm][Aa][Nn][Cc][Ee] [Mm][Oo][Nn][Ii][Tt][Oo][Rr]\\.*/) OR data_win_eventdata_image:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Rr][Uu][Nn][Tt][Ii][Mm][Ee][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\\[Uu][Pp][Dd][Aa][Tt][Ee]\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\\[Uu][Pp][Dd][Aa][Tt][Ee]\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Ee][Dd][Gg][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Ee][Dd][Gg][Ee][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\\[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\\[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5b16df71-8615-4f7f-ac9b-6c43c0509e61
    name: Hide Schedule Task Via Index Value Tamper
    reason: Tampering with TaskCache Index to hide a task is the stealth follow-on to registering it outside svchost.
  - id: 526cc8bc-1cdc-48ad-8b26-f19bff969cec
    name: Removal Of Index Value to Hide Schedule Task - Registry
    reason: Removing the Index value hides a task from schtasks /query; typical post-registration evasion.
  - id: acd74772-5f88-45c7-956b-6a7b36c294d2
    name: Removal Of SD Value to Hide Schedule Task - Registry
    reason: Deleting the SD value hides the task; same TaskCache key family, often done by the same tool.
  - id: 9f9f92ba-5300-43a4-b435-87d1ee571688
    name: Diamond Sleet APT Scheduled Task Creation - Registry
    reason: Specific TaskCache registry-based task creation pattern by a non-svchost process.
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Task XML written into System32\Tasks accompanies direct TaskCache registration that bypasses the scheduler service.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: The normal schtasks route to the same persistence goal; often co-occurs or precedes the direct registry write.
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Reveals the payload command placed inside the new task.
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: Task named like a system task to blend in after registration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task creation events and schtasks activity
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4702" OR data_win_system_eventID:"106") OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[sS][cC][hH][tT][aA][sS][kK][sS]\.[eE][xX][eE]|\\[aA][tT]\.[eE][xX][eE])/))
    pivot_on: host
    window: 4h
