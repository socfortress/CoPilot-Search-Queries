name: Add Debugger Entry To Hangs Key For Persistence
id: 833ef470-fa01-4631-a79b-6f291c9ac498
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 833ef470-fa01-4631-a79b-6f291c9ac498
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker adds a new "Debugger" value to the "Hangs" key in
  order to achieve persistence which will get invoked when an application
  crashes.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\Windows Error Reporting\\\\Hangs\\\\Debugger*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\Windows Error Reporting\Hangs\Debugger*'.

known_false_positives: >
  This value is not set by default but could be rarly used by administrators.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://persistence-info.github.io/Data/wer_debugger.html
  - https://www.hexacorn.com/blog/2019/09/20/beyond-good-ol-run-key-part-116/

response:
  message: >
    Add Debugger Entry To Hangs Key For Persistence detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - debugger
    - entry
    - hangs
    - registry
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Hh][Aa][Nn][Gg][Ss]\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0cf2e1c6-8d10-4273-8059-738778f981ad
    name: Potential WerFault ReflectDebugger Registry Value Abuse
    reason: Both abuse Windows Error Reporting configuration to execute attacker content from WER handling.
  - id: fabfb3a7-3ce1-4445-9c7c-3c27f1051cdd
    name: Potential ReflectDebugger Content Execution Via WerFault.EXE
    reason: Execution-side hit when WerFault actually runs attacker content after WER keys were configured.
  - id: 092af964-4233-4373-b4ba-d86ea2890288
    name: Add Debugger Entry To AeDebug For Persistence
    reason: AeDebug sibling of this Hangs-key technique; both are crash/hang-triggered debuggers often planted together.
  - id: 9827ae57-3802-418f-994b-d5ecf5cd974b
    name: Potential Registry Persistence Attempt Via DbgManagedDebugger
    reason: Managed-code crash debugger hijack, same crash-triggered persistence class.
  - id: 36803969-5421-41ec-b92f-8500f79c23b0
    name: Potential Persistence Via GlobalFlags
    reason: Alternative exit-triggered execution hook for redundant persistence.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Standard Run-key persistence typically accompanies lesser-known hooks.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other crash-debugger and WER hijack keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(AeDebug|DbgManagedDebugger|Image File Execution Options|SilentProcessExit|Windows Error Reporting\\Hangs|ReflectDebugger|Windows Error Reporting\\Debugger).*/
    pivot_on: host
    window: 24h
  - name: WerFault spawning unexpected children
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Command line editing WER Hangs debugger
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww]indows [Ee]rror [Rr]eporting.*[Hh]angs.*/
    pivot_on: host
    window: 4h
  - name: Executables or scripts dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt])/ AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 4h
  - name: Autorun persistence nearby
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\CurrentVersion\\([Rr]un|[Rr]unOnce)\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ww]inlogon\\([Ss]hell|[Uu]serinit).*/)
    pivot_on: host
    window: 24h
