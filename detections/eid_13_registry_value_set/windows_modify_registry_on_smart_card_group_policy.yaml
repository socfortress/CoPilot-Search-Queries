name: Windows Modify Registry on Smart Card Group Policy
id: windows-modify-registry-smart-card-group-policy-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of scforceoption registry value to 1, which enforces 
  smart card login for all users. Unauthorized changes to this setting can 
  lock out users who don't have smart cards, disrupting normal access. 
  ShrinkLocker ransomware modifies this to restrict access during attacks.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Policies\\System\\scforceoption"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Policies\System registry paths.

known_false_positives: >
  Organizations with smart card authentication may configure this via 
  Group Policy. Investigate process and user context.

references:
  - https://www.bleepingcomputer.com/news/security/new-shrinklocker-ransomware-uses-bitlocker-to-encrypt-your-files/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Smart card login enforced on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Possible ShrinkLocker. MITRE ATT&CK: T1112
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - ShrinkLocker
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - smart_card
    - scforceoption
    - access_restriction
    - ransomware_prep
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Policies.*System.*scforceoption/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-configure-bitlocker-001
    name: Windows Modify Registry Configure BitLocker
    reason: ShrinkLocker sets BitLocker policy registry values alongside scforceoption to encrypt and lock the host
  - id: 0e0255bf-2548-47b8-9582-c0955c9283f5
    name: Suspicious Reg Add BitLocker
    reason: ShrinkLocker's script uses reg add for FVE policy settings
  - id: Windows-BitLocker-Suspicious-Command-Usage
    name: Windows BitLocker Suspicious Command Usage
    reason: manage-bde commands performing encryption and protector changes after the policy change
  - id: c363385c-f75d-4753-a108-c1a8e28bdbda
    name: Potential Manage-bde.wsf Abuse To Proxy Execution
    reason: manage-bde script abuse is another way BitLocker is driven by attacker tooling
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Recovery inhibition commonly paired with the lockout step
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling that follows policy tampering when the actor is blinding the host
  - id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
    name: Disable Microsoft Defender Firewall via Registry
    reason: ShrinkLocker alters firewall and RDP settings to lock out defenders; same defense-impairment phase
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BitLocker, RDP and system-policy registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*FVE.*/ OR data_win_eventdata_targetObject:/.*[Tt]erminal [Ss]erver.*fDenyTSConnections.*/ OR data_win_eventdata_targetObject:/.*[Ll]ocal[Aa]ccount[Tt]oken[Ff]ilter[Pp]olicy.*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies.[Ss]ystem.*[Ee]nable[Ll]ua.*/)
    pivot_on:
    - host
    window: 4h
  - name: BitLocker, diskpart, firewall and shutdown commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm]anage-bde.*/ OR data_win_eventdata_commandLine:/.*[Dd]iskpart.*/ OR data_win_eventdata_commandLine:/.*[Cc]onvert-?[Bb]it[Ll]ocker.*/ OR data_win_eventdata_commandLine:/.*[Bb]itlocker.*/ OR data_win_eventdata_commandLine:/.*[Ss]hutdown.* -?[Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Nn]et[Ff]irewall[Pp]rofile.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*[Aa]dv[Ff]irewall.*[Oo]ff.*/)
    pivot_on:
    - host
    window: 4h
  - name: Recovery inhibition and log clearing
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Rr]ecoveryenabled.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Ii]gnoreallfailures.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]evtutil.* [Cc][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on:
    - host
    window: 4h
  - name: Failed logons and lockouts following the policy change
    query: (data_win_system_eventID:"4625" OR data_win_system_eventID:"4740" OR data_win_system_eventID:"4771")
    pivot_on:
    - host
    - user
    window: 4h
  - name: RDP enable or disable registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Tt]erminal [Ss]erver.*fDenyTSConnections.*/ OR data_win_eventdata_targetObject:/.*[Tt]erminal [Ss]erver.*[Uu]ser[Aa]uthentication.*/)
    pivot_on:
    - host
    window: 4h
