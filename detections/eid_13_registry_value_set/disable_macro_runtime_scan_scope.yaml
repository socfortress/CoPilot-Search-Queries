name: Disable Macro Runtime Scan Scope
id: ab871450-37dc-4a3a-997f-6662aa8ae0f1
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ab871450-37dc-4a3a-997f-6662aa8ae0f1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects tampering with the MacroRuntimeScanScope registry key to disable
  runtime scanning of enabled macros.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Office\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Common\\\\Security*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\MacroRuntimeScanScope"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\*'; data_win_eventdata_targetObject matches
  '*\Microsoft\Office\*'; data_win_eventdata_targetObject matches
  '*\Common\Security*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2018/09/12/office-vba-amsi-parting-the-veil-on-malicious-macros/
  - https://admx.help/?Category=Office2016&Policy=office16.Office.Microsoft.Policies.Windows::L_MacroRuntimeScanScope
  - https://github.com/S3cur3Th1sSh1t/OffensiveVBA/blob/28cc6a2802d8176195ac19b3c8e9a749009a82a3/src/AMSIbypasses.vba

response:
  message: >
    Disable Macro Runtime Scan Scope detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - disable
    - macro
    - runtime
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Mm][Mm][Oo][Nn]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ AND data_win_eventdata_targetObject:/.*\\[Mm][Aa][Cc][Rr][Oo][Rr][Uu][Nn][Tt][Ii][Mm][Ee][Ss][Cc][Aa][Nn][Ss][Cc][Oo][Pp][Ee]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a5c7a43f-6009-4a8c-80c5-32abf1c53ecc
    name: Microsoft Office Protected View Disabled
    reason: Protected View disabled is the sibling Office hardening bypass attackers set in the same pre-macro step.
  - id: 91239011-fe3c-4b54-9f24-15c86bb65913
    name: Office Macros Warning Disabled
    reason: Macro warnings disabled removes the user prompt; with scan scope off, macros also run unseen by AMSI.
  - id: a166f74e-bf44-409d-b9ba-ea4b2dd8b3cd
    name: Macro Enabled In A Potentially Suspicious Document
    reason: 'Macro enabled in a suspicious document: the document-level trigger that usually precedes this tampering.'
  - id: e3b50fa5-3c3f-444e-937b-0a99d33731cd
    name: Outlook Macro Execution Without Warning Setting Enabled
    reason: Outlook macro execution without warning is the mail-client twin of this bypass.
  - id: b1c50487-1967-4315-a026-6491686d860e
    name: Office Macro File Creation From Suspicious Process
    reason: Macro file written by a suspicious process shows how the weaponised document arrived.
  - id: e6ce8457-68b1-485b-9bdd-3c2b5d679aa9
    name: VBA DLL Loaded Via Office Application
    reason: VBA DLL loaded by an Office app confirms macro code actually ran after the scan was disabled.
  - id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
    name: Potential Persistence Via Microsoft Office Add-In
    reason: Office add-in persistence is a common follow-on once macro execution is unrestricted.
  - id: aa37cbb0-da36-42cb-a90f-fdf216fc7467
    name: AMSI Disabled via Registry Modification
    reason: 'AMSI disabled via registry: macro runtime scanning is delivered through AMSI, so both serve one evasion goal.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office applications spawning script hosts or shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\(winword|excel|powerpnt|outlook|msaccess|onenote)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Office security and trust registry changes (VBAWarnings, AccessVBOM, Trusted Locations)
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*(VBAWarnings|AccessVBOM|TrustedLocations|ProtectedView|BlockContentExecutionFromInternet).*/
    pivot_on: host
    window: 4h
  - name: Files dropped by Office processes
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\(winword|excel|powerpnt|outlook|msaccess|onenote)\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Jj][Ss]|[Vv][Bb][Ss]|[Hh][Tt][Aa]|[Bb][Aa][Tt])/
    pivot_on: host
    window: 2h
  - name: Network connections initiated by Office processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\(winword|excel|powerpnt|outlook|msaccess|onenote)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: VBA runtime DLL loaded into processes
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\([Vv][Bb][Ee]7|[Vv][Bb][Ee]7[Ii][Nn][Tt][Ll])\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 2h
