  - https://github.com/dotnet/runtime/blob/ee2355c801d892f2894b0f7b14a20e6cc50e0e54/docs/design/coreclr/jit/viewing-jit-dumps.md#setting-configuration-variables
  - https://github.com/dotnet/runtime/blob/f62e93416a1799aecc6b0947adad55a0d9870732/src/coreclr/src/inc/clrconfigvalues.h#L35-L38
  - https://github.com/dotnet/runtime/blob/7abe42dc1123722ed385218268bb9fe04556e3d3/src/coreclr/src/inc/clrconfig.h#L33-L39
  - https://github.com/dotnet/runtime/search?p=1&q=COMPlus_&unscoped_q=COMPlus_
  - https://bunnyinside.com/?term=f71e8cb9c76a
  - http://managed670.rssing.com/chan-5590147/all_p1.html
  - https://github.com/dotnet/runtime/blob/4f9ae42d861fcb4be2fcd5d3d55d5f227d30e723/docs/coding-guidelines/clr-jit-coding-conventions.md#1412-disabling-code
  - https://blog.xpnsec.com/hiding-your-dotnet-complus-etwenabled/
  - https://i.blackhat.com/EU-21/Wednesday/EU-21-Teodorescu-Veni-No-Vidi-No-Vici-Attacks-On-ETW-Blind-EDRs.pdf
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    ETW Logging Disabled In .NET Processes - Sysmon Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1112, T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1685
  custom_tags:
    - logging
    - sysmon
    - registry
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\\.[Nn][Ee][Tt][Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\[Ee][Tt][Ww][Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/) OR ((data_win_eventdata_targetObject:/.*\\[Cc][Oo][Mm][Pp][Ll][Uu][Ss]_[Ee][Tt][Ww][Ee][Nn][Aa][Bb][Ll][Ee][Dd]/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Mm][Pp][Ll][Uu][Ss]_[Ee][Tt][Ww][Ff][Ll][Aa][Gg][Ss]/) AND (data_win_eventdata_details:"0" OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 41421f44-58f9-455d-838a-c398859841d4
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    reason: Same ETW tampering done via command line instead of registry
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: Broader ETW trace evasion activity on the host
  - id: aa37cbb0-da36-42cb-a90f-fdf216fc7467
    name: AMSI Disabled via Registry Modification
    reason: AMSI disabled via registry, common companion defense evasion
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: AMSI bypass via .NET reflection often precedes in-memory assembly loads
  - id: cd1f961e-0b96-436b-b7c6-38da4583ec00
    name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
    reason: Logman ETW session tampering is another log-blinding method
  - id: ad89044a-8f49-4673-9a55-cbd88a1b374f
    name: Enabling COR Profiler Environment Variables
    reason: COR_PROFILER hijack is a sibling .NET runtime manipulation
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Windows event logging disabled via registry, same blinding intent
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ETW tamper commandline
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(COMPlus_ETWEnabled|COMPlus_ETWFlags|ETWEnabled).*/
    pivot_on: host
    window: 4h
  - name: In-memory .NET execution tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Assembly\]::Load|Reflection\.Assembly|execute-assembly|Add-Type).*/
    pivot_on: host
    window: 4h
  - name: AMSI/Defender registry tampering
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(AMSI|Windows Defender).*/
    pivot_on: host
    window: 4h
  - name: CLR loaded from user-writable processes
    query: data_win_system_eventID:7 AND data_win_eventdata_imageLoaded:/.*(clr|mscoree|clrjit)\.dll/ AND data_win_eventdata_image:/.*(AppData|Temp|ProgramData|Public).*/
    pivot_on: host
    window: 2h
