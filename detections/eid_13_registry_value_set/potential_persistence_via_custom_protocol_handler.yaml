name: Potential Persistence Via Custom Protocol Handler
id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
version: 1
schema_version: "1.0"
date: "2023-05-12"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential persistence activity via the registering of a new custom
  protocole handlers. While legitimate applications register protocole handlers
  often times during installation. And attacker can abuse this by setting a
  custom handler to be used as a persistence mechanism. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "HKCR\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "URL:*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_details:
                          value: "URL:ms-*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  'HKCR\*'; data_win_eventdata_details matches 'URL:*';
  data_win_eventdata_details matches 'URL:ms-*', among other conditions.

known_false_positives: >
  Many legitimate applications can register a new custom protocol handler.
  Additional filters needs to applied according to your environment. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://ladydebug.com/blog/2019/06/21/custom-protocol-handler-cph/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Potential Persistence Via Custom Protocol Handler detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - persistence
    - custom
    - protocol
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/[Hh][Kk][Cc][Rr]\\.*/ AND data_win_eventdata_details:/[Uu][Rr][Ll]:.*/ AND _exists_:data_win_eventdata_details AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_details:/[Uu][Rr][Ll]:[Mm][Ss]-.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\).*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5cdeb555-65de-4767-99fe-e26807465148
    name: Forest Blizzard APT - Custom Protocol Handler Creation
    reason: Forest Blizzard protocol handler creation is the same registry shape tied to a known actor; a hit upgrades severity.
  - id: d807056b-0e00-4cec-b7f8-b8b7518e382b
    name: Forest Blizzard APT - Custom Protocol Handler DLL Registry Set
    reason: The handler's DLL registry value is the second half of a malicious protocol handler.
  - id: 7530b96f-ad8e-431d-a04d-ac85cc461fdc
    name: Custom File Open Handler Executes PowerShell
    reason: Custom file open handler executing PowerShell is the same class of handler hijack leading to code execution.
  - id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
    name: Registry Modification of MS-settings Protocol Handler
    reason: ms-settings handler registry tampering shows handler hijack used for UAC bypass.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run key persistence by reg.exe often accompanies a handler as a redundant foothold.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell command registrations under HKCR
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(shell.open.command|URL Protocol|DefaultIcon).*/
    pivot_on: host
    window: 6h
  - name: Script or shell launched by browsers and Office
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(chrome|msedge|firefox|outlook|winword|excel|explorer)\.exe/ AND data_win_eventdata_image:/.*(powershell|cmd|wscript|cscript|mshta|rundll32|regsvr32)\.exe/
    pivot_on: host
    window: 6h
  - name: Command lines writing HKCR protocol keys
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(HKCR|HKEY_CLASSES_ROOT|URL Protocol).*/
    pivot_on: host
    window: 2h
  - name: Executables and scripts dropped in writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|vbs|js|hta|bat)/ AND data_win_eventdata_targetFilename:/.*(Temp|AppData|ProgramData|Public).*/
    pivot_on: host
    window: 6h
