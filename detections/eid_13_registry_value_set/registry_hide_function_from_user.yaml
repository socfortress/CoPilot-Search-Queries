name: Registry Hide Function from User
id: 5a93eb65-dffa-4543-b761-94aa60098fb6
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5a93eb65-dffa-4543-b761-94aa60098fb6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry modifications that hide internal tools or functions from the
  user (malware like Agent Tesla, Hermetic Wiper uses this technique). MITRE
  ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideClock"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCAHealth"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCANetwork"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCAPower"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCAVolume"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\ShowInfoTip"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\ShowCompColor"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000000)"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideClock';
  data_win_eventdata_targetObject matches
  '*SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAHealth';
  data_win_eventdata_targetObject matches
  '*SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCANetwork',
  among other conditions.

known_false_positives: >
  Legitimate admin script. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.001/T1564.001.md
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Registry Hide Function from User detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - registry
    - function
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (((data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Hh][Ii][Dd][Ee][Cc][Ll][Oo][Cc][Kk]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Hh][Ii][Dd][Ee][Ss][Cc][Aa][Hh][Ee][Aa][Ll][Tt][Hh]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Hh][Ii][Dd][Ee][Ss][Cc][Aa][Nn][Ee][Tt][Ww][Oo][Rr][Kk]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Hh][Ii][Dd][Ee][Ss][Cc][Aa][Pp][Oo][Ww][Ee][Rr]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Hh][Ii][Dd][Ee][Ss][Cc][Aa][Vv][Oo][Ll][Uu][Mm][Ee]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/) OR ((data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]\\[Ss][Hh][Oo][Ww][Ii][Nn][Ff][Oo][Tt][Ii][Pp]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]\\[Ss][Hh][Oo][Ww][Cc][Oo][Mm][Pp][Cc][Oo][Ll][Oo][Rr]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/))

