name: Outlook Macro Execution Without Warning Setting Enabled
id: e3b50fa5-3c3f-444e-937b-0a99d33731cd
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: "@ScoubiMtl"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e3b50fa5-3c3f-444e-937b-0a99d33731cd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the modification of Outlook security setting to allow unprompted
  execution of macros. MITRE ATT&CK: T1137, T1008, T1546.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Outlook\\\\Security\\\\Level"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*0x00000001*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Outlook\Security\Level'; data_win_eventdata_details matches '*0x00000001*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.mdsec.co.uk/2020/11/a-fresh-outlook-on-mail-based-persistence/
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=53
  - https://attack.mitre.org/techniques/T1137/
  - https://attack.mitre.org/techniques/T1008/
  - https://attack.mitre.org/techniques/T1546/

response:
  message: >
    Outlook Macro Execution Without Warning Setting Enabled detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1137, T1008, T1546
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137
    - T1008
    - T1546
  custom_tags:
    - outlook
    - macro
    - warning
    - registry
    - sysmon
    - privilege_escalation
    - persistence
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Ll][Ee][Vv][Ee][Ll]/ AND data_win_eventdata_details:/.*0[Xx]00000001.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
    name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
    reason: Together they give Outlook VBA persistence that runs silently on startup.
  - id: 117d3d3a-755c-4a61-b23e-9171146d094c
    name: Suspicious Outlook Macro Created
    reason: VbaProject.OTM written by an unusual process is the macro this setting lets run unprompted.
  - id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
    name: New Outlook Macro Created
    reason: Creation of the Outlook macro store file around the time macro security is lowered.
  - id: 9a0b8719-cd3c-4f0a-90de-765a4cb3f5ed
    name: Microsoft VBA For Outlook Addin Loaded Via Outlook
    reason: Confirms Outlook actually loaded VBA after the level was lowered.
  - id: c3cefdf4-6703-4e1c-bad8-bf422fc5015a
    name: Outlook Security Settings Updated - Registry
    reason: Same family of Outlook security-key changes from a non-Office process.
  - id: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08
    name: Outlook EnableUnsafeClientMailRules Setting Enabled - Registry
    reason: Commonly set alongside this Level change.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Execution outcome of an Outlook macro running without warning.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outlook VBA project file written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Vv][Bb][Aa][Pp][Rr][Oo][Jj][Ee][Cc][Tt]\.[Oo][Tt][Mm]/
    pivot_on: host
    window: 6h
  - name: Outlook spawning child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: VBA runtime DLLs loaded by Outlook
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*([Vv][Bb][Ee]7|[Vv][Bb][Ee][Uu][Ii]|[Ss][Cc][Rr][Rr][Uu][Nn]).*/
    pivot_on: host
    window: 4h
  - name: Outlook security registry modifications
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\.*/
    pivot_on: host
    window: 4h
