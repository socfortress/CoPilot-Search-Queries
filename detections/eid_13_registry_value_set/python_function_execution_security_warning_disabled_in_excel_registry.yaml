name: Python Function Execution Security Warning Disabled In Excel - Registry
id: 17e53739-a1fc-4a62-b1b9-87711c2d5e44
version: 1
schema_version: "1.0"
date: "2024-08-23"
author: Nasreddine Bencherchali (Nextron Systems), @Kostastsale
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 17e53739-a1fc-4a62-b1b9-87711c2d5e44
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the registry value "PythonFunctionWarnings" that would
  prevent any warnings or alerts from showing when Python functions are about to
  be executed. Threat actors could run malicious code through the new Microsoft
  Excel feature that allows Python to run within the spreadsheet. MITRE ATT&CK:
  T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Office\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Excel\\\\Security\\\\PythonFunctionWarnings"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Office\*'; data_win_eventdata_targetObject matches
  '*\Excel\Security\PythonFunctionWarnings'; data_win_eventdata_details equals
  'DWORD (0x00000001)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://support.microsoft.com/en-us/office/data-security-and-python-in-excel-33cc88a4-4a87-485e-9ff9-f35958278327
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Python Function Execution Security Warning Disabled In Excel - Registry
    detected on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - python
    - function
    - security
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ee][Xx][Cc][Ee][Ll]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Pp][Yy][Tt][Hh][Oo][Nn][Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 023c654f-8f16-44d9-bb2b-00ff36a62af9
    name: Python Function Execution Security Warning Disabled In Excel
    reason: 'Process-creation twin: the reg.exe/PowerShell command that set PythonFunctionWarnings'
  - id: 91239011-fe3c-4b54-9f24-15c86bb65913
    name: Office Macros Warning Disabled
    reason: Same Office security-prompt weakening (VBA macros) typically changed alongside
  - id: 1a5c46e9-f32f-42f7-b2bc-6e9084db7fbf
    name: Trust Access Disable For VBApplications
    reason: Companion Office trust setting tampering for macro execution
  - id: f742bde7-9528-42e5-bd82-84f51a8387d2
    name: Uncommon Microsoft Office Trusted Location Added
    reason: Attackers add trusted locations so their documents run unprompted
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Excel spawning shells/LOLBins is the follow-on payload execution
  - id: 4dfd6a58-93b2-4012-bb33-038bb63652b3
    name: Windows Excel ActiveMicrosoftApp Child Process
    reason: Excel child process after warnings are suppressed
  - id: 961e33d1-4f86-4fcf-80ab-930a708b2f82
    name: Potential Persistence Via Excel Add-in - Registry
    reason: Excel-based persistence by the same actor
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process that wrote the Excel security value
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*PythonFunctionWarnings.*/ OR /.*Excel.Security.*/)
    pivot_on: host
    window: 1h
  - name: Excel child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ee][Xx][Cc][Ee][Ll]\.exe/
    pivot_on: host
    window: 4h
  - name: Office security setting registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*Office.*Security.*/ OR /.*Trusted Locations.*/ OR /.*VBAWarnings.*/ OR /.*AccessVBOM.*/)
    pivot_on: host
    window: 4h
  - name: Office documents/macros dropped to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.(xlsm|xlsb|xll|xlam|xls|docm)/)
    pivot_on: host
    window: 4h
  - name: Excel outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ee][Xx][Cc][Ee][Ll]\.exe/
    pivot_on: host
    window: 4h
