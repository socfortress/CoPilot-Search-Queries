name: Windows DisableAntiSpyware Registry
id: Windows_DisableAntiSpyware_Registry
version: 1
schema_version: "1.0"
date: "2026-03-27"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects modification of the Windows Registry key DisableAntiSpyware set to
  0x00000001, which disables Windows Defender antispyware protection. This
  activity is commonly associated with ransomware families including Ryuk,
  Azorult, and RedLine Stealer that disable security defenses before executing
  their primary payload. Disabling Windows Defender facilitates further
  malicious activities such as data encryption, credential theft, or exfiltration.

data_source:
  - Sysmon EventID 13 (RegistryEvent Value Set)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*DisableAntiSpyware*"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-27 23:59:59.999"

how_to_implement: >
  Requires Wazuh agents with Sysmon installed and configured to log registry
  value set events (EventID 13). VALIDATED — DisableAntiSpyware = DWORD
  (0x00000001) confirmed via Sysmon EventID 13 with 4 hits using reg.exe.

known_false_positives: >
  It is unusual to disable Windows Defender antispyware on a Windows system.
  Some enterprise policies may disable it in favor of third-party solutions.
  Verify the legitimacy of the change and the process making it.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://blog.malwarebytes.com/malwarebytes-news/2021/02/lazyscripter-from-empire-to-double-rat/

response:
  message: >
    Windows Defender DisableAntiSpyware set to disabled on $agent_name$ by
    $data_win_eventdata_user$ via $data_win_eventdata_image$.
    Registry: $data_win_eventdata_targetObject$.
    MITRE ATT&CK: T1562.001
  risk_score: 24
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 24
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_targetObject
      type: registry_path

tags:
  analytic_story:
    - Azorult
    - Ryuk Ransomware
    - Windows Registry Abuse
    - RedLine Stealer
    - CISA AA22-264A
    - Windows Defense Evasion Tactics
    - CISA AA23-347A
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - windows_defender
    - antispyware_disabled
    - defense_evasion
    - ryuk
    - azorult
    - redline
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*DisableAntiSpyware.*/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Same host usually flips other Defender policy values (DisableRealtimeMonitoring, DisableBehaviorMonitoring) in the same burst as DisableAntiSpyware.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection must be turned off before DisableAntiSpyware sticks on modern builds; co-occurring registry change.
  - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
    name: Windows Defender Service Disabled - Registry
    reason: Disabling the WinDefend/Sense service start value is the follow-on step that makes the AV disablement persistent.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Operators who do not fully disable Defender add path exclusions for the payload; adjacent defense evasion on same host.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: PowerShell Add-MpPreference exclusion is the command-line twin of the registry tamper, often run by the same script.
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: WMIC based Defender tampering is an alternate method used by the same ransomware loaders.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender operational log confirms real-time protection actually went off after the registry write.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ryuk-style ransomware deletes shadow copies right after blinding AV, the next impact step.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender policy values set on host
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Pp]olicies.*[Ww]indows [Dd]efender.*/ AND data_win_eventdata_details:"DWORD (0x00000001)"
    pivot_on: host
    window: 2h
  - name: Defender cmdlets or service stop of Defender
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*([Ss]et|[Aa]dd)-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*(sc|net)(\.exe)? +(stop|config) +(WinDefend|Sense|WdFilter|WdBoot).*/)
    pivot_on: host
    window: 2h
  - name: Shadow copy / backup destruction
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*vssadmin.*[Dd]elete.*[Ss]hadows.*/ OR data_win_eventdata_commandLine:/.*wbadmin.*delete.*/ OR data_win_eventdata_commandLine:/.*bcdedit.*recoveryenabled.*/)
    pivot_on: host
    window: 4h
  - name: Process writing the value via command line
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(reg(\.exe)? +add|powershell|cmd\.exe).*[Dd]isable[Aa]nti[Ss]pyware.*/
    pivot_on: host
    window: 1h
  - name: Payload staging in user-writable paths
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\\[Tt]emp\\.*\.(exe|dll|ps1|bat)/ OR data_win_eventdata_targetFilename:/.*\\[Pp]rogram[Dd]ata\\.*\.(exe|dll|ps1|bat)/)
    pivot_on: host
    window: 2h
