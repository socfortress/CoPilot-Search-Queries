name: Potential Provisioning Registry Key Abuse For Binary Proxy Execution - REG
id: 7021255e-5db3-4946-a8b9-0ba7a4644a69
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7021255e-5db3-4946-a8b9-0ba7a4644a69
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential abuse of the provisioning registry key for indirect command
  execution through "Provlaunch.exe". MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Provisioning\\\\Commands\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Provisioning\Commands\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Provlaunch/
  - https://twitter.com/0gtweet/status/1674399582162153472
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential Provisioning Registry Key Abuse For Binary Proxy Execution - REG
    detected on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - provisioning
    - registry
    - abuse
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Pp][Rr][Oo][Vv][Ii][Ss][Ii][Oo][Nn][Ii][Nn][Gg]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ss]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2a4b3e61-9d22-4e4a-b60f-6e8f0cde6f25
    name: Potential Provisioning Registry Key Abuse For Binary Proxy Execution
    reason: Command-line (reg.exe) view of the same Provisioning Commands write.
  - id: 7f5d1c9a-3e83-48df-95a7-2b98aae6c13c
    name: Potential Provlaunch.EXE Binary Proxy Execution Abuse
    reason: Provlaunch.exe is the trigger that runs the planted registry command; direct follow-on.
  - id: f9999590-1f94-4a34-a91e-951e47bedefd
    name: Suspicious Provlaunch.EXE Child Process
    reason: Shows the payload process spawned by provlaunch after the write.
  - id: 73bba97f-a82d-42ce-b315-9182e76c57b1
    name: Imports Registry Key From a File
    reason: Registry import is an alternate way the Provisioning command may have been planted.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Provlaunch execution and its children
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp]rov[Ll]aunch\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Pp]rov[Ll]aunch\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Command lines referencing Provisioning or provlaunch
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp]rovisioning|[Pp]rov[Ll]aunch).*/
    pivot_on: host
    window: 2h
  - name: Registry values holding executable command content
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss]oftware\\[Mm]icrosoft\\.*/ AND data_win_eventdata_details:/.*([Pp]ower[Ss]hell|[Cc]md\.[Ee][Xx][Ee]|[Rr]undll32|[Mm]shta|[Rr]egsvr32).*/
    pivot_on: host
    window: 2h
  - name: Executable payloads dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Aa]pp[Dd]ata\\|\\[Pp]ublic\\|\\[Pp]rogram[Dd]ata\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt])/
    pivot_on: host
    window: 2h
