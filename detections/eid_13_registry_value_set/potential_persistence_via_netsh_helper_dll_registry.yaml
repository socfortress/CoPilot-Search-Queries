name: Potential Persistence Via Netsh Helper DLL - Registry
id: c90362e0-2df3-4e61-94fe-b37615814cb1
version: 1
schema_version: "1.0"
date: "2025-10-08"
author: Anish Bogati
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c90362e0-2df3-4e61-94fe-b37615814cb1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the Netsh registry key to add a new DLL value. This change
  might be an indication of a potential persistence attempt by adding a
  malicious Netsh helper. MITRE ATT&CK: T1546.007.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\NetSh*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*.dll*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\poqexec.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_details:
                                value: "ipmontr.dll"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "iasmontr.dll"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "ippromon.dll"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\NetSh*'; data_win_eventdata_details matches '*.dll*';
  data_win_eventdata_image equals 'C:\Windows\System32\poqexec.exe', among other
  conditions.

known_false_positives: >
  Legitimate helper added by different programs and the OS. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.ired.team/offensive-security/persistence/t1128-netsh-helper-dll
  - https://pentestlab.blog/2019/10/29/persistence-netsh-helper-dll/
  - https://attack.mitre.org/techniques/T1546/007/

response:
  message: >
    Potential Persistence Via Netsh Helper DLL - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1546.007
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.007
  custom_tags:
    - persistence
    - netsh
    - helper
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Nn][Ee][Tt][Ss][Hh].*/ AND data_win_eventdata_details:/.*\.[Dd][Ll][Ll].*/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Pp][Oo][Qq][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_details:/[Ii][Pp][Mm][Oo][Nn][Tt][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_details:/[Ii][Aa][Ss][Mm][Oo][Nn][Tt][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_details:/[Ii][Pp][Pp][Rr][Oo][Mm][Oo][Nn]\.[Dd][Ll][Ll]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 56321594-9087-49d9-bf10-524fe8479452
    name: Potential Persistence Via Netsh Helper DLL
    reason: Command-line form (netsh add helper) of the same technique; shows who ran it.
  - id: e7b18879-676e-4a0e-ae18-27039185a8e7
    name: New Netsh Helper DLL Registered From A Suspicious Location
    reason: Same registry value, flagged when the DLL path is suspicious; confirms malicious intent.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Helper DLLs load only when netsh runs, so actors add a conventional autorun trigger.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Netsh executions (which load the helper) often coincide with firewall changes by the same operator.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Follow-on netsh use for tunnelling; also runs netsh and thus loads the helper DLL.
  - id: 9d3436ef-9476-4c43-acca-90ce06bdf33a
    name: DHCP Callout DLL Installation
    reason: Same registry-registered system DLL persistence family.
  - id: e61e8a88-59a9-451c-874e-70fcc9740d67
    name: New DNS ServerLevelPluginDll Installed
    reason: 'Same family: service-loaded plugin DLL registered via registry.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: netsh executions with helper arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Hh][Ee][Ll][Pp][Ee][Rr].*/)
    pivot_on: host
    window: 4h
  - name: netsh runs from unusual parents
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 24h
  - name: DLL or EXE dropped to system or user-writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 4h
  - name: netsh loading DLLs outside System32
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee].*/) AND NOT (data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)
    pivot_on: host
    window: 24h
  - name: Autorun persistence on host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Nn][Oo][Tt][Ii][Ff][Yy].*/)
    pivot_on: host
    window: 4h
