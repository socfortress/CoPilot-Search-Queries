name: Kapeka Backdoor Autorun Persistence
id: c0c67b21-eb8a-4c84-a395-40473ec3b482
version: 1
schema_version: "1.0"
date: "2024-07-03"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c0c67b21-eb8a-4c84-a395-40473ec3b482
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the setting of a new value in the Autorun key that is used by the
  Kapeka backdoor for persistence. MITRE ATT&CK: T1547.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Sens Api"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\OneDrive"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_details:
              value: "*:\\\\WINDOWS\\\\system32\\\\rundll32.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*.wll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details: "*#1*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\CurrentVersion\Run*';
  data_win_eventdata_targetObject matches '*\Sens Api';
  data_win_eventdata_targetObject matches '*\OneDrive', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/kapeka
  - https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    Kapeka Backdoor Autorun Persistence detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1547.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - kapeka
    - backdoor
    - autorun
    - registry
    - sysmon
    - privilege_escalation
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Nn][Ss] [Aa][Pp][Ii]/ OR data_win_eventdata_targetObject:/.*\\[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]/) AND data_win_eventdata_details:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_details:/.*\.[Ww][Ll][Ll].*/ AND data_win_eventdata_details:/.*\#1.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
    name: Kapeka Backdoor Execution Via RunDLL32.EXE
    reason: 'The Run value launches the backdoor .wll via rundll32 #1; this is the execution of the persisted payload.'
  - id: a7e6b1f9-8d2c-4f1e-9a7d-63e4c8a2bf4c
    name: Kapeka Backdoor Loaded Via Rundll32.EXE
    reason: Image-load evidence of the Kapeka DLL being loaded by rundll32 after the Run key was set.
  - id: 64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
    name: Kapeka Backdoor Persistence Activity
    reason: Process-creation side of the same persistence step by the dropper.
  - id: 20228d05-dd68-435d-8b4e-e7e64938880c
    name: Potential Kapeka Decrypted Backdoor Indicator
    reason: Decrypted backdoor file written before the autorun registration.
  - id: cbaa3ef3-07a9-4c8e-82d1-9e40578da7fd
    name: Kapeka Backdoor Configuration Persistence
    reason: Sibling Kapeka registry artefact (SIP Seed value) storing backdoor config; both firing confirms the family.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: rundll32 loading .wll
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr]un[Dd][Ll][Ll]32\.exe/ AND data_win_eventdata_commandLine:/.*\.[Ww][Ll][Ll].*/
    pivot_on: host
    window: 24h
  - name: .wll files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ww][Ll][Ll]/
    pivot_on: host
    window: 24h
  - name: Cryptography Providers registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]ryptography\\[Pp]roviders\\.*/
    pivot_on: host
    window: 24h
  - name: Outbound connections from rundll32
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr]un[Dd][Ll][Ll]32\.exe/
    pivot_on: host
    window: 24h
  - name: Scheduled task creation via schtasks
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss]chtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/
    pivot_on: host
    window: 24h
