name: Windows LSA Secrets NoLMHash Registry
id: windows-lsa-nolmhash-registry-001
version: 1
schema_version: "1.0"
date: "2026-02-25"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of LSA NoLMHash registry value to 0, enabling weak 
  LM hash password storage. Adversaries disable NoLMHash to force systems 
  to store credentials in easily crackable LM format. Referenced in CISA 
  AA23-347A and used by Scattered Spider/Lapsus$.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\\\Control\\\\Lsa\\\\NoLMHash"
        - term:
            data_win_eventdata_details: "DWORD (0x00000000)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-25 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-25 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  HKLM\System\CurrentControlSet\Control\Lsa registry path and forwarding 
  to Wazuh.

known_false_positives: >
  Administrators may change this setting. Verify user context and whether 
  change was authorized.

references:
  - https://attack.mitre.org/techniques/T1003/004/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    LSA NoLMHash disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Weak password storage enabled. MITRE ATT&CK: T1003.004
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - CISA AA23-347A
    - Scattered Lapsus$ Hunters
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.004
  custom_tags:
    - lsa_secrets
    - nolmhash
    - registry_modification
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Control.*Lsa.*NoLMHash/ AND data_win_eventdata_details:"DWORD (0x00000000)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c420410f-c2d8-4010-856b-dffe21866437
    name: Enable LM Hash Storage
    reason: Sibling registry detection for the same NoLMHash change; corroborates and may show a different writer.
  - id: 98dedfdd-8333-49d4-9f23-d7018cccae53
    name: Enable LM Hash Storage - ProcCreation
    reason: The command line (reg.exe/PowerShell) that most often performs this registry write.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Credential-exposure weakening is usually paired: WDigest cleartext plus LM hashes before dumping.'
  - id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
    name: Windows Credential Guard Disabled - Registry
    reason: Another credential-protection downgrade preceding credential theft.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The credential harvest that makes weaker hash storage worthwhile.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Likely follow-on dump once passwords are stored in crackable form.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: SAM copying harvests the LM hashes that were enabled.
  - id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
    name: Potential Persistence Via LSA Extensions
    reason: Other LSA-key tampering on the same host suggests broader LSA abuse.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential protection registry downgrades
    query: data_win_system_eventID:13 AND (data_win_eventdata_targetObject:*\\Control\\Lsa\\* OR data_win_eventdata_targetObject:*WDigest* OR data_win_eventdata_targetObject:*CredentialGuard*)
    pivot_on: host
    window: 6h
  - name: LSASS access by processes
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Credential dumping command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]ekurlsa|[Ll]sadump|[Pp]rocdump.*lsass|comsvcs.*[Mm]ini[Dd]ump|reg.* save .*(sam|system|security)).*/
    pivot_on: host
    window: 6h
  - name: Reg.exe edits to Lsa key
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]eg.*\\[Ll][Ss][Aa].*/
    pivot_on: host
    window: 4h
