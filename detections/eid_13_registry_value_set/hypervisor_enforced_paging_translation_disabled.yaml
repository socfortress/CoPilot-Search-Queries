name: Hypervisor Enforced Paging Translation Disabled
id: 7f2954d2-99c2-4d42-a065-ca36740f187b
version: 1
schema_version: "1.0"
date: "2024-07-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7f2954d2-99c2-4d42-a065-ca36740f187b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the "DisableHypervisorEnforcedPagingTranslation" registry
  value. Where the it is set to "1" in order to disable the Hypervisor Enforced
  Paging Translation feature. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\DisableHypervisorEnforcedPagingTranslation"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\DisableHypervisorEnforcedPagingTranslation'; data_win_eventdata_details
  equals 'DWORD (0x00000001)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/standa_t/status/1808868985678803222
  - https://github.com/AaLl86/WindowsInternals/blob/070dc4f317726dfb6ffd2b7a7c121a33a8659b5e/Slides/Hypervisor-enforced%20Paging%20Translation%20-%20The%20end%20of%20non%20data-driven%20Kernel%20Exploits%20(Recon2024).pdf
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Hypervisor Enforced Paging Translation Disabled detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - hypervisor
    - enforced
    - paging
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Hh][Yy][Pp][Ee][Rr][Vv][Ii][Ss][Oo][Rr][Ee][Nn][Ff][Oo][Rr][Cc][Ee][Dd][Pp][Aa][Gg][Ii][Nn][Gg][Tt][Rr][Aa][Nn][Ss][Ll][Aa][Tt][Ii][Oo][Nn]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
    name: Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via CommandLine
    reason: same VBS/HVCI weakening via command line; names the tool that changed the registry
  - id: 555155a2-03bf-4fe7-af74-d176b3fdbe16
    name: Driver Added To Disallowed Images In HVCI - Registry
    reason: 'driver added to HVCI disallowed list: companion hypervisor-protection tampering'
  - id: c17d47b7-dcd6-4109-87eb-d1817bd4cbc9
    name: Windows Credential Guard Registry Tampering Via CommandLine
    reason: 'Credential Guard tampering: both lower kernel protections ahead of credential theft'
  - id: d645ef86-2396-48a1-a2b6-b629ca3f57ff
    name: Windows Credential Guard Related Registry Value Deleted - Registry
    reason: 'Credential Guard registry value deleted: same defense-weakening phase'
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: 'Defender functionality disabled via registry: concurrent security-control tampering'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: VBS / HVCI / Device Guard / LSA protection registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Dd]evice[Gg]uard|[Hh]ypervisor[Ee]nforced[Cc]ode[Ii]ntegrity|[Cc]redential[Gg]uard|[Ll]sa[Cc]fg[Ff]lags|[Rr]un[Aa]s[Pp][Pp][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Boot configuration changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Hh]ypervisor[Ll]aunch[Tt]ype|[Tt]est[Ss]igning|[Nn]ointegritychecks).*/
    pivot_on: host
    window: 6h
  - name: Driver loaded unsigned or from user-writable path
    query: data_win_system_eventID:"6" AND (data_win_eventdata_signed:"false" OR data_win_eventdata_imageLoaded:/.*(\\[Tt]emp\\|\\[Uu]sers\\|\\[Pp]rogram[Dd]ata\\).*/)
    pivot_on: host
    window: 6h
  - name: Kernel driver service creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +[Cc]reate.*[Kk]ernel.*/
    pivot_on: host
    window: 6h
  - name: LSASS process access
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
