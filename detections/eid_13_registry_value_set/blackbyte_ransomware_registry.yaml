name: Blackbyte Ransomware Registry
id: 83314318-052a-4c90-a1ad-660ece38d276
version: 1
schema_version: "1.0"
date: "2025-10-21"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 83314318-052a-4c90-a1ad-660ece38d276
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific windows registry modifications made by BlackByte ransomware
  variants. BlackByte set three different registry values to escalate privileges
  and begin setting the stage for lateral movement and encryption. This rule
  triggers when any of the following registry keys are set to DWORD 1, however
  all three should be investigated as part of a larger BlackByte ransomware
  detection and response effort. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_targetObject:
                    value: "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\LocalAccountTokenFilterPolicy"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetObject:
                    value: "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\EnableLinkedConnections"
                    case_insensitive: true
              - term:
                  data_win_eventdata_targetObject:
                    value: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\FileSystem\\LongPathsEnabled"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000001)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject equals
  'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LocalAccountTokenFilterPolicy';
  data_win_eventdata_targetObject equals
  'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLinkedConnections';
  data_win_eventdata_targetObject equals
  'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem\LongPathsEnabled', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/blackbyte-ransomware/?utm_source=twitter&utm_medium=social
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/blackbyte-ransomware-pt-1-in-depth-analysis/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Blackbyte Ransomware Registry detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - blackbyte
    - ransomware
    - registry
    - sysmon
    - persistence
    - defense_impairment
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ll][Oo][Cc][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Tt][Oo][Kk][Ee][Nn][Ff][Ii][Ll][Tt][Ee][Rr][Pp][Oo][Ll][Ii][Cc][Yy]/ OR data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ee][Nn][Aa][Bb][Ll][Ee][Ll][Ii][Nn][Kk][Ee][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss]/ OR data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ff][Ii][Ll][Ee][Ss][Yy][Ss][Tt][Ee][Mm]\\[Ll][Oo][Nn][Gg][Pp][Aa][Tt][Hh][Ss][Ee][Nn][Aa][Bb][Ll][Ee][Dd]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 999e8307-a775-4d5f-addc-4855632335be
    name: Potential BlackByte Ransomware Activity
    reason: Process-level BlackByte indicator; these registry values are set in the same pre-encryption stage.
  - id: windows-modify-registry-enable-linked-connections-001
    name: Windows Modify Registry EnableLinkedConnections
    reason: EnableLinkedConnections is one of the three BlackByte values; dedicated variant of the same behaviour.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion is the standard ransomware step after staging.
  - id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
    name: Windows Backup Deleted Via Wbadmin.EXE
    reason: Backup deletion via wbadmin prevents recovery before encryption.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Bcdedit boot tampering commonly runs in the same pre-encryption script.
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: Admin share mounts are how LocalAccountTokenFilterPolicy changes get used for lateral movement.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec remote execution is the typical spread mechanism after remote UAC filtering is disabled.
  - id: 8b9606c9-28be-4a38-b146-0e313cc232c1
    name: Potential Ransomware Activity Using LegalNotice Message
    reason: Ransom legal notice registry message appears at the encryption stage.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Vv]ssadmin.*[Dd]elete|[Ww]badmin.*[Dd]elete|[Ss]hadow.*[Dd]elete|[Bb]cdedit.*([Rr]ecovery|[Ii]gnoreall)).*/
    pivot_on: host
    window: 24h
  - name: Admin share and remote service execution
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Aa][Dd][Mm][Ii][Nn]\$|[Pp]s[Ee]xec).*/
    pivot_on: host
    window: 24h
  - name: Ransom note creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Rr]eadme|[Rr]estore|[Dd]ecrypt|[Bb]lack[Bb]yte|[Rr]ansom).*\.(txt|hta|html)/
    pivot_on: host
    window: 24h
  - name: Stopping security and backup services
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net1? stop|sc.* (stop|config)|taskkill).*(sql|veeam|backup|defend|sophos|vss).*/
    pivot_on: host
    window: 24h
  - name: Related privilege hardening registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Policies.System|LongPathsEnabled|Terminal Server|Windows Defender).*/
    pivot_on: host
    window: 24h
