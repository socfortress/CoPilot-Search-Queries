] \([Xx]86\)\\[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss].*/ OR data_win_eventdata_details:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee]\\[Rr][Oo][Oo][Tt]\\[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_details:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee]\\[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss]\\.*/)

