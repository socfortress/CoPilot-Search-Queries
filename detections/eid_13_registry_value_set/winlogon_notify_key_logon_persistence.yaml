name: Winlogon Notify Key Logon Persistence
id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may abuse features of Winlogon to execute DLLs and/or executables
  when a user logs in. Winlogon.exe is a Windows component responsible for
  actions at logon/logoff as well as the secure attention sequence (SAS)
  triggered by Ctrl-Alt-Delete. MITRE ATT&CK: T1547.004.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\Notify\\\\logon"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Notify\logon';
  data_win_eventdata_details matches '*.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.004/T1547.004.md#atomic-test-3---winlogon-notify-key-logon-persistence---powershell
  - https://attack.mitre.org/techniques/T1547/004/

response:
  message: >
    Winlogon Notify Key Logon Persistence detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1547.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.004
  custom_tags:
    - winlogon
    - notify
    - logon
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Nn][Oo][Tt][Ii][Ff][Yy]\\[Ll][Oo][Gg][Oo][Nn]/ AND data_win_eventdata_details:/.*\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c9b86500-1ec2-4de6-9120-d744c8fb5caf
    name: Potential KamiKakaBot Activity - Winlogon Shell Persistence
    reason: Other Winlogon value hijack (Shell) used for logon-time execution
  - id: cbf93e5d-ca6c-4722-8bea-e9119007c248
    name: CurrentVersion NT Autorun Keys Modification
    reason: Covers Winlogon Userinit/Shell and related NT autostart values often set together
  - id: 9ace0707-b560-49b8-b6ca-5148b42f39fb
    name: Potential Persistence Via Logon Scripts - Registry
    reason: Alternative logon-triggered persistence added for redundancy
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Run key persistence commonly paired with Winlogon abuse
  - id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
    name: Persistence Via New SIP Provider
    reason: Another registry-registered DLL persistence mechanism
  - id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
    name: Potential Persistence Via LSA Extensions
    reason: DLL persistence loaded in the privileged logon path, similar autoload
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Winlogon registry value changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ww]inlogon.*/
    pivot_on: host
    window: 6h
  - name: DLL written to System32 or user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND data_win_eventdata_targetFilename:(/.*\\[Ss]ystem32\\.*/ OR /.*\\[Tt]emp\\.*/ OR /.*\\[Pp]rogram[Dd]ata\\.*/)
    pivot_on: host
    window: 6h
  - name: reg.exe writes to Winlogon
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]eg.* [Aa]dd.*[Ww]inlogon.*/
    pivot_on: host
    window: 4h
  - name: Non-system DLL loaded by winlogon.exe
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*\\winlogon\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww]indows\\.*/
    pivot_on: host
    window: 24h
  - name: Interactive logons after the change
    query: data_win_system_eventID:(4624 OR 4648) AND data_win_eventdata_logonType:(2 OR 10 OR 11)
    pivot_on: user
    window: 24h
