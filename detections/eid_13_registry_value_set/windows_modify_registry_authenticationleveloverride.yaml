name: Windows Modify Registry AuthenticationLevelOverride
id: windows-modify-registry-authenticationleveloverride-001
version: 1
schema_version: "1.0"
date: "2026-02-25"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of Terminal Server Client AuthenticationLevelOverride 
  registry value to 0, disabling RDP authentication level checks. Used by 
  DarkGate malware to enable unauthorized remote connections.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\\\Terminal Server Client\\\\AuthenticationLevelOverride"
        - term:
            data_win_eventdata_details: "DWORD (0x00000000)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-25 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-25 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Terminal Server Client registry paths. Note: HKCU paths appear as 
  HKU\<SID>\SOFTWARE\ in Sysmon logs.

known_false_positives: >
  Administrators may change this setting. Uncommon in normal operations.

references:
  - https://attack.mitre.org/techniques/T1112/
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.darkgate

response:
  message: >
    RDP AuthenticationLevelOverride disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    DarkGate indicator. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - registry_modification
    - rdp_auth_bypass
    - darkgate
    - terminal_server
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Terminal Server Client.*AuthenticationLevelOverride/ AND data_win_eventdata_details:"DWORD (0x00000000)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-disable-rdp-001
    name: Windows Modify Registry Disable RDP
    reason: Adjacent RDP registry tampering on the same host indicates broader RDP reconfiguration.
  - id: a2863fbc-d5cb-48d5-83fb-d976d4b1743b
    name: RDP Sensitive Settings Changed to Zero
    reason: Weakening RDP settings commonly occurs in the same sweep as the AuthenticationLevelOverride write.
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: Parallel RDP configuration change corroborating enablement of remote access.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Process-creation view of the reg.exe commands doing this change.
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: DarkGate creates a local user to use with RDP alongside this registry change.
  - id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
    name: DarkGate - Autoit3.EXE Execution Parameters
    reason: DarkGate's AutoIt stage precedes its RDP-enablement tweaks.
  - id: windows-modify-registry-disable-restricted-admin-001
    name: Windows Modify Registry Disable Restricted Admin
    reason: Related remote-logon hardening removal used for pass-the-hash RDP.
  - id: 509e84b9-a71a-40e0-834f-05470369bd1e
    name: Default RDP Port Changed to Non Standard Port
    reason: Port change often follows to hide newly enabled RDP access.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RDP / Terminal Server registry changes
    query: data_win_system_eventID:13 AND (data_win_eventdata_targetObject:*\\Terminal Server* OR data_win_eventdata_targetObject:*TermService* OR data_win_eventdata_targetObject:*fDenyTSConnections*)
    pivot_on: host
    window: 6h
  - name: Local account creation and admin group adds
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Nn]et1?(\.[Ee][Xx][Ee])? .*(user .*\/add|localgroup.*\/add).*/
    pivot_on: host
    window: 6h
  - name: Firewall rules opening RDP
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Nn]etsh.*(3389|[Rr]emote [Dd]esktop)|[Nn]ew-[Nn]et[Ff]irewall[Rr]ule.*3389).*/
    pivot_on: host
    window: 6h
  - name: Inbound connections to RDP port
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:3389 AND data_win_eventdata_initiated:false
    pivot_on: host
    window: 24h
