name: Bypass UAC Using SilentCleanup Task
id: 724ea201-6514-4f38-9739-e5973c34f49a
version: 1
schema_version: "1.0"
date: "2024-01-30"
author: frack113, Nextron Systems
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 724ea201-6514-4f38-9739-e5973c34f49a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the setting of the environement variable "windir" to a non default
  value. Attackers often abuse this variable in order to trigger a UAC bypass
  via the "SilentCleanup" task. The SilentCleanup task located in
  %windir%\system32\cleanmgr.exe is an auto-elevated task that can be abused to
  elevate any file with administrator privileges without prompting UAC. MITRE
  ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Environment\\\\windir"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "%SystemRoot%"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Environment\windir'; data_win_eventdata_details equals '%SystemRoot%'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1548.002/T1548.002.md#atomic-test-9---bypass-uac-using-silentcleanup-task
  - https://www.reddit.com/r/hacking/comments/ajtrws/bypassing_highest_uac_level_windows_810/
  - https://www.fortinet.com/blog/threat-research/enter-the-darkgate-new-cryptocurrency-mining-and-ransomware-campaign
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Bypass UAC Using SilentCleanup Task detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - silentcleanup
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\\[Ww][Ii][Nn][Dd][Ii][Rr]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b697e69c-746f-4a86-9f59-7bfff8eab881
    name: UAC Bypass Using Disk Cleanup
    reason: Execution-side detection of the cleanmgr/SilentCleanup bypass this env-var write enables.
  - id: ad89044a-8f49-4673-9a55-cbd88a1b374f
    name: Enabling COR Profiler Environment Variables
    reason: 'Same technique class: attacker-controlled user environment variable abused for privileged execution.'
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: Registry tampering by suspicious processes identifies the writer.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe implements the SilentCleanup method.
  - id: 3268b746-88d8-4cd3-bffc-30077d02c787
    name: HackTool - Empire PowerShell UAC Bypass
    reason: Empire UAC bypass tooling that sets such values.
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: DelegateExecute hijack, a sibling HKCU UAC bypass tried together.
  - id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
    name: Bypass UAC Using Event Viewer
    reason: Event Viewer hijack, another HKCU UAC bypass from the same toolkits.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated system shell spawned from an unusual parent is the likely outcome.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SilentCleanup task run or cleanmgr/dismhost activity
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Cc][Ll][Ee][Aa][Nn][Uu][Pp].*/) OR data_win_eventdata_parentImage:/.*\\([Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]|[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 1h
  - name: Shells spawned under cleanmgr or task host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]|[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]|[Tt][Aa][Ss][Kk][Ee][Nn][Gg])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Ii][Ee][Xx][Ee][Cc])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: User environment variable changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\\.*/
    pivot_on: host
    window: 2h
  - name: High-integrity process from user-writable parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_integrityLevel:"High" AND (data_win_eventdata_parentImage:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 2h
  - name: Post-elevation Defender tamper, persistence and account creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee]).*/
    pivot_on: host
    window: 4h
