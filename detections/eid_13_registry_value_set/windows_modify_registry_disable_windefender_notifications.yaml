name: Windows Modify Registry Disable WinDefender Notifications
id: windows-modify-registry-disable-windefender-notifications-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of DisableNotifications registry value to 1 under 
  Windows Defender Security Center Notifications policy. Disabling Defender 
  notifications prevents users from seeing security alerts, enabling adversaries 
  to operate undetected. Used by RedLine Stealer and referenced in CISA AA23-347A.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Windows Defender Security Center\\Notifications\\DisableNotifications"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Policies\Microsoft registry paths. Ensure Sysmon config includes 
  Policies\Microsoft in EventID 13 TargetObject rules.

known_false_positives: >
  Administrators may configure this via Group Policy. Investigate 
  process and user context.

references:
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.redline_stealer
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Windows Defender notifications disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Defender evasion. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - CISA AA23-347A
    - RedLine Stealer
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_defender
    - disable_notifications
    - defender_evasion
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Windows Defender Security Center.*Notifications.*DisableNotifications/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
    name: Disable Windows Security Center Notifications
    reason: Disabling Security Center notifications is the sibling suppression technique used in the same stealer chains.
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: Another Security Center notification suppression value; two together show deliberate user-alert blinding.
  - id: 1cd983c8-8fd6-11ec-a09d-acde48001122
    name: Windows Disable Notification Center
    reason: Notification Center disable completes the quiet-the-user pattern around Defender alerts.
  - id: Windows_DisableAntiSpyware_Registry
    name: Windows DisableAntiSpyware Registry
    reason: Notification muting is typically paired with disabling the engine itself.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Exclusions added by registry follow so payloads run unseen once alerts are hidden.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection disable enables the other policy writes.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: PowerShell-driven exclusions from the same stealer loader.
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: A Defender threat detection nearby shows what the suppression was meant to hide.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Security Center and notification suppression values
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(Notifications|ImmersiveShell|Security Center|Action Center|Notification Center).*(Disable|UseActionCenterExperience|Enabled).*/
    pivot_on: host
    window: 4h
  - name: Defender exclusions or preference tampering by command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|[Rr]emove-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime|[Ee]xclusion[Pp]ath).*/
    pivot_on: host
    window: 2h
  - name: Browser credential store access (stealer behaviour)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(Login Data|Cookies|Web Data|logins\.json|key4\.db|wallet\.dat).*/
    pivot_on: host
    window: 4h
  - name: Outbound connections from user-writable executables
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\(AppData|Temp|ProgramData|Public)\\.*/
    pivot_on: host
    window: 4h
  - name: Run key persistence set in the same window
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*CurrentVersion\\Run.*/
    pivot_on: host
    window: 4h
