name: Windows Modify Registry DisableSecuritySettings
id: windows-modify-registry-disable-security-settings-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of DisableSecuritySettings registry value to 1 under 
  Terminal Services settings. Altering this weakens the security posture of 
  Remote Desktop Services, potentially allowing unauthorized remote access. 
  Used by DarkGate malware and referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Terminal Server\\DisableSecuritySettings"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Terminal Server registry paths. Add Control\Terminal Server\Disable to 
  Sysmon EventID 13 TargetObject rules if not already present.

known_false_positives: >
  Administrators may configure Terminal Services security settings. 
  Uncommon setting — investigate process and user context.

references:
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.darkgate
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Terminal Services security settings disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    Possible DarkGate. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - CISA AA23-347A
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - terminal_server
    - security_settings
    - darkgate
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Terminal Server.*DisableSecuritySettings/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2863fbc-d5cb-48d5-83fb-d976d4b1743b
    name: RDP Sensitive Settings Changed to Zero
    reason: RDP sensitive settings set to zero opens inbound RDP in the same weakening step.
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: Other RDP sensitive settings changed on this host indicate scripted RDP loosening.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: reg.exe route to RDP key edits, showing who ran it.
  - id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
    name: RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class
    reason: Enabling RDP via the WMI TerminalServiceSetting class is an alternate means of the same goal.
  - id: 37b437cf-3fc5-4c8e-9c94-1d7c9aff842b
    name: Allow RDP Remote Assistance Feature
    reason: Remote Assistance enablement is a related remote-access opening.
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: DarkGate user creation provides the account used for the remote session.
  - id: 509e84b9-a71a-40e0-834f-05470369bd1e
    name: Default RDP Port Changed to Non Standard Port
    reason: RDP port changed to a non-standard port often accompanies hiding the exposed service.
  - id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
    name: DarkGate - Autoit3.EXE Execution Parameters
    reason: DarkGate AutoIt3 loader parameters tie the change to the malware family.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Terminal Services policy registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(Terminal Server|Terminal Services|fDenyTSConnections|UserAuthentication|SecurityLayer).*/
    pivot_on: host
    window: 6h
  - name: Account creation and admin group membership
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*net1?(\.exe)? +(user|localgroup).*\/add.*/
    pivot_on: host
    window: 6h
  - name: Firewall rule opening RDP
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*netsh.*(3389|Remote Desktop|portopening|portproxy).*/
    pivot_on: host
    window: 6h
  - name: Inbound RDP connections to host
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389" AND data_win_eventdata_initiated:"false"
    pivot_on: host
    window: 6h
  - name: Remote access tools launched
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(AnyDesk|TeamViewer|ScreenConnect|UltraVNC|Splashtop|NetSupport).*/
    pivot_on: host
    window: 6h
