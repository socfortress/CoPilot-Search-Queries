name: Disabled Windows Defender Eventlog
id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the disabling of the Windows Defender eventlog as seen in relation to
  Lockbit 3.0 infections. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\Microsoft-Windows-Windows Defender/Operational\\\\Enabled*"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows
  Defender/Operational\Enabled*'; data_win_eventdata_details equals 'DWORD
  (0x00000000)'.

known_false_positives: >
  Other Antivirus software installations could cause Windows to disable that
  eventlog (unknown). Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://twitter.com/WhichbufferArda/status/1543900539280293889/photo/2
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Disabled Windows Defender Eventlog detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - eventlog
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\/[Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn][Aa][Ll]\\[Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Same actor typically turns off Defender features itself; blinding the log and disabling the engine are paired steps.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection must be off before Defender settings or its log channel can be changed, so it usually precedes this.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Exclusions are the quieter sibling step in the same Defender-evasion playbook (LockBit prep).
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Broader log suppression on the same host; shows whether only Defender or all logging was silenced.
  - id: 7d9263bd-dc47-4a58-bc92-5474abab390c
    name: Change Winevt Channel Access Permission Via Registry
    reason: Another WINEVT channel tamper via the same registry hive, used to hide telemetry.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: 'Follow-on anti-forensics: after disabling logging, logs already written are wiped.'
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Process-level way to flip the same channel Enabled flag; shows the command line and parent.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Ransomware impact stage (recovery disabling) that follows defence evasion in LockBit intrusions.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender and security-tool disabling in registry
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ww]indows [Dd]efender|[Ww]in[Dd]efend).*/ AND data_win_eventdata_details:/.*0x0000000[01].*/
    pivot_on:
    - host
    window: 2h
  - name: Defender tamper via PowerShell, sc or reg commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime|[Ww]in[Dd]efend|[Ee]xclusion).*/
    pivot_on:
    - host
    window: 2h
  - name: Event log clearing and log service tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]evtutil.*( cl | clear-log| sl | set-log).*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on:
    - host
    window: 4h
  - name: Shadow copy and recovery destruction (ransomware impact)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv]ssadmin.*[Dd]elete|[Ss]hadowcopy.*[Dd]elete|[Bb]cdedit.*([Rr]ecoveryenabled|[Bb]ootstatuspolicy)|[Ww]badmin.*[Dd]elete).*/
    pivot_on:
    - host
    window: 6h
