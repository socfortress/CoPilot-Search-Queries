name: UAC Bypass Abusing Winsat Path Parsing - Registry
id: 6597be7b-ac61-4ac8-bef4-d3ec88174853
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6597be7b-ac61-4ac8-bef4-d3ec88174853
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using a path parsing issue in winsat.exe
  (UACMe 52). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Root\\\\InventoryApplicationFile\\\\winsat.exe|*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\LowerCaseLongPath"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "c:\\\\users\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*\\\\appdata\\\\local\\\\temp\\\\system32\\\\winsat.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Root\InventoryApplicationFile\winsat.exe|*';
  data_win_eventdata_targetObject matches '*\LowerCaseLongPath';
  data_win_eventdata_details matches 'c:\users\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Abusing Winsat Path Parsing - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - abusing
    - winsat
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Rr][Oo][Oo][Tt]\\[Ii][Nn][Vv][Ee][Nn][Tt][Oo][Rr][Yy][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ff][Ii][Ll][Ee]\\[Ww][Ii][Nn][Ss][Aa][Tt]\.[Ee][Xx][Ee]\|.*/ AND data_win_eventdata_targetObject:/.*\\[Ll][Oo][Ww][Ee][Rr][Cc][Aa][Ss][Ee][Ll][Oo][Nn][Gg][Pp][Aa][Tt][Hh]/ AND data_win_eventdata_details:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ss][Aa][Tt]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: This winsat trick is a UACME method; Akagi is the tool that implements it.
  - id: 6ea3bf32-9680-422d-9f50-e90716b12a66
    name: UAC Bypass Via Wsreset
    reason: Sibling UAC bypass an actor tries when one fails.
  - id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
    name: Bypass UAC Using Event Viewer
    reason: Alternative registry-based UAC bypass tried in the same session.
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: Another registry-hijack elevation commonly attempted alongside.
  - id: 724ea201-6514-4f38-9739-e5973c34f49a
    name: Bypass UAC Using SilentCleanup Task
    reason: Alternative elevation route in the same toolkit.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: 'Follow-on: the elevated shell the bypass is meant to yield.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: winsat.exe process activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ww][Ii][Nn][Ss][Aa][Tt]\.[Ee][Xx][Ee]).*/ OR data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ss][Aa][Tt]\.[Ee][Xx][Ee]).*/)
    pivot_on: host
    window: 2h
  - name: Fake system32 directory under user temp
    query: (data_win_system_eventID:"11" OR data_win_system_eventID:"1") AND (data_win_eventdata_targetFilename:/.*(\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\).*/ OR data_win_eventdata_commandLine:/.*(\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\).*/)
    pivot_on: host
    window: 2h
  - name: Other known UAC bypass registry hijacks
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Mm][Ss][Cc][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Ff][Oo][Ll][Dd][Ee][Rr]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Ee][Xx][Ee][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy] [Aa][Ss][Ss][Ii][Ss][Tt][Aa][Nn][Tt]\\[Ss][Tt][Oo][Rr][Ee].*/)
    pivot_on: host
    window: 2h
  - name: High-integrity shells spawned from auto-elevating binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ss][Aa][Tt]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]).*/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 1h
