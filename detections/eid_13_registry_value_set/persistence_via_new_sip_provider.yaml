name: Persistence Via New SIP Provider
id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker register a new SIP provider for persistence and
  defense evasion. MITRE ATT&CK: T1553.003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Cryptography\\\\Providers\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Cryptography\\\\OID\\\\EncodingType*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\WOW6432Node\\\\Microsoft\\\\Cryptography\\\\Providers\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\WOW6432Node\\\\Microsoft\\\\Cryptography\\\\OID\\\\EncodingType*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\$DLL*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_details"
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details:
                          value: "WINTRUST.DLL"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "mso.dll"
                          case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\System32\\poqexec.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\CryptSIPDll*"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "C:\\Windows\\System32\\PsfSip.dll"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Cryptography\Providers\*';
  data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Cryptography\OID\EncodingType*';
  data_win_eventdata_targetObject matches
  '*\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Providers\*', among other
  conditions.

known_false_positives: >
  Legitimate SIP being registered by the OS or different software. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://persistence-info.github.io/Data/codesigning.html
  - https://github.com/gtworek/PSBits/tree/master/SIP
  - https://specterops.io/assets/resources/SpecterOps_Subverting_Trust_in_Windows.pdf
  - https://attack.mitre.org/techniques/T1553/003/

response:
  message: >
    Persistence Via New SIP Provider detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1553.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.003
  custom_tags:
    - persistence
    - provider
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Oo][Ii][Dd]\\[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg][Tt][Yy][Pp][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Oo][Ii][Dd]\\[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg][Tt][Yy][Pp][Ee].*/) AND (data_win_eventdata_targetObject:/.*\\[Dd][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*\\\$[Dd][Ll][Ll].*/) AND _exists_:data_win_eventdata_details AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND NOT (data_win_eventdata_details:/[Ww][Ii][Nn][Tt][Rr][Uu][Ss][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_details:/[Mm][Ss][Oo]\.[Dd][Ll][Ll]/ OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Pp][Oo][Qq][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Cc][Rr][Yy][Pp][Tt][Ss][Ii][Pp][Dd][Ll][Ll].*/ AND data_win_eventdata_details:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Pp][Ss][Ff][Ss][Ii][Pp]\.[Dd][Ll][Ll]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 295a59c1-7b79-4b47-a930-df12c15fc9c2
    name: Windows Registry Trust Record Modification
    reason: Sibling trust-control subversion (Office trust records); both aim to make untrusted code look trusted.
  - id: d223b46b-5621-4037-88fe-fda32eead684
    name: New Root or CA or AuthRoot Certificate to Store
    reason: Installing a rogue root cert is the other half of faking signature trust alongside a malicious SIP/trust provider.
  - id: 242301bc-f92f-4476-8718-78004a6efd9f
    name: DLL Loaded via CertOC.EXE
    reason: CertOC loads arbitrary DLLs via crypto plumbing; used as proxy execution near SIP/crypto abuse.
  - id: 84232095-ecca-4015-b0d7-7726507ee793
    name: Suspicious DLL Loaded via CertOC.EXE
    reason: Same CertOC proxy-load pattern with a suspicious DLL path, a likely way the SIP DLL is staged or exercised.
  - id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
    name: Unsigned DLL Loaded by Windows Utility
    reason: The SIP DLL is attacker-supplied and typically unsigned; shows when system utilities load it during signature verification.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other crypto OID/trust provider registry edits
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Oo][Ii][Dd]|[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss]|[Ww][Ii][Nn][Tt][Rr][Uu][Ss][Tt]\\[Tt][Rr][Uu][Ss][Tt] [Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss]|[Cc][Rr][Yy][Pp][Tt][Ss][Ii][Pp][Dd][Ll][Ll]|[Ff][Ii][Nn][Aa][Ll][Pp][Oo][Ll][Ii][Cc][Yy]).*/
    pivot_on: host
    window: 24h
  - name: SIP/crypto key edits from command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Rr][Yy][Pp][Tt][Ss][Ii][Pp][Dd][Ll][Ll]|[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Oo][Ii][Dd]|[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss]|[Ff][Ii][Nn][Aa][Ll][Pp][Oo][Ll][Ii][Cc][Yy]).*/
    pivot_on: host
    window: 24h
  - name: Unsigned DLLs loaded from writable locations
    query: data_win_system_eventID:"7" AND data_win_eventdata_signed:"false" AND data_win_eventdata_imageLoaded:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\).*/
    pivot_on: host
    window: 24h
  - name: DLLs dropped to disk before registration
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\.[Dd][Ll][Ll]).*/ AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\).*/
    pivot_on: host
    window: 6h
  - name: Certificate store and signing tool activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Ss][Ii][Gg][Nn][Tt][Oo][Oo][Ll]|[Ss][Ii][Gg][Cc][Hh][Ee][Cc][Kk]|-[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee]|[Cc][Ee][Rr][Tt][Mm][Gg][Rr]|[Ii][Mm][Pp][Oo][Rr][Tt]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee]).*/
    pivot_on: host
    window: 24h
