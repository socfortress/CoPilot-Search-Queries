name: Change User Account Associated with the FAX Service
id: e3fdf743-f05b-4051-990a-b66919be1743
version: 1
schema_version: "1.0"
date: "2022-12-30"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e3fdf743-f05b-4051-990a-b66919be1743
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect change of the user account associated with the FAX service to avoid the
  escalation problem. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - term:
            data_win_eventdata_targetObject:
              value: "HKLM\\System\\CurrentControlSet\\Services\\Fax\\ObjectName"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*NetworkService*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject equals
  'HKLM\System\CurrentControlSet\Services\Fax\ObjectName';
  data_win_eventdata_details matches '*NetworkService*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/dottor_morte/status/1544652325570191361
  - https://raw.githubusercontent.com/RiccardoAncarani/talks/master/F-Secure/unorthodox-lateral-movement.pdf
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Change User Account Associated with the FAX Service detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - change
    - account
    - associated
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ff][Aa][Xx]\\[Oo][Bb][Jj][Ee][Cc][Tt][Nn][Aa][Mm][Ee]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e3357ba-09d4-4fbd-a7c5-ad6386314513
    name: Change the Fax Dll
    reason: 'Sibling Fax tampering: Fax service DLL path swapped in the same registry hive, an alternative route to code execution under the Fax service.'
  - id: 828af599-4c53-4ed2-ba4a-a9f835c434ea
    name: Fax Service DLL Search Order Hijack
    reason: Fax service loading a planted DLL (search order hijack) is the exploitation step that runs code under the changed account.
  - id: 98c5aeef-32d5-492f-b174-64a691896d25
    name: Service Security Descriptor Tampering Via Sc.EXE
    reason: Service security descriptor tampering via sc.exe commonly accompanies reconfiguring a service for persistence/escalation.
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: 'Reg.exe changing a service ImagePath: same service-registry tampering pattern, often the other half of a Fax service hijack.'
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: 'Existing-service tampering for persistence: generic precursor/follow-on once a service config is altered.'
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: 'Service start type change via sc.exe: attacker enabling the dormant Fax service so the new account takes effect.'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Fax service registry configuration changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ss]ervices\\[Ff]ax\\.*/
    pivot_on: host
    window: 24h
  - name: Service control commands touching Fax
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]c|[Nn]et|[Pp]ower[Ss]hell).*[Ff]ax.*/
    pivot_on: host
    window: 6h
  - name: Fax service process start and children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ss]ervices\.exe/ AND data_win_eventdata_commandLine:/.*[Ff]ax.*/
    pivot_on: host
    window: 6h
  - name: Service ImagePath or account changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentControlSet\\Services\\.*\\(ImagePath|ObjectName)/
    pivot_on: host
    window: 4h
