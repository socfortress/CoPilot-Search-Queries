name: Potential Persistence Via Outlook Home Page
id: ddd171b5-2cc6-4975-9e78-f0eccd08cc76
version: 1
schema_version: "1.0"
date: "2024-08-07"
author: Tobias Michalski (Nextron Systems), David Bertho (@dbertho) & Eirik Sveen (@0xSV1), Storebrand
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ddd171b5-2cc6-4975-9e78-f0eccd08cc76
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential persistence activity via outlook home page. An attacker can
  set a home page to achieve code execution and persistence by editing the
  WebView registry keys. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Office\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Outlook\\\\WebView\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\URL"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Office\*'; data_win_eventdata_targetObject matches
  '*\Outlook\WebView\*'; data_win_eventdata_targetObject matches '*\URL'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=70
  - https://support.microsoft.com/en-us/topic/outlook-home-page-feature-is-missing-in-folder-properties-d207edb7-aa02-46c5-b608-5d9dbed9bd04?ui=en-us&rs=en-us&ad=us
  - https://trustedsec.com/blog/specula-turning-outlook-into-a-c2-with-one-registry-change
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Potential Persistence Via Outlook Home Page detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - persistence
    - outlook
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ww][Ee][Bb][Vv][Ii][Ee][Ww]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Uu][Rr][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 487bb375-12ef-41f6-baae-c6a1572b4dd1
    name: Potential Persistence Via Outlook Today Page
    reason: Sibling Outlook Today/WebView hijack with the same Outlook rendering-based execution.
  - id: c3edc6a5-d9d4-48d8-930e-aab518390917
    name: Potential Persistence Via Outlook Form
    reason: Another Outlook-based persistence (custom forms) used for the same foothold.
  - id: fedb49c4-4bd7-4d42-8fd9-f8c8538c73c4
    name: Windows InProcServer32 New Outlook Form
    reason: Registry side of Outlook form persistence; actors combine forms and homepage for redundancy.
  - id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
    name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
    reason: Outlook macro persistence setting often changed alongside homepage tampering.
  - id: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08
    name: Outlook EnableUnsafeClientMailRules Setting Enabled - Registry
    reason: Outlook security-weakening setting used in the Ruler/homepage attack toolchain.
  - id: c3cefdf4-6703-4e1c-bad8-bf422fc5015a
    name: Outlook Security Settings Updated - Registry
    reason: Weakening Outlook security so the homepage script executes.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: 'Execution outcome: the homepage payload spawns child processes from OUTLOOK.EXE.'
  - id: fabb0e80-030c-4e3e-a104-d09676991ac3
    name: Suspicious File Created in Outlook Temporary Directory
    reason: Staging of attachments/payloads in the Outlook temp directory around the homepage change.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outlook WebView, Today and security registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ww][Ee][Bb][Vv][Ii][Ee][Ww]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Tt][Oo][Dd][Aa][Yy].*/ OR data_win_eventdata_targetObject:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\.*/)
    pivot_on: user
    window: 4h
  - name: Outlook spawning interpreters or LOLBins
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 24h
  - name: Outlook outbound connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee].*/) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 24h
  - name: Files created in Outlook temp content folder
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\.*/)
    pivot_on: user
    window: 4h
  - name: Script or HTML payload files in user paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Mm][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Mm].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss].*/) AND (data_win_eventdata_targetFilename:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: user
    window: 4h
