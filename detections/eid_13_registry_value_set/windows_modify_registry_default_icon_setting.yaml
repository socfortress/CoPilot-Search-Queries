name: Windows Modify Registry Default Icon Setting
id: a7a7afdb-3c58-45b6-9bff-63e5acfd9d40
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects suspicious modifications to the Windows registry's default icon settings, a technique
  associated with LockBit ransomware and other malware families. This detection leverages Sysmon EventID 13 (registry
  modification) to identify changes to registry paths under HKCR (HKEY_CLASSES_ROOT) involving defaultIcon settings.
  This activity is significant because it is uncommon for normal users or legitimate applications to modify these settings.
  Ransomware families like LockBit modify default icon associations to display custom ransom notes or intimidating imagery
  when users open files, serving as part of their attack strategy for system defacement and psychological manipulation.
  If confirmed malicious, this could lead to system defacement, signaling a broader ransomware attack in progress,
  potentially compromising sensitive data and system integrity.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*defaultIcon*(Default)*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_valueName
    - data_win_eventdata_image
    - data_win_eventdata_user
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you must be ingesting data that records registry activity from your hosts to
  populate the endpoint data model in the registry node. This is typically populated via endpoint detection-and-response
  products such as Carbon Black or endpoint data sources such as Sysmon. Ensure that Sysmon is configured to monitor
  HKCR (HKEY_CLASSES_ROOT) registry hive changes. The detection focuses on the defaultIcon registry key which is used
  by Windows to determine the icon displayed for files of specific types. Modifications to these keys can indicate
  malware attempting to change file associations or display custom images when users interact with compromised files.

known_false_positives: >
  No false positives have been identified at this time. Legitimate applications and Windows updates do not typically
  modify defaultIcon registry settings. Any modifications to these keys should be investigated as they are highly
  suspicious and indicative of malware infection or unauthorized system modification. If legitimate software requires
  these changes, document and whitelist the process name and registry path combination.

references:
  - https://blogs.vmware.com/security/2022/10/lockbit-3-0-also-known-as-lockbit-black.html
  - https://news.sophos.com/en-us/2020/04/24/lockbit-ransomware-borrows-tricks-to-keep-up-with-revil-and-maze/
  - https://learn.microsoft.com/en-us/windows/win32/shlwapi/hkey-classes-root-key

response:
  message: >
    Suspicious default icon registry modification detected on $agent_name$ by user $data_win_eventdata_user$.
    Registry Path: $data_win_eventdata_targetObject$. Icon Path: $data_win_eventdata_details$.
    Process: $data_win_eventdata_image$. This may indicate LockBit ransomware or similar malware infection.
  risk_score: 80
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 80
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_path
    - field: data_win_eventdata_details
      type: file_path

tags:
  analytic_story:
    - LockBit Ransomware
    - Ransomware Activity
    - System Defacement
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - defaulticon
    - registry_modification
    - lockbit
    - ransomware
    - hkcr
    - file_association
    - system_defacement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*defaultIcon.*\(Default\).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-nochangingwallpaper-001
    name: Windows Modify Registry NoChangingWallPaper
    reason: 'Ransomware defacement: icon change usually accompanies wallpaper lock-down'
  - id: 85b88e05-dadc-430b-8a9e-53ff1cd30aae
    name: Potentially Suspicious Desktop Background Change Via Registry
    reason: Ransom wallpaper change is the companion defacement step
  - id: 8b9606c9-28be-4a38-b146-0e313cc232c1
    name: Potential Ransomware Activity Using LegalNotice Message
    reason: Logon-screen ransom message is another registry defacement used by ransomware
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: LockBit deletes shadow copies around the time it brands encrypted files
  - id: 5de03871-5d46-4539-a82d-3aa992a69a83
    name: Registry Disable System Restore
    reason: Recovery inhibition commonly paired with ransomware file association changes
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Defence evasion in the same ransomware run
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ransom notes and encrypted extensions created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Rr]estore-[Mm]y-[Ff]iles.*/ OR data_win_eventdata_targetFilename:/.*\.[Ll]ock[Bb]it.*/ OR data_win_eventdata_targetFilename:/.*[Rr]eadme.*\.txt/ OR data_win_eventdata_targetFilename:/.*[Dd]ecrypt.*\.txt/)
    pivot_on: host
    window: 2h
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Rr]ecoveryenabled.*/)
    pivot_on: host
    window: 4h
  - name: Wallpaper and file-association registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww]allpaper.*/ OR data_win_eventdata_targetObject:/.*[Dd]efault[Ii]con.*/ OR data_win_eventdata_targetObject:/.*FileExts.*/ OR data_win_eventdata_targetObject:/.*LegalNotice.*/)
    pivot_on: host
    window: 24h
  - name: Service stops for encryption
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]et.*[Ss]top.*/ OR data_win_eventdata_commandLine:/.*[Tt]askkill.*/ OR data_win_eventdata_commandLine:/.*[Ss]c.*[Cc]onfig.*disabled.*/)
    pivot_on: host
    window: 2h
  - name: Icon files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.ico/
    pivot_on: host
    window: 2h
