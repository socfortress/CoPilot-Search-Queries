name: Enable LM Hash Storage
id: c420410f-c2d8-4010-856b-dffe21866437
version: 1
schema_version: "1.0"
date: "2023-12-15"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c420410f-c2d8-4010-856b-dffe21866437
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the "NoLMHash" registry value in order to allow Windows to
  store LM Hashes. By setting this registry value to "0" (DWORD), Windows will
  be allowed to store a LAN manager hash of your password in Active Directory
  and local SAM databases. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*System\\\\CurrentControlSet\\\\Control\\\\Lsa\\\\NoLMHash"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*System\CurrentControlSet\Control\Lsa\NoLMHash'; data_win_eventdata_details
  equals 'DWORD (0x00000000)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/prevent-windows-store-lm-hash-password
  - https://www.sans.org/blog/protecting-privileged-domain-accounts-lm-hashes-the-good-the-bad-and-the-ugly/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Enable LM Hash Storage detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - enable
    - storage
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Nn][Oo][Ll][Mm][Hh][Aa][Ss][Hh]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 98dedfdd-8333-49d4-9f23-d7018cccae53
    name: Enable LM Hash Storage - ProcCreation
    reason: Command-line twin of this registry write; gives the process, parent and user that changed NoLMHash.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: Same goal of making credentials recoverable; usually done together before dumping.
  - id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
    name: NetNTLM Downgrade Attack - Registry
    reason: Weakening NTLM settings to make captured hashes easier to crack or relay.
  - id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
    name: Windows Credential Guard Disabled - Registry
    reason: Credential protections being turned off in the same hardening-removal pass.
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: Removing LSASS protection so credentials can then be dumped.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The credential theft this setup enables.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dumping expected after credential protections are weakened.
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: LM hashes live in SAM; a SAM dump after the change harvests them.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSA and credential protection registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(Control\\Lsa|WDigest|DeviceGuard|CredentialGuard).*/
    pivot_on:
    - host
    window: 4h
  - name: LSASS dump tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll]sass.*([Dd]ump|minidump)|[Pp]rocdump.*[Ll]sass|comsvcs.*[Mm]ini[Dd]ump|[Ss]ekurlsa|[Mm]imikatz).*/
    pivot_on:
    - host
    window: 4h
  - name: SAM, SYSTEM and NTDS hive export
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr]eg(\.exe)? +save.*(sam|system|security)|[Nn]tdsutil|[Vv]ssadmin.*[Cc]reate.*[Ss]hadow|[Ee]sentutl.*[Ss]am).*/
    pivot_on:
    - host
    window: 4h
  - name: Password changes or resets on the host
    query: data_win_system_eventID:("4723" OR "4724")
    pivot_on:
    - host
    window: 24h
  - name: Network logons using NTLM
    query: data_win_system_eventID:"4624" AND data_win_eventdata_authenticationPackageName:"NTLM" AND data_win_eventdata_logonType:("3" OR "9")
    pivot_on:
    - host
    window: 4h
