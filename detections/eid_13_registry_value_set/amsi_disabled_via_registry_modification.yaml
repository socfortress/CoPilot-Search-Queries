name: AMSI Disabled via Registry Modification
id: aa37cbb0-da36-42cb-a90f-fdf216fc7467
version: 1
schema_version: "1.0"
date: "2025-12-25"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa37cbb0-da36-42cb-a90f-fdf216fc7467
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to disable AMSI (Anti-Malware Scan Interface) by modifying
  the AmsiEnable registry value. Anti-Malware Scan Interface (AMSI) is a
  security feature in Windows that allows applications and services to integrate
  with anti-malware products for enhanced protection against malicious content.
  Adversaries may attempt to disable AMSI to evade detection by security
  software, allowing them to execute malicious scripts or code without being
  scanned. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows Script\\\\Settings\\\\AmsiEnable"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows Script\Settings\AmsiEnable';
  data_win_eventdata_details equals 'DWORD (0x00000000)'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://mostafayahiax.medium.com/hunting-for-amsi-bypassing-methods-9886dda0bf9d
  - https://docs.microsoft.com/en-us/windows/win32/amsi/antimalware-scan-interface-portal
  - https://www.mdsec.co.uk/2019/02/macros-and-more-with-sharpshooter-v2-0/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    AMSI Disabled via Registry Modification detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ss][Cc][Rr][Ii][Pp][Tt]\\[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Aa][Mm][Ss][Ii][Ee][Nn][Aa][Bb][Ll][Ee]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7dbbcac2-57a0-45ac-b306-ff30a8bd2981
    name: Windows AMSI Related Registry Tampering Via CommandLine
    reason: Command-line AMSI registry tampering, same action seen from process creation.
  - id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f705
    name: Potential Persistence Via New AMSI Providers - Registry
    reason: New AMSI provider persistence, another way to subvert AMSI via registry.
  - id: 160d2780-31f7-4922-8b3a-efce30e63e96
    name: Potential AMSI COM Server Hijacking
    reason: AMSI COM server hijack neutralises scanning, alternative AMSI evasion.
  - id: 41d1058a-aea7-4952-9293-29eaaf516465
    name: Removal Of AMSI Provider Registry Keys
    reason: Deleting AMSI provider keys removes Defender's AMSI hook, same evasion goal.
  - id: 92a974db-ab84-457f-9ec0-55db83d7a825
    name: Potential AMSI Bypass Using NULL Bits
    reason: In-memory AMSI bypass attempts often accompany registry disabling.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defender functionality disabled via registry, evasion typically done in the same burst.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Defender exclusions added usually follow once scanning is blunted.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: PowerShell disabling security monitoring is the scripted counterpart.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other defense-evasion registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Windows Defender|Amsi|Windows Script).*/
    pivot_on: host
    window: 1h
  - name: Suspicious script engine launches
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(powershell|pwsh|wscript|cscript|mshta).*/ AND data_win_eventdata_commandLine:/.*([Ee]nc|[Dd]ownload|[Ii]ex|[Ii]nvoke).*/
    pivot_on: host
    window: 2h
  - name: Defender exclusion or preference changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Set-MpPreference|Add-MpPreference|DisableRealtime|ExclusionPath).*/
    pivot_on: host
    window: 2h
  - name: Script block with AMSI keywords
    query: data_win_system_eventID:4104 AND data_win_eventdata_scriptBlockText:/.*([Aa]msi[Ii]nit[Ff]ailed|[Aa]msi[Uu]tils|[Aa]msi[Ss]can[Bb]uffer).*/
    pivot_on: host
    window: 2h
  - name: Registry tools touching AMSI
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(reg|regedit)\.exe/ AND data_win_eventdata_commandLine:/.*[Aa]msi.*/
    pivot_on: host
    window: 1h
