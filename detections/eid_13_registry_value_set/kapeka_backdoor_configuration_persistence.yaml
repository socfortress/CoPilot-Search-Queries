name: Kapeka Backdoor Configuration Persistence
id: cbaa3ef3-07a9-4c8e-82d1-9e40578da7fd
version: 1
schema_version: "1.0"
date: "2024-07-03"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cbaa3ef3-07a9-4c8e-82d1-9e40578da7fd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry set activity of a value called "Seed" stored in the
  "\Cryptography\Providers\" registry key. The Kapeka backdoor leverages this
  location to register a new SIP provider for backdoor configuration
  persistence. MITRE ATT&CK: T1553.003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Cryptography\\\\Providers\\\\{*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Seed"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*(Empty)*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Cryptography\Providers\{*';
  data_win_eventdata_targetObject matches '*\Seed'; data_win_eventdata_details
  matches '*(Empty)*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/kapeka
  - https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
  - https://attack.mitre.org/techniques/T1553/003/

response:
  message: >
    Kapeka Backdoor Configuration Persistence detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1553.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.003
  custom_tags:
    - kapeka
    - backdoor
    - configuration
    - registry
    - sysmon
    - persistence
    - defense_impairment
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\\[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss]\\\{.*/ AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Ee][Dd]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/.*\([Ee][Mm][Pp][Tt][Yy]\).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c0c67b21-eb8a-4c84-a395-40473ec3b482
    name: Kapeka Backdoor Autorun Persistence
    reason: 'Sibling registry persistence: Run value launching the backdoor whose config the Seed value holds.'
  - id: e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
    name: Kapeka Backdoor Execution Via RunDLL32.EXE
    reason: The backdoor reads this config at runtime when started via rundll32.
  - id: a7e6b1f9-8d2c-4f1e-9a7d-63e4c8a2bf4c
    name: Kapeka Backdoor Loaded Via Rundll32.EXE
    reason: DLL load by rundll32 shows the config-reading payload running.
  - id: 64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
    name: Kapeka Backdoor Persistence Activity
    reason: Dropper-side persistence commands in the same intrusion.
  - id: 20228d05-dd68-435d-8b4e-e7e64938880c
    name: Potential Kapeka Decrypted Backdoor Indicator
    reason: Backdoor file written to disk before it stores its configuration.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes under Cryptography Providers
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]ryptography\\[Pp]roviders\\.*/
    pivot_on: host
    window: 24h
  - name: Run key values invoking rundll32
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ AND data_win_eventdata_details:/.*[Rr]undll32.*/
    pivot_on: host
    window: 24h
  - name: 'rundll32 with .wll or ordinal #1'
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr]un[Dd][Ll][Ll]32\.exe/ AND (data_win_eventdata_commandLine:/.*\.[Ww][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*#1.*/)
    pivot_on: host
    window: 24h
  - name: Network connections by rundll32
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr]un[Dd][Ll][Ll]32\.exe/
    pivot_on: host
    window: 24h
