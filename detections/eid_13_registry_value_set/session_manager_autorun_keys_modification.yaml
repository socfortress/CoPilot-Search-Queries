name: Session Manager Autorun Keys Modification
id: 046218bd-e0d8-4113-a3c3-895a12b2b298
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 046218bd-e0d8-4113-a3c3-895a12b2b298
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modification of autostart extensibility point (ASEP) in registry.
  MITRE ATT&CK: T1547.001, T1546.009.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\System\\\\CurrentControlSet\\\\Control\\\\Session Manager*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SetupExecute*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\S0InitialCommand*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\KnownDlls*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Execute*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\BootExecute*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\AppCertDlls*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "(Empty)"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\System\CurrentControlSet\Control\Session Manager*';
  data_win_eventdata_targetObject matches '*\SetupExecute*';
  data_win_eventdata_targetObject matches '*\S0InitialCommand*', among other
  conditions.

known_false_positives: >
  Legitimate software automatically (mostly, during installation) sets up
  autorun keys for legitimate reason. Legitimate administrator sets up autorun
  keys for legitimate reason. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
  - https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
  - https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d
  - https://attack.mitre.org/techniques/T1547/001/
  - https://attack.mitre.org/techniques/T1546/009/

response:
  message: >
    Session Manager Autorun Keys Modification detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1547.001, T1546.009
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
    - T1546.009
  custom_tags:
    - session
    - manager
    - autorun
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn] [Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/ AND (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Tt][Uu][Pp][Ee][Xx][Ee][Cc][Uu][Tt][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ss]0[Ii][Nn][Ii][Tt][Ii][Aa][Ll][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Kk][Nn][Oo][Ww][Nn][Dd][Ll][Ll][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Ee][Xx][Ee][Cc][Uu][Tt][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Bb][Oo][Oo][Tt][Ee][Xx][Ee][Cc][Uu][Tt][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Aa][Pp][Pp][Cc][Ee][Rr][Tt][Dd][Ll][Ll][Ss].*/) AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f674e36a-4b91-431e-8aef-f8a96c2aca35
    name: CurrentControlSet Autorun Keys Modification
    reason: Other CurrentControlSet autorun-key changes by the same actor.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Common Run-key autorun modification; attackers stack persistence points.
  - id: 6aa1d992-5925-4e9f-a49b-845e51d1de01
    name: New DLL Added to AppCertDlls Registry Key
    reason: AppCertDlls is also under Session Manager scope; DLL injected into processes.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Command-line registry edit of autorun keys that likely produced this write.
  - id: d6c2ce7e-afb5-4337-9ca4-4b5254ed0565
    name: WinSock2 Autorun Keys Modification
    reason: WinSock2 autorun modification, sibling boot-time persistence.
  - id: 1547e27c-3974-43e2-a7d7-7f484fb928ec
    name: Registry Persistence via Service in Safe Mode
    reason: Service-in-safe-mode registry persistence, sibling low-level persistence.
  - id: cbf93e5d-ca6c-4722-8bea-e9119007c248
    name: CurrentVersion NT Autorun Keys Modification
    reason: CurrentVersion NT autorun key changes alongside boot-level persistence.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reg.exe or PowerShell touching Session Manager
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]ession [Mm]anager.*/ OR /.*[Bb]oot[Ee]xecute.*/ OR /.*[Ss]etup[Ee]xecute.*/ OR /.*[Kk]nown[Dd]lls.*/)
    pivot_on: host
    window: 2h
  - name: Other persistence registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*\\CurrentVersion\\Run.*/ OR /.*\\Winlogon\\.*/ OR /.*\\Services\\.*\\ImagePath/ OR /.*AppCertDlls.*/)
    pivot_on: host
    window: 6h
  - name: Binaries dropped in system folders
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\[Ww]indows\\[Ss]ystem32\\.*\.(exe|dll)/ OR /.*\\[Ww]indows\\[Tt]emp\\.*\.(exe|dll)/)
    pivot_on: host
    window: 2h
  - name: Reboot or shutdown commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*shutdown.*\/[rR].*/ OR /.*[Rr]estart-[Cc]omputer.*/)
    pivot_on: host
    window: 4h
  - name: Children of smss or autochk
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*smss\.exe/ OR /.*autochk\.exe/)
    pivot_on: host
    window: 24h
