name: WFP Filter Added via Registry
id: 1f1d8209-636e-4c6c-a137-781cca8b82f9
version: 1
schema_version: "1.0"
date: "2025-10-23"
author: Frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1f1d8209-636e-4c6c-a137-781cca8b82f9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry modifications that add Windows Filtering Platform (WFP)
  filters, which may be used to block security tools and EDR agents from
  reporting events. MITRE ATT&CK: T1685, T1569.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\BFE\\\\Parameters\\\\Policy\\\\Persistent\\\\Filter\\\\*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\svchost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\SysWOW64\\svchost.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\BFE\Parameters\Policy\Persistent\Filter\*'; data_win_eventdata_image equals
  'C:\Windows\System32\svchost.exe'; data_win_eventdata_image equals
  'C:\Windows\SysWOW64\svchost.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/netero1010/EDRSilencer/blob/0e73a7037ec65c52894d8208e6f605a7da0a34a6/EDRSilencer.c
  - https://www.huntress.com/blog/silencing-the-edr-silencers
  - https://www.trendmicro.com/en_us/research/24/j/edrsilencer-disrupting-endpoint-security-solutions.html
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    WFP Filter Added via Registry detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685,
    T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
    - T1569.002
  custom_tags:
    - filter
    - added
    - registry
    - sysmon
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Bb][Ff][Ee]\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Pp][Oo][Ll][Ii][Cc][Yy]\\[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt]\\[Ff][Ii][Ll][Tt][Ee][Rr]\\.*/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: eb2d07d4-49cb-4523-801a-da002df36602
    name: HackTool - EDRSilencer Execution
    reason: EDRSilencer uses WFP filters to block EDR agent traffic; the persistent-filter registry write is its artifact.
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: Another tool blinding EDR agents, commonly paired with blocking of telemetry.
  - id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
    name: Disable Microsoft Defender Firewall via Registry
    reason: Related host network-defence tampering in the same defence-evasion phase.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Alternate firewall tampering to open or hide traffic.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Firewall rule creation often accompanies WFP filter changes when blocking security tools.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defender disablement alongside EDR blinding is a typical pre-ransomware prelude.
  - id: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
    name: Disabling Windows Defender WMI Autologger Session via Reg.exe
    reason: Telemetry suppression technique used together with agent blocking.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: EDR-silencing tools and WFP command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ee][Dd][Rr][Ss]ilencer.*/ OR /.*[Ww][Ff][Pp].*/ OR /.*[Ee][Dd][Rr]-[Ff]reeze.*/ OR /.*[Bb]lock[Oo]utbound.*/)
    pivot_on: host
    window: 4h
  - name: Security agent services stopped
    query: data_win_system_eventID:7036 AND data_win_eventdata_param2:stopped AND data_win_eventdata_param1:(/.*[Dd]efender.*/ OR /.*[Ss]ense.*/ OR /.*[Cc]rowd[Ss]trike.*/ OR /.*[Ss]entinel.*/ OR /.*[Ww]azuh.*/ OR /.*[Cc]arbon.*/)
    pivot_on: host
    window: 4h
  - name: Defender and security tooling disable attempts
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*Set-MpPreference.*[Dd]isable.*/ OR /.*sc.*(stop|config).*(WinDefend|Sense|Sysmon|wazuh).*/)
    pivot_on: host
    window: 4h
  - name: Unsigned binaries run from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\(Temp|Public|ProgramData|Downloads)\\.*\.exe/) AND data_win_eventdata_signed:false
    pivot_on: host
    window: 2h
