name: Windows Print Processor Registry Autostart
id: windows-print-processor-registry-autostart-001
version: 1
schema_version: "1.0"
date: "2026-02-16"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects suspicious modifications to the Print Processor registry path via 
  Sysmon EventID 13 (Registry Value Set). APT groups like Turla and Winnti 
  exploit this persistence mechanism to load malicious DLLs through the 
  spoolsv.exe Print Spooler service, achieving persistence and privilege 
  escalation.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*Print Processors*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-16 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-16 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log registry value set events (EventID 13). Ensure 
  Sysmon configuration includes monitoring of the Print Processor registry path 
  under HKLM\SYSTEM\CurrentControlSet\Control\Print\Environments.

known_false_positives: >
  Legitimate printer installation may add driver components to this registry path. 
  Filter based on the image (process) making the change and the DLL being registered.

references:
  - https://attack.mitre.org/techniques/T1547/012/
  - https://www.welivesecurity.com/2020/05/21/no-game-over-winnti-group/

response:
  message: >
    Print Processor registry modification detected on $agent_name$. 
    Registry path: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. MITRE ATT&CK: T1547.012
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Data Destruction
    - Windows Privilege Escalation
    - Hermetic Wiper
    - Windows Persistence Techniques
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.012
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Print Processors.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 944e8941-f6f6-4ee8-ac05-1c224e923c0e
    name: Add Port Monitor Persistence in Registry
    reason: Sibling spooler-DLL persistence (port monitors loaded by spoolsv) used by the same actors
  - id: windows-monitor-registry-keys-for-print-monitors-001
    name: Windows Monitor Registry Keys for Print Monitors
    reason: Print Monitors key is the sister autostart location for malicious spooler DLLs
  - id: e0813366-0407-449a-9869-a2db1119dc41
    name: Suspicious Printer Driver Empty Manufacturer
    reason: Malicious printer driver install (PrintNightmare style) often precedes print processor persistence
  - id: ba6b9e43-1d45-4d3c-a504-1043a64c8469
    name: PrinterNightmare Mimikatz Driver Name
    reason: Spooler exploitation that drops a DLL later registered as a print processor
  - id: 2131cfb3-8c12-45e8-8fa0-31f5924e9f07
    name: CVE-2021-1675 Print Spooler Exploitation Filename Pattern
    reason: Spooler exploit file drop that provides the DLL later registered
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL files written to spooler directories
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*spool.*prtprocs.*/ OR /.*spool.*drivers.*\.dll/)
    pivot_on: host
    window: 6h
  - name: Non-standard modules loaded by spoolsv
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*spoolsv\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*[Ww]indows.[Ss]ystem32.*/
    pivot_on: host
    window: 24h
  - name: Child processes of spoolsv.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*spoolsv\.exe/
    pivot_on: host
    window: 6h
  - name: Print registry key writes (processors, monitors, drivers)
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*Print.Processors.*/ OR /.*Control.Print.Monitors.*/ OR /.*Print.Environments.*/)
    pivot_on: host
    window: 24h
  - name: Spooler service stop/start or restart
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]pooler.*/)
    pivot_on: host
    window: 6h
