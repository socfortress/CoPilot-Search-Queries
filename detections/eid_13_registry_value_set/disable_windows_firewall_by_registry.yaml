name: Disable Windows Firewall by Registry
id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect set EnableFirewall to 0 to disable the Windows firewall. MITRE ATT&CK:
  T1686.003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\WindowsFirewall\\\\StandardProfile\\\\EnableFirewall"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\WindowsFirewall\\\\DomainProfile\\\\EnableFirewall"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Policies\Microsoft\WindowsFirewall\StandardProfile\EnableFirewall';
  data_win_eventdata_targetObject matches
  '*\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\EnableFirewall';
  data_win_eventdata_details equals 'DWORD (0x00000000)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1562.004/T1562.004.md
  - https://attack.mitre.org/techniques/T1686/003/

response:
  message: >
    Disable Windows Firewall by Registry detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1686.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1686.003
  custom_tags:
    - disable
    - firewall
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]\\[Ss][Tt][Aa][Nn][Dd][Aa][Rr][Dd][Pp][Rr][Oo][Ff][Ii][Ll][Ee]\\[Ee][Nn][Aa][Bb][Ll][Ee][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]\\[Dd][Oo][Mm][Aa][Ii][Nn][Pp][Rr][Oo][Ff][Ii][Ll][Ee]\\[Ee][Nn][Aa][Bb][Ll][Ee][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
    name: Disable Microsoft Defender Firewall via Registry
    reason: Near-identical registry variant (other profiles/keys) from the same actor.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Command-line route to the same outcome, often run in the same script.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Alternative netsh disablement logic corroborating the intent.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Rather than fully disabling, attackers also add allow rules for inbound access.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall disablement is a typical prelude to opening RDP for remote access.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Defensive tooling is disabled together with the firewall in hardening-removal playbooks.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defender disablement in the same defence-evasion burst.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Ransomware playbooks drop the firewall for lateral spread then tamper with recovery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Firewall-disabling commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]etsh.*[Aa]dvfirewall.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*[Ff]irewall.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Nn]et[Ff]irewall[Pp]rofile.*/ OR data_win_eventdata_commandLine:/.*[Mm]pssvc.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other firewall policy registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ww]indows[Ff]irewall.*/ OR data_win_eventdata_targetObject:/.*[Ss]hared[Aa]ccess.[Pp]arameters.[Ff]irewall[Pp]olicy.*/ OR data_win_eventdata_targetObject:/.*[Mm]pssvc.*/)
    pivot_on:
    - host
    window: 4h
  - name: 'RDP, SMB and WinRM exposure: connections and fDenyTSConnections changes'
    query: (data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985")) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ff]deny[Tt][Ss][Cc]onnections.*/)
    pivot_on:
    - host
    window: 4h
  - name: Defender tampering in the same window
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Tt]amper[Pp]rotection.*/ OR data_win_eventdata_commandLine:/.*[Mm]p[Cc]md[Rr]un.*/ OR data_win_eventdata_commandLine:/.*[Ww]indows [Dd]efender.*[Dd]isable.*/)
    pivot_on:
    - host
    window: 4h
  - name: Ransomware precursors following defence removal
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Rr]ecoveryenabled.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*/)
    pivot_on:
    - host
    window: 6h
