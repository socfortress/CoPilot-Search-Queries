name: Potential Persistence Via Logon Scripts - Registry
id: 9ace0707-b560-49b8-b6ca-5148b42f39fb
version: 1
schema_version: "1.0"
date: "2025-10-26"
author: Tom Ueltschi (@c_APT_ure)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9ace0707-b560-49b8-b6ca-5148b42f39fb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of "UserInitMprLogonScript" registry value which can be used
  as a persistence method by malicious actors. MITRE ATT&CK: T1037.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*UserInitMprLogonScript*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*UserInitMprLogonScript*'.

known_false_positives: >
  Investigate the contents of the "UserInitMprLogonScript" value to determine of
  the added script is legitimate. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1037.001/T1037.001.md
  - https://attack.mitre.org/techniques/T1037/001/

response:
  message: >
    Potential Persistence Via Logon Scripts - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1037.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1037.001
  custom_tags:
    - persistence
    - logon
    - registry
    - sysmon
    - privilege_escalation
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt][Mm][Pp][Rr][Ll][Oo][Gg][Oo][Nn][Ss][Cc][Rr][Ii][Pp][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21d856f9-9281-4ded-9377-51a1a6e2a432
    name: Potential Persistence Via Logon Scripts - CommandLine
    reason: Same technique via reg.exe commandline; often the writer of this registry value.
  - id: 0a98a10c-685d-4ab0-bddc-b6bdd1d48458
    name: Uncommon Userinit Child Process
    reason: 'Follow-on: at next logon userinit.exe runs the UserInitMprLogonScript payload.'
  - id: b655a06a-31c0-477a-95c2-3726b83d649d
    name: Suspicious Userinit Child Process
    reason: Execution evidence of the logon script launching a suspicious binary.
  - id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
    name: Winlogon Notify Key Logon Persistence
    reason: Another logon-triggered persistence an actor may add for redundancy.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Companion Run-key persistence on the same host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes launched by userinit at logon
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Uu]serinit\.exe/ AND NOT data_win_eventdata_image:/.*([Ee]xplorer|[Uu]serinit)\.exe/
    pivot_on: host
    window: 24h
  - name: Reg.exe setting logon script environment value
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*UserInitMprLogonScript* OR *\\Environment*)
    pivot_on: host
    window: 6h
  - name: Script/payload files dropped in user paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*.bat OR *.cmd OR *.ps1 OR *.vbs OR *.js OR *.exe) AND data_win_eventdata_targetFilename:(*\\AppData\\* OR *\\Users\\Public\\* OR *\\ProgramData\\* OR *\\Temp\\*)
    pivot_on: host
    window: 4h
  - name: Other logon-time registry persistence
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(*CurrentVersion\\Run* OR *Winlogon* OR *Startup*)
    pivot_on: host
    window: 24h
