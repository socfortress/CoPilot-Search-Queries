name: Persistence Via Hhctrl.ocx
id: f10ed525-97fe-4fed-be7c-2feecca941b1
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f10ed525-97fe-4fed-be7c-2feecca941b1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker modifies the registry value of the "hhctrl" to point
  to a custom binary.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\CLSID\\\\{52A2AAAE-085D-4187-97EA-8C30DB990436}\\\\InprocServer32\\\\(Default)*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "C:\\Windows\\System32\\hhctrl.ocx"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\CLSID\{52A2AAAE-085D-4187-97EA-8C30DB990436}\InprocServer32\(Default)*';
  data_win_eventdata_details equals 'C:\Windows\System32\hhctrl.ocx'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://persistence-info.github.io/Data/hhctrl.html
  - https://www.hexacorn.com/blog/2018/04/23/beyond-good-ol-run-key-part-77/

response:
  message: >
    Persistence Via Hhctrl.ocx detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - persistence
    - hhctrl
    - registry
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\\{52[Aa]2[Aa][Aa][Aa][Ee]-085[Dd]-4187-97[Ee][Aa]-8[Cc]30[Dd][Bb]990436\}\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\).*/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Hh][Hh][Cc][Tt][Rr][Ll]\.[Oo][Cc][Xx]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 976dd1f2-a484-45ec-aa1d-0e87e882262b
    name: Potential Persistence Via CHM Helper DLL
    reason: Sibling HTML Help hijack (HtmlHelp Author DLL key); both abuse hh.exe/hhctrl to load an attacker DLL.
  - id: 790317c0-0a36-4a6a-a105-6e576bf99a14
    name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
    reason: Generic detection of the same CLSID InprocServer32 default overwrite primitive.
  - id: dc5c24af-6995-49b2-86eb-a9ff62199e82
    name: COM Hijacking via TreatAs
    reason: Alternative COM redirection operators swap in when InprocServer32 edits are detected.
  - id: e8a95b5e-c891-46e2-b33a-93937d3abc31
    name: Suspicious HH.EXE Execution
    reason: hh.exe launching is the trigger that makes hhctrl.ocx (and thus the hijacked DLL) load.
  - id: 52cad028-0ff0-4854-8f67-d25dfcbc78b4
    name: HTML Help HH.EXE Suspicious Child Process
    reason: Hijacked hhctrl loads inside hh.exe so payload behaviour shows as odd hh.exe children.
  - id: f57c58b3-ee69-4ef5-9041-455bf39aaa89
    name: Remote CHM File Download/Execution Via HH.EXE
    reason: 'Delivery counterpart: a remote CHM is the common way hh.exe is made to run on the victim.'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: hh.exe executions and CHM arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Hh][Hh]\.[Ee][Xx][Ee]).*/ OR data_win_eventdata_commandLine:/.*(\.[Cc][Hh][Mm]).*/)
    pivot_on: host
    window: 24h
  - name: Non-system DLLs loaded into hh.exe
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*(\\[Hh][Hh]\.[Ee][Xx][Ee]).*/ AND NOT data_win_eventdata_imageLoaded:/.*(\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\).*/
    pivot_on: host
    window: 24h
  - name: CLSID hijack edits via tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(52[Aa]2[Aa][Aa][Aa][Ee]-085[Dd]-4187-97[Ee][Aa]-8[Cc]30[Dd][Bb]990436|[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32).*/
    pivot_on: host
    window: 24h
  - name: New DLL/OCX or CHM dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\).*/ AND data_win_eventdata_targetFilename:/.*(\.[Dd][Ll][Ll]|\.[Oo][Cc][Xx]|\.[Cc][Hh][Mm]).*/
    pivot_on: host
    window: 6h
  - name: Other COM InprocServer32 changes to non-system paths
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32).*/ AND NOT data_win_eventdata_details:/.*(\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]).*/
    pivot_on: host
    window: 24h
