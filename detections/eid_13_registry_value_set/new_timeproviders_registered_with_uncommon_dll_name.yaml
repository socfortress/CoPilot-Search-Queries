name: New TimeProviders Registered With Uncommon DLL Name
id: e88a6ddc-74f7-463b-9b26-f69fc0d2ce85
version: 1
schema_version: "1.0"
date: "2024-03-26"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e88a6ddc-74f7-463b-9b26-f69fc0d2ce85
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects processes setting a new DLL in DllName in under
  HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider.
  Adversaries may abuse time providers to execute DLLs when the system boots.
  The Windows Time service (W32Time) enables time synchronization across and
  within domains. MITRE ATT&CK: T1547.003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\W32Time\\\\TimeProviders*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\DllName"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details:
                          value: "%SystemRoot%\\System32\\vmictimeprovider.dll"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "%systemroot%\\system32\\w32time.dll"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "C:\\Windows\\SYSTEM32\\w32time.DLL"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\W32Time\TimeProviders*'; data_win_eventdata_targetObject matches
  '*\DllName'; data_win_eventdata_details equals
  '%SystemRoot%\System32\vmictimeprovider.dll', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.003/T1547.003.md
  - https://attack.mitre.org/techniques/T1547/003/

response:
