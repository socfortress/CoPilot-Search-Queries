name: New TimeProviders Registered With Uncommon DLL Name
id: e88a6ddc-74f7-463b-9b26-f69fc0d2ce85
version: 1
schema_version: "1.0"
date: "2024-03-26"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e88a6ddc-74f7-463b-9b26-f69fc0d2ce85
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects processes setting a new DLL in DllName in under
  HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider.
  Adversaries may abuse time providers to execute DLLs when the system boots.
  The Windows Time service (W32Time) enables time synchronization across and
  within domains. MITRE ATT&CK: T1547.003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\W32Time\\\\TimeProviders*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\DllName"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details:
                          value: "%SystemRoot%\\System32\\vmictimeprovider.dll"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "%systemroot%\\system32\\w32time.dll"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "C:\\Windows\\SYSTEM32\\w32time.DLL"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\W32Time\TimeProviders*'; data_win_eventdata_targetObject matches
  '*\DllName'; data_win_eventdata_details equals
  '%SystemRoot%\System32\vmictimeprovider.dll', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.003/T1547.003.md
  - https://attack.mitre.org/techniques/T1547/003/

response:
  message: >
    New TimeProviders Registered With Uncommon DLL Name detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1547.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.003
  custom_tags:
    - timeproviders
    - registered
    - uncommon
    - registry
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ww]32[Tt][Ii][Mm][Ee]\\[Tt][Ii][Mm][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss].*/ AND data_win_eventdata_targetObject:/.*\\[Dd][Ll][Ll][Nn][Aa][Mm][Ee]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Vv][Mm][Ii][Cc][Tt][Ii][Mm][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_details:/%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww]32[Tt][Ii][Mm][Ee]\.[Dd][Ll][Ll]/ OR data_win_eventdata_details:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww]32[Tt][Ii][Mm][Ee]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6da2c9f5-7c53-401b-aacb-92c040ce1215
    name: Use of W32tm as Timer
    reason: w32tm abuse is the other well-known W32Time tool misuse; same host suggests the actor manipulating the time service.
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: A time provider DLL is dropped under a plausible name before registration.
  - id: df6ecb8b-7822-4f4b-b412-08f524b4576c
    name: Creation Of Non-Existent System DLL
    reason: Dropping a DLL into System32 under a nonstandard name is the precursor to registering it as a provider.
  - id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
    name: Persistence Via New SIP Provider
    reason: 'Same operator pattern: registering a DLL into a Windows system provider to load under a trusted service.'
  - id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
    name: Potential Credential Dumping Attempt Using New NetworkProvider - REG
    reason: Parallel system-provider DLL registration technique, often used by the same actors on the same host.
  - id: 612e47e9-8a59-43a6-b404-f48683f45bd6
    name: ServiceDll Hijack
    reason: ServiceDll tampering is the adjacent service-hosted DLL persistence technique.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Time provider registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:*W32Time*
    pivot_on: host
    window: 6h
  - name: DLLs created in System32
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ss]ystem32.*\.dll/ AND NOT data_win_eventdata_image:(*TrustedInstaller* OR *svchost.exe OR *TiWorker* OR *msiexec.exe OR *wuauclt*)
    pivot_on: host
    window: 6h
  - name: W32Time service control or w32tm config
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*w32tm* OR data_win_eventdata_commandLine:*W32Time*)
    pivot_on: host
    window: 6h
  - name: Svchost loading unsigned DLL
    query: data_win_system_eventID:7 AND data_win_eventdata_image:*svchost.exe AND data_win_eventdata_signed:false
    pivot_on: host
    window: 24h
