name: Windows Chrome Extension Allowed Registry Modification
id: 2846089a-ffe9-4881-a2a2-43f3be2b8cc7
version: 1
schema_version: 1
date: '2026-01-12'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects modifications to the Windows registry keys controlling the Chrome
  Extension Install Allowlist policy (HKLM\SOFTWARE\Policies\Google\Chrome\
  ExtensionInstallAllowlist). Attackers add malicious extension IDs to this
  key to bypass Chrome enterprise extension restrictions, enabling silent
  installation of credential-stealing or session-hijacking browser extensions.
  Associated with browser hijacking campaigns. MITRE ATT&CK: T1185
  (Browser Session Hijacking).

data_source:
  - Sysmon EventID 13 (RegistryEvent - Value Set)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Google\\Chrome\\ExtensionInstallAllowlist*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 (RegistryEvent - Value Set) flowing to the Wazuh
  Indexer. Requires the following Sysmon RegistryEvent rule to be present in
  your Sysmon config:
  <Rule name="technique_id=T1185,technique_name=Chrome Extension Allowlist Modification" groupRelation="or">
    <TargetObject condition="contains">SOFTWARE\Policies\Google\Chrome\ExtensionInstallAllowlist</TargetObject>
  </Rule>
  Validated on DESKTOP-AM0HLGE with reg.exe writing a value to
  HKLM\SOFTWARE\Policies\Google\Chrome\ExtensionInstallAllowlist\1.
  Confirmed field names: data_win_eventdata_targetObject (full registry path
  including value index), data_win_eventdata_details (extension ID written),
  data_win_eventdata_image.

known_false_positives: >
  Legitimate IT admin updates to Chrome extension allowlist via Group Policy
  or enterprise management tools (SCCM, Intune) will trigger this detection.
  Filter on data_win_eventdata_image for known management tool paths.
  Any modification from user-space processes or unknown binaries should be
  treated as high priority.

references:
  - https://www.gdatasoftware.com/blog/2025/11/38298-learning-about-browser-hijacking
  - https://attack.mitre.org/techniques/T1185/

response:
  message: >
    Chrome ExtensionInstallAllowlist registry key modified on $agent_name$.
    Registry path: $data_win_eventdata_targetObject$.
    Value written: $data_win_eventdata_details$.
    Modified by: $data_win_eventdata_image$.
    Possible attempt to allowlist a malicious Chrome extension.
    MITRE ATT&CK: T1185
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Browser Hijacking
  asset_type: Endpoint
  mitre_attack_id:
    - T1185
  custom_tags:
    - chrome
    - extension_allowlist
    - registry
    - browser_hijacking
    - policy_abuse
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-chrome-auto-update-disabled-registry-001
    name: Windows Chrome Auto-Update Disabled via Registry
    reason: Freezing Chrome updates commonly accompanies allow-listing a malicious extension.
  - id: da355155-1d23-48f9-bf95-e534ae273ab0
    name: Windows Chrome Enable Extension Loading via Command-Line
    reason: 'Direct follow-on: browser launched to load the allowed extension.'
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: Confirms the extension was actually loaded in a browser instance.
  - id: 0a74c5a9-1b71-4475-9af2-7829d320d5c2
    name: ChromeLoader Malware Execution
    reason: Known browser-hijacker family installing extensions silently.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Credential/session theft is the goal of a rogue extension.
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Alternative session-hijacking path attackers use alongside extension abuse.
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: Pinpoints suspicious writers of the policy key.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Chrome policy registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Policies.Google.Chrome.*/
    pivot_on: host
    window: 6h
  - name: Browser launched with extension flags
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*chrome\.exe/ OR data_win_eventdata_image:/.*msedge\.exe/) AND (data_win_eventdata_commandLine:/.*--load-extension.*/ OR data_win_eventdata_commandLine:/.*--disable-extensions-except.*/ OR data_win_eventdata_commandLine:/.*--remote-debugging-port.*/)
    pivot_on: host
    window: 6h
  - name: Extension packages or manifests dropped
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.crx/ OR data_win_eventdata_targetFilename:/.*manifest\.json/) AND NOT data_win_eventdata_image:/.*(chrome|GoogleUpdate|msedge)\.exe/
    pivot_on: host
    window: 6h
  - name: reg.exe or PowerShell writing Chrome extension policy
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*Google.Chrome.*Extension.*/ AND (data_win_eventdata_image:/.*[Rr]eg\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*cmd\.exe/)
    pivot_on: host
    window: 2h
  - name: Browser credential stores read by non-browser processes
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*Login Data.*/ OR data_win_eventdata_targetFilename:/.*Web Data.*/) AND NOT data_win_eventdata_image:/.*(chrome|msedge)\.exe/
    pivot_on: host
    window: 6h
