name: Enable Microsoft Dynamic Data Exchange
id: 63647769-326d-4dde-a419-b925cc0caf42
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 63647769-326d-4dde-a419-b925cc0caf42
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Enable Dynamic Data Exchange protocol (DDE) in all supported editions of
  Microsoft Word or Excel. MITRE ATT&CK: T1559.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Word\\\\Security\\\\AllowDDE"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000001)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000002)"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Excel\\\\Security\\\\DisableDDEServerLaunch"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Excel\\\\Security\\\\DisableDDEServerLookup"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000000)"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Word\Security\AllowDDE'; data_win_eventdata_details equals 'DWORD
  (0x00000001)'; data_win_eventdata_details equals 'DWORD (0x00000002)', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://msrc.microsoft.com/update-guide/vulnerability/ADV170021
  - https://attack.mitre.org/techniques/T1559/002/

response:
  message: >
    Enable Microsoft Dynamic Data Exchange detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1559.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1559.002
  custom_tags:
    - enable
    - microsoft
    - dynamic
    - registry
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/.*\\[Ww][Oo][Rr][Dd]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Aa][Ll][Ll][Oo][Ww][Dd][Dd][Ee]/ AND (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000002\)/)) OR ((data_win_eventdata_targetObject:/.*\\[Ee][Xx][Cc][Ee][Ll]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd][Dd][Ee][Ss][Ee][Rr][Vv][Ee][Rr][Ll][Aa][Uu][Nn][Cc][Hh]/ OR data_win_eventdata_targetObject:/.*\\[Ee][Xx][Cc][Ee][Ll]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd][Dd][Ee][Ss][Ee][Rr][Vv][Ee][Rr][Ll][Oo][Oo][Kk][Uu][Pp]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: DDE abuse executes via Word/Excel; look for the suspicious child process
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Office exploitation attempt, same malicious-document delivery chain
  - id: ab871450-37dc-4a3a-997f-6662aa8ae0f1
    name: Disable Macro Runtime Scan Scope
    reason: Co-occurring Office security weakening (macro runtime scan disabled)
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Office app downloading files after DDE enabled is the staging step
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: Binary in user dir spawned from Office is the payload execution
  - id: e1693bc8-7168-4eab-8718-cdcaa68a1738
    name: Suspicious WMIC Execution Via Office Process
    reason: WMIC launched from Office is a common DDE follow-on
  - id: f99abdf0-6283-4e71-bd2b-b5c048a94743
    name: Potentially Suspicious Office Document Executed From Trusted Location
    reason: Office doc run from trusted location is a companion macro/DDE weakening
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office spawning shells/LOLBins
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]).*/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|mshta|wscript|cscript|rundll32|regsvr32|certutil|bitsadmin).*/
    pivot_on: host
    window: 2h
  - name: Office network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Executables dropped by Office
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]).*/ AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|vbs|js|hta|bat)/
    pivot_on: host
    window: 2h
  - name: Other Office security registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Office|Word|Excel).*Security.*/
    pivot_on: host
    window: 6h
