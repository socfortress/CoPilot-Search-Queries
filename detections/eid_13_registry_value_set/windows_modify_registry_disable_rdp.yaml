name: Windows Modify Registry Disable RDP
id: windows-modify-registry-disable-rdp-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of fDenyTSConnections registry value to 1, which disables 
  Remote Desktop Protocol (RDP). Adversaries disable RDP to prevent remote 
  administration and isolate systems from remote intervention during attacks. 
  Used by ShrinkLocker ransomware.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Control\\Terminal Server\\fDenyTSConnections"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  Terminal Server registry paths. The default Sysmon config should already 
  include Terminal Server paths.

known_false_positives: >
  Administrators may disable RDP via Group Policy or for security hardening. 
  Investigate process and user context.

references:
  - https://www.bleepingcomputer.com/news/security/new-shrinklocker-ransomware-uses-bitlocker-to-encrypt-your-files/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    RDP disabled via registry on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - ShrinkLocker
    - Windows RDP Artifacts and Defense Evasion
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - rdp_disable
    - registry_modification
    - terminal_server
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Control.*Terminal Server.*fDenyTSConnections/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-configure-bitlocker-001
    name: Windows Modify Registry Configure BitLocker
    reason: ShrinkLocker sets BitLocker policies in the same script as the RDP block
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Same RDP key change done through reg.exe; supplies command line and parent
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: Other RDP setting changes on the host show whether RDP was toggled around the event
  - id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
    name: RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class
    reason: Alternate way of disabling RDP via WMI
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Recovery destruction accompanies isolation in ransomware
  - id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
    name: Disable Windows Firewall by Registry
    reason: Isolation and defence evasion often combined with RDP disable
  - id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
    name: Disable Microsoft Defender Firewall via Registry
    reason: Firewall profile disabled in the same stage
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BitLocker / manage-bde activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm]anage-[Bb][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb]it[Ll]ocker.*/)
    pivot_on: host
    window: 4h
  - name: Terminal services registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*Terminal Server.*/ OR data_win_eventdata_targetObject:/.*TermService.*/)
    pivot_on: host
    window: 24h
  - name: Recovery inhibition commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*/ OR data_win_eventdata_commandLine:/.*[Rr]eagentc.*/)
    pivot_on: host
    window: 4h
  - name: Account password changes and adapter disabling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]et.*user.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable-[Nn]et[Aa]dapter.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*[Ii]nterface.*[Dd]isable.*/)
    pivot_on: host
    window: 2h
  - name: Script engines from unusual paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc]script\.exe/ OR data_win_eventdata_image:/.*[Ww]script\.exe/) AND data_win_eventdata_commandLine:/.*([Tt]emp|[Pp]rogram[Dd]ata|[Dd]ownloads|[Pp]ublic).*/
    pivot_on: host
    window: 2h
