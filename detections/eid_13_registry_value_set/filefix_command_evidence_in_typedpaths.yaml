name: FileFix - Command Evidence in TypedPaths
id: 4fee3d51-8069-4a4c-a0f7-924fcaff2c70
version: 1
schema_version: "1.0"
date: "2025-11-19"
author: Alfie Champion (delivr.to), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4fee3d51-8069-4a4c-a0f7-924fcaff2c70
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects commonly-used chained commands and strings in the most recent 'url'
  value of the 'TypedPaths' key, which could be indicative of a user being
  targeted by the FileFix technique. MITRE ATT&CK: T1204.004.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\TypedPaths\\\\url1"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details: "*#*"
        - wildcard:
            data_win_eventdata_details:
              value: "*http*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*account*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*anti-bot*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*botcheck*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*captcha*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*challenge*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*confirmation*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*fraud*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*human*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*identification*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*identificator*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*identity*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*robot*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*validation*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*verification*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*verify*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%comspec%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*bitsadmin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*certutil*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*cmd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*cscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*curl*"
