                    value: "*confirmation*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*fraud*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*human*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*identification*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*identificator*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*identity*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*robot*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*validation*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*verification*"
                    case_insensitive: true
