status: experimental
type: TTP

description: >
  Detects commonly-used chained commands and strings in the most recent 'url'
  value of the 'TypedPaths' key, which could be indicative of a user being
  targeted by the FileFix technique. MITRE ATT&CK: T1204.004.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\TypedPaths\\\\url1"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details: "*#*"
        - wildcard:
            data_win_eventdata_details:
              value: "*http*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*account*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*anti-bot*"
                    case_insensitive: true
