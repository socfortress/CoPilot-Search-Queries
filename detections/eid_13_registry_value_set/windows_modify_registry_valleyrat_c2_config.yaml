name: Windows Modify Registry ValleyRAT C2 Config
id: windows-modify-registry-valleyrat-c2-config-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects registry modifications related to ValleyRAT C2 configuration. 
  ValleyRAT stores C2 server IP address and port in Console\IpDateInfo 
  (binary data) and its executable path in Console\SelfPath. These are 
  strong indicators of ValleyRAT infection.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Console\\IpDateInfo"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\Console\\SelfPath"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    required: false
    default: "now-24h"
  END_TIME:
    type: datetime
    required: false
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 monitoring Console registry paths. 
  May need specific paths added to Sysmon config.

known_false_positives: >
  Unknown. These registry paths are specific to ValleyRAT.

references:
  - https://www.proofpoint.com/us/blog/threat-insight/chinese-malware-appears-earnest-across-cybercrime-threat-landscape
  - https://www.fortinet.com/blog/threat-research/valleyrat-campaign-targeting-chinese-speakers
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    ValleyRAT C2 config detected on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    HIGH CONFIDENCE malware indicator. MITRE ATT&CK: T1112
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []

tags:
  analytic_story:
    - ValleyRAT
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - valleyrat
    - c2_config
    - malware_ioc
    - high_confidence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*Console.*IpDateInfo/ OR data_win_eventdata_targetObject:/.*Console.*SelfPath/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-valleyrat-pwn-reg-entry-001
    name: Windows Modify Registry ValleyRAT PWN Reg Entry
    reason: Second ValleyRAT registry artifact; both together confirm the implant installed its configuration and file association.
  - id: windows-modify-registry-utilize-progids-001
    name: Windows Modify Registry Utilize ProgIDs
    reason: ValleyRAT's UAC-bypass ProgID hijack typically precedes writing config under Console.
  - id: windows-modify-registry-md5-reg-key-name-001
    name: Windows Modify Registry With MD5 Reg Key Name
    reason: Fileless registry-stored payload/plugin storage is a shared RAT trait that may accompany config writes.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: ValleyRAT persists via Run keys to user-writable locations after configuration.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: The implant beacons to the C2 address it just stored, from a process in a user-writable folder.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Console IpDateInfo and SelfPath config writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*Console\\IpDateInfo.*/ OR data_win_eventdata_targetObject:/.*Console\\SelfPath.*/)
    pivot_on: host
    window: 24h
  - name: Outbound connections from user-writable binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_image:/.*[Tt]emp.*/ OR data_win_eventdata_image:/.*[Pp]ublic.*/ OR data_win_eventdata_image:/.*[Pp]rogram[Dd]ata.*/)
    pivot_on: host
    window: 2h
  - name: Binaries dropped in AppData/Temp/ProgramData
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic).*\.(exe|dll|bat|ps1|vbs|js|scr|lnk)/
    pivot_on: host
    window: 2h
  - name: Run key and shell persistence writes
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon\\[Ss]hell.*/ OR data_win_eventdata_targetObject:/.*[Ss]tartup.*/))
    pivot_on: host
    window: 4h
  - name: DNS lookups by processes in user-writable paths
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_image:/.*[Tt]emp.*/ OR data_win_eventdata_image:/.*[Pp]ublic.*/ OR data_win_eventdata_image:/.*[Pp]rogram[Dd]ata.*/)
    pivot_on: host
    window: 2h
