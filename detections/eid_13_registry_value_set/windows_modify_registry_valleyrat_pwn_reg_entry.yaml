name: Windows Modify Registry ValleyRAT PWN Reg Entry
id: windows-modify-registry-valleyrat-pwn-reg-entry-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects registry modifications targeting .pwn file associations used by 
  ValleyRAT malware. ValleyRAT creates registry entries to associate .pwn 
  files with malicious processes, enabling execution of harmful scripts 
  when these files are opened.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*.pwn\\Shell\\Open\\command*"
              - wildcard:
                  data_win_eventdata_details: "*.pwn*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    required: false
    default: "now-24h"
  END_TIME:
    type: datetime
    required: false
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 monitoring file association registry paths.

known_false_positives: >
  Unknown. .pwn file extensions are not used by legitimate applications.

references:
  - https://www.proofpoint.com/us/blog/threat-insight/chinese-malware-appears-earnest-across-cybercrime-threat-landscape
  - https://www.fortinet.com/blog/threat-research/valleyrat-campaign-targeting-chinese-speakers
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    ValleyRAT .pwn file association detected on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    HIGH CONFIDENCE malware indicator. MITRE ATT&CK: T1112
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []

tags:
  analytic_story:
    - ValleyRAT
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - valleyrat
    - pwn_extension
    - file_association
    - malware_ioc
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\.pwn.*Shell.*Open.*command.*/ OR data_win_eventdata_details:/.*\.pwn.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-valleyrat-c2-config-001
    name: Windows Modify Registry ValleyRAT C2 Config
    reason: Same implant writing its C2 configuration; together they confirm ValleyRAT installation.
  - id: windows-modify-registry-utilize-progids-001
    name: Windows Modify Registry Utilize ProgIDs
    reason: Both abuse ProgID/file-association registry mechanics; the ProgID hijack provides the elevation this association relies on.
  - id: 44a22d59-b175-4f13-8c16-cbaef5b581ff
    name: New File Association Using Exefile
    reason: Another file-association hijack that makes a custom extension run attacker code.
  - id: 7530b96f-ad8e-431d-a04d-ac85cc461fdc
    name: Custom File Open Handler Executes PowerShell
    reason: Custom open handlers launching script engines are the typical payload of a .pwn-style association.
  - id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
    name: Potential Persistence Via Custom Protocol Handler
    reason: Related handler-registration persistence mechanism commonly used with custom associations.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: .pwn file creation or opening
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.pwn/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\.pwn.*/)
    pivot_on: host
    window: 24h
  - name: Shell open command registrations for custom extensions
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\Shell\\Open\\command.*/
    pivot_on: host
    window: 2h
  - name: Script engines or LOLBins launched from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(powershell|cmd|wscript|cscript|mshta|rundll32)\.exe/ AND (data_win_eventdata_commandLine:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_commandLine:/.*[Tt]emp.*/ OR data_win_eventdata_commandLine:/.*[Pp]ublic.*/)
    pivot_on: host
    window: 2h
  - name: Binaries dropped in AppData/Temp/ProgramData
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic).*\.(exe|dll|bat|ps1|vbs|js|scr|lnk)/
    pivot_on: host
    window: 2h
  - name: Outbound connections from user-writable binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_image:/.*[Tt]emp.*/ OR data_win_eventdata_image:/.*[Pp]ublic.*/ OR data_win_eventdata_image:/.*[Pp]rogram[Dd]ata.*/)
    pivot_on: host
    window: 2h
