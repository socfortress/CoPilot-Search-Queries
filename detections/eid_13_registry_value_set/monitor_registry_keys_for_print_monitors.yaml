name: Windows Monitor Registry Keys for Print Monitors
id: windows-monitor-registry-keys-for-print-monitors-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modifications to the registry key HKLM\SYSTEM\CurrentControlSet\Control\Print\Monitors. 
  Attackers can exploit this registry key to load arbitrary DLL files that will execute 
  with elevated SYSTEM permissions and persist after a reboot. This is a known persistence 
  technique used to maintain access and execute code with high privileges.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*Control*Print*Monitors*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log registry value set events (EventID 13). Ensure 
  the Sysmon configuration captures registry modifications under 
  HKLM\SYSTEM\CurrentControlSet\Control\Print\Monitors. The index pattern should 
  match your Wazuh index naming convention.

known_false_positives: >
  Legitimate print monitor installations may trigger this detection. Filter based 
  on known printer drivers and authorized software installations. Investigate any 
  unknown DLL names in the Details field.

references:
  - https://attack.mitre.org/techniques/T1547/010/

response:
  message: >
    Print monitor registry modification detected on $agent_name$. 
    Target: $data_win_eventdata_targetObject$. 
    Details: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1547.010
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Suspicious Windows Registry Activities
    - Windows Persistence Techniques
    - Windows Registry Abuse
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.010
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Control.*Print.*Monitors.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 944e8941-f6f6-4ee8-ac05-1c224e923c0e
    name: Add Port Monitor Persistence in Registry
    reason: 'Direct sibling: Driver value pointing at an attacker DLL under Print\Monitors.'
  - id: ce7066a6-508a-42d3-995b-2952c65dc2ce
    name: Drop Binaries Into Spool Drivers Color Folder
    reason: 'Precursor: the DLL is staged in spool\drivers\color before registration.'
  - id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
    name: Suspicious Spool Service Child Process
    reason: 'Follow-on: spoolsv.exe loads the monitor DLL and spawns SYSTEM child processes.'
  - id: 7ec912f2-5175-4868-b811-ec13ad0f8567
    name: CVE-2020-1048 Exploitation Attempt - Suspicious New Printer Ports - Registry
    reason: Printer port abuse for arbitrary file write, same spooler attack surface.
  - id: ba6b9e43-1d45-4d3c-a504-1043a64c8469
    name: PrinterNightmare Mimikatz Driver Name
    reason: Spooler driver abuse for SYSTEM code execution on the same host.
  - id: 2131cfb3-8c12-45e8-8fa0-31f5924e9f07
    name: CVE-2021-1675 Print Spooler Exploitation Filename Pattern
    reason: PrintNightmare DLL drop leading to SYSTEM execution via the spooler.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLLs dropped in spooler driver and system directories
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll]\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/)
    pivot_on: host
    window: 6h
  - name: Spooler loading a DLL from an unusual path
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee])/ AND NOT (data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)
    pivot_on: host
    window: 6h
  - name: spoolsv.exe spawning shells or recon tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee].*/) AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: Other Print and spooler registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Rr][Ii][Nn][Tt]\\[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Pp][Rr][Ii][Nn][Tt]\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt][Ss]\\.*/)
    pivot_on: host
    window: 6h
  - name: Command-line registration of print monitors or ports
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt]\\[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Dd][Rr][Ii][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd][Mm][Oo][Nn][Ii][Tt][Oo][Rr].*/)
    pivot_on: host
    window: 2h
