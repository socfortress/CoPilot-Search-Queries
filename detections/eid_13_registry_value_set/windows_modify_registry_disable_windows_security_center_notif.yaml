name: Windows Modify Registry Disable Windows Security Center Notif
id: windows-modify-registry-disable-security-center-notif-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of UseActionCenterExperience registry value to 0, 
  disabling Windows Security Center notifications. Adversaries suppress 
  critical update and security notifications to operate undetected. Used 
  by Azorult malware and referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\ImmersiveShell\\UseActionCenterExperience"
        - term:
            data_win_eventdata_details: "DWORD (0x00000000)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  ImmersiveShell registry paths. This path is typically included in 
  default Sysmon configurations.

known_false_positives: >
  Administrators may configure this via Group Policy or scripts. 
  Investigate process and user context.

references:
  - https://app.any.run/tasks/a6f2ffe2-e6e2-4396-ae2e-04ea0143f2d8/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Windows Security Center notifications disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Azorult
    - CISA AA23-347A
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - security_center
    - immersive_shell
    - notification_disable
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*ImmersiveShell.*UseActionCenterExperience/ AND data_win_eventdata_details:"DWORD (0x00000000)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: 'Direct sibling: Security Center notification suppression through another value.'
  - id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
    name: Disable Windows Security Center Notifications
    reason: Same suppression family; multiple variants point to scripted tamper.
  - id: 1cd983c8-8fd6-11ec-a09d-acde48001122
    name: Windows Disable Notification Center
    reason: Notification Center disable usually written by the same tool.
  - id: Windows_DisableAntiSpyware_Registry
    name: Windows DisableAntiSpyware Registry
    reason: Engine disable pairs with muting the Action Center alerts.
  - id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
    name: Disable Microsoft Defender Firewall via Registry
    reason: Defender Firewall disabled via registry is a common companion tamper.
  - id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
    name: Disable Windows Firewall by Registry
    reason: Windows Firewall disabled by registry extends the defensive blind spot.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Exclusions follow to let the payload run.
  - id: f7f9ab88-7557-4a69-b30e-0a8f91b3a0e7
    name: Registry Entries For Azorult Malware
    reason: Azorult registry artefacts confirm the family the description names.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Action Center and Security Center registry tampering
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(ImmersiveShell|Security Center|Action Center|Notifications|SecurityHealth).*/
    pivot_on: host
    window: 4h
  - name: Defender exclusions or preference tampering by command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|[Rr]emove-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime|[Ee]xclusion[Pp]ath).*/
    pivot_on: host
    window: 2h
  - name: Firewall disable via netsh or registry
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(advfirewall|firewall).*(off|disable|delete).*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*FirewallPolicy.*EnableFirewall.*/)
    pivot_on: host
    window: 4h
  - name: Executables run from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(AppData|Temp|ProgramData|Public)\\.*\.exe/
    pivot_on: host
    window: 4h
  - name: Recon and credential theft commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(whoami|systeminfo|tasklist|nltest|cmdkey|vaultcmd|reg +query).*/
    pivot_on: host
    window: 2h
