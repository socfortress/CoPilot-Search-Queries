name: Potential PSFactoryBuffer COM Hijacking
id: 243380fa-11eb-4141-af92-e14925e77c1b
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: BlackBerry Threat Research and Intelligence Team - @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 243380fa-11eb-4141-af92-e14925e77c1b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the PSFactory COM InProcServer32 registry. This technique
  was used by RomCom to create persistence storing a malicious DLL. MITRE
  ATT&CK: T1546.015.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\CLSID\\\\{c90250f3-4d7d-4991-9b69-a5c5bc1c2ae6}\\\\InProcServer32\\\\(Default)"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details:
                          value: "%windir%\\System32\\ActXPrxy.dll"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "C:\\Windows\\System32\\ActXPrxy.dll"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\CLSID\{c90250f3-4d7d-4991-9b69-a5c5bc1c2ae6}\InProcServer32\(Default)';
  data_win_eventdata_details equals '%windir%\System32\ActXPrxy.dll';
  data_win_eventdata_details equals 'C:\Windows\System32\ActXPrxy.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.blackberry.com/en/2023/06/romcom-resurfaces-targeting-ukraine
  - https://strontic.github.io/xcyclopedia/library/clsid_C90250F3-4D7D-4991-9B69-A5C5BC1C2AE6.html
  - https://www.virustotal.com/gui/file/6d3ab9e729bb03ae8ae3fcd824474c5052a165de6cb4c27334969a542c7b261d/detection
  - https://www.trendmicro.com/en_us/research/23/e/void-rabisu-s-use-of-romcom-backdoor-shows-a-growing-shift-in-th.html
  - https://attack.mitre.org/techniques/T1546/015/

response:
  message: >
    Potential PSFactoryBuffer COM Hijacking detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1546.015
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.015
  custom_tags:
    - psfactorybuffer
    - hijacking
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\\{[Cc]90250[Ff]3-4[Dd]7[Dd]-4991-9[Bb]69-[Aa]5[Cc]5[Bb][Cc]1[Cc]2[Aa][Ee]6\}\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/%[Ww][Ii][Nn][Dd][Ii][Rr]%\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Cc][Tt][Xx][Pp][Rr][Xx][Yy]\.[Dd][Ll][Ll]/ OR data_win_eventdata_details:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Cc][Tt][Xx][Pp][Rr][Xx][Yy]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-com-hijacking-inprocserver32-001
    name: Windows COM Hijacking InprocServer32 Modification
    reason: Command-line view of InprocServer32 tampering for the same COM hijack.
  - id: ea61e291-af05-4716-932a-67faddb6ae6f
    name: PowerShell COM Hijacking InProcServer32 Modification
    reason: PowerShell-driven InProcServer32 edit is a common way this hijack is performed.
  - id: dc5c24af-6995-49b2-86eb-a9ff62199e82
    name: COM Hijacking via TreatAs
    reason: Sibling COM hijack technique; actors layer multiple COM persistence methods.
  - id: fe20dda1-6f37-4379-bbe0-a98d400cae90
    name: Potential Persistence Via Scrobj.dll COM Hijacking
    reason: Another COM registry persistence variant on the same host.
  - id: 96f697b0-b499-4e5d-9908-a67bec11cdb6
    name: Removal of Potential COM Hijacking Registry Keys
    reason: Cleanup of hijack keys after execution indicates trace removal.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Any InprocServer32 or LocalServer32 registry change
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\.*\\([Ii]n[Pp]roc[Ss]erver32|[Ll]ocal[Ss]erver32).*/
    pivot_on: host
    window: 24h
  - name: DLLs created in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Aa]pp[Dd]ata\\|\\[Pp]ublic\\|\\[Pp]rogram[Dd]ata\\).*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 24h
  - name: Unsigned DLL loads from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*(\\[Tt]emp\\|\\[Aa]pp[Dd]ata\\|\\[Pp]ublic\\|\\[Pp]rogram[Dd]ata\\).*\.[Dd][Ll][Ll]/ AND data_win_eventdata_signed:"false"
    pivot_on: host
    window: 24h
  - name: Regsvr32 or rundll32 loading DLLs from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr]egsvr32|[Rr]undll32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\\[Tt]emp\\|\\[Aa]pp[Dd]ata\\|\\[Pp]ublic\\|\\[Pp]rogram[Dd]ata\\).*/
    pivot_on: host
    window: 24h
