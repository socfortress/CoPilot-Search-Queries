name: Potential Persistence Using DebugPath
id: df4dc653-1029-47ba-8231-3c44238cc0ae
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: df4dc653-1029-47ba-8231-3c44238cc0ae
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential persistence using Appx DebugPath. MITRE ATT&CK: T1546.015.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*Classes\\\\ActivatableClasses\\\\Package\\\\Microsoft.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\DebugPath"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\PackagedAppXDebug\\\\Microsoft.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\(Default)"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Classes\ActivatableClasses\Package\Microsoft.*';
  data_win_eventdata_targetObject matches '*\DebugPath';
  data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\PackagedAppXDebug\Microsoft.*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://oddvar.moe/2018/09/06/persistence-using-universal-windows-platform-apps-appx/
  - https://github.com/rootm0s/WinPwnage
  - https://attack.mitre.org/techniques/T1546/015/

response:
  message: >
    Potential Persistence Using DebugPath detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.015
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.015
  custom_tags:
    - persistence
    - debugpath
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND ((data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Aa][Cc][Tt][Ii][Vv][Aa][Tt][Aa][Bb][Ll][Ee][Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Pp][Aa][Cc][Kk][Aa][Gg][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\..*/ AND data_win_eventdata_targetObject:/.*\\[Dd][Ee][Bb][Uu][Gg][Pp][Aa][Tt][Hh]/) OR (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Dd][Aa][Pp][Pp][Xx][Dd][Ee][Bb][Uu][Gg]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\..*/ AND data_win_eventdata_targetObject:/.*\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 092af964-4233-4373-b4ba-d86ea2890288
    name: Add Debugger Entry To AeDebug For Persistence
    reason: Sibling debugger-hijack persistence an operator may add as redundancy.
  - id: 833ef470-fa01-4631-a79b-6f291c9ac498
    name: Add Debugger Entry To Hangs Key For Persistence
    reason: Same debugger-key abuse family on the same host.
  - id: 9827ae57-3802-418f-994b-d5ecf5cd974b
    name: Potential Registry Persistence Attempt Via DbgManagedDebugger
    reason: Another debugger-launched-on-crash persistence technique.
  - id: 0cf2e1c6-8d10-4273-8059-738778f981ad
    name: Potential WerFault ReflectDebugger Registry Value Abuse
    reason: Error-reporting debugger abuse, co-occurring with DebugPath.
  - id: 36803969-5421-41ec-b92f-8500f79c23b0
    name: Potential Persistence Via GlobalFlags
    reason: GlobalFlags execution hijack used as a parallel foothold.
  - id: b86852fb-4c77-48f9-8519-eb1b2c308b59
    name: Potential Persistence Via AppCompat RegisterAppRestart Layer
    reason: Alternate app-triggered persistence in the same toolset.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Operators typically also set standard autorun keys for redundancy.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Appx DebugPath or PackagedAppXDebug registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Dd][Ee][Bb][Uu][Gg][Pp][Aa][Tt][Hh]/ OR data_win_eventdata_targetObject:/.*[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Dd][Aa][Pp][Pp][Xx][Dd][Ee][Bb][Uu][Gg].*/)
    pivot_on: host
    window: 4h
  - name: PowerShell Appx cmdlet usage
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Xx].*/
    pivot_on: host
    window: 4h
  - name: Registry tools modifying ActivatableClasses
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Aa][Cc][Tt][Ii][Vv][Aa][Tt][Aa][Bb][Ll][Ee][Cc][Ll][Aa][Ss][Ss][Ee][Ss].*/
    pivot_on: host
    window: 4h
  - name: Shells launched under UWP app hosts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Aa][Pp][Pp][Ss]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\.*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
