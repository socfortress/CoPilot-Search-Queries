name: PowerShell Logging Disabled Via Registry Key Tampering
id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the registry for the currently logged-in user. In order to
  disable PowerShell module logging, script block logging or transcription and
  script execution logging. MITRE ATT&CK: T1564.001, T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Microsoft\\\\Windows\\\\PowerShell\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Microsoft\\\\PowerShellCore\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\ModuleLogging\\\\EnableModuleLogging"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\ScriptBlockLogging\\\\EnableScriptBlockLogging"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\ScriptBlockLogging\\\\EnableScriptBlockInvocationLogging"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Transcription\\\\EnableTranscripting"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Transcription\\\\EnableInvocationHeader"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\EnableScripts"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\PowerShell\*'; data_win_eventdata_targetObject matches
  '*\Microsoft\PowerShellCore\*'; data_win_eventdata_targetObject matches
  '*\ModuleLogging\EnableModuleLogging', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-32---windows-powershell-logging-disabled
  - https://attack.mitre.org/techniques/T1564/001/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    PowerShell Logging Disabled Via Registry Key Tampering detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1564.001, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.001
    - T1112
  custom_tags:
    - powershell
    - logging
    - registry
    - sysmon
    - stealth
    - defense_impairment
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][Cc][Oo][Rr][Ee]\\.*/) AND (data_win_eventdata_targetObject:/.*\\[Mm][Oo][Dd][Uu][Ll][Ee][Ll][Oo][Gg][Gg][Ii][Nn][Gg]\\[Ee][Nn][Aa][Bb][Ll][Ee][Mm][Oo][Dd][Uu][Ll][Ee][Ll][Oo][Gg][Gg][Ii][Nn][Gg]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg]\\[Ee][Nn][Aa][Bb][Ll][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg]\\[Ee][Nn][Aa][Bb][Ll][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ii][Nn][Vv][Oo][Cc][Aa][Tt][Ii][Oo][Nn][Ll][Oo][Gg][Gg][Ii][Nn][Gg]/ OR data_win_eventdata_targetObject:/.*\\[Tt][Rr][Aa][Nn][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn]\\[Ee][Nn][Aa][Bb][Ll][Ee][Tt][Rr][Aa][Nn][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Nn][Gg]/ OR data_win_eventdata_targetObject:/.*\\[Tt][Rr][Aa][Nn][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn]\\[Ee][Nn][Aa][Bb][Ll][Ee][Ii][Nn][Vv][Oo][Cc][Aa][Tt][Ii][Oo][Nn][Hh][Ee][Aa][Dd][Ee][Rr]/ OR data_win_eventdata_targetObject:/.*\\[Ee][Nn][Aa][Bb][Ll][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Ss]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fad91067-08c5-4d1a-8d8c-d96a21b37814
    name: Potential PowerShell Execution Policy Tampering
    reason: Sibling PowerShell defense-weakening registry change commonly made in the same prep step
  - id: aa37cbb0-da36-42cb-a90f-fdf216fc7467
    name: AMSI Disabled via Registry Modification
    reason: Attackers blind AMSI together with PowerShell logging before running payloads
  - id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
    name: Disabled Windows Defender Eventlog
    reason: Another telemetry-suppression registry change in the same defense-evasion phase
  - id: 8ffc5407-52e3-478f-9596-0a7371eafe13
    name: Disable PUA Protection on Windows Defender
    reason: Defender weakening commonly accompanies logging tampering
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Alternate way to disable event logs with the same intent of hiding PowerShell activity
  - id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    reason: Command-line view of policy tampering by the same actor
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Reg.exe use for tampering is often followed by Run-key persistence
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process that wrote the logging keys
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*ScriptBlockLogging.*/ OR /.*ModuleLogging.*/ OR /.*Transcription.*/)
    pivot_on: host
    window: 1h
  - name: PowerShell/Defender/AMSI policy registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*Microsoft.Windows.PowerShell.*/ OR /.*Windows Defender.*/ OR /.*AMSI.*/)
    pivot_on: host
    window: 4h
  - name: Reg.exe or PowerShell setting registry values
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*reg.* add.*/ OR /.*Set-ItemProperty.*/ OR /.*New-ItemProperty.*/)
    pivot_on: host
    window: 2h
  - name: Suspicious PowerShell after tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh)\.exe/ AND data_win_eventdata_commandLine:(/.*-[Ee]nc.*/ OR /.*[Ii][Ee][Xx].*/ OR /.*[Dd]ownload(String|File).*/ OR /.*[Bb]ypass.*/)
    pivot_on: host
    window: 4h
  - name: Event log clearing or wevtutil use
    query: (data_win_system_eventID:1102 OR data_win_system_eventID:104 OR data_win_eventdata_commandLine:(/.*wevtutil.*/ OR /.*Clear-EventLog.*/))
    pivot_on: host
    window: 4h
