description: >
  Detects tampering of RDP Terminal Service/Server sensitive settings. Such as
  allowing unauthorized users access to a system via the 'fAllowUnsolicited' or
  enabling RDP via 'fDenyTSConnections', etc. Below is a list of registry
  keys/values that are monitored by this rule: - Shadow: Used to enable Remote
  Desktop shadowing, which allows an administrator to view or control a user's
  session. - DisableRemoteDesktopAntiAlias: Disables anti-aliasing for remote
  desktop sessions. - DisableSecuritySettings: Disables certain security
  settings for Remote Desktop connections. - fAllowUnsolicited: Allows
  unsolicited remote assistance offers. - fAllowUnsolicitedFullControl: Allows
  unsolicited remote assistance offers with full control. - InitialProgram:
  Specifies a program to run automatically when a user logs on to a remote
  computer. - ServiceDll: Used in RDP hijacking techniques to specify a custom
  DLL to be loaded by the Terminal Services service. - SecurityLayer: Specifies
  the security layer used for RDP connections. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Control\\\\Terminal Server\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Windows NT\\\\Terminal Services\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Shadow"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000001)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000002)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000003)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000004)"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Control\\\\Terminal Server\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Windows NT\\\\Terminal Services\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\DisableRemoteDesktopAntiAlias"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\DisableSecuritySettings"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\fAllowUnsolicited"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\fAllowUnsolicitedFullControl"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Control\\\\Terminal Server\\\\InitialProgram*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Control\\\\Terminal Server\\\\WinStations\\\\RDP-Tcp\\\\InitialProgram*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\services\\\\TermService\\\\Parameters\\\\ServiceDll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Terminal Server\\\\WinStations\\\\RDP-Tcp\\\\SecurityLayer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Windows NT\\\\Terminal Services\\\\InitialProgram*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\SecurityLayer"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000002)"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\Terminal Server\*'; data_win_eventdata_targetObject matches
  '*\Windows NT\Terminal Services\*'; data_win_eventdata_targetObject matches
  '*\Shadow', among other conditions.

known_false_positives: >
  Some of the keys mentioned here could be modified by an administrator while
  setting group policy (it should be investigated either way). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

