graylog:
  query: data_win_system_eventID:"13" AND (((data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/) AND data_win_eventdata_targetObject:/.*\\[Ss][Hh][Aa][Dd][Oo][Ww]/ AND (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000002\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000003\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000004\)/)) OR ((data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/) AND (data_win_eventdata_targetObject:/.*\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Nn][Tt][Ii][Aa][Ll][Ii][Aa][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Ff][Aa][Ll][Ll][Oo][Ww][Uu][Nn][Ss][Oo][Ll][Ii][Cc][Ii][Tt][Ee][Dd]/ OR data_win_eventdata_targetObject:/.*\\[Ff][Aa][Ll][Ll][Oo][Ww][Uu][Nn][Ss][Oo][Ll][Ii][Cc][Ii][Tt][Ee][Dd][Ff][Uu][Ll][Ll][Cc][Oo][Nn][Tt][Rr][Oo][Ll]/) AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/) OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr]\\[Ii][Nn][Ii][Tt][Ii][Aa][Ll][Pp][Rr][Oo][Gg][Rr][Aa][Mm].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr]\\[Ww][Ii][Nn][Ss][Tt][Aa][Tt][Ii][Oo][Nn][Ss]\\[Rr][Dd][Pp]-[Tt][Cc][Pp]\\[Ii][Nn][Ii][Tt][Ii][Aa][Ll][Pp][Rr][Oo][Gg][Rr][Aa][Mm].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Tt][Ee][Rr][Mm][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr]\\[Ww][Ii][Nn][Ss][Tt][Aa][Tt][Ii][Oo][Nn][Ss]\\[Rr][Dd][Pp]-[Tt][Cc][Pp]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Ll][Aa][Yy][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ii][Nn][Ii][Tt][Ii][Aa][Ll][Pp][Rr][Oo][Gg][Rr][Aa][Mm].*/) AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Ll][Aa][Yy][Ee][Rr]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000002\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Command-line form of the same Terminal Server registry edits; names the process that made the change.
  - id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
    name: RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class
    reason: Alternate way to toggle RDP on the same host, often paired with registry tampering.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall opening for RDP typically accompanies RDP registry changes.
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: Granting RDP access to an account completes the RDP backdoor setup.
  - id: 509e84b9-a71a-40e0-834f-05470369bd1e
    name: Default RDP Port Changed to Non Standard Port
    reason: Sibling RDP hardening-evasion change in the same registry area.
  - id: 37b437cf-3fc5-4c8e-9c94-1d7c9aff842b
    name: Allow RDP Remote Assistance Feature
    reason: Remote Assistance loosening is a closely related RDP weakening.
  - id: 612e47e9-8a59-43a6-b404-f48683f45bd6
    name: ServiceDll Hijack
    reason: ServiceDll under TermService Parameters is one monitored value; this confirms an RDP-service DLL swap.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Terminal Server / RDP registry writes on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Tt]erminal [Ss]erver|[Tt]erm[Ss]ervice|[Ww]in[Ss]tations).*/
    pivot_on:
    - host
    window: 4h
  - name: Commands touching RDP settings (reg, WMI, PowerShell)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Ss][Tt][Aa][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Dd][Pp]-[Tt][Cc][Pp].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Firewall or portproxy changes for RDP
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee].*/) AND (data_win_eventdata_commandLine:/.*3389.*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Local account creation or admin/RDP group additions
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Uu][Ss][Ee][Rr] .*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] .*([Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]|[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp] [Uu][Ss][Ee][Rr][Ss]).*/)
    pivot_on:
    - host
    window: 6h
  - name: RDP network connections to this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_sourcePort:"3389")
    pivot_on:
    - host
    window: 6h
