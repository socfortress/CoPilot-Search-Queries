name: Add Port Monitor Persistence in Registry
id: 944e8941-f6f6-4ee8-ac05-1c224e923c0e
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 944e8941-f6f6-4ee8-ac05-1c224e923c0e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may use port monitors to run an attacker supplied DLL during
  system boot for persistence or privilege escalation. A port monitor can be set
  through the AddMonitor API call to set a DLL to be loaded at startup. MITRE
  ATT&CK: T1547.010.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Control\\\\Print\\\\Monitors\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_details"
        - exists:
            field: "data_win_eventdata_user"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\System32\\spoolsv.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Control\\\\Print\\\\Monitors\\\\CutePDF Writer Monitor v4.0\\\\Driver*"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "cpwmon64_v40.dll"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_user:
                                      value: "*AUTHORI*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_user:
                                      value: "*AUTORI*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Control\\\\Print\\\\Monitors\\\\MONVNC\\\\Driver*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*Control\\\\Print\\\\Environments\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Drivers\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\VNC Printer*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\Print\Monitors\*'; data_win_eventdata_details matches '*.dll';
  data_win_eventdata_image equals 'C:\Windows\System32\spoolsv.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.010/T1547.010.md
  - https://attack.mitre.org/techniques/T1547/010/

response:
  message: >
    Add Port Monitor Persistence in Registry detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1547.010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.010
  custom_tags:
    - monitor
    - persistence
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ss]\\.*/ AND data_win_eventdata_details:/.*\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_details AND _exists_:data_win_eventdata_user AND NOT ((data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ss]\\[Cc][Uu][Tt][Ee][Pp][Dd][Ff] [Ww][Rr][Ii][Tt][Ee][Rr] [Mm][Oo][Nn][Ii][Tt][Oo][Rr] [Vv]4\.0\\[Dd][Rr][Ii][Vv][Ee][Rr].*/ AND data_win_eventdata_details:/[Cc][Pp][Ww][Mm][Oo][Nn]64_[Vv]40\.[Dd][Ll][Ll]/ AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/)) OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ss]\\[Mm][Oo][Nn][Vv][Nn][Cc]\\[Dd][Rr][Ii][Vv][Ee][Rr].*/ OR (data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Vv][Nn][Cc] [Pp][Rr][Ii][Nn][Tt][Ee][Rr].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-monitor-registry-keys-for-print-monitors-001
    name: Windows Monitor Registry Keys for Print Monitors
    reason: Sibling detection on the same Print\Monitors key; confirms the monitor DLL registration from another angle.
  - id: windows-print-processor-registry-autostart-001
    name: Windows Print Processor Registry Autostart
    reason: Same spooler-loaded-DLL persistence family (print processors); attackers often plant both.
  - id: ba6b9e43-1d45-4d3c-a504-1043a64c8469
    name: PrinterNightmare Mimikatz Driver Name
    reason: Print driver registry abuse (PrinterNightmare) gives spooler SYSTEM code execution that often precedes monitor persistence.
  - id: e0813366-0407-449a-9869-a2db1119dc41
    name: Suspicious Printer Driver Empty Manufacturer
    reason: Suspicious printer driver registration on the same host indicates spooler abuse in the same intrusion.
  - id: e6fe26ee-d063-4f5b-b007-39e90aaf50e3
    name: Potential Persistence Via AutodialDLL
    reason: Parallel boot-time DLL persistence via registry; operators stack several of these on one host.
  - id: c90362e0-2df3-4e61-94fe-b37615814cb1
    name: Potential Persistence Via Netsh Helper DLL - Registry
    reason: Netsh helper DLL registry persistence is commonly planted alongside port monitors.
  - id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
    name: Potential Persistence Via LSA Extensions
    reason: LSA extension DLL persistence loads into lsass at boot, same SYSTEM-level persistence goal.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Print spooler registry writes by non-spooler
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Cc]ontrol.[Pp]rint.*/ AND NOT data_win_eventdata_image:/.*[Ss]poolsv\.exe/
    pivot_on: host
    window: 1h
  - name: DLL created in System32 near registration
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ss]ystem32.*\.[Dd][Ll][Ll]/ AND NOT data_win_eventdata_image:/.*([Tt]rusted[Ii]nstaller|[Ww]indows[Uu]pdate|[Ss]etup).*/
    pivot_on: host
    window: 1h
  - name: Spooler loading unsigned DLL
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Ss]poolsv\.exe/ AND data_win_eventdata_signed:false
    pivot_on: host
    window: 24h
  - name: Spooler spawning child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ss]poolsv\.exe/ AND NOT data_win_eventdata_image:/.*([Ss]poolsv|[Cc]onhost|[Ww]erfault).*/
    pivot_on: host
    window: 24h
  - name: Registry DLL persistence writes
    query: data_win_system_eventID:13 AND data_win_eventdata_details:/.*\.[Dd][Ll][Ll]/ AND data_win_eventdata_targetObject:/.*(Control.Lsa|Control.Print|NetSh|Winlogon).*/
    pivot_on: host
    window: 6h
