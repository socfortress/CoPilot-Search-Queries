name: Suspicious Shell Open Command Registry Modification
id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
version: 1
schema_version: "1.0"
date: "2026-01-24"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modifications to shell open registry keys that point to suspicious
  locations typically used by malware for persistence. Generally, modifications
  to the `*\shell\open\command` registry key can indicate an attempt to change
  the default action for opening files, and various UAC bypass or persistence
  techniques involve modifying these keys to execute malicious scripts or
  binaries. MITRE ATT&CK: T1548.002, T1546.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\shell\\\\open\\\\command\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\$Recycle.Bin\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\Contacts\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\Music\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\Photos\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\Pictures\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\Videos\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%AppData%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%LocalAppData%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%Temp%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*%tmp%*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\shell\open\command\*'; data_win_eventdata_details matches
  '*\$Recycle.Bin\*'; data_win_eventdata_details matches
  '*\AppData\Local\Temp\*', among other conditions.

known_false_positives: >
  Legitimate software installations or updates that modify the shell open
  command registry keys to these locations. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.trendmicro.com/en_us/research/25/f/water-curse.html
  - https://attack.mitre.org/techniques/T1548/002/
  - https://attack.mitre.org/techniques/T1546/001/

response:
  message: >
    Suspicious Shell Open Command Registry Modification detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1548.002, T1546.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
    - T1546.001
  custom_tags:
    - shell
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\.*/ AND (data_win_eventdata_details:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*\\[Cc][Oo][Nn][Tt][Aa][Cc][Tt][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Mm][Uu][Ss][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Hh][Oo][Tt][Oo][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Ii][Cc][Tt][Uu][Rr][Ee][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_details:/.*\\[Vv][Ii][Dd][Ee][Oo][Ss]\\.*/ OR data_win_eventdata_details:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*%[Aa][Pp][Pp][Dd][Aa][Tt][Aa]%.*/ OR data_win_eventdata_details:/.*%[Ll][Oo][Cc][Aa][Ll][Aa][Pp][Pp][Dd][Aa][Tt][Aa]%.*/ OR data_win_eventdata_details:/.*%[Tt][Ee][Mm][Pp]%.*/ OR data_win_eventdata_details:/.*%[Tt][Mm][Pp]%.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Fodhelper reads a hijacked shell\open\command key, the classic UAC bypass this write sets up.
  - id: 40f9af16-589d-4984-b78d-8c2aec023197
    name: Potential UAC Bypass Via Sdclt.EXE
    reason: Sdclt UAC bypass likewise executes whatever a hijacked open\command key points at.
  - id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
    name: Registry Modification of MS-settings Protocol Handler
    reason: Same technique on the ms-settings protocol handler key, a sibling hijack by the same tooling.
  - id: 3c05e90d-7eba-4324-9972-5d7f711a60a8
    name: UAC Bypass Tools Using ComputerDefaults
    reason: ComputerDefaults is another auto-elevating binary consuming the hijacked key.
  - id: da2738f2-fadb-4394-afa7-0a0674885afa
    name: Sdclt Child Processes
    reason: Sdclt spawning children is the elevated execution step after the registry edit.
  - id: ae6f14e6-14de-45b0-9f44-c0986f50dc89
    name: Change Default File Association To Executable Via Assoc
    reason: Changing a file association to an executable is the persistence variant of the same shell\open abuse.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Auto-elevating binaries spawning shells or scripts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Execution from user-writable locations used by the registry value
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp])\\.*/
    pivot_on:
    - host
    window: 4h
  - name: Other UAC-bypass or handler hijack registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ee][Xx][Ee][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Mm][Ss][Cc][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ff][Oo][Ll][Dd][Ee][Rr]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: Run key and scheduled task persistence
    query: ((data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*[Cc][Rr][Ee][Aa][Tt][Ee].*.*/)))
    pivot_on:
    - host
    window: 4h
  - name: Defender exclusions added by script or registry
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss]\\.*.*/)
    pivot_on:
    - host
    window: 4h
