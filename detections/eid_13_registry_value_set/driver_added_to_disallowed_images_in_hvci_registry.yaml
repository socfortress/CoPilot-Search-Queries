name: Driver Added To Disallowed Images In HVCI - Registry
id: 555155a2-03bf-4fe7-af74-d176b3fdbe16
version: 1
schema_version: "1.0"
date: "2024-08-21"
author: Nasreddine Bencherchali (Nextron Systems), Omar Khaled (@beacon_exe)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 555155a2-03bf-4fe7-af74-d176b3fdbe16
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the "HVCIDisallowedImages" registry value to potentially
  add a driver to the list, in order to prevent it from loading.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Control\\\\CI\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\HVCIDisallowedImages*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\CI\*'; data_win_eventdata_targetObject matches
  '*\HVCIDisallowedImages*'.

known_false_positives: >
  Legitimate usage of this key would also trigger this. Investigate the driver
  being added and make sure its intended. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/yardenshafir/conference_talks/blob/3de1f5d7c02656c35117f067fbff0a219c304b09/OffensiveCon_2023_Your_Mitigations_are_My_Opportunities.pdf
  - https://x.com/yarden_shafir/status/1822667605175324787

response:
  message: >
    Driver Added To Disallowed Images In HVCI - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - driver
    - added
    - disallowed
    - registry
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Cc][Ii]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Hh][Vv][Cc][Ii][Dd][Ii][Ss][Aa][Ll][Ll][Oo][Ww][Ee][Dd][Ii][Mm][Aa][Gg][Ee][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
    name: Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via CommandLine
    reason: Process-level view of HVCI registry edits; shows which tool and parent made the change.
  - id: 7f2954d2-99c2-4d42-a065-ca36740f187b
    name: Hypervisor Enforced Paging Translation Disabled
    reason: HVCI/HVPT weakening on the same host; attacker disabling kernel protections to load a driver.
  - id: d526c60a-e236-4011-b165-831ffa52ab70
    name: Windows Vulnerable Driver Blocklist Disabled
    reason: 'Sibling control: disabling the blocklist is the opposite route to the same BYOVD driver goal.'
  - id: 22154f0e-5132-4a54-aa78-cc62f6def531
    name: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
    reason: Command-line variant of blocklist tampering preceding a vulnerable driver load.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Driver service creation that follows policy tampering when installing a malicious or EDR-killing driver.
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: BYOVD tool used to load unsigned/vulnerable drivers once code-integrity is weakened.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Driver loaded from Temp is the usual result of this prep; confirms exploitation.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: Known malicious driver loaded after code-integrity settings changed.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Code Integrity and Device Guard registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(Control\\CI\\|DeviceGuard|HypervisorEnforcedCodeIntegrity|VulnerableDriverBlocklist).*/
    pivot_on:
    - host
    window: 4h
  - name: Driver service creation via sc or pnputil
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]c(\.exe)? +(create|config).*(kernel|\.sys)|[Pp]nputil.*\.inf).*/
    pivot_on:
    - host
    window: 4h
  - name: Drivers loaded from unusual locations
    query: data_win_system_eventID:"6" AND data_win_eventdata_imageLoaded:/.*(Temp|AppData|ProgramData|Users\\Public|Downloads).*\.sys/
    pivot_on:
    - host
    window: 4h
  - name: Security tool service stop or removal (EDR evasion)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn]et +stop|[Ss]c(\.exe)? +(stop|delete)).*([Ss]ense|[Dd]efend|[Cc]rowd|[Ss]entinel|[Cc]arbon|[Ss]ophos).*/
    pivot_on:
    - host
    window: 4h
