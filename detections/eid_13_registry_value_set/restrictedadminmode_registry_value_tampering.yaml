name: RestrictedAdminMode Registry Value Tampering
id: d6ce7ebd-260b-4323-9768-a9631c8d4db2
version: 1
schema_version: "1.0"
date: "2024-08-23"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d6ce7ebd-260b-4323-9768-a9631c8d4db2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the "DisableRestrictedAdmin" registry value in order to
  disable or enable RestrictedAdmin mode. RestrictedAdmin mode prevents the
  transmission of reusable credentials to the remote system to which you connect
  using Remote Desktop. This prevents your credentials from being harvested
  during the initial connection process if the remote server has been
  compromise. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*System\\\\CurrentControlSet\\\\Control\\\\Lsa\\\\DisableRestrictedAdmin"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*System\CurrentControlSet\Control\Lsa\DisableRestrictedAdmin'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/a8e3cf63e97b973a25903d3df9fd55da6252e564/atomics/T1112/T1112.md
  - https://social.technet.microsoft.com/wiki/contents/articles/32905.remote-desktop-services-enable-restricted-admin-mode.aspx
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    RestrictedAdminMode Registry Value Tampering detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - restrictedadminmode
    - registry
    - value
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ee][Dd][Aa][Dd][Mm][Ii][Nn]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 28ac00d6-22d9-4a3c-927f-bbd770104573
    name: RestrictedAdminMode Registry Value Tampering - ProcCreation
    reason: Same DisableRestrictedAdmin change seen via reg.exe/PowerShell command line; identifies the tool and parent that performed the registry write.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Companion credential-exposure change: actors weakening credential protections often also re-enable WDigest cleartext caching.'
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: An attacker preparing RDP access typically tweaks other RDP registry settings in the same session.
  - id: a2863fbc-d5cb-48d5-83fb-d976d4b1743b
    name: RDP Sensitive Settings Changed to Zero
    reason: Enabling RDP (fDenyTSConnections=0) pairs with Restricted Admin change to allow pass-the-hash RDP logon.
  - id: 37b437cf-3fc5-4c8e-9c94-1d7c9aff842b
    name: Allow RDP Remote Assistance Feature
    reason: Another RDP exposure change made while staging remote desktop lateral movement.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall opening for RDP is the usual step alongside enabling Restricted Admin for PtH over RDP.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: With DisableRestrictedAdmin=0 NTLM hashes work for RDP; this detects the resulting hash-based logon follow-on.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz sekurlsa::pth with /restrictedadmin is the classic consumer of this setting and the likely hash source.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RDP and LSA registry settings changed on host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[tT][eE][rR][mM][iI][nN][aA][lL] [sS][eE][rR][vV][eE][rR]\\[fF][dD][eE][nN][yY][tT][sS][cC][oO][nN][nN][eE][cC][tT][iI][oO][nN][sS].*/ OR data_win_eventdata_targetObject:/.*\\[cC][oO][nN][tT][rR][oO][lL]\\[lL][sS][aA]\\[dD][iI][sS][aA][bB][lL][eE][rR][eE][sS][tT][rR][iI][cC][tT][eE][dD][aA][dD][mM][iI][nN].*/ OR data_win_eventdata_targetObject:/.*\\[rR][dD][pP]-[tT][cC][pP]\\[pP][oO][rR][tT][nN][uU][mM][bB][eE][rR].*/ OR data_win_eventdata_targetObject:/.*\\[cC][oO][nN][tT][rR][oO][lL]\\[lL][sS][aA]\\[rR][uU][nN][aA][sS][pP][pP][lL].*/)
    pivot_on: host
    window: 2h
  - name: Mimikatz-style pass-the-hash and restricted admin command lines
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[sS][eE][kK][uU][rR][lL][sS][aA].*/ OR data_win_eventdata_commandLine:/.*\/[rR][eE][sS][tT][rR][iI][cC][tT][eE][dD][aA][dD][mM][iI][nN].*/ OR data_win_eventdata_commandLine:/.*[pP][rR][iI][vV][iI][lL][eE][gG][eE]::[dD][eE][bB][uU][gG].*/ OR data_win_eventdata_commandLine:/.*[dD][iI][sS][aA][bB][lL][eE][rR][eE][sS][tT][rR][iI][cC][tT][eE][dD][aA][dD][mM][iI][nN].*/ OR data_win_eventdata_commandLine:/.*[pP][tT][hH].*/))
    pivot_on: host
    window: 6h
  - name: LSASS access and credential dumping tools on host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[cC][oO][mM][sS][vV][cC][sS]\.[dD][lL][lL].*/ OR data_win_eventdata_commandLine:/.*[pP][rR][oO][cC][dD][uU][mM][pP].*/ OR data_win_eventdata_commandLine:/.*[lL][sS][aA][sS][sS].*/ OR data_win_eventdata_commandLine:/.*[nN][tT][dD][sS][uU][tT][iI][lL].*/)))
    pivot_on: host
    window: 6h
  - name: RDP sessions and mstsc activity following the change
    query: (data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389") OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[mM][sS][tT][sS][cC]\.[eE][xX][eE])/))
    pivot_on: host
    window: 6h
  - name: NTLM network or RDP logons (pass-the-hash indicator)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"9") AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on: user
    window: 6h
