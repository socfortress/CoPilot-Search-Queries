name: COM Hijack via Sdclt
id: 07743f65-7ec9-404a-a519-913db7118a8d
version: 1
schema_version: "1.0"
date: "2023-09-28"
author: Omkar Gudhate
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07743f65-7ec9-404a-a519-913db7118a8d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to
  'HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute'. MITRE
  ATT&CK: T1546, T1548.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Classes\\\\Folder\\\\shell\\\\open\\\\command\\\\DelegateExecute*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Classes\Folder\shell\open\command\DelegateExecute*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://blog.sevagas.com/?Yet-another-sdclt-UAC-bypass
  - https://www.exploit-db.com/exploits/47696
  - https://attack.mitre.org/techniques/T1546/
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    COM Hijack via Sdclt detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1546,
    T1548
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546
    - T1548
  custom_tags:
    - hijack
    - sdclt
    - registry
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Ff][Oo][Ll][Dd][Ee][Rr]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ee][Xx][Ee][Cc][Uu][Tt][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 40f9af16-589d-4984-b78d-8c2aec023197
    name: Potential UAC Bypass Via Sdclt.EXE
    reason: 'Sdclt.exe UAC bypass process execution: the trigger step right after the key is set.'
  - id: da2738f2-fadb-4394-afa7-0a0674885afa
    name: Sdclt Child Processes
    reason: 'Sdclt child processes: the elevated payload the hijack launches.'
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: 'DelegateExecute UAC bypass: same hijack-HKCU-shell-command technique family.'
  - id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
    name: Bypass UAC Using Event Viewer
    reason: 'Event Viewer UAC bypass: sibling auto-elevate registry hijack used interchangeably.'
  - id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
    name: Registry Modification of MS-settings Protocol Handler
    reason: 'ms-settings handler modification: Fodhelper-style sibling bypass.'
  - id: d4e2745c-f0c6-4bde-a3ab-b553b3f693cc
    name: Persistence Via Disk Cleanup Handler - Autorun
    reason: 'Disk Cleanup handler persistence: post-elevation persistence option.'
  - id: 96f697b0-b499-4e5d-9908-a67bec11cdb6
    name: Removal of Potential COM Hijacking Registry Keys
    reason: 'Removal of COM hijack keys: attacker cleanup after the bypass runs.'
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: 'Registry tampering by suspicious process: shows who set the key.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sdclt execution and children
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*[Ss]dclt\.exe/ OR data_win_eventdata_image:/.*[Ss]dclt\.exe/)
    pivot_on: host
    window: 2h
  - name: Auto-elevate UAC bypass registry hijacks
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(\\Classes\\(Folder|exefile|ms-settings|mscfile)\\[Ss]hell\\[Oo]pen\\[Cc]ommand|DelegateExecute).*/
    pivot_on: host
    window: 4h
  - name: High-integrity shells after bypass
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:High AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32)\.exe/
    pivot_on: host
    window: 2h
  - name: Defense evasion after elevation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Set-MpPreference|DisableRealtimeMonitoring|[Ww]evtutil.*cl|[Vv]ssadmin.*delete).*/
    pivot_on: host
    window: 4h
