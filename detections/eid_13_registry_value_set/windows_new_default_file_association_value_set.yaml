name: Windows New Default File Association Value Set
id: Windows-New-Default-File-Association-Value-Set
version: 3
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects registry modifications to default file association handlers under
  HKEY_CLASSES_ROOT\*\shell\open\command. Attackers modify these values to
  execute arbitrary scripts or payloads when a user opens a file with a given
  extension, enabling persistence and code execution. Associated with Hermetic
  Wiper, Prestige Ransomware, Windows Privilege Escalation, and Windows
  Persistence Techniques tradecraft.
  MITRE ATT&CK: T1546.001 (Event Triggered Execution: Change Default File Association).

data_source:
  - Sysmon EventID 13 (RegistryEvent Value Set)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\shell\\open\\command\\*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*HKCR\\*"
              - wildcard:
                  data_win_eventdata_targetObject: "*HKEY_CLASSES_ROOT\\*"
              - wildcard:
                  data_win_eventdata_targetObject: "*Classes\\*\\shell\\open\\command\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 (RegistryEvent Value Set) flowing to the Wazuh Indexer.
  Field data_win_eventdata_targetObject is confirmed working across all EventID 13
  detections in this environment. Field-validated based on established EventID 13
  detection patterns. Note: HKEY_CLASSES_ROOT paths may appear as HKCR or as
  HKEY_LOCAL_MACHINE\SOFTWARE\Classes in Sysmon telemetry depending on the context
  (system vs user hive). Consider also monitoring
  *HKEY_LOCAL_MACHINE\SOFTWARE\Classes\*\shell\open\command* for broader coverage.

known_false_positives: >
  Windows and third-party software will create and modify file associations during
  installation or upgrades. Additional filters should be applied to tune
  environment-specific false positives, particularly around known software
  installers and update processes.

references:
  - https://dmcxblue.gitbook.io/red-team-notes-2-0/red-team-techniques/privilege-escalation/untitled-3/accessibility-features
  - https://attack.mitre.org/techniques/T1546/001/

response:
  message: >
    Default file association registry value modified on $agent_name$ by $data_win_eventdata_user$.
    Registry path: $data_win_eventdata_targetObject$.
    Value set: $data_win_eventdata_details$.
    MITRE ATT&CK: T1546.001
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_path

tags:
  analytic_story:
    - Hermetic Wiper
    - Windows Registry Abuse
    - Prestige Ransomware
    - Windows Privilege Escalation
    - Windows Persistence Techniques
    - Data Destruction
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.001
  custom_tags:
    - file_association
    - shell_open_command
    - hkcr
    - persistence
    - registry
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 44a22d59-b175-4f13-8c16-cbaef5b581ff
    name: New File Association Using Exefile
    reason: Hijacking an extension's handler to exefile is a specific variant of this tamper.
  - id: ae6f14e6-14de-45b0-9f44-c0986f50dc89
    name: Change Default File Association To Executable Via Assoc
    reason: Command-line assoc/ftype is the usual way to make this change.
  - id: windows-change-file-association-notepad-001
    name: Windows Change File Association Command To Notepad
    reason: Association rewrites on the same key family, used to neutralise script files.
  - id: 7530b96f-ad8e-431d-a04d-ac85cc461fdc
    name: Custom File Open Handler Executes PowerShell
    reason: A handler that launches PowerShell is the usual payload of the changed command.
  - id: 9df5f547-c86a-433e-b533-f2794357e242
    name: Classes Autorun Keys Modification
    reason: Other Classes-hive autorun hooks planted by the same actor.
  - id: windows-modify-registry-utilize-progids-001
    name: Windows Modify Registry Utilize ProgIDs
    reason: ProgID hijacks are a sibling Classes-hive execution hijack.
  - id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
    name: Potential Persistence Via Custom Protocol Handler
    reason: Protocol handler hijack uses the same shell\open\command mechanism.
  - id: 2f974656-6d83-4059-bbdf-68ac5403422f
    name: Hermetic Wiper TG Process Patterns
    reason: Named in the rule's tradecraft; wiper activity can follow association tampering.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell open command registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*shell.open.command.*/
    pivot_on: host
    window: 24h
  - name: Assoc / ftype / reg commands changing handlers
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(assoc +\.|ftype +|reg(\.exe)? +add.*(shell.open.command|Classes)).*/
    pivot_on: host
    window: 6h
  - name: Handler values pointing to scripts or LOLBins
    query: data_win_system_eventID:13 AND data_win_eventdata_details:(*powershell* OR *mshta* OR *wscript* OR *cscript* OR *cmd.exe* OR *rundll32* OR *AppData* OR *Temp*)
    pivot_on: host
    window: 24h
  - name: Script hosts launched by explorer on file open
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ee]xplorer\.exe/ AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Mm]shta|[Ww]script|[Cc]script|[Cc]md)\.exe/
    pivot_on: host
    window: 6h
  - name: Dropped executables and scripts in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(AppData|Temp|ProgramData|Public).*\.(exe|dll|ps1|vbs|js|hta|bat)/
    pivot_on: host
    window: 4h
