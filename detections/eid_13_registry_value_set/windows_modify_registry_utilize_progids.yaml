name: Windows Modify Registry Utilize ProgIDs
id: windows-modify-registry-utilize-progids-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modifications to ms-settings ProgID CurVer registry entries used 
  to bypass UAC. ValleyRAT creates or alters ProgID associations to execute 
  malicious processes when specific file types are opened, enabling privilege 
  escalation without UAC prompts.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\ms-settings\\CurVer*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    required: false
    default: "now-24h"
  END_TIME:
    type: datetime
    required: false
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 monitoring registry ProgID paths. May need 
  ms-settings path added to Sysmon config.

known_false_positives: >
  Unknown. ProgID CurVer modifications are rare in legitimate use.

references:
  - https://v3ded.github.io/redteam/utilizing-programmatic-identifiers-progids-for-uac-bypasses
  - https://www.fortinet.com/blog/threat-research/valleyrat-campaign-targeting-chinese-speakers
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    ProgID UAC bypass attempt on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - ValleyRAT
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - progid
    - uac_bypass
    - valleyrat
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*ms-settings.*CurVer.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: The ms-settings CurVer hijack redirects the ms-settings handler that fodhelper.exe auto-elevates and launches; its execution is the trigger that turns the registry write into elevated code.
  - id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
    name: Registry Modification of MS-settings Protocol Handler
    reason: Same ms-settings handler hijack seen from the command line (reg.exe/PowerShell), identifying the tool that wrote the key.
  - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
    name: FodHelper UAC Bypass
    reason: Process-side confirmation that fodhelper.exe ran and spawned an unexpected elevated child after the CurVer redirect.
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: Sibling HKCU shell-handler UAC bypass frequently tried alongside ms-settings hijacks.
  - id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
    name: Bypass UAC Using Event Viewer
    reason: Alternative registry-hijack auto-elevation technique an attacker falls back to when one handler is blocked.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Once elevated, ValleyRAT-style malware persists via Run keys pointing to user-writable folders.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: fodhelper or computerdefaults auto-elevation launch
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ff]odhelper\.exe/ OR data_win_eventdata_image:/.*[Cc]omputerdefaults\.exe/ OR data_win_eventdata_image:/.*[Ss]dclt\.exe/)
    pivot_on: host
    window: 1h
  - name: ms-settings or shell open command key writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Mm][Ss]-[Ss]ettings.*/ OR data_win_eventdata_targetObject:/.*[Ss]hell\\[Oo]pen\\[Cc]ommand.*/)
    pivot_on: host
    window: 2h
  - name: High-integrity children of auto-elevating binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_integrityLevel:"High" AND (data_win_eventdata_parentImage:/.*[Ff]odhelper\.exe/ OR data_win_eventdata_parentImage:/.*[Cc]omputerdefaults\.exe/)
    pivot_on: host
    window: 1h
  - name: Executable dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic).*\.(exe|dll|bat|ps1|vbs|js|scr|lnk)/
    pivot_on: host
    window: 4h
  - name: Persistence key writes after elevation
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon\\[Ss]hell.*/ OR data_win_eventdata_targetObject:/.*[Ss]tartup.*/))
    pivot_on: host
    window: 4h
