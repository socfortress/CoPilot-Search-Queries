name: Potential COM Object Hijacking Via TreatAs Subkey - Registry
id: 9b0f8a61-91b2-464f-aceb-0527e0a45020
version: 1
schema_version: "1.0"
date: "2025-10-26"
author: Kutepov Anton, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9b0f8a61-91b2-464f-aceb-0527e0a45020
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects COM object hijacking via TreatAs subkey. MITRE ATT&CK: T1546.015.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*HKU\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Classes\\\\CLSID\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\TreatAs*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_image:
                    value: "C:\\WINDOWS\\system32\\svchost.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*HKU\*'; data_win_eventdata_targetObject matches '*Classes\CLSID\*';
  data_win_eventdata_targetObject matches '*\TreatAs*', among other conditions.

known_false_positives: >
  Maybe some system utilities in rare cases use linking keys for backward
  compatibility. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://bohops.com/2018/08/18/abusing-the-com-registry-structure-part-2-loading-techniques-for-evasion-and-persistence/
  - https://attack.mitre.org/techniques/T1546/015/

response:
  message: >
    Potential COM Object Hijacking Via TreatAs Subkey - Registry detected on
    host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1546.015
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.015
  custom_tags:
    - object
    - hijacking
    - treatas
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Hh][Kk][Uu]\\.*/ AND data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Cc][Ll][Ss][Ii][Dd]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Tt][Rr][Ee][Aa][Tt][Aa][Ss].*/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

