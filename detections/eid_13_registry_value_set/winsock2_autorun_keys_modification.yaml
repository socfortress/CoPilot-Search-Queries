name: WinSock2 Autorun Keys Modification
id: d6c2ce7e-afb5-4337-9ca4-4b5254ed0565
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d6c2ce7e-afb5-4337-9ca4-4b5254ed0565
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modification of autostart extensibility point (ASEP) in registry.
  MITRE ATT&CK: T1547.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\System\\\\CurrentControlSet\\\\Services\\\\WinSock2\\\\Parameters*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Protocol_Catalog9\\\\Catalog_Entries*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\NameSpace_Catalog5\\\\Catalog_Entries*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_details"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details:
                          value: "(Empty)"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\MsiExec.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\syswow64\\MsiExec.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\System\CurrentControlSet\Services\WinSock2\Parameters*';
  data_win_eventdata_targetObject matches
  '*\Protocol_Catalog9\Catalog_Entries*'; data_win_eventdata_targetObject
  matches '*\NameSpace_Catalog5\Catalog_Entries*', among other conditions.

known_false_positives: >
  Legitimate software automatically (mostly, during installation) sets up
  autorun keys for legitimate reason. Legitimate administrator sets up autorun
  keys for legitimate reason. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
  - https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
  - https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    WinSock2 Autorun Keys Modification detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1547.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - winsock2
    - autorun
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ww][Ii][Nn][Ss][Oo][Cc][Kk]2\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss].*/ AND (data_win_eventdata_targetObject:/.*\\[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll]_[Cc][Aa][Tt][Aa][Ll][Oo][Gg]9\\[Cc][Aa][Tt][Aa][Ll][Oo][Gg]_[Ee][Nn][Tt][Rr][Ii][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]_[Cc][Aa][Tt][Aa][Ll][Oo][Gg]5\\[Cc][Aa][Tt][Aa][Ll][Oo][Gg]_[Ee][Nn][Tt][Rr][Ii][Ee][Ss].*/) AND _exists_:data_win_eventdata_details AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f674e36a-4b91-431e-8aef-f8a96c2aca35
    name: CurrentControlSet Autorun Keys Modification
    reason: Sibling ASEP rule for service/session autostarts written alongside LSP persistence
  - id: e7b18879-676e-4a0e-ae18-27039185a8e7
    name: New Netsh Helper DLL Registered From A Suspicious Location
    reason: Alternate network-stack DLL persistence used by the same actors
  - id: e6fe26ee-d063-4f5b-b007-39e90aaf50e3
    name: Potential Persistence Via AutodialDLL
    reason: Winsock-adjacent DLL hijack loading into network-aware processes
  - id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
    name: Potential Credential Dumping Attempt Using New NetworkProvider - REG
    reason: Network provider DLL registration for credential capture, similar mechanism
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Companion Run key persistence in the same intrusion
  - id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
    name: Persistence Via New SIP Provider
    reason: Other registry-registered provider DLL persistence
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Winsock/network provider registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*([Ww]in[Ss]ock|[Nn]etwork[Pp]rovider|[Aa]utodial).*/
    pivot_on: host
    window: 6h
  - name: Winsock catalog manipulation via netsh
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Nn]etsh.*[Ww]insock.*/
    pivot_on: host
    window: 4h
  - name: New DLLs written to temp, ProgramData or user paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND data_win_eventdata_targetFilename:(/.*\\[Tt]emp\\.*/ OR /.*\\[Pp]rogram[Dd]ata\\.*/ OR /.*\\[Uu]sers\\.*/)
    pivot_on: host
    window: 6h
  - name: Unsigned DLL loads into network-facing processes
    query: data_win_system_eventID:7 AND data_win_eventdata_signed:false AND data_win_eventdata_image:(/.*\\svchost\.exe/ OR /.*\\chrome\.exe/ OR /.*\\iexplore\.exe/ OR /.*\\msedge\.exe/)
    pivot_on: host
    window: 24h
