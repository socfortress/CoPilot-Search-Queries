name: Windows Modify Registry No Auto Reboot With Logon User
id: windows-modify-registry-no-auto-reboot-logon-user-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of NoAutoRebootWithLoggedOnUsers registry value to 1 
  under Windows Update AU policy. This prevents automatic reboots after updates 
  when users are logged in, allowing adversaries to avoid system restarts that 
  would interrupt malicious operations. Used by RedLine Stealer.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\WindowsUpdate\\AU\\NoAutoRebootWithLoggedOnUsers"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  WindowsUpdate policy registry paths.

known_false_positives: >
  Administrators may configure this via WSUS Group Policy. Investigate 
  process and user context.

references:
  - https://learn.microsoft.com/de-de/security-updates/windowsupdateservices/18127499
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Auto reboot with logged-on users disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 9
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 9
  threat_objects: []

tags:
  analytic_story:
    - RedLine Stealer
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_update
    - auto_reboot
    - update_tampering
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*WindowsUpdate.*AU.*NoAutoRebootWithLoggedOnUsers/ AND data_win_eventdata_details:"DWORD (0x00000001)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-no-auto-update-001
    name: Windows Modify Registry No Auto Update
    reason: Sibling Windows Update AU policy tamper used by RedLine; together they indicate update suppression rather than plain WSUS config
  - id: windows-modify-registry-donotconnect-wsus-001
    name: Windows Modify Registry DoNotConnectToWindowsUpdateInternetLocations
    reason: Another update-channel suppression write often set in the same burst
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Defender exclusions are the usual companion of implant staging; shows the payload being shielded
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Defense impairment by the same actor right before or after policy-key tampering
  - id: 0e0255bf-2548-47b8-9582-c0955c9283f5
    name: Suspicious Reg Add BitLocker
    reason: Same reg.exe-driven policy tampering style; relevant if the host is being prepared for impact
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Update and policy registry writes on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww]indows[Uu]pdate.[Aa][Uu].*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies.[Mm]icrosoft.[Ww]indows [Dd]efender.*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies.[Ss]ystem.*/ OR data_win_eventdata_targetObject:/.*[Pp]olicies.[Ee]xplorer.*/)
    pivot_on:
    - host
    window: 2h
  - name: Update service stop or disable commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(wuauserv|[Uu]so[Ss]vc|[Ww]aa[Ss][Mm]edic).*/ AND (data_win_eventdata_commandLine:/.*[Ss]top.*/ OR data_win_eventdata_commandLine:/.*[Dd]isabled.*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Info-stealer recon: AV query, Wi-Fi keys, scheduled task creation'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]etsh.*[Ww]lan.*[Kk]ey=clear.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Aa]nti[Vv]irus[Pp]roduct.*/ OR data_win_eventdata_commandLine:/.*[Ss]chtasks.*[Cc]reate.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Ww]mi[Oo]bject.*[Aa]nti[Vv]irus[Pp]roduct.*/)
    pivot_on:
    - host
    window: 2h
  - name: Downloader or staging tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Nn]et.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_commandLine:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/ OR data_win_eventdata_commandLine:/.*[Cc]ertutil.*[Uu]rl[Cc]ache.*/ OR data_win_eventdata_commandLine:/.*[Bb]itsadmin.*transfer.*/)
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence written on this host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion.[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon.[Ss]hell.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon.[Uu]serinit.*/ OR data_win_eventdata_targetObject:/.*[Ii]mage [Ff]ile [Ee]xecution [Oo]ptions.*/)
    pivot_on:
    - host
    window: 2h
