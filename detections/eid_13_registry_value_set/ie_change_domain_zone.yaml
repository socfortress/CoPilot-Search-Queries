name: IE Change Domain Zone
id: 45e112d0-7759-4c2a-aa36-9f8fb79d3393
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 45e112d0-7759-4c2a-aa36-9f8fb79d3393
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Hides the file extension through modification of the registry. MITRE ATT&CK:
  T1137.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Internet Settings\\\\ZoneMap\\\\Domains\\\\*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000000)"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "DWORD (0x00000001)"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "(Empty)"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet
  Settings\ZoneMap\Domains\*'; data_win_eventdata_details equals 'DWORD
  (0x00000000)'; data_win_eventdata_details equals 'DWORD (0x00000001)', among
  other conditions.

known_false_positives: >
  Administrative scripts. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
  - https://learn.microsoft.com/en-us/troubleshoot/developer/browsers/security-privacy/ie-security-zones-registry-entries
  - https://attack.mitre.org/techniques/T1137/

response:
  message: >
    IE Change Domain Zone detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1137
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137
  custom_tags:
    - change
    - domain
    - registry
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Zz][Oo][Nn][Ee][Mm][Aa][Pp]\\[Dd][Oo][Mm][Aa][Ii][Nn][Ss]\\.*/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/ OR data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3fd4c8d7-8362-4557-a8e6-83b29cc0d724
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols
    reason: 'protocol-level zone downgrade: stronger variant of the same IE zone trust weakening'
  - id: 10344bb3-7f65-46c2-b915-2d00d47be5b0
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols Via CLI
    reason: ZoneMap downgrade via command line; reveals the process responsible
  - id: fb50eb7a-5ab1-43ae-bcc9-091818cb8424
    name: Disabled IE Security Features
    reason: 'disabling IE security features: sibling browser-hardening bypass'
  - id: windows-disable-ie-addons-extoff-001
    name: Windows Disable Internet Explorer Addons
    reason: IE add-on/hardening disablement often paired with zone trust changes
  - id: a80f662f-022f-4429-9b8c-b1a41aaa6688
    name: Internet Explorer Autorun Keys Modification
    reason: 'IE extension/toolbar autorun modification: persistence variant of IE configuration abuse'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Internet Settings ZoneMap / Zones registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ii]nternet [Ss]ettings.*([Zz]one[Mm]ap|[Zz]ones).*/
    pivot_on: host
    window: 2h
  - name: Script hosts / iexplore spawning processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ii][Ee][Xx][Pp][Ll][Oo][Rr][Ee])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Script/HTA/shortcut files created in download or temp folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Dd]ownloads\\|\\[Tt]emp\\).*\.([Hh][Tt][Aa]|[Jj][Ss]|[Vv][Bb][Ss]|[Ww][Ss][Ff]|[Ll][Nn][Kk])/
    pivot_on: host
    window: 2h
  - name: Run key persistence written afterward
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc]urrent[Vv]ersion\\[Rr]un.*/
    pivot_on: host
    window: 4h
