name: Powershell Executed As A Service
id: windows-malicious-powershell-executed-as-a-service-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the creation of a Windows service with a PowerShell command containing 
  suspicious flags (-nop, -w hidden, -noexit, -enc) in the ImagePath. This indicates 
  potential abuse of the Windows Service Control Manager (sc.exe) to execute malicious 
  PowerShell payloads as a service, commonly used by ransomware (Rhysida) and RATs 
  for persistence and code execution.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*Services*ImagePath"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details: "*powershell*"
              - wildcard:
                  data_win_eventdata_details: "*pwsh*"
              - wildcard:
                  data_win_eventdata_details: "*powershell_ise*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details: "*-nop*"
              - wildcard:
                  data_win_eventdata_details: "*-w hidden*"
              - wildcard:
                  data_win_eventdata_details: "*-noe*"
              - wildcard:
                  data_win_eventdata_details: "*-enc*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log registry value set events (EventID 13). Ensure 
  the Sysmon configuration captures registry modifications under 
  HKLM\System\CurrentControlSet\Services. The index pattern should match your 
  Wazuh index naming convention.

known_false_positives: >
  Legitimate PowerShell-based services are rare but possible in managed environments. 
  Filter based on known service names and authorized automation tools. The combination 
  of PowerShell with suspicious flags (-nop, -w hidden, -enc) in a service ImagePath 
  is highly suspicious and should be investigated.

references:
  - https://attack.mitre.org/techniques/T1569/002/
  - https://www.fireeye.com/content/dam/fireeye-www/blog/pdfs/dosfuscation-report.pdf
  - https://www.danielbohannon.com/blog-1/2017/3/12/powershell-execution-argument-obfuscation-how-it-can-make-detection-easier

response:
  message: >
    Malicious PowerShell service creation detected on $agent_name$. 
    A service was created with PowerShell and suspicious flags in the ImagePath: 
    $data_win_eventdata_details$. MITRE ATT&CK: T1569.002
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Compromised Windows Host
    - Rhysida Ransomware
    - Malicious PowerShell
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Services.*ImagePath/ AND (data_win_eventdata_details:/.*powershell.*/ OR data_win_eventdata_details:/.*pwsh.*/ OR data_win_eventdata_details:/.*powershell_ise.*/) AND (data_win_eventdata_details:/.*\-nop.*/ OR data_win_eventdata_details:/.*\-w\s+hidden.*/ OR data_win_eventdata_details:/.*\-noe.*/ OR data_win_eventdata_details:/.*\-enc.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Same Services registry write path; flags a service ImagePath pointing at an unusual binary/location, confirming the new service is malicious
  - id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
    name: Potential CobaltStrike Service Installations - Registry
    reason: Cobalt Strike getsystem and psexec-style payloads install PowerShell services through the identical ImagePath registry write
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Process-side view of the service creation that produced this registry write
  - id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
    name: Metasploit Or Impacket Service Installation Via SMB PsExec
    reason: Remote service install over SMB is the usual delivery for an encoded PowerShell service; points to the lateral movement origin
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec-style remote service creation precedes this registry write when the service was pushed from another host
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The service start launches powershell -enc; this fires when the payload executes
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: Attackers set the new service to auto-start for persistence right after creating it
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installs (7045/4697) on host
    query: (data_win_system_eventID:7045 OR data_win_system_eventID:4697)
    pivot_on: host
    window: 2h
  - name: PowerShell launched by services.exe
    query: data_win_eventdata_parentImage:/.*[Ss]ervices\.exe/ AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh)\.exe/
    pivot_on: host
    window: 2h
  - name: Encoded or hidden PowerShell command lines
    query: data_win_eventdata_commandLine:(/.*-[Ee]nc.*/ OR /.*-[Ww].*[Hh]idden.*/ OR /.*-[Nn]op.*/)
    pivot_on: host
    window: 4h
  - name: sc.exe service create/config activity
    query: data_win_eventdata_image:/.*\\sc\.exe/ AND data_win_eventdata_commandLine:(/.*[Cc]reate.*/ OR /.*[Cc]onfig.*/)
    pivot_on: host
    window: 2h
  - name: Services registry ImagePath writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*Services.*ImagePath/
    pivot_on: host
    window: 24h
