name: Windows Modify Registry Configure BitLocker
id: windows-modify-registry-configure-bitlocker-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects suspicious registry modifications targeting BitLocker FVE settings 
  to bypass TPM requirements, enable BitLocker without TPM, and enforce specific 
  startup key/PIN configurations. ShrinkLocker ransomware alters these registry 
  keys to weaken encryption, enabling unauthorized access and mass encryption.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\Policies\\Microsoft\\FVE\\*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      filter:
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject: "*EnableBDEWithNoTPM"
                          - wildcard:
                              data_win_eventdata_targetObject: "*EnableNonTPM"
                          - wildcard:
                              data_win_eventdata_targetObject: "*UseAdvancedStartup"
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_details: "DWORD (0x00000001)"
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject: "*UsePIN"
                          - wildcard:
                              data_win_eventdata_targetObject: "*UsePartialEncryptionKey"
                          - wildcard:
                              data_win_eventdata_targetObject: "*UseTPM"
                          - wildcard:
                              data_win_eventdata_targetObject: "*UseTPMKey"
                          - wildcard:
                              data_win_eventdata_targetObject: "*UseTPMKeyPIN"
                          - wildcard:
                              data_win_eventdata_targetObject: "*UseTPMPIN"
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_details: "DWORD (0x00000002)"
            minimum_should_match: 1
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  the FVE BitLocker policy registry path. Ensure Sysmon config includes 
  Policies\Microsoft\FVE in EventID 13 TargetObject rules.

known_false_positives: >
  Administrators may enable or disable BitLocker features via Group Policy. 
  Verify user context and whether changes align with approved security policy.

references:
  - https://www.bleepingcomputer.com/news/security/new-shrinklocker-ransomware-uses-bitlocker-to-encrypt-your-files/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    BitLocker registry configuration modified on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. 
    Possible ShrinkLocker. MITRE ATT&CK: T1112
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - ShrinkLocker
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - bitlocker
    - fve_registry
    - ransomware
    - encryption_tampering
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Policies.*Microsoft.*FVE.*/ AND ((data_win_eventdata_targetObject:/.*EnableBDEWithNoTPM.*/ OR data_win_eventdata_targetObject:/.*EnableNonTPM.*/ OR data_win_eventdata_targetObject:/.*UseAdvancedStartup.*/) AND data_win_eventdata_details:"DWORD (0x00000001)" OR (data_win_eventdata_targetObject:/.*UsePIN.*/ OR data_win_eventdata_targetObject:/.*UsePartialEncryptionKey.*/ OR data_win_eventdata_targetObject:/.*UseTPM.*/ OR data_win_eventdata_targetObject:/.*UseTPMKey.*/ OR data_win_eventdata_targetObject:/.*UseTPMKeyPIN.*/ OR data_win_eventdata_targetObject:/.*UseTPMPIN.*/) AND data_win_eventdata_details:"DWORD (0x00000002)")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0e0255bf-2548-47b8-9582-c0955c9283f5
    name: Suspicious Reg Add BitLocker
    reason: Same FVE policy tampering done via reg.exe; shows the command line behind the registry write
  - id: Windows-BitLocker-Suspicious-Command-Usage
    name: Windows BitLocker Suspicious Command Usage
    reason: ShrinkLocker follows the policy change with manage-bde/PowerShell BitLocker commands to enable encryption with attacker-chosen protectors
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware removes recovery copies around the BitLocker change so the victim cannot restore
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: ShrinkLocker alters boot configuration and recovery settings alongside BitLocker
  - id: windows-modify-registry-disable-rdp-001
    name: Windows Modify Registry Disable RDP
    reason: ShrinkLocker also sets fDenyTSConnections to isolate the host from remote administration
  - id: 5de03871-5d46-4539-a82d-3aa992a69a83
    name: Registry Disable System Restore
    reason: Disabling System Restore removes another recovery path in the same ransomware prep
  - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
    name: Windows Defender Service Disabled - Registry
    reason: Defence evasion typically precedes the destructive encryption stage
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BitLocker / manage-bde command execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm]anage-[Bb][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee]nable-[Bb]it[Ll]ocker.*/ OR data_win_eventdata_commandLine:/.*[Bb]it[Ll]ocker.*/)
    pivot_on: host
    window: 2h
  - name: Recovery inhibition commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Rr]eagentc.*/)
    pivot_on: host
    window: 4h
  - name: Other FVE policy registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Policies.*Microsoft.*FVE.*/
    pivot_on: host
    window: 24h
  - name: RDP and firewall isolation registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*fDenyTSConnections.*/ OR data_win_eventdata_targetObject:/.*SharedAccess.*FirewallPolicy.*/)
    pivot_on: host
    window: 4h
  - name: Script interpreters running on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc]script\.exe/ OR data_win_eventdata_image:/.*[Ww]script\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*\.exe/)
    pivot_on: host
    window: 2h
