name: Suspicious Printer Driver Empty Manufacturer
id: e0813366-0407-449a-9869-a2db1119dc41
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e0813366-0407-449a-9869-a2db1119dc41
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious printer driver installation with an empty Manufacturer
  value. MITRE ATT&CK: T1574.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Control\\\\Print\\\\Environments\\\\Windows x64\\\\Drivers*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Manufacturer*"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "(Empty)"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\CutePDF Writer v4.0\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\VNC Printer (PS)\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\VNC Printer (UD)\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Version-3\\\\PDF24\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\Print\Environments\Windows x64\Drivers*';
  data_win_eventdata_targetObject matches '*\Manufacturer*';
  data_win_eventdata_details equals '(Empty)', among other conditions.

known_false_positives: >
  Alerts on legitimate printer drivers that do not set any more details in the
  Manufacturer value. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1410545674773467140
  - https://attack.mitre.org/techniques/T1574/

response:
  message: >
    Suspicious Printer Driver Empty Manufacturer detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1574
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574
  custom_tags:
    - printer
    - driver
    - empty
    - registry
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Xx]64\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss].*/ AND data_win_eventdata_targetObject:/.*\\[Mm][Aa][Nn][Uu][Ff][Aa][Cc][Tt][Uu][Rr][Ee][Rr].*/ AND data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/ AND _exists_:data_win_eventdata_targetObject AND NOT (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Tt][Ee][Pp][Dd][Ff] [Ww][Rr][Ii][Tt][Ee][Rr] [Vv]4\.0\\.*/ OR data_win_eventdata_targetObject:/.*\\[Vv][Nn][Cc] [Pp][Rr][Ii][Nn][Tt][Ee][Rr] \([Pp][Ss]\)\\.*/ OR data_win_eventdata_targetObject:/.*\\[Vv][Nn][Cc] [Pp][Rr][Ii][Nn][Tt][Ee][Rr] \([Uu][Dd]\)\\.*/ OR data_win_eventdata_targetObject:/.*\\[Vv][Ee][Rr][Ss][Ii][Oo][Nn]-3\\[Pp][Dd][Ff]24\\.*/)

