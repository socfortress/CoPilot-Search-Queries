name: New File Association Using Exefile
id: 44a22d59-b175-4f13-8c16-cbaef5b581ff
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Andreas Hunkeler (@Karneades)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 44a22d59-b175-4f13-8c16-cbaef5b581ff
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the abuse of the exefile handler in new file association. Used for
  bypass of security products.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Classes\\\\.*"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "exefile"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Classes\.*'; data_win_eventdata_details equals 'exefile'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/mrd0x/status/1461041276514623491

response:
  message: >
    New File Association Using Exefile detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - association
    - exefile
    - registry
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\\..*/ AND data_win_eventdata_details:/[Ee][Xx][Ee][Ff][Ii][Ll][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ae6f14e6-14de-45b0-9f44-c0986f50dc89
    name: Change Default File Association To Executable Via Assoc
    reason: Assoc.exe mapping an extension to an executable type is the command-line way to create this association.
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: Shell Open registry key manipulation is the sibling technique hijacking handlers.
  - id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
    name: Suspicious Shell Open Command Registry Modification
    reason: Suspicious shell open command modification often accompanies handler hijacks.
  - id: Windows-New-Default-File-Association-Value-Set
    name: Windows New Default File Association Value Set
    reason: Generic new default file association value set covers the same registry area.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Assoc/ftype commands referencing exefile
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Ss][Ss][Oo][Cc]|[Ff][Tt][Yy][Pp][Ee]).*[Ee][Xx][Ee][Ff][Ii][Ll][Ee].*/
    pivot_on: host
    window: 6h
  - name: Registry writes to Classes shell open command
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\.*[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/
    pivot_on: host
    window: 6h
  - name: Executables written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*([Uu]sers|[Tt]emp|[Pp]rogram[Dd]ata).*/
    pivot_on: host
    window: 6h
  - name: Executables launched from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Uu]sers|[Tt]emp|[Pp]rogram[Dd]ata).*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
