name: Potential Persistence Via Scrobj.dll COM Hijacking
id: fe20dda1-6f37-4379-bbe0-a98d400cae90
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fe20dda1-6f37-4379-bbe0-a98d400cae90
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of scrobj.dll as this DLL looks for the ScriptletURL key to get the
  location of the script to execute. MITRE ATT&CK: T1546.015.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*InprocServer32\\\\(Default)"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "C:\\WINDOWS\\system32\\scrobj.dll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*InprocServer32\(Default)'; data_win_eventdata_details equals
  'C:\WINDOWS\system32\scrobj.dll'.

known_false_positives: >
  Legitimate use of the dll. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1546.015/T1546.015.md
  - https://attack.mitre.org/techniques/T1546/015/

response:
  message: >
    Potential Persistence Via Scrobj.dll COM Hijacking detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1546.015
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.015
  custom_tags:
    - persistence
    - scrobj
    - hijacking
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/ AND data_win_eventdata_details:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Cc][Rr][Oo][Bb][Jj]\.[Dd][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dc5c24af-6995-49b2-86eb-a9ff62199e82
    name: COM Hijacking via TreatAs
    reason: Alternative COM hijack technique frequently used with scriptlets for the same persistence.
  - id: 790317c0-0a36-4a6a-a105-6e576bf99a14
    name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
    reason: Hijack of default system CLSIDs through the same registry mechanism.
  - id: windows-com-hijacking-inprocserver32-001
    name: Windows COM Hijacking InprocServer32 Modification
    reason: Process-level view of the InprocServer32 modification matching this registry write.
  - id: 96f697b0-b499-4e5d-9908-a67bec11cdb6
    name: Removal of Potential COM Hijacking Registry Keys
    reason: 'Cleanup: attacker removes hijack keys after execution.'
  - id: dc64d064-d346-11eb-8588-acde48001122
    name: Execute Javascript With Jscript COM CLSID
    reason: Script execution through a COM CLSID, the scriptlet payload style.
  - id: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
    name: Scripting/CommandLine Process Spawned Regsvr32
    reason: regsvr32 /i:url scrobj.dll (Squiblydoo) uses the same scrobj.dll scriptlet host.
  - id: d06be4b9-8045-428b-a567-740a26d9db25
    name: Verclsid.exe Runs COM Object
    reason: 'Possible trigger: verclsid instantiates the hijacked CLSID.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ScriptletURL registry values
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ss]criptlet[Uu][Rr][Ll].*/
    pivot_on: host
    window: 6h
  - name: Other CLSID InprocServer32 writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Cc][Ll][Ss][Ii][Dd]\\.*[Ii]nproc[Ss]erver32.*/
    pivot_on: host
    window: 6h
  - name: scrobj.dll image loads
    query: data_win_system_eventID:7 AND data_win_eventdata_imageLoaded:/.*[Ss][Cc][Rr][Oo][Bb][Jj]\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 24h
  - name: Scriptlet command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]crobj|\.[Ss][Cc][Tt]|[Ss]criptlet).*/
    pivot_on: host
    window: 6h
  - name: .sct scriptlet file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Tt]/
    pivot_on: host
    window: 6h
