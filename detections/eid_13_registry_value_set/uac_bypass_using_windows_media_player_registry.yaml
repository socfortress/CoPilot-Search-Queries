  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy] [Aa][Ss][Ss][Ii][Ss][Tt][Aa][Nn][Tt]\\[Ss][Tt][Oo][Rr][Ee]\\[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Mm][Ee][Dd][Ii][Aa] [Pp][Ll][Aa][Yy][Ee][Rr]\\[Oo][Ss][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_details:/[Bb][Ii][Nn][Aa][Rr][Yy] [Dd][Aa][Tt][Aa]/

