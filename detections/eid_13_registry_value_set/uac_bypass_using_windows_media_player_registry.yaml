name: UAC Bypass Using Windows Media Player - Registry
id: 5f9db380-ea57-4d1e-beab-8a2d33397e93
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5f9db380-ea57-4d1e-beab-8a2d33397e93
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using Windows Media Player osksupport.dll
  (UACMe 32). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\AppCompatFlags\\\\Compatibility Assistant\\\\Store\\\\C:\\\\Program Files\\\\Windows Media Player\\\\osk.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "Binary Data"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Compatibility
  Assistant\Store\C:\Program Files\Windows Media Player\osk.exe';
  data_win_eventdata_details equals 'Binary Data'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using Windows Media Player - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - media
    - player
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy] [Aa][Ss][Ss][Ii][Ss][Tt][Aa][Nn][Tt]\\[Ss][Tt][Oo][Rr][Ee]\\[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Mm][Ee][Dd][Ii][Aa] [Pp][Ll][Aa][Yy][Ee][Rr]\\[Oo][Ss][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_details:/[Bb][Ii][Nn][Aa][Rr][Yy] [Dd][Aa][Tt][Aa]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: The WMP/osksupport method is a UACME technique; Akagi is its implementation.
  - id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
    name: Bypass UAC Using Event Viewer
    reason: Alternative UAC bypass attempted by the same operator.
  - id: 6ea3bf32-9680-422d-9f50-e90716b12a66
    name: UAC Bypass Via Wsreset
    reason: Sibling elevation technique tried when another fails.
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: Registry-based sibling bypass.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Follow-on elevated shell that the bypass yields.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: osk.exe and Windows Media Player path activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Oo][Ss][Kk]\.[Ee][Xx][Ee]).*/ OR data_win_eventdata_commandLine:/.*([Oo][Ss][Kk][Ss][Uu][Pp][Pp][Oo][Rr][Tt]\.[Dd][Ll][Ll]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Mm][Ee][Dd][Ii][Aa] [Pp][Ll][Aa][Yy][Ee][Rr]\\[Oo][Ss][Kk]\.[Ee][Xx][Ee]).*/ OR data_win_eventdata_parentImage:/.*(\\[Oo][Ss][Kk]\.[Ee][Xx][Ee]).*/)
    pivot_on: host
    window: 2h
  - name: osksupport or Compatibility Assistant store writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Oo][Ss][Kk][Ss][Uu][Pp][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy] [Aa][Ss][Ss][Ii][Ss][Tt][Aa][Nn][Tt]\\[Ss][Tt][Oo][Rr][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Other UAC bypass registry hijacks
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Mm][Ss][Cc][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Ee][Xx][Ee][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Ff][Oo][Ll][Dd][Ee][Rr]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*[Ii][Nn][Vv][Ee][Nn][Tt][Oo][Rr][Yy][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ff][Ii][Ll][Ee]\\[Ww][Ii][Nn][Ss][Aa][Tt].*/)
    pivot_on: host
    window: 2h
  - name: High-integrity shells from auto-elevating binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Oo][Ss][Kk]\.[Ee][Xx][Ee]|\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]).*/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 1h
