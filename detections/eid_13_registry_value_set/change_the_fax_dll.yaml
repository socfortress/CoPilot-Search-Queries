name: Change the Fax Dll
id: 9e3357ba-09d4-4fbd-a7c5-ad6386314513
version: 1
schema_version: "1.0"
date: "2022-12-30"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e3357ba-09d4-4fbd-a7c5-ad6386314513
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect possible persistence using Fax DLL load when service restart. MITRE
  ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Fax\\\\Device Providers\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\ImageName*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "%systemroot%\\system32\\fxst30.dll"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Fax\Device Providers\*'; data_win_eventdata_targetObject
  matches '*\ImageName*'; data_win_eventdata_details equals
  '%systemroot%\system32\fxst30.dll'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/dottor_morte/status/1544652325570191361
  - https://raw.githubusercontent.com/RiccardoAncarani/talks/master/F-Secure/unorthodox-lateral-movement.pdf
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Change the Fax Dll detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - change
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ff][Aa][Xx]\\[Dd][Ee][Vv][Ii][Cc][Ee] [Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ii][Mm][Aa][Gg][Ee][Nn][Aa][Mm][Ee].*/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ff][Xx][Ss][Tt]30\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e3fdf743-f05b-4051-990a-b66919be1743
    name: Change User Account Associated with the FAX Service
    reason: 'Same Fax service abuse: attacker repoints the DLL and/or the service account to get code running as a privileged identity.'
  - id: 828af599-4c53-4ed2-ba4a-a9f835c434ea
    name: Fax Service DLL Search Order Hijack
    reason: Alternative way to get a rogue DLL into the Fax service; shows the DLL actually loading after the registry change.
  - id: c90362e0-2df3-4e61-94fe-b37615814cb1
    name: Potential Persistence Via Netsh Helper DLL - Registry
    reason: Sibling registry-based DLL persistence; attackers often stack several such footholds.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Fax service start or stop
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]c|[Nn]et)(\.exe)?\s+(start|stop).*[Ff]ax.*/
    pivot_on: host
    window: 6h
  - name: Non-system DLL loaded by FXSSVC
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Ff]xs[Ss]vc.*/ AND NOT data_win_eventdata_imageLoaded:/.*[Ww]indows.*/
    pivot_on: host
    window: 6h
  - name: DLLs created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.dll/ AND data_win_eventdata_targetFilename:(/.*[Tt]emp.*/ OR /.*[Pp]rogram[Dd]ata.*/ OR /.*[Uu]sers.*/)
    pivot_on: host
    window: 4h
  - name: Command lines touching Fax device providers
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ff]ax.*[Dd]evice [Pp]roviders.*/
    pivot_on: host
    window: 4h
