name: Potential Persistence Via Event Viewer Events.asp
id: a1e11042-a74a-46e6-b07c-c4ce8ecc239b
version: 1
schema_version: "1.0"
date: "2023-03-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a1e11042-a74a-46e6-b07c-c4ce8ecc239b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential registry persistence technique using the Event Viewer
  "Events.asp" technique. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Event Viewer\\\\MicrosoftRedirectionProgram*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Event Viewer\\\\MicrosoftRedirectionURL*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*C:\\\\WINDOWS\\\\system32\\\\svchost.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Event Viewer\\\\MicrosoftRedirectionProgram"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "%%SystemRoot%%\\PCHealth\\HelpCtr\\Binaries\\HelpCtr.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*C:\\\\WINDOWS\\\\system32\\\\svchost.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Event Viewer\\\\MicrosoftRedirectionProgramCommandLineParameters"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "-url hcp://services/centers/support?topic=%%s"
                                case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "http://go.microsoft.com/fwlink/events.asp"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "(Empty)"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows NT\CurrentVersion\Event
  Viewer\MicrosoftRedirectionProgram*'; data_win_eventdata_targetObject matches
  '*\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionURL*';
  data_win_eventdata_image matches '*C:\WINDOWS\system32\svchost.exe', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/nas_bench/status/1626648985824788480
  - https://admx.help/?Category=Windows_7_2008R2&Policy=Microsoft.Policies.InternetCommunicationManagement::EventViewer_DisableLinks
  - https://www.hexacorn.com/blog/2019/02/15/beyond-good-ol-run-key-part-103/
  - https://github.com/redcanaryco/atomic-red-team/blob/f296668303c29d3f4c07e42bdd2b28d8dd6625f9/atomics/T1112/T1112.md
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Potential Persistence Via Event Viewer Events.asp detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - persistence
    - viewer
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Vv][Ee][Nn][Tt] [Vv][Ii][Ee][Ww][Ee][Rr]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Rr][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Ii][Oo][Nn][Pp][Rr][Oo][Gg][Rr][Aa][Mm].*/ OR data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Vv][Ee][Nn][Tt] [Vv][Ii][Ee][Ww][Ee][Rr]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Rr][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Ii][Oo][Nn][Uu][Rr][Ll].*/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_details AND NOT ((data_win_eventdata_image:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Vv][Ee][Nn][Tt] [Vv][Ii][Ee][Ww][Ee][Rr]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Rr][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Ii][Oo][Nn][Pp][Rr][Oo][Gg][Rr][Aa][Mm]/ AND data_win_eventdata_details:/%%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%%\\[Pp][Cc][Hh][Ee][Aa][Ll][Tt][Hh]\\[Hh][Ee][Ll][Pp][Cc][Tt][Rr]\\[Bb][Ii][Nn][Aa][Rr][Ii][Ee][Ss]\\[Hh][Ee][Ll][Pp][Cc][Tt][Rr]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Vv][Ee][Nn][Tt] [Vv][Ii][Ee][Ww][Ee][Rr]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Rr][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Ii][Oo][Nn][Pp][Rr][Oo][Gg][Rr][Aa][Mm][Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]/ AND data_win_eventdata_details:/-[Uu][Rr][Ll] [Hh][Cc][Pp]:\/\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\/[Cc][Ee][Nn][Tt][Ee][Rr][Ss]\/[Ss][Uu][Pp][Pp][Oo][Rr][Tt].[Tt][Oo][Pp][Ii][Cc]=%%[Ss]/) OR data_win_eventdata_details:/[Hh][Tt][Tt][Pp]:\/\/[Gg][Oo]\.[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Cc][Oo][Mm]\/[Ff][Ww][Ll][Ii][Nn][Kk]\/[Ee][Vv][Ee][Nn][Tt][Ss]\.[Aa][Ss][Pp]/ OR data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7c81fec3-1c1d-43b0-996a-46753041b1b6
    name: UAC Bypass via Event Viewer
    reason: Same Event Viewer registry hijack family (mscfile/MicrosoftRedirection hijack); attacker often tries both the UAC-bypass and persistence variants on one host.
  - id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
    name: Bypass UAC Using Event Viewer
    reason: Registry-based eventvwr.exe abuse co-occurring with the redirection-program hijack shows the same tradecraft being tested.
  - id: be344333-921d-4c4d-8bb8-e584cf584780
    name: Potentially Suspicious Event Viewer Child Process
    reason: 'Follow-on: when eventvwr/mmc next launches, the hijacked MicrosoftRedirectionProgram spawns as its child process.'
  - id: 30fc8de7-d833-40c4-96b6-28319fbc4f6c
    name: UAC Bypass Using Event Viewer RecentViews
    reason: Sibling Event Viewer abuse via RecentViews file; same actor switching variants.
  - id: 63e4f530-65dc-49cc-8f80-ccfa95c69d43
    name: UAC Bypass Using EventVwr
    reason: File-drop variant of Event Viewer hijack, often the payload staged before the registry value is set.
  - id: 05a2ab7e-ce11-4b63-86db-ab32e763e11d
    name: MMC Spawning Windows Shell
    reason: Event Viewer runs inside mmc.exe; the redirection program launching a shell surfaces here.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Event Viewer launching a redirected child
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Ee]ventvwr|[Mm]mc)\.exe/ AND data_win_eventdata_image:/.*([Cc]md|[Pp]ower[Ss]hell|[Pp]wsh|[Mm]shta|[Ww]script|[Cc]script|[Rr]undll32|[Rr]egsvr32)\.exe/
    pivot_on: host
    window: 24h
  - name: Registry writes under Event Viewer key
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:*Event\ Viewer*
    pivot_on: host
    window: 6h
  - name: Payload files dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*\\Users\\Public\\* OR *\\AppData\\* OR *\\ProgramData\\* OR *\\Temp\\*) AND data_win_eventdata_targetFilename:(*.exe OR *.dll OR *.bat OR *.ps1 OR *.hta OR *.vbs)
    pivot_on: host
    window: 4h
  - name: Other autorun registry persistence by same actor
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(*CurrentVersion\\Run* OR *Winlogon* OR *Image\ File\ Execution* OR *CLSID*)
    pivot_on: host
    window: 24h
