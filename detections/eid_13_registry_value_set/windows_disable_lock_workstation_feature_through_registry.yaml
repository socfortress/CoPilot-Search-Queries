name: Windows Disable Lock Workstation Feature Through Registry
id: c82adbc6-9f00-11ec-a81f-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects a suspicious registry modification that disables the Lock Computer
  feature in Windows. It leverages Sysmon EventID 13, specifically monitoring changes to the registry
  path "*\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableLockWorkstation" with a
  value of "0x00000001". This activity is significant because it prevents users from locking their
  screens, a tactic often used by malware, including ransomware, to maintain control over compromised
  systems. If confirmed malicious, this could allow attackers to sustain their presence and execute
  further malicious actions without user interruption.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*DisableLockWorkstation"
        - term:
            data_win_eventdata_details: "DWORD (0x00000001)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with the registry value name,
  registry path, and registry value data from your endpoints. Sysmon EventID 13 captures registry
  modifications (SetValue operations). Ensure that Sysmon is configured to log registry operations
  and that these logs are properly ingested into Elasticsearch with complete registry path and value
  information. The detection specifically looks for modifications to the DisableLockWorkstation registry
  value being set to 0x00000001 (enabled/true), which prevents users from locking their workstations.

known_false_positives: >
  No false positives have been identified at this time. However, administrators may legitimately modify
  this registry setting in controlled environments. Organizations should establish baseline behavior for
  administrative registry modifications and create whitelist exceptions for approved management tools
  and administrative accounts that legitimately manage this policy.

references:
  - https://www.bleepingcomputer.com/news/security/in-dev-ransomware-forces-you-do-to-survey-before-unlocking-computer/
  - https://heimdalsecurity.com/blog/fatalrat-targets-telegram/

response:
  message: >
    Registry modification detected on $agent_name$. Process $data_win_eventdata_image$
    by user $data_win_eventdata_user$ modified DisableLockWorkstation registry key to value
    $data_win_eventdata_details$. This may indicate ransomware or malicious activity attempting to
    prevent screen locking and maintain control.
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process

tags:
  analytic_story:
    - Ransomware
    - Defense Evasion
    - Windows Policy Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - registry_modification
    - ransomware
    - defense_evasion
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\DisableLockWorkstation

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0df33e1a-9ef6-11ec-a1ad-acde48001122
    name: Windows Disable Change Password Through Registry
    reason: Sibling Policies\System tweak preventing users changing credentials; set by the same malware.
  - id: b2fb6830-9ed1-11ec-9fcb-acde48001122
    name: Windows Disable LogOff Button Through Registry
    reason: Removes logoff so the session stays attacker-controlled.
  - id: Windows_Disable_Shutdown_Button_Through_Registry
    name: Windows Disable Shutdown Button Through Registry
    reason: Same user-lockout policy bundle.
  - id: Windows_Disable_Windows_Group_Policy_Features_Through_Registry
    name: Windows Disable Windows Group Policy Features Through Registry
    reason: Disables policy tools so changes persist.
  - id: e2482f8d-3443-4237-b906-cc145d87a076
    name: Disable Internal Tools or Feature in Registry
    reason: Disabling Task Manager/regedit alongside screen-lock removal.
  - id: 8b9606c9-28be-4a38-b146-0e313cc232c1
    name: Potential Ransomware Activity Using LegalNotice Message
    reason: Ransom banner in the same registry area.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Ransomware next step: recovery destruction.'
  - id: 999e8307-a775-4d5f-addc-4855632335be
    name: Potential BlackByte Ransomware Activity
    reason: BlackByte is a family known to set this kind of registry policy tweak before encryption.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Policies lockout and UI restriction registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Policies.System|Policies.Explorer).*(DisableChangePassword|DisableLockWorkstation|DisableTaskMgr|DisableRegistryTools|NoLogoff|DisableCMD|legalnotice|NoClose|shutdownwithoutlogon).*/
    pivot_on: host
    window: 4h
  - name: Backup and recovery destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|wmic.*shadowcopy.*delete|wbadmin.*delete|bcdedit.*(recoveryenabled|bootstatuspolicy)|resize\s+shadowstorage).*/
    pivot_on: host
    window: 4h
  - name: Share mapping and remote access enablement
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net1?\s+use|fDenyTSConnections|netsh.*(firewall|advfirewall)|reg(\.exe)?\s+add.*Terminal Server).*/
    pivot_on: host
    window: 4h
  - name: Interactive and remote logons
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(2 OR 7 OR 10)
    pivot_on: host
    window: 4h
  - name: Ransom note creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(README|DECRYPT|RECOVER|HOW[_-]TO|RESTORE).*\.(txt|html|hta)/
    pivot_on: host
    window: 4h
