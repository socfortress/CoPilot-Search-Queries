name: Windows Modify Registry WUStatusServer
id: windows-modify-registry-wustatusserver-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects modification of WUStatusServer registry value under Windows Update 
  policy. Adversaries modify this to redirect update status reporting to 
  attacker-controlled servers. Used by RedLine Stealer.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\WindowsUpdate\\WUStatusServer"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
  CUSTOMER_CODE:
    type: string
    required: true
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 13 monitoring WindowsUpdate policy paths.

known_false_positives: >
  WSUS environments commonly set this via Group Policy.

references:
  - https://learn.microsoft.com/de-de/security-updates/windowsupdateservices/18127499

response:
  message: >
    WUStatusServer modified on $agent_name$. Value: $data_win_eventdata_details$. 
    Process: $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25

tags:
  analytic_story:
    - RedLine Stealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - windows_update
    - wsus_status_redirect
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*WindowsUpdate.*WUStatusServer/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-registry-wuserver-001
    name: Windows Modify Registry WuServer
    reason: WUStatusServer is set together with WUServer; a new WUServer on the same host confirms the full update-server redirect rather than a lone value.
  - id: windows-modify-registry-usewuserver-001
    name: Windows Modify Registry UseWUServer
    reason: UseWUServer=1 is what activates the redirect; seeing it with WUStatusServer shows the policy was made effective.
  - id: windows-modify-registry-updateserviceurlalternate-001
    name: Windows Modify Registry UpdateServiceUrlAlternate
    reason: Sibling WindowsUpdate policy value that adds a fallback attacker-controlled update endpoint.
  - id: windows-modify-registry-donotconnect-wsus-001
    name: Windows Modify Registry DoNotConnectToWindowsUpdateInternetLocations
    reason: Forces the client to use only the rogue intranet update server, the next step after the redirect.
  - id: windows-modify-registry-no-auto-update-001
    name: Windows Modify Registry No Auto Update
    reason: Disabling automatic updates alongside the redirect suggests intent to block patching.
  - id: windows-modify-registry-proxyserver-001
    name: Windows Modify Registry ProxyServer
    reason: Proxy changes are a common co-occurring way to route a host's traffic to attacker infrastructure.
  - id: Windows_Autoruns_Run_Key_Value_Set_By_Suspicious Process
    name: Windows Autoruns Run Key Value Set By Suspicious Process
    reason: Stealers like RedLine that tamper with update policy typically also persist through Run keys from the same process.
  - id: windows-modify-registry-regedit-silent-import-001
    name: Windows Modify Registry Regedit Silent Reg Import
    reason: Policy values are often written by a silent .reg import; this identifies the delivery mechanism.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Update policy registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Pp]olicies.[Mm]icrosoft.[Ww]indows[Uu]pdate.*/
    pivot_on: host
    window: 24h
  - name: Writer process of registry change - reg.exe / script hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ww]u[Ss]erver|[Ww]u[Ss]tatus[Ss]erver|[Ww]indows[Uu]pdate).*/
    pivot_on: host
    window: 6h
  - name: Update service stop or reconfiguration
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]c(\.exe)? +(config|stop)|[Nn]et +stop|[Ss]top-[Ss]ervice).*[Ww]uauserv.*/
    pivot_on: host
    window: 6h
  - name: DNS lookups to non-Microsoft update-like hosts
    query: data_win_system_eventID:22 AND data_win_eventdata_queryName:*update* AND NOT data_win_eventdata_queryName:(*microsoft.com OR *windowsupdate.com OR *delivery.mp.microsoft.com)
    pivot_on: host
    window: 4h
  - name: Browser credential and wallet file access by stealer
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*Login\ Data* OR *Local\ State* OR *wallet.dat* OR *Cookies*)
    pivot_on: host
    window: 6h
