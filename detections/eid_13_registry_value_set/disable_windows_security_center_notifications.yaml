name: Disable Windows Security Center Notifications
id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect set UseActionCenterExperience to 0 to disable the Windows security
  center notification. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Windows\\\\CurrentVersion\\\\ImmersiveShell\\\\UseActionCenterExperience"
              case_insensitive: true
        - term:
            data_win_eventdata_details:
              value: "DWORD (0x00000000)"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Windows\CurrentVersion\ImmersiveShell\UseActionCenterExperience';
  data_win_eventdata_details equals 'DWORD (0x00000000)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1112/T1112.md
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Disable Windows Security Center Notifications detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - disable
    - security
    - center
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ii][Mm][Mm][Ee][Rr][Ss][Ii][Vv][Ee][Ss][Hh][Ee][Ll][Ll]\\[Uu][Ss][Ee][Aa][Cc][Tt][Ii][Oo][Nn][Cc][Ee][Nn][Tt][Ee][Rr][Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]/ AND data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: Sibling registry technique hiding Security Center alerts after protection is weakened.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Suppressing notifications is done so the user does not see Defender being turned down.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Quiet disablement of Defender features is paired with hiding notifications.
  - id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
    name: Disable Windows Firewall by Registry
    reason: Firewall disabled silently; notifications suppressed to avoid user warnings.
  - id: c5f6a85d-b647-40f7-bbad-c10b66bab038
    name: UAC Notification Disabled
    reason: 'Same intent: silencing user-facing security prompts before running payloads.'
  - id: 48437c39-9e5f-47fb-af95-3d663c3f2919
    name: UAC Disabled
    reason: UAC off alongside quieted notifications removes elevation prompts.
  - id: e2482f8d-3443-4237-b906-cc145d87a076
    name: Disable Internal Tools or Feature in Registry
    reason: Generic disabling of OS tools by the same script.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender's own event confirming protection was actually reduced.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Security Center, UAC and notification registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ss]ecurity [Cc]enter.*/ OR data_win_eventdata_targetObject:/.*[Ii]mmersive[Ss]hell.*/ OR data_win_eventdata_targetObject:/.*[Aa]ction[Cc]enter.*/ OR data_win_eventdata_targetObject:/.*[Ee]nable[Ll]ua.*/ OR data_win_eventdata_targetObject:/.*[Aa]ntivirus[Dd]isable[Nn]otify.*/ OR data_win_eventdata_targetObject:/.*[Ff]irewall[Dd]isable[Nn]otify.*/ OR data_win_eventdata_targetObject:/.*[Uu]pdates[Dd]isable[Nn]otify.*/)
    pivot_on:
    - host
    window: 4h
  - name: Defender tampering commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Tt]amper[Pp]rotection.*/ OR data_win_eventdata_commandLine:/.*[Mm]p[Cc]md[Rr]un.*/ OR data_win_eventdata_commandLine:/.*[Ww]indows [Dd]efender.*[Dd]isable.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other Defender registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*/
    pivot_on:
    - host
    window: 4h
  - name: Persistence registry writes on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion.[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Cc]ontrol[Ss]et.*[Ss]ervices.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon.[Ss]hell.*/ OR data_win_eventdata_targetObject:/.*[Ii]mage [Ff]ile [Ee]xecution.*/)
    pivot_on:
    - host
    window: 6h
  - name: Download cradles or encoded PowerShell near the change
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload[Ss]tring.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload[Ff]ile.*/ OR data_win_eventdata_commandLine:/.*[Ee]ncoded[Cc]ommand.*/ OR data_win_eventdata_commandLine:/.*[Cc]ertutil.*[Uu]rlcache.*/ OR data_win_eventdata_commandLine:/.*[Bb]itsadmin.*[Tt]ransfer.*/)
    pivot_on:
    - host
    window: 2h
