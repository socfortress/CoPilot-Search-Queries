name: NET NGenAssemblyUsageLog Registry Key Tamper
id: 28036918-04d3-423d-91c0-55ecf99fb892
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 28036918-04d3-423d-91c0-55ecf99fb892
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the NGenAssemblyUsageLog registry key. .NET Usage Log
  output location can be controlled by setting the NGenAssemblyUsageLog CLR
  configuration knob in the Registry or by configuring an environment variable
  (as described in the next section). By simplify specifying an arbitrary value
  (e.g. fake output location or junk data) for the expected value, a Usage Log
  file for the .NET execution context will not be created. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*SOFTWARE\\\\Microsoft\\\\.NETFramework\\\\NGenAssemblyUsageLog"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*SOFTWARE\Microsoft\.NETFramework\NGenAssemblyUsageLog'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://bohops.com/2021/03/16/investigating-net-clr-usage-log-tampering-techniques-for-edr-evasion/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    NET NGenAssemblyUsageLog Registry Key Tamper detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - ngenassemblyusagelog
    - registry
    - tamper
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\\.[Nn][Ee][Tt][Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\[Nn][Gg][Ee][Nn][Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy][Uu][Ss][Aa][Gg][Ee][Ll][Oo][Gg]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ad89044a-8f49-4673-9a55-cbd88a1b374f
    name: Enabling COR Profiler Environment Variables
    reason: 'Another CLR config abuse by the same tradecraft: COR_PROFILER hijack for persistence or injection.'
  - id: 41421f44-58f9-455d-838a-c398859841d4
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    reason: Disabling .NET telemetry is the same evasion goal as suppressing the usage log.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Managed tradecraft that usually runs right after .NET logging is blinded.
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: Companion telemetry-blinding step before running in-memory .NET payloads.
  - id: e0b06658-7d1d-4cd3-bf15-03467507ff7c
    name: Suspicious DotNET CLR Usage Log Artifact
    reason: 'Counterpart: usage log files written when the key was not tampered, from suspicious process names.'
  - id: 7dbbcac2-57a0-45ac-b306-ff30a8bd2981
    name: Windows AMSI Related Registry Tampering Via CommandLine
    reason: Related registry-based defence evasion preceding in-memory .NET execution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other .NET CLR and profiler configuration changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\\.[Nn][Ee][Tt][Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\.*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Rr]_[Ee][Nn][Aa][Bb][Ll][Ee]_[Pp][Rr][Oo][Ff][Ii][Ll][Ii][Nn][Gg].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Mm][Pp][Ll][Uu][Ss]_.*/)
    pivot_on: host
    window: 4h
  - name: Command lines setting NGenAssemblyUsageLog or CLR knobs
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Gg][Ee][Nn][Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy][Uu][Ss][Aa][Gg][Ee][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Ll][Uu][Ss]_.*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Rr]_[Ee][Nn][Aa][Bb][Ll][Ee]_[Pp][Rr][Oo][Ff][Ii][Ll][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ee][Tt][Ww][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/)
    pivot_on: host
    window: 2h
  - name: In-memory .NET execution tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Vv][Ee][Pp][Ee][Ii][Nn][Jj][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc][Uu][Tt][Ee]-[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Tt][Yy][Pp][Ee].*/)
    pivot_on: host
    window: 4h
  - name: AMSI and ETW tampering
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Ss][Cc][Aa][Nn][Bb][Uu][Ff][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Tt][Ww][Ee][Vv][Ee][Nn][Tt][Ww][Rr][Ii][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Tt][Rr][Aa][Cc][Ee][Ee][Vv][Ee][Nn][Tt].*/)) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Aa][Mm][Ss][Ii]\\[Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss].*/ OR data_win_eventdata_targetObject:/.*[Aa][Mm][Ss][Ii][Ee][Nn][Aa][Bb][Ll][Ee].*/))
    pivot_on: host
    window: 4h
  - name: MSBuild, InstallUtil, RegAsm or csc spawned by scripting parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|[Cc][Ss][Cc]\.[Ee][Xx][Ee]|[Jj][Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 4h
