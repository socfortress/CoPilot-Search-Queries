name: Potential Persistence Via Excel Add-in - Registry
id: 961e33d1-4f86-4fcf-80ab-930a708b2f82
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 961e33d1-4f86-4fcf-80ab-930a708b2f82
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect potential persistence via the creation of an excel add-in (XLL) file to
  make it run automatically when Excel is started. MITRE ATT&CK: T1137.006.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Software\\\\Microsoft\\\\Office\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Excel\\\\Options"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "/R *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*.xll"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Software\Microsoft\Office\*'; data_win_eventdata_targetObject matches
  '*\Excel\Options'; data_win_eventdata_details matches '/R *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/4ae9580a1a8772db87a1b6cdb0d03e5af231e966/atomics/T1137.006/T1137.006.md
  - https://labs.withsecure.com/publications/add-in-opportunities-for-office-persistence
  - https://attack.mitre.org/techniques/T1137/006/

response:
  message: >
    Potential Persistence Via Excel Add-in - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1137.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137.006
  custom_tags:
    - persistence
    - excel
    - registry
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ee][Xx][Cc][Ee][Ll]\\[Oo][Pp][Tt][Ii][Oo][Nn][Ss]/ AND data_win_eventdata_details:/\/[Rr] .*/ AND data_win_eventdata_details:/.*\.[Xx][Ll][Ll]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
    name: Potential Persistence Via Microsoft Office Add-In
    reason: 'Precursor: the XLL/add-in file is usually written to disk just before the OPEN registry value is set.'
  - id: af4c4609-5755-42fe-8075-4effb49f5d44
    name: Microsoft Excel Add-In Loaded From Uncommon Location
    reason: 'Follow-on: next Excel start loads the registered XLL, confirming the persistence fired.'
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: Alternate Office persistence the same actor may plant for redundancy.
  - id: baecf8fb-edbf-429f-9ade-31fc3f22b970
    name: Office Autorun Keys Modification
    reason: Other Office autorun registry hooks set alongside the Excel Options value.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Once the XLL executes inside Excel it often spawns shells/LOLBins.
  - id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    name: File With Uncommon Extension Created By An Office Application
    reason: XLL dropped or unpacked by an Office/archive delivery chain.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: XLL or add-in file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*.xll OR *.xlam OR *.xla OR *.wll)
    pivot_on: host
    window: 4h
  - name: Excel loading unusual add-in modules
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Ee][Xx][Cc][Ee][Ll]\.exe/ AND data_win_eventdata_imageLoaded:(*.xll OR *.wll)
    pivot_on: host
    window: 24h
  - name: Excel spawning child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ee][Xx][Cc][Ee][Ll]\.exe/ AND data_win_eventdata_image:/.*([Cc]md|[Pp]ower[Ss]hell|[Pp]wsh|[Mm]shta|[Rr]undll32|[Rr]egsvr32|[Ww]script|[Cc]script)\.exe/
    pivot_on: host
    window: 24h
  - name: Other Office persistence registry values
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(*Office*Addins* OR *Office*Options* OR *Office*Test*Special*)
    pivot_on: host
    window: 6h
