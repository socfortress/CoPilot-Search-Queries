                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_image:
                                      value: "C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\integrator.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Explorer\\\\Browser Helper Objects\\\\{31D09BA0-12F5-4CCE-BE8A-2923E76605DA}\\\\*"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_details:
