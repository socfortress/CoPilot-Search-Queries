                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Office\\\\ClickToRun\\\\REGISTRY\\\\MACHINE\\\\Software\\\\Wow6432Node\\\\*"
                                case_insensitive: true
                    - bool:
