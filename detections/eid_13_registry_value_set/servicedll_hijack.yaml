name: ServiceDll Hijack
id: 612e47e9-8a59-43a6-b404-f48683f45bd6
version: 1
schema_version: "1.0"
date: "2024-04-03"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 612e47e9-8a59-43a6-b404-f48683f45bd6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the "ServiceDLL" value related to a service in the
  registry. This is often used as a method of persistence. MITRE ATT&CK:
  T1543.003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\System\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*ControlSet*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Parameters\\\\ServiceDll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details:
                          value: "C:\\Windows\\system32\\spool\\drivers\\x64\\3\\PrintConfig.dll"
                          case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\system32\\lsass.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Services\\\\NTDS\\\\Parameters\\\\ServiceDll"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "%%systemroot%%\\system32\\ntdsa.dll"
                                case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\poqexec.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\regsvr32.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_details:
                          value: "C:\\Windows\\System32\\STAgent.dll"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\System\*'; data_win_eventdata_targetObject matches '*ControlSet*';
  data_win_eventdata_targetObject matches '*\Services\*', among other
  conditions.

known_false_positives: >
  Administrative scripts. Installation of a service. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md#atomic-test-4---tinyturla-backdoor-service-w64time
  - https://www.hexacorn.com/blog/2013/09/19/beyond-good-ol-run-key-part-4/
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    ServiceDll Hijack detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1543.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - servicedll
    - hijack
    - registry
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\.*/ AND data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt].*/ AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_details AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND NOT (data_win_eventdata_details:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Xx]64\\3\\[Pp][Rr][Ii][Nn][Tt][Cc][Oo][Nn][Ff][Ii][Gg]\.[Dd][Ll][Ll]/ OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Nn][Tt][Dd][Ss]\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll]/ AND data_win_eventdata_details:/%%[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt]%%\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Nn][Tt][Dd][Ss][Aa]\.[Dd][Ll][Ll]/) OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Pp][Oo][Qq][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_details:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Tt][Aa][Gg][Ee][Nn][Tt]\.[Dd][Ll][Ll]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1d7a57da-02e0-4f7f-92b1-c7b486ccfed5
    name: Potential COLDSTEEL Persistence Service DLL Load
    reason: Service DLL load that follows a ServiceDll swap (COLDSTEEL persistence).
  - id: 1fea93a2-1524-4a3c-9828-3aa0c2414e27
    name: Potential COLDSTEEL Persistence Service DLL Creation
    reason: Malicious service DLL file created just before ServiceDll is repointed.
  - id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
    name: COLDSTEEL RAT Service Persistence Execution
    reason: COLDSTEEL service persistence execution, the follow-on of ServiceDll registration.
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: Suspicious service installed in registry; co-occurs when the hijacked service is newly created.
  - id: a07f0359-4c90-4dc4-a681-8ffea40b4f47
    name: Service Binary in Suspicious Folder
    reason: 'Sibling service persistence: ImagePath/Start in suspicious folder.'
  - id: 828af599-4c53-4ed2-ba4a-a9f835c434ea
    name: Fax Service DLL Search Order Hijack
    reason: DLL search-order hijack of a service DLL; alternative path to the same outcome.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Payload loaded from a temp directory after registration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL files created outside System32
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.dll/ AND NOT data_win_eventdata_targetFilename:(/.*\\[Ww]indows\\[Ss]ystem32\\.*/ OR /.*\\[Ww]indows\\[Ww]in[Ss]x[Ss]\\.*/)
    pivot_on: host
    window: 2h
  - name: svchost loading non-system DLLs
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*svchost\.exe/ AND NOT data_win_eventdata_imageLoaded:(/.*\\[Ww]indows\\.*/ OR /.*\\[Pp]rogram [Ff]iles.*/)
    pivot_on: host
    window: 4h
  - name: Service control and ServiceDll tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]ervice[Dd]ll.*/ OR /.*sc(\.exe)? +(config|create|start).*/ OR /.*[Nn]et +start.*/)
    pivot_on: host
    window: 2h
  - name: Other Services key value writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\Services\\.*/
    pivot_on: host
    window: 6h
  - name: Network connections from svchost
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*svchost\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 4h
