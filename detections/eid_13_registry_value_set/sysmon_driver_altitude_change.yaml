name: Sysmon Driver Altitude Change
id: 4916a35e-bfc4-47d0-8e25-a003d7067061
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: B.Talebi
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4916a35e-bfc4-47d0-8e25-a003d7067061
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes in Sysmon driver altitude value. If the Sysmon driver is
  configured to load at an altitude of another registered service, it will fail
  to load at boot. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Instances\\\\Sysmon Instance\\\\Altitude"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\*'; data_win_eventdata_targetObject matches '*\Instances\Sysmon
  Instance\Altitude'.

known_false_positives: >
  Legitimate driver altitude change to hide sysmon. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://posts.specterops.io/shhmon-silencing-sysmon-via-driver-unload-682b5be57650
  - https://youtu.be/zSihR3lTf7g
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Sysmon Driver Altitude Change detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - sysmon
    - driver
    - altitude
    - registry
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn] [Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee]\\[Aa][Ll][Tt][Ii][Tt][Uu][Dd][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Direct Sysmon driver unload via fltmc, the other half of Sysmon-blinding
  - id: 37db85d1-b089-490a-a59a-c7b6f984f480
    name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
    reason: Reconnaissance of the default Sysmon altitude 385201 before changing it
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Sysmon config replaced to blind logging
  - id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
    name: Uninstall Sysinternals Sysmon
    reason: Outright Sysmon uninstall, alternative defense evasion
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon tampering commands (fltmc, sysmon, altitude lookups)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ff][Ll][Tt][Mm][Cc]|[Ss][Yy][Ss][Mm][Oo][Nn]|385201).*/ OR data_win_eventdata_originalFileName:/.*([Ff][Ll][Tt][Mm][Cc]|[Ss][Yy][Ss][Mm][Oo][Nn]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Event log clearing or Defender tampering
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR data_win_eventdata_commandLine:/.*([Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll]|[Cc]lear-[Ee]vent[Ll]og|[Ss]et-[Mm]p[Pp]reference).*/)
    pivot_on:
    - host
    window: 4h
  - name: Sysmon config or state change events
    query: (data_win_system_eventID:"16" OR data_win_system_eventID:"4")
    pivot_on:
    - host
    window: 4h
  - name: Service and driver registry modifications
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]ontrol[Ss]et.*\\[Ss]ervices\\.*/
    pivot_on:
    - host
    window: 4h
