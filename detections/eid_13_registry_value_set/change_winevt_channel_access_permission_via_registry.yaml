name: Change Winevt Channel Access Permission Via Registry
id: 7d9263bd-dc47-4a58-bc92-5474abab390c
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7d9263bd-dc47-4a58-bc92-5474abab390c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects tampering with the "ChannelAccess" registry key in order to change
  access to Windows event channel. MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\ChannelAccess"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_details:
                    value: "*(A;;0x1;;;LA)*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*(A;;0x1;;;SY)*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_details:
                    value: "*(A;;0x5;;;BA)*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\servicing\\TrustedInstaller.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Windows\\\\WinSxS\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\TiWorker.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\CurrentVersion\WINEVT\Channels\*';
  data_win_eventdata_targetObject matches '*\ChannelAccess';
  data_win_eventdata_details matches '*(A;;0x1;;;LA)*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://app.any.run/tasks/77b2e328-8f36-46b2-b2e2-8a80398217ab/
  - https://learn.microsoft.com/en-us/windows/win32/api/winevt/
  - https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Change Winevt Channel Access Permission Via Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - change
    - winevt
    - channel
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ee][Vv][Tt]\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Cc][Hh][Aa][Nn][Nn][Ee][Ll][Aa][Cc][Cc][Ee][Ss][Ss]/ AND (data_win_eventdata_details:/.*\([Aa];;0[Xx]1;;;[Ll][Aa]\).*/ OR data_win_eventdata_details:/.*\([Aa];;0[Xx]1;;;[Ss][Yy]\).*/ OR data_win_eventdata_details:/.*\([Aa];;0[Xx]5;;;[Bb][Aa]\).*/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ii][Nn][Gg]\\[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Tt][Ii][Ww][Oo][Rr][Kk][Ee][Rr]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: 'Disabling event logging via registry is the sibling defense-evasion move: blind the channel instead of locking readers out.'
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Eventlog clearing/config change commands usually accompany ChannelAccess tampering to erase evidence.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: 'wevtutil clearing logs: follow-on removing already-recorded events after access is restricted.'
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: 'wevtutil used to disable logs: command-line variant of the same evasion.'
  - id: 919f2ef0-be2d-4a7a-b635-eb2b41fde044
    name: Disable Security Events Logging Adding Reg Key MiniNt
    reason: 'MiniNt key disables Security event logging: another registry-based log suppression often chained.'
  - id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
    name: Disabled Windows Defender Eventlog
    reason: Disabled Defender Eventlog pairs with channel permission changes to hide AV detections of the intrusion.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Auditpol tampering removes audit categories; same intent of reducing telemetry before noisy actions.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wevtutil log clear or config changes
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]evtutil\.exe/ AND data_win_eventdata_commandLine:/.*(cl|clear-log|sl|set-log|\/e:false).*/
    pivot_on: host
    window: 6h
  - name: Winevt channel registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*WINEVT\\(Channels|Publishers)\\.*/
    pivot_on: host
    window: 24h
  - name: Audit policy and eventlog service tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Aa]uditpol|[Ee]vent[Ll]og).*(stop|disable|clear|remove|config).*/
    pivot_on: host
    window: 6h
  - name: Log-clear events
    query: data_win_system_eventID:(1102 OR 104)
    pivot_on: host
    window: 24h
  - name: Registry edits by reg.exe or PowerShell
    query: data_win_system_eventID:13 AND data_win_eventdata_image:/.*([Rr]eg|[Pp]ower[Ss]hell|[Pp]wsh)\.exe/
    pivot_on: host
    window: 4h
