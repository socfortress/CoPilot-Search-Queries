name: Potential Persistence Via Shim Database Modification
id: dfb5b4e8-91d0-4291-b40a-e3b0d3942c45
version: 1
schema_version: "1.0"
date: "2025-10-22"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dfb5b4e8-91d0-4291-b40a-e3b0d3942c45
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may establish persistence and/or elevate privileges by executing
  malicious content triggered by application shims. The Microsoft Windows
  Application Compatibility Infrastructure/Framework (Application Shim) was
  created to allow for backward compatibility of software as the operating
  system codebase changes over time. MITRE ATT&CK: T1546.011.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\AppCompatFlags\\\\InstalledSDB\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\AppCompatFlags\\\\Custom\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_details: ""
                    - term:
                        data_win_eventdata_details:
                          value: "(Empty)"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_details"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows
  NT\CurrentVersion\AppCompatFlags\InstalledSDB\*';
  data_win_eventdata_targetObject matches '*\SOFTWARE\Microsoft\Windows
  NT\CurrentVersion\AppCompatFlags\Custom\*'; data_win_eventdata_details equals
  '', among other conditions.

known_false_positives: >
  Legitimate custom SHIM installations will also trigger this rule. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.011/T1546.011.md#atomic-test-3---registry-key-creation-andor-modification-events-for-sdb
  - https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html
  - https://andreafortuna.org/2018/11/12/process-injection-and-persistence-using-application-shimming/
  - https://attack.mitre.org/techniques/T1546/011/

response:
  message: >
    Potential Persistence Via Shim Database Modification detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1546.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.011
  custom_tags:
    - persistence
    - database
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Dd][Ss][Dd][Bb]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss]\\[Cc][Uu][Ss][Tt][Oo][Mm]\\.*/) AND NOT (data_win_eventdata_details:"" OR data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/ OR NOT _exists_:data_win_eventdata_details)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6b6976a3-b0e6-4723-ac24-ae38a737af41
    name: Potential Persistence Via Shim Database In Uncommon Location
    reason: 'Escalation: same InstalledSDB write with the database in a non-default path.'
  - id: 517490a7-115a-48c6-8862-1a481504d5a8
    name: Potential Shim Database Persistence via Sdbinst.EXE
    reason: sdbinst.exe execution that creates these keys.
  - id: 18ee686c-38a3-4f65-9f44-48a077141f42
    name: Uncommon Extension Shim Database Installation Via Sdbinst.EXE
    reason: Installation of an SDB with unusual extension, a strong precursor.
  - id: ee63c85c-6d51-4d12-ad09-04e25877a947
    name: New Custom Shim Database Created
    reason: Drop of the custom .sdb before registration.
  - id: bf344fea-d947-4ef4-9192-34d008315d3a
    name: Suspicious Shim Database Patching Activity
    reason: Shows the shim's patching payload behaviour.
  - id: b0524451-19af-4efa-a46f-562a977f792e
    name: ShimCache Flush
    reason: Evasion/cleanup around shim activity.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sdbinst execution
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: sdb file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Ss][Dd][Bb]/
    pivot_on: host
    window: 6h
  - name: InstalledSDB and Custom shim keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(InstalledSDB|AppCompatFlags\\Custom).*/
    pivot_on: host
    window: 24h
  - name: Remote thread creation (injection by shim)
    query: data_win_system_eventID:8
    pivot_on: host
    window: 6h
