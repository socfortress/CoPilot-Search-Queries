name: Windows Modify Registry Disable Toast Notifications
id: windows-modify-registry-disable-toast-notifications-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects modification of ToastEnabled registry value to 0, disabling Windows 
  toast notifications. Adversaries disable notifications to prevent users from 
  receiving critical system alerts and security warnings, enabling stealthier 
  operations. Used by Azorult malware for defense evasion.

data_source:
  - Sysmon EventID 13

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        - wildcard:
            data_win_eventdata_targetObject: "*\\PushNotifications\\ToastEnabled"
        - term:
            data_win_eventdata_details: "DWORD (0x00000000)"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-27 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 13 (Registry Value Set) configured to monitor 
  the PushNotifications registry path. Add PushNotifications to Sysmon 
  EventID 13 TargetObject rules. Note: HKCU paths appear as 
  HKU\<SID>\SOFTWARE\ in Sysmon logs.

known_false_positives: >
  Administrators may disable toast notifications via Group Policy or 
  user preference. Investigate process and user context.

references:
  - https://app.any.run/tasks/a6f2ffe2-e6e2-4396-ae2e-04ea0143f2d8/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Toast notifications disabled on $agent_name$. 
    Registry: $data_win_eventdata_targetObject$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1112
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Azorult
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - toast_notifications
    - registry_modification
    - defense_evasion
    - user_notification_disable
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*PushNotifications.*ToastEnabled/ AND data_win_eventdata_details:"DWORD (0x00000000)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1cd983c8-8fd6-11ec-a09d-acde48001122
    name: Windows Disable Notification Center
    reason: Sibling suppression of user-visible notifications
  - id: cafa4bce-9f06-11ec-a7b2-acde48001122
    name: Windows Hide Notification Features Through Registry
    reason: 'Same intent: hide system notifications from the user'
  - id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
    name: Disable Windows Security Center Notifications
    reason: Suppresses security warnings so tampering goes unseen
  - id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
    name: Activate Suppression of Windows Security Center Notifications
    reason: Same security warning suppression
  - id: windows-modify-registry-disable-windefender-notifications-001
    name: Windows Modify Registry Disable WinDefender Notifications
    reason: Defender alerts hidden before malware runs
  - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
    name: Windows Defender Service Disabled - Registry
    reason: Defender disabling made quiet by hidden toasts
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Exclusions are added so payloads run unnoticed
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender tamper via command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*Set-MpPreference.*/ OR data_win_eventdata_commandLine:/.*Add-MpPreference.*/ OR data_win_eventdata_commandLine:/.*DisableRealtimeMonitoring.*/)
    pivot_on: host
    window: 4h
  - name: Notification and Defender policy registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*Notifications.*/ OR data_win_eventdata_targetObject:/.*Windows Defender.*/ OR data_win_eventdata_targetObject:/.*Security Center.*/)
    pivot_on: host
    window: 24h
  - name: Process creation from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Dd]ownloads).*\.exe/
    pivot_on: host
    window: 2h
  - name: Run-key and scheduled-task persistence
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*CurrentVersion.*Run.*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss]chtasks.*[Cc]reate.*/)
    pivot_on: host
    window: 4h
  - name: Browser credential store access
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*Login Data.*/ OR data_win_eventdata_targetFilename:/.*[Ww]eb Data.*/ OR data_win_eventdata_targetFilename:/.*wallet\.dat.*/)
    pivot_on: host
    window: 6h
