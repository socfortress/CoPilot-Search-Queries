name: Add Debugger Entry To AeDebug For Persistence
id: 092af964-4233-4373-b4ba-d86ea2890288
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 092af964-4233-4373-b4ba-d86ea2890288
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker adds a new "Debugger" value to the "AeDebug" key in
  order to achieve persistence which will get invoked when an application
  crashes.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\AeDebug\\\\Debugger*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_details:
              value: "*.dll"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "\"C:\\WINDOWS\\system32\\vsjitdebugger.exe\" -p %ld -e %ld -j 0x%p"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AeDebug\Debugger*';
  data_win_eventdata_details matches '*.dll'; data_win_eventdata_details equals
  '"C:\WINDOWS\system32\vsjitdebugger.exe" -p %ld -e %ld -j 0x%p'.

known_false_positives: >
  Legitimate use of the key to setup a debugger. Which is often the case on
  developers machines. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://persistence-info.github.io/Data/aedebug.html
  - https://learn.microsoft.com/en-us/windows/win32/debug/configuring-automatic-debugging

response:
  message: >
    Add Debugger Entry To AeDebug For Persistence detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - debugger
    - entry
    - aedebug
    - registry
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Ee][Dd][Ee][Bb][Uu][Gg]\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr].*/ AND data_win_eventdata_details:/.*\.[Dd][Ll][Ll]/ AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/\"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Vv][Ss][Jj][Ii][Tt][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]\.[Ee][Xx][Ee]\" -[Pp] %[Ll][Dd] -[Ee] %[Ll][Dd] -[Jj] 0[Xx]%[Pp]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9827ae57-3802-418f-994b-d5ecf5cd974b
    name: Potential Registry Persistence Attempt Via DbgManagedDebugger
    reason: Sibling crash-debugger hijack for .NET (DbgManagedDebugger); attackers often plant both native and managed handlers together.
  - id: 36803969-5421-41ec-b92f-8500f79c23b0
    name: Potential Persistence Via GlobalFlags
    reason: IFEO/SilentProcessExit GlobalFlags is the other crash- or exit-triggered execution hook used for stealthy persistence.
  - id: 0cf2e1c6-8d10-4273-8059-738778f981ad
    name: Potential WerFault ReflectDebugger Registry Value Abuse
    reason: WER-based execution hook; same family of tricks running a payload from crash-handling paths.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Persistence rarely stands alone; classic Run-key persistence is the usual redundant mechanism.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Redundant persistence pointing into Temp/AppData where the debugger DLL likely lives.
  - id: df4dc653-1029-47ba-8231-3c44238cc0ae
    name: Potential Persistence Using DebugPath
    reason: Another debug-path based hook that hijacks a crash/debug flow.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other crash-debugger and IFEO hijack keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(AeDebug|DbgManagedDebugger|Image File Execution Options|SilentProcessExit|Windows Error Reporting\\Hangs|ReflectDebugger).*/
    pivot_on: host
    window: 24h
  - name: DLL files created in user-writable locations
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on: host
    window: 4h
  - name: Command line editing AeDebug
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa]e[Dd]ebug.*/
    pivot_on: host
    window: 4h
  - name: Loader binaries running DLLs from user paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]).*/
    pivot_on: host
    window: 4h
  - name: Autorun and service persistence set nearby
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\CurrentVersion\\([Rr]un|[Rr]unOnce)\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ss]ervices\\.*\\[Ii]mage[Pp]ath.*/ OR data_win_eventdata_targetObject:/.*\\[Ww]inlogon\\([Ss]hell|[Uu]serinit).*/)
    pivot_on: host
    window: 24h
