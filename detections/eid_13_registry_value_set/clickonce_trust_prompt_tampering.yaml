name: ClickOnce Trust Prompt Tampering
id: ac9159cc-c364-4304-8f0a-d63fc1a0aabb
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: "@SerkinValery, Nasreddine Bencherchali (Nextron Systems)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ac9159cc-c364-4304-8f0a-d63fc1a0aabb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the ClickOnce trust prompt registry key in order to enable
  an installation from different locations such as the Internet. MITRE ATT&CK:
  T1112.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\MICROSOFT\\\\.NETFramework\\\\Security\\\\TrustManager\\\\PromptingLevel\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Internet"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\LocalIntranet"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\MyComputer"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\TrustedSites"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\UntrustedSites"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_details:
              value: "Enabled"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\*';
  data_win_eventdata_targetObject matches '*\Internet';
  data_win_eventdata_targetObject matches '*\LocalIntranet', among other
  conditions.

known_false_positives: >
  Legitimate internal requirements. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5
  - https://learn.microsoft.com/en-us/visualstudio/deployment/how-to-configure-the-clickonce-trust-prompt-behavior
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    ClickOnce Trust Prompt Tampering detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - clickonce
    - trust
    - prompt
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\\.[Nn][Ee][Tt][Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Tt][Rr][Uu][Ss][Tt][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Pp][Rr][Oo][Mm][Pp][Tt][Ii][Nn][Gg][Ll][Ee][Vv][Ee][Ll]\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt]/ OR data_win_eventdata_targetObject:/.*\\[Ll][Oo][Cc][Aa][Ll][Ii][Nn][Tt][Rr][Aa][Nn][Ee][Tt]/ OR data_win_eventdata_targetObject:/.*\\[Mm][Yy][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr]/ OR data_win_eventdata_targetObject:/.*\\[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ss][Ii][Tt][Ee][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Uu][Nn][Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ss][Ii][Tt][Ee][Ss]/) AND data_win_eventdata_details:/[Ee][Nn][Aa][Bb][Ll][Ee][Dd]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 67bc0e75-c0a9-4cfc-8754-84a505b63c04
    name: Potentially Suspicious Child Process Of ClickOnce Application
    reason: 'Suspicious child of a ClickOnce app: the execution the weakened trust prompt enables.'
  - id: 45e112d0-7759-4c2a-aa36-9f8fb79d3393
    name: IE Change Domain Zone
    reason: 'IE zone changes: related trust-boundary downgrade making web-delivered content run unprompted.'
  - id: 295a59c1-7b79-4b47-a930-df12c15fc9c2
    name: Windows Registry Trust Record Modification
    reason: 'Registry trust record modification: trust-prompt suppression often paired with this.'
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: 'Registry tampering by suspicious processes: identifies the process that weakened the prompt.'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ClickOnce deployment execution
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Dd]fsvc|\.application|[Dd]fshim).*/
    pivot_on: host
    window: 4h
  - name: ClickOnce manifest files downloaded
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(application|appref-ms|manifest)/
    pivot_on: host
    window: 4h
  - name: Trust and security zone registry downgrades
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(TrustManager|Security\\Zones|ZoneMap|Attachments).*/
    pivot_on: host
    window: 24h
  - name: Browser or mail client spawning processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(chrome|msedge|firefox|iexplore|outlook)\.exe/
    pivot_on: host
    window: 2h
