name: Potential WerFault ReflectDebugger Registry Value Abuse
id: 0cf2e1c6-8d10-4273-8059-738778f981ad
version: 1
schema_version: "1.0"
date: "2023-05-18"
author: X__Junior
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0cf2e1c6-8d10-4273-8059-738778f981ad
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential WerFault "ReflectDebugger" registry value abuse for
  persistence. MITRE ATT&CK: T1036.003.

data_source:
  - Sysmon EventID 13 - Registry Value Set

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "13"
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Windows\\\\Windows Error Reporting\\\\Hangs\\\\ReflectDebugger"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows\Windows Error Reporting\Hangs\ReflectDebugger'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://cocomelonc.github.io/malware/2022/11/02/malware-pers-18.html
  - https://www.hexacorn.com/blog/2018/08/31/beyond-good-ol-run-key-part-85/
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Potential WerFault ReflectDebugger Registry Value Abuse detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
  custom_tags:
    - werfault
    - reflectdebugger
    - registry
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Hh][Aa][Nn][Gg][Ss]\\[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 833ef470-fa01-4631-a79b-6f291c9ac498
    name: Add Debugger Entry To Hangs Key For Persistence
    reason: Same Windows Error Reporting Hangs key; a debugger value there is the sibling persistence path
  - id: fabfb3a7-3ce1-4445-9c7c-3c27f1051cdd
    name: Potential ReflectDebugger Content Execution Via WerFault.EXE
    reason: 'The payoff: WerFault launched with -pr/ReflectDebugger executes the content planted in the registry value'
  - id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
    name: Creation of WerFault.exe/Wer.dll in Unusual Folder
    reason: Attacker may have dropped a rogue WerFault.exe/Wer.dll before or alongside the registry change
  - id: 092af964-4233-4373-b4ba-d86ea2890288
    name: Add Debugger Entry To AeDebug For Persistence
    reason: AeDebug debugger hijack is the neighbouring WER/crash-handler persistence technique often tried together
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Operators typically stack ReflectDebugger with classic Run-key autoruns for redundancy
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WerFault launched with ReflectDebugger/-pr
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt].[Ee][Xx][Ee].*/ AND (data_win_eventdata_commandLine:/.*-[Pp][Rr].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr].*/)
    pivot_on: host
    window: 2h
  - name: Other WER debugger/crash-handler registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Hh][Aa][Nn][Gg][Ss].*/ OR data_win_eventdata_targetObject:/.*[Aa][Ee][Dd][Ee][Bb][Uu][Gg].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr].*/)
    pivot_on: host
    window: 24h
  - name: WerFault/wer.dll created outside system dirs
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ww][Ee][Rr].[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt].[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Child processes of WerFault
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt].[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
  - name: Autorun key modifications on host
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on: host
    window: 6h
