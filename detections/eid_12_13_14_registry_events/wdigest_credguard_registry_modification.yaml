name: Wdigest CredGuard Registry Modification
id: 1a2d6c47-75b0-45bd-b133-2c0be75349fd
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1a2d6c47-75b0-45bd-b133-2c0be75349fd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential malicious modification of the property value of
  IsCredGuardEnabled from
  HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest to disable
  Cred Guard on a system. This is usually used with UseLogonCredential to
  manipulate the caching credentials. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\IsCredGuardEnabled"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\IsCredGuardEnabled'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://teamhydra.blog/2020/08/25/bypassing-credential-guard/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Wdigest CredGuard Registry Modification detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - wdigest
    - credguard
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ii][Ss][Cc][Rr][Ee][Dd][Gg][Uu][Aa][Rr][Dd][Ee][Nn][Aa][Bb][Ll][Ee][Dd]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Companion WDigest change: IsCredGuardEnabled tampering is paired with UseLogonCredential=1 to force cleartext passwords into LSASS memory'
  - id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
    name: Windows Credential Guard Disabled - Registry
    reason: Same objective via the DeviceGuard/LSA CredentialGuard keys; a second registry write confirms deliberate Credential Guard disabling
  - id: c17d47b7-dcd6-4109-87eb-d1817bd4cbc9
    name: Windows Credential Guard Registry Tampering Via CommandLine
    reason: Process-creation view of the same tampering (reg.exe/PowerShell), identifying the parent chain that made the registry write
  - id: d645ef86-2396-48a1-a2b6-b629ca3f57ff
    name: Windows Credential Guard Related Registry Value Deleted - Registry
    reason: Deleting rather than setting Credential Guard values is an alternate way to disable it, done by the same actor
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: Attackers also strip LSASS PPL (RunAsPPL) so memory can be read once Credential Guard and WDigest protections are weakened
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: 'Likely next step: after protections are lowered, LSASS memory is dumped to harvest the now cleartext/cached credentials'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Follow-on process access to LSASS (Mimikatz, procdump style) that actually harvests credentials after the registry prep
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz sekurlsa::wdigest is the classic consumer of WDigest/CredGuard changes; co-occurrence converts the registry event into confirmed credential theft
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential Guard / WDigest / LSA protection registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ww][Dd]igest.*[Uu]se[Ll]ogon[Cc]redential.*/ OR data_win_eventdata_targetObject:/.*[Dd]evice[Gg]uard.*/ OR data_win_eventdata_targetObject:/.*[Ll]sa\\[Rr]un[Aa]s[Pp][Pp][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ll]sa\\[Ll]sa[Cc]fg[Ff]lags.*/ OR data_win_eventdata_targetObject:/.*[Ll]sa\\[Ss]ecurity [Pp]ackages.*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry-modifying process commands (reg.exe / PowerShell) touching WDigest or LSA
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*WDigest* OR data_win_eventdata_commandLine:*IsCredGuardEnabled* OR data_win_eventdata_commandLine:*UseLogonCredential* OR data_win_eventdata_commandLine:*RunAsPPL* OR data_win_eventdata_commandLine:*LsaCfgFlags*)
    pivot_on:
    - host
    window: 2h
  - name: Process access to LSASS (credential harvesting)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: LSASS dump tooling and credential dump files
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*comsvcs*MiniDump* OR data_win_eventdata_commandLine:*procdump*lsass* OR data_win_eventdata_commandLine:*lsass.dmp* OR data_win_eventdata_commandLine:*logonpasswords*)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/))
    pivot_on:
    - host
    window: 4h
  - name: Remote logons following credential theft prep
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")) OR (data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 6h
